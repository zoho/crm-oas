openapi: 3.1.0
info:
  title: Workflow Configurations
  description: >-
    Workflow configurations provide the metadata needed to create and update
    automation workflow rules in Zoho CRM, including available triggers, action
    types, and related module trigger details. This API enables developers to
    retrieve the configuration metadata for any workflow-supported module before
    building or modifying workflow automation rules.
  version: '8'
servers:
  - url: https://zohoapis.{dc}/crm/{version}
    description: Production API server for Zoho CRM.
    variables:
      dc:
        description: >-
          The top-level domain of the API server. Corresponds to the user's Zoho
          data center region.
        default: com
        enum:
          - com
          - eu
          - in
          - cn
          - au
          - ca
          - jp
      version:
        description: The API version to use for all requests. Defaults to v8.
        default: v8
paths:
  /workflow_configurations:
    get:
      summary: Workflow Configuration
      description: >-
        Retrieves the available triggers, actions, and related trigger details
        for a specific module. Use this endpoint before creating or updating
        workflow rules to discover which triggers and actions are supported,
        their per-type limits, scheduling compatibility, and related module
        triggers. The response includes three sections: triggers (events that
        fire the rule), actions (operations executed when the rule fires), and
        related_triggers_details (child/related modules like Notes or Calls that
        can also trigger rules on the parent module).
      x-zs-llm-description: >-
        Use this API to discover the workflow triggers, supported actions,
        action limits, scheduling support, and related module trigger metadata
        for a module before creating or updating workflow rules.
      operationId: getWorkflowConfigurations
      parameters:
        - $ref: '#/components/parameters/ParamQueryModule'
      responses:
        '200':
          description: >-
            Returns the workflow configuration metadata for the specified
            module, including the available trigger types, action types with
            their per-type limits and scheduling support, and related module
            trigger details.
