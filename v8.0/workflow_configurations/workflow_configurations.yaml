                  description: >-
                    Shows the workflow configuration metadata for the Leads
                    module, including available trigger types with their
                    supported actions and related module trigger details for
                    Notes.
        '400':
          description: >-
            The module query parameter is missing from the request, or the
            specified module API name is not valid. Resolution: The module query
            parameter must be included in the request with a valid
            workflow-supported module API name.
          content:
            application/json:
              schema:
                x-zs-$id: WorkflowConfigurationsError400
                oneOf:
                  - $ref: '#/components/schemas/RequiredParamMissingError'
                  - $ref: '#/components/schemas/InvalidModuleResponse'
                description: >-
                  Represents the error response for a missing or invalid module
                  query parameter.
              examples:
                RequiredParamMissingResponse:
                  summary: >-
                    REQUIRED_PARAM_MISSING error when the module parameter is
                    omitted
                  value:
                    code: REQUIRED_PARAM_MISSING
                    details:
                      param_name: module
                    message: required param not found
                    status: error
                  description: >-
                    Shows the 400 error response when the required module query
                    parameter is omitted from the request.
                InvalidModuleResponse:
                  summary: INVALID_MODULE error when the module API name is not valid
                  value:
                    code: INVALID_MODULE
                    details:
                      param_name: module
                    message: The value provided to the param is Invalid
                    status: error
                  description: >-
                    Shows the 400 error response when the module query parameter
                    value does not correspond to a valid or workflow-supported
                    CRM module.
        '403':
          description: >-
            The requesting user lacks the Manage Automation Actions privilege,
            or the workflow feature is unavailable in the current CRM edition.
            Resolution: The CRM administrator must grant the
            Crm_Implied_Manage_Workflow permission to the user's profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoPermissionError'
              examples:
                NoPermissionResponse:
                  summary: >-
                    NO_PERMISSION error when workflow management privilege is
                    absent
                  value:
                    code: NO_PERMISSION
                    details:
                      permissions:
                        - Crm_Implied_Manage_Workflow
                    message: feature not available in this edition
                    status: error
                  description: >-
                    Shows the 403 error response when the requesting user's
                    profile lacks the Crm_Implied_Manage_Workflow permission.
      security:
        - OAuth2:
            - ZohoCRM.settings.workflow_rules.READ
components:
  schemas:
    GetworkflowconfigurationsResponse200:
      type: object
      x-zs-$id: GetworkflowconfigurationsResponse200
      additionalProperties: false
      description: >-
        Response containing workflow configurations for a module including
        available triggers, actions, and related trigger details.
      x-zs-llm-description: >-
        Use this response as the container for workflow configuration metadata
        returned for the requested module.
      properties:
        workflow_configurations:
          $ref: '#/components/schemas/WorkflowConfigurationsMetadata'
          description: Workflow configuration metadata for the requested module.
      title: Workflow Configurations Response
    WorkflowConfigurationsMetadata:
      type: object
      x-zs-$id: WorkflowConfigurationsMetadata
      additionalProperties: false
      description: >-
        Configuration metadata for workflows on a specific module. Contains
        three sections: triggers (events that fire the rule), actions
        (operations available when the rule fires with their per-type limits and
        scheduling support), and related_triggers_details (child/related modules
        like Notes or Calls whose events can also trigger rules on the parent
        module).
      x-zs-llm-description: >-
        Use this schema to understand which triggers and action types can be
        used when composing workflow rule requests for the module.
      properties:
        related_triggers_details:
          type: array
          description: >-
            List of related modules (e.g., Notes, Calls, Activities) whose
            record events can trigger workflow rules on the parent module. Each
            entry contains the related module's identity and available trigger
            types.
          x-zs-llm-description: >-
            Use this list only when a workflow rule should be triggered by
            events from a related module rather than the primary module.
          items:
            $ref: '#/components/schemas/WorkflowConfigurationsRelatedTriggerDetail'
          maxItems: 20
        triggers:
          type: array
          description: >-
            Represents the list of trigger types available for the module. Each
            entry defines an event that can initiate a workflow rule, along with
            the action types supported for that trigger (for example, create,
            edit, delete, field_update, date_or_datetime).
          x-zs-llm-description: >-
            Use each trigger api_name as the execute_when type when creating or
            updating workflow rules.
          items:
            $ref: '#/components/schemas/WorkflowConfigurationsTrigger'
          maxItems: 20
        actions:
          type: array
          description: >-
            List of available action types for the module. Each action defines
            an operation that can be performed when the workflow rule fires,
            along with its per-type limit (applies independently to
            instant_actions and scheduled_actions), scheduling support, and
            whether it is an associate action (reusable entity referenced by ID)
            or non-associate action (defined inline).
          x-zs-llm-description: >-
            Use this list to validate action types and limits before selecting
            instant or scheduled actions for a workflow rule.
          items:
            $ref: '#/components/schemas/WorkflowConfigurationsAction'
          maxItems: 20
      title: Workflow Configurations Metadata
    WorkflowConfigurationsTrigger:
      type: object
      x-zs-$id: WorkflowConfigurationsTrigger
      additionalProperties: false
      description: >-
        A trigger type available for the module. Defines the event that
        initiates a workflow rule. Use the api_name value in the
        execute_when.type field when creating or updating a workflow rule via
        POST/PUT /settings/automation/workflow_rules.
      x-zs-llm-description: >-
        Use this object to choose a workflow trigger and to know which action
        api_names are compatible with that trigger.
      properties:
        api_name:
          type: string
          description: >-
            Represents the API identifier of the trigger type. Use this value in
            the execute_when.type field when creating a workflow rule (for
            example, create, edit, create_or_edit, delete, field_update,
            section_update, date_or_datetime, score_increase, score_decrease,
            score_update).
          x-zs-llm-description: >-
            Use this value as the trigger type identifier in workflow rule
            payloads.
          maxLength: 255
        deprecated:
          type: boolean
          description: >-
            Indicates whether this trigger type is deprecated.

            Possible values:

            true - The trigger type is deprecated and should not be used for new
            workflow rules, though it may still appear on existing rules.

            false - The trigger type is active and available for use.
        name:
          type: string
          description: >-
            Represents the display name of the trigger type as shown in the CRM
            UI (for example, Create, Edit, FieldUpdate, DateBased).
          maxLength: 255
        scheduled_actions_supported:
          type: boolean
          description: >-
            Indicates whether this trigger type supports scheduled
            (time-delayed) actions.

            Possible values:

            true - Both instant_actions and scheduled_actions are available for
            workflow rules with this trigger.

            false - Only instant_actions can be used in workflow rules with this
            trigger.
        actions:
          type: array
          description: >-
            Represents the list of action type API names supported by this
            trigger. Only these action types can be used in workflow rules with
            this trigger type. Cross-reference with the top-level actions array
            in the response for full action metadata, including per-type limits
            and scheduling support.
          x-zs-llm-description: >-
            Use these values to restrict workflow actions to the action types
            supported by the selected trigger.
          maxItems: 20
          items:
            type: string
            maxLength: 255
            description: >-
              Represents an action type API name supported by this trigger (for
              example, field_updates, email_notifications, webhooks,
              assign_owner, add_tags, remove_tags, create_record, add_meeting,
              schedule_call, convert, functions, flow).
        component_id:
          type:
            - string
            - 'null'
          description: >-
            Represents the component identifier for marketplace or custom
            triggers. Returns null for standard built-in trigger types.
          maxLength: 255
        generated_type:
          type:
            - string
            - 'null'
          description: >-
            Represents the generated type identifier for marketplace or custom
            triggers. Returns null for standard built-in trigger types.
          maxLength: 255
      title: Workflow Configurations Trigger
    WorkflowConfigurationsAction:
      type: object
      x-zs-$id: WorkflowConfigurationsAction
      additionalProperties: false
      description: >-
        Represents an action type available for the module. Defines an operation
        that can be performed when a workflow rule triggers. The limit field is
        the per-type cap that applies independently to instant_actions and
        scheduled_actions - for instance, if limit=5, you can add up to 5
        instances in instant_actions and up to 5 in scheduled_actions of the
        same rule.
      x-zs-llm-description: >-
        Use this object to choose an action type and understand whether it is
        reusable, schedulable, and how many instances are allowed.
      properties:
        is_clickable:
          type: boolean
          description: >-
            Indicates whether this action type can be edited directly from the
            workflow configuration UI page. Not relevant for API usage.
        associate_action:
          type: boolean
          description: >-
            Indicates whether this action type is an associate action. Associate
            actions link or associate records between modules (for example,
            linking a Contact to a Deal or associating a Product with an Order).
            Associate actions differ from standard data-write actions such as
            field_updates or email_notifications.

            Possible values: **true** - This action type is an associate action.
            **false** - This action type is a standard non-associate action.
          x-zs-llm-description: >-
            When true, reference an existing reusable automation entity by ID
            instead of defining the action inline.
        limit_per_action:
          type:
            - integer
            - 'null'
          format: int32
          description: >-
            Represents the maximum number of items within a single action
            instance. For example, add_tags and remove_tags allow a maximum of
            10 tags per action. Returns null if no per-action item limit
            applies.
          x-zs-llm-description: >-
            Use this as the maximum number of items inside one action instance
            when the value is not null.
        api_name:
          type: string
          description: >-
            Represents the API identifier of the action type used when creating
            or modifying workflow rules (for example, field_updates,
            email_notifications, webhooks, assign_owner, add_tags, remove_tags,
            create_record, add_meeting, schedule_call, convert, functions,
            flow).
          maxLength: 255
        supported_in_scheduled_action:
          type: boolean
          description: >-
            Indicates whether this action type can be used as a scheduled
            (time-delayed) action in a workflow rule. **Possible values:** true
            - This action type is supported in scheduled_actions (for example,
            time-delayed email_notifications or field_updates). false - This
            action type is only supported in instant_actions.
          x-zs-llm-description: When false, do not place this action type inside scheduled_actions.
        name:
          type: string
          description: >-
            Represents the display name of the action type as shown in the CRM
            UI.
          maxLength: 255
        limit:
          type: integer
          format: int32
          description: >-
            Maximum number of instances of this action type allowed per workflow
            rule. Applies independently to instant_actions and scheduled_actions
            - for instance, if limit=5, you can add up to 5 instances in
            instant_actions and up to 5 in scheduled_actions. Returns
            LIMIT_EXCEEDED if exceeded.
          x-zs-llm-description: >-
            Use this as the maximum number of action instances of this type
            allowed in instant_actions and separately in scheduled_actions.
          minimum: 1
      title: Workflow Configurations Action
    WorkflowConfigurationsRelatedTriggerDetail:
      type: object
      x-zs-$id: WorkflowConfigurationsRelatedTriggerDetail
      additionalProperties: false
      description: >-
        Represents a related module that can act as a trigger source for the
        parent module's workflow rules. For example, when a user creates a Note
        on a Lead record, a workflow rule on the Leads module configured with a
        Notes-related trigger fires.
      x-zs-llm-description: >-
        Use this object when configuring workflows that react to events from
        related modules.
      properties:
        api_name:
          type: string
          description: >-
            Represents the API name of the related module that can act as a
            trigger source (for example, Notes, Tasks, Events, Attachments). Use
            this value to identify the related module when creating workflow
            rules that should fire on related record events.
          maxLength: 255
        module:
          $ref: '#/components/schemas/ModuleReference'
          description: Module identity including api_name, id, and labels.
        name:
          type: string
          description: Represents the display name of the related module.
          maxLength: 255
        triggers:
          type: array
          description: >-
            Represents the list of trigger types available from this related
            module. These triggers can be used in workflow rules on the parent
            module via the execute_when.details.trigger_module field.
          x-zs-llm-description: >-
            Use these trigger definitions with execute_when details when the
            trigger source is a related module.
          maxItems: 20
          items:
            $ref: '#/components/schemas/WorkflowConfigurationsTrigger'
      title: Workflow Configurations Related Trigger Detail
    ModuleReference:
      type: object
      x-zs-$id: ModuleReference
      additionalProperties: false
      description: >-
        Represents a CRM module with its identity and display labels, including
        its API name, singular and plural display labels, unique ID, and
        internal name.
      x-zs-llm-description: >-
        Use api_name or id from this object when another workflow API requires a
        module identifier.
      properties:
        singular_label:
          type: string
          description: >-
            Represents the singular display name of the module as shown in the
            CRM UI (for example, Lead, Contact, Deal).
          maxLength: 255
        plural_label:
          type: string
          description: >-
            Represents the plural display name of the module as shown in the CRM
            UI (for example, Leads, Contacts, Deals).
          maxLength: 255
        api_name:
          type: string
          description: >-
            Represents the API name of the CRM module used in API requests (for
            example, Leads, Contacts, Deals, Accounts, Tasks, Cases, Products,
            Quotes, Sales_Orders, Invoices, Campaigns, Vendors).
          maxLength: 255
        name:
          type: string
          description: Represents the internal name of the CRM module.
          maxLength: 255
        id:
          type: string
          description: Represents the unique identifier of the CRM module.
          maxLength: 20
          example: '3361265000000000147'
      title: Module Reference
    RequiredParamMissingError:
      type: object
      x-zs-$id: RequiredParamMissingError
      additionalProperties: false
      description: >-
        Represents the error response when the required module query parameter
        is omitted from the request.
      properties:
        code:
          type: string
          description: >-
            Represents the error code indicating a required parameter is
            missing.
          enum:
            - REQUIRED_PARAM_MISSING
        details:
          type: object
          additionalProperties: false
          description: >-
            Represents the object containing details about the missing
            parameter.
          properties:
            param_name:
              type: string
              description: Represents the name of the missing required parameter.
              enum:
                - module
        message:
          type: string
          description: Represents the error message describing the issue.
          example: required param not found
          maxLength: 255
        status:
          type: string
          description: Represents the error status of the response.
          enum:
            - error
      required:
        - code
        - details
        - message
        - status
      title: Required Param Missing Error
    InvalidModuleResponse:
      type: object
      x-zs-$id: InvalidModuleResponse
      additionalProperties: false
      description: >-
        Represents the error response when the module query parameter value does
        not correspond to a valid CRM module or a workflow-supported module.
      properties:
        code:
          type: string
          description: Represents the error code indicating the module API name is invalid.
          enum:
            - INVALID_MODULE
        details:
          type: object
          additionalProperties: false
          description: >-
            Represents the object containing details about the invalid
            parameter.
          properties:
            param_name:
              type: string
              description: >-
                Represents the name of the parameter that contains the invalid
                value.
              enum:
                - module
        message:
          type: string
          description: Represents the error message describing the issue.
          example: The value provided to the param is Invalid
          maxLength: 255
        status:
          type: string
          description: Represents the error status of the response.
          enum:
            - error
      required:
        - code
        - details
        - message
        - status
      title: Invalid Module Error
    NoPermissionError:
      type: object
      x-zs-$id: NoPermissionError
      additionalProperties: false
      description: >-
        Represents the error response when the user lacks the required Manage
        Automation Actions privilege or when the workflow feature is unavailable
        in the current CRM edition.
      properties:
        code:
          type: string
          description: >-
            Represents the error code indicating the type of permission or
            feature availability error.

            Possible values:

            NO_PERMISSION - The user's profile lacks the required privilege.

            FEATURE_NOT_SUPPORTED - The workflow feature is unavailable in the
            current CRM edition.
             
          enum:
            - NO_PERMISSION
            - FEATURE_NOT_SUPPORTED
        details:
          type: object
          additionalProperties: false
          description: >-
            Represents the object containing details about the missing
            permission.
          properties:
            permissions:
              type: array
              description: >-
                Represents the list of required permissions that the user's
                profile is missing.
              maxItems: 5
              items:
                type: string
                maxLength: 255
                description: >-
                  Represents a required permission identifier string (for
                  example, Crm_Implied_Manage_Workflow).
        message:
          type: string
          description: Represents the permission error message describing the issue.
          example: feature not available in this edition
          maxLength: 255
        status:
          type: string
          description: Represents the error status of the response.
          enum:
            - error
      required:
        - code
        - details
        - message
        - status
      title: No Permission Error
  parameters:
    ParamQueryModule:
      name: module
      in: query
      description: >-
        Specify the API name of the CRM module for which you want to retrieve
        workflow configuration metadata. Must be a workflow-supported module
        (for example, Leads, Contacts, Deals, Accounts, Tasks, Cases, Products,
        Quotes, Sales_Orders, Purchase_Orders, Invoices, Campaigns, Vendors).
        Refer to the [Get Modules Metadata
        API](modules.yaml#$.paths./settings/modules.get) resource for valid
        values.
      required: true
      schema:
        type: string
        example: Leads
        maxLength: 255
  securitySchemes:
    OAuth2:
      type: oauth2
      description: OAuth2 authentication for API access
      flows:
        authorizationCode:
          authorizationUrl: https://accounts.zoho.com/oauth/v2/auth
          tokenUrl: https://accounts.zoho.com/oauth/v2/token
          refreshUrl: https://accounts.zoho.com/oauth/v2/token
          scopes:
            ZohoCRM.settings.workflow_rules.READ: >-
              Grants permission to retrieve workflow configuration metadata for
              CRM modules, including available trigger types, action types, and
              related module trigger details.
