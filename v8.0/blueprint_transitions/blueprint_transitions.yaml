      title: Blueprint Transition Detail
    TransitionNameInvalidCharactersError:
      type: object
      additionalProperties: false
      description: >-
        Represents the error returned when a transition name contains disallowed
        characters, including the field-level validation context.
      properties:
        code:
          type: string
          description: >-
            Represents the error code returned when the transition name contains
            invalid characters. Possible values: **INVALID_DATA**.
          enum:
            - INVALID_DATA
        details:
          type: object
          x-zs-$id: TransitionNameInvalidCharactersErrorDetails
          additionalProperties: false
          description: >-
            Contains the error details object with field-level validation
            information about the error.
          properties:
            api_name:
              type: string
              description: Represents the API name of the field associated with the error.
              maxLength: 255
            json_path:
              type: string
              description: Represents the JSON path of the field that caused the error.
              maxLength: 1000
          required:
            - api_name
            - json_path
        message:
          type: string
          description: >-
            Represents the error message returned when the transition name
            validation fails. Possible values: **should not contain special
            characters**.
          enum:
            - should not contain special characters
        status:
          type: string
          description: >-
            Indicates the response status of the API call. Possible values:
            **error**.
          enum:
            - error
      required:
        - code
        - details
        - message
        - status
      title: Transition Name Invalid Characters Error
      x-zs-$id: TransitionNameInvalidCharactersError
    TransitionOwnerDescriptor:
      type: object
      additionalProperties: false
      description: >-
        Represents the owner configuration for a transition, including the owner
        type and a list of resource references that can act as owners.
      properties:
        resources:
          type:
            - array
            - 'null'
          description: >-
            Contains the resources that identify the owners allowed to move the
            record through the transition.
          items:
            $ref: '#/components/schemas/OwnerResourceReference'
          maxItems: 1
        type:
          type: string
          description: >-
            Indicates the type of the transition owner, identifying who is
            allowed to move the record through the transition.
          maxLength: 255
      required:
        - resources
        - type
      title: Transition Owner Descriptor
    TransitionFieldMinimalReference:
      type: object
      additionalProperties: false
      description: >-
        Compact reference to a field used as a transition input, providing the
        field's unique identifier (ID) and API name for resolving input targets.
      properties:
        api_name:
          type: string
          description: Represents the API name of the transition field.
          maxLength: 255
        id:
          type: string
          description: Represents the unique identifier (ID) of the transition field.
          maxLength: 255
      required:
        - api_name
        - id
      title: Transition Field Minimal Reference
    TransitionActionDescriptor:
      type: object
      additionalProperties: false
      description: >-
        Represents an action associated with a blueprint transition, including
        its unique ID, name, type, and optional structured details.
      properties:
        name:
          type: string
          description: Represents the name of the transition action descriptor.
          maxLength: 255
        details:
          type: 'null'
          description: >-
            Contains the additional details associated with the transition
            action descriptor.
        id:
          type: string
          description: Represents the ID of the transition action descriptor.
          maxLength: 255
        type:
          type: string
          description: Indicates the type of the transition action descriptor.
          maxLength: 255
      required:
        - details
        - id
        - name
        - type
      title: Transition Action Descriptor
    TransitionInputFieldRule:
      type: object
      x-zs-$id: TransitionInputFieldRule
      additionalProperties: false
      description: >-
        Field-based input collected during a transition step, including the
        display sequence, associated module and field, optionality, type, and an
        optional validation filter.
      properties:
        sequence_number:
          type: integer
          format: int32
          description: >-
            Indicates the order in which the field appears among the inputs
            collected during the blueprint transition.
        validation_filter:
          type: 'null'
          description: >-
            Contains the validation filter applied to the value of the field
            collected during the blueprint transition.
        field:
          $ref: '#/components/schemas/TransitionFieldReference'
        module:
          type: string
          description: >-
            Represents the module to which the field collected as input during
            the blueprint transition belongs.
          maxLength: 255
        optional:
          type: boolean
          description: >-
            Indicates whether the field is optional when input is collected
            during the blueprint transition. Possible values: **true**,
            **false**.
        id:
          type: string
          description: >-
            Represents the unique identifier of the field input rule configured
            for the blueprint transition.
          maxLength: 255
        type:
          type: string
          description: >-
            Represents the type of the field collected as input during the
            blueprint transition.
          maxLength: 255
      required:
        - field
        - id
        - module
        - optional
        - sequence_number
        - type
        - validation_filter
      title: Transition Input Field Rule
    TransitionFieldReference:
      type: object
      additionalProperties: false
      description: >-
        Reference to a field required or used during a transition, identified by
        its API name and unique field ID.
      properties:
        api_name:
          type: string
          description: Represents the API name of the field referenced in the transition.
          maxLength: 255
        id:
          type: string
          description: Represents the unique ID of the field referenced in the transition.
          maxLength: 255
      required:
        - api_name
        - id
      title: Transition Field Reference
    OwnerResourceReference:
      type: object
      additionalProperties: false
      description: >-
        Represents a minimal reference to an owner-capable resource, identified
        by its unique ID. Used within transition owner definitions to list
        eligible resources.
      properties:
        id:
          type: string
          description: >-
            Represents the unique identifier of the owner resource associated
            with the blueprint transition.
          maxLength: 255
      required:
        - id
      title: Owner Resource Reference
    TransitionRemovalDetail:
      type: object
      additionalProperties: false
      description: >-
        Contains the minimal details of a transition referenced in a removal
        result, including the unique ID of the transition.
      properties:
        id:
          type: string
          description: >-
            Represents the unique identifier of the transition included in the
            removal detail.
          maxLength: 255
      title: Transition Removal Detail
    TransitionBatchUpdateRequestAlternate:
      type: object
      additionalProperties: false
      description: >-
        Represents an alternate batch update request payload containing the list
        of transition entries to update.
      properties:
        transitions:
          type: array
          description: >-
            Contains the array of transitions in the batch update request, where
            each object in the array represents a single transition.
          items:
            $ref: '#/components/schemas/TransitionUpdateEntryAlternate'
          maxItems: 1
      required:
        - transitions
      title: Transition Batch Update Request (Alternate)
    TransitionUpdateEntryAlternate:
      type: object
      additionalProperties: false
      description: >-
        Represents an alternate representation of a transition to update,
        including its ID, name, description, module, trigger type, transition
        type, owners, criteria, during inputs, actions, and color code.
      properties:
        layout:
          type: object
          additionalProperties: false
          description: >-
            Contains the layout associated with the transition's module. This
            property must accompany `during_inputs`; omitting it while providing
            `during_inputs` causes a misleading **INVALID_DATA** error
            referencing the `during_inputs[0]` field details. The object must
            include `id` and `api_name` at minimum.
          properties:
            id:
              type: string
              description: Represents the ID of the layout.
              maxLength: 50
              x-zs-$ref:
                resource: layouts
                origins:
                  - operationId: getLayouts
                    propertyId: LayoutId
              format: int64
              pattern: ^[0-9]{1,19}$
              minLength: 1
              example: '4832675000000850800'
            api_name:
              type: string
              description: Represents the API name of the layout.
              maxLength: 50
              x-zs-$ref:
                resource: layouts
                origins:
                  - operationId: getLayouts
                    propertyId: LayoutApiName
              pattern: ^[A-Za-z][A-Za-z0-9_]*$
              minLength: 1
              example: Lead_Owner
            name:
              type: string
              description: Represents the display name of the layout.
              maxLength: 50
          required:
            - id
            - api_name
        during_inputs:
          type:
            - array
            - 'null'
          description: >-
            Contains the during-transition fields shown to the user. Entries are
            appended to the existing list on each PUT call instead of replacing
            it. To remove an entry, send it with `_delete: null` along with its
            `id`. Requires the `layout` property to be present in the same
            request body.
          items:
            $ref: '#/components/schemas/TransitionDuringInputDescriptorAlternate'
          maxItems: 50
        criteria:
          $ref: '#/components/schemas/TransitionCriteriaDefinitionAlternate'
          description: This denotes the criteria of the transition to be created.
        trigger_type:
          type:
            - string
            - 'null'
          description: >-
            Represents the trigger type of the transition to be created.
            Possible values: **automatic**, **manual**.
          enum:
            - automatic
            - manual
          maxLength: 100
        module:
          $ref: '#/components/schemas/ActionTargetModuleReferenceAlternate1'
          description: This denotes the module of the transition to be created
        name:
          type:
            - string
            - 'null'
          description: >-
            Represents the name of the transition to be created. Transition
            names inside a specific blueprint must be unique.
          maxLength: 50
        description:
          type:
            - string
            - 'null'
          description: Represents the description of the transition to be created.
          maxLength: 1000
        transition_type:
          type:
            - string
            - 'null'
          description: >-
            Represents the type of the transition to be created. Possible
            values: **standalone_transition**, **parallel_transition**,
            **child_transition**.
          enum:
            - standalone_transition
            - parallel_transition
            - child_transition
          maxLength: 100
        owners:
          type:
            - array
            - 'null'
          description: >-
            Represents the owners of the transition to be created who are
            permitted to execute the transition.
          items:
            $ref: '#/components/schemas/TransitionOwnerAssignmentInputAlternate'
          maxItems: 5
        id:
          type: string
          description: Represents the ID of the transition to be updated.
          maxLength: 50
          x-zs-$ref:
            resource: blueprint_transitions
            origins:
              - operationId: getBlueprintTransitions
                propertyId: BlueprintTransitionsId
        actions:
          type:
            - array
            - 'null'
          description: Contains the list of after actions of the transition to be created.
          items:
            $ref: '#/components/schemas/TransitionAfterActionEntryAlternate'
          maxItems: 4
        color_code:
          type:
            - string
            - 'null'
          description: >-
            Represents the color code of the transition button to be created.
            Example: #F27E22.
          maxLength: 1000
      required:
        - id
      title: Transition Update Entry (Alternate)
    TransitionDuringInputDescriptorAlternate:
      type: object
      additionalProperties: false
      description: >-
        Represents a during input configured for a blueprint transition,
        describing the input type, its sequence, the associated field,
        validation, checklist items, related list, kiosk definition, title, and
        message shown to the user executing the transition.
      properties:
        validation_filter:
          $ref: '#/components/schemas/DuringFieldValidationFilterAlternate'
          description: Validation criteria detail for the during field
        sequence:
          type:
            - integer
            - 'null'
          format: int32
          description: Represents the order of the during fields of the transition.
        field:
          $ref: '#/components/schemas/CriteriaGroupFieldReferenceAlternate'
          description: Field data of the field associated in during field
        configured_fields:
          type:
            - array
            - 'null'
          description: >-
            Contains the fields configured in the during input for which values
            must be collected when the transition executes.
          items:
            $ref: '#/components/schemas/DuringFieldConfigurationEntryAlternate'
          maxItems: 10
        optional:
          type:
            - boolean
            - 'null'
          description: >-
            Indicates whether this during-input field is optional for the user
            executing the transition. Only Boolean values are accepted; string
            values such as 'true' or 'false' return an INVALID_DATA error with
            expected_data_type: boolean. Possible values: **true**, **false**.
        type:
          type:
            - string
            - 'null'
          description: >-
            Represents the type of the during input. Supported values: 'field',
            'notes', 'attachment', 'tags', 'checklist', 'related_list', 'kiosk'.
            Only these types are reliably persisted.
          maxLength: 100
        message:
          type:
            - string
            - 'null'
          description: Represents the informational message displayed in the during input.
          maxLength: 1000
        title:
          type:
            - string
            - 'null'
          description: >-
            Represents the title of the checklist associated with the
            during-input field.
          maxLength: 100
        kiosk:
          $ref: '#/components/schemas/KioskReferenceAlternate'
          description: kiosk data associated in during field
        related_list:
          $ref: '#/components/schemas/TransitionRelatedListConfigurationAlternate'
          description: Related list data of the RL associated in the blueprint
        items:
          type:
            - array
            - 'null'
          description: >-
            Contains the items of the checklist associated with the during-input
            field.
          items:
            $ref: '#/components/schemas/ChecklistItemEntryAlternate'
          maxItems: 2
      title: Transition During Input Descriptor (Alternate)
    KioskReferenceAlternate:
      type: object
      additionalProperties: false
      description: >-
        Represents an alternate reference to a kiosk used in a during input,
        identified by its name and ID.
      properties:
        name:
          type:
            - string
            - 'null'
          description: Represents the name of the kiosk associated with the during field.
          maxLength: 100
        id:
          type:
            - string
            - 'null'
          description: Represents the ID of the kiosk associated with the during field.
          maxLength: 50
          x-zs-$ref:
            resource: kiosks
            origins:
              - operationId: getAllKiosks
                propertyId: KiosksId
      title: Kiosk Reference (Alternate)
    TransitionAfterActionEntryAlternate:
      description: >-
        Represents an alternate definition of an after action executed after the
        transition, including its type, optional name and ID, and
        action-specific details.
      oneOf:
        - $ref: '#/components/schemas/FieldUpdatesActionInputEntry'
        - $ref: '#/components/schemas/TaskActionInputEntry'
        - $ref: '#/components/schemas/FunctionActionInputEntry'
        - $ref: '#/components/schemas/EmailNotificationActionInputEntry'
        - $ref: '#/components/schemas/WebhookActionInputEntry'
        - $ref: '#/components/schemas/GeneralActionEntryAlternate'
      discriminator:
        propertyName: type
        mapping:
          field_updates: '#/components/schemas/FieldUpdatesActionInputEntry'
          tasks: '#/components/schemas/TaskActionInputEntry'
          functions: '#/components/schemas/FunctionActionInputEntry'
          email_notifications: '#/components/schemas/EmailNotificationActionInputEntry'
          webhooks: '#/components/schemas/WebhookActionInputEntry'
      title: Transition After Action Entry (Alternate)
    GeneralActionEntryAlternate:
      type: object
      additionalProperties: false
      description: >-
        Represents an after action of the transition for non-referenced action
        types: **add_tags**, **remove_tags**, **sms**, **whatsapp**,
        **create_record**, **add_meeting**, **schedule_call**, and **convert**.
      properties:
        name:
          type:
            - 'null'
