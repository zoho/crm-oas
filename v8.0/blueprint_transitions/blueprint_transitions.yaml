        id:
          type:
            - string
            - 'null'
          description: Represents the ID of the related list associated with the blueprint.
          maxLength: 50
        module:
          $ref: '#/components/schemas/ActionTargetModuleReferenceAlternate1'
          description: Related list module data associated in during field
      title: Transition Related List Configuration (Alternate)
    RelatedListLayoutReferenceAlternate1:
