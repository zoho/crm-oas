          maxLength: 100
        name:
          type:
            - string
            - 'null'
          description: >-
            Represents the name of the tag configured in the after actions of a
            transition.
          maxLength: 100
      title: Action Tag Descriptor (Alternate)
    TransitionRelatedListConfigurationAlternate:
      type: object
      additionalProperties: false
