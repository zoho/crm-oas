    ConvertActionCombinationAmbiguityError:
      type: object
      additionalProperties: false
      description: >-
        Represents the processing error returned when a convert action is
        combined with incompatible action types (field_update, tasks,
        create_tags, or remove_tags) in the same blueprint transition. Contains
        the error code **AMBIGUITY_DURING_PROCESSING**, the error message, the
        response status, and details listing the conflicting field paths that
        caused the ambiguity.
      properties:
        code:
          type: string
          description: >-
            Represents the error code returned when a convert action is combined
            with conflicting actions. Possible values:
            **AMBIGUITY_DURING_PROCESSING**.
          enum:
            - AMBIGUITY_DURING_PROCESSING
        details:
          type: object
          x-zs-$id: ConvertActionCombinationAmbiguityErrorDetails
          additionalProperties: false
          description: >-
            Contains the error details, including the conflicting field paths
            that caused the ambiguity.
          properties:
            ambiguity_due_to:
              type: array
              description: >-
                Contains the list of fields that caused the ambiguity during
                processing.
              items:
                type: object
                x-zs-$id: ConvertActionCombinationAmbiguityDueTo
                additionalProperties: false
                description: Represents a field path detail that caused the ambiguity.
                properties:
                  api_name:
                    type: string
                    description: Represents the API name of the conflicting field.
                    maxLength: 255
                  json_path:
                    type: string
                    description: Represents the JSON path of the conflicting field.
                    maxLength: 1000
                required:
                  - api_name
                  - json_path
              maxItems: 25
          required:
            - ambiguity_due_to
        message:
          type: string
          description: >-
            Represents the error message returned when the convert action cannot
            be combined with conflicting actions. Possible values: **convert
            action cannot be combined with field_update, tasks, create_tags or
            remove_tags actions for module**.
          enum:
            - >-
              convert action cannot be combined with field_update, tasks,
              create_tags or remove_tags actions for module
        status:
          type: string
          description: >-
            Indicates the response status of the API call. Possible values:
            **error**.
          enum:
            - error
      required:
        - code
        - details
        - message
        - status
      title: Convert Action Combination Ambiguity Error
      x-zs-$id: ConvertActionCombinationAmbiguityError
  parameters:
    ParamHeaderXZohoService:
      name: X-ZOHO-SERVICE
      in: header
      description: >-
        Represents a custom request header that identifies the Zoho service
        associated with the request. Possible values: **automation**.
      required: true
      style: simple
      explode: false
      schema:
        type: string
        enum:
          - automation
    ParamQueryIds1:
      name: ids
      in: query
      description: >-
        Represents a comma-separated list (CSV) of unique transition IDs used to
        retrieve specific blueprint transition configurations.
      required: true
      style: form
      explode: false
      schema:
        type: array
        minItems: 1
        maxItems: 100
        uniqueItems: true
        items:
          type: string
          format: int64
          description: A unique transition ID.
          pattern: ^[0-9]+$
          minLength: 1
          maxLength: 19
      example:
        - '111111000000084030'
        - '111111000000091000'
  securitySchemes:
    OAuth2:
      type: oauth2
      description: OAuth2 authentication for API access
      flows:
        authorizationCode:
          authorizationUrl: https://accounts.zoho.com/oauth/v2/auth
          tokenUrl: https://accounts.zoho.com/oauth/v2/token
          refreshUrl: https://accounts.zoho.com/oauth/v2/token
          scopes:
            ZohoCRM.settings.transitions.READ: >-
              Grants access to retrieve blueprint transition configurations from
              Zoho CRM settings.
            ZohoCRM.settings.transitions.CREATE: >-
              Grants access to create blueprint transition configurations in
              Zoho CRM settings.
            ZohoCRM.settings.transitions.UPDATE: >-
              Grants access to update blueprint transition configurations in
              Zoho CRM settings.
            ZohoCRM.settings.transitions.DELETE: >-
              Grants access to delete blueprint transition configurations from
              Zoho CRM settings.
