        - $ref: '#/components/schemas/GeneralOwnerEntryAlternate'
      discriminator:
        propertyName: type
        mapping:
          users: '#/components/schemas/UserOwnerEntry'
          role: '#/components/schemas/RoleOwnerEntry'
          group: '#/components/schemas/GroupOwnerEntry'
      title: Transition Owner Assignment Input (Alternate)
    GeneralOwnerEntryAlternate:
      type: object
