openapi: 3.1.0
info:
  title: Blueprint Transitions
  description: >
    Blueprint transitions are the configurable actions in Zoho CRM that move a
    record from one stage to another within a blueprint, defining the owners,
    criteria, inputs, and follow-up actions for each stage change. This API
    enables developers to retrieve and update blueprint transition
    configurations.
  version: '8'
servers:
  - url: https://zohoapis.{dc}/crm/{version}
    description: API Server URL
    variables:
      dc:
        description: API Server URL TLD
        default: com
        enum:
          - eu
          - com
          - au
          - in
          - jp
          - cn
          - ca
      version:
        description: API Version
        default: v8
paths:
  /settings/blueprints/transitions/{transitionId}:
    get:
      summary: Get Blueprint transition
      description: >-
        To retrieve the configuration details of a single Blueprint transition
        by its transition ID in your Zoho CRM organization. The response
        contains a transitions array with one Blueprint Transition Record,
        including its process ID, during inputs, owners, criteria, and actions.
      x-zs-llm-description: Get details of a specific blueprint transition by transitionId
      operationId: getBlueprintTransitionById
      parameters:
        - name: transitionId
          in: path
          required: true
          schema:
            type: string
            format: int64
            pattern: ^[0-9]+
            minLength: 1
            maxLength: 19
          description: >-
            Specify the ID of the Blueprint transition you want to retrieve.
            Refer to the [Get Blueprint
            Transitions](blueprint_transitions.yaml#$.paths./settings/blueprints/transitions.get)
            resource for valid values.
        - $ref: '#/components/parameters/ParamHeaderXZohoService'
      responses:
        '200':
          description: >-
            Returns the configuration details of the requested Blueprint
            transition. The response contains a transitions array with a single
            Blueprint Transition Record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlueprintTransitionByIDResponse'
              examples:
                Success200:
                  summary: Successful retrieval of a Blueprint transition by ID
                  value:
                    transitions:
                      - id: '111112000000000856'
                        trigger_type: manual
                        transition_type: standalone_transition
                        process_id: '11111200000000876'
                        name: Renamed Transition
                        criteria: null
                        color_code: '#F27E22'
                        owners:
                          - type: users
                            resources:
                              - id: '111111000000000039'
                        module:
                          api_name: Leads
                          id: '111112000000000030'
                        during_inputs:
                          - id: '111112000000007172'
                            type: field
                            optional: false
                            sequence_number: 4
                            validation_filter: null
                            module: Deals
                            field:
                              api_name: Subject
                              id: '111111000000059420'
                          - id: '111112000000000091'
                            type: checklist
                            sequence_number: 4
                            checklist_info:
                              title: checklist items
                              items:
                                - checklist1
                                - checklist2
                        actions:
                          - type: tasks
                            name: Reminder Task
                            id: '111111000000059424'
                            details: null
                  description: >-
                    Shows the response returned when the user successfully
                    retrieves the Blueprint transition for the specified
                    transition ID. The payload contains a transitions array with
                    a single Blueprint Transition Record.
          headers:
            X-API-CREDITS-REMAINING:
              schema:
                type: string
                format: int64
                description: >
                  Present when >=50% of base daily credits (excluding add-on
                  credits) are consumed. Value is total remaining credits
                  including add-on credits for the rolling 24-hour window.
                pattern: ^[0-9]+$
                minLength: 1
                maxLength: 19
              required: false
        '403':
          description: >-
            The user does not have permission to perform this action.

            **Resolution:** The CRM administrator must grant the required
            permission to the user's profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoPermissionError'
              examples:
                NoPermission403:
                  summary: >-
                    NO_PERMISSION error for a profile without the required
                    permission
                  value:
                    code: NO_PERMISSION
                    details:
                      permissions:
                        - Crm_Implied_Manage_Workflow
                    message: permission denied
                    status: error
                  description: >-
                    Shows the error response returned when the user's CRM
                    profile lacks the required permission to retrieve the
                    Blueprint transition. The payload returns the NO_PERMISSION
                    error code.
          headers:
            X-API-CREDITS-REMAINING:
              schema:
                type: string
                format: int64
                description: >
                  Present when >=50% of base daily credits (excluding add-on
                  credits) are consumed. Value is total remaining credits
                  including add-on credits for the rolling 24-hour window.
                pattern: ^[0-9]+$
                minLength: 1
                maxLength: 19
              required: false
      security:
        - OAuth2:
            - ZohoCRM.settings.transitions.READ
    put:
      summary: Update a Blueprint transition
      description: >-
        To update a single Blueprint transition in Zoho CRM. Prerequisite: Call
        this API for every transition after Blueprint creation to set the
        modified_time, which the UI requires to render transitions correctly.
        Critical behaviors: (1) The **layout** key is required in the request
        body whenever **during_inputs** are included; omitting it causes
        INVALID_DATA: Invalid field details with a misleading reference to
        during_inputs[0]. (2) The **during_inputs** are additive; each PUT call
        appends new entries rather than replacing them. Remove entries by
        sending an object with **_delete** set to null, the entry **ID**, and
        **type** set to "field". (3) The **optional** key must be a Boolean
        (true/false), not a string; strings return INVALID_DATA: expected
        Boolean.
      x-zs-llm-description: Update a specific blueprint transition by transitionId
      operationId: updateBlueprintTransitionById
      parameters:
        - name: transitionId
          in: path
          required: true
          schema:
            type: string
            format: int64
            pattern: ^[0-9]+
            minLength: 1
            maxLength: 19
          description: Specify the ID of the transition to update.
        - $ref: '#/components/parameters/ParamHeaderXZohoService'
      requestBody:
        description: >-
          The request body must contain a **transitions** array with one object
          that defines the transition configuration to update.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlueprintTransitionsUpdateRequestAlternate'
            examples:
              SamplePutRequest:
                summary: Sample request body for updating a Blueprint transition
                value:
                  transitions:
                    - name: Test Transition
                      description: Test Transition Description
                      trigger_type: manual
                      transition_type: standalone_transition
                      color_code: '#F27E22'
                      module:
                        api_name: Leads
                        id: '111112000000000030'
                      layout:
                        id: '111111000000058891'
                        api_name: standard
                      during_inputs:
                        - type: notes
                          optional: false
                          sequence: 1
                          field:
                            api_name: Account_Name
                            id: '111111000000059320'
                          message: new message added
                          validation_filter:
                            validation_message: Amount revenue should be more than 1000
                            criteria:
                              field:
                                api_name: Lead Lookup.Amount
                                id: '111111000000059321'
                              comparator: greater_than
                              value: '1000'
                          configured_fields:
                            - field:
                                api_name: Subject
                                id: '111111000000059420'
                              optional: false
                            - field:
                                api_name: Priority
                                id: '111111000000059421'
                              validation_filter:
                                validation_message: >-
                                  priority should be high or highest or low or
                                  lowest
                                criteria:
                                  field:
                                    api_name: Lead Lookup.Amount
                                    id: '111111000000059321'
                                  comparator: greater_than
                                  value: '1000'
                              optional: false
                          related_list:
                            id: '111111000000078890'
                            name: Tasks
                            module:
                              id: '111111000000059891'
                              api_name: Tasks
                            layout:
                              id: '111111000000058891'
                              api_name: standard
                          title: Check List
                          items:
                            - name: Item 1
                              optional: true
                              sequence: 1
                            - name: Item 2
                              optional: false
                              sequence: 2
                          kiosk:
                            id: '13212313000002323'
                            name: kiosk name
                        - type: attachment
                          optional: true
                          sequence: 2
                        - type: tags
                          optional: false
                          sequence: 3
                        - type: info
                          optional: false
                          sequence: 4
                          message: new message added
                        - type: field
                          field:
                            api_name: Account_Name
                            id: '111111000000059320'
                          optional: false
                          sequence: 4
                        - type: field
                          field:
                            api_name: Lead_Lookup.Amount
                            id: '111111000000059321'
                          optional: true
                          sequence: 5
                          validation_filter:
                            validation_message: Amount revenue should be more than 1000
                            criteria:
                              field:
                                api_name: Lead Lookup.Amount
                                id: '111111000000059321'
                              comparator: greater_than
                              value: '1000'
                        - type: related_list
                          sequence: 6
                          related_list:
                            id: '111111000000078890'
                            name: Tasks
                            module:
                              id: '111111000000059891'
                              api_name: Tasks
                            layout:
                              id: '111111000000058891'
                              api_name: standard
                          configured_fields:
                            - field:
                                api_name: Subject
                                id: '111111000000059420'
                              optional: false
                            - field:
                                api_name: Priority
                                id: '111111000000059421'
                              validation_filter:
                                validation_message: >-
                                  priority should be high or highest or low or
                                  lowest
                                criteria:
                                  field:
                                    api_name: Lead Lookup.Amount
                                    id: '111111000000059321'
                                  comparator: greater_than
                                  value: '1000'
                              optional: false
                        - type: kiosk
                          sequence: 1
                          optional: false
                          kiosk:
                            id: '13212313000002323'
                            name: kiosk name
                        - type: related_list
                          sequence: 7
                          related_list:
                            id: '111111000000078890'
                            name: Quote_Lead_RL
                            module:
                              id: '111111000000059891'
                              api_name: Quotes
                            layout:
                              id: '111111000000058891'
                              api_name: standard
                          configured_fields:
                            - field:
                                api_name: Subject
                                id: '111111000000059422'
                              validation_filter: null
                              optional: false
                            - name: Quoted_Items
                              optional: false
                              subform_fields:
                                - field:
                                    api_name: Subject
                                    id: '111111000000059422'
                                  validation_filter: null
                                  optional: false
                                - field:
                                    api_name: Product_Name
                                    id: '111111000000059423'
                                  validation_filter: null
                                  optional: false
                                - field:
                                    api_name: List_Price
                                    id: '111111000000059424'
                                  validation_filter: null
                                  optional: false
                        - type: checklist
                          title: Check List
                          items:
                            - name: Item 1
                              optional: true
                              sequence: 1
                            - name: Item 2
                              optional: false
                              sequence: 2
                          optional: false
                          sequence: 8
                      actions:
                        - type: field_updates
                          id: '111111000000059424'
                        - type: add_tags
                          details:
                            module:
                              id: '111111000000059420'
                              api_name: Contacts
                            tags:
                              - name: testtag
                                color: '#0000FF'
                              - name: tag1
                                color: '#800080'
                            overwrite: true
                          name: null
                          id: '111111000000059424'
                        - type: email_notifications
                          id: '111111000000059424'
                        - type: tasks
                          id: '111111000000059424'
                      owners:
                        - type: users
                          resources:
                            - id: '111111000000000039'
                            - id: '111111000000000039'
                        - type: role
                          resources:
                            - id: '111111000000000241'
                        - type: group
                          resources:
                            - id: '111111000000059384'
                        - type: record_owner
                          resources: []
                        - type: portal_user_type
                          resources:
                            - id: '111111000000059396'
                      criteria:
                        group_operator: and
                        group:
                          - group_operator: and
                            group:
                              - comparator: equal
                                field:
                                  api_name: Annual_Revenue
                                  id: '111111000000059456'
                                value: '20000'
                              - comparator: not_equal
                                field:
                                  api_name: City
                                  id: '111111000000059434'
                                value: Chennai
                description: >-
                  This sample request body updates an existing Blueprint
                  transition. It supplies the transition configuration,
                  including owners, criteria, during inputs, and after actions.
            x-zs-llm-examples:
              - SamplePutRequest
      responses:
        '200':
          description: >-
            Created - The API successfully creates or updates the Blueprint
            transition and returns the per-transition results.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlueprintTransitionsUpdateResponse'
              examples:
                Success201:
                  summary: Success response for the Blueprint transition update
                  value:
                    transitions:
                      - code: SUCCESS
                        details:
                          id: '111112000000000856'
                        message: transition updated successfully
                        status: success
                  description: >-
                    The API returns this response when it successfully updates
                    the Blueprint transition. Each entry in the transitions
                    array reports the status, code, and message for the updated
                    transition.
          headers:
            X-API-CREDITS-REMAINING:
              schema:
                type: string
                format: int64
                description: >
                  Present when >=50% of base daily credits (excluding add-on
                  credits) are consumed. Value is total remaining credits
                  including add-on credits for the rolling 24-hour window.
                pattern: ^[0-9]+$
                minLength: 1
                maxLength: 19
              required: false
        '400':
          description: >-
            The request cannot be processed due to invalid syntax.

            **Resolution:** The invalid values in the request body must be
            corrected based on the error details in the response.
          content:
            application/json:
              schema:
                x-zs-$id: BlueprintTransitionsUpdateErrorResponse
                oneOf:
                  - $ref: '#/components/schemas/InvalidEscalationPeriodError'
                  - type: object
                    x-zs-$id: BlueprintTransitionsUpdateErrorResponseWrapper
                    additionalProperties: false
                    description: >-
                      Represents the error response that wraps the
                      per-transition errors in the **transitions** array.
                    properties:
                      transitions:
                        type: array
                        description: >-
                          Contains the list of error objects, one for each
                          transition that failed validation.
                        items:
                          oneOf:
                            - $ref: >-
                                #/components/schemas/TransitionTypeInvalidValueError
                            - $ref: >-
                                #/components/schemas/InvalidEscalationPeriodError
                            - $ref: >-
                                #/components/schemas/TransitionActionsAmbiguityErrorResponse
                            - $ref: >-
                                #/components/schemas/TransitionFieldMaxLengthError
                            - $ref: >-
                                #/components/schemas/ChecklistTitleTooLongErrorResponse
                            - $ref: >-
                                #/components/schemas/ChecklistItemLimitExceededErrorResponse
                            - $ref: >-
                                #/components/schemas/ChecklistOptionNameTooLongErrorResponse
                            - $ref: >-
                                #/components/schemas/TransitionFieldDataTypeError
                            - $ref: '#/components/schemas/MandatoryFieldMissingError'
                            - $ref: >-
                                #/components/schemas/TransitionFieldInvalidValueError
                            - $ref: '#/components/schemas/InvalidValueResponse'
                            - $ref: >-
                                #/components/schemas/TransitionNameInvalidCharactersError
                            - $ref: >-
                                #/components/schemas/ErrorTriggerTypeUpdateNotAllowed
                            - $ref: >-
                                #/components/schemas/ModuleUpdateNotAllowedErrorResponse
                            - $ref: >-
                                #/components/schemas/CriteriaNotSupportedForFieldError
                            - $ref: >-
                                #/components/schemas/CriteriaFieldApiNameInvalidError
                            - $ref: >-
                                #/components/schemas/DuringInputsNotAllowedAutomaticError
                            - $ref: >-
                                #/components/schemas/DuringInputsNotAllowedParallelError
                            - $ref: >-
                                #/components/schemas/ActionNotSupportedForModuleError
                            - $ref: >-
                                #/components/schemas/DuringInputFieldIdInvalidDataError
                            - $ref: '#/components/schemas/ActionLimitExceedsError'
                            - $ref: >-
                                #/components/schemas/TransitionDuringFieldsLimitExceededError
                            - $ref: >-
                                #/components/schemas/TransitionFieldInvalidDataError
                            - $ref: >-
                                #/components/schemas/TransitionFieldValueInvalidError
                            - $ref: >-
                                #/components/schemas/ActionNotBelongingToModuleError
                            - $ref: >-
                                #/components/schemas/TransitionTypeUpdateNotAllowedError
                            - $ref: '#/components/schemas/DuringFieldIdInvalidError'
                            - $ref: >-
                                #/components/schemas/DuringInputsWidgetAmbiguityError
                            - $ref: >-
                                #/components/schemas/TeamUserNotAllowedForOrgModule
                            - $ref: >-
                                #/components/schemas/ChildParallelTransitionActionsNotAllowedError
                            - $ref: >-
                                #/components/schemas/ConvertActionCombinationAmbiguityError
                          description: >-
                            Represents an error object that describes why a
                            transition failed validation, including the error
                            code, message, status, and details.
                        maxItems: 25
                    required:
                      - transitions
                description: >-
                  Represents the structure of the error response returned when
                  the request cannot be processed. The response is either a
                  single validation error object or an object that wraps the
                  per-transition errors.
              examples:
                InvalidDataResponse1:
                  summary: >-
                    Error response with code INVALID_DATA: invalid data (Field:
                    type)
                  value:
                    code: INVALID_DATA
                    details:
                      api_name: type
                      json_path: $.transitions
                      supported_values:
                        - standalone_transition
                        - common_transition
                        - parallel_transition
                        - child_transition
                        - automatic_transition
                    message: invalid data
                    status: error
                  description: >-
                    Shows the 400 Bad Request error returned with code
                    INVALID_DATA when the request payload contains invalid data
                    for the transition update.
                InvalidDataResponse2:
                  summary: Invalid value in the **api_name** field
                  value:
                    transitions:
                      - code: INVALID_DATA
                        details:
                          json_path: $.transitions[0].module
                          api_name: api_name
                        message: the value given is invalid
                        status: error
                  description: >-
                    The request cannot be processed because the value given for
                    the **api_name** field is invalid. Provide a valid API name
                    and resubmit the update request.
                InvalidDataResponse3:
                  summary: >-
                    Error response with code INVALID_DATA: the value given is
                    invalid (Field: ID)
                  value:
                    transitions:
                      - code: INVALID_DATA
                        details:
                          json_path: $.transitions[0].module.id
                          api_name: id
                        message: the value given is invalid
                        status: error
                  description: >-
                    The request contains an invalid value for the ID field, so
                    the API rejects the update to the Blueprint transition and
                    returns the error code INVALID_DATA.
                InvalidDataResponse4:
                  summary: >-
                    **INVALID_DATA** error: the **type** field holds invalid
                    data
                  value:
                    transitions:
                      - code: INVALID_DATA
                        details:
                          json_path: $.transitions[0].during_inputs[0].type
                          api_name: type
                        message: invalid data
                        status: error
                  description: >-
                    The API returns this error when the request supplies invalid
                    data for the type attribute of a during_inputs entry in a
                    Blueprint transition. Specify a valid type value and resend
                    the request.
                InvalidDataResponse5:
                  summary: >-
                    Error response with code INVALID_DATA: Invalid data (Field:
                    ID)
                  value:
                    transitions:
                      - code: INVALID_DATA
                        details:
                          json_path: $.transitions[0].during_inputs[0].id
                          api_name: id
                        message: invalid data
                        status: error
                  description: >-
                    The API returns this error when the request supplies invalid
                    data for the ID attribute of a during_inputs entry in a
                    Blueprint transition. Specify a valid ID value and resend
                    the request.
                InvalidDataResponse6:
                  summary: >-
                    Error response with code INVALID_DATA: Invalid data (Field:
                    ID)
                  value:
                    transitions:
                      - code: INVALID_DATA
                        details:
                          json_path: $.transitions[0].during_inputs[0].related_list.id
                          api_name: id
                        message: invalid data
                        status: error
                  description: >-
                    The API returns this response with the INVALID_DATA error
                    code when the update request supplies invalid data for the
                    transition ID. The response identifies the ID field as the
                    source of the error.
                InvalidDataResponse7:
                  summary: >-
                    Error response with code INVALID_DATA: Invalid data (Field:
                    ID)
                  value:
                    transitions:
                      - code: INVALID_DATA
                        details:
                          json_path: $.transitions[0].owners[0].resources[0].id
                          api_name: id
                        message: invalid data
                        status: error
                  description: >-
                    The API returns this 400 response with the code INVALID_DATA
                    when the request supplies invalid data for the ID field
                    while updating a Blueprint transition. Correct the ID value
                    and send the request again.
                InvalidDataResponse8:
                  summary: >-
                    Error response with code INVALID_DATA: Invalid data (Field:
                    ID)
                  value:
                    transitions:
                      - code: INVALID_DATA
                        details:
                          json_path: $.transitions[0].actions[0].id
                          api_name: id
                        message: invalid data
                        status: error
                  description: >-
                    This example shows the INVALID_DATA error that the API
                    returns when the action ID key in the first action of a
                    Blueprint transition contains invalid data. The
                    **json_path** in the response identifies the exact action
                    key that failed validation.
                AmbiguityDuringProcessingResponse1:
                  summary: Ambiguity during processing error prompting for proper data
                  value:
                    transitions:
                      - code: AMBIGUITY_DURING_PROCESSING
                        details:
                          ambiguity_due_to:
                            - api_name: type
                              json_path: $.transitions[0].actions[1].type
                            - api_name: type
                              json_path: $.transitions[0].actions[0].type
                        message: Provide proper data
                        status: error
                  description: >-
                    Shows the error returned when the request data is ambiguous
                    and cannot be processed. The response returns the
                    **AMBIGUITY_DURING_PROCESSING** code and prompts the user to
                    provide proper data.
                InvalidDataResponse9:
                  summary: Invalid data in the **type** field (**INVALID_DATA**)
                  value:
                    transitions:
                      - code: INVALID_DATA
                        details:
                          json_path: $.transitions[0].actions[0].type
                          api_name: type
                        message: Invalid data
                        status: error
                  description: >-
                    The API returns this response when the request to update a
                    Blueprint transition contains invalid data. The error code
                    INVALID_DATA indicates that the request fails validation.
                InvalidDataResponse10:
                  summary: >-
                    Error response with code INVALID_DATA: You can provide up to
                    30 characters (Field: title)
                  value:
                    transitions:
                      - code: INVALID_DATA
                        details:
                          maximum_length: 30
                          json_path: $.transitions[0].during_inputs[0].title
                          api_name: title
                        message: You can provide upto 30 characters.
                        status: error
                  description: >-
                    Shows the error returned when the **title** of the
                    transition exceeds the maximum allowed length of 30
                    characters. The response reports the code INVALID_DATA and
                    identifies **title** as the field that caused the validation
                    failure.
                DependentMismatchResponse1:
                  summary: >-
                    Error response with code DEPENDENT_MISMATCH when a checklist
                    exceeds the allowed 10 items
                  value:
                    transitions:
                      - code: DEPENDENT_MISMATCH
                        details:
                          json_path: $.transitions[0].during_inputs[0].items
                          api_name: items
                          maximum_length: 10
                          dependee:
                            dependee_value: checklist
                            json_path: $.transitions[0].during_inputs[0].type
                            api_name: type
                        message: You can provide upto 10 checklist items
                        status: error
                  description: >-
                    Shows the 400 Bad Request error returned with code
                    DEPENDENT_MISMATCH when the checklist of a during input
                    contains more than the allowed 10 items. The response
                    identifies **items** as the offending field.
                InvalidDataResponse11:
                  summary: Checklist option name exceeds the 140-character limit
                  value:
                    transitions:
                      - code: INVALID_DATA
                        details:
                          maximum_length: 140
                          json_path: $.transitions[0].during_inputs[0].items[0].name
                          api_name: name
                        message: >-
                          You can provide upto 140 checklists option character
                          limit
                        status: error
                  description: >-
                    Shows an error response returned when the name of a
                    checklist option in the during inputs of a Blueprint
                    transition exceeds 140 characters. The API rejects the
                    update with the code INVALID_DATA.
                InvalidDataResponse12:
                  summary: 'INVALID_DATA error: the name field has an invalid data type'
                  value:
                    transitions:
                      - code: INVALID_DATA
                        message: Invalid data type
                        details:
                          api_name: name
                          expected_data_type: text
                          json_path: $.transitions[*].name
                        status: error
                  description: >-
                    The API returns this error when the name of a Blueprint
                    transition has an invalid data type; the API expects a text
                    value at $.transitions[*].name. The response returns the
                    INVALID_DATA code with the message "Invalid data type" for
                    the field name.
                InvalidDataResponse13:
                  summary: >-
                    Invalid data in the **name** field (error code
                    **INVALID_DATA**)
                  value:
                    transitions:
                      - code: INVALID_DATA
                        message: Invalid data
