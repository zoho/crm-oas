        id:
          type:
            - string
            - 'null'
          format: int64
          pattern: '[0-9]+'
          description: >-
            Represents the ID of the after action associated with the after
            actions of the transition.
          minLength: 1
          maxLength: 19
        type:
          type: string
          enum:
            - add_tags
            - remove_tags
            - sms
            - whatsapp
            - create_record
            - add_meeting
            - schedule_call
            - convert
          description: >-
            Indicates the type of the after action of the transition. Possible
            values: **add_tags**, **remove_tags**, **sms**, **whatsapp**,
            **create_record**, **add_meeting**, **schedule_call**, **convert**.
      required:
        - type
      title: General Action Entry (Alternate)
      x-zs-$id: GeneralActionEntryAlternate
    TransitionOwnerAssignmentInputAlternate:
      description: >-
