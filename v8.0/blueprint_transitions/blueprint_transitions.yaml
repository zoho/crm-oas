          description: >-
            Contains the list of tags associated with the after actions of a
            transition.
          items:
            $ref: '#/components/schemas/ActionTagDescriptorAlternate1'
          maxItems: 2
      title: Action Tag Update Details (Alternate)
      x-zs-$id: ActionTagUpdateDetailsAlternate1
    ActionTagDescriptorAlternate1:
      type: object
      additionalProperties: false
      description: >-
        Represents an alternate tag definition used in an after action of a
