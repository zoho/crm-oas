                          - json_path
                      message:
                        type: string
                        description: >-
                          Represents the error message describing the missing
                          required field.
                        maxLength: 1000
                      status:
                        type: string
                        description: Error status indicator
                        enum:
                          - error
                    required:
                      - code
                      - details
                      - message
                      - status
                  - type: object
                    x-zs-$id: DependentFieldMissingError
                    description: >-
                      DEPENDENT_FIELD_MISSING error when dependent configuration
                      is missing
                    additionalProperties: false
                    properties:
                      code:
                        type: string
                        description: Error code indicating a dependent field is missing
                        enum:
                          - DEPENDENT_FIELD_MISSING
                      details:
                        type: object
                        description: Error details with field location information
                        additionalProperties: false
                        properties:
                          api_name:
                            type: string
                            maxLength: 50
                            description: Name of the dependent field that is missing
                          json_path:
                            type: string
                            description: >-
                              JSONPath expression locating where the field
                              should be in the request
                            maxLength: 100
                        required:
                          - api_name
                          - json_path
                      message:
                        type: string
                        description: >-
                          Represents the error message describing the missing
                          dependent field.
                        maxLength: 1000
                      status:
                        type: string
                        description: Error status indicator
                        enum:
                          - error
                    required:
                      - code
                      - details
                      - message
                      - status
                  - type: object
                    x-zs-$id: ExpectedFieldMissingError
                    description: EXPECTED_FIELD_MISSING error for missing expected fields
                    additionalProperties: false
                    properties:
                      code:
                        type: string
                        description: Error code for missing expected field
                        enum:
                          - EXPECTED_FIELD_MISSING
                      details:
                        type: object
                        description: Details about missing expected fields
                        additionalProperties: false
                        properties:
                          expected_fields:
                            type: array
                            maxItems: 10
                            description: List of fields that were expected but missing
                            items:
                              type: object
                              description: Field location details
                              additionalProperties: false
                              properties:
                                api_name:
                                  type: string
                                  description: API name of the expected field
                                  minLength: 1
                                  maxLength: 50
                                json_path:
                                  type: string
                                  description: JSONPath location where field was expected
                                  minLength: 1
                                  maxLength: 100
                              required:
                                - api_name
                                - json_path
                            minItems: 1
                        required:
                          - expected_fields
                      message:
                        type: string
                        description: Represents the error message.
                        minLength: 1
                        maxLength: 1000
                      status:
                        type: string
                        description: Status indicator for error
                        enum:
