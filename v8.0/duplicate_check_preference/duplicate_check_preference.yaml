    put:
      summary: Update Duplicate Check Preference
      description: >-
        Update Duplicate Check Preference API is used to update duplicate check
        settings for a specific module in the CRM system. It allows users to
        define how duplicate records are identified and managed based on field
        mappings between the current module and a mapped module, such as
        Contacts. This API helps maintain data integrity by preventing the
        creation of duplicate records during data entry or import processes.
      security:
        - OAuth2:
            - ZohoCRM.settings.duplicate_check_preference.UPDATE
      operationId: updateDuplicateCheckPreference
      parameters:
        - $ref: '#/components/parameters/Module'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: >-
                Represents the request payload used to update duplicate check
                preference.
              additionalProperties: false
              properties:
                duplicate_check_preference:
                  type: object
                  description: Duplicate Check Preference details
                  additionalProperties: false
                  properties:
                    type:
                      type: string
                      description: Type of duplicate check preference
                      enum:
                        - mapped_module_records
                        - converted_records
                    type_configurations:
                      type: array
                      description: Type configurations for duplicate check preference
                      maxItems: 1
                      items:
                        type: object
                        description: Type configuration details
                        additionalProperties: false
                        properties:
                          field_mappings:
                            description: >-
                              Field mappings between the current module and the
                              mapped module
                            type: array
                            items:
                              type: object
                              description: Field mapping details
                              additionalProperties: false
                              properties:
                                current_field:
                                  type: object
                                  description: >-
                                    Unique field in the current module to match
                                    on
                                  additionalProperties: false
                                  properties:
                                    id:
                                      description: >-
                                        Field id of the current module field.
                                        The mapping is stored against this id,
                                        so it is mandatory.
                                      x-zs-$ref:
                                        resource: fields
                                        origins:
                                          - operationId: getFields
                                            propertyId: FieldsId
                                          - operationId: getFieldsWithID
                                            propertyId: FieldsId
                                      type: string
                                      format: int64
                                      example: '1385208000000973001'
                                    api_name:
                                      description: >-
                                        API name of the current module field.
                                        Validated when supplied, but the mapping
                                        is stored against id.
                                      x-zs-$ref:
                                        resource: fields
                                        origins:
                                          - operationId: getFields
                                            propertyId: FieldsApiName
                                          - operationId: getFieldsWithID
                                            propertyId: FieldsApiName
                                      type: string
                                      example: api_name30
                                      maxLength: 50
                                      pattern: ^[A-Za-z][A-Za-z0-9_]*$
                                    name:
                                      type: string
                                      description: >-
                                        Accepted for symmetry with the response
                                        and ignored by the API.
                                      maxLength: 50
                                  required:
                                    - id
                                mapped_field:
                                  type: object
                                  description: >-
                                    Unique field in the mapped module to match
                                    against
                                  additionalProperties: false
                                  properties:
                                    id:
                                      description: >-
                                        Represents the ID of the mapped field.
                                        The mapping is stored against this id,
                                        so it is mandatory.
                                      x-zs-$ref:
                                        resource: fields
                                        origins:
                                          - operationId: getFields
                                            propertyId: FieldsId
                                          - operationId: getFieldsWithID
                                            propertyId: FieldsId
                                      type: string
                                      format: int64
                                      example: '1385208000000973001'
                                    api_name:
                                      description: >-
                                        Mapped field API name. Validated when
                                        supplied, but the mapping is stored
                                        against id.
                                      x-zs-$ref:
                                        resource: fields
                                        origins:
                                          - operationId: getFields
                                            propertyId: FieldsApiName
                                          - operationId: getFieldsWithID
                                            propertyId: FieldsApiName
                                      type: string
                                      example: api_name30
                                      maxLength: 50
                                      pattern: ^[A-Za-z][A-Za-z0-9_]*$
                                    name:
                                      type: string
                                      description: >-
                                        Accepted for symmetry with the response
                                        and ignored by the API.
                                      maxLength: 50
                                    selected:
                                      type: string
                                      description: >-
                                        Send None to delete the existing mapping
                                        for this current_field. Any other value,
                                        or omitting the property, adds or
                                        updates the mapping.
                                      enum:
                                        - None
                                      maxLength: 4
                                  required:
                                    - id
                              required:
                                - current_field
                                - mapped_field
                          mapped_module:
                            type: object
                            description: Mapped module details
                            additionalProperties: false
                            properties:
                              id:
                                description: >-
                                  Represents the ID of the mapped module. The
                                  module must resolve to Contacts.
                                x-zs-$ref:
                                  resource: modules
                                  origins:
                                    - operationId: getModules
                                      propertyId: ModulesId
                                type: string
                                format: int64
                              name:
                                type: string
                                description: >-
                                  Accepted for symmetry with the response and
                                  ignored by the API.
                                maxLength: 50
                              api_name:
                                description: >-
                                  Mapped module API name. Validated when
                                  supplied, but the module is resolved from id.
                                x-zs-$ref:
                                  resource: modules
                                  origins:
                                    - operationId: getModules
                                      propertyId: ModulesApiName
                                type: string
                                maxLength: 50
                            required:
                              - id
                        required:
                          - field_mappings
                          - mapped_module
                  required:
                    - type
                    - type_configurations
              required:
                - duplicate_check_preference
            examples:
              DuplicateCheckPreferenceForContacts:
                summary: Duplicate check preference for Contacts
                value:
                  duplicate_check_preference:
                    type: mapped_module_records
                    type_configurations:
                      - field_mappings:
                          - mapped_field:
                              api_name: Phone
                              name: Contacts
                              id: '1124664000000000457'
                            current_field:
                              api_name: Phone
                              name: Leads
                              id: '1124664000000000565'
                        mapped_module:
                          api_name: Contacts
                          name: Contacts
                          id: '1124664000000000129'
                description: >-
                  Shows an update duplicate check preference request that
                  changes the mapped-module configuration by mapping the Phone
                  field between Leads and Contacts.
              DuplicateCheckPreferenceForConvertedLead:
                summary: Duplicate check preference for converted Leads
                value:
                  duplicate_check_preference:
                    type: converted_records
                    type_configurations: []
                description: >-
                  Shows an update duplicate check preference request that sets
                  the duplicate check type to converted_records for Leads.
        required: true
        description: >-
          The request body must contain the duplicate_check_preference object.
          To update mapped_module_records, you must include type_configurations
          with the field_mappings array and the mapped_module details.
      responses:
        '200':
          description: >-
            Returns a success response confirming that the API updated the
            duplicate check preference.
          content:
            application/json:
              schema:
                type: object
                description: >-
                  Represents the success response returned after the API updates
                  the duplicate check preference.
                additionalProperties: false
                properties:
                  duplicate_check_preference:
                    type: object
                    description: Duplicate Check Preference update response
                    additionalProperties: false
                    properties:
                      code:
                        type: string
                        description: Response code for successful update
                        enum:
                          - SUCCESS
                      status:
                        type: string
                        description: Status of the update operation
                        enum:
                          - success
                      message:
                        type: string
                        description: Represents the message regarding the update operation.
                        maxLength: 1000
                      details:
                        type: object
                        description: Additional details about the update operation
                        additionalProperties: true
                required:
                  - duplicate_check_preference
                x-zs-$id: UpdateDuplicateCheckPreferenceSuccess
              examples:
                DuplicateCheckPreferenceForContacts:
                  summary: Duplicate check preference for Contacts
                  value:
                    duplicate_check_preference:
                      code: SUCCESS
                      details: {}
                      message: >-
                        Updated fieldMapping for mapped_module_records
                        successfully.
                      status: success
                  description: >-
                    Returns a success response confirming that the API updated
                    duplicate checking for mapped_module_records successfully.
        '400':
          description: >-
            The request could not be processed because the duplicate check
