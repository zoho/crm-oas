components:
  parameters:
    Module:
      name: module
      description: >-
        Represents the module whose Duplicate Check Preference details you want
        to retrieve.  Supported module: Leads.
      in: query
      required: true
      schema:
        type: string
        enum:
          - Leads
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://accounts.zoho.com/oauth/v2/auth
          tokenUrl: https://accounts.zoho.com/oauth/v2/token
          refreshUrl: https://accounts.zoho.com/oauth/v2/token
          scopes:
            ZohoCRM.settings.duplicate_check_preference.ALL: Full access to Duplicate Check Preference
            ZohoCRM.settings.duplicate_check_preference.READ: Read access to Duplicate Check Preference
            ZohoCRM.settings.duplicate_check_preference.CREATE: Create access to Duplicate Check Preference
            ZohoCRM.settings.duplicate_check_preference.UPDATE: Update access to Duplicate Check Preference
            ZohoCRM.settings.duplicate_check_preference.DELETE: Delete access to Duplicate Check Preference
  schemas:
    GetDuplicateCheckPreference:
      type: object
      description: Schema for getting duplicate check preference.
      additionalProperties: false
      properties:
        duplicate_check_preference:
          type: object
          description: Duplicate check preference details.
          additionalProperties: false
          properties:
            type:
              type: string
              description: Type of duplicate check preference.
              enum:
                - converted_records
                - mapped_module_records
            type_configurations:
              type:
                - array
                - 'null'
              description: Configurations for the duplicate check preference type
              maxItems: 1
              items:
                type: object
                description: Type configuration details.
                additionalProperties: false
                properties:
                  field_mappings:
                    type: array
                    description: Field mappings for duplicate check.
                    items:
                      type: object
                      description: Field mapping details.
                      additionalProperties: false
                      properties:
                        current_field:
                          type: object
                          description: Current field details.
                          additionalProperties: false
                          properties:
                            id:
                              type: string
                              description: >-
                                Represents the unique identifier of the field.
                                Use the [Get Fields Metadata
                                API](fields.json#$.paths./settings/fields.get)
                                to retrieve the unique ID fields.
                              maxLength: 50
                            api_name:
                              type: string
                              description: >-
                                Represents the API name of the unique field in
                                the Leads module. Use the [Get Fields Metadata
                                API](fields.json#$.paths./settings/fields.get)
                                to retrieve the API names of the unique fields.
                              maxLength: 50
                            name:
                              type: string
                              description: >-
                                Represents the module that the field belongs to,
                                not the field's own display name. The API
                                returns `Leads` for `current_field` and
                                `Contacts` for `mapped_field`.
                              maxLength: 50
                          required:
                            - id
                            - api_name
                            - name
                        mapped_field:
                          type: object
                          description: Mapped field details.
                          additionalProperties: false
                          properties:
                            id:
                              type: string
                              description: >-
                                Represents the unique identifier of the mapped
                                field.
                              maxLength: 50
                            api_name:
                              type: string
                              description: Represents the API name of the mapped field.
                              maxLength: 50
                            name:
                              type: string
                              description: >-
                                Represents the module that the mapped field
                                belongs to, not the field's own display name.
                                The API returns `Contacts`.
                              maxLength: 50
                          required:
                            - id
                            - api_name
                            - name
                      required:
                        - current_field
                        - mapped_field
                  mapped_module:
                    type: object
                    description: Represents the mapped module details.
                    additionalProperties: false
                    properties:
                      id:
                        type: string
                        description: Represents the unique identifier of the module.
                        maxLength: 50
                      api_name:
                        type: string
                        description: Represents the API name of the module.
                        enum:
                          - Contacts
                      name:
                        type: string
                        description: Represents the display name of the module.
                        enum:
                          - Contacts
                    required:
                      - id
                      - api_name
                      - name
                required:
                  - field_mappings
                  - mapped_module
          required:
            - type
            - type_configurations
      required:
        - duplicate_check_preference
      x-zs-$id: GetDuplicateCheckPreference2
    CreateDuplicateCheckPreferenceRequest:
      type: object
      description: >-
        Represents the request payload used to create duplicate check
        preference.
      additionalProperties: false
      properties:
        duplicate_check_preference:
          type: object
          description: Duplicate check preference details.
          additionalProperties: false
          properties:
            type:
              type: string
              description: Type of duplicate check preference.
              enum:
                - converted_records
                - mapped_module_records
            type_configurations:
              type:
                - array
                - 'null'
              description: >-
                Configurations for the duplicate check preference type.
                Mandatory when type is mapped_module_records and ignored when
                type is converted_records. Only the first entry is processed.
              maxItems: 1
              items:
                type: object
                description: Type configuration details.
                additionalProperties: false
                properties:
                  field_mappings:
                    type: array
                    description: Field mappings for duplicate check.
                    items:
                      type: object
                      description: Field mapping details.
                      additionalProperties: false
                      properties:
                        current_field:
                          type: object
                          description: Unique field in the Leads module to match on.
                          additionalProperties: false
                          properties:
                            id:
                              type: string
                              description: >-
                                Represents the unique identifier of the field.
                                Use the [Get Fields Metadata
                                API](fields.json#$.paths./settings/fields.get)
                                to retrieve the unique ID fields. The mapping is
                                stored against this id, so it is mandatory.
                              maxLength: 50
                            api_name:
                              type: string
                              description: >-
                                Represents the API name of the unique field in
                                the Leads module. Validated when supplied, but
                                the mapping is stored against id.
                              maxLength: 50
                            name:
                              type: string
                              description: >-
                                Accepted for symmetry with the response and
                                ignored by the API.
                              maxLength: 50
                          required:
                            - id
                        mapped_field:
                          type: object
                          description: Unique field in the mapped module to match against.
                          additionalProperties: false
                          properties:
                            id:
                              type: string
                              description: >-
                                Represents the unique identifier of the mapped
                                field. The mapping is stored against this id, so
                                it is mandatory.
                              maxLength: 50
                            api_name:
                              type: string
                              description: >-
                                Represents the API name of the mapped field.
                                Validated when supplied, but the mapping is
                                stored against id.
                              maxLength: 50
                            name:
                              type: string
                              description: >-
                                Accepted for symmetry with the response and
                                ignored by the API.
                              maxLength: 50
                            selected:
                              type: string
                              description: >-
                                Send None to skip this field mapping. Any other
                                value, or omitting the property, creates the
                                mapping.
                              enum:
                                - None
                              maxLength: 4
                          required:
                            - id
                      required:
                        - current_field
                        - mapped_field
                  mapped_module:
                    type: object
                    description: >-
                      Represents the mapped module details. Mandatory when type
                      is mapped_module_records.
                    additionalProperties: false
                    properties:
                      id:
                        type: string
                        description: >-
                          Represents the unique identifier of the module. The
                          module must resolve to Contacts.
                        maxLength: 50
                      api_name:
                        type: string
                        description: >-
                          Represents the API name of the module. Validated when
                          supplied, but the module is resolved from id.
                        enum:
                          - Contacts
                      name:
                        type: string
                        description: >-
                          Accepted for symmetry with the response and ignored by
                          the API.
                        maxLength: 50
                    required:
                      - id
                required:
                  - field_mappings
                  - mapped_module
          required:
            - type
      required:
        - duplicate_check_preference
      x-zs-$id: CreateDuplicateCheckPreferenceRequest
