                          - error
                        description: Error status indicator.
                      code:
                        type: string
                        enum:
                          - REQUIRED_PARAM_MISSING
                        description: Represents the error code for request-level failures.
                      message:
                        type: string
                        enum:
                          - One of the expected parameter is missing
                        description: Human-readable error message.
                      details:
                        type: object
                        additionalProperties: false
                        description: Contextual error details including field location.
                        properties:
                          param_name:
                            type: string
                            maxLength: 10
                            description: >-
                              Represents the param_name that caused the error,
                              for example, module.
                        required:
                          - param_name
                    required:
                      - status
                      - code
                      - message
                      - details
                    x-zs-$id: DuplicateCheckPreferenceRequiredparammissingObject
                  - type: object
                    description: >-
                      Request-level error format (returned when feature not
                      supported).
                    additionalProperties: false
                    properties:
                      status:
                        type: string
                        enum:
                          - error
                        description: Error status indicator.
                      code:
                        type: string
                        enum:
                          - FEATURE_NOT_SUPPORTED
                        description: Represents the error code for request-level failures.
                      message:
                        type: string
                        enum:
                          - Your License does not support this feature.
                        description: Represents the error message.
                      details:
                        type: object
                        additionalProperties: false
                        description: Contextual error details including field location.
                    required:
                      - code
                      - message
                      - details
                      - status
                    x-zs-$id: DuplicateCheckPreferenceFeaturenotsupportedObject
                  - type: object
                    description: >-
                      Request-level error format (returned when feature not
                      supported).
                    additionalProperties: false
                    properties:
                      code:
                        type: string
                        enum:
                          - NOT_SUPPORTED
                        description: Represents the error code for request-level failures.
                      message:
                        type: string
