                    required:
                      - code
                      - details
                      - message
                      - status
                  - type: object
                    x-zs-$id: InvalidDataError
                    description: INVALID_DATA error for data validation failures
                    additionalProperties: false
                    properties:
                      code:
                        type: string
                        description: Error code indicating invalid or malformed data
                        enum:
                          - INVALID_DATA
                      details:
                        type: object
                        description: Error details with field information
                        additionalProperties: false
                        properties:
                          maximum_length:
                            type: integer
                            format: int32
                            description: Maximum allowed length for the field
                          expected_data_type:
                            type: string
                            maxLength: 50
                            description: Expected data type for the field
                          api_name:
                            type: string
                            description: Name of the field with invalid data
                            maxLength: 50
                          json_path:
                            type: string
                            description: >-
                              JSONPath expression locating the invalid field in
                              the request
                            maxLength: 100
                      message:
                        type: string
                        description: >-
                          Represents the error message describing the invalid
                          data.
                        maxLength: 1000
                      status:
                        type: string
                        description: Error status indicator
                        enum:
                          - error
                    required:
                      - code
                      - details
                      - message
                      - status
                  - type: object
                    x-zs-$id: NotAllowedError
                    description: NOT_ALLOWED error for operations that are not permitted
                    additionalProperties: false
                    properties:
                      code:
                        type: string
                        description: Error code indicating operation is not allowed
                        enum:
                          - NOT_ALLOWED
                      details:
                        type: object
                        description: Error details with field location information
                        additionalProperties: false
                        properties:
                          api_name:
                            type: string
                            description: Name of the field or operation that is not allowed
                            maxLength: 50
                          json_path:
                            type: string
                            description: >-
                              JSONPath expression locating the not-allowed field
                              or operation
                            maxLength: 100
                        required:
                          - api_name
                          - json_path
                      message:
                        type: string
                        description: >-
                          Represents the error message explaining what is not
                          allowed.
                        maxLength: 1000
                      status:
                        type: string
                        description: Error status indicator
                        enum:
                          - error
                    required:
                      - code
                      - details
                      - message
                      - status
                  - type: object
                    description: INVALID_MODULE error for unsupported operations
                    additionalProperties: false
                    properties:
                      code:
                        type: string
                        description: Error code for unsupported operation
                        enum:
                          - INVALID_MODULE
                      details:
                        type: object
                        description: Additional error details (typically empty)
                        additionalProperties: false
                        properties:
                          param_name:
                            type: string
                            maxLength: 10
                            description: >-
                              Represents the param_name that caused the error,
                              for example, module.
                      message:
                        type: string
                        description: Represents the error message.
                        minLength: 1
                        maxLength: 1000
                      status:
                        type: string
                        description: Status indicator for error
                        enum:
                          - error
                    required:
                      - code
                      - details
                      - message
                      - status
                    x-zs-$id: DuplicateCheckPreferenceInvalidmoduleObject
                  - type: object
                    description: DEPENDENT_FIELD_MISSING error for unsupported operations
                    additionalProperties: false
                    properties:
                      code:
                        type: string
                        description: Error code for unsupported operation
                        enum:
                          - DEPENDENT_FIELD_MISSING
                      details:
                        type: object
                        description: Additional error details (typically empty)
                        additionalProperties: false
                        properties:
                          dependee:
                            type: object
                            description: >-
                              Represents the param_name that caused the error,
                              for example, module.
                            additionalProperties: false
                            properties:
                              api_name:
                                type: string
                                maxLength: 50
                                description: API name of the dependee field
                              json_path:
                                type: string
                                maxLength: 100
                                description: JSON path of the dependee field
                            required:
                              - api_name
                              - json_path
                          api_name:
                            type: string
                            maxLength: 50
                            description: API name of the dependee field
                          json_path:
                            type: string
                            maxLength: 100
                            description: JSON path of the dependee field
                      message:
                        type: string
                        description: Represents the error message.
                        minLength: 1
                        maxLength: 1000
                      status:
                        type: string
                        description: Status indicator for error
                        enum:
                          - error
                    required:
                      - code
                      - details
                      - message
                      - status
                    x-zs-$id: DuplicateCheckPreferenceDependentfieldmissingObject
                  - type: object
                    x-zs-$id: CreateDuplicateCheckPreferenceWrappedFieldError
                    additionalProperties: false
                    description: >-
                      Field-level error wrapped under duplicate_check_preference
                      root key
                    properties:
                      duplicate_check_preference:
                        type: object
                        additionalProperties: false
                        description: Error details for the duplicate_check_preference field
                        properties:
                          code:
                            type: string
                            enum:
                              - MANDATORY_NOT_FOUND
                              - INVALID_DATA
                              - DEPENDENT_FIELD_MISSING
                              - EXPECTED_FIELD_MISSING
                              - NOT_ALLOWED
                              - DUPLICATE_DATA
                            description: Error code for the field-level error
                          details:
                            type: object
                            additionalProperties: false
                            description: Error context including field path
                            properties:
                              api_name:
                                type: string
                                maxLength: 100
                                description: API name of the field that caused the error
                              json_path:
                                type: string
                                maxLength: 500
                                description: JSON path to the field that caused the error
                              expected_data_type:
                                type: string
                                maxLength: 500
                                description: >-
                                  Expected data type for the field that caused
                                  the error
                              expected_fields:
                                type: array
                                maxItems: 10
                                description: List of fields that were expected but missing
                                items:
                                  type: object
                                  additionalProperties: false
                                  description: Field location details
                                  properties:
                                    api_name:
                                      type: string
                                      description: API name of the expected field
                                      minLength: 1
                                      maxLength: 50
                                    json_path:
                                      type: string
                                      description: >-
                                        JSONPath location where field was
                                        expected
                                      minLength: 1
                                      maxLength: 100
                                  required:
                                    - api_name
                                    - json_path
                              dependee:
                                type: object
                                additionalProperties: false
                                description: Error context including field path
                                properties:
                                  api_name:
                                    type: string
                                    description: API name of the expected field
                                    minLength: 1
                                    maxLength: 50
                                  json_path:
                                    type: string
                                    description: JSONPath location where field was expected
                                    minLength: 1
                                    maxLength: 100
                          message:
                            type: string
                            maxLength: 1000
                            description: Human-readable error message
                          status:
                            type: string
                            enum:
                              - error
                            description: Error status indicator
                        required:
                          - code
                          - details
                          - message
                          - status
                    required:
                      - duplicate_check_preference
              examples:
