openapi: 3.1.0
info:
  title: Duplicate Check Preference
  description: duplicate check preference api
  version: '8'
servers:
  - url: https://zohoapis.{dc}/crm/{version}
    description: Represents the API Server URL
    variables:
      dc:
        enum:
          - com
          - eu
          - in
          - cn
          - au
        default: com
        description: Represents the API Server URL TLD
      version:
        default: v8
        description: Represents the API Version
paths:
  /settings/duplicate_check_preference:
    get:
      summary: Get Duplicate Check Preference
      description: >-
        To retrieve the duplicate check preference configured for the Leads
        module in your Zoho CRM organization.
      security:
        - OAuth2:
            - ZohoCRM.settings.duplicate_check_preference.READ
      operationId: getDuplicateCheckPreference
      parameters:
        - $ref: '#/components/parameters/Module'
      responses:
        '200':
          description: >-
            Returns the duplicate check preference configured for the specified
            module.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetDuplicateCheckPreference'
                x-zs-$id: GetDuplicateCheckPreference
              examples:
                DuplicateCheckPreferenceForContacts:
                  summary: Duplicate check preference for Contacts
                  value:
                    duplicate_check_preference:
                      type: mapped_module_records
                      type_configurations:
                        - field_mappings:
                            - mapped_field:
                                api_name: Phone
                                name: Contacts
                                id: '1124664000000000457'
                              current_field:
                                api_name: Phone
                                name: Leads
                                id: '1124664000000000565'
                          mapped_module:
                            api_name: Contacts
                            name: Contacts
                            id: '1124664000000000129'
                  description: >-
                    Shows a get duplicate check preference response for the
                    mapped_module_records type, including the field mappings
                    between Leads and Contacts.
                DuplicateCheckPreferenceForConvertedLead:
                  summary: Duplicate check preference for converted Leads
                  value:
                    duplicate_check_preference:
                      type: converted_records
                      type_configurations: []
                  description: >-
                    Shows a get duplicate check preference response for the
                    converted_records type with no type_configurations entries.
        '204':
          description: >-
            Indicates that duplicate check preference is not enabled for the
            specified module.
        '400':
          description: Bad Request - Invalid or missing parameters
          content:
            application/json:
              schema:
                x-zs-$id: GetDuplicateCheckPreference400Response
                oneOf:
                  - type: object
                    x-zs-$id: GetDuplicateCheckPreferenceRequiredParamMissingError
                    additionalProperties: false
                    description: Error when required parameter is missing
                    properties:
                      code:
                        type: string
                        enum:
                          - REQUIRED_PARAM_MISSING
                        description: Error code
                      details:
                        type: object
                        additionalProperties: false
                        description: Additional error context
                        properties:
                          param_name:
                            type: string
                            maxLength: 50
                            description: Missing parameter name
                      message:
                        type: string
                        maxLength: 1000
                        description: Human-readable error message
                      status:
                        type: string
                        enum:
                          - error
                        description: Error status indicator
                    required:
                      - code
                      - details
                      - message
                      - status
                  - type: object
                    x-zs-$id: GetDuplicateCheckPreferenceInvalidModuleError
                    additionalProperties: false
                    description: Error when the module is invalid
                    properties:
                      code:
                        type: string
                        enum:
                          - INVALID_MODULE
                        description: Error code
                      details:
                        type: object
                        additionalProperties: false
                        description: Additional error context
                        properties:
                          param_name:
                            type: string
                            maxLength: 50
                            description: Invalid parameter name
                      message:
                        type: string
                        maxLength: 1000
                        description: Human-readable error message
                      status:
                        type: string
                        enum:
                          - error
                        description: Error status indicator
                    required:
                      - code
                      - details
                      - message
                      - status
                  - type: object
                    x-zs-$id: GetDuplicateCheckPreferenceNotSupportedError
                    additionalProperties: false
                    description: Error when the module is not supported for this API
                    properties:
                      code:
                        type: string
                        enum:
                          - NOT_SUPPORTED
                        description: Error code
                      details:
                        type: object
                        additionalProperties: false
                        description: Additional error context
                        properties:
                          param_name:
                            type: string
                            maxLength: 50
                            description: Name of the unsupported parameter
                      message:
                        type: string
                        maxLength: 1000
                        description: Human-readable error message
                      status:
                        type: string
                        enum:
                          - error
                        description: Error status indicator
                    required:
                      - code
                      - details
                      - message
                      - status
              examples:
                RequiredParamMissing:
                  value:
                    code: REQUIRED_PARAM_MISSING
                    details:
                      param_name: module
                    message: One of the expected parameter is missing
                    status: error
                InvalidModule:
                  value:
                    code: INVALID_MODULE
                    details:
                      param_name: module
                    message: the module name given seems to be invalid
                    status: error
                NotSupported:
                  value:
                    code: NOT_SUPPORTED
                    details:
                      param_name: module
                    message: the given module is not supported for this api
                    status: error
        '403':
          description: No permission to perform this operation
          content:
            application/json:
              schema:
                type: object
                x-zs-$id: NoPermissionErrorResponse
                additionalProperties: false
                description: No permission error response
                properties:
                  code:
                    type: string
                    enum:
                      - NO_PERMISSION
                    description: Error code indicating permission denied
                  details:
                    type: object
                    additionalProperties: false
                    description: Additional error details
                    properties:
                      permissions:
                        type: array
                        description: List of required permissions
                        maxItems: 25
                        items:
                          type: string
                          description: Permission name required to access this resource
                          maxLength: 255
                  message:
                    type: string
                    maxLength: 1000
                    description: Human-readable error message
                  status:
                    type: string
                    enum:
                      - error
                    description: Status indicator for error
                required:
                  - code
                  - details
                  - message
                  - status
              examples:
                NoPermission:
                  value:
                    code: NO_PERMISSION
                    details: {}
                    message: You don't have permission to perform this operation
                    status: error
    post:
      summary: Create Duplicate Check Preference
      description: >-
        To enable duplicate check preference for the Leads module in your Zoho
        CRM organization.
      security:
        - OAuth2:
            - ZohoCRM.settings.duplicate_check_preference.CREATE
      operationId: createDuplicateCheckPreference
      parameters:
        - $ref: '#/components/parameters/Module'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDuplicateCheckPreferenceRequest'
            examples:
              DuplicateCheckPreferenceForContacts:
                summary: Duplicate check preference for Contacts
                value:
                  duplicate_check_preference:
                    type: mapped_module_records
                    type_configurations:
                      - field_mappings:
                          - mapped_field:
                              api_name: Phone
                              name: Contacts
                              id: '1124664000000000457'
                            current_field:
                              api_name: Phone
                              name: Leads
                              id: '1124664000000000565'
                        mapped_module:
                          api_name: Contacts
                          name: Contacts
                          id: '1124664000000000129'
                description: >-
                  Shows a create duplicate check preference request that enables
                  mapped-module duplicate checking for Leads against Contacts by
                  mapping the Phone field.
              DuplicateCheckPreferenceForConvertedLead:
                summary: Duplicate check preference for converted Leads
                value:
                  duplicate_check_preference:
                    type: converted_records
                    type_configurations: []
                description: >-
                  Shows a create duplicate check preference request that enables
                  duplicate checking for converted Lead records with the
                  converted_records type.
        required: true
        description: >-
          The request body must contain the duplicate_check_preference object.
          Set the type to converted_records or mapped_module_records, and
          include type_configurations when you configure mapped-module duplicate
          checking.
      responses:
        '200':
          description: >-
            Returns a success response confirming that the duplicate check
            preference was enabled.
          content:
            application/json:
              schema:
                description: >-
                  Response wrapper object containing the duplicate check
                  preference details.
                additionalProperties: false
                type: object
                x-zs-$id: CreateDuplicateCheckPreferenceResponse
                properties:
                  duplicate_check_preference:
                    description: Details of the duplicate check preference configuration.
                    additionalProperties: false
                    type: object
                    properties:
                      code:
                        description: Status code indicating the result of the operation.
                        type: string
                        enum:
                          - SUCCESS
                      status:
                        description: Status of the operation.
                        type: string
                        enum:
                          - success
                      message:
                        description: >-
                          Represents the message providing additional
                          information about the operation result.
                        maxLength: 100
                        type: string
                      details:
                        description: Additional details related to the operation.
                        additionalProperties: false
                        type: object
                required:
                  - duplicate_check_preference
              examples:
                DuplicateCheckPreferenceForContacts:
                  summary: Duplicate check preference for Contacts
                  value:
                    duplicate_check_preference:
                      code: SUCCESS
                      details: {}
                      message: >-
                        Duplicate check enabled for mapped_module_records
                        successfully.
                      status: success
                  description: >-
                    Returns a success response confirming that duplicate
                    checking for mapped_module_records was enabled successfully.
                DuplicateCheckPreferenceForConvertedLead:
                  summary: Duplicate check preference for converted Leads
                  value:
                    duplicate_check_preference:
                      code: SUCCESS
                      details: {}
                      message: >-
                        Duplicate check enabled for converted_records
                        successfully.
                      status: success
                  description: >-
                    Returns a success response confirming that duplicate
                    checking for converted_records was enabled successfully.
        '400':
          description: >-
            The request could not be processed because the duplicate check
            preference input is invalid or incomplete.

            **Resolution:** The module query parameter and request body fields
            must contain valid supported values for this API.
          content:
            application/json:
              schema:
                x-zs-$id: DuplicateCheckPreferenceErrorResponse
                oneOf:
                  - type: object
                    x-zs-$id: RequiredParamMissingError
                    description: >-
                      Represents the request-level error format returned when
                      the module parameter is missing or malformed.
                    additionalProperties: false
                    properties:
                      status:
                        type: string
                        enum:
                          - error
                        description: Error status indicator.
                      code:
                        type: string
                        enum:
                          - REQUIRED_PARAM_MISSING
                        description: Represents the error code for request-level failures.
                      message:
                        type: string
                        enum:
                          - One of the expected parameter is missing
                        description: Represents the error message.
                      details:
                        type: object
                        additionalProperties: false
                        description: Contextual error details including field location.
                        properties:
                          param_name:
                            type: string
                            maxLength: 10
                            description: >-
                              Represents the param_name that caused the error,
                              for example, module.
                        required:
                          - param_name
                    required:
                      - status
                      - code
                      - message
                      - details
                  - type: object
                    x-zs-$id: FeatureNotSupportedError
                    description: >-
                      Request-level error format (returned when feature not
                      supported).
                    additionalProperties: false
                    properties:
                      status:
                        type: string
                        enum:
                          - error
                        description: Error status indicator.
                      code:
                        type: string
                        enum:
                          - FEATURE_NOT_SUPPORTED
                        description: Represents the error code for request-level failures.
                      message:
                        type: string
                        enum:
                          - Your License does not support this feature.
                        description: Represents the error message.
                      details:
                        type: object
                        additionalProperties: false
                        description: Contextual error details including field location.
                    required:
                      - code
                      - message
                      - details
                      - status
                  - type: object
                    x-zs-$id: InvalidModuleError
                    description: >-
                      Request-level error format (returned when feature not
                      supported).
                    additionalProperties: false
                    properties:
                      code:
                        type: string
                        enum:
                          - NOT_SUPPORTED
                        description: Represents the error code for request-level failures.
                      message:
                        type: string
                        maxLength: 1000
                        description: Human-readable error message.
                      details:
                        type: object
                        additionalProperties: false
                        description: Contextual error details including field location.
                        properties:
                          param_name:
                            type: string
                            maxLength: 50
                            description: >-
                              Represents the param_name that caused the error,
                              for example, module.
                          api_name:
                            type: string
                            maxLength: 50
                            description: API name of the field with invalid data.
                          json_path:
                            type: string
                            maxLength: 100
                            description: JSONPath to the location of the invalid field.
                        required:
                          - param_name
                      status:
                        type: string
                        enum:
                          - error
                        description: Status indicator for error.
                    required:
                      - code
                      - message
                      - details
                      - status
                  - type: object
                    x-zs-$id: AlreadyConfiguredError
                    description: >-
                      Request-level error format (returned when feature not
                      supported).
                    additionalProperties: false
                    properties:
                      code:
                        type: string
                        enum:
                          - ALREADY_CONFIGURED
                        description: Represents the error code for request-level failures.
                      message:
                        type: string
                        enum:
                          - already configured.
                        description: Represents the error message.
                      details:
                        type: object
                        additionalProperties: false
                        description: Contextual error details including field location.
                      status:
                        type: string
                        enum:
                          - error
                        description: Status indicator for error.
                    required:
                      - code
                      - message
                      - status
                  - type: object
                    x-zs-$id: AmbiguityDuringProcessingError
                    description: >-
                      AMBIGUITY_DURING_PROCESSING error response when
                      conflicting parameters are provided (ids + api_names, or
                      type + restricted_action).
                    additionalProperties: false
                    properties:
                      code:
                        type: string
                        description: Error code indicating parameter ambiguity.
                        enum:
                          - AMBIGUITY_DURING_PROCESSING
                      details:
                        type: object
                        description: Details about the ambiguous parameters.
                        additionalProperties: false
                        properties:
                          ambiguity_due_to:
                            type: array
                            maxItems: 2
                            description: >-
                              Array of conflicting parameters that caused the
                              ambiguity.
                            items:
                              type: object
                              description: Parameter that contributed to the ambiguity.
                              additionalProperties: false
                              properties:
                                api_name:
                                  type: string
                                  maxLength: 10
                                  description: >-
                                    Represents the API field name that caused
                                    the error, for example, tab_groups.
                                json_path:
                                  type: string
                                  maxLength: 100
                                  description: >-
                                    Represents the JSONPath expression locating
                                    the error, for example, $.tab_groups.
                              required:
                                - api_name
                                - json_path
                        required:
                          - ambiguity_due_to
                      message:
                        type: string
                        description: Represents the error message explaining the ambiguity.
                        maxLength: 1000
                      status:
                        type: string
                        description: Error status indicator.
                        enum:
                          - error
                    required:
                      - code
                      - details
                      - message
                      - status
                  - type: object
                    x-zs-$id: MandatoryNotFoundError
                    description: MANDATORY_NOT_FOUND error when required fields are missing
                    additionalProperties: false
                    properties:
                      code:
                        type: string
                        description: Error code indicating a mandatory field is missing
                        enum:
                          - MANDATORY_NOT_FOUND
                      details:
                        type: object
                        description: Error details with field location information
                        additionalProperties: false
                        properties:
                          api_name:
                            type: string
                            maxLength: 50
                            description: Name of the required field that is missing
                          json_path:
                            type: string
                            description: >-
                              JSONPath expression locating where the field
                              should be in the request
                            maxLength: 100
                        required:
