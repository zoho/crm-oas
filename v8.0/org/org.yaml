openapi: 3.1.0
info:
  title: Org
  description: >-
    Organization details represent the company-level configuration for a Zoho
    CRM account, including identity, localization, license, and administrative
    metadata. This API enables developers to retrieve the organization details
    for the CRM account.
  version: '8'
servers:
  - url: https://zohoapis.{dc}/crm/{version}
    description: >-
      Production API server for the Organization API. Sample request URL:
      `https://zohoapis.{dc}/crm/{version}`
    variables:
      dc:
        enum:
          - com
          - eu
          - in
          - cn
          - au
        default: com
        description: >-
          The top-level domain for the Zoho API server.

          Possible values: **com**, **eu**, **in**, **cn**, **au**. Default:
          **com**.
      version:
        default: v8
        description: 'The API version for the request. Default: **v8**.'
paths:
  /org:
    get:
      operationId: getOrganization
      summary: Get organization details
      description: >-
        To retrieve the organization details associated with your Zoho CRM
        account.
      security:
        - OAuth2:
            - ZohoCRM.org.READ
      responses:
        '200':
          description: Returns the organization details for the CRM account.
          content:
            application/json:
              schema:
                type: object
                x-zs-$id: OrgGetResponse
                description: >-
                  Contains the organization details returned by the Get
                  Organization operation.
                properties:
                  org:
                    description: Represents the list of organization details.
                    type: array
                    maxItems: 1
                    items:
                      description: >-
                        Represents the organization details for the Zoho CRM
                        account, including company information, operational
                        settings, and license details.
                      allOf:
                        - $ref: '#/components/schemas/OrgDetails'
                      required:
                        - country
                        - photo_id
                        - city
                        - description
                        - type
                        - created_time
                        - mc_status
                        - gapps_enabled
                        - translation_enabled
                        - street
                        - domain_name
                        - alias
                        - currency
                        - id
                        - employee_count
                        - state
                        - fax
                        - zip
                        - website
                        - currency_symbol
                        - mobile
                        - currency_locale
                        - primary_zuid
                        - zia_portal_id
                        - time_zone
                        - zgid
                        - country_code
                        - deletable_org_account
                        - license_details
                        - hierarchy_preferences
                        - phone
                        - company_name
                        - privacy_settings
                        - primary_email
                        - iso_code
                        - hipaa_compliance_enabled
                        - lite_users_enabled
                      unevaluatedProperties: false
                additionalProperties: false
                required:
                  - org
              examples:
                OrgGetResponse:
                  summary: Successful retrieval of organization details
                  value:
                    org:
                      - country: US
                        photo_id: null
                        city: Austin
                        description: Main office
                        type: production
                        created_time: '2023-01-01T12:00:00Z'
                        mc_status: true
                        gapps_enabled: false
                        translation_enabled: false
                        street: 123 Main St
                        domain_name: acmeinc
                        alias: acme
                        currency: US Dollar - USD
                        id: '1234567890'
                        employee_count: '100'
                        state: TX
                        fax: null
                        zip: '78701'
                        website: www.acmeinc.com
                        currency_symbol: $
                        mobile: null
                        currency_locale: USD
                        primary_zuid: zuid123
                        zia_portal_id: null
                        time_zone: America/Chicago
                        zgid: zgid123
                        country_code: US
                        deletable_org_account: false
                        license_details:
                          paid_expiry: null
                          users_license_purchased: 3
                          trial_type: enterprise
                          trial_expiry: '2025-12-04T17:26:17+05:30'
                          paid: false
                          paid_type: free
                          portal_users_license_purchased: 0
                          trial_action: Update Evaluation
                        hierarchy_preferences:
                          type: Role_Hierarchy
                          strictly_reporting: false
                        phone: '+915551234'
                        company_name: Acme Inc.
                        privacy_settings: true
                        primary_email: acmeadmin@acmei.com
                        iso_code: US
                        hipaa_compliance_enabled: false
                        lite_users_enabled: false
                        max_per_page: 200
                        ezgid: ezgid123
                        call_icon: show
                        oauth_presence: true
                        zia_zgid: 12345
                        checkin_preferences:
                          restricted_event_types: null
                  description: >-
                    Shows a successful response containing the details of a
                    production organization, including company address, currency
                    settings, and license information.
components:
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://accounts.zoho.com/oauth/v2/auth
          tokenUrl: https://accounts.zoho.com/oauth/v2/token
          refreshUrl: https://accounts.zoho.com/oauth/v2/token
          scopes:
            ZohoCRM.org.READ: Allows reading org details.
            ZohoCRM.org.UPDATE: Allows updating org details.
            ZohoCRM.org.DELETE: Allows deleting the org.
            ZohoCRM.org.CREATE: Allows creating a new org.
  schemas:
    OrgDetails:
      type: object
      description: >-
        Represents the organization details for the Zoho CRM account, including
        company information, currency settings, license details, and hierarchy
        preferences.
      properties:
        country:
          oneOf:
            - type: string
              maxLength: 50
              description: >-
                Represents the country of the organization when a value is
                available.
              x-zs-$id: OrgCountry
            - type: 'null'
              description: >-
                Represents a null value when no country is set for the
                organization.
              x-zs-$id: OrgCountryNull
          description: Represents the country of the organization.
        photo_id:
          readOnly: true
          oneOf:
            - type: string
              description: >-
                Represents the photo ID of the organization's logo when one is
                available. Refer to the [POST - Upload Files to Zoho File System
                (ZFS) API](files.yaml#$.path./files.post) for more details.
              maxLength: 50
              x-zs-$id: OrgPhotoID
            - type: 'null'
              description: >-
                Represents a null value when no logo is set for the
                organization.
              x-zs-$id: OrgPhotoIDNull
          description: >-
            Represents the photo ID of the organization's logo. Refer to [upload
            files
            API](https://www.zoho.com/crm/developer/docs/api/v8/upload-files-to-zfs.html)
            for more details.
        city:
          oneOf:
            - type: string
              maxLength: 50
              description: >-
                Represents the city where the organization is located when a
                value is available.
              x-zs-$id: OrgCity
            - type: 'null'
              description: >-
                Represents a null value when no city is set for the
                organization.
              x-zs-$id: OrgCityNull
          description: Represents the city where the organization is located.
        description:
          oneOf:
            - type: string
              maxLength: 250
              description: >-
                Represents the description of the organization when one is
                provided.
              x-zs-$id: OrgDescription
            - type: 'null'
              description: >-
                Represents a null value when no description is set for the
                organization.
              x-zs-$id: OrgDescriptionNull
          description: Represents the description of the organization.
        type:
          type: string
          enum:
            - bigin
            - production
            - sandbox
            - developer
          description: |-
            Represents the type of the Zoho CRM organization.
            Possible values:
            **bigin** - Bigin organization.
            **production** - Standard production CRM organization.
            **sandbox** - Sandbox organization for testing.
            **developer** - Developer organization.
          readOnly: true
        created_time:
          type: string
          format: date-time
          description: Represents the creation date and time of the organization.
          readOnly: true
        mc_status:
          type:
            - boolean
            - 'null'
          description: |-
            Indicates the multi-currency status of the organization.
            Possible values:
            **true** - Multi-currency is enabled.
            **false** - Multi-currency is not enabled.
          readOnly: true
        gapps_enabled:
          type: boolean
          description: >-
            Indicates whether Google Apps integration is enabled for the
            organization.

            Possible values:

            **true** - Google Apps integration is enabled.

            **false** - Google Apps integration is not enabled.
          readOnly: true
        translation_enabled:
          type: boolean
          description: |-
            Indicates whether translation is enabled for the organization.
            Possible values:
            **true** - Translation is enabled.
            **false** - Translation is not enabled.
          readOnly: true
        street:
          oneOf:
            - type: string
              maxLength: 50
              description: >-
                Represents the street address of the organization when one is
                provided.
              x-zs-$id: OrgStreet
            - type: 'null'
              description: >-
                Represents a null value when no street address is set for the
                organization.
              x-zs-$id: OrgStreetNull
          description: Represents the street address of the organization.
        domain_name:
          type: string
          pattern: '[a-z][a-z0-9]{4,30}'
          maxLength: 30
          description: >-
            Represents the domain name of the organization. For instance,
            org694902300.
        alias:
          oneOf:
            - type: string
              maxLength: 50
              description: Represents the alias of the organization when one is set.
              x-zs-$id: OrgAlias
            - type: 'null'
              description: >-
                Represents a null value when no alias is set for the
                organization.
              x-zs-$id: OrgAliasNull
          description: Represents the alias name of the organization.
        currency:
          type: string
          description: Represents the home currency of the organization.
          maxLength: 30
        id:
          type: string
          description: Represents the unique ID of the organization.
          x-zs-$id: OrgId
          maxLength: 19
          readOnly: true
        employee_count:
          oneOf:
            - type: string
              maxLength: 18
              pattern: '[0-9]+'
              description: >-
                Represents the number of employees in the organization when a
                value is available.
              x-zs-$id: OrgEmployeeCount
            - type: 'null'
              description: >-
                Represents a null value when no employee count is set for the
                organization.
              x-zs-$id: OrgEmployeeCountNull
          description: Represents the number of employees in the organization.
        state:
          oneOf:
            - type: string
              maxLength: 50
              description: >-
                Represents the state or province of the organization when a
                value is available.
              x-zs-$id: OrgState
            - type: 'null'
              description: >-
                Represents a null value when no state is set for the
                organization.
              x-zs-$id: OrgStateNull
          description: Represents the state or province where the organization is located.
        fax:
          oneOf:
            - type: string
              maxLength: 30
              description: >-
                Represents the fax number of the organization when one is
                provided.
              x-zs-$id: OrgFax
            - type: 'null'
              description: >-
                Represents a null value when no fax number is set for the
                organization.
              x-zs-$id: OrgFaxNull
          description: Represents the fax number of the organization.
        zip:
          oneOf:
            - type: string
              maxLength: 20
              description: >-
                Represents the postal code of the organization when one is
                provided.
              x-zs-$id: OrgZip
            - type: 'null'
              description: >-
                Represents a null value when no postal code is set for the
                organization.
              x-zs-$id: OrgZipNull
          description: Represents the postal code of the organization.
        website:
          oneOf:
            - type: string
              maxLength: 50
              pattern: >-
                ^(http:\/\/www.|https:\/\/www.|ftp:\/\/www.|www.|http:\/\/|https:\/\/|ftp:\/\/|){1}[^\x00-\x19\x22-\x27\x2A-\x2C\x2E-\x2F\x3A-\x3F\x5B-\x5E\x60\x7B\x7D-\x7F]+(\.[^\x00-\x19\x22\x24-\x2C\x2E-\x2F\x3C\x3E\x40\x5B-\x5E\x60\x7B\x7D-\x7F]+)+([\/\?].*)*$
              description: >-
                Represents the website URL of the organization when one is
                provided.
              x-zs-$id: OrgWebsite
            - type: 'null'
              description: >-
                Represents a null value when no website is set for the
                organization.
              x-zs-$id: OrgWebsiteNull
          description: Represents the website URL of the organization.
        currency_symbol:
          type: string
          maxLength: 5
          minLength: 1
          description: Represents the currency symbol for the organization's home currency.
        mobile:
          oneOf:
            - type: string
              maxLength: 30
              pattern: ^[+]?([0-9A-Za-z()\.\-\s]){1,30}$
              description: >-
                Represents the mobile phone number of the organization when one
                is provided.
              x-zs-$id: OrgMobile
            - type: 'null'
              description: >-
                Represents a null value when no mobile number is set for the
                organization.
              x-zs-$id: OrgMobileNull
          description: Represents the mobile phone number of the organization.
        currency_locale:
          type: string
          maxLength: 10
          description: >-
            Represents the locale code for the organization's home currency. For
            instance, 'en_IN'.
        primary_zuid:
          oneOf:
            - type: string
              maxLength: 19
              description: >-
                Represents the Zoho user ID (ZUID) of the super admin when one
                is assigned.
              x-zs-$id: OrgPrimaryZuid
            - type: 'null'
              description: >-
                Represents a null value when no super admin is assigned to the
                organization.
              x-zs-$id: OrgPrimaryZuidNull
              readOnly: true
          description: >-
            Represents ZUID of the organization. This is the ID visible in the
            profile details in Zoho CRM UI.
        zia_portal_id:
          oneOf:
            - type: integer
              description: >-
                Represents the Zia portal ID associated with the organization
                when one exists.
              x-zs-$id: OrgZiaPortalId
              format: int32
            - type: 'null'
              description: >-
                Represents a null value when no Zia portal is associated with
                the organization.
              x-zs-$id: OrgZiaPortalIdNull
          description: Represents Zia portal ID of the organization, if configured.
          readOnly: true
        time_zone:
          type: string
          maxLength: 30
          description: Represents the time zone configured for the organization.
        zgid:
          type: string
          description: Represents the unique Zoho Group ID (ZGID) of the organization.
          maxLength: 19
          readOnly: true
        country_code:
          oneOf:
            - type: string
              maxLength: 10
              description: >-
                Represents the country code of the organization when a value is
                available.
              x-zs-$id: OrgCountryCode
            - type: 'null'
              description: >-
                Represents a null value when no country code is set for the
                organization.
              x-zs-$id: OrgCountryCodeNull
          description: Represents the country code of the organization.
        deletable_org_account:
          type: boolean
          description: |-
            Indicates whether the organization account can be deleted.
            Possible values:
            **true** - The organization can be deleted.
            **false** - The organization cannot be deleted.
          readOnly: true
        license_details:
          type: object
          readOnly: true
          description: >-
            Represents the license and subscription details for the
            organization.
          properties:
            paid_expiry:
              oneOf:
                - type: string
                  format: date-time
                  description: Represents the license details variant.
                  x-zs-$id: OrgLicenseDetailsPaidExpiry
                - type: 'null'
                  description: Represents the license details variant.
                  x-zs-$id: OrgLicenseDetailsPaidExpiryNull
              readOnly: true
              description: >-
                Represents the expiry date of the paid license for the
                organization.
            users_license_purchased:
              type: integer
              format: int32
              readOnly: true
              description: >-
                Represents the number of user licenses purchased for the
                organization.
            trial_type:
              oneOf:
                - type: string
                  description: Represents the license details variant.
                  maxLength: 50
                  x-zs-$id: OrgLicenseDetailsTrialType
                - type: 'null'
                  description: Represents the license details variant.
                  x-zs-$id: OrgLicenseDetailsTrialTypeNull
              description: Represents the type of trial subscription for the organization.
              readOnly: true
            trial_expiry:
              oneOf:
                - type: string
                  format: date-time
                  description: Represents the license details variant.
                  x-zs-$id: OrgLicenseDetailsTrialExpiry
                - type: 'null'
                  description: Represents the license details variant.
                  x-zs-$id: OrgLicenseDetailsTrialExpiryNull
              description: >-
                Represents the expiry date of the trial subscription for the
                organization.
            paid:
              type: boolean
              description: |-
                Indicates whether the organization has a paid subscription.
                Possible values:
                **true** - The organization has a paid subscription.
                **false** - The organization does not have a paid subscription.
              readOnly: true
            paid_type:
              type: string
              readOnly: true
              description: |-
                Represents the license type for the organization.
                Possible values:
                **free** - Free edition.
                **standard** - Standard edition.
                **professional** - Professional edition.
                **enterprise** - Enterprise edition.
                **ultimate** - Ultimate edition.
                **crmplus** - CRM Plus edition.
                **zohoone** - Zoho One edition.
              enum:
                - free
                - standard
                - professional
                - enterprise
                - ultimate
                - crmplus
                - zohoone
            portal_users_license_purchased:
              type: integer
              format: int32
              description: >-
                Represents the number of portal user licenses purchased for the
                organization.
              readOnly: true
          additionalProperties: false
          required:
            - users_license_purchased
            - paid
            - paid_type
            - portal_users_license_purchased
        hierarchy_preferences:
          type: object
          properties:
            type:
              type: string
              enum:
                - Role_Hierarchy
                - Reporting_To_Hierarchy
              description: >-
                Represents the hierarchy type configured for the organization. 

                Possible values:

                **Role_Hierarchy** - Access is based on the user's role in the
                hierarchy.

                **Reporting_To_Hierarchy** - Access is based on the user's
                reporting structure.
            strictly_reporting:
              type:
                - boolean
                - 'null'
              description: >-
                Indicates whether data visibility is restricted to the direct
                reporting chain.

                Possible values:

                **true** - Data is visible only to the CEO and administrators.

                **false** - Data is visible to any user higher in the hierarchy.
          required:
            - type
          additionalProperties: false
          description: >-
            Represents the hierarchy preferences configured for the
            organization.
        phone:
          oneOf:
            - type: string
              maxLength: 30
              pattern: ^[+]?([0-9A-Za-z()\.\-\s]){1,30}$
              description: >-
                Represents the phone number of the organization when one is
                provided.
              x-zs-$id: OrgPhone
            - type: 'null'
              description: >-
                Represents a null value when no phone number is set for the
                organization.
              x-zs-$id: OrgPhoneNull
          description: Represents the primary phone number of the organization.
        company_name:
          oneOf:
            - type: string
              maxLength: 100
              description: Represents the name of the organization when one is set.
              x-zs-$id: OrgCompanyName
            - type: 'null'
              description: Represents a null value when the company name has not been set.
              readOnly: true
              x-zs-$id: OrgCompanyNameNull
          description: Represents the name of the organization.
        privacy_settings:
          type: boolean
          description: |-
            Indicates whether privacy settings are enabled for the organization.
            Possible values:
            **true** - Privacy settings are enabled.
            **false** - Privacy settings are not enabled.
          readOnly: true
        primary_email:
          oneOf:
            - type: string
              pattern: >-
                ^[\+\-\p{L}\p{M}\p{N}_]([\p{L}\p{M}\p{N}!#$%&'*+\-\/=?^_`{|}~.]*)@(?=.{4,256}$)(([\p{L}\p{N}\p{M}]+)(([\-_]*[\p{L}\p{M}\p{N}])*)[.])+[\p{L}\p{M}]{2,22}$
              description: >-
                Represents the email address of the super admin when one is
                assigned to the organization.
              maxLength: 100
              x-zs-$id: OrgPrimaryEmail
            - type: 'null'
              description: >-
                Represents a null value when no super admin is assigned to the
                organization.
              x-zs-$id: OrgPrimaryEmailNull
          description: Represents the email address of the super admin of the organization.
        iso_code:
          type: string
          maxLength: 10
          description: Represents the ISO code of the organization's home currency.
        hipaa_compliance_enabled:
          type: boolean
          description: >-
            Indicates whether [HIPAA
            compliance](https://www.zoho.com/crm/developer/docs/api/v8/hipaa-compliance.html)
            is enabled for the organization.

            Possible values:

            **true** - HIPAA compliance is enabled.

            **false** - HIPAA compliance is not enabled.
          readOnly: true
        lite_users_enabled:
          type: boolean
          description: |-
            Indicates whether lite users are enabled for the organization.
            Possible values:
            **true** - Lite users are enabled.
            **false** - Lite users are not enabled.
          readOnly: false
      additionalProperties: false
