    WorkflowRuleProcessingSummary:
      type: object
      additionalProperties: false
      description: >-
        Represents the summary of workflow rule impact for the job, including
        counts of total evaluated, processed, and failed rules.
      properties:
        processed:
          type: integer
          format: int32
          description: Represents the processed records.
        total:
          type: integer
          format: int32
          description: Represents the total records.
        failed:
          type: integer
          format: int32
          description: Represents the failed records.
      required:
        - failed
        - processed
        - total
      title: Workflow Rule Processing Summary
    ApiName:
      type: string
      x-zs-$id: ApiName
      description: >-
        API name of the resource. It will start with alphabets and can contain
        alphanumeric characters and underscores.
      example: api_name30
      maxLength: 50
      pattern: ^[A-Za-z][A-Za-z0-9_]*$
    RequiredParameterMissingError:
      type: object
      additionalProperties: false
      description: >-
        Represents the error response returned when a mandatory request
        parameter is missing.
      properties:
        code:
          type: string
          description: Represents the error code for the missing required parameter error.
          enum:
            - REQUIRED_PARAM_MISSING
        details:
          type: object
          additionalProperties: false
          description: >-
            Represents the details of the missing required parameter error,
            including the parameter name.
          properties:
            param_name:
              type: string
              description: >-
                Represents the name of the required parameter that is missing
                from the request.
              maxLength: 255
          required:
            - param_name
        message:
          type: string
          description: >-
            Represents the error message indicating a required parameter is
            missing.
          enum:
            - One of the expected parameter is missing
        status:
          type: string
          description: Represents the response status.
          enum:
            - error
      required:
        - code
        - details
        - message
        - status
      title: Required Parameter Missing Error
      x-zs-$id: RequiredParameterMissingError
    FieldUpdateRequestBodySchema:
      type: object
      description: >-
        Request body for updating custom fields. Maximum of 25 fields can be
        updated in a single call.
      properties:
        fields:
          type: array
          description: Specify the list of fields to update.
          minItems: 1
          maxItems: 25
          items:
            type: object
            description: Specify the field update configuration.
            properties:
              field_label:
                type: string
                description: Specify the unique display label of the field.
                maxLength: 255
                example: Your Name
              id:
                $ref: '#/components/schemas/Id'
              length:
                type: integer
                description: Maximum number of characters allowed. Varies by data type.
                format: int32
                minimum: 1
                maximum: 50000
                example: 150
              profiles:
                type: array
                description: Specify the profiles to which the field is to be assigned.
                items:
                  type: object
                  description: Specify the profile access and permission configuration.
                  properties:
                    id:
                      $ref: '#/components/schemas/Id'
                    permission_type:
                      type: string
                      enum:
                        - read_write
                        - read_only
                        - hidden
                      description: Specify the permission level for this profile.
                  required:
                    - id
                    - permission_type
                  additionalProperties: false
                maxItems: 10
              unique:
                oneOf:
                  - type: object
                    x-zs-$id: FieldUniquenessConfig
                    description: Field uniqueness configuration.
                    properties:
                      case_sensitive:
                        type: boolean
                        description: Indicates whether uniqueness is case sensitive.
                        example: true
                      _disable:
                        oneOf:
                          - type: boolean
                            x-zs-$id: IsFieldUniquenessDisabled
                            description: marking the field is not a unique key.
                            example: true
                          - type: 'null'
                            x-zs-$id: IsFieldUniquenessDisabledNull
                            description: Null if no information is available.
                    required:
                      - case_sensitive
                    additionalProperties: false
                  - type: boolean
                    x-zs-$id: FieldUnique
                    description: >-
                      Indicates whether the field value must be unique across
                      records.
                    example: true
              lookup:
                type: object
                description: Specify the lookup field configuration.
                properties:
                  query_details:
                    type: object
                    description: Specify the filter criteria for lookup records.
                    properties:
                      criteria:
                        type: object
                        description: Specify the filter criteria for lookup fields.
                        properties:
                          group_operator:
                            type: string
                            enum:
                              - AND
                              - OR
                            description: >-
                              Specify the logical operator for multiple
                              conditions.
                          group:
                            type: array
                            description: Specify the array of filter conditions.
                            items:
                              type: object
                              description: Specify the group criteria values.
                              properties:
                                field:
                                  type: object
                                  description: Specify the field details.
                                  properties:
                                    api_name:
                                      $ref: '#/components/schemas/ApiName'
                                    id:
                                      $ref: '#/components/schemas/Id'
                                  required:
                                    - api_name
                                  additionalProperties: false
                                comparator:
                                  type: string
                                  enum:
                                    - equal
                                    - not_equal
                                    - like
                                    - not_like
                                    - greater_equal
                                    - greater_than
                                    - less_equal
                                    - less_than
                                    - in
                                    - not_in
                                    - starts_with
                                    - ends_with
                                    - contains
                                    - not_contains
                                    - between
                                    - not_between
                                    - include_all
                                    - include_any
                                    - exclude_all
                                    - exclude_any
                                  description: Specify the comparison operator.
                                value:
                                  oneOf:
                                    - type: string
                                      x-zs-$id: FilterValue
                                      description: the value to be matched.
                                      maxLength: 125
                                      example: max
                                    - type: array
                                      x-zs-$id: FilterValueArray
                                      description: array list of value to be matched.
                                      items:
                                        type: string
                                        description: the value to be matched.
                                        maxLength: 125
                                        example: max
                                      maxItems: 10
                                  description: Specify the value to compare against.
                              required:
                                - field
                                - comparator
                                - value
                              additionalProperties: false
                            maxItems: 10
                        required:
                          - group
                        additionalProperties: false
                    additionalProperties: false
                required: []
                additionalProperties: false
              pick_list_values:
                type: array
                description: Specify the picklist configuration.
                items:
                  type: object
                  description: PicklistValue to be shown.
                  properties:
                    display_value:
                      type: string
                      description: Specify the display Value to be shown.
                      maxLength: 25
                      example: EXT_VAL_1
                    actual_value:
                      type: string
                      description: >-
                        Specify the actual value of the picklist option. Once
                        set, this value cannot be changed.
                      maxLength: 25
                      example: EXT_VAL_1
                    reference_value:
                      type: string
                      description: Specify the reference value to be Userd Internal.
                      maxLength: 25
                      example: EXT_VAL_1
                    colour_code:
                      type: string
                      description: Specify the hex code for the picklist value color.
                      maxLength: 25
                      example: '#FF5733'
                    id:
                      $ref: '#/components/schemas/Id'
                    _global_picklist_value:
                      type: object
                      description: Specify the global picklist value.
                      properties:
                        id:
                          $ref: '#/components/schemas/Id'
                      required:
                        - id
                      additionalProperties: false
