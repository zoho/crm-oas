    FieldRequestBodySchema:
      type: object
      description: >-
        Specify the request body for creating custom fields. Maximum of 25
        fields can be created in a single call.
      properties:
        fields:
          type: array
          description: Specify the list of fields to create.
          minItems: 1
          maxItems: 25
          items:
            type: object
            description: Specify the field configuration to create.
            properties:
              field_label:
                type: string
                description: Specify the unique display label of the field.
                maxLength: 25
                example: Your Name
              data_type:
                type: string
                description: Specify the data type of the field.
                enum:
                  - text
                  - textarea
                  - email
                  - phone
                  - picklist
                  - multiselectpicklist
                  - date
                  - datetime
                  - integer
                  - autonumber
                  - currency
                  - percent
                  - bigint
                  - double
                  - website
                  - boolean
                  - fileupload
                  - imageupload
                  - lookup
                  - userlookup
                  - multiselectlookup
                  - multiuserlookup
                  - formula
                  - rollup_summary
                  - address
                example: text
                maxLength: 50
              length:
                type: integer
                description: >-
                  Specify the maximum number of characters allowed. Varies by
                  data type.
                format: int32
                minimum: 1
                maximum: 50000
                example: 150
              filterable:
                type: boolean
                description: Specify whether the field can be used in filters.
                example: true
              tooltip:
                type: object
                description: >-
                  Represents the tooltip content for the field. **Possible
                  names**: **static_text** : Specifies that the field should
                  have a static text tooltip. The tooltip content will be
                  displayed in the field when the user clicks on the field box.
                  **info_icon** : Specifies that the field should have an info
                  icon tooltip. Clicking on the "info icon" will display the
                  tooltip contents. Note that it is mandatory to specify both
                  the name and value when you specify tooltip key.
                properties:
                  name:
                    type: string
                    enum:
                      - static_text
                      - info_icon
                    description: >-
                      Specify the type of tooltip: static_text (shown in field
                      box) or info_icon (shown on icon click).
                  value:
                    type: string
                    description: >-
                      Specify the tooltip content. Max 35 chars for static_text,
                      255 chars for info_icon.
                    maxLength: 255
                required:
                  - name
                  - value
                additionalProperties: false
              profiles:
                type: array
                description: >-
                  Each object in the array represents the name and ID of the
                  profile that has access to the field. By default, all
                  organization users will have access to the field. **Possible
                  permission types:** read_write, read_only, and hidden.
                  **read_write:** The user has read and write permissions for
                  the field. **read_only:** The user has only read permission
                  for the field. **hidden:** The field is not visible to the
                  user. Note that it is mandatory to specify a permission type
                  to the profiles in order to access the field.
                items:
                  type: object
                  description: Specify the profile access and permission configuration.
                  properties:
                    id:
                      $ref: '#/components/schemas/Id'
                    permission_type:
                      type: string
                      enum:
                        - read_write
                        - read_only
                        - hidden
                      description: Specify the permission level for this profile.
                  additionalProperties: false
                maxItems: 50
              external:
                type: object
                description: >-
                  Specify the external field configuration for third-party app
                  integration.
                properties:
                  type:
                    type: string
                    enum:
                      - user
                      - org
                      - external_lookup
                    description: >-
                      Specify the external field type. 'user' assigns a
                      different ID per user; 'org' assigns a common ID for the
                      organization.
                    maxLength: 25
                    example: user
                  show:
                    type: boolean
                    description: Specify whether to display the field in the UI.
                    example: true
                required:
                  - type
                  - show
                additionalProperties: false
              crypt:
                oneOf:
                  - type: object
                    x-zs-$id: FieldEncryptionDetails
                    description: Specify the field encryption configuration.
                    properties:
                      mode:
                        type: string
                        enum:
                          - encryption
                          - decryption
                        description: >-
                          Specify the encryption: Store value encrypted.
                          decryption: Store value unencrypted (default).
                        example: decryption
                    required:
                      - mode
                    additionalProperties: false
                  - type: boolean
                    x-zs-$id: IsFieldEncrypted
                    description: Specify whether field encryption is enabled.
                    example: true
              encrypt_case:
                type: string
                enum:
                  - uppercase
                  - lowercase
                description: Specify the permission case for encrypted field.
                example: lowercase
              textarea:
                type: object
                description: Specify the text area field configuration.
                properties:
                  type:
                    type: string
                    enum:
                      - small
                      - large
                      - rich_text
                    description: >-
                      Specify the small: 2000 chars, large: 32000 chars,
                      rich_text: 50000 chars.
                    example: small
                required:
                  - type
                additionalProperties: false
              unique:
                oneOf:
                  - type: object
                    x-zs-$id: FieldUniquenessDetails
                    description: Specify the field uniqueness configuration.
                    properties:
                      case_sensitive:
                        type: boolean
                        description: Specify whether uniqueness is case sensitive.
                        example: true
                    required:
                      - case_sensitive
                    additionalProperties: false
                  - type: boolean
                    x-zs-$id: IsFieldUnique
                    description: >-
                      Specify whether the field value must be unique across
                      records.
                    example: true
              hipaa_compliance_enabled:
                type: boolean
                description: Specify the enable HIPAA compliance for this field.
                example: false
              private:
                type: object
                description: Specify the gDPR compliance configuration.
                properties:
                  type:
                    type: string
                    enum:
                      - Low
                      - High
                    description: Specify the privacy level for GDPR compliance.
                required:
                  - type
                additionalProperties: false
              pick_list_values:
                type: array
                description: Specify the picklist configuration.
                items:
                  type: object
                  description: Specify the picklistValue to be shown.
                  properties:
                    display_value:
                      type: string
                      description: Specify the display Value to be shown.
                      maxLength: 25
                      example: EXT_VAL_1
                    actual_value:
                      type: string
                      description: >-
                        Specify the actual value of the picklist option. Once
                        set, this value cannot be changed.
                      maxLength: 25
                      example: EXT_VAL_1
                    reference_value:
                      type: string
                      description: Specify the reference value to be Userd Internal.
                      maxLength: 25
