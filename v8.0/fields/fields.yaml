    post:
      summary: Create custom fields in a module
      description: >-
        To create custom fields in a module in your Zoho CRM organization, where
        supported modules include Leads, Contacts, Accounts, Campaigns, Cases,
        Invoices, Deals, Price Books, Products, Purchase Orders, Quotes, Sales
        Orders, Solutions, Vendors, Calls, Tasks, Events, Users, and Custom
        modules.
      x-zs-llm-description: >-
        Use this operation to create one or more custom fields in a module. Each
        field object in the 'fields' array must include 'field_label' and
        'data_type'. The 'api_name' is auto-generated from 'field_label' if not
        provided.
      operationId: createFields
      parameters:
        - $ref: '#/components/parameters/Module'
          description: >-
            Specify the API name of the module for which you want to create
            custom fields. For example, the module name 'Leads'.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FieldRequestBodySchema'
            examples:
              FullExample:
                summary: >-
                  Creates a single-line text field and a multi-line text area
                  field in one request
                value:
                  fields:
                    - field_label: Your Name
                      data_type: text
                      tooltip:
                        name: static_text
                        value: Enter your name
                      profiles:
                        - id: '2423488000000015972'
                          permission_type: read_write
                        - id: '2423488000000015975'
                          permission_type: read_only
                      external:
                        type: user
                        show: false
                      crypt:
                        mode: decryption
                    - field_label: Name
                      data_type: textarea
                      length: 50000
                      textarea:
                        type: rich_text
                      tooltip:
                        name: static_text
                        value: Enter your name
                      profiles:
                        - id: '2423488000000015972'
                          permission_type: read_write
                        - id: '2423488000000015975'
                          permission_type: read_write
                    - field_label: Email address
                      data_type: email
                      tooltip:
                        name: static_text
                        value: Enter email address
                      crypt:
                        mode: decryption
                      unique:
                        case_sensitive: false
                      hipaa_compliance_enabled: true
                      private:
                        type: High
                    - field_label: Phone
                      data_type: phone
                      association_details:
                        related_field:
                          api_name: Phone
                          id: '4832675000000710341'
                        lookup_field:
                          reference_id: '{{ref8909}}'
      responses:
        '201':
          description: >-
            Returns a list of results confirming that all requested custom
            fields were created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateFieldsResponse'
              examples:
                FullExample:
                  summary: >-
                    Successful field creation response with IDs for each created
                    field
                  value:
                    fields:
                      - code: SUCCESS
                        details:
                          id: '111112000000067259'
                        message: field created
                        status: success
                      - code: SUCCESS
                        details:
                          id: '11111200000006724'
                        message: field created
                        status: success
                      - code: SUCCESS
                        details:
                          id: '111112000000067239'
                        message: field created
                        status: success
        '207':
          description: >-
            Returns a mixed-status result in which at least one field creation
            succeeds and at least one field encounters an error, with each entry
            in the fields array carrying its own status.
          content:
            application/json:
              schema:
                type: object
                x-zs-$id: PostMultiStatusResponse
                description: >-
                  Represents a multi-status response in which each entry in the
                  fields array independently reflects either a successful field
                  creation or a field-level error.
                properties:
                  fields:
                    type: array
                    description: >-
                      Represents the list of field creation results returned for
                      the request. Each entry is either a success object or an
                      error object, reflecting whether the corresponding field
                      creation succeeded or failed.
                    items:
                      oneOf:
                        - $ref: '#/components/schemas/FieldCreationResult'
                        - $ref: '#/components/schemas/ErrorResponse'
                    minItems: 2
                    maxItems: 25
                required:
                  - fields
                additionalProperties: false
              examples:
                PartialSuccess:
                  summary: >-
                    Mixed result with one field created successfully and one
                    rejected with INVALID_DATA
                  value:
                    fields:
                      - code: SUCCESS
                        details:
                          id: '1947368000002460003'
                        message: field created
                        status: success
                      - code: INVALID_DATA
                        details:
                          api_name: data_type
                          json_path: $.fields[1].data_type
                        message: invalid data
                        status: error
        '400':
          description: >-
            Invalid data was submitted for one or more fields in the request.

            **Resolution:** The caller should verify that all required keys such
            as field_label and data_type are present and that field type values
            are valid before resubmitting the request.
          content:
            application/json:
              schema:
                x-zs-$id: PostBadRequestResponse
                oneOf:
                  - $ref: '#/components/schemas/ErrorResponse'
                  - type: object
                    description: >-
                      Represents an error response containing an array of
                      field-level errors and supplementary context about the
                      invalid request data.
                    x-zs-$id: PostBadRequestWTOFieldobject
                    properties:
                      fields:
                        type: array
                        description: >
                          Represents the list of error details for each field
                          that could not be created. Each entry describes the
                          specific error encountered during field creation.
                        items:
                          $ref: '#/components/schemas/ErrorResponse'
                        maxItems: 25
                    required:
                      - fields
                    additionalProperties: false
              examples:
                ErrorExample:
                  value:
                    code: INVALID_MODULE
                    message: the module name given seems to be invalid
                    details: {}
                    status: error
        '500':
          description: >-
            An unexpected server-side error occurred while processing the
            request.

            **Resolution:** The caller should wait briefly and retry the
            request; if the error persists, report the issue to Zoho CRM
            support.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
              examples:
                ErrorExample:
                  value:
                    code: INTERNAL_ERROR
                    message: Internal Server Error
                    details: {}
                    status: error
      security:
        - OAuth2:
            - ZohoCRM.settings.fields.CREATE
    patch:
      summary: Update custom fields
      description: >-
        To update one or more custom fields in a module in your Zoho CRM
        account.
      x-zs-llm-description: >-
        Use this operation to bulk-update properties of multiple custom fields
        in a module. Each object in the 'fields' array must include the field's
        'id' to identify which field to update.
      operationId: updateField
      parameters:
        - $ref: '#/components/parameters/Module'
          description: >-
            Specify the API name of the module for which you want to update
            custom fields. For example, the module name 'Leads'.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FieldUpdateRequestBodySchema'
            examples:
              FullExample:
                summary: Bulk update of multiple field configurations
                value:
                  fields:
                    - history_tracking_enabled: true
                      history_tracking:
                        related_list_name: Region Tracker
                        duration_configuration: time
                        followed_fields:
                          - api_name: Owner
                            _delete: null
                          - api_name: Company
                            id: '5725767000000002591'
                    - id: '2276164000002053013'
                      pick_list_values:
                        - id: '2276164000002053012'
                          _global_picklist_value:
                            id: '2276164000002053039'
                        - id: '2276164000002053014'
                          _global_picklist_value:
                            id: '2276164000002053041'
                      global_picklist:
                        api_name: Market
                        id: '2276164000002053035'
                    - id: '2276164000002053013'
                      field_label: Updated Field Label
                      length: 255
                      association_details:
                        related_field:
                          id: '4832675000000710341'
                          api_name: City
                        lookup_field:
                          id: '4832675000000710334'
                          api_name: Lookup_Field
      responses:
        '200':
          description: >-
            Returns the update status for each field submitted in the request,
            with the unique ID of each successfully updated field.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateFieldsResponse'
              examples:
                FullExample:
                  summary: All requested fields updated successfully
                  value:
                    fields:
                      - code: SUCCESS
                        details:
                          id: '111112000000067259'
                        message: field updated
                        status: success
                      - code: SUCCESS
                        details:
                          id: '11111200000006724'
                        message: field updated
                        status: success
                      - code: SUCCESS
                        details:
                          id: '111112000000067239'
                        message: field updated
                        status: success
        '207':
          description: >-
            Returns a partial-success response where some fields were updated
            successfully and others failed validation, with per-field status
            information.
          content:
            application/json:
              schema:
                type: object
                x-zs-$id: PatchMultiStatusResponse
                description: >-
                  Represents the multi-status response for a bulk field update
                  request, containing a mix of success and error results.
                properties:
                  fields:
                    type: array
                    description: >-
                      Represents the list of per-field results for the bulk
                      update operation, where each item indicates either a
                      successful update or a validation error.
                    items:
                      oneOf:
                        - $ref: '#/components/schemas/FieldCreationResult'
                        - $ref: '#/components/schemas/ErrorResponse'
                    minItems: 2
                    maxItems: 25
