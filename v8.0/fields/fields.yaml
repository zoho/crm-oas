                    maxLength: 50
                  duration_configuration:
                    type: string
                    description: Specify the duration for which history is tracked.
                    enum:
                      - days
                      - time
                    example: time
                    maxLength: 25
                  followed_fields:
                    type: array
                    description: Specify the list of fields to create.
                    items:
                      type: object
                      description: Specify the field to be tracked.
                      properties:
                        api_name:
