              default_value:
                type: string
                description: Specify the default value for the picklist field.
                maxLength: 25
                example: New
              pick_list_values_sorted_lexically:
                type: boolean
                description: Specify whether picklist values are sorted lexically.
                example: true
              enable_colour_code:
                type: boolean
                description: >-
