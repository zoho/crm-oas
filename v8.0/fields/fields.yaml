openapi: 3.1.0
info:
  title: Fields API
  description: >-
    Fields are the individual data attributes that define the structure of
    module records in Zoho CRM, encompassing properties such as data type,
    display label, API name, and visibility settings. This API enables
    developers to retrieve, create, update, and delete custom fields for
    standard, custom, subform, and linking modules in a Zoho CRM account.
  version: '8'
servers:
  - url: https://zohoapis.{dc}/crm/{version}
    description: Production API server for the Zoho CRM.
    variables:
      dc:
        description: >-
          The top-level domain of the API server URL, identifying the Zoho CRM
          data center region.
        default: com
        enum:
          - com
          - eu
          - in
          - cn
          - au
          - ca
          - jp
      version:
        description: The API version included in the request URL path.
        default: v8
paths:
  /settings/fields:
    get:
      summary: List fields metadata
      description: >-
        To retrieve the field metadata for the specified module in your Zoho CRM
        account, including standard, custom, subform, and linking module fields.
        The response includes fields from all layouts but does not contain
        layout-specific configurations such as mandatory flags or picklist
        values.
      x-zs-llm-description: >-
        Use this operation to discover all available fields for a module before
        constructing create or update record payloads. The 'module' query
        parameter is required. Response includes api_name, data_type, and
        json_type for each field.
      operationId: getFields
      parameters:
        - $ref: '#/components/parameters/Module'
          description: >-
            Specify the API name of the module for which you want to retrieve
            field metadata. For example, the module name 'Leads'.
        - $ref: '#/components/parameters/Includes'
          description: >-
            Specify whether to include the allowed_permissions JSON object in
            the response
        - $ref: '#/components/parameters/Type'
          description: >-
            Specify the type of fields to be retrieved. Example: 'used',
            'unused', etc.
      responses:
        '200':
          description: >-
            Returns the field metadata for all fields in the specified module,
            including standard, custom, subform, and linking module fields.
          content:
            application/json:
              schema:
                type: object
                x-zs-$id: FieldsResponseSchema
                description: >-
                  Represents the response body for the field metadata request,
                  containing an array of field configuration objects.
                properties:
                  fields:
                    type: array
                    description: >-
                      Represents the list of field metadata objects retrieved
                      for the specified module.
                    items:
                      $ref: '#/components/schemas/FieldSchema'
                    maxItems: 100
                required:
                  - fields
                additionalProperties: false
              examples:
                FullExample:
                  summary: Field metadata for a module retrieved successfully
                  value:
                    fields:
                      - associated_module: null
                        webhook: true
                        operation_type:
                          web_update: true
                          api_create: true
                          web_create: true
