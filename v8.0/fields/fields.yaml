                          description: Specify the API name of the field to be tracked.
                          example: Status
                          maxLength: 25
                        id:
                          type: string
                          description: Specify the ID of the field to be tracked.
                          example: '2423488000000123457'
                          format: int64
                      required:
                        - api_name
                        - id
                      additionalProperties: false
                    maxItems: 10
                required:
                  - related_list_name
                  - duration_configuration
                  - followed_fields
                additionalProperties: false
              separator:
                type: boolean
                description: >-
                  Specify whether to use a thousands separator for number
                  fields.
                example: true
              auto_number:
                type: object
                description: Specify the configuration for auto number fields.
                properties:
                  start_number:
                    type: string
                    description: Specify the starting number for the auto number field.
                    maxLength: 16
                    example: '3'
                  prefix:
                    type: string
                    description: Specify the prefix of the starting number.
                    maxLength: 16
                    example: '3'
                  suffix:
                    type: string
