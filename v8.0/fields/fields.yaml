  parameters:
    Module:
      name: module
      in: query
      description: >-
        Specify the API name of the module for which you want to retrieve field
        data. Refer to the [Get
        Modules](modules.yaml#$.paths./settings/modules.get) resource for valid
        values.
      required: true
      style: form
      explode: true
      schema:
        type: string
        description: The API name of the module to which the field belongs.
        example: Leads
        maxLength: 30
    Includes:
      name: include
      in: query
      description: >-
        Specify whether to include the **allowed_permissions** JSON object in
        the response. Possible values: allowed_permissions_to_update - Includes
        the allowed_permissions JSON object with details about the default
        permissions for each field.
      required: false
      style: form
      explode: true
      schema:
        type: string
        description: >-
          To include additional information about the field's permissions to
          update.
        enum:
          - allowed_permissions_to_update
        example: allowed_permissions_to_update
        maxLength: 50
    Type:
      name: type
      in: query
      description: >-
        Specify the usage type of the fields to retrieve. Possible values: all -
        Retrieves both used and unused fields in the module. unused - Retrieves
        only fields that are not in use. used - Retrieves only fields that are
        currently in use.
      required: false
      style: form
      explode: true
      schema:
        type: string
        enum:
          - all
          - unused
          - used
        maxLength: 10
    ParamQueryJobId:
      name: job_id
      in: query
      description: >-
        Specify the job ID of the scheduled field or picklist action to filter
        the results.
      required: false
      schema:
        type: string
        format: int64
      example: '111113000000135098'
    ParamQueryPage:
      name: page
      in: query
      description: Specify the page number for paginating the scheduled jobs list.
      required: false
      schema:
        type: integer
        format: int32
      example: 1
    ParamQueryPerPage:
      name: per_page
      in: query
      description: Specify the number of scheduled jobs to return per page.
      required: false
      schema:
        type: integer
        format: int32
      example: 200
    ParamPathFieldid:
      name: fieldId
      in: path
      description: Specify the unique ID of the custom field.
      required: true
      schema:
        type: string
        example: '{fieldId}'
        maxLength: 255
