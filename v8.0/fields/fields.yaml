          required:
            - permissions
        message:
          type: string
          description: Represents the error message indicating permission was denied.
          enum:
            - permission denied
        status:
          type: string
          description: Represents the response status.
          enum:
            - error
      required:
        - code
        - details
        - message
        - status
      title: Permission Denied Error
