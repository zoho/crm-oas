  /{module}/upsert:
    post:
      operationId: upsertRecords
      summary: Create or update records in a specified module
      description: >-
        The Upsert API inserts a new record or updates an existing record based
        on duplicate check field values. If a matching record is found, it is
        updated; otherwise, a new record is inserted.

        When using the Upsert API, the system checks for duplicate records based
        on the duplicate check fields. There are two types of duplicate check
        fields: system-defined duplicate check fields and user-defined unique
        fields.

        System-defined duplicate check fields are predefined unique fields for
        each module. The system automatically checks these fields to prevent
        duplicate records. Refer to the System-defined Duplicate Check Fields
        section for module-specific details.

        User-defined unique fields are fields for which the "Do not allow
        duplicate values" option is enabled. These fields allow users to define
        custom fields for duplicate checking. For more information, refer to
        [Mark a Field as
        Unique](https://help.zoho.com/portal/en/kb/crm/customize-crm-account/customizing-fields/articles/use-custom-fields#Mark_a_Field_as_Unique).
        When a record is upserted, the system first checks for duplicates in
        these fields. If a matching record exists, it gets updated; otherwise, a
        new record is inserted.

        You can specify the order in which the system checks for duplicate
        records using the "duplicate_check_fields" array in the API request. The
        array can contain system-defined duplicate check fields, such as "Email"
        for the Leads module, and user-defined unique fields, such as "Phone"
        and "Fax".

        For example, in the Leads module, you can specify:
        "duplicate_check_fields": ["Email", "Phone", "Fax"].

        If "duplicate_check_fields" is not specified, the system checks
        duplicate records in the following order: 1. System-defined duplicate
        check fields. 2. User-defined unique fields.
      tags:
        - Records
      parameters:
        - $ref: '#/components/parameters/Module'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordsUpsertSchema'
            examples:
              RequestBody:
                summary: Sample request body for the upsertRecords operation
                description: >-
                  Shows the request body structure for the upsertRecords
                  operation.
                value:
                  data:
                    - Last_Name: test
                      Email: a@gmail.com
                      Phone: '987654321'
                      id: '5725767000000524001'
                  duplicate_check_fields:
                    - Phone
        required: true
        description: >-
          The request body must contain a **data** array. You can include a
          maximum of 100 objects per request. You must use only Field API names
          in the input; obtain them from the [Get Fields Metadata
          API](fields.yaml#$.paths./settings/fields.get). The "INVALID_DATA"
          error is returned if a field value exceeds the maximum length defined
          for that field. For example, if a Text field has a maximum length of
          10 characters, the API cannot accept a value such as "12345678901",
          since it contains 11 characters. Records with subform details can also
          be inserted or updated through this API. Provide the layout ID to
          include layout-specific mandatory fields in the API-level mandatory
          field check; only the fields defined in that layout are considered for
          processing, and the rest are ignored.
      responses:
        '200':
          description: >-
            Returns the details of each successfully processed records,
            including the record ID and audit metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordUpsertSuccessResponse'
              examples:
                Success:
                  summary: Successfully completed operation
                  value:
                    data:
                      - code: SUCCESS
                        duplicate_field: Email
                        action: update
                        details:
                          Modified_Time: '2020-10-14T10:31:43+05:30'
                          Modified_By:
                            name: Patricia Boyle
                            id: '4150868000000225013'
                          Created_Time: '2019-09-11T16:21:15+05:30'
                          id: '4150868000000376008'
                          Created_By:
                            name: Patricia Boyle
                            id: '4150868000000225013'
                        message: record updated
                        status: success
                      - code: SUCCESS
                        duplicate_field: Email
                        action: insert
                        details:
                          Modified_Time: '2020-10-14T10:31:43+05:30'
                          Modified_By:
                            name: Patricia Boyle
                            id: '4150868000000225013'
                          Created_Time: '2020-10-14T10:31:43+05:30'
                          id: '4150868000003194003'
                          Created_By:
                            name: Patricia Boyle
                            id: '4150868000000225013'
                        message: record added
                        status: success
                  description: >-
                    Shows the successful response for the upsertRecords
                    operation, including the record ID and audit metadata.
        '207':
          description: >-
            Returns a multi-status response when some record upsert operations
            succeed and others fail. Each item in the data array independently
            reports the outcome for the corresponding record.
          content:
            application/json:
              schema:
                type: object
                description: >-
                  Represents the multi-status response returned when a bulk
                  operation results in mixed success and failure outcomes.
                additionalProperties: false
                x-zs-$id: RecordsUpsertMultiStatusResponse
                properties:
                  data:
                    type: array
                    description: Contains the list of per-record results for the operation.
                    maxItems: 100
                    allOf:
                      - contains:
                          type: object
                          properties:
                            status:
                              const: success
                              description: >-
                                Indicates a successful upsert. Always "success"
                                for matched items.
                          required:
                            - status
                          description: >-
                            Schema used to identify items in the response that
                            represent a successful upsert operation.
                          additionalProperties: true
                        minContains: 1
                        description: >-
                          Ensures the response contains at least one successful
                          result in the data array.
                      - contains:
                          type: object
                          properties:
                            status:
                              const: error
                              description: >-
                                Indicates a failed upsert. Always "error" for
                                matched items.
                          required:
                            - status
                          description: >-
                            Schema used to identify items in the response that
                            represent a failed upsert operation.
                          additionalProperties: true
                        minContains: 1
                        description: >-
                          Ensures the response contains at least one failed
                          result in the data array.
                    items:
