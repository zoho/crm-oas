components:
  parameters:
    Module:
      name: module
      example: Leads
      description: >-
        Specify the API name of the module. Use the [Get Modules
        API](modules.yaml#$.paths./settings/modules.get) to retrieve the module
        ID and API name.
      in: path
      required: true
      schema:
        type: string
        maxLength: 25
    Fields:
      name: fields
      description: >-
        Specify a comma-separated list of field API names to include in the
        response. Use the [Get Fields Metadata
        API](fields.yaml#$.paths./settings/fields.get) to retrieve the field IDs
        and API names.
      in: query
      required: true
      schema:
        type: string
    Record:
      name: recordId
      description: >-
        Specify the unique ID of the record. Use the [Get Records
        API](record.yaml#$.paths./module.get) to retrieve the record IDs.
      in: path
      required: true
      schema:
        type: string
        format: int64
    TerritoryId:
      name: territory_id
      description: >-
        Specify the unique ID of the territory. Use the [Get Territories
        API](territories.yaml#$.paths./settings/territories.get) to retrieve the
        territory ID.
      in: query
      schema:
        type: string
        format: int64
    Ids:
      name: ids
      description: >-
        Specify a comma-separated list of record IDs. Use the [Get Records
        API](record.yaml#$.paths./module.get) to retrieve the record IDs.
      in: query
      style: form
      explode: false
      schema:
        type: array
        uniqueItems: true
        items:
          type: string
          format: int64
          description: Unique record ID in int64 string format.
        minItems: 1
    Cvid:
      name: cvid
      description: >-
        Specify the unique ID of the Custom View. Use the [Get Custom Views
        Metadata API](custom_views.yaml#$.paths./settings/custom_views.get) to
        retrieve the Custom View IDs.
      in: query
      schema:
        type: string
        format: int64
    Filters:
      name: filters
      in: query
      schema:
        $ref: '#/components/schemas/FilterCriterionRequest'
      description: >-
        Specify the filter criteria for retrieving specific Custom Views.
        Accepts a filter object to narrow down results based on Custom View
        properties.
    CrossFilters:
      name: cross_filters
      in: query
      style: deepObject
      explode: true
      schema:
        $ref: '#/components/schemas/CrossFiltersRequest'
      description: >-
        Specify the filter criteria for retrieving specific Custom Views.
        Accepts a filter object to narrow down results based on Custom View
        properties.
    FilterId:
      name: filterId
      in: query
      description: The filter identifier
      schema:
        format: int64
        type: string
        description: The filter identifier
        x-zs-$ref:
          resource: filters
          origins:
            - operationId: getFilters
              propertyId: FilterId
        maxLength: 20
    PerPage:
      name: per_page
      description: Specify the number of records to return per page. Maximum is 200.
      in: query
      schema:
        type: integer
        format: int32
        maximum: 200
        minimum: 1
    Page:
      name: page
      description: Specify the page number to retrieve. Starts at 1.
      in: query
      schema:
        type: integer
        format: int32
        minimum: 1
    PageToken:
      name: page_token
      description: >-
        Specify the page token to retrieve records beyond the first 2,000
        results. Use the **next_page_token** value from a previous response to
        access the next page of results.
      in: query
      schema:
        type: string
        maxLength: 96
    SortOrder:
      name: sort_order
      description: >-
        Specify the sort order for the records.<br/> <b>Possible values:</b>
        <br/>desc - Returns records in descending order.<br/> asc - Returns
        records in ascending order.
      in: query
      schema:
        type: string
        enum:
          - desc
          - asc
    SortBy:
      name: sort_by
      description: >-
        Specify the field to sort records by.  Possible values:**id** - Sorts by
        record ID.  **Created_Time** - Sorts by creation timestamp. 
        **Modified_Time** - Sorts by last modification timestamp.
      in: query
      schema:
        type: string
        enum:
          - id
          - Created_Time
          - Modified_Time
    Converted:
      name: converted
      description: >-
        Specify whether to retrieve converted, unconverted, or both types of
        records.  Possible values:**false** - Returns only unconverted records. 
        **true** - Returns only converted records.  **both** - Returns both
        converted and unconverted records.
      in: query
      schema:
        type: string
        enum:
          - 'false'
          - 'true'
          - both
    IncludeChild:
      name: include_child
      description: >-
        Specify whether to include records assigned to child territories of the
        specified territory.
      in: query
      schema:
        type: boolean
    DeletedRecordsType:
      name: type
      description: >-
        Specify the category of deleted records to retrieve.  Possible values: 
        **all** - Returns both recycled and permanently deleted records. 
        **recycle** - Returns only records in the Recycle Bin.  **permanent** -
        Returns only permanently deleted records.
      in: query
      required: false
      schema:
        type: string
        enum:
          - all
          - recycle
          - permanent
        default: all
        maxLength: 20
    IfModifiedSince:
      name: If-Modified-Since
      in: header
      description: >-
        Use this header to get the list of records modified after the specified
        timestamp. The timestamp must be in ISO 8601 format.
      required: false
      schema:
        type: string
        format: date-time
        maxLength: 100
      example: '2019-07-25T15:26:49+05:30'
  schemas:
    RecordsUpsertSchema:
      type: object
      x-zs-$id: RecordsUpsertSchema
      description: >-
        Request body schema for upsert operations, allowing creation or update
        of records based on duplicate fields.
      additionalProperties: false
      required:
        - data
      properties:
        data:
          type: array
          maxItems: 100
          description: List of records to be created or updated using the upsert operation.
          items:
            $ref: '#/components/schemas/RecordSinglePutWriteDataItem'
          minItems: 1
        trigger:
          $ref: '#/components/schemas/RecordsInputSchema/properties/trigger'
        duplicate_check_fields:
          type: array
          description: >-
            Specifies the fields used to check for duplicate records during an
            Upsert operation. Duplicate check fields can be system-defined
            unique fields or user-defined unique fields.  

            The following are the system-defined duplicate check fields for the
            respective modules: Leads - "Email"; Accounts - "Account_Name";
            Contacts - "Email"; Deals - "Deal_Name"; Campaigns -
            "Campaign_Name"; Cases - "Subject"; Solutions - "Solution_Title";
            Products - "Product_Name"; Vendors - "Vendor_Name"; PriceBooks -
            "Price_Book_Name"; Quotes - "Subject"; SalesOrders - "Subject";
            PurchaseOrders - "Subject"; Invoices - "Subject"; Custom Modules -
            "Name".

            If a matching record is found based on these fields, the record is
            updated; otherwise, a new record is inserted.
          items:
            type: string
            description: API name of the field used for duplicate record verification.
            maxLength: 100
        wf_trigger:
          type:
            - string
            - 'null'
          description: >-
            Workflow trigger identifier to be executed as part of the upsert
            operation.
          maxLength: 50
        lar_id:
          description: >-
            The unique ID of the assignment rule to trigger while inserting a
            record. Use the Get Assignment Rules API to retrieve valid values.
            This key must be provided parallel to the data key. Supported for
            all modules where assignment rules are applicable, such as Leads,
            Contacts, Deals, Accounts, Tasks, Cases, and Custom.
          x-zs-$ref:
            resource: assignment_rules
            origins:
              - operationId: getAssignmentRules
                propertyId: AssignmentRuleId
          type: string
          pattern: ^[1-9][0-9]{0,18}$
          minLength: 1
          maxLength: 19
    RecordsInputSchema:
      description: Represents the RecordsInputSchema data structure.
      type: object
      x-zs-$id: RecordWriteRequest
      additionalProperties: false
      required:
        - data
      properties:
        data:
          type: array
          maxItems: 100
          description: Represents the data value.
          items:
            $ref: '#/components/schemas/RecordWriteDataItem'
          minItems: 1
        apply_feature_execution:
          type: array
          description: >-
            Use the "apply_feature_execution" array to trigger supported CRM
            features when creating or updating a record through the API. Specify
            "layout_rules" to apply layout rules or "criteria_validation_rule"
            to trigger validation rules. For "layout_rules", ensure the request
            includes all fields required by the layout rule criteria; otherwise,
            the API returns an error. For "criteria_validation_rule", all
            applicable validation rules are evaluated, and the API returns
            "MULTIPLE_OR_MULTI_ERRORS" if multiple rules fail.
          items:
            type: object
            description: Represents a single item in the RecordsInputSchema array.
            additionalProperties: false
            properties:
              name:
                type: string
                description: Represents the apply feature execution value.
                enum:
                  - layout_rules
                  - range_validation
                  - assignment_rules
                  - function_validation_rule
                  - criteria_validation_rule
                  - global_map_dependency
                  - territory_subordinates
            required:
              - name
        skip_feature_execution:
          type: array
          description: >-
            Use the "skip_feature_execution" array to skip Cadences execution
            when creating a record through the API. Specify "cadences" as the
            value of the "name" key and include this key alongside "data" in the
            request.
          items:
            type: object
            description: Represents a single item in the RecordsInputSchema array.
            additionalProperties: false
            properties:
              name:
                type: string
                description: Represents the skip feature execution value.
                enum:
                  - assignment_rules
                  - cadences
                  - connected_workflows
            required:
              - name
        trigger:
          type: array
          description: >-
            Specifies the CRM features to execute for the API request. Supported
            values are "workflow", "approval", and "blueprint". If the "trigger"
            parameter is not specified, workflows, approvals, and blueprints
            related to the API are executed. Specify an empty array [] to
            prevent these features from executing.
          items:
            type: string
            description: Represents a single item in the RecordsInputSchema array.
            enum:
              - approval
              - workflow
              - blueprint
              - pathfinder
              - orchestration
      examples:
        - data:
            - Company: ABC
              Last_Name: Daly
              First_Name: Paul
              Email: p.daly@zylker.com
              State: Texas
              Layout:
                id: '554023000002734009'
              Lead_Source: Employee Referral
          apply_feature_execution:
            - name: layout_rules
          skip_feature_execution:
            - name: cadences
          trigger:
            - approval
            - workflow
            - blueprint
            - pathfinder
            - orchestration
