        required: true
        description: >-
          To insert a single record, send only one JSON object in the input with
          the necessary keys and values. Duplicates are checked for every insert
          record API call based on unique fields. A maximum of 100 records can
          be inserted per API call. You must use only Field API names in the
          input. You can obtain the field API names from the [Fields metadata
          API](fields.yaml#$.paths./settings/fields.get) Choose "Fields" from
          the "Filter By" drop-down. In the Calls module, the call duration for
          an Inbound or Outbound call cannot be zero. For any module, specify
          all the mandatory fields while creating a record. When inserting
          multiple records, the Response JSON array maintains the same order as
          the input records, allowing each response to be mapped to its
          respective input record. In case of partial success or failure, the
          API returns an HTTP status 207 (Multi-Status), where individual
          record-level success or error details are provided within the response
          array in the same order. You must provide the layout ID field if you
          want to, include the layout specific mandatory fields in the API-level
          mandatory check. Include only the fields that are defined in your
          layout for API-level processing and ignore the rest.
      responses:
        '201':
          description: >-
            Returns the details of each successfully created record, including
            the record ID and audit metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordSuccessResponse'
              examples:
                Success:
                  summary: Successfully created a single record
                  value:
                    data:
                      - code: SUCCESS
                        details:
                          Modified_Time: '2023-05-10T01:10:47-07:00'
                          Modified_By:
                            name: Patricia Boyle
                            id: '5725767000000411001'
                          Created_Time: '2023-05-10T01:10:47-07:00'
                          id: '5725767000000524157'
                          Created_By:
                            name: Patricia Boyle
                            id: '5725767000000411001'
                          $approval_state: approved
                        message: record added
                        status: success
                  description: >-
                    Shows the 201 response for a successfully created record,
                    including the record ID, audit timestamps, and approval
                    state.
        '207':
          description: >-
            Returns a multi-status response when some record create operations
            succeed and others fail. Each item in the data array independently
            reports the outcome for the corresponding record.
          content:
            application/json:
              schema:
                type: object
                description: >-
                  Represents the response returned when a bulk record create
                  operation results in mixed success and failure outcomes.
                additionalProperties: false
                x-zs-$id: RecordsCreateMultiStatusResponse
                properties:
                  data:
                    type: array
                    description: >-
                      Contains the list of per-record results. Each item
                      represents either a successfully created record or an
                      error identified by its **code** value.
                    maxItems: 100
                    minItems: 2
                    allOf:
                      - contains:
                          type: object
                          properties:
                            status:
                              const: success
                              type: string
                              description: >-
                                The status value that must be 'success' for the
                                item to match this constraint.
                          required:
                            - status
                          description: >-
                            Ensures at least one item in the array has a
                            'success' status.
                          additionalProperties: true
                        minContains: 1
                        description: >-
                          Ensures the response contains at least one
                          successfully created record in the data array.
                      - contains:
                          type: object
                          properties:
                            status:
                              const: error
                              type: string
                              description: >-
                                The status value that must be 'error' for the
                                item to match this constraint.
                          required:
                            - status
                          description: >-
                            Ensures at least one item in the array has an
                            'error' status.
                          additionalProperties: true
                        minContains: 1
                        description: >-
                          Ensures the response contains at least one record
                          create operation that encountered an error in the data
                          array.
                    items:
                      oneOf:
                        - $ref: '#/components/schemas/RecordPostSuccessDataItem'
                        - $ref: '#/components/schemas/RecordPostErrorDataItem'
                      description: >-
                        Represents a single record create result, which is
                        either a success item or an error item identified by the
                        **status** field.
                required:
                  - data
              examples:
                MixedResults:
                  summary: >-
                    Mixed create results with one success and one validation
                    error
                  value:
                    data:
                      - code: SUCCESS
                        details:
                          Modified_Time: '2023-05-10T01:10:47-07:00'
                          Modified_By:
                            name: Patricia Boyle
                            id: '5725767000000411001'
                          Created_Time: '2023-05-10T01:10:47-07:00'
                          id: '5725767000000524157'
                          Created_By:
                            name: Patricia Boyle
                            id: '5725767000000411001'
                          $approval_state: approved
                        message: record added
                        status: success
                      - code: INVALID_DATA
                        details:
                          api_name: Last_Name
                          json_path: $.data[1].Last_Name
                        message: the field api name given seems to be invalid
                        status: error
                  description: >-
                    Shows the 207 multi-status response when one record is
                    created successfully and another fails validation.
        '400':
          description: >-
            The request could not be processed because one or more records
            contain invalid data or missing required fields.  **Resolution:**
            Each error in the data array identifies the specific record and
            field that caused the failure. The request must be corrected and
            resubmitted.
          content:
            application/json:
              schema:
