    put:
      operationId: updateRecords
      description: >-
        Updates one or more existing records in the specified module in your
        Zoho CRM organization. Use the [Get Modules
        API](modules.yaml#$.paths./settings/modules.get) to retrieve the module
        API name and the [Get Fields Metadata
        API](fields.yaml#$.paths./settings/fields.get) to retrieve the field API
        names.

        A maximum of 100 records can be updated per API call. Use only Field API
        names in the input. You can update all fields supported by the Insert
        Records API operation.

        When updating multiple records, the response array maintains the same
        order as the input records, allowing each response to be mapped to its
        corresponding input record. 

        To update multiple subform records, specify the subform API name as a
        key within the record and provide the subform records as a JSON array.
        Use the subform field API names as keys within each subform record. For
        detailed information on subforms, refer to the [Manipulating Subform
        using Zoho CRM
        APIs](https://help.zoho.com/portal/en/community/topic/kaizen-124-accessing-subform-using-zoho-crm-apis).

        Use the [Modules API](modules.yaml#$.paths./settings/modules.get) and
        [Fields Metadata API](fields.yaml#$.paths./settings/fields.get) to
        retrieve the API names of the subform and its fields. To update an
        existing subform record, include its record ID in the subform JSON
        array. Use the [Get Records API](record.yaml#$.paths./module.get) with
        the subform API name to retrieve subform record IDs.

        When adding a new subform record, it is appended to the existing
        records. Passing an empty JSON array for a subform deletes all its
        records. To delete a specific subform record, specify its record ID and
        set "_delete" to "null". Deleting the parent record also deletes all its
        subform records.
          
      summary: Update records in a specified module
      tags:
        - Records
      parameters:
        - $ref: '#/components/parameters/Module'
      requestBody:
        content:
          application/json:
            schema:
              description: >-
                Request body containing the updated resource data to modify the
                existing record.
              $ref: '#/components/schemas/RecordsPutInputSchema'
            examples:
              Leads:
                summary: Records retrieved from the Leads module
                value:
                  data:
                    - Layout:
                        id: '554023000002734009'
                      Lead_Source: Employee Referral
                      Company: ABC
                      Last_Name: Daly
                      First_Name: Paul
                      Email: p.daly@zylker.com
                      State: Texas
                      id: '111112000000142001'
                  apply_feature_execution:
                    - name: layout_rules
                  skip_feature_execution:
                    - name: cadences
                  trigger:
                    - approval
                    - workflow
                    - blueprint
                    - pathfinder
                    - orchestration
                description: >-
                  Shows the request body structure for the updateRecords
                  operation.
              SubformExample:
                value:
                  data:
                    - Last_Name: Patricia
                      Company: Info Technology
                      id: '111112000000142001'
                      Project_Details:
                        - Project_Name: Mobile App Development
                          Project_Type: Development
                          Expected_Budget: 50000
                        - Project_Name: Infrastructure Upgrade
                          Project_Type: Infrastructure
                          Expected_Budget: 30000
                description: >-
                  Example request body for updating multiple subform records.
                  "Project_Details" is the subform API name, and "Project_Name",
                  "Project_Type", and "Expected_Budget" are fields in the
                  subform.
        required: true
        description: >-
          The request body must contain a **data** array. You can include a
          maximum of 100 objects per request. Each object must include an **id**
          field to identify the record to update.
      responses:
        '200':
          description: >-
            Returns the details of each successfully updated records, including
            the record ID and audit metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordSuccessResponse'
              examples:
                Success:
                  summary: Successfully completed operation
                  value:
                    data:
                      - code: SUCCESS
                        details:
                          Modified_Time: '2023-05-10T01:10:47-07:00'
                          Modified_By:
                            name: Patricia Boyle
                            id: '5725767000000411001'
                          Created_Time: '2023-05-10T01:10:47-07:00'
                          id: '5725767000000524157'
                          Created_By:
                            name: Patricia Boyle
                            id: '5725767000000411001'
                          $approval_state: approved
                        message: record updated
                        status: success
