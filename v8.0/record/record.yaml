      description: >-
        To permanently delete a specific record by its unique ID from the
        specified module in your Zoho CRM organization. Use the [Get Records
        API](record.yaml#$.paths./module.get) to retrieve the record IDs.
      tags:
        - Records
      parameters:
        - $ref: '#/components/parameters/Module'
        - $ref: '#/components/parameters/Record'
      responses:
        '200':
          description: Returns the deletion status for each record successfully deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordDeleteByIdSuccessResponse'
              examples:
                SuccessfulDeletion:
                  summary: Successfully deleted records
                  value:
                    data:
                      - code: SUCCESS
                        message: record deleted
                        status: success
                        details:
                          id: '5843104000000624046'
                  description: >-
                    Shows the successful response for the deleteRecord
                    operation, including the record ID and audit metadata.
        '400':
          description: >-
            The request could not be processed because of an invalid module,
            missing parameters, or invalid record IDs.

            **Resolution:** The request must include valid module API name and
            record IDs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordDeleteByIdErrorResponse'
              examples:
                InvalidRecordId:
                  summary: Invalid record ID in the request URL
                  value:
                    code: INVALID_DATA
                    message: invalid record id
                    details:
                      resource_path_index: 0
                    status: error
                  description: >-
                    Shows the error response when an invalid record ID is
                    provided in the URL.
                RecordNotDeleted:
                  summary: Record could not be deleted due to invalid data
                  value:
                    code: INVALID_DATA
                    message: record not deleted
                    details:
                      resource_path_index: 1
                    status: error
                  description: >-
                    Shows the error response when a record cannot be deleted due
                    to invalid data.
                UnableToParseDataType:
                  summary: Request body or parameters in incorrect format
                  value:
                    code: INVALID_DATA
                    message: either the request body or parameters is in wrong format
                    details:
                      resource_path_index: 1
                    status: error
                  description: >-
                    Shows the error response when the request body or parameters
                    are in an incorrect format.
                InvalidModule:
                  summary: Invalid module API name in the request
                  value:
                    code: INVALID_MODULE
                    message: the module name given seems to be invalid
                    details:
                      resource_path_index: 0
                    status: error
                  description: >-
                    Shows the error response when an invalid module name is
                    provided in the request URL.
                InvalidRequestMethod:
                  summary: Unsupported HTTP method for this endpoint
                  value:
                    code: INVALID_REQUEST_METHOD
                    message: The http request method type is not a valid one
                    details: {}
                    status: error
                  description: >-
                    Shows the error response when an unsupported HTTP method is
                    used for this endpoint.
                AuthorizationFailed:
                  summary: Insufficient privileges for the operation
                  value:
                    code: AUTHORIZATION_FAILED
                    message: User does not have sufficient privilege to delete records
                    details: {}
                    status: error
                  description: >-
                    Shows the error response when the user does not have
                    sufficient privileges for this operation.
                RecordLocked:
                  summary: Record is locked and cannot be modified
                  value:
                    data:
                      - code: RECORD_LOCKED
                        details:
                          action: record_locking
                          id: '5040565000001052497'
                        message: >-
                          You cannot perform this operation as the record is
                          locked.
                        status: error
                  description: >-
                    Shows the error response when the target record is locked
                    and cannot be modified.
                NotApproved:
                  summary: Record is not approved and cannot be deleted
                  value:
                    data:
                      - code: NOT_APPROVED
                        details:
                          id: '5040565000001052497'
                        message: cannot delete record that is not approved yet
                        status: error
                  description: >-
                    Shows the error response when the record has not been
                    approved and cannot be deleted.
                MissingParam:
                  summary: Required parameter missing from the request
                  value:
                    code: REQUIRED_PARAM_MISSING
                    message: Required parameter is missing
                    details:
                      param_name: ids
                    status: error
                  description: >-
                    Shows the error response when a required parameter is
                    missing from the request.
        '401':
          description: >-
            Authentication failed because the OAuth token is missing, expired,
            or does not include the required scope.

            **Resolution:** A new access token must be generated with the
            required scope for this operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordDeleteByIdUnauthorizedResponse'
              examples:
                ScopeMismatch:
                  summary: OAuth access token missing the required scope
                  value:
                    code: OAUTH_SCOPE_MISMATCH
                    message: Unauthorized
                    status: error
                    details: {}
                  description: >-
                    Shows the 401 error response when the OAuth access token
                    does not include the required scope for this operation.
        '403':
          description: >-
            Permission denied to delete record in the specified module.

            **Resolution:** The CRM administrator must grant the required
            deletion permission to the user's profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordDeleteByIdNoPermissionResponse'
              examples:
                NoPermission:
                  summary: User profile lacks the required module permission
                  value:
                    code: NO_PERMISSION
                    message: Permission denied to delete
                    status: error
                    details:
                      permissions:
                        - Crm_Implied_View_Leads
                  description: >-
                    Shows the 403 error response when the user profile lacks the
                    required module permission.
        '404':
          description: >-
            The request URL does not match any valid API endpoint pattern.

            **Resolution:** The API endpoint URL must be verified for correct
            format and path parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordDeleteByIdInvalidUrlPatternResponse'
              examples:
                InvalidUrlPattern:
                  summary: Invalid or unrecognized API endpoint URL pattern
                  value:
                    code: INVALID_URL_PATTERN
                    message: Please check if the URL trying to access is a correct one
                    status: error
                    details: {}
                  description: >-
                    Shows the 404 error response when the API endpoint URL does
                    not match any recognized pattern.
        '500':
          description: >-
            An unexpected server error occurred while processing the request.

            **Resolution:** The request can be retried after some time. If the
            error persists, Zoho CRM support must be contacted.
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/RecordDeleteByIdInternalServerErrorResponse
              examples:
                InternalError:
                  summary: Unexpected internal server error during processing
                  value:
                    data:
                      - code: INTERNAL_ERROR
                        message: Internal Server Error
                        status: error
                        details: {}
                  description: >-
                    Shows the 500 error response when an unexpected server error
                    occurs.
      security:
        - OAuth2:
            - ZohoCRM.modules.DELETE
  /{module}/{recordId}/actions/clone:
    post:
      operationId: cloneRecord
      summary: Record Clone
      description: >-
        Clones a record in the specified module.  Use the [Get Modules
        API](modules.yaml#$.paths./settings/modules.get) to retrieve the module
        ID and API name. Use the [Get Fields Metadata
        API](fields.yaml#$.paths./settings/fields.get) to retrieve the field IDs
        and API names.

        By default, the field values of the parent record are copied to the
        cloned record. To modify or add field values, specify the field API
        names and their corresponding values in the input body. If no field
        values need to be modified, the input body can be omitted.

        Mandatory fields specified in the input must not be null. The Sample
        Inputs, Sample Responses, and Possible Errors documented for the [Insert
        Records API](record.yaml#$.paths./module.post) also apply to the [Record
        Clone API](record.yaml#$.paths./{module}/{recordId}/actions/clone.post).
      tags:
        - Records
      parameters:
        - $ref: '#/components/parameters/Module'
        - $ref: '#/components/parameters/Record'
      requestBody:
        content:
          application/json:
            schema:
              description: >-
                By default, when you clone a record, the field values of the
                parent record will also be copied to the cloned record. If you
                want to modify certain fields or to add value to some fields,
                specify their field API names and their corresponding values in
                the input body.
              $ref: '#/components/schemas/RecordsInputSchema'
            examples:
              Leads:
                summary: Records retrieved from the Leads module
                value:
                  data:
                    - Lead_Source: Employee Referral
                      Company: ABC
                      Last_Name: Daly
                      First_Name: Paul
                      Email: p.daly@zylker.com
                      State: Texas
                      id: '111112000000142001'
                  apply_feature_execution:
                    - name: layout_rules
                  skip_feature_execution:
                    - name: cadences
                description: >-
                  Use the "skip_feature_execution" array to skip Cadences
                  execution when creating a record through the API. Specify
                  "cadences" as the value of the "name" key and include this key
                  alongside "data" in the request.
        required: true
        description: >-
          The request body must contain a **data** array with one object
          containing the field values to override in the cloned record.
      responses:
        '201':
          description: >-
            Returns the details of each successfully cloned record, including
            the record ID and audit metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordSuccessResponse'
              examples:
                Success:
                  summary: Successfully completed operation
                  value:
                    data:
                      - code: SUCCESS
                        details:
                          Modified_Time: '2023-05-10T01:10:47-07:00'
                          Modified_By:
                            name: Patricia Boyle
                            id: '5725767000000411001'
                          Created_Time: '2023-05-10T01:10:47-07:00'
                          id: '5725767000000524157'
                          Created_By:
                            name: Patricia Boyle
                            id: '5725767000000411001'
                          $approval_state: approved
                        message: record added
                        status: success
                  description: >-
                    Shows the successful response for the cloneRecord operation,
                    including the record ID and audit metadata.
        '400':
          description: >-
            The request could not be processed because one or more records
            contain invalid data or missing required fields.

            **Resolution:** Each error in the data array identifies the specific
            record and field that caused the failure. The request must be
            corrected and resubmitted.
          content:
            application/json:
              schema:
                x-zs-$id: RecordCloneErrorResponse
                oneOf:
                  - $ref: '#/components/schemas/DependentFieldMissingError'
                  - $ref: '#/components/schemas/RecordDeleteByIdInvalidDataError'
                  - $ref: '#/components/schemas/RecordsIdPostErrorResponse'
                  - $ref: '#/components/schemas/InvalidModuleGETError'
              examples:
                InvalidData:
                  summary: Invalid field value in the request
                  value:
                    data:
                      - code: INVALID_DATA
                        message: The field value given for Company is invalid
                        status: error
                        details:
                          api_name: Company
                          json_path: $.data[0].Company
                  description: >-
                    Shows the error response when invalid data is provided in
                    the request.
                InvalidDataType:
                  summary: Field value with an incorrect data type
                  value:
                    data:
                      - code: INVALID_DATA
                        details:
                          expected_data_type: integer
                          api_name: Number_1
                          json_path: $.data[0].Number_1
                        message: invalid data
                        status: error
                  description: >-
                    Shows the error response when a field value does not match
                    the expected data type.
                InvalidSupportedValue:
                  summary: Unsupported value for a fixed-value field
                  value:
                    data:
                      - code: INVALID_DATA
                        details:
                          api_name: name
                          json_path: $.apply_feature_execution[0].name
                          supported_values:
                            - layout_rules
                            - range_validation
                            - assignment_rules
                            - function_validation_rule
                            - criteria_validation_rule
                            - global_map_dependency
                            - territory_subordinates
                        message: invalid data
                        status: error
                  description: >-
                    Shows the error response when an unsupported value is
                    provided for a fixed-value field.
                InvalidDataLength:
                  summary: Field value exceeds the maximum allowed length
                  value:
                    data:
                      - code: INVALID_DATA
                        details:
                          maximum_length: 2
                          api_name: Number_1
                          json_path: $.data[0].Number_1
                        message: invalid data
                        status: error
                  description: >-
                    Shows the error response when a field value exceeds the
                    maximum allowed length.
                InvalidModule:
                  summary: Invalid module API name in the request
                  value:
                    data:
                      - code: INVALID_MODULE
                        details:
                          resource_path_index: 0
                        message: the module name given seems to be invalid
                        status: error
                  description: >-
                    Shows the error response when an invalid module name is
                    provided in the request URL.
                MultipleErrors:
                  summary: Multiple validation errors in a single record
                  value:
                    data:
                      - code: MULTIPLE_OR_MULTI_ERRORS
                        details:
                          errors:
                            - code: DUPLICATE_DATA
                              details:
                                api_name: Email
                                duplicate_record:
                                  Owner:
                                    name: Prajesh Kumar S
                                    id: '4881139000000307001'
                                    zuid: '736078909'
                                  module:
                                    api_name: Leads
                                    id: '4881139000000002175'
                                  id: '4881139000000428295'
                                json_path: $.data[0].Email
                                more_records: true
                              message: duplicate data
                              status: error
                            - code: DUPLICATE_DATA
                              details:
                                api_name: Mobile
                                duplicate_record:
                                  Owner:
                                    name: Prajesh Kumar S
                                    id: '4881139000000307001'
                                    zuid: '736078909'
                                  module:
                                    api_name: Leads
                                    id: '4881139000000002175'
                                  id: '4881139000002432007'
                                json_path: $.data[0].Mobile
                                more_records: true
                              message: duplicate data
                              status: error
                        message: Multiple errors in the request
                        status: error
                  description: >-
                    Shows the error response when a single record has multiple
                    validation failures.
                DependentServiceError:
                  summary: Dependent external service error during processing
                  value:
                    data:
                      - code: DEPENDENT_SERVICE_ERROR
                        details:
                          dependency_error: NO_PERMISSION
                        message: >-
                          The dependent service does not have permission to
                          complete the operation
                        status: error
                  description: >-
                    Shows the error response when a dependent external service
                    fails during the operation.
                MandatoryNotFound:
                  summary: Required field missing from the request
                  value:
                    data:
                      - code: MANDATORY_NOT_FOUND
                        details:
                          api_name: id
                          json_path: $.data.service.id
                        message: Service Id Not Found
                        status: error
                  description: >-
                    Shows the error response when a required field is missing
                    from the request.
                MandatoryNotFoundLayoutRule:
                  summary: Layout rule mandatory field absent from the request
                  value:
                    data:
                      - code: MANDATORY_NOT_FOUND
                        details:
                          layout_rule:
                            name: Layout Rule
                            id: '5410702000000761547'
                          api_name: Phone
                          json_path: $.data[0].Phone
                        message: required field not found
                        status: error
                  description: >-
                    Shows the error response when a field made mandatory by a
                    Layout Rule is absent from the clone request. Use the [Get
                    Layouts Metadata
                    API](layouts.yaml#$.paths./settings/layouts.get) to retrieve
                    Layout IDs.
                InvalidRequestMethod:
                  summary: Unsupported HTTP method for this endpoint
                  value:
                    data:
                      - status: error
                        message: The HTTP request method type is not a valid one.
                        code: INVALID_REQUEST_METHOD
                        details:
                          resource_path_index: 0
                  description: >-
                    Shows the error response when an unsupported HTTP method is
                    used for this endpoint.
                AuthorizationFailed:
                  summary: Insufficient privileges for the operation
                  value:
                    data:
                      - code: AUTHORIZATION_FAILED
                        details:
                          resource_path_index: 0
                        message: >-
                          User does not have sufficient privilege to perform
                          this action
                        status: error
                  description: >-
                    Shows the error response when the user does not have
                    sufficient privileges for this operation.
                DuplicateDataError:
                  summary: Duplicate unique field value matches an existing record
                  value:
                    data:
                      - code: DUPLICATE_DATA
                        details:
                          api_name: Unique_1
                          duplicate_record:
                            Owner:
                              name: Pranav
                              id: '2008662000000454001'
                              zuid: '75092197'
                            id: '2008662000006256222'
                          json_path: $.data[0].Unique_1
                          id: '2008662000006256222'
                          more_records: false
                        message: duplicate data
                        status: error
                  description: >-
                    Shows the error response when a unique field value already
                    exists in the module.
                ResourcePathIndexError:
                  summary: Invalid resource path index reference
                  value:
                    data:
                      - code: INVALID_DATA
                        message: record not deleted
                        details:
                          resource_path_index: 1
                        status: error
                  description: >-
                    Shows the error response when the resource path index
                    indicates an invalid data reference.
        '401':
          description: >-
            Authentication failed because the OAuth token is missing, expired,
            or does not include the required scope.

            **Resolution:** A new access token must be generated with the
            required scope for this operation.
          content:
            application/json:
              schema:
                x-zs-$id: RecordUnauthorizedOrAuthenticationFailureResponse
                description: Represents the response schema for the cloneRecord operation.
                oneOf:
                  - $ref: '#/components/schemas/RecordUnauthorizedResponse'
                  - $ref: '#/components/schemas/RecordAuthenticationFailureResponse'
              examples:
                OauthScopeMismatch:
                  summary: OAuth access token missing the required scope
                  value:
                    code: OAUTH_SCOPE_MISMATCH
                    message: Unauthorized
                    status: error
                    details: {}
                  description: >-
                    Shows the 401 error response when the OAuth access token
                    does not include the required scope for this operation.
                AuthenticationFailure:
                  summary: Authentication token missing or invalid
                  value:
                    code: AUTHENTICATION_FAILURE
                    details: {}
                    message: Authentication failed
                    status: error
                  description: >-
                    Shows the 401 error response when the authentication token
                    is missing or invalid.
        '403':
          description: >-
            Permission denied to clone record in the specified module.

            **Resolution:** The CRM administrator must grant the required clone
