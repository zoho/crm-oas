                            - code: DUPLICATE_DATA
                              details:
                                api_name: Mobile
                                duplicate_record:
                                  Owner:
                                    name: Prajesh Kumar S
                                    id: '4881139000000307001'
                                    zuid: '736078909'
                                  module:
                                    api_name: Leads
                                    id: '4881139000000002175'
                                  id: '4881139000002432007'
                                json_path: $.data[0].Mobile
                                more_records: true
                              message: duplicate data
                              status: error
                        message: Multiple errors in the request
                        status: error
                  description: >-
                    Shows the error response when a single record has multiple
                    validation failures, such as duplicate values in two
                    different unique fields.
                DependentFieldMissing:
                  summary: Required dependent field missing from the request
                  value:
                    data:
                      - code: DEPENDENT_FIELD_MISSING
