openapi: 3.1.0
info:
  title: Records
  description: >-
    Records are the individual data entries within Zoho CRM modules, such as
    leads, contacts, deals, and other standard or custom module objects. This
    API enables developers to create, retrieve, update, delete, upsert, and
    clone records across all modules in a Zoho CRM organization.
  version: '8'
servers:
  - url: https://zohoapis.{dc}/crm/{version}
    description: >-
      Production API server for Zoho CRM. Sample request URL:
      `https://zohoapis.{dc}/crm/{version}`
    variables:
      dc:
        enum:
          - com
          - eu
          - in
          - cn
          - au
        default: com
        description: >-
          The top-level domain for the regional Zoho CRM API server. Possible
          values: **com**, **eu**, **in**, **cn**, **au**. Default: **com**.
      version:
        default: v8
        description: 'The version of the CRM API to use in the request URL. Default: **v8**.'
paths:
  /{module}:
    get:
      operationId: getRecords
      description: >-
        Retrieves records from the specified module in your Zoho CRM
        organization. Use the [Get Modules
        API](modules.yaml#$.paths./settings/modules.get) to retrieve the module
        ID and API name. Use "sort_by" and "sort_order" to control the sorting
        of records. To fetch up to 2000 records, use "page" (1-10) and
        "per_page" (maximum 200). To fetch more than 2000 records, use the
        "page_token" returned in the response. Consecutive page tokens can be
        used to navigate through up to 100,000 records. The "$has_more" key is
        returned when fetching a specific record and indicates whether more
        records are available in subforms, multi-select lookup fields, and
        multi-user lookup fields. To retrieve details of a related list, use the
        [Get Related Records
        API](related_records.yaml#$.paths./{parentRecordModule}/{parentRecord}/{relatedList}.get).
      summary: Get records from a specified module
      tags:
        - Records
      parameters:
        - $ref: '#/components/parameters/Module'
        - $ref: '#/components/parameters/Fields'
        - $ref: '#/components/parameters/TerritoryId'
        - $ref: '#/components/parameters/Ids'
        - $ref: '#/components/parameters/Cvid'
        - $ref: '#/components/parameters/Filters'
        - $ref: '#/components/parameters/CrossFilters'
        - $ref: '#/components/parameters/FilterId'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageToken'
        - $ref: '#/components/parameters/SortOrder'
        - $ref: '#/components/parameters/SortBy'
        - $ref: '#/components/parameters/Converted'
        - $ref: '#/components/parameters/IncludeChild'
      responses:
        '200':
          description: >-
            Returns the list of records retrieved from the specified module,
            including pagination metadata in the **info** object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordGETSuccessResponse'
              examples:
                Leads:
                  summary: Successful retrieval of records from the Leads module
                  value:
                    data:
                      - id: '4150868000000002175'
                        Owner:
                          name: Patricia Boyle
                          id: '4150868000000225013'
                          email: patricia.boyle@example.com
                        Company: Zylker Corp
                        First_Name: John
                        Last_Name: Doe
                        Email: john.doe@zylker.com
                        Phone: +1-555-123-4567
                        Lead_Status: Not Contacted
                        Created_Time: '2023-10-15T10:30:00+00:00'
                        Modified_Time: '2023-10-15T14:20:00+00:00'
                    info:
                      call: false
                      per_page: 5
                      next_page_token: c8582xx9e7c7
                      count: 5
                      sort_by: id
                      page: 1
                      page_token_expiry: '2022-11-11T15:08:14+05:30'
                      sort_order: desc
                      email: false
                      more_records: true
                      previous_page_token: null
                  description: >-
                    Shows a successful Get Records response for the Leads
                    module, including five records and pagination metadata in
                    the info object.
        '204':
          description: >-
            Returns an empty response when the request is successful but no
            records match the specified criteria.
        '400':
          description: >-
            The request could not be processed due to invalid input or a missing
            required parameter.  **Resolution:** The request must include all
            required parameters with valid values.
          content:
            application/json:
              schema:
                description: >-
                  Represents the error response returned when a Get Records
                  operation fails due to a validation, pagination, or processing
                  error. The specific error variant is resolved via the
                  discriminator on the **code** field.
                x-zs-$id: RecordGETErrorResponse
                oneOf:
                  - $ref: '#/components/schemas/InvalidDataGETError'
                  - $ref: '#/components/schemas/InvalidDataSortByError'
                  - $ref: '#/components/schemas/TokenBoundDataMismatchGETError'
                  - $ref: '#/components/schemas/InvalidModuleGETError'
                  - $ref: '#/components/schemas/RequiredParamMissingGETError'
                  - $ref: '#/components/schemas/LimitExceededGETError'
                  - $ref: '#/components/schemas/ExpiredValueGETError'
                  - $ref: '#/components/schemas/PatternNotMatchedGetError'
                  - $ref: >-
                      #/components/schemas/DiscretePaginationLimitExceededGETError
                  - $ref: '#/components/schemas/AmbiguityDuringProcessingGETError'
                  - $ref: '#/components/schemas/PaginationLimitExceededGETError'
              examples:
                InvalidData:
                  summary: Invalid module API name in the request URL
                  value:
                    code: INVALID_MODULE
                    details:
                      resource_path_index: 0
                    message: the module name given seems to be invalid
                    status: error
                  description: >-
                    Shows the error response when an invalid module name is
                    provided in the request URL.
                InvalidCvid:
                  summary: Invalid Custom View ID in the cvid parameter
                  value:
                    code: INVALID_DATA
                    details:
                      param_name: cvid
                    message: invalid data
                    status: error
                  description: >-
                    Shows the error response when an invalid or non-existent
                    Custom View ID is provided in the cvid parameter. Use the
                    [Get Custom Views Metadata
                    API](custom_views.yaml#$.paths./settings/custom_views.get)
                    to retrieve valid Custom View IDs.
                TokenBoundDataMismatch:
                  summary: Page token mismatch due to changed request parameters
                  value:
                    code: TOKEN_BOUND_DATA_MISMATCH
                    message: >-
                      The page_token given seems to be invalid or input param is
                      added or altered or deleted
                    status: error
                    details:
                      param_name: page_token
                  description: >-
                    Shows the error response when the page_token value does not
                    match the original request parameters used when the token
                    was generated.
                RequiredParamMissing:
                  summary: Required fields parameter missing from the request
                  value:
                    code: REQUIRED_PARAM_MISSING
                    status: error
                    details:
                      param_name: fields
                    message: required param is missing
                  description: >-
                    Shows the error response when the required fields parameter
                    is missing from the request.
                LimitExceeded:
                  summary: Field count exceeds the maximum allowed limit
                  value:
                    code: LIMIT_EXCEEDED
                    details:
                      limit: 50
                      param_name: fields
                    message: limit exceeded
                    status: error
                  description: >-
                    Shows the error response when the number of field API names
                    in the fields parameter exceeds the allowed limit of 50.
                ExpiredValue:
                  summary: Expired page_token parameter value
                  value:
                    status: error
                    code: EXPIRED_VALUE
                    message: Page token expired
                    details:
                      api_name: page_token
                      json_path: $.query.page_token
                  description: >-
                    Shows the error response when the page_token parameter value
                    has expired and can no longer be used for pagination.
                DiscretePaginationLimitExceeded:
                  summary: Pagination limit exceeded without the page_token parameter
                  value:
                    code: DISCRETE_PAGINATION_LIMIT_EXCEEDED
                    message: >-
                      You can only get the first 2000 records without using
                      page_token param
                    status: error
                    details:
                      limit: 2000
                  description: >-
                    Shows the error response when records beyond the first 2,000
                    are requested without including the page_token parameter.
                PaginationLimitExceeded:
                  summary: Pagination limit of 100,000 records exceeded
                  value:
                    code: PAGINATION_LIMIT_EXCEEDED
                    message: >-
                      You can only get upto 100000 records using page_token
                      param
                    status: error
                    details:
                      param_name: page_token
                  description: >-
                    Shows the error response when the total number of records
                    requested via page_token pagination exceeds 100,000.
        '401':
          description: >-
            Authentication failed because the OAuth token is missing, expired,
            or does not include the required scope. **Resolution:** A new access
            token must be generated with the required scope for this operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordUnauthorizedResponse'
              examples:
                ScopeMismatch:
                  summary: OAuth access token missing the required read scope
                  value:
                    code: OAUTH_SCOPE_MISMATCH
                    message: Unauthorized
                    status: error
                    details: {}
                  description: >-
                    Shows the 401 error response when the OAuth access token
                    does not include the required read scope for the requested
                    module.
        '403':
          description: >-
            Permission denied to retrieve records from the specified module. 
            **Resolution:** The CRM administrator must grant the required module
            access permission to the user's profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordPermissionResponse'
              examples:
                NoPermission:
                  summary: User profile lacks module access permission
                  value:
                    code: NO_PERMISSION
                    message: Permission denied
                    status: error
                    details:
                      permissions:
                        - Crm_Implied_View_Leads
                  description: >-
                    Shows the 403 error response when the user's CRM profile
                    does not include the permission required to retrieve records
                    from the specified module.
        '404':
          description: >-
            The request URL does not match any valid API endpoint pattern. 
            **Resolution:** The API endpoint URL must be verified for correct
            format and path parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordInvalidURLResponse'
              examples:
                InvalidUrlPattern:
                  summary: Invalid or unrecognized API endpoint URL pattern
                  value:
                    code: INVALID_URL_PATTERN
                    message: Please check if the URL trying to access is a correct one
                    status: error
                    details: {}
                  description: >-
                    Shows the 404 error response when the API endpoint URL does
                    not match any recognized pattern.
        '500':
          description: >-
            An unexpected server error occurred while processing the request. 
            **Resolution:** The request can be retried after some time. If the
            error persists, Zoho CRM support must be contacted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordInternalErrorResponse'
              examples:
                InternalError:
                  summary: Unexpected internal server error during request processing
                  value:
                    code: INTERNAL_ERROR
                    message: Internal Server Error
                    status: error
                    details: {}
                  description: >-
                    Shows the 500 error response when an unexpected server error
                    occurs while processing the request.
      security:
        - OAuth2:
            - ZohoCRM.modules.READ
    post:
      operationId: createRecords
      summary: Create records in a specified module
      description: >-
        Creates one or more records in the specified module in your Zoho CRM
        organization. Use the [Get Modules
        API](modules.yaml#$.paths./settings/modules.get) to retrieve the module
        API name. Use the [Get Fields Metadata
        API](fields.yaml#$.paths./settings/fields.get) to retrieve the available
        field API names and data types. You can create up to 100 records in a
        single API call. Specify the required field API names and their
        corresponding values in the request body.
      tags:
        - Records
      parameters:
        - $ref: '#/components/parameters/Module'
