                  data:
                    - Owner:
                        name: Patricia Boyle
                        id: '5725767000000411001'
                      Company: ABC Corp
                      First_Name: Patricia
                      Last_Name: Boyle
                      Email: boyle@abc.com
                      Phone: 111-1234567
                      Fax: 555-7654321
                      Mobile: 555-9876543
