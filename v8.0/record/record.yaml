          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordPermissionResponse'
              examples:
                NoPermission:
                  summary: User profile lacks the required module permission
                  value:
                    code: NO_PERMISSION
                    message: Permission denied
                    status: error
                    details:
                      permissions:
                        - Crm_Implied_View_Leads
                  description: >-
                    Shows the 403 error response when the user profile lacks the
