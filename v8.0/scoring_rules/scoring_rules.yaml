                    Rule ID is invalid.

                    **Resolution:** Provide a valid Scoring Rule ID.
      security:
        - OAuth2:
            - ZohoCRM.settings.scoring_rules.UPDATE
    delete:
      summary: Deactivate a scoring rule
      description: >-
        Deactivates an active scoring rule identified by `ruleId`, suspending
        its scoring evaluation without deleting it.
      x-zs-llm-description: >-
        Deactivate an active scoring rule by ruleId. The rule is retained but no
        longer evaluated during record updates. No request body required.
      operationId: deleteActivate
      parameters:
        - $ref: '#/components/parameters/ParamPathRuleid'
      responses:
        '200':
          description: Returns the operation status after the Scoring Rule is deactivated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScoringRulesDeactivateSuccessResponse'
              examples:
                Success200:
                  summary: Successful deactivate Scoring Rule response
                  value:
                    scoring_rules:
                      - code: SUCCESS
                        details:
                          id: '111114000000313122'
                        message: scoring rule deactivated successfully
                        status: success
        '400':
          description: >-
            Returns an error response when the provided Scoring Rule ID is
            invalid.

            **Resolution:** Verify that the ID is a valid Scoring Rule ID before
            retrying.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidRuleIdErrorResponse'
              examples:
                InvalidDataResponse1:
                  summary: >-
                    Error response with code INVALID_DATA: The id given seems to
                    be invalid
                  value:
                    code: INVALID_DATA
                    details:
                      resource_path_index: 3
                    message: The id given seems to be invalid
                    status: error
                  description: >-
                    Demonstrates an error response when the provided Scoring
                    Rule ID is invalid.

                    **Resolution:** Provide a valid Scoring Rule ID.
      security:
        - OAuth2:
            - ZohoCRM.settings.scoring_rules.DELETE
  /settings/automation/scoring_rules/{ruleId}/actions/clone:
    post:
      summary: Clone a scoring rule
      description: To clone a Scoring Rule in your Zoho CRM organization.
      x-zs-llm-description: >-
        Clone a scoring rule by ruleId. Creates an exact copy with name prefixed
        'Copy of'. The clone is inactive by default. Send an empty request body
        ({}).
      operationId: postClone
      parameters:
        - $ref: '#/components/parameters/ParamPathRuleid'
      requestBody:
        description: >-
          Accepts an empty JSON request body to clone the specified Scoring
          Rule.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmptyRequestBody'
            examples:
              SamplePostRequest:
                summary: Sample clone Scoring Rule request body
                value: {}
                description: >-
                  Demonstrates a sample request body for the clone Scoring Rule
                  operation.
      responses:
        '200':
          description: Returns the operation status after the Scoring Rule is cloned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScoringRuleCloneSuccessResponse'
              examples:
                Success200:
                  summary: Successful clone Scoring Rule response
                  value:
                    scoring_rules:
                      - code: SUCCESS
                        details:
                          id: '111114000000317265'
                        message: scoring rule cloned successfully
                        status: success
        '400':
          description: >-
            Returns an error response when the maximum number of active or total
            Scoring Rules for the layout has been reached.

            **Resolution:** Deactivate or delete existing Scoring Rules before
            cloning.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/InvalidRuleIdErrorResponse'
                  - type: object
                    additionalProperties: false
                    description: Wrapped error response with scoring_rules
                    properties:
                      scoring_rules:
                        type: array
                        description: >-
                          Represents an array of per-item error objects in the
                          clone Scoring Rule error response.
                        items:
                          oneOf:
                            - $ref: >-
                                #/components/schemas/GlobalScoringRuleLimitExceededErrorResponse
                            - $ref: >-
                                #/components/schemas/ActiveStateLimitErrorResponse
                        maxItems: 25
                    required:
                      - scoring_rules
                    x-zs-$id: ScoringRuleCloneErrorOption2
                x-zs-$id: ScoringRuleCloneErrorResponse
              examples:
                InvalidDataResponse1:
                  summary: >-
                    Error response with code INVALID_DATA: The id given seems to
                    be invalid
                  value:
                    code: INVALID_DATA
                    details:
                      resource_path_index: 3
                    message: The id given seems to be invalid
                    status: error
                  description: >-
                    Demonstrates an error response when the provided Scoring
                    Rule ID is invalid.

                    **Resolution:** Provide a valid Scoring Rule ID.
                LimitExceededResponse1:
                  summary: >-
                    Error response with code LIMIT_EXCEEDED: More than 10
                    scoring rules cannot be created for a layout (Field: id)
                  value:
                    scoring_rules:
                      - code: LIMIT_EXCEEDED
                        details:
                          api_name: id
                          limit: 10
                          json_path: $.scoring_rules[0].layout.id
                        message: >-
                          More than 10 scoring rules cannot be created for a
                          layout
                        status: error
                  description: >-
                    Demonstrates an error response when the total number of
                    Scoring Rules for the layout has been reached.

                    **Resolution:** Delete existing Scoring Rules before
                    cloning.
                ActiveStateLimitExceededResponse1:
                  summary: >-
                    Error response with code ACTIVE_STATE_LIMIT_EXCEEDED: More
                    than 5 active scoring rules cannot be created for a layout
                    (Field: id)
                  value:
                    scoring_rules:
                      - code: ACTIVE_STATE_LIMIT_EXCEEDED
                        details:
                          api_name: id
                          limit: 5
                          json_path: $.scoring_rules[0].layout.id
                        message: >-
                          More than 5 active scoring rules cannot be created for
                          a layout
                        status: error
                  description: >-
                    Demonstrates an error response when the maximum number of
                    active Scoring Rules for the layout has been reached.

                    **Resolution:** Deactivate existing Scoring Rules before
                    cloning.
      security:
        - OAuth2:
            - ZohoCRM.settings.scoring_rules.CREATE
components:
  schemas:
    GlobalScoringRuleLimitExceededErrorResponse:
      type: object
      additionalProperties: false
      description: >-
        Error message indicating that the maximum number of scoring rules for a
        layout has been exceeded, which is capped at 10.
      properties:
        code:
          type: string
          description: Represents the error code **LIMIT_EXCEEDED**.
          enum:
            - LIMIT_EXCEEDED
        details:
          type: object
          additionalProperties: false
          description: >-
            Represents additional validation details about the Scoring Rule
            limit error.
          properties:
            api_name:
              type: string
              description: >-
                Represents the API name of the field that triggered the limit
                exceeded error.
              maxLength: 255
            limit:
              type: integer
              format: int32
              description: >-
                Represents the maximum number of Scoring Rules allowed per
                layout.
            json_path:
              type: string
              description: >-
                Represents the JSON path of the field that triggered the limit
                exceeded error.
              maxLength: 1000
        message:
          type: string
          description: >-
            Represents the error message indicating that the Scoring Rule limit
            per layout has been reached.
          enum:
            - More than 10 scoring rules cannot be created for a layout
        status:
          type: string
          description: >-
            Represents the status of the error response. The value is always
            **error**.
          enum:
            - error
      required:
        - code
        - details
        - message
        - status
      title: Global Scoring Rule Limit Exceeded Error Response
      x-zs-$id: GlobalScoringRuleLimitExceededErrorResponse
    CreateScoringRuleRequestBody:
      type: object
