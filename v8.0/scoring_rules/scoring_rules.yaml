    put:
      summary: Update a scoring rules by ID
      description: >-
        To update a specific Scoring Rule by its ID in your Zoho CRM
        organization.
      x-zs-llm-description: >-
        Updates an existing scoring rule identified by the `ruleId` path
        parameter. The request body must contain a `scoring_rules` array with
        exactly one rule object. Partial updates are supported - only include
        the top-level fields that need to change.


        **Updatable fields:**

        - `name` - rename the scoring rule.

        - `description` - update the rule description.

        - `active` - enable or disable the rule.

        - `field_rules` - CRM field criteria mapped to scores. Each entry needs
        `criteria` and `score`.

        - `signal_rules` - interaction signal rules. Each entry needs `signal`
        and `score`. To delete a `signal_rule` entry, include its `id` with
        `_delete: null`.

        - `custom_fields` - reassign or rename CRM score field mappings (up to
        6). To delete a mapping, supply its `id` with `_delete: null`.


        **Deleting nested entries with `_delete`:**

        To remove an individual `field_rule` or `signal_rule` or `custom_field`
        entry without replacing the entire array, include the entry's `id` and
        set `_delete: null`.


        Returns 200 on success.
      operationId: putScoringRuleById
      parameters:
        - $ref: '#/components/parameters/ParamPathRuleid'
      requestBody:
        description: >-
          Accepts a JSON request body containing the updated Scoring Rule
          definition.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateScoringRulesByIDRequestBody'
