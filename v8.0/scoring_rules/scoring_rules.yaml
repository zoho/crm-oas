    post:
      summary: Scoring Rules
      description: >-
        Creates one or more scoring rules for specified modules and layouts.
        Only Leads and Contacts modules support signal rules. Deals, Accounts
        and Custom Modules do not support signal rules.
      x-zs-llm-description: >-
        Creates one or more scoring rules. Up to 10 rules per layout. Each rule
        requires `module` and `name`.


        **Required fields:**

        - `name` - scoring rule name.

        - `module` - CRM module (e.g., Leads, Contacts).

        - For Leads and Contacts: at least one of `field_rules` or
        `signal_rules` is required.

        - For other modules: `field_rules` is required.


        **field_rules** - CRM field criteria mapped to scores. Each entry needs
        `criteria` (filter on a CRM field) and `score` (integer, -100 to 100).


        **signal_rules** - interaction signal criteria. Each entry needs
        `signal` (with `namespace` and `id`) and `score`.


        **Optional:** `description`, `active` (default true), `layout` (null
        means all layouts), `custom_fields` (up to 6 CRM score field mappings).


        Returns 201 if all rules are created. Returns 207 (multi-status) if some
        fail.
      operationId: postScoringRules
      requestBody:
        description: >-
          Accepts a JSON request body containing an array of Scoring Rule
          definitions to create.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateScoringRuleRequestBody'
            examples:
              SamplePostRequest:
                summary: Sample create Scoring Rules request body
                value:
                  scoring_rules:
                    - description: ''
                      active: true
                      custom_fields:
                        - field_label: Lead - Scoring Score
                          reference_field:
                            api_name: Score
                        - field_label: Lead - Scoring Touch point Score
                          reference_field:
                            api_name: Touch_Point_Score
                      field_rules:
                        - criteria:
                            group_operator: and
                            group:
                              - field:
                                  api_name: CF_Date
                                  id: '111114000000081970'
                                  field_label: CF Date
                                  data_type: date
                                comparator: equal
                                value: '2025-11-19'
                                type: value
                              - field:
                                  api_name: Company
                                  id: '111114000000004780'
                                  field_label: Company
                                  data_type: text
                                comparator: equal
                                value: Zohho
                                type: value
                          score: 10
                        - criteria:
                            field:
                              api_name: Country
                              id: '111114000000004892'
                              field_label: Country
                              data_type: text
                            comparator: not_equal
                            value: ${EMPTY}
                            type: value
                          score: -10
                      signal_rules:
                        - signal:
                            namespace: zoho.emailinsight.bounce
                            id: '111114000000034755'
                          score: -99
                        - signal:
                            namespace: zoho.emailinsight.open
                            id: '111114000000034749'
                          score: 10
                        - signal:
                            namespace: zoho.emailinsight.click
                            id: '111114000000034752'
                          score: 100
                      layout:
                        id: '111114000000003626'
                        api_name: Standard
                        display_label: Standard
                      module:
                        api_name: Leads
                        id: '111114000000002628'
                      name: Lead - Scoring
            x-zs-llm-examples:
              - SamplePostRequest
      responses:
        '201':
          description: >-
            Scoring rule is created successfully, but one or more custom fields
            are not created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateScoringRuleSuccessResponse'
              examples:
                Success201:
                  summary: Successful create Scoring Rules response
                  value:
                    scoring_rules:
                      - code: SUCCESS
                        details:
                          id: '2995635000023340017'
                        message: scoring rule created successfully
                        status: success
        '207':
          description: >-
            Returns per-item operation statuses when some Scoring Rule items
            succeed and others fail in the same request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartialSuccessResponse'
              examples:
                Success207:
                  summary: Partial success create Scoring Rules response
                  value:
                    scoring_rules:
                      - code: MANDATORY_NOT_FOUND
                        details:
                          api_name: name
                          json_path: $.scoring_rules[0].name
                        message: required field not found
                        status: error
                      - code: SUCCESS
                        details:
                          id: '2995635000023340019'
                        message: scoring rule created successfully
                        status: success
        '400':
          description: >-
            Returns an error response when the request contains invalid or
            missing data.

            **Resolution:** Verify that all field values are valid and required
            fields are present.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                description: >-
                  Represents the wrapped error response containing per-item
                  error objects for the create Scoring Rules operation.
                properties:
                  scoring_rules:
                    type: array
                    description: >-
                      Represents an array of per-item error objects in the
                      create Scoring Rules error response.
                    items:
                      $ref: '#/components/schemas/GeneralErrorResponse'
                    maxItems: 250
                required:
                  - scoring_rules
                x-zs-$id: ScoringRulesErrorResponse
              examples:
