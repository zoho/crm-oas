openapi: 3.1.0
info:
  title: Scoring Rules
  description: >-
    Zoho CRM provides a system for ranking records within a module based on
    rules that you define according to your business requirements.


    A record's **score** is a value calculated using these predefined rules.
    This feature helps you identify and prioritize the most valuable records.


    For more information, see **[Multiple Scoring
    Rules](https://help.zoho.com/portal/en/kb/crm/automate-business-processes/scoring-rules/articles/multiple-scoring-rule)**.


    The following table outlines the availability and limitations of scoring
    rules based on different editions of Zoho CRM.

    ### Supported Editions and Limits


    | Edition | Multiple Layout Support | Active Rules per Module | Total Rules
    per Module | Number of Criteria per Rule |

    |---------|--------------------------|-------------------------:|------------------------:|----------------------------:|

    | Standard (S) | No | 1 | 1 | 10 |

    | ZohoOne Standard (Y) | No | 1 | 1 | 10 |

    | Professional (P, R) | No | 1 | 1 | 20 |

    | Developer (D) | Yes - 2 layouts | 15 | 30 | 5 |

    | Enterprise (E, A) | Yes - 4 layouts | 25 | 50 | 30 |

    | ZohoOne Enterprise (Z) | Yes - 4 layouts | 25 | 50 | 30 |

    | CrmPlus (C) | Yes - 7 layouts | 40 | 80 | 50 |

    | Ultimate (U) | Yes - 7 layouts | 40 | 80 | 50 |
  version: '8'
servers:
  - url: https://zohoapis.{dc}/crm/{version}
    description: >-
      Zoho CRM API server. Sample request URL:
      `https://zohoapis.{dc}/crm/{version}`
    variables:
      dc:
        description: >-
          Specifies the data center domain for the Zoho CRM API server. Possible
          values: **com**, **eu**, **in**, **cn**, **au**, **ca**, **jp**.
          Default: **com**.
        default: com
        enum:
          - com
          - eu
          - in
          - cn
          - au
          - ca
          - jp
      version:
        description: >-
          Specifies the API version. Possible values: **v7**, **v7.1**, **v8**.
          Default: **v8**.
        default: v8
paths:
  /settings/automation/scoring_rules:
    get:
      summary: Scoring Rules
      description: >-
        To retrieve a list of Scoring Rules configured in your Zoho CRM
        organization.
      x-zs-llm-description: >-
        Retrieves a paginated list of scoring rules configured in the CRM.
        Results can be filtered by module API name (`module`), layout ID
        (`layout_id`), or rule name (`name`). Each rule includes its field-based
        criteria, touch-point signal rules, custom score fields, layout, module,
        and audit metadata. Returns 204 with no body if no scoring rules are
        configured.
      operationId: getScoringRules
      parameters:
        - $ref: '#/components/parameters/ParamQueryModule'
        - $ref: '#/components/parameters/ParamQueryLayoutId'
        - $ref: '#/components/parameters/ParamQueryPage'
        - $ref: '#/components/parameters/ParamQueryPerPage'
        - $ref: '#/components/parameters/ParamQueryName'
        - $ref: '#/components/parameters/ParamQueryFields'
        - $ref: '#/components/parameters/ParamQueryActive'
