    put:
      summary: Scoring Rules
      description: >-
        Updates one or more scoring rules. Returns 200 (all success) or 207
        (partial success).
      x-zs-llm-description: >-
        Bulk-updates one or more scoring rules in a single request. Each rule in
        `scoring_rules` must identify the target via `id`. Partial updates are
        supported - only include fields that need to change; omitted fields are
        left unchanged.


        **Updatable fields per rule:**

        - `name` - rename the scoring rule.

        - `description` - update the rule description.

        - `active` - enable or disable the rule.

        - `field_rules` - CRM field criteria mapped to scores. Each entry needs
        `criteria` and `score`.

        - `signal_rules` - interaction signal rules. To delete an entry, supply
        its `id` with `_delete: null`.

        - `custom_fields` - reassign or rename score field mappings (up to 6).
        To delete an entry, supply its `id` with `_delete: null`.


        **Deleting nested entries with `_delete`:**

        To remove an individual `signal_rule` or `custom_field` entry without
        replacing the entire array, include its `id` and set `_delete: null`.


        Returns 200 if all succeed, 207 (multi-status) if some fail.
      operationId: putScoringRules
      requestBody:
        description: >-
          Accepts a JSON request body containing an array of Scoring Rule
          updates.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateScoringRulesRequestBody'
            examples:
              SamplePutRequest:
                summary: Sample update Scoring Rules request body
                value:
                  scoring_rules:
                    - id: '111114000000072349'
                      field_rules:
                        - criteria:
                            field:
                              api_name: Country
                              id: '111114000000004892'
                              data_type: text
                            comparator: not_equal
                            value: ${EMPTY}
                            type: value
                          score: -10
                        - id: '111114000000004892'
                          score: 45
                    - id: '111114000000072349'
                      name: Altered Scoring
                    - id: '111114000000072349'
                      signal_rules:
                        - id: '111114000000012345'
                          _delete: null
                      custom_fields:
                        - field_label: Contact Total Score
                          reference_field:
                            api_name: Score
            x-zs-llm-examples:
              - SamplePutRequest
      responses:
        '200':
          description: Rules updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScoringRulesPutSuccessResponse'
              examples:
                Success200:
                  summary: Successful update Scoring Rules response
                  value:
                    scoring_rules:
                      - code: SUCCESS
                        details:
                          id: '111114000000313122'
                        message: scoring rule updated successfully
                        status: success
                      - code: SUCCESS
                        details:
                          id: '111114000000313143'
                        message: scoring rule updated successfully
                        status: success
        '207':
          description: Few rule object has errors, others are updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PutScoringRulesPartialSuccessResponse'
              examples:
                Success207:
                  summary: Partial success update Scoring Rules response
                  value:
                    scoring_rules:
                      - code: SUCCESS
                        details:
                          id: '111114000000313122'
                        message: scoring rule updated successfully
                        status: success
                      - code: INVALID_DATA
                        details:
                          api_name: id
                          json_path: $.scoring_rules[0].id
                        message: The id given seems to be invalid
                        status: error
                      - code: SUCCESS
                        details:
                          id: '111114000000313143'
                        message: scoring rule updated successfully
                        status: success
        '400':
          description: >-
            Returns an error response when the request contains invalid or
            missing data.

            **Resolution:** Verify that all field values are valid and required
            fields are present.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                description: >-
                  Represents the wrapped error response containing per-item
                  error objects for the update Scoring Rules operation.
                properties:
                  scoring_rules:
                    type: array
                    description: >-
                      Represents an array of per-item error objects in the
                      update Scoring Rules error response.
                    items:
                      $ref: '#/components/schemas/GeneralErrorResponse'
                    maxItems: 25
                required:
                  - scoring_rules
                x-zs-$id: ScoringRulesPutErrorResponse
              examples:
                InvalidDataResponse1:
                  summary: 'Error response: INVALID_DATA for invalid rule name'
                  value:
                    scoring_rules:
                      - code: INVALID_DATA
                        details:
                          maximum_length: 25
                          api_name: name
                          json_path: $.scoring_rules[0].name
                        message: invalid data
                        status: error
                  description: >-
                    Demonstrates an error when the Scoring Rule name contains
                    invalid data.

                    **Resolution:** Provide a valid name that meets the format
                    requirements.
                InvalidDataResponse2:
                  summary: >-
                    Error response with code INVALID_DATA: invalid data (Field:
                    name)
                  value:
                    scoring_rules:
                      - code: INVALID_DATA
                        details:
                          regex: '[^`~#%^&*()+=";<>\[\]{}|\\]+$'
                          api_name: name
                          json_path: $.scoring_rules[0].name
                        message: invalid data
                        status: error
                  description: >-
                    Demonstrates an error when the Scoring Rule name contains
                    invalid data.

                    **Resolution:** Provide a valid Scoring Rule name.
                DuplicateDataResponse1:
                  summary: >-
                    Error response with code DUPLICATE_DATA: The data is already
                    given in the name (Field: name)
                  value:
                    scoring_rules:
                      - code: DUPLICATE_DATA
                        details:
                          api_name: name
                          json_path: $.scoring_rules[0].name
                        message: The data is already given in the name
                        status: error
                  description: >-
                    Demonstrates an error when a duplicate Scoring Rule name is
                    detected.

                    **Resolution:** Provide a unique name for the Scoring Rule.
                InvalidDataResponse3:
                  summary: >-
                    Error response with code INVALID_DATA: invalid data (Field:
                    description)
                  value:
                    scoring_rules:
                      - code: INVALID_DATA
                        details:
                          maximum_length: 500
                          api_name: description
                          json_path: $.scoring_rules[0].description
                        message: invalid data
                        status: error
                  description: >-
                    Demonstrates an error when the description contains invalid
                    data.

                    **Resolution:** Ensure the description value is valid.
                AlreadyUsedResponse1:
                  summary: >-
                    Error response with code ALREADY_USED: The custom field has
                    already used in other places (Field: id)
                  value:
                    scoring_rules:
                      - code: ALREADY_USED
                        status: error
                        details:
                          api_name: id
                          id: '1000000000047'
                          json_path: $.scoring_rules[0].custom_fields[2].id
                          associated_places:
                            - name: L WFR
                              id: '1000000067060'
                              type: workflow
                        message: The custom field has already used in other places
                  description: >-
                    Demonstrates an error when a custom field is already in use
                    in another Scoring Rule.

                    **Resolution:** Use a different custom field.
                FieldLimitExceededResponse1:
                  summary: >-
                    Error response with code FIELD_LIMIT_EXCEEDED: Field limit
                    reached for the given field type in the given module
                  value:
                    scoring_rules:
                      - code: FIELD_LIMIT_EXCEEDED
                        status: error
                        details:
                          limit: 40
                        message: >-
                          Field limit reached for the given field type in the
                          given module
                DuplicateDataResponse2:
                  summary: >-
                    Error response with code DUPLICATE_DATA: Field label
                    duplicate (Field: field_label)
                  value:
                    scoring_rules:
                      - code: DUPLICATE_DATA
                        status: error
                        details:
                          api_name: field_label
                          json_path: $.scoring_rules[0].custom_fields[0].field_label
                        message: Field label duplicate
                  description: >-
                    Demonstrates an error when a duplicate custom field label is
                    detected.

                    **Resolution:** Provide a unique display name for each
                    custom field.
                InvalidDataResponse4:
                  summary: >-
                    Error response with code INVALID_DATA: Special characters in
                    field label (Field: field_label)
                  value:
                    scoring_rules:
                      - code: INVALID_DATA
                        details:
                          api_name: field_label
                          json_path: $.scoring_rules[0].custom_fields[0].field_label
                        message: Special characters in field label
                        status: error
                  description: >-
                    Demonstrates an error when the `field_label` contains
                    special characters.

                    **Resolution:** Remove special characters from the field
                    label.
                InvalidDataResponse5:
                  summary: >-
                    Error response with code INVALID_DATA: invalid data (Field:
                    field_label)
                  value:
                    scoring_rules:
                      - code: INVALID_DATA
                        details:
                          maximum_length: 50
                          api_name: field_label
                          json_path: $.scoring_rules[0].custom_fields[0].field_label
                        message: invalid data
                        status: error
                  description: >-
                    Demonstrates an error when the `field_label` contains
                    invalid data.

                    **Resolution:** Provide a valid display name for the custom
                    field.
                InvalidDataResponse6:
                  summary: >-
                    Error response with code INVALID_DATA: Reference field
                    api_name given seems to be invalid (Field: api_name)
                  value:
                    scoring_rules:
                      - code: INVALID_DATA
                        status: error
                        details:
                          api_name: api_name
                          json_path: >-
                            $.scoring_rules[0].custom_fields[0].reference_field.api_name
                          supported_values:
                            - Positive_Score
                            - Negative_score
                            - Touch_Point_score
                            - Touch_Point_Positive_Score
                            - Touch_Point_Negative_Score
                            - Score
                        message: Reference field api_name given seems to be invalid
                  description: >-
                    Demonstrates an error when the reference field API name is
                    invalid.

                    **Resolution:** Provide a valid API name for the reference
                    field.
                InvalidDataResponse7:
                  summary: >-
                    Error response with code INVALID_DATA: The id given seems to
                    be invalid (Field: id)
                  value:
                    scoring_rules:
                      - code: INVALID_DATA
                        status: error
                        details:
                          api_name: id
                          json_path: $.scoring_rules[0].custom_fields[1].id
                        message: The id given seems to be invalid
                  description: |-
                    Demonstrates an error when the custom field ID is invalid.
                    **Resolution:** Provide a valid custom field ID.
                InvalidDataResponse8:
                  summary: >-
                    Error response with code INVALID_DATA: The id given seems to
                    be invalid (Field: id)
                  value:
                    scoring_rules:
                      - code: INVALID_DATA
                        status: error
                        details:
                          api_name: id
                          json_path: >-
                            $.scoring_rules[0].custom_fields[0].reference_field.id
                        message: The id given seems to be invalid
                  description: >-
                    Demonstrates an error when the reference field ID is
                    invalid.

                    **Resolution:** Provide a valid reference field ID.
                MandatoryNotFoundResponse1:
                  summary: >-
                    Error response with code MANDATORY_NOT_FOUND: required field
                    not found (Field: reference_field | field_label)
                  value:
                    scoring_rules:
                      - code: MANDATORY_NOT_FOUND
                        status: error
                        details:
                          api_name: reference_field | field_label
                          json_path: >-
                            $.scoring_rules[0].custom_fields[0].reference_field
                            | $.scoring_rules[0].custom_fields[0].field_label
                        message: required field not found
                  description: >-
                    Demonstrates an error when a required field is missing from
                    the request.

                    **Resolution:** Include all required fields in the request.
                AmbiguityDuringProcessingResponse1:
                  summary: >-
                    Error response with code AMBIGUITY_DURING_PROCESSING:
                    Ambiguity while processing the request
                  value:
                    scoring_rules:
                      - code: AMBIGUITY_DURING_PROCESSING
                        status: error
                        details:
                          ambiguity_due_to:
                            - api_name: id
                              json_path: >-
                                $.scoring_rules[0].custom_fields[0].reference_field.id
                            - api_name: api_name
                              json_path: >-
                                $.scoring_rules[0].custom_fields[0].reference_field.api_name
                        message: Ambiguity while processing the request
                  description: >-
                    Demonstrates an error when ambiguity occurs during request
                    processing.

                    **Resolution:** Review the request for conflicting field
                    references.
                ExpectedFieldMissingResponse1:
                  summary: >-
                    Error response with code EXPECTED_FIELD_MISSING: Specify
                    atleast one field
                  value:
                    scoring_rules:
                      - code: EXPECTED_FIELD_MISSING
                        status: error
                        details:
                          expected_fields:
                            - api_name: api_name
                              json_path: >-
                                $.scoring_rules[0].custom_fields[0].reference_field.api_name
                            - api_name: id
                              json_path: >-
                                $.scoring_rules[0].custom_fields[0].reference_field.id
                        message: Specify atleast one field
                  description: >-
                    Demonstrates an error when the reference field value is
                    empty in the Scoring Rule.

                    **Resolution:** Include at least one field(id or api_name)
                    in the reference field value object.
                DuplicateDataResponse3:
                  summary: >-
                    Error response with code DUPLICATE_DATA: Field label
                    duplicate (Field: field_label)
                  value:
                    scoring_rules:
                      - code: DUPLICATE_DATA
                        details:
                          api_name: field_label
                          json_path: $.scoring_rules[0].custom_fields[0].field_label
                        message: Field label duplicate
                        status: error
                  description: >-
                    Demonstrates an error when a duplicate custom field label is
                    detected.

                    **Resolution:** Provide a unique display name for each
                    custom field.
                AlreadyUsedResponse2:
                  summary: >-
                    Error response with code ALREADY_USED: Duplicate reference
                    field (Field: reference_field)
                  value:
                    scoring_rules:
                      - code: ALREADY_USED
                        details:
                          api_name: reference_field
                          json_path: $.scoring_rules[0].custom_fields[1].reference_field
                        message: Duplicate reference field
                        status: error
                  description: >-
                    Demonstrates an error when the request submits the same
                    reference field for more than one custom field or the
                    reference field is already associated with another custom
                    field in same Scoring Rule.

                    **Resolution:** Assign each reference field to only one
                    custom field.
                NotAllowedResponse1:
                  summary: >-
                    Error response with code NOT_ALLOWED: System keyword not
                    allowed in field label (Field: field_label)
                  value:
                    scoring_rules:
                      - code: NOT_ALLOWED
                        details:
                          api_name: field_label
                          json_path: $.scoring_rules[0].custom_fields[0].field_label
                        message: System keyword not allowed in field label
                        status: error
                  description: >-
                    Demonstrates an error when the field_label contains a
                    reserved system keyword.

                    **Resolution:** Use a label that does not contain reserved
                    system keywords.
                DuplicateDataResponse4:
                  summary: >-
                    Error response with code DUPLICATE_DATA: The criteria is
                    already available in the rule (Field: criteria)
                  value:
                    scoring_rules:
                      - code: DUPLICATE_DATA
                        details:
