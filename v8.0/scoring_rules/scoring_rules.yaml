    delete:
      summary: Scoring Rules
      description: Permanently deletes multiple scoring rules
      x-zs-llm-description: >-
        Bulk-delete scoring rules. Provide `ids` query parameter with
        comma-separated numeric rule IDs. Returns 200 if all succeed, 207
        (multi-status) if some IDs are invalid.
      operationId: deleteScoringRules
      parameters:
        - $ref: '#/components/parameters/ParamQueryIds'
      responses:
        '200':
          description: All rules are deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScoringRulesDeleteAllResponse'
              examples:
                Success200:
                  summary: Successful delete Scoring Rules response
                  value:
                    scoring_rules:
                      - code: SUCCESS
                        details:
                          id: '111114000000317218'
                        message: scoring rule deleted successfully
                        status: success
                      - code: SUCCESS
                        details:
                          id: '111114000000317220'
                        message: scoring rule deleted successfully
                        status: success
        '207':
          description: >-
            Returns per-item operation statuses when some Scoring Rule IDs are
            invalid while others are successfully deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScoringRulesDelete207Response'
              examples:
                Success207:
                  summary: Partial success delete Scoring Rules response
                  value:
                    scoring_rules:
                      - code: INVALID_DATA
                        details:
                          id: '111114000000317200'
                        message: The id given seems to be invalid
                        status: error
                      - code: SUCCESS
                        details:
                          id: '111114000000317218'
                        message: scoring rule deleted successfully
                        status: success
                  description: >-
                    Demonstrates a multi-status response when some Scoring Rule
                    IDs are invalid while others are successfully deleted.
      security:
        - OAuth2:
            - ZohoCRM.settings.scoring_rules.DELETE
  /settings/automation/scoring_rules/{ruleId}:
    get:
      summary: Get scoring rule by ID
      description: >-
        To retrieve the details of a specific Scoring Rule by its ID in your
        Zoho CRM organization.
      x-zs-llm-description: >-
        Retrieves the complete details of a single scoring rule by its unique
        `ruleId`. The response includes field-based scoring criteria
        (`field_rules`), touch-point signal rules (`signal_rules`), custom score
        tracking fields (`custom_fields`), associated layout and module, and
        audit metadata such as `created_by`, `modified_by`, and timestamps.
        Returns 204 with no body if no rule exists for the given ID.
      operationId: getScoringRuleById
      parameters:
        - $ref: '#/components/parameters/ParamPathRuleid'
        - $ref: '#/components/parameters/ParamQueryIncludeInnerDetails'
      responses:
        '200':
          description: Returns the details of the Scoring Rule matching the specified ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponseGETById'
              examples:
                Success200:
                  summary: Successful get Scoring Rule by ID response
                  value:
                    scoring_rules:
                      - created_time: '2025-11-19T19:56:51+05:30'
                        has_signal_rules: false
                        custom_fields:
                          - api_name: Lead_Scoring_Score
                            id: '111114000000314018'
                          - api_name: Lead_Scoring_Touch_point_Score
                            id: '111114000000314035'
                        module:
                          api_name: Leads
                          id: '111114000000002628'
                        active: false
                        description: null
