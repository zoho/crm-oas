openapi: 3.1.0
info:
  title: Blueprint States
  description: >-
    Blueprint states are the individual stages defined within a Zoho CRM
    Blueprint that represent steps in a structured business process. This API
    enables developers to retrieve, create, update, and delete the states
    configured within a Blueprint.
  version: '8'
servers:
  - url: https://zohoapis.{dc}/crm/{version}
    description: >-
      Production API server for Zoho CRM. Sample request URL:
      `https://zohoapis.{dc}/crm/{version}`
    variables:
      dc:
        description: >-
          The top-level domain for the regional Zoho API server. Possible
          values: **eu**, **com**, **au**, **in**, **jp**, **cn**, **ca**.
          Default: **com**.
        default: com
        enum:
          - eu
          - com
          - au
          - in
          - jp
          - cn
          - ca
      version:
        description: 'The API version used in all request URLs. Default: **v8**.'
        default: v8
security:
  - OAuth2:
      - ZohoCRM.settings.blueprint.states.READ
paths:
  /settings/blueprints/{blueprintId}/states:
    get:
      summary: Get Blueprint States
      description: >-
        To retrieve the states associated with a specific Blueprint in your Zoho
        CRM organization.
      x-zs-llm-description: >-
        List blueprint states for a blueprintId; requires 'ids' query param with
        comma-separated state IDs. CIRCULAR DEPENDENCY WARNING: to get state IDs
        you need to know them in advance. Workaround: call getBlueprintId with
        include=state to retrieve state IDs from the blueprint detail first,
        then use those IDs here.
      operationId: getBlueprintStates
      parameters:
        - name: blueprintId
          in: path
          required: true
          schema:
            type: string
            format: int64
            pattern: ^[0-9]+
            minLength: 1
            maxLength: 19
          description: >-
            Specify the [ID of the
            Blueprint](blueprints.yaml#$.paths./settings/blueprints.get) for
            which you want to retrieve the states.
        - $ref: '#/components/parameters/ParamHeaderXZohoService'
        - $ref: '#/components/parameters/ParamQueryIds'
      responses:
        '200':
          description: Returns the list of states configured for the specified Blueprint.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlueprintStateListResponse'
              examples:
                Success200:
                  summary: Successful Retrieval of Blueprint States
                  value:
                    states:
                      - process_id: '111111000000113045'
                        state_escalation:
                          period: Days
                          value: 1
                          trigger_details:
                            - period: Days
                              execute_type: 'on'
                              id: '111111000000118021'
                              value: 0
                              actions:
                                - details:
                                    escalate_to:
                                      - id: '111111000000057846'
                                        type: user
                                  name: SLA
                                  id: '111111000000118022'
                                  type: sla
                            - period: Hours
                              execute_type: 'on'
                              id: '111111000000118023'
                              value: 1
                              actions:
                                - details:
                                    escalate_to:
                                      - id: '111111000000057846'
                                        type: user
                                  name: SLA
                                  id: '111111000000118024'
                                  type: sla
                            - period: Days
                              execute_type: 'on'
                              id: '111111000000118025'
                              value: 2
                              actions:
                                - details:
                                    escalate_to:
                                      - id: '111111000000057846'
                                        type: user
                                  name: SLA
                                  id: '111111000000118026'
                                  type: sla
                        module:
                          api_name: Leads
                          id: '111111000000002624'
                        pick_list_value:
                          actual_value: Option 1
                          id: '111111000000085001'
          headers:
            X-API-CREDITS-REMAINING:
              schema:
                type: string
                format: int64
                description: >
                  Present when >=50% of base daily credits (excluding add-on
                  credits) are consumed. Value is total remaining credits
                  including add-on credits for the rolling 24-hour window.
                pattern: ^[0-9]+$
                minLength: 1
                maxLength: 19
              required: false
        '207':
          description: >-
            Returns a multi-status response. Each item in the array
            independently indicates success or failure for the corresponding
            record in the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlueprintStateListMultiStatusResponse'
              examples:
                Success207:
                  summary: >-
                    Successful Retrieval of Blueprint States With Escalation
                    Details
                  value:
                    states:
                      - process_id: '111111000000205815'
                        state_escalation:
                          period: days
                          value: 2
                          trigger_details:
                            - period: days
                              execute_type: after
                              id: '111111000000205823'
                              value: 2
                              actions:
                                - name: Default SLA Alert
                                  details:
                                    escalate_to:
                                      - id: '111111000000059900'
                                        type: user
                                  id: '111111000000205827'
                                  type: sla
                        module:
                          api_name: Leads
                          id: '111111000000002830'
                        pick_list_value:
                          actual_value: '-None-'
                          id: '111111000000007736'
                      - code: INVALID_DATA
                        details:
                          param_name: ids
                          id: '1234'
                        message: the id given seems to be invalid
                        status: error
          headers:
            X-API-CREDITS-REMAINING:
              schema:
                type: string
                format: int64
                description: >
                  Present when >=50% of base daily credits (excluding add-on
                  credits) are consumed. Value is total remaining credits
                  including add-on credits for the rolling 24-hour window.
                pattern: ^[0-9]+$
                minLength: 1
                maxLength: 19
              required: false
        '400':
          description: >-
            The request cannot be processed due to invalid syntax.
            **Resolution:** The request syntax must be corrected before
            resubmitting.
          content:
            application/json:
              schema:
                x-zs-$id: Getsettingsblueprintsblueprintidstates400
                oneOf:
                  - $ref: '#/components/schemas/InvalidResourcePathError'
                  - $ref: '#/components/schemas/ErrorResponseCore15'
                  - $ref: '#/components/schemas/MissingModuleParameterError'
              examples:
                InvalidDataResponse1:
                  summary: INVALID_DATA Error for an Invalid Blueprint Process ID
                  value:
                    code: INVALID_DATA
                    details:
                      resource_path_index: 2
                    message: the process id given seems to be invalid
                    status: error
                RequiredHeaderMissingResponse1:
                  summary: REQUIRED_HEADER_MISSING Error for a Missing Request Header
                  value:
                    code: REQUIRED_HEADER_MISSING
                    details:
                      header_name: X-CRM-ORG
                    message: One of the expected headers is missing
                    status: error
                RequiredParamMissingResponse1:
                  summary: REQUIRED_PARAM_MISSING Error When ids Parameter Is Absent
                  value:
                    code: REQUIRED_PARAM_MISSING
                    details:
                      param_name: ids
                    message: required param not found
                    status: error
          headers:
            X-API-CREDITS-REMAINING:
              schema:
                type: string
                format: int64
                description: >
                  Present when >=50% of base daily credits (excluding add-on
                  credits) are consumed. Value is total remaining credits
                  including add-on credits for the rolling 24-hour window.
                pattern: ^[0-9]+$
                minLength: 1
                maxLength: 19
              required: false
        '403':
          description: >-
            Permission denied to retrieve Blueprint states. **Resolution:** The
            CRM administrator must grant the required permission to the user's
            profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoPermissionError'
              examples:
                NoPermissionResponse:
                  summary: NO_PERMISSION Error When Retrieving Blueprint States
                  value:
                    code: NO_PERMISSION
                    details:
                      permissions:
                        - Crm_Implied_Manage_Workflow
                    message: permission denied
                    status: error
          headers:
            X-API-CREDITS-REMAINING:
              schema:
                type: string
                format: int64
                description: >
                  Present when >=50% of base daily credits (excluding add-on
                  credits) are consumed. Value is total remaining credits
                  including add-on credits for the rolling 24-hour window.
                pattern: ^[0-9]+$
                minLength: 1
                maxLength: 19
              required: false
      security:
        - OAuth2:
            - ZohoCRM.settings.blueprint.states.READ
    put:
      summary: Update Blueprint States
      description: >-
        To update Blueprint states within a specified Blueprint in your Zoho CRM
        organization. Actions used in state escalations must be created with
        **feature_type** set to **blueprint_state**; actions created with
        **feature_type** set to **blueprint_transition** cannot be used in state
        escalation contexts.
      x-zs-llm-description: >-
        Batch-update blueprint states by their IDs within a blueprintId;
        supports escalation period, trigger_details, and actions.
      operationId: updateBlueprintStates
      parameters:
        - name: blueprintId
          in: path
          required: true
          schema:
            type: string
            format: int64
            pattern: ^[0-9]+
            minLength: 1
            maxLength: 19
          description: >-
            Specify the [unique ID of the
            Blueprint](blueprints.yaml#$.paths./settings/blueprints.get) for
            which you want to update the states.
        - $ref: '#/components/parameters/ParamHeaderXZohoService'
      requestBody:
        description: The request body must contain a **states** array with one object.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlueprintStateBatchUpdateRequest'
            examples:
              SamplePutRequest:
                summary: Update Blueprint States With Escalation Details
                value:
                  states:
                    - id: '111111000000101033'
                      state_escalation:
                        period: days
                        value: 10
                        trigger_details:
                          - period: days
                            execute_type: 'on'
                            value: 14
                            actions:
                              - details:
                                  escalate_to:
                                    - id: '111111000000057619'
                                      type: user
                                  name: SLA
                                name: SLA
                                type: sla
              SampleSLARolePutRequest:
                summary: Sample SLA Action With Role Recipient
                value:
                  states:
                    - id: '111111000000101033'
                      state_escalation:
                        period: days
                        value: 10
                        trigger_details:
                          - period: days
                            execute_type: 'on'
                            value: 14
                            actions:
                              - details:
                                  escalate_to:
                                    - id: '111111000000057620'
                                      type: role
                                  name: SLA Role
                                type: sla
              SampleSLAGroupPutRequest:
                summary: Update Blueprint State SLA Escalation With Group Recipient
                value:
                  states:
                    - id: '111111000000101033'
                      state_escalation:
                        period: days
                        value: 10
                        trigger_details:
                          - period: days
                            execute_type: 'on'
                            value: 14
                            actions:
                              - details:
                                  escalate_to:
                                    - id: '111111000000057621'
                                      type: group
                                  name: SLA Group
                                type: sla
            x-zs-llm-examples:
              - SamplePutRequest
      responses:
        '200':
          description: Returns the updated state details for the specified Blueprint.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlueprintStateUpdateResponse'
              examples:
                Success200:
                  summary: Successful Blueprint State Update Response
                  value:
                    states:
                      - code: SUCCESS
                        details:
                          id: '1234567890'
                        message: State updated successfully
                        status: success
          headers:
            X-API-CREDITS-REMAINING:
              schema:
                type: string
                format: int64
                description: >
                  Present when >=50% of base daily credits (excluding add-on
                  credits) are consumed. Value is total remaining credits
                  including add-on credits for the rolling 24-hour window.
                pattern: ^[0-9]+$
                minLength: 1
                maxLength: 19
              required: false
        '207':
          description: >-
            Returns a multi-status response where each item in the array
            independently indicates success or failure for the corresponding
            state update in the request.
          content:
            application/json:
              schema:
                type: object
                x-zs-$id: BlueprintStateUpdateMultiStatusResponse
                additionalProperties: false
                description: >-
                  Returns a multi-status response for the Blueprint state update
                  batch. Each item in the **states** array independently
                  indicates success or failure for the corresponding state in
                  the request.
                properties:
                  states:
                    type: array
                    description: >-
                      Represents the list of per-state update results,
                      containing both successful update records and error
                      entries.
                    items:
                      oneOf:
                        - $ref: '#/components/schemas/StateOperationResultItem'
                        - $ref: '#/components/schemas/InvalidValueResponse'
                        - $ref: '#/components/schemas/InvalidEscalationPeriodError'
                        - $ref: '#/components/schemas/MissingActionIDError'
                        - $ref: '#/components/schemas/ErrorResponseCore9'
                    maxItems: 25
                    allOf:
                      - description: >-
                          Ensures at least one successful state update result is
                          present.
                        contains:
                          $ref: '#/components/schemas/StateOperationResultItem'
                        minContains: 1
                      - description: Ensures at least one error result is present.
                        contains:
                          oneOf:
                            - $ref: '#/components/schemas/InvalidValueResponse'
                            - $ref: >-
                                #/components/schemas/InvalidEscalationPeriodError
                            - $ref: '#/components/schemas/MissingActionIDError'
                            - $ref: '#/components/schemas/ErrorResponseCore9'
                        minContains: 1
                required:
                  - states
              examples:
                Success207:
                  summary: >-
                    Partial Success Response With Mandatory Field Validation
                    Errors
                  value:
                    states:
                      - code: MANDATORY_NOT_FOUND
                        details:
                          api_name: period
                          json_path: >-
                            $.states[0].state_escalation.trigger_details[0].period
                        message: The required data missing
                        status: error
                      - code: SUCCESS
                        details:
                          id: '1234567890'
                        message: State updated successfully
                        status: success
                SuccessAndInvalidId:
                  summary: Mixed Response With One Success and One Invalid ID Error
                  value:
                    states:
                      - code: INVALID_DATA
                        details:
                          api_name: id
                          json_path: $.states[0].id
                        message: the value given is invalid
                        status: error
                      - code: SUCCESS
                        details:
                          id: '1234567890'
                        message: State updated successfully
                        status: success
          headers:
            X-API-CREDITS-REMAINING:
              schema:
                type: string
                format: int64
                description: >
                  Present when >=50% of base daily credits (excluding add-on
                  credits) are consumed. Value is total remaining credits
                  including add-on credits for the rolling 24-hour window.
                pattern: ^[0-9]+$
                minLength: 1
                maxLength: 19
              required: false
        '400':
          description: >-
            The request cannot be processed due to invalid syntax.
            **Resolution:** The request body must be reviewed and corrected to
            ensure it contains valid syntax before resubmitting.
          content:
            application/json:
              schema:
                x-zs-$id: Putsettingsblueprintsblueprintidstates400
                oneOf:
                  - type: object
                    x-zs-$id: Putsettingsblueprintsblueprintidstates400States
                    additionalProperties: false
                    description: Wrapped error response with states
                    properties:
                      states:
                        type: array
                        description: Array of error objects
                        items:
                          oneOf:
                            - $ref: '#/components/schemas/MissingActionIDError'
                            - $ref: >-
                                #/components/schemas/InvalidEscalationPeriodError
                            - $ref: >-
                                #/components/schemas/MissingEscalationPeriodError
                            - $ref: '#/components/schemas/ErrorResponseCore9'
                            - $ref: '#/components/schemas/InvalidValueResponse'
                            - $ref: >-
                                #/components/schemas/TriggerDetailsLimitExceededError
                            - $ref: '#/components/schemas/SLAMinimumValueError'
                            - $ref: >-
                                #/components/schemas/BlueprintStateLimitExceededError
                            - $ref: >-
                                #/components/schemas/EscalationActionLimitExceededError
                            - $ref: '#/components/schemas/DraftVersionRequiredError'
                            - $ref: >-
                                #/components/schemas/ActionNotBelongToModuleError
                            - $ref: '#/components/schemas/NotAllowedModuleUpdateError'
                            - $ref: >-
                                #/components/schemas/TimeTriggerLimitExceededError
                        maxItems: 25
                    required:
                      - states
                  - $ref: '#/components/schemas/InvalidResourcePathError'
                  - $ref: '#/components/schemas/ErrorResponseCore15'
              examples:
                MandatoryNotFoundResponse1:
                  summary: MANDATORY_NOT_FOUND Error — Required Field Type Missing
                  value:
                    states:
                      - code: MANDATORY_NOT_FOUND
                        details:
                          api_name: type
                          json_path: >-
                            $.states[0].state_escalation.trigger_details[0].actions[0].type
                        message: The required data missing
                        status: error
                InvalidDataResponse1:
                  summary: INVALID_DATA Error for an Unsupported Period Field Value
                  value:
                    states:
                      - code: INVALID_DATA
                        details:
                          api_name: period
                          json_path: >-
                            $.states[0].state_escalation.trigger_details[0].period
                          supported_values:
                            - days
                            - hours
                            - minutes
                        message: invalid data
                        status: error
                MandatoryNotFoundResponse2:
                  summary: MANDATORY_NOT_FOUND Error for Missing Period Field
                  value:
                    states:
                      - code: MANDATORY_NOT_FOUND
                        details:
                          api_name: period
                          json_path: >-
                            $.states[0].state_escalation.trigger_details[0].period
                        message: The required data missing
                        status: error
                MandatoryNotFoundResponse3:
                  summary: >-
                    MANDATORY_NOT_FOUND Error for a Missing Trigger Details
                    Value
                  value:
                    states:
                      - code: MANDATORY_NOT_FOUND
                        details:
                          api_name: value
                          json_path: >-
                            $.states[0].state_escalation.trigger_details[0].value
                        message: The required data missing
                        status: error
                InvalidDataResponse2:
                  summary: INVALID_DATA Error for Unsupported execute_type Value
                  value:
                    states:
                      - code: INVALID_DATA
                        details:
                          api_name: execute_type
                          json_path: >-
                            $.states[0].state_escalation.trigger_details[0].execute_type
                          supported_values:
                            - before
                            - 'on'
                            - after
                        message: invalid data
                        status: error
                MandatoryNotFoundResponse4:
                  summary: MANDATORY_NOT_FOUND Error When execute_type Field Is Missing
                  value:
                    states:
                      - code: MANDATORY_NOT_FOUND
                        details:
                          api_name: execute_type
                          json_path: >-
                            $.states[0].state_escalation.trigger_details[0].execute_type
                        message: The required data missing
                        status: error
                MandatoryNotFoundResponse5:
                  summary: MANDATORY_NOT_FOUND Error for Missing Actions Field
                  value:
                    states:
                      - code: MANDATORY_NOT_FOUND
                        details:
                          api_name: actions
                          json_path: >-
                            $.states[0].state_escalation.trigger_details[0].actions
                        message: The required data missing
                        status: error
                InvalidDataResponse3:
                  summary: INVALID_DATA Error for an Invalid Period Field Value
                  value:
                    states:
                      - code: INVALID_DATA
                        details:
                          api_name: period
                          json_path: $.states[0].state_escalation.period
                          supported_values:
                            - days
                            - hours
                            - minutes
                            - business_days
                            - business_hours
                        message: invalid data
                        status: error
                DependentFieldMissingResponse1:
                  summary: >-
                    DEPENDENT_FIELD_MISSING Error When a Dependent Field Is
                    Absent
                  value:
                    states:
                      - code: DEPENDENT_FIELD_MISSING
                        details:
                          dependee:
                            api_name: value
                            json_path: $.states[0].state_escalation.value
                          api_name: period
                          json_path: $.states[0].state_escalation.period
                        message: Dependent Field missing
                        status: error
                DependentFieldMissingResponse2:
                  summary: >-
                    DEPENDENT_FIELD_MISSING Error When a Dependent Field Value
                    Is Absent
                  value:
                    states:
                      - code: DEPENDENT_FIELD_MISSING
                        details:
                          dependee:
                            api_name: period
                            json_path: $.states[0].state_escalation.period
                          api_name: value
                          json_path: $.states[0].state_escalation.value
                        message: Dependent Field missing
                        status: error
                InvalidDataResponse4:
                  summary: INVALID_DATA Error for Unsupported Action Type Value
                  value:
                    states:
                      - code: INVALID_DATA
                        details:
                          api_name: type
                          json_path: >-
                            $.states[0].state_escalation.trigger_details[0].actions[0].type
                          supported_values:
                            - sla
                            - email_notifications
                            - tasks
                            - field_updates
                            - webhooks
                            - functions
                            - circuits
                            - whatsapp
                            - sms
                        message: invalid data
                        status: error
                InvalidDataResponse5:
                  summary: INVALID_DATA Error for an Invalid Value on the ID Field
                  value:
                    states:
                      - code: INVALID_DATA
                        details:
                          api_name: id
                          json_path: $.states.state_escalation.trigger_details.actions.id
                        message: the value given is invalid
                        status: error
                InvalidDataResponse6:
                  summary: INVALID_DATA Error for an Invalid Trigger Detail ID
                  value:
                    states:
                      - code: INVALID_DATA
                        details:
                          api_name: id
                          json_path: $.states.state_escalation.trigger_details[0].id
                        message: the value given is invalid
                        status: error
                InvalidDataResponse7:
                  summary: INVALID_DATA Error for an Invalid Process ID
                  value:
                    code: INVALID_DATA
                    details:
                      resource_path_index: 2
                    message: the process id given seems to be invalid
                    status: error
                RequiredHeaderMissingResponse1:
                  summary: REQUIRED_HEADER_MISSING Error for a Missing X-CRM-ORG Header
                  value:
                    code: REQUIRED_HEADER_MISSING
                    details:
                      header_name: X-CRM-ORG
                    message: One of the expected headers is missing
                    status: error
                TriggerDetailsLimitExceededResponse1:
                  summary: >-
                    INVALID_DATA Error When trigger_details Exceeds the Maximum
                    Limit
                  value:
                    states:
                      - code: INVALID_DATA
                        details:
                          maximum_length: 3
                          api_name: trigger_details
                          json_path: $.states[0].state_escalation.trigger_details
                        message: invalid data
                        status: error
                SLAMinimumValueResponse1:
                  summary: >-
                    INVALID_DATA Error When SLA Value Is Below the Minimum
                    Threshold
                  value:
                    states:
                      - code: INVALID_DATA
                        details:
                          api_name: value
                          json_path: $.states[0].state_escalation.value
                        message: SLA need to be at least 15 Minutes
                        status: error
                BlueprintStateLimitExceededResponse1:
                  summary: LIMIT_EXCEEDED Error When Blueprint State Limit Is Exceeded
                  value:
                    states:
                      - code: LIMIT_EXCEEDED
                        details:
                          api_name: states
                          limit: 10
                        message: Blueprint state limit exceed
                        status: error
                EscalationActionLimitExceededResponse1:
                  summary: >-
                    LIMIT_EXCEEDED Error When Escalation Action Count Exceeds
                    the Configured Limit
                  value:
                    states:
                      - code: LIMIT_EXCEEDED
                        details:
                          action_type: tasks
                          api_name: actions
                          limit: 5
                          json_path: >-
                            $.states[0].state_escalation.trigger_details[0].actions
                          configured_count: 6
                        message: Action Limit Exceeds
                        status: error
                ActionNotBelongToModuleResponse1:
                  summary: >-
                    INVALID_DATA Error When Action Does Not Belong to the
                    Blueprint Module
                  value:
                    states:
                      - code: INVALID_DATA
                        details:
                          api_name: id
                          json_path: >-
                            $.states[0].state_escalation.trigger_details[0].actions[0].id
                        message: >-
                          The action does not belong to the current module of
                          the blueprint
                        status: error
                NotAllowedModuleUpdateResponse1:
                  summary: >-
                    NOT_ALLOWED Error Response: State Module Cannot Be Updated
                    (Field: id)
                  value:
                    states:
                      - code: NOT_ALLOWED
                        details:
                          api_name: id
                          json_path: $.states[0].module.id
                        message: State module cannot be updated
                        status: error
                NotAllowedDraftVersionResponse1:
                  summary: NOT_ALLOWED Error When Editing Without a Draft Version
                  value:
                    states:
                      - code: NOT_ALLOWED
                        details: {}
                        message: >-
                          Unable to edit, please create a draft version to edit
                          the blueprint.
                        status: error
          headers:
            X-API-CREDITS-REMAINING:
              schema:
                type: string
                format: int64
                description: >
                  Present when >=50% of base daily credits (excluding add-on
                  credits) are consumed. Value is total remaining credits
                  including add-on credits for the rolling 24-hour window.
                pattern: ^[0-9]+$
                minLength: 1
                maxLength: 19
              required: false
        '403':
          description: >-
            Permission denied to update Blueprint states. **Resolution:** The
            CRM administrator must grant the required permission to the user's
            profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoPermissionError'
              examples:
                NoPermissionResponse:
