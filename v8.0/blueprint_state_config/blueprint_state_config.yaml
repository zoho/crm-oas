components:
  schemas:
    InvalidTriggerTimeError:
      type: object
      additionalProperties: false
      description: >-
        Represents the error returned when a trigger time violates SLA
        constraints.
      properties:
        code:
          type: string
          description: Error code
          enum:
            - INVALID_DATA
        details:
          type: object
          additionalProperties: false
          description: >-
            Represents an object containing additional error context for the
            invalid trigger time. Contains the **api_name** and **json_path** of
            the field that caused the validation failure.
          properties:
            api_name:
              type: string
              description: >-
                The API name of the field or parameter associated with the
                invalid trigger time error.
              maxLength: 255
            json_path:
              type: string
              description: >-
                The JSON path of the field that contains the invalid trigger
                time value.
              maxLength: 1000
          required:
            - api_name
            - json_path
        message:
          type: string
          description: >-
            The error message describing the invalid trigger time condition.
            Possible values: Trigger time should be less than SLA time when
            execute_type is 'before' - The specified trigger time exceeds the
            SLA time for a **before** execution type.
          enum:
            - >-
              Trigger time should be less than SLA time when execute_type is
              'before'
        status:
          type: string
          description: >-
            The status of the error response. Possible values: **error** -
            Indicates the request resulted in an error.
          enum:
            - error
      required:
        - code
        - details
        - message
        - status
      title: Invalid Trigger Time Error
      x-zs-$id: ErrorResponseCore852203792
    BlueprintStateUpdateByIDBatchRequest:
      type: object
      additionalProperties: false
      description: Batch request wrapper for updating multiple identified state records.
      properties:
        states:
          type: array
          description: >-
            The list of Blueprint state objects to update, each containing the
            details required for a state transition.
          items:
            $ref: '#/components/schemas/BlueprintStateUpdateItemAlternative'
          maxItems: 300
          minItems: 1
      required:
        - states
      title: Blueprint State Update By ID Batch Request
    BlueprintStatesDeleteMultiStatusResponse:
      type: object
      additionalProperties: false
      description: >-
        Represents the multi-status response returned when deleting multiple
        Blueprint states, where each entry in the **states** array independently
        indicates success or failure for the corresponding state.
      properties:
        states:
          type: array
          description: >-
            Represents the list of per-state deletion results, containing one
            entry for each state processed in the request.
          items:
            oneOf:
              - $ref: '#/components/schemas/StateOperationResultItem'
              - $ref: '#/components/schemas/InvalidStateIDsError'
          maxItems: 100
          allOf:
            - description: Ensures at least one successful deletion result is present.
              contains:
                $ref: '#/components/schemas/StateOperationResultItem'
              minContains: 1
            - description: Ensures at least one invalid-ID error is present.
              contains:
                $ref: '#/components/schemas/InvalidStateIDsError'
              minContains: 1
      title: Blueprint States Delete Multi-Status Response
      x-zs-$id: DeletestatesResponse207
    BlueprintStateListMultiStatusResponse:
      type: object
      additionalProperties: false
      description: >-
        Represents a multi-status response for retrieving Blueprint states in
        bulk, containing a **states** array with a mix of successfully retrieved
        state objects and error entries.
      properties:
        states:
          type: array
          description: >-
            Represents the list of Blueprint state results, where each entry
            contains either a successfully retrieved state object or a
            per-record error result.
          items:
            oneOf:
              - $ref: '#/components/schemas/BlueprintStateSummary'
              - $ref: '#/components/schemas/InvalidStateIDQueryParamError'
