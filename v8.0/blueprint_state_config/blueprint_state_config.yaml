  parameters:
    ParamHeaderXZohoService:
      name: X-ZOHO-SERVICE
      in: header
      description: >-
        Specify the Zoho service context for the request. Possible values:
        **automation** - Targets the automation service.
      required: true
      style: simple
      explode: false
      schema:
        type: string
        enum:
          - automation
    ParamQueryIds:
      name: ids
      in: query
      description: >-
        Specify the [unique state
        IDs](blueprint_state_config.yaml#$.paths./settings/blueprints/{blueprintId}/states.get)
        to filter the query results. Accepts comma-separated values.
      required: true
      style: form
      explode: false
      schema:
        type: array
        description: >-
          Array of state IDs in CSV format, with a maximum of 100 unique IDs
          allowed.
        minItems: 1
        maxItems: 100
        uniqueItems: true
        items:
          type: string
          format: int64
          description: A unique state ID.
          pattern: ^[0-9]+$
          minLength: 1
          maxLength: 19
      example:
        - '111111000000085001'
        - '111111000000091000'
  securitySchemes:
    OAuth2:
      type: oauth2
      description: Uses OAuth 2.0 to authenticate API requests.
      flows:
        authorizationCode:
          authorizationUrl: https://accounts.zoho.com/oauth/v2/auth
          tokenUrl: https://accounts.zoho.com/oauth/v2/token
          refreshUrl: https://accounts.zoho.com/oauth/v2/token
          scopes:
            ZohoCRM.settings.blueprint.states.READ: Access to settings.blueprint.states scope
            ZohoCRM.settings.blueprint.states.CREATE: Access to settings.blueprint.states scope
            ZohoCRM.settings.blueprint.states.UPDATE: Access to settings.blueprint.states scope
            ZohoCRM.settings.blueprint.states.DELETE: Access to settings.blueprint.states scope
