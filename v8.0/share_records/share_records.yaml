                  summary: Permission denied to revoke sharing
components:
  parameters:
    CurrentUser:
      name: current_user
      in: query
      description: >-
        Specify whether to return only the share entries for the current user.
        When set to **true**, the response returns only the share entries for
        the user making the API call.
      required: false
      schema:
        type: boolean
    SharedTo:
      name: sharedTo
      description: >-
        Specify the unique ID of the user whose share entries you want to
        retrieve. When set, the response returns only the share entries for that
        user. Use the [Get Users API](users.yaml#$paths./users.get) to get the
        valid IDs for the users. 
      in: query
      required: false
      schema:
        x-zs-$ref:
          resource: users
          origins:
            - operationId: getUsers
              propertyId: UserId
        type: string
        maxLength: 19
        description: Represents the unique identifier of the user.
    View:
      name: view
      description: |
        Specify the level of detail to include in the response. 
        **Possible values**:  summary, manage.
      in: query
      required: false
      schema:
        type: string
        enum:
          - manage
          - summary
    Approved:
      name: approved
      description: |-
        Filters sharing records by approval status.
        - `true`  - return only approved sharing entries
        - `false`  - return only unapproved (pending) sharing entries
        - `both`  - return all sharing entries regardless of approval status
      in: query
      required: false
      schema:
        type: string
        enum:
          - 'true'
          - 'false'
          - both
    ModuleApiName:
      name: moduleApiName
      description: >-
        Specify the API name of the module that owns the record. Refer to the
        [Get Modules API](modules.yaml#$.paths./settings/modules.get) for valid
        values.
      in: path
      required: true
      schema:
        x-zs-$ref:
          resource: modules
          origins:
            - operationId: getModules
              propertyId: ModulesApiName
        type: string
        maxLength: 50
        description: >-
          Unique API identifier for the module used in third-party integrations;
          starts with a letter, contains only alphanumeric characters and
          underscores, and has no consecutive or trailing underscores.
    RecordId:
      name: recordId
      description: >-
        Specify the unique ID of the record. Refer to the [Get Records
        API](record.yaml#$.paths./{module}.get) for valid values.
      in: path
      required: true
      schema:
        type: string
        format: int64
        x-zs-$ref:
          resource: record
          origins:
            - operationId: getRecords
              propertyId: RecordsId
        description: Represents the unique identifier of the RecordGETDataItem record.
  schemas:
    CreateAndUpdateSuccessResponse:
      x-zs-$id: CreateAndUpdateSuccessResponse
      description: >-
        Represents the per-entry success result of a share record create or
        update operation.
      type: object
      properties:
        code:
          type: string
          description: 'Represents the response code returned by the API. '
          enum:
            - SUCCESS
        details:
          type: object
          description: 'Represents the additional information about the response. '
          additionalProperties: false
        message:
          type: string
          description: 'Represents the response message returned by the API. '
          enum:
            - record will be shared successfully
        status:
          type: string
          description: 'Represents the status of the API call. '
          enum:
            - success
      additionalProperties: false
      required:
        - code
        - details
        - message
        - status
    CreateAndUpdateShareRecordsBadRequest:
      x-zs-$id: CreateAndUpdateShareRecordsAllBadRequest
      description: >-
        Represents the bad request response returned by the share create and
        update operations. The payload is either a per-entry error list under
        the `share` array or a single error object for path-level or
        request-level failures.
      type: object
      additionalProperties: true
      oneOf:
        - $ref: '#/components/schemas/CreateAndUpdateBadResponseWithShareArray'
        - $ref: '#/components/schemas/CreateAndUpdateBadResponseWithoutShareArray'
    CreateAndUpdateBadResponseWithShareArray:
      x-zs-$id: CreateUpdateBadResponseWithShareArray
      description: >-
        Represents the bad request response in which the errors are reported per
        share entry under the **share** array.
      type: object
      properties:
        share:
          type: array
          description: >-
            Represents the list of error responses for the share record
            creation.
          maxItems: 20
          items:
            x-zs-$id: CreateAndUpdateMultipleStatusCaseErrorResponse
            oneOf:
              - $ref: '#/components/schemas/MandatoryNotFound'
              - $ref: '#/components/schemas/InvalidTypeErrorResponse'
              - $ref: '#/components/schemas/InvalidShareWithValueErrorResponse'
              - $ref: '#/components/schemas/InvalidShareWithIdErrorResponse'
              - $ref: '#/components/schemas/ActivityModuleRelatedIssueErrorResponse'
              - $ref: '#/components/schemas/ShareLimitExceedErrorResponse'
            description: >-
              Each string represents the per-entry result for one share entry,
              which can be either a success or a specific error.
      additionalProperties: false
      required:
        - share
    CreateAndUpdateBadResponseWithoutShareArray:
      x-zs-$id: CreateAndUpdateBadResponseWithoutShareArray
      oneOf:
        - $ref: '#/components/schemas/InvalidRecordIdErrorResponse'
        - $ref: '#/components/schemas/InvalidModuleNameErrorResponse'
        - $ref: '#/components/schemas/MaximumLengthErrorResponse'
        - $ref: '#/components/schemas/UnsupportedModule'
        - $ref: '#/components/schemas/AmbiguousShareErrorResponse'
      description: >-
        Represents the bad request response in which the failure applies to the
        entire request rather than to individual share entries.
    MandatoryNotFound:
      x-zs-$id: MandatoryNotFound
      description: >-
        Represents the error response returned when a mandatory field is missing
        from the share entry.
      type: object
      properties:
        code:
          type: string
          description: 'Represents the response code returned by the API. '
          enum:
            - MANDATORY_NOT_FOUND
        details:
          type: object
          description: 'Represents the additional information about the response. '
          additionalProperties: false
          properties:
            api_name:
              type: string
              description: Represents the API name of the parameter that caused the error.
              maxLength: 50
            json_path:
