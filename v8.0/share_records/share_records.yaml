openapi: 3.1.0
info:
  title: Shared Records API
  description: >-
    In Zoho CRM, there are different levels of data sharing. Record-level data
    sharing is where the users can share individual records with other users in
    the organization. The records can be shared with or without the related
    lists.
  version: '8.0'
servers:
  - url: https://zohoapis.{dc}/crm/{version}
    description: API Server URL
    variables:
      dc:
        enum:
          - com
          - eu
          - in
          - cn
          - au
        default: com
        description: API Server URL TLD
      version:
        default: v8
        description: API Version
paths:
  /{moduleApiName}/{recordId}/actions/share:
    get:
      operationId: getShareRecords
      summary: Share Records
      description: >-
        To retrieve the share details of a specific record in a module of your
        Zoho CRM organization. The response lists each entry with the recipient,
        the access level, and the sharing metadata.
      security:
        - OAuth2:
            - ZohoCRM.share.leads.READ
        - OAuth2:
            - ZohoCRM.share.contacts.READ
        - OAuth2:
            - ZohoCRM.share.accounts.READ
        - OAuth2:
            - ZohoCRM.share.deals.READ
        - OAuth2:
            - ZohoCRM.share.products.READ
        - OAuth2:
            - ZohoCRM.share.tasks.READ
        - OAuth2:
            - ZohoCRM.share.events.READ
        - OAuth2:
            - ZohoCRM.share.calls.READ
        - OAuth2:
            - ZohoCRM.share.quotes.READ
        - OAuth2:
            - ZohoCRM.share.invoices.READ
        - OAuth2:
            - ZohoCRM.share.campaigns.READ
        - OAuth2:
            - ZohoCRM.share.vendors.READ
        - OAuth2:
            - ZohoCRM.share.pricebooks.READ
        - OAuth2:
            - ZohoCRM.share.salesorders.READ
        - OAuth2:
            - ZohoCRM.share.purchaseorders.READ
        - OAuth2:
            - ZohoCRM.share.solutions.READ
        - OAuth2:
            - ZohoCRM.share.cases.READ
        - OAuth2:
            - ZohoCRM.share.bundles.READ
        - OAuth2:
            - ZohoCRM.share.custom.READ
      parameters:
        - $ref: '#/components/parameters/ModuleApiName'
        - $ref: '#/components/parameters/RecordId'
        - $ref: '#/components/parameters/SharedTo'
        - $ref: '#/components/parameters/View'
        - $ref: '#/components/parameters/Approved'
        - $ref: '#/components/parameters/CurrentUser'
      responses:
        '200':
          description: >-
            Returns the list of share entries currently active on the record,
            with the recipient, the access level, and the sharing metadata for
            each entry.
          content:
            application/json:
              schema:
                x-zs-$id: GetShareRecordsSuccess
                description: Represents the success response.
                type: object
                properties:
                  share:
                    type: array
                    description: Represents the list of share records.
                    maxItems: 2147483647
                    items:
                      type: object
                      description: >-
                        Each object represents a single share entry, including
                        the recipient, the access level, and the sharing
                        metadata.
                      properties:
                        shared_with:
                          type: object
                          description: >-
                            Represents the details of the entity (user, role, or
                            group) with which the record is shared.
                          properties:
                            name:
                              type: string
                              description: >-
                                Represents the name of the entity with whom the
                                record is shared.
                              maxLength: 100
                            id:
                              type: string
                              description: >-
                                Represents the unique ID of the entity with whom
                                the record is shared.
                              maxLength: 19
                            type:
                              type: string
                              description: |
                                Represents the type of sharing applied to the
                                record. 

                                **Possible values**: 

                                - users

                                - roles

                                - groups
                              enum:
                                - users
                                - roles
                                - groups
                          additionalProperties: false
                          required:
                            - name
                            - id
                            - type
                        share_related_records:
                          type: boolean
                          description: >-
                            Indicates whether the related records of the shared
                            record are also shared with the entity.
                        shared_through:
                          type: object
                          description: >-
                            Represents the details of the record through which
                            sharing is granted, including its module.
                          properties:
                            module:
                              type: object
                              description: >-
                                Represents the module details of the record
                                through which sharing is granted.
                              properties:
                                name:
                                  type: string
                                  description: Represents the name of the module.
                                  maxLength: 100
                                id:
                                  type: string
                                  description: Represents the unique ID of the module.
                                  maxLength: 19
                              additionalProperties: false
                              required:
                                - name
                                - id
                            id:
                              type: string
                              description: >-
                                Represents the unique ID of the record through
                                which sharing is enabled.
                              maxLength: 19
                          additionalProperties: false
                          required:
                            - module
                            - id
                        shared_time:
                          type: string
                          description: >-
                            Represents the date and time at which the record was
                            shared, in ISO 8601 format.
                          format: date-time
                        permission:
                          type: string
                          description: |
                            Represents the level of access granted to the entity
                            for the shared record. **Possible values**: 

                            - read_only

                            - read_write

                            - full_access
                          enum:
                            - read_only
                            - read_write
                            - full_access
                        shared_by:
                          type: object
                          description: >-
                            Represents the details of the user who shared the
                            record.
                          properties:
                            name:
                              type: string
                              description: Represents the name of the entity.
                              maxLength: 100
                            id:
                              type: string
                              description: Represents the unique ID of the entity.
                              maxLength: 19
                            zuid:
                              type: string
                              description: >-
                                Represents the ZUID of the user who shared the
                                record.
                              maxLength: 19
                          additionalProperties: false
                          required:
                            - name
                            - id
                            - zuid
                        type:
                          type: string
                          description: |
                            Represents the type of sharing applied to the
                            record. 

                            **Possible values**: 

                            - private

                            - public
                          enum:
                            - private
                            - public
                      additionalProperties: false
                      required:
                        - shared_with
                        - share_related_records
                        - shared_through
                        - permission
                        - type
                additionalProperties: false
              examples:
                GetShareRecordsSuccess:
                  value:
                    share:
                      - shared_with:
                          name: Manager
                          id: '2922942000000015969'
                          type: roles
                        share_related_records: false
                        shared_through:
                          module:
                            name: Leads
                            id: '2922942000000000125'
                          id: '2922942000003922003'
                        shared_time: '2025-12-31T13:36:56+05:30'
                        permission: full_access
                        shared_by:
                          name: we edited1
                          id: '2922942000000512001'
                          zuid: '76602839'
                        type: private
                  description: >-
                    Shows a successful response listing one share entry with the
                    recipient role, the access level, the time of sharing, and
                    the user who shared the record.
                  summary: An example response of active share entries on a record.
        '204':
          description: >-
            Returns an empty response when the record has no active share
            entries.
        '400':
          description: >-
            Returns an error response when the request URL, path parameters, or
            share entries fail validation.
          content:
            application/json:
              schema:
                x-zs-$id: GetShareRecordsBadRequest
                description: Represents the error responses for the API request.
                type: object
                additionalProperties: true
                oneOf:
                  - $ref: >-
                      #/components/schemas/ViewAndApprovedParamValueErrorResponse
                  - $ref: '#/components/schemas/InvalidRecordIdErrorResponse'
                  - $ref: '#/components/schemas/InvalidModuleNameErrorResponse'
              examples:
                ViewParamWithManageValue:
                  value:
                    code: PATTERN_NOT_MATCHED
                    details:
                      api_name: view
                    message: Please check whether the input values are correct
                    status: error
                  description: |-
                    Shows the bad request response returned when the 
                    **view** query parameter is set to an unsupported value.
                  summary: >-
                    An example of invalid value for the **view** query
                    parameter.
                InvalidRecordId:
                  value:
                    code: INVALID_DATA
                    details:
                      resource_path_index: 1
                    message: ENTITY_ID_INVALID
                    status: error
                  description: >-
                    Shows the bad request response returned when the record ID
                    in the request URL is invalid or does not belong to the
                    specified module.
                  summary: An example of invalid record ID in the URL.
                InvalidModuleName:
                  value:
                    code: INVALID_MODULE
                    details:
                      resource_path_index: 0
                    message: the module name given seems to be invalid
                    status: error
                  description: >-
                    Shows the bad request response returned when the module API
                    name in the request URL is not a valid CRM module.
                  summary: An example of invalid module API name in the URL.
        '403':
          description: >-
            Returns an error response when the user does not have permission to
            perform the share details retrieval or when the share operation is
            blocked by an org-level restriction.
          content:
            application/json:
              schema:
                x-zs-$id: GetShareRecordsForbidden
                oneOf:
                  - $ref: '#/components/schemas/CommonForbiddenErrorResponse'
                  - $ref: '#/components/schemas/RecordForbiddenErrorResponse'
                description: Represents the error responses for the API request.
              examples:
                GetShareRecordsForbidden:
                  value:
                    code: NO_PERMISSION
                    details: {}
                    message: permission denied - access the api
                    status: error
                  description: >-
                    Shows the forbidden response returned when the user lacks
                    permission to call the share records API.
                  summary: An example of permission denied to read share details.
                RecordNoPermission:
                  value:
                    code: NO_PERMISSION
                    details:
                      permissions:
                        - Crm_Implied_View_Leads
                    message: permission denied
                    status: error
                  description: >-
                    Shows the forbidden response returned when the user is
                    missing a record-level permission, such as
                    **Crm_Implied_View_Leads**.
                  summary: An example of record-level permission missing.
    post:
      operationId: createShareRecords
      summary: Share a record
      description: >
        To share a specific record in a module with one or more users, roles, or
        groups. A record can be shared with up to 10 users, 5 roles, and 5
        groups.

        > **Note**:

        > - The records can be shared to other users in the organization only if
        certain conditions are met. For simplicity, let us assume that User A
        shares a record with User B. Now, User A can share the record
        successfully only if:

        >    - User B is a **confirmed** and **active** user.

        >    - User B **does not already have access** to that particular
        record.

        >    - User B has access to that particular module. For instance, to
        share a contact, User B must have access to the Contacts module.

        > - You cannot share the records in Calls, Meetings, Tasks, and Linking
        modules directly. They can be shared as related lists.

        > - The users who have profiles with **share** permission can share any
        records that they have access to, except the records that are shared to
        them. To check the same, go to Setup > Users and Control > Security
        Control > Choose the profile > Tool Permissions. Check if **share** is
        enabled. It is enabled by default for Standard and Administrator
        Profiles.

        > - The details of the records that form many-to-many relationships
        (with multi-select lookup) cannot be shared.

        > - A record can be shared only with **10 users**, **5 groups**, and **5
        roles**.

        > - Once the record gets shared successfully, the user who initiated the
        share operation can be notified via email.
      security:
        - OAuth2:
            - ZohoCRM.share.leads.CREATE
        - OAuth2:
            - ZohoCRM.share.contacts.CREATE
        - OAuth2:
            - ZohoCRM.share.accounts.CREATE
        - OAuth2:
            - ZohoCRM.share.deals.CREATE
        - OAuth2:
            - ZohoCRM.share.products.CREATE
        - OAuth2:
            - ZohoCRM.share.tasks.CREATE
        - OAuth2:
            - ZohoCRM.share.events.CREATE
        - OAuth2:
            - ZohoCRM.share.calls.CREATE
        - OAuth2:
            - ZohoCRM.share.quotes.CREATE
        - OAuth2:
            - ZohoCRM.share.invoices.CREATE
        - OAuth2:
            - ZohoCRM.share.campaigns.CREATE
        - OAuth2:
            - ZohoCRM.share.vendors.CREATE
        - OAuth2:
            - ZohoCRM.share.pricebooks.CREATE
        - OAuth2:
            - ZohoCRM.share.salesorders.CREATE
        - OAuth2:
            - ZohoCRM.share.purchaseorders.CREATE
        - OAuth2:
            - ZohoCRM.share.solutions.CREATE
        - OAuth2:
            - ZohoCRM.share.cases.CREATE
        - OAuth2:
            - ZohoCRM.share.bundles.CREATE
        - OAuth2:
            - ZohoCRM.share.custom.CREATE
      parameters:
        - $ref: '#/components/parameters/ModuleApiName'
        - $ref: '#/components/parameters/RecordId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: Represents the request body.
              properties:
                share:
                  type: array
                  description: >-
                    Specify the list of share entries to apply. Each entry
                    defines a recipient, the access level, and the type of
                    sharing. You can provide a maximum of **20** entries in a
                    single request.
                  maxItems: 20
                  items:
                    type: object
                    description: Each object represents an entry in the array.
                    properties:
                      type:
                        type: string
                        description: |
                          Specify the type of sharing to apply to the record. 

                          **Possible values**: 
                          - private 
                          - public
                        enum:
                          - private
                          - public
                      share_related_records:
                        type: boolean
                        description: |
                          Specify whether to share the related records along
                          with the record. 


                          **Possible values**: 

                          - true

                          - false
                      permission:
                        type: string
                        description: |
                          Specify the level of access to grant for the shared
                          record. 

                          **Possible values**: 

                          - read_only

                          - read_write

                          - full_access
                        enum:
                          - read_only
                          - read_write
                          - full_access
                      shared_with:
                        description: >-
                          Specify the details of the entity (user, role, or
                          group) with which to share the record.
                        oneOf:
                          - type: object
                            x-zs-$id: ShareWithRoles
                            description: >-
                              Indicates that you can share the record along with
                              roles.
                            properties:
                              type:
                                type: string
                                description: type of entity with whom the record is shared
                                enum:
                                  - roles
                              id:
                                type: string
                                description: >-
                                  Represents the ID of the role with whom the
                                  record is being shared.
                                maxLength: 19
                                x-zs-$ref:
                                  resource: roles
                                  origins:
                                    - operationId: getRoles
                                      propertyId: RoleId
                            additionalProperties: false
                            required:
                              - type
                              - id
                          - type: object
                            x-zs-$id: ShareWithGroups
                            description: >-
                              Indicates that you can share the record along with
                              groups.
                            properties:
                              type:
                                type: string
                                description: type of entity with whom the record is shared
                                enum:
                                  - groups
                              id:
                                type: string
                                description: >-
                                  Represents the ID of the group with whom the
                                  record is being shared.
                                maxLength: 19
                                x-zs-$ref:
                                  resource: user_groups
                                  origins:
                                    - operationId: getUserGroups
                                      propertyId: UserGroupId
                            additionalProperties: false
                            required:
                              - type
                              - id
                          - type: object
                            x-zs-$id: ShareWithUsers
                            description: >-
                              Indicates that you can share the record along with
                              users.
                            properties:
                              type:
                                type: string
                                description: type of entity with whom the record is shared
                                enum:
                                  - users
                              id:
                                type: string
                                description: >-
                                  Represents the ID of the user with whom the
                                  record is being shared.
                                maxLength: 19
                                x-zs-$ref:
                                  resource: users
                                  origins:
                                    - operationId: getUsers
                                      propertyId: UserId
                            additionalProperties: false
                            required:
                              - type
                              - id
                    additionalProperties: false
                    required:
                      - type
                      - permission
                      - shared_with
                notify_shared_members:
                  type: boolean
                  description: |
                    Specify whether to send a notification to the members with
                    whom the record is shared. 

                    **Possible values**: 

                    - true

                    - false
                notify_on_completion:
                  type: boolean
                  description: |
                    Specify whether to send an email notification to the record
                    owner once the share action is completed. 

                    **Possible values**: 

                    - true

                    - false
              additionalProperties: false
              required:
                - share
            examples:
              CreateShareRecordsRequest:
                value:
                  share:
                    - shared_with:
                        id: '111111000000000874'
                        type: roles
                      share_related_records: false
                      permission: full_access
                      type: private
                  notify_shared_members: false
                  notify_on_completion: true
                description: >-
                  Shares a record privately with a single role and grants full
                  access without sharing related records.
                summary: An example response of share a record with a role.
        required: true
        description: The request body contains the data required to perform the operation.
      responses:
        '201':
          description: >-
            Returns a per-entry success result for each share entry created on
            the record.
          content:
            application/json:
              schema:
                description: Represents the success response of the API request.
                x-zs-$id: CreateShareRecordsSuccess
                type: object
                additionalProperties: false
                properties:
                  share:
                    type: array
                    description: Represents details of each share record creation result.
                    maxItems: 20
                    items:
                      $ref: '#/components/schemas/CreateAndUpdateSuccessResponse'
                required:
                  - share
              examples:
                CreateShareRecordsSuccess:
                  value:
                    share:
                      - code: SUCCESS
                        details: {}
                        message: record will be shared successfully
                        status: success
                  description: >-
                    Shows a per-entry success result that the API returns after
                    creating the share entry successfully.
                  summary: An example of successful share response.
        '207':
          description: >-
            Returns a per-entry result for each share entry in the request,
            where each entry is either a success or a specific error.
          content:
            application/json:
              schema:
                x-zs-$id: CreateShareRecordsPartialSuccess
                description: Represents the response of partial success.
                type: object
                additionalProperties: false
                properties:
                  share:
                    type: array
                    description: >-
                      Represents the details of each share record creation
                      result.
                    maxItems: 20
                    items:
                      type: object
                      description: >-
                        Represents the per-entry result for one share entry,
                        which can be either a success result or a specific
                        error.
                      oneOf:
                        - $ref: '#/components/schemas/CreateAndUpdateSuccessResponse'
                        - $ref: >-
                            #/components/schemas/CreateAndUpdateBadResponseWithShareArray/properties/share/items
                      additionalProperties: true
              examples:
                CreateShareRecordsPartialSuccess:
                  value:
                    share:
                      - code: SUCCESS
                        details: {}
                        message: record will be shared successfully
                        status: success
                      - code: INVALID_DATA
                        details:
                          api_name: shared_with
                          json_path: $.share[1].shared_with
                        message: invalid data
                        status: error
                  description: >-
                    Shows a mixed-result response where one share entry succeeds
                    and another fails validation on the `shared_with` field.
                  summary: >-
                    An example of partial success response with one valid and
                    one invalid entry.
        '400':
          description: >-
            Returns an error response when the request URL, path parameters, or
            share entries fail validation.
          content:
            application/json:
              schema:
                x-zs-$id: CreateShareRecordsBadRequest
                description: bad request response
                type: object
                $ref: '#/components/schemas/CreateAndUpdateShareRecordsBadRequest'
                additionalProperties: true
              examples:
                InvalidShareWithValue:
                  value:
                    share:
                      - code: INVALID_DATA
                        details:
                          dependee:
                            api_name: type
                            json_path: $.share[0].type
                          api_name: shared_with
                          json_path: $.share[0].shared_with
                        message: invalid data
                        status: error
                  description: >-
                    Shows the per-entry error returned when the `shared_with`
                    value does not match the dependent `type` field.
                  summary: '`shared_with` value invalid for the given type'
                InvalidRecordId:
                  value:
                    code: INVALID_DATA
                    details:
                      resource_path_index: 1
                    message: ENTITY_ID_INVALID
                    status: error
                  description: >-
                    Shows the bad request response returned when the record ID
                    in the request URL is invalid or does not belong to the
                    specified module.
                  summary: Invalid record ID in the URL
                InvalidShareWithUserId:
                  value:
                    share:
                      - code: INVALID_DATA
                        details:
                          api_name: id
                          json_path: $.share[0].shared_with.id
                        message: invalid user Id
                        status: error
                  description: >-
                    Shows the per-entry error returned when the user ID
                    specified in `shared_with.id` is invalid.
                  summary: Invalid user ID in `shared_with`
                ActivityModuleRelatedIssue:
                  value:
                    share:
                      - code: INVALID_DATA
                        details:
                          api_name: share_related_records
                          json_path: $.share[0].share_related_records
                        message: cannot share the related records
                        status: error
                  description: >-
                    Shows the per-entry error returned when
                    `share_related_records` is set on a module that does not
                    support sharing related records.
                  summary: '`share_related_records` not supported on the module'
                MandatoryParamMissing:
                  value:
                    share:
                      - code: MANDATORY_NOT_FOUND
                        details:
                          api_name: permission
                          json_path: $.share[0].permission
                        message: required field not found
                        status: error
                  description: >-
                    Shows the per-entry error returned when a mandatory field,
                    such as `permission`, is missing from the share entry.
                  summary: Mandatory field missing in a share entry
                NonSubordinateUser:
                  summary: Cannot share with a non-subordinate user
                  value:
                    share:
                      - code: INVALID_DATA
                        details:
                          api_name: shared_with
                          json_path: $.share[0].shared_with
                        message: cannot share to the user
                        status: error
                  description: >-
                    Shows the per-entry error returned when the share entry
                    targets a user with whom the record cannot be shared, such
                    as a non-subordinate user.
        '403':
          description: >-
            Returns an error response when the user does not have permission to
            perform the share create or when the share operation is blocked by
            an org-level restriction.
          content:
            application/json:
              schema:
                type: object
                x-zs-$id: UpdateShareRecordsForbidden
                description: >-
                  Represents the response when the user does not have enough
                  permissions.
                oneOf:
                  - $ref: '#/components/schemas/CommonForbiddenErrorResponse'
                  - $ref: '#/components/schemas/SchedularAlreadyRunningErrorResponse'
                  - $ref: '#/components/schemas/SharingSharedRecordErrorResponse'
                  - $ref: >-
                      #/components/schemas/RecordLevelSharingNotSupportedForModuleErrorResponse
                  - $ref: '#/components/schemas/NotifyMembersWithoutFeeds'
                  - $ref: '#/components/schemas/RecordForbiddenErrorResponse'
                additionalProperties: true
              examples:
                CreateShareRecordsForbidden:
                  value:
                    code: NO_PERMISSION
                    details: {}
                    message: permission denied - access the api
                    status: error
                  description: >-
                    Shows the forbidden response returned when the user lacks
                    permission to call the share records API.
                  summary: An example of permission denied to access the share API.
                SchedularAlreadyRunning:
                  value:
                    code: CANNOT_PROCESS
                    details: {}
                    message: Scheduler is running
                    status: error
                  description: >-
                    Shows the response returned when a previous share operation
                    on the record is still in progress.
                  summary: An example of share operation already in progress.
                SharingSharedRecord:
                  value:
                    code: INVALID_DATA
                    details: {}
                    message: Shared record cannot be shared to other users
                    status: error
                  description: >-
                    Shows the response returned when a record that was already
                    shared with the current user cannot be re-shared to other
                    users.
                  summary: An example attempt to re-share a shared record.
                RecordLevelSharingNotSupportedForModule:
                  value:
                    code: NOT_ALLOWED
                    details: {}
                    message: Record Level Sharing is not supported for this module
                    status: error
                  description: >-
                    Shows the response returned when the module specified in the
                    request URL does not support record-level sharing.
                  summary: >-
                    An example of record-level sharing unsupported for the
                    module.
                NotifySharedMembersWithoutFeeds:
                  value:
                    code: NOT_ALLOWED
                    details:
                      api_name: notify_shared_members
                      json_path: $.notify_shared_members
                    message: Feeds is not enabled for this org
                    status: error
                  description: >-
                    Shows the response returned when **notify_shared_members**
                    is set to **true** but Feeds is not enabled for the
                    organization.
                  summary: An example of notification requested without Feeds enabled.
    put:
      operationId: updateShareRecords
      summary: Update share permissions
      description: >-
        To update the sharing permissions of a specific record in a module of
        your Zoho CRM organization. The update can change the access level,
        change the visibility between private and public, or alter whether
        related records are shared along with the record.
      security:
        - OAuth2:
            - ZohoCRM.share.leads.UPDATE
        - OAuth2:
            - ZohoCRM.share.contacts.UPDATE
        - OAuth2:
            - ZohoCRM.share.accounts.UPDATE
        - OAuth2:
            - ZohoCRM.share.deals.UPDATE
        - OAuth2:
            - ZohoCRM.share.products.UPDATE
        - OAuth2:
            - ZohoCRM.share.tasks.UPDATE
        - OAuth2:
            - ZohoCRM.share.events.UPDATE
        - OAuth2:
            - ZohoCRM.share.calls.UPDATE
        - OAuth2:
            - ZohoCRM.share.quotes.UPDATE
        - OAuth2:
            - ZohoCRM.share.invoices.UPDATE
        - OAuth2:
            - ZohoCRM.share.campaigns.UPDATE
        - OAuth2:
            - ZohoCRM.share.vendors.UPDATE
        - OAuth2:
            - ZohoCRM.share.pricebooks.UPDATE
        - OAuth2:
            - ZohoCRM.share.salesorders.UPDATE
        - OAuth2:
            - ZohoCRM.share.purchaseorders.UPDATE
        - OAuth2:
            - ZohoCRM.share.solutions.UPDATE
        - OAuth2:
            - ZohoCRM.share.cases.UPDATE
        - OAuth2:
            - ZohoCRM.share.bundles.UPDATE
        - OAuth2:
            - ZohoCRM.share.custom.UPDATE
      parameters:
        - $ref: '#/components/parameters/ModuleApiName'
        - $ref: '#/components/parameters/RecordId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: Represents the request body.
              properties:
                share:
                  type: array
                  description: >-
                    Specify the list of share entries to update. Each entry
                    defines a recipient, the access level, and the type of
                    sharing.
                  maxItems: 20
                  items:
                    type: object
                    description: Each object represents one entry in the array.
                    properties:
                      type:
                        type: string
                        description: |
                          Specify the type of sharing to apply to the record. 
                          **Possible values**: 
                          - private
                          - public
                        enum:
                          - private
                          - public
                      share_related_records:
                        type: boolean
                        description: |
                          Specify whether to share the related records along
                          with the record. 

                          **Possible values**: 

                          - true

                          - false
                      permission:
                        type: string
                        description: |
                          Specify the level of access to grant for the shared
                          record. 

                          **Possible values**: 

                          - read_only

                          - read_write

                          - full_access
                        enum:
                          - read_only
                          - read_write
                          - full_access
                      shared_with:
                        description: >-
                          Specify the details of the entity (user, role, or
                          group) with which to share the record.
                        oneOf:
                          - type: object
                            x-zs-$id: UpdateShareWithRoles
                            description: Specify the role with which to share the record.
                            properties:
                              type:
                                type: string
                                description: >-
                                  Specify the type of entity with which to share
                                  the record.
                                enum:
                                  - roles
                              id:
                                type: string
                                description: >-
                                  Represents the ID of the role with which the
                                  record is being shared.
                                maxLength: 19
                                x-zs-$ref:
                                  resource: roles
                                  origins:
                                    - operationId: getRoles
                                      propertyId: RoleId
                            additionalProperties: false
                            required:
                              - type
                              - id
                          - type: object
                            x-zs-$id: UpdateShareWithGroups
                            description: Specify the group with which to share the record.
                            properties:
                              type:
                                type: string
                                description: >-
                                  Specify the type of entity with which to share
                                  the record.
                                enum:
                                  - groups
                              id:
                                type: string
                                description: >-
                                  Represents the ID of the group with which the
                                  record is being shared.
                                maxLength: 19
                                x-zs-$ref:
                                  resource: user_groups
                                  origins:
                                    - operationId: getUserGroups
                                      propertyId: UserGroupId
                            additionalProperties: false
                            required:
                              - type
                              - id
                          - type: object
                            x-zs-$id: UpdateShareWithUsers
                            description: Specify the user with whom to share the record.
                            properties:
                              type:
                                type: string
                                description: >-
                                  Specify the type of entity with which to share
                                  the record.
                                enum:
                                  - users
                              id:
                                type: string
                                description: >-
                                  Represents the ID of the user with whom the
                                  record is being shared.
                                maxLength: 19
                                x-zs-$ref:
                                  resource: users
                                  origins:
                                    - operationId: getUsers
                                      propertyId: UserId
                            additionalProperties: false
                            required:
                              - type
                              - id
                    additionalProperties: false
                    required:
                      - type
                      - permission
                      - shared_with
                notify_shared_members:
                  type: boolean
                  description: |
                    Specify whether to send a notification to the members with
                    whom the record is shared. 

                    **Possible values**: 

                    - true

                    - false
                notify_on_completion:
                  type: boolean
                  description: |
                    Specify whether to send an email notification to the record
                    owner once the share action is completed. 

                    **Possible values*: 

                    - true

                    - false
              additionalProperties: false
              required:
                - share
            examples:
              UpdateShareRecordsRequest:
                value:
                  share:
                    - shared_with:
                        id: '111111000000000874'
                        type: roles
                      share_related_records: false
                      permission: full_access
                      type: private
                  notify_shared_members: false
                  notify_on_completion: true
                description: >-
                  Updates a single share entry to grant a role full access
                  privately, without sharing related records.
                summary: An example of updating a share entry for a role.
        required: true
        description: >-
          The request body must contain a **share** array with one or more share
          entries to update. Each entry defines the recipient, the access level,
          and the type of sharing. You can include up to **20 share entries per
          request**.
      responses:
        '201':
          description: >-
            Returns a per-entry success result for each share entry updated on
            the record.
          content:
            application/json:
              schema:
                description: Represents the update share records success response.
                x-zs-$id: UpdateShareRecordsSuccess
                type: object
                additionalProperties: false
                properties:
                  share:
                    type: array
                    description: >-
                      Represents the details of each share record creation
                      result.
                    maxItems: 20
                    items:
                      $ref: '#/components/schemas/CreateAndUpdateSuccessResponse'
                required:
                  - share
              examples:
                UpdateShareRecordsSuccess:
                  value:
                    share:
                      - code: SUCCESS
                        details: {}
                        message: record will be shared successfully
                        status: success
                  description: >-
                    Shows a per-entry success result that the API returns after
                    updating the share entry successfully.
                  summary: An example of successful update response.
        '207':
          description: >-
            Returns a per-entry result for each share entry in the request,
            where each entry is either a success or a specific error.
          content:
            application/json:
              schema:
                x-zs-$id: UpdateShareRecordsPartialSuccess
                description: Represents the partial success response.
                type: object
                additionalProperties: false
                properties:
                  share:
                    type: array
                    description: >-
                      Represents the details of each share record creation
                      result.
                    maxItems: 20
                    items:
                      type: object
                      description: >-
                        Each object represents the per-entry result for one
                        share entry, which can be either a success result or a
                        specific error.
                      oneOf:
                        - $ref: '#/components/schemas/CreateAndUpdateSuccessResponse'
                        - $ref: >-
                            #/components/schemas/CreateAndUpdateBadResponseWithShareArray/properties/share/items
                      additionalProperties: true
              examples:
                CreateShareRecordsPartialSuccess:
                  value:
                    share:
                      - code: SUCCESS
                        details: {}
                        message: record will be shared successfully
                        status: success
                      - code: INVALID_DATA
                        details:
                          api_name: shared_with
                          json_path: $.share[1].shared_with
                        message: invalid data
                        status: error
                  description: >-
                    Shows a mixed-result response where one share entry succeeds
                    and another fails validation on the `shared_with` field.
                  summary: >-
                    An example of partial success response with one valid and
                    one invalid entry.
        '400':
          description: >-
            Returns an error response when the request URL, path parameters, or
            share entries fail validation.
          content:
            application/json:
              schema:
                x-zs-$id: UpdateShareRecordsBadRequest
                description: bad request response
                type: object
                $ref: '#/components/schemas/CreateAndUpdateShareRecordsBadRequest'
                additionalProperties: true
              examples:
                InvalidShareWithValue:
                  value:
                    share:
                      - code: INVALID_DATA
                        details:
                          dependee:
                            api_name: type
                            json_path: $.share[0].type
                          api_name: shared_with
                          json_path: $.share[0].shared_with
                        message: invalid data
                        status: error
                  description: >-
                    Shows the per-entry error returned when the `shared_with`
                    value does not match the dependent `type` field.
                  summary: '`shared_with` value invalid for the given type'
                InvalidModuleName:
                  value:
                    code: INVALID_MODULE
                    details:
                      resource_path_index: 0
                    message: the module name given seems to be invalid
                    status: error
                  description: >-
                    Shows the bad request response returned when the module API
                    name in the request URL is not a valid CRM module.
                  summary: Invalid module API name in the URL
                InvalidRecordId:
                  value:
                    code: INVALID_DATA
                    details:
                      resource_path_index: 1
                    message: ENTITY_ID_INVALID
                    status: error
                  description: >-
                    Shows the bad request response returned when the record ID
                    in the request URL is invalid or does not belong to the
                    specified module.
                  summary: Invalid record ID in the URL
                InvalidShareWithUserId:
                  value:
                    share:
                      - code: INVALID_DATA
                        details:
                          api_name: id
                          json_path: $.share[0].shared_with.id
                        message: invalid user Id
                        status: error
                  description: >-
                    Shows the per-entry error returned when the user ID
                    specified in `shared_with.id` is invalid.
                  summary: Invalid user ID in `shared_with`
                ActivityModuleRelatedIssue:
                  value:
                    share:
                      - code: INVALID_DATA
                        details:
                          api_name: share_related_records
                          json_path: $.share[0].share_related_records
                        message: cannot share the related records
                        status: error
                  description: >-
                    Shows the per-entry error returned when
                    `share_related_records` is set on a module that does not
                    support sharing related records.
                  summary: '`share_related_records` not supported on the module'
                ShareLimitForATypeExceeded:
                  value:
                    share:
                      - code: LIMIT_EXCEEDED
                        details:
                          api_name: type
                          limit: 5
                          json_path: $.share[5].shared_with.type
                        message: Cannot share a record to more than 5 roles
                        status: error
                  description: >-
                    Shows the per-entry error returned when the number of share
                    entries for a recipient type exceeds the per-record limit
                    (10 users, 5 roles, 5 groups).
                  summary: Share limit exceeded for the recipient type
                MandatoryParamMissing:
                  value:
                    share:
                      - code: MANDATORY_NOT_FOUND
                        details:
                          api_name: permission
                          json_path: $.share[0].permission
                        message: required field not found
                        status: error
                  description: >-
                    Shows the per-entry error returned when a mandatory field,
                    such as `permission`, is missing from the share entry.
                  summary: Mandatory field missing in a share entry
                NonSubordinateUser:
                  summary: Cannot share with a non-subordinate user
                  value:
                    share:
                      - code: INVALID_DATA
                        details:
                          api_name: shared_with
                          json_path: $.share[0].shared_with
                        message: cannot share to the user
                        status: error
                  description: >-
                    Shows the per-entry error returned when the share entry
                    targets a user with whom the record cannot be shared, such
                    as a non-subordinate user.
        '403':
          description: >-
            Returns an error response when the user does not have permission to
            perform the share update or when the share operation is blocked by
            an org-level restriction.
          content:
            application/json:
              schema:
                type: object
                x-zs-$id: CreateShareRecordsForbidden
                description: >-
                  Represents the error response when the user does not have
                  enough permission to perform the request.
                oneOf:
                  - $ref: '#/components/schemas/CommonForbiddenErrorResponse'
                  - $ref: '#/components/schemas/SchedularAlreadyRunningErrorResponse'
                  - $ref: '#/components/schemas/SharingSharedRecordErrorResponse'
                  - $ref: >-
                      #/components/schemas/RecordLevelSharingNotSupportedForModuleErrorResponse
                  - $ref: '#/components/schemas/RecordForbiddenErrorResponse'
                  - $ref: '#/components/schemas/NotifyMembersWithoutFeeds'
                additionalProperties: true
              examples:
                UpdateShareRecordsForbidden:
                  value:
                    code: NO_PERMISSION
                    details: {}
                    message: permission denied - access the api
                    status: error
                  description: >-
                    Shows the forbidden response returned when the user lacks
                    permission to call the share records API.
                  summary: An example of permission denied to access the share API.
                SchedularAlreadyRunning:
                  value:
                    code: CANNOT_PROCESS
                    details: {}
                    message: Scheduler is running
                    status: error
                  description: >-
                    Shows the response returned when a previous share operation
                    on the record is still in progress.
                  summary: An example of share operation already in progress.
                SharingSharedRecord:
                  value:
                    code: INVALID_DATA
                    details: {}
                    message: Shared record cannot be shared to other users
                    status: error
                  description: >-
                    Shows the response returned when a record that was already
                    shared with the current user cannot be re-shared to other
                    users.
                  summary: An example attempt to re-share a shared record.
                RecordLevelSharingNotSupportedForModule:
                  value:
                    code: NOT_ALLOWED
                    details: {}
                    message: Record Level Sharing is not supported for this module
                    status: error
                  description: >-
                    Shows the response returned when the module specified in the
                    request URL does not support record-level sharing.
                  summary: >-
                    An example for record-level sharing unsupported for the
                    module.
    delete:
      operationId: deleteShareRecords
      summary: Revoke sharing on a record
      description: >-
        To revoke all sharing on a specific record in a module of your Zoho CRM
        organization. Use this operation to remove access that was previously
        granted to users, roles, or groups through record-level sharing.
      security:
        - OAuth2:
            - ZohoCRM.share.leads.DELETE
        - OAuth2:
            - ZohoCRM.share.contacts.DELETE
        - OAuth2:
            - ZohoCRM.share.accounts.DELETE
        - OAuth2:
            - ZohoCRM.share.deals.DELETE
        - OAuth2:
            - ZohoCRM.share.products.DELETE
        - OAuth2:
            - ZohoCRM.share.tasks.DELETE
        - OAuth2:
            - ZohoCRM.share.events.DELETE
        - OAuth2:
            - ZohoCRM.share.calls.DELETE
        - OAuth2:
            - ZohoCRM.share.quotes.DELETE
        - OAuth2:
            - ZohoCRM.share.invoices.DELETE
        - OAuth2:
            - ZohoCRM.share.campaigns.DELETE
        - OAuth2:
            - ZohoCRM.share.vendors.DELETE
        - OAuth2:
            - ZohoCRM.share.pricebooks.DELETE
        - OAuth2:
            - ZohoCRM.share.salesorders.DELETE
        - OAuth2:
            - ZohoCRM.share.purchaseorders.DELETE
        - OAuth2:
            - ZohoCRM.share.solutions.DELETE
        - OAuth2:
            - ZohoCRM.share.cases.DELETE
        - OAuth2:
            - ZohoCRM.share.bundles.DELETE
        - OAuth2:
            - ZohoCRM.share.custom.DELETE
      parameters:
        - $ref: '#/components/parameters/ModuleApiName'
        - $ref: '#/components/parameters/RecordId'
      responses:
        '200':
          description: >-
            Returns a confirmation that sharing on the record has been revoked
            successfully.
          content:
            application/json:
              schema:
                x-zs-$id: RevokeSharingSuccess
                description: Represents the revoke sharing success response.
                type: object
                properties:
                  share:
                    type: object
                    description: Represents the share record revoke response details.
                    properties:
                      code:
                        type: string
                        description: Represents the response code returned by the API.
                        enum:
                          - SUCCESS
                      details:
                        type: object
                        description: >-
                          Represents the additional information about the
                          response.
                        properties:
                          id:
                            type: string
                            description: Represents the unique ID of the details.
                            maxLength: 19
                        additionalProperties: false
                      message:
                        type: string
                        description: Represents the response message returned by the API.
                        enum:
                          - Sharing Revoked
                      status:
                        type: string
                        description: 'Represents the status of the API call. '
                        enum:
                          - success
                    additionalProperties: false
                    required:
                      - code
                      - details
                      - message
                      - status
                additionalProperties: false
              examples:
                RevokeSharingSuccess:
                  value:
                    share:
                      code: SUCCESS
                      details:
                        id: '2922942000003922003'
                      message: Sharing Revoked
                      status: success
                  description: >-
                    Shows the response returned when sharing on the record is
                    revoked successfully, including the ID of the record.
                  summary: An example response for sharing revoked successfully.
        '400':
          description: >-
            Returns an error response when the request URL, path parameters, or
            share entries fail validation.
          content:
            application/json:
              schema:
                x-zs-$id: RevokeSharingBadRequest
                description: Represents the revoke sharing bad request response.
                type: object
                oneOf:
                  - $ref: >-
                      #/components/schemas/NoSharingAvailableToRevokeErrorResponse
                  - $ref: '#/components/schemas/InvalidRecordIdErrorResponse'
                  - $ref: '#/components/schemas/InvalidModuleNameErrorResponse'
                additionalProperties: true
              examples:
                NoSharingThroughTheRecord:
                  value:
                    code: CANNOT_PROCESS
                    details: {}
                    message: No sharing through this record is available to revoke
                    status: error
                  description: >-
                    Shows the bad request response returned when the record has
                    no active share entries to revoke.
                  summary: An example response for when no sharing exists to revoke.
                InvalidRecordId:
                  value:
                    code: INVALID_DATA
                    details:
                      resource_path_index: 1
                    message: ENTITY_ID_INVALID
                    status: error
                  description: >-
                    Shows the bad request response returned when the record ID
                    in the request URL is invalid or does not belong to the
                    specified module.
                  summary: An example of invalid record ID in the URL.
                InvalidModuleName:
                  value:
                    code: INVALID_MODULE
                    details:
                      resource_path_index: 0
                    message: the module name given seems to be invalid
                    status: error
                  description: >-
                    Shows the bad request response returned when the module API
                    name in the request URL is not a valid CRM module.
                  summary: An example of invalid module API name in the URL.
        '403':
          description: >-
            Returns an error response when the user does not have permission to
            perform the sharing revoke or when the share operation is blocked by
