      required: true
      description: >-
        Specify the API name of the CRM module for which you want to manage
        portal users. Refer to the [Get
        Modules](https://www.zoho.com/crm/developer/docs/api/v8/modules-api.html)
        resource for valid values.
      schema:
        type: string
        maxLength: 255
        x-zs-$ref:
          resource: modules
