openapi: 3.1.0
info:
  title: Portal Users
  description: API for managing portal users.
  version: '8'
servers:
  - url: https://zohoapis.{dc}/crm/{version}
    description: API Server URL
    variables:
      dc:
        enum:
          - com
          - eu
          - in
          - cn
          - au
        default: com
        description: API Server URL TLD
      version:
        default: v8
        description: API Version
paths:
  /settings/portals/{portal}/user_type/{userType}/users:
    get:
      summary: List portal users
      description: >-
        To retrieve the list of portal users in your Zoho CRM organization for
        the specified portal and user type, with optional filtering by source.
      x-zs-llm-description: Retrieve users of a specific portal filtered by user type.
      operationId: getPortalUsers
      security:
        - OAuth2:
            - ZohoCRM.settings.clientportal.READ
      parameters:
        - $ref: '#/components/parameters/Portal'
        - $ref: '#/components/parameters/UserType'
        - name: page
          in: query
          required: false
          description: Represents the number of records to return per page.
          schema:
            type: integer
            format: int32
        - name: per_page
          in: query
          required: false
          description: Represents number of records to return per page.
          schema:
            type: integer
            format: int32
        - name: Source__s
          in: query
          required: false
          description: Represents the source of the user record.
          schema:
            type: string
            maxLength: 255
        - name: filters
          in: query
          required: false
          description: Represents the filters of the user record.
          schema:
            type: string
            maxLength: 255
        - name: personality_ids
          in: query
          required: false
          description: Represents the list of portal user record IDs to filter the results.
          schema:
            type: string
            maxLength: 255
        - name: type
          in: query
          required: false
          description: Represents the filter type for the portal users.
          schema:
            type: string
            maxLength: 255
      responses:
        '200':
          description: >-
            Returns the list of portal users for the specified portal and user
            type.
          content:
            application/json:
              schema:
                type: object
                x-zs-$id: GetPortalUsersResponse
                description: >-
                  Response containing the list of portal users and pagination
                  metadata.
                additionalProperties: false
                properties:
                  users:
                    type: array
                    description: Represents the list of portal user objects.
                    maxItems: 10000
                    items:
                      type: object
                      description: >-
                        Represents a single portal user and their associated
                        attributes.
                      additionalProperties: false
                      properties:
                        personality_id:
                          type: string
                          description: >-
                            Represents the unique identifier of the portal user
                            record.
                          maxLength: 255
                        confirm:
                          type: boolean
                          description: >-
                            Indicates whether the portal user has confirmed
                            their account. Possible values: **true**,
                            **false**. 
                        status_reason__s:
                          type: string
                          description: >-
                            Represents the reason for the current status of the
                            portal user.
                          maxLength: 500
                        created_time:
                          type: string
                          format: date-time
                          description: >-
                            Represents the date and time of portal user
                            creation.
                        module:
                          type: string
                          description: >-
                            Represents the API name of the CRM module associated
                            with the portal user.
                          maxLength: 100
                        name:
                          type: string
                          description: Represents the full name of the portal user.
                          maxLength: 255
                        active:
                          type: boolean
                          description: >-
                            Indicates whether the portal user is currently
                            active. Possible values: **true**, **false**. 
                        email:
                          type: string
                          description: Represents the email address of the portal user.
                          format: email
                        Source__s:
                          type: string
                          description: Represents the source of the portal user record.
                          maxLength: 255
                      required:
                        - personality_id
                        - confirm
                        - status_reason__s
                        - created_time
                        - module
                        - name
                        - active
                        - email
                        - Source__s
                  info:
                    type: object
                    description: Represents pagination metadata for the response.
                    additionalProperties: false
                    properties:
                      total_count:
                        type: integer
                        format: int32
                        description: >-
                          Represents the total number of portal users available
                          for the specified portal and user type.
                    required:
                      - total_count
                required:
                  - users
                  - info
              examples:
                Example1:
                  value:
                    users:
                      - personality_id: '12345'
                        confirm: true
                        status_reason__s: Active
                        created_time: '2023-01-15T10:30:00Z'
                        module: Contacts
                        name: John Doe
                        active: true
                        email: john.doe@example.com
                        Source__s: Portal
                    info:
                      total_count: 1
                  description: >-
                    Shows a successful response containing a single portal user
                    with all required fields and the total count in the info
                    object.
                  summary: List of portal users with response metadata
        '204':
          description: >-
            No portal users found for the specified portal and user type. The
            portal has no users yet.
        '400':
          description: >-
            Invalid request - a query parameter value does not match the
            expected format. Resolution: Check the error details for the
            parameter name and correct the value.
          content:
            application/json:
              schema:
                x-zs-$id: GetPortalUsersBadRequestResponse
                oneOf:
                  - type: object
                    x-zs-$id: GetPortalUsersPatternNotMatchedResponse
                    description: >-
                      Error response returned when the authenticated user does
                      not have the required permission to perform the operation.
                    additionalProperties: false
                    properties:
                      code:
                        type: string
                        description: >-
                          Represents the error code. Possible values:
                          **PATTERN_NOT_MATCHED**. 
                        enum:
                          - PATTERN_NOT_MATCHED
                      message:
                        type: string
                        description: Represents the error message describing the issue.
                        maxLength: 1000
                      details:
                        type: object
                        description: Represents additional details about the error.
                        additionalProperties: false
                        properties:
                          api_name:
                            type: string
                            description: >-
                              Represents the API name of the parameter that
                              caused the error.
                            maxLength: 255
                          json_path:
                            type: string
                            description: >-
                              Represents the JSON path to the parameter that
                              caused the error. Returned when available.
                            maxLength: 255
                      status:
                        type: string
                        description: >-
                          Represents the status of the operation. Possible
                          values: **error**. 
                        enum:
                          - error
                    required:
                      - code
                      - message
                      - details
                      - status
                  - type: object
                    x-zs-$id: GetPortalUsersApiNotSupportedResponse
                    description: >-
                      Error response returned when the API is invoked in an
                      unsupported environment, such as a sandbox.
                    additionalProperties: false
                    properties:
                      code:
                        type: string
                        description: >-
                          Represents the error code. Possible values:
                          **API_NOT_SUPPORTED**. 
                        enum:
                          - API_NOT_SUPPORTED
                      details:
                        type: object
                        additionalProperties: false
                        description: Represents additional details about the error.
                        properties:
                          unsupported_environment:
                            type: string
                            description: >-
                              Represents the name of the environment where this
                              API is not supported.
                            maxLength: 255
                        required:
                          - unsupported_environment
                      message:
                        type: string
                        description: >-
                          Represents the error message. Possible values: **api
                          not supported in sandbox**. 
                        enum:
                          - api not supported in sandbox
                      status:
                        type: string
                        description: >-
                          Represents the status of the operation. Possible
                          values: **error**. 
                        enum:
                          - error
                    required:
                      - code
                      - details
                      - message
                      - status
                description: Response schema for this operation.
              examples:
                InvalidType:
                  value:
                    code: PATTERN_NOT_MATCHED
                    details:
                      api_name: type
                    message: Please check whether the input values are correct
                    status: error
                  description: >-
                    Shows the PATTERN_NOT_MATCHED error returned when the
                    **type** parameter value does not match the required format.
                  summary: >-
                    Error when a parameter value does not match the expected
                    pattern
                ApiNotSupported:
                  value:
                    code: API_NOT_SUPPORTED
                    details:
                      unsupported_environment: sandbox
                    message: api not supported in sandbox
                    status: error
                  description: >-
                    Shows the API_NOT_SUPPORTED error returned when the list
                    portal users operation is attempted in a sandbox
                    environment.
                  summary: Error when the API runs in a sandbox environment
        '403':
          description: >-
            Permission denied. Resolution: The CRM administrator must grant the
            **ZohoCRM.settings.clientportal** scope permission to the user's
            profile.
          content:
            application/json:
              schema:
                x-zs-$id: GetPortalUsersForbiddenResponse
                oneOf:
                  - type: object
                    x-zs-$id: NoPermissionErrorResponse
                    description: >-
                      Error response returned when the authenticated user does
                      not have the required permission to perform the operation.
                    additionalProperties: false
                    properties:
                      code:
                        type: string
                        description: >-
                          Represents the error code. Possible values:
                          **NO_PERMISSION**. 
                        enum:
                          - NO_PERMISSION
                      message:
                        type: string
                        description: Represents the error message describing the issue.
                        maxLength: 1000
                      details:
                        type: object
                        description: Represents additional details about the error.
                        additionalProperties: true
                      status:
                        type: string
                        description: >-
                          Represents the status of the operation. Possible
                          values: **error**. 
                        enum:
                          - error
                    required:
                      - code
                      - message
                      - details
                      - status
                  - type: object
                    x-zs-$id: PortalInviteErrorResponse
                    description: >-
                      Error response containing a list of portal invitation
                      errors, one per failed invitation.
                    additionalProperties: false
                    properties:
                      portal_invite:
                        type: array
                        description: >-
                          Represents the list of portal invitation permission
                          error objects.
                        maxItems: 100
                        items:
                          type: object
                          description: >-
                            Represents a single portal user and their associated
                            attributes.
                          additionalProperties: false
                          properties:
                            code:
                              type: string
                              description: Represents the status code of the operation.
                              maxLength: 255
                            message:
                              type: string
                              description: >-
                                Represents the error message describing the
                                issue.
                              maxLength: 1000
                          required:
                            - code
                            - message
                    required:
                      - portal_invite
                  - type: object
                    x-zs-$id: AlternativePortalInviteErrorResponse
                    description: >-
                      Alternative error response format for portal invitation
                      failures.
                    additionalProperties: false
                    properties:
                      portal_invite:
                        type: array
                        description: >-
                          Represents the list of portal invitation permission
                          error objects.
                        maxItems: 100
                        items:
                          type: object
                          description: >-
                            Represents a single portal user and their associated
                            attributes.
                          additionalProperties: true
                    required:
                      - portal_invite
                  - type: object
                    x-zs-$id: AdditionalPortalInviteErrorResponse
                    description: >-
                      Error response containing an array of portal invitation
                      error objects.
                    additionalProperties: false
                    properties:
                      portal_invite:
                        type: array
                        description: >-
                          Represents the list of portal invitation permission
                          error objects.
                        maxItems: 100
                        items:
                          type: object
                          description: >-
                            Represents a single portal user and their associated
                            attributes.
                          additionalProperties: true
                description: Response schema for this operation.
              examples:
                NoPermissions:
                  value:
                    code: NO_PERMISSION
                    details:
                      permissions:
                        - Crm_Implied_Manage_ClientPortal_Users
                    message: NO_PERMISSION
                    status: error
                  description: >-
                    Shows the NO_PERMISSION error returned when the
                    authenticated user does not have the required client portal
                    read permission.
                  summary: Error when the user lacks required permissions
    delete:
      summary: delete portal users
      description: >-
        To delete one or more portal users from your Zoho CRM organization for
        the specified portal and user type.
      x-zs-llm-description: >-
        Based on the personality ids passed in params portal users will be
        deleted
      operationId: deletePortalUsers
      security:
        - OAuth2:
            - ZohoCRM.settings.clientportal.DELETE
      parameters:
        - $ref: '#/components/parameters/Portal'
        - $ref: '#/components/parameters/UserType'
        - name: personality_ids
          in: query
          required: false
          description: List for record IDs of portal users to be deleted.
          schema:
            type: string
            maxLength: 255
            x-zs-$ref:
              resource: record
              origins:
                - operationId: getRecords
                  propertyId: RecordsId
            format: int64
            description: Represents the unique identifier of the RecordGETDataItem record.
      responses:
        '200':
          description: Returns the deletion result for the requested portal users.
          content:
            application/json:
              schema:
                type: object
                x-zs-$id: DeletePortalUsersResponse
                description: >-
                  Response containing the deletion result for each requested
                  portal user.
                additionalProperties: false
                properties:
                  users:
                    type: array
                    description: >-
                      Represents the list of deleted portal user results.
                      Contains one result object per requested deletion.
                    maxItems: 200
                    items:
                      type: object
                      description: Represents the deletion result for a single portal user.
                      additionalProperties: false
                      properties:
                        code:
                          type: string
                          description: >-
                            Represents the error code. Possible values:
                            **SUCCESS**. 
                          enum:
                            - SUCCESS
                        message:
                          type: string
                          description: >-
                            Represents the success or informational message for
                            this operation result.
                          maxLength: 1000
                        details:
                          type: object
                          description: >-
                            Represents additional details about the operation
                            result.
                          additionalProperties: false
                          properties:
                            personality_id:
                              type: string
                              description: >-
                                Represents the unique identifier of the portal
                                user record.
                              maxLength: 255
                        status:
                          type: string
                          description: >-
                            Represents the status of the operation. Possible
                            values: **error**, **success**. 
                          enum:
                            - error
                            - success
                      required:
                        - code
                        - message
                        - details
                        - status
                required:
                  - users
              examples:
                Success:
                  value:
                    users:
                      - code: SUCCESS
                        details:
                          personality_id: '12345'
                        message: User deleted successfully
                        status: success
                      - code: SUCCESS
                        details:
                          personality_id: '67890'
                        message: User deleted successfully
                        status: success
                  description: >-
                    Shows a successful response for the deletion of two portal
                    users, including the personality ID of each deleted user.
                  summary: Successful deletion of portal users
        '400':
          description: >-
            Invalid request - the deletion failed due to a validation error.
            Resolution: Check the error code and correct the request before
            retrying.
          content:
            application/json:
              schema:
                x-zs-$id: DeletePortalUsersBadRequestResponse
                oneOf:
                  - type: object
                    x-zs-$id: DeletePortalUsersInvalidDataResponse
                    description: >-
                      Error response returned when one or more field values in
                      the request do not match the expected format or
                      constraints.
                    additionalProperties: false
                    properties:
                      users:
                        type: array
                        description: >-
                          Represents the list of deletion error results. Each
                          object contains error details for a failed deletion.
                        maxItems: 200
                        items:
                          type: object
                          description: >-
                            Represents the deletion result for a single portal
                            user.
                          additionalProperties: false
                          properties:
                            code:
                              type: string
                              description: >-
                                Represents the error code. Possible values:
                                **INVALID_DATA**. 
                              enum:
                                - INVALID_DATA
                            message:
                              type: string
                              description: >-
                                Represents the error message describing the
                                issue.
                              maxLength: 1000
                            details:
                              type: object
                              description: Represents additional details about the error.
                              additionalProperties: false
                              properties:
                                personality_id:
                                  type: string
                                  format: int64
                                  description: >-
                                    Represents the identifier of the portal user
                                    record associated with the error. Returned
                                    when available.
                            status:
                              type: string
                              description: >-
                                Represents the status of the operation. Possible
                                values: **error**. 
                              enum:
                                - error
                          required:
                            - code
                            - message
                            - details
                            - status
                  - type: object
                    x-zs-$id: DeletePortalUsersApiNotSupportedResponse
                    description: >-
                      Error response returned when the API is invoked in an
                      unsupported environment, such as a sandbox.
                    additionalProperties: false
                    properties:
                      code:
                        type: string
                        description: >-
                          Represents the error code. Possible values:
                          **API_NOT_SUPPORTED**. 
                        enum:
                          - API_NOT_SUPPORTED
                      details:
                        type: object
                        additionalProperties: false
                        description: Represents additional details about the error.
                        properties:
                          unsupported_environment:
                            type: string
                            description: >-
                              Represents the name of the environment where this
                              API is not supported.
                            maxLength: 255
                        required:
                          - unsupported_environment
                      message:
                        type: string
                        description: >-
                          Represents the error message. Possible values: **api
                          not supported in sandbox**. 
                        enum:
                          - api not supported in sandbox
                      status:
                        type: string
                        description: >-
                          Represents the status of the operation. Possible
                          values: **error**. 
                        enum:
                          - error
                    required:
                      - code
                      - details
                      - message
                      - status
                description: Response schema for this operation.
              examples:
                InvalidData:
                  value:
                    users:
                      - code: INVALID_DATA
                        details:
                          personality_id: '5020928000001843001'
                        message: >-
                          Delete of user failed as personality id does not
                          belongs to any portal user or belongs to portal user,
                          who does not belongs to provided user type.
                        status: error
                  description: >-
                    Shows the INVALID_DATA error returned when a personality ID
                    does not belong to a valid portal user in the specified user
                    type.
                  summary: Error when the personality ID is invalid
                ApiNotSupported:
                  value:
                    code: API_NOT_SUPPORTED
                    details:
                      unsupported_environment: sandbox
                    message: api not supported in sandbox
                    status: error
                  description: >-
                    Shows the API_NOT_SUPPORTED error returned when the delete
                    operation is attempted in a sandbox environment.
                  summary: Error when the API runs in a sandbox environment
        '403':
          description: >-
            Permission denied. Resolution: The CRM administrator must grant the
            **ZohoCRM.settings.clientportal** scope permission to the user's
            profile.
          content:
            application/json:
              schema:
                type: object
                x-zs-$id: DeletePortalUsersForbiddenResponse
                description: >-
                  Error response returned when the authenticated user does not
                  have the required permission to perform the operation.
                additionalProperties: false
                properties:
                  code:
                    type: string
                    description: >-
                      Represents the error code. Possible values:
                      **NO_PERMISSION**. 
                    enum:
                      - NO_PERMISSION
                  message:
                    type: string
                    description: Represents the error message describing the issue.
                    maxLength: 1000
                  details:
                    type: object
                    description: Represents additional details about the error.
                    additionalProperties: true
                  status:
                    type: string
                    description: >-
                      Represents the status of the operation. Possible values:
                      **error**. 
                    enum:
                      - error
                required:
                  - code
                  - message
                  - details
                  - status
              examples:
                NoPermissions:
                  value:
                    code: NO_PERMISSION
                    details:
                      permissions:
                        - Crm_Implied_Manage_ClientPortal_Users
                    message: NO_PERMISSION
                    status: error
                  description: >-
                    Shows the NO_PERMISSION error returned when the
                    authenticated user does not have permission to delete portal
                    users.
                  summary: Error when the user lacks required permissions
  /{module}/actions/portal_invite:
    post:
      summary: Invite portal users
      description: >-
        To send portal invitations in bulk to CRM records in your Zoho CRM
        organization for the specified module, scheduling them as asynchronous
        invitation jobs.
      x-zs-llm-description: >-
        Portal invitation will be sent for the records which are present in
        request body for specific module with language and invitation type
      operationId: inviteUsers
      parameters:
        - $ref: '#/components/parameters/Module'
      security:
        - OAuth2:
            - ZohoCRM.settings.clientportal.CREATE
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: Request body for inviting portal users
              additionalProperties: false
              properties:
                portal_invite:
                  type: array
                  description: >-
                    Specify the list of portal invitation objects. Each object
                    must contain a **data** array of user records to invite.
                  maxItems: 100
                  items:
                    type: object
                    description: >-
                      Specify the invitation data for a single portal invitation
                      batch.
                    additionalProperties: false
                    properties:
                      data:
                        type: array
                        description: >-
                          Specify the list of user records to include in this
                          invitation batch.
                        maxItems: 100
                        items:
                          type: object
                          description: >-
                            Specify the invitation data for a single portal
                            invitation batch.
                          additionalProperties: false
                          properties:
                            id:
                              type: string
                              description: >-
                                Specify the unique identifier of the CRM record
                                to invite as a portal user.
                              maxLength: 255
                              x-zs-$ref:
                                resource: record
                                origins:
                                  - operationId: getRecords
                                    propertyId: RecordsId
                              format: int64
                            user_type_id:
                              type: string
                              description: >-
                                Specify the unique identifier of the portal user
                                type to assign. Refer to the [Get Portal User
                                Types](https://www.zoho.com/crm/developer/docs/api/v8/get-user-types.html)
                                resource for valid values.
                              maxLength: 255
                              x-zs-$ref:
                                resource: portal_user_type
                                origins:
                                  - operationId: getPortalUserTypes
                                    propertyId: PortalUserTypesId
                              format: int64
                            type:
                              type: string
                              description: >-
                                Specify the invitation action type. Possible
                                values: **invite** (new invitation),
                                **reinvite** (re-send invitation).
                              enum:
                                - reinvite
                                - invite
                            language:
                              type:
                                - string
                                - 'null'
                              description: >-
                                Specify the locale code of the language for the
                                invitation email. Omit or set to null to use the
                                portal's default language.
                              enum:
                                - ''
                                - it_IT
                                - ru_RU
                                - pl_PL
                                - tr_TR
                                - hi_IN
                                - pt_BR
                                - th_TH
                                - fr_FR
                                - ja_JP
                                - in_ID
                                - cs_CZ
                                - de_DE
                                - hu_HU
                                - zh_TW
                                - es_ES
                                - nl_NL
                                - sv_SE
                                - da_DK
                                - bg_BG
                                - vi_VN
                                - iw_IL
                                - hr_HR
                                - en_GB
                                - ko_KR
                                - en_US
                                - zh_CN
                                - ar_EG
                                - pt_PT
                                - null
                          required:
                            - id
                            - user_type_id
                            - type
                    required:
                      - data
              required:
                - portal_invite
            examples:
              Example1:
                value:
                  portal_invite:
                    - data:
                        - id: '5843104000000624013'
                          user_type_id: '5843104000000411001'
                          type: invite
                          language: en_US
                description: Shows the Example1 scenario for this operation.
                summary: Example1 example
            x-zs-llm-examples:
              - Example1
        required: true
        description: >-
          The request body must contain a **portal_invite** array. You can
          include up to 100 invitation objects, each containing a **data** array
          of user records to invite.
      responses:
        '200':
          description: Returns the scheduled invitation job information.
          content:
            application/json:
              schema:
                type: object
                x-zs-$id: InviteUsersResponse
                description: Response for portal user invitation requests
                additionalProperties: false
                properties:
                  portal_invite:
                    type: array
                    description: >-
                      Represents the list of portal invitation response objects.
                      Contains one object per invitation batch.
                    maxItems: 100
                    items:
                      type: object
                      description: >-
                        Represents the invitation result for a single portal
                        invitation batch.
                      additionalProperties: false
                      properties:
                        code:
                          type: string
                          description: >-
                            Represents the error code. Possible values:
                            **SCHEDULED**. 
                          enum:
                            - SCHEDULED
                        details:
                          type: object
                          description: >-
                            Represents additional details about the operation
                            result.
                          additionalProperties: false
                          properties:
                            job_id:
                              type: string
                              description: >-
                                Represents the unique identifier of the
                                scheduled invitation job.
                              maxLength: 255
                              x-zs-$id: BulkInviteJobId
                          required:
                            - job_id
                        message:
                          type: string
                          description: >-
                            Represents the success or informational message for
                            this operation result.
                          maxLength: 1000
                        status:
                          type: string
                          description: >-
