        resource for valid values.
      schema:
        type: string
        maxLength: 255
        x-zs-$ref:
          resource: portals
          origins:
            - operationId: getPortals
              propertyId: PortalsName
        description: Represents the unique name of the portal.
    UserType:
      name: userType
      in: path
      required: true
      description: >-
        Specify the user type of the portal users. Refer to the [Get Portal User
        Types](https://www.zoho.com/crm/developer/docs/api/v8/get-user-types.html)
        resource for valid values.
      schema:
        type: integer
        format: int64
        x-zs-$ref:
          resource: portal_user_type
          origins:
            - operationId: getPortalUserTypes
              propertyId: PortalUserTypesId
        description: Represents the unique numeric identifier of the portal user type.
        maxLength: 255
    Module:
      name: module
