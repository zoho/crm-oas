      description: >-
        To retrieve the status of a scheduled portal invitation job in your Zoho
        CRM organization using the job identifier returned when invitations were
        scheduled.
      x-zs-llm-description: >-
        Used to fetch the current status of the scheduler which was scheduled
        for bulk invites. In this need to pass jobid which will be taken from
        POST bulk invite
      operationId: getScheduledInviteUsersInfo
      parameters:
        - $ref: '#/components/parameters/Module'
        - name: job_id
          in: query
          required: false
          description: >-
