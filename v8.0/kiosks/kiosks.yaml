            additionalProperties: true
        states:
          type: array
          description: Contains the list of workflow states defined for the kiosk.
          maxItems: 100
          items:
            type: object
            description: >-
              Represents a workflow state of the kiosk, including its name,
              identifier, and type.
            additionalProperties: true
      required:
        - associated
        - created_by
        - created_time
        - current_record_module
        - description
        - group_api_name
        - group_id
        - id
        - modified_by
        - modified_time
        - module
        - name
        - sequence_number
        - status
        - version_details
      title: Kiosk Summary
      x-zs-$id: KioskSummary
