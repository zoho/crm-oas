                DependentFieldMissingResponse1:
                  summary: DEPENDENT_FIELD_MISSING error — required name field absent
                  value:
                    kiosks:
                      - code: DEPENDENT_FIELD_MISSING
                        message: Dependent field is missing
                        details:
                          dependee:
                            api_name: type
                            json_path: $.kiosks[*].type
                          api_name: name
                          json_path: $.kiosks[*].kiosks.name
                        status: error
                  description: >-
                    Returned when the required name field is absent from the
                    request body and the type field creates a dependent-field
                    requirement.
                DependentFieldMissingResponse2:
                  summary: >-
                    DEPENDENT_FIELD_MISSING error — required description field
                    absent
                  value:
                    kiosks:
                      - code: DEPENDENT_FIELD_MISSING
                        message: Dependent field is missing
                        details:
                          dependee:
                            api_name: type
                            json_path: $.kiosks[*].type
                          api_name: description
                          json_path: $.kiosks[*].kiosks.description
                        status: error
                  description: >-
                    Returned when the description field is absent from the
                    request body and the type field creates a dependent-field
                    requirement.
                DependentFieldMissingResponse3:
                  summary: >-
                    DEPENDENT_FIELD_MISSING error — required group_api_name
                    field absent
                  value:
                    kiosks:
                      - code: DEPENDENT_FIELD_MISSING
                        message: Dependent field is missing
                        details:
                          dependee:
                            api_name: type
                            json_path: $.kiosks[*].type
                          api_name: group_api_name
                          json_path: $.kiosks[*].kiosks.group_api_name
                        status: error
                  description: >-
                    Returned when the group_api_name field is absent from the
                    request body and the type field creates a dependent-field
                    requirement.
                InvalidDataResponse10:
                  summary: >-
                    INVALID_DATA error — invalid data type for group_api_name
                    field
                  value:
                    kiosks:
                      - code: INVALID_DATA
                        message: Invalid data type
                        details:
                          api_name: group_api_name
                          expected_data_type: text
                          json_path: $.kiosks[*].group_api_name
                        status: error
                  description: >-
                    Returned when the group_api_name field contains a value of
                    an unexpected data type. The response identifies the field
                    and its expected data type.
                InvalidDataResponse11:
                  summary: >-
                    INVALID_DATA error — invalid data value for group_api_name
                    field
                  value:
                    kiosks:
                      - code: INVALID_DATA
                        message: Invalid data
                        details:
                          api_name: group_api_name
                          maximum_length: 25
                          json_path: $.kiosks[*].group_api_name
                        status: error
                  description: >-
                    Returned when the group_api_name field value is not valid.
                    The response includes the field's JSON path.
          headers:
            X-API-CREDITS-REMAINING:
              schema:
                type: string
                format: int64
                description: >
                  Present when >=50% of base daily credits (excluding add-on
                  credits) are consumed. Value is total remaining credits
                  including add-on credits for the rolling 24-hour window.
              required: false
      security:
        - OAuth2:
            - ZohoCRM.settings.kiosks.CREATE
  /settings/kiosks/{kioskId}/actions/activate:
    put:
      summary: |
        Activate Kiosk
      description: >
        To activate a Kiosk that is in draft or inactive state in Zoho CRM. The
        Kiosk must contain at least one screen before it can be activated. Once
        activated, the Kiosk becomes active and can be used for data
        collection. 


        Activate a Kiosk after configuring its states and before using the
        [Execute a Kiosk
        API](kiosks_execute.yaml#$.paths./settings/kiosks/{kioskId}/actions/execute.post).


        A Kiosk can be in one of three states: 


        draft - Not yet activated

        active - Currently live and in use

        inactive Previously active and later deactivated. 


        Use the [Get All Kiosks API](kiosks.yaml#$.paths./settings/kiosks) to
        retrieve the Kiosk ID. You can activate only a Kiosk that is in the
        draft or inactive state. Use the Get a [Specific Kiosk
        API](kiosks.yaml#$.paths./settings/kiosks/{kioskId}.get) to check the
        current status of the Kiosk from the status key in the response.
        Example: "status": "draft"


        **Note:**

        - A Kiosk must contain at least **one** screen to be activated.

        - Use the [Create a Kiosk State
        API](kiosks_states.yaml#$.paths./settings/kiosks/{kioskId}/states.post)
        to configure and add the necessary components before calling the
        [Activate Kiosk
        API](kiosks.yaml#$.paths./settings/kiosks/{kioskId}/actions/activate.put).


        Availability: Standard, Professional, Enterprise, and Ultimate editions.
      operationId: activateKiosk
      parameters:
        - $ref: '#/components/parameters/KioskIdPathParams'
      responses:
        '200':
          description: >-
            Returns a confirmation that the Kiosk has been successfully
            activated, including a SUCCESS code, a confirmation message, and the
            ID of the activated Kiosk.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KioskActivationSuccessResponse'
                x-zs-$id: PutactivateResponse200
              examples:
                Success200:
                  summary: Successful Kiosk activation response
                  value:
                    kiosks:
                      code: SUCCESS
                      details:
                        id: '2296900000011319893'
                      message: Kiosk activated successfully
                      status: success
                  description: >-
                    Shows a successful response to an activate Kiosk request,
                    with the kiosks object containing a SUCCESS code, a
                    confirmation message, and a details object with the ID of
                    the activated Kiosk.
          headers:
            X-API-CREDITS-REMAINING:
              schema:
                type: string
                format: int64
                description: >
                  Present when >=50% of base daily credits (excluding add-on
                  credits) are consumed. Value is total remaining credits
                  including add-on credits for the rolling 24-hour window.
              required: false
        '400':
          description: >-
            The request could not be processed due to a validation error.

            **Resolution:** Review the error code in the response body:
            INVALID_DATA indicates the Kiosk does not exist, ALREADY_ACTIVATED
            indicates the Kiosk is already active, and NOT_ALLOWED indicates the
            Kiosk end state was not collected properly.
          content:
            application/json:
              schema:
                description: >-
                  Represents one of three possible error responses returned when
                  the Kiosk activation request fails: a Kiosk already active
                  error, an invalid or non-existent Kiosk error, or a
                  not-allowed activation error.
                oneOf:
                  - $ref: '#/components/schemas/KioskAlreadyActiveError'
                  - $ref: '#/components/schemas/KioskTestRunInvalidKioskError'
                  - $ref: '#/components/schemas/KioskActivationNotAllowedError'
                x-zs-$id: PutactivateError400
              examples:
                AlreadyActivatedResponse1:
                  summary: ALREADY_ACTIVATED error — Kiosk is already active
                  value:
                    code: ALREADY_ACTIVATED
                    details:
                      resource_path_index: 2
                    message: Kiosk already active
                    status: error
                  description: >-
                    Demonstrates the error response returned when an activation
                    is attempted on a Kiosk that is already active, identified
                    by the ALREADY_ACTIVATED code.
                InvalidDataResponse1:
                  summary: INVALID_DATA error — No such Kiosk exists
                  value:
                    code: INVALID_DATA
                    details:
                      resource_path_index: 2
                    message: No such Kiosk exists
                    status: error
                  description: >-
                    Shows the error response when the specified Kiosk does not
                    exist, identified by the INVALID_DATA code.
                NotAllowedResponse1:
                  summary: NOT_ALLOWED error — Kiosk end state not collected properly
                  value:
                    code: NOT_ALLOWED
                    details:
                      resource_path_index: 2
                    message: Kiosk end state not collected properly
                    status: error
                  description: >-
                    Illustrates the error response when the Kiosk cannot be
                    activated because the end state is not collected properly,
                    identified by the NOT_ALLOWED code.
          headers:
            X-API-CREDITS-REMAINING:
              schema:
                type: string
                format: int64
                description: >
                  Present when >=50% of base daily credits (excluding add-on
                  credits) are consumed. Value is total remaining credits
                  including add-on credits for the rolling 24-hour window.
              required: false
      security:
        - OAuth2:
            - ZohoCRM.settings.kiosks.UPDATE
    delete:
      summary: Deactivate a Kiosk
      description: >
        To deactivate an active Kiosk in your Zoho CRM account. Once
        deactivated, the Kiosk will no longer be accessible for users. Use the
        [Get All Kiosks API](kiosks.yaml#$.paths./settings/kiosks) to retrieve
        the Kiosk ID.


        **Note**


        - A Kiosk must be in the Active (Published) state before it can be
        deactivated. After deactivation, its status changes to inactive. To make
        the Kiosk active again, use the [Activate Kiosk
        API](kiosks.yaml#$.paths./settings/kiosks/{kioskId}/actions/activate.put).

        - You cannot deactivate a Kiosk that has existing associations. For
        example, if the Kiosk is associated with the Record Details View or any
        other supported component, you must remove those associations before
        deactivating the Kiosk.
      operationId: deactivateKiosk
      parameters:
        - $ref: '#/components/parameters/KioskIdPathParams'
      responses:
        '200':
          description: >-
            Returns a confirmation that the specified kiosk was successfully
            deactivated in Zoho CRM. The response body contains the kiosk ID, a
            `SUCCESS` status code, and a confirmation message indicating that
            the kiosk is now inactive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KioskDeactivationSuccessResponse'
                x-zs-$id: DeleteactivateResponse200
              examples:
                Success200:
                  summary: Successful kiosk deactivation response
                  value:
                    kiosks:
                      code: SUCCESS
                      details:
                        id: '2296900000011323255'
                      message: Kiosk deactivated successfully
                      status: success
                  description: >-
                    Represents a successful deactivation response returned by
                    Zoho CRM. The payload confirms the operation with a
                    `SUCCESS` code and includes the unique ID of the kiosk that
                    was deactivated.
          headers:
            X-API-CREDITS-REMAINING:
              schema:
                type: string
                format: int64
                description: >
                  Present when >=50% of base daily credits (excluding add-on
                  credits) are consumed. Value is total remaining credits
                  including add-on credits for the rolling 24-hour window.
              required: false
        '400':
          description: >-
            The deactivation request failed due to a client-side error.

            **Resolution:** Verify that the kiosk ID is valid (`INVALID_DATA`),
            that the kiosk has not already been deactivated
            (`ALREADY_DEACTIVATED`), and that the kiosk has no active
            associations with other components before attempting deactivation
            (`NOT_ALLOWED`).
          content:
            application/json:
              schema:
                description: >-
                  Represents one of three error conditions returned when the
                  deactivation request cannot be fulfilled: the kiosk ID is
                  invalid (`INVALID_DATA`), the kiosk is already inactive
                  (`ALREADY_DEACTIVATED`), or the kiosk has existing
                  associations with other components that prevent deactivation
                  (`NOT_ALLOWED`).
                oneOf:
                  - $ref: '#/components/schemas/KioskTestRunInvalidKioskError'
                  - $ref: '#/components/schemas/KioskDeactivationNotAllowedError'
                  - $ref: '#/components/schemas/KioskAlreadyInactiveError'
                x-zs-$id: DeleteactivateError400
              examples:
                InvalidDataResponse1:
                  summary: 400 INVALID_DATA error when kiosk ID does not exist
                  value:
                    code: INVALID_DATA
                    details:
                      resource_path_index: 2
                    message: No such Kiosk exists
                    status: error
                  description: >-
                    Represents a 400 error response returned when the specified
                    kiosk ID does not correspond to an existing kiosk. The
                    response includes the INVALID_DATA error code, an error
                    status, and a message indicating no such kiosk exists.
                NotAllowedResponse1:
                  summary: >-
                    Error response when the kiosk has existing associations with
                    other components
                  value:
                    code: NOT_ALLOWED
                    details:
                      resource_path_index: 2
                    message: Kiosk associated other components
                    status: error
                  description: >-
                    Represents a 400 error response returned when the specified
                    kiosk cannot be deactivated because it has existing
                    associations with other components. The response includes
                    the NOT_ALLOWED error code, an error status, and a message
                    indicating the kiosk is associated with other components.
                AlreadyDeactivatedResponse1:
                  summary: 400 ALREADY_DEACTIVATED error when kiosk is already inactive
                  value:
                    code: ALREADY_DEACTIVATED
                    details:
                      resource_path_index: 2
                    message: Kiosk already deactive
                    status: error
                  description: >-
                    Represents a 400 error response returned when the specified
                    kiosk has already been deactivated. The response includes
                    the ALREADY_DEACTIVATED error code, an error status, and a
                    message indicating the kiosk is already inactive.
          headers:
            X-API-CREDITS-REMAINING:
              schema:
                type: string
                format: int64
                description: >
                  Present when >=50% of base daily credits (excluding add-on
                  credits) are consumed. Value is total remaining credits
                  including add-on credits for the rolling 24-hour window.
              required: false
      security:
        - OAuth2:
            - ZohoCRM.settings.kiosks.DELETE
components:
  schemas:
    KioskErrorInvalidDataTypeForKiosks:
      type: object
      additionalProperties: false
      description: >-
        Represents the error response returned when the kiosks field or its
        nested fields in the creation payload have invalid data types.
      properties:
        code:
          type: string
          description: >-
            Represents the error code. Possible values:

            INVALID_DATA - The kiosk request contains a field with an invalid
            data type.
          enum:
            - INVALID_DATA
        details:
          type: object
          additionalProperties: false
          description: Contains additional details about the error.
          properties:
            maximum_length:
              type: integer
              format: int32
              description: >-
                Indicates the maximum allowed length for the field that caused
                the error.
            api_name:
              type: string
              description: >-
                Identifies the API name of the field that caused the data type
                error.
              maxLength: 255
            json_path:
              type: string
              description: >-
                Indicates the JSON path of the field that caused the data type
                error.
              maxLength: 1000
          required:
            - api_name
            - json_path
            - maximum_length
        message:
          type: string
          description: |-
            Represents the error message describing the issue. Possible values:
            invalid data
          enum:
            - invalid data
        status:
          type: string
          description: Represents the HTTP response status for this error.
          enum:
            - error
      required:
        - code
        - details
        - message
        - status
      title: Invalid Data Type for Kiosks Error
      x-zs-$id: KioskErrorInvalidDataTypeForKiosks
    KioskErrorNotFoundBulk:
      type: object
      additionalProperties: false
      description: >-
        Represents the error response returned when one or more referenced
        kiosks do not exist during a bulk operation.
      properties:
        code:
          type: string
          description: |-
            Represents the error code. Possible values:
            INVALID_DATA - No kiosk was found with the specified identifier.
          enum:
            - INVALID_DATA
        details:
          type: object
          additionalProperties: false
          description: Contains additional details about the error.
          properties:
            id:
              type: string
              description: >-
                Represents the unique identifier of the kiosk that was not
                found.
              maxLength: 255
          required:
            - id
        message:
          type: string
          description: |-
            Represents the error message describing the issue. Possible values:
            No such Kiosk exists
          enum:
            - No such Kiosk exists
        status:
          type: string
          description: Represents the HTTP response status for this error.
          enum:
            - error
      required:
        - code
        - details
        - message
        - status
      title: Kiosk Not Found (Bulk) Error
      x-zs-$id: KioskErrorNotFoundBulk
    KioskCurrentRecordModuleSummary:
      type:
        - object
        - 'null'
      additionalProperties: false
      description: >-
        Represents a summary of the module assigned as the current record for
        the kiosk, including the plural label, API name, and identifier.
      properties:
        plural_label:
          type: string
          description: Represents the plural display label of the current record module.
          maxLength: 255
        api_name:
          type: string
          description: >-
            Represents the API name of the current record module configured for
            the kiosk.
          maxLength: 255
        id:
          type: string
          description: >-
            Represents the unique identifier of the current record module
            configured for the kiosk.
          maxLength: 255
      required:
        - api_name
        - id
        - plural_label
      title: Kiosk Current Record Module Summary
    KioskModifiedBySummary:
      type: object
      additionalProperties: false
      description: >-
        Represents the summary of the user who last modified the kiosk,
        including the user ID and display name.
      properties:
        name:
          type: string
          description: Represents the name of the user who last modified the kiosk.
          maxLength: 255
        id:
          type: string
          description: >-
            Represents the unique identifier of the user who last modified the
            kiosk.
          maxLength: 255
      required:
        - id
        - name
      title: Kiosk Modified By Summary
    KioskErrorInvalidApiName:
      type: object
      additionalProperties: false
      description: >-
        Represents the error response returned when the group API name provided
        for the kiosk is invalid or contains unsupported characters.
      properties:
        code:
          type: string
          description: >-
            Represents the error code. Possible values:

            INVALID_API_NAME - The group API name provided for the kiosk is
            invalid.
          enum:
            - INVALID_API_NAME
        details:
          type: object
          additionalProperties: false
          description: Contains additional details about the error.
          properties:
            api_name:
              type: string
              description: >-
                Identifies the API name of the kiosk field that contains the
                invalid API name.
              maxLength: 255
            json_path:
              type: string
              description: >-
                Indicates the JSON path of the field that caused the invalid API
                name error.
              maxLength: 1000
          required:
            - api_name
            - json_path
        message:
          type: string
          description: >-
            Represents the error message indicating an invalid kiosk group API
            name.
          enum:
            - Invalid Kiosk api name
        status:
          type: string
          description: Represents the HTTP response status for this error.
          enum:
            - error
      required:
        - code
        - details
        - message
        - status
      title: Invalid API Name Error
      x-zs-$id: KioskErrorInvalidApiName
    KioskSummary:
      type: object
      additionalProperties: true
      description: >-
        Represents a compact summary of a kiosk with core attributes, module
        references, current record module, status, ownership, and version
        details.
      properties:
        created_time:
          type: string
          description: Represents the creation timestamp of the kiosk.
          maxLength: 255
        version_details:
          $ref: '#/components/schemas/KioskVersionDetails'
        module:
          $ref: '#/components/schemas/KioskModuleRef'
        description:
          type:
            - string
            - 'null'
          description: >-
            Represents the description of the kiosk. This value may be null if
            no description is provided.
          maxLength: 255
        created_by:
          $ref: '#/components/schemas/KioskCreatedBySummary'
        sequence_number:
          type: integer
          format: int32
          description: Represents the display order of the kiosk within its group.
        modified_time:
          type: string
          description: Represents the date and time when the kiosk was last modified.
          maxLength: 255
        group_id:
          type: string
          description: >-
            Represents the unique identifier of the group to which the kiosk
            belongs.
          maxLength: 255
        current_record_module:
          anyOf:
            - $ref: '#/components/schemas/KioskCurrentRecordModuleSummary'
            - type: 'null'
              description: >-
                Represents the null state when no current record module is
                configured for the kiosk.
          description: >-
            Represents the module configured as the current record for the
            kiosk.
        associated:
          type: boolean
          description: >-
            Indicates whether the kiosk is associated with other CRM components.
            Possible values:

            true - The kiosk is associated with other components.

            false - The kiosk is not associated with other components.
        name:
          type: string
          description: Represents the name of the kiosk.
          maxLength: 255
        modified_by:
          $ref: '#/components/schemas/KioskModifiedBySummary'
        id:
          type: string
          description: Represents the unique identifier of the kiosk.
          maxLength: 255
          x-zs-$id: KiosksId
        status:
          type: string
          description: Represents the current status of the kiosk.
          maxLength: 255
        group_api_name:
          type: string
          description: Represents the unique group API name for the kiosk.
          maxLength: 255
        chart_data:
          type: object
          description: >-
            Contains the workflow visualization data for the kiosk, including
            chart-specific configuration.
          additionalProperties: true
        transitions:
          type: array
          description: Contains the list of workflow transitions defined for the kiosk.
          maxItems: 100
          items:
            type: object
            description: >-
              Represents a workflow transition of the kiosk, including its name
