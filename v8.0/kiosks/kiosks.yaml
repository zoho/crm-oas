            - ZohoCRM.settings.kiosks.READ
    post:
      summary: |
        Create a Kiosk
      description: >
        To create a new Kiosk in the draft state in your Zoho CRM organization.
        After creating the Kiosk, use the [Create a Kiosk State
        API](kiosks_states.yaml#$.paths./settings/kiosks/{kioskId}/states.post) 
        to configure screens and then use the [Activate Kiosk
        API](kiosks.yaml#$.paths./settings/kiosks/{kioskId}/actions/activate.put)
        to publish it. 


        Available in the Standard, Professional, Enterprise, and Ultimate
        editions.




        **Note:**

        - Using this API, you can only create a kiosk in a single API call. The
        created Kiosk will remain in the draft state.

        - Refer to the [Compare all features of Zoho CRM editions
        document](https://www.zoho.com/crm/complete-feature-list.html) to know
        edition-specific limits for Kiosk creation.
      operationId: createKiosk
      requestBody:
        description: >-
          The request body must contain a kiosks array with one object
          representing the Kiosk to create.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KioskCreateRequest'
            examples:
              SamplePostRequest:
                summary: Create a kiosk with all common fields in draft state
                value:
                  kiosks:
                    - name: ABC
                      description: This is a kiosk
                      group_api_name: ABC
                      current_record_module:
                        id: '111111000000083223'
                        api_name: Leads
                      status: draft
                description: >-
                  Shows a kiosk create request with all commonly used fields,
                  including a name, description, group API name, and a linked
                  module specified by both ID and API name, with the status set
                  to draft.
            x-zs-llm-examples:
              - SamplePostRequest
      responses:
        '201':
          description: >-
            Returns a kiosks array containing one object with the result of the
            create operation. Each object includes a status, a code, a message,
            and a details object containing the ID of the newly created Kiosk.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KioskCreateResponse'
              examples:
                Success201:
                  summary: Successful kiosk creation returning the new kiosk ID
                  value:
                    kiosks:
                      - code: SUCCESS
                        details:
                          id: '4676645000001204338'
                        message: Kiosk created successfully
                        status: success
                  description: >-
                    Shows a successful kiosk creation response, returning a
                    SUCCESS code alongside the newly assigned kiosk ID.
          headers:
            X-API-CREDITS-REMAINING:
              schema:
                type: string
                format: int64
                description: >
                  Present when >=50% of base daily credits (excluding add-on
                  credits) are consumed. Value is total remaining credits
                  including add-on credits for the rolling 24-hour window.
              required: false
        '400':
          description: >
            Bad Request — One or more fields in the request failed validation.

            **Resolution:** Verify that all mandatory fields are present, that
            the group API name contains only valid characters, that the status
            value is valid, that the current_record_module details are correct
            and unambiguous, and that the name and group API name are not
            duplicates of an existing Kiosk.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/KioskErrorMandatoryFieldMissing'
                  - $ref: '#/components/schemas/KioskErrorInvalidDataTypeForKiosks'
                  - type: object
                    additionalProperties: false
                    description: >-
                      Represents a wrapped error response in which each kiosk
                      object that failed validation is reported as a separate
                      error entry in the kiosks array.
                    properties:
                      kiosks:
                        type: array
                        description: >-
                          Represents the list of per-item error objects returned
                          when one or more kiosk fields fail validation.
                        items:
                          oneOf:
                            - $ref: '#/components/schemas/KioskErrorInvalidDataValue'
                            - $ref: '#/components/schemas/KioskErrorDuplicateKiosk'
                            - $ref: '#/components/schemas/KioskErrorInvalidApiName'
                            - $ref: >-
                                #/components/schemas/KioskErrorInvalidDataTypeForKiosks
                            - $ref: >-
                                #/components/schemas/KioskErrorCurrentRecordAmbiguity
                            - $ref: '#/components/schemas/KioskErrorModuleNotFound'
                            - $ref: >-
                                #/components/schemas/KioskErrorMissingRequiredField
                            - $ref: '#/components/schemas/KioskErrorInvalidDataType'
                            - $ref: '#/components/schemas/KioskErrorInvalidData'
                          description: >-
                            Represents an error object describing a validation
                            failure for a specific kiosk field. Possible values:
                            INVALID_DATA - the provided value does not match the
                            expected pattern or allowed set; DUPLICATE_DATA - a
                            duplicate name or group API name was submitted;
                            INVALID_API_NAME - the group API name contains
                            invalid characters or format;
                            AMBIGUITY_DURING_PROCESSING - the module ID and API
                            name do not correspond to the same module;
                            MANDATORY_NOT_FOUND - a required field is absent.
                        maxItems: 25
                    required:
                      - kiosks
                    x-zs-$id: PostkiosksError400Wrapper
                x-zs-$id: PostkiosksError400
                description: >-
                  Represents the error response body returned for a 400 Bad
                  Request. Contains one of: a top-level mandatory-field or
                  invalid-data-type error, or a wrapped kiosks array of per-item
                  field-level validation errors.
              examples:
                MandatoryNotFoundResponse1:
                  summary: >-
                    MANDATORY_NOT_FOUND error when the required kiosks array is
                    absent
                  value:
                    code: MANDATORY_NOT_FOUND
                    details:
                      api_name: kiosks
                      json_path: $.kiosks
                    message: required field not found
                    status: error
                  description: >-
                    Shows a 400 error response returned when the request body is
                    submitted without the required top-level kiosks array,
                    producing a MANDATORY_NOT_FOUND error.
                InvalidDataResponse1:
                  summary: >-
                    INVALID_DATA error when the kiosks array exceeds the maximum
                    allowed size
                  value:
                    code: INVALID_DATA
                    details:
                      maximum_length: 1
                      api_name: kiosks
                      json_path: $.kiosks
                    message: invalid data
                    status: error
                  description: >-
                    Shows a 400 error response returned when the kiosks array in
                    the request body exceeds its maximum allowed size of one
                    item, producing an INVALID_DATA error scoped to the kiosks
                    field.
                InvalidDataResponse2:
                  summary: >-
                    INVALID_DATA error when status is set to a value outside the
                    allowed set
                  value:
                    kiosks:
                      - code: INVALID_DATA
                        details:
                          expected_data_type: text
                          regex: draft
                          api_name: status
                          json_path: $.kiosks[0].status
                        message: invalid data
                        status: error
                  description: >-
                    Shows a 400 error response returned when the status field is
                    set to a value not in the permitted set of allowed statuses,
                    producing an INVALID_DATA error.
                DuplicateDataResponse1:
                  summary: >-
                    DUPLICATE_DATA error when a kiosk with the same name already
                    exists
                  value:
                    kiosks:
                      - code: DUPLICATE_DATA
                        details:
                          api_name: name
                          json_path: $.kiosks[0].name
                        message: Duplicate Kiosk name
                        status: error
                  description: >-
                    Shows a 400 error response returned when a kiosk with the
                    same name already exists in the system, producing a
                    DUPLICATE_DATA error scoped to the name field.
                InvalidApiNameResponse1:
                  summary: >-
                    INVALID_API_NAME error when group_api_name does not match a
                    valid API name
                  value:
                    kiosks:
                      - code: INVALID_API_NAME
                        details:
                          api_name: group_api_name
                          json_path: $.kiosks[0].group_api_name
                        message: Invalid Kiosk api name
                        status: error
                  description: >-
                    Shows a 400 error response returned when the value supplied
                    for group_api_name does not correspond to a valid API name,
                    producing an INVALID_API_NAME error.
                InvalidDataResponse3:
                  summary: >-
                    INVALID_DATA error when group_api_name contains an invalid
                    value
                  value:
                    kiosks:
                      - code: INVALID_DATA
                        details:
                          maximum_length: 25
                          api_name: group_api_name
                          json_path: $.kiosks[0].group_api_name
                        message: invalid data
                        status: error
                  description: >-
                    Shows a 400 error response returned when the group_api_name
                    field contains invalid data that does not pass server-side
                    validation, producing an INVALID_DATA error.
                AmbiguityDuringProcessingResponse1:
                  summary: >-
                    AMBIGUITY_DURING_PROCESSING error when module ID and API
                    name conflict
                  value:
                    kiosks:
                      - code: AMBIGUITY_DURING_PROCESSING
                        details:
                          ambiguity_due_to:
                            - api_name: id
                              json_path: $.kiosks[0].current_record_module.id
                            - api_name: api_name
                              json_path: $.kiosks[0].current_record_module.api_name
                        message: Ambiguity while processing the request
                        status: error
                  description: >-
                    Shows a 400 error response returned when the module ID and
                    API name supplied in current_record_module do not refer to
                    the same module, triggering an AMBIGUITY_DURING_PROCESSING
                    error.
                InvalidDataResponse4:
                  summary: >-
                    INVALID_DATA error when the module referenced by
                    current_record_module ID does not exist
                  value:
                    kiosks:
                      - code: INVALID_DATA
                        details:
                          api_name: id
                          json_path: $.kiosks[0].current_record_module.id
                        message: the given module doesn't exist
                        status: error
                  description: >-
                    Shows a 400 error response returned when the ID field in
                    current_record_module refers to a module that does not exist
                    in the organization, producing an INVALID_DATA error.
                MandatoryNotFoundResponse2:
                  summary: >-
                    MANDATORY_NOT_FOUND error when the required name field is
                    missing from a kiosk item
                  value:
                    kiosks:
                      - code: MANDATORY_NOT_FOUND
                        message: Required field is missing
                        details:
                          api_name: name
                          json_path: $.kiosks[*].name
                        status: error
                  description: >-
                    Shows a 400 error response returned when the name field is
                    omitted from a kiosk array item, producing a
                    MANDATORY_NOT_FOUND error indicating that a required field
                    is missing.
                InvalidDataResponse5:
                  summary: INVALID_DATA error when the name field is not a text type
                  value:
                    kiosks:
                      - code: INVALID_DATA
                        message: Invalid data type
                        details:
                          api_name: name
                          expected_data_type: text
                          json_path: $.kiosks[*].name
                        status: error
                  description: >-
                    Shows a 400 error response returned when the name field is
                    provided with a value of an incorrect data type instead of
                    text, producing an INVALID_DATA error.
                InvalidDataResponse6:
                  summary: >-
                    INVALID_DATA error when the name field exceeds the maximum
                    allowed length
                  value:
                    kiosks:
                      - code: INVALID_DATA
                        message: Invalid data
                        details:
                          api_name: name
                          maximum_length: 25
                          json_path: $.kiosks[*].name
                        status: error
                  description: >-
                    Shows a 400 error response returned when the name field
                    value exceeds the maximum allowed length of 25 characters,
                    producing an INVALID_DATA error.
                InvalidDataResponse7:
                  summary: >-
                    INVALID_DATA error when the description field is not a text
                    type
                  value:
                    kiosks:
                      - code: INVALID_DATA
                        message: Invalid data type
                        details:
                          api_name: description
                          expected_data_type: text
                          json_path: $.kiosks[*].description
                        status: error
                  description: >-
                    Shows a 400 error response returned when the description
                    field is provided with a value of an incorrect data type
                    instead of text, producing an INVALID_DATA error.
                InvalidDataResponse8:
                  summary: >-
                    INVALID_DATA error when the description field exceeds the
                    maximum allowed length
                  value:
                    kiosks:
                      - code: INVALID_DATA
                        message: Invalid data
                        details:
                          api_name: description
                          maximum_length: 500
                          json_path: $.kiosks[*].description
                        status: error
                  description: >-
                    Shows a 400 error response returned when the description
                    field value exceeds the maximum allowed length of 500
                    characters, producing an INVALID_DATA error.
                InvalidDataResponse9:
                  summary: >-
                    INVALID_DATA error when the group_api_name field is not a
                    text type
                  value:
                    kiosks:
                      - code: INVALID_DATA
                        message: Invalid data type
                        details:
                          api_name: group_api_name
                          expected_data_type: text
                          json_path: $.kiosks[*].group_api_name
                        status: error
                  description: >-
                    Shows a 400 error response returned when the group_api_name
                    field is provided with a value of an incorrect data type
                    instead of text, producing an INVALID_DATA error.
                InvalidDataResponse10:
                  summary: >-
                    INVALID_DATA error when group_api_name exceeds the maximum
                    allowed length
                  value:
                    kiosks:
                      - code: INVALID_DATA
                        message: Invalid data
                        details:
                          api_name: group_api_name
                          maximum_length: 25
                          json_path: $.kiosks[*].group_api_name
                        status: error
                  description: >-
                    Shows a 400 error response returned when the group_api_name
                    value exceeds its maximum allowed length, producing an
                    INVALID_DATA error scoped to the group_api_name field.
                InvalidDataResponse11:
                  summary: >-
                    INVALID_DATA error when current_record_module is not a JSON
                    object type
                  value:
                    kiosks:
                      - code: INVALID_DATA
                        message: Invalid data type
                        details:
                          api_name: current_record_module
                          expected_data_type: jsonobject
                          json_path: $.kiosks[*].current_record_module
                        status: error
                  description: >-
                    Shows a 400 error response returned when the
                    current_record_module field is supplied with a value of an
                    incorrect data type instead of a JSON object, producing an
                    INVALID_DATA error.
                InvalidDataResponse12:
                  summary: >-
                    INVALID_DATA error when current_record_module exceeds the
                    maximum allowed size
                  value:
                    kiosks:
                      - code: INVALID_DATA
                        message: Invalid data
                        details:
                          api_name: current_record_module
                          maximum_length: 1
                          json_path: $.kiosks[*].current_record_module
                        status: error
                  description: >-
