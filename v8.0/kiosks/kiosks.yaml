      description: >
        To update an existing **draft** Kiosk in Zoho CRM. This API allows you
        to update the Kiosk's name, description, group API name, and current
        record module. 


        Use the [Get All Kiosks API](kiosks.yaml#$.paths./settings/kiosks.get)
        to retrieve the Kiosk ID. You can identify a draft Kiosk using the
        status key in the response, where the value will be draft.



        **Note:**

        - You can update **one** Kiosk in a single API call.

        - All fields supported in the [Create a Kiosk
        API](kiosks.yaml#$.paths./settings/kiosks.post) can be updated using
        this API.

        - You can update a Kiosk only when it is in the draft state.


        Availability: Standard, Professional, Enterprise, and Ultimate editions.
      operationId: updateKiosk
      parameters:
        - $ref: '#/components/parameters/ParamPathKioskid'
      requestBody:
        description: The request body must contain a kiosks array with one object.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KioskEditRequest'
            examples:
              SamplePutRequest:
                summary: >-
                  Update a Kiosk with name, description, group API name, and
                  current record module
                value:
                  kiosks:
                    - name: ABC
                      description: This is a kiosk
                      group_api_name: ABCD
                      current_record_module:
                        id: '111111000000083223'
                        api_name: Leads
                description: >-
                  Shows a Kiosk update request that modifies the name,
                  description, group API name, and current record module of an
                  existing draft Kiosk.
            x-zs-llm-examples:
              - SamplePutRequest
      responses:
        '200':
          description: >-
            Returns the result of the Kiosk update operation, including the
            status code and the ID of the updated Kiosk.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KioskUpdateResponse'
              examples:
                Success200:
                  summary: Successful Kiosk update response
                  value:
                    kiosks:
                      - code: SUCCESS
                        details:
                          id: '4676645000001204338'
                        message: Kiosk updated successfully
                        status: success
                  description: >-
                    Returns the operation result confirming the Kiosk updated
                    successfully, along with the ID of the updated Kiosk.
          headers:
            X-API-CREDITS-REMAINING:
              schema:
                type: string
