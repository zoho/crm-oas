                  description: >
                    Shows a successful response for retrieving all kiosks. The
                    response contains an array of kiosk objects, each including
                    version details, module information, status, and creator and
                    modifier metadata.
          headers:
            X-API-CREDITS-REMAINING:
              schema:
                type: string
                format: int64
                description: >
                  Present when >=50% of base daily credits (excluding add-on
                  credits) are consumed. Value is total remaining credits
                  including add-on credits for the rolling 24-hour window.
              required: false
        '400':
          description: >-
            The configuration module name is invalid (INVALID_MODULE), or the
            API version used does not support kiosks (API_NOT_SUPPORTED).

            **Resolution:** Pass the correct module name, or use a supported API
            version.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/KioskErrorInvalidModule'
                  - $ref: '#/components/schemas/KioskErrorApiNotSupported'
                x-zs-$id: GetkiosksError400
                description: >
                  Represents one of two possible error responses returned for a
                  bad request: an invalid configuration module name
                  (INVALID_MODULE) or an unsupported API version
                  (API_NOT_SUPPORTED).
              examples:
                InvalidModuleResponse1:
                  summary: |
                    400 error — invalid configuration module name
                  value:
                    code: INVALID_MODULE
                    details:
                      resource_path_index: 0
                    message: the config module name seems to be invalid
                    status: error
                  description: >
                    Shows a 400 error response when the configuration module
                    name provided in the request is invalid. The response
                    includes the INVALID_MODULE error code and a descriptive
                    message.
                ApiNotSupportedResponse1:
                  summary: |
                    400 error — API version not supported
                  value:
                    code: API_NOT_SUPPORTED
                    details:
                      supported_version: 6
                    message: api version is not supported
                    status: error
                  description: >
                    Shows a 400 error response when the API version used does
                    not support kiosks. The response includes the
                    API_NOT_SUPPORTED error code and a descriptive message.
          headers:
            X-API-CREDITS-REMAINING:
              schema:
                type: string
                format: int64
                description: >
                  Present when >=50% of base daily credits (excluding add-on
                  credits) are consumed. Value is total remaining credits
                  including add-on credits for the rolling 24-hour window.
              required: false
      security:
