openapi: 3.1.0
info:
  title: Kiosks
  description: >
    Kiosks in Zoho CRM are guided, step-by-step interactive workflow screens
    that enable administrators and developers to build custom multi-screen
    experiences for users directly within the CRM interface. This API enables
    developers to manage the full kiosk lifecycle, including creating,
    retrieving, updating, deleting, cloning, activating, and deactivating
    kiosks. Refer to the [Kiosk Studio - An
    overview](https://help.zoho.com/portal/en/kb/crm/customize-crm-account/kiosk/articles/kiosk-an-overview)
    for more details.
  version: '8'
servers:
  - url: https://zohoapis.{dc}/crm/{version}
    description: API Server for /crm
    variables:
      dc:
        description: API Server URL TLD
        default: com
        enum:
          - com
          - eu
          - in
          - cn
          - au
          - ca
          - jp
      version:
        description: API Version
        default: v8
paths:
  /settings/kiosks:
    get:
      summary: |
        Get All Kiosks
      description: >
        To retrieve all the available Kiosks in your Zoho CRM organization. The
        response includes metadata for each Kiosk, such as version information,
        associated module, current status, creator and modifier details, and
        record context, if configured.
      operationId: getAllKiosks
      parameters:
        - $ref: '#/components/parameters/ParamQueryIncludeInnerDetails'
