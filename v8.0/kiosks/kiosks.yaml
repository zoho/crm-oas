    delete:
      summary: Kiosk Deletion
      description: >
        To delete one or more Kiosks from your Zoho CRM account. Use the [Get
        Kiosks API](kiosks.yaml#$.paths./settings/kiosks.get) to retrieve Kiosk
        IDs.


        **Note:**


        You can delete:
         - Draft Kiosks.
         - Deactivated Kiosks.
         - Published Kiosks that are not associated with any supported locations, such as the Home Page, Setup Page, Custom Buttons, or the Record Details View.

        Available in the Standard, Professional, Enterprise, and Ultimate
        editions.
      operationId: bulkDeleteKiosks
      parameters:
        - $ref: '#/components/parameters/ParamQueryIds'
      responses:
        '200':
          description: >-
            Returns a per-Kiosk deletion result for each Kiosk ID submitted in
            the request. Each entry in the kiosks array confirms the deletion
            status of the corresponding Kiosk, including a result code and the
            ID of the deleted Kiosk.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KioskBulkDeleteResponse'
              examples:
                Success200:
                  summary: Successful bulk deletion of two Kiosks
                  value:
                    kiosks:
                      - code: SUCCESS
                        details:
                          id: '111111000000096006'
                        message: deleted successfully
                        status: success
                      - code: SUCCESS
                        details:
                          id: '111111000000080267'
                        message: deleted successfully
                        status: success
                  description: >-
                    Shows a successful bulk deletion response for two Kiosks.
                    Each entry in the kiosks array confirms the deletion with a
                    SUCCESS code and the unique ID of the deleted Kiosk.
          headers:
            X-API-CREDITS-REMAINING:
              schema:
                type: string
                format: int64
                description: >
                  Present when >=50% of base daily credits (excluding add-on
                  credits) are consumed. Value is total remaining credits
                  including add-on credits for the rolling 24-hour window.
              required: false
        '400':
          description: >-
            The request cannot be processed due to a missing required parameter,
            an invalid Kiosk ID, or an attempt to delete a Kiosk that is
            associated with one or more supported locations.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/KioskErrorRequiredParamMissing'
                  - $ref: '#/components/schemas/KioskErrorNotFoundBulk'
                  - $ref: '#/components/schemas/KioskErrorNotAllowedDelete'
                x-zs-$id: DeleteBulkKiosksError400
                description: >-
                  Represents one of the possible error responses returned when a
                  bulk Kiosk deletion request fails. The response can indicate a
                  missing required parameter, an invalid Kiosk ID, or an attempt
                  to delete a Kiosk that is associated with one or more
                  supported locations.
              examples:
                RequiredParamMissingResponse1:
                  summary: REQUIRED_PARAM_MISSING error when ids parameter is absent
                  value:
                    code: REQUIRED_PARAM_MISSING
                    details:
                      param_name: ids
                    message: One of the expected param is missing
                    status: error
                  description: >-
                    Returned with a REQUIRED_PARAM_MISSING code when the bulk
                    DELETE request is submitted without the mandatory ids
                    parameter, as indicated by param_name in the details object.
                    Ensure the ids parameter is included in the request before
                    retrying.
                InvalidDataResponse1:
                  summary: INVALID_DATA error for an unrecognized Kiosk ID
                  value:
                    code: INVALID_DATA
                    details:
                      id: '467664500000089305'
                    message: No such Kiosk exists
                    status: error
                  description: >-
                    Returned when one of the Kiosk IDs supplied in the bulk
                    DELETE request does not correspond to an existing Kiosk,
                    indicated by the INVALID_DATA code and the unrecognized ID
                    in the details object. The resolution is to verify the ID
                    and resubmit the request with a valid Kiosk ID.
                NotAllowedResponse1:
                  summary: NOT_ALLOWED error when deleting an associated Kiosk
                  value:
                    code: NOT_ALLOWED
                    details:
                      resource_path_index: 2
                    message: Kiosk associated other components
                    status: error
                  description: >-
                    Returned with a NOT_ALLOWED code when the targeted Kiosk
                    cannot be deleted because it is associated with one or more
                    supported locations, with the details object identifying the
                    offending entry by its resource_path_index. To resolve,
                    deactivate the Kiosk or remove its associations before
                    retrying deletion.
          headers:
            X-API-CREDITS-REMAINING:
              schema:
                type: string
                format: int64
                description: >
                  Present when >=50% of base daily credits (excluding add-on
                  credits) are consumed. Value is total remaining credits
                  including add-on credits for the rolling 24-hour window.
              required: false
      security:
        - OAuth2:
            - ZohoCRM.settings.kiosks.DELETE
