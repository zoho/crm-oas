    delete:
      summary: Delete a kiosk
      description: >
        To delete an existing Kiosk from your Zoho CRM organization. The
        deletion removes the entire Kiosk entry, including all states created
        within it, along with any related data. You can delete Draft Kiosks,
        Deactivated Kiosks, and Published Kiosks that are not associated with
        any supported locations, such as the Home Page, Setup Page, Custom
        Buttons, or the Record Details View. 


        Use the [Get Kiosks API](kiosks.yaml#$.paths./settings/kiosks.get) to
        retrieve Kiosk ID.


        Available in: Standard, Professional, Enterprise, and Ultimate editions.


        **Note:**


        You can delete:
           - Draft Kiosks
           - Deactivated Kiosks
           - Published Kiosks that are not associated with any supported locations, such as the Home Page, Setup Page, Custom Buttons, or the Record Details View.
      operationId: deleteKiosk
      parameters:
        - $ref: '#/components/parameters/ParamPathKioskid'
      responses:
        '200':
          description: >-
            Returns the deletion result for the specified kiosk, including the
            operation status code, a confirmation message, and the ID of the
            deleted kiosk.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KioskDeleteResponse'
              examples:
                Success200:
                  summary: Successful deletion of a single kiosk
                  value:
                    kiosks:
                      - code: SUCCESS
                        details:
                          id: '4676645000000681242'
                        message: deleted successfully
                        status: success
                  description: >-
                    Shows the response confirming a successful kiosk deletion,
                    including the operation status code, a confirmation message,
                    and the ID of the deleted kiosk.
          headers:
            X-API-CREDITS-REMAINING:
              schema:
                type: string
                format: int64
                description: >
                  Present when >=50% of base daily credits (excluding add-on
                  credits) are consumed. Value is total remaining credits
                  including add-on credits for the rolling 24-hour window.
              required: false
        '400':
          description: >-
            The request could not be completed due to a validation error or a
            restriction on the operation.

            **Resolution:** The kiosk ID in the request path must be valid, or
            the kiosk must not be associated with any supported locations before
            deletion.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/KioskErrorNotFound'
                  - $ref: '#/components/schemas/KioskErrorNotAllowedDelete'
                x-zs-$id: DeleteSingleKioskError400
                description: >
                  Represents the error response schema for a failed delete
                  operation. Contains one of two possible error variants: a
                  not-found error when the specified kiosk ID does not exist
                  (INVALID_DATA), or a not-allowed error when the kiosk is
                  associated with one or more supported locations (NOT_ALLOWED).
              examples:
                InvalidDataResponse1:
                  summary: INVALID_DATA error for a non-existent kiosk ID
                  value:
                    code: INVALID_DATA
                    details:
                      resource_path_index: 2
                    message: No such Kiosk exists
                    status: error
                  description: >-
                    Demonstrates the error response when the specified kiosk ID
                    does not exist in the Zoho CRM organization, returning an
                    INVALID_DATA code and a descriptive error message.
                NotAllowedResponse1:
                  summary: >-
                    NOT_ALLOWED error for a kiosk associated with supported
                    locations
                  value:
                    code: NOT_ALLOWED
                    details:
                      resource_path_index: 2
                    message: Kiosk associated other components
                    status: error
                  description: >-
                    Demonstrates the error response when the kiosk cannot be
                    deleted because it is associated with one or more supported
                    locations, returning a NOT_ALLOWED code and a descriptive
                    error message.
          headers:
            X-API-CREDITS-REMAINING:
              schema:
                type: string
                format: int64
                description: >
                  Present when >=50% of base daily credits (excluding add-on
                  credits) are consumed. Value is total remaining credits
                  including add-on credits for the rolling 24-hour window.
              required: false
      security:
        - OAuth2:
            - ZohoCRM.settings.kiosks.DELETE
  /settings/kiosks/{kioskId}/actions/clone:
    post:
      summary: |
        Clone a Kiosk
      description: >
        To clone an existing kiosk in Zoho CRM and create a new one from it.
        Cloning lets you reuse the full structure and configuration of a kiosk —
        including all its states, transitions, screens, actions, and decisions —
        without rebuilding it from scratch. The cloned kiosk can be created as
        an independent, standalone kiosk or as a draft version linked to the
        source kiosk. This API copies the source kiosk exactly as it is; it does
        not support modifying the kiosk's configuration during the cloning
        process. 

        To make changes to the cloned Kiosk after it is created, use the [Update
        a Kiosk State API](kiosks.yaml#$.paths./settings/kiosks/{kioskId}.put).



        Available on Standard, Professional, Enterprise, and Ultimate editions.
      operationId: cloneKiosk
      parameters:
        - $ref: '#/components/parameters/KioskIdPathParams'
        - $ref: '#/components/parameters/ParamQueryDeleteKioskId'
        - $ref: '#/components/parameters/ParamQueryKioskClone'
      requestBody:
        description: >
          The request body must contain a kiosks array with one object. The
          object must specify the clone type (standalone or dependent). For a
          standalone clone, the name and group_api_name fields are also
          required; description is optional.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KioskCloneRequest'
            examples:
              SamplePostRequest:
                summary: >
                  Standalone clone request with name, description, and group API
                  name
                value:
                  kiosks:
                    - name: new-Cloned
                      description: abc
                      type: standalone
                      group_api_name: new_Cloned
                description: >
                  A standalone clone request that specifies the kiosk name,
                  description, type, and group API name.
            x-zs-llm-examples:
              - SamplePostRequest
      responses:
        '200':
          description: >
            The kiosk was cloned successfully. Returns a kiosks object
            containing the status code, a success message, and the ID of the
            newly created kiosk.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KioskCloneSuccessResponse'
                x-zs-$id: PostcloneResponse200
              examples:
                Success200:
                  summary: |
                    Kiosk cloned successfully — returns new kiosk ID
                  value:
                    kiosks:
                      code: SUCCESS
                      details:
                        id: '2296900000011323255'
                      message: Kiosk cloned successfully
                      status: success
                  description: >
                    A successful clone response returning a status of success, a
                    SUCCESS code, and the ID of the newly created kiosk.
          headers:
            X-API-CREDITS-REMAINING:
              schema:
                type: string
                format: int64
                description: >
                  Present when >=50% of base daily credits (excluding add-on
                  credits) are consumed. Value is total remaining credits
                  including add-on credits for the rolling 24-hour window.
              required: false
        '400':
          description: >
            Returned when the clone request is rejected due to a missing,
            invalid, or incomplete input.


            **`ID_ALREADY_DELETED`** — No such kiosk exists.

            **Resolution:** Specify the ID of an existing kiosk.


            **`MANDATORY_NOT_FOUND`** — A required field is missing from the
            request body.

            **Resolution:** Specify values for all required fields.


            **`INVALID_DATA`** — The value provided for the type field is not
            valid.

            **Resolution:** Specify a valid type value: `standalone` or
            `dependent`.


            **`DEPENDENT_FIELD_MISSING`** — The name or group_api_name field is
            required for a standalone clone but was not provided.

            **Resolution:** Include the name and group_api_name fields when
            creating a standalone clone.
          content:
            application/json:
              schema:
                description: >
                  Returned when the clone request cannot be processed. Covers
                  two error shapes: a kiosk-not-found error when the specified
                  kiosk ID does not exist, or a wrapped array of field-level and
                  payload-level validation errors when the request body is
                  invalid.
                oneOf:
                  - $ref: '#/components/schemas/KioskNotFoundError'
                  - type: object
                    additionalProperties: false
                    description: >
                      A response object returned when one or more request-body
                      fields fail validation. Contains a kiosks array where each
                      item describes a specific validation error encountered
                      during the clone operation.
                    properties:
                      kiosks:
                        type: array
                        description: >
                          Contains one or more error objects returned when the
                          clone request fails validation. Each item identifies
                          the specific field-level or payload-level error that
                          caused the failure.
                        items:
                          oneOf:
                            - $ref: >-
                                #/components/schemas/KioskCloneMandatoryFieldMissingError
                            - $ref: '#/components/schemas/KioskCloneTypeInvalidError'
                            - $ref: >-
                                #/components/schemas/KioskCloneInvalidDataTypeError
                            - $ref: '#/components/schemas/KioskCloneInvalidDataError'
                            - $ref: >-
                                #/components/schemas/KioskCloneInvalidPayloadError
                            - $ref: >-
                                #/components/schemas/KioskCloneRequiredFieldMissingError
                            - $ref: >-
                                #/components/schemas/KioskCloneInvalidRequestError
                            - $ref: >-
                                #/components/schemas/KioskCloneDependentFieldMissingError
                          description: >
                            An error object describing a single validation
                            failure encountered during the clone operation.
                            Possible types include mandatory field missing,
                            invalid type value, invalid data, invalid payload,
                            required field missing, invalid request, and
                            dependent field missing errors.
                        maxItems: 25
                    required:
                      - kiosks
                    x-zs-$id: PostcloneError400Wrapper
                x-zs-$id: PostcloneError400
              examples:
                IdAlreadyDeletedResponse1:
                  summary: ID_ALREADY_DELETED error — specified kiosk does not exist
                  value:
                    code: ID_ALREADY_DELETED
                    details: {}
                    message: No such Kiosk exists
                    status: error
                  description: >-
                    Returned when the kioskId path parameter does not correspond
