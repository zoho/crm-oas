openapi: 3.1.0
info:
  title: Tag Actions API
  description: >-
    This file contains tag actions endpoints for managing tag associations on
    CRM records, including adding, removing, and merging tags, as well as
    retrieving tag records count.
  version: '8'
servers:
  - url: https://zohoapis.{dc}/crm/{version}
    description: Production API server for Zoho CRM.
    variables:
      dc:
        description: >
          The top-level domain for the Zoho CRM API server based on the data
          center region.


          **Possible values:**

          - **com** - US.

          - **eu** - EU.

          - **in** - India.

          - **cn** - China.

          - **au** - Australia.

          - **ca** - Canada.

          - **jp** - Japan.


          Default: **com**.
        default: com
        enum:
          - com
          - eu
          - in
          - cn
          - au
          - ca
          - jp
      version:
        description: The API version identifier. Default:v8.
        default: v8
paths:
  /{module}/actions/add_tags:
    post:
      summary: Add Tags to Records
      description: Associates tags to one or more records in the specified module.
      operationId: postAddTags
      parameters:
        - $ref: '#/components/parameters/ParamPathModule'
      requestBody:
        description: Request body containing the tags to associate and the record IDs.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostaddtagsRequest'
            examples:
              SamplePostRequest:
                summary: Sample request body
                value:
                  tags:
                    - name: test
                      color_code: '#F17574'
                    - name: new
                      color_code: '#63C57E'
                    - name: 34ytwerfdgjhfwgerfs
                      color_code: '#E7A826'
                  ids: '["3060320000002538026"]'
                  over_write: true
      responses:
        '200':
          description: OK - Tags associated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostaddtagsResponse200'
              examples:
                Success200:
                  summary: Success response for status 200
                  value:
                    data:
                      - code: SUCCESS
                        details:
                          id: '3060320000002538026'
                          affected_data: null
                          tags:
                            - name: test
                              id: '3060320000000666862'
                              color_code: '#F17574'
                            - name: new
                              id: '3060320000000669006'
                              color_code: '#63C57E'
                            - name: 34ytwerfdgjhfwgerfs
                              id: '3060320000000666022'
                              color_code: '#E7A826'
                        message: tags updated successfully
                        status: success
                    locked_count: '0'
        '400':
          description: >-
            Bad Request - The request cannot be processed due to invalid syntax
            or validation errors. Review the error details and correct the
            issues before retrying.
          content:
            application/json:
              schema:
                description: Error response for status 400
                oneOf:
                  - $ref: '#/components/schemas/RecordLockedError'
                  - $ref: '#/components/schemas/TagsInvalidDataError'
                  - $ref: '#/components/schemas/InvalidModuleNameError'
                  - $ref: '#/components/schemas/ModuleTagsNotSupportedError'
                  - $ref: '#/components/schemas/InvalidRequestMethodError'
                  - $ref: '#/components/schemas/RequiredParamMissingError'
                  - type: object
                    additionalProperties: false
                    description: Wrapped error response with per-tag validation errors
                    properties:
                      tags:
                        type: array
                        description: >-
                          Array of error objects for tag field validation
                          failures
                        items:
                          oneOf:
                            - $ref: >-
                                #/components/schemas/TagFieldInvalidDataTypeError
                            - $ref: '#/components/schemas/TagFieldMaxLengthError'
                        maxItems: 25
                    required:
                      - tags
                    x-zs-$id: PostaddtagsError
                  - type: object
                    additionalProperties: false
                    description: >-
                      Permission denied error when attempting bulk tag addition
                      without write access
                    properties:
                      code:
                        type: string
                        enum:
                          - FAILURE
                        description: Error code
                      details:
                        type: object
                        additionalProperties: true
                        description: Additional error context
                      message:
                        type: string
                        enum:
                          - permission denied to  update records
                        description: Human-readable error message
                      status:
                        type: string
                        enum:
                          - error
                        description: Error status
                    required:
                      - code
                      - details
                      - message
                      - status
                    x-zs-$id: PostAddTagsNoWritePermissionError
                x-zs-$id: PostaddtagsError400
              examples:
                RecordLockedResponse1:
                  summary: >-
                    Error response with code RECORD_LOCKED: Sorry, you cannot
                    perform this operation as the record is locked.
                  value:
                    code: RECORD_LOCKED
                    details:
                      action: record_locking
                      id: '3060320000002538026'
                    message: >-
                      Sorry, you cannot perform this operation as the record is
                      locked.
                    status: error
                InvalidDataResponse1:
                  summary: >-
                    Error response with code INVALID_DATA: invalid data (Field:
                    tags)
                  value:
                    code: INVALID_DATA
                    details:
                      maximum_length: 3
                      api_name: tags
                      json_path: $.tags
                    message: invalid data
                    status: error
                InvalidModuleResponse1:
                  summary: >-
                    Error response with code INVALID_MODULE: the module name
                    given seems to be invalid
                  value:
                    code: INVALID_MODULE
                    details: {}
                    message: the module name given seems to be invalid
                    status: error
                InvalidModuleResponse2:
                  summary: >-
                    Error response with code INVALID_MODULE: the given module is
                    not supported for this api
                  value:
                    code: INVALID_MODULE
                    details: {}
                    message: the given module is not supported for this api
                    status: error
                InvalidRequestMethodResponse1:
                  summary: >-
                    Error response with code INVALID_REQUEST_METHOD: The http
                    request method type is not a valid one
                  value:
                    code: INVALID_REQUEST_METHOD
                    details: {}
                    message: The http request method type is not a valid one
                    status: error
                RequiredParamMissingResponse1:
                  summary: >-
                    Error response with code REQUIRED_PARAM_MISSING: One of the
                    expected param is missing
                  value:
                    code: REQUIRED_PARAM_MISSING
                    details:
                      param_name: module
                    message: One of the expected param is missing
                    status: error
                InvalidDataResponse2:
                  summary: >-
                    Error response with code INVALID_DATA: Invalid data type
                    (Field: name)
                  value:
                    tags:
                      - code: INVALID_DATA
                        message: Invalid data type
                        details:
                          api_name: name
                          expected_data_type: text
                          json_path: $.tags[*].name
                        status: error
                InvalidDataResponse3:
                  summary: >-
                    Error response with code INVALID_DATA: Invalid data (Field:
                    name)
                  value:
                    tags:
                      - code: INVALID_DATA
                        message: Invalid data
                        details:
                          api_name: name
                          maximum_length: 25
                          json_path: $.tags[*].name
                        status: error
                InvalidDataResponse4:
                  summary: >-
                    Error response with code INVALID_DATA: Invalid data type
                    (Field: color_code)
                  value:
                    tags:
                      - code: INVALID_DATA
                        message: Invalid data type
                        details:
                          api_name: color_code
                          expected_data_type: text
                          json_path: $.tags[*].color_code
                        status: error
                InvalidDataResponse5:
                  summary: >-
                    Error response with code INVALID_DATA: Invalid data (Field:
                    color_code)
                  value:
                    tags:
                      - code: INVALID_DATA
                        message: Invalid data
                        details:
                          api_name: color_code
                          maximum_length: 7
                          json_path: $.tags[*].color_code
                        status: error
        '403':
          description: >-
            Forbidden - The client does not have access rights to perform the
            operation.
          content:
            application/json:
              schema:
                description: Error response for status 403
                x-zs-$id: PostaddtagsError403
                $ref: '#/components/schemas/NoPermissionError'
              examples:
                NoPermissionResponse1:
                  summary: 'Error response with code NO_PERMISSION: permission denied'
                  value:
                    code: NO_PERMISSION
                    details:
                      permissions:
                        - Crm_Implied_Edit_Leads
                        - Crm_Implied_Tags_Leads
                    message: permission denied
                    status: error
      security:
        - OAuth2:
            - ZohoCRM.modules.ALL
  /{module}/actions/remove_tags:
    post:
      summary: Remove Tags from Records
      description: Removes tags from one or more records in the specified module.
      operationId: postRemoveTags
      parameters:
        - $ref: '#/components/parameters/ParamQueryModule1'
        - $ref: '#/components/parameters/ParamPathModule'
      requestBody:
        description: Request body containing the tags to remove and the record IDs.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostremovetagsRequest'
            examples:
              SamplePostRequest:
                summary: Sample request body
                value:
                  tags:
                    - name: newtd
                  ids: '["3060320000002496003"]'
      responses:
        '200':
          description: OK - Tags removed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostremovetagsResponse200'
              examples:
                Success200:
                  summary: Success response for status 200
                  value:
                    data:
                      - code: SUCCESS
                        details:
                          id: '3060320000002496003'
                          tags: []
                        message: tags updated successfully
                        status: success
                    locked_count: '0'
        '400':
          description: >-
            Bad Request - The request cannot be processed due to invalid syntax
            or validation errors. Review the error details and correct the
            issues before retrying.
          content:
            application/json:
              schema:
                description: Error response for status 400
                oneOf:
                  - type: object
                    additionalProperties: false
                    description: Wrapped error response with per-record errors
