    patch:
      summary: Profile
      description: >-
        Partially updates the name, description, and permission enablement for
        the profile identified by `{id}`. System profiles (Administrator,
        Standard) cannot be updated. See [Update Profile
        Permission](https://www.zoho.com/crm/developer/docs/api/v8/update-profile-permission.html).
      operationId: patchProfile
      x-zs-llm-description: >-
        Partially updates a profile (name, description, and/or
        permissions_details) by id. Send only the fields to change;
        permissions_details entries require id.
      security:
        - OAuth2:
            - ZohoCRM.settings.profiles.UPDATE
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        description: >-
          Payload containing the profile fields and permission enablement
          entries to update.
        content:
          application/json:
            x-zs-llm-examples:
              - UpdatePermissions
            examples:
              UpdatePermissions:
                summary: Update permission enablement for a profile
                value:
                  profiles:
                    - name: Updated Profile Name
                      description: Updated description for the profile.
                      permissions_details:
                        - id: '1408246000000063001'
                          enabled: false
                        - id: '1408246000000057001'
                          enabled: true
                description: >-
                  A sample request body enabling or disabling specific
                  permissions for the target profile.
            schema:
              type: object
              description: Request body for the partial profile update operation.
              additionalProperties: false
              properties:
                profiles:
                  type: array
                  description: >-
                    Specify a single-item JSON array containing the profile
                    update payload.
                  maxItems: 1
                  items:
                    type: object
                    description: Partial update payload for the profile.
                    additionalProperties: false
                    properties:
                      name:
                        type:
                          - string
                          - 'null'
                        description: >-
                          Specify the new name for the profile (up to 50
                          characters).
                        maxLength: 50
                      description:
                        type:
                          - string
                          - 'null'
                        description: Specify the new text description for the profile.
                        maxLength: 250
                      permissions_details:
                        type: array
                        description: >-
                          List of permission toggle entries to apply (up to
                          2000).
                        maxItems: 2000
                        items:
                          type: object
                          description: >-
                            A single permission toggle entry specifying the
                            permission ID and its desired enabled state.
                          additionalProperties: false
                          properties:
                            id:
                              description: The unique identifier of the permission.
                              x-zs-$ref:
                                resource: profiles
                                origins:
                                  - operationId: getProfiles
                                    propertyId: ProfilePermissionDetailsId
                              type: string
                              format: int64
                              pattern: ^[0-9]{1,19}$
                              minLength: 1
                              maxLength: 19
                              example: '4832675000000850800'
                            enabled:
                              type: boolean
                              description: |-
                                Desired enabled state for the permission.
                                **Possible values:**
                                `true` to enable, `false` to disable.
                          required:
                            - id
                            - enabled
                    minProperties: 1
              required:
                - profiles
        required: true
      responses:
        '200':
          description: Profile updated successfully.
          content:
            application/json:
              examples:
                Updated:
                  summary: Update result
                  value:
                    profiles:
                      - code: SUCCESS
                        details:
                          id: '4670092000001127685'
                        message: profile updated successfully
                        status: success
                  description: >-
                    A sample response confirming that the profile was partially
                    updated successfully.
              schema:
                type: object
                description: Successful response for the partial profile update operation.
                x-zs-$id: PatchProfileResponse
                additionalProperties: false
                properties:
                  profiles:
                    type: array
                    description: Update results for the profile (up to 50 entries).
                    maxItems: 50
                    items:
                      type: object
                      description: Result for the partial profile update operation.
                      additionalProperties: false
                      properties:
                        code:
                          type: string
                          description: 'Operation result code. Possible values: `SUCCESS`.'
                          enum:
                            - SUCCESS
                        details:
                          type: object
                          description: >-
                            Details object containing the ID of the updated
                            profile.
                          additionalProperties: false
                          properties:
                            id:
                              type: string
                              description: Unique identifier of the updated profile.
                              format: int64
                          required:
                            - id
                        status:
                          type: string
                          description: |-
                            Status of the operation. 
                            **Possible values:**
                            **success**.
                          enum:
                            - success
                        message:
                          type: string
                          description: Human-readable message confirming the update result.
                          maxLength: 500
                      required:
                        - code
                        - details
                        - message
                        - status
                required:
                  - profiles
        '400':
          description: Invalid update request.
          content:
            application/json:
              schema:
                x-zs-$id: PatchProfileBadRequest
                oneOf:
                  - x-zs-$id: PatchProfileBadRequestDuplicateData
