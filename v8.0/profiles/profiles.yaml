components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      description: >-
        Represents the unique identifier of the profile (64-bit integer
        represented as a string, 1-19 digits).
      schema:
        $ref: '#/components/schemas/Id'
    Type:
      name: type
      in: query
      required: false
      description: >-
        Filters the returned profiles by profile type. Use `private_profile` to
        retrieve profiles used exclusively with team modules - private profiles
        are not allowed for normal custom modules, and non-private profiles are
        not allowed for team modules. 

        **Possible values:**

        **`private_profile`**, **`normal_profile`**, **`portal_profile`**.
      schema:
        type: string
        enum:
          - private_profile
          - normal_profile
          - portal_profile
    IncludeTypes:
      name: include_types
      in: query
      required: false
      description: >-
        Comma-separated list of additional profile types to include alongside
        the default Administrator, Standard, and custom profiles. Accepted
        pattern: `(Lite|Support)(,(Lite|Support))*`.
      schema:
        type: string
        pattern: ^(Lite|Support)(,(Lite|Support))*$
        maxLength: 50
        description: >-
          Allowed values (case-sensitive): Lite, Support. Use commas to include
          multiple.
      examples:
        LiteOnly:
          summary: Include lite profiles
          value: Lite
        SupportOnly:
          summary: Include support profiles
          value: Support
        LiteAndSupport:
          summary: Include both lite and support profiles
          value: Lite,Support
    Filters:
      name: filters
      in: query
      required: false
      description: >-
        JSON-encoded filter criteria to narrow the profiles returned. Accepts a
        `Filters` object with `group` conditions and a `group_operator`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Filters'
          examples:
            ProfileNameEqualsAdministrator:
              summary: Filter by profile name equals Administrator
              value:
                group_operator: or
                group:
                  - field:
                      api_name: name
                      field_label: Profile Name
                      data_type: text
                    comparator: equal
                    value: Administrator
                    type: value
                  - field:
                      api_name: name
                      field_label: Profile Name
                      data_type: text
                    comparator: equal
                    value: Administrator
                    type: value
    Page:
      name: page
      in: query
      required: false
      description: Page number for paginated results. Defaults to 1.
      schema:
        type: integer
        minimum: 1
        default: 1
        description: Page number to retrieve.
        format: int32
    PerPage:
      name: per_page
      in: query
      required: false
      description: >-
        Maximum number of profiles to return per page. Minimum 1, maximum 200.
        Defaults to 200.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 200
        description: Number of records per page.
        format: int32
  schemas:
    Id:
      type: string
      format: int64
      pattern: ^[0-9]{1,19}$
      minLength: 1
      maxLength: 19
      description: >-
        Unique record identifier - a 64-bit integer encoded as a string of 1 to
        19 decimal digits.
      example: '4832675000000850800'
    ProfileName:
      type: string
      pattern: ^[^~`#%^&*()+|,={};\[\]"]+$
      minLength: 1
      maxLength: 50
      description: >-
        Display name for the profile, up to 50 characters, excluding the special
        characters `~`, `` ` ``, `#`, `%`, `^`, `&`, `*`, `(`, `)`, `+`, `|`,
        `,`, `=`, `{`, `}`, `;`, `[`, `]`, `"`.
      example: Administrator
    ApiName:
      type: string
      pattern: ^[A-Za-z][A-Za-z0-9_]*$
      minLength: 1
      maxLength: 50
      description: >-
        API name of the profile, composed of alphanumeric characters and
        underscores and starting with a letter.
      example: Team_User
    TypeNull:
      type: 'null'
      x-zs-$id: TypeNull
      description: Represents a null value for optional fields.
    UserReference:
      type: object
      x-zs-$id: UserReference
      description: Reference to the CRM user who performed an action on a profile.
      additionalProperties: false
      properties:
        name:
          type: string
          description: Display name of the user as shown in Zoho CRM.
          minLength: 1
          maxLength: 100
          example: John Doe
        id:
          $ref: '#/components/schemas/Id'
      required:
        - name
        - id
    CreatedBy:
      oneOf:
        - description: User who created the profile.
          allOf:
            - $ref: '#/components/schemas/UserReference'
          unevaluatedProperties: false
          x-zs-$id: CreatedByValue
        - allOf:
            - $ref: '#/components/schemas/TypeNull'
          unevaluatedProperties: false
          x-zs-$id: CreatedByNull
          description: Null when creator information is not available.
      description: >-
        Creator of the profile - a
        [UserReference](users.yaml#$.paths./users.get) object, or null when
        creator information is not available.
    ModifiedBy:
      oneOf:
        - description: User who last modified the profile.
          allOf:
            - $ref: '#/components/schemas/UserReference'
          unevaluatedProperties: false
          x-zs-$id: ModifiedByValue
        - allOf:
            - $ref: '#/components/schemas/TypeNull'
          unevaluatedProperties: false
          x-zs-$id: ModifiedByNull
