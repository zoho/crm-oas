    delete:
      summary: Profile
      description: >-
        Transfers all users of the profile identified by `{id}` to the profile
        specified by the `transfer_to` query parameter, then permanently deletes
        the source profile. System profiles (Administrator, Standard) cannot be
        deleted. See [Transfer Users and Delete a
        Profile](https://www.zoho.com/crm/developer/docs/api/v8/transfer-delete-profile.html).
      operationId: deleteProfile
      x-zs-llm-description: >-
        Deletes a profile by id. If users are still assigned, use
        transferAndDeleteProfiles instead to move them first.
      security:
        - OAuth2:
            - ZohoCRM.settings.profiles.DELETE
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: transfer_to
          in: query
          required: true
          description: >-
            Specify the unique identifier of the profile to which users of the
            deleted profile will be transferred.
          schema:
            $ref: '#/components/schemas/Id'
      responses:
        '200':
          description: Profile deleted and users transferred successfully.
          content:
            application/json:
              examples:
                Deleted:
                  summary: Delete result
                  value:
                    code: SUCCESS
                    details:
                      id: '1697753000032967150'
                    message: Profile deleted
                    status: success
                  description: >-
                    A sample response confirming that the profile was deleted
                    and its users were transferred.
              schema:
                type: object
                x-zs-$id: DeleteProfileResponse
                description: Successful response for the profile delete operation.
                additionalProperties: false
                properties:
                  status:
                    type: string
                    description: >-
                      Status of the operation result. Possible values:
                      `success`.
                    enum:
                      - success
                  code:
                    type: string
                    description: |-
                      The status code of the result. 
                      **Possible values:** 
                      **SUCCESS**
                    enum:
                      - SUCCESS
                  message:
                    type: string
                    description: Human-readable message confirming the delete result.
                    maxLength: 500
                  details:
                    type: object
                    description: >-
                      Additional details returned with the delete operation
                      result.
                    additionalProperties: false
                    properties:
                      id:
                        $ref: '#/components/schemas/Id'
                        description: Deleted profile ID.
                    required:
                      - id
                required:
                  - code
                  - details
                  - message
                  - status
        '400':
          description: Invalid delete request.
          content:
            application/json:
              schema:
                x-zs-$id: DeleteProfileBadRequest
                oneOf:
                  - x-zs-$id: DeleteProfileBadRequestTransferToNotFound
                    description: >-
                      The `transfer_to` query parameter is required but was not
                      provided.
                    allOf:
                      - $ref: '#/components/schemas/TransferToIdNotFoundError'
                    unevaluatedProperties: false
                  - x-zs-$id: DeleteProfileBadRequestInvalidTransferTo
                    description: >-
                      The `transfer_to` value is invalid or refers to a deleted
                      profile.
                    allOf:
                      - $ref: '#/components/schemas/InvalidTransferToIdError'
                    unevaluatedProperties: false
                  - x-zs-$id: DeleteProfileBadRequestInvalidDeleteRequest
                    description: >-
                      Deletion of this profile is not permitted due to business
                      rules.
                    allOf:
                      - $ref: '#/components/schemas/InvalidDeleteRequestError'
                    unevaluatedProperties: false
                  - x-zs-$id: DeleteProfileBadRequestInvalidRequestMethod
                    description: The HTTP method used is not supported for this endpoint.
                    allOf:
                      - $ref: '#/components/schemas/InvalidRequestMethodError'
                    unevaluatedProperties: false
                  - x-zs-$id: DeleteProfileBadRequestInvalidId
                    description: >-
                      The profile ID in the request path is invalid or refers to
                      a deleted profile.
                    allOf:
                      - $ref: >-
                          #/components/schemas/DeleteProfileInvalidIdErrorResponse
                    unevaluatedProperties: false
                  - x-zs-$id: DeleteProfileBadRequestInvalidAction
                    description: The action given is invalid.
                    allOf:
                      - $ref: >-
                          #/components/schemas/DeleteProfileInvalidActionErrorResponse
                    unevaluatedProperties: false
                  - x-zs-$id: DeleteProfileBadRequestSystemProfileNotAllowed
                    description: >-
                      The target profile is a system profile and cannot be
                      deleted.
                    allOf:
                      - $ref: >-
                          #/components/schemas/DeleteProfileSystemProfileNotAllowedErrorResponse
                    unevaluatedProperties: false
                description: >-
                  Error response body for invalid DELETE /settings/profiles/{id}
                  requests.
              examples:
                TransferToIdNotFound:
                  summary: Missing transfer_to parameter
                  value:
                    code: MANDATORY_NOT_FOUND
                    details:
                      param: transfer_to
                    message: >-
                      Users in the profile need to be transferred. transfer_to
                      param is mandatory.
                    status: error
                  description: >-
                    Returned when the required `transfer_to` query parameter is
                    absent from the delete request.
                InvalidTransferToId:
                  summary: Invalid transfer_to profile ID
                  value:
                    code: INVALID_DATA
                    details:
                      id: '169775300002369603'
                    message: the id given seems to be invalid or already deleted
                    status: error
                  description: >-
                    Returned when the `transfer_to` query parameter value does
                    not correspond to a valid active profile.
                InvalidDeleteRequest:
                  summary: Profile deletion failed
                  value:
                    code: CANNOT_DELETE
                    details: {}
                    message: Profile cannot be deleted
                    status: error
                  description: >-
                    Returned when the delete request violates a business rule
                    that prevents profile deletion.
                InvalidRequestMethod:
                  summary: Invalid HTTP method used
                  value:
                    code: INVALID_REQUEST_METHOD
                    details: {}
                    message: The http request method type is not a valid one
                    status: error
                  description: >-
                    Returned when the request uses an HTTP method other than
                    DELETE for this endpoint.
                InvalidId:
                  summary: Invalid profile ID
                  value:
                    code: INVALID_DATA
                    details:
                      resource_path_index: 2
                    message: the id given seems to be invalid or already deleted
                    status: error
                  description: >-
                    Returned when the profile ID in the request path does not
                    match any existing active profile.
                InvalidAction:
                  summary: Invalid action
                  value:
                    code: INVALID_DATA
                    details: {}
                    message: The action given is invalid
                    status: error
                  description: >-
                    Returned when the action given in the request is not a valid
                    delete operation.
                SystemProfileNotAllowed:
                  summary: System profile cannot be deleted
                  value:
                    code: NOT_ALLOWED
                    details:
                      resource_path_index: 2
                    message: System profile cannot be deleted
                    status: error
                  description: >-
                    Returned when the target profile is a built-in system
                    profile that is protected from deletion.
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'
