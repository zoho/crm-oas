                      - $ref: >-
                          #/components/schemas/UpdateProfileInvalidActionErrorResponse
                    unevaluatedProperties: false
                  - x-zs-$id: PatchProfileBadRequestInvalidPermissionId
                    description: A permission ID in `permissions_details` is invalid.
                    allOf:
                      - $ref: >-
                          #/components/schemas/UpdateProfileInvalidPermissionIdErrorResponse
                    unevaluatedProperties: false
                  - x-zs-$id: PatchProfileBadRequestPermissionNotCustomizable
                    description: A permission in `permissions_details` is not customizable.
                    allOf:
                      - $ref: >-
                          #/components/schemas/UpdateProfilePermissionNotCustomizableErrorResponse
                    unevaluatedProperties: false
                  - x-zs-$id: PatchProfileBadRequestInvalidPermissionsDetailsDatatype
                    description: >-
                      `permissions_details` has an unexpected data type
