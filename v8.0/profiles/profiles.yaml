                    description: The profile name contains disallowed special characters.
                    allOf:
                      - $ref: >-
                          #/components/schemas/UpdateProfileInvalidProfileNameSpecialCharsErrorResponse
                    unevaluatedProperties: false
                  - x-zs-$id: PatchProfileBadRequestInvalidAction
                    description: The action given in the request is invalid.
