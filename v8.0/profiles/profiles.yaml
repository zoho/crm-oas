openapi: 3.1.0
info:
  title: Profiles API
  description: >-
    The Profiles API manages profiles in your Zoho CRM organization. A profile
    defines the level of access a user has to modules, records, and settings.
    Each user in the organization is assigned exactly one profile. The API
    supports retrieving all profiles or a single profile by ID, creating a
    profile by cloning an existing one, updating a profile's name and permission
    enablement, and deleting a profile after transferring its users to another
    profile. System profiles (Administrator, Standard) cannot be updated or
    deleted.
  version: '8'
servers:
  - url: https://zohoapis.{dc}/crm/{version}
    description: Zoho CRM REST API server base URL.
    variables:
      dc:
        enum:
          - com
          - eu
          - in
          - cn
          - au
        default: com
        description: >-
          Top-level domain for the data center that hosts your organization.
          Possible values: `com`, `eu`, `in`, `cn`, `au`.
      version:
        default: v8
        description: API version used in the request URL.
paths:
  /settings/profiles:
    get:
      summary: Profiles
      description: >-
        Retrieves the paginated list of all profiles in the organization,
        including each profile's name, type, permission details, and section
        groupings. Use the `type` query parameter to filter by profile type, and
        `include_types` to include Lite or Support profiles alongside the
        default set. See [Get
        Profiles](https://www.zoho.com/crm/developer/docs/api/v8/get-profiles.html).


        **Scopes:**

        * ZohoCRM.settings.profiles.ALL

        * ZohoCRM.settings.profiles.READ
      operationId: getProfiles
      x-zs-llm-description: >-
        Lists all CRM profiles with their id and api_name. Call this first to
        discover profile ids before assigning permissions or
        transferring/deleting a profile.
      parameters:
        - $ref: '#/components/parameters/Type'
        - $ref: '#/components/parameters/IncludeTypes'
        - $ref: '#/components/parameters/Filters'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Profiles retrieved successfully.
          content:
            application/json:
              examples:
                Sample:
                  summary: Profiles list
                  value:
                    profiles:
                      - display_label: Administrator
                        created_time: null
                        modified_time: '2025-09-26T18:53:34+05:30'
                        api_name: Administrator
                        custom: false
                        name: Administrator
                        modified_by:
                          name: Mohan Sai Mohan Sai
                          id: '1697753000000424001'
                        description: >-
                          This profile will have all the permissions. Users with
                          Administrator profile will be able to view and manage
                          all the data within the organization account by
                          default.
                        id: '1697753000000015972'
                        type: normal_profile
                        created_by: null
                      - display_label: Standard
                        created_time: null
                        modified_time: '2025-05-28T15:10:51+05:30'
                        api_name: Standard
                        custom: false
                        name: Standard
                        modified_by:
                          name: Mohan Sai Mohan Sai
                          id: '1697753000000424001'
                        description: >-
                          This profile will have all the permissions except
                          administrative privileges.
                        id: '1697753000000015975'
                        type: normal_profile
                        created_by: null
                      - display_label: Team User
                        created_time: null
                        modified_time: '2025-07-24T18:42:58+05:30'
                        api_name: Team_User
                        custom: false
                        name: Team User
                        modified_by:
                          name: Mohan Sai Mohan Sai
                          id: '1697753000000424001'
                        description: >-
                          This profile will be auto-assigned only for Team users
                          who can access  Team modules and have limited
                          permissions for Organisation modules.
                        id: '1697753000010415055'
                        type: lite_profile
                        created_by: null
                      - display_label: 34r8ynjke
                        created_time: '2025-01-28T14:03:56+05:30'
                        modified_time: '2025-11-20T19:03:43+05:30'
                        api_name: r8ynjk
                        custom: true
                        name: 34r8ynjke
                        modified_by:
                          name: Mohan Sai Mohan Sai
                          id: '1697753000000424001'
                        description: null
                        id: '1697753000021778019'
                        type: normal_profile
                        created_by:
                          name: Mohan Sai Mohan Sai
                          id: '1697753000000424001'
                    info:
                      page: 1
                      per_page: 200
                      count: 4
                      more_records: false
                      license_limit: 200
                  description: >-
                    A sample response containing a paginated list of CRM
                    profiles with their permission details.
              schema:
                type: object
                description: >-
                  Successful response containing the list of CRM profiles and
                  pagination info.
                x-zs-$id: ProfilesCollectionResponse
                additionalProperties: false
                properties:
                  profiles:
                    type: array
                    description: >-
                      List of profiles returned for this page (up to 200
                      entries).
                    maxItems: 200
                    items:
                      type: object
                      description: >-
                        Details of a single profile, including its permissions
                        and section groupings.
                      additionalProperties: false
                      properties:
                        api_name:
                          x-zs-$id: ProfileApiName
                          $ref: '#/components/schemas/ApiName'
                        id:
                          x-zs-$id: ProfileId
                          $ref: '#/components/schemas/Id'
                          description: Unique profile identifier.
                        created_time:
                          $ref: '#/components/schemas/CreatedTime'
                        modified_time:
                          $ref: '#/components/schemas/ModifiedTime'
                        name:
                          $ref: '#/components/schemas/ProfileName'
                        display_label:
                          type: string
                          description: Display label shown for the profile in the CRM UI.
                          maxLength: 255
                        modified_by:
                          $ref: '#/components/schemas/ModifiedBy'
                        description:
                          type:
                            - string
                            - 'null'
                          description: Optional description of the profile.
                          maxLength: 255
                        created_by:
                          $ref: '#/components/schemas/CreatedBy'
                        custom:
                          type: boolean
                          description: >-
                            Indicates whether the profile is a custom profile
                            (`true`) or a system profile (`false`).
                        type:
                          type: string
                          description: >-
                            Profile type classification. Possible values:
                            `private_profile`, `normal_profile`, `lite_profile`,
                            `system_profile`, `portal_profile`.
                            `private_profile` is used exclusively for team
                            modules; non-private profiles are not allowed for
                            team modules.
                          enum:
                            - private_profile
                            - normal_profile
                            - lite_profile
                            - system_profile
                            - portal_profile
                        permissions_details:
                          type: array
                          description: >-
                            Flat list of all individual permissions configured
                            for this profile (up to 2000 entries).
                          maxItems: 2000
                          items:
                            type: object
                            description: >-
                              A single permission entry describing a specific
                              access right in the profile.
                            additionalProperties: false
                            properties:
                              display_label:
                                type: string
                                description: >-
                                  Human-readable label displayed for this
                                  permission in the CRM UI.
                                maxLength: 255
                              module:
                                description: >-
                                  Module associated with this permission. Null
                                  when the permission is not tied to a specific
                                  module.
                                type:
                                  - string
                                  - 'null'
                                maxLength: 100
                              name:
                                type: string
                                description: Internal API name of the permission.
                                maxLength: 255
                              customizable:
                                type: boolean
                                description: >-
                                  Indicates whether this permission can be
                                  toggled on or off by an administrator.
                              id:
                                x-zs-$id: ProfilePermissionDetailsId
                                $ref: '#/components/schemas/Id'
                                description: The unique identifier of the permission.
                              enabled:
                                type: boolean
                                description: >-
                                  Indicates whether this permission is currently
                                  enabled for the profile.
                              tooltip_msg:
                                type: string
                                description: >-
                                  Tooltip text displayed when hovering over this
                                  permission in the CRM UI.
                                maxLength: 500
                              api_name:
                                type: string
                                description: API name of the permission.
                                maxLength: 255
                              active:
                                type: boolean
                                description: Whether the permission is active.
                              description:
                                type:
                                  - string
                                  - 'null'
                                description: Description of the permission.
                                maxLength: 500
                              custom_permission:
                                type: boolean
                                description: Whether this is a custom permission.
                              parent_permissions:
                                description: >-
                                  List of parent permission names that must be
                                  enabled before this permission can be enabled,
                                  or null when there are no parent dependencies.
                                oneOf:
                                  - x-zs-$id: >-
                                      ListProfilePermissionParentPermissionsArray
                                    type: array
                                    description: >-
                                      Array of parent permission identifiers
                                      this permission depends on.
                                    items:
                                      $ref: '#/components/schemas/Id'
                                    maxItems: 200
                                  - x-zs-$id: ListProfilePermissionParentPermissionsNull
                                    description: >-
                                      Null when this permission has no parent
                                      dependencies.
                                    allOf:
                                      - $ref: '#/components/schemas/TypeNull'
                                    unevaluatedProperties: false
                        $has_more:
                          type: boolean
                          description: >-
                            Indicates whether the profile has more permission
                            records beyond the included set.
                        sections:
                          type: array
                          description: >-
                            Grouped sections that organize permissions into
                            categories for display in the CRM UI (up to 100
                            sections).
                          maxItems: 100
                          items:
                            type: object
                            description: A section grouping related permission categories.
                            additionalProperties: false
                            properties:
                              name:
                                type: string
                                description: Internal name of the permission section.
                                maxLength: 255
                              categories:
                                type: array
                                description: >-
                                  List of permission categories within this
                                  section (up to 100 categories).
                                maxItems: 100
                                items:
                                  type: object
                                  description: >-
                                    A single permission category containing
                                    related permissions.
                                  additionalProperties: false
                                  properties:
                                    display_label:
                                      type: string
                                      description: >-
                                        Display label shown for this category in
                                        the CRM UI.
                                      maxLength: 255
                                    permissions_details:
                                      type: array
                                      description: >-
                                        Permission identifiers grouped under
                                        this category.
                                      minItems: 0
                                      maxItems: 500
                                      items:
                                        type: string
                                        description: >-
                                          A single permission identifier string
                                          associated with this category.
                                        maxLength: 255
                                    name:
                                      type: string
                                      description: >-
                                        Internal name of the permission
                                        category.
                                      maxLength: 255
                                    module:
                                      description: >-
                                        Module associated with this category or
                                        null when the category is not
                                        module-specific.
                                      type:
                                        - string
                                        - 'null'
                                      maxLength: 100
                                  required:
                                    - display_label
                                    - permissions_details
                                    - name
                            required:
                              - name
                              - categories
                      required:
                        - api_name
                        - id
                        - created_time
                        - modified_time
                        - name
                        - display_label
                        - custom
                        - type
                  info:
                    oneOf:
                      - type: object
                        x-zs-$id: ProfilesPaginationInfo
                        description: >-
                          Pagination metadata including count, page, per_page,
                          and whether more records exist.
                        additionalProperties: false
                        properties:
                          per_page:
                            type: integer
                            format: int32
                            description: Number of profiles returned per page.
                          page:
                            type: integer
                            format: int32
                            description: Current page number in the paginated result set.
                          count:
                            type: integer
                            format: int32
                            description: Number of profiles returned in this response page.
                          more_records:
                            type: boolean
                            description: >-
                              Indicates whether additional profiles exist beyond
                              the current page.
                          license_limit:
                            type: integer
                            format: int32
                            description: >-
                              Maximum number of profiles allowed by the
                              organization's license.
                        required:
                          - per_page
                          - page
                          - count
                          - more_records
                      - type: object
                        x-zs-$id: ProfilesLicenseLimitSummary
                        description: >-
                          License usage summary when full pagination data is not
                          available.
                        additionalProperties: false
                        properties:
                          license_limit:
                            type: integer
                            format: int32
                            description: >-
                              Maximum number of profiles allowed by the
                              organization's license.
                        required:
                          - license_limit
                    description: >-
                      Pagination and license usage information for the profiles
                      list response.
                required:
                  - profiles
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                x-zs-$id: GetProfilesBadRequest
                oneOf:
                  - allOf:
                      - $ref: '#/components/schemas/InvalidRequestMethodError'
                    unevaluatedProperties: false
                    x-zs-$id: GetProfilesInvalidRequestMethod
                    description: HTTP request method is not supported for this endpoint.
                  - allOf:
                      - $ref: '#/components/schemas/InvalidQueryParamError'
                    unevaluatedProperties: false
                    x-zs-$id: GetProfilesInvalidQueryParam
                    description: A query parameter value is invalid.
                description: >-
                  Error response body for invalid GET /settings/profiles
                  requests.
              examples:
                InvalidRequestMethod:
                  summary: Invalid HTTP method used
                  value:
                    code: INVALID_REQUEST_METHOD
                    details: {}
                    message: The http request method type is not a valid one
                    status: error
                  description: >-
                    Returned when the request uses an HTTP method other than GET
                    for this endpoint.
                InvalidTypeParam:
                  summary: Invalid value for `type` query parameter
                  value:
                    code: INVALID_DATA
                    details:
                      param_name: type
                    message: invalid data
                    status: error
                  description: >-
                    Returned when the `type` query parameter contains a value
                    not in the allowed list.
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'
      security:
        - OAuth2:
            - ZohoCRM.settings.profiles.READ
  /settings/profiles/{id}/actions/clone:
    post:
      summary: Clone a CRM profile
      description: >-
        Creates a new profile by cloning the existing profile identified by
        `{id}`. The request body must include the new profile's `name`, which
        must be unique within the organization and must not exceed 50
        characters. See [Create a
        Profile](https://www.zoho.com/crm/developer/docs/api/v8/create-profile.html).
      operationId: cloneProfile
      x-zs-llm-description: >-
        Creates a new profile by cloning the source profile in the path id.
        Before calling: GET /settings/profiles for the source id. Provide the
        new profile name in the body.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        description: Profile definition for the new cloned profile.
        content:
          application/json:
            x-zs-llm-examples:
              - Sample
            examples:
              Sample:
                summary: Clone profile payload
                value:
                  profiles:
                    - name: Cloned Standard
                      description: Cloned from Standard profile
                description: >-
                  A sample request body supplying the name for a new profile to
                  be created by cloning the source profile.
            schema:
              type: object
              description: Request body for cloning a profile.
              additionalProperties: false
              properties:
                profiles:
                  type: array
                  description: >-
                    Single-item JSON array containing the new profile definition
                    for the clone operation.
                  maxItems: 1
                  items:
                    type: object
                    description: New profile to create from the cloned source.
                    additionalProperties: false
                    properties:
                      name:
                        type: string
                        description: >-
                          The name of the new profile. Accepts up to 50
                          characters.
                        maxLength: 50
                      description:
                        type:
                          - string
                          - 'null'
                        description: >-
                          A description of the profile. Accepts up to 250
                          characters.
                        maxLength: 250
                    required:
                      - name
              required:
                - profiles
        required: true
      responses:
        '201':
          description: Profile cloned successfully.
          content:
            application/json:
              examples:
                Created:
                  summary: Clone result
                  value:
                    profiles:
                      - code: SUCCESS
                        details:
                          id: '1697753000033202019'
                        message: profile created successfully
                        status: success
                  description: >-
                    A sample response confirming that the profile was cloned
                    successfully.
              schema:
                $ref: '#/components/schemas/CloneProfileResponse'
        '400':
          description: Invalid clone request.
          content:
            application/json:
              schema:
                x-zs-$id: CloneProfileBadRequest
                oneOf:
                  - x-zs-$id: CloneProfileBadRequestInvalidId
                    description: >-
                      The profile ID in the request path is invalid or refers to
                      a deleted profile.
                    allOf:
                      - $ref: >-
                          #/components/schemas/CloneProfileInvalidIdErrorResponse
                    unevaluatedProperties: false
                  - x-zs-$id: CloneProfileBadRequestInvalidCreateRequest
                    description: >-
                      The request body is missing a mandatory field (for
                      example, `name`).
                    allOf:
                      - $ref: >-
                          #/components/schemas/CloneProfileInvalidCreateRequestErrorResponse
                    unevaluatedProperties: false
                  - x-zs-$id: CloneProfileBadRequestDuplicateProfileName
                    description: >-
                      The requested profile name already belongs to an existing
                      profile.
                    allOf:
                      - $ref: >-
                          #/components/schemas/CloneProfileDuplicateProfileNameErrorResponse
                    unevaluatedProperties: false
                  - x-zs-$id: CloneProfileBadRequestLicenseLimitExceeded
                    description: >-
                      Cloning would exceed the organization's allowed profile
                      count.
                    allOf:
                      - $ref: >-
                          #/components/schemas/CloneProfileLicenseLimitExceededErrorResponse
                    unevaluatedProperties: false
                  - x-zs-$id: CloneProfileBadRequestInvalidProfileNameSpecialChars
                    description: >-
                      The new profile name contains disallowed special
                      characters.
                    allOf:
                      - $ref: >-
                          #/components/schemas/CloneProfileInvalidProfileNameSpecialCharsErrorResponse
                    unevaluatedProperties: false
                  - x-zs-$id: CloneProfileBadRequestCannotBeCloned
                    description: The source profile cannot be cloned due to business rules.
                    allOf:
                      - $ref: >-
                          #/components/schemas/CloneProfileCannotBeClonedErrorResponse
                    unevaluatedProperties: false
                description: >-
                  Error response body for invalid POST
                  /settings/profiles/{id}/actions/clone requests.
              examples:
                InvalidCreateRequest:
                  summary: Validation failed
                  value:
                    profiles:
                      - code: MANDATORY_NOT_FOUND
                        details:
                          api_name: name
                          json_path: $.profiles[0].name
                        message: required field not found
                        status: error
                  description: >-
                    Returned when the request body is missing a required field
                    such as `name`.
                DuplicateProfileName:
                  summary: Duplicate profile name
                  value:
                    profiles:
                      - code: DUPLICATE_DATA
                        details:
                          api_name: name
                          json_path: $.profiles[0].name
                        message: duplicate data
                        status: error
                  description: >-
                    Returned when the requested name for the cloned profile is
                    already used by another profile.
                LimitExceeded:
                  summary: License limit exceeded
                  value:
                    profiles:
                      - code: LICENSE_LIMIT_EXCEEDED
                        details:
                          limit: 2
                        message: Request exceeds your license limit.
                        status: error
                  description: >-
                    Returned when creating the cloned profile would exceed the
                    organization's maximum allowed profile count.
                InvalidProfileNameSpecialChars:
                  summary: Invalid profile name
                  value:
                    profiles:
                      - code: INVALID_DATA
                        details:
                          api_name: name
                          json_path: $.profiles[0].name
                        message: >-
                          Profile name should not contain the following special
                          character(s) : #, %, &, (, ), *, ^
                        status: error
                  description: >-
                    Returned when the new profile name includes special
                    characters that are not permitted.
                CannotBeCloned:
                  summary: Profile cannot be cloned
                  value:
                    profiles:
                      - code: INVALID_DATA
                        details: {}
                        message: Profile cannot be Cloned
                        status: error
                  description: >-
                    Returned when the source profile has a restriction that
                    prevents it from being cloned.
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'
      security:
        - OAuth2:
            - ZohoCRM.settings.profiles.CREATE
  /settings/profiles/{id}:
    put:
      summary: Specific Profile
      description: >-
        Replaces the name, description, and permission enablement for the
        profile identified by `{id}`. System profiles (Administrator, Standard)
        cannot be updated. See [Update Profile
        Permission](https://www.zoho.com/crm/developer/docs/api/v8/update-profile-permission.html).
      operationId: updateProfile
      x-zs-llm-description: >-
        Replaces a profile's permission set by id. Before calling: GET
        /settings/profiles/{id} to read current permissions_details; each entry
        must carry id.
      security:
        - OAuth2:
            - ZohoCRM.settings.profiles.UPDATE
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        description: >-
          Payload containing profile fields and permission enablement entries to
          update.
        content:
          application/json:
            x-zs-llm-examples:
              - UpdatePermissions
            examples:
              UpdatePermissions:
                summary: Update permission enablement for a profile
                value:
                  profiles:
                    - name: Updated Profile Name
                      description: Updated description for the profile.
                      permissions_details:
                        - id: '1408246000000063001'
                          enabled: false
                        - id: '1408246000000057001'
                          enabled: true
                description: >-
                  A sample request body enabling or disabling specific
                  permissions for the target profile.
            schema:
              type: object
              description: Request body for the profile update operation.
              additionalProperties: false
              properties:
                profiles:
                  type: array
                  description: >-
                    Specify a single-item JSON array containing the profile
                    update payload.
                  maxItems: 1
                  items:
                    type: object
                    description: Specify the payload for updating the profile.
                    additionalProperties: false
                    properties:
                      name:
                        type:
                          - string
                          - 'null'
                        description: >-
                          Specify the new name for the profile (up to 50
                          characters).
                        maxLength: 50
                      description:
                        type:
                          - string
                          - 'null'
                        description: Specify the new text description for the profile.
                        maxLength: 250
                      permissions_details:
                        type: array
                        description: >-
                          List of permission toggle entries to apply (up to
                          2000).
                        maxItems: 2000
                        items:
                          type: object
                          description: >-
                            A single permission toggle entry specifying the
                            permission ID and its desired enabled state.
                          additionalProperties: false
                          properties:
                            id:
                              description: The unique identifier of the permission.
                              x-zs-$ref:
                                resource: profiles
                                origins:
                                  - operationId: getProfiles
                                    propertyId: ProfilePermissionDetailsId
                              type: string
                              format: int64
                              pattern: ^[0-9]{1,19}$
                              minLength: 1
                              maxLength: 19
                              example: '4832675000000850800'
                            enabled:
                              type: boolean
                              description: |-
                                Desired enabled state for the permission.
                                **Possible values:**
                                `true` to enable, `false` to disable.
                          required:
                            - id
                            - enabled
                    minProperties: 1
              required:
                - profiles
        required: true
      responses:
        '200':
          description: Profile updated successfully.
          content:
            application/json:
              examples:
                Updated:
                  summary: Update result
                  value:
                    profiles:
                      - code: SUCCESS
                        details:
                          id: '4670092000001127685'
                        message: profile updated successfully
                        status: success
                  description: >-
                    A sample response confirming that the profile was updated
                    successfully.
              schema:
                type: object
                description: Successful response for the profile update operation.
                x-zs-$id: UpdateProfileResponse
                additionalProperties: false
                properties:
                  profiles:
                    type: array
                    description: Update results for the profile (up to 50 entries).
                    maxItems: 50
                    items:
                      type: object
                      description: Result for the profile update operation.
                      additionalProperties: false
                      properties:
                        code:
                          type: string
                          description: 'Operation result code. Possible values: `SUCCESS`.'
                          enum:
                            - SUCCESS
                        details:
                          type: object
                          description: >-
                            Details object containing the ID of the updated
                            profile.
                          additionalProperties: false
                          properties:
                            id:
                              type: string
                              description: Unique identifier of the updated profile.
                              format: int64
                          required:
                            - id
                        status:
                          type: string
                          description: 'Operation result status. Possible values: `success`.'
                          enum:
                            - success
                        message:
                          type: string
                          description: Human-readable message confirming the update result.
                          maxLength: 500
                      required:
                        - code
                        - details
                        - message
                        - status
                required:
                  - profiles
        '400':
          description: Invalid update request.
          content:
            application/json:
              schema:
                x-zs-$id: UpdateProfileBadRequest
                oneOf:
                  - x-zs-$id: UpdateProfileBadRequestDuplicateData
                    description: >-
                      The profile name in the request is already in use by
                      another profile.
                    allOf:
                      - $ref: >-
                          #/components/schemas/UpdateProfileDuplicateDataErrorResponse
                    unevaluatedProperties: false
