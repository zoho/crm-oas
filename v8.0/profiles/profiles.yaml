  responses:
    UnauthorizedResponse:
      description: >-
        Unauthorized - authentication failed or the access token lacks the
        required OAuth scope.
      content:
        application/json:
          schema:
            x-zs-$id: UnauthorizedError
            oneOf:
              - allOf:
                  - $ref: '#/components/schemas/AuthenticationFailureError'
                unevaluatedProperties: false
                x-zs-$id: AuthenticationFailureWrapper
                description: Authentication failure error schema.
              - allOf:
                  - $ref: '#/components/schemas/OAuthScopeMismatchError'
                unevaluatedProperties: false
                x-zs-$id: OAuthScopeMismatchWrapper
                description: OAuth scope mismatch error schema.
            description: Unauthorized error response body.
          examples:
            AuthenticationFailure:
              summary: Authentication failure
              value:
                code: AUTHENTICATION_FAILURE
                details: {}
                message: Authentication failed
                status: error
              description: >-
                Returned when the OAuth token is missing, expired, or does not
                match the required scope.
    ForbiddenResponse:
      description: >-
        Forbidden - the authenticated user lacks the required permission to
        perform this operation.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/PermissionErrorResponse'
            unevaluatedProperties: false
            x-zs-$id: ForbiddenError
            description: Forbidden error response body.
          examples:
            NoPermission:
              summary: No permission to manage profiles
              value:
                code: NO_PERMISSION
                details:
                  permissions:
                    - Crm_Implied_Manage_Profiles
                message: permission denied
                status: error
              description: >-
                Returned when the user does not have the CRM profiles permission
                required for the requested operation.
    InternalServerErrorResponse:
      description: >-
        Internal server error - an unexpected error occurred while processing
        the request.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/InternalServerError'
            unevaluatedProperties: false
            x-zs-$id: InternalServerErrorWrapper
            description: Internal server error response body.
          examples:
            InternalError:
              summary: Unexpected server-side error
              value:
                code: INTERNAL_ERROR
                details: {}
                message: Problem occurred internally
                status: error
              description: >-
                Returned when the server encounters an unexpected error that
                prevents the request from completing.
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://accounts.zoho.com/oauth/v2/auth
          tokenUrl: https://accounts.zoho.com/oauth/v2/token
          refreshUrl: https://accounts.zoho.com/oauth/v2/token
          scopes:
            ZohoCRM.settings.profiles.ALL: Full access to profiles settings
            ZohoCRM.settings.profiles.READ: Read access to profiles
            ZohoCRM.settings.profiles.CREATE: Create access to profiles
            ZohoCRM.settings.profiles.UPDATE: Update access to profiles
            ZohoCRM.settings.profiles.DELETE: Delete access to profiles
