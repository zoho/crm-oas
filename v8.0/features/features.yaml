components:
  parameters:
    Module:
      description: >-
        Specify the API name of the CRM module to filter features that are
        specific to that module. Refer to the [Get
        Modules](modules.json#$.paths./settings/modules.get) resource for valid
        values.
      name: module
      in: query
      required: false
      schema:
        maxLength: 25
        type: string
    ApiNames:
      description: >-
        Specify the feature API names to filter the response. To retrieve
        details of more than one feature, provide the names in comma-separated
        format. Possible values: custom_field - Feature API name for the custom
        field feature.
        custom_field,encrypt_field,unique_field,private_fields,external_field,personal_health_fields
        - Feature API names for multiple features specified together.
        encrypt_field - Feature API name for the encrypt field feature.
        external_field - Feature API name for the external field feature.
        personal_health_fields - Feature API name for the personal health fields
        feature. private_fields - Feature API name for the private fields
        feature. unique_field - Feature API name for the unique field feature.
      name: api_names
      in: query
      required: false
      schema:
        type: string
        enum:
          - custom_field
          - >-
            custom_field,encrypt_field,unique_field,private_fields,external_field,personal_health_fields
          - personal_health_fields
          - encrypt_field
          - external_field
          - unique_field
          - private_fields
    Page:
      description: >-
        Specify the page number to retrieve features from the corresponding
        results page. Possible values: 1 - Retrieves features from page one. 2 -
        Retrieves features from page two.
      name: page
      in: query
      required: false
      schema:
        type: string
        enum:
          - '1'
          - '2'
    PerPage:
      description: >-
        Specify the number of features to return per page. Possible values: 10 -
        Returns ten features per page.
      name: per_page
      in: query
      required: false
      schema:
        type: string
        enum:
          - '10'
    Feature:
      description: >-
        Specify the API name of the feature for which you want to retrieve
        detailed information.
      name: feature
      in: path
      required: true
      schema:
        maxLength: 25
        type: string
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://accounts.zoho.com/oauth/v2/auth
          tokenUrl: https://accounts.zoho.com/oauth/v2/token
          refreshUrl: https://accounts.zoho.com/oauth/v2/token
          scopes:
            ZohoCRM.features.READ: READ feature access
