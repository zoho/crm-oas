                      - INVALID_DATA
                  message:
                    maxLength: 255
                    description: >-
                      Represents the error message describing the validation
                      failure. Always returned in the response.
                    type: string
                  details:
                    additionalProperties: false
                    description: >-
                      Represents additional details about the validation error.
                      Always returned in the response.
                    type: object
                required:
                  - status
                  - code
                  - message
                  - details
  /__features/user_licenses:
    get:
      operationId: getUserLicenseFeatureDetails
      summary: User Licenses Feature
      description: To get the user licenses feature details for the current edition
      x-zs-llm-description: >-
        Retrieves user license feature details including available count, used
        count, and limits for the current edition.
      security:
        - OAuth2:
            - ZohoCRM.features.READ
      responses:
        '200':
          description: Response of user licenses feature details for the current edition
          content:
            application/json:
              examples:
                SuccessResponse:
                  summary: Get User License Feature Details
                  value:
                    __features:
                      - components: null
                        api_name: user_licenses
                        parent_feature: null
                        module_supported: false
                        details:
                          available_count:
                            total: 3
                          used_count:
                            total: 7
                          limits:
                            total: 10
                        feature_label: UserLicenses
              x-zs-llm-examples:
                - SuccessResponse
              schema:
                x-zs-$id: UserLicenseFeatureDetailsResponse
                additionalProperties: true
                type: object
                description: User licenses feature details for the current edition
                properties:
                  __features:
                    description: User licenses feature details for the current edition
                    maxItems: 1
                    type: array
                    items:
                      additionalProperties: true
                      description: User licenses feature details
                      type: object
                      properties:
                        api_name:
                          maxLength: 255
                          description: API name of the feature
                          type: string
                        parent_feature:
                          description: Parent feature details
                          type:
                            - object
                            - 'null'
                        details:
                          description: This object will have limits and usage details
                          type:
                            - object
                            - 'null'
                          properties:
                            available_count:
                              description: Available count details for the feature
                              additionalProperties: false
                              type: object
                              properties:
                                total:
                                  description: Total available count
                                  type: integer
                                  format: int32
                              required:
                                - total
                            used_count:
                              description: used count of the feature
                              oneOf:
                                - description: used count of the feature
                                  additionalProperties: true
                                  x-zs-$id: UsedCountObject1
                                  type: object
                                  properties:
                                    total:
                                      description: total count
                                      type: integer
                                      format: int32
                                  required:
                                    - total
                                - description: used count of the feature
                                  type: integer
                                  format: int32
                                  x-zs-$id: UsedCountInteger1
                            limits:
                              description: Limit details for the feature
                              additionalProperties: false
                              type: object
                              properties:
                                total:
                                  description: Total limit
                                  type: integer
                                  format: int32
                              required:
                                - total
                          required:
                            - limits
                        components:
                          description: Components of the feature
                          type: 'null'
                        module_supported:
                          description: Module wise feature supported or not
                          type: boolean
                        feature_label:
                          maxLength: 255
                          description: Label of the feature
                          type: string
                      required:
                        - api_name
                        - parent_feature
                        - details
                        - components
                        - module_supported
                        - feature_label
                required:
