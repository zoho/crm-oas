    Info:
      type: object
      description: Pagination information for list responses
      properties:
        per_page:
          type: integer
          format: int32
          description: Represents the number of records per page
          minimum: 1
          maximum: 200
          examples:
            - 200
        next_page_token:
          type:
            - string
            - 'null'
          maxLength: 1024
          description: Represents the token to retrieve the next page of results
          examples:
            - null
            - eyJvZmZzZXQiOjIwMH0
        count:
          type: integer
          format: int32
          description: Represents the number of records returned in the current response
          minimum: 0
          examples:
            - 1
        page:
          type: integer
          format: int32
          description: Represents the current page number
          minimum: 1
          examples:
            - 1
        previous_page_token:
          type:
            - string
            - 'null'
          maxLength: 1024
          description: Represents the token to retrieve the previous page of results
          examples:
            - null
            - eyJvZmZzZXQiOjB9
        page_token_expiry:
          type:
            - string
            - 'null'
          format: date-time
          description: Represents the expiry timestamp for the page tokens
          examples:
            - null
            - '2025-12-19T14:30:00+05:30'
        more_records:
          type: boolean
          description: Indicates whether more records are available
          examples:
            - false
      required:
        - per_page
        - next_page_token
        - count
        - page
        - previous_page_token
        - page_token_expiry
        - more_records
      additionalProperties: false
    ErrorResponse:
      type: object
      x-zs-$id: ErrorResponse
      description: Generic error response structure
      properties:
        status:
          type: string
          description: Represents the error status.
          enum:
            - error
        code:
          type: string
          description: Represents the error code.
          enum:
            - INVALID_URL_PATTERN
            - MANDATORY_NOT_FOUND
            - INVALID_DATA
            - REQUIRED_PARAM_MISSING
            - INVALID_MODULE
            - INVALID_TOKEN
            - OAUTH_SCOPE_MISMATCH
            - RATE_LIMIT_EXCEEDED
            - INTERNAL_ERROR
            - SERVICE_UNAVAILABLE
        message:
          type: string
          description: Represents the error message.
          enum:
            - the given attachment URL is incorrect
            - required field not found
            - invalid data provided
            - One of the expected parameter is missing
            - the related id given seems to be invalid
            - the module name given seems to be invalid
            - invalid oauth token
            - required oauth scope is missing
            - the id given seems to be invalid
            - API rate limit exceeded. Please retry after some time
            - Internal Server Error
            - Service temporarily unavailable. Please try again later
        details:
          type: object
          description: Represents the additional error details.
          additionalProperties: false
          properties:
            param_name:
              type: string
              description: Represents the name of the parameter causing the error.
              maxLength: 100
            resource_path_index:
              type: integer
              format: int32
              description: Represents the index of the resource path causing the error
      required:
        - status
        - code
        - message
        - details
      additionalProperties: false
    AttachmentSuccessResponse:
      type: object
      x-zs-$id: AttachmentSuccessResponse
      description: Successful attachment operation response
      properties:
        data:
          type: array
          description: Array of upload results
          maxItems: 100
          items:
            type: object
            description: Upload status details
            additionalProperties: false
            properties:
              code:
                type: string
                description: Represents the response code
                enum:
                  - SUCCESS
              details:
                type: object
                description: Details of the uploaded attachment
                additionalProperties: false
                properties:
                  id:
                    type: string
                    description: Represents the attachment identifier
                    pattern: ^[0-9]+$
                    maxLength: 50
                  Modified_Time:
                    type: string
                    format: date-time
                    description: Represents the last modification timestamp
                  Created_Time:
                    type: string
                    format: date-time
                    description: Represents the creation timestamp
                  Modified_By:
                    type: object
                    description: Represents the user who last modified the attachment
                    additionalProperties: false
                    properties:
                      id:
                        type: string
                        description: Represents the user ID
                        pattern: ^[0-9]+$
                        maxLength: 50
                      name:
                        type: string
                        description: Represents the user display name
                        maxLength: 250
                    required:
                      - id
                      - name
                  Created_By:
                    type: object
                    description: Represents the user who created the attachment
                    additionalProperties: false
                    properties:
                      id:
                        type: string
                        description: >
                          User ID. Use the [Users
                          API](users.yaml#$.paths./users/bulk.get) to retrieve
                          user IDs.
                        pattern: ^[0-9]+$
                        maxLength: 50
                      name:
                        type: string
                        description: Represents the user display name
                        maxLength: 250
                    required:
                      - id
                      - name
                required:
                  - id
                  - Modified_Time
                  - Created_Time
                  - Modified_By
                  - Created_By
              message:
                type: string
                description: Represents the success message
                enum:
                  - attachment uploaded successfully
              status:
                type: string
                description: Represents the operation status
                enum:
                  - success
            required:
              - code
              - details
              - message
              - status
      required:
        - data
      additionalProperties: false
    BodySizeLimitError:
      type: object
      x-zs-$id: BodySizeLimitError
      description: Error response for body size limit exceeded
      properties:
        status:
          type: string
          description: Represents the error status.
          enum:
            - error
        code:
          type: string
          description: Represents the error code
          enum:
            - BODY_SIZE_REACHED
            - FILE_SIZE_MORE_THAN_ALLOWED_SIZE
        message:
          type: string
          description: Represents the error message
          enum:
            - The request body limit reached
            - Request body size exceeds the maximum limit of 100MB
            - Please check if the size of the file is in the correct range
        details:
          type: object
          description: Represents the additional error details
          additionalProperties: false
      required:
        - status
        - code
        - message
        - details
      additionalProperties: false
