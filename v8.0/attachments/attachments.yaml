            - name
          additionalProperties: false
        Modified_Time:
          type: string
          format: date-time
          description: >-
            Represents the timestamp when the attachment was last modified (ISO
            8601 with timezone)
          examples:
            - '2025-12-11T11:34:53+05:30'
        Modified_By:
          type: object
          description: User who last modified the attachment.
          properties:
            id:
              type: string
              description: >
                User ID. Use the [Users API](users.yaml#$.paths./users/bulk.get)
                to retrieve user IDs.
              pattern: ^[0-9]+$
