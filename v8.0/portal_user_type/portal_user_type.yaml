    delete:
      summary: Delete user type
      description: >-
        Deletes the specified portal user type from the portal. If portal users
        are assigned to this user type, provide `transfer_To` with the ID of
        another user type to transfer them before deletion.
      x-zs-llm-description: >-
        Deletes a user type by ID. Use `transfer_To` to specify the target user
        type ID when the user type has active users that need to be transferred
        first. Fails with INVALID_DATA if users are present and no transfer
        target is given.
      operationId: deletePortalUserType
      parameters:
        - $ref: '#/components/parameters/ParamPathUserTypeid'
        - name: transfer_To
          in: query
          description: >-
            The ID of the portal user type to transfer existing users to before
            deleting. Required when the user type being deleted has active users
            assigned to it.
          required: false
          schema:
            type: string
            format: int64
            pattern: ^[0-9]+$
            maxLength: 255
            x-zs-$ref:
              resource: portal_user_type
              origins:
                - operationId: getPortalUserTypes
                  propertyId: PortalUserTypesId
            description: Represents the unique numeric identifier of the portal user type.
      responses:
        '200':
          description: >-
            Zoho CRM deleted the portal user type successfully. The response
            contains the name of the deleted user type.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteusertypeResponse200'
              examples:
                Success200:
                  summary: Portal user type deleted successfully (200)
                  value:
                    user_type:
                      - code: SUCCESS
                        details:
                          id: '5020928000002330000'
                        message: Portal user type deleted successfully.
                        status: success
                  description: >-
                    Zoho CRM deleted the portal user type. The response confirms
                    the deletion with a `SUCCESS` status.
        '400':
          description: >-
            The request failed. This may occur if the user type still has active
            portal users assigned to it, or if the request body contains invalid
            data.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: >-
                      #/components/schemas/ApiNotSupportedForClientPortalUserError
                  - $ref: '#/components/schemas/ApiNotSupportedInSandboxError'
                  - $ref: '#/components/schemas/ApiNotSupportedForDomainError'
                  - $ref: '#/components/schemas/InvalidPortalNameError'
                  - $ref: '#/components/schemas/DeleteUserTypeUsersPresentError'
                x-zs-$id: DeleteusertypeError400
                description: >-
                  One or more error conditions occurred. See the `oneOf`
                  variants for specific error schemas.
              examples:
                ApiNotSupportedResponse1:
                  summary: Api not supported for client portal user (API_NOT_SUPPORTED)
                  value:
                    code: API_NOT_SUPPORTED
                    details:
                      unsupported_login_user_type: Client Portal User
                    message: api not supported for client portal user
                    status: error
                  description: >-
                    The API does not support requests made by client portal
                    users. **Resolution:** Use a CRM user account that is not a
                    client portal user to call this API.
                ApiNotSupportedResponse2:
                  summary: Api not supported in sandbox (API_NOT_SUPPORTED)
                  value:
                    code: API_NOT_SUPPORTED
                    details:
                      unsupported_environment: sandbox
                    message: api not supported in sandbox
                    status: error
                  description: >-
                    The API is not supported in sandbox environments.
                    **Resolution:** Run this operation against a production Zoho
                    CRM organization.
                ApiNotSupportedResponse3:
                  summary: Api not supported (API_NOT_SUPPORTED)
                  value:
                    code: API_NOT_SUPPORTED
                    details:
                      supported_domains:
                        - eu
                        - com
                        - in
                        - au
                        - ca
                        - cn
                        - jp
                    message: api not supported
                    status: error
                  description: >-
                    The API is not available for the current domain.
                    **Resolution:** Use one of the supported domains: `eu`,
                    `com`, `in`, `au`.
                InvalidDataResponse1:
                  summary: >-
                    Deletion of portal user type is not allowed, as user type
                    contains users, which need to be transferred to other user
                    type (INVALID_DATA)
                  value:
                    code: INVALID_DATA
                    details:
                      param_name: transfer_To
                    message: >-
                      Deletion of portal user type is not allowed, as user type
                      contains users, which need to be transferred to other user
                      type
                    status: error
                  description: >-
                    The portal user type cannot be deleted because it still has
                    active users assigned to it. **Resolution:** Remove all
                    users from this user type before deleting it.
                InvalidPortalNameResponse1:
                  summary: No portal exists with the given portal name. (INVALID_DATA)
                  value:
                    code: INVALID_DATA
                    details: {}
                    message: No portal exists with the given portal name.
                    status: error
                  description: >-
                    The portal name provided in the request path does not match
                    any existing portal. **Resolution:** Verify that the portal
                    name in the request path matches an existing portal name in
                    the Zoho CRM organization.
        '403':
          description: >-
            The authenticated user does not have permission to delete portal
            user types.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/NoPermissionError'
                  - $ref: >-
                      #/components/schemas/NoPermissionManagePortalsDisabledError
                x-zs-$id: DeleteusertypeError403
                description: >-
                  The request was rejected due to insufficient permissions. See
                  the `oneOf` variants for specific permission error schemas.
              examples:
                NoPermissionResponse1:
                  summary: No permission (NO_PERMISSION)
                  value:
                    code: NO_PERMISSION
                    details:
                      permissions:
                        - Crm_Implied_Manage_ClientPortal
                    message: No permission
                    status: error
                  description: >-
                    The authenticated user does not have the required permission
                    to perform this operation. **Resolution:** Grant the
                    `ZohoCRM.settings.clientportal` scope permission to the
                    OAuth client and re-authenticate.
                NoPermissionResponse2:
                  summary: NO_PERMISSION (NO_PERMISSION)
                  value:
                    code: NO_PERMISSION
                    details: {}
                    message: NO_PERMISSION
                    status: error
                  description: >-
                    The authenticated user does not have the required permission
                    to perform this operation. **Resolution:** Grant the
                    `ZohoCRM.settings.clientportal` scope permission to the
                    OAuth client and re-authenticate.
      security:
        - OAuth2:
            - ZohoCRM.settings.clientportal.ALL
        - OAuth2:
            - ZohoCRM.settings.clientportal.DELETE
components:
  schemas:
    LayoutsNested:
      type: object
      additionalProperties: false
      description: >-
        Represents the nested object representing a CRM layout that portal users
        can access for a given module. Identified by a unique numeric ID, name,
        and display label.
      properties:
        display_label:
          type: string
          description: Represents the display label of the CRM layout.
          maxLength: 255
        name:
          type: string
          description: Represents the internal name of the CRM layout.
          maxLength: 255
        id:
          description: Specifies the unique identifier of the CRM layout.
          x-zs-$ref:
            resource: portals_meta
            origins:
              - operationId: getPortalsMeta
                propertyId: PortalsMetaLayoutsId
          type: string
          pattern: ^[0-9]+$
          maxLength: 25
        _default_view:
          $ref: '#/components/schemas/DefaultViewNested'
    DeleteUserTypeUsersPresentError:
      type: object
      additionalProperties: false
      description: >-
        Returned when the portal user type cannot be deleted because it still
        has active portal users assigned to it. Remove or reassign users before
        deleting the user type.
      properties:
        code:
          type: string
          description: >-
            The error code that identifies the type of error. For example,
            `INVALID_DATA` or `MANDATORY_NOT_FOUND`.
          enum:
            - INVALID_DATA
        details:
          type: object
          additionalProperties: false
          description: >-
            An object containing additional detail fields that identify the
            specific request body field responsible for the error.
          properties:
            param_name:
              type: string
              description: Represents the parameter name.
              maxLength: 255
          required:
            - param_name
        message:
          type: string
          description: >-
            The error message that Zoho CRM returned, describing what went
            wrong.
          enum:
            - >-
              Deletion of portal user type is not allowed, as user type contains
              users, which need to be transferred to other user type
        status:
          type: string
          description: >-
            The result status of the API call. The value is `error` for all
            error responses.
          enum:
            - error
      required:
        - code
        - details
        - message
        - status
      title: Error Response Core
      x-zs-$id: DeleteUserTypeUsersPresentError
    MandatoryPersonalityAndNotesModulesError:
      type: object
      additionalProperties: false
      description: >-
        Returned when the request body does not include both the personality
        module and the Notes module, which are mandatory when configuring module
        access for a portal user type.
      properties:
        code:
          type: string
          description: >-
            The error code that identifies the type of error. For example,
            `INVALID_DATA` or `MANDATORY_NOT_FOUND`.
          enum:
            - MANDATORY_NOT_FOUND
        details:
          type: object
          additionalProperties: false
          description: >-
            An object containing additional detail fields that identify the
            specific request body field responsible for the error.
          properties: {}
        message:
          type: string
          description: >-
            The error message that Zoho CRM returned, describing what went
            wrong.
          enum:
            - Personality module and Notes module are mandatory modules.
        status:
          type: string
          description: >-
            The result status of the API call. The value is `error` for all
            error responses.
          enum:
            - error
      required:
        - code
        - details
        - message
        - status
      title: Error Response Core
      x-zs-$id: MandatoryPersonalityAndNotesModulesError
    LayoutMissingSelectedFilterError:
      type: object
      additionalProperties: false
      description: >-
        Returned when the selected filter-by field is not included in the
        specified layout. The filter field must be part of the chosen layout.
      properties:
        code:
          type: string
          description: >-
            The error code that identifies the type of error. For example,
            `INVALID_DATA` or `MANDATORY_NOT_FOUND`.
          enum:
            - NOT_ALLOWED
        details:
          type: object
          additionalProperties: false
          description: >-
            An object containing additional detail fields that identify the
            specific request body field responsible for the error.
          properties:
            json_path:
              type: string
              description: The JSON path to the request body field that caused the error.
              maxLength: 1000
          required:
            - json_path
        message:
          type: string
          description: >-
            The error message that Zoho CRM returned, describing what went
            wrong.
          enum:
            - Layout does not have selected filter in it.
        status:
          type: string
          description: >-
            The result status of the API call. The value is `error` for all
            error responses.
          enum:
            - error
      required:
        - code
        - details
        - message
        - status
      title: Error Response Core
      x-zs-$id: LayoutMissingSelectedFilterError
    UserTypeNested:
      type: object
      additionalProperties: false
      description: >-
        A top-level wrapper object used in create and update request bodies.
        Contains the `user_type` array that holds one or more portal user type
        objects.
      properties:
        personality_module:
          $ref: '#/components/schemas/PersonalityModuleNested'
          description: >-
            The personality module for this portal user type. Records in this
            module serve as portal user identities, and portal invitations are
            sent to records in this module. Required when creating a user type.
        name:
          type: string
          description: >-
            The display name of the portal user type. For example, "Client
            Portal", "Vendor Portal", or "Partner Portal". Must be alphanumeric
            with spaces only, maximum 50 characters.
          maxLength: 50
          minLength: 1
          pattern: ^[A-Za-z0-9 ]+$
        active:
          type:
            - boolean
            - 'null'
          description: >-
            Indicates whether the portal user type is active. Set to `true` to
            allow portal users to access the portal via this user type, or
            `false` to deactivate it.
        invitation_field:
          $ref: '#/components/schemas/InvitationFieldNested'
          description: >-
            The CRM field used as the invitation field for this portal user
            type. Portal invitations are sent to the contact value stored in
            this field. Required when creating a user type.
        id:
          type: string
          description: Denotes the unique numeric identifier of the portal user type.
          maxLength: 18
          format: int64
          readOnly: true
        deactive_user_count:
          type:
            - integer
            - 'null'
          format: int32
          description: >-
            The number of portal users assigned to this user type who are
            currently deactivated.
        modules:
          type: array
          description: >-
            The list of CRM modules with their access configurations for this
            portal user type. Required when creating a user type.
          items:
            $ref: '#/components/schemas/ModulesNested'
          maxItems: 500
      required:
        - invitation_field
        - modules
        - name
        - personality_module
    DetailsNested:
      type: object
      additionalProperties: false
      description: >-
        A nested object containing additional detail fields returned with error
        responses, such as the field API name and JSON path that identify where
        the validation failure occurred.
      properties:
        id:
          type: string
          description: >-
            Represents the unique numeric identifier of the resource referenced
            in the error detail.
          format: int64
          maxLength: 255
    ViewsNested:
      type:
        - object
        - 'null'
      additionalProperties: false
