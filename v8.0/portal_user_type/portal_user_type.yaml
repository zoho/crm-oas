openapi: 3.1.0
info:
  title: Portal User Types
  description: >-
    User type is a label for the users who will be accessing the CRM modules via
    portal. You can configure permissions for the user types that will enable or
    restrict access to the data in the CRM account. Some examples of portal user
    types are vendors, clients, consultants, customers, partners, or resellers.
  version: '8'
  license:
    name: Proprietary
    url: https://www.zoho.com/crm/terms.html
servers:
  - url: https://zohoapis.{dc}/crm/{version}
    description: >-
      The Zoho CRM API server. Requests are routed to the data center specified
      by the `{dc}` variable.
    variables:
      dc:
        description: >-
          The top-level domain suffix for the Zoho CRM data center. For example,
          `com` for the US data center, `eu` for Europe, or `in` for India.
        default: com
        enum:
          - eu
          - com
          - au
          - in
          - jp
          - cn
          - ca
      version:
        description: The API version to use. For example, `v8`.
        default: v8
paths:
  /settings/portals/{portal}/user_type:
    parameters:
      - $ref: '#/components/parameters/Portal'
    get:
      summary: Portal User Types
      description: >-
        Retrieves a list of all portal user types configured for the specified
        portal, with their summary configuration including name, status, user
        counts, and last modification time.
      x-zs-llm-description: >-
        Retrieves all user types for a portal. Use include=modules to fetch
        module-level details. Returns 400 if portal name is invalid.
      operationId: getPortalUserTypes
      parameters:
        - $ref: '#/components/parameters/ParamQueryInclude'
        - $ref: '#/components/parameters/ParamQueryIncludeInnerDetails'
      responses:
        '200':
          description: >-
            The list of portal user types for the specified portal was retrieved
            successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetusertypeResponse200'
              examples:
