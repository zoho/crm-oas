  parameters:
    Portal:
      name: portal
      in: path
      description: >-
        Specify the API name of the portal whose user types are being managed.
        This is the unique identifier for the portal in Zoho CRM.
      required: true
      schema:
        type: string
        example: '{portal}'
        maxLength: 255
        x-zs-$ref:
          resource: portals
          origins:
            - operationId: getPortals
              propertyId: PortalsName
        description: Represents the unique name of the portal.
    ParamQueryIncludeInnerDetails:
      name: include_inner_details
      in: query
      description: >-
        When set to `fields` or another resource key, the response includes the
        detailed fields or sub-resource properties for the included modules.
      required: false
      schema:
        type: string
        enum:
          - field.field_label
    ParamPathUserTypeid:
      name: userTypeId
      in: path
      description: >-
        Provide the unique numeric identifier of the portal user type to
        retrieve, update, or delete.
      required: true
      schema:
        type: string
        example: '{userTypeId}'
        maxLength: 255
        x-zs-$ref:
          resource: portal_user_type
          origins:
            - operationId: getPortalUserTypes
              propertyId: PortalUserTypesId
        format: int64
        description: Represents the unique numeric identifier of the portal user type.
    ParamQueryInclude:
      name: include
      in: query
      description: >-
        When set to `modules`, the response includes the full list of CRM
        modules and their access configurations for each portal user type.
      required: false
      schema:
        type: string
        enum:
          - modules
  securitySchemes:
    OAuth2:
      type: oauth2
      description: OAuth2 authentication for API access
      flows:
        authorizationCode:
          authorizationUrl: https://accounts.zoho.com/oauth/v2/auth
          tokenUrl: https://accounts.zoho.com/oauth/v2/token
          refreshUrl: https://accounts.zoho.com/oauth/v2/token
          scopes:
            ZohoCRM.settings.clientportal.ALL: Full access to client portal settings
            ZohoCRM.settings.clientportal.READ: Read portal user types in Zoho CRM
            ZohoCRM.settings.clientportal.CREATE: Create portal user types in Zoho CRM
            ZohoCRM.settings.clientportal.UPDATE: Update portal user types in Zoho CRM
            ZohoCRM.settings.clientportal.DELETE: Delete portal user types in Zoho CRM
