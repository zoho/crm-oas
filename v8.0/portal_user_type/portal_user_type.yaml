      description: >-
        Represents a CRM module to which the portal user type grants access.
        Includes the module's unique identifier, API name, shared type, plural
        label, and the lists of allowed layouts, filter fields, and field-level
        permissions.
      properties:
        plural_label:
          type:
            - string
