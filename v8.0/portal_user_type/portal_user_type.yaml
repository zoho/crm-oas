          description: Represents the plural display label of the CRM module.
          maxLength: 255
        shared_type:
          type: string
          description: >-
            Specifies how records in this module are shared with portal users.
            This field is required. Possible values: `all_records`,
            `selected_records`, `related_records`.
          enum:
            - private
            - public
          maxLength: 255
          minLength: 6
        api_name:
          description: >-
            Represents the API name that uniquely identifies the CRM module
            being granted portal access.
          x-zs-$ref:
            resource: portals_meta
            origins:
              - operationId: getPortalsMeta
                propertyId: PortalsMetaModuleApiName
          type: string
          pattern: ^[A-Za-z0-9_]{1,25}$
          maxLength: 25
        permissions:
          $ref: '#/components/schemas/PermissionsNested'
          description: >-
            The access permissions granted to portal users for this module. The
            `view` permission is required; all other permissions are optional
            and module-dependent.
        id:
          description: >-
            Represents the unique identifier of the CRM module. This field is
            required when specifying module access in a portal user type.
          x-zs-$ref:
            resource: portals_meta
            origins:
              - operationId: getPortalsMeta
                propertyId: PortalsMetaModuleId
          type: string
          pattern: ^[0-9]+$
          maxLength: 25
        filters:
          type:
            - array
            - 'null'
          description: >-
            Represents the list of filter field configurations that portal users
            can use to filter records in this module.
          items:
            $ref: '#/components/schemas/FilterFieldNested'
          maxItems: 1
        fields:
          type:
            - array
            - 'null'
          description: >-
            Represents the list of CRM fields within this module that portal
            users are permitted to access. Each entry specifies the field
            identifier, API name, read-only flag, and per-field CRUD
            permissions.
          items:
            $ref: '#/components/schemas/FieldsNested'
          maxItems: 500
        layouts:
          type:
            - array
            - 'null'
          description: >-
            The list of CRM layouts that portal users can access within this
            module.
          items:
            $ref: '#/components/schemas/LayoutsNested'
          maxItems: 7
        views:
          $ref: '#/components/schemas/ViewsNested'
          type:
            - object
            - 'null'
          description: >-
