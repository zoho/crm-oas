                    Represents the response returned the portal user types list.
                    The response contains an array of user type objects with
                    their basic metadata, including name, active status, user
                    counts, and personality module details.
        '400':
          description: >-
            The list request failed because the `{portal}` path parameter is
            invalid or the request is otherwise malformed.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: >-
                      #/components/schemas/ApiNotSupportedForClientPortalUserError
                  - $ref: '#/components/schemas/ApiNotSupportedInSandboxError'
                  - $ref: '#/components/schemas/ApiNotSupportedForDomainError'
                  - $ref: '#/components/schemas/InvalidPortalNameError'
                x-zs-$id: GetusertypeError400
                description: >-
                  One or more error conditions occurred. See the `oneOf`
                  variants for specific error schemas.
              examples:
                ApiNotSupportedResponse1:
                  summary: Api not supported for client portal user (API_NOT_SUPPORTED)
                  value:
                    code: API_NOT_SUPPORTED
                    details:
                      unsupported_login_user_type: Client Portal User
                    message: api not supported for client portal user
                    status: error
                  description: >-
                    The API does not support requests made by client portal
                    users. 


                    **Resolution:** Use a CRM user account that is not a client
                    portal user to call this API.
                ApiNotSupportedResponse2:
                  summary: Api not supported in sandbox (API_NOT_SUPPORTED)
                  value:
                    code: API_NOT_SUPPORTED
                    details:
                      unsupported_environment: sandbox
                    message: api not supported in sandbox
                    status: error
                  description: >-
                    The API is not supported in sandbox environments.
                    **Resolution:** Run this operation against a production Zoho
                    CRM organization.
                ApiNotSupportedResponse3:
                  summary: Api not supported (API_NOT_SUPPORTED)
                  value:
                    code: API_NOT_SUPPORTED
                    details:
                      supported_domains:
                        - eu
                        - com
                        - in
                        - au
                        - ca
                        - cn
                        - jp
                    message: api not supported
                    status: error
                  description: >-
                    The API is not available for the current domain.
                    **Resolution:** Use one of the supported domains: `eu`,
                    `com`, `in`, `au`.
                InvalidDataResponse1:
                  summary: No portal exists with the given portal name. (INVALID_DATA)
                  value:
                    code: INVALID_DATA
                    details: {}
                    message: No portal exists with the given portal name.
                    status: error
                  description: >-
                    The portal name provided in the request path does not match
                    any existing portal. **Resolution:** Verify that the portal
                    name in the request path matches an existing portal name in
                    the Zoho CRM organization.
        '403':
          description: >-
            The authenticated user does not have permission to list portal user
            types.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/NoPermissionError'
                  - $ref: >-
                      #/components/schemas/NoPermissionManagePortalsDisabledError
                x-zs-$id: GetusertypeError403
                description: >-
                  The request was rejected due to insufficient permissions. See
                  the `oneOf` variants for specific permission error schemas.
              examples:
                NoPermissionResponse1:
                  summary: No permission (NO_PERMISSION)
                  value:
                    code: NO_PERMISSION
                    details:
                      permissions:
                        - Crm_Implied_Manage_ClientPortal
                    message: No permission
                    status: error
                  description: >-
                    The authenticated user does not have the required permission
                    to perform this operation. **Resolution:** Grant the
                    `ZohoCRM.settings.clientportal` scope permission to the
                    OAuth client and re-authenticate.
                NoPermissionResponse2:
                  summary: NO_PERMISSION
                  value:
                    code: NO_PERMISSION
                    details: {}
                    message: NO_PERMISSION
                    status: error
                  description: >-
                    The authenticated user does not have the required permission
                    to perform this operation. **Resolution:** Grant the
                    `ZohoCRM.settings.clientportal` scope permission to the
                    OAuth client and re-authenticate.
      security:
        - OAuth2:
            - ZohoCRM.settings.clientportal.ALL
        - OAuth2:
            - ZohoCRM.settings.clientportal.READ
    post:
