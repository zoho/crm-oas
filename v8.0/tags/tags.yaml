openapi: 3.1.0
info:
  title: Tags
  description: >-
    Tags are custom labels in Zoho CRM that users can create and assign to
    records for categorization and filtering. This API enables developers to
    create, retrieve, update, and delete tags for any supported CRM module.
  version: '8'
servers:
  - url: https://zohoapis.{dc}/crm/{version}
    description: |-
      Represents the base URL for the Zoho CRM API.
      Sample request URL: `https://zohoapis.{dc}/crm/{version}`
    variables:
      dc:
        description: >-
          Represents the domain extension for the Zoho API server. Possible
          values: **com**, **eu**, **in**, **cn**, **au**, **ca**, **jp**.
          Default: **com**.
        default: com
        enum:
          - com
          - eu
          - in
          - cn
          - au
          - ca
          - jp
      version:
        description: 'Represents the API version. Default: **v8**.'
        default: v8
paths:
  /settings/tags:
    get:
      summary: Tags
      description: >-
        To retrieve all tags associated with a module in your Zoho CRM
        organization.
      operationId: getTags
      parameters:
        - $ref: '#/components/parameters/ParamQueryModule'
        - $ref: '#/components/parameters/ParamQueryInclude'
      responses:
        '200':
          description: >-
            Returns a list of tags for the specified module, along with
            pagination and limit details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GettagsResponse200'
              examples:
