        '400':
          description: >-
            Returns an error response when the request contains invalid
            parameters.

            **Resolution:** Check the error code and verify the module name is
            correct.
          content:
            application/json:
              schema:
                description: >-
                  Represents one of the possible error responses returned for a
                  400 Bad Request.
                oneOf:
                  - $ref: '#/components/schemas/RequiredModuleParamError'
                  - $ref: '#/components/schemas/InvalidModuleError'
                  - $ref: '#/components/schemas/ModuleTagsNotSupportedError'
                  - $ref: '#/components/schemas/InvalidRequestMethodError'
                x-zs-$id: GettagsError400
              examples:
                RequiredParamMissingResponse1:
                  summary: Error response for missing module parameter
                  value:
                    code: REQUIRED_PARAM_MISSING
                    details:
                      param: module
                    message: One of the expected parameter is missing
                    status: error
                  description: >-
                    Demonstrates an error response when the required **module**
                    query parameter is missing.

                    **Resolution:** Include the **module** query parameter in
                    the request.
                InvalidModuleResponse1:
                  summary: Error response for invalid module name
                  value:
                    code: INVALID_MODULE
                    details: {}
                    message: the module name given seems to be invalid
                    status: error
                  description: >-
                    Demonstrates an error response when the specified module
                    name is not recognized.

                    **Resolution:** Use a valid module API name from the Get
                    Modules API.
                InvalidModuleResponse2:
                  summary: Error response for unsupported module
                  value:
                    code: INVALID_MODULE
                    details: {}
                    message: the given module is not supported for this api
                    status: error
                  description: >-
                    Demonstrates an error response when the specified module
                    does not support tags.

                    **Resolution:** Use a module that supports tag operations.
                InvalidRequestMethodResponse1:
                  summary: Error response for invalid HTTP method
                  value:
                    code: INVALID_REQUEST_METHOD
                    details: {}
                    message: The http request method type is not a valid one
                    status: error
                  description: >-
                    Demonstrates an error response when the request uses an
                    unsupported HTTP method.

                    **Resolution:** Use the correct HTTP method as specified in
                    the API documentation.
        '403':
          description: >-
            Returns an error response when the user does not have permission to
            read tags.

            **Resolution:** Ensure the access token includes the
            **ZohoCRM.settings.tags.READ** scope.
          content:
            application/json:
              schema:
                description: >-
                  When the user does not have sufficient permissions to access
                  the resource
                x-zs-$id: GettagsError403
                $ref: '#/components/schemas/NoTagPermissionError'
              examples:
                NoPermissionResponse1:
                  summary: Error response for insufficient permissions
                  value:
                    code: NO_PERMISSION
                    details:
                      permissions:
                        - Crm_Implied_Edit_Leads
                        - Crm_Implied_Tags_Leads
                    message: permission denied
                    status: error
                  description: >-
                    Demonstrates an error response when the user does not have
                    the required permissions.

                    **Resolution:** Ensure the access token includes the
                    required tags scope.
        '404':
          description: >-
            Returns an error response when the URL does not match a known
            endpoint.

            **Resolution:** Verify the request URL against the API
            documentation.
          content:
            application/json:
              schema:
                description: When the requested resource is not found
                x-zs-$id: GettagsError404
                $ref: '#/components/schemas/InvalidUrlPatternError'
              examples:
                InvalidUrlPatternResponse1:
                  summary: Error response for invalid URL pattern
                  value:
                    code: INVALID_URL_PATTERN
                    details: {}
                    message: Please check if the URL trying to access is a correct one
                    status: error
                  description: >-
                    Demonstrates an error response when the request URL does not
                    match a known endpoint.

                    **Resolution:** Verify the request URL against the API
                    documentation.
