    put:
      summary: Tags
      description: To update an existing tag in your Zoho CRM organization.
      operationId: updateTags
      parameters:
        - $ref: '#/components/parameters/ParamQueryModule'
      requestBody:
        description: >-
          The request body must contain a **tags** array with one tag object.
          Include the tag **ID** in the object to identify which tag to update.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PuttagsRequest'
            examples:
              SamplePutRequest:
                summary: Sample update tags request body
                value:
                  tags:
                    - name: NewTag
                      color_code: '#AAFE62'
                      id: '123456789012345678'
                description: Demonstrates a sample request body for updating a tag.
      responses:
        '200':
          description: >-
            Returns a success response when the tag update completes. The
            response includes the updated tag details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PuttagsResponse200'
              examples:
                Success200:
                  summary: Successful response for tag update
                  value:
                    tags:
                      - code: SUCCESS
                        details:
                          created_time: '2025-12-29T10:43:05+05:30'
                          modified_time: '2025-12-29T18:56:59+05:30'
                          name: NewTagupdate
                          modified_by:
                            name: Roobini Devi
                            id: '111111000000059475'
                          id: '111111000000071739'
                          created_by:
                            name: Roobini Devi
                            id: '111111000000059475'
                          color_code: '#AAFE62'
                        message: tags updated successfully
                        status: success
                  description: >-
                    Demonstrates a successful response for updating a tag with
                    status 200.
        '400':
          description: >-
            Returns an error response when the request contains invalid data.

            **Resolution:** Check the error code and verify the field values and
            tag ID are correct.
          content:
            application/json:
              schema:
                description: >-
                  Represents one of the possible error responses returned for a
                  400 Bad Request.
                oneOf:
                  - $ref: '#/components/schemas/InvalidModuleError'
                  - $ref: '#/components/schemas/ModuleTagsNotSupportedError'
                  - type: object
                    additionalProperties: false
                    description: >-
                      Represents an error response containing a **tags** array
                      of error objects.
                    properties:
                      tags:
                        type: array
                        description: >-
                          Represents an array of error objects for the invalid
                          tag update request.
                        items:
                          oneOf:
                            - $ref: '#/components/schemas/InvalidTagColorCodeError'
                            - $ref: '#/components/schemas/TagInvalidDataError'
                            - $ref: '#/components/schemas/MandatoryFieldNotFoundError'
                            - $ref: '#/components/schemas/DuplicateTagError'
                            - $ref: '#/components/schemas/RequiredFieldMissingError'
                            - $ref: '#/components/schemas/InvalidDataTypeError'
                            - $ref: '#/components/schemas/TagFieldMaxLengthError'
                          description: >-
                            Represents a single error object for an invalid tag
                            update request.
                        maxItems: 25
                    required:
                      - tags
                    x-zs-$id: PuttagsError400Wrapper
                  - $ref: '#/components/schemas/RequiredModuleParamError'
                  - $ref: '#/components/schemas/InvalidRequestMethodError'
                  - $ref: '#/components/schemas/RequiredIdParamError'
                x-zs-$id: PuttagsError400
              examples:
                InvalidModuleResponse1:
                  summary: Error response for invalid module name
                  value:
                    code: INVALID_MODULE
                    details: {}
