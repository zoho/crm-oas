                  value:
                    data:
                      - code: DEPENDENT_MISMATCH
                        details:
                          dependee:
                            api_name: Unavailable_From
                            json_path: $.data[0].Unavailable_From
                          api_name: Status
                          json_path: $.data[0].Status
                        message: >-
                          When the service status is available, Unavailable From
                          must be greater than current date
                        status: error
                  description: >-
                    Returned when the Status field is set to available but
                    Unavailable_From does not fall after the current date. This
                    scenario demonstrates that Unavailable_From must be a future
                    date whenever the service status is available.
                DependentMismatchResponse11:
                  summary: Unavailable_Till is not greater than the current time
                  value:
                    data:
                      - code: DEPENDENT_MISMATCH
                        details:
                          dependee:
                            api_name: Status
                            json_path: $.data[0].Status
                          api_name: Unavailable_Till
                          json_path: $.data[0].Unavailable_Till
                        message: Unavailable Till must be greater than current Time.
                        status: error
                  description: >-
                    Returned when Unavailable_Till is set to a value that does
                    not exceed the current time as required by the dependent
                    Status field. This scenario demonstrates that
                    Unavailable_Till must always be a future timestamp relative
                    to the current time.
                DependentMismatchResponse12:
                  summary: >-
                    Status available with invalid Unavailable_Till null/value
                    combination.
                  value:
                    data:
                      - code: DEPENDENT_MISMATCH
                        details:
                          dependee:
                            api_name: Unavailable_Till
                            json_path: $.data[0].Unavailable_Till
                          api_name: Status
                          json_path: $.data[0].Status
                        message: >-
                          When the service status is available,  either both
                          Unavailable From and Unavailable Till must be null, or
                          only Unavailable From can have a value.
                        status: error
                  description: >-
                    Returned when Status is available but Unavailable_Till is
                    provided in a configuration that violates the allowed
                    null/value combination. This scenario demonstrates that when
                    status is available, Unavailable_Till must be null unless
                    Unavailable_From also carries a value.
                DependentMismatchResponse13:
                  summary: Unavailable_Till is not lesser than Unavailable_From.
                  value:
                    data:
                      - code: DEPENDENT_MISMATCH
                        details:
                          dependee:
                            api_name: Unavailable_From
                            json_path: $.data[0].Unavailable_From
                          api_name: Unavailable_Till
                          json_path: $.data[0].Unavailable_Till
                        message: Unavailable Till must be lesser than Unavailable From
                        status: error
                  description: >-
                    Returned when Unavailable_Till is set to a value that is not
                    less than Unavailable_From, violating the required
                    chronological ordering. This scenario demonstrates that
                    Unavailable_Till must always precede Unavailable_From in
                    time.
                DependentMismatchResponse14:
                  summary: >-
                    Unavailable_Till set on a scheduled service with
                    Available_From.
                  value:
                    data:
                      - code: DEPENDENT_MISMATCH
                        details:
                          dependee:
                            api_name: Available_From
                            json_path: $.data[0].Available_From
                          api_name: Unavailable_Till
                          json_path: $.data[0].Unavailable_Till
                        message: >-
                          Service status cannot be marked as Not In Use or
                          Temporarily Unavailable for scheduled services.
                        status: error
                  description: >-
                    Returned when Unavailable_Till is supplied for a service
                    that has a scheduled Available_From date, making Not In Use
                    or Temporarily Unavailable statuses invalid. This scenario
                    demonstrates that scheduled services cannot be transitioned
                    to Not In Use or Temporarily Unavailable states.
                DependentMismatchResponse15:
                  summary: >-
                    Status Not In Use conflicts with a future Unavailable_From
                    date.
                  value:
                    data:
                      - code: DEPENDENT_MISMATCH
                        details:
                          dependee:
                            api_name: Unavailable_From
                            json_path: $.data[0].Unavailable_From
                          api_name: Status
                          json_path: $.data[0].Status
                        message: >-
                          Services status cannot be marked as Not In Use when
                          Unavailable From falls after the current Date
                        status: error
                  description: >-
                    Returned when Status is set to Not In Use but
                    Unavailable_From is a future date, making the transition
                    invalid. This scenario demonstrates that a Not In Use status
                    cannot be applied when Unavailable_From extends beyond the
                    current date.
                DependentMismatchResponse16:
                  summary: Status Scheduled but Available_From is a past date
                  value:
                    data:
                      - code: DEPENDENT_MISMATCH
                        details:
                          dependee:
                            api_name: Available_From
                            json_path: $.data[0].Available_From
                          api_name: Status
                          json_path: $.data[0].Status
                        message: >-
                          Starting date of service availability falls before the
                          current Date, so service cannot be marked as Scheduled
                        status: error
                  description: >-
                    Returned when Status is set to Scheduled but Available_From
                    falls before the current date, making the scheduling
                    invalid. This scenario demonstrates that a Scheduled status
                    requires Available_From to be a future date.
                DependentMismatchResponse17:
                  summary: Status conflicts with an expired Available_Till date
                  value:
                    data:
                      - code: DEPENDENT_MISMATCH
                        details:
                          dependee:
                            api_name: Available_Till
                            json_path: $.data[0].Available_Till
                          api_name: Status
                          json_path: $.data[0].Status
                        message: >-
                          End Date of service availability falls before the
                          current Date, so service cannot be marked as Available
                          or Scheduled or Temporarily Unavailable
                        status: error
                  description: >-
                    Returned when Status is set to Available, Scheduled, or
                    Temporarily Unavailable but Available_Till has already
                    passed the current date. This scenario demonstrates that an
                    expired Available_Till prevents the service from being
                    placed in any active or forward-looking status.
                InvalidDataResponse7:
                  summary: >-
                    INVALID_DATA error for Unavailable_From outside service
                    availability window.
                  value:
                    data:
                      - code: INVALID_DATA
                        details:
                          api_name: Unavailable_From
                          json_path: $.data[0].Unavailable_From
                        message: >-
                          Unavailable From time does not fall within service
                          availability
                        status: error
                  description: >-
                    The server returns INVALID_DATA when the Unavailable_From
                    time falls outside the configured service availability
                    window. The api_name field in the response identifies
                    Unavailable_From as the source of the scheduling conflict.
                DependentFieldMissingResponse2:
                  summary: >-
                    DEPENDENT_FIELD_MISSING when Available_Days required when
                    Availability_Type is Specific Day(s).
                  value:
                    data:
                      - code: DEPENDENT_FIELD_MISSING
                        details:
                          dependee:
                            api_name: Status
                            json_path: $.data[0].Status
                          api_name: Unavailable_Till
                          json_path: $.data[0].Unavailable_Till
                        message: Dependent Field missing
                        status: error
                  description: >-
                    Returned when Available_Days is omitted while
                    Availability_Type is set to Specific Day(s). The response
                    identifies the missing dependent field and the
                    Availability_Type field that triggered the requirement.
                InvalidDataResponse8:
                  summary: >-
                    INVALID_DATA error for the data field with a null or
                    unprocessable value.
                  value:
                    code: INVALID_DATA
                    details:
                      maximum_length: 1
                      api_name: data
                      json_path: $.data
                    message: invalid data
                    status: error
                  description: >-
                    The server returns INVALID_DATA when the data field contains
                    a null or otherwise invalid payload that cannot be
                    processed. The api_name field in the response identifies
                    data as the source of the error.
                InvalidDataResponse9:
                  summary: >-
                    INVALID_DATA error for Status field due to incorrect data
                    type.
                  value:
                    data:
                      - code: INVALID_DATA
                        message: Invalid data type
                        details:
                          api_name: Status
                          expected_data_type: text
                          json_path: $.data[*].Status
                        status: error
                  description: >-
                    The server returns INVALID_DATA when the Status field
                    receives a value of an incorrect data type. The api_name
                    field in the response identifies Status as the source of the
                    type mismatch.
                InvalidDataResponse10:
                  summary: >-
                    INVALID_DATA on Status field containing an unacceptable
                    value.
                  value:
                    data:
                      - code: INVALID_DATA
                        message: Invalid data
                        details:
                          api_name: Status
                          maximum_length: 120
                          json_path: $.data[*].Status
                        status: error
                  description: >-
                    Returned when the value provided for the Status field fails
                    server-side data validation. The INVALID_DATA error
                    indicates the Status value is malformed or does not conform
                    to the expected format or allowed values.
                InvalidDataResponse11:
                  summary: >-
                    INVALID_DATA on Unavailable_Till field containing a
                    malformed value.
                  value:
                    data:
                      - code: INVALID_DATA
                        message: Invalid data
                        details:
                          api_name: Unavailable_Till
                          supported_values:
                            - Temporarily Unavailable
                            - Available
                            - Not In Use
                            - Scheduled
                          json_path: $.data[*].Unavailable_Till
                        status: error
                  description: >-
                    Returned when the value submitted for Unavailable_Till fails
                    server-side data validation. The INVALID_DATA error
                    indicates the Unavailable_Till value is malformed or does
                    not conform to the expected date-time format.
                InvalidDataResponse12:
                  summary: INVALID_DATA on Duration outside the permitted range.
                  value:
                    data:
                      - code: INVALID_DATA
                        details:
                          api_name: Duration
                          json_path: $.data[0].Duration
                        message: >-
                          Duration value should not be greater than 24hrs or
                          less than 5mins
                        status: error
                  description: >-
                    Returned when the Duration value exceeds 24 hours or is less
                    than five minutes. The INVALID_DATA error indicates the
                    submitted Duration is outside the permitted range.
                NotAllowedResponse1:
                  summary: >-
                    NOT_ALLOWED error for Job_Sheet_Required when Job Sheet is
                    unconfigured.
                  value:
                    data:
                      - code: NOT_ALLOWED
                        details:
                          api_name: Job_Sheet_Required
                          json_path: $.data[0].Job_Sheet_Required
                        message: Job Sheet is not configured in services preferences
                        status: error
                  description: >-
                    The server returns NOT_ALLOWED when the Job_Sheet_Required
                    field is supplied but Job Sheet has not been configured in
                    services preferences. The api_name field in the response
                    identifies Job_Sheet_Required as the source of the
                    restriction.
                NotAllowedResponse2:
                  summary: >-
                    NOT_ALLOWED error for Status when service availability
                    configuration is invalid.
                  value:
                    data:
                      - code: NOT_ALLOWED
                        details:
                          api_name: Status
                          json_path: $.data[0].Status
                        message: >-
                          As service availability is not valid, status cannot be
                          changed
                        status: error
                  description: >-
                    The server returns NOT_ALLOWED when the Status field cannot
                    be changed because the service's availability configuration
                    is invalid. The api_name field in the response identifies
                    Status as the source of the restriction.
        '403':
          description: >-
            The authenticated user does not have permission to update the
            service record, the Job Sheet preference has not been configured in
            service settings, or the service's availability dates are in the
            past.


            **Resolution:** For permission errors, the user should contact the
            system administrator to obtain the required access. For Job Sheet
            errors, the administrator must enable the Job Sheet preference in
            service settings. For past-dated availability errors, the service's
            availability dates must be updated before marking the service as
            available or temporarily unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PutservicesByIdError400Wrapper'
              examples:
                NotAllowedResponse1:
                  summary: >-
                    NOT_ALLOWED error when caller lacks permission to update the
                    service.
                  value:
                    data:
                      - code: NOT_ALLOWED
                        details:
                          api_name: Status
                          json_path: $.data[0].Status
                        message: >-
                          As service availability is not valid, status cannot be
                          changed
                        status: error
                  description: >-
                    The server returns a 403 error when the authenticated user
                    lacks the permission required to update the target service
                    record. This response indicates that the operation was
                    understood but is not permitted for the caller's current
                    role or profile.
      security:
        - OAuth2:
            - ZohoCRM.modules.services.UPDATE
    delete:
      summary: Delete a service record by ID
      description: >-
        To delete a service record from your Zoho CRM organization by its unique
        ID. When a service record is removed, all appointments associated with
        that service are also removed; however, deals created upon completion of
        an appointment under the service are not affected.
      operationId: deleteServiceById
      parameters:
        - $ref: '#/components/parameters/ParamPathServiceId'
      responses:
        '200':
          description: >-
            Returns the success status code and the ID of the service record
            after deletion.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteservicessResponse200'
              examples:
                Success200:
                  summary: Successful deletion of a single service record
                  value:
                    data:
                      - code: SUCCESS
                        details:
                          id: '111115000000128210'
                        message: record deleted
                        status: success
                  description: >
                    Illustrates a successful DELETE response in which a single
                    service record has been deleted. The response body contains
                    a SUCCESS code, a record deleted message, and the ID of the
                    deleted service in the details object.
        '400':
          description: >
            The request failed because the service ID in the request URL is
            invalid or already deleted, the service ID parameter is missing, or
            the module name is invalid.


            **Resolution:** Verify that the module API name is correct, provide
            a valid service ID in the request URL, and retry the request.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/RecordNotDeletedError'
                  - $ref: '#/components/schemas/InvalidModuleNameError'
                  - $ref: '#/components/schemas/RequiredParamMissingForDeleteError'
                  - $ref: '#/components/schemas/DataError'
                x-zs-$id: DeleteServiceByIdError400
                description: >-
                  Represents the bad-request error response for the delete
                  service operation. Contains error variants for invalid service
                  record data, an invalid module name, a missing required
                  parameter, or a general data error.
              examples:
                InvalidDataResponse1:
                  summary: >-
                    Invalid data error for a service record that could not be
                    deleted
                  value:
                    code: INVALID_DATA
                    details:
                      resource_path_index: 1
                    message: record not deleted
                    status: error
                  description: >
                    Illustrates an error response returned when the specified
                    service record cannot be deleted because the service ID in
                    the request URL is incorrect or the record has already been
                    deleted. The response body contains an INVALID_DATA code and
                    a record not deleted message.
                InvalidModuleResponse1:
                  summary: Invalid module name error for a service DELETE request
                  value:
                    code: INVALID_MODULE
                    details:
                      resource_path_index: 0
                    message: the module name given seems to be invalid
                    status: error
                  description: >
                    Illustrates an error response returned when the module name
                    provided in the request URL does not match any module in the
                    Zoho CRM organization. The response body contains an
                    INVALID_MODULE code and a message indicating that the module
                    name is invalid.
                RequiredParamMissingResponse1:
                  summary: Missing service ID parameter error for a DELETE request
                  value:
                    code: REQUIRED_PARAM_MISSING
                    details:
                      param: ids
                    message: One of the expected parameter is missing
                    status: error
                  description: >-
                    Illustrates an error response returned when the service ID
                    is omitted from the DELETE request URL, causing the API to
                    respond with a REQUIRED_PARAM_MISSING error and a details
                    object identifying the missing parameter. Specifying the
                    service ID in the request URL resolves this error.
                InternalErrorResponse1:
                  summary: Internal server error during a service DELETE request
                  value:
                    code: INTERNAL_ERROR
                    details: {}
                    message: Internal Server Error
                    status: error
                  description: >
                    Illustrates an error response returned when the server
                    encounters an unexpected internal error while processing the
                    service DELETE request. The response body contains an
                    INTERNAL_ERROR code, an Internal Server Error message, and
                    the index of the affected resource path in the details
                    object.
      security:
        - OAuth2:
            - ZohoCRM.modules.services.DELETE
components:
  schemas:
    AvailableDatesInHolidayOrNonBusinessDayError:
