openapi: 3.1.0
info:
  title: Services Apis
  description: API specification for Services API
  version: '8'
servers:
  - url: https://zohoapis.{dc}/crm/{version}
    description: API Server for /crm
    variables:
      dc:
        description: API Server URL TLD
        default: com
        enum:
          - com
          - eu
          - in
          - cn
          - au
          - ca
          - jp
      version:
        description: API Version
        default: v8
paths:
  /Services__s:
    get:
      summary: Get services
      description: >
        To retrieve the list of service records in your Zoho CRM organization
        that match the specified filter criteria. Supports pagination using
        either the **page** or **page_token** parameter and can return up to
        100,000 services across paginated requests.
      operationId: getServicesS
      parameters:
        - $ref: '#/components/parameters/Fields'
        - $ref: '#/components/parameters/Cvid'
        - $ref: '#/components/parameters/PageToken'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/SortOrder'
        - $ref: '#/components/parameters/SortBy'
      responses:
        '200':
          description: >
            Returns the list of service records matching the specified filter
            criteria, up to 200 records per page. Each record includes the full
            set of service fields. 


            The response also contains an **info** object with pagination
            details such as **per_page**, **page**, **more_records**, and
            **sort_order**.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetservicessResponse200'
              examples:
                Success200:
                  summary: Successful response listing four service records
                  value:
                    data:
                      - Job_Sheet_Required: 'No'
                        Owner:
                          name: madesh04
                          id: '111115000000058229'
                          email: madeshwaran.g+csez04@zohotest.com
                        Description: null
                        $currency_symbol: £
                        $field_states: null
                        $photo_id: null
                        Available_Days: []
                        Tax: []
                        $sharing_permission: full_access
                        Unavailable_From: null
                        Last_Activity_Time: '2026-01-13T15:08:50+04:00'
                        Record_Image: null
                        Modified_By:
                          name: madesh04
                          id: '111115000000058229'
                          email: madeshwaran.g+csez04@zohotest.com
                        id: '111115000000127290'
                        Available_Dates: []
                        Status: Available
                        Modified_Time: '2026-01-13T15:08:50+04:00'
                        Available_Timings:
                          - From: '09:00'
                            To: '16:30'
                        Service_Name: service00
                        Available_From: '2026-01-13'
                        $data_source_details: {}
                        Created_Time: '2026-01-13T10:51:09+04:00'
                        Available_Till: '2026-01-15'
                        $editable: true
                        Duration: 30
                        Job_Sheet_Section__s: null
                        Record_Status__s: Available
                        Price: 34
                        $status: cmv_1-1
                        Created_By:
                          name: madesh04
                          id: '111115000000058229'
                          email: madeshwaran.g+csez04@zohotest.com
                        Tag: []
                        Availability_Type: Specific Date Range
                        Members:
                          - id: '111115000000127292'
                            Members:
                              module: Users
                              name: madesh
                              id: '111115000000122075'
                          - id: '111115000000127291'
                            Members:
                              module: Users
                              name: madesh04
                              id: '111115000000058229'
                        Location: Business Address
                        Unavailable_Till: null
                        $has_more:
                          Members: false
                  description: >
                    Shows a success response for the Get Services endpoint, with
                    a data array containing four service records (Bike Service,
                    Car Service, AC Repair, Wall Painting) and an info object
                    with pagination metadata.
        '400':
          description: >-
            The request could not be processed because the module name in the
            URL is invalid or a required query parameter is missing.


            **Resolution:** The module API name in the request URL must
            reference a valid module, and the required query parameters must be
            included in the request.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/InvalidModuleNameError'
                  - $ref: '#/components/schemas/RequiredParamMissingError'
                x-zs-$id: GetservicessError400
                description: >
                  Contains the error response for a 400 Bad Request on the Get
                  Services endpoint. The schema is one of
                  `InvalidModuleNameError` or `RequiredParamMissingError`,
                  depending on the type of validation failure.
              examples:
                InvalidModuleResponse1:
                  summary: |
                    An error response for an invalid module name
                  value:
                    code: INVALID_MODULE
                    details:
                      resource_path_index: 0
                    message: the module name given seems to be invalid
                    status: error
                  description: >
                    Shows an error Request error response returned when an
                    invalid module name is provided in the request URL,
                    including the INVALID_MODULE error code and a message
                    indicating that only Services__s is a valid module name.
                RequiredParamMissingResponse1:
                  summary: |
                    Anexample of error response for a missing required parameter
                  value:
                    code: REQUIRED_PARAM_MISSING
                    details:
                      param_name: fields
                    message: One of the expected parameter is missing
                    status: error
                  description: >
                    Shows a Bad Request error response returned when a required
                    query parameter is absent from the request, including the
                    REQUIRED_PARAM_MISSING error code and details.
      security:
        - OAuth2:
            - ZohoCRM.modules.services.READ
    put:
      summary: Update service records
      description: >-
        To update one or more existing service records in your Zoho CRM
        organization. Each request can include up to 100 service objects
        identified by their record IDs; only the fields supplied in the payload
        are modified.
      operationId: updateServicesS
      parameters:
        - $ref: '#/components/parameters/ParamQueryAffectedData'
      requestBody:
        description: >
          The request body must contain a data array of service objects to be
          updated. You can include a maximum of 100 service objects per request.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutservicessBulkRequest'
            examples:
              SamplePutRequest:
                summary: >
                  Update two services with mixed availability types and date
                  range constraints.
                value:
                  data:
                    - Job_Sheet_Required: 'No'
                      Owner:
                        name: Madeshwaran G
                        id: '4671651000000635001'
                        email: madeshwaran.g@zohocorp.com
                      Description: null
                      Available_Days:
                        - Monday
                        - Tuesday
                        - Wednesday
                      Tax: []
                      Unavailable_From: '2026-01-13T15:40:03+05:30'
                      Record_Image: null
                      id: '4671651000000862030'
                      Available_Dates: []
                      Status: Not in Use
                      Available_Timings: null
                      Service_Name: service99
                      Available_From: '2026-01-13'
                      Available_Till: '2026-01-13'
                      Duration: 30
                      Job_Sheet_Section__s: null
                      Price: 3993
                      Tag: []
                      Availability_Type: Specific Day(s)
                      Members:
                        - id: '4671651000000862031'
                          Members:
                            module: Users
                            name: Madeshwaran G
                            id: '4671651000000635001'
                      Location: Business Address
                      Unavailable_Till: null
                    - Job_Sheet_Required: 'No'
                      Owner:
                        name: Madeshwaran G
                        id: '4671651000000635001'
                        email: madeshwaran.g@zohocorp.com
                      Description: null
                      Available_Days: []
                      Tax: []
                      Unavailable_From: '2026-01-14T12:20:35+05:30'
                      Record_Image: null
                      id: '4671651000000867004'
                      Available_Dates: []
                      Status: Not in Use
                      Available_Timings: null
                      Service_Name: dd
                      Available_From: '2026-01-01'
                      Available_Till: '2026-01-29'
                      Duration: 120
                      Job_Sheet_Section__s: null
                      Price: 44
                      Tag: []
                      Availability_Type: Specific Date Range
                      Members:
                        - id: '4671651000000867005'
                          Members:
                            module: Users
                            name: Madeshwaran G
                            id: '4671651000000635001'
                      Location: Business Address
                      Unavailable_Till: null
                description: >
                  Represents a PUT request body updating two service records
                  with different availability configurations. One record uses
                  Specific Day(s) availability with a limited date range and a
                  30-minute duration, while the other demonstrates an
                  alternative availability type alongside status, pricing, and
                  member assignment fields.
            x-zs-llm-examples:
              - SamplePutRequest
      responses:
        '200':
          description: >
            Returns a per-record status array. Each item contains the success
            code, the persisted record ID, the audit metadata, and the
            affected_data block for a service record that was successfully
            updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PutservicessResponse200'
              examples:
                Success200:
                  summary: >
                    All service records updated successfully with audit metadata
                    and affected_data.
                  value:
                    data:
                      - code: SUCCESS
                        details:
                          Modified_Time: '2026-01-14T16:57:16+05:30'
                          Modified_By:
                            name: Madeshwaran G
                            id: '4671651000000635001'
                          Created_Time: '2025-12-16T17:04:11+05:30'
                          id: '4671651000000862030'
                          Created_By:
                            name: Madeshwaran G
                            id: '4671651000000635001'
                          affected_data:
                            - $process_flow: false
                              id: '4671651000000862030'
                        message: record updated
                        status: success
                      - code: SUCCESS
                        details:
                          Modified_Time: '2026-01-14T16:57:16+05:30'
                          Modified_By:
                            name: Madeshwaran G
                            id: '4671651000000635001'
                          Created_Time: '2025-12-17T12:20:24+05:30'
                          id: '4671651000000867004'
                          Created_By:
                            name: Madeshwaran G
                            id: '4671651000000635001'
                          affected_data:
                            - $process_flow: false
                              id: '4671651000000867004'
                        message: record updated
                        status: success
                  description: >
                    Represents a fully successful response in which all
                    submitted service records were updated without error. Each
                    item in the data array carries a SUCCESS code, full audit
                    metadata (creation and modification timestamps with actor
                    details), the record ID, and an affected_data entry
                    indicating no automation flow was triggered.
        '207':
          description: >
            Returns a multi-status response. Each item in the data array
            independently indicates success or failure for the corresponding
            service record in the request body.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                description: >
                  Wrapped multi-status response. Contains a data array with one
                  entry for each service record in the request, where each entry
                  independently indicates success or failure.
                properties:
                  data:
                    type: array
                    description: >
                      Represents the per-record status array in the multi-status
                      response. Contains one entry for each service record in
                      the request, where each entry independently indicates
                      success or failure for that record.
                    items:
                      oneOf:
                        - $ref: '#/components/schemas/Post207multistatusResponse207'
                        - $ref: '#/components/schemas/DataError'
                      description: >
                        Represents one entry in the multi-status data array.
                        Each item is either a success entry carrying the result
                        code, message, status, and details for the corresponding
                        service record, or an error entry containing the error
                        code, message, status, and a details block identifying
                        the offending field.
                    maxItems: 100
                    minItems: 1
                required:
                  - data
                x-zs-$id: PutservicessResponse207
              examples:
                Success207:
                  summary: >
                    Partial success with one record updated and one INVALID_DATA
                    error on Duration.
                  value:
                    data:
                      - code: SUCCESS
                        details:
                          Modified_Time: '2026-01-14T17:25:57+05:30'
                          Modified_By:
                            name: Madeshwaran G
                            id: '4671651000000635001'
                          Created_Time: '2025-12-16T17:04:11+05:30'
                          id: '4671651000000862030'
                          Created_By:
                            name: Madeshwaran G
                            id: '4671651000000635001'
                          affected_data:
                            - $process_flow: false
                              id: '4671651000000862030'
                        message: record updated
                        status: success
                      - code: INVALID_DATA
                        details:
                          api_name: Duration
                          json_path: $.data[1].Duration
                        message: >-
                          Duration value should not be greater than 24hrs or
                          less than 5mins
                        status: error
                        error_meta: invalid_field
                  description: >
                    Represents a partial-success response where one service
                    record updated successfully while a second record failed
                    validation. The failing record returns an INVALID_DATA error
                    identifying the Duration field, indicating the supplied
                    value falls outside the permitted range of five minutes to
                    24 hours.
        '400':
          description: >-
            The request could not be processed because one or more service
            records contain invalid data, fail a Validation Rule, or violate a
            service-availability constraint.


            **Resolution:** Each error item identifies the offending field; the
            payload must be corrected and the request retried.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/DataError'
                  - type: object
                    additionalProperties: false
                    description: >
                      Wrapped error response. Contains a data array where each
                      item describes the validation failure for the
                      corresponding service record in the request.
                    properties:
                      data:
                        type: array
                        description: >
                          Represents the per-record error array returned for the
                          failed service records in the request. Contains one
                          entry for each service record that failed validation.
                        items:
                          oneOf:
                            - $ref: '#/components/schemas/InvalidDataTypeGenericError'
                            - $ref: '#/components/schemas/InvalidDataForFieldError'
                            - $ref: >-
                                #/components/schemas/AvailableStatusUnavailableFromFutureError
                            - $ref: >-
                                #/components/schemas/ScheduledServiceStatusRestrictionError
                            - $ref: >-
                                #/components/schemas/NotInUseStatusWithFutureUnavailableFromError
                            - $ref: >-
                                #/components/schemas/ScheduledStatusPastStartDateError
                            - $ref: >-
                                #/components/schemas/PastEndDateStatusConflictError
                            - $ref: >-
                                #/components/schemas/UnavailableFromTimeOutsideAvailabilityError
                            - $ref: >-
                                #/components/schemas/UnavailableTillTimeOutsideAvailabilityError
                            - $ref: '#/components/schemas/InvalidRequestPayloadError'
                            - $ref: >-
                                #/components/schemas/AvailableDaysNotInBusinessDaysError
                            - $ref: >-
                                #/components/schemas/ServiceTimeNotInBusinessTimingError
                            - $ref: '#/components/schemas/InvalidDataGenericError'
                            - $ref: >-
                                #/components/schemas/DurationNotSatisfyServiceTimingError
                            - $ref: '#/components/schemas/DependentFieldMissingError'
                            - $ref: >-
                                #/components/schemas/MembersAssociationLimitExceededError
                            - $ref: >-
                                #/components/schemas/ActiveServicesLimitExceededError
                            - $ref: >-
                                #/components/schemas/JobSheetSectionDependentMismatchError
                            - $ref: >-
                                #/components/schemas/ToValueMustBeGreaterThanFromError
                            - $ref: >-
                                #/components/schemas/AvailableDatesInHolidayOrNonBusinessDayError
                            - $ref: '#/components/schemas/MembersNotConfirmedError'
                            - $ref: '#/components/schemas/MembersNotActiveError'
                            - $ref: '#/components/schemas/InvalidDurationRangeError'
                            - $ref: '#/components/schemas/JobSheetNotConfiguredError'
                            - $ref: >-
                                #/components/schemas/ServiceAvailabilityInvalidStatusChangeError
                            - $ref: >-
                                #/components/schemas/InvalidAvailabilityTypeNotInPicklistError
                            - $ref: '#/components/schemas/MandatoryFieldMissingError'
                            - $ref: >-
                                #/components/schemas/ServiceUnavailableTillFutureError
                            - $ref: >-
                                #/components/schemas/AvailableStatusUnavailableWindowRuleError
                            - $ref: '#/components/schemas/UnavailableWindowOrderError'
                            - $ref: '#/components/schemas/RequiredFieldNotFoundError'
                            - $ref: '#/components/schemas/InvalidCustomTimeError'
                          description: >
                            Represents one error entry returned for a failed
                            service record. Each item conforms to one of the
                            error schemas, such as an invalid data type error or
                            a field-level validation error, and identifies the
                            field and reason for the failure.
                        maxItems: 25
                    required:
                      - data
                    x-zs-$id: PutservicessError400Wrapper
                  - $ref: '#/components/schemas/InvalidDataTypeForDataFieldError'
                x-zs-$id: PutservicessError400
                description: >
                  Bad-request error response for the Services endpoint. Returned
                  when the request payload fails validation.
              examples:
                InvalidDataResponse1:
                  summary: >-
                    Invalid data error when Availability_Type is not a valid
                    picklist value.
                  value:
                    data:
                      - code: INVALID_DATA
                        details:
                          api_name: Availability_Type
                          json_path: $.data[0].Availability_Type
                        message: The given Availability Type is not in picklist
                        status: error
                  description: >-
                    Returned when the Availability_Type field contains a value
                    not present in the allowed picklist. Valid values are Every
                    Business Days, Specific Date Range, Specific Date(s), and
                    Specific Day(s).
                DependentMismatchResponse1:
                  summary: >
                    An error when Available_Days values not within configured
                    business days.
                  value:
                    data:
                      - code: DEPENDENT_MISMATCH
                        details:
                          dependee:
                            api_name: Status
                            json_path: $.data[0].Status
                          api_name: Available_Days
                          json_path: $.data[0].Available_Days
                        message: >-
                          The given Available Days are not there in business
                          days
                        status: error
                  description: >
                    Represents an error response returned when the provided
                    Available_Days values fall outside the configured business
                    days. This DEPENDENT_MISMATCH error is triggered because the
                    Available_Days field depends on the Status field for valid
                    values.
                DependentMismatchResponse2:
                  summary: >-
                    Dependent mismatch when Available_Timings To value fails
                    business timing
                  value:
                    data:
                      - code: DEPENDENT_MISMATCH
                        details:
                          dependee:
                            api_name: Status
                            json_path: $.data[0].Status
                          api_name: To
                          json_path: $.data[0].Available_Timings[0].To
                        message: >-
                          Service available time does not satisfy the business
                          timing
                        status: error
                  description: >
                    Illustrates a DEPENDENT_MISMATCH error returned when the To
                    time in Available_Timings does not satisfy the configured
                    business timing. The service available time slot must fall
                    within the defined business hours.
                InvalidDataResponse2:
                  summary: >-
                    Invalid data error when an Available_Dates value has an
                    invalid format
                  value:
                    data:
                      - code: INVALID_DATA
                        details:
                          expected_data_type: date
                          api_name: Available_Dates
                          json_path: $.data[0].Available_Dates
                        message: invalid data
                        status: error
                  description: >-
                    Shows an INVALID_DATA failure where the provided date value
                    for Available_Dates is not in the accepted format. The
                    response identifies the field and the expected data type.
                DependentMismatchResponse3:
                  summary: >-
                    Dependent mismatch when Duration does not satisfy service
                    timing
                  value:
                    data:
                      - code: DEPENDENT_MISMATCH
                        details:
                          dependee:
                            api_name: Status
                            json_path: $.data[0].Status
                          api_name: Duration
                          json_path: $.data[0].Duration
                        message: Duration does not satisfy the service timing
                        status: error
                  description: >-
                    Returned when the Duration field does not satisfy the
                    service timing constraint imposed by the Status dependee.
                    The response includes code DEPENDENT_MISMATCH and identifies
                    Duration as the offending field.
                DependentFieldMissingResponse1:
                  summary: >
                    DEPENDENT_FIELD_MISSING error when Unavailable_From is
                    absent and Status is its dependee.
                  value:
                    data:
                      - code: DEPENDENT_FIELD_MISSING
                        details:
                          dependee:
                            api_name: Status
                            json_path: $.data[0].Status
                          api_name: Unavailable_From
                          json_path: $.data[0].Unavailable_From
                        message: Dependent Field missing
                        status: error
                  description: >
                    Represents an error response in which a required dependent
                    field was omitted from the request. The error identifies
                    Unavailable_From as the missing field, with Status acting as
                    its dependee, indicating that Unavailable_From must be
                    provided whenever the service status implies unavailability.
                LimitExceededResponse1:
                  summary: >-
                    LIMIT_EXCEEDED error when more than five members are
                    associated with a service
                  value:
                    data:
                      - code: LIMIT_EXCEEDED
                        details:
                          api_name: Members
                          limit: 100
                          json_path: $.data[0].Members
                        message: More than 100 users cannot be associated
                        status: error
                  description: >-
                    Shows a LIMIT_EXCEEDED failure returned when the Members
                    array contains more than five users for a single service.
                    The response identifies the Members field and its position
                    in the request payload.
                LimitExceededResponse2:
                  summary: >-
                    LIMIT_EXCEEDED error when the 500-active-service limit for
                    the organization is reached
                  value:
                    data:
                      - code: LIMIT_EXCEEDED
                        details:
                          api_name: Status
                          limit: 3
                          json_path: $.data[0].Status
                        message: You cannot create more than 500 active services
                        status: error
                  description: >-
                    Shows a LIMIT_EXCEEDED failure returned when the
                    organization has reached the maximum of 500 active services.
                    The response identifies the constraint at the record level.
                DependentMismatchResponse7:
                  summary: >-
                    Dependent mismatch when Job_Sheet_Section__s requires
                    Job_Sheet_Required is Yes
                  value:
                    data:
                      - code: DEPENDENT_MISMATCH
                        details:
                          dependee:
                            api_name: Job_Sheet_Required
                            json_path: $.data[0].Job_Sheet_Required
                          api_name: Job_Sheet_Section__s
                          json_path: $.data[0].Job_Sheet_Section__s
                        message: >-
                          Job_Sheet_Section__s can have value only when value of
                          Job_Sheet_Required is Yes
                        status: error
                  description: >-
                    Returned when Job_Sheet_Section__s is provided but
                    Job_Sheet_Required is not set to Yes. The response includes
                    code DEPENDENT_MISMATCH and identifies Job_Sheet_Section__s
                    as the field that cannot hold a value under this condition.
                DependentMismatchResponse8:
                  summary: >-
                    Dependent mismatch when Available_Timings To must be greater
                    than From.
                  value:
                    data:
                      - code: DEPENDENT_MISMATCH
                        details:
                          dependee:
                            api_name: Available_From
                            json_path: $.data[0].Available_From
                          api_name: Available_Till
                          json_path: $.data[0].Available_Till
                        message: To value must be Greater than From value
                        status: error
                  description: >-
                    Returned when the To time in Available_Timings is not
                    greater than the corresponding From time. The response
                    includes code DEPENDENT_MISMATCH with the json_path
                    $.data[0].Available_Timings[0].To identifying the offending
                    value.
                DependentMismatchResponse9:
                  summary: >-
                    Dependent mismatch when Available_Dates falls on a holiday
                    or non-business day.
                  value:
                    data:
                      - code: DEPENDENT_MISMATCH
                        details:
                          dependee:
                            api_name: Status
                            json_path: $.data[0].Status
                          api_name: Available_Dates
                          json_path: $.data[0].Available_Dates
                        message: >-
                          Available Dates value in holiday or Not in
                          BusinessDays
                        status: error
                  description: >-
                    Returned when an Available_Dates value falls on a holiday or
                    a non-business day. The response includes code
                    DEPENDENT_MISMATCH with Status as the dependee field driving
                    the constraint.
                InvalidDataResponse3:
                  summary: >-
                    Invalid data error when a Members entry is an unconfirmed
                    user
                  value:
                    data:
                      - code: INVALID_DATA
                        details:
                          user_status: unconfirmed
                          api_name: id
                          json_path: $.data[0].Members[0].Members.id
                        message: Members is not Confirmed
                        status: error
                  description: >-
                    Shows an INVALID_DATA failure returned when one of the
                    Members is an unconfirmed user. The response identifies the
                    Members field and its JSON path in the request payload.
                InvalidDataResponse4:
                  summary: Invalid data error when a Members entry is an inactive user
                  value:
                    data:
                      - code: INVALID_DATA
                        details:
                          user_status: inactive
                          api_name: id
                          json_path: $.data[0].Members[0].Members.id
                        message: Members is not Active
                        status: error
                  description: >-
                    Shows an INVALID_DATA failure returned when one of the
                    Members is an inactive user. The response identifies the
                    Members field and its JSON path in the request payload.
                InvalidDataResponse5:
                  summary: Invalid data type error for the Job_Sheet_Required field
                  value:
                    data:
                      - code: INVALID_DATA
                        message: Invalid data type
                        details:
                          api_name: Job_Sheet_Required
                          expected_data_type: text
                          json_path: $.data[*].Job_Sheet_Required
                        status: error
                  description: >-
                    Shows an INVALID_DATA failure for the Job_Sheet_Required
                    field, indicating that the supplied value is of an invalid
                    data type. The response identifies the field and its
                    position in the request payload.
                InvalidDataResponse6:
                  summary: >-
                    Invalid data error for the Available_Timings request
                    payload.
                  value:
                    data:
                      - code: INVALID_DATA
                        message: Invalid data
                        details:
                          api_name: Job_Sheet_Required
                          maximum_length: 3
                          json_path: $.data[*].Job_Sheet_Required
                        status: error
                  description: >-
                    Shows an INVALID_DATA failure for the Available_Timings
                    field, indicating that the request payload for
                    Available_Timings is invalid. The response identifies the
                    field by name and JSON path.
                MandatoryNotFoundResponse1:
                  summary: >-
                    MANDATORY_NOT_FOUND error when a required service field is
                    missing from the request
                  value:
                    data:
                      - code: MANDATORY_NOT_FOUND
                        message: Required field is missing
                        details:
                          api_name: id
                          json_path: $.data[*].id
                        status: error
                  description: >-
                    Shows a MANDATORY_NOT_FOUND failure returned when a required
                    service field is absent from the request. The response
                    identifies the missing field by name and JSON path.
                DependentMismatchResponse10:
                  summary: >
                    An error when Unavailable_From violates null rule when
                    status is Available.
                  value:
                    data:
                      - code: DEPENDENT_MISMATCH
                        details:
                          dependee:
                            api_name: Unavailable_From
                            json_path: $.data[0].Unavailable_From
                          api_name: Status
                          json_path: $.data[0].Status
                        message: >-
                          When the service status is available, Unavailable From
                          must be greater than current date
                        status: error
                  description: >
                    Represents an error response returned when the service
                    status is set to Available but the Unavailable_From field
                    violates the null constraint.


                    This DEPENDENT_MISMATCH error requires that when status is
                    Available, either both Unavailable_From and Unavailable_Till
                    are null, or only Unavailable_From may carry a value.
                DependentMismatchResponse11:
                  summary: |
                    An error when Unavailable_Till not greater than current time
                  value:
                    data:
                      - code: DEPENDENT_MISMATCH
                        details:
                          dependee:
                            api_name: Status
                            json_path: $.data[0].Status
                          api_name: Unavailable_Till
                          json_path: $.data[0].Unavailable_Till
                        message: Unavailable Till must be greater than current Time.
                        status: error
                  description: >
                    Represents an error response returned when Unavailable_Till
                    is not set to a datetime greater than the current time. 


                    This DEPENDENT_MISMATCH error is triggered when status is
                    Temporarily Unavailable and the supplied Unavailable_Till
                    value fails the future-datetime constraint.
                DependentMismatchResponse12:
                  summary: >
                    An error when invalid Unavailable_Till supplied when status
                    is Available
                  value:
                    data:
                      - code: DEPENDENT_MISMATCH
                        details:
                          dependee:
                            api_name: Unavailable_Till
                            json_path: $.data[0].Unavailable_Till
                          api_name: Status
                          json_path: $.data[0].Status
                        message: >-
                          When the service status is available,  either both
                          Unavailable From and Unavailable Till must be null, or
                          only Unavailable From can have a value.
                        status: error
                  description: >
                    Represents an error response returned when status is
                    Available but only one of Unavailable_From or
                    Unavailable_Till is supplied. This DEPENDENT_MISMATCH error
                    enforces that when status is Available, either both fields
                    are null or only Unavailable_From may carry a value.
                DependentMismatchResponse13:
                  summary: >
                    Dependent mismatch when Unavailable Till must be before
                    Unavailable From
                  value:
                    data:
                      - code: DEPENDENT_MISMATCH
                        details:
                          dependee:
                            api_name: Unavailable_From
                            json_path: $.data[0].Unavailable_From
                          api_name: Unavailable_Till
                          json_path: $.data[0].Unavailable_Till
                        message: Unavailable Till must be lesser than Unavailable From
                        status: error
                  description: >
                    Represents an error response returned when the supplied
                    Unavailable_Till value is not less than Unavailable_From.
                    This DEPENDENT_MISMATCH error enforces the chronological
                    ordering constraint between the two unavailability boundary
                    fields.
                DependentMismatchResponse14:
                  summary: >
                    Dependent mismatch when past Available_From blocks
                    Available/Scheduled status
                  value:
                    data:
                      - code: DEPENDENT_MISMATCH
                        details:
                          dependee:
                            api_name: Available_From
                            json_path: $.data[0].Available_From
                          api_name: Unavailable_Till
                          json_path: $.data[0].Unavailable_Till
                        message: >-
                          Service status cannot be marked as Not In Use or
                          Temporarily Unavailable for scheduled services.
                        status: error
                  description: >
                    Illustrates a DEPENDENT_MISMATCH error returned when the
                    Available_From date falls before the current date. A service
                    with a past start date cannot be set to a status of
                    Available, Scheduled, or Temporarily Unavailable.
                DependentMismatchResponse15:
                  summary: >
                    Dependent mismatch when past Available_Till blocks
                    Available/Scheduled status
                  value:
                    data:
                      - code: DEPENDENT_MISMATCH
                        details:
                          dependee:
                            api_name: Unavailable_From
                            json_path: $.data[0].Unavailable_From
                          api_name: Status
                          json_path: $.data[0].Status
                        message: >-
                          Services status cannot be marked as Not In Use when
                          Unavailable From falls after the current Date
                        status: error
                  description: >
                    Illustrates a DEPENDENT_MISMATCH error returned when the
                    Available_Till date falls before the current date. A service
                    with a past end date cannot be set to a status of Available,
                    Scheduled, or Temporarily Unavailable.
                DependentMismatchResponse16:
                  summary: >
                    Dependent mismatch when past Available_From prevents
                    Scheduled status
                  value:
                    data:
                      - code: DEPENDENT_MISMATCH
                        details:
                          dependee:
                            api_name: Available_From
                            json_path: $.data[0].Available_From
                          api_name: Status
                          json_path: $.data[0].Status
                        message: >-
                          Starting date of service availability falls before the
                          current Date, so service cannot be marked as Scheduled
                        status: error
                  description: >
                    Illustrates a DEPENDENT_MISMATCH error returned when the
                    Available_From date falls before the current date. A service
                    with a past start date cannot be marked as Scheduled.
                DependentMismatchResponse17:
                  summary: >
                    Dependent mismatch when past Available_Till blocks
                    Available/Scheduled/Temp Unavailable
                  value:
                    data:
                      - code: DEPENDENT_MISMATCH
                        details:
                          dependee:
                            api_name: Available_Till
                            json_path: $.data[0].Available_Till
                          api_name: Status
                          json_path: $.data[0].Status
                        message: >-
                          End Date of service availability falls before the
                          current Date, so service cannot be marked as Available
                          or Scheduled or Temporarily Unavailable
                        status: error
                  description: >
                    Illustrates a DEPENDENT_MISMATCH error returned when the
                    Available_Till date falls before the current date. A service
                    with a past end date cannot be set to a status of Available,
                    Scheduled, or Temporarily Unavailable.
                InvalidDataResponse7:
                  summary: >-
                    Invalid data error when Unavailable_From falls outside the
                    service availability window.
                  value:
                    data:
                      - code: INVALID_DATA
                        details:
                          api_name: Unavailable_From
                          json_path: $.data[0].Unavailable_From
                        message: >-
                          Unavailable From time does not fall within service
                          availability
                        status: error
                  description: >-
                    Shows an INVALID_DATA failure where the Unavailable_From
                    time does not fall within the configured service
                    availability window. The response identifies the
                    Unavailable_From field and its position in the request.
                DependentFieldMissingResponse2:
                  summary: >
                    An error when Available_From missing when Availability_Type
                    is Specific Date Range
                  value:
                    data:
                      - code: DEPENDENT_FIELD_MISSING
                        details:
                          dependee:
                            api_name: Status
                            json_path: $.data[0].Status
                          api_name: Unavailable_Till
                          json_path: $.data[0].Unavailable_Till
                        message: Dependent Field missing
                        status: error
                  description: >
                    Represents an error response in which Available_From was
                    omitted while Availability_Type was set to Specific Date
                    Range. The error identifies Availability_Type as the
                    dependee, indicating that a start date must be supplied
                    whenever a date-range availability type is selected.
                InvalidDataResponse8:
                  summary: >-
                    Invalid data error when an Available_Dates value falls on a
                    holiday or non-business day
                  value:
                    code: INVALID_DATA
                    details:
                      maximum_length: 1
                      api_name: data
                      json_path: $.data
                    message: invalid data
                    status: error
                  description: >-
                    Shows an INVALID_DATA failure for the Available_Dates field,
                    indicating that one of the specified dates is a holiday or
                    falls on a non-business day. The response identifies the
                    field and its position in the request payload.
                InvalidDataResponse9:
                  summary: Invalid data type error for the Status field
                  value:
                    data:
                      - code: INVALID_DATA
                        message: Invalid data type
                        details:
                          api_name: Status
                          expected_data_type: text
                          json_path: $.data[*].Status
                        status: error
                  description: >-
                    Shows an INVALID_DATA failure for the Status field,
                    indicating that the supplied value is of an incorrect data
                    type. The response identifies the field by name and JSON
                    path.
                InvalidDataResponse10:
                  summary: >-
                    Invalid data error when Available_From has an invalid date
                    format.
                  value:
                    data:
                      - code: INVALID_DATA
                        message: Invalid data
                        details:
                          api_name: Status
                          maximum_length: 120
                          json_path: $.data[*].Status
                        status: error
                  description: >-
                    Shows an INVALID_DATA failure for the Available_From field,
                    indicating that the supplied value does not conform to the
                    required YYYY-MM-DD date format.
                InvalidDataResponse11:
                  summary: >-
                    Invalid data error when Available_Till has an invalid date
                    format.
                  value:
                    data:
                      - code: INVALID_DATA
                        message: Invalid data
                        details:
                          api_name: Unavailable_Till
                          supported_values:
                            - Temporarily Unavailable
                            - Available
                            - Not In Use
                            - Scheduled
                          json_path: $.data[*].Unavailable_Till
                        status: error
                  description: >-
                    Shows an INVALID_DATA failure for the Available_Till field,
                    indicating that the supplied value does not conform to the
                    required date format.
                InvalidDataResponse12:
                  summary: >-
                    Invalid data error when Duration is outside the permitted
                    5-min to 24-hr range.
                  value:
                    data:
                      - code: INVALID_DATA
                        details:
                          api_name: Duration
                          json_path: $.data[0].Duration
                        message: >-
                          Duration value should not be greater than 24hrs or
                          less than 5mins
                        status: error
                  description: >-
                    Shows an INVALID_DATA failure for the Duration field,
                    indicating that the supplied value falls outside the
                    permitted range of five minutes to 24 hours.
                NotAllowedResponse1:
                  summary: >-
                    NOT_ALLOWED error when Job Sheet is not configured in
                    service preferences
                  value:
                    data:
                      - code: NOT_ALLOWED
                        details:
                          api_name: Job_Sheet_Required
                          json_path: $.data[0].Job_Sheet_Required
                        message: Job Sheet is not configured in services preferences
                        status: error
                  description: >-
                    Shows a NOT_ALLOWED failure returned when Job Sheet is not
                    configured in the organization's service preferences. The
                    response indicates that job sheet must be enabled before
                    services requiring it can be created or updated.
                NotAllowedResponse2:
                  summary: >-
                    NOT_ALLOWED error when past availability dates prevent an
                    Active or Temporarily Unavailable status change
                  value:
                    data:
                      - code: NOT_ALLOWED
                        details:
                          api_name: Status
                          json_path: $.data[0].Status
                        message: >-
                          As service availability is not valid, status cannot be
                          changed
                        status: error
                  description: >-
                    Shows a NOT_ALLOWED failure returned when the service
                    availability dates are in the past and the status cannot be
                    changed to Available or Temporarily Unavailable. The
                    response identifies the constraint.
                MandatoryNotFoundResponse2:
                  summary: >-
                    MANDATORY_NOT_FOUND error when another required field is
                    absent from the request
                  value:
                    data:
                      - code: MANDATORY_NOT_FOUND
                        details:
                          api_name: Members
                          json_path: $.data[0].Members
                        message: required field not found
                        status: error
                  description: >-
                    Shows a MANDATORY_NOT_FOUND failure returned when a required
                    field is not present in the request payload. The response
                    identifies the absent field by name and its position in the
                    request.
                MandatoryNotFoundResponse3:
                  summary: >-
                    MANDATORY_NOT_FOUND error when a third required field is
                    absent from the request
                  value:
                    data:
                      - code: MANDATORY_NOT_FOUND
                        message: Required field is missing
                        details:
                          api_name: Location
                          json_path: $.data[*].Location
                        status: error
                  description: >-
                    Shows a MANDATORY_NOT_FOUND failure returned when a third
                    required field is missing from the request payload. The
                    response identifies the field by name and JSON path.
                InvalidDataResponse13:
                  summary: >-
                    Invalid data error when Available_Timings From or To is not
                    in HH:MM format.
                  value:
                    data:
                      - code: INVALID_DATA
                        details:
                          api_name: To
                          json_path: $.data[0].Available_Timings
                        message: ' The given custom time is invalid'
                        status: error
                  description: >-
                    Shows an INVALID_DATA failure for a From or To field within
                    Available_Timings, indicating that the supplied time value
                    does not conform to the required HH:MM 24-hour format.
                InvalidDataResponse14:
                  summary: Invalid data type error for the Owner field
                  value:
                    data:
                      - code: INVALID_DATA
                        message: Invalid data type
                        details:
                          api_name: Owner
                          expected_data_type: jsonobject
                          json_path: $.data[*].Owner
                        status: error
                  description: >-
                    Shows an INVALID_DATA failure for the Owner field,
                    indicating that the supplied value is not of the expected
                    object data type.
                InvalidDataResponse15:
                  summary: Invalid data error when Available_Till has an invalid value
                  value:
                    data:
                      - code: INVALID_DATA
                        message: Invalid data
                        details:
                          api_name: Owner
                          maximum_length: 1
                          json_path: $.data[*].Owner
                        status: error
                  description: >-
                    Shows an INVALID_DATA failure for the Available_Till field,
                    indicating that the supplied value is not valid. The
                    response identifies the offending field and its position in
                    the request payload.
      security:
        - OAuth2:
            - ZohoCRM.modules.services.UPDATE
    post:
      summary: Create service records in Zoho CRM
      description: >-
        To create one or more service records in your Zoho CRM organization,
        submitting up to 100 service objects per request, each configurable with
        a name, duration, price, location, members, availability type, and
        availability window.
      operationId: createServicesS
      requestBody:
        description: >-
          The request body must contain a data array. You can include a maximum
          of 100 objects per request.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostservicessRequest'
            examples:
              SamplePostRequest:
                summary: >-
                  Successful creation of a service with specific-day
                  availability and job-sheet configuration
                value:
                  data:
                    - Owner:
                        id: '111115000000058229'
                        full_name: madesh04
                        name: madesh04
                      Available_Till: null
                      Available_From: null
                      Location: Client Address
                      Service_Name: firstService
                      Duration: 60
                      Availability_Type: Every Business Days
                      Members:
                        - Members:
                            name: madesh04
                            id: '111115000000058229'
                      Price: 434
                      $zia_owner_assignment: owner_recommendation_unavailable
                      zia_suggested_users: {}
                      Layout:
                        id: '111115000000070573'
                    - Owner:
                        id: '111115000000058229'
                        full_name: madesh04
                        name: madesh04
                      Available_Till: '2026-01-16'
                      Available_From: '2026-01-10'
                      Availability_Type: Specific Date Range
                      Location: Business Address and Client Address
                      Service_Name: secondService
                      Duration: 30
                      Members:
                        - Members:
                            name: madesh04
                            id: '111115000000058229'
                      Price: 343
                      $zia_owner_assignment: owner_recommendation_unavailable
                      zia_suggested_users: {}
                      Layout:
                        id: '111115000000070573'
                    - Owner:
                        id: '111115000000058229'
                        full_name: madesh04
                        name: madesh04
                      Available_Till: null
                      Available_From: null
                      Location: Client Address
                      Service_Name: thirdService
                      Duration: 30
                      Members:
                        - Members:
                            name: madesh04
                            id: '111115000000058229'
                      Availability_Type: Specific Date(s)
                      Available_Dates:
                        - '2026-01-13'
                        - '2026-01-14'
                        - '2026-01-15'
                      Available_Timings:
                        - From: '01:00'
                          To: '04:00'
                        - From: '06:00'
                          To: '08:00'
                      Price: 666
                      $zia_owner_assignment: owner_recommendation_unavailable
                      zia_suggested_users: {}
                      Layout:
                        id: '111115000000070573'
                    - Owner:
                        id: '111115000000058229'
                        full_name: madesh04
                        name: madesh04
                      Available_Till: null
                      Available_From: null
                      Location: Business Address
                      Availability_Type: Specific Day(s)
                      Service_Name: fourthService
                      Duration: 30
                      Members:
                        - Members:
                            name: madesh04
                            id: '111115000000058229'
                      Available_Days:
                        - Tuesday
                        - Wednesday
                        - Thursday
                        - Friday
                      Price: 3848
                      $zia_owner_assignment: owner_recommendation_unavailable
                      zia_suggested_users: {}
                      Layout:
                        id: '111115000000070573'
                    - Owner:
                        id: '111115000000058229'
                        full_name: madesh04
                        name: madesh04
                      Job_Sheet_Required: 'Yes'
                      Available_Till: '2026-01-22'
                      Available_From: '2026-01-02'
                      Availability_Type: Specific Date Range
                      Location: Business Address
                      Service_Name: fifthService
                      Duration: 60
                      Members:
                        - Members:
                            name: madesh04
                            id: '111115000000058229'
                      Available_Timings:
                        - From: '00:00'
                          To: '06:00'
                        - From: '07:00'
                          To: '14:00'
                      Price: 777
                      Tax:
                        - id: null
                          value: Sales Tax - 0.0 %
                        - id: null
                          value: Vat - 0.0 %
                      Description: service description
                      $zia_owner_assignment: owner_recommendation_unavailable
                      zia_suggested_users: {}
                      Layout:
                        id: '111115000000070573'
                  skip_mandatory: false
                description: >-
                  Shows a complete service create request for a 60-minute AC
                  Repair service with specific-day availability on Monday and
                  Tuesday, client-address location, an available status, and a
                  job-sheet requirement referencing the Standard job sheet
                  section.
            x-zs-llm-examples:
              - SamplePostRequest
      responses:
        '201':
          description: >-
            Returns a data array confirming the successful creation of each
            service record. Each item contains the success code, the ID assigned
            to the created record, and audit metadata including the creation and
            last-modified timestamps and the users who performed those actions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostservicessResponse201'
              examples:
                Success201:
                  summary: >-
                    Successful single-record service creation returning a 201
                    with new record ID and audit metadata.
                  value:
                    data:
                      - code: SUCCESS
                        details:
                          Modified_Time: '2026-01-12T11:03:03+04:00'
                          Modified_By:
                            name: madesh04
                            id: '111115000000058229'
                          Created_Time: '2026-01-12T11:03:03+04:00'
                          id: '111115000000121665'
                          Created_By:
                            name: madesh04
                            id: '111115000000058229'
                        message: record added
                        status: success
                      - code: SUCCESS
                        details:
                          Modified_Time: '2026-01-12T11:25:46+04:00'
                          Modified_By:
                            name: madesh04
                            id: '111115000000058229'
                          Created_Time: '2026-01-12T11:25:46+04:00'
                          id: '111115000000121687'
                          Created_By:
                            name: madesh04
                            id: '111115000000058229'
                        message: record added
                        status: success
                  description: >-
                    Shows the success response returned after the API creates a
                    single service record successfully, including the new record
                    ID, creation and modification timestamps, and the identities
                    of the users who created and last modified the record.
        '207':
          description: >-
            Returns a multi-status response when the submitted service records
            yield mixed outcomes. Each item in the data array independently
            indicates success or failure for its corresponding record.
            Successful operation include the created record's ID and audit
            metadata, while failed items include the error code and a
            description of the validation failure.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                description: >-
                  Represents the multi-status response returned when some
                  service records were created successfully and others
                  encountered errors. Contains a data array with one entry per
                  service record submitted in the request; each entry
                  independently indicates success or failure for its
                  corresponding record.
                properties:
                  data:
                    type: array
                    description: >-
                      Contains one entry per service record submitted in the
                      request, indicating success or failure for the
                      corresponding record.
                    items:
                      oneOf:
                        - $ref: '#/components/schemas/Post207multistatusResponse207'
                        - $ref: >-
                            #/components/schemas/MandatoryFieldNotFoundMultiStatusError
                      description: >-
                        Represents one entry in the multi-status data array.
                        Each item is either a success object containing the
                        created record's ID and audit metadata, or an error
                        object describing the validation failure for the
                        corresponding service record.
                    maxItems: 100
                    minItems: 1
                required:
                  - data
                x-zs-$id: PostservicessResponse207
              examples:
                Success207:
                  summary: >-
                    Partial batch success with one record created and one
                    rejected due to an invalid Duration value.
                  value:
                    data:
                      - code: SUCCESS
                        details:
                          id: generated_id_0
                        message: Proper success message
                        status: success
                      - code: MANDATORY_NOT_FOUND
                        details:
                          api_name: data
                          json_path: $.data[0].data
                        message: Mandatory field data not found
                        status: error
                        error_meta: mandatory_missing
                  description: >-
                    Shows the multi-status response returned when a batch
                    request partially succeeds: the API creates the first record
                    and assigns a new ID, while rejecting the second record with
                    an INVALID_DATA error indicating that the Duration value
                    falls outside the permitted range.
        '400':
          description: >-
            The request could not be processed because one or more service
            records contain invalid data, fail a field-level validation check,
            or violate a service-availability constraint.


            **Resolution:** The caller must inspect each error item to identify
            the offending field, correct the request payload accordingly, and
            resubmit the request.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/DataError'
                  - type: object
                    additionalProperties: false
                    description: >-
                      Represents the wrapped error response returned when one or
                      more service records in the request fail per-record
                      validation. Contains a data array where each item
                      describes the specific validation failure for the
                      corresponding service record.
                    properties:
                      data:
                        type: array
                        description: >-
                          Contains one error entry for each service record in
                          the request that failed validation, describing the
                          specific reason the record was rejected.
                        items:
                          oneOf:
                            - $ref: '#/components/schemas/InvalidDataTypeGenericError'
                            - $ref: '#/components/schemas/InvalidDataForFieldError'
                            - $ref: '#/components/schemas/DuplicateDataError'
                            - $ref: '#/components/schemas/MandatoryFieldMissingError'
                            - $ref: >-
                                #/components/schemas/AvailableStatusUnavailableFromFutureError
                            - $ref: >-
                                #/components/schemas/ServiceUnavailableTillFutureError
                            - $ref: >-
                                #/components/schemas/AvailableStatusUnavailableWindowRuleError
                            - $ref: '#/components/schemas/UnavailableWindowOrderError'
                            - $ref: >-
                                #/components/schemas/NotInUseStatusWithFutureUnavailableFromError
                            - $ref: >-
                                #/components/schemas/ScheduledStatusPastStartDateError
                            - $ref: >-
                                #/components/schemas/PastEndDateStatusConflictError
                            - $ref: >-
                                #/components/schemas/UnavailableFromTimeOutsideAvailabilityError
                            - $ref: >-
                                #/components/schemas/UnavailableTillTimeOutsideAvailabilityError
                            - $ref: '#/components/schemas/InvalidRequestPayloadError'
                            - $ref: >-
                                #/components/schemas/InvalidAvailabilityTypeNotInPicklistError
                            - $ref: >-
                                #/components/schemas/AvailableDaysNotInBusinessDaysError
                            - $ref: >-
                                #/components/schemas/ServiceTimeNotInBusinessTimingError
                            - $ref: '#/components/schemas/InvalidDataGenericError'
                            - $ref: '#/components/schemas/InvalidDurationRangeError'
                            - $ref: '#/components/schemas/JobSheetNotConfiguredError'
                            - $ref: >-
                                #/components/schemas/DurationNotSatisfyServiceTimingError
                            - $ref: '#/components/schemas/RequiredFieldNotFoundError'
                            - $ref: '#/components/schemas/DependentFieldMissingError'
                            - $ref: >-
                                #/components/schemas/MembersAssociationLimitExceededError
                            - $ref: >-
                                #/components/schemas/ActiveServicesLimitExceededError
                            - $ref: >-
                                #/components/schemas/JobSheetSectionDependentMismatchError
                            - $ref: >-
                                #/components/schemas/ToValueMustBeGreaterThanFromError
                            - $ref: >-
                                #/components/schemas/AvailableDatesInHolidayOrNonBusinessDayError
                            - $ref: '#/components/schemas/InvalidCustomTimeError'
                            - $ref: '#/components/schemas/MembersNotConfirmedError'
                            - $ref: '#/components/schemas/MembersNotActiveError'
                            - $ref: >-
                                #/components/schemas/ScheduledServiceStatusRestrictionError
                          description: >-
                            Represents a single validation error for a rejected
                            service record. Each item identifies the affected
                            field, the error code, and a descriptive message
                            explaining why the record failed. For example, an
                            invalid data type, a missing mandatory field, an
                            unavailable status, or a dependent field mismatch.
                        maxItems: 25
                    required:
                      - data
                    x-zs-$id: PostservicessError400Wrapper
                  - $ref: '#/components/schemas/InvalidDataTypeForDataFieldError'
                x-zs-$id: PostservicessError400
                description: >-
                  Represents the bad-request error response returned when the
                  request payload or query parameters fail validation. Contains
                  one of several error structures depending on whether the
                  failure is a top-level data-type error, a per-record
                  validation error, or an invalid value for a data field.
              examples:
                InvalidDataResponse1:
                  summary: >-
                    Availability_Type value rejected as not a valid picklist
                    entry.
                  value:
                    data:
                      - code: INVALID_DATA
                        details:
                          api_name: Availability_Type
                          json_path: $.data[0].Availability_Type
                        message: The given Availability Type is not in picklist
                        status: error
                  description: >-
                    Shows an error returned when the value supplied for
                    Availability_Type is not a recognised picklist option. The
                    API responds with code INVALID_DATA, identifying the field
                    and indicating that only predefined picklist values are
                    accepted.
                DependentMismatchResponse1:
                  summary: >-
                    Dependent mismatch error when Available_Days conflict with
                    business days.
                  value:
                    data:
                      - code: DEPENDENT_MISMATCH
                        details:
                          dependee:
                            api_name: Status
                            json_path: $.data[0].Status
                          api_name: Available_Days
                          json_path: $.data[0].Available_Days
                        message: >-
                          The given Available Days are not there in business
                          days
                        status: error
                  description: >-
                    Shows the DEPENDENT_MISMATCH error returned when the
                    Available_Days values do not align with the business days
                    defined by the Availability_Type field. The API rejects the
                    request with a DEPENDENT_MISMATCH error indicating that
                    Available_Days must be a subset of the configured business
                    days.
                DependentMismatchResponse2:
                  summary: >-
                    Dependent mismatch where Available_Timings value does not
                    satisfy business timing constraints.
                  value:
                    data:
                      - code: DEPENDENT_MISMATCH
                        details:
                          dependee:
                            api_name: Status
                            json_path: $.data[0].Status
                          api_name: To
                          json_path: $.data[0].Available_Timings[0].To
                        message: >-
                          Service available time does not satisfy the business
                          timing
                        status: error
                  description: >-
                    Shows the DEPENDENT_MISMATCH error returned when the
                    service's Available_Timings fall outside the configured
                    business hours while the Status is Available. 


                    The API rejects the request because the service availability
                    window must align with the organisation's business timing
                    configuration.
                InvalidDataResponse2:
                  summary: Available_Dates contains a value in an invalid date format.
                  value:
                    data:
                      - code: INVALID_DATA
                        details:
                          expected_data_type: date
                          api_name: Available_Dates
                          json_path: $.data[0].Available_Dates
                        message: invalid data
                        status: error
                  description: >-
                    Shows the INVALID_DATA error returned when the
                    Available_Dates field contains a value that does not conform
                    to the required YYYY-MM-DD date format. The API rejects the
                    request with an invalid data message.
                InvalidDataResponse3:
                  summary: Invalid data when duration value is outside allowed range.
                  value:
                    data:
                      - code: INVALID_DATA
                        details:
                          api_name: Duration
                          json_path: $.data[0].Duration
                        message: >-
                          Duration value should not be greater than 24hrs or
                          less than 5mins
                        status: error
                  description: >-
                    Shows the INVALID_DATA error returned when the Duration
                    field contains a value outside the permitted range of five
                    minutes to 24 hours. The API rejects the request with a
                    message indicating the duration constraint violation.
                NotAllowedResponse1:
                  summary: >-
                    Not allowed when job sheets not configured in service
                    preferences.
                  value:
                    data:
                      - code: NOT_ALLOWED
                        details:
                          api_name: Job_Sheet_Required
                          json_path: $.data[0].Job_Sheet_Required
                        message: Job Sheet is not configured in services preferences
                        status: error
                  description: >-
                    Returned when Job_Sheet_Required is set to Yes but job
                    sheets have not been enabled in the organization's service
                    preferences. The API rejects the request with a NOT_ALLOWED
                    error on the Job_Sheet_Required field.
                DependentMismatchResponse3:
                  summary: >-
                    Dependent mismatch where Duration does not fit within the
                    configured service timing window.
                  value:
                    data:
                      - code: DEPENDENT_MISMATCH
                        details:
                          dependee:
                            api_name: Status
                            json_path: $.data[0].Status
                          api_name: Duration
                          json_path: $.data[0].Duration
                        message: Duration does not satisfy the service timing
                        status: error
                  description: >-
                    Shows an error returned when the service Duration does not
                    fall within the configured available timings. The API
                    responds with code DEPENDENT_MISMATCH, identifying Duration
                    as the field whose value conflicts with the Status-driven
                    timing requirement.
                MandatoryNotFoundResponse1:
                  summary: Mandatory not found when required Members field is missing
                  value:
                    data:
                      - code: MANDATORY_NOT_FOUND
                        details:
                          api_name: Members
                          json_path: $.data[0].Members
                        message: required field not found
                        status: error
                  description: >-
                    Returned when the required Members field is absent from the
                    request payload. The API rejects the request with a
                    MANDATORY_NOT_FOUND error identifying Members as the missing
                    required field.
                DependentFieldMissingResponse1:
                  summary: >-
                    DEPENDENT_FIELD_MISSING error when Available_From is omitted
                    despite Availability_Type being set.
                  value:
                    data:
                      - code: DEPENDENT_FIELD_MISSING
                        details:
                          dependee:
                            api_name: Status
                            json_path: $.data[0].Status
                          api_name: Unavailable_From
                          json_path: $.data[0].Unavailable_From
                        message: Dependent Field missing
                        status: error
                  description: >-
                    Shows a DEPENDENT_FIELD_MISSING error response triggered
                    when the Availability_Type field is provided but its
                    required dependent field, Available_From, is omitted from
                    the request payload.
                InvalidDataResponse5:
                  summary: >-
                    Invalid data when Unavailable_From time is outside service
                    availability.
                  value:
                    data:
                      - code: INVALID_DATA
                        details:
                          api_name: Unavailable_From
                          json_path: $.data[0].Unavailable_From
                        message: >-
                          Unavailable From time does not fall within service
                          availability
                        status: error
                  description: >-
                    Returned when the Unavailable_From time does not fall within
                    the configured service availability window. The API rejects
                    the request with an INVALID_DATA error indicating the time
                    value is out of range.
                LimitExceededResponse1:
                  summary: Limit exceeded when Members array exceeds 100-user maximum.
                  value:
                    data:
                      - code: LIMIT_EXCEEDED
                        details:
                          api_name: Members
                          limit: 100
                          json_path: $.data[0].Members
                        message: More than 100 users cannot be associated
                        status: error
                  description: >-
                    Returned when the Members array contains more than 100
                    users, exceeding the per-service member limit. The API
                    rejects the request with a LIMIT_EXCEEDED error on the
                    Members field.
                LimitExceededResponse2:
                  summary: >-
                    Limit exceeded when organization has reached 500 active
                    services.
                  value:
                    data:
                      - code: LIMIT_EXCEEDED
                        details:
                          api_name: Status
                          limit: 3
                          json_path: $.data[0].Status
                        message: You cannot create more than 500 active services
                        status: error
                  description: >-
                    Returned when the organization has already reached the
                    maximum of 500 active services and a new service with an
                    active status is submitted. The API rejects the request with
                    a LIMIT_EXCEEDED error on the Status field.
                DependentMismatchResponse7:
                  summary: >-
                    Dependent mismatch where Job_Sheet_Section__s is set but
                    Job_Sheet_Required is No.
                  value:
                    data:
                      - code: DEPENDENT_MISMATCH
                        details:
                          dependee:
                            api_name: Job_Sheet_Required
                            json_path: $.data[0].Job_Sheet_Required
                          api_name: Job_Sheet_Section__s
                          json_path: $.data[0].Job_Sheet_Section__s
                        message: >-
                          Job_Sheet_Section__s can have value only when value of
                          Job_Sheet_Required is Yes
                        status: error
                  description: >-
                    Shows an error returned when Job_Sheet_Section__s is
                    supplied but Job_Sheet_Required is set to No. The API
                    responds with code DEPENDENT_MISMATCH, indicating that
                    Job_Sheet_Section__s may only carry a value when its
                    controlling field Job_Sheet_Required is set to Yes.
                DependentMismatchResponse8:
                  summary: >-
                    Dependent mismatch where the Available_Timings To value is
                    not greater than the From value.
                  value:
                    data:
                      - code: DEPENDENT_MISMATCH
                        details:
                          dependee:
                            api_name: Available_From
                            json_path: $.data[0].Available_From
                          api_name: Available_Till
                          json_path: $.data[0].Available_Till
                        message: To value must be Greater than From value
                        status: error
                  description: >-
                    Shows an error returned when the To time in an
                    Available_Timings window is not later than the corresponding
                    From time. The API responds with code DEPENDENT_MISMATCH,
                    identifying the To field as invalid because a valid
                    availability window requires To to be strictly greater than
                    From.
                DependentMismatchResponse9:
                  summary: >-
                    Dependent mismatch where Available_Dates includes a holiday
                    or non-business day.
                  value:
                    data:
                      - code: DEPENDENT_MISMATCH
                        details:
                          dependee:
                            api_name: Status
                            json_path: $.data[0].Status
                          api_name: Available_Dates
                          json_path: $.data[0].Available_Dates
                        message: >-
                          Available Dates value in holiday or Not in
                          BusinessDays
                        status: error
                  description: >-
                    Shows an error returned when one or more dates provided in
                    Available_Dates fall on a holiday or outside configured
                    business days. The API responds with code
                    DEPENDENT_MISMATCH, indicating that all Available_Dates
                    values must correspond to valid, non-holiday business days.
                InvalidDataResponse6:
                  summary: >-
                    Invalid data when custom time value in Available_Timings is
                    invalid.
                  value:
                    data:
                      - code: INVALID_DATA
                        details:
                          api_name: To
                          json_path: $.data[0].Available_Timings
                        message: ' The given custom time is invalid'
                        status: error
                  description: >-
                    Returned when a custom time value supplied in the To field
                    of Available_Timings is not a valid time. The API rejects
                    the request with an INVALID_DATA error targeting the
                    offending entry in the availability timings array.
                InvalidDataResponse7:
                  summary: Invalid data when member has not confirmed their account.
                  value:
                    data:
                      - code: INVALID_DATA
                        details:
                          user_status: unconfirmed
                          api_name: id
                          json_path: $.data[0].Members[0].Members.id
                        message: Members is not Confirmed
                        status: error
                  description: >-
                    Returned when a user specified in the Members array has not
                    confirmed their account. The API rejects the request with an
                    INVALID_DATA error and identifies the unconfirmed member's
                    ID in the response.
                InvalidDataResponse8:
                  summary: Invalid data when member is inactive.
                  value:
                    data:
                      - code: INVALID_DATA
                        details:
                          user_status: inactive
                          api_name: id
                          json_path: $.data[0].Members[0].Members.id
                        message: Members is not Active
                        status: error
                  description: >-
                    Returned when a user specified in the Members array has an
                    inactive status. The API rejects the request with an
                    INVALID_DATA error because only active users may be
                    associated with a service.
                InvalidDataResponse9:
                  summary: Invalid data when Owner field received wrong data type.
                  value:
                    data:
                      - code: INVALID_DATA
                        message: Invalid data type
                        details:
                          api_name: Owner
                          expected_data_type: jsonobject
                          json_path: $.data[*].Owner
                        status: error
                  description: >-
                    Returned when the Owner field receives a value of an
                    incorrect data type; the API expects a JSON object but
                    received an incompatible type. The request is rejected with
                    an INVALID_DATA error identifying the Owner field.
                InvalidDataResponse10:
                  summary: Owner field value exceeds the maximum allowed field length.
                  value:
                    data:
                      - code: INVALID_DATA
                        message: Invalid data
                        details:
                          api_name: Owner
                          maximum_length: 1
                          json_path: $.data[*].Owner
                        status: error
                  description: >-
                    Shows an INVALID_DATA error returned when the Owner field
                    value submitted to the Services endpoint exceeds the maximum
                    allowed field length. The response identifies the Owner
                    field as the source of the invalid data.
                MandatoryNotFoundResponse2:
                  summary: Mandatory not found when required Location field is missing.
                  value:
                    data:
                      - code: MANDATORY_NOT_FOUND
                        message: Required field is missing
                        details:
                          api_name: Location
                          json_path: $.data[*].Location
                        status: error
                  description: >-
                    Returned when the required Location field is absent from the
                    request payload. The API rejects the request with a
                    MANDATORY_NOT_FOUND error identifying Location as the
                    missing required field.
                DependentMismatchResponse10:
                  summary: >-
                    Dependent mismatch when Unavailable_From is invalid for
                    Available status.
                  value:
                    data:
                      - code: DEPENDENT_MISMATCH
                        details:
                          dependee:
                            api_name: Unavailable_From
                            json_path: $.data[0].Unavailable_From
                          api_name: Status
                          json_path: $.data[0].Status
                        message: >-
                          When the service status is available, Unavailable From
                          must be greater than current date
                        status: error
                  description: >-
                    Shows the DEPENDENT_MISMATCH error returned when
                    Unavailable_From is set while the service Status is
                    Available, violating the dependency rule that requires
                    Unavailable_From to be null or specified alone without
                    Unavailable_Till.
                DependentMismatchResponse11:
                  summary: >-
                    Dependent mismatch error when Unavailable_Till is not a
                    future datetime.
                  value:
                    data:
                      - code: DEPENDENT_MISMATCH
                        details:
                          dependee:
                            api_name: Status
                            json_path: $.data[0].Status
                          api_name: Unavailable_Till
                          json_path: $.data[0].Unavailable_Till
                        message: Unavailable Till must be greater than current Time.
                        status: error
                  description: >-
                    Shows the DEPENDENT_MISMATCH error returned when the
                    supplied Unavailable_Till value does not exceed the current
                    server time, violating the temporal constraint imposed by
                    the Status dependency. The API rejects the request
                    indicating that Unavailable_Till must be set to a future
                    datetime.
                DependentMismatchResponse12:
                  summary: >-
                    Dependent mismatch when both unavailability fields are set
                    for Available status.
                  value:
                    data:
                      - code: DEPENDENT_MISMATCH
                        details:
                          dependee:
                            api_name: Unavailable_Till
                            json_path: $.data[0].Unavailable_Till
                          api_name: Status
                          json_path: $.data[0].Status
                        message: >-
                          When the service status is available,  either both
                          Unavailable From and Unavailable Till must be null, or
                          only Unavailable From can have a value.
                        status: error
                  description: >-
                    Shows the DEPENDENT_MISMATCH error returned when both
                    Unavailable_From and Unavailable_Till are provided while
                    Status is Available, which violates the rule requiring both
                    fields to be null or only Unavailable_From to carry a value.
                DependentMismatchResponse13:
                  summary: >-
                    Dependent mismatch where Unavailable_Till is not earlier
                    than Unavailable_From.
                  value:
                    data:
                      - code: DEPENDENT_MISMATCH
                        details:
                          dependee:
                            api_name: Unavailable_From
                            json_path: $.data[0].Unavailable_From
                          api_name: Unavailable_Till
                          json_path: $.data[0].Unavailable_Till
                        message: Unavailable Till must be lesser than Unavailable From
                        status: error
                  description: >-
                    Shows the DEPENDENT_MISMATCH error returned when the
                    Unavailable_Till value is not chronologically later than
                    Unavailable_From, violating the ordering constraint imposed
                    by the Status dependency. The API rejects the request
                    requiring Unavailable_Till to be set after Unavailable_From.
                DependentMismatchResponse14:
                  summary: >-
                    Dependent mismatch when Not In Use status conflicts with a
                    future Unavailable_From date.
                  value:
                    data:
                      - code: DEPENDENT_MISMATCH
                        details:
                          dependee:
                            api_name: Unavailable_From
                            json_path: $.data[0].Unavailable_From
                          api_name: Status
                          json_path: $.data[0].Status
                        message: >-
                          Services status cannot be marked as Not In Use when
                          Unavailable From falls after the current Date
                        status: error
                  description: >-
                    Shows the DEPENDENT_MISMATCH error returned when a service
                    record is submitted with a Status of Not In Use while
                    Unavailable_From is set to a future date. The API rejects
                    the request because a future unavailability start date is
                    incompatible with the Not In Use status.
                DependentMismatchResponse15:
                  summary: >-
                    Dependent mismatch when Available_From precedes the current
                    date.
                  value:
                    data:
                      - code: DEPENDENT_MISMATCH
                        details:
                          dependee:
                            api_name: Available_From
                            json_path: $.data[0].Available_From
                          api_name: Status
                          json_path: $.data[0].Status
                        message: >-
                          Starting date of service availability falls before the
                          current Date, so service cannot be marked as Scheduled
                        status: error
                  description: >-
                    Shows the DEPENDENT_MISMATCH error returned when the
                    Available_From field is set to a date that precedes the
                    current date. The API rejects the request because the
                    service availability start date must not fall before the
                    current date.
                DependentMismatchResponse16:
                  summary: >-
                    Dependent mismatch when a past Available_Till conflicts with
                    an active service status.
                  value:
                    data:
                      - code: DEPENDENT_MISMATCH
                        details:
                          dependee:
                            api_name: Available_Till
                            json_path: $.data[0].Available_Till
                          api_name: Status
                          json_path: $.data[0].Status
                        message: >-
                          End Date of service availability falls before the
                          current Date, so service cannot be marked as Available
                          or Scheduled or Temporarily Unavailable
                        status: error
                  description: >-
                    Shows the DEPENDENT_MISMATCH error returned when
                    Available_Till is set to a past date while the service
                    Status is Available, Scheduled, or Temporarily Unavailable. 


                    The API rejects the request because an expired availability
                    end date is incompatible with those active status values.
                InvalidDataResponse11:
                  summary: >-
                    Unavailable_From time falls outside the service availability
                    window.
                  value:
                    data:
                      - code: INVALID_DATA
                        details:
                          api_name: Unavailable_From
                          json_path: $.data[0].Unavailable_From
                        message: >-
                          Unavailable From time does not fall within service
                          availability
                        status: error
                  description: >-
                    Shows an INVALID_DATA error returned when the
                    Unavailable_From time submitted to the Services endpoint
                    falls outside the configured availability window for the
                    service. The response identifies the Unavailable_From field
                    as the source of the scheduling conflict.
                DependentFieldMissingResponse2:
                  summary: >-
                    Dependent field missing error when Unavailable_From is
                    absent for Status.
                  value:
                    data:
                      - code: DEPENDENT_FIELD_MISSING
                        details:
                          dependee:
                            api_name: Status
                            json_path: $.data[0].Status
                          api_name: Unavailable_Till
                          json_path: $.data[0].Unavailable_Till
                        message: Dependent Field missing
                        status: error
                  description: >-
                    Shows a DEPENDENT_FIELD_MISSING error response triggered
                    when the Status field is provided but its required dependent
                    field, Unavailable_From, is absent from the request payload.
                InvalidDataResponse12:
                  summary: >-
                    Invalid data error returned with no specific error code in
                    the payload.
                  value:
                    code: INVALID_DATA
                    details:
                      maximum_length: 1
                      api_name: data
                      json_path: $.data
                    message: invalid data
                    status: error
                  description: >-
                    Shows an INVALID_DATA error returned for a service record
                    that contains invalid field data. This example represents a
                    minimal error response where no specific error code is
                    present in the payload.
                InvalidDataResponse13:
                  summary: >-
                    Status field rejected due to incorrect data type instead of
                    expected text.
                  value:
                    data:
                      - code: INVALID_DATA
                        message: Invalid data type
                        details:
                          api_name: Status
                          expected_data_type: text
                          json_path: $.data[*].Status
                        status: error
                  description: >-
                    Shows an INVALID_DATA error returned when the Status field
                    receives a value of an incorrect data type instead of the
                    expected text type. The response identifies the Status field
                    and specifies that the expected data type is text.
                InvalidDataResponse14:
                  summary: Status value exceeds maximum allowed length.
                  value:
                    data:
                      - code: INVALID_DATA
                        message: Invalid data
                        details:
                          api_name: Status
                          maximum_length: 120
                          json_path: $.data[*].Status
                        status: error
                  description: >-
                    Shows an INVALID_DATA error returned when the Status field
                    value exceeds the maximum allowed length of 120 characters.
                    The response identifies the Status field as the source of
                    the length violation.
                InvalidDataResponse15:
                  summary: Unavailable_Till contains an unsupported picklist value.
                  value:
                    data:
                      - code: INVALID_DATA
                        message: Invalid data
                        details:
                          api_name: Unavailable_Till
                          supported_values:
                            - Temporarily Unavailable
                            - Available
                            - Not In Use
                            - Scheduled
                          json_path: $.data[*].Unavailable_Till
                        status: error
                  description: >-
                    Shows the INVALID_DATA error returned when the
                    Unavailable_Till field contains a value not in the supported
                    picklist. The accepted values are Temporarily Unavailable,
                    Available, Not In Use, and Scheduled.
                InvalidDataResponse16:
                  summary: Job_Sheet_Required receives an invalid data type.
                  value:
                    data:
                      - code: INVALID_DATA
                        message: Invalid data type
                        details:
                          api_name: Job_Sheet_Required
                          expected_data_type: text
                          json_path: $.data[*].Job_Sheet_Required
                        status: error
                  description: >-
                    Shows the INVALID_DATA error returned when the
                    Job_Sheet_Required field receives a value of an incorrect
                    data type instead of the expected text type. The API rejects
                    the request with an invalid data type message.
                InvalidDataResponse17:
                  summary: Job_Sheet_Required value exceeds the maximum allowed length.
                  value:
                    data:
                      - code: INVALID_DATA
                        message: Invalid data
                        details:
                          api_name: Job_Sheet_Required
                          maximum_length: 3
                          json_path: $.data[*].Job_Sheet_Required
                        status: error
                  description: >-
                    Shows the INVALID_DATA error returned when the
                    Job_Sheet_Required field contains a value that exceeds the
                    maximum allowed length of three characters. The API rejects
                    the request with an invalid data message.
                DependentMismatchResponse17:
                  summary: >-
                    Dependent mismatch when a scheduled service is set to Not In
                    Use or Temporarily Unavailable.
                  value:
                    data:
                      - code: DEPENDENT_MISMATCH
                        details:
                          dependee:
                            api_name: Available_From
                            json_path: $.data[0].Available_From
                          api_name: Unavailable_Till
                          json_path: $.data[0].Unavailable_Till
                        message: >-
                          Service status cannot be marked as Not In Use or
                          Temporarily Unavailable for scheduled services.
                        status: error
                  description: >-
                    Shows the DEPENDENT_MISMATCH error returned when a status of
                    Not In Use or Temporarily Unavailable is requested for a
                    service that has future appointments scheduled. 


                    The API rejects the request because a service with upcoming
                    bookings must retain a status compatible with active
                    scheduling.
      security:
        - OAuth2:
            - ZohoCRM.modules.services.CREATE
    delete:
      summary: Delete one or more service records
      description: >-
        To delete one or more service records from your Zoho CRM organization.
        All appointments associated with the deleted services are also deleted;
        however, deals created upon completion of those appointments are not
        deleted.
      operationId: deleteServicesS
      parameters:
        - $ref: '#/components/parameters/ParamQueryIds'
      responses:
        '200':
          description: >-
            Returns the result of a single-record service delete operation. The
            response body contains a `data` array with one entry that includes
            the status code `SUCCESS`, the deleted record ID, a confirmation
            message, and the operation status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteservicessResponse200'
              examples:
                Success200:
                  summary: Single service record deleted successfully
                  value:
                    data:
                      - code: SUCCESS
                        details:
                          id: '4671651000000867047'
                        message: record deleted
                        status: success
                  description: >-
                    Represents a successful single-record delete response from
                    the DELETE operation. The data array contains one entry with
                    code=SUCCESS, the deleted service ID under `details.id`,
                    message="record deleted", and status="success".
        '207':
          description: >-
            Returns a multi-status response. Each item in the array
            independently indicates success or failure for the corresponding
            service ID in the ids query parameter.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                description: >-
                  Wrapped multi-status response for a batch service delete
                  operation. Contains a `data` array (2–200 items) with one
                  entry per service record in the request; each entry
                  independently indicates success or failure for that record.
                properties:
                  data:
                    type: array
                    description: >
                      Represents the per-record status array in the multi-status
                      response. Contains between 2 and 200 entries, each
                      independently indicating success or failure for the
                      corresponding service ID supplied in the `ids` query
                      parameter.
                    items:
                      oneOf:
                        - $ref: '#/components/schemas/Post207multistatusResponse207'
                        - $ref: '#/components/schemas/InvalidDataMultiStatusError'
                      description: >-
                        Represents one entry in the multi-status data array,
                        indicating success or failure for the corresponding
                        service record.
                    maxItems: 200
                    minItems: 2
                required:
                  - data
                x-zs-$id: DeleteservicessResponse207
              examples:
                Success207:
                  summary: >-
                    Mixed batch delete when one record deleted, one fails with
                    INVALID_DATA
                  value:
                    data:
                      - code: INVALID_DATA
                        details:
                          id: '4671651000010893004'
                        message: record not deleted
                        status: error
                        error_meta: invalid_field
                      - code: SUCCESS
                        details:
                          id: '4671651000000950132'
                        message: record deleted
                        status: success
                  description: >-
                    Represents a multi-status response from the DELETE
                    /Services__s endpoint when a batch delete yields mixed
                    results. The data array contains one entry with code=SUCCESS
                    indicating a successfully deleted record and one entry with
                    code=INVALID_DATA indicating a record that could not be
                    deleted.
        '400':
          description: >-
            Returned when the service ID is invalid or already deleted, the
            `ids` query parameter is missing, or the module name is
            unrecognized.


            **Resolution:** A valid service record ID must be supplied in the
            `ids` query parameter. The module name must match a recognized API
            name before retrying the request.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/RecordNotDeletedError'
                  - $ref: '#/components/schemas/InvalidModuleNameError'
                  - $ref: '#/components/schemas/RequiredParamMissingForDeleteError'
                  - $ref: '#/components/schemas/DataError'
                x-zs-$id: DeleteservicessError400
                description: >-
                  Bad-request error response for the delete services operation.
                  Returned when the module name is invalid, the `ids` parameter
                  is missing, or one or more service records could not be
                  deleted. The response body conforms to one of:
                  `RecordNotDeletedError`, `InvalidModuleNameError`,
                  `RequiredParamMissingForDeleteError`, or `DataError`.
              examples:
                InvalidDataResponse1:
                  summary: >-
                    Delete fails with INVALID_DATA where service ID is incorrect
                    or already deleted
                  value:
                    code: INVALID_DATA
                    details:
                      resource_path_index: 1
                    message: record not deleted
                    status: error
                  description: >-
                    Represents an error response from the DELETE operation when
                    the provided service ID is incorrect or refers to an
                    already-deleted record. The payload carries
                    code=INVALID_DATA, the offending ID under `details.id`,
                    message='record not deleted', and status='error'.
                InvalidModuleResponse1:
                  summary: >-
                    Delete fails with INVALID_MODULE when module name in the
                    request URL is invalid
                  value:
                    code: INVALID_MODULE
                    details:
                      resource_path_index: 0
                    message: the module name given seems to be invalid
                    status: error
                  description: >-
                    Represents an error response from the DELETE operation when
                    the module name in the request URL is invalid. The payload
                    carries code=INVALID_MODULE, details.resource_path_index=0,
                    message='the module name given seems to be invalid', and
                    status='error'.
                RequiredParamMissingResponse1:
                  summary: >-
                    Required parameter missing when ids query parameter absent
                    from DELETE request
                  value:
                    code: REQUIRED_PARAM_MISSING
                    details:
                      param: ids
                    message: One of the expected parameter is missing
                    status: error
                  description: >-
                    Error response returned when the `ids` query parameter is
                    omitted from the DELETE /Services__s request. Including the
                    `ids` query parameter with at least one valid service record
                    ID resolves this error.
                InternalErrorResponse1:
                  summary: Delete request fails due to an internal server error
                  value:
                    code: INTERNAL_ERROR
                    details: {}
                    message: Internal Server Error
                    status: error
                  description: >-
                    Represents an error response from the DELETE operation when
                    an internal server error occurs during processing. The
                    payload carries code=INTERNAL_ERROR, message='internal
                    server error', and status='error'.
      security:
        - OAuth2:
            - ZohoCRM.modules.services.DELETE
