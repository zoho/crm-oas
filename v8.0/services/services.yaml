    DataNested:
      type: object
      additionalProperties: false
      description: >-
        Represents a service object in the create request payload, including its
        name, duration, price, location, members, availability configuration,
        layout reference, and Zia owner assignment.
      properties:
        Job_Sheet_Required:
          type:
            - string
            - 'null'
          description: >
            Specify whether a job sheet is required for the service. **Possible
            values**: Yes, No.
          enum:
            - 'Yes'
            - 'No'
          maxLength: 3
        Owner:
          $ref: '#/components/schemas/OwnerNested'
          description: owner of the service
        Available_Timings:
          type:
            - array
            - 'null'
          description: >-
            Specify the available time windows for the service on each available
            day or date. The total available time must be at least equal to the
            service Duration. If not mentioned, the configured business hours
            are used.
          items:
            $ref: '#/components/schemas/AvailableTimingsNested'
          maxItems: 4
        Description:
          type:
            - string
            - 'null'
          description: Specify a description of the service.
          maxLength: 32000
        Available_From:
          type:
            - string
            - 'null'
          format: date
          description: >-
            Specify the date from which the service is available, in YYYY-MM-DD
            format. The key is mandatory when Availability_Type is Specific Date
            Range.
          maxLength: 100
        Service_Name:
          type: string
          description: >-
            Specify the name of the service. The key accepts alphanumeric
            characters.
          maxLength: 120
        Available_Till:
          type:
            - string
            - 'null'
          format: date
          description: >-
            Specify the date until which the service is available, in YYYY-MM-DD
            format. The key is mandatory when Availability_Type is Specific Date
            Range.
          maxLength: 100
        Available_Days:
          type:
            - array
            - 'null'
          description: >-
            Specify the list of business days on which the service is available.
            This key is mandatory when Availability_Type is Specific Day(s).
          items:
            type: string
            description: >-
              Each string specifies a business day on which the service is
              available.
            maxLength: 225
          maxItems: 7
        Duration:
          type: integer
          format: int32
          description: >-
            Specify the duration of the service, in minutes. Must be greater
            than 5 minutes and less than 24 hours.
        Tax:
          type:
            - array
            - 'null'
          description: >-
            Specify the taxes applied to the service cost. Each entry carries a
            tax ID and the tax value label.
          items:
            $ref: '#/components/schemas/TaxNested'
          maxItems: 2
        Price:
          type: integer
          format: int32
          description: >-
            Specify the price charged for the service in the organization
            currency, with up to 16 digits and 2 decimal places.
        Layout:
          $ref: '#/components/schemas/LayoutNested'
          description: Layout id
        zia_suggested_users:
          type:
            - object
            - 'null'
          additionalProperties: false
          description: >-
            Specify the Zia-suggested users payload associated with the service
            record.
        Availability_Type:
          type: string
          description: |
            Specify how the service availability is defined. 


            **Possible values**: 

            - Every Business Days - service is available on every business day.

            - Specific Date Range - service is available within an
            Available_From and Available_Till range.

            - Specific Date(s) - service is available on the dates listed in
            Available_Dates.

            - Specific Day(s) - service is available on the weekdays listed in
            Available_Days.
          enum:
            - Specific Day(s)
            - Specific Date Range
            - Every Business Days
            - Specific Date(s)
          maxLength: 100
        $zia_owner_assignment:
          type:
            - string
            - 'null'
          description: >-
            Specify the Zia owner-assignment recommendation behavior for the
            service record.
          maxLength: 32
        Members:
          type: array
          description: >-
            Specify the users who deliver the service. Refer to the [Get
            users](users.yaml#$.paths./users.get) resource for valid values.
          items:
            $ref: '#/components/schemas/MembersNested'
          maxItems: 5
        Available_Dates:
          type:
            - array
            - 'null'
          description: >-
            Specify the list of dates on which the service is available, in
            YYYY-MM-DD format. This key is mandatory when Availability_Type is
            Specific Date(s).
          items:
            type: string
            description: >-
              Each string specifies one date on which the service is available,
              in YYYY-MM-DD format.
            maxLength: 255
          maxItems: 20
        Location:
          type: string
          description: |
            Specify where the service is delivered. 


            **Possible values**: Client Address, Business Address, Business
            Address and Client Address.
          enum:
            - Business Address
            - Business Address and Client Address
            - Client Address
          maxLength: 100
      required:
        - Availability_Type
        - Duration
        - Location
        - Members
        - Price
        - Service_Name
    GETAvailableTimingsNested:
      type: object
      additionalProperties: false
      description: >-
        Represents the availability time window on a returned service record,
        defined by a start time (From) and an end time (To).
      properties:
        From:
          type: string
          description: >
            Represents the start of the availability time window, in HH:MM
            (24-hour) format.
          maxLength: 255
        To:
          type: string
          description: >
            Represents the end of the availability time window, in HH:MM
            (24-hour) format.
          maxLength: 255
      required:
        - From
        - To
