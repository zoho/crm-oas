                    Represents the API name of the field that triggered the
                    error.
                  maxLength: 255
                json_path:
                  type: string
                  description: >-
                    Represents the JSON path to the field that triggered the
                    error in the request payload.
                  maxLength: 1000
              required:
                - api_name
                - json_path
            api_name:
              type: string
              description: Represents the API name of the field that triggered the error.
              maxLength: 255
            json_path:
              type: string
              description: >-
                Represents the JSON path to the field that triggered the error
                in the request payload.
              maxLength: 1000
          required:
            - api_name
            - dependee
            - json_path
        message:
          type: string
          description: >-
