              description: Represents the API name of the field that triggered the error.
              maxLength: 255
            json_path:
              type: string
              description: >-
                Represents the JSON path to the field that triggered the error
                in the request payload.
              maxLength: 1000
          required:
            - api_name
            - json_path
        message:
          type: string
          description: >-
            Represents the error message describing that the provided
            availability type value is not a valid picklist option.
          enum:
            - The given Availability Type is not in picklist
        status:
          type: string
          description: 'Represents the status of the response. '
          enum:
            - error
      required:
        - code
        - details
        - message
        - status
      title: Error Response Core
      x-zs-$id: InvalidAvailabilityTypeNotInPicklistError
    PastEndDateStatusConflictError:
      type: object
      additionalProperties: false
      description: >-
        Error response returned when Available_Till is earlier than the current
        date and the service Status is being set to Available, Scheduled, or
        Temporarily Unavailable.
      properties:
        code:
