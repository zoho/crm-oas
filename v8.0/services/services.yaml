        affected by the update.
      required: false
      style: form
      explode: true
      schema:
        type: boolean
        enum:
          - true
    ParamPathId:
      name: id
      in: path
      description: >-
        Specify the unique ID of the service record to be retrieved, updated, or
        deleted.
      required: true
      style: simple
      explode: false
      schema:
        type: string
        example: '{id}'
        maxLength: 100
    ParamPathServiceId:
      name: id
      in: path
      description: Specify the unique ID of the service record to be deleted.
      required: true
      style: simple
      explode: false
      schema:
        type: string
        example: '{id}'
        maxLength: 100
    ParamQueryIds:
      name: ids
      in: query
      description: >-
        Specify the IDs of the service records to be deleted. Provide them as
        comma-separated values with a maximum of **100** IDs per request.
      required: false
      style: form
      explode: true
      schema:
        type: number
        maximum: 100000000000000000
        minimum: 1
    Fields:
      name: fields
      description: >-
        Specify a comma-separated list of field API names to include in the
        response. Use the [Get Fields Metadata
        API](fields.yaml#$.paths./settings/fields.get) to retrieve the field IDs
        and API names.
      in: query
      required: true
      schema:
        type: string
    Cvid:
      name: cvid
      description: >-
        Specify the unique ID of the Custom View. Use the [Get Custom Views
        Metadata API](custom_views.yaml#$.paths./settings/custom_views.get) to
        retrieve the Custom View IDs.
      in: query
      schema:
        type: string
        format: int64
    PageToken:
      name: page_token
      description: >-
        Specify the page token to retrieve records beyond the first 2,000
        results. Use the **next_page_token** value from a previous response to
        access the next page of results.
      in: query
      schema:
        type: string
        maxLength: 96
    Page:
      name: page
      description: Specify the page number to retrieve. Starts at 1.
      in: query
      schema:
        type: integer
        format: int32
        minimum: 1
    PerPage:
      name: per_page
      description: Specify the number of records to return per page. Maximum is 200.
      in: query
      schema:
        type: integer
        format: int32
        maximum: 200
        minimum: 1
    SortOrder:
      name: sort_order
      description: >-
        Specify the sort order for the records.<br/> <b>Possible values:</b>
        <br/>desc - Returns records in descending order.<br/> asc - Returns
        records in ascending order.
      in: query
      schema:
        type: string
        enum:
          - desc
          - asc
    SortBy:
      name: sort_by
      description: >-
        Specify the field to sort records by.  Possible values:**id** - Sorts by
        record ID.  **Created_Time** - Sorts by creation timestamp. 
        **Modified_Time** - Sorts by last modification timestamp.
      in: query
      schema:
        type: string
        enum:
          - id
          - Created_Time
          - Modified_Time
  securitySchemes:
    OAuth2:
      type: oauth2
      description: OAuth2 authentication for API access
      flows:
        authorizationCode:
          authorizationUrl: https://accounts.zoho.com/oauth/v2/auth
          tokenUrl: https://accounts.zoho.com/oauth/v2/token
          refreshUrl: https://accounts.zoho.com/oauth/v2/token
          scopes:
            ZohoCRM.modules.services.READ: >-
              Grants permission to retrieve service records from the Services
              module in Zoho CRM.
            ZohoCRM.modules.services.UPDATE: >-
              Grants permission to update existing service records in the
              Services module in Zoho CRM.
            ZohoCRM.modules.services.CREATE: >-
              Grants permission to create service records in the Services module
              in Zoho CRM.
            ZohoCRM.modules.services.DELETE: >-
              Grants permission to delete service records from the Services
              module in Zoho CRM.
