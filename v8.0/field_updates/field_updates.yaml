    delete:
      summary: To delete multiple field update actions
      description: >-
        Deletes multiple Field Update actions specified by their IDs. Specify
        the action IDs as a comma-separated list using the ids query parameter.
        You can delete a maximum of 10 actions in a single request. Field Update
        actions associated with active automation rules or marked as read-only
        cannot be deleted. Use the Get Field Updates API to retrieve the Field
        Update IDs. The response includes the success or failure status for each
        specified ID. Use the [Get Field Updates
        API](field_updates.yaml#$.paths./settings/automation/field_updates.get)
        to get the Field Update IDs.
      x-zs-llm-description: >-
        Bulk-removes field update actions; pass ids as a comma-separated query
        param (up to 10). Actions tied to active automation rules come back as
        NOT_ALLOWED; read-only actions are also blocked. Each ID gets its own
        success or error in the response.
      operationId: deleteFieldUpdates
      parameters:
        - $ref: '#/components/parameters/ParamQueryIds'
      responses:
        '200':
          description: >-
            Bulk delete completed successfully for all requested field update
            IDs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkDeleteSuccessResponse'
              examples:
                BulkDeleteAllSuccess:
                  summary: All requested field updates deleted successfully
                  value:
                    field_updates:
                      - code: SUCCESS
                        details:
                          id: '111111000000090003'
                        message: field update deleted successfully
                        status: success
                      - code: SUCCESS
                        details:
                          id: '111111000000090007'
                        message: field update deleted successfully
                        status: success
        '207':
          description: >-
            Bulk delete completed with mixed results. Some IDs were deleted
            successfully while others failed with INVALID_DATA or NOT_ALLOWED.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkDeleteMixedResponse'
              examples:
                BulkDeleteMixedResult:
                  summary: >-
                    Mixed response  - one invalid ID, one success, one
                    associated field update
                  value:
                    field_updates:
                      - code: INVALID_DATA
                        details:
                          id: '111111000000090003'
                        message: the id given seems to be invalid
                        status: error
                      - code: SUCCESS
                        details:
                          id: '111111000000081106'
                        message: field update deleted successfully
                        status: success
                      - code: NOT_ALLOWED
                        details:
                          id: '111111000000064003'
                        message: >-
                          This field update is associated with at least one of
                          Approval Process/Workflow Rules/Blueprint
                        status: error
        '400':
          description: >-
            Bulk delete failed. Either all provided IDs failed
            validation/association checks, the ids parameter is missing, or the
            number of IDs exceeded the maximum allowed limit.
          content:
            application/json:
              schema:
                x-zs-$id: FieldUpdatesDeleteErrorResponse
                oneOf:
                  - $ref: '#/components/schemas/MissingDeleteIdParameterError'
                    x-zs-$id: BulkDeleteRequiredParamMissingRef
                  - $ref: '#/components/schemas/BulkDeleteErrorResponse'
                    x-zs-$id: BulkDeleteErrorResponseRef
                  - $ref: '#/components/schemas/IdsLimitExceededError'
                    x-zs-$id: IdsLimitExceededErrorRef
                  - $ref: '#/components/schemas/BulkDeleteFailureItem'
                  - $ref: '#/components/schemas/BulkDeleteInvalidIdParamError'
              examples:
                IdsMissingResponse:
                  summary: Error when the required ids query parameter is not provided
                  value:
                    code: REQUIRED_PARAM_MISSING
                    details:
                      param_name: ids
                    message: One of the expected parameter is missing
                    status: error
                BulkDeleteAllFailed:
                  summary: >-
                    All provided IDs failed  - mix of invalid IDs and associated
                    field updates
                  value:
                    field_updates:
                      - code: INVALID_DATA
                        details:
                          id: '111111000000199637'
                        message: the id given seems to be invalid
                        status: error
                      - code: INVALID_DATA
                        details:
                          id: '111111000000227042'
                        message: the id given seems to be invalid
                        status: error
                      - code: INVALID_DATA
                        details:
                          id: '111111000000129018'
                        message: the id given seems to be invalid
                        status: error
                IdsLimitExceededResponse:
                  summary: >-
                    Error when more than 10 IDs are provided in the ids
                    parameter
                  value:
                    code: INVALID_DATA
                    details:
                      maximum_length: 10
                      param_name: ids
                    message: Ids maximum length exceeded
                    status: error
        '403':
          description: >-
            Indicates that the user does not have the necessary permissions to
            delete field update details.
          content:
            application/json:
              schema:
                x-zs-$id: FieldUpdatesDeleteForbidden
                $ref: '#/components/schemas/FeatureNoPermissionError'
              examples:
                NoPermissionResponse1:
                  summary: >-
                    Error response with code NO_PERMISSION: feature not
                    available in this edition
                  value:
                    code: NO_PERMISSION
                    details:
                      permissions:
                        - Crm_Implied_Manage_Workflow
                        - Crm_Implied_Customize_Zoho_CRM
                        - Crm_Implied_Manage_ConnectedWorkflow
                    message: feature not available in this edition
                    status: error
