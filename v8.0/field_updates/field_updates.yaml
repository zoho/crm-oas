    post:
      summary: Create Field Update
      description: >
        Creates a field update action that assigns a static value to a field,
        triggered by a workflow rule. For single-value fields, use a string for
        value. For multi-select and multi-user field types, use an array for
        value (for example, ['Call', 'Advertisement']). update_type (mandatory
        for multi-select and multi-user fields) specifies how to update the
        field and is supported only for multi-select fields: overwrite replaces
        existing values, append adds to existing values. dependent_fields
        specifies fields affected when the target field changes — primarily used
        for picklist dependencies, where one field's value controls another's
        valid options. For example, updating Country to India restricts the
        dependent State field to Indian states.
      x-zs-llm-description: >-
        Adds a new field update action that sets a static value on a field when
        a workflow rule fires. Before calling: fetch field id and api_name from
        GET /settings/fields?module={api_name}. For Pipeline fields: get valid
        values from GET /settings/pipeline?module={api_name} and include Stage
        in dependent_fields. For Layout fields: get IDs from GET
        /settings/layouts and include dependent Pipeline. For Owner fields: get
        user id from GET /users and supply notify plus related_records. Body
        must have a field_updates array with one entry covering name, module,
        field, type ('static'), and value. The response contains the new action
        ID needed for workflow rule association.
      x-zs-llm-examples:
        - SamplePostRequest
      operationId: createFieldUpdates
      requestBody:
        description: >-
          Request body containing the field update configuration to create. Only
          one field update can be created per request. For dependency-driven
          fields, include dependent_fields as required: Pipeline -> Stage,
          Layout -> Pipeline -> Stage (nested), Owner -> user object from Users
          API.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFieldUpdateRequest'
            examples:
              SamplePostRequest:
                summary: Sample request body
                value:
                  field_updates:
                    - name: FieldUpdatePOST
                      module:
                        id: '3361265000000000131'
                        api_name: Deals
                      field:
                        id: '3361265000000236001'
                        api_name: Pipeline
                      value: Test
                      dependent_fields:
                        - field:
                            api_name: Stage
                            id: '3361265000000000525'
                          value: Qualification
                      related_records:
                        - api_name: Events
                          id: '3361265000000000145'
                        - api_name: Calls
                          id: '3361265000000017015'
                      notify: true
                      feature_type: workflow
                      type: static
                      apply_assignment_threshold: true
                      update_type: append
      responses:
        '201':
          description: Field update action created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostfieldupdatesResponse201'
              examples:
                Success201:
                  summary: Success response for status 201
                  value:
                    field_updates:
                      - code: SUCCESS
                        details:
                          id: '3361265000006103128'
                        message: fieldupdate created successfully
                        status: success
        '400':
          description: >-
            Validation error. Returned when one or more request fields are
            missing, invalid, mismatched with dependencies, or not allowed for
            the selected field update configuration.
          content:
            application/json:
              schema:
                x-zs-$id: CreateFieldUpdatesErrorWrapper
                oneOf:
                  - $ref: '#/components/schemas/InvalidDataGenericError'
                  - type: object
                    x-zs-$id: DefinitionErrorResponses
                    additionalProperties: false
                    description: Wrapped error response with field_updates
                    properties:
                      field_updates:
                        type: array
                        description: Array of error objects
                        items:
                          x-zs-$id: CreateFieldUpdatesErrorResponse
                          oneOf:
                            - $ref: >-
                                #/components/schemas/ModuleIdApiNameAmbiguityError
                            - $ref: '#/components/schemas/FieldApiAmbiguityError'
                            - $ref: >-
                                #/components/schemas/UnsupportedKeyNotAllowedError
                            - $ref: '#/components/schemas/DependentFieldMissingError'
                            - $ref: '#/components/schemas/MandatoryFieldMissingError'
                            - $ref: '#/components/schemas/InvalidFieldValueTypeError'
                            - $ref: '#/components/schemas/FieldLengthExceededError'
                            - $ref: '#/components/schemas/InvalidDataTypeError'
                            - $ref: >-
                                #/components/schemas/InvalidDataFieldValidationError
                            - $ref: '#/components/schemas/ExpectedFieldMissingError'
                            - $ref: '#/components/schemas/DependentMismatchError'
                        maxItems: 25
                    required:
                      - field_updates
              examples:
                FieldUpdatesInvalidData:
                  summary: >-
                    Error response with code INVALID_DATA: invalid data (Field:
                    field_updates)
                  value:
                    code: INVALID_DATA
                    details:
                      api_name: field_updates
                      json_path: $.field_updates
                    message: invalid data
                    status: error
                ModuleAmbiguity1:
                  summary: >-
                    Error response with code AMBIGUITY_DURING_PROCESSING: The
                    given moduleid seems to be invalid
                  value:
                    field_updates:
                      - code: AMBIGUITY_DURING_PROCESSING
