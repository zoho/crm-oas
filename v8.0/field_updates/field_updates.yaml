        - OAuth2:
            - ZohoCRM.settings.automation_actions.DELETE
  /settings/automation/field_updates/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: >-
          Unique identifier of the field update action. Use the [Get Field
          Updates
          API](field_updates.yaml#$.paths./settings/automation/field_updates.get) 
          to retrieve the field update IDs.
        schema:
          type: string
          examples:
            - '3361265000006103409'
          maxLength: 255
    get:
      summary: Get Field Update By Id
      description: >
        Retrieves the details of the specified Field Update action, including
        its field configuration, module details, configured value, dependent
        fields, and audit information. Specify the Field Update ID in the path
        parameter. To retrieve additional field metadata, set the
        'include_inner_details' query parameter to one or more of field_label,
        enable_colour_code, pick_list_values.colour_code, data_type, or
        display_value. Use the [Get Fields Metadata
        API](fields.yaml#$.paths./settings/fields.get) to retrieve the field IDs
        and the [Get Modules API](modules.yaml#$.paths./settings/modules.get) to
        retrieve the module IDs. This API is useful for inspecting the current
        configuration of a Field Update action before updating it.
      x-zs-llm-description: >-
        Fetches the complete definition of one field update action by its id
        path param. Pass include_inner_details=true for extended field metadata.
        Response includes field config, module, value, dependent fields, and
        audit info. Run this before a PUT to see what is currently stored.
      operationId: getFieldUpdateById
      parameters:
        - $ref: '#/components/parameters/ParamQueryIncludeInnerDetails'
      responses:
        '200':
          description: Successful retrieval of the requested field update action.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldUpdateByIdResponse'
              examples:
                Success200:
                  summary: Success response for status 200
                  value:
                    field_updates:
                      - created_time: '2025-11-19T03:12:20-08:00'
                        update_type: append
                        lock_status:
                          locked: false
                        apply_assignment_threshold: false
                        editable: true
                        module:
                          singular_label: Deal
                          plural_label: Deals WF
                          api_name: Deals
                          moduleName: Potentials
                          id: '3361265000000000131'
                        related_module: null
                        deletable: true
                        source: crm
                        type: static
                        created_by:
                          name: B Indumathi
                          id: '3361265000000535001'
                        notify: false
                        feature_type: workflow
                        modified_time: '2025-11-19T03:12:20-08:00'
                        field:
                          ui_type: 2
                          api_name: Pipeline
                          id: '3361265000000236001'
                        dependent_fields:
                          - field:
                              ui_type: 26
                              api_name: Stage
                              id: '3361265000000000525'
                            value: Qualification
                        associated: false
                        related_records:
                          - api_name: Events
                            id: '3361265000000000145'
                          - api_name: Calls
                            id: '3361265000000017015'
                        name: FieldUpdateGET
                        modified_by:
                          name: B Indumathi
                          id: '3361265000000535001'
                        id: '3361265000006103364'
                        value: Test
        '204':
          description: No field update action found for the given ID.
        '400':
          description: >-
            Invalid query parameter value. Returned when include_inner_details
