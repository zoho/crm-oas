openapi: 3.1.0
info:
  title: Field Updates API
  description: >-
    The Field Update option helps you to automatically update certain field
    values in the records when the associated workflow rule is triggered.

    Refer to the [Setting Field
    Updates](https://help.zoho.com/portal/en/kb/crm/automate-business-processes/actions/articles/field-updates)
    for more details.
  version: '8'
servers:
  - url: https://zohoapis.{dc}/crm/{version}
    description: API Server URL
    variables:
      dc:
        description: API Server URL TLD
        default: com
        enum:
          - com
          - eu
          - in
          - cn
          - au
          - ca
          - jp
      version:
        description: API Version
        default: v8
paths:
  /settings/automation/field_updates:
    get:
      summary: Get Field Updates
      description: >-
        Retrieves a paginated list of field update actions. OPTIONAL FILTERS:
        module (string — filter by module API name), related_module (string —
        filter by related module API name), feature_type ('workflow'), sort_by,
        sort_order, page, per_page. Use the Fields metadata API to get field IDs
        and API names, and the Modules metadata API to get module API names and
        IDs. Use the [Get Field Updates
        API](field_updates.yaml#$.paths./settings/automation/field_updates.get)
        before associating them with workflow rules via the associate action.
      x-zs-llm-description: >-
        Fetches a paginated list of field update actions; filter by module
        api_name, related_module api_name, or feature_type ('workflow') using
        sort_by, sort_order, page, per_page. Use to look up field update IDs
        before linking them to workflow rules via associate.
      operationId: getFieldUpdates
      parameters:
        - $ref: '#/components/parameters/ParamQueryFilter'
        - $ref: '#/components/parameters/ParamQueryModule'
        - $ref: '#/components/parameters/ParamQueryRelatedModule'
        - $ref: '#/components/parameters/ParamQueryFeatureType'
        - $ref: '#/components/parameters/ParamQuerySortOrder'
        - $ref: '#/components/parameters/ParamQuerySortBy'
        - $ref: '#/components/parameters/ParamQueryIncludeInnerDetails1'
        - $ref: '#/components/parameters/ParamQueryPage'
        - $ref: '#/components/parameters/ParamQueryPerPage'
      responses:
        '200':
          description: >-
            Successful response for listing field update actions. Includes
            configured field update definitions and pagination metadata.
