                    message: feature not available in this edition
                    status: error
      security:
        - OAuth2:
            - ZohoCRM.settings.automation_actions.READ
    put:
      summary: Update Field Update
      description: >
        Updates an existing field update action identified by the path ID. Use
        the [Get Field Updates
        API](field_updates.yaml#$.paths./settings/automation/field_updates.get)
        to find the field update ID. Locked actions require the appropriate
        privilege, and read-only actions cannot be modified. For single-value
        fields, use a string for value. For multi-select and multi-user field
        types, use an array for value (for example, ['Call', 'Advertisement']).
        update_type (mandatory for multi-select and multi-user fields) specifies
        how to update the field and is supported only for multi-select fields:
        overwrite replaces existing values, append adds to existing values.
        dependent_fields specifies fields affected when the target field changes
        — primarily used for picklist dependencies. For example, updating
        Country to India restricts the dependent State field to Indian states.
      x-zs-llm-description: >-
        Modifies an existing field update action identified by path ID. Same
        setup as POST: look up field metadata and pipeline/layout/owner values
        from their respective APIs. All fields (name, module, field, type,
        value) must be sent in full  partial payloads are unreliable. Dependency
        rules mirror create. Locked actions need elevated privilege; read-only
        actions cannot be changed.
      x-zs-llm-examples:
        - SamplePutRequest
      operationId: updateFieldUpdateById
      requestBody:
        description: >-
          Request body containing exactly one field update configuration to
          modify.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFieldUpdateRequest'
            examples:
              SamplePutRequest:
                summary: Sample request body
                value:
                  field_updates:
                    - name: FieldUpdatePUT
                      module:
                        id: '3361265000000000131'
                        api_name: Deals
                      field:
                        id: '3361265000000236001'
                        api_name: Pipeline
                      value: Test
                      dependent_fields:
                        - field:
                            api_name: Stage
                            id: '3361265000000000525'
                          value: Qualification
                      related_records:
                        - api_name: Events
                          id: '3361265000000000145'
                        - api_name: Calls
                          id: '3361265000000017015'
                      notify: true
                      feature_type: workflow
                      type: static
                      apply_assignment_threshold: true
                      update_type: append
      responses:
