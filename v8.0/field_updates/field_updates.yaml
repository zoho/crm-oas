    delete:
      summary: Delete Field Update
      description: >
        Deletes a single field update action identified by the path ID. Use the
        [Get Field Updates
        API](field_updates.yaml#$.paths./settings/automation/field_updates.get)
        to retrieve the field update ID. Actions associated with active
        automation rules return a `NOT_ALLOWED` error, and read-only actions
        cannot be deleted.
      x-zs-llm-description: >-
        Removes a single field update action by its path ID. Actions attached to
        active automation rules are rejected with NOT_ALLOWED; read-only actions
        cannot be removed.
      operationId: deleteFieldUpdateById
      responses:
        '200':
          description: Indicates that the field update was deleted successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteFieldUpdateSuccessResponse'
              examples:
                Success200:
                  summary: Success response for status 200
                  value:
                    field_updates:
                      - code: SUCCESS
                        details:
                          id: '3361265000006131027'
                        message: field update deleted successfully
                        status: success
        '400':
          description: >-
            Returned when the field update ID is invalid, missing, or not
            deletable due to association/read-only constraints.
          content:
            application/json:
              schema:
                x-zs-$id: DeleteFieldUpdateBadRequestResponse
                oneOf:
                  - $ref: '#/components/schemas/InvalidFieldUpdateIdError'
                  - $ref: '#/components/schemas/MissingDeleteIdParameterError'
                  - $ref: '#/components/schemas/AssociatedFieldUpdateNotAllowedError'
                  - $ref: '#/components/schemas/DeleteFieldUpdateReadOnlyActionError'
              examples:
                FieldUpdatesInvalidData:
                  summary: >-
                    Error response with code INVALID_DATA: the id given seems to
                    be invalid
                  value:
                    code: INVALID_DATA
                    details:
                      resource_path_index: 3
                    message: the id given seems to be invalid
                    status: error
                RequiredParamMissingResponse1:
                  summary: >-
                    Error response with code REQUIRED_PARAM_MISSING: One of the
                    expected parameter is missing
                  value:
                    code: REQUIRED_PARAM_MISSING
                    details:
                      param_name: id
                    message: One of the expected parameter is missing
                    status: error
                ReadOnlyActionNotAllowed1:
                  summary: >-
                    Error response with code NOT_ALLOWED: field update can not
                    be deleted
                  value:
                    code: NOT_ALLOWED
                    details:
                      resource_path_index: 3
                    message: field update can not be deleted
                    status: error
        '403':
          description: >-
            Indicates that the user does not have the necessary permissions to
            edit a field update action.
          content:
            application/json:
              schema:
                x-zs-$id: DeleteFieldUpdateForbiddenResponse
                $ref: '#/components/schemas/FeatureNoPermissionError'
              examples:
                NoPermissionResponse1:
                  summary: >-
                    Error response with code NO_PERMISSION: feature not
                    available in this edition
                  value:
                    code: NO_PERMISSION
                    details:
                      permissions:
                        - Crm_Implied_Manage_Workflow
                        - Crm_Implied_Customize_Zoho_CRM
                        - Crm_Implied_Manage_ConnectedWorkflow
                    message: feature not available in this edition
                    status: error
      security:
        - OAuth2:
            - ZohoCRM.settings.automation_actions.DELETE
components:
  schemas:
    FieldUpdateActionResult:
      type: object
      additionalProperties: false
      description: >-
        Result object for a field update create, update, or delete operation.
        Contains the operation outcome code, a human-readable message, the
        status, and details including the server-generated ID.
      x-zs-llm-description: >-
        Generic action result for field update create/update/delete operations.
        Check status and code fields for outcome.
      properties:
        code:
          type: string
          description: >-
            Operation result code. 'SUCCESS' for successful operations. In bulk
            operations (DELETE 207), individual items may return error codes
            like 'NOT_ALLOWED' or 'INVALID_DATA'.
          enum:
            - SUCCESS
            - NOT_ALLOWED
            - INVALID_DATA
          maxLength: 255
        details:
          $ref: '#/components/schemas/ActionResultDetails'
        message:
          type: string
          description: Human-readable message describing the operation outcome.
          maxLength: 255
        status:
          type: string
          description: >-
            Overall status of the operation. 'success' for successful
            operations, 'error' for failed individual items in bulk operations.
          enum:
            - success
            - error
          maxLength: 255
      required:
        - code
        - details
        - message
        - status
      title: Field Update Action Result
    PostfieldupdatesResponse201:
      type: object
      x-zs-$id: PostfieldupdatesResponse201
      additionalProperties: false
      description: >-
        Success response returned when a field update action is created.
        Contains an array with a single result object indicating the outcome and
        the server-generated ID of the new field update.
      x-zs-llm-description: >-
        Success response after POST creation. Contains the created field update
        action ID in the result details.
      properties:
        field_updates:
          type: array
          description: >-
            Array containing the result of the create operation. Always contains
            exactly one item since only one field update can be created per
            request.
          items:
            $ref: '#/components/schemas/FieldUpdateActionResult'
          maxItems: 1
      title: Create Field Update Success Response
    InvalidDataGenericError:
      type: object
      x-zs-$id: InvalidDataGenericError
      additionalProperties: false
      description: Returned when the field_updates value has an invalid data type.
      x-zs-llm-description: >-
        Invalid data type for the field_updates key. Verify the request body
        structure matches the expected schema.
      properties:
        code:
          type: string
          description: Represents the error code.
          enum:
            - INVALID_DATA
        details:
          type: object
          additionalProperties: false
          description: Error details with validation information
          properties:
            api_name:
              type: string
              description: API name of the field that caused the error.
              maxLength: 255
            json_path:
              type: string
              description: JSON path to the field in the request body.
              maxLength: 1000
        message:
          type: string
          description: Represents the error message.
          enum:
            - invalid data
            - the fieldId given seems to be invalid
        status:
          type: string
          description: Error status
          enum:
            - error
      required:
        - code
        - details
        - message
        - status
      title: Invalid Data Generic Error
    UpdateFieldUpdateSuccessResponse:
      type: object
      x-zs-$id: UpdateFieldUpdateSuccessResponse
      additionalProperties: false
      description: >-
        Success response payload returned after a field update action is
        modified.
      x-zs-llm-description: >-
        Confirms the PUT update succeeded. Contains the updated field update
        action ID.
      properties:
        field_updates:
          type: array
          description: >-
            Array containing the updated field update action. Contains exactly
            one item.
          items:
            $ref: '#/components/schemas/FieldUpdateActionResult'
          maxItems: 1
    FieldDetails:
      type: object
      additionalProperties: false
      description: >
        Identifies the target field to update. Requires both id and api_name; if
        they refer to different fields, the request fails with
        AMBIGUITY_DURING_PROCESSING.
      x-zs-llm-description: >-
        Identifies the field to be updated; both id and api_name are required at
        call time  look them up via GET /settings/fields?module={api_name}.
        Dependency rules: Pipeline fields need Stage in dependent_fields; Layout
        fields need Pipeline (with nested Stage); Owner fields need notify and
        related_records. Supplying a mismatched id and api_name triggers
        AMBIGUITY_DURING_PROCESSING.
      properties:
        ui_type:
          type: integer
          format: int32
          description: >-
            Internal UI type code for the field. Present only in response; not
            required in requests.
        id:
          type: string
          description: >-
            Unique identifier of the CRM field. Mandatory in create/update
            payloads.
          maxLength: 255
          example: '3361265000000236001'
        api_name:
          type: string
          description: >-
            API name of the CRM field (e.g., Deal_Name, Pipeline, Owner, Layout,
            Multi_Select_1).
          maxLength: 255
          example: Pipeline
        field_label:
          type: string
          description: Display label of the CRM field, as shown in the CRM UI.
          maxLength: 255
          example: Last_Name
        data_type:
          type: string
          description: Data type of the CRM field, for example text, picklist, or lookup.
          maxLength: 255
          example: text
      required:
        - id
        - api_name
      title: Field Details
    InvalidDataTypeError:
      type: object
      x-zs-$id: InvalidDataTypeError
      additionalProperties: false
      description: >-
        Returned when a field value type does not match the expected data type
        for the target field configuration.
      x-zs-llm-description: >-
        A field value type does not match what the target field expects. Check
        the field's metadata for valid data types.
      properties:
        code:
          type: string
          description: Represents the error code.
          enum:
            - INVALID_DATA
        details:
          type: object
          additionalProperties: false
          description: Error details with validation information
          properties:
            api_name:
              type: string
              description: API name of the field that caused the error.
              maxLength: 255
            json_path:
              type: string
              description: JSON path to the field in the request body.
              maxLength: 1000
            supported_values:
              type: array
              description: List of values supported for the field.
              items:
                type: string
                description: One supported value for the field.
                maxLength: 255
              maxItems: 25
          required:
            - api_name
            - json_path
            - supported_values
        message:
          type: string
          description: Represents the error message.
          enum:
            - Invalid data
        status:
          type: string
          description: Error status
          enum:
            - error
      required:
        - code
        - details
        - message
        - status
      title: Invalid Data Type Error
    LockStatus:
      type: object
      additionalProperties: false
      description: >-
        Indicates whether a particular component is locked, affecting its
        editability and deletability.
      x-zs-llm-description: >-
        Indicates whether the field update is locked (non-editable). Locked
        actions are managed by their parent automation.
      properties:
        locked:
          type: boolean
          description: True when the action is locked and cannot be edited or deleted.
      title: Lock Status
    ActionResultDetails:
      type: object
      additionalProperties: false
      description: >-
        Details object within an action result, containing the server-generated
        unique identifier of the created, updated, or deleted field update
        action.
      x-zs-llm-description: >-
        Contains the server-generated unique ID of the created, updated, or
        deleted field update. Use this ID for subsequent operations.
      properties:
        id:
          type: string
          description: >-
            Unique identifier of the field update action that was created,
            updated, or deleted.
          maxLength: 255
          example: '3361265000006103128'
          x-zs-$id: FieldUpdateActionResultId
      required:
        - id
      title: Action Result Details
    InvalidFieldUpdateIdError:
      type: object
      x-zs-$id: InvalidFieldUpdateIdError
      additionalProperties: false
      description: Represents an invalid field update ID.
      x-zs-llm-description: >-
        The field update ID in the path does not exist or is malformed. Verify
        via GET list endpoint.
      properties:
        code:
          type: string
          description: Represents the error code.
          enum:
            - INVALID_DATA
        details:
          type: object
          additionalProperties: false
          description: Error details with validation information
          properties:
            resource_path_index:
              type: integer
              format: int32
              description: Index of the resource path segment that contains the invalid ID.
        message:
          type: string
          description: Represents the error message.
          enum:
            - the id given seems to be invalid
        status:
          type: string
          description: Error status
          enum:
            - error
      required:
        - code
        - details
        - message
        - status
      title: Invalid Field Update Id Error
    DependentFieldsNested:
      type: object
      additionalProperties: false
      description: >
        A dependent field that must be included alongside the target field's
        value, used when the target field's valid options depend on another
        field (for example, Pipeline requires Stage). Supports nesting up to 3
        levels.
      x-zs-llm-description: >-
        A field that must be included alongside the target field's value, with
        nesting supported up to 3 levels. Requires field ({id, api_name}) and
        value (string). Dependency chains: Pipeline needs Stage (1 level),
        Layout needs Pipeline which needs Stage (2 levels using nested
        dependent_fields).
      properties:
        field:
          $ref: '#/components/schemas/FieldDetails'
          description: Specify the API name and ID of the dependent field to be updated.
        dependent_fields:
          type: array
          description: >-
            Nested dependent fields that must be set when the current dependent
            field itself has further dependencies.
          items:
            $ref: '#/components/schemas/DependentFieldsNestedLevel2'
          maxItems: 10
        value:
          type: string
          description: Contains value of the dependent field.
          maxLength: 255
      required:
        - field
        - value
    DependentFieldsNestedLevel2:
      type: object
      additionalProperties: false
      description: >-
        Second-level dependent field in a chained dependency. Example: Stage in
        a Pipeline -> Stage chain.
      x-zs-llm-description: >-
        Second-level dependent field in a chained dependency (e.g., Stage
        depends on Pipeline). Must match its parent field's value.
      properties:
        field:
          $ref: '#/components/schemas/FieldDetails'
          description: Specify the API name and ID of the dependent field to be updated.
        dependent_fields:
          type: array
          description: Third-level dependent fields for deeper dependency chains.
          items:
            $ref: '#/components/schemas/DependentFieldsNestedLevel3'
          maxItems: 10
        value:
          type: string
          description: Contains value of the dependent field.
          maxLength: 255
      required:
        - field
        - value
    DependentFieldsNestedLevel3:
      type: object
      additionalProperties: false
      description: >-
        Third-level (deepest) dependent field in a chained dependency. No
        further nesting is supported beyond this level.
      x-zs-llm-description: >-
        Third-level (deepest) dependent field. No further nesting is supported.
        Must be consistent with level-2 parent.
      properties:
        field:
          $ref: '#/components/schemas/FieldDetails'
          description: Specify the API name and ID of the dependent field to be updated.
        value:
          type: string
          description: Contains value of the dependent field.
          maxLength: 255
      required:
        - field
        - value
    DependentFieldMissingError:
      type: object
      x-zs-$id: DependentFieldMissingError
      additionalProperties: false
      description: >-
        Returned when one or more required dependent fields are missing from the
        request.
      x-zs-llm-description: >-
        Required dependent fields are missing. When updating a field with
        dependencies, all dependent fields in the chain must be included.
      properties:
        code:
          type: string
          description: Represents the error code.
          enum:
            - DEPENDENT_FIELD_MISSING
        details:
          type: object
          additionalProperties: false
          description: Error details with validation information
          properties:
            dependee:
              type: object
              additionalProperties: false
              description: Identifies the field that requires the missing dependent field.
              properties:
                api_name:
                  type: string
                  description: API name of the field that requires the dependent field.
                  maxLength: 255
                json_path:
                  type: string
                  description: JSON path to the field that requires the dependent field.
                  maxLength: 1000
              required:
                - api_name
                - json_path
            api_name:
              type: string
              description: API name of the missing dependent field.
              maxLength: 255
            json_path:
              type: string
              description: JSON path to the missing dependent field.
              maxLength: 1000
          required:
            - dependee
            - api_name
            - json_path
        message:
          type: string
          description: Represents the error message.
          enum:
            - Dependent Field missing
            - Field update action related module missing for kiosk feature
        status:
          type: string
          description: Error status
          enum:
            - error
      required:
        - code
        - details
        - message
        - status
      title: Dependent Field Missing Error
    CreatedBy:
      type: object
      additionalProperties: false
      description: >-
        User who created the field update action, including display name and
        unique identifier.
      x-zs-llm-description: Read-only audit field showing who created this field update action.
      properties:
        name:
          type: string
          description: Display name of the user who created the resource.
          maxLength: 255
        id:
          type: string
          description: Unique identifier of the user who created the resource.
          maxLength: 255
      title: Created By
    FieldApiAmbiguityError:
      type: object
      x-zs-$id: FieldApiAmbiguityError
      additionalProperties: false
      description: >-
        Returned when the provided field ID and field API name do not refer to
        the same CRM field.
      x-zs-llm-description: >-
        The field ID and field api_name point to different CRM fields. Supply
        only one identifier or ensure both refer to the same field.
      properties:
        code:
          type: string
          description: Represents the error code.
          enum:
            - AMBIGUITY_DURING_PROCESSING
        details:
          type: object
          additionalProperties: false
          description: Error details with validation information
          properties:
            ambiguity_due_to:
              type: array
              description: >-
                Field references whose id and api_name values do not match,
                causing the ambiguity.
              items:
                type: object
                additionalProperties: false
                description: One field reference whose id and api_name values conflict.
                properties:
                  api_name:
                    type: string
                    description: API name of the conflicting field reference.
                    maxLength: 255
                  json_path:
                    type: string
                    description: JSON path to the conflicting field reference.
                    maxLength: 1000
                required:
                  - api_name
                  - json_path
              maxItems: 25
          required:
            - ambiguity_due_to
        message:
          type: string
          description: Represents the error message.
          enum:
            - The field api name seems to be invalid
        status:
          type: string
          description: Error status
          enum:
            - error
      required:
        - code
        - details
        - message
        - status
      title: Field Api Ambiguity Error
    MissingFieldUpdateIdError:
      type: object
      x-zs-$id: MissingFieldUpdateIdError
      additionalProperties: false
      description: Indicates that no field update ID was provided for the edit operation.
      x-zs-llm-description: >-
        No field update ID was provided for the edit/delete operation. Include
        the ID in the URL path.
      properties:
        code:
          type: string
          description: Represents the error code.
          enum:
            - REQUIRED_PARAM_MISSING
        details:
          type: object
          additionalProperties: false
          description: Error details with validation information
          properties:
            param_name:
              type: string
              description: Name of the missing required parameter.
              maxLength: 255
        message:
          type: string
          description: Represents the error message.
          enum:
            - the id given seems to be invalid
        status:
          type: string
          description: Error status
          enum:
            - error
      required:
        - code
        - details
        - message
        - status
      title: Missing Field Update Id Error
    RelatedRecordModule:
      type: object
      additionalProperties: false
      description: >-
        Identifies a related module whose open records' ownership should be
        transferred alongside the parent record when the Owner field is updated.
        Available modules depend on the parent module context.
      x-zs-llm-description: >-
        Identifies a related module whose records' ownership transfers alongside
        the parent when the Owner field is updated.
      properties:
        api_name:
          type: string
          description: >-
            API name of the related module. Events, Calls, Tasks - open activity
            records, available for all modules. Contacts - available only when
            the parent module is Accounts. Deals - available when the parent
            module is Accounts or Contacts.
          enum:
            - Events
            - Calls
            - Tasks
            - Contacts
            - Deals
          maxLength: 255
          example: Events
        id:
          type: string
          description: >-
            Unique identifier of the related module. This is the module ID
            corresponding to the api_name.
          maxLength: 255
          example: '3361265000000000145'
      required:
        - api_name
      title: Related Record Module
    DeleteFieldUpdateSuccessResponse:
      type: object
      x-zs-$id: DeleteFieldUpdateSuccessResponse
      additionalProperties: false
      description: Indicates that the field update was deleted successfully.
      x-zs-llm-description: Confirms the field update action was deleted successfully.
      properties:
        field_updates:
          type: array
          description: >-
            Array containing the deleted field update action. Contains exactly
            one item.
          items:
            $ref: '#/components/schemas/FieldUpdateActionResult'
          maxItems: 1
    DeleteFieldUpdateReadOnlyActionError:
      type: object
      x-zs-$id: DeleteFieldUpdateReadOnlyActionError
      additionalProperties: false
      description: Returned when attempting to delete a read-only field update action.
      x-zs-llm-description: >-
        Cannot delete a read-only field update action. These are system-managed
        and cannot be removed.
      properties:
        code:
          type: string
          description: Represents the error code.
          enum:
            - NOT_ALLOWED
        details:
          type: object
          additionalProperties: false
          description: Error details with validation information
          properties:
            resource_path_index:
              type: integer
              format: int32
              description: Index of the resource path segment related to the error.
        message:
          type: string
          description: Represents the error message.
          example: field update can not be deleted
          maxLength: 255
        status:
          type: string
          description: Error status
          enum:
            - error
      required:
        - code
        - details
        - message
        - status
      title: Delete Field Update Read Only Action Error
    ModifiedBy:
      type: object
      additionalProperties: false
      description: >-
        User who last modified the field update action, including display name
        and unique identifier.
      x-zs-llm-description: >-
        Read-only audit field showing who last modified this field update
        action.
      properties:
        name:
          type: string
          description: Display name of the user who last modified the resource.
          maxLength: 255
        id:
          type: string
          description: Unique identifier of the user who last modified the resource.
          maxLength: 255
      title: Modified By
    UnsupportedKeyNotAllowedError:
      type: object
      x-zs-$id: UnsupportedKeyNotAllowedError
      additionalProperties: false
      description: >-
        Returned when the request contains keys that are not supported for the
        selected field update configuration.
      x-zs-llm-description: >-
        The request contains keys not supported for this field update type.
        Remove unsupported keys based on the selected field type.
      properties:
        code:
          type: string
          description: Represents the error code.
          enum:
            - NOT_ALLOWED
        details:
          type: object
          additionalProperties: false
          description: Error details with validation information
          properties:
            api_name:
              type: string
              description: API name of the field that is not supported for this action.
              maxLength: 255
            json_path:
              type: string
              description: JSON path to the field in the request body.
              maxLength: 1000
          required:
            - api_name
            - json_path
        message:
          type: string
          description: Represents the error message.
          enum:
            - This key is not supported for this particular action
            - The given module is not supported
            - Field cannot be updated
        status:
          type: string
          description: Error status
          enum:
            - error
      required:
        - code
        - details
        - message
        - status
      title: Unsupported Key Not Allowed Error
    MandatoryFieldMissingError:
      type: object
      x-zs-$id: MandatoryFieldMissingError
      additionalProperties: false
      description: Returned when a required field is missing in the request payload.
      x-zs-llm-description: >-
        A required field is missing from the request body. Check details for the
        missing field name.
      properties:
        code:
          type: string
          description: Represents the error code.
          enum:
            - MANDATORY_NOT_FOUND
        details:
          type: object
          additionalProperties: false
          description: Error details with validation information
          properties:
            api_name:
              type: string
              description: API name of the missing required field.
              maxLength: 255
            json_path:
              type: string
              description: JSON path to the missing required field.
              maxLength: 1000
          required:
            - api_name
            - json_path
        message:
          type: string
          description: Represents the error message.
          enum:
            - Required field is missing
            - please specify value
            - please specify dependency fieldId
            - required field not found
            - Please specify update_type
            - please specify tabId and module api name
            - Please specify name
            - please specify fieldId and fieldName
            - The required data missing
        status:
          type: string
          description: Error status
          enum:
            - error
      required:
        - code
        - details
        - message
        - status
      title: Mandatory Field Missing Error
    ExpectedFieldMissingError:
      type: object
      x-zs-$id: ExpectedFieldMissingError
      additionalProperties: false
      description: >-
        Returned when a required nested object (e.g., field) is provided but
        empty  - at least one identifying property (api_name or id) must be
        specified.
      x-zs-llm-description: >-
        A required nested object (e.g., field) was provided empty. Supply at
        least api_name or id inside the object.
      properties:
        code:
          type: string
          description: Represents the error code.
          enum:
            - EXPECTED_FIELD_MISSING
        details:
          type: object
          additionalProperties: false
          description: Error details listing the expected fields that were missing
          properties:
            expected_fields:
              type: array
              description: List of fields where at least one must be provided
              items:
                type: object
                additionalProperties: false
                description: An expected field that was not provided in the request
                properties:
                  api_name:
                    type: string
                    description: API name of the expected field
                    maxLength: 255
                  json_path:
                    type: string
                    description: JSON path to the expected field in the request body
                    maxLength: 1000
                required:
                  - api_name
                  - json_path
              maxItems: 10
          required:
            - expected_fields
        message:
          type: string
          description: Represents the error message.
          maxLength: 255
        status:
          type: string
          description: Error status
          enum:
            - error
      required:
        - code
        - details
        - message
        - status
      title: Expected Field Missing Error
    InvalidDataFieldValidationError:
      type: object
      x-zs-$id: InvalidDataFieldValidationError
      additionalProperties: false
      description: >-
        Returned when the API validates a field value against its domain rules
        and finds it invalid  - for example, a non-existent module ID, an
        unknown field API name, or a name containing disallowed characters.
        Distinguished from data-type validation errors by the context-specific
        message.
      x-zs-llm-description: >-
        Field value fails domain validation  e.g., non-existent module for
        transfer_ownership, invalid picklist value. Verify against field
        metadata.
      properties:
        code:
          type: string
          description: Represents the error code.
          enum:
            - INVALID_DATA
        details:
          type: object
          additionalProperties: false
          description: Error details identifying the invalid field
          properties:
            api_name:
              type: string
              description: API name of the field that failed validation
              maxLength: 255
            json_path:
              type: string
              description: JSON path to the invalid field in the request body
              maxLength: 1000
          required:
            - api_name
            - json_path
        message:
          type: string
          description: Context-specific error message describing the validation failure
          enum:
            - the tabId given seems to be invalid
            - the tabName given seems to be invalid
            - the fieldId given seems to be invalid
            - >-
              field update name should not contain the following special
              character #%^&*()
            - the value given seems to be invalid
            - the given feature name is invalid
        status:
          type: string
          description: Error status
          enum:
            - error
      required:
        - code
        - details
        - message
        - status
      title: Invalid Data Field Validation Error
    DependentMismatchError:
      type: object
      x-zs-$id: DependentMismatchError
      additionalProperties: false
      description: >-
        Returned when a field's value is invalid in the context of its dependent
        field. For example, passing an unsupported type value for the given
        target field.
      x-zs-llm-description: >-
        The field's value is invalid in context of its dependent field. Verify
        that dependent field values are compatible with their parent.
      properties:
        code:
          type: string
          description: Represents the error code.
          enum:
            - DEPENDENT_MISMATCH
        details:
          type: object
          additionalProperties: false
          description: Error details identifying the mismatched dependency
          properties:
            dependee:
              type: object
              additionalProperties: false
              description: The field that the invalid value depends on
              properties:
                api_name:
                  type: string
                  description: API name of the dependee field
                  maxLength: 255
                json_path:
                  type: string
                  description: JSON path to the dependee field
                  maxLength: 1000
              required:
                - api_name
                - json_path
            api_name:
              type: string
              description: API name of the field with the invalid value
              maxLength: 255
            json_path:
              type: string
              description: JSON path to the field with the invalid value
              maxLength: 1000
          required:
            - dependee
            - api_name
            - json_path
        message:
          type: string
          description: Represents the error message.
          maxLength: 255
          enum:
            - Dependent Field is not matching
        status:
          type: string
          description: Error status
          enum:
            - error
      required:
        - code
        - details
        - message
        - status
      title: Dependent Mismatch Error
    UpdateFieldUpdateMissingPathIdError:
      type: object
      x-zs-$id: UpdateFieldUpdateMissingPathIdError
      additionalProperties: false
      description: >-
        Returned when the field update ID path segment is missing in the update
        request URL.
      x-zs-llm-description: >-
        The field update ID is missing from the PUT request URL path. Include
        /{id} in the URL.
      properties:
        code:
          type: string
          description: Represents the error code.
          enum:
            - REQUIRED_PARAM_MISSING
        details:
          type: object
          additionalProperties: false
          description: Error details identifying the missing path segment
          properties:
            resource_path_index:
              type: integer
              format: int32
              description: Index of the missing resource path segment.
        message:
          type: string
          description: Represents the error message.
          example: One of the expected parameter is missing
          maxLength: 255
        status:
          type: string
          description: Error status
          enum:
            - error
      required:
        - code
        - details
        - message
        - status
      title: Update Field Update Missing Path Id Error
    UpdateFieldUpdateReadOnlyActionError:
      type: object
      x-zs-$id: UpdateFieldUpdateReadOnlyActionError
      additionalProperties: false
      description: Returned when attempting to edit a read-only field update action.
      x-zs-llm-description: Cannot edit a read-only field update action. These are system-managed.
      properties:
        code:
          type: string
          description: Represents the error code.
          enum:
            - NOT_ALLOWED
        details:
          type: object
          additionalProperties: false
          description: Error details
          properties:
            resource_path_index:
              type: integer
              format: int32
              description: Index of the resource path used in the request.
        message:
          type: string
          description: Represents the error message.
          example: Insufficient privileges to edit action
          maxLength: 255
        status:
          type: string
          description: Error status
          enum:
            - error
      required:
        - code
        - details
        - message
        - status
      title: Update Field Update Read Only Action Error
    UpdateFieldUpdateLockedActionPermissionError:
      type: object
      x-zs-$id: UpdateFieldUpdateLockedActionPermissionError
      additionalProperties: false
      description: >-
        Returned when the target field update is locked and the user lacks
        privilege to modify it.
      x-zs-llm-description: >-
        The field update is locked and the user lacks permission to modify it.
        Unlock via parent automation or use a higher-privilege account.
      properties:
        code:
          type: string
          description: Represents the error code.
          enum:
            - NO_PERMISSION
        details:
          type: object
          additionalProperties: false
          description: Error details
          properties:
            resource_path_index:
              type: integer
              format: int32
              description: Index of the resource path used in the request.
        message:
          type: string
          description: Represents the error message.
          example: Insufficient privileges to edit locked action
          maxLength: 255
        status:
          type: string
          description: Error status
          enum:
            - error
      required:
        - code
        - details
        - message
        - status
      title: Update Field Update Locked Action Permission Error
    InvalidFieldValueTypeError:
      type: object
      x-zs-$id: InvalidFieldValueTypeError
      additionalProperties: false
      description: >-
        Returned when a request field value has an invalid data type for the
        selected field update configuration.
      x-zs-llm-description: >-
        The request field value has an invalid data type for the selected field
        update configuration. Check expected types via field metadata.
      properties:
        code:
          type: string
          description: Represents the error code.
          enum:
            - INVALID_DATA
        details:
          type: object
          additionalProperties: false
          description: Error details with validation information
          properties:
            expected_data_type:
              type: string
              description: Expected data type for the field.
              maxLength: 255
            api_name:
              type: string
              description: API name of the field with the invalid value type.
              maxLength: 255
            json_path:
              type: string
              description: JSON path to the field in the request body.
              maxLength: 1000
          required:
            - expected_data_type
            - api_name
            - json_path
        message:
          type: string
          description: Represents the error message.
          example: Invalid data type
          maxLength: 255
        status:
          type: string
          description: Error status
          enum:
            - error
      required:
        - code
        - details
        - message
        - status
      title: Invalid Field Value Type Error
    AssociatedFieldUpdateNotAllowedError:
      type: object
      x-zs-$id: AssociatedFieldUpdateNotAllowedError
      additionalProperties: false
      description: >-
        Field update deletion is not allowed because it is associated with an
        automation feature.
      x-zs-llm-description: >-
        Cannot delete  the field update is associated with an automation
        feature. Remove the association first.
      properties:
        code:
          type: string
          description: Represents the error code.
          enum:
            - NOT_ALLOWED
        details:
          type: object
          additionalProperties: false
          description: Error details with validation information
          properties:
            resource_path_index:
              type: integer
              format: int32
              description: >-
                Index of the field update entry in the request array that is
                associated with an automation feature.
        message:
          type: string
          description: Represents the error message.
          enum:
            - >-
              This field update is associated with at least one of Approval
              Process/Workflow Rules/Blueprint
            - This key is not supported for this particular action
        status:
          type: string
          description: Error status
          enum:
            - error
      required:
        - code
        - details
        - message
        - status
      title: Associated Field Update Not Allowed Error
    FieldUpdatesListResponse:
      type: object
      x-zs-$id: FieldUpdatesListResponse
      additionalProperties: false
      description: >-
        Successful response for listing field update actions. Contains an array
        of field update definitions configured in the org along with pagination
        metadata.
      x-zs-llm-description: >-
        Paginated list response containing field update definitions and
        pagination info. Check info.more_records for additional pages.
      properties:
        field_updates:
          type: array
          description: List of field update actions configured in the org.
          items:
            $ref: '#/components/schemas/FieldUpdateConfigurationForList'
          maxItems: 200
        info:
          $ref: '#/components/schemas/PaginationInfo'
      title: Field Updates List Response
    FieldUpdateConfigurationForList:
      type: object
      additionalProperties: false
      description: >-
        Represents one field update action returned by the list API, including
        field configuration, update behavior, module context, and audit
        metadata.
      x-zs-llm-description: >-
        Full field update action object from GET list. Contains field
        configuration, update behavior, module context, and audit metadata.
      properties:
        created_time:
          $ref: '#/components/schemas/FieldUpdateActionCreatedTime'
        update_type:
          $ref: '#/components/schemas/FieldUpdateUpdateType'
          description: >-
            Specifies how the field value should be applied when the target
            field supports multiple update strategies (e.g., multi-select
            picklist, Owner). Null when the field type does not support multiple
            update strategies (e.g., text, single picklist).
        lock_status:
          $ref: '#/components/schemas/LockStatus'
          description: >-
            Indicates whether this field update action is locked for
            edit/delete.
        apply_assignment_threshold:
          type: boolean
          description: >-
            Whether assignment-threshold rules (record count limits per user)
            should be enforced when updating the field. Only applicable when the
            target field is an Owner field and the org has assignment thresholds
            configured. When true, the system checks whether the new owner has
            reached their record limit before applying the update. Ignored for
            non-Owner fields.
        editable:
          type: boolean
          description: Whether the current user can edit this field update action.
        module:
          $ref: '#/components/schemas/ModuleDetails'
          description: Primary CRM module on which this field update action is configured.
        related_module:
          $ref: '#/components/schemas/RelatedModuleDetails'
          description: >-
            Related module context when the automation is configured on related
            records; null when not applicable.
        deletable:
          type: boolean
          description: >-
            Represents whether the current user can delete this field update
            action.
        source:
          type: string
          description: Source application that created or manages this action (e.g., crm).
          maxLength: 255
        type:
          $ref: '#/components/schemas/FieldUpdateTypeResponse'
          description: >-
            Type returned by the API for this field update. Create/update
            accepts only static; GET responses can include merge_field for
            pre-existing actions.
        created_by:
          $ref: '#/components/schemas/CreatedBy'
          description: User who created this field update action.
        notify:
          type: boolean
          description: >-
            Whether to send an email notification to the new record owner when
            the Owner field is updated via this action. Only applicable when the
            target field is an Owner field. When true, the newly assigned owner
            receives an email informing them of the ownership change. Ignored
            for non-Owner fields.
        feature_type:
          $ref: '#/components/schemas/FieldUpdateFeatureType'
          description: Automation feature where this field update action is used.
        modified_time:
          $ref: '#/components/schemas/FieldUpdateActionModifiedTime'
        field:
          $ref: '#/components/schemas/FieldDetails'
          description: The target CRM field that this action updates.
        dependent_fields:
          type:
            - array
            - 'null'
          description: >-
            Dependent fields that must be set alongside the target field when
            dependency rules apply. Includes patterns such as Pipeline -> Stage
            and Layout -> Pipeline -> Stage (nested). Nested dependencies can be
            represented through dependent_fields within each item. Null when the
            target field has no dependency rules configured.
          items:
            $ref: '#/components/schemas/DependentFieldsNested'
          maxItems: 10
        associated:
          type: boolean
          description: >-
            Whether this action is currently linked to any automation rule,
            approval process, or blueprint.
        related_records:
          type:
            - array
            - 'null'
          description: >-
            List of related modules whose record ownership should also be
            transferred along with the parent record when the Owner field is
            updated. Only applicable when the target field is an Owner field.
            Common activity modules (Tasks, Calls, Events) are available for all
            modules. Additional related modules are available depending on the
            parent module: Accounts can also include Contacts and Deals;
            Contacts can also include Deals. Null when the target field is not
            an Owner field or when no related modules are selected for ownership
            transfer.
          items:
            $ref: '#/components/schemas/RelatedRecordModule'
          maxItems: 5
        name:
          type: string
          description: Display name of the field update action.
          maxLength: 255
        modified_by:
          $ref: '#/components/schemas/ModifiedBy'
          description: User who last modified this field update action.
        id:
          x-zs-$id: FieldUpdatesId
          $ref: '#/components/schemas/FieldUpdateActionId'
        value:
          description: >-
            The value configured for the field update. The shape depends on the
            target field type.
          oneOf:
            - type: string
              x-zs-$id: ListStringValue
              maxLength: 255
              description: >-
                A plain text value. Used when the target field is a single-value
                field such as a text field (e.g., Deal_Name), picklist (e.g.,
                Pipeline, Stage), number, date, or similar scalar field types.
                Example: "PostTest", "Qualification".
            - type: array
              x-zs-$id: ListArrayValue
              description: >-
                An array of selected option values. Used when the target field
                is a multi-select picklist. Each element represents one selected
                option. Example: ["Option 1", "Option 2"].
              items:
                type: string
                description: One selected option value for the multi-select field.
                maxLength: 255
              maxItems: 25
            - type: object
              x-zs-$id: ListObjectValue
              additionalProperties: true
              description: >-
                A structured object value. Used when the target field requires
                composite data  - for example, a Layout field (with id, name,
                display_label), an Owner/user-lookup field (with id, name), or
                other lookup-type fields that resolve to a resource with an
                identifier.
            - type: boolean
              x-zs-$id: ListBooleanValue
              description: >-
                A boolean value. Used when the target field is a checkbox or
                boolean-type field. true enables/checks the field, false
                disables/unchecks it.
            - type: number
              x-zs-$id: ListNumberValue
              description: >-
                A numeric value. Used when the target field is a number,
                currency, decimal, or percentage field type. Example: 100, 25.5.
            - type: 'null'
              x-zs-$id: ListNullValue
              description: >-
                A null value. Used to clear/empty the target field  - equivalent
                to choosing 'empty value' in the field update configuration.
        parent_module:
          type:
            - object
            - 'null'
          additionalProperties: false
          description: >-
            Parent module context when the field update is configured on a child
            module. Null when the field update is on a top-level module.
          properties:
            api_name:
              type: string
              description: API name of the parent CRM module.
              maxLength: 255
            id:
              type: string
              description: Unique identifier of the parent CRM module.
              maxLength: 20
      required:
        - module
        - name
        - field
        - type
        - value
      title: Field Update Configuration For List
    FieldUpdateActionCreatedTime:
      type: string
      description: Date-time when this field update action was created.
      x-zs-llm-description: Read-only ISO date-time string set by the server on creation.
      maxLength: 255
      example: '2025-11-20T22:34:38-08:00'
      title: Field Update Action Created Time
    FieldUpdateActionModifiedTime:
      type: string
      description: Date-time when this field update action was last modified.
      x-zs-llm-description: >-
        Read-only ISO date-time string updated by the server on every
        modification.
      maxLength: 255
      example: '2025-11-20T22:34:38-08:00'
      title: Field Update Action Modified Time
    FieldUpdateActionId:
      type: string
      x-zs-$id: FieldUpdatesId
      description: Unique identifier of the field update action.
      x-zs-llm-description: >-
        Read-only unique ID of this field update action. Use this value to
        reference the action in workflow rules.
      maxLength: 20
      example: '3361265000006176255'
      title: Field Update Action Id
    FieldUpdateFeatureType:
      type: string
      description: >-
        Automation feature where this field update action is used. Supports
        baseline features plus connected_workflows. No cadence support.
      x-zs-llm-description: >-
        Enum identifying which automation feature owns this field update.
        Supports workflow, approval_process, blueprint, orchestration, etc. No
        cadence support.
      enum:
        - workflow
        - approval_process
        - blueprint_transition
        - blueprint_state
        - assignment_rules
        - kiosk
        - commandcenter_service
        - connected_workflows
      maxLength: 255
      title: Field Update Feature Type
    FieldUpdateUpdateType:
      type:
        - string
        - 'null'
      description: >-
        Specifies how the new value is applied to a multi-select picklist or
        Owner field: overwrite replaces the existing value, append adds to the
        existing entries. Omit or set to null for single-value fields.
      x-zs-llm-description: >-
        Defines how the new value is applied to the field. Needed for
        multi-select picklist and Owner fields: 'overwrite' replaces everything,
        'append' adds to existing entries (valid for multi-select and Owner with
        related_records). For single-value fields (text, single picklist, date)
        pass null or omit this property entirely.
      enum:
        - overwrite
        - append
        - null
      maxLength: 255
      title: Field Update Update Type
    FieldUpdateType:
      type: string
      description: >-
        The mapping type used when creating or updating the field update action.
        Only static is accepted; merge_field appears only in GET responses for
        existing actions.
      x-zs-llm-description: >-
        Declares the mapping strategy for the field value during create or
        update; only 'static' (a fixed literal) is accepted. merge_field is not
        valid in POST/PUT  it only shows up in GET responses for actions that
        were created before this restriction.
      enum:
        - static
      maxLength: 255
      title: Field Update Type
    FieldUpdateTypeResponse:
      type: string
      x-zs-$id: FieldUpdateTypeResponse
      description: >-
        Response-only field update type. Create/update supports only static,
        while GET responses may include merge_field for pre-existing actions.
      x-zs-llm-description: >-
        The field update execution type. 'static' is the only creatable type;
        'merge_field' may appear in GET responses for legacy actions.
      enum:
        - static
        - merge_field
      maxLength: 255
      title: Field Update Type Response
    FieldUpdateStringValue:
      type: string
      x-zs-$id: FieldUpdateStringValue
      description: >-
        A string value used for text, single-picklist, date, or Pipeline fields.
        Picklist and Pipeline values are validated against the field's
        configured options.
      x-zs-llm-description: >-
        A plain string assigned to text, single picklist, date, or Pipeline
        fields. Picklist values are checked against allowed options at creation
        time; retrieve valid choices from GET
        /settings/fields?module={api_name}. For Pipeline: look up the valid
        value via GET /settings/pipeline?module={api_name}.
      maxLength: 255
      example: Test
      title: Field Update String Value
    FieldUpdateArrayValue:
      type: array
      x-zs-$id: FieldUpdateArrayValue
      description: >-
        An array of string values used for multi-select picklist fields, where
        each element represents one selected option.
      x-zs-llm-description: >-
        A list of string options for multi-select picklist fields where every
        element is one chosen option. Pair with update_type='overwrite' to
        replace all selections or 'append' to add to the current set.
      items:
        type: string
        description: Individual option value for the multi-select field.
        maxLength: 255
      maxItems: 25
      example:
        - Option 1
        - Option 2
      title: Field Update Array Value
    FieldUpdateOwnerValue:
      type: object
      x-zs-$id: FieldUpdateOwnerValue
      additionalProperties: false
      description: >-
        An object value used for Owner or Layout fields, identified by id (a
        user ID for Owner fields or a layout ID for Layout fields), with an
        optional name for display.
      x-zs-llm-description: >-
        An object used as the value for Owner or Layout fields. id is required 
        supply a user ID sourced from GET /users or a layout ID from GET
        /settings/layouts; name is an optional display label. For Owner fields,
        also configure notify and related_records on the parent object.
      properties:
        id:
          type: string
          description: Unique identifier of the user to assign as the new owner.
          maxLength: 255
          example: '3361265000000535001'
        name:
          type: string
          description: Optional display name for readability.
          maxLength: 255
          example: John Doe
      required:
        - id
      title: Field Update Object Reference Value
    FieldUpdateBooleanValue:
      type: boolean
      x-zs-$id: FieldUpdateBooleanValue
      description: >-
        A boolean value used for checkbox fields, where true marks the field as
        checked and false marks it as unchecked.
      x-zs-llm-description: >-
        A true/false value for checkbox-type fields where true marks the field
        as checked/enabled and false marks it as unchecked/disabled.
      title: Field Update Boolean Value
    FieldUpdateNumberValue:
      type: number
      x-zs-$id: FieldUpdateNumberValue
      description: >-
        A numeric value used for number, currency, decimal, or percentage
        fields.
      x-zs-llm-description: >-
        A numeric value applied to fields typed as number, currency, decimal, or
        percentage.
      example: 1000.5
      title: Field Update Number Value
    FieldUpdateNullValue:
      type: 'null'
      x-zs-$id: FieldUpdateNullValue
      description: >-
        Null value  - clears/empties the target field, removing any previously
        set value.
      x-zs-llm-description: >-
        Null literal  clears/empties the target field, removing any previously
        set value.
      title: Field Update Null Value
    RelatedModuleDetails:
      type:
        - object
        - 'null'
      additionalProperties: false
      description: >-
        Related module metadata for automation contexts that operate on related
        records. Null when no related module context applies.
      x-zs-llm-description: >-
        Nullable related module metadata. Present when the field update operates
        on a related module's fields. Null otherwise.
      properties:
        api_name:
          type: string
          description: >-
            CRM related-module API name used in automation configuration (e.g.,
            Notes).
          maxLength: 255
          example: Notes
        id:
          type: string
          description: >-
            Unique identifier of the related CRM module corresponding to
            api_name.
          maxLength: 255
          example: '3361265000000002391'
      title: Related Module Details
    ModuleIdApiNameAmbiguityError:
      type: object
      x-zs-$id: ModuleIdApiNameAmbiguityError
      additionalProperties: false
      description: Represents module ID and API name do not match the same module.
      x-zs-llm-description: >-
        The module ID and api_name do not refer to the same module. Supply only
        one identifier or fix the mismatch.
      properties:
        code:
          type: string
          description: Represents the error code.
          enum:
            - AMBIGUITY_DURING_PROCESSING
        details:
          type: object
          additionalProperties: false
          description: Error details with validation information
          properties:
            ambiguity_due_to:
              type: array
              description: >-
                Module references whose id and api_name values do not match,
                causing the ambiguity.
              items:
                type: object
                additionalProperties: false
                description: One module reference whose id and api_name values conflict.
                properties:
                  api_name:
                    type: string
                    description: API name of the conflicting module reference.
                    maxLength: 255
                  json_path:
                    type: string
                    description: JSON path to the conflicting module reference.
                    maxLength: 1000
                required:
                  - api_name
                  - json_path
              maxItems: 25
          required:
            - ambiguity_due_to
        message:
          type: string
          description: Represents the error message.
          enum:
            - The given moduleid seems to be invalid
        status:
          type: string
          description: Error status
          enum:
            - error
      required:
        - code
        - details
        - message
        - status
      title: Module Id Api Name Ambiguity Error
    ModuleDetails:
      type: object
      x-zs-$id: ModuleNestedObject
      additionalProperties: false
      description: >-
        Module metadata for the primary CRM module associated with the field
        update action.
      x-zs-llm-description: >-
        Module metadata for the primary CRM module associated with this field
        update action.
      properties:
        singular_label:
          type: string
          description: >-
            Singular display label of the module (e.g., Deal, Lead). Present
            only in responses.
          maxLength: 255
          example: Deal
        moduleName:
          type: string
          description: Internal module name. Present only in responses.
          maxLength: 255
        id:
          type: string
          description: Unique identifier of the CRM module corresponding to api_name.
