    CreateFieldUpdateRequest:
      type: object
      additionalProperties: false
      description: >-
        The request body wrapper for creating or updating a field update action.
        Must contain a field_updates array with exactly one entry.
      x-zs-llm-description: >-
        Wraps the request body; must include a field_updates array containing
        exactly one entry. On PUT, include every required field (name, module,
        field, type, value) since partial updates are unreliable. type must be
        'static'; field must carry both id and api_name at call time.
      examples:
        - field_updates:
            - name: Assign To Regional Owner
              module:
                api_name: Accounts
              field:
                id: '738964000000091010'
                api_name: Owner
              type: static
              value:
                id: '738964000000030001'
              notify: true
              apply_assignment_threshold: false
              related_records:
                - api_name: Contacts
                - api_name: Deals
        - field_updates:
            - name: Set Pipeline And Stage
              module:
                api_name: Deals
              field:
                id: '3361265000000236001'
                api_name: Pipeline
              type: static
              value: Enterprise Sales
              dependent_fields:
                - field:
                    id: '3361265000000000525'
                    api_name: Stage
                  value: Qualification
      properties:
        field_updates:
          type: array
          description: >-
            Array containing one field update configuration object. Exactly one
            item is allowed per request.
          items:
            $ref: '#/components/schemas/FieldUpdateConfigurationForCreate'
          maxItems: 1
      required:
        - field_updates
      title: Create Field Update Request
    FieldUpdateConfigurationForCreate:
      type: object
      additionalProperties: false
      description: >-
        Defines a single field update action, including the target module,
        target field, mapping type, and the value to apply. Some properties are
        conditionally required depending on the target field's type — for
        example, Owner fields require notify and related_records.
      x-zs-llm-description: >-
        Describes a single field update action. Required: name, module
        ({api_name}), field ({id, api_name}), type ('static'), and a value whose
        shape matches the field's data_type. Conditional: Pipeline field needs a
        string value (pipeline name) and Stage in dependent_fields; Layout field
        needs an object value and Pipeline in dependent_fields; Owner field
        needs value={id}, notify (boolean, required), and related_records
        (array, required  pass null to skip). Optional: update_type ('overwrite'
        or 'append' for multi-select fields), apply_assignment_threshold (Owner
        only).
      properties:
        name:
          type: string
          description: >-
            Name of the field update action. Must be unique within the org. This
            label is displayed in the automation rule configuration UI.
          maxLength: 255
          example: FieldUpdatePOST
        module:
          $ref: '#/components/schemas/ModuleDetails'
          description: >-
            The CRM module where this field update should be applied. Specify
            using the module's unique ID and/or API name (e.g., Deals, Leads,
            Contacts).
        field:
          $ref: '#/components/schemas/FieldDetails'
          description: >-
            Target field to be updated. Provide both field.id and
            field.api_name. If both are present but inconsistent, ambiguity or
            invalid-data errors can be returned.
        value:
          description: >-
            The value to assign to the target field when this action is
            triggered. The type must match the target field's data type  - a
            mismatch returns DEPENDENT_MISMATCH. Pipeline expects a string value
            from Pipelines metadata; Layout expects a layout object from Layouts
            metadata; Owner expects a user object from Users API.
          oneOf:
            - $ref: '#/components/schemas/FieldUpdateStringValue'
              x-zs-$id: FieldUpdateStringValue
            - $ref: '#/components/schemas/FieldUpdateArrayValue'
              x-zs-$id: FieldUpdateArrayValue
            - $ref: '#/components/schemas/FieldUpdateOwnerValue'
              x-zs-$id: FieldUpdateOwnerValue
            - $ref: '#/components/schemas/FieldUpdateBooleanValue'
              x-zs-$id: FieldUpdateBooleanValue
            - $ref: '#/components/schemas/FieldUpdateNumberValue'
              x-zs-$id: FieldUpdateNumberValue
            - $ref: '#/components/schemas/FieldUpdateNullValue'
              x-zs-$id: FieldUpdateNullValue
        type:
          $ref: '#/components/schemas/FieldUpdateType'
          description: >-
            Create/update mapping type. Only static is accepted for
            create/update payloads.
        feature_type:
          $ref: '#/components/schemas/FieldUpdateFeatureType'
          description: >-
            The automation feature this field update is associated with.
            Defaults to 'workflow' if omitted. All enum values are supported for
            creation via API.
        notify:
          type: boolean
          description: >-
            Whether to send an email notification to the new owner when the
            Owner field is updated. Required when the target field is Owner
            (omitting returns DEPENDENT_FIELD_MISSING). Must not be sent when
            the target field is not Owner (returns NOT_ALLOWED).
          default: false
        update_type:
          $ref: '#/components/schemas/FieldUpdateUpdateType'
          description: >-
            Strategy for applying the value. Required for multi-select fields:
            'overwrite' replaces all existing values, 'append' adds to them.
            Omit or pass null for single-value fields.
        apply_assignment_threshold:
          type: boolean
          description: >-
            Whether to enforce assignment-threshold rules when updating the
            Owner field. This key is applicable only for Owner updates, and is
            required only when active owner-assignment thresholds exist for the
            module. If thresholds are not configured, sending this key can be
            rejected as not allowed.
          default: false
        dependent_fields:
          type:
            - array
            - 'null'
          description: >-
            Dependent fields that must be set alongside the target field.
            Required for dependent picklist relationships. Common chains:
            Pipeline -> Stage, Layout -> Pipeline, and Layout -> Pipeline ->
            Stage (nested via dependent_fields inside the Pipeline node).
          items:
            $ref: '#/components/schemas/DependentFieldsNested'
          maxItems: 1
        related_records:
          type:
            - array
            - 'null'
          description: >-
            Related modules whose open record ownership should also be
            transferred when the Owner field is updated. Common activity modules
            (Tasks, Calls, Events) are available for all modules. Additional
            modules depend on the parent module: Accounts can also include
            Contacts and Deals; Contacts can also include Deals. Required when
            the target field is Owner (omitting returns
            DEPENDENT_FIELD_MISSING). Must not be sent when the target field is
            not Owner (returns NOT_ALLOWED). Pass null to skip ownership
            transfer on related records.
          items:
            $ref: '#/components/schemas/RelatedRecordModule'
          maxItems: 5
        related_module:
          $ref: '#/components/schemas/RelatedModuleDetails'
          description: >-
            Related module context when the field update is configured on a
            related module's records (e.g., updating a field on Contacts related
            to Accounts). Pass null or omit when not applicable.
      required:
        - name
        - module
        - field
        - value
        - type
      title: Field Update Configuration For Create
