            Possible values:

            NOT_ALLOWED - Parallel transitions cannot be performed directly.
          enum:
            - NOT_ALLOWED
        details:
          type: object
          additionalProperties: false
          description: >-
            Represents the additional details of the error, including the API
            name of the parallel transition that cannot be performed directly.
          properties:
            api_name:
              type: string
              description: >-
                Represents the API name of the parallel transition that cannot
                be performed directly.
              maxLength: 255
          required:
            - api_name
        message:
          type: string
          description: >-
            Represents the error message returned when a parallel transition
            cannot be performed directly.

            Possible values:

            cannot perform the parallel transition directly - The requested
            parallel transition cannot be executed directly.
          enum:
            - cannot perform the parallel transition directly
        status:
          type: string
          description: |-
            Represents the status of the failed request.
            Possible values:
            error - The request failed.
          enum:
            - error
      required:
        - code
        - details
        - message
        - status
      title: Error Response Core
      x-zs-$id: ErrorNotAllowedParallelTransition
    ErrorTransitionCriteriaFailed:
      type: object
      additionalProperties: false
      description: >-
        Represents the error returned when a transition is executed without its
        criteria being met.
      properties:
        code:
          type: string
          description: >-
            Represents the error code returned when a transition is executed
            without its criteria being met.

            Possible values:

            INVALID_DATA - The record data does not satisfy the criteria
            configured for the transition.
          enum:
            - INVALID_DATA
        details:
          type: object
          additionalProperties: false
          description: >-
            Represents additional details of the error that occurred when the
            transition criteria are not met.
          properties: {}
        message:
          type: string
          description: >-
            Represents the error message indicating that the transition criteria
            were not met.

            Possible values:

            transition criteria failed - The record data does not satisfy the
            criteria configured for the transition.
          enum:
            - transition criteria failed
        status:
          type: string
          description: >-
            Represents the status of the failed request.

            Possible values:

            error - The operation failed because the transition criteria are not
            met.
          enum:
            - error
      required:
        - code
        - details
        - message
        - status
      title: Error Response Core
      x-zs-$id: ErrorTransitionCriteriaFailed
    GETBlueprintNested:
      type: object
      additionalProperties: false
      description: >-
        Represents the Blueprint details of a record, including the transitions
        currently available in its active Blueprint process.
      properties:
        process_info:
          $ref: '#/components/schemas/GETProcessInfoNested'
        transitions:
          type: array
          description: >-
            List of transitions currently available for the record in its active
            Blueprint process. Each transition includes its ID, name, criteria
            match details, and the fields required to execute it.
          items:
            $ref: '#/components/schemas/GETTransitionsNested'
          maxItems: 200
      required:
        - process_info
        - transitions
      x-zs-$id: GETBlueprintNested
    ErrorInvalidDataType:
      type: object
      additionalProperties: false
      description: >-
        Represents the error returned when the value of a field in the
        transition data is not of the expected data type. The **details** object
        identifies the field by its API name and JSON path and states the
        expected data type.
      properties:
        code:
          type: string
          description: >-
            Represents the error code returned for the failed request. Possible
            value: **INVALID_DATA**.
          enum:
            - INVALID_DATA
        details:
          type: object
          additionalProperties: false
          description: >-
            Represents the validation details that identify the field that
            failed and the expected data type.
          properties:
            expected_data_type:
              type: string
              description: >-
                Represents the data type expected for the field identified by
                **api_name**.
              maxLength: 255
            api_name:
              type: string
              description: >-
                Represents the API name of the field for which the value is not
                of the expected data type.
              maxLength: 255
            json_path:
              type: string
              description: >-
                Represents the JSON path to the request element that contains
                the invalid value.
              maxLength: 1000
          required:
            - api_name
            - expected_data_type
            - json_path
        message:
          type: string
          description: >-
            Represents the error message that describes the cause of the
            failure.
          enum:
            - invalid data
        status:
          type: string
          description: Represents the status of the failed transition request.
          enum:
            - error
      required:
        - code
        - details
        - message
        - status
      title: Error Response Core
      x-zs-$id: ErrorInvalidDataType
    PutblueprintRequest:
      type: object
      additionalProperties: false
      description: >-
        Represents the request body for executing a Blueprint transition on a
        record, carrying the Blueprint transition data to process.
      properties:
        blueprint:
          type: array
          description: >-
            Contains the Blueprint transition object to be processed for the
            record.
          items:
            $ref: '#/components/schemas/BlueprintNested'
          maxItems: 1
      required:
        - blueprint
    ChecklistsNested:
      type: object
      description: >-
        Represents a checklist item for the transition. Each key is dynamic and
        takes a checklist question configured for the transition, and its
        Boolean value stores the answer to that question.
      additionalProperties: true
      x-zs-$id: ChecklistsNested
    ErrorInvalidDataMaxLength:
      type: object
      additionalProperties: false
      description: >-
        Represents the error returned when the value of a field in the
        transition data exceeds the maximum allowed length. The **details**
        object identifies the field by its API name and JSON path and states the
        maximum length allowed.
      properties:
        code:
          type: string
          description: >-
            Represents the error code returned for the failed request. Possible
            value: **INVALID_DATA**.
          enum:
            - INVALID_DATA
        details:
          type: object
          additionalProperties: false
          description: >-
            Represents the validation details that identify the field that
            failed and the reason for the failure.
          properties:
            maximum_length:
              type: integer
              format: int32
              description: >-
                Represents the maximum number of characters allowed for the
                field identified by **api_name**.
            api_name:
              type: string
              description: >-
                Represents the API name of the field for which the value exceeds
                the maximum allowed length.
              maxLength: 255
            json_path:
              type: string
              description: >-
                Represents the JSON path of the field for which the value
                exceeds the maximum allowed length.
              maxLength: 1000
          required:
            - api_name
            - json_path
            - maximum_length
        message:
          type: string
          description: >-
            Represents the error message that describes the failure. Possible
            values: **Invalid data**, **invalid data**.
          enum:
            - Invalid data
            - invalid data
        status:
          type: string
          description: >-
            Represents the status of the failed request. Possible value:
            **error**.
          enum:
            - error
      required:
        - code
        - details
        - message
        - status
      title: Error Response Core
      x-zs-$id: ErrorInvalidDataMaxLength
    DataNested:
      type: object
      description: >-
        Represents the object that contains the field values required for the
        transition. Keys are field API names. Values can be: (a) primitive field
        values (string, number, Boolean, or null), (b) arrays for subform during
        fields or multi-record fields (for example, **Tag**, **Subform_1**)
        where each element is a key-value map, or (c) an associated module
        object whose properties include the associated module's field values and
        nested subform arrays (for example, **data.Sales_Order** with nested
        **Ordered_Items**).
      properties:
        CheckLists:
          type:
            - array
            - 'null'
          description: >-
            Represents the array of checklist items for the transition. Each
            item contains question-answer pairs.
          items:
            $ref: '#/components/schemas/ChecklistsNested'
          maxItems: 100
      additionalProperties:
        oneOf:
          - type: array
            description: >-
              Sub-form during field or multi-record field - dynamic key is the
              sub-form/field API name; value is an array of records, each being
              a key-value map of field API names to their values.
            items:
              $ref: '#/components/schemas/SubformRecordNested'
            maxItems: 100
            x-zs-$id: DataNestedSubformArray
          - type: object
            description: >-
              Associated module object used inside data when a blueprint during
              field references an associated module record. Keys are field API
              names of the associated module (primitive values) and/or sub-form
              API names mapped to arrays of sub-form records (e.g.
              Sales_Order.Ordered_Items).
            additionalProperties: true
            unevaluatedProperties: false
            x-zs-$id: DataNestedAssociatedModule
          - type: string
            description: String field value for a regular blueprint during field.
            maxLength: 4000
            x-zs-$id: DataNestedPrimitiveString
          - type: number
            description: Numeric field value for a regular blueprint during field.
            x-zs-$id: DataNestedPrimitiveNumber
          - type: boolean
            description: Boolean field value for a regular blueprint during field.
            x-zs-$id: DataNestedPrimitiveBoolean
          - type: 'null'
            description: Null field value for a regular blueprint during field.
            x-zs-$id: DataNestedPrimitiveNull
      x-zs-$id: DataNested
    SubformRecordNested:
      type: object
      additionalProperties: true
      description: >-
        Represents a single subform record as a key-value map of subform field
        API names to their values. The keys are dynamic and depend on the
        subform field configuration.
    ErrorInvalidRecordId:
      type: object
      additionalProperties: false
      description: >-
        Represents the error returned when the record ID specified in the
        request URL is invalid.
      properties:
        code:
          type: string
          description: >-
            Represents the error code returned when the record ID in the request
            URL is invalid.

            Possible values:

            INVALID_DATA - The record ID specified in the request URL is
            invalid.
          enum:
            - INVALID_DATA
        details:
          type: object
          additionalProperties: false
          description: >-
            Represents additional details about the error, including validation
            information. This object is empty for this error.
          properties: {}
        message:
          type: string
          description: >-
            Represents the error message returned when the record ID in the
            request URL is invalid.

            Possible values:

            the ID given seems to be invalid - The record ID specified in the
            request URL is invalid.
          enum:
            - the id given seems to be invalid
        status:
          type: string
          description: >-
            Represents the status of the failed request.

            Possible values:

            error - The request failed because the record ID in the request URL
            is invalid.
          enum:
            - error
      required:
        - code
        - details
        - message
        - status
      title: Error Response Core
      x-zs-$id: ErrorInvalidRecordId
    ErrorRecordNotInProcess:
      type: object
      additionalProperties: false
      description: >-
        Represents the error returned when the record is not part of an active
        Blueprint process.
      properties:
        code:
          type: string
          description: >-
            Represents the error code returned when the record is not part of an
            active Blueprint process.

            Possible values:

            RECORD_NOT_IN_PROCESS - The record is not associated with an active
            Blueprint process.
          enum:
            - RECORD_NOT_IN_PROCESS
        details:
          type: object
          additionalProperties: false
          description: >-
            Represents additional details of the error that occurred when the
            record is not part of an active Blueprint process.
          properties: {}
        message:
          type: string
          description: >-
            Represents the error message indicating that the record is not part
            of an active Blueprint process.

            Possible values:

            record not in process - The specified record is not associated with
            an active Blueprint process.
          enum:
            - record not in process
        status:
          type: string
          description: >-
            Represents the status of the failed request.

            Possible values:

            error - The request failed because the record is not part of an
            active Blueprint process.
          enum:
            - error
      required:
        - code
        - details
        - message
        - status
      title: Error Response Core
      x-zs-$id: ErrorRecordNotInProcess
    ErrorInvalidRequest:
      type: object
      additionalProperties: false
      description: >-
        Represents the error returned when the request body or request
        parameters are invalid or malformed.
      properties:
        code:
          type: string
          description: >-
            Represents the error code returned when the request body or request
            parameters are invalid or malformed.

            Possible values:

            INVALID_REQUEST - The request body or request parameters are invalid
            or malformed.
          enum:
            - INVALID_REQUEST
        details:
          type: object
          additionalProperties: false
          description: >-
            Represents additional details about the error, including validation
            information. This object is empty for this error.
          properties: {}
        message:
          type: string
          description: >-
            Represents the error message returned when the request body or
            request parameters are invalid or malformed.

            Possible values:

            unable to process your request. please verify whether you have
            entered proper method name, parameter and parameter values. - The
            request cannot be processed because the method name, parameter, or
            parameter values are invalid or malformed.
          enum:
            - >-
              unable to process your request. please verify whether you have
              entered proper method name, parameter and parameter values.
        status:
          type: string
          description: >-
            Represents the status of the failed request.

            Possible values:

            error - The request failed because the request body or request
            parameters are invalid or malformed.
          enum:
            - error
      required:
        - code
        - details
        - message
        - status
      title: Error Response Core
      x-zs-$id: ErrorInvalidRequest
    GETTransitionsNested:
      type: object
      additionalProperties: false
      description: >-
        Represents a Blueprint transition for the record, including its
        criteria, during-field metadata and values, next transitions,
        accessibility, and related data. For non-accessible transitions
        (**is_accessible** is false), the response omits **next_transitions**,
        **data**, and **fields**.
      properties:
        next_transitions:
          type:
            - array
            - 'null'
          description: >-
            Lists the transitions available to the current user for the record.
            This key is not present for transitions that are not accessible.
          items:
            description: >-
              Represents a transition available to the current user for the
              record.
          maxItems: 200
        data:
          oneOf:
            - $ref: '#/components/schemas/GETDataNested'
            - type: 'null'
              x-zs-$id: GETDataNestedOrNull
              description: >-
                Indicates that the values of the Blueprint's during fields are
                not included in the response for non-accessible transitions.
          description: >-
            Represents the values of the Blueprint's during fields, including
            values for fields inside subforms. Not present for non-accessible
            transitions.
        type:
          type: string
          description: Represents the type of the Blueprint transition.
          maxLength: 50
        criteria_message:
          type:
            - string
            - 'null'
          description: >-
            Represents the message text for the transition criteria. This value
            is null when no criteria is configured.
          maxLength: 4000
        criteria_details:
          oneOf:
            - $ref: '#/components/schemas/GETCriteriaDetailsNested'
            - type: 'null'
              x-zs-$id: GETCriteriaDetailsNestedOrNull
              description: >-
                Indicates that no criteria is configured for the transition. The
                value is always null.
          description: >-
            Represents the criteria structure configured for the transition.
            This value is null when no criteria is configured.
        execution_time:
          type: 'null'
          description: Represents the scheduled execution time of an automatic transition.
        sequence:
          type: integer
          format: int32
          description: >-
            Represents the position of the transition in the Blueprint's
            transition order.
        next_field_value:
          type: string
          description: >-
            Represents the name of the state the record moves to when the
            transition is executed.
          maxLength: 255
        text_color_code:
          type: string
          description: >-
            Represents the color code used to render the transition's text in
            the Blueprint.
          maxLength: 10
        name:
          type: string
          description: Represents the display name of the transition.
          maxLength: 255
        criteria_matched:
          type: boolean
          description: >-
            Indicates whether the record satisfies the criteria configured for
            the transition.

            Possible values:

            true - The record satisfies the transition criteria.

            false - The record does not satisfy the transition criteria.
        id:
          type: string
          description: Represents the unique ID of the Blueprint transition.
          maxLength: 25
          x-zs-$id: RecordCurrentBPTransitionId
        parent_transition:
          oneOf:
            - $ref: '#/components/schemas/GETParentTransitionNested'
            - type: 'null'
              x-zs-$id: GETParentTransitionNestedOrNull
              description: >-
                Indicates that the transition has no parent parallel transition.
                The value is always null.
          description: >-
            Represents the parent transition details for parallel transitions.
            This value is null when the transition has no parent parallel
            transition.
        state:
          type: string
          description: |-
            Indicates whether the transition is completed for the record.
            Possible values:
            **draft** - The transition is in draft state.
            **open** - The transition is open and not yet completed.
            **completed** - The transition is completed.
          enum:
            - draft
            - open
            - completed
        fields:
          type:
            - array
            - 'null'
          description: >-
            Represents the metadata of the configured during fields, including
            details of fields inside subforms used as during fields. Not present
            for non-accessible transitions.
          items:
            description: >-
              Represents the metadata of a single during field, including fields
              inside subforms.
          maxItems: 200
        color_code:
          type: string
          description: Represents the color code of the transition.
          maxLength: 10
        percent_partial_save:
          type: integer
          format: int32
          description: >-
            Represents the percentage of the transition completed for the
            record.
        is_accessible:
          type: boolean
          description: >-
            Indicates whether the transition is accessible to the current user.

            Possible values:

            true - The transition is accessible to the current user.

            false - The transition is not accessible. The response still
            includes the transition, but omits **next_transitions**, **data**,
            and **fields**; this supports preview features such as early
            access.        
      required:
        - color_code
        - criteria_matched
        - criteria_message
        - execution_time
        - id
        - name
        - next_field_value
        - parent_transition
        - percent_partial_save
        - sequence
        - text_color_code
        - type
      x-zs-$id: GETTransitionsNested
    GETEscalationNested:
      type: object
      additionalProperties: false
      description: >-
        Represents the escalation details for the current Blueprint state,
        including the number of days configured for the escalation and its
        status. The value is null when no escalation is configured.
      properties:
        days:
          type: string
          description: Represents the number of days configured for the escalation.
          maxLength: 25
        status:
          type: string
          description: Represents the escalation status of the current Blueprint state.
          maxLength: 25
      required:
        - days
        - status
      x-zs-$id: GETEscalationNested
  parameters:
    ParamPathRecordId:
      name: recordId
      in: path
      description: >-
        Specify the unique ID of the record for which you want to retrieve or
        execute Blueprint transitions.
      required: true
      schema:
        type: string
        example: '{recordId}'
        maxLength: 255
    ParamPathModuleApiName:
      name: moduleApiName
      in: path
      description: >-
        Specify the API name of the module that contains the record. Refer to
        the [Get Modules](modules.yaml#$.paths./settings/modules.get) resource
        for valid values.
      required: true
      schema:
        type: string
        example: '{moduleApiName}'
        maxLength: 255
    ParamQueryIncludeInnerDetails:
      name: include_inner_details
      in: query
      description: >-
        Specify whether to include inner details, such as the column name of the
        primary field on which the Blueprint is based, inside the **field**
        object of **process_info**.

        Possible values:

        true - Includes the inner details in the response.

        false - Excludes the inner details from the response.
      required: false
      schema:
        type: boolean
