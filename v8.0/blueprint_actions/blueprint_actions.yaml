            ZohoCRM.modules.Accounts.UPDATE: Update access to modules.Accounts
            ZohoCRM.modules.Contacts.UPDATE: Update access to modules.Contacts
            ZohoCRM.modules.Deals.UPDATE: Update access to modules.Deals
            ZohoCRM.modules.Campaigns.UPDATE: Update access to modules.Campaigns
