openapi: 3.1.0
info:
  title: Blueprint Actions API
  description: >-
    Blueprint is a Zoho CRM process-automation feature that maps out a business
    process and guides users through it, stage by stage and transition by
    transition. This API enables developers to retrieve the transitions and
    fields available for a specific record, execute a transition on that record,
    and fetch lookup-field details needed to complete a transition.
  version: '8'
servers:
  - url: https://zohoapis.{dc}/crm/{version}
    description: API Server for /crm
    variables:
      dc:
        description: API Server URL TLD
        default: com
        enum:
          - com
          - eu
          - in
          - cn
          - au
          - ca
          - jp
      version:
        description: API Version
        default: v8
paths:
  /{moduleApiName}/{recordId}/actions/blueprint:
    get:
      summary: Get Blueprint transitions of a record
      description: >-
        To get the next available Blueprint transitions for a record in Zoho
        CRM, along with the fields available for each transition, the current
        value of each field, and their validations, if any.
      x-zs-llm-description: >-
        Get next available blueprint transitions for a record including fields,
        current values, and validations
      operationId: getRecordBlueprintTransition
      parameters:
        - $ref: '#/components/parameters/ParamPathModuleApiName'
        - $ref: '#/components/parameters/ParamPathRecordId'
        - $ref: '#/components/parameters/ParamQueryIncludeInnerDetails'
      responses:
        '200':
          description: >-
            Returns the next available Blueprint transitions for the record,
            including the fields available for each transition, the current
            value of each field, and their validations, if any.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetblueprintResponse200'
              examples:
                Success200:
                  summary: >-
                    Available Blueprint transitions with fields and validations
                    for the record
                  value:
                    blueprint:
                      process_info:
                        field_id: '4554588000000000379'
                        api_name: Rating
                        field_name: Rating
                        field_label: Rating
                        column_name: RATING
                        field_value: '-None-'
                        escalation:
                          days: '1'
                          status: due
                        continuous: false
                        name: Accounts BP 1
                        current_picklist:
                          colour_code: null
                          id: '4554588000000002203'
                          value: '-None-'
                        id: '4554588000001194020'
                      transitions:
                        - next_transitions: []
                          data: {}
                          type: manual
                          criteria_message: null
                          execution_time: null
                          sequence: 1
                          next_field_value: Acquired
                          text_color_code: '#FFFFFF'
                          name: tr1
                          criteria_matched: true
                          id: '4554588000001194015'
                          parent_transition:
                            id: '4554588000001194014'
                            name: Parent Transition 1
                          fields: []
                          color_code: '#2385ef'
                          percent_partial_save: 0
                          is_accessible: true
                        - next_transitions: []
                          type: manual
                          criteria_message: >-
                            ( ( City is Chennai AND Country isn't India ) AND
                            State isn't TN )
                          criteria_details:
                            group_operator: AND
                            group:
                              - group_operator: AND
                                group:
                                  - comparator: equal
                                    field:
                                      api_name: City
                                      id: '4554588000000004419'
                                    value: Chennai
                                  - comparator: not_equal
                                    field:
                                      api_name: Country
                                      id: '4554588000000004425'
                                    value: India
                              - comparator: not_equal
                                field:
                                  api_name: State
                                  id: '4554588000000004421'
                                value: TN
                          execution_time: null
                          sequence: 2
                          next_field_value: Junk
                          text_color_code: '#FFFFFF'
                          name: tr2
                          criteria_matched: false
                          id: '4554588000001194016'
                          parent_transition:
                            id: '4554588000001194014'
                            name: Parent Transition 1
                          fields: []
                          color_code: '#2385ef'
                          percent_partial_save: 0
                          is_accessible: true
                  description: >-
                    Shows a successful response in which the record's available
                    Blueprint transitions are returned with their fields,
                    current field values, and validations.
          headers:
            X-API-CREDITS-REMAINING:
              schema:
                type: string
                format: int64
                description: >
                  Present when >=50% of base daily credits (excluding add-on
                  credits) are consumed. Value is total remaining credits
                  including add-on credits for the rolling 24-hour window.
                pattern: ^[0-9]+$
                minLength: 1
                maxLength: 19
              required: false
        '400':
          description: >-
            Bad Request - The request cannot be processed due to invalid syntax.

            **Resolution:** The record ID in the request URL must be valid and
            the record must be in process.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorRecordNotInProcess'
                  - $ref: '#/components/schemas/ErrorInvalidRecordId'
                  - $ref: '#/components/schemas/ErrorInvalidModule'
                  - $ref: '#/components/schemas/ErrorRecordLocked'
                  - $ref: '#/components/schemas/ErrorInvalidRequest'
                x-zs-$id: GetblueprintError400
                description: >-
                  Represents the error returned when the Blueprint transitions
                  of a record cannot be retrieved. The response is one of the
                  following error schemas: ErrorRecordNotInProcess, returned
                  when Blueprint transitions are requested for a record that is
                  not in process; ErrorInvalidRecordId, returned when the record
                  ID given in the URL is invalid; ErrorInvalidModule, returned
                  when the module API name given is invalid; or
                  ErrorRecordLocked, returned when the record is locked.
              examples:
                RecordNotInProcessResponse1:
                  summary: >-
                    Record is not part of any Blueprint process
                    (RECORD_NOT_IN_PROCESS)
                  value:
                    code: RECORD_NOT_IN_PROCESS
                    details: {}
                    message: record not in process
                    status: error
                  description: >-
                    The requested record is not part of any Blueprint process,
                    so Zoho CRM has no Blueprint transitions to return for it.
                    Verify that the record has entered the process before
                    calling this endpoint.
                InvalidDataResponse1:
                  summary: Invalid record ID in the request URL
                  value:
                    code: INVALID_DATA
                    details: {}
                    message: the id given seems to be invalid
                    status: error
                  description: >-
                    Shows the error returned when the record ID given in the
                    request URL is invalid. The response carries the
                    INVALID_DATA error code with details about the failure.
                InvalidModuleResponse1:
                  summary: Invalid module API name in the request path (INVALID_MODULE)
                  value:
                    code: INVALID_MODULE
                    details:
                      resource_path_index: 0
                    message: the module name given seems to be invalid
                    status: error
                  description: >-
                    Shows the error returned when the request is made with an
                    invalid module API name. The response reports the failure
                    with an error code, message, and status.
                RecordLockedResponse1:
                  summary: >-
                    Operation denied because the record is locked
                    (RECORD_LOCKED)
                  value:
                    code: RECORD_LOCKED
                    details:
                      action: record_locking
                      id: '4554588000001189103'
                    message: >-
                      Sorry, you cannot perform this operation as the record is
                      locked.
                    status: error
                  description: >-
                    The record is locked, so Zoho CRM cannot retrieve the
                    available Blueprint transitions for it. The caller must wait
                    until the record is unlocked before retrying the request.
          headers:
            X-API-CREDITS-REMAINING:
              schema:
                type: string
                format: int64
                description: >
                  Present when >=50% of base daily credits (excluding add-on
                  credits) are consumed. Value is total remaining credits
                  including add-on credits for the rolling 24-hour window.
                pattern: ^[0-9]+$
                minLength: 1
                maxLength: 19
              required: false
        '403':
          description: >-
            Forbidden - The client does not have access rights to the content.

            **Resolution:** The user must be granted the necessary access rights
            for the record and its Blueprint process.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModuleNotSupported'
                x-zs-$id: GetblueprintError403
              examples:
                NotSupportedResponse1:
                  summary: Module is not supported by the Zoho CRM API (NOT_SUPPORTED)
                  value:
                    code: NOT_SUPPORTED
                    details:
                      resource_path_index: 0
                    message: the given module is not supported in api
                    status: error
                  description: >-
                    The module specified in the request path is not supported by
                    the Zoho CRM API, so the Blueprint transitions cannot be
                    retrieved. Use the API name of a supported module and send
                    the request again.
          headers:
            X-API-CREDITS-REMAINING:
              schema:
                type: string
                format: int64
                description: >
                  Present when >=50% of base daily credits (excluding add-on
                  credits) are consumed. Value is total remaining credits
                  including add-on credits for the rolling 24-hour window.
                pattern: ^[0-9]+$
                minLength: 1
                maxLength: 19
              required: false
      security:
        - OAuth2:
            - ZohoCRM.modules.Leads.READ
        - OAuth2:
            - ZohoCRM.modules.Accounts.READ
        - OAuth2:
            - ZohoCRM.modules.Contacts.READ
        - OAuth2:
            - ZohoCRM.modules.Deals.READ
        - OAuth2:
            - ZohoCRM.modules.Campaigns.READ
        - OAuth2:
            - ZohoCRM.modules.Tasks.READ
        - OAuth2:
            - ZohoCRM.modules.Cases.READ
        - OAuth2:
            - ZohoCRM.modules.Events.READ
        - OAuth2:
            - ZohoCRM.modules.Solutions.READ
        - OAuth2:
            - ZohoCRM.modules.Products.READ
        - OAuth2:
            - ZohoCRM.modules.Vendors.READ
        - OAuth2:
            - ZohoCRM.modules.Pricebooks.READ
        - OAuth2:
            - ZohoCRM.modules.Quotes.READ
        - OAuth2:
            - ZohoCRM.modules.Salesorders.READ
        - OAuth2:
            - ZohoCRM.modules.Purchaseorders.READ
        - OAuth2:
            - ZohoCRM.modules.Invoices.READ
        - OAuth2:
            - ZohoCRM.modules.Notes.READ
        - OAuth2:
            - ZohoCRM.modules.Custom.READ
    put:
      summary: Update a single Blueprint transition for a record
      description: >-
        To update a single Blueprint transition for a record in your Zoho CRM
        organization.
      x-zs-llm-description: >-
        Update a single blueprint transition for a record with field values and
        transition_id
      operationId: putRecordBlueprintTransition
      parameters:
        - $ref: '#/components/parameters/ParamPathModuleApiName'
        - $ref: '#/components/parameters/ParamPathRecordId'
      requestBody:
        description: >-
          Specify the details required to update the Blueprint transition for
          the record. The payload carries the record's field values in the data
          object and can include related Notes and Attachments.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutblueprintRequest'
            examples:
              SamplePutRequest:
                summary: Sample request to update a Blueprint transition
                value:
                  blueprint:
                    - transition_id: '4554588000001189006'
                      data:
                        CheckLists:
                          - questionone: true
                          - questiontwo: false
                        Subform_1:
                          - Name: Row 1
                            Amount: 100
                          - Name: Row 2
                            Amount: 200
                      state: draft
                description: >-
                  This example shows a sample request body for updating a
                  Blueprint transition on a record. The payload carries the
                  record's field values in the data object.
              SamplePutRequestWithAssociatedModule:
                summary: >-
                  Request with a tag, an associated module subform, and a link
                  attachment
                value:
                  blueprint:
                    - transition_id: '4554588000001189006'
                      data:
                        Tag:
                          - name: Important
                            id: '4554588000000123001'
                            color_code: '#FFB300'
                        Sales_Order:
                          Subject: Test
                          Ordered_Items:
                            - Product_Name: Item A
                              Quantity: 2
                              List_Price: 150
                      state: completed
                description: >-
                  The request payload demonstrates executing a Blueprint
                  transition while supplying a tag, an associated module field
                  containing a nested subform, and a link attachment. It shows
                  how related records and files can accompany the record's field
                  data in a single transition update.
            x-zs-llm-examples:
              - SamplePutRequest
              - SamplePutRequestWithAssociatedModule
      responses:
        '200':
          description: >-
            Zoho CRM updates the Blueprint transition successfully. If the
            number of fields in the input does not meet the required number,
            Zoho CRM saves the transition partially.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PutblueprintResponse200'
                x-zs-$id: PutblueprintResponse200
              examples:
                Success200:
                  summary: Response when the transition updates successfully
                  value:
                    code: SUCCESS
                    details: {}
                    message: transition updated successfully
                    status: success
                  description: >-
                    The response confirms that the Blueprint transition executed
                    successfully for the record. It returns a success code, a
                    message stating that the transition updated successfully,
                    and a success status.
          headers:
            X-API-CREDITS-REMAINING:
              schema:
                type: string
                format: int64
                description: >
                  Present when >=50% of base daily credits (excluding add-on
                  credits) are consumed. Value is total remaining credits
                  including add-on credits for the rolling 24-hour window.
                pattern: ^[0-9]+$
                minLength: 1
                maxLength: 19
              required: false
        '400':
          description: >-
            The request cannot be processed due to invalid syntax or an invalid
            value in the Blueprint request-body object.

            **Resolution:** The client verifies the request structure and the
            transition_id field inside the Blueprint request-body object, then
            resends the request.
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    additionalProperties: false
                    description: >-
                      Represents the error response in which Zoho CRM returns
                      the transition update errors under the Blueprint key.
                    properties:
                      blueprint:
                        type: array
                        description: >-
                          Contains the errors that occur when the Blueprint
                          transition update fails, such as when field validation
                          fails or a field value's data type mismatches.
                        items:
                          oneOf:
                            - $ref: '#/components/schemas/ErrorInvalidDataValidation'
                            - $ref: '#/components/schemas/ErrorInvalidTransition'
                            - $ref: >-
                                #/components/schemas/ErrorNotAllowedParallelTransition
                            - $ref: >-
                                #/components/schemas/ErrorNotAllowedAutomaticTransition
                            - $ref: >-
                                #/components/schemas/ErrorTransitionCriteriaFailed
                            - $ref: '#/components/schemas/ErrorNoPermission'
                            - $ref: '#/components/schemas/ErrorMandatoryNotFound'
                            - $ref: '#/components/schemas/ErrorInvalidDataType'
                            - $ref: '#/components/schemas/ErrorInvalidDataMaxLength'
                            - $ref: >-
                                #/components/schemas/ErrorInvalidDataWithSupportedValues
                            - $ref: '#/components/schemas/ManadatoryParamError'
                            - $ref: '#/components/schemas/ErrorRecordNotInProcess'
                          description: >-
                            Represents an error that occurred while updating the
                            Blueprint transition, such as a mandatory field
                            validation error for the record's field data.
                        maxItems: 25
                    required:
                      - blueprint
                    x-zs-$id: PutblueprintError400Wrapper
                  - $ref: '#/components/schemas/ErrorInvalidDataType'
                  - $ref: '#/components/schemas/ErrorInvalidRecordId'
                  - $ref: '#/components/schemas/ErrorInvalidModule'
                  - $ref: '#/components/schemas/ErrorInvalidRequest'
                  - $ref: '#/components/schemas/ErrorRecordNotInProcess'
                  - $ref: '#/components/schemas/ErrorMandatoryNotFound2'
                  - $ref: '#/components/schemas/ErrorTransitionCriteriaFailed'
                  - $ref: '#/components/schemas/ErrorMandatoryNotFound'
                  - $ref: '#/components/schemas/ErrorInvalidDataMaxLength'
                x-zs-$id: PutblueprintError400
                description: >-
                  Represents the error response for a Blueprint transition
                  update request that fails due to invalid syntax.
              examples:
                InvalidDataValidationResponse1:
                  summary: Error response for validation errors in the transition data
                  value:
                    blueprint:
                      - code: INVALID_DATA
                        details:
                          validation_error:
                            - api_name: Notes
                              message: mandatory param missing
                              info_message: Notes cannot be empty.
                        message: invalid data
                        status: error
                  description: >-
                    The response returns the INVALID_DATA error code when
                    validation fails for the field values supplied in the
                    transition data. The payload identifies the field whose
                    value did not pass validation, so the request must be
                    corrected and resent.
                InvalidTransitionResponse1:
                  summary: Error response for an invalid transition on the record
                  value:
                    blueprint:
                      - code: INVALID_DATA
                        details: {}
                        message: invalid transition
                        status: error
                  description: >-
                    The response returns the INVALID_DATA error code when the
                    transition cannot be executed, such as when the record is
                    not in transition or the specified transition_id is wrong.
                    The client verifies the record state and the transition_id
                    field inside the Blueprint request-body object before
                    retrying.
                NotAllowedParallelTransitionResponse1:
                  summary: >-
                    Error response when a parallel transition cannot be
                    performed directly
                  value:
                    blueprint:
                      - code: NOT_ALLOWED
                        details:
                          api_name: transition_id
                        message: cannot perform the parallel transition directly
                        status: error
                  description: >-
                    This response demonstrates the NOT_ALLOWED error returned
                    when a parallel transition cannot be performed directly on
                    the record.
                NotAllowedAutomaticTransitionResponse1:
                  summary: >-
                    Error response when an automatic transition cannot be
                    performed directly
                  value:
                    blueprint:
                      - code: NOT_ALLOWED
                        details:
                          api_name: transition_id
                        message: cannot perform automatic transition
                        status: error
                  description: >-
                    This response demonstrates the NOT_ALLOWED error returned
                    when the requested transition is an automatic transition
                    that cannot be performed directly on the record.
                TransitionCriteriaFailedResponse1:
                  summary: >-
                    INVALID_DATA response when the record fails the transition
                    criteria
                  value:
                    blueprint:
                      - code: INVALID_DATA
                        details: {}
                        message: transition criteria failed
                        status: error
                  description: >-
                    This response occurs when the record does not satisfy the
                    criteria required to execute the Blueprint transition. The
                    error code is INVALID_DATA.
                NoPermissionResponse1:
                  summary: >-
                    Error response when the user's Zoho CRM profile lacks update
                    permission
                  value:
                    blueprint:
                      - code: NO_PERMISSION
                        details: {}
                        message: permission denied
                        status: error
                  description: >-
                    This response demonstrates the NO_PERMISSION error returned
                    when the user's Zoho CRM profile does not grant permission
                    to update Blueprint data. The system administrator must
                    assign the required permission before the record's
                    transition can update.
                MandatoryNotFoundResponse1:
                  summary: Error response when one or more mandatory fields are missing
                  value:
                    blueprint:
                      - code: MANDATORY_NOT_FOUND
                        details:
                          api_name: transition_id
                          json_path: $.blueprint[*].transition_id
                        message: Required field is missing
                        status: error
                  description: >-
                    This response demonstrates the MANDATORY_NOT_FOUND error
                    returned when one or more mandatory fields are not specified
                    in the input. The request must include all required fields
                    for the transition to be updated.
                InvalidDataTypeResponse1:
                  summary: Error response when a field value has an invalid data type
                  value:
                    blueprint:
                      - code: INVALID_DATA
                        details:
                          api_name: transition_id
                          expected_data_type: text
                          json_path: $.blueprint[*].transition_id
                        message: invalid data
                        status: error
                  description: >-
                    The response indicates that the transition could not be
                    executed because the value supplied for a field does not
                    match the data type the field expects. It returns the
                    INVALID_DATA error code to signal the mismatch.
                InvalidDataMaxLengthResponse1:
                  summary: Error response when a field value exceeds the allowed length
                  value:
                    blueprint:
                      - code: INVALID_DATA
                        details:
                          api_name: state
                          maximum_length: 50
                          json_path: $.blueprint[*].state
                        message: Invalid data
                        status: error
                  description: >-
                    The response indicates that the transition could not be
                    executed because a field value exceeded its permitted
                    length. It returns the INVALID_DATA error code to signal the
                    failed field validation.
                InvalidDataSupportedValuesResponse1:
                  summary: >-
                    Error response when a field value is not among the supported
                    values
                  value:
                    blueprint:
                      - code: INVALID_DATA
                        details:
                          api_name: state
                          json_path: $.blueprint[*].state
                          supported_values:
                            - draft
                            - completed
                        message: Invalid data
                        status: error
                  description: >-
                    The response indicates that the transition could not be
                    executed because a field value is not among the values the
                    field supports. It returns the INVALID_DATA error code along
                    with the values accepted for the field.
                RecordNotInProcessResponse1:
                  summary: Error response when the record is not in a Blueprint process
                  value:
                    code: RECORD_NOT_IN_PROCESS
                    details: {}
                    message: record not in process
                    status: error
                  description: >-
                    This response demonstrates the RECORD_NOT_IN_PROCESS error
                    returned when the specified record is not part of a
                    Blueprint process. The request must target a record that is
                    in a Blueprint process for the transition to update.
                InvalidRecordIdResponse1:
                  summary: Error response for an invalid record ID
                  value:
                    code: INVALID_DATA
                    details: {}
                    message: the id given seems to be invalid
                    status: error
                  description: >-
                    The response returns the INVALID_DATA error code when the
                    record ID in the request path is incorrect or invalid. A
                    valid record ID must be specified for the transition update
                    to proceed.
                InvalidModuleResponse1:
                  summary: Error response for an invalid module API name
                  value:
                    code: INVALID_MODULE
                    details:
                      resource_path_index: 0
                    message: the module name given seems to be invalid
                    status: error
                  description: >-
                    The response returns the INVALID_MODULE error code when the
                    module API name in the request path is invalid. A valid
                    module API name must be specified for the transition update
                    to proceed.
                InvalidRequestResponse1:
                  summary: Error response for an invalid HTTP request method
                  value:
                    code: INVALID_REQUEST
                    details: {}
                    message: >-
                      unable to process your request. please verify whether you
                      have entered proper method name, parameter and parameter
                      values.
                    status: error
                  description: >-
                    The response returns the INVALID_REQUEST error code when the
                    HTTP method used for the request is not valid. The client
                    uses a valid request method to update the transition.
          headers:
            X-API-CREDITS-REMAINING:
              schema:
                type: string
                format: int64
                description: >
                  Present when >=50% of base daily credits (excluding add-on
                  credits) are consumed. Value is total remaining credits
                  including add-on credits for the rolling 24-hour window.
                pattern: ^[0-9]+$
                minLength: 1
                maxLength: 19
              required: false
        '403':
          description: >-
            The client does not have access rights to update Blueprint data on
            the record.

            **Resolution:** The system administrator grants the required
            Blueprint permission to the user's Zoho CRM profile before the
            client retries the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModuleNotSupported'
                x-zs-$id: PutblueprintError403
              examples:
                NotSupportedResponse1:
                  summary: >-
                    NOT_SUPPORTED response when the module is not supported in
                    the API
                  value:
                    code: NOT_SUPPORTED
                    details:
                      resource_path_index: 0
                    message: the given module is not supported in api
                    status: error
                  description: |-
                    The given module is not supported in the API.
                    **Resolution:** Specify a valid, supported module API name.
          headers:
            X-API-CREDITS-REMAINING:
              schema:
                type: string
                format: int64
                description: >
                  Present when >=50% of base daily credits (excluding add-on
                  credits) are consumed. Value is total remaining credits
                  including add-on credits for the rolling 24-hour window.
                pattern: ^[0-9]+$
                minLength: 1
                maxLength: 19
              required: false
      security:
        - OAuth2:
            - ZohoCRM.modules.Leads.UPDATE
        - OAuth2:
            - ZohoCRM.modules.Accounts.UPDATE
        - OAuth2:
            - ZohoCRM.modules.Contacts.UPDATE
        - OAuth2:
            - ZohoCRM.modules.Deals.UPDATE
        - OAuth2:
            - ZohoCRM.modules.Campaigns.UPDATE
        - OAuth2:
            - ZohoCRM.modules.Tasks.UPDATE
        - OAuth2:
            - ZohoCRM.modules.Cases.UPDATE
        - OAuth2:
            - ZohoCRM.modules.Events.UPDATE
        - OAuth2:
            - ZohoCRM.modules.Solutions.UPDATE
        - OAuth2:
            - ZohoCRM.modules.Products.UPDATE
        - OAuth2:
            - ZohoCRM.modules.Vendors.UPDATE
        - OAuth2:
            - ZohoCRM.modules.Pricebooks.UPDATE
        - OAuth2:
            - ZohoCRM.modules.Quotes.UPDATE
        - OAuth2:
            - ZohoCRM.modules.Salesorders.UPDATE
        - OAuth2:
            - ZohoCRM.modules.Purchaseorders.UPDATE
        - OAuth2:
            - ZohoCRM.modules.Invoices.UPDATE
        - OAuth2:
            - ZohoCRM.modules.Notes.UPDATE
        - OAuth2:
            - ZohoCRM.modules.Custom.UPDATE
components:
  schemas:
    GETDataNested:
      type: object
      additionalProperties: true
      description: >-
        Represents the values of the during fields for a transition. Keys are
        field API names and values are the field values. For subform during
        fields, the key is the subform API name and the value is either an array
        of subform records or an associated module object containing the subform
        array, such as data.Sales_Order.Ordered_Items.
      x-zs-$id: GETDataNested
    ErrorModuleNotSupported:
      type: object
      additionalProperties: false
      description: >-
        Represents the error response returned when the module specified in the
        request URL is not supported by this API.
      properties:
        code:
          type: string
          description: |-
            Represents the error code that identifies the cause of the failure.

