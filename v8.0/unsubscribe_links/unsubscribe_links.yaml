  /settings/unsubscribe_links/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: >-
          The unique ID of the unsubscribe link to retrieve, update, or delete.
          This ID is returned in the response when creating or fetching
          unsubscribe links.
        schema:
          type: string
          examples:
            - '111112000000092007'
          maxLength: 255
    get:
      summary: Get Unsubscribe Link by ID
      description: >-
        To retrieve the complete configuration details of a specific unsubscribe
        link using its ID. This includes page settings, submission behavior,
        timestamps, and creator information.
      operationId: getUnsubscribeLinkById
      responses:
        '200':
          description: >-
            Success - Returns the full configuration of the specified
            unsubscribe link
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveUnsubscribeLinksResponse'
              examples:
                Success200:
                  summary: Success response for status 200
                  value:
                    unsubscribe_links:
                      - created_time: '2025-11-19T17:26:43+05:30'
                        submission_message: display message
                        modified_time: '2025-11-19T17:26:43+05:30'
                        submission_redirect_url: null
                        page_type: standard
                        custom_location_url: null
                        modified_by:
                          name: Kk
                          id: '111111000000057843'
                        name: Unsubscribe
                        id: '111111000000115722'
                        created_by:
                          name: Kk
                          id: '111111000000057843'
                        standard_page_message: standard message
                        submission_action_type: display_message
                  description: >-
                    Shows a successful response with the full configuration
                    details of the specified unsubscribe link.
        '204':
          description: No Content - No unsubscribe link found with the specified ID
        '403':
          description: >-
            Forbidden - The request requires the
            ZohoCRM.settings.unsubscribe.READ scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionDeniedError'
              examples:
                NoPermissionResponse1:
                  summary: 'NO_PERMISSION error: permission denied'
                  value:
                    code: NO_PERMISSION
                    details:
                      permissions:
                        - Crm_Implied_Manage_Unsubscribe_Form
                    message: permission denied
                    status: error
                  description: >-
                    Shows a NO_PERMISSION error when the user does not have the
                    required read permission.
      security:
        - OAuth2:
            - ZohoCRM.settings.unsubscribe.READ
    put:
      summary: Update Unsubscribe Link by ID
      description: >-
        To update a specific unsubscribe link. You can modify the link's name,
        page type, custom URL, standard page message, submission action type,
        redirect URL, or submission message.
      operationId: putUnsubscribeLinksById
      requestBody:
        description: >-
          Request body containing the unsubscribe link configuration to update.
          The id field is mandatory to identify which link to update.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnsubscribeLinkModificationByIdRequest'
            examples:
              SamplePutRequest:
                summary: Sample request body for updating an unsubscribe link by ID
                value:
                  unsubscribe_links:
                    - name: Unsubscribe
