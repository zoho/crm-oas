    post:
      summary: Create Unsubscribe Link
      description: >-
        To create an unsubscribe link that can be used in email templates or
        email footers. You can configure the link to display a standard Zoho CRM
        unsubscribe page or redirect to a custom webpage.
      operationId: postUnsubscribeLinks
      requestBody:
        description: >-
          Request body containing the unsubscribe link configuration. The name,
          page_type, and submission_action_type fields are mandatory.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InitiateUnsubscribeLinksRequest'
            examples:
              SamplePostRequest:
                summary: Sample request body for creating an unsubscribe link
                value:
                  unsubscribe_links:
                    - name: Unsubscribe
                      custom_location_url: >-
                        https://www.zoho.com/crm/developer/docs/api/v8/create-unsubscribe-link.html
                      standard_page_message: standard message
                      submission_redirect_url: >-
                        https://www.zoho.com/crm/developer/docs/api/v8/create-unsubscribe-link.html
                      submission_message: display message
                      page_type: standard
                      submission_action_type: display_message
                description: >-
                  Shows a sample POST request body for creating a new
                  unsubscribe link with name, page_type, and
                  submission_action_type.
      responses:
        '201':
          description: Created - Unsubscribe link created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateUnsubscribeLinksSuccessResponse'
              examples:
                Success201:
                  summary: Success response for status 201
                  value:
                    unsubscribe_links:
                      - code: SUCCESS
                        details:
                          id: '111111000000115581'
                        message: Unsubscribe Link created successfully
                        status: success
                  description: >-
                    Shows a successful 201 response with the action status for
                    the newly created unsubscribe link.
        '400':
          description: >-
            Bad Request - Invalid data provided. Check field types, mandatory
            fields, dependencies, or refer to the Input JSON keys section in the
            help doc.
          content:
            application/json:
              schema:
                x-zs-$id: CreateInvalidRequestErrors
                oneOf:
                  - x-zs-$id: CreateInvalidRequestBodyErrors
                    type: object
                    additionalProperties: false
                    description: >-
                      Wrapped error response containing an array of individual
                      unsubscribe link validation errors.
                    properties:
                      unsubscribe_links:
                        type: array
                        description: >-
                          Represents the list of individual error objects for
                          each unsubscribe link in the create request.
                        items:
                          anyOf:
                            - $ref: '#/components/schemas/MandatoryFieldMissingError'
                            - $ref: '#/components/schemas/DuplicateDataError'
                            - $ref: '#/components/schemas/LinkLimitExceededError'
                            - $ref: >-
                                #/components/schemas/InvalidCustomLocationURLError
                            - $ref: '#/components/schemas/DependentFieldMissingError'
                            - $ref: '#/components/schemas/GeneralInvalidDataError'
