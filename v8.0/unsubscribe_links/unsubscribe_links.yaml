openapi: 3.1.0
info:
  title: Unsubscribe Links
  description: >-
    The Unsubscribe Links API allows you to create, retrieve, update, and delete
    unsubscribe links that can be used in email templates or email footers in
    your Zoho CRM account. These links help manage email preferences and
    unsubscribe requests from your contacts.
  version: '8'
servers:
  - url: https://zohoapis.{dc}/crm/{version}
    description: >-
      Production API server for Zoho CRM, supporting requests across multiple
      data center regions.
    variables:
      dc:
        description: >-
          The top-level domain (TLD) of the API server, corresponding to the
          Zoho data center region.

          Possible values:

          com - United States.

          eu - Europe.

          in - India.

          cn - China.

          au - Australia.

          ca - Canada.

          jp - Japan.
        default: com
        enum:
          - com
          - eu
          - in
          - cn
          - au
          - ca
          - jp
      version:
        description: The version of the Zoho CRM API. The default value is v8.
        default: v8
paths:
  /settings/unsubscribe_links:
    get:
      summary: Get Unsubscribe Links
      description: >-
        To retrieve the details of all unsubscribe links configured in your CRM
        account. This API returns a list of unsubscribe links with their
        complete configuration, including page type, submission behavior,
        timestamps, and creator information.
      operationId: getUnsubscribeLinks
      responses:
        '200':
          description: >-
            Success - Returns a list of unsubscribe links with their
            configurations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnsubscribeLinksResponse'
              examples:
                Success200:
                  summary: Success response for status 200
                  value:
                    unsubscribe_links:
                      - created_time: '2025-11-18T20:18:40+05:30'
                        submission_message: ''
                        modified_time: '2025-11-18T20:18:40+05:30'
                        submission_redirect_url: ''
                        page_type: standard
                        custom_location_url: ''
                        modified_by:
                          name: Kk
                          id: '111111000000057843'
                        name: Default
                        id: '111111000000115014'
                        created_by:
                          name: Kk
                          id: '111111000000057843'
                        standard_page_message: null
                        submission_action_type: display_message
                  description: >-
                    Shows a successful response listing all unsubscribe links
                    configured in the organization.
        '204':
          description: No content - No unsubscribe links found in the account
        '403':
          description: >-
            Forbidden - The request requires the
            ZohoCRM.settings.unsubscribe.READ scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionDeniedError'
              examples:
                NoPermissionResponse1:
                  summary: 'NO_PERMISSION error: permission denied'
                  value:
                    code: NO_PERMISSION
                    details:
                      permissions:
                        - Crm_Implied_Manage_Unsubscribe_Form
                    message: permission denied
                    status: error
                  description: >-
                    Shows a NO_PERMISSION error when the user does not have the
                    required read permission.
      security:
        - OAuth2:
            - ZohoCRM.settings.unsubscribe.READ
    put:
      summary: Update Unsubscribe Links
      description: >-
        To update one or more unsubscribe links in bulk. You can modify the
        link's name, page type, custom URL, standard page message, submission
        action type, redirect URL, or submission message.
      operationId: putUnsubscribeLinks
      requestBody:
        description: >-
          Request body containing the unsubscribe links to update. The id field
          is mandatory for each link.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUnsubscribeLinksRequest'
            examples:
              SamplePutRequest:
                summary: Sample request body for bulk-updating an unsubscribe link
                value:
                  unsubscribe_links:
                    - name: Unsubscribe
                      custom_location_url: >-
                        https://www.zoho.com/crm/developer/docs/api/v8/create-unsubscribe-link.html
                      standard_page_message: standard message
                      submission_redirect_url: >-
                        https://www.zoho.com/crm/developer/docs/api/v8/create-unsubscribe-link.html
                      submission_message: display message
                      page_type: standard
                      submission_action_type: display_message
                      id: '123456789012345678'
                description: >-
                  Shows a sample PUT request body for bulk-updating an
                  unsubscribe link with the required `id` field.
      responses:
        '200':
          description: Success - Unsubscribe link updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnsubscribeLinkModificationResultList'
              examples:
                Success200:
                  summary: Success response for status 200
                  value:
                    unsubscribe_links:
                      - code: SUCCESS
                        details:
                          id: '111111000000115722'
                        message: Unsubscribe Link updated successfully
                        status: success
                  description: >-
                    Shows a successful bulk update response with the action
                    status for the updated unsubscribe link.
        '400':
          description: >-
            Bad Request - Invalid data provided. Check field types,
            dependencies, or refer to the Input JSON keys section in the help
            doc.
          content:
            application/json:
              schema:
                x-zs-$id: UpdateInvalidRequestErrors
                anyOf:
                  - $ref: '#/components/schemas/InvalidDataTypeError'
                  - $ref: '#/components/schemas/RequestBodyNotFoundError'
                  - $ref: '#/components/schemas/InvalidDataBodyError'
                  - $ref: '#/components/schemas/RequestBodyEmptyArray'
                  - x-zs-$id: UpdateInvalidRequestBodyErrors
                    type: object
                    additionalProperties: false
                    description: >-
                      Wrapped error response containing an array of individual
                      unsubscribe link validation errors for the bulk PUT
                      request.
                    properties:
                      unsubscribe_links:
                        type: array
                        description: >-
                          Represents the list of individual error objects for
                          each unsubscribe link in the bulk update request.
                        items:
                          anyOf:
                            - $ref: '#/components/schemas/UnsupportedPageTypeError'
                            - $ref: >-
                                #/components/schemas/InvalidUnsubscribeLinkIdInBody
                            - $ref: '#/components/schemas/NotAllowedOperationError'
                            - $ref: '#/components/schemas/DuplicateDataError'
                            - $ref: '#/components/schemas/DependentFieldMissingError'
                            - $ref: >-
                                #/components/schemas/InvalidCustomLocationURLError
                            - $ref: '#/components/schemas/GeneralInvalidDataError'
                            - $ref: '#/components/schemas/GenericInvalidDataError'
                            - $ref: '#/components/schemas/InvalidDataValueErrorAlt'
                            - $ref: '#/components/schemas/InvalidDataErrorType'
                            - $ref: >-
                                #/components/schemas/RequiredFieldDependencyError
                            - $ref: '#/components/schemas/MandatoryFieldMissingError'
                            - $ref: >-
                                #/components/schemas/InvalidDataTypeMismatchError
                          description: >-
                            Represents an individual error object for a specific
                            unsubscribe link in the bulk update request.
                        maxItems: 25
                    required:
                      - unsubscribe_links
                description: >-
                  Validation error response for the PUT request, covering
                  invalid data type, missing required fields, empty array, and
                  dependent field failures.
              examples:
                InvalidDataResponse1:
                  summary: 'INVALID_DATA error: invalid data (unsubscribe_links)'
                  value:
                    code: INVALID_DATA
                    details:
                      maximum_length: 1
                      api_name: unsubscribe_links
                      json_path: $.unsubscribe_links
                    message: invalid data
                    status: error
                  description: >-
                    Shows an INVALID_DATA error when the unsubscribe_links field
                    has invalid data.
                InvalidDataResponse2:
                  summary: 'INVALID_DATA error: unsupported page_type value - variant 1'
