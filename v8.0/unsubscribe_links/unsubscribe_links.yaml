    delete:
      summary: Delete Unsubscribe Link by ID
      description: >-
        To delete a specific unsubscribe link. Note that the default unsubscribe
        link cannot be deleted.
      operationId: deleteUnsubscribeLinksById
      responses:
        '200':
          description: Success - Unsubscribe link deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnsubscribeLinkRemovalResultList'
              examples:
                Success200:
                  summary: Success response for status 200
                  value:
                    unsubscribe_links:
                      - code: SUCCESS
                        details:
                          id: '111111000000116037'
                        message: Unsubscribe Link deleted successfully
                        status: success
                  description: >-
                    Shows a successful delete operation with the action status
                    for the specified unsubscribe link ID.
        '400':
          description: >-
            Bad Request - The unsubscribe link ID is invalid or you are trying
            to delete the default unsubscribe link, which is not allowed.
          content:
            application/json:
              schema:
                x-zs-$id: DeleteUnsubscribeLinkByIdInvalidRequestErrors
                anyOf:
                  - $ref: '#/components/schemas/NotAllowedUnsubscribeLinkIdError'
                  - $ref: '#/components/schemas/InvalidUnsubscribeLinkIdError'
                description: >-
                  Validation error response for the DELETE by ID request,
                  covering invalid or not-allowed unsubscribe link IDs.
              examples:
                InvalidDataResponse1:
                  summary: >-
                    INVALID_DATA error: The given Unsubscribe Link ID is not
                    part of Org
                  value:
                    code: INVALID_DATA
                    details:
                      resource_path_index: 2
                    message: The given Unsubscribe Link id is not part of Org
                    status: error
                  description: >-
                    Shows an INVALID_DATA error when the given unsubscribe link
                    ID does not belong to the organization.
        '403':
          description: >-
            Forbidden - The request requires the
            ZohoCRM.settings.unsubscribe.DELETE scope. You cannot delete the
            default unsubscribe link.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionDeniedError'
              examples:
                NoPermissionResponse1:
                  summary: 'NO_PERMISSION error: permission denied'
                  value:
                    code: NO_PERMISSION
                    details:
                      permissions:
                        - Crm_Implied_Manage_Unsubscribe_Form
                    message: permission denied
                    status: error
                  description: >-
                    Shows a NO_PERMISSION error when the user does not have the
                    required delete permission.
      security:
        - OAuth2:
            - ZohoCRM.settings.unsubscribe.DELETE
  /settings/unsubscribe_link/actions/associations:
    get:
      summary: Get Unsubscribe Link Associations
      description: >-
        To retrieve information about where unsubscribe links are being used
        (associated places) in your CRM account, such as in email templates.
      operationId: getAssociations
      responses:
        '200':
          description: >-
            Success - Returns a list of associated places for each unsubscribe
            link
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FetchAssociatedPlacesResponse'
              examples:
                Success200:
                  summary: Success response for status 200
                  value:
                    associations:
                      - id: '111111000000116043'
                        associated_places:
                          - resource:
                              name: Asd
                              id: '111111000000116051'
                            details:
                              module:
                                api_name: Leads
                                id: '111111000000002652'
                            type: email_templates
                  description: >-
                    Shows a successful response listing the places where each
                    unsubscribe link is currently associated.
        '204':
          description: No Content - No associated places found for any unsubscribe link
        '403':
          description: >-
            Forbidden - The request requires the
            ZohoCRM.settings.unsubscribe.READ scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionDeniedError'
              examples:
                NoPermissionResponse1:
                  summary: 'NO_PERMISSION error: permission denied'
                  value:
                    code: NO_PERMISSION
                    details:
                      permissions:
                        - Crm_Implied_Manage_Unsubscribe_Form
                    message: permission denied
                    status: error
                  description: >-
                    Shows a NO_PERMISSION error when the user does not have the
                    required read permission.
      security:
        - OAuth2:
            - ZohoCRM.settings.unsubscribe.READ
components:
  schemas:
    InvalidDataBodyError:
      x-zs-$id: InvalidDataBodyError
      type: object
      additionalProperties: false
      description: >-
        Error response for an invalid request body data type, providing the
        expected data type for the body.
      properties:
        code:
          type: string
          description: Represents the error code for this response.
          enum:
            - INVALID_DATA
        details:
          type: object
          additionalProperties: false
          description: >-
            Contains additional validation information about the invalid request
            body error.
          properties:
            expected_data_type:
              type: string
              description: Represents the expected data type for the request body.
              maxLength: 255
          required:
            - expected_data_type
        message:
          type: string
          maxLength: 255
          description: >-
            Represents the error message describing the invalid request body
            issue.
        status:
          type: string
          description: Represents the status of the response.
          enum:
            - error
      required:
        - code
        - details
        - message
        - status
    UnsubscribeLinkCreateItem:
      allOf:
        - $ref: '#/components/schemas/UnsubscribeLinkBaseFields'
        - type: object
          additionalProperties: true
          description: Required fields for creating an unsubscribe link
          required:
            - name
            - page_type
            - submission_action_type
      unevaluatedProperties: false
      description: >-
        Represents the fields required to create an unsubscribe link. The
        **name**, **page_type**, and **submission_action_type** fields are
        mandatory.
      title: Unsubscribe Link Create Item
    UnsubscribeLinkSummaryRecord:
      type: object
      additionalProperties: false
      description: >-
        Summarized unsubscribe link configuration with timestamps, page
        settings, submission behavior, and creator or modifier references as
        returned by the listing endpoint.
      properties:
        created_time:
          type: string
          description: The date and time when the unsubscribe link was created
          maxLength: 255
        submission_message:
          type:
            - string
            - 'null'
          description: >-
            The message displayed when the user clicks the unsubscribe button
            (for display_message action type). Null if not configured.
          maxLength: 2000
        modified_time:
          type: string
          description: The date and time when the unsubscribe link was last modified
          maxLength: 255
        submission_redirect_url:
          type:
            - string
            - 'null'
          description: >-
            The URL to which the user is redirected after unsubscribing (for
            redirect action type). Null if not configured.
          maxLength: 255
        page_type:
          type:
            - string
            - 'null'
          description: >-
            Indicates whether the unsubscribe page is hosted on Zoho's standard
            page (standard) or a custom webpage (custom)
          maxLength: 255
        custom_location_url:
          type:
