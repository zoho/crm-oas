                  value:
                    status: error
                    code: REQUIRED_PARAM_MISSING
                    message: mandatory param missing
                    details:
                      param_name: job_id
                  description: >-
                    Shows an error response returned when the **job_id** query
                    parameter is not provided in the request.
                  summary: An example error response of missing job_id parameter.
  /users/{userId}/actions/validate_before_transfer:
    get:
      security:
        - OAuth2:
