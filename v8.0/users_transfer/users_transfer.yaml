                  summary: An example error response when validating your own account.
                  value:
                    status: error
                    code: NOT_ALLOWED
                    message: Super Admin cannot be validated.
                    details:
                      resource_path_index: 1
                  description: >-
                    Shows an error response returned when the user attempts to
                    validate their own account before transfer.
components:
  parameters:
    JobId:
      name: job_id
      in: query
      required: true
      description: >-
        Indicates the ID of the job scheduled previously through the [Transfer
        Records and Delete User
        API](users_transfer.yaml#$.paths./users/{userId}/actions/transfer_and_delete.post).
      schema:
        type: string
        format: int64
    UserId:
      name: userId
      in: path
      required: true
      description: >-
        Represents the unique identifier of the user whose data is to be
        transferred and whose account is to be deleted. Use the [Get Users
        API](users.yaml#$.paths./users.get) API to get the valid values.
      schema:
        type: string
        format: int64
        pattern: ^[0-9]+$
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://accounts.zoho.com/oauth/v2/auth
          tokenUrl: https://accounts.zoho.com/oauth/v2/token
          refreshUrl: https://accounts.zoho.com/oauth/v2/token
          scopes:
            ZohoCRM.users.DELETE: Grants permission to delete existing user accounts from Zoho CRM.
            ZohoCRM.users.READ: Grants permission to retrieve user account details from Zoho CRM.
            ZohoCRM.users.CREATE: Grants permission to create new user accounts in Zoho CRM.
            ZohoCRM.users.UPDATE: >-
              Grants permission to modify existing user account details in Zoho
              CRM.
            ZohoCRM.change_owner.READ: >-
              Grants permission to retrieve the status of ownership transfer
              jobs in Zoho CRM.
            ZohoCRM.change_owner.CREATE: >-
              Grants permission to initiate ownership transfer operations for
              records in Zoho CRM.
