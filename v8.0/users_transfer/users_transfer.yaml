    get:
      security:
        - OAuth2:
            - ZohoCRM.users.DELETE
            - ZohoCRM.users.READ
      summary: Get transfer and delete status
      description: >-
        Retrieves the current status of a transfer and delete operation using
        the job ID returned by the POST request. The response indicates whether
        the job is scheduled, in progress, completed, or failed.
      operationId: getTransferStatus
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: >-
            Shows the success response of the retrieved transfer and delete
            status.
          content:
            application/json:
              schema:
                x-zs-$id: TransferStatusResponse
                type: object
                description: >-
                  Represents the response body for the transfer and delete
                  status request, containing the current status of the scheduled
                  job.
                additionalProperties: false
                properties:
                  transfer_and_delete:
                    type: array
                    description: >-
                      Represents the list of transfer and delete operation
                      status details. The array contains a maximum of one
                      object.
                    maxItems: 1
                    items:
                      type: object
                      description: >-
                        Each object represents the status details of a single
                        transfer and delete operation.
                      additionalProperties: false
                      properties:
                        status:
                          type: string
                          description: |
                            Represents the current status of the transfer and
                            delete operation. 


                            **Possible values**: 

                            - in_progress

                            - completed

                            - failed

                            - scheduled
                          enum:
                            - in_progress
                            - completed
                            - failed
                            - scheduled
                        reason:
                          type: string
                          description: >-
                            Represents the failure reason of the job when
                            `status` is `failed`. The key is not always present.
                          maxLength: 500
                required:
                  - transfer_and_delete
              examples:
                TransferStatusResponse:
                  value:
                    transfer_and_delete:
                      - status: completed
                  description: >-
                    Shows a successful response where the transfer and delete
                    operation status is completed.
                  summary: >-
                    An example of success response of a completed transfer and
                    delete status.
        '204':
          description: >-
            Shows that no transfer and delete job was found for the provided job
            ID.
        '400':
          description: The request failed due to an invalid or missing required parameter.
          content:
            application/json:
              schema:
                x-zs-$id: TransferStatusMissingParamError
                type: object
                description: >-
                  Represents the error response returned when a required
                  parameter is missing from the request.
                additionalProperties: false
                properties:
                  status:
                    type: string
                    description: Represents the status of the API request.
                    enum:
                      - error
                  code:
