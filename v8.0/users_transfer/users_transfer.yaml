      summary: Validate user before transfer
      description: >-
        Validates whether the specified user has open records, assignments,
        criteria configurations, subordinates, or alerts before transferring the
        user's data. Use this operation to check the user's dependencies before
        initiating a transfer.
      operationId: getValidateBeforeTransferStatus
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: The pre-transfer validation details were retrieved successfully.
          content:
            application/json:
              schema:
                x-zs-$id: ValidateBeforeTransferStatusResponse
                type: object
