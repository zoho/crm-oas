                required:
                  - status
                  - code
                  - message
                  - details
              examples:
                MissingJobIdError:
                  value:
                    status: error
                    code: REQUIRED_PARAM_MISSING
                    message: mandatory param missing
                    details:
                      param_name: job_id
                  description: >-
                    Shows an error response returned when the job_id query
                    parameter is not provided in the request.
                  summary: An example response of a missing job_id parameter.
  /users/{userId}/actions/transfer:
    post:
      security:
        - OAuth2:
            - ZohoCRM.change_owner.CREATE
      summary: Transfer a user
      description: Transfer user records, assignments, and criteria to another user
      operationId: userTransferAPI
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: >-
                Represents the request body to transfer a user's records,
                assignments, criteria, and subordinates to another user.
              additionalProperties: false
              properties:
                transfer:
                  type: array
                  description: >-
                    Specify the list of transfer operations to perform for the
                    user. Only one transfer operation is allowed per request.
                  maxItems: 1
                  items:
                    type: object
                    description: >-
                      Each object specifies the details of the transfer
                      operation including subordinate reassignment and data
                      transfer preferences.
                    additionalProperties: false
                    properties:
                      move_subordinate:
                        type: object
                        description: >-
                          The details of the new user you want to transfer the
                          subordinates of the old user to.
                        additionalProperties: false
                        properties:
                          id:
                            type: string
                            description: >-
                              Specify the unique identifier of the user to whom
                              the subordinates are reassigned. Use the [Get
                              Users API](users.yaml#$.paths./users.get) API to
                              get the valid values.
                            maxLength: 19
                        required:
                          - id
                      transfer:
                        type: object
