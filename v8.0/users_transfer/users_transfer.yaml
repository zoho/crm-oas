openapi: 3.1.0
info:
  title: Transfer And Delete User
  description: |
    To delete a user from CRM and transfer the records to a new user. You can
    replace the user at the following places:


    - Ownership: You can transfer all open records of the old user to the new
    user.

    - Assignment: You can replace the old user with new at places like
    assignment rules, escalation rules, field updates, automation actions etc.

    - Configuration/criteria: You can replace the user where the old user is
    used in criteria for custom views, automation, reports etc.


    When you delete a user through this API, a scheduler schedules a job and
    returns the job ID in the response. Use the Status API to check the
    [status](users_transfer.yaml#$.paths./users/actions/transfer_and_delete.get)
    of the job.
  version: '8'
servers:
  - url: https://zohoapis.{dc}/crm/{version}
    description: API Server URL
    variables:
      dc:
        enum:
          - com
          - eu
          - in
          - cn
          - au
        default: com
        description: API Server URL TLD
      version:
        default: v8
        description: API Version
paths:
  /users/{userId}/actions/transfer_and_delete:
    post:
      security:
        - OAuth2:
            - ZohoCRM.users.UPDATE
      summary: Transfer and delete a user
      description: Transfer user records, assignments, and criteria to another user
      operationId: userTransfer
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: Request body for transferring and deleting user data
              additionalProperties: false
              properties:
                transfer_and_delete:
                  type: array
                  description: >-
                    Specify the list of transfer and delete operations. The
                    array accepts a maximum of one object.
                  maxItems: 1
                  items:
                    type: object
                    description: >-
                      Each object specifies the details for the transfer and
                      delete operation.
                    additionalProperties: false
                    properties:
                      move_subordinate:
                        type: object
                        description: >-
                          Specify the details of the user to whom the
                          subordinates of the deleted user are moved.
                        additionalProperties: false
                        properties:
                          id:
                            type: string
                            description: >-
                              Specify the unique identifier of the user to whom
                              the subordinates are moved. Use the [Get Users
                              API](users.yaml#$.paths./users.get) API to get the
                              valid values.
                            maxLength: 19
                        required:
                          - id
                      transfer:
                        type: object
                        description: >-
                          Specify the transfer settings for records,
                          assignments, and criteria of the deleted user.
                        additionalProperties: false
                        properties:
                          records:
                            type: boolean
                            description: >-
                              Specify whether to transfer the open records of
                              the deleted user to the new user. 
                          assignment:
                            type: boolean
                            description: >-
                              Specify whether to replace the user in assignment
                              rules, escalation rules, field updates, and
                              automation actions. 
                          criteria:
                            type: boolean
                            description: >-
                              Specify whether to replace the user in criteria
                              for custom views, automation, and reports. 
                          id:
                            type: string
                            description: >-
                              Specify the unique identifier of the user to whom
                              the records are transferred. Use the [Get Users
                              API](users.yaml#$.paths./users.get) API to get the
                              valid values.
                            maxLength: 19
                        required:
                          - id
                    required:
                      - move_subordinate
                      - transfer
              required:
                - transfer_and_delete
            examples:
              TransferAndDeleteExample:
                value:
                  transfer_and_delete:
                    - move_subordinate:
                        id: '5725767000000411001'
                      transfer:
                        records: true
                        assignment: true
                        criteria: false
                        id: '5725767000000411002'
                description: >-
                  Shows a request to transfer records and assignments to one
                  user and move subordinates to another user, with criteria
                  transfer disabled.
                summary: >-
                  An example response of Transfer and delete request with
                  records and assignments.
        required: true
        description: >-
          The request body to transfer the records, assignments, criteria, and
          subordinates of the specified user before deletion.
      responses:
        '200':
          description: >-
            Shows the user transfer and delete operation is scheduled
            successfully.
          content:
            application/json:
              schema:
                x-zs-$id: UserTransferResponse
                type: object
                description: >
                  Provides the response body for successful user transfer and
                  delete operation.
                additionalProperties: false
                properties:
                  transfer_and_delete:
                    type: array
                    description: >-
                      Represents the list of transfer and delete operation
                      results. The array contains a maximum of one object.
                    maxItems: 1
                    items:
                      type: object
                      description: >-
                        Represents the result of a single transfer and delete
                        operation.
                      additionalProperties: false
                      properties:
                        status:
                          type: string
                          description: Represents the status of the operation.
                          maxLength: 100
                        code:
                          type: string
                          description: 'Represents the response code of the operation. '
                          enum:
                            - SUCCESS
                        message:
                          type: string
                          description: >-
                            Represents the message describing the result of the
                            operation.
                          maxLength: 500
                        details:
                          type: object
                          description: >-
                            Represents additional details about the scheduled
                            transfer and delete operation, including the job ID.
                          additionalProperties: false
                          properties:
                            job_id:
                              type: string
                              description: >-
                                Represents the unique identifier of the
                                scheduled transfer and delete job. Use this ID
                                with the
                                [status](users_transfer.yaml#$.paths./users/actions/transfer_and_delete.get)
                                endpoint to track the progress of the job.
                              maxLength: 50
                          required:
                            - job_id
                      required:
                        - status
                        - code
                        - message
                        - details
                required:
                  - transfer_and_delete
              examples:
                SuccessResponse:
                  value:
                    transfer_and_delete:
                      - status: success
                        code: SUCCESS
                        message: User is deleted successfully
                        details:
                          job_id: '5725767000000498001'
                  description: >-
                    Shows a successful response where the system deletes the
                    user and returns a job ID for tracking the transfer
                    progress.
                  summary: An example of successful transfer and delete operation.
        '400':
          description: >-
            Represents the error response when the request has invalid data or
            any missing required fields.
          content:
            application/json:
              schema:
                x-zs-$id: UserTransferInvalidDataResponse
                oneOf:
                  - x-zs-$id: UserTransferErrorWithArray
                    type: object
                    description: >-
                      Represents an error scenario where the response contains
                      validation errors wrapped inside the transfer_and_delete
                      array.
                    additionalProperties: false
                    properties:
                      transfer_and_delete:
                        type: array
                        description: >-
                          Represents the array of error results from the user
                          transfer and delete operation.
                        maxItems: 1
                        items:
                          oneOf:
                            - x-zs-$id: UserTransferValidationError
                              type: object
                              additionalProperties: false
                              description: >-
                                Represents a validation error indicating that
                                the request contains invalid data or a
                                disallowed operation.
                              properties:
                                status:
                                  type: string
                                  description: 'Represents the status of the API request. '
                                  enum:
                                    - error
                                code:
                                  type: string
                                  description: >-
                                    Represents the error code for the validation
                                    failure. 
                                  enum:
                                    - INVALID_DATA
                                    - NOT_ALLOWED
                                message:
                                  type: string
                                  description: >-
                                    Represents the error message describing the
                                    validation failure.
                                  maxLength: 500
                                details:
                                  oneOf:
                                    - x-zs-$id: UserTransferNotAllowedPathDetails
                                      type: object
                                      description: >-
                                        Represents error details returned when
                                        the user is not allowed to transfer
                                        (e.g. Super Admin cannot be deleted).
                                      additionalProperties: false
                                      properties:
                                        resource_path_index:
                                          type: integer
                                          description: >-
                                            Represents the index of the resource
                                            path that caused the validation error.
                                          format: int32
                                      required:
                                        - resource_path_index
                                    - x-zs-$id: UserTransferInvalidIdDetails
                                      type: object
                                      description: >-
                                        Represents error details returned when
                                        the provided user ID is invalid or does
                                        not exist in the system.
                                      additionalProperties: false
                                      properties:
                                        id:
                                          type: string
                                          description: >-
                                            Represents the identifier value that
                                            failed validation in the request.
                                          maxLength: 19
                                      required:
                                        - id
                                    - x-zs-$id: UserTransferInvalidFieldDetails
                                      type: object
                                      description: >-
                                        Represents error details returned when a
                                        specified field name or JSON path is
                                        invalid in the transfer request.
                                      additionalProperties: false
                                      properties:
                                        api_name:
                                          type: string
                                          description: >-
                                            Represents the API name of the field
                                            that failed validation.
                                          maxLength: 100
                                        json_path:
                                          type: string
                                          description: >-
                                            Represents the JSON path of the field
                                            that failed validation in the request
                                            body.
                                          maxLength: 200
                                      required:
                                        - api_name
                                        - json_path
                                    - x-zs-$id: InvalidDataTypeDetails
                                      type: object
                                      description: >-
                                        Represents error details returned when a
                                        field value does not match the expected
                                        data type in the transfer request.
                                      additionalProperties: false
                                      properties:
                                        api_name:
                                          type: string
                                          description: >-
                                            Represents the API name of the field
                                            that contains an incorrect data type.
                                          maxLength: 100
                                        json_path:
                                          type: string
                                          description: >-
                                            Represents the JSON path of the field
                                            that contains an incorrect data type.
                                          maxLength: 200
                                        expected_data_type:
                                          type: string
                                          description: >-
                                            Represents the data type that the field
                                            expects for a valid request.
                                          maxLength: 50
                                      required:
                                        - api_name
                                        - json_path
                                        - expected_data_type
                                    - x-zs-$id: InvalidOwnerStatusDetails
                                      type: object
                                      description: >-
                                        Represents error details returned when
                                        the target user has an invalid owner
                                        status such as not being a CRM user,
                                        deleted, or inactive.
                                      additionalProperties: false
                                      properties:
                                        api_name:
                                          type: string
                                          description: >-
                                            Represents the API name of the field
                                            associated with an invalid owner status.
                                          maxLength: 100
                                        json_path:
                                          type: string
                                          description: >-
                                            Represents the JSON path of the field
                                            associated with an invalid owner status.
                                          maxLength: 200
                                        owner_status:
                                          type: string
                                          description: |
                                            Represents the current status of the
                                            user that prevents the transfer. 

                                            **Possible values**: 

                                            - no_crm_user

                                            - deleted

                                            - inactive
                                          enum:
                                            - no_crm_user
                                            - deleted
                                            - inactive
                                      required:
                                        - api_name
                                        - json_path
                                        - owner_status
                                    - x-zs-$id: InvalidArrayElementDetails
                                      type: object
                                      description: >-
                                        Represents error details returned when
                                        an array element contains invalid data
                                        or does not match the expected data
                                        type.
                                      additionalProperties: false
                                      properties:
                                        index:
                                          type: integer
                                          description: >-
                                            Represents the zero-based index of the
                                            array element that contains invalid
                                            data.
                                          format: int32
                                        json_path:
                                          type: string
                                          description: >-
                                            Represents the JSON path of the array
                                            element that contains invalid data.
                                          maxLength: 200
                                        expected_data_type:
                                          type: string
                                          description: >-
                                            Represents the data type that the array
                                            element expects for a valid request.
                                          maxLength: 50
                                      required:
                                        - index
                                        - json_path
                                        - expected_data_type
                                  description: >-
                                    Represents the contextual details of the
                                    validation error, varying based on the type
                                    of invalid data encountered.
                              required:
                                - status
                                - code
                                - message
                                - details
                            - x-zs-$id: UserTransferExpectedFieldMissingError
                              type: object
                              additionalProperties: false
                              description: >-
                                Represents the error response body for a request
                                where required fields are missing. 
                              properties:
                                status:
                                  type: string
                                  description: 'Represents the status of the API request. '
                                  enum:
                                    - error
                                code:
                                  type: string
                                  description: >-
                                    Represents the error code when required
                                    fields are missing. 
                                  enum:
                                    - EXPECTED_FIELD_MISSING
                                message:
                                  type: string
                                  description: >-
                                    Represents the error message describing the
                                    missing required fields.
                                  maxLength: 500
                                details:
                                  type: object
                                  description: >-
                                    Represents the details of the missing
                                    required fields in the request.
                                  additionalProperties: false
                                  properties:
                                    expected_data:
                                      type: array
                                      description: >-
                                        Represents the list of required fields
                                        that are missing from the request body.
                                      maxItems: 100
                                      items:
                                        type: object
                                        description: >-
                                          Each object represents the details of a
                                          single required field that is missing
                                          from the request.
                                        additionalProperties: false
                                        properties:
                                          api_name:
                                            type: string
                                            description: >-
                                              Represents the API name of the required
                                              field that is missing from the request.
                                            maxLength: 100
                                          json_path:
                                            type: string
                                            description: >-
                                              Represents the JSON path of the required
                                              field that is missing from the request.
                                            maxLength: 200
                                        required:
                                          - api_name
                                          - json_path
                              required:
                                - status
                                - code
                                - message
                                - details
                            - x-zs-$id: UserTransferMandatoryFieldMissingError
                              type: object
                              additionalProperties: false
                              description: >-
                                Represents the error response returned when the
                                transfer or move_subordinate object is present
                                but its required id field is missing or null.
                              properties:
                                status:
                                  type: string
                                  description: 'Represents the status of the API request. '
                                  enum:
                                    - error
                                code:
                                  type: string
                                  description: >-
                                    Represents the error code when a required
                                    nested field is missing. 
                                  enum:
                                    - MANDATORY_NOT_FOUND
                                message:
                                  type: string
                                  description: >-
                                    Represents the error message describing the
                                    missing required field.
                                  maxLength: 500
                                details:
                                  type: object
                                  description: >-
                                    Represents the details of the missing
                                    required id field.
                                  additionalProperties: false
                                  properties:
                                    api_name:
                                      type: string
                                      description: >-
                                        Represents the API name of the missing
                                        field.
                                      enum:
                                        - id
                                    json_path:
                                      type: string
                                      description: >-
                                        Represents the JSON path of the missing
                                        field.
                                      maxLength: 200
                                    parent_api_name:
                                      type: string
                                      description: >-
                                        Represents the parent field under which
                                        the id field is missing.
                                      enum:
                                        - transfer
                                        - move_subordinate
                                  required:
                                    - api_name
                                    - json_path
                                    - parent_api_name
                              required:
                                - status
                                - code
                                - message
                                - details
                          description: >-
                            Each object represents an error entry returned when
                            validation fails or required fields are missing
                            during the transfer and delete operation.
                    required:
                      - transfer_and_delete
                  - x-zs-$id: UserTransferInvalidUserDataError
                    type: object
                    description: >-
                      Represents a top-level error returned when the user ID in
                      the request path is invalid or a data constraint is
                      violated.
                    additionalProperties: false
                    properties:
                      status:
                        type: string
                        description: 'Represents the status of the API request. '
                        enum:
                          - error
                      code:
                        type: string
                        description: >-
                          Represents the error code for the invalid data or user
                          error. 
                        enum:
                          - INVALID_DATA
                          - NOT_ALLOWED
                      message:
                        type: string
                        description: >-
                          Represents the error message describing the invalid
                          user.
                        maxLength: 500
                      details:
                        oneOf:
                          - x-zs-$id: UserTransferInvalidUserInPathDetails
                            type: object
                            description: >-
                              Represents error details returned when the user ID
                              in the request path is not allowed to be deleted
                              (e.g. own account), or refers to a non-CRM or
                              deleted user.
                            additionalProperties: false
                            properties:
                              resource_path_index:
                                type: integer
                                description: >-
                                  Represents the position index of the invalid
                                  user ID in the resource path.
                                format: int32
                              owner_status:
                                type: string
                                description: >-
                                  Represents the current status of the user
                                  specified in the request path. Not returned
                                  for the NOT_ALLOWED case where the user tries
                                  to delete their own account. 
                                enum:
                                  - not_crm_user
                                  - deleted
                            required:
                              - resource_path_index
                          - x-zs-$id: UserTransferMaximumLengthExceededDetails
                            type: object
                            description: >-
                              Represents error details returned when a field
                              value exceeds the maximum allowed length.
                            additionalProperties: false
                            properties:
                              api_name:
                                type: string
                                description: >-
                                  Represents the API name of the field that
                                  exceeds the maximum allowed length.
                                maxLength: 100
                              json_path:
                                type: string
                                description: >-
                                  Represents the JSON path of the field that
                                  exceeds the maximum allowed length.
                                maxLength: 200
                              maximum_length:
                                type: integer
                                description: >-
                                  Represents the maximum number of elements
                                  allowed in the field.
                                format: int32
                            required:
                              - api_name
                              - json_path
                              - maximum_length
                        description: >-
                          Represents the contextual details about the invalid
                          user.
                    required:
                      - status
                      - code
                      - message
                      - details
                  - x-zs-$id: UserTransferJobLimitExceededError
                    type: object
                    additionalProperties: false
                    description: >-
                      Represents the error returned when the maximum number of
                      concurrently scheduled transfer and delete jobs has been
                      reached.
                    properties:
                      status:
                        type: string
                        description: 'Represents the status of the API request. '
                        enum:
                          - error
                      code:
                        type: string
                        description: >-
                          Represents the error code returned when the scheduler
                          job limit is reached. 
                        enum:
                          - CONCURRENT_JOB_LIMIT_EXCEEDED
                      message:
                        type: string
                        description: >-
                          Represents the error message describing the scheduler
                          limit.
                        maxLength: 500
                      details:
                        type: object
                        description: >-
                          Represents the details of the exceeded scheduler
                          limit.
                        additionalProperties: false
                        properties:
                          limit:
                            type: string
                            description: >-
                              Represents the maximum number of transfer and
                              delete jobs that can be scheduled concurrently.
                            maxLength: 10
                        required:
                          - limit
                    required:
                      - status
                      - code
                      - message
                      - details
                description: >-
                  Represents the error response returned when the transfer and
                  delete operation request contains invalid data or is missing
                  required fields.
              examples:
                NotAllowedError:
                  value:
                    code: NOT_ALLOWED
                    details:
                      resource_path_index: 1
                    message: Super Admin cannot be Deleted.
                    status: error
                InvalidDataError1:
                  value:
                    code: INVALID_DATA
                    details:
                      resource_path_index: 1
                      owner_status: deleted
                    message: the user id provided is already deleted.
                    status: error
                  description: >-
                    Shows an error response returned when the user ID in the
                    request path refers to a deleted user.
                  summary: An example response of deleted user provided in the path.
                InvalidDataError2:
                  value:
                    transfer_and_delete:
                      - code: INVALID_DATA
                        details:
                          api_name: id
                          json_path: $.transfer_and_delete.transfer.id
                          owner_status: deleted
                        message: >-
                          The user to whom you are trying to transfer is
                          deleted.
                        status: error
                  description: >-
                    Shows an error response returned when the transfer target
                    user has a deleted owner status.
                  summary: >-
                    An example error response of deleted transfer target user
                    request.
                ExpectedFieldMissingError:
                  value:
                    transfer_and_delete:
                      - code: EXPECTED_FIELD_MISSING
                        details:
                          expected_data:
                            - api_name: transfer
                              json_path: $.transfer_and_delete.transfer
                            - api_name: move_subordinate
                              json_path: $.transfer_and_delete.move_subordinate
                        message: Specify atleast one field
                        status: error
                  description: >-
                    Shows an error response returned when the required transfer
                    and move_subordinate fields are not provided in the request.
                  summary: An example of missing required fields in the request.
                MandatoryFieldMissingError:
                  value:
                    transfer_and_delete:
                      - code: MANDATORY_NOT_FOUND
                        details:
                          api_name: id
                          json_path: $.transfer_and_delete.transfer.id
                          parent_api_name: transfer
                        message: required field not found
                        status: error
                  description: >-
                    Shows an error response returned when the transfer object is
                    present but its required id field is missing.
                  summary: An example of a missing id field inside the transfer object.
                JobLimitExceededError:
                  value:
                    status: error
                    code: CONCURRENT_JOB_LIMIT_EXCEEDED
                    message: Transfer and delete user scheduler limit reached
                    details:
                      limit: '10'
                  description: >-
                    Shows an error response returned when the maximum number of
                    concurrently scheduled transfer and delete jobs has been
                    reached.
                  summary: >-
                    An example error response for exceeding the concurrent
                    scheduler job limit.
        '403':
          description: >-
            Shows the error response body of a request when the user does not
            have enough permission to perform the operation.
          content:
            application/json:
              schema:
                x-zs-$id: UserPermissionDeniedError
                type: object
                description: >-
                  Represents the error response returned when the user does not
                  have the required permissions to perform the transfer and
                  delete operation.
                additionalProperties: false
                properties:
                  status:
                    type: string
                    description: 'Represents the status of the error response. '
                    enum:
                      - error
                  code:
                    type: string
                    description: >-
                      Represents the error code returned when the user lacks the
                      required permission. 
                    enum:
                      - NO_PERMISSION
                  message:
                    type: string
                    description: >-
                      Represents the error message describing the permission
                      issue. 
                    maxLength: 500
                  details:
                    type: object
                    description: >+
                      Represents the additional details about missing
                      permissions.


                    additionalProperties: false
                    properties:
                      permissions:
                        type: array
                        description: >
                          Provides the list of required permissions that are
                          missing.
                        maxItems: 1
                        items:
                          type: string
                          description: >-
                            Each string epresents the specific CRM permission
                            that the user lacks to perform the transfer
                            operation, such as `Crm_Implied_Change_Owner_Leads`.
                          maxLength: 200
                    required:
                      - permissions
                required:
                  - status
                  - code
                  - message
              examples:
                NoPermissionError:
                  value:
                    status: error
                    code: NO_PERMISSION
                    message: You do not have permission to perform this operation
                    details:
                      permissions:
                        - Crm_Implied_Change_Owner_Leads
                  description: >-
                    Shows an error response returned when the caller lacks the
                    Crm_Implied_Change_Owner_Leads permission.
                  summary: An example error response for no permission to transfer.
                SuperAdminPermissionError:
                  value:
                    status: error
                    code: NO_PERMISSION
                    message: Only super admin has permission to delete users
                  description: >-
                    Shows an error response returned when a non-super-admin user
                    attempts to transfer and delete a user. The **details**
                    object is not returned for this case.
                  summary: >-
                    An example error response when the caller is not a super
                    admin.
  /users/actions/transfer_and_delete:
    post:
      security:
        - OAuth2:
            - ZohoCRM.users.UPDATE
      summary: Transfer and delete a user
      description: Transfer user records, assignments, and criteria to another user
      operationId: userTransferWithoutId
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: Request body for transferring and deleting user data
              additionalProperties: false
              properties:
                transfer_and_delete:
                  type: array
                  description: >-
                    Specify the list of user transfer and delete operations to
                    perform. The array accepts a maximum of one entry.
                  maxItems: 1
                  items:
                    type: object
                    description: >-
                      Each object specifies the details of the user transfer and
                      delete operation.
                    additionalProperties: false
                    properties:
                      id:
                        type: string
                        description: >-
                          Specify the unique identifier of the user whose data
                          is to be transferred and who is to be deleted.
                        maxLength: 19
                      move_subordinate:
                        type: object
                        description: >-
                          Provides the details of the user to whom subordinates
                          will be moved.
                        additionalProperties: false
                        properties:
                          id:
                            type: string
                            description: >-
                              Specify the unique identifier of the user to whom
                              the subordinates of the deleted user are moved.
                              Use the [Get Users
                              API](users.yaml#$.paths./users.get) API to get the
                              valid values.
                            maxLength: 19
                        required:
                          - id
                      transfer:
                        type: object
                        description: >-
