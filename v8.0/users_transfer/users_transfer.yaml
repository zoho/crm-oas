                        alert:
                          type: boolean
                          description: 'Indicates whether alerts exist for the user. '
                required:
                  - validate_before_transfer
              examples:
                TransferStatusResponse:
                  value:
                    validate_before_transfer:
                      - id: '5725767000000411001'
                        name: John Doe
                        assignment: true
                        criteria: false
                        subordinates: true
                        alert: false
