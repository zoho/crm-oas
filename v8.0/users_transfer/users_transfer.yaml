                      Represents the list of pre-transfer validation results for
                      the specified user. The array contains a maximum of one
                      object.
                    maxItems: 1
                    items:
                      type: object
                      description: >-
                        Represents the validation details for a single user
                        before transfer.
                      additionalProperties: false
                      properties:
                        id:
                          type: string
                          description: >-
                            Represents the unique identifier of the user being
                            validated.
                          maxLength: 19
                        name:
                          type: string
                          description: Represents the name of the user being validated.
                          maxLength: 250
                        assignment:
                          type: boolean
                          description: 'Indicates whether assignments exist for the user. '
                        criteria:
                          type: boolean
