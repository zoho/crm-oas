  /users/actions/transfer:
    get:
      security:
        - OAuth2:
            - ZohoCRM.change_owner.READ
      summary: Get user transfer status
      description: >-
        Retrieves the current status of a user transfer operation using the job
        ID returned by the transfer request. The response indicates whether the
        transfer job is scheduled, in progress, completed, or failed.
      operationId: getTransferAPIStatus
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: The transfer status was retrieved successfully.
          content:
            application/json:
              schema:
                x-zs-$id: TransferAPIStatusResponse
                type: object
                description: >-
                  Represents the response body for the transfer status request,
                  containing the current status of the scheduled transfer job.
                additionalProperties: false
                properties:
                  transfer:
                    type: array
                    description: >-
                      Represents the list of transfer operation status details.
                      The array contains a maximum of one object.
                    maxItems: 1
                    items:
                      type: object
                      description: >-
                        Each object represents the status details of a single
                        transfer operation.
                      additionalProperties: false
                      properties:
                        status:
                          type: string
                          description: |
                            Represents the current status of the transfer
                            operation. 


                            **Possible values**: 

                            - in_progress

                            - completed

                            - failed

                            - scheduled
                          enum:
                            - in_progress
                            - completed
                            - failed
                            - scheduled
                        reason:
                          type: string
                          description: >-
                            Represents the failure reason of the job when
                            `status` is `failed`. Not always present.
                          maxLength: 500
                required:
                  - transfer
              examples:
                TransferStatusResponse:
                  value:
                    transfer:
                      - status: completed
                  description: >-
                    Shows a successful response where the transfer operation
                    status is completed.
                  summary: An example response of completed transfer status.
        '204':
          description: >-
            Shows the response when no transfer job was found for the provided
            job ID.
        '400':
          description: The request failed due to an invalid or missing required parameter.
          content:
            application/json:
              schema:
                x-zs-$id: TransferAPIMissingParamError
                type: object
                description: >-
                  Represents the error response returned when a required
                  parameter is missing from the request.
                additionalProperties: false
                properties:
                  status:
                    type: string
                    description: 'Represents the status of the API request. '
                    enum:
                      - error
                  code:
                    type: string
                    description: 'Represents the error code for the failed request. '
                    enum:
                      - REQUIRED_PARAM_MISSING
                  message:
                    type: string
                    description: >-
                      Represents the error message describing the missing
                      parameter. 
                    enum:
                      - mandatory param missing
                  details:
                    type: object
                    description: >-
                      Represents additional details about the error, including
                      the name of the missing parameter.
                    additionalProperties: false
                    properties:
                      param_name:
                        type: string
                        description: >-
                          Represents the name of the missing required
                          parameter. 
                        enum:
                          - job_id
                    required:
                      - param_name
                required:
                  - status
