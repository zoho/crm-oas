components:
  parameters:
    Shift:
      name: shift
      in: path
      required: true
      description: >-
        Represents the unique identifier of the shift hour to retrieve, update,
        or delete.
      schema:
        type: string
        maxLength: 50
      examples:
        Default:
          value: '5725767000000296005'
          summary: Example shift hour ID
  responses:
    ShiftHoursMultiStatusResponse:
      description: >-
        Returned when a batch request partially succeeds where some items
        succeed and some fail. Each item in the shift_hours array carries its
        own code, status, message, and details.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ShiftHoursSuccessResponse'
          examples:
            Default:
              value:
                shift_hours:
                  - code: SUCCESS
                    details:
                      id: '12345'
                    message: Success
                    status: success
              description: >-
                Example multi-status response where some items succeed and
                others fail.
              summary: An example multi-status response.
    ShiftHoursSuccessResponse:
      description: >-
        Returned when the shift hour create, update, or delete operation
        completes successfully.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ShiftHoursSuccessResponse'
          examples:
            Default:
              value:
                shift_hours:
                  - code: SUCCESS
                    details:
                      id: '12345'
                    message: Success
                    status: success
              description: >-
                Example success response returned after a shift hour create,
                update, or delete operation.
              summary: An example success response.
    ForbiddenResponse:
      description: >-
        Returned when the requesting user does not hold the CRM profile
        permission required to manage shift hours.
      content:
        application/json:
          schema:
            type: object
            x-zs-$id: ShiftHoursErrorResponseForbidden
            description: >-
              Represents the forbidden response returned when the requesting
              user does not hold the CRM profile permission required to manage
              shift hours.
            properties:
              code:
                type: string
                description: >-
                  Represents the response code that identifies the outcome of
                  the operation.
                enum:
                  - NO_PERMISSION
              details:
                type: object
                description: >-
                  Represents additional details about the outcome of the
                  operation.
                properties:
                  permissions:
                    type: array
                    items:
                      type: string
                      enum:
                        - Crm_Implied_Manage_Users
                      description: >-
                        Each object represents a CRM profile permission missing
                        from the requesting user's profile.
                    description: >-
                      Lists the CRM profile permissions that the user must hold
                      to access this API.
                    maxItems: 50
                additionalProperties: false
              message:
                type: string
                description: >-
                  Represents the message that describes the outcome of the
                  operation.
                maxLength: 100
              status:
                type: string
                description: Represents the status of the operation.
                enum:
                  - error
            additionalProperties: false
          examples:
            Default:
              value:
                code: NO_PERMISSION
                message: Permission denied
                status: error
                details:
                  permissions:
                    - Crm_Implied_Manage_Users
              description: >-
                Example response when the requesting user lacks the CRM profile
                permission required to manage shift hours.
              summary: >-
                An example of error response where the user does not have enough
                permission to perform this request.
    NoContentResponse:
      description: >-
        Returned when no shift hours are configured for the organization, or
        when the requested shift hour does not exist.
  schemas:
    ShiftHoursSuccessResponse:
      type: object
      x-zs-$id: ShiftHoursSuccessResponse
      description: >-
        Represents the response body that contains the shift hour configurations
        and the aggregate count of shifts with assigned users.
      properties:
        shift_hours:
          type: array
          description: 'Lists the shift hour configurations in the request or response. '
          items:
            type: object
            description: >-
              Each object represents one shift hour with its timing, break
              hours, holidays, and assigned users.
            properties:
              code:
                type: string
                description: Represents the response code of the operation.
                enum:
                  - SUCCESS
              message:
                type: string
                description: >-
                  Represents the message that describes the outcome of the
                  operation.
                maxLength: 100
              details:
                type: object
                description: >-
                  Represents additional details about the outcome of the
                  operation.
                properties:
                  id:
                    type: string
                    description: >-
                      Represents the unique identifier of the shift hour
                      affected by the operation.
                    maxLength: 100
                    x-zs-$id: ShiftHoursDetailsId
                required:
                  - id
                additionalProperties: false
              status:
                type: string
                description: Represents the status of the operation.
                enum:
                  - success
            required:
              - code
              - message
              - details
              - status
            additionalProperties: false
          maxItems: 50
      required:
        - shift_hours
      additionalProperties: false
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://accounts.zoho.com/oauth/v2/auth
          tokenUrl: https://accounts.zoho.com/oauth/v2/token
          refreshUrl: https://accounts.zoho.com/oauth/v2/token
          scopes:
            ZohoCRM.settings.business_hours.ALL: >-
              Grants full access to manage business hours and shift hour
              configurations, including create, read, update, and delete
              operations.
            ZohoCRM.settings.business_hours.CREATE: >-
              Grants create access to add new shift hour configurations under
              business hours.
            ZohoCRM.settings.business_hours.READ: >-
              Grants read access to retrieve business hours and shift hour
              configurations.
            ZohoCRM.settings.business_hours.UPDATE: >-
              Grants update access to modify existing shift hour configurations
              under business hours.
            ZohoCRM.settings.business_hours.DELETE: >-
              Grants delete access to remove existing shift hour configurations
              under business hours.
