    put:
      summary: Update shift hours
      description: >-
        Updates one or more shift hour configurations for the organization. Each
        entry in `shift_hours` identifies the shift hour to update and the
        fields to change, such as the time zone, active days, timing, break
        windows, holidays, or user assignments. The updated timing must fall
        within the configured business hours.
      security:
        - OAuth2:
            - ZohoCRM.settings.business_hours.UPDATE
      operationId: updateShiftHours
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: >-
                Represents the request body for updating one or more shift hour
                configurations. Each entry in `shift_hours` updates an existing
                shift with its timing, break hours, optional holidays, and
                assigned users.
              properties:
                shift_hours:
                  type: array
                  description: >-
                    Lists the shift hour configurations to be created or updated
                    in the request. 
                  items:
                    type: object
                    description: >-
                      Each object specifies a shift hour with its timing, break
                      hours, holidays, and assigned users.
                    properties:
                      break_hours:
                        type: array
                        description: >-
                          Lists the break windows scheduled within the shift
                          hour. A shift can have at most two break windows.
                        items:
                          type: object
                          description: >-
                            Each object specifies the days the break applies to
                            and the break timing for those days.
                          properties:
                            break_days:
                              type: array
                              description: >-
                                Lists the days of the week on which the break
                                hour applies.
                              items:
                                type: string
                                description: |
                                  Represents one day of the week on which the
                                  break hour applies.


                                  **Possible values**: 

                                  - Monday

                                  - Thursday

                                  - Friday

                                  - Sunday

                                  - Wednesday

                                  - Tuesday

                                  - Saturday
                                enum:
                                  - Monday
                                  - Thursday
                                  - Friday
                                  - Sunday
                                  - Wednesday
                                  - Tuesday
                                  - Saturday
                              maxItems: 7
                            daily_timing:
                              type: array
                              description: |
                                Represents the start and end time of the break
                                in `HH:MM` 24-hour format, applied uniformly to
                                every day the break is scheduled. 


                                This field is **mandatory** when the parent
                                **same_as_everyday** is **true**. A day can have
                                at most two breaks and the total break time on a
                                day cannot exceed two hours.
                              items:
                                type: string
                                pattern: ^([0-1][0-9]|2[0-3]):[0-5][0-9]$
                                description: >
                                  "Represents the start time or end time of the
                                  window in `HH:MM`

                                  24-hour format. "
                                maxLength: 5
                              maxItems: 50
                            custom_timing:
                              type: array
                              description: >-
                                Lists per-day break timing overrides. This field
                                is **mandatory** when the parent
                                **same_as_everyday** is **false**. A day can
                                have at most two breaks and the total break time
                                on a day cannot exceed two hours.
                              items:
                                type: object
                                description: >-
                                  Each object specifies the day of the week and
                                  the start and end time of the break on that
                                  day. 
                                properties:
                                  break_timing:
                                    type: array
                                    description: >
                                      Represents the start and end time of the
                                      break on the specified day

                                      in `HH:MM` 24-hour format. A break must be

                                      longer than 15 minutes and shorter than 2

                                      hours.
                                    items:
                                      type: string
                                      pattern: ^([0-1][0-9]|2[0-3]):[0-5][0-9]$
                                      description: >
                                        Each string represents the start time or
                                        end time of the window in

                                        `HH:MM` 24-hour format. 
                                      maxLength: 5
                                    maxItems: 7
                                  days:
                                    type: string
                                    description: |
                                      Represents the day of the week to which
                                      this custom break timing applies.


                                      **Possible values**: 

                                      - Monday

                                      - Tuesday

                                      - Wednesday

                                      - Thursday

                                      - Friday

                                      - Saturday

                                      - Sunday
                                    enum:
                                      - Monday
                                      - Thursday
                                      - Friday
                                      - Sunday
                                      - Wednesday
                                      - Tuesday
                                      - Saturday
                                additionalProperties: false
                              maxItems: 50
                            same_as_everyday:
                              type: string
                              description: >-
                                Indicates whether the shift hour follows the
                                same timing on every active day. When the value
                                is **true**, the **daily_timing** array becomes
                                mandatory; when the value is **false**, the
                                **custom_timing** array becomes mandatory.
                              maxLength: 100
                          additionalProperties: false
                        maxItems: 50
                      daily_timing:
                        type: array
                        description: >
                          Represents the start and end time of the shift in
                          `HH:MM` 24-hour

                          format, applied uniformly to every active day. This

                          field is **mandatory** when **same_as_everyday** is

                          **true**.
                        items:
                          type: string
                          pattern: ^([0-1][0-9]|2[0-3]):[0-5][0-9]$
                          description: >
                            "Represents the start time or end time of the window
                            in `HH:MM`

                            24-hour format. "
                          maxLength: 5
                        maxItems: 50
                      shift_days:
                        type: array
                        description: >-
                          Lists the days of the week on which the shift hour is
                          active. You can set shift timing only on the days your
                          organization operates.
                        items:
                          type: string
                          description: |
                            Each string represents one day of the week on which
                            the shift hour is active.


                            **Possible values**: 

                            - Monday

                            - Tuesday

                            - Wednesday

                            - Thursday

                            - Friday

                            - Saturday

                            - Sunday
                          enum:
                            - Monday
                            - Thursday
                            - Friday
                            - Sunday
                            - Wednesday
                            - Tuesday
                            - Saturday
                        maxItems: 7
                      custom_timing:
                        type: array
                        description: >-
                          Lists per-day shift timing overrides. This field is
                          **mandatory** when **same_as_everyday** is **false**.
                        items:
                          type: object
                          description: >-
                            Each object specifies the day of the week and the
                            start and end time of the shift on that day. 
                          properties:
                            shift_timing:
                              type: array
                              description: >
                                Represents the start and end time of the shift
                                on the specified

                                day in `HH:MM` 24-hour format. 
                              items:
                                type: string
                                pattern: ^([0-1][0-9]|2[0-3]):[0-5][0-9]$
                                description: >
                                  Each string represents the start time or end
                                  time of the window in

                                  `HH:MM` 24-hour format. 
                                maxLength: 5
                              maxItems: 7
                            days:
                              type: string
                              description: |
                                Represents the day of the week to which this
                                custom shift timing applies.


                                **Possible values**: 

                                - Monday

                                - Tuesday

                                - Wednesday

                                - Thursday

                                - Friday

                                - Saturday

                                - Sunday
                              enum:
                                - Monday
                                - Thursday
                                - Friday
                                - Sunday
                                - Wednesday
                                - Tuesday
                                - Saturday
                          additionalProperties: false
                        maxItems: 50
                      timezone:
                        type: string
                        description: >-
                          Represents the time zone in which the shift hours are
                          scheduled. 
                        maxLength: 100
                      name:
                        type: string
                        description: >-
                          Represents the name of the shift hour. The name must
                          be unique within the organization and must not contain
                          the special characters.
                        maxLength: 80
                      same_as_everyday:
                        type: boolean
                        description: |
                          Indicates whether the shift hour follows the same
                          timing on every active day. 


                          **Possible values**:

                          - **true** - the shift hour uses the same timing every
                          day, and **daily_timing** becomes mandatory.

                          - **false** - the shift hour uses different timing for
                          different days, and **custom_timing** becomes
                          mandatory.
                      holidays:
                        type: array
                        description: >-
                          Lists the holidays observed during the shift hour. The
                          holiday date must fall between the current and the
                          next financial year.
                        items:
                          type: object
                          description: >-
                            Each object specifies the date and the name of the
                            holiday. 
                          properties:
                            date:
                              type: string
                              format: date
                              description: >-
                                Represents the date of the holiday in
                                `YYYY-MM-DD` format.
                            name:
                              type: string
                              description: >-
                                Represents the name of the holiday. The name
                                must not contain the special characters.
                              maxLength: 80
                          additionalProperties: false
                        maxItems: 50
                      users:
                        type: array
                        description: Lists the users assigned to the shift hour.
                        items:
                          type: object
                          description: ' Each object specifies the user and the date from which the assignment becomes effective.'
                          properties:
                            id:
                              type: string
                              description: >-
                                Represents the unique identifier of the user
                                assigned to the shift hour.
                              maxLength: 100
                          additionalProperties: false
                        maxItems: 200
                    additionalProperties: false
                  maxItems: 50
              additionalProperties: false
            examples:
              Default:
                value:
                  shift_hours:
                    - name: Updated Shift
                      timezone: Asia/Kolkata
                      same_as_everyday: true
                      daily_timing:
                        - '09:00'
                        - '18:00'
                      shift_days:
                        - Monday
                        - Tuesday
                      users: []
                      break_hours: []
                      holidays: []
                description: >-
                  Example request payload for updating one or more shift hour
                  configurations.
                summary: An example response of successful update shift hours.
            x-zs-llm-examples:
              - Default
        required: true
        description: The request body contains the data required to perform the operation.
