openapi: 3.1.0
info:
  title: Shift Hours
  description: >-
    Shift hours APIs enables developers to retrieve, create, update, and delete
    shift hour configurations along with their timing, break windows, holidays,
    and user assignments.
  version: '8'
servers:
  - url: https://zohoapis.{dc}/crm/{version}
    description: API Server URL
    variables:
      dc:
        enum:
          - com
          - eu
          - in
          - cn
          - au
        default: com
        description: API Server URL TLD
      version:
        default: v8
        description: API version
paths:
  /settings/business_hours/shift_hours:
    get:
      summary: Get shift hours
      description: >-
        Retrieves every shift hour configured for the organization, along with
        the timing, break hours, holidays, time zone, and assigned users of each
        shift, and an aggregate count of shifts that have at least one user
        assigned.
      security:
        - OAuth2:
            - ZohoCRM.settings.business_hours.READ
      operationId: getShifts
      responses:
        '200':
          description: >-
            Returned when the shift hour configurations are retrieved
            successfully.
          content:
            application/json:
              schema:
                type: object
                x-zs-$id: ShiftHoursGetResponse
                description: Represents the error response body for the operation.
                properties:
                  shift_count:
                    type: object
                    description: >-
                      Represents aggregate counts that summarize the shift hour
                      configurations returned in the response.
                    properties:
                      total_shift_with_user:
                        type: integer
                        description: >-
                          Represents the total number of shift hours that have
                          at least one user assigned.
                        minimum: 0
                        format: int32
                    required:
                      - total_shift_with_user
                    additionalProperties: false
                  shift_hours:
                    type: array
                    description: >-
                      Lists the shift hour configurations returned in the
                      response. 
                    items:
                      type: object
                      description: >-
                        Each object represents one shift hour with its timing,
                        break hours, holidays, and assigned users.
                      properties:
                        custom_timing:
                          type:
                            - array
                            - 'null'
                          description: 'Lists per-day shift timing overrides. '
                          items:
                            type: object
                            description: >-
                              Each object specifies the day of the week and the
                              start and end time of the shift on that day. This
                              field is mandatory when **same_as_everyday** is
                              **false**.
                            properties:
                              days:
                                type: string
                                description: |
                                  Represents the day of the week to which this
                                  custom shift timing applies.


                                  **Possible values**: 

                                  - Monday

                                  - Tuesday

                                  - Wednesday

                                  - Thursday

                                  - Friday

                                  - Saturday

                                  - Sunday
                                enum:
                                  - Monday
                                  - Tuesday
                                  - Wednesday
                                  - Thursday
                                  - Friday
                                  - Saturday
                                  - Sunday
                              shift_timing:
                                type: array
                                description: >
                                  Represents the start and end time of the shift
                                  on the specified

                                  day in `HH:MM` 24-hour format. 
                                items:
                                  type: string
                                  pattern: ^([0-1][0-9]|2[0-3]):[0-5][0-9]$
                                  description: >
                                    Represents the start time or end time of the
                                    window in `HH:MM`

                                    24-hour format. The first array entry is the

                                    start time and the second is the end time.
                                  maxLength: 5
                                minItems: 2
                                maxItems: 2
                            required:
                              - days
                              - shift_timing
                            additionalProperties: false
                          maxItems: 7
                        users_count:
                          type: integer
                          description: >-
                            Represents the number of users currently assigned to
                            the shift hour.
                          minimum: 0
                          format: int32
                        holidays:
                          type:
                            - array
                            - 'null'
                          description: >-
                            Lists the holidays observed during the shift hour.
                            The holiday date must fall between the current and
                            the next financial year.
                          items:
                            type: object
                            description: >-
                              Each entry specifies the date and the name of the
                              holiday. 
                            properties:
                              date:
                                type: string
                                format: date
                                description: >-
                                  Represents the date of the holiday in
                                  `YYYY-MM-DD` format.
                              year:
                                type: string
                                description: Represents the year of the holiday.
                                maxLength: 100
                              name:
                                type: string
                                description: >-
                                  Represents the name of the holiday. The name
                                  must not contain the special characters.
                                maxLength: 80
                              userFmt:
                                type: string
                                description: >-
                                  Represents the holiday date formatted using
                                  the date format configured for the requesting
                                  user.
                                maxLength: 100
                              id:
                                type: string
                                description: >-
                                  Represents the unique identifier of the
                                  holiday.
                                pattern: ^[0-9]+$
                                maxLength: 100
                                x-zs-$id: ShiftsId
                            required:
                              - date
                              - year
                              - name
                              - userFmt
                              - id
                            additionalProperties: false
                          maxItems: 365
                        daily_timing:
                          type:
                            - array
                            - 'null'
                          description: >
                            Represents the start and end time of the shift in
                            `HH:MM` 24-hour

                            format, applied uniformly to every active day. This

                            field is **mandatory** when **same_as_everyday** is

                            **true**.
                          items:
                            type: string
                            pattern: ^([0-1][0-9]|2[0-3]):[0-5][0-9]$
                            description: >
                              "Represents the start time or end time of the
                              window in `HH:MM`

                              24-hour format. "
                            maxLength: 5
                          minItems: 2
                          maxItems: 2
                        timezone:
                          type: string
                          description: >-
                            Represents the time zone in which the shift hours
                            are scheduled. Use a valid IANA time zone identifier
                            such as `Asia/Kolkata` or `America/New_York`.
                          maxLength: 100
                        name:
                          type: string
                          description: >-
                            Represents the name of the shift hour. The name must
                            be unique within the organization and must not
                            contain the special characters.
                          maxLength: 80
                        break_hours:
                          type:
                            - array
                            - 'null'
                          description: >-
                            Lists the break windows scheduled within the shift
                            hour. A shift can have at most two break windows.
                          items:
                            type: object
                            description: >-
                              Each object specifies the days the break applies
                              to and the break timing for those days.
                            properties:
                              custom_timing:
                                type:
                                  - array
                                  - 'null'
                                description: >-
                                  Lists per-day break timing overrides. This
                                  field is **mandatory** when the parent
                                  **same_as_everyday** is **false**. 


                                  A day can have at most two breaks and the
                                  total break time on a day cannot exceed two
                                  hours.
                                items:
                                  type: object
                                  description: >-
                                    Each object specifies the day of the week
                                    and the start and end time of the break on
                                    that day. 
                                  properties:
                                    break_timing:
                                      type: array
                                      description: >
                                        Represents the start and end time of the
                                        break on the specified day

                                        in `HH:MM` 24-hour format. A break must

                                        be longer than 15 minutes and shorter

                                        than 2 hours.
                                      items:
                                        type: string
                                        pattern: ^([0-1][0-9]|2[0-3]):[0-5][0-9]$
                                        description: >
                                          "Represents the start time or end time
                                          of the window in `HH:MM`

                                          24-hour format. "
                                        maxLength: 5
                                      minItems: 2
                                      maxItems: 2
                                    days:
                                      type: string
                                      description: |
                                        Represents the day of the week to which
                                        this custom break timing applies.


                                        **Possible values**: 

                                        - Monday

                                        - Tuesday

                                        - Wednesday

                                        - Thursday

                                        - Friday

                                        - Saturday

                                        - Sunday
                                      enum:
                                        - Monday
                                        - Tuesday
                                        - Wednesday
                                        - Thursday
                                        - Friday
                                        - Saturday
                                        - Sunday
                                  required:
                                    - break_timing
                                    - days
                                  additionalProperties: false
                                maxItems: 7
                              daily_timing:
                                type:
                                  - array
                                  - 'null'
                                description: |
                                  Represents the start and end time of the break
                                  in `HH:MM` 24-hour format, applied uniformly
                                  to every day the break is scheduled. 


                                  This field is **mandatory** when the parent
                                  **same_as_everyday** is **true**. A day can
                                  have at most two breaks and the total break
                                  time on a day cannot exceed two hours.
                                items:
                                  type: string
                                  pattern: ^([0-1][0-9]|2[0-3]):[0-5][0-9]$
                                  description: >
                                    Each string represents the start time or end
                                    time of the window in `HH:MM` 24-hour
                                    format.

                                    `HH:MM` 24-hour format. "
                                  maxLength: 5
                                minItems: 2
                                maxItems: 2
                              same_as_everyday:
                                type: boolean
                                description: |
                                  Indicates whether the break hour follows the
                                  same timing on every day the break is
                                  scheduled. 


                                  Possible values:

                                  - `true` - the break hour uses the same timing
                                  every day, and `daily_timing` becomes
                                  mandatory.

                                  - `false` - the break hour uses different
                                  timing for different days, and `custom_timing`
                                  becomes mandatory.
                              id:
                                type: string
                                description: >-
                                  Represents the unique identifier of the break
                                  hour within the shift hour.
                                pattern: ^[0-9]+$
                                maxLength: 100
                                x-zs-$id: ShiftHoursBreakHoursId
                              break_days:
                                type: array
                                description: |
                                  Lists the days of the week on which the break
                                  hour applies.


                                  Possible values: 

                                  - Monday

                                  - Tuesday

                                  - Wednesday

                                  - Thursday

                                  - Friday

                                  - Saturday

                                  - Sunday
                                items:
                                  type: string
                                  enum:
                                    - Monday
                                    - Tuesday
                                    - Wednesday
                                    - Thursday
                                    - Friday
                                    - Saturday
                                    - Sunday
                                  description: >+
                                    Represents one day of the week on which the
                                    break hour applies.

                                maxItems: 7
                            required:
                              - custom_timing
                              - daily_timing
                              - same_as_everyday
                              - id
                              - break_days
                            additionalProperties: false
                          maxItems: 2
                        shift_days:
                          type: array
                          description: |
                            Lists the days of the week on which the shift hour
                            is active. You can set shift timing only on the days
                            your organization operates.


                            **Possible values**: 

                            - Monday

                            - Tuesday

                            - Wednesday

                            - Thursday

                            - Friday

                            - Saturday

                            - Sunday
                          items:
                            type: string
                            enum:
                              - Monday
                              - Tuesday
                              - Wednesday
                              - Thursday
                              - Friday
                              - Saturday
                              - Sunday
                            description: >
                              Represents one day of the week on which the shift
                              hour is active.
                          maxItems: 7
                        same_as_everyday:
                          type: boolean
                          description: |
                            Indicates whether the shift hour follows the same
                            timing on every active day. 


                            **Possible values**:

                            - **true** - the shift hour uses the same timing
                            every day, and **daily_timing** becomes mandatory.

                            - **false** - the shift hour uses different timing
                            for different days, and **custom_timing** becomes
                            mandatory.
                        id:
                          type: string
                          description: Represents the unique identifier of the shift hour.
                          pattern: ^[0-9]+$
                          maxLength: 100
                          x-zs-$id: ShiftHoursId
                        users:
                          type:
                            - array
                            - 'null'
                          description: 'Lists the users assigned to the shift hour. '
                          items:
                            type: object
                            description: >-
                              Each object specifies the user and the date from
                              which the assignment becomes effective.
                            properties:
                              role:
                                type: object
                                description: >-
                                  Represents the role information of the user
                                  assigned to the shift hour.
                                properties:
                                  name:
                                    type: string
                                    description: >-
                                      Represents the name of the role assigned
                                      to the user.
                                    maxLength: 100
                                  id:
                                    type: string
                                    description: >-
                                      Represents the unique identifier of the
                                      role assigned to the user.
                                    pattern: ^[0-9]+$
                                    maxLength: 100
                                    x-zs-$id: ShiftHoursRoleId
                                required:
                                  - name
                                  - id
                                additionalProperties: false
                              name:
                                type: string
                                description: >-
                                  Represents the full name of the user assigned
                                  to the shift hour.
                                maxLength: 100
                              id:
                                type: string
                                description: >-
                                  Represents the unique identifier of the user
                                  assigned to the shift hour.
                                pattern: ^[0-9]+$
                                maxLength: 100
                                x-zs-$id: ShiftHoursUsersId
                              email:
                                type: string
                                format: email
                                description: >-
                                  Represents the email address of the user
                                  assigned to the shift hour.
                              zuid:
                                type: string
                                description: >-
                                  Represents the unique identifier of the user
                                  assigned to the shift hour.
                                maxLength: 100
                              effective_from:
                                type: string
                                format: date
                                description: >-
                                  Represents the date from which the user
                                  assignment to the shift hour becomes
                                  effective, in `YYYY-MM-DD` format. The date
                                  must be in the future and must not be more
                                  than six months ahead of the current date.
                            required:
                              - role
                              - name
                              - id
                              - email
                              - zuid
                              - effective_from
                            additionalProperties: false
                          maxItems: 200
                      required:
                        - custom_timing
                        - users_count
                        - holidays
                        - daily_timing
                        - timezone
                        - name
                        - break_hours
                        - shift_days
                        - same_as_everyday
                        - id
                        - users
                      additionalProperties: false
                    maxItems: 50
                required:
                  - shift_count
                  - shift_hours
                additionalProperties: false
              examples:
                Default:
                  value:
                    shift_hours:
                      - timezone: Asia/Kolkata
                        name: General Shift
                        same_as_everyday: true
                        users_count: 0
                        shift_days:
                          - Monday
                          - Tuesday
                          - Wednesday
                          - Thursday
                          - Friday
                        daily_timing:
                          - '09:00'
                          - '18:00'
                        custom_timing: null
                        break_hours: []
                        holidays: []
                        users: []
                        id: '1234567890'
                    shift_count:
                      total_shift_with_user: 0
                  description: >-
                    Example response returned when retrieving every shift hour
                    configured for the organization.
                  summary: An example of success shift hours response.
        '204':
          $ref: '#/components/responses/NoContentResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
    post:
      summary: Add shift hours
      description: >-
        Creates one or more shift hour configurations for the organization. Each
        shift hour specifies the name, time zone, active days, timing, optional
        break windows, optional holidays, and optional user assignments. The
        shift hour timing must fall within the configured business hours, and
        the request is rejected if business hours are not enabled for the org.
      security:
        - OAuth2:
            - ZohoCRM.settings.business_hours.CREATE
      operationId: createShifts
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: >-
                Represents the request body for creating one or more shift hour
                configurations. Each entry in `shift_hours` defines a shift with
                its timing, break hours, optional holidays, and assigned users.
              properties:
                shift_hours:
                  type: array
                  description: >-
                    Lists the shift hour configurations to be created or updated
                    in the request. Each entry specifies a shift hour with its
                    timing, break hours, holidays, and assigned users.
                  items:
                    type: object
                    description: >-
                      Each object represents one shift hour configuration to be
                      created or updated. Each entry captures the shift name,
                      time zone, active days, timing, optional break hours,
                      holidays, and assigned users.
                    properties:
                      break_hours:
                        type: array
                        description: >-
                          Lists the break windows scheduled within the shift
                          hour. Each entry specifies the days the break applies
                          to and the break timing for those days. A shift can
                          have at most two break windows.
                        items:
                          type: object
                          description: >-
                            Each object represents one break window scheduled
                            within the shift hour, including the days it applies
                            to and the break timing.
                          properties:
                            break_days:
                              type: array
                              description: >-
                                Lists the days of the week on which the break
                                applies.
                              items:
                                type: string
                                description: |
                                  Represents one day of the week on which the
                                  break applies.


                                  **Possible values**: 

                                  - Monday

                                  - Tuesday

                                  - Wednesday

                                  - Thursday

                                  - Friday

                                  - Saturday

                                  - Sunday
                                enum:
                                  - Monday
                                  - Thursday
                                  - Friday
                                  - Sunday
                                  - Wednesday
                                  - Tuesday
                                  - Saturday
                              maxItems: 7
                            daily_timing:
                              type: array
                              description: |
                                Represents the start and end time of the break
                                in `HH:MM` 24-hour format, applied uniformly to
                                every day the break is scheduled. This field is
                                **mandatory** when the parent
                                **same_as_everyday** is **true**. 


                                > **Note**

                                > A day can have at most two breaks and the
                                total break time on a day cannot exceed two
                                hours.
                              items:
                                type: string
                                description: >
                                  Each string epresents the start time or end
                                  time of the window in

                                  `HH:MM` 24-hour format. The first array entry

                                  is the start time and the second is the end

                                  time.
                                maxLength: 5
                                pattern: ^([0-1][0-9]|2[0-3]):[0-5][0-9]$
                              maxItems: 50
                            custom_timing:
                              type: array
                              description: >-
                                Lists per-day break timing overrides. Each entry
                                specifies the day of the week and the start and
                                end time of the break on that day. This field is
                                **mandatory** when the parent
                                **same_as_everyday** is **false**. 
                              items:
                                type: object
                                description: >-
                                  Represents the break timing override for a
                                  specific day of the week.
                                properties:
                                  break_timing:
                                    type: array
                                    description: >
                                      Represents the start and end time of the
                                      break on the specified day

                                      in `HH:MM` 24-hour format. A break must be

                                      longer than 15 minutes and shorter than 2

                                      hours.
                                    items:
                                      type: string
                                      description: >
                                        Each string represents the start time or
                                        end time of the window in

                                        `HH:MM` 24-hour format. The first array

                                        entry is the start time and the second

                                        is the end time.
                                      maxLength: 5
                                      pattern: ^([0-1][0-9]|2[0-3]):[0-5][0-9]$
                                    maxItems: 7
                                  days:
                                    type: string
                                    description: |
                                      Represents the day of the week to which
                                      this custom break timing applies.


                                      **Possible values**: 

                                      - Monday

                                      - Tuesday

                                      - Wednesday

                                      - Thursday

                                      - Friday

                                      - Saturday

                                      - Sunday
                                    enum:
                                      - Monday
                                      - Thursday
                                      - Friday
                                      - Sunday
                                      - Wednesday
                                      - Tuesday
                                      - Saturday
                                required:
                                  - break_timing
                                  - days
                                additionalProperties: false
                              maxItems: 50
                            same_as_everyday:
                              type: string
                              description: >-
                                Indicates whether the shift hour follows the
                                same timing on every active day. When the value
                                is **true**, the **daily_timing** array becomes
                                mandatory; when the value is **false**, the
                                **custom_timing** array becomes mandatory.
                              maxLength: 100
                          required:
                            - same_as_everyday
                          additionalProperties: false
                        maxItems: 50
                      daily_timing:
                        type: array
                        description: >
                          Represents the start and end time of the shift in
                          `HH:MM` 24-hour

                          format, applied uniformly to every active day. This

                          field is **mandatory** when **same_as_everyday** is

                          **true**.
                        items:
                          type: string
                          pattern: ^([0-1][0-9]|2[0-3]):[0-5][0-9]$
                          description: >
                            Each string represents the start time or end time of
                            the window in

                            `HH:MM` 24-hour format. The first array entry is the

                            start time and the second is the end time.
                          maxLength: 5
                        maxItems: 50
                      shift_days:
                        type: array
                        description: >-
                          Lists the days of the week on which the shift hour is
                          active. You can set shift timing only on the days your
                          organization operates.
                        items:
                          type: string
                          description: |
                            Represents one day of the week on which the shift
                            hour is active.


                            **Possible values**: 

                            - Monday

                            -Tuesday

                            - Wednesday

                            - Thursday

                            - Friday

                            - Saturday

                            - Sunday
                          enum:
                            - Monday
                            - Thursday
                            - Friday
                            - Sunday
                            - Wednesday
                            - Tuesday
                            - Saturday
                        maxItems: 7
                      custom_timing:
                        type: array
                        description: >-
                          Lists per-day shift timing overrides. Each entry
                          specifies the day of the week and the start and end
                          time of the shift on that day. This field is mandatory
                          when **same_as_everyday** is **false**.
                        items:
                          type: object
                          description: >-
                            Each object represents the shift timing override for
                            a specific day of the week.
                          properties:
                            shift_timing:
                              type: array
                              description: >
                                Represents the start and end time of the shift
                                on the specified

                                day in `HH:MM` in the 24-hour format. 
                              items:
                                type: string
                                pattern: ^([0-1][0-9]|2[0-3]):[0-5][0-9]$
                                description: >
                                  Each string represents the start time or end
                                  time of the window in

                                  `HH:MM` 24-hour format. The first array entry

                                  is the start time and the second is the end

                                  time.
                                maxLength: 5
                              maxItems: 7
                            days:
                              type: string
                              description: |
                                Represents the day of the week to which this
                                custom shift timing applies.


                                Possible values: 

                                - Monday

                                - Tuesday

                                - Wednesday

                                - Thursday

                                - Friday

                                - Saturday

                                - Sunday
                              enum:
                                - Monday
                                - Thursday
                                - Friday
                                - Sunday
                                - Wednesday
                                - Tuesday
                                - Saturday
                          required:
                            - shift_timing
                            - days
                          additionalProperties: false
                        maxItems: 50
                      timezone:
                        type: string
                        description: >-
                          Represents the time zone in which the shift hours are
                          scheduled. Use a valid IANA time zone identifier such
                          as `Asia/Kolkata` or `America/New_York`.
                        maxLength: 100
                      name:
                        type: string
                        description: >-
                          Represents the name of the shift hour. The name must
                          be unique within the organization and must not contain
                          the special characters.
                        maxLength: 80
                      same_as_everyday:
                        type: boolean
                        description: |
                          Indicates whether the shift hour follows the same
                          timing on every active day. 


                          **Possible values**:

                          -  `true` - the shift hour uses the same timing every
                          day, and `daily_timing` becomes mandatory.

                          - `false` - the shift hour uses different timing for
                          different days, and `custom_timing` becomes mandatory.
                      holidays:
                        type: array
                        description: >-
                          Lists the holidays observed during the shift hour.
                          Each entry specifies the date and the name of the
                          holiday. The holiday date must fall between the
                          current and the next financial year.
                        items:
                          type: object
                          description: >-
                            Each object represents one holiday observed during
                            the shift hour, including the date and name of the
                            holiday.
                          properties:
                            date:
                              type: string
                              format: date
                              description: >-
                                Represents the date of the holiday in
                                `YYYY-MM-DD` format.
                            name:
                              type: string
                              description: >-
                                Represents the name of the holiday. The name
                                must not contain the special characters.
                              maxLength: 80
                          required:
                            - name
                            - date
                          additionalProperties: false
                        maxItems: 50
                      users:
                        type: array
                        description: >-
                          Lists the users assigned to the shift hour. Each entry
                          specifies the user and the date from which the
                          assignment becomes effective.
                        items:
                          type: object
                          description: >-
                            Each object represents one user assigned to the
                            shift hour, including the user details and the
                            effective date of the assignment.
                          properties:
                            id:
                              type: string
                              description: >-
                                Represents the unique identifier of the user
                                assigned to the shift hour.
                              maxLength: 100
                          required:
                            - id
                          additionalProperties: false
                        maxItems: 200
                    required:
                      - name
                      - timezone
                      - same_as_everyday
