            **ZohoCRM.settings.abtest.ALL** scope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionDeniedErrorResponse'
              examples:
                NoPermissionResponse1:
                  summary: >
                    NO_PERMISSION error — user lacks delete permission for A/B
                    Testing
                  value:
                    code: NO_PERMISSION
                    details:
                      permissions:
                        - Crm_Implied_Webform_Abtesting_Leads
                    message: permission denied
                    status: error
          headers:
            X-API-CREDITS-REMAINING:
              schema:
                type: string
                format: int64
                description: >
                  Present when >=50% of base daily credits (excluding add-on
                  credits) are consumed. Value is total remaining credits
                  including add-on credits for the rolling 24-hour window.
                pattern: ^[0-9]+$
                minLength: 1
                maxLength: 19
              required: false
    put:
      summary: Update AB testing configuration by ID
      description: >
        To update the configuration of an existing Webform A/B testing in your
        Zoho CRM organization.

        Use this API to modify an A/B test that has already been created — for
        example, to rename the test, change the traffic split, revise the end
        criteria, update variant form design or fields, adjust the winner
        configuration, or transition the test to a different lifecycle state
        (such as pausing a running test or resuming a paused one). 

          Key terminology:
          - Original form: The existing webform on which the A/B test is running.
            Referenced by base_form in the request.
          - Variant: A modified version of the original webform used for comparison.
            Configured under variant_form.
          - Conversion rate: The percentage of visitors who submitted the webform.
          - Winner: The webform with the highest conversion rate at the end of the test.
      operationId: putABTestingById
      x-zs-llm-description: >-
        Update an existing AB Testing configuration by ID. Can modify traffic
        allocation between base and variant forms, adjust test conditions,
        update winner declaration settings, or change the test status
        (pause/resume).
