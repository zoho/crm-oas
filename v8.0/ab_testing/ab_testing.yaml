  parameters:
    ParamQueryModule1:
      name: module
      in: query
      description: >-
        Specify the module API name for the AB test operation. Use the [Get
        Modules API](modules.yaml#$.paths./settings/modules.get) to retrieve
        module ID and API name. 

        Possible values:

        **Leads** - Target the Leads module.
      required: true
      schema:
        type: string
        enum:
          - Leads
    ParamQueryModule:
      name: module
      in: query
      description: >-
        Specify the module API name to filter AB test configurations. Use the
        [Get Modules API](modules.yaml#$.paths./settings/modules.get) to
        retrieve module ID and API name. 

        Possible values:

        **Leads** - Filter by the Leads module.
      required: false
      schema:
        type: string
        enum:
          - Leads
    ParamQueryBaseForm:
      name: base_form
      in: query
      description: >-
        Specify the ID of the base webform to filter AB test configurations.
        Accepts a single base form ID. Use the [Get Webforms
        API](webforms.yaml#$.paths./settings/webforms.get) to retrieve the
        webform ID.
      required: false
      schema:
        type: number
        enum:
          - 111111000000115000
