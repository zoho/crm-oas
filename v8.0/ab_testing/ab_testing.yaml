openapi: 3.1.0
info:
  title: AB Testing
  description: >
    [AB
    testing](https://help.zoho.com/portal/en/kb/crm/connect-with-customers/webforms/articles/webform-ab-testing)
    in Zoho CRM enables organizations to compare the 

    performance of webform variants by distributing visitor traffic between a 

    base form and one or more variant forms. This API enables developers to 

    create, retrieve, update, and delete AB testing configurations, and to 

    access visitor statistics and form previews.
  version: '8'
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
servers:
  - url: https://zohoapis.{dc}/crm/{version}
    description: API Server URL
    variables:
      dc:
        description: API Server URL TLD
        default: com
        enum:
          - com
          - eu
          - in
          - cn
          - au
          - ca
          - jp
      version:
        description: API Version
        default: v8
paths:
  /settings/AB_testing:
    get:
      summary: |
        List Webform A/B Testing configurations
      description: >
        To retrieve all Webform A/B Testing configurations created in your Zoho
        CRM organization. You can optionally filter the results by module or by
        the ID of a base webform.
      operationId: getAbTesting
      x-zs-llm-description: >-
        Retrieve all AB Testing configurations for webforms with optional
        filtering by module and base form ID. Returns list of active and
        completed AB tests with their current status, traffic allocation, and
        visitor metrics.
      security:
        - OAuth2:
            - ZohoCRM.settings.abtest.READ
      parameters:
        - $ref: '#/components/parameters/ParamQueryModule'
        - $ref: '#/components/parameters/ParamQueryBaseForm'
      responses:
        '200':
          description: >
            Returns a list of Webform A/B Testing configurations for the Zoho
            CRM organization, with up to 1000 records per response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllabtestingResponse200'
              examples:
                Success200:
                  summary: |
                    Successful retrieval of Webform A/B Testing configurations
                  value:
                    AB_testing:
                      - created_time: '2025-12-19T13:37:35+05:30'
                        dynamic_allocation_by_zia: false
                        complete_restart_info: null
                        module:
                          api_name: Leads
                          id: '111111000000002652'
                        suggestion: null
                        base_form:
                          winner: false
                          old_traffic: null
                          name: Webform
                          id: '111111000000118668'
                          traffic: 50
                        created_by:
                          name: Kk
                          id: '111111000000059475'
                        notify: false
                        traffic_diversion: null
                        condition:
                          unit: 30
                          period: days
                          type: duration
                          remaining: 29
                        variant_form:
                          - winner: false
                            old_traffic: null
                            name: Webform
                            id: '111111000000118676'
                            traffic: 50
                        name: ABTesting_Leads
                        winner_configuration:
                          announce_automatically: false
                        id: '111111000000118675'
                        status: running
                        traffic: 100
          headers:
            X-API-CREDITS-REMAINING:
              schema:
                type: string
                format: int64
                description: >
                  Present when >=50% of base daily credits (excluding add-on
                  credits) are consumed. Value is total remaining credits
                  including add-on credits for the rolling 24-hour window.
                pattern: ^[0-9]+$
                minLength: 1
                maxLength: 19
              required: false
        '204':
          description: >
            Returns no content when no Webform A/B Testing configurations match
            the specified filter criteria.
          headers:
            X-API-CREDITS-REMAINING:
              schema:
                type: string
                format: int64
                description: >
                  Present when >=50% of base daily credits (excluding add-on
                  credits) are consumed. Value is total remaining credits
                  including add-on credits for the rolling 24-hour window.
                pattern: ^[0-9]+$
                minLength: 1
                maxLength: 19
              required: false
        '400':
          description: >
            The module name given seems to be invalid, or the base_form
            parameter value does not match the expected pattern.

            **Resolution:** The caller must verify that the module parameter
            contains a valid CRM module API name and that the base_form
            parameter value is a valid webform ID.
          content:
            application/json:
              schema:
                x-zs-$id: ErrorResponseCoreInvalidBaseForm
                description: >
                  Represents the error response returned when an invalid module
                  name is provided (INVALID_MODULE) or an input value does not
                  match the expected pattern (PATTERN_NOT_MATCHED).
                anyOf:
                  - $ref: '#/components/schemas/ErrorResponseCore1335454202'
                  - $ref: '#/components/schemas/InvalidBaseFormId'
              examples:
                InvalidModuleResponse1:
                  summary: |
                    400 error when an invalid module name is provided
                  value:
                    code: INVALID_MODULE
                    details: {}
                    message: the module name given seems to be invalid
                    status: error
                PatternNotMatchedResponse1:
                  summary: >
                    400 error when the base_form parameter value format is
                    invalid
                  value:
                    code: INVALID_DATA
                    details:
                      param_name: base_form
                    message: The given param value is invalid
                    status: error
          headers:
            X-API-CREDITS-REMAINING:
              schema:
                type: string
                format: int64
                description: >
                  Present when >=50% of base daily credits (excluding add-on
                  credits) are consumed. Value is total remaining credits
                  including add-on credits for the rolling 24-hour window.
                pattern: ^[0-9]+$
                minLength: 1
                maxLength: 19
              required: false
        '403':
          description: >
            Permission denied to retrieve Webform A/B Testing configurations.

            **Resolution:** The CRM administrator must grant the required
            permission to the user's profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionDeniedErrorResponse'
              examples:
                NoPermissionResponse1:
                  summary: >
                    403 error when the user lacks permission to retrieve A/B
                    Testing settings
                  value:
                    code: NO_PERMISSION
                    details:
                      permissions:
                        - Crm_Implied_Webform_Abtesting_Leads
                    message: permission denied
                    status: error
          headers:
            X-API-CREDITS-REMAINING:
              schema:
                type: string
                format: int64
                description: >
                  Present when >=50% of base daily credits (excluding add-on
                  credits) are consumed. Value is total remaining credits
                  including add-on credits for the rolling 24-hour window.
                pattern: ^[0-9]+$
                minLength: 1
                maxLength: 19
              required: false
    post:
      summary: Create AB testing configuration
      description: >
        To create a Webform A/B Test in your Zoho CRM organization.

        Webform A/B testing lets you run an experiment where two or more
        variations of a webform are shown to different segments of your website
        visitors, so you can compare their performance and identify the version
        that delivers the best results. This API creates the A/B test — you
        specify the base (original) webform, one or more variant webforms, the
        target traffic split, and how long the test should run. 

        - **Key terminology:**
            - **Original form:** The existing webform you want to run the A/B test on.
              Referenced by base_form in the request.
            - **Variant:** A modified version of the original webform used for comparison.
              Configured under variant_form.
            - **Conversion rate:** The percentage of visitors who submitted the webform.
            - **Winner:** The webform with the highest conversion rate at the end of the test.
      operationId: postAbTesting
      x-zs-llm-description: >-
        Create a new AB Testing configuration for a webform. Specify base form
        with traffic allocation, variant forms with their own traffic splits,
        test conditions (duration/visitor count), and winner declaration
        settings. Required module parameter specifies the target module.
      security:
        - OAuth2:
            - ZohoCRM.settings.abtest.CREATE
      parameters:
        - $ref: '#/components/parameters/ParamQueryModule1'
      requestBody:
        description: The request body must contain an AB_testing array with one object.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostabtestingRequest'
            examples:
              SamplePostRequest:
                summary: >-
                  Create AB testing with base form, variant form, and duration
                  condition
                value:
                  AB_testing:
                    - dynamic_allocation_by_zia: false
                      base_form:
                        id: '111111000000118837'
                        traffic: 50
                      notify: true
                      variant_form:
                        - traffic: 50
                          form_attributes:
                            color: '#4F5252'
                            width: 800
                            font_attributes:
                              size: 14
                              color: '#D5DEDE'
                              family: Arial
                            align: right
                          button_attributes:
                            - color: '#fff'
                              name: SubmitVar
                            - color: '#fff'
                              name: ResetVar
                          form_fields:
                            - help: null
                              field:
                                api_name: Last_Name
                                field_label: Last Name
                                id: '111111000000004840'
                              hidden: false
                              date_format: null
                              type: general
                              required: true
                              field_name: Last Name
                            - help: null
                              field_info:
                                type: file_upload
                                field_label: File Upload
                              hidden: false
                              type: advanced
                              required: false
                      traffic: 100
                      module:
                        api_name: Leads
                      condition:
                        type: duration
                        period: days
                        unit: 30
                      name: ABTesting_Leads
                      winner_configuration:
                        announce_automatically: true
                        conversion_percentage_difference: 20
                      status: running
      responses:
        '201':
          description: Returns the unique ID of the newly created AB testing configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostabtestingResponse201'
              examples:
                Success201:
                  summary: AB testing created successfully
                  value:
                    AB_testing:
                      - code: SUCCESS
                        details:
                          id: '111111000000127052'
                        message: ABTesting details created successfully
                        status: success
          headers:
            X-API-CREDITS-REMAINING:
              schema:
                type: string
                format: int64
                description: >
                  Present when >=50% of base daily credits (excluding add-on
                  credits) are consumed. Value is total remaining credits
                  including add-on credits for the rolling 24-hour window.
                pattern: ^[0-9]+$
                minLength: 1
                maxLength: 19
              required: false
        '400':
          description: >-
            The request contains invalid data for the AB testing configuration.

            **Resolution:** The request body must contain a valid AB_testing
            object. Ensure all required fields are provided with the correct
            data types and values.
          content:
            application/json:
              schema:
                x-zs-$id: ErrorResponseCoreInvalidDataAbTesting
                description: >-
                  Represents one of the possible error response schemas returned
                  when the AB testing configuration contains invalid data.
                anyOf:
                  - $ref: '#/components/schemas/ErrorResponseCore1311222188'
                  - type: object
                    additionalProperties: false
                    description: >-
                      Represents the wrapped 400 error response containing the
                      AB_testing array with one or more error objects for
                      invalid data.
                    properties:
                      AB_testing:
                        type: array
                        description: >-
                          Represents the list of AB testing error objects
                          returned for invalid input.
                        items:
                          anyOf:
                            - $ref: '#/components/schemas/AbtestingLimitExceeded'
                            - $ref: '#/components/schemas/ABTestNamePatternNotMatched'
                            - $ref: '#/components/schemas/InvalidDataInTrafficDetails'
                            - $ref: >-
                                #/components/schemas/ErrorResponseCoreInvalidDataWidth
                            - $ref: >-
                                #/components/schemas/ErrorResponseCoreInvalidDataSupportedString
                            - $ref: >-
                                #/components/schemas/DuplicateDataABTestingNameError
                            - $ref: >-
                                #/components/schemas/ErrorResponseCoreInvalidData
                            - $ref: '#/components/schemas/ErrorResponseCore210190878'
                            - $ref: '#/components/schemas/ErrorResponseCore278210242'
                            - $ref: '#/components/schemas/ErrorResponseCore554143170'
                            - $ref: '#/components/schemas/ErrorResponseCore157494901'
                            - $ref: '#/components/schemas/ErrorResponseCore1311222188'
                            - $ref: >-
                                #/components/schemas/CannotCreateABTestDueToStatus
                            - $ref: '#/components/schemas/ErrorResponseCore1620103746'
                            - $ref: '#/components/schemas/ErrorResponseCore654482121'
                            - $ref: '#/components/schemas/ErrorResponseCore121471384'
                            - $ref: '#/components/schemas/ErrorResponseCore1426090916'
                            - $ref: '#/components/schemas/ErrorResponseCore686109240'
                            - $ref: '#/components/schemas/ErrorResponseCore241660575'
                            - $ref: >-
                                #/components/schemas/ErrorResponseCoreInvalidDataBoolean
                            - $ref: >-
                                #/components/schemas/ErrorResponseOperationNotAllowed
                        maxItems: 25
                    required:
                      - AB_testing
                  - $ref: '#/components/schemas/ErrorResponseCore216006943'
                  - $ref: '#/components/schemas/ErrorResponseCore94581445'
              examples:
                InvalidDataResponse1:
                  summary: >-
                    INVALID_DATA error when AB_testing array exceeds the allowed
                    maximum
                  value:
                    code: INVALID_DATA
                    details:
                      maximum_length: 1
                      api_name: AB_testing
                      json_path: $.AB_testing
                    message: invalid data
                    status: error
                MandatoryNotFoundBody:
                  summary: >-
                    MANDATORY_NOT_FOUND error: Please check whether the input
                    values are correct (field: body)
                  value:
                    AB_testing:
                      - code: MANDATORY_NOT_FOUND
                        details:
                          api_name: AB_testing
                          json_path: $.AB_testing
                        message: required field not found
                        status: error
                PatternNotMatchedResponse1:
                  summary: >-
                    PATTERN_NOT_MATCHED error: Please check whether the input
                    values are correct (field: name)
                  value:
                    AB_testing:
                      - code: PATTERN_NOT_MATCHED
                        details:
                          api_name: name
                          json_path: $.AB_testing[0].name
                        message: Please check whether the input values are correct
                        status: error
                DuplicateDataResponse1:
                  summary: >-
                    DUPLICATE_DATA error for duplicate AB testing name in the
                    module
                  value:
                    AB_testing:
                      - code: DUPLICATE_DATA
                        details:
                          api_name: name
                          json_path: $.AB_testing[0].name
                        message: >-
                          ABTesting with the same name already exists in this
                          module
                        status: error
                InvalidDataResponse2:
                  summary: >-
                    INVALID_DATA error: base traffic greater than 100 (field:
                    traffic)
                  value:
                    AB_testing:
                      - code: INVALID_DATA
                        details:
                          api_name: traffic
                          json_path: $.AB_testing[0].traffic
                        message: base traffic greater than 100
                        status: error
                InvalidDataResponse3:
                  summary: >-
                    INVALID_DATA error: base traffic less than 1 (field:
