          tokenUrl: https://accounts.zoho.com/oauth/v2/token
          refreshUrl: https://accounts.zoho.com/oauth/v2/token
          scopes:
            ZohoCRM.settings.abtest.ALL: Access to settings.abtest scope for all operations
            ZohoCRM.settings.abtest.READ: Access to settings.abtest scope for reading data
