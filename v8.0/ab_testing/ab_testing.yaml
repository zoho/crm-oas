          description: >-
            Indicates whether the winning form is announced automatically when
            the conversion percentage difference threshold is met.

            Possible values:

            **true** - The winner is announced automatically.

            **false** - The winner must be announced manually.
          enum:
            - true
            - false
        conversion_percentage_difference:
          type: integer
          format: int32
          description: >-
            Represents the minimum conversion rate percentage difference
            required to automatically declare a winner. Required when
            **announce_automatically** is **true**.
