                  value:
                    AB_testing:
                      - code: INVALID_DATA
                        details:
                          api_name: traffic
                          json_path: $.AB_testing[0].traffic
                        message: base traffic less than 1
                        status: error
                InvalidDataResponse4:
                  summary: 'INVALID_DATA error: invalid base form ID (field: ID)'
                  value:
                    AB_testing:
                      - code: INVALID_DATA
                        details:
                          api_name: id
                          json_path: $.AB_testing[0].base_form.id
                        message: invalid base form id
                        status: error
                InvalidDataResponse5:
                  summary: >-
                    INVALID_DATA error: months should be less than or equal to 3
