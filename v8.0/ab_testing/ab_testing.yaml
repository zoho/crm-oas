    delete:
      summary: |
        Delete an A/B Testing configuration by ID
      description: |
        To delete a Webform A/B Testing configuration by its unique ID
         from your Zoho CRM organization. 

        **Notes:**   
         - Deleting an A/B test is permanent. The test configuration and all metrics
         collected for it are removed and cannot be recovered.
         - The variant webforms that were created as part of this A/B test are deleted
         along with the test. Variants are configured and owned by the A/B test;
         they are not stand-alone webforms.
         - The base (original) webform referenced by base_form.id is not deleted.
         Only the A/B test and its variants are removed.
         - An A/B test can be deleted from any lifecycle state: drafted, scheduled,
           running, paused, completed, or launched. If the test is currently running
           or paused, the deletion stops serving variants immediately, and all visitors
           are directed to the base webform.
      operationId: deleteABTestingById
      x-zs-llm-description: >-
        Delete an AB Testing configuration by ID. Removes the test and all its
        associated data from the specified module. The test must be stopped or
        completed before deletion.
      security:
        - OAuth2:
            - ZohoCRM.settings.abtest.DELETE
      parameters:
        - $ref: '#/components/parameters/ParamQueryModule1'
      responses:
        '200':
          description: >
            Returns the result of the A/B test deletion. The response contains
            an **AB_testing** array with one object indicating the outcome of
            the delete operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Delete111111000000122003Response200'
              examples:
                Success200:
                  summary: >
                    Success response for status 200 when an A/B Testing
                    configuration is deleted
                  value:
                    AB_testing:
                      - code: SUCCESS
                        details:
                          id: '111111000000122003'
                        message: ABTesting deleted successfully
                        status: success
          headers:
            X-API-CREDITS-REMAINING:
              schema:
                type: string
                format: int64
                description: >
                  Present when >=50% of base daily credits (excluding add-on
                  credits) are consumed. Value is total remaining credits
                  including add-on credits for the rolling 24-hour window.
                pattern: ^[0-9]+$
                minLength: 1
                maxLength: 19
              required: false
        '400':
          description: >
            The request could not be processed due to an invalid A/B test ID, an
            invalid module name, or a missing required module parameter.

            **Resolution:** Verify the A/B test ID using the Get A/B Testing API
            and ensure the **module** query parameter is included with a valid
            module API name.
          content:
            application/json:
              schema:
                x-zs-$id: ErrorResponseCoreInvalidDataModule1
                description: >
                  Error response body for HTTP 400 on the deleteABTestingById
                  operation. Represents one of the following error conditions:
                  invalid A/B test ID, invalid module name, or missing required
                  module parameter.
                anyOf:
                  - $ref: '#/components/schemas/ErrorResponseCore1388195357'
                  - $ref: '#/components/schemas/ErrorResponseCore1335454202'
                  - $ref: '#/components/schemas/ErrorResponseCore216006943'
                  - $ref: '#/components/schemas/ErrorResponseCore94581445'
              examples:
                InvalidDataResponse1:
                  summary: |
                    INVALID_DATA error — invalid A/B test ID in the request URL
                  value:
                    code: INVALID_DATA
                    details:
                      resource_path_index: 2
                    message: invalid data
                    status: error
                InvalidModuleResponse1:
                  summary: >
                    INVALID_MODULE error — module name in the request is not
                    recognized
                  value:
                    code: INVALID_MODULE
                    details: {}
                    message: the module name given seems to be invalid
                    status: error
                RequiredParamMissingResponse1:
                  summary: >
                    REQUIRED_PARAM_MISSING error — module query parameter not
                    included
                  value:
                    code: REQUIRED_PARAM_MISSING
                    details:
                      param_name: module
                    message: One of the expected param is missing
                    status: error
          headers:
            X-API-CREDITS-REMAINING:
              schema:
                type: string
                format: int64
                description: >
                  Present when >=50% of base daily credits (excluding add-on
                  credits) are consumed. Value is total remaining credits
                  including add-on credits for the rolling 24-hour window.
                pattern: ^[0-9]+$
                minLength: 1
                maxLength: 19
              required: false
        '403':
          description: >
            Permission denied to perform the delete operation on this A/B
            Testing configuration.

            **Resolution:** The CRM administrator must grant the required
            permission to the user's profile, and the OAuth token must include
