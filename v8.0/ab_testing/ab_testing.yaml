  /settings/AB_testing/actions/visitors:
    get:
      summary: |
        Get A/B testing visitor counts
      description: >
        To retrieve the visitor count of Webform A/B Testing configurations in
        your Zoho CRM organization, including all tests that are currently
        running as well as completed ones.
      operationId: getVisitors
      x-zs-llm-description: >-
        Retrieve aggregated visitor statistics across all AB Tests in a module.
        Returns visitor count, test start time, and days elapsed for each active
        AB testing configuration.
      security:
        - OAuth2:
            - ZohoCRM.settings.abtest.READ
      parameters:
        - $ref: '#/components/parameters/ParamQueryModule'
      responses:
        '200':
          description: >
            Returns the visitor count for all active Webform A/B Testing
            configurations in the specified module.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetvisitorsResponse200'
              examples:
                Success200:
                  summary: >
                    Successful retrieval of visitor counts for all A/B testing
                    configurations
                  value:
                    AB_testing:
                      - visitors: 6
                        started_time: '2025-11-25T13:13:05+05:30'
                        days: 0
                        id: '111111000000122003'
          headers:
            X-API-CREDITS-REMAINING:
              schema:
                type: string
                format: int64
                description: >
                  Present when >=50% of base daily credits (excluding add-on
                  credits) are consumed. Value is total remaining credits
                  including add-on credits for the rolling 24-hour window.
                pattern: ^[0-9]+$
                minLength: 1
                maxLength: 19
              required: false
        '204':
          description: >
            No Webform A/B Testing configurations match the specified filter
            criteria.
          headers:
            X-API-CREDITS-REMAINING:
              schema:
                type: string
                format: int64
                description: >
                  Present when >=50% of base daily credits (excluding add-on
                  credits) are consumed. Value is total remaining credits
                  including add-on credits for the rolling 24-hour window.
                pattern: ^[0-9]+$
                minLength: 1
                maxLength: 19
              required: false
        '400':
          description: >-
            The module name provided in the request is invalid, or a required
            parameter is missing from the request.

            **Resolution:** Specify a valid module API name and ensure all
            required parameters are included in the request.
          content:
            application/json:
              schema:
                x-zs-$id: ErrorResponseCoreInvalidModuleRequiredParam
                description: >
                  Represents the error response body for a 400 Bad Request.
                  Returned when the module parameter is invalid (INVALID_MODULE)
                  or when a required parameter is missing from the request
                  (REQUIRED_PARAM_MISSING).
                anyOf:
                  - $ref: '#/components/schemas/ErrorResponseCore1335454202'
                  - $ref: '#/components/schemas/ErrorResponseCore216006943'
              examples:
                InvalidModuleResponse1:
                  summary: |
                    INVALID_MODULE error when the module name is invalid
                  value:
                    code: INVALID_MODULE
                    details: {}
                    message: the module name given seems to be invalid
                    status: error
                RequiredParamMissingResponse1:
                  summary: >
                    REQUIRED_PARAM_MISSING error when the module parameter is
                    absent
                  value:
                    code: REQUIRED_PARAM_MISSING
                    details:
                      param_name: module
                    message: One of the expected parameter is missing
                    status: error
          headers:
            X-API-CREDITS-REMAINING:
              schema:
                type: string
                format: int64
                description: >
                  Present when >=50% of base daily credits (excluding add-on
                  credits) are consumed. Value is total remaining credits
                  including add-on credits for the rolling 24-hour window.
                pattern: ^[0-9]+$
                minLength: 1
                maxLength: 19
              required: false
        '403':
          description: >-
            Permission denied to access Webform A/B Testing visitor details.

            **Resolution:** The CRM administrator must grant the required
            Webform A/B Testing permission to the user's profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionDeniedErrorResponse'
              examples:
                NoPermissionResponse1:
                  summary: >
                    NO_PERMISSION error when the user lacks Webform A/B Testing
                    access
