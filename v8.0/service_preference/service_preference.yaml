openapi: 3.1.0
info:
  title: Service Preferences APIs
  description: >-
    This API enables developers to retrieve and update the service preference
    settings of the organization.
  version: '8.0'
servers:
  - url: https://zohoapis.{dc}/crm/{version}
    description: API Server URL
    variables:
      dc:
        enum:
          - com
          - eu
          - in
          - cn
          - au
        default: com
        description: API Server URL TLD
      version:
        default: v8
        description: API version
paths:
  /settings/service_preferences:
    get:
      operationId: getServicePreference
      summary: Get service preferences
      description: >-
        Retrieves the service preference settings of the organization, including
        whether the job sheet is enabled for service appointments. Use this API
        to check whether a job sheet can be generated once a service appointment
        is marked complete.
      responses:
        '200':
          description: >-
            The service preference settings of the organization were retrieved
            successfully.
          content:
            application/json:
              schema:
                x-zs-$id: GetServicePreferenceResponse
                type: object
                description: >-
                  Represents the response wrapper that contains the service
                  preference settings of the organization.
                properties:
                  service_preferences:
                    type: object
                    description: >-
                      Represents the service preference settings configured for
                      the organization.
                    properties:
                      job_sheet_enabled:
                        type: boolean
                        description: |
                          Denotes whether the job sheet is enabled for the
                          organization. When the job sheet is enabled, a job
                          sheet can be generated for a service appointment once
                          the appointment is marked complete.


                          Possible values:


                          - **true**: The job sheet is enabled for the
                          organization. This is the default value.

                          - **false**: The job sheet is disabled for the
                          organization.
                    required:
                      - job_sheet_enabled
                    additionalProperties: false
                required:
                  - service_preferences
                additionalProperties: false
              examples:
                SuccessResponse:
                  summary: >-
                    An example successful response for retrieving service
                    preferences.
                  value:
                    service_preferences:
                      job_sheet_enabled: true
                  description: >-
                    Illustrates a successful response that returns the current
                    service preference configuration of the organization,
                    showing that the job sheet is enabled.
      security:
        - OAuth2:
            - ZohoCRM.settings.modules.READ
    put:
      operationId: updateServicePreference
      summary: Update service preferences
      description: >-
        Updates the service preference settings of the organization. Use this
        API to enable or disable the job sheet, which controls whether a job
        sheet can be generated for a service appointment once the appointment is
        marked complete.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: >-
                Represents the request wrapper used to update the service
                preference settings of the organization.
              properties:
                service_preferences:
                  type: object
                  description: >-
                    Represents the service preference settings to update for the
                    organization.
                  properties:
                    job_sheet_enabled:
                      type: boolean
                      description: |
                        Denotes whether you want to enable the job sheet for the
                        organization. When the job sheet is enabled, a job sheet
                        can be generated for a service appointment once the
                        appointment is marked complete.


                        Possible values:


                        - **true**: enables the job sheet for the organization.
                        This is the default value.

                        - **false**: disables the job sheet for the
                        organization.
                  required:
                    - job_sheet_enabled
                  additionalProperties: false
              required:
                - service_preferences
              additionalProperties: false
            examples:
              ExpectedRequest:
                summary: An example request to update service preferences.
                value:
                  service_preferences:
                    job_sheet_enabled: true
                description: >-
                  Illustrates a request that enables the job sheet for the
                  organization.
        required: true
        description: 'The request body contains the data required to perform the operation. '
        x-zs-llm-examples:
          - ExpectedRequest
      responses:
        '200':
          description: >-
            The service preference settings of the organization were updated
            successfully.
          content:
            application/json:
              schema:
                x-zs-$id: UpdateServicePreferenceResponse
                type: object
                description: >-
                  Represents the response wrapper returned after the API updates
                  the service preference settings of the organization.
                properties:
                  service_preferences:
                    type: object
                    description: >-
                      Represents the result of updating the service preference
                      settings of the organization.
                    properties:
                      status:
                        type: string
                        enum:
                          - success
                        description: Represents the status of the update operation.
                      code:
                        type: string
                        enum:
                          - SUCCESS
                        description: >
                          Represents the code that indicates the result of the
                          update operation.
                      message:
                        type: string
                        enum:
                          - Services preferences updated successfully
                        description: >-
                          Represents the message that describes the result of
                          the update operation.
                      details:
                        type: object
                        description: >-
                          Represents additional details about the update
                          operation. This object is empty when the update is
                          successful.
                        additionalProperties: false
                    required:
                      - status
                      - code
                      - message
                      - details
                    additionalProperties: false
                required:
                  - service_preferences
                additionalProperties: false
              examples:
                SuccessResponse:
                  summary: >-
                    An example successful response for updating service
                    preferences.
                  value:
                    service_preferences:
                      code: SUCCESS
                      details: {}
                      message: Services preferences updated successfully
                      status: success
                  description: >-
                    Illustrates a successful response that the API returns after
                    it updates the service preferences of the organization.
        '400':
          description: >-
            The request to update the service preference settings failed because
            of a missing mandatory field or invalid data in the request payload.
          content:
            application/json:
              schema:
                x-zs-$id: ErrorResponse
                oneOf:
                  - x-zs-$id: MandatoryNotFoundErrorResponse
                    type: object
                    description: >-
                      Represents the error response returned when a mandatory
                      field is missing in the request to update service
                      preferences.
                    properties:
                      service_preferences:
                        oneOf:
                          - x-zs-$id: MandatoryNotFoundErrorDetails
                            type: object
                            description: >-
                              Represents the error details returned when a
                              mandatory field is missing in the request payload.
                            properties:
                              status:
                                type: string
                                enum:
                                  - error
                                description: Represents the status of the failed request.
                              code:
                                type: string
                                enum:
                                  - MANDATORY_NOT_FOUND
                                description: >-
                                  Represents the error code returned when a
                                  mandatory field is missing in the request.
                              message:
                                type: string
                                description: >-
                                  Represents the message that describes the
                                  missing mandatory field.
                                maxLength: 1000
                              details:
                                type: object
                                description: >-
                                  Represents the details of the missing
                                  mandatory field.
                                properties:
                                  api_name:
                                    type: string
                                    description: >-
                                      Represents the API name of the missing
                                      mandatory field.
                                    maxLength: 100
                                  json_path:
                                    type: string
                                    description: >-
                                      Represents the JSON path of the missing
                                      mandatory field in the request payload.
                                    maxLength: 1000
                                required:
                                  - api_name
                                  - json_path
                                additionalProperties: false
                            required:
                              - status
                              - code
                              - message
                              - details
                            additionalProperties: false
                          - x-zs-$id: InvalidDataErrorDetails
                            type: object
                            description: >-
                              Represents the error details returned when the
                              request payload contains an invalid value for a
                              field.
                            properties:
                              status:
                                type: string
                                enum:
                                  - error
                                description: Represents the status of the failed request.
                              code:
                                type: string
                                enum:
                                  - INVALID_DATA
                                description: >-
                                  Represents the error code returned when the
                                  request contains invalid data.
                              message:
                                type: string
                                description: >-
                                  Represents the message that describes the
                                  invalid data error.
                                maxLength: 1000
                              details:
                                oneOf:
                                  - x-zs-$id: InvalidDataErrorFieldDetails
                                    type: object
                                    description: >-
                                      Represents the identifying details of the
                                      invalid field in the request payload.
                                    properties:
                                      api_name:
                                        type: string
                                        description: >-
                                          Represents the API name of the invalid
                                          field.
                                        maxLength: 100
                                      json_path:
                                        type: string
                                        description: >-
                                          Represents the JSON path of the invalid
                                          field in the request payload.
                                        maxLength: 1000
                                    required:
                                      - api_name
                                      - json_path
                                    additionalProperties: false
                                  - x-zs-$id: InvalidDataErrorFieldTypeDetails
                                    type: object
                                    description: >-
                                      Represents the identifying details of the
                                      invalid field along with the data type
                                      expected for the field.
                                    properties:
                                      api_name:
                                        type: string
                                        description: >-
                                          Represents the API name of the invalid
                                          field.
                                        maxLength: 100
                                      json_path:
                                        type: string
                                        description: >-
                                          Represents the JSON path of the invalid
                                          field in the request payload.
                                        maxLength: 1000
                                      expected_data_type:
                                        type: string
                                        description: >-
                                          Represents the data type expected for
                                          the invalid field.
                                        enum:
                                          - boolean
                                    required:
                                      - api_name
                                      - json_path
                                      - expected_data_type
                                    additionalProperties: false
                                description: >-
                                  Represents the details of the invalid field in
                                  the request payload.
                            required:
                              - status
                              - code
                              - message
                              - details
                            additionalProperties: false
                        description: >-
                          Represents the error details returned when the request
                          to update service preferences fails because of a
                          missing mandatory field or invalid data.
                    required: []
                    additionalProperties: true
                  - x-zs-$id: InvalidDataErrorResponse
                    type: object
                    description: >-
                      Represents the error response returned when the request
                      payload contains an invalid value for a field.
                    properties:
                      status:
                        type: string
                        enum:
                          - error
                        description: |
                          Represents the status of the failed request.
                      code:
                        type: string
                        enum:
                          - INVALID_DATA
                        description: >
                          Represents the error code returned when the request
                          contains invalid data.
                      message:
                        type: string
                        description: >-
                          Represents the message that describes the invalid data
                          error.
                        maxLength: 1000
                      details:
                        oneOf:
                          - x-zs-$id: InvalidDataFieldDetails
                            type: object
                            description: >-
                              Represents the identifying details of the invalid
                              field in the request payload.
                            properties:
                              api_name:
                                type: string
                                description: Represents the API name of the invalid field.
                                maxLength: 100
                              json_path:
                                type: string
                                description: >-
                                  Represents the JSON path of the invalid field
                                  in the request payload.
                                maxLength: 1000
                            required:
                              - api_name
                              - json_path
                            additionalProperties: false
                          - x-zs-$id: InvalidDataFieldTypeDetails
                            type: object
                            description: >-
                              Represents the identifying details of the invalid
                              field along with the data type expected for the
                              field.
                            properties:
                              api_name:
                                type: string
                                description: Represents the API name of the invalid field.
                                maxLength: 100
                              json_path:
                                type: string
                                description: >-
                                  Represents the JSON path of the invalid field
                                  in the request payload.
                                maxLength: 1000
                              expected_data_type:
                                type: string
                                description: >-
                                  Represents the data type expected for the
                                  invalid field.
                                enum:
                                  - boolean
                            required:
                              - api_name
                              - json_path
                              - expected_data_type
                            additionalProperties: false
                        description: >-
                          Represents the details of the invalid field in the
                          request payload.
                    required:
                      - status
                      - code
                      - message
                      - details
                    additionalProperties: true
                description: >-
                  Represents the error response returned when the request to
                  update service preferences is invalid.
              examples:
                MandatoryNotFound:
                  description: >-
                    Illustrates the error response returned when the
                    `service_preferences` key is missing in the request payload.
                  value:
                    code: MANDATORY_NOT_FOUND
                    details:
                      api_name: service_preferences
                      json_path: $.service_preferences
                    message: required field not found
                    status: error
                  summary: >-
                    An example error response when the service_preferences key
                    is missing.
                InvalidData:
                  description: >-
                    Illustrates the error response returned when the
                    `job_sheet_enabled` key is provided with a value whose data
                    type is not Boolean.
                  value:
                    service_preferences:
                      code: INVALID_DATA
                      details:
                        expected_data_type: boolean
                        api_name: job_sheet_enabled
                        json_path: $.service_preferences.job_sheet_enabled
                      message: invalid data
                      status: error
                  summary: >-
                    An example error response when job_sheet_enabled has an
                    invalid data type.
      security:
        - OAuth2:
            - ZohoCRM.settings.modules.UPDATE
security:
  - OAuth2:
      - ZohoCRM.settings.modules.ALL
components:
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://accounts.zoho.com/oauth/v2/auth
          tokenUrl: https://accounts.zoho.com/oauth/v2/token
          refreshUrl: https://accounts.zoho.com/oauth/v2/token
          scopes:
            ZohoCRM.settings.modules.ALL: >-
              Grants full access to read and update the service preferences of
              the organization.
            ZohoCRM.settings.modules.UPDATE: >-
              Grants update access to the service preferences of the
              organization.
            ZohoCRM.settings.modules.READ: Grants read access to the service preferences of the organization.
