components:
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://accounts.zoho.com/oauth/v2/auth
          tokenUrl: https://accounts.zoho.com/oauth/v2/token
          refreshUrl: https://accounts.zoho.com/oauth/v2/token
          scopes:
            ZohoCRM.zia.enrichment.READ: Read access for Zia Enrichment
            ZohoCRM.zia.enrichment.CREATE: Write access for Zia Enrichment
            ZohoCRM.zia.enrichment.UPDATE: Update access for Zia Enrichment
            ZohoCRM.zia.enrichment.DELETE: Delete access for Zia Enrichment
  schemas:
    FieldMappingForWrite:
      type: array
      items:
        type: object
        properties:
          enrich_field:
            type: object
            properties:
              name:
                type: string
                maxLength: 255
                description: Name of the Zia enrichment field.
            required:
              - name
            additionalProperties: false
            description: Zia enrichment field metadata.
          crm_field:
            description: >-
              CRM field object. Provide both ID and API name. Use the [Get
              Fields Metadata API](fields.yaml#$.paths./settings/fields.get) to
              get CRM field IDs and API names.
            oneOf:
              - type: object
                x-zs-$id: CrmField
                properties:
                  id:
                    type: string
                    maxLength: 19
                    description: Unique identifier of the CRM field.
                  api_name:
                    type: string
                    maxLength: 255
                    description: API name of the CRM field.
                required:
                  - id
                  - api_name
                additionalProperties: false
                description: CRM field object with ID and API name.
              - type: 'null'
                x-zs-$id: CrmFieldNull
                description: Null value for CRM field (no mapping).
        required:
          - enrich_field
          - crm_field
        additionalProperties: false
        description: Field mapping item for write operations.
      maxItems: 50
      description: Array of field mappings for write operations.
    FieldMappingForRead:
      type: array
      items:
        type: object
        properties:
          enrich_field:
            type: object
            properties:
              name:
                type: string
                maxLength: 255
                description: Name of the Zia enrichment field.
              display_label:
                type: string
                maxLength: 255
                description: Display label of the Zia enrichment field.
            required:
              - name
              - display_label
            additionalProperties: false
            description: Zia enrichment field metadata with display label.
          crm_field:
            description: CRM field object with additional display name.
            oneOf:
              - type: object
                x-zs-$id: CrmFieldObjWithName
                properties:
                  id:
                    type: string
                    maxLength: 19
                    description: Unique identifier of the CRM field.
                  api_name:
                    type: string
                    maxLength: 255
                    description: API name of the CRM field.
                  name:
                    type: string
                    maxLength: 255
                    description: Display name of the CRM field.
                required:
                  - id
                  - api_name
                additionalProperties: false
                description: CRM field object with ID, API name, and display name.
              - type: 'null'
                x-zs-$id: CrmFieldObjWithNameNull
                description: Null value for CRM field (no mapping).
        required:
          - enrich_field
          - crm_field
        additionalProperties: false
        description: Field mapping item for read operations.
      maxItems: 50
      description: Array of field mappings for read operations.
    Module:
      type: object
      properties:
        id:
          type: string
          maxLength: 19
          description: >-
            Unique identifier of the CRM module. Use the [Get Modules
            API](modules.yaml#$.paths./settings/modules.get) to get module IDs.
        api_name:
          type: string
          maxLength: 255
          description: >-
            API name of the CRM module (e.g., Leads, Contacts, Accounts). Use
            the [Get Modules API](modules.yaml#$.paths./settings/modules.get) to
            get module API names.
      required:
        - id
        - api_name
      additionalProperties: false
      description: CRM module metadata with ID and API name.
