openapi: 3.1.0
info:
  title: Zia Enrichment Configuration API
  description: >-
    Zia, Zoho CRM's AI-powered assistant, can help you ensure that your CRM data
    is complete and updated. Based on information as little as website, name of
    a company etc., Zia crawls web pages and retrieves additional information
    such as the company's address, phone, number of employees, the social media
    handles of the CEO and other public information. This is called Data
    Enrichment. When you enable Data Enrichment, you can map the data available
    over the Internet with the fields in Zoho CRM. Data mapping happens by
    default for system-defined fields, but you can also map with custom fields.
    This mapping is called configuration.
  version: '8'
servers:
  - url: https://zohoapis.{dc}/crm/{version}
    description: Zoho API Base URL
    variables:
      dc:
        enum:
          - com
          - eu
          - in
          - ca
          - au
          - sa
          - ae
        default: com
        description: Data center domain suffix for the Zoho CRM API endpoint
      version:
        default: v8
        description: API version
paths:
  /settings/zia/data_enrichment:
    post:
      operationId: createZiaEnrichmentConfigurations
      summary: Zia Data Enrichment Configuration
      description: >-
        Creates Zia Enrichment Configurations for a specific module. Use the
        [Get Fields Metadata API](fields.yaml#$.paths./settings/fields.get) to
        get CRM field IDs and API names, and the [Get Modules
        API](modules.yaml#$.paths./settings/modules.get) to get module IDs and
        API names.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              x-zs-$id: CreateZiaEnrichmentConfigurationsRequestBody
              properties:
                data_enrichment:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                        maxLength: 255
                        description: >-
                          Type of enrichment — either 'personal' or
                          'organization'.
                      module:
                        $ref: '#/components/schemas/Module'
                      input_data_field_mapping:
                        $ref: '#/components/schemas/FieldMappingForWrite'
                      output_data_field_mapping:
                        $ref: '#/components/schemas/FieldMappingForWrite'
                    required:
                      - type
                      - module
                      - input_data_field_mapping
                      - output_data_field_mapping
                    additionalProperties: false
                    description: >-
                      Configuration item for a single module's enrichment
                      settings.
                  maxItems: 50
                  description: Array of data enrichment configurations.
              required:
                - data_enrichment
              additionalProperties: false
              description: Request body schema for creating Zia Enrichment configurations.
            examples:
              Example:
                value:
                  data_enrichment:
                    - type: personal
                      module:
                        id: '917992000000000129'
                        api_name: Contacts
                      input_data_field_mapping:
                        - enrich_field:
                            name: email
                          crm_field:
                            id: '917992000000000449'
                            api_name: Email
                      output_data_field_mapping:
                        - enrich_field:
                            name: last_name
                          crm_field:
                            id: '917992000000000443'
                            api_name: Last_Name
                        - enrich_field:
                            name: primary_email
                          crm_field:
                            id: '917992000000000449'
                            api_name: Email
                        - enrich_field:
                            name: secondary_email
                          crm_field:
                            id: '917992000000026001'
                            api_name: Secondary_Email
                        - enrich_field:
                            name: primary_contact
                          crm_field:
                            id: '917992000000000457'
                            api_name: Phone
                        - enrich_field:
                            name: social_media_twitter
                          crm_field:
                            id: '917992000000035003'
                            api_name: Twitter
                        - enrich_field:
                            name: primary_address_info_state
                          crm_field:
                            id: '917992000000000503'
                            api_name: Other_State
                        - enrich_field:
                            name: primary_address_info_city
                          crm_field:
                            id: '917992000000000499'
                            api_name: Other_City
                        - enrich_field:
                            name: primary_address_info_country
                          crm_field:
                            id: '917992000000000511'
                            api_name: Other_Country
                        - enrich_field:
                            name: first_name
                          crm_field:
                            id: '917992000000000441'
                            api_name: First_Name
      responses:
        '201':
          description: Enrichment configuration created successfully.
          content:
            application/json:
              schema:
                type: object
                x-zs-$id: CreateZiaEnrichmentConfigurationsSuccessResponse
                properties:
                  data_enrichment:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          maxLength: 255
                          description: Result code indicating the operation status.
                        details:
                          type: object
                          properties:
                            created_time:
                              type: string
                              maxLength: 255
                              description: >-
                                Timestamp when the enrichment configuration was
                                created.
                            id:
                              type: string
                              maxLength: 19
                              description: >-
                                Unique identifier of the created enrichment
                                configuration.
                            created_by:
                              type: object
                              properties:
                                id:
                                  type: string
                                  maxLength: 19
                                  description: >-
                                    Unique identifier of the user who created
                                    the configuration.
                                name:
                                  type: string
                                  maxLength: 255
                                  description: >-
                                    Name of the user who created the
                                    configuration.
                              required:
                                - id
                                - name
                              additionalProperties: false
                              description: User who created the enrichment configuration.
                          required:
                            - created_time
                            - id
                            - created_by
                          additionalProperties: false
                          description: Details of the created enrichment configuration.
                        message:
                          type: string
                          maxLength: 255
                          description: >-
                            Human-readable message describing the operation
                            result.
                        status:
                          type: string
                          maxLength: 255
                          description: >-
                            Overall status of the operation — 'success' or
                            'error'.
                      required:
                        - code
                        - details
                        - message
                        - status
                      additionalProperties: false
                      description: >-
                        Result item for a single enrichment configuration
                        creation.
                    maxItems: 50
                    description: Array of creation results for each configuration.
                required:
                  - data_enrichment
                description: Enrichment created successfully.
                additionalProperties: false
              examples:
                Example:
                  value:
                    data_enrichment:
                      - code: SUCCESS
                        details:
                          created_time: '2025-11-13T12:25:39+05:30'
                          id: '917992000008626025'
                          created_by:
                            id: '917992000000417001'
                            name: Brendon Caster
                        message: Enrichment created successfully
                        status: success
        '400':
          description: >-
            Validation error. Returned when the request contains invalid data,
            missing mandatory fields, unsupported values, or exceeds limits.
          content:
            application/json:
              schema:
                description: 400 responses
                x-zs-$id: CreateZiaEnrichmentConfigurationsBadResponses
                oneOf:
                  - type: object
                    x-zs-$id: CreateZiaEnrichmentConfigurationsProvideInvalidData
                    properties:
                      data_enrichment:
                        type: array
                        items:
                          type: object
                          properties:
                            code:
                              type: string
                              enum:
                                - INVALID_DATA
                                - MANDATORY_NOT_FOUND
                                - NOT_ALLOWED
                                - NOT_SUPPORTED
                                - INVALID_MAPPING
                              description: >-
                                Error code identifying the type of validation
                                failure.
                            details:
                              type: object
                              properties:
                                expected_data_type:
                                  type: string
                                  maxLength: 255
                                  description: Expected data type for the field.
                                api_name:
                                  type: string
                                  maxLength: 255
                                  description: API name of the field that caused the error.
                                json_path:
                                  type: string
                                  maxLength: 255
                                  description: >-
                                    JSON path to the invalid field in the
                                    request body.
                              required:
                                - api_name
                                - json_path
                              additionalProperties: false
                              description: Details about the validation failure.
                            message:
                              type: string
                              maxLength: 255
                              description: Human-readable error message.
                            status:
                              type: string
                              maxLength: 255
                              description: Error status — always 'error'.
                          required:
                            - code
                            - details
                            - message
                            - status
                          additionalProperties: false
                          description: Error item for a single configuration.
                        maxItems: 50
                        description: Array of error items.
                    required:
                      - data_enrichment
                    additionalProperties: false
                    description: Error response when invalid data is provided.
                  - type: object
                    x-zs-$id: CreateZiaEnrichmentConfigurationsUnSupportedValues
                    properties:
                      data_enrichment:
                        type: array
                        items:
                          type: object
                          properties:
                            code:
                              type: string
                              maxLength: 255
                              description: Error code — 'INVALID_DATA'.
                            message:
                              type: string
                              maxLength: 255
                              description: Human-readable error message.
                            details:
                              type: object
                              properties:
                                api_name:
                                  type: string
                                  maxLength: 255
                                  description: API name of the field that caused the error.
                                json_path:
                                  type: string
                                  maxLength: 255
                                  description: >-
                                    JSON path to the invalid field in the
                                    request body.
                                supported_values:
                                  type: array
                                  items:
                                    type: string
                                    enum:
                                      - organization
                                      - personal
                                    description: Supported value for the field.
                                  maxItems: 50
                                  description: List of supported values for the field.
                              required:
                                - api_name
                                - json_path
                                - supported_values
                              additionalProperties: false
                              description: Details about the unsupported value.
                            status:
                              type: string
                              maxLength: 255
                              description: Error status — always 'error'.
                          required:
                            - code
                            - message
                            - details
                            - status
                          additionalProperties: false
                          description: Error item for a single configuration.
                        maxItems: 50
                        description: Array of error items.
                    required:
                      - data_enrichment
                    additionalProperties: false
                    description: Error response when unsupported values are provided.
                  - type: object
                    x-zs-$id: CreateZiaEnrichmentConfigurationsLimitExceeded
                    properties:
                      data_enrichment:
                        type: array
                        items:
                          type: object
                          properties:
                            code:
                              type: string
                              maxLength: 255
                              description: Error code — 'LIMIT_EXCEEDED'.
                            details:
                              type: object
                              properties:
                                limit:
                                  type: integer
                                  format: int32
                                  description: Maximum allowed limit.
                                limit_due_to:
                                  type: array
                                  items:
                                    type: object
                                    properties:
                                      api_name:
                                        type: string
                                        maxLength: 255
                                        description: >-
                                          API name of the field that caused the
                                          limit.
                                      json_path:
                                        type: string
                                        maxLength: 255
                                        description: >-
                                          JSON path to the field that caused the
                                          limit.
                                    required:
                                      - api_name
                                      - json_path
                                    additionalProperties: false
                                    description: Item indicating the limit cause.
                                  maxItems: 50
                                  description: Fields that caused the limit to be exceeded.
                              required:
                                - limit
                                - limit_due_to
                              additionalProperties: false
                              description: Details about the exceeded limit.
                            message:
                              type: string
                              maxLength: 255
                              description: Human-readable error message.
                            status:
                              type: string
                              maxLength: 255
                              description: Error status — always 'error'.
                          required:
                            - code
                            - details
                            - message
                            - status
                          additionalProperties: false
                          description: Error item for a single configuration.
                        maxItems: 50
                        description: Array of error items.
                    required:
                      - data_enrichment
                    additionalProperties: false
                    description: Error response when the maximum limit is exceeded.
                  - type: object
                    x-zs-$id: CreateZiaEnrichmentConfigurationsExpectedFieldMissing
                    properties:
                      data_enrichment:
                        type: array
                        items:
                          type: object
                          properties:
                            code:
                              type: string
                              maxLength: 255
                              description: Error code — 'EXPECTED_FIELD_MISSING'.
                            details:
                              type: object
                              properties:
                                expected_fields:
                                  type: array
                                  items:
                                    type: object
                                    properties:
                                      api_name:
                                        type: string
                                        maxLength: 255
                                        description: API name of the expected field.
                                      json_path:
                                        type: string
                                        maxLength: 255
                                        description: JSON path to the expected field.
                                    required:
                                      - api_name
                                      - json_path
                                    additionalProperties: false
                                    description: Expected field item.
                                  maxItems: 50
                                  description: List of expected fields that are missing.
                              required:
                                - expected_fields
                              additionalProperties: false
                              description: Details about the missing expected fields.
                            message:
                              type: string
                              maxLength: 255
                              description: Human-readable error message.
                            status:
                              type: string
                              maxLength: 255
                              description: Error status — always 'error'.
                          required:
                            - code
                            - details
                            - message
                            - status
                          additionalProperties: false
                          description: Error item for a single configuration.
                        maxItems: 50
                        description: Array of error items.
                    required:
                      - data_enrichment
                    additionalProperties: false
                    description: Error response when expected fields are missing.
                  - type: object
                    x-zs-$id: CreateZiaEnrichmentConfigurationsAmbiguityDuringProcessing
                    properties:
                      data_enrichment:
                        type: array
                        items:
                          type: object
                          properties:
                            code:
                              type: string
                              maxLength: 255
                              description: Error code — 'AMBIGUITY_DURING_PROCESSING'.
                            details:
                              type: object
                              properties:
                                ambiguity_due_to:
                                  type: array
                                  items:
                                    type: object
                                    properties:
                                      api_name:
                                        type: string
                                        maxLength: 255
                                        description: API name of the field causing ambiguity.
                                      json_path:
                                        type: string
                                        maxLength: 255
                                        description: >-
                                          JSON path to the field causing
                                          ambiguity.
                                    required:
                                      - api_name
                                      - json_path
                                    additionalProperties: false
                                    description: Item indicating the ambiguity cause.
                                  maxItems: 50
                                  description: Fields that caused the ambiguity.
                              required:
                                - ambiguity_due_to
                              additionalProperties: false
                              description: Details about the ambiguity.
                            message:
                              type: string
                              maxLength: 255
                              description: Human-readable error message.
                            status:
                              type: string
                              maxLength: 255
                              description: Error status — always 'error'.
                          required:
                            - code
                            - details
                            - message
                            - status
                          additionalProperties: false
                          description: Error item for a single configuration.
                        maxItems: 50
                        description: Array of error items.
                    required:
                      - data_enrichment
                    additionalProperties: false
                    description: >-
                      Error response when ambiguity occurs during processing
                      (e.g., mismatched module ID and API name).
                  - type: object
                    x-zs-$id: >-
                      CreateZiaEnrichmentConfigurationsFeatureNotEnabledOrNotSupported
                    properties:
                      code:
                        type: string
                        enum:
                          - FEATURE_NOT_ENABLED
                          - FEATURE_NOT_SUPPORTED
                        description: >-
                          Error code indicating the feature is not enabled or
                          not supported.
                      details:
                        type: object
                        properties: {}
                        additionalProperties: false
                        description: Additional details — empty for this error type.
                      message:
                        type: string
                        maxLength: 255
                        description: Human-readable error message.
                      status:
                        type: string
                        maxLength: 255
                        description: Error status — always 'error'.
                    required:
                      - code
                      - details
                      - message
                      - status
                    additionalProperties: false
                    description: >-
                      Error response when the feature is not enabled or not
                      supported.
              examples:
                Example1:
                  value:
                    data_enrichment:
                      - code: INVALID_DATA
                        details:
                          expected_data_type: jsonarray
                          api_name: >-
                            output_data_field_mapping ||
                            input_data_field_mapping
                          json_path: >-
                            $.data_enrichment[0].(output_data_field_mapping ||
                            input_data_field_mapping)
                        message: Invalid data
                        status: error
                Example2:
                  value:
                    data_enrichment:
                      - code: INVALID_DATA
                        message: the given type seems to be invalid
                        details:
                          api_name: type
                          json_path: $.data_enrichment[0].type
                          supported_values:
                            - organization
                            - personal
                        status: error
                Example3:
                  value:
                    data_enrichment:
                      - code: LIMIT_EXCEEDED
                        details:
                          limit: 50
                          limit_due_to:
                            - api_name: data_enrichment
                              json_path: $.data_enrichment
                        message: data enrichment configurations limit exceeded
                        status: error
                Example4:
                  value:
                    data_enrichment:
                      - code: EXPECTED_FIELD_MISSING
                        details:
                          expected_fields:
                            - api_name: id
                              json_path: >-
                                $.data_enrichment[0].input_data_field_mapping[0].crm_field.id
                            - api_name: api_name
                              json_path: >-
                                $.data_enrichment[0].output_data_field_mapping[0].crm_field.api_name
                        message: Crm field cannot be empty
                        status: error
                Example5:
                  value:
                    data_enrichment:
                      - code: AMBIGUITY_DURING_PROCESSING
                        details:
                          ambiguity_due_to:
                            - api_name: api_name
                              json_path: $.data_enrichment[0].module.api_name
                            - api_name: id
                              json_path: $.data_enrichment[0].module.id
                        message: Ambiguity while processing
                        status: error
                Example6:
                  value:
                    code: FEATURE_NOT_ENABLED
                    details: {}
                    message: Data Enrichment feature not enabled
                    status: error
        '403':
          description: >-
            Permission error. Returned when the user lacks the necessary
            permissions to create enrichment configurations.
          content:
            application/json:
              schema:
                type: object
                x-zs-$id: CreateZiaEnrichmentConfigurationsNoPermission
                properties:
                  code:
                    type: string
                    maxLength: 255
                    description: Error code — 'NO_PERMISSION'.
                  details:
                    type: object
                    properties:
                      permissions:
                        type: array
                        items:
                          type: string
                          maxLength: 255
                          description: Permission required to access this feature.
                        maxItems: 50
                        description: List of required permissions.
                    required:
                      - permissions
                    additionalProperties: false
                    description: Details about the missing permissions.
                  message:
                    type: string
                    maxLength: 255
                    description: Human-readable error message.
                  status:
                    type: string
                    maxLength: 255
                    description: Error status — always 'error'.
                required:
                  - code
                  - details
                  - message
                  - status
                description: >-
                  Error response when the user lacks permission to access this
                  feature.
                additionalProperties: false
              examples:
                Example:
                  value:
                    code: NO_PERMISSION
                    details:
                      permissions:
                        - Crm_Implied_Manage_Data_Enrichment
                    message: No permission to access this feature
                    status: error
      security:
        - OAuth2:
            - ZohoCRM.zia.enrichment.CREATE
    get:
      operationId: getZiaEnrichmentConfiguration
      summary: Data Enrichment
      description: >-
        Use this API to get the details of configuration for data enrichment.
        This API gives you the mapping of the enrich fields with their
        corresponding CRM fields for enriching data. Use the [Get Modules
        API](modules.yaml#$.paths./settings/modules.get) to get module IDs and
        API names for filtering or reference.
      responses:
        '200':
          description: Enrichment configurations fetched successfully.
          content:
            application/json:
              schema:
                type: object
                x-zs-$id: GetZiaEnrichmentConfigurationsSuccessResponse
                properties:
                  data_enrichment:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          maxLength: 19
                          description: Unique identifier of the enrichment configuration.
                        type:
                          type: string
                          maxLength: 255
                          description: Type of enrichment — 'personal' or 'organization'.
                        module:
                          $ref: '#/components/schemas/Module'
                        status:
                          type: boolean
                          description: Whether the enrichment configuration is active.
                        input_data_field_mapping:
                          $ref: '#/components/schemas/FieldMappingForRead'
                        created_time:
                          type: string
                          maxLength: 255
                          description: Timestamp when the configuration was created.
                        created_by:
                          type: object
                          properties:
                            id:
                              type: string
                              maxLength: 19
                              description: >-
                                Unique identifier of the user who created the
                                configuration.
                            name:
                              type: string
                              maxLength: 255
                              description: Name of the user who created the configuration.
                          required:
                            - id
                            - name
                          additionalProperties: false
                          description: User who created the enrichment configuration.
                        modified_time:
                          type: string
                          maxLength: 255
                          description: Timestamp when the configuration was last modified.
                        modified_by:
                          type: object
                          properties:
                            id:
                              type: string
                              maxLength: 19
                              description: >-
                                Unique identifier of the user who last modified
                                the configuration.
                            name:
                              type: string
                              maxLength: 255
                              description: >-
                                Name of the user who last modified the
                                configuration.
                          required:
                            - id
                            - name
                          additionalProperties: false
                          description: User who last modified the enrichment configuration.
                      required:
                        - id
                        - type
                        - module
                        - status
                        - input_data_field_mapping
                        - created_time
                        - created_by
                        - modified_time
                        - modified_by
                      additionalProperties: false
                      description: Enrichment configuration item for a single module.
                    maxItems: 50
                    description: Array of data enrichment configurations.
                required:
                  - data_enrichment
                description: Data enrichment configurations fetched successfully.
                additionalProperties: false
              examples:
                Example:
                  summary: Successful retrieval of data enrichment configurations
                  description: >-
                    Returns an array of data enrichment configurations for
                    Contacts, Accounts, and Leads modules with both personal and
                    organization enrichment types. Each configuration includes
                    field mappings between Zia enrichment fields and CRM fields,
                    along with status and metadata.
                  value:
                    data_enrichment:
                      - id: '111113000000063801'
                        type: personal
                        module:
                          id: '111113000000002411'
                          api_name: Contacts
                        status: true
                        input_data_field_mapping:
                          - enrich_field:
                              name: email
                              display_label: Email
                            crm_field:
                              id: '111113000000004139'
                              api_name: Email
                              name: Email
                          - enrich_field:
                              name: org_website
                              display_label: Website
                            crm_field: null
                          - enrich_field:
                              name: org_name
                              display_label: Organization Name
                            crm_field: null
                          - enrich_field:
                              name: facebook
                              display_label: facebook
                            crm_field: null
                          - enrich_field:
                              name: twitter
                              display_label: X
                            crm_field: null
                          - enrich_field:
                              name: linkedin
                              display_label: LinkedIn
                            crm_field: null
                        created_time: '2024-04-15T10:01:22+05:30'
                        created_by:
                          id: '111113000000053889'
                          name: Krishna Prakash
                        modified_time: '2024-04-15T10:01:22+05:30'
                        modified_by:
                          id: '111113000000053889'
                          name: Krishna Prakash
                      - id: '111113000000063807'
                        type: personal
                        module:
                          id: '111113000000002413'
                          api_name: Accounts
                        status: true
                        input_data_field_mapping:
                          - enrich_field:
                              name: email
                              display_label: Email
                            crm_field: null
                          - enrich_field:
                              name: org_website
                              display_label: Website
                            crm_field:
                              id: '111113000000004033'
                              api_name: Website
                              name: Website
                          - enrich_field:
                              name: org_name
                              display_label: Organization Name
                            crm_field: null
                          - enrich_field:
                              name: facebook
                              display_label: facebook
                            crm_field: null
                          - enrich_field:
                              name: twitter
                              display_label: X
                            crm_field: null
                          - enrich_field:
                              name: linkedin
                              display_label: LinkedIn
                            crm_field: null
                        created_time: '2024-04-15T10:01:38+05:30'
                        created_by:
                          id: '111113000000053889'
                          name: Krishna Prakash
                        modified_time: '2024-04-15T10:01:38+05:30'
                        modified_by:
                          id: '111113000000053889'
                          name: Krishna Prakash
                      - id: '111113000000072003'
                        type: organization
                        module:
                          id: '111113000000002409'
                          api_name: Leads
