                                Possible values:

                                **error** - The operation failed due to a
                                validation error.
                              enum:
                                - error
                          required:
                            - code
                            - message
                            - status
                    required:
                      - merge
                description: >-
                  Error response for a merge request that failed due to
                  validation errors, invalid data, or business rule violations.
              examples:
                MasterRecordNotAvailable:
                  summary: Example of master record ID is not available.
                  value:
                    code: INVALID_DATA
                    details:
                      resource_path_index: 1
                    message: Master record id is not available
                    status: error
                  description: >-
                    Shows the error when the master record ID specified in the
                    URL path does not correspond to an existing record.
                ChildRecordIdMissing:
                  summary: Example of child record ID is empty or not available.
                  value:
                    merge:
                      - code: MANDATORY_NOT_FOUND
                        details:
                          api_name: id
                          json_path: $.merge[0].data[0].id
                        message: required id not found
                        status: error
                  description: >-
                    Shows the error when the child record ID is missing or empty
                    in the data array.
                InvalidModule:
                  summary: Example of invalid module name provided.
                  value:
                    code: INVALID_MODULE
                    details:
                      resource_path_index: 0
                    message: the module name given seems to be invalid
                    status: error
                  description: >-
                    Shows the error when the module name in the request URL is
                    not a valid module.
                RecordAlreadyBeingMerged:
                  summary: Example of record is already being merged.
                  value:
                    merge:
                      - code: NOT_ALLOWED
                        details:
                          api_name: id
                          json_path: $.merge[0].data[0].id
                        message: This record id is not allowed to be merged
                        status: error
                  description: >-
                    Shows the error when a record in the request is already in
                    the process of being merged and cannot be included in
                    another merge operation.
                ClosingDateNotAllowed:
                  summary: Example of closing date is mentioned for deals module.
                  value:
                    merge:
                      - code: NOT_ALLOWED
                        details:
                          api_name: api_name
                          json_path: $.merge[0].data[0]._fields[0].api_name
                        message: >-
                          Closing date will be automatically populated based on
                          master record
                        status: error
                  description: >-
                    Shows the error when the Closing Date field is included in
                    the merge request for the Deals module, as it is
                    automatically populated from the master record.
                StageFieldNotAllowed:
                  summary: >-
                    Example of stage being mentioned when child and master
                    record have different pipelines.
                  value:
                    merge:
                      - code: NOT_ALLOWED
                        details:
                          api_name: api_name
                          json_path: $.merge[0].data[0]._fields[0].api_name
                        message: >-
                          Stage field will be automatically populated based on
                          chosen Pipeline
                        status: error
                  description: >-
                    Shows the error when the Stage field is included in the
                    merge request for records with different pipelines, as it is
                    automatically populated based on the chosen Pipeline.
                ProbabilityRevenueNotAllowed:
                  summary: >-
                    Example of Expected Revenue and Probability fields are
                    mentioned.
                  value:
                    merge:
                      - code: NOT_ALLOWED
                        details:
                          api_name: api_name
                          json_path: $.merge[0].data[0]._fields[0].api_name
                        message: >-
                          Probability and Expected Revenue fields will be
                          automatically populated based on chosen Stage
                        status: error
                  description: >-
                    Shows the error when the Expected Revenue or Probability
                    field is included in the merge request, as these fields are
                    automatically populated based on the chosen Stage.
                ClosedDealNotAllowed:
                  summary: >-
                    Example of closed deal is mentioned in the request body to
                    merge.
                  value:
                    code: NOT_ALLOWED
                    details:
                      api_name: record
                      resource_path_index: 1
                    message: Only Open Deals can be merged
                    status: error
                  description: >-
                    Shows the error when a closed deal record is included in the
                    merge request, as only open deals can be merged.
                DuplicateRecordIds:
                  summary: Example of all mentioned record IDs are the same.
                  value:
                    merge:
                      - code: DUPLICATE_DATA
                        details:
                          api_name: id
                          json_path: $.merge[0].data[0].id
                        message: Valid record ids need to be given for merging
                        status: error
                  description: >-
                    Shows the error when the master record ID and all child
                    record IDs are identical, as valid distinct record IDs are
                    required.
                DuplicateFieldMention:
                  summary: Example of one particular field is mentioned more than once.
                  value:
                    merge:
                      - code: DUPLICATE_DATA
                        details:
                          api_name: api_name
                          json_path: $.merge[0].data[0]._fields[0].api_name
                        message: When one field is mentioned more than once
                        status: error
                  description: >-
                    Shows the error when the same field API name is specified
                    more than once across the data and master_record_fields
                    arrays.
                MergeArraySizeExceeded:
                  summary: Example of merge array size is larger than one.
                  value:
                    code: INVALID_DATA
                    details: {}
                    message: invalid data
                    status: error
                  description: >-
                    Shows the error when the merge array in the request body
                    contains more than one object.
                ApiNameNotMentioned:
                  summary: Example of API name of a field that is not mentioned.
                  value:
                    merge:
                      - code: MANDATORY_NOT_FOUND
                        details:
                          api_name: api_name
                          json_path: $.merge[0].data[0]._fields[0].api_name
                        message: API name of the field is not mentioned
                        status: error
                  description: >-
                    Shows the error when a field in the _fields array does not
                    include the required api_name property.
                DataArraySizeExceeded:
                  summary: Example of the data size array more than 2.
                  value:
                    merge:
                      - code: INVALID_DATA
                        details:
                          api_name: data
                          json_path: $.merge[0].data
                          maximum_length: 2
                        message: ' More than 2 child record ids cannot be merged.'
                        status: error
                  description: >-
                    Shows the error when the data array contains more than two
                    child record objects, exceeding the maximum allowed size.
                MasterRecordApiNameMissing:
                  summary: >-
                    Example of API name being not mentioned in
                    master_record_fields array.
                  value:
                    merge:
                      - code: MANDATORY_NOT_FOUND
                        details:
                          api_name: api_name
                          json_path: $.merge[0].master_record_fields[0].api_name
                        message: API name not mentioned for the master record
                        status: error
                  description: >-
                    Shows the error when an entry in the master_record_fields
                    array does not include the required api_name property.
                DataArrayEmpty:
                  summary: Example of data array being not mentioned or empty.
                  value:
                    merge:
                      - code: INVALID_DATA
                        details:
                          api_name: data
                          json_path: $.merge[0].data
                          minimum_length: 1
                        message: ' Atleast one child record id is required to be merged.'
                        status: error
                  description: >-
                    Shows the error when the data array is missing or empty in
                    the merge request.
                FileUploadDataMissingMaster:
                  summary: >-
                    Example of File/Image upload field being mentioned in master
                    record but _data array not given.
                  value:
                    merge:
                      - code: DEPENDENT_FIELD_MISSING
                        details:
                          api_name: id
                          json_path: $.merge[0].master_record_fields[0]._data
                          dependee:
                            api_name: api_name
                            json_path: $.merge[0].master_record_fields[0].api_name
                        message: _data array is not mentioned for the master record
                        status: error
                  description: >-
                    Shows the error when a file upload or image upload field is
                    specified in master_record_fields but the _data array is
                    missing.
                FileUploadDataMissingChild:
                  summary: >-
                    Example of File/Image upload field being mentioned in data
                    array but _data array not given.
                  value:
                    merge:
                      - code: DEPENDENT_FIELD_MISSING
                        details:
                          api_name: id
                          json_path: $.merge[0].data[0]._fields[0]._data
                          dependee:
                            api_name: api_name
                            json_path: $.merge[0].data[0]._fields[0].api_name
                        message: _data array is not mentioned for the child record
                        status: error
                  description: >-
                    Shows the error when a file upload or image upload field is
                    specified for a child record in _fields but the _data array
                    is missing.
                CpqAssociationError:
                  summary: Example of records being associated with CPQ rules.
                  value:
                    merge:
                      - code: NOT_ALLOWED
                        details:
                          data:
                            - _associated_places:
                                - resources:
                                    - name: asdfsdf
                                      id: '111111000000071837'
                                  type: product_configurators
                                - resources:
                                    - name: PR -sample
                                      id: '111111000000072007'
                                  type: pricing_rules
                              id: '111111000000071814'
                          api_name: data
                          json_path: $.merge[0].data
                        message: >-
                          unable to merge records since there are association in
                          child records
                        status: error
                  description: >-
                    Shows the error when a child record is associated with CPQ
                    configurations such as product configurators or pricing
                    rules, preventing the merge.
                FileSizeLimitExceeded:
                  summary: >-
                    Example of total size of files/images in a field exceeding
                    maximum upload size.
                  value:
                    merge:
                      - code: LIMIT_EXCEEDED
                        details:
                          MAXIMUM_SIZE: 30 MB
                          limit_due_to:
                            - api_name: File_Upload_30MB
                              json_path: $.merge[0].data[0]._fields[0].api_name
                            - api_name: File_Upload_30MB
                              json_path: $.merge[0].data[1]._fields[1].api_name
                            - api_name: File_Upload_30MB
                              json_path: $.merge[0].master_record_fields[1].api_name
                        message: Attachment size limit exceeded
                        status: error
                  description: >-
                    Shows the error when the combined size of files or images
                    across the specified fields exceeds the maximum upload size
                    limit, listing each contributing field.
                ReportingToChildOnly:
                  summary: Example of providing only Reporting To for child record.
                  value:
                    merge:
                      - code: INVALID_DATA
                        details:
                          api_name: api_name
                          json_path: $.merge[0].data[0]._fields[0].api_name
                        message: >-
                          Reporting to and account should belong to the same
                          record
                        status: error
                  description: >-
                    Shows the error when the Reporting To field is specified for
                    only a child record, without specifying the Account field
                    for the same record.
                ReportingToWithAccountMismatch:
                  summary: >-
                    Example of configuring Reporting To for child and Account
                    for master (or vice versa).
                  value:
                    merge:
                      - code: INVALID_DATA
                        details:
                          api_name: api_name
                          json_path: $.merge[0].data[0]._fields[0].api_name
                        message: >-
                          Reporting to and account should belong to the same
                          record
                        status: error
                  description: >-
                    Shows the error when the Reporting To and Account fields are
                    specified for different records, as both must belong to the
                    same record.
      security:
        - OAuth2:
            - ZohoCRM.modules.custom.CREATE
        - OAuth2:
            - ZohoCRM.modules.leads.CREATE
        - OAuth2:
            - ZohoCRM.modules.contacts.CREATE
        - OAuth2:
            - ZohoCRM.modules.accounts.CREATE
        - OAuth2:
            - ZohoCRM.modules.potentials.CREATE
        - OAuth2:
            - ZohoCRM.modules.vendors.CREATE
security:
  - OAuth2:
      - ZohoCRM.modules.custom.READ
  - OAuth2:
      - ZohoCRM.modules.leads.READ
  - OAuth2:
      - ZohoCRM.modules.contacts.READ
  - OAuth2:
      - ZohoCRM.modules.accounts.READ
  - OAuth2:
      - ZohoCRM.modules.potentials.READ
  - OAuth2:
      - ZohoCRM.modules.vendors.READ
  - OAuth2:
      - ZohoCRM.modules.custom.CREATE
  - OAuth2:
      - ZohoCRM.modules.leads.CREATE
  - OAuth2:
      - ZohoCRM.modules.contacts.CREATE
  - OAuth2:
      - ZohoCRM.modules.accounts.CREATE
  - OAuth2:
      - ZohoCRM.modules.potentials.CREATE
  - OAuth2:
      - ZohoCRM.modules.vendors.CREATE
components:
  parameters:
    Module:
      name: module
      in: path
      required: true
      description: |
        Specify the CRM module name containing the records to be merged.
        Possible values:
        **Accounts** - Accounts module.
        **Contacts** - Contacts module.
        **Leads** - Leads module.
        **Deals** - Deals module.
        **Vendors** - Cases module.
        Additionally, **custom modules** are also supported in this API.  
      schema:
        type: string
        description: Valid CRM module name
        enum:
          - Accounts
          - Contacts
          - Leads
          - Deals
          - Cases
          - Campaigns
    JobId:
      name: job_id
      in: query
      required: false
      description: >-
        The ID represents the unique identifier of your scheduled merge job,
        which you get from the response of the [Merge Records
        API](find_and_merge.yaml#$.paths./{module}/{masterRecordId}/actions/merge.get). 
      schema:
        type: string
        description: Unique identifier for merge job
        pattern: ^[0-9]+$
        maxLength: 50
    MasterRecordId:
      name: masterRecordId
      in: path
      required: true
      description: >-
        Specify the unique identifier of the master record to be retained after
        the merge operation. 
      schema:
        type: string
        description: Master record identifier (int64 as string)
        pattern: ^[0-9]+$
        maxLength: 50
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://accounts.zoho.com/oauth/v2/auth
          tokenUrl: https://accounts.zoho.com/oauth/v2/token
          refreshUrl: https://accounts.zoho.com/oauth/v2/token
          scopes:
            ZohoCRM.modules.custom.READ: Read access to CRM custom module records for merge operations
            ZohoCRM.modules.leads.READ: Read access to CRM leads module records for merge operations
            ZohoCRM.modules.contacts.READ: Read access to CRM contacts module records for merge operations
            ZohoCRM.modules.accounts.READ: Read access to CRM accounts module records for merge operations
            ZohoCRM.modules.potentials.READ: Read access to CRM potentials module records for merge operations
            ZohoCRM.modules.vendors.READ: Read access to CRM vendors module records for merge operations
            ZohoCRM.modules.custom.CREATE: Write access to CRM custom module records for merge operations
            ZohoCRM.modules.leads.CREATE: Write access to CRM leads module records for merge operations
            ZohoCRM.modules.contacts.CREATE: Write access to CRM contacts module records for merge operations
            ZohoCRM.modules.accounts.CREATE: Write access to CRM accounts module records for merge operations
            ZohoCRM.modules.potentials.CREATE: Write access to CRM potentials module records for merge operations
            ZohoCRM.modules.vendors.CREATE: Write access to CRM vendors module records for merge operations
            ZohoCRM.modules.all: Full access to CRM modules for merge operations
