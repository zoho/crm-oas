                              enum:
                                - MANDATORY_NOT_FOUND
                                - NOT_ALLOWED
                                - INVALID_DATA
                                - DUPLICATE_DATA
                                - DEPENDENT_FIELD_MISSING
                                - LIMIT_EXCEEDED
                            details:
                              type: object
                              description: >-
                                Contains detailed error information for the
                                failed merge operation, including the field
                                name, JSON path, and constraint limits.
                              additionalProperties: false
                              properties:
                                api_name:
                                  type: string
                                  description: >-
                                    Represents the API name of the field that
                                    caused the validation error.
                                  maxLength: 100
                                json_path:
                                  type: string
                                  description: >-
                                    Represents the JSON path to the field in the
                                    request that caused the validation error.
                                  maxLength: 200
                                resource_path_index:
                                  type: integer
                                  format: int32
                                  description: >-
                                    Represents the zero-based index of the path
                                    parameter that caused the error.
                                maximum_length:
                                  type: integer
                                  format: int32
                                  description: >-
                                    Represents the maximum allowed length for
                                    the field that caused the validation error.
                                minimum_length:
                                  type: integer
                                  format: int32
                                  description: >-
