                            format: int32
                            description: >-
                              Represents the minimum required length for the
                              field that caused the validation error.
                      message:
                        type: string
                        description: >-
                          Represents the error message that describes the issue
                          in detail. 
                        maxLength: 500
                      status:
                        type: string
                        description: >
                          Represents the status of the API request. 

                          Possible values:

                          **error** - The request failed due to a validation
                          error or other issue.
                        enum:
                          - error
                    required:
                      - code
                      - message
                      - status
                  - x-zs-$id: FindAndMergeMergeRecordsMergeArrayErrorResponse
                    type: object
                    description: >-
                      Error response with merge array structure, returned when
