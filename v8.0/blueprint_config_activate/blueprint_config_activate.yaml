openapi: 3.1.0
info:
  title: Blueprint Config Activate
  description: >-
    Use this API to activate the specified Blueprint configuration in your Zoho
    CRM account. Once activated, the Blueprint starts enforcing the defined
    process for records that meet its entry criteria.
  version: '8'
servers:
  - url: https://zohoapis.{dc}/crm/{version}
    description: API Server URL
    variables:
      dc:
        description: API Server URL TLD
        default: com
        enum:
          - eu
          - com
          - au
          - in
          - jp
          - cn
          - ca
      version:
        description: API Version
        default: v8
security:
  - OAuth2:
      - ZohoCRM.settings.blueprint.CREATE
paths:
  /settings/blueprints/{blueprintId}/actions/activate:
    post:
      summary: Activate Blueprint
      description: >-
        To publish a blueprint draft, republish a blueprint draft, or activate a
        previously deactivated blueprint in your Zoho CRM organization.
      x-zs-llm-description: >-
        Activate a blueprint by blueprintId with optional map_states and
        move_records settings
      operationId: activateBlueprint
      parameters:
        - name: blueprintId
          in: path
          required: true
          schema:
            type: string
            format: int64
            pattern: ^[0-9]+
            minLength: 1
            maxLength: 19
          description: >-
            The ID of the blueprint to activate. Use the [Get Blueprint by
            ID](blueprints.yaml#$.paths./settings/blueprints/{blueprintId}.get)
            to retrieve the Blueprint ID.
        - $ref: '#/components/parameters/ParamHeaderXZohoService'
      requestBody:
        description: Request body
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlueprintActivationPayload'
            examples:
              SamplePostRequest:
                summary: Sample request body
                value:
                  blueprints:
                    - move_records: true
                      map_states:
                        - existing_state:
                            id: '111112000000000084'
                          replacing_state:
                            id: '111112000000000034'
            x-zs-llm-examples:
              - SamplePostRequest
      responses:
        '200':
          description: OK - Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlueprintActivationSuccessResponse'
              examples:
                Success200:
                  summary: Success response for status 200
                  value:
                    blueprints:
                      - code: SUCCESS
                        details:
                          id: '5226917000005130001'
                        message: Blueprint successfully published
                        status: success
          headers:
            X-API-CREDITS-REMAINING:
              schema:
                type: string
                format: int64
                description: >
                  Present when >=50% of base daily credits (excluding add-on
                  credits) are consumed. Value is total remaining credits
                  including add-on credits for the rolling 24-hour window.
                pattern: ^[0-9]+$
                minLength: 1
                maxLength: 19
              required: false
        '204':
          description: No Content - Successful response with no body content
          headers:
            X-API-CREDITS-REMAINING:
              schema:
                type: string
                format: int64
                description: >
                  Present when >=50% of base daily credits (excluding add-on
                  credits) are consumed. Value is total remaining credits
                  including add-on credits for the rolling 24-hour window.
                pattern: ^[0-9]+$
                minLength: 1
                maxLength: 19
              required: false
        '400':
          description: Bad Request - The request cannot be processed due to invalid syntax.
          content:
            application/json:
              schema:
                x-zs-$id: PostsettingsblueprintblueprintidactionsactivateResponse400
                oneOf:
                  - $ref: '#/components/schemas/InvalidResourcePathError'
                  - type: object
                    x-zs-$id: >-
                      PostsettingsblueprintblueprintidactionsactivateResponse400Blueprints
                    additionalProperties: false
                    description: Wrapped error response with blueprints
                    properties:
                      blueprints:
                        type: array
                        description: Array of error objects
                        items:
                          oneOf:
                            - $ref: '#/components/schemas/ErrorResponseCore27'
                            - $ref: >-
                                #/components/schemas/ActivationRecordActionsMissingError
                            - $ref: >-
                                #/components/schemas/ActivationStateTargetsMissingError
                            - $ref: '#/components/schemas/ErrorResponseCore25'
                            - $ref: '#/components/schemas/MapStatesAmbiguityError'
                            - $ref: '#/components/schemas/ErrorResponseCore9'
                            - $ref: '#/components/schemas/ErrorResponseCore4'
                            - $ref: '#/components/schemas/ErrorResponseCore2'
                            - $ref: '#/components/schemas/ErrorResponseCore6'
                            - $ref: '#/components/schemas/InvalidValueResponse'
                            - $ref: >-
                                #/components/schemas/MapStateMandatoryMissingError
                            - $ref: >-
                                #/components/schemas/NoTransitionsInBlueprintError
                            - $ref: '#/components/schemas/MoveRecordsMandatoryError'
                        maxItems: 25
                    required:
                      - blueprints
                  - $ref: '#/components/schemas/InvalidProcessIDError'
                  - $ref: '#/components/schemas/BlueprintLimitExceededError'
                  - $ref: '#/components/schemas/DuplicateBlueprintNameError'
                  - $ref: '#/components/schemas/DisconnectedStatesError'
                  - $ref: '#/components/schemas/MissingStateTransitionsError'
                  - $ref: '#/components/schemas/BlueprintAlreadyPublishedError'
                  - $ref: '#/components/schemas/InvalidBlueprintConnectionsError'
                  - $ref: '#/components/schemas/BlueprintAlreadyActiveError'
              examples:
                InvalidDataResponse1:
                  summary: >-
                    Error response with code INVALID_DATA: the process id given
                    seems to be invalid
                  value:
                    code: INVALID_DATA
                    details:
                      resource_path_index: 2
                    message: the process id given seems to be invalid
                    status: error
                InvalidDataResponse2:
                  summary: >-
                    Error response with code INVALID_DATA: invalid data (Field:
                    blueprints)
                  value:
                    blueprints:
                      - code: INVALID_DATA
                        details:
                          maximum_length: 1
                          api_name: blueprints
                          json_path: $
                        message: invalid data
                        status: error
                InvalidDataResponse3:
                  summary: >-
                    Error response with code INVALID_DATA: the process id given
                    seems to be invalid
                  value:
                    code: INVALID_DATA
                    details:
                      message: the process id given seems to be invalid
                    message: the process id given seems to be invalid
                    status: error
                LimitExceededResponse1:
                  summary: >-
                    Error response with code LIMIT_EXCEEDED: Blueprint limit
                    exceeded
                  value:
                    code: LIMIT_EXCEEDED
                    details:
                      limit: 50
                    message: Blueprint limit exceeded
                    status: error
                DependentFieldMissingResponse1:
                  summary: >-
                    Error response with code DEPENDENT_FIELD_MISSING: Specify
                    record actions to be done while publishing this blueprint.
                    (Field: record_actions)
                  value:
                    blueprints:
                      - code: DEPENDENT_FIELD_MISSING
                        details:
                          dependee:
                            api_name: type
                            json_path: $.blueprints[0].type
                          api_name: record_actions
                          json_path: $.blueprints[0].record_actions
                        message: >-
                          Specify record actions to be done while publishing
                          this blueprint.
                        status: error
                DependentFieldMissingResponse2:
                  summary: >-
                    Error response with code DEPENDENT_FIELD_MISSING: Provide
                    states to move the current records to current version of
                    blueprint (Field: map_states)
                  value:
                    blueprints:
                      - code: DEPENDENT_FIELD_MISSING
                        details:
                          dependee:
                            api_name: action
                            json_path: $.blueprints[0].record_actions.action
                            dependee_value: move_current_records
                          api_name: map_states
                          json_path: $.blueprints[0].map_states
                        message: >-
                          Provide states to move the current records to current
                          version of blueprint
                        status: error
                MandatoryNotFoundResponse1:
                  summary: >-
                    Error response with code MANDATORY_NOT_FOUND: required field
                    not found (Field: action)
                  value:
                    blueprints:
                      - code: MANDATORY_NOT_FOUND
                        details:
                          api_name: action
                          json_path: $.blueprints[0].record_actions.action
                        message: required field not found
                        status: error
                MandatoryNotFoundResponse2:
                  summary: >-
                    Error response with code MANDATORY_NOT_FOUND: required field
                    not found (Field: check_existing_records)
                  value:
                    blueprints:
                      - code: MANDATORY_NOT_FOUND
                        details:
                          api_name: check_existing_records
                          json_path: >-
                            $.blueprints[0].record_actions.check_existing_records
                        message: required field not found
                        status: error
                AmbiguityDuringProcessingResponse1:
                  summary: >-
                    Error response with code AMBIGUITY_DURING_PROCESSING:
                    Provide proper values
                  value:
                    blueprints:
                      - code: AMBIGUITY_DURING_PROCESSING
                        details:
                          ambiguity_due_to:
                            - api_name: type
                              json_path: $.blueprints[0].type
                            - api_name: map_states
                              json_path: $.blueprints[0].map_states
                        message: Provide proper values
                        status: error
                InvalidDataResponse4:
                  summary: >-
                    Error response with code INVALID_DATA: the value given is
                    invalid (Field: replacing_state)
                  value:
                    blueprints:
                      - code: INVALID_DATA
                        details:
                          api_name: replacing_state
                          json_path: $.blueprints[0].map_states.replacing_state
                        message: the value given is invalid
                        status: error
                InvalidDataResponse5:
                  summary: >-
                    Error response with code INVALID_DATA: the value given is
                    invalid (Field: existing_state)
                  value:
                    blueprints:
                      - code: INVALID_DATA
                        details:
                          api_name: existing_state
                          json_path: $.blueprints[0].map_states.existing_state
                        message: the value given is invalid
                        status: error
                NotAllowedResponse1:
                  summary: >-
                    Error response with code NOT_ALLOWED: Already a blueprint
                    with same name exists
                  value:
                    code: NOT_ALLOWED
                    details: {}
                    message: Already a blueprint with same name exists
                    status: error
                NotAllowedResponse2:
                  summary: >-
                    Error response with code NOT_ALLOWED: There exists states
                    which are not connected to any other states
                  value:
                    code: NOT_ALLOWED
                    details: {}
                    message: >-
                      There exists states which are not connected to any other
                      states
                    status: error
                NotAllowedResponse3:
                  summary: >-
                    Error response with code NOT_ALLOWED: Transitions are
                    missing between few states
                  value:
                    code: NOT_ALLOWED
                    details: {}
                    message: Transitions are missing between few states
                    status: error
                NotAllowedResponse4:
                  summary: >-
                    Error response with code NOT_ALLOWED: Blueprint is already
                    published, cannot republish over already published version.
                    Create a draft version and publish.
                  value:
                    code: NOT_ALLOWED
                    details: {}
                    message: >-
                      Blueprint is already published, cannot republish over
                      already published version. Create a draft version and
                      publish.
                    status: error
                NotAllowedResponse5:
                  summary: >-
                    Error response with code NOT_ALLOWED: The connections in
                    chart data are not valid, due to which blueprint cannot be
                    published.
                  value:
                    code: NOT_ALLOWED
                    details: {}
                    message: >-
                      The connections in chart data are not valid, due to which
                      blueprint cannot be published.
                    status: error
                MandatoryNotFoundResponse3:
                  summary: >-
                    Error response with code MANDATORY_NOT_FOUND: Required field
                    is missing (Field: move_records)
                  value:
                    blueprints:
                      - code: MANDATORY_NOT_FOUND
                        message: Required field is missing
                        details:
                          api_name: move_records
                          json_path: $.blueprints[*].move_records
                        status: error
                InvalidDataResponse6:
                  summary: >-
                    Error response with code INVALID_DATA: Invalid data type
                    (Field: move_records)
                  value:
                    blueprints:
                      - code: INVALID_DATA
                        message: Invalid data type
                        details:
                          api_name: move_records
                          expected_data_type: boolean
                          json_path: $.blueprints[*].move_records
                        status: error
                InvalidDataResponse7:
                  summary: >-
                    Error response with code INVALID_DATA: Invalid data type
                    (Field: map_states)
                  value:
                    blueprints:
                      - code: INVALID_DATA
                        message: Invalid data type
                        details:
                          api_name: map_states
                          expected_data_type: jsonarray
                          json_path: $.blueprints[*].map_states
                        status: error
                InvalidDataResponse8:
                  summary: >-
                    Error response with code INVALID_DATA: Invalid data (Field:
                    map_states)
                  value:
                    blueprints:
                      - code: INVALID_DATA
                        message: Invalid data
                        details:
                          api_name: map_states
                          maximum_length: 1
                          json_path: $.blueprints[*].map_states
                        status: error
                InvalidDataResponse9:
                  summary: >-
                    Error response with code INVALID_DATA: Invalid data type
                    (Field: existing_state)
                  value:
                    blueprints:
                      - code: INVALID_DATA
                        message: Invalid data type
                        details:
                          api_name: existing_state
                          expected_data_type: jsonobject
                          json_path: $.blueprints[*].map_states[*].existing_state
                        status: error
                InvalidDataResponse10:
                  summary: >-
                    Error response with code INVALID_DATA: Invalid data (Field:
                    existing_state)
                  value:
                    blueprints:
                      - code: INVALID_DATA
                        message: Invalid data
                        details:
                          api_name: existing_state
                          maximum_length: 1
                          json_path: $.blueprints[*].map_states[*].existing_state
                        status: error
                InvalidDataResponse11:
                  summary: >-
                    Error response with code INVALID_DATA: Invalid data type
                    (Field: id)
                  value:
                    blueprints:
                      - code: INVALID_DATA
                        message: Invalid data type
                        details:
                          api_name: id
                          expected_data_type: bigint
                          json_path: $.blueprints[*].map_states[*].existing_state.id
                        status: error
                InvalidDataResponse12:
                  summary: >-
                    Error response with code INVALID_DATA: Invalid data (Field:
                    id)
                  value:
                    blueprints:
                      - code: INVALID_DATA
                        message: Invalid data
                        details:
                          api_name: id
                          maximum_length: 50
                          json_path: $.blueprints[*].map_states[*].existing_state.id
                        status: error
                InvalidDataResponse13:
                  summary: >-
                    Error response with code INVALID_DATA: Invalid data type
                    (Field: replacing_state)
                  value:
                    blueprints:
                      - code: INVALID_DATA
                        message: Invalid data type
                        details:
                          api_name: replacing_state
                          expected_data_type: jsonobject
                          json_path: $.blueprints[*].map_states[*].replacing_state
                        status: error
                InvalidDataResponse14:
                  summary: >-
                    Error response with code INVALID_DATA: Invalid data (Field:
                    replacing_state)
                  value:
                    blueprints:
                      - code: INVALID_DATA
                        message: Invalid data
                        details:
                          api_name: replacing_state
                          maximum_length: 1
                          json_path: $.blueprints[*].map_states[*].replacing_state
                        status: error
                InvalidDataResponse15:
                  summary: >-
                    Error response with code INVALID_DATA: Invalid data type
                    (Field: id)
                  value:
                    blueprints:
                      - code: INVALID_DATA
                        message: Invalid data type
                        details:
                          api_name: id
                          expected_data_type: bigint
                          json_path: $.blueprints[*].map_states[*].replacing_state.id
                        status: error
                InvalidDataResponse16:
                  summary: >-
                    Error response with code INVALID_DATA: Invalid data (Field:
                    id)
                  value:
                    blueprints:
                      - code: INVALID_DATA
                        message: Invalid data
                        details:
                          api_name: id
                          maximum_length: 50
                          json_path: $.blueprints[*].map_states[*].replacing_state.id
                        status: error
                BlueprintAlreadyActiveResponse1:
                  summary: >-
                    Error response with code INVALID_DATA: Blueprint is already
                    active
                  value:
                    code: INVALID_DATA
                    details:
                      id: '111111000000360528'
                    message: Blueprint is already active
                    status: error
                MapStateMandatoryMissingResponse1:
                  summary: >-
                    Error response with code DEPENDENT_FIELD_MISSING: mandatory
                    param missing (Field: map_states)
                  value:
                    blueprints:
                      - code: DEPENDENT_FIELD_MISSING
                        details:
                          dependee:
                            api_name: move_records
                            json_path: $.bluperints[0].move_records
                          api_name: map_states
                          json_path: $.blueprints[0].map_states
                        message: mandatory param missing
                        status: error
                NoTransitionsInBlueprintResponse1:
                  summary: >-
                    Error response with code INVALID_DATA: No transitions found
                    in blueprint
                  value:
                    blueprints:
                      - code: INVALID_DATA
                        details:
                          message: No transitions found in blueprint
                        message: invalid data
                        status: error
                MoveRecordsMandatoryResponse1:
                  summary: >-
                    Error response with code MANDATORY_NOT_FOUND: When blueprint
                    has records, move_records is mandatory
                  value:
                    blueprints:
                      - code: MANDATORY_NOT_FOUND
                        details:
                          api_name: move_records
                          json_path: $.blueprints[0].move_records
                        message: When blueprint has records, move_records is mandatory
                        status: error
          headers:
            X-API-CREDITS-REMAINING:
              schema:
                type: string
                format: int64
                description: >
                  Present when >=50% of base daily credits (excluding add-on
                  credits) are consumed. Value is total remaining credits
                  including add-on credits for the rolling 24-hour window.
                pattern: ^[0-9]+$
                minLength: 1
                maxLength: 19
              required: false
      security:
        - OAuth2:
            - ZohoCRM.settings.blueprint.CREATE
  /settings/blueprints/{blueprintId}/actions/deactivate:
    post:
      summary: Deactivate Blueprint
      description: To deactivate a published blueprint in your Zoho CRM organization.
      x-zs-llm-description: Deactivate a blueprint by blueprintId
      operationId: deactivateBlueprint
      parameters:
        - name: blueprintId
          in: path
          required: true
          schema:
            type: string
            format: int64
            pattern: ^[0-9]+
            minLength: 1
            maxLength: 19
          description: >-
            The ID of the blueprint to deactivate. Use the [Get Blueprint by
            ID](blueprints.yaml#$.paths./settings/blueprints/{blueprintId}.get)
            to retrieve the Blueprint ID.
        - $ref: '#/components/parameters/ParamHeaderXZohoService'
      requestBody:
        description: Request body
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlueprintDeactivationRequest'
            examples:
              SamplePostRequest:
                summary: Sample request body
                value:
                  blueprints:
                    - exit_records: true
            x-zs-llm-examples:
              - SamplePostRequest
      responses:
        '200':
          description: OK - Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlueprintDeactivationResponse'
              examples:
                Success200:
                  summary: Success response for status 200
                  value:
                    blueprints:
                      - status: success
                        code: SUCCESS
                        details:
                          id: '111111000000124001'
                        message: Blueprint successfully deactivated
          headers:
            X-API-CREDITS-REMAINING:
              schema:
                type: string
                format: int64
                description: >
                  Present when >=50% of base daily credits (excluding add-on
                  credits) are consumed. Value is total remaining credits
                  including add-on credits for the rolling 24-hour window.
                pattern: ^[0-9]+$
                minLength: 1
                maxLength: 19
              required: false
        '400':
          description: Bad Request - The request cannot be processed due to invalid syntax.
          content:
            application/json:
              schema:
                x-zs-$id: PostsettingsblueprintblueprintidactionsdeactivateResponse400
                oneOf:
                  - $ref: '#/components/schemas/ErrorResponseCore15'
                  - $ref: '#/components/schemas/InvalidResourcePathError'
                  - $ref: '#/components/schemas/BlueprintCannotBeDeactivatedError'
                  - $ref: '#/components/schemas/BlueprintAlreadyInactiveError'
                  - type: object
                    x-zs-$id: >-
                      PostsettingsblueprintblueprintidactionsdeactivateResponse400Blueprints
                    additionalProperties: false
                    description: Wrapped error response with blueprints
                    properties:
                      blueprints:
                        type: array
                        description: Array of error objects
                        items:
                          $ref: '#/components/schemas/ErrorResponseCore2'
                        maxItems: 25
                    required:
                      - blueprints
              examples:
                RequiredHeaderMissingResponse1:
                  summary: >-
                    Error response with code REQUIRED_HEADER_MISSING: One of the
                    expected headers is missing
                  value:
                    code: REQUIRED_HEADER_MISSING
                    details:
                      header_name: X-CRM-ORG
                    message: One of the expected headers is missing
                    status: error
                InvalidDataResponse1:
                  summary: >-
                    Error response with code INVALID_DATA: the process id given
                    seems to be invalid
                  value:
                    code: INVALID_DATA
                    details:
                      resource_path_index: 2
                    message: the process id given seems to be invalid
                    status: error
                InvalidDataResponse2:
                  summary: >-
                    Error response with code INVALID_DATA: Invalid data type
                    (Field: exit_records)
                  value:
                    blueprints:
                      - code: INVALID_DATA
                        message: Invalid data type
                        details:
                          api_name: exit_records
                          expected_data_type: boolean
                          json_path: $.blueprints[*].exit_records
                        status: error
                BlueprintCannotBeDeactivatedResponse1:
                  summary: >-
                    Error response with code INVALID_DATA: Blueprint cannot be
                    deactivated
                  value:
                    code: INVALID_DATA
                    details:
                      id: '111111000000352870'
                    message: Blueprint cannot be deactivated
                    status: error
                BlueprintAlreadyInactiveResponse1:
                  summary: >-
                    Error response with code INVALID_DATA: Blueprint is already
                    inactive
                  value:
                    code: INVALID_DATA
                    details:
                      id: '111111000000352844'
                    message: Blueprint is already inactive
                    status: error
          headers:
            X-API-CREDITS-REMAINING:
              schema:
                type: string
                format: int64
                description: >
                  Present when >=50% of base daily credits (excluding add-on
                  credits) are consumed. Value is total remaining credits
                  including add-on credits for the rolling 24-hour window.
                pattern: ^[0-9]+$
                minLength: 1
                maxLength: 19
              required: false
      security:
        - OAuth2:
            - ZohoCRM.settings.blueprint.CREATE
components:
  schemas:
    BlueprintActivationPayload:
      type: object
      additionalProperties: false
      description: >-
        Request body wrapper that provides a list of blueprints with their
        activation settings and required state mappings for transitioning from
        draft to active.
      properties:
        blueprints:
          type: array
          description: This is the root key of the request body (Required)
          items:
            $ref: '#/components/schemas/BlueprintActivationSettings'
          maxItems: 1
      required:
        - blueprints
      title: Blueprint Activation Payload
    InvalidResourcePathError:
      type: object
      additionalProperties: false
      description: >-
        Indicates the resource path is invalid (e.g., invalid path index),
        typically due to a malformed or incorrect identifier provided for
        activation.
      properties:
        code:
          type: string
          description: Error code
          enum:
            - INVALID_DATA
        details:
          type: object
          additionalProperties: false
          description: Error details with validation information
          properties:
            resource_path_index:
              type: integer
              format: int32
              description: 'Detail field: resource_path_index'
          required:
            - resource_path_index
        message:
          type: string
          description: Error message
          enum:
            - the process id given seems to be invalid
        status:
          type: string
          description: Error status
          enum:
            - error
      required:
        - code
        - details
        - message
        - status
      title: Invalid Resource Path Error
      x-zs-$id: ErrorResponseCore1241434594
    ActivationRecordActionsMissingError:
      type: object
      additionalProperties: false
      description: >-
        Dependent field missing: specify the record actions to perform while
        publishing/activating the blueprint.
      properties:
        code:
          type: string
          description: Error code
          enum:
            - DEPENDENT_FIELD_MISSING
        details:
          type: object
          additionalProperties: false
          description: Error details with validation information
          properties:
            dependee:
              type: object
              additionalProperties: false
              description: 'Detail field: dependee'
              properties:
                api_name:
                  type: string
                  description: 'Nested detail field: api_name'
                  maxLength: 255
                json_path:
                  type: string
                  description: 'Nested detail field: json_path'
                  maxLength: 1000
              required:
                - api_name
                - json_path
            api_name:
              type: string
              description: 'Detail field: api_name'
              maxLength: 255
            json_path:
              type: string
              description: 'Detail field: json_path'
              maxLength: 1000
          required:
            - api_name
            - dependee
            - json_path
        message:
          type: string
          description: Error message
          enum:
            - Specify record actions to be done while publishing this blueprint.
        status:
          type: string
          description: Error status
          enum:
            - error
      required:
        - code
        - details
        - message
        - status
      title: Activation Record Actions Missing Error
      x-zs-$id: ErrorResponseCore711870005
    DisconnectedStatesError:
      type: object
      additionalProperties: false
      description: >-
        The blueprint contains states that are not connected to any other
        states, which is not allowed.
      properties:
        code:
          type: string
          description: Error code
          enum:
            - NOT_ALLOWED
        details:
          type: object
