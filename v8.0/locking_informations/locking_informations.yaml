                        description: Represents the status of the API response.
                    required:
                      - code
                      - details
                      - message
                      - status
                  - type: object
                    x-zs-$id: NotAllowedLockConfigMissing
                    additionalProperties: false
                    description: >-
                      This error occurs when the required record locking
                      configuration is not present.
                    properties:
                      code:
                        type: string
                        enum:
                          - NOT_ALLOWED
                        description: >-
                          Represents the error code indicating the action is not
                          allowed.
                      details:
                        type: object
                        additionalProperties: false
                        description: Represents additional details about the error.
                        properties:
                          resource_path_index:
                            type: integer
                            format: int32
                            description: >-
                              Represents the index of the resource path segment
                              where the error occurred.
                        required:
                          - resource_path_index
                      message:
                        type: string
                        enum:
                          - Required Record Locking Configuration is not present
                        description: >-
                          Represents the error message providing details about
                          the failure.
                      status:
                        type: string
                        enum:
                          - error
                        description: Represents the status of the API response.
                    required:
                      - code
                      - details
                      - message
                      - status
              examples:
                InvalidDataRelationNotFound:
                  summary: Relation not found error
                  value:
                    code: INVALID_DATA
                    details: {}
                    message: relation not found
                    status: error
                InvalidMainModule:
                  summary: Invalid module name error
                  value:
                    code: INVALID_MODULE
                    details:
                      resource_path_index: 0
                    message: the module name given seems to be invalid
                    status: error
                InvalidDataMainRecordId:
                  summary: Invalid record ID error
                  value:
                    code: INVALID_DATA
                    details:
                      resource_path_index: 1
                    message: the related id given seems to be invalid
                    status: error
                NotAllowedLockConfigMissing:
                  summary: Locking configuration missing error
                  value:
                    code: NOT_ALLOWED
                    details:
                      resource_path_index: 2
                    message: Required Record Locking Configuration is not present
                    status: error
    post:
      operationId: lockRecord
      summary: Lock a record
      description: >-
        To lock a record in the specified module of your Zoho CRM account with a
        reason for locking.
      security:
        - OAuth2:
            - ZohoCRM.settings.modules.CREATE
      parameters:
        - $ref: '#/components/parameters/RecordId'
        - $ref: '#/components/parameters/ModuleName'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              description: Specify the request payload for the locking operation.
              properties:
                data:
                  type: array
                  maxItems: 1
                  description: Specify the locking information details for the record.
                  items:
                    additionalProperties: false
                    type: object
                    description: Specify the locking details for the record.
                    properties:
                      Locked_Reason__s:
                        type: string
                        description: Specify the reason for locking the record.
                        maxLength: 3000
                    required:
                      - Locked_Reason__s
              required:
                - data
            examples:
              LockRecord:
                summary: Lock record request with reason
                value:
                  data:
                    - Locked_Reason__s: Locking the record for review
        required: true
      responses:
        '201':
          description: Returns a success response when the record is locked successfully.
          content:
            application/json:
              schema:
                type: object
                x-zs-$id: LockRecordResponse
                additionalProperties: false
                description: Contains the success response for the lock operation.
                properties:
                  data:
                    type: array
                    description: Contains the response details for the lock operation.
                    maxItems: 1
                    items:
                      type: object
                      additionalProperties: false
                      description: >-
                        Represents the result of the lock operation for a
                        record.
                      properties:
                        status:
                          type: string
                          enum:
                            - success
                          description: Represents the status of the lock operation.
                        code:
                          type: string
                          enum:
                            - SUCCESS
                          description: Represents the response code for the lock operation.
                        message:
                          type: string
                          description: >-
                            Represents the response message for the lock
                            operation.
                          maxLength: 255
                        details:
                          oneOf:
                            - type: object
                              x-zs-$id: LockRecordDetailsFull
                              additionalProperties: false
                              description: >-
                                Contains the success response for the lock
                                operation.
                              properties:
                                id:
                                  type: string
                                  description: >-
                                    Represents the unique identifier of the
                                    newly created locking information record.
                                  maxLength: 255
                                Created_Time:
                                  type: string
                                  format: date-time
                                  description: >-
                                    Represents the timestamp of the locking
                                    information record creation.
                                Modified_Time:
                                  type: string
                                  format: date-time
                                  description: >-
                                    Represents the timestamp when the locking
                                    information record was last modified.
                                Modified_By:
                                  type: object
                                  additionalProperties: false
                                  description: >-
                                    Represents the details of the user who last
                                    modified the record.
                                  properties:
                                    name:
                                      type: string
                                      description: >-
                                        Represents the name of the user who last
                                        modified the record.
                                      maxLength: 255
                                    id:
                                      type: string
                                      description: >-
                                        Represents the unique identifier of the
                                        user who last modified the record.
                                      maxLength: 255
                                  required:
                                    - name
                                    - id
                                Created_By:
                                  type: object
                                  additionalProperties: false
                                  description: >-
                                    Represents the details of the user who
                                    created the record.
                                  properties:
                                    name:
                                      type: string
                                      description: >-
                                        Represents the name of the user who
                                        created the record.
                                      maxLength: 255
                                    id:
                                      type: string
                                      description: >-
                                        Represents the unique identifier of the
                                        user who created the record.
                                      maxLength: 255
                                  required:
                                    - name
                                    - id
                              required:
                                - id
                                - Created_Time
                                - Modified_Time
                                - Modified_By
                                - Created_By
                            - type: object
                              x-zs-$id: LockRecordDetailsMinimal
                              additionalProperties: false
                              description: >-
                                Contains the success response for the lock
                                operation.
                              properties:
                                id:
                                  type: string
                                  description: >-
                                    Represents the unique identifier of the
                                    newly created locking information record.
                                  maxLength: 255
                              required:
                                - id
                      required:
                        - status
                        - code
                        - message
                        - details
                required:
                  - data
              examples:
                SuccessCase:
                  summary: Successful record lock
                  value:
                    data:
                      - code: SUCCESS
                        details:
                          Modified_Time: '2021-07-13T18:54:49+05:30'
                          Modified_By:
                            name: priya
                            id: '111111000000047241'
                          Created_Time: '2021-07-13T18:54:49+05:30'
                          id: '111111000000054029'
                          Created_By:
                            name: priya
                            id: '111111000000047241'
                        message: record added
                        status: success
        '400':
          description: >-
            The request contains invalid or missing parameters. **Resolution:**
