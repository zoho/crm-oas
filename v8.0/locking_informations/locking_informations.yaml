                      message:
                        type: string
                        enum:
                          - the module name given seems to be invalid
                        description: >-
                          Represents the error message providing details about
                          the failure.
                      status:
                        type: string
                        enum:
                          - error
                        description: Represents the status of the API response.
                    required:
                      - code
                      - details
                      - message
                      - status
                  - type: object
                    x-zs-$id: InvalidDataMainRecordId
                    additionalProperties: false
                    description: >-
                      This error occurs when the relation ID provided is
                      invalid.
                    properties:
                      code:
                        type: string
                        enum:
                          - INVALID_DATA
                        description: Represents the error code for this response.
                      details:
                        type: object
                        additionalProperties: false
                        description: Represents additional details about the error.
                        properties:
                          resource_path_index:
                            type: integer
                            format: int32
                            description: >-
                              Represents the index of the resource path segment
                              where the error occurred.
                        required:
