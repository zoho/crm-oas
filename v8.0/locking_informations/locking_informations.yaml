openapi: 3.1.0
info:
  title: Locking Information
  description: >-
    Record locking prevents unintended modifications to CRM records by
    restricting edit access. This API lets you lock records, unlock records,
    retrieve locking details, and update the locking reason for locked records
    across different modules.
  version: '8'
servers:
  - url: https://zohoapis.{dc}/crm/{version}
    description: >-
      Production API server for Zoho CRM. Sample request URL:
      `https://zohoapis.{dc}/crm/{version}`
    variables:
      dc:
        enum:
          - com
          - eu
          - in
          - cn
          - au
        default: com
        description: >-
          The top-level domain that determines the data center region. Possible
          values: **com**, **eu**, **in**, **cn**, **au**. Default: **com**.
      version:
        default: v8
        description: 'The API version to use for the request. Default: **v8**.'
paths:
  /{moduleName}/{recordId}/Locking_Information__s:
    get:
      operationId: getRecordLockingInformationOfTheRecord
      summary: Get record locking information
      description: >-
        To retrieve the locking information details of a locked record in your
        Zoho CRM account, including the user who locked the record, the lock
        source, reason, and timestamp.
      security:
        - OAuth2:
            - ZohoCRM.settings.modules.READ
      parameters:
        - $ref: '#/components/parameters/ModuleName'
        - $ref: '#/components/parameters/RecordId'
        - $ref: '#/components/parameters/Fields'
      responses:
        '200':
          description: >-
            Returns the locking information details of the locked record,
            including the user who locked it, the lock source, reason, and
            timestamp.
          content:
            application/json:
              schema:
                type: object
                x-zs-$id: GetRecordLockingInformationOfTheRecordResponse
                additionalProperties: false
                description: >-
                  Contains the locking information details and pagination
                  metadata for the locked record.
                properties:
                  data:
                    type: array
                    maxItems: 1
                    description: >-
                      Contains the locking information details of the locked
                      record.
                    items:
                      type: object
                      additionalProperties: false
                      description: >-
                        Represents the locking information details of a locked
                        record.
                      properties:
                        Locked_By__s:
                          additionalProperties: false
                          description: >-
                            An object containing the details of the user who
                            locked the record. Returns **null** for
                            automatically locked records where no specific user
                            performed the lock.
                          type:
                            - object
                            - 'null'
                          properties:
                            name:
                              type: string
                              description: >-
                                Represents the name of the user who locked the
                                record.
                              maxLength: 255
                            id:
                              type: string
                              description: >-
                                Represents the unique identifier of the user who
                                locked the record.
                              maxLength: 255
                            module:
                              type: string
                              description: >-
                                Represents the module to which the user who
                                locked the record belongs.
                              maxLength: 255
                          required:
                            - name
                            - id
                        Locked_For__s:
                          type: object
                          additionalProperties: false
                          description: Represents the details of the record that is locked.
                          properties:
                            module:
                              type: object
                              additionalProperties: false
                              description: >-
                                Represents the details of the module to which
                                the locked record belongs.
                              properties:
                                api_name:
                                  type: string
                                  description: >-
                                    Represents the API name of the module of the
                                    locked record.
                                  maxLength: 255
                                id:
                                  type: string
                                  description: >-
                                    Represents the unique identifier of the
                                    module of the locked record.
                                  maxLength: 255
                              required:
                                - api_name
                                - id
                            name:
                              type: string
                              description: Represents the name of the locked record.
                              maxLength: 255
                            id:
                              type: string
                              description: >-
                                Represents the unique identifier of the locked
                                record.
                              maxLength: 255
                          required:
                            - module
                            - name
                            - id
                        $field_states:
                          description: >-
                            Represents the field-level lock states of the
                            record. Returns **null** when no field-level locking
                            is applied.
                          anyOf:
                            - type: string
                              maxLength: 255
                              description: >-
                                Contains the locking information details and
                                pagination metadata for the locked record.
                            - type: 'null'
                              description: >-
                                Contains the locking information details and
                                pagination metadata for the locked record.
                        Locked_Reason__s:
                          type:
                            - string
                            - 'null'
                          description: >-
                            Represents the reason for locking the record.
                            Returns **null** for automatically locked records.
                          maxLength: 3000
                        $editable:
                          type: boolean
                          description: >-
                            Indicates whether the locked record is editable by
                            the current user. Possible values: **true** - The
                            record is editable. **false** - The record is not
                            editable.
                        $sharing_permission:
                          type: string
                          description: >-
                            Represents the sharing permission level of the
                            current user on the locked record.
                          maxLength: 10000
                        Lock_Source__s:
                          type: string
                          description: >-
                            Indicates the source of the record lock. Possible
                            values: **Manual** - The record was locked manually
                            by a user. **Automatic** - The record was locked
                            automatically by a rule. **Both** - The record has
                            both manual and automatic locks.
                          maxLength: 255
                          enum:
                            - Manual
                            - Both
                            - Automatic
                        Locked_Time__s:
                          type: string
                          description: Represents the timestamp when the record was locked.
                          format: date-time
                        Record_Locking_Configuration_Id__s:
                          type: string
                          description: >-
                            Represents the unique identifier of the record
                            locking configuration applied to this record.
                          maxLength: 255
                        Record_Locking_Rule_Id__s:
                          type:
                            - string
                            - 'null'
                          description: >-
                            Represents the unique identifier of the record
                            locking rule. Returns **null** for manually locked
                            records.
                          maxLength: 255
                        id:
                          type: string
                          description: >-
                            Represents the unique identifier of the locking
                            information record.
                          maxLength: 255
                        Feature_Type__s:
                          type: string
                          description: >-
                            Represents the feature type associated with the
                            locking information.
                          maxLength: 255
                        $zia_visions:
                          description: >-
                            Represents Zia Visions data associated with the
                            record. Returns **null** when Zia Visions data is
                            not available.
                          anyOf:
                            - type: string
                              maxLength: 255
                              description: Contains the Zia Visions related information.
                            - type: 'null'
                              description: Null when Zia Visions data is not available.
                      required:
                        - id
                  info:
                    type: object
                    additionalProperties: false
                    description: An object containing the pagination details.
                    properties:
                      per_page:
                        type: integer
                        format: int32
                        description: Represents the number of records displayed per page.
                      count:
                        type: integer
                        format: int32
                        description: >-
                          Represents the total number of locking information
                          records returned in the response.
                      page:
                        type: integer
                        format: int32
                        description: Represents the current page number of the response.
                      more_records:
                        type: boolean
                        description: >-
                          Indicates whether more locking information records are
                          available beyond the current page. Possible values:
                          **true** - More records are available. **false** - No
                          more records are available.
                      next_page_token:
                        type:
                          - string
                          - 'null'
                        description: >-
                          Represents the token used to fetch the next page of
                          records. Returns **null** when token-based pagination
                          is not in use or no next page exists.
                        maxLength: 255
                      previous_page_token:
                        type:
                          - string
                          - 'null'
                        description: >-
                          Represents the token used to fetch the previous page
                          of records. Returns **null** when token-based
                          pagination is not in use or no previous page exists.
                        maxLength: 255
                      page_token_expiry:
                        type:
                          - string
                          - 'null'
                        description: >-
                          Represents the expiry timestamp of the page token.
                          Returns **null** when token-based pagination is not in
                          use.
                        maxLength: 255
                    required:
                      - per_page
                      - count
                      - page
                      - more_records
                required:
                  - data
                  - info
              examples:
                SuccessCase:
                  summary: Successful retrieval - manually locked record
                  value:
                    data:
                      - Locked_By__s:
                          name: priya v
                          id: '111111000000047487'
                        $field_states: null
                        Record_Locking_Rule_Id__s: null
                        Locked_For__s:
                          module:
                            api_name: Deals
                            id: '111111000000000048'
                          name: locked
                          id: '111111000000053560'
                        Locked_Reason__s: fff
                        Record_Locking_Configuration_Id__s: '111111000000053641'
                        $editable: true
                        id: '111111000000054020'
                        $sharing_permission: full_access
                        Lock_Source__s: Manual
                        Locked_Time__s: '2021-07-21T18:08:12+05:30'
                        Feature_Type__s: record_locking
                        $zia_visions: null
                    info:
                      per_page: 200
                      count: 1
                      page: 1
                      more_records: false
                AutomaticLockCase:
                  summary: >-
                    Successful retrieval - automatically locked record (locked
                    by a record locking rule)
                  value:
                    data:
                      - Locked_By__s: null
                        $field_states: null
                        Record_Locking_Rule_Id__s: '111111000000054290'
                        Locked_For__s:
                          module:
                            api_name: Deals
                            id: '111111000000000048'
                          name: locked
                          id: '111111000000053560'
                        Locked_Reason__s: null
                        Record_Locking_Configuration_Id__s: '111111000000053641'
                        $editable: false
                        id: '111111000000054022'
                        $sharing_permission: read_only
                        Lock_Source__s: Automatic
                        Locked_Time__s: '2021-07-21T18:08:12+05:30'
                        Feature_Type__s: record_locking
                        $zia_visions: null
                    info:
                      per_page: 200
                      count: 1
                      page: 1
                      more_records: false
        '204':
          description: >-
            The record does not have any active locks from the record locking
            configuration.
        '400':
          description: >-
            The request contains invalid or missing parameters. **Resolution:**
            Verify that the module name, record ID, and field names in the
            request are valid.
          content:
            application/json:
              schema:
