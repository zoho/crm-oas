      schema:
        type: string
        maxLength: 32
    ModuleName:
      name: moduleName
      description: >-
        The API name of the module to which the locked record belongs. Use the
        [Get Modules API](modules.yaml#$.paths./settings/modules.get) to
        retrieve module ID and API name.
      in: path
      required: true
      schema:
        type: string
        maxLength: 256
    LockId:
      name: lockId
      description: >-
        Specify the unique identifier of the lock record to be removed or
        updated.
      in: path
      required: true
      schema:
        type: string
        maxLength: 32
    Fields:
      name: fields
      in: query
      required: false
      description: >-
        Specify the field API names to include in the response. Accepts
        comma-separated values. Use the [Get Fields Metadata
        API](fields.yaml#$.paths./settings/fields.get) to retrieve the field
        IDs.
      schema:
        type: string
        maxLength: 2048
