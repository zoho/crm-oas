                      - message
                      - status
                  - type: object
                    x-zs-$id: InvalidModuleError
                    additionalProperties: false
                    description: >-
                      This error occurs when the module name provided is
                      invalid.
                    properties:
                      code:
                        type: string
                        enum:
                          - INVALID_MODULE
                        description: Represents the error code for this response.
                      details:
                        type: object
                        description: Represents additional details about the error.
                        additionalProperties: false
                        properties:
                          resource_path_index:
                            type: integer
                            format: int32
                            description: >-
                              Represents the index of the resource path segment
                              where the error occurred.
                        required:
