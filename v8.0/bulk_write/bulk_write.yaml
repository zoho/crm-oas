                        enum:
                          - INVALID_CALLBACK_URL
                      details:
                        type: object
                        description: >-
                          Provides additional context about the failure, when
                          available.
                        additionalProperties: true
                      message:
                        type: string
                        description: >-
                          Represents the error message returned for the failure,
