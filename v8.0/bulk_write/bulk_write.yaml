                description: >-
                  Represents the validation error envelope returned for a failed
                  bulk write job creation. Resolves to one of the documented
                  error variants based on the failure cause.
              examples:
                InvalidCallbackUrlError:
                  value:
                    code: INVALID_CALLBACK_URL
                    details: {}
                    message: Invalid callback URL provided
                    status: error
                  description: >-
                    Demonstrates the error response returned when the supplied
                    callback URL fails validation.
                  summary: INVALID_CALLBACK_URL error for an unreachable callback
      security:
        - OAuth2:
            - ZohoCRM.bulk.CREATE
  /write/{jobId}:
    get:
      summary: Get bulk write job details
      description: >-
        To retrieve the details of a previously created bulk write job in your
        Zoho CRM organization, including its current status, per-resource and
        per-file processing counts, the creator, and the download URL of the
        result archive once the job completes. The download URL remains
        accessible for up to seven days after the job completes.
      operationId: getBulkWriteJobDetails
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: >-
            Returns the full state and processing result of the bulk write job
            identified by the supplied **jobId**, including the per-resource and
            per-file counts and the download URL of the result archive.
          content:
            application/json:
              schema:
                type: object
                description: >-
                  Represents the full state and processing result of a bulk
                  write job, including the overall status, the per-resource
                  processing summary, the job creator, and the download URL of
                  the result archive.
