openapi: 3.1.0
info:
  title: Bulk Write
  description: >-
    This API enables developers to insert, update, or upsert large volumes of
    records in a Zoho CRM module by submitting an asynchronous bulk write job
    that processes a previously uploaded CSV file. It also exposes the job
    details endpoint for polling the processing status and retrieving the result
    archive once the job completes.
  version: '8'
servers:
  - url: https://zohoapis.{dc}/crm/bulk/{version}
    description: Production server for the Zoho CRM Bulk Write API.
    variables:
      dc:
        description: >-
          Specify the Zoho data center suffix that hosts the organization, such
          as **com**, **eu**, **in**, **au**, **jp**, **ca**, or **sa**.
        default: com
        enum:
          - eu
          - com
          - au
          - in
          - jp
          - cn
          - ca
      version:
        description: |-
          Specify the API version segment for the request.
          Possible values:
          v8 - Use Bulk Write API version 8.
        default: v8
paths:
  /write:
    post:
      summary: Create a bulk write job
      description: >-
        To create a bulk write job in your Zoho CRM organization that creates,
        updates, or upserts records in a target module from a previously
        uploaded file. The job is processed asynchronously; the response returns
        the job identifier that the get job details operation uses to poll job
        status, and an optional callback URL is notified on completion or
        failure.
      operationId: createBulkWriteJob
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: >-
                Defines the payload for creating a bulk write job, including the
                operation type, optional callback configuration, and the list of
                resource configurations.
              additionalProperties: false
              properties:
                character_encoding:
                  type:
                    - string
                    - 'null'
                  description: >-
                    Specify the character encoding of the uploaded file. Zoho
                    CRM auto-detects the encoding when this value is omitted;
                    supply a value to override auto-detection and force the file
                    to be read with the specified charset.
                  maxLength: 50
                operation:
                  type: string
                  description: >-
                    Specify the type of bulk write operation to perform on the
                    file.

                    Possible values:

                    insert - Creates the records from the file as new records in
                    the target module.

                    update - Updates existing records in the target module
                    without creating new ones.

                    upsert - Updates existing records and creates new records
                    that do not exist already.
                  enum:
                    - insert
                    - update
                    - upsert
                callback:
                  type: object
                  description: >-
                    Specify the callback configuration that Zoho CRM uses to
                    notify your endpoint when the bulk write job completes or
                    fails.
                  additionalProperties: false
                  properties:
                    url:
                      type: string
                      description: >-
                        Specify the URL that receives the job completion
                        notification. The URL must accept the HTTP POST method
                        and be reachable from Zoho CRM servers.
                      format: uri
                    method:
                      type: string
                      description: >-
                        Specify the HTTP method that Zoho CRM uses to invoke the
                        callback URL.

                        Possible values:

                        post - Sends the job completion notification as an HTTP
                        POST request.
                      enum:
                        - post
                  required:
                    - url
                    - method
                resource:
                  type: array
                  description: >-
                    Specify the list of resource configurations to process in
                    the bulk write job. Each entry describes the target module,
                    the uploaded file to read, and the field mappings to apply.
                  maxItems: 100
                  items:
                    type: object
                    description: >-
                      Specify the configuration for a single bulk write
                      resource, including the target module, the uploaded file
                      ID, the matching key, and the field mappings to apply when
                      the job runs.
                    additionalProperties: false
                    properties:
                      type:
                        type: string
                        description: >-
                          Specify the type of the resource being imported.

                          Possible values:

                          data - Indicates that the resource contains record
                          data to be written into the target module.
                        enum:
                          - data
                      file_names:
                        type: array
                        description: >-
                          Specify the names of the files inside the uploaded
                          archive that the bulk write job must process.
                        maxItems: 10
                        items:
                          type: string
                          description: >-
                            Represents the name of a single file inside the
                            uploaded archive that the bulk write job processes.
                          maxLength: 255
                      module:
                        type: object
                        description: >-
                          Specify the target CRM module into which the records
                          from the uploaded file are written.
                        additionalProperties: false
                        properties:
                          api_name:
                            type: string
                            description: >-
                              Specify the API name of the target CRM module into
                              which records are imported. Refer to the [Get
                              Modules](modules.yaml#$.paths./settings/modules.get)
                              resource for valid values.
                            maxLength: 100
                        required:
                          - api_name
                      file_id:
                        type: string
                        description: >-
                          Specify the identifier of the previously uploaded file
                          that the bulk write job must read. Obtain this value
                          from the response of the bulk upload file API.
                        maxLength: 100
                      ignore_empty:
                        type: boolean
                        description: >-
                          Specify whether to skip empty cells in the uploaded
                          file when updating records.

                          Possible values:

                          true - Ignores empty values in a column and updates
                          only the fields that carry a non-empty value.

                          false - Updates the target field with the empty value
                          supplied in the file.
                      find_by:
                        type: string
                        description: >-
                          Specify the field that the bulk write job uses to
                          locate existing records when performing an update or
                          upsert operation.

                          Possible values:

                          id - Matches records by their unique record ID in the
                          target module.
                        enum:
                          - id
                      field_mappings:
                        type: array
                        description: >-
                          Specify the mapping between columns in the uploaded
                          file and fields on the target module. When omitted,
                          Zoho CRM auto-maps columns to fields whose API names
                          match the CSV header.
                        maxItems: 500
                        items:
                          type: object
                          description: >-
                            Specify the mapping between a single column in the
                            uploaded file and a field on the target module.
                          additionalProperties: false
                          properties:
                            api_name:
                              type: string
                              description: >-
                                Specify the API name of the field on the target
                                module to populate with the column value. Refer
                                to the [Fields
                                API](fields.yaml#$.paths./settings/fields.get)
                                resource for valid values.
                              maxLength: 100
                            index:
                              type: integer
                              format: int32
                              description: >-
                                Specify the zero-based column index in the
                                uploaded file whose value populates the mapped
                                field.
                          required:
                            - api_name
                            - index
                    required:
                      - type
                      - file_names
                      - module
                      - file_id
                      - find_by
              required:
                - operation
                - resource
            examples:
              BulkWriteRequest:
                value:
                  operation: insert
                  callback:
                    url: http://requestbin.fullcontact.com/1fcimk51
                    method: post
                  resource:
                    - type: data
                      file_names:
                        - data.csv
                      module:
                        api_name: Contacts
                      file_id: '3524001000005697001'
                      find_by: id
                      field_mappings:
                        - api_name: Last_Name
                          index: 0
                description: >-
                  Shows a bulk write request that creates records in the
                  Contacts module from a previously uploaded file, with one
                  field mapping and a callback URL.
                summary: Bulk write request with one resource and one field mapping
        required: true
        description: >-
          The request body must contain a resource array. You can include a
          maximum of 100 objects per request.
      responses:
        '201':
          description: >-
            Returns the details of the bulk write job that was scheduled,
            including its unique identifier and the user who created it.
          content:
            application/json:
              schema:
                type: object
                description: >-
                  Represents the success envelope that Zoho CRM returns after
                  scheduling a bulk write job. Contains the overall status,
                  response code, message, and the details of the newly scheduled
                  job.
                x-zs-$id: BulkWriteCreateResponse
                additionalProperties: false
                properties:
                  status:
                    type: string
                    description: >-
                      Represents the overall status of the bulk write job
                      creation request. 

                      Possible values:

                      success - Indicates that Zoho CRM scheduled the bulk write
                      job successfully.
                    enum:
                      - success
                  code:
                    type: string
                    description: >-
                      Represents the response code returned for the bulk write
                      job creation. 

                      Possible values:

                      **SUCCESS** - Indicates that the bulk write job was
                      scheduled successfully.

                      **FILE_UPLOAD_SUCCESS** - Indicates that the file
                      associated with the job was uploaded successfully.
                    enum:
                      - SUCCESS
                      - FILE_UPLOAD_SUCCESS
                  message:
                    type: string
                    description: >-
                      Represents the response message for the bulk write job
                      creation. 

                      Possible values:

                      **success** - Confirms that Zoho CRM scheduled the bulk
                      write job.

                      **file uploaded** - Confirms that Zoho CRM accepted the
                      uploaded file for the job.
                    enum:
                      - success
                      - file uploaded.
                  details:
                    type: object
                    description: >-
                      Represents the details of the newly scheduled bulk write
                      job. 
                    additionalProperties: false
                    properties:
                      id:
                        type: string
                        description: >-
                          Represents the unique identifier of the newly
                          scheduled bulk write job. Use this value to query the
                          job status through the get job details operation. 
                        maxLength: 100
                      created_by:
                        type: object
                        description: >-
                          Represents the Zoho CRM user who created the bulk
                          write job. 
                        additionalProperties: false
                        properties:
                          id:
                            type: string
                            description: >-
                              Represents the unique identifier of the Zoho CRM
                              user who created the bulk write job. Refer to the
                              [Users API](users.yaml#$.paths./users.get)
                              endpoint for details. 
                            maxLength: 100
                          name:
                            type: string
                            description: >-
                              Represents the display name of the Zoho CRM user
                              who created the bulk write job. Refer to the
                              [Users API](users.yaml#$.paths./users.get)
                              endpoint for details.
                            maxLength: 100
                        required:
                          - id
                    required:
                      - id
                      - created_by
                required:
                  - status
                  - code
                  - message
                  - details
              examples:
                SuccessResponse:
                  value:
                    status: success
                    code: SUCCESS
                    message: success
                    details:
                      id: '3524001000005697001'
                      created_by:
                        id: '3524001000000186003'
                  description: >-
                    Returns the unique identifier of the scheduled bulk write
                    job and the ID of the creating user.
                  summary: Successful bulk write job creation
        '400':
          description: >-
            The request payload failed validation. Resolution: The cause is
            identified by the **code** in the response. The offending field,
            mapping, callback configuration, or file reference must be corrected
            before retrying the request.
          content:
            application/json:
              schema:
                x-zs-$id: BulkWriteCreateErrorResponses
                oneOf:
                  - type: object
                    description: >-
                      Represents the error variant returned when the callback
