openapi: 3.1.0
info:
  title: Cadence Execution
  description: >-
    Cadence execution operations allow Zoho CRM users to manually enroll or
    unenroll module records in automated follow-up sequences called Cadences.
    This API enables developers to enroll and unenroll records in Cadences for
    supported modules, returning per-record success or error statuses in the
    response.
  version: '8'
servers:
  - url: https://zohoapis.{dc}/crm/{version}
    description: >-
      Production API server for Zoho CRM. Sample request URL:
      `https://zohoapis.{dc}/crm/{version}`
    variables:
      dc:
        description: >-
          The top-level domain of the Zoho CRM API server. Possible values:
          **eu**, **com**, **au**, **in**, **jp**, **cn**, **ca**. Default:
          **com**.
        default: com
        enum:
          - eu
          - com
          - au
          - in
          - jp
          - cn
          - ca
      version:
        description: 'The API version for the request. Default: **v8**.'
        default: v8
paths:
  /{module}/actions/enrol_in_cadences:
    post:
      summary: Enroll Records to Cadences
      description: |-
        Enrolls CRM records into one or more cadences.
        **Notes**
        - Only Manual Enrollment cadences can be enrolled through this API.
        - Available only in Enterprise edition and above.
        - Supports Leads, Contacts, Deals, Vendors, and custom modules.
        - A request may contain up to 5 cadence IDs.
        - A request may contain up to 100 record IDs.
      x-zs-llm-description: >-
        Enrolls the given records into the given manual_enrollment cadences. v8
        takes a flat cadences_ids array (by id) and an ids array of record ids.
        Returns 200 when processed synchronously, 202 when accepted for
        asynchronous processing, or 207 Multi-Status for mixed per-record
        outcomes.
      x-zs-llm-examples:
        - SamplePostRequest
      operationId: postEnrolInCadences
      security:
        - OAuth2:
            - ZohoCRM.modules.Leads.CREATE
        - OAuth2:
            - ZohoCRM.modules.Contacts.CREATE
        - OAuth2:
            - ZohoCRM.modules.Accounts.CREATE
        - OAuth2:
            - ZohoCRM.modules.Deals.CREATE
        - OAuth2:
            - ZohoCRM.modules.Vendors.CREATE
        - OAuth2:
            - ZohoCRM.modules.Quotes.CREATE
        - OAuth2:
            - ZohoCRM.modules.custom.CREATE
      parameters:
        - $ref: '#/components/parameters/Module'
      requestBody:
        description: >-
          The request body must contain a Cadence IDs array and a record IDs
          array for the enrollment request.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostCadencesRequest'
            examples:
              SamplePostRequest:
                summary: Sample enroll records request
                value:
                  cadences_ids:
                    - '534412000002201155'
                    - '534412000002201156'
                  ids:
                    - '1234567890234567'
                    - '1234567890456789'
                    - '2345678902345678'
                description: >-
                  Shows a sample request with Cadence IDs and record IDs for
                  enrollment into Cadences.
      responses:
        '200':
          description: Returns the enrollment result for all records in the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostcadencesResponse200'
              examples:
                Success200:
                  summary: Successful enrollment result
                  value:
                    data:
                      - code: SUCCESS
                        details:
                          id: '534412000002201155'
                          cadences:
                            - name: Cadence 1
                              id: '1234567890456789'
                            - name: Cadence 2
                              id: '1234567890456789'
                        message: records manually enrolled
                        status: success
                  description: >-
                    Shows the successful enrollment result for a record,
                    including the record ID and the associated Cadences.
        '202':
          description: >-
            The enrollment request was accepted and queued for background
            processing. The response body contains a SCHEDULED status marker.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostcadencesResponse202'
              examples:
                Success202:
                  summary: Enrollment request accepted for background processing
                  value:
                    data:
                      - code: SCHEDULED
                        details: {}
                        message: Cadence manual enrolment is in progress.
                        status: success
                  description: None
        '207':
          description: >-
            Returns a multi-status response when some records were enrolled
            successfully and others failed. Each item in the data array
            independently indicates success or failure for the corresponding
            record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostcadencesResponse207'
              examples:
                Success207:
                  summary: Multi-status response with partial enrollment success
                  value:
                    data:
                      - code: SUCCESS
                        details:
                          id: '534412000002201155'
                          cadences:
                            - name: Cadence 1
                              id: '1234567890456789'
                            - name: Cadence 2
                              id: '1234567890456789'
                        message: records manually enrolled
                        status: success
                      - code: INVALID_DATA
                        details:
                          api_name: ids
                          json_path: $.ids[1]
                        message: given id seems to be invalid
                        status: error
                  description: >-
                    Shows a multi-status response with one successful and one
                    failed per-record enrollment result.
        '400':
          description: >-
            The request could not be processed due to invalid or unsupported
            input.

            **Resolution:** The record IDs and Cadence IDs must be valid, the
            API must be accessed from a supported domain, and the specified
            Cadences must support manual enrollment.
          content:
            application/json:
              schema:
                x-zs-$id: EnrolCadences400Schema
                oneOf:
                  - $ref: >-
                      #/components/schemas/ErrorResponseApiNotSupportedClientPortal
                  - $ref: '#/components/schemas/ErrorResponseApiNotSupportedDomain'
                  - $ref: '#/components/schemas/ErrorResponseLimitExceededCadenceIds'
                  - $ref: '#/components/schemas/ErrorResponseLimitExceededRecordIds'
                  - $ref: '#/components/schemas/ErrorResponseNotAllowed'
                  - $ref: '#/components/schemas/ErrorResponseInvalidDataCadenceIds'
                  - $ref: '#/components/schemas/ErrorResponseMandatoryNotFound'
                  - $ref: '#/components/schemas/ErrorResponseDataInvalidDataType'
                  - $ref: '#/components/schemas/ErrorResponseDataInvalidId'
                  - $ref: '#/components/schemas/ErrorResponseDataInvalidIdArray'
                description: >-
                  Represents one of the possible error responses for a 400 Bad
                  Request status, indicating an invalid or unsupported request
                  parameter.
              examples:
                ApiNotSupportedResponse1:
                  summary: API_NOT_SUPPORTED error for client portal users
                  value:
                    code: API_NOT_SUPPORTED
                    details:
                      unsupported_login_user_type: Client Portal User
                    message: api not supported for client portal user
                    status: error
                  description: >-
                    Shows the API_NOT_SUPPORTED error returned when a client
                    portal user attempts to call this API.
                ApiNotSupportedResponse2:
                  summary: API_NOT_SUPPORTED error for unsupported domain
                  value:
                    code: API_NOT_SUPPORTED
                    details:
                      supported_domains:
                        - eu
                        - com
                        - in
                        - au
                        - ca
                        - cn
                        - jp
                    message: api not supported
                    status: error
                  description: >-
                    Shows the API_NOT_SUPPORTED error returned when the API is
                    accessed from an unsupported domain.
                LimitExceededResponse1:
                  summary: LIMIT_EXCEEDED error - Cadence ID array exceeds the limit
                  value:
                    code: LIMIT_EXCEEDED
                    details:
                      limit: 5
                      limit_due_to:
                        - api_name: cadences_ids
                          json_path: $.cadences_ids
                    message: Limit Exceeded, You cannot give more than 5 cadences ids
                    status: error
                  description: >-
                    Shows the LIMIT_EXCEEDED error returned when more than five
                    Cadence IDs are included in the request.
                LimitExceededResponse2:
                  summary: LIMIT_EXCEEDED error for ids exceeding 100
                  value:
                    code: LIMIT_EXCEEDED
                    details:
                      limit: 100
                      limit_due_to:
                        - api_name: ids
                          json_path: $.ids
                    message: Limit Exceeded, You cannot give more than 100 record ids
                    status: error
                  description: >-
                    Shows the LIMIT_EXCEEDED error returned when more than 100
                    record IDs are included in the request.
                NotAllowedResponse1:
                  summary: NOT_ALLOWED error for non-manual Cadence ID
                  value:
                    code: NOT_ALLOWED
                    details:
                      api_name: cadences_id
                      json_path: $.cadences_id[0]
                    message: id given is not manual enrollment cadence
                    status: error
                  description: >-
                    Shows the NOT_ALLOWED error returned when a Cadence ID in
                    the request does not correspond to a manual enrollment
                    Cadence.
                InvalidDataResponse1:
                  summary: INVALID_DATA error - invalid entry in Cadence ID array
                  value:
                    code: INVALID_DATA
                    details:
                      maximum_length: 5
                      api_name: cadences_ids
                      json_path: $.cadences_ids
                    message: invalid data
                    status: error
                  description: >-
                    Shows the INVALID_DATA error returned when an entry in the
                    Cadence ID array is invalid, such as exceeding the maximum
                    string length.
                MandatoryNotFoundResponse1:
                  summary: Error response - record IDs not provided
                  value:
                    code: MANDATORY_NOT_FOUND
                    details:
                      api_name: ids
                      json_path: $.ids
                    message: Record ids not found
                    status: error
                  description: None
                MandatoryNotFoundResponse2:
                  summary: Error response - Cadence IDs not provided
                  value:
                    code: MANDATORY_NOT_FOUND
                    details:
                      api_name: cadences_ids
                      json_path: $.cadences_ids
                    message: Cadences ids not found
                    status: error
                  description: None
                InvalidDataResponse2:
                  summary: Error response - record IDs expected as an array
                  value:
                    code: INVALID_DATA
                    details:
                      expected_data_type: jsonarray
                      api_name: ids
                      json_path: $.ids
                    message: Record ids not found
                    status: error
                  description: None
                InvalidDataResponse3:
                  summary: Error response - Cadence IDs expected as an array
                  value:
                    code: INVALID_DATA
                    details:
                      expected_data_type: jsonarray
                      api_name: cadences_ids
                      json_path: $.cadences_ids
                    message: Cadences ids not found
                    status: error
                  description: None
                InvalidDataResponse4:
                  summary: Error response - invalid Cadence ID provided
                  value:
                    code: INVALID_DATA
                    details:
                      api_name: cadences_ids
                      json_path: $.cadences_ids
                    message: the given id seems to be invalid
                    status: error
                  description: None
                InvalidDataResponse5:
                  summary: Error response - invalid record ID provided
                  value:
                    code: INVALID_DATA
                    details:
                      api_name: ids
                      json_path: $.ids
                    message: the given id seems to be invalid
                    status: error
                  description: None
        '403':
          description: >-
            The requesting user does not have the required permission to perform
            Cadence enrollment.

            **Resolution:** The CRM administrator must grant the
            **Crm_Implied_Manage_UnEnroll_Series** permission to the user's
            profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse403'
                description: >-
                  Represents the error response for a 403 Forbidden status,
                  indicating insufficient permissions to perform the enrollment
                  operation.
              examples:
                NoPermissionResponse1:
                  summary: NO_PERMISSION error for missing profile permission
                  value:
                    code: NO_PERMISSION
                    details:
                      permissions:
                        - Crm_Implied_Manage_UnEnroll_Series
                    message: No permission
                    status: error
                  description: >-
                    Shows the NO_PERMISSION error returned when the requesting
                    user's CRM profile lacks the
                    Crm_Implied_Manage_UnEnroll_Series permission.
  /{module}/actions/unenrol_from_cadences:
    post:
      summary: Un-enroll Records from Cadences
      description: >-
        To manually unenroll records of a supported module from one or more
        Cadences in your Zoho CRM organization.
      x-zs-llm-description: >-
        Removes the given records from the given cadences. Updates
        CRMENTITYSERIES (Member_Status=Un-enrolled,
        Series_Status=Stopped/Completed/Failed, UNENROLLED_DATE=now), deletes
        any scheduled future follow-up actions for the affected records
        (CRMTRIGGERENTITYREL) and pending scheduled enrollments
        (CRMWFRULEENTITYREL).
      x-zs-llm-examples:
        - SamplePostRequest
      operationId: postUnenrolFromCadences
      security:
        - OAuth2:
            - ZohoCRM.modules.Leads.CREATE
        - OAuth2:
            - ZohoCRM.modules.Contacts.CREATE
        - OAuth2:
            - ZohoCRM.modules.Accounts.CREATE
        - OAuth2:
            - ZohoCRM.modules.Deals.CREATE
        - OAuth2:
            - ZohoCRM.modules.Vendors.CREATE
        - OAuth2:
            - ZohoCRM.modules.Quotes.CREATE
        - OAuth2:
            - ZohoCRM.modules.custom.CREATE
      parameters:
        - $ref: '#/components/parameters/Module'
      requestBody:
        description: >-
          The request body must contain a Cadence IDs array and a record IDs
          array for the unenrollment request.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostCadencesRequest'
            examples:
              SamplePostRequest:
                summary: Sample unenroll records request
                value:
                  cadences_ids:
                    - '534412000002201155'
                    - '534412000002201156'
                  ids:
                    - '1234567890234567'
                    - '1234567890456789'
                    - '2345678902345678'
                description: >-
                  Shows a sample request with Cadence IDs and record IDs for
                  un-enrollment from Cadences.
      responses:
        '200':
          description: Returns the un-enrollment result for all records in the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostcadencesResponse200'
              examples:
                Success200:
                  summary: Successful un-enrollment result
                  value:
                    data:
                      - code: SUCCESS
                        details:
                          id: '534412000002201155'
                          cadences:
                            - name: Cadence 1
                              id: '1234567890456789'
                            - name: Cadence 2
                              id: '1234567890456789'
                        message: records manually unenrolled
                        status: success
                  description: >-
                    Shows the successful un-enrollment result for a record,
                    including the record ID and the associated Cadences.
        '207':
          description: >-
            Returns a multi-status response when some records were unenrolled
            successfully and others failed. Each item in the data array
            independently indicates success or failure for the corresponding
            record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostcadencesResponse207'
              examples:
                Success207:
                  summary: Multi-status response with partial un-enrollment success
                  value:
                    data:
                      - code: SUCCESS
                        details:
                          id: '534412000002201155'
                          cadences:
                            - name: Cadence 1
                              id: '1234567890456789'
                            - name: Cadence 2
                              id: '1234567890456789'
                        message: records manually unenrolled
                        status: success
                      - code: INVALID_DATA
                        details:
                          api_name: ids
                          json_path: $.ids[1]
                        message: given id seems to be invalid
                        status: error
                  description: >-
                    Shows a multi-status response with one successful and one
                    failed per-record un-enrollment result.
        '400':
          description: >-
            The request could not be processed due to invalid or unsupported
            input.

            **Resolution:** The record IDs and Cadence IDs must be valid, the
            API must be accessed from a supported domain, and the specified
            Cadences must support manual enrollment.
          content:
            application/json:
              schema:
                x-zs-$id: UnenrolCadences400Schema
                oneOf:
                  - $ref: >-
                      #/components/schemas/ErrorResponseApiNotSupportedClientPortal
                  - $ref: '#/components/schemas/ErrorResponseApiNotSupportedDomain'
                  - $ref: '#/components/schemas/ErrorResponseLimitExceededCadenceIds'
                  - $ref: '#/components/schemas/ErrorResponseLimitExceededRecordIds'
                  - $ref: '#/components/schemas/ErrorResponseNotAllowed'
                  - $ref: '#/components/schemas/ErrorResponseInvalidDataCadenceIds'
                  - $ref: '#/components/schemas/ErrorResponseMandatoryNotFound'
                  - $ref: '#/components/schemas/ErrorResponseDataInvalidDataType'
                  - $ref: '#/components/schemas/ErrorResponseDataInvalidId'
                  - $ref: '#/components/schemas/ErrorResponseDataInvalidIdArray'
                description: >-
                  Represents one of the possible error responses for a 400 Bad
                  Request status, indicating an invalid or unsupported request
                  parameter.
              examples:
                ApiNotSupportedResponse1:
                  summary: API_NOT_SUPPORTED error for client portal users
                  value:
                    code: API_NOT_SUPPORTED
                    details:
                      unsupported_login_user_type: Client Portal User
                    message: api not supported for client portal user
                    status: error
                  description: >-
                    Shows the API_NOT_SUPPORTED error returned when a client
                    portal user attempts to call this API.
                ApiNotSupportedResponse2:
                  summary: API_NOT_SUPPORTED error for unsupported domain
                  value:
                    code: API_NOT_SUPPORTED
                    details:
                      supported_domains:
                        - eu
                        - com
                        - in
                        - au
                        - ca
                        - cn
                        - jp
                    message: api not supported
                    status: error
                  description: >-
                    Shows the API_NOT_SUPPORTED error returned when the API is
                    accessed from an unsupported domain.
                LimitExceededResponse1:
                  summary: LIMIT_EXCEEDED error - Cadence ID array exceeds the limit
                  value:
                    code: LIMIT_EXCEEDED
                    details:
                      limit: 5
                      limit_due_to:
                        - api_name: cadences_ids
                          json_path: $.cadences_ids
                    message: Limit Exceeded, You cannot give more than 5 cadences ids
                    status: error
                  description: >-
                    Shows the LIMIT_EXCEEDED error returned when more than five
                    Cadence IDs are included in the request.
                LimitExceededResponse2:
                  summary: LIMIT_EXCEEDED error for ids exceeding 100
                  value:
                    code: LIMIT_EXCEEDED
                    details:
                      limit: 100
                      limit_due_to:
                        - api_name: ids
                          json_path: $.ids
                    message: Limit Exceeded, You cannot give more than 100 record ids
                    status: error
                  description: >-
                    Shows the LIMIT_EXCEEDED error returned when more than 100
                    record IDs are included in the request.
                NotAllowedResponse1:
                  summary: NOT_ALLOWED error for non-manual Cadence ID
                  value:
                    code: NOT_ALLOWED
                    details:
                      api_name: cadences_id
                      json_path: $.cadences_id[0]
                    message: id given is not manual enrollment cadence
                    status: error
                  description: >-
                    Shows the NOT_ALLOWED error returned when a Cadence ID in
                    the request does not correspond to a manual enrollment
                    Cadence.
                InvalidDataResponse1:
                  summary: INVALID_DATA error - invalid entry in Cadence ID array
                  value:
                    code: INVALID_DATA
                    details:
                      maximum_length: 5
                      api_name: cadences_ids
                      json_path: $.cadences_ids
                    message: invalid data
                    status: error
                  description: >-
                    Shows the INVALID_DATA error returned when an entry in the
                    Cadence ID array is invalid, such as exceeding the maximum
                    string length.
                MandatoryNotFoundResponse1:
                  summary: Error response - record IDs not provided
                  value:
                    code: MANDATORY_NOT_FOUND
                    details:
                      api_name: ids
                      json_path: $.ids
                    message: Record ids not found
                    status: error
                  description: None
                MandatoryNotFoundResponse2:
                  summary: Error response - Cadence IDs not provided
                  value:
                    code: MANDATORY_NOT_FOUND
                    details:
                      api_name: cadences_ids
                      json_path: $.cadences_ids
                    message: Cadences ids not found
                    status: error
                  description: None
                InvalidDataResponse2:
                  summary: Error response - record IDs expected as an array
                  value:
                    code: INVALID_DATA
                    details:
                      expected_data_type: jsonarray
                      api_name: ids
                      json_path: $.ids
                    message: Record ids not found
                    status: error
                  description: None
                InvalidDataResponse3:
                  summary: Error response - Cadence IDs expected as an array
                  value:
                    code: INVALID_DATA
                    details:
                      expected_data_type: jsonarray
                      api_name: cadences_ids
                      json_path: $.cadences_ids
                    message: Cadences ids not found
                    status: error
                  description: None
                InvalidDataResponse4:
                  summary: Error response - invalid Cadence ID provided
                  value:
                    code: INVALID_DATA
                    details:
                      api_name: cadences_ids
                      json_path: $.cadences_ids
                    message: the given id seems to be invalid
                    status: error
                  description: None
                InvalidDataResponse5:
                  summary: Error response - invalid record ID provided
                  value:
                    code: INVALID_DATA
                    details:
                      api_name: ids
                      json_path: $.ids
                    message: the given id seems to be invalid
                    status: error
                  description: None
                InvalidDataResponseArray:
                  summary: Error response - multiple invalid record IDs
                  value:
                    data:
                      - code: INVALID_DATA
                        details:
                          api_name: ids
                          json_path: $.ids[0]
                        message: given id seems to be invalid
                        status: error
                      - code: INVALID_DATA
                        details:
                          api_name: ids
                          json_path: $.ids[1]
                        message: given id seems to be invalid
                        status: error
                  description: None
        '403':
          description: >-
            The requesting user does not have the required permission to perform
            Cadence un-enrollment.

            **Resolution:** The CRM administrator must grant the
            **Crm_Implied_Manage_UnEnroll_Series** permission to the user's
            profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse403'
                description: >-
                  Represents the error response for a 403 Forbidden status,
                  indicating insufficient permissions to perform the
                  un-enrollment operation.
              examples:
                NoPermissionResponse1:
                  summary: NO_PERMISSION error for missing profile permission
                  value:
                    code: NO_PERMISSION
                    details:
                      permissions:
                        - Crm_Implied_Manage_UnEnroll_Series
                    message: No permission
                    status: error
                  description: >-
                    Shows the NO_PERMISSION error returned when the requesting
                    user's CRM profile lacks the
                    Crm_Implied_Manage_UnEnroll_Series permission.
components:
  parameters:
    Module:
      name: module
      example: Leads
      description: >-
        Specify the API name of the module. Refer to the [Get
        Modules](modules.yaml#$.paths./settings/modules.get) resource for valid
        values.
      in: path
      required: true
      schema:
        type: string
        maxLength: 100
  schemas:
    PostCadencesRequest:
      type: object
      additionalProperties: false
      description: >-
        Represents the request payload for enrolling or un-enrolling records in
        one or more Cadences.
      properties:
        cadences_ids:
          type: array
          description: >-
            A list of Cadence IDs to use for the enrollment or un-enrollment
            operation.
          items:
            type: string
            description: A unique identifier of a Cadence.
            maxLength: 255
          maxItems: 5
          x-zs-$ref:
            resource: cadences
            origins:
              - operationId: getCadences
                propertyId: CadenceId
              - operationId: postCadences
                propertyId: CadenceResultId
          maxLength: 255
        ids:
          type: array
          description: >-
            Specify the list of record IDs to enroll in or un-enroll from the
            specified Cadences.
          items:
            type: string
            description: A unique identifier of a record.
            maxLength: 255
          maxItems: 100
      required:
        - cadences_ids
        - ids
    PostcadencesResponse200:
      type: object
      additionalProperties: false
      description: >-
        Represents the successful response body for a Cadence enrollment or
        un-enrollment operation.
      properties:
        data:
          type: array
          description: Represents the list of operation results for the request.
          items:
            $ref: '#/components/schemas/SuccessDataNested'
          maxItems: 100
      x-zs-$id: PostcadencesResponse200
    PostcadencesResponse202:
      type: object
      additionalProperties: false
      description: >-
        Represents the asynchronous acceptance response returned when the
        enrollment or unenrollment request is queued for background processing.
      properties:
        data:
          type: array
          description: >-
            Represents a single-entry array containing the SCHEDULED status
            marker for the queued enrollment request.
          items:
            $ref: '#/components/schemas/ScheduledDataNested'
          maxItems: 1
      x-zs-$id: PostcadencesResponse202
    ScheduledDataNested:
      type: object
      additionalProperties: false
      description: >-
        Represents the status marker returned with HTTP 202 when the enrollment
        or unenrollment request is queued for background processing.
      properties:
        code:
          type: string
          description: >-
            Represents the processing status code. For 202 responses, this is
            always **SCHEDULED**.
          enum:
            - SCHEDULED
          maxLength: 255
        details:
          type: object
          description: >-
            Represents additional details about the scheduled operation. This
            object is currently empty and reserved for future use.
          additionalProperties: true
        message:
          type: string
          description: >-
            Represents the message describing the current processing state of
            the enrollment request.
          maxLength: 255
        status:
          type: string
          description: >-
            Represents the overall status of the scheduled operation. For 202
            responses, this is always **success**.
          enum:
            - success
          maxLength: 255
    SuccessDataNested:
      type: object
      additionalProperties: false
      description: Represents a successful per-record operation result.
      properties:
        code:
          type: string
          description: Represents the result code for the record operation.
          maxLength: 255
        details:
          $ref: '#/components/schemas/DetailsNested'
        message:
          type: string
          description: >-
            Represents the message indicating the outcome of the record
            operation.
          maxLength: 255
        status:
