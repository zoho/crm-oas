  securitySchemes:
    OAuth2:
      type: oauth2
      description: OAuth2 authentication for API access
      flows:
        authorizationCode:
          authorizationUrl: https://accounts.zoho.com/oauth/v2/auth
          tokenUrl: https://accounts.zoho.com/oauth/v2/token
          refreshUrl: https://accounts.zoho.com/oauth/v2/token
          scopes:
            ZohoCRM.modules.Leads.CREATE: Required to enroll / unenroll Leads records into Cadences.
            ZohoCRM.modules.Contacts.CREATE: Required to enroll / unenroll Contacts records into Cadences.
            ZohoCRM.modules.Accounts.CREATE: Required to enroll / unenroll Accounts records into Cadences.
            ZohoCRM.modules.Deals.CREATE: Required to enroll / unenroll Deals records into Cadences.
            ZohoCRM.modules.Tasks.CREATE: Reserved (Tasks are not a valid Cadence module).
            ZohoCRM.modules.Events.CREATE: Reserved (Events are not a valid Cadence module).
            ZohoCRM.modules.Calls.CREATE: Reserved (Calls are not a valid Cadence module).
            ZohoCRM.modules.Products.CREATE: Reserved (Products are not a valid Cadence module).
            ZohoCRM.modules.Vendors.CREATE: Required to enroll / unenroll Vendors records into Cadences.
            ZohoCRM.modules.Campaigns.CREATE: Reserved (Campaigns are not a valid Cadence module).
            ZohoCRM.modules.Cases.CREATE: Reserved (Cases are not a valid Cadence module).
            ZohoCRM.modules.Solutions.CREATE: Reserved (Solutions are not a valid Cadence module).
            ZohoCRM.modules.Quotes.CREATE: Required to enroll / unenroll Quotes records into Cadences.
            ZohoCRM.modules.Invoices.CREATE: Reserved (Invoices are not a valid Cadence module).
            ZohoCRM.modules.Forecasts.CREATE: Reserved (Forecasts are not a valid Cadence module).
            ZohoCRM.modules.Activities.CREATE: Reserved (Activities are not a valid Cadence module).
            ZohoCRM.modules.Notes.CREATE: Reserved (Notes are not a valid Cadence module).
            ZohoCRM.modules.Attachments.CREATE: Reserved (Attachments are not a valid Cadence module).
            ZohoCRM.modules.custom.CREATE: Required to enroll / unenroll records on any custom module.
