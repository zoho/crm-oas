openapi: 3.1.0
info:
  title: Recycle Bin
  description: >-
    The Recycle Bin is the holding area in Zoho CRM that retains records deleted
    from any module so administrators can review or recover them before
    permanent removal. This API enables developers to list, count, retrieve,
    restore, and permanently delete recycle-bin entries individually, in bulk,
    or by emptying the entire Recycle Bin.
  version: '8'
servers:
  - url: https://zohoapis.{dc}/crm/{version}
    description: >-
      Public Zoho CRM API server. Sample request URL:
      `https://zohoapis.{dc}/crm/{version}`.
    variables:
      dc:
        enum:
          - com
          - eu
          - in
          - cn
          - au
        default: com
        description: >-
          The top-level domain of the regional data center that hosts the Zoho
          CRM organization. Possible values: **com**, **eu**, **in**, **cn**,
          **au**. Default: **com**.
      version:
        default: v8
        description: 'The Zoho CRM API version used in the request path. Default: **v8**.'
paths:
  /settings/recycle_bin:
    get:
      operationId: getRecycleBinRecords
      summary: Get recycle-bin records
      description: >-
        To retrieve a paginated list of records currently present in the Recycle
        Bin in your Zoho CRM account. The response contains up to 200 records
        per page, along with pagination metadata. The list can be filtered by
        display name, source module, the user who deleted the records, or the
        deletion timestamp. Sorting is supported by display name, deletion time,
        or deleted-by user in ascending or descending order.
      x-zs-llm-description: >-
        Lists deleted records from the recycle bin with pagination and optional
        filters, including the related module and user details for each item.
      security:
        - OAuth2:
            - ZohoCRM.settings.recycle_bin.READ
      responses:
        '200':
          description: >-
            Returns a paginated list of recycle-bin records that match the
            request, along with pagination metadata such as the current page,
            page size, and whether more records are available.
          content:
            application/json:
              schema:
                type: object
                x-zs-$id: RecycleBinListResponse
                properties:
                  recycle_bin:
                    type: array
                    description: >-
                      Represents the list of recycle-bin records that match the
                      request, with up to 200 records per page.
                    maxItems: 200
                    items:
                      description: >-
                        Represents a single recycle-bin record, including its
                        display name, source module, deletion timestamp, owner,
                        and the user who deleted it.
                      type: object
                      additionalProperties: false
                      properties:
                        display_name:
                          type: string
                          maxLength: 500
                          description: >-
                            Represents the display name of the deleted record as
                            it appeared in its source module.
                        deleted_time:
                          type: string
                          format: date-time
                          description: >-
                            Represents the date and time at which the record was
                            moved to the Recycle Bin, in ISO 8601 format.
                        owner:
                          type: object
                          description: >-
                            Represents the user who owned the record at the time
                            of deletion. Refer to the [Get
                            users](users.yaml#$.paths./users.get) endpoint for
                            details.
                          additionalProperties: false
                          properties:
                            name:
                              type: string
                              maxLength: 255
                              description: Represents the display name of the owning user.
                            id:
                              type: string
                              maxLength: 100
                              description: >-
                                Represents the unique identifier of the owning
                                user.
                          required:
                            - name
                            - id
                        module:
                          type: object
                          description: >-
                            Represents the source module of the deleted record.
                            Refer to the [Get
                            modules](modules.yaml#$.paths./settings/modules.get)
                            endpoint for details.
                          additionalProperties: false
                          properties:
                            api_name:
                              type: string
                              maxLength: 100
                              description: >-
                                Represents the API name of the module the record
                                originally belonged to.
                            id:
                              type: string
                              maxLength: 100
                              description: >-
                                Represents the unique identifier of the module
                                the record originally belonged to.
                        deleted_by:
                          type: object
                          description: >-
                            Represents the user who deleted the record. Refer to
                            the [Get users](users.yaml#$.paths./users.get)
                            endpoint for details.
                          additionalProperties: false
                          properties:
                            name:
                              type: string
                              maxLength: 255
                              description: >-
                                Represents the display name of the user who
                                deleted the record.
                            id:
                              type: string
                              maxLength: 100
                              description: >-
                                Represents the unique identifier of the user who
                                deleted the record.
                          required:
                            - name
                            - id
                        id:
                          type: string
                          maxLength: 100
                          description: >-
                            Represents the unique identifier of the recycle-bin
                            record.
                          x-zs-$id: RecycleBinRecordId
                      required:
                        - display_name
                        - deleted_time
                        - owner
                        - module
                        - deleted_by
                        - id
                  info:
                    type: object
                    description: >-
                      Represents pagination and count information for the
                      returned list of recycle-bin records.
                    additionalProperties: false
                    properties:
                      per_page:
                        type: integer
                        format: int32
                        description: >-
                          Represents the number of records returned on the
                          current page.
                      count:
                        type: integer
                        format: int32
                        description: >-
                          Represents the total number of records returned on the
                          current page.
                      page:
                        type: integer
                        format: int32
                        description: >-
                          Represents the current page number in the paginated
                          response.
                      more_records:
                        type: boolean
                        description: >-
                          Indicates whether additional pages of recycle-bin
                          records are available. Possible values: **true** -
                          More records exist beyond the current page. **false**
                          - The current page contains the last set of records.
                    required:
                      - per_page
                      - count
                      - page
                      - more_records
                required:
                  - recycle_bin
                  - info
                description: >-
                  Represents the response payload for a request to retrieve a
                  paginated list of recycle-bin records, containing the records
                  under **recycle_bin** and pagination metadata under **info**.
                additionalProperties: false
              examples:
                RecycleBinListSample:
                  summary: Sample paginated Recycle Bin list
                  description: >-
                    Shows a representative list response with one deleted record
                    and pagination metadata indicating page size, current page,
                    count, and whether more records are available.
                  value:
                    recycle_bin:
                      - display_name: John Doe
                        deleted_time: '2025-10-22T14:12:00Z'
                        owner:
                          name: Jane Smith
                          id: '789'
                        module:
                          api_name: Leads
                        deleted_by:
                          name: Admin
                          id: '456'
                        id: '12345'
                    info:
                      per_page: 20
                      count: 1
                      page: 1
                      more_records: false
        '204':
          description: >-
            Indicates that the request succeeded but no recycle-bin records were
            found. The response body is empty.
        '400':
          $ref: '#/components/responses/BadRequest'
    delete:
      operationId: deleteRecycleBinRecords
      summary: Delete recycle-bin records
      description: >-
        To permanently delete one or more records from the Recycle Bin in your
        Zoho CRM account. When deleting a parent record, Zoho CRM also removes
        all its associated child records from the Recycle Bin, such as Notes and
        Attachments. When the total number of records to delete is 1000 or
        fewer, the operation completes immediately and returns a 200 response
        with per-item results. When the total exceeds 1000, the deletion runs as
        a background job and returns a 202 response. Partial successes return a
        207 multi-status response with individual success and error entries per
        record.
      x-zs-llm-description: >-
        Permanently deletes recycle bin records selected by filters and returns
        per-item success or failure details.
      parameters:
        - $ref: '#/components/parameters/Filters'
      responses:
        '200':
          description: >-
            Returns the per-item results for each recycle-bin record that Zoho
            CRM permanently removes. The **recycle_bin** array contains one
            entry per processed record, each with the deletion status, result
            code, message, and the affected record ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultList'
              examples:
                Success:
                  value:
                    recycle_bin:
                      - code: SUCCESS
                        details:
                          id: '4794080000003267613'
                        message: record deleted
                        status: success
        '202':
          description: >-
            Indicates that the deletion has been accepted and scheduled as a
            background job. Zoho CRM returns this response when the total number
            of records to delete, including child records such as Notes and
            Attachments, exceeds 1000, or when the **filters** parameter is
            used.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultList'
              examples:
                Scheduled:
                  value:
                    recycle_bin:
                      - code: SCHEDULED
                        details:
                          id: '4794080000003267613'
                        message: record has been scheduled for deletion
                        status: success
        '207':
          $ref: '#/components/responses/MultiStatus'
        '400':
          $ref: '#/components/responses/BadRequest'
      security:
        - OAuth2:
            - ZohoCRM.settings.recycle_bin.DELETE
  /settings/recycle_bin/actions/restore:
    post:
      operationId: restoreRecycleBinRecords
      summary: Restore multiple Recycle Bin records
      description: >-
        To restore one or more deleted records from the Recycle Bin in your Zoho
        CRM account. Supply the scope of restoration in the request body using
        exactly one of three options: **ids** to restore specific records,
        **filters** to restore records matching field-based criteria, or
        **restore_all_records** to restore every record currently in the Recycle
        Bin. When restoring a parent record, Zoho CRM also restores all its
        associated child records, such as Notes and Attachments. If the total
        number of records to restore, including child records, is 1000 or fewer,
        the operation completes immediately. When the total exceeds 1000, when
        the **filters** option is applied, or when **restore_all_records** is
        **true**, the restoration runs as a background job. Admin users can
        restore any record; non-admin users can restore only the records they
        own unless their profile grants broader access.
      x-zs-llm-description: >-
        Restores recycle bin records using record IDs, filter criteria, or a
        bulk restore flag and returns immediate or scheduled results.
      security:
        - OAuth2:
            - ZohoCRM.settings.recycle_bin.UPDATE
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              x-zs-$id: RestoreRecycleBinRequest
              description: >-
                Request payload that specifies how to scope the restoration.
                Provide exactly one of **ids**, **filters**, or
                **restore_all_records**; supplying more than one results in an
                AMBIGUITY_DURING_PROCESSING error.
              additionalProperties: false
              properties:
                ids:
                  type: array
                  description: >-
                    Specify the unique IDs of the recycle-bin records you want
                    to restore. Mutually exclusive with **filters** and
                    **restore_all_records**.
                  maxItems: 200
                  items:
                    x-zs-$ref:
                      resource: recycle_bin
                      origins:
                        - operationId: getRecycleBinRecords
                          propertyId: RecycleBinRecordId
                    description: >-
                      Represents the unique identifier of a single recycle-bin
                      record to restore.
                    type: string
                    maxLength: 100
                filters:
                  type: object
                  description: >-
                    Specify the filter criteria to select recycle-bin records
                    for restoration. Mutually exclusive with **ids** and
                    **restore_all_records**. Restoration based on filters is
                    always scheduled as a background job, regardless of the
                    number of matching records.
                  additionalProperties: false
                  properties:
                    group_operator:
                      type: string
                      enum:
                        - AND
                      description: >-
                        Specify the logical operator that combines the
                        conditions inside the **group** array. Possible values:
                        **AND**.
                    group:
                      type: array
                      description: >-
                        Specify the list of filter conditions used to select
                        recycle-bin records for restoration.
                      maxItems: 20
                      items:
                        type: object
                        description: >-
                          Represents a single filter condition, including the
                          field to filter on, the comparator, and the value to
                          compare against.
                        additionalProperties: false
                        properties:
                          field:
                            type: object
                            description: >-
                              Specify the field to filter on. The field is
                              identified by its API name.
                            additionalProperties: false
                            properties:
                              api_name:
                                type: string
                                maxLength: 100
                                description: >-
                                  Specify the API name of the field to filter
                                  on. Possible values: **display_name**,
                                  **module**, **deleted_by**, **deleted_time**.
                            required:
                              - api_name
                          comparator:
                            type: string
                            description: >-
                              Specify the comparison operator to apply between
                              the field and the value. Possible values:
                              **equal**, **not_equal**, **contains**,
                              **not_contains**, **starts_with**, **ends_with**,
                              **greater_than**, **less_than**. The set of
                              comparators supported depends on the field:
                              **display_name** and **deleted_by** support equal,
                              not_equal, contains, not_contains, starts_with,
                              ends_with; **module** supports equal and
                              not_equal; **deleted_time** supports equal,
                              not_equal, greater_than, less_than.
                            maxLength: 50
                          value:
                            description: >-
                              Specify the value to compare the field against.
                              The data type depends on the field being filtered.
                            oneOf:
                              - type: string
                                x-zs-$id: FilterValueString
                                description: >-
                                  String value used when filtering by
                                  **display_name**, **module**, **deleted_by**,
                                  or **deleted_time**.
                                maxLength: 500
                              - type: number
                                x-zs-$id: FilterValueNumber
                                description: >-
                                  Numeric value used when filtering by a numeric
                                  attribute.
                              - type: boolean
                                description: >-
                                  Boolean value used when filtering by a Boolean
                                  attribute.
                                x-zs-$id: FilterValueBoolean
                        required:
                          - field
                          - comparator
                          - value
                  required:
                    - group_operator
                    - group
                restore_all_records:
                  type: boolean
                  description: >-
                    Specify whether every record currently in the Recycle Bin
                    should be restored. Possible values: **true** - Every record
                    in the Recycle Bin is restored. This option cannot be
                    combined with **ids** or **filters** and the operation is
                    always scheduled as a background job. **false** - Either
                    **ids** or **filters** must be supplied to scope the
                    restoration.
              oneOf:
                - required:
                    - ids
                  x-zs-$id: RestoreByIds
                  description: >-
                    Restore only the recycle-bin records whose IDs are listed in
                    **ids**.
                - required:
                    - filters
                  x-zs-$id: RestoreByFilters
                  description: >-
                    Restore the recycle-bin records that match the conditions
                    defined in **filters**.
                - required:
                    - restore_all_records
                  x-zs-$id: RestoreAll
                  description: >-
                    Restore every record currently in the Recycle Bin when
                    **restore_all_records** is set to **true**.
            examples:
              RestoreByIds:
                summary: Restore specific records by IDs
                value:
                  ids:
                    - '111111000000077729'
                    - '111111000000077734'
              RestoreByFilters:
                summary: Restore records matching filter criteria
                value:
                  filters:
                    group_operator: AND
                    group:
                      - field:
                          api_name: display_name
                        comparator: contains
                        value: Amazon Marketplace
                      - field:
                          api_name: module
                        comparator: equal
                        value: Leads
              RestoreAll:
                summary: Restore all records
                value:
                  restore_all_records: true
      responses:
        '200':
          description: >-
            Returns per-item results when records are restored immediately. The
            **recycle_bin** array contains one entry per processed record with
            the operation status, code, message, and the restored record ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultList'
              examples:
                ImmediateSuccess:
                  summary: Immediate restoration success
                  value:
                    recycle_bin:
                      - status: success
                        code: SUCCESS
                        message: record restored
                        details:
                          id: '111111000000077729'
        '202':
          description: >-
            Indicates that the restoration has been accepted and scheduled as a
            background job. Zoho CRM returns this response when the total number
            of records to restore, including child records, exceeds 1000, when
            the **filters** option is applied, or when **restore_all_records**
            is set to **true**.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultList'
              examples:
                ScheduledByIds:
                  summary: Restoration scheduled for specific IDs
                  value:
                    recycle_bin:
                      - code: SCHEDULED
                        details:
                          id: '111111000000077729'
                        message: record has been scheduled for restoration
                        status: success
                      - code: SCHEDULED
                        details:
                          id: '111111000000077734'
                        message: record has been scheduled for restoration
                        status: success
                ScheduledByFilters:
                  summary: Bulk restoration scheduled based on filters
                  value:
                    recycle_bin:
                      - code: SCHEDULED
                        details: {}
                        message: >-
                          Bulk restoration of records based on filters has been
                          scheduled
                        status: success
                ScheduledRestoreAll:
                  summary: All records scheduled for restoration
                  value:
                    recycle_bin:
                      - code: SCHEDULED
                        details: {}
                        message: >-
                          Bulk restoration of records based on filters has been
                          scheduled
                        status: success
        '207':
          $ref: '#/components/responses/MultiStatus'
        '400':
          $ref: '#/components/responses/BadRequest'
  /settings/recycle_bin/actions/count:
    get:
      operationId: getRecycleBinCounts
      summary: Get recycle-bin record count
      description: >-
        To retrieve the total count of records currently present in the Recycle
        Bin in your Zoho CRM account. The count reflects every entry across all
        modules.
      x-zs-llm-description: >-
        Returns the total number of records currently present in the recycle
        bin.
      security:
        - OAuth2:
            - ZohoCRM.settings.recycle_bin.READ
      responses:
        '200':
          description: >-
            Returns the total count of records currently present in the Recycle
            Bin.
          content:
            application/json:
              schema:
                type: object
                x-zs-$id: RecycleBinCountResponse
                properties:
                  count:
                    type: integer
                    format: int32
                    description: >-
                      Represents the total number of records currently present
                      in the Recycle Bin.
                required:
                  - count
                description: >-
                  Represents the response payload containing the total count of
                  records present in the Recycle Bin.
                additionalProperties: false
              examples:
                CountExample:
                  value:
                    count: 150
  /settings/recycle_bin/actions/empty:
    post:
      operationId: emptyRecycleBin
      summary: Empty the Recycle Bin
      description: >-
        To permanently delete every record from the Recycle Bin in your Zoho CRM
        account. This action is irreversible - the records cannot be restored
        after this operation completes. When the Recycle Bin contains 1000 or
        fewer records, including child records such as Notes and Attachments,
        Zoho CRM deletes the records immediately and returns a 200 response.
        When the count exceeds 1000, the deletion runs as a background job and
        returns a 202 response. Only users with the Admin profile can empty the
        Recycle Bin.
      x-zs-llm-description: >-
        Empties the recycle bin by permanently deleting all recycle bin records
        and reports whether the action completed immediately or was scheduled.
      security:
        - OAuth2:
            - ZohoCRM.settings.recycle_bin.UPDATE
      responses:
        '200':
          description: >-
            Returns a confirmation that Zoho CRM has emptied the Recycle Bin
            immediately. The response includes the **SUCCESS** result code and
            the success status.
          content:
            application/json:
              schema:
                type: object
                x-zs-$id: EmptyRecycleBinSuccessResponse
                properties:
                  code:
                    type: string
                    enum:
                      - SUCCESS
                    description: >-
                      Represents the result code for the empty operation.
                      Possible values: **SUCCESS** - Every record in the Recycle
                      Bin was permanently deleted.
                    maxLength: 100
                  details:
                    type: object
                    description: >-
                      Represents additional details about the empty operation.
                      This is an empty object when the operation completes
                      successfully.
                    additionalProperties: true
                  message:
                    type: string
                    maxLength: 500
                    description: >-
                      Represents the message confirming that the Recycle Bin was
                      emptied.
                  status:
                    type: string
                    enum:
                      - success
                    description: >-
                      Indicates the outcome of the empty operation. Possible
                      values: **success** - Every record in the Recycle Bin was
                      permanently deleted.
                required:
                  - code
                  - details
                  - message
                  - status
                additionalProperties: false
                description: >-
                  Represents the success payload returned when Zoho CRM deletes
                  every record in the Recycle Bin immediately in a single
                  synchronous call.
              examples:
                ImmediateSuccess:
                  summary: Recycle Bin emptied immediately
                  value:
                    code: SUCCESS
                    details: {}
                    message: recyclebin is cleared
                    status: success
        '202':
          description: >-
            Indicates that the empty Recycle Bin action has been accepted and
            scheduled as a background job. Zoho CRM returns this response when
            the Recycle Bin contains more than 1000 records, including child
            records.
          content:
            application/json:
              schema:
                type: object
                x-zs-$id: EmptyRecycleBinScheduledResponse
                properties:
                  code:
                    type: string
                    enum:
                      - SCHEDULED
                    description: >-
                      Represents the result code indicating that the empty
                      operation is scheduled as a background job. Possible
                      values: **SCHEDULED** - The empty Recycle Bin action was
                      queued as a background job.
                    maxLength: 100
                  details:
                    type: object
                    description: >-
                      Represents additional details about the scheduled empty
                      operation. This is an empty object when the job is queued.
                    additionalProperties: true
                  message:
                    type: string
                    maxLength: 500
                    description: >-
                      Represents the message confirming that the empty Recycle
                      Bin action has been scheduled as a background job.
                  status:
                    type: string
                    enum:
                      - success
                    description: >-
                      Indicates the outcome of the scheduling request. Possible
                      values: **success** - The empty Recycle Bin action was
                      accepted and queued as a background job.
                required:
                  - code
                  - details
                  - message
                  - status
                additionalProperties: false
                description: >-
                  Represents the accepted payload returned when the empty
                  Recycle Bin action is scheduled as a background job.
              examples:
                ScheduledDeletion:
                  summary: Empty Recycle Bin scheduled as background job
                  value:
                    code: SCHEDULED
                    details: {}
                    message: Empty bin action has been scheduled
                    status: success
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: >-
            The OAuth token does not include the required scope to empty the
            Recycle Bin. **Resolution:** A new access token must be generated
            with the **ZohoCRM.settings.recycle_bin.UPDATE** scope.
          content:
            application/json:
              schema:
                type: object
                x-zs-$id: EmptyRecycleBinUnauthorizedResponse
                properties:
                  status:
                    type: string
                    enum:
                      - error
                    description: >-
                      Indicates that the request was not authorized. Possible
                      values: **error** - The OAuth token does not include the
                      required scope.
                  code:
                    type: string
                    description: >-
                      Represents the error code identifying the cause of the
                      authorization failure.
                    maxLength: 100
                  message:
                    type: string
                    maxLength: 500
                    description: >-
                      Represents the message describing the cause of the
                      authorization failure.
                  details:
                    type: object
                    description: >-
                      Represents additional context about the authorization
                      failure. This is an empty object for scope mismatch
                      errors.
                    additionalProperties: true
                required:
                  - status
                  - code
                  - message
                  - details
                description: >-
                  Represents the error payload returned when the OAuth token
                  does not include the scope required to empty the Recycle Bin.
                additionalProperties: false
              examples:
                OAuthScopeMismatch:
                  value:
                    status: error
                    code: OAUTH_SCOPE_MISMATCH
                    message: Unauthorized
                    details: {}
        '404':
          description: >-
            The request URL does not match a valid endpoint pattern for emptying
            the Recycle Bin in Zoho CRM. **Resolution:** The request path must
            be verified and reissued as a POST request to the correct empty
            Recycle Bin endpoint.
          content:
            application/json:
              schema:
                type: object
                x-zs-$id: EmptyRecycleBinNotFoundResponse
                properties:
                  status:
                    type: string
                    enum:
                      - error
                    description: >-
                      Indicates that the requested URL pattern is invalid.
                      Possible values: **error** - The request did not match a
                      valid endpoint pattern.
                  code:
                    type: string
                    description: >-
                      Represents the error code identifying why the URL pattern
                      is invalid.
                    maxLength: 100
                  message:
                    type: string
                    maxLength: 500
                    description: Represents the message describing the URL pattern issue.
                  details:
                    type: object
                    description: >-
                      Represents additional context about the invalid URL
                      pattern. This is an empty object for URL pattern errors.
                    additionalProperties: true
                required:
                  - status
                  - code
                  - message
                  - details
                description: >-
                  Represents the error payload returned when the request targets
                  an invalid URL pattern for the empty Recycle Bin action.
                additionalProperties: false
              examples:
                InvalidUrlPattern:
                  value:
                    status: error
                    code: INVALID_URL_PATTERN
                    message: Please check if the URL trying to access is a correct one
                    details: {}
  /settings/recycle_bin/{recordId}/actions/restore:
    post:
      operationId: restoreRecycleBinRecord
      summary: Restore a Recycle Bin record
      description: >-
        To restore a single deleted record from the Recycle Bin in your Zoho CRM
        account. The record is moved back to its original module along with all
