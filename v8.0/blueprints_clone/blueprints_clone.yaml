openapi: 3.1.0
info:
  title: Blueprint Clone
  description: >-
    Blueprint is a Zoho CRM feature that maps out a business process and guides
    users through it, stage by stage and transition by transition. This API
    enables developers to create a copy of an existing blueprint configuration,
    either as a standalone copy or as a dependent draft that replaces the source
    blueprint when activated.
  version: '8'
servers:
  - url: https://zohoapis.{dc}/crm/{version}
    description: API Server URL
    variables:
      dc:
        description: API Server URL TLD
        default: com
        enum:
          - eu
          - com
          - au
          - in
          - jp
          - cn
          - ca
      version:
        description: API Version
        default: v8
security:
  - OAuth2:
      - ZohoCRM.settings.blueprint.CREATE
paths:
  /settings/blueprints/{blueprintId}/actions/clone:
    post:
      summary: Clone Blueprint
      description: To clone a Blueprint in your Zoho CRM organization.
      x-zs-llm-description: >-
        Clone a blueprint by blueprintId. 'dependent' type: do NOT include
        map_states at clone time; source must be active with chart_data; provide
        map_states + move_records at activation.  After activation, all IDs
        change to clone IDs.
      operationId: cloneBlueprint
      parameters:
        - name: blueprintId
          in: path
          required: true
          schema:
            type: string
            format: bigint
            pattern: ^[0-9]+
          description: >-
            Specify the ID of the Blueprint you want to clone. Refer to the
            [Blueprints](blueprints.yaml#$.paths./settings/blueprints.get)
            resource for valid values.
        - $ref: '#/components/parameters/ParamHeaderXZohoService'
      requestBody:
        description: The request body must contain a blueprints array with a single object.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlueprintCloneBatchRequest'
            examples:
              SamplePostRequest:
                summary: Standalone clone of a Blueprint with state remapping
                value:
                  blueprints:
                    - name: Autonum_Cloned
                      type: standalone
                      layout:
                        id: '5226917000000091023'
                        name: Standard
                      field:
                        id: '5226917000000002565'
                        api_name: Stage
                      pipeline:
                        id: '5226917000004004001'
                        name: Standard (Standard)
                      map_states:
                        - existing_state:
                            actual_value: '-None-'
                          clone_state:
                            actual_value: Qualification
                        - existing_state:
                            actual_value: Option 1
                          clone_state:
                            actual_value: Needs Analysis
                        - existing_state:
                            actual_value: Option 2
                          clone_state:
                            actual_value: Value Proposition
                      module: Potentials
                description: >-
                  Shows a standalone clone request for a Blueprint with the
                  target layout, field, and pipeline, and a map_states array
                  remapping the source states to the cloned Blueprint.
            x-zs-llm-examples:
              - SamplePostRequest
      responses:
        '201':
          description: >-
            Returns the clone result for the requested Blueprint, including its
            status, message, and the ID of the newly created Blueprint.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlueprintCloneResponse'
              examples:
                Success201:
                  summary: Successful clone of a Blueprint
                  value:
                    blueprints:
                      - code: SUCCESS
                        details:
                          uncopied_before_criteria_fields: null
                          id: '5226917000005131001'
                          uncopied_entry_criteria_fields: null
                          uncopied_during_transition_fields: null
                        message: Blueprint successfully cloned
                        status: success
                  description: >-
                    Returns the success result for the cloned Blueprint,
                    including the ID of the newly created Blueprint.
          headers:
            X-API-CREDITS-REMAINING:
              schema:
                type: string
                format: int64
                description: >
                  Present when >=50% of base daily credits (excluding add-on
                  credits) are consumed. Value is total remaining credits
                  including add-on credits for the rolling 24-hour window.
                pattern: ^[0-9]+$
                minLength: 1
                maxLength: 19
              required: false
        '400':
          description: |-
            The request cannot be processed due to invalid syntax.
            **Resolution:** The request body and the Blueprint ID must be valid.
          content:
            application/json:
              schema:
                x-zs-$id: BlueprintCloneErrorResponse
                oneOf:
                  - type: object
                    x-zs-$id: BlueprintCloneErrorResponseWithBlueprints
                    additionalProperties: false
                    description: >-
                      Represents the wrapped error response for the requested
                      Blueprint clone, carrying the error entries in the
                      **blueprints** array.
                    properties:
                      blueprints:
                        type: array
                        description: >-
                          Represents the list of error entries for the requested
                          Blueprint clone. Each entry reports one validation or
                          processing error, including its code, message, status,
                          and details.
                        items:
                          oneOf:
                            - $ref: '#/components/schemas/ErrorResponseCore24'
                            - $ref: '#/components/schemas/BlueprintNameConflictError'
                            - $ref: '#/components/schemas/InvalidLayoutReuseError'
                            - $ref: '#/components/schemas/CloneRequestAmbiguityError'
                            - $ref: '#/components/schemas/ErrorResponseCore4'
                            - $ref: '#/components/schemas/ErrorResponseCore2'
                            - $ref: '#/components/schemas/ErrorResponseCore6'
                            - $ref: '#/components/schemas/RequiredFieldNotFoundError'
                            - $ref: '#/components/schemas/CannotProcessMapStatesError'
                            - $ref: >-
                                #/components/schemas/BlueprintNameSpecialCharError
                            - $ref: '#/components/schemas/InvalidValueError'
                            - $ref: '#/components/schemas/PipelineNotProvidedError'
                            - $ref: '#/components/schemas/CannotCloneBlueprintError'
                          description: >-
                            Represents one error entry for the requested
                            Blueprint clone, including its code, message,
                            status, and validation details.
                        maxItems: 25
                    required:
                      - blueprints
                  - $ref: '#/components/schemas/ErrorResponseCore19'
                description: >-
                  Represents the error response returned when the Blueprint
                  clone request cannot be processed, with the error entries for
                  the requested clone carried in the **blueprints** array.
              examples:
                LimitExceededResponse1:
                  summary: LIMIT_EXCEEDED error when the Blueprint limit is reached
                  value:
                    blueprints:
                      - code: LIMIT_EXCEEDED
                        details:
                          limit: 50
                        message: Blueprint limit exceed
                        status: error
                  description: >-
                    Demonstrates the response when the maximum number of
                    Blueprints allowed in the Zoho CRM organization is already
                    reached.
                DuplicateDataResponse1:
                  summary: DUPLICATE_DATA error for a reused Blueprint name
                  value:
                    blueprints:
                      - code: DUPLICATE_DATA
                        details:
                          api_name: name
                          json_path: $.blueprints.name
                        message: There is already a blueprint with this name
                        status: error
                  description: >-
                    Demonstrates the response when the clone request uses a
                    Blueprint name that already exists.
                InvalidDataResponse1:
                  summary: INVALID_DATA error for an invalid Blueprint ID
                  value:
                    code: INVALID_DATA
                    details:
                      resource_path_index: 2
                    message: the id given seems to be invalid
                    status: error
                  description: >-
                    Demonstrates the response when the Blueprint ID in the
                    request URL is invalid.
                InvalidDataResponse2:
                  summary: INVALID_DATA error for reusing the source layout
                  value:
                    blueprints:
                      - code: INVALID_DATA
                        details:
                          json_path: $.blueprints[0].layout.id
                          api_name: id
                        message: >-
                          The given layout should be different from source
                          blueprint layout
                        status: error
                  description: >-
                    Demonstrates the response when the provided layout is the
                    same as the source Blueprint layout.
                AmbiguityDuringProcessingResponse1:
                  summary: >-
                    AMBIGUITY_DURING_PROCESSING error when map_states is given
                    for a draft clone
                  value:
                    blueprints:
                      - code: AMBIGUITY_DURING_PROCESSING
                        details:
                          ambiguity_due_to:
                            - api_name: type
                              json_path: $.blueprints[0].type
                            - api_name: map_states
                              json_path: $.blueprints[0].map_states
                        message: Ambiguity while processing the request
                        status: error
                  description: >-
