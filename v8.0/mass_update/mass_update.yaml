                              properties:
                                code:
                                  description: |
                                    Represents the error code returned when the
                                    requested operation or module is not
                                    supported by the Mass Update API.

                                    Possible values:

                                    NOT_SUPPORTED - The requested operation is
                                    not supported for the targeted record or
                                    module.

                                    INVALID_MODULE - The module is not supported
                                    by the Mass Update API.
                                  type: string
                                  enum:
                                    - NOT_SUPPORTED
                                    - INVALID_MODULE
                                message:
                                  type: string
                                  description: >-
                                    Represents the error message describing why
                                    the operation or module is not supported.
                                  format: string
                                status:
                                  description: >-
                                    Represents the status of the operation for
                                    this record.
                                  type: string
                                  enum:
                                    - error
                                details:
                                  type: object
                                  description: >-
                                    Represents additional details about the
                                    unsupported request, including the index of
                                    the unsupported segment in the request URL
                                    path.
                                  additionalProperties: false
                                  required:
                                    - resource_path_index
                              additionalProperties: false
                              required:
                                - code
                                - message
                                - status
                                - details
                            - type: object
                              x-zs-$id: MassUpdate400RecordLocked
                              description: >-
                                Returned when the record is locked by the record
                                locking configuration or a GDPR setting and
                                cannot be modified by the mass update operation.
                              properties:
                                code:
                                  description: >-
                                    Represents the error code returned when the
                                    record is locked and cannot be updated.
                                  type: string
                                  enum:
                                    - RECORD_LOCKED
                                message:
                                  type: string
                                  description: >-
                                    Represents the error message indicating that
                                    the record is locked.
                                  format: string
                                status:
                                  description: >-
                                    Represents the status of the operation for
                                    this record.
                                  type: string
                                  enum:
                                    - error
                                details:
                                  type: object
                                  description: >-
                                    Represents additional details about the
                                    locked record, including the ID of the
                                    locked record and the action that placed the
                                    lock.
                                  properties:
                                    action:
                                      type: string
                                      description: >-
                                        Represents the action that placed the
