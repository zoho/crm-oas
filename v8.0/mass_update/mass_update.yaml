                                      enum:
                                        - record_locking
                                    id:
                                      type: string
                                      description: >-
                                        Represents the unique ID of the locked
                                        record that could not be updated.
                                      pattern: ^[0-9]+$
                                      format: int64
                                  additionalProperties: false
                                  required:
                                    - action
                                    - id
                              additionalProperties: false
                              required:
                                - code
                                - message
                                - status
                                - details
                            - type: object
                              x-zs-$id: MassUpdate400ConvertedRecord
                              description: >-
                                Returned when the record (for example, a
                                converted Lead) has already been converted and
                                cannot be modified by the mass update operation.
                              properties:
                                code:
                                  description: >-
                                    Represents the error code returned when the
                                    record has already been converted and cannot
                                    be updated.
                                  type: string
                                  enum:
                                    - CONVERTED_RECORD
                                message:
                                  type: string
                                  description: >-
                                    Represents the error message indicating that
                                    the record has already been converted and
                                    cannot be updated.
                                  format: string
                                status:
                                  description: >-
                                    Represents the status of the operation for
                                    the record.
                                  type: string
                                  enum:
                                    - error
                                details:
                                  type: object
                                  description: >-
                                    Represents additional details about the
                                    converted record, including its unique ID.
                                  properties:
                                    id:
                                      type: string
                                      description: >-
                                        Represents the unique ID of the record
                                        that has already been converted.
                                      pattern: ^[0-9]+$
                                      format: int64
                                  additionalProperties: false
                                  required:
                                    - id
                              additionalProperties: false
                              required:
                                - code
                                - message
                                - status
                                - details
                        maxItems: 500
                    required:
                      - data
                    additionalProperties: false
                description: >-
                  Represents the error response wrapper for a failed mass update
                  request. The response is one of the request-level error
                  variants (`ALREADY_SCHEDULED`, `INVALID_MODULE`) or a
                  per-record error envelope that lists individual record
                  failures.
              examples:
                NoRecordsFound:
                  value:
                    data:
                      - code: INVALID_DATA
                        details:
                          id: '19901170000358080'
                        message: the id given seems to be invalid
                        status: error
                  description: >-
                    Illustrates a per-record `INVALID_DATA` error returned when
                    the provided record ID does not exist in the targeted
                    module. The remaining valid record IDs in the same request
                    are still processed.
                  summary: Example of a record ID supplied in the request is invalid.
                MandatoryFieldMissing:
                  value:
                    data:
                      - code: MANDATORY_NOT_FOUND
                        details: {}
                        message: required field not found
                        status: error
                  description: >-
                    Illustrates a per-record error returned when a required
                    field is missing from the update payload.
                  summary: An example of mandatory field missing in the payload.
                InvalidFieldValue:
                  value:
                    data:
                      - code: INVALID_DATA
                        details:
                          api_name: Pipeline
                          id: '1990117000035827873'
                        message: picklist not found in record layout
                        status: error
                  description: >-
                    Illustrates a per-record error returned when the provided
                    picklist value for the `Pipeline` field is not present in
                    the layout assigned to the record.
                  summary: >-
                    An example of picklist value not present in the record
                    layout.
                NonSubordinateUser:
                  summary: >-
                    An example of non-subordinate user assigned to a user lookup
                    field.
                  description: |
                    Illustrates a per-record error returned when a user assigned
                    to a user lookup field is not eligible under the calling
                    user's hierarchy permissions.


                    This error can occur in the following cases:


                    - **Role hierarchy permission: List Subordinates Only**

                    The calling user can assign only users who are their
                    subordinates in the role hierarchy.

                    - **Territory hierarchy permission: Territories and
                    Sub-Territory Users Only**

                    The calling user can assign only users who belong to their
                    territory or its sub-territories.

                    For example, consider the following territory hierarchy:
                        - Root Territory
                            - Territory A (User1, User2)
                                 - Territory B (User3, User4)
                            - Territory C (User5, User6)
                    A user in Territory A can assign users from Territory A and
                    Territory B, but cannot assign users from Territory C.
                  value:
                    data:
                      - code: INVALID_DATA
                        details:
                          api_name: id
                          json_path: $.data[0].User_lookup.id
                        message: Non Subordinate User Found
                        status: error
      security:
        - OAuth2:
            - ZohoCRM.mass_update.UPDATE
        - OAuth2:
            - ZohoCRM.mass_update.Leads.UPDATE
    get:
      summary: Get mass update job status
      description: >-
        To retrieve the current status and record-processing counts of an
        asynchronous mass update job that was previously scheduled in your Zoho
        CRM organization. The job is identified by the `job_id` returned in the
        response of the scheduler-type mass update request. The response reports
        the job state along with the total, updated, not-updated, and failed
        record counts so that the caller can track progress until the job
        completes.
      operationId: getMassUpdateStatus
      parameters:
        - $ref: '#/components/parameters/Module'
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: >-
            Returns the current state and record-processing counts of the
            requested mass update job.
          content:
            application/json:
              schema:
                x-zs-$id: MassUpdateStatus200Response
                description: >-
                  The request body contains the data required to perform the
                  operation.
                type: object
                properties:
                  data:
                    description: >-
                      Represents the array that contains the status object for
                      the requested mass update job.
                    type: array
                    items:
                      description: >-
                        Represents the status object that contains the current
                        state and processed-record counts for the mass update
                        job.
                      type: object
                      properties:
                        Status:
                          type: string
                          description: |
                            Represents the current state of the mass update job.

                            Possible values:

                            COMPLETED - The mass update job has finished
                            processing all records.

                            SCHEDULED - The mass update job has been queued and
                            is waiting to start.

                            QUEUED - The mass update job is queued in the
                            system.

                            RUNNING - The mass update job is currently
                            processing records.

                            SUSPENDED - The mass update job has been paused.

                            FAILED - The mass update job has terminated due to a
                            failure.
                          enum:
                            - COMPLETED
                            - SCHEDULED
                            - QUEUED
                            - RUNNING
                            - SUSPENDED
                            - FAILED
                        Failed_Count:
                          type: integer
                          format: int32
                          description: >-
                            Represents the number of records that failed to
                            update due to validation errors or other processing
                            failures during the mass update job.
                        Updated_Count:
                          type: integer
                          format: int32
                          description: >-
                            Represents the number of records that were
                            successfully updated by the mass update job.
                        Not_Updated_Count:
                          type: integer
                          format: int32
                          description: >-
                            Represents the number of records that are not yet
                            updated by the mass update job.
                        Total_Count:
                          type: integer
                          format: int32
                          description: >-
                            Represents the total number of records that were
                            scheduled to be mass updated by the job.
                      required:
                        - Failed_Count
                        - Updated_Count
                        - Total_Count
                        - Not_Updated_Count
                        - Status
                      additionalProperties: false
                    maxItems: 1
                required:
                  - data
                additionalProperties: false
              examples:
                ScheduledJob:
                  value:
                    data:
                      - Status: SCHEDULED
                        Failed_Count: 0
                        Updated_Count: 0
                        Not_Updated_Count: 18
                        Total_Count: 18
                  description: >-
                    Illustrates the response when the mass update job is in the
                    SCHEDULED state. The `Total_Count` reports the number of
                    records queued for the job, and the `Not_Updated_Count`
                    matches the total because record processing has not started
                    yet.
                  summary: An example of mass update job in SCHEDULED state.
        '400':
          description: |
            Returns an error when the request fails because of a missing or
            invalid `job_id` parameter or an unsupported module.

            **Resolution**: Use the job ID received in the response of [Mass
            Update API](mass_update.yaml#$./{module}/actions/mass_update.post).
          content:
            application/json:
              schema:
                x-zs-$id: MassUpdateStatus400Response
                oneOf:
                  - type: object
                    x-zs-$id: MassUpdateMandatoryNotFound
                    description: >-
                      Returned when the required `job_id` query parameter is
                      missing from the request URL.
                    properties:
                      code:
                        description: >-
                          Represents the error code returned when a required
                          parameter is missing from the request.
                        type: string
                        enum:
                          - MANDATORY_NOT_FOUND
                      details:
                        description: >-
                          Represents additional details about the missing
                          mandatory parameter, including the name of the
                          parameter that was not provided.
                        type: object
                        additionalProperties: false
                      message:
                        type: string
                        description: >-
                          Represents the error message describing the validation
                          failure for the missing parameter.
                        format: string
                      status:
                        description: Represents the overall status of the API response.
                        type: string
                        enum:
                          - error
                        format: string
                    required:
                      - code
                      - details
                      - message
                      - status
                    additionalProperties: false
                  - type: object
                    x-zs-$id: MassUpdateInvalidJobId
                    description: >-
                      Returned when the `job_id` value provided in the request
                      is invalid or does not correspond to a scheduled mass
                      update job.
                    properties:
                      code:
                        description: >-
                          Represents the error code returned when the provided
                          parameter value fails validation.
                        type: string
                        enum:
                          - INVALID_DATA
                      details:
                        description: >-
                          Represents additional details about the invalid
                          parameter, including the name of the parameter whose
                          value failed validation.
                        type: object
                        additionalProperties: false
                      message:
                        type: string
                        description: >-
                          Represents the error message describing the invalid
                          parameter value.
                        format: string
                      status:
                        description: Represents the overall status of the API response.
                        type: string
                        enum:
                          - error
                    required:
                      - code
                      - details
                      - message
                      - status
                    additionalProperties: false
                  - type: object
                    x-zs-$id: MassUpdateInvalidModule
                    description: >-
                      Returned when the module API name in the request URL is
                      invalid.
                    properties:
                      code:
                        description: >-
                          Represents the error code returned when the module
                          specified in the request URL is invalid or not
                          supported.
                        type: string
                        enum:
                          - INVALID_MODULE
                      message:
                        type: string
                        description: >-
                          Represents the error message describing the module
                          validation failure.
                        format: string
                      status:
                        description: Represents the overall status of the API response.
                        type: string
                        enum:
                          - error
                      details:
                        description: >-
                          Represents additional details about the invalid
                          module, including the index of the unsupported segment
                          in the request path.
                        type: object
                        required:
                          - resource_path_index
                        additionalProperties: false
                    required:
                      - code
                      - message
                      - status
                      - details
                    additionalProperties: false
                description: >-
                  Represents the response wrapper for a failed mass update
                  status request, returning one of the validation or module
                  errors that prevented the request from being processed.
              examples:
                InvalidJobId:
                  value:
                    code: INVALID_DATA
                    details:
                      param_name: job_id
                    message: The jobid given seems to be invalid
                    status: error
                  description: >-
                    Illustrates the error returned when the `job_id` query
                    parameter is invalid or does not match any scheduled mass
                    update job.
                  summary: An example of invalid job_id being provided in the request.
      security:
        - OAuth2:
            - ZohoCRM.mass_update.READ
        - OAuth2:
            - ZohoCRM.mass_update.Leads.READ
components:
  parameters:
    Module:
      name: module
      in: path
      required: true
      description: >-
        Specify the API name of the CRM module on which the mass update
        operation must be performed. Use the [Get Modules
        API](modules.yaml#$.paths./settings/modules.get) to fetch the valid API
        name of the module. 
      schema:
        type: string
        enum:
          - Leads
          - Accounts
          - Contacts
          - Deals
          - Campaigns
          - Tasks
          - Calls
          - Meetings
          - Cases
          - Solutions
          - Products
          - Vendors
          - Price_Books
          - Quotes
          - Sales_Orders
          - Purchase_Orders
          - Invoices
          - Custom
    JobId:
      name: job_id
      in: query
      required: true
      description: >-
        Specify the unique ID of the mass update job whose status must be
        retrieved. This is the `job_id` returned in the response of the [Mass
        Update API](mass_update.yaml#$/{module}/actions/mass_update.post)
        request.
      schema:
        type: string
        format: int64
        pattern: ^[0-9]+$
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://accounts.zoho.com/oauth/v2/auth
          tokenUrl: https://accounts.zoho.com/oauth/v2/token
          refreshUrl: https://accounts.zoho.com/oauth/v2/token
          scopes:
            ZohoCRM.mass_update.UPDATE: >-
              Grants permission to mass update records across all modules in the
              Zoho CRM organization.
            ZohoCRM.mass_update.Leads.UPDATE: >-
              Grants permission to mass update records in the specified module
              of the Zoho CRM organization.
            ZohoCRM.mass_update.READ: >-
              Grants permission to retrieve the status of mass update jobs
              across all modules in the Zoho CRM organization.
            ZohoCRM.mass_update.Leads.READ: >-
              Grants permission to retrieve the status of mass update jobs in
              the specified module of the Zoho CRM organization.
