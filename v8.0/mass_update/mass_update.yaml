                                      format: string
                                    api_name:
                                      type: string
                                      description: >-
                                        Represents the API name of the field
                                        whose value does not match the mapping.
                                      format: string
                                    json_path:
                                      type: string
                                      description: >-
                                        Represents the JSON path to the
                                        mismatched element in the request body.
                                      format: string
                                  additionalProperties: false
                                message:
                                  type: string
                                  description: >-
                                    Represents the error message describing the
                                    mapping mismatch.
                                  format: string
                                status:
                                  description: >-
                                    Represents the status of the operation for
                                    this record.
                                  type: string
                                  enum:
                                    - error
                              additionalProperties: false
                              required:
                                - code
                                - details
                                - message
                                - status
                            - type: object
                              x-zs-$id: MassUpdate400NotSupported
                              description: >-
                                Returned when the requested operation or module
