                                          format: int64
                                          description: >-
                                            Represents the maximum allowed value,
                                            inclusive, for the field.
                                      required:
                                        - from
                                        - to
                                      additionalProperties: false
                                  additionalProperties: false
                                message:
                                  type: string
                                  description: >-
                                    Represents the error message describing the
                                    validation failure for the record.
                                  format: string
                                status:
                                  description: >-
                                    Represents the status of the operation for
                                    this record.
                                  type: string
                                  enum:
                                    - error
                              additionalProperties: false
                              required:
                                - code
