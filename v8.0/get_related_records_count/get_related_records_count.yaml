openapi: 3.1.0
info:
  title: Related Records Count
  description: >-
    Related record counts represent the number of records in related lists
    associated with a parent record in a CRM module, covering system-defined and
    custom related lists. This API enables developers to retrieve count
    summaries for up to 20 related lists in a single request, with optional
    filtering by approval status, conversion status, category type, and
    field-level equality criteria.
  version: '8'
servers:
  - url: https://zohoapis.{dc}/crm/{version}
    description: >-
      Production API server for Zoho CRM. Sample request URL:
      `https://zohoapis.{dc}/crm/{version}`
    variables:
      dc:
        enum:
          - com
          - eu
          - in
          - cn
          - au
        default: com
        description: >-
          The top-level domain (TLD) of the API server base URL, which
          determines the regional data center.

          Possible values:

          **com** - United States.

          **eu** - Europe.

          **in** - India.

          **cn** - China.

          **au** - Australia.

          Default: **com**.
      version:
        default: v8
        description: 'The API version. Default: **v8**.'
paths:
  /{moduleApiName}/{recordId}/actions/get_related_records_count:
    post:
      summary: Get related records count
      description: >-
        To retrieve the count of related records for a specified parent record
        in your Zoho CRM organization. Supports optional filtering by approval
        status, conversion status, category type, and field-level equality
        criteria. A single request can include up to 20 related list count
        specifications. You can use this API to get the count of records in the
        following types of related lists:


        - **System-defined related lists**, such as:
          - Survey
          - Desk
          - Projects
          - Visits
          - Expense
          - Invoice
          - Subscription
        - **Custom related lists** created via Lookup fields.

        - **Custom related lists** created via Multi-select Lookup fields.

        - **Custom related lists** created via Multi-module Lookup fields.

        - **Related lists** created when history tracking is enabled for a
        picklist field.
      operationId: getRelatedRecordsCount
      parameters:
        - $ref: '#/components/parameters/ModuleApiName'
        - $ref: '#/components/parameters/RecordId'
      requestBody:
        description: >-
          The request body must contain a **get_related_records_count** array.
          You can include a maximum of 20 objects per request. Use the [Get
          Related Records
          API](related_records.yaml#$.paths./{parentRecordModule}/{parentRecord}/{relatedList}.get)
          to get the ID of the related list in the key ID.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetRelatedRecordsCountRequest'
            examples:
              BasicCount:
                summary: Basic related list count without filters
                description: >-
                  Shows a minimal count request for a single related list
                  identified by its API name and ID, with no optional filtering
                  criteria.
                value:
                  get_related_records_count:
                    - related_list:
                        api_name: Contacts
                        id: '4150868000001038001'
              FilteredCount:
                summary: Count request with field filter and approval status
                description: >-
                  Shows a count request for the Deals related list, filtered to
                  include only approved records where the Stage field equals
                  Closed Won.
                value:
                  get_related_records_count:
                    - related_list:
                        api_name: Deals
                        id: '4150868000001038002'
                      params:
                        approved: true
                        filters:
                          comparator: equal
                          field:
                            api_name: Stage
                          value: Closed Won
              MultipleRelatedLists:
                summary: Count multiple related lists in one request
                description: >-
                  Shows a single request that retrieves counts for three related
                  lists — Contacts, Deals, and Tasks — in one API call.
                value:
                  get_related_records_count:
                    - related_list:
                        api_name: Contacts
                        id: '4150868000001038001'
                    - related_list:
                        api_name: Deals
                        id: '4150868000001038002'
                    - related_list:
                        api_name: Tasks
                        id: '4150868000001038003'
              ConvertedFilter:
                summary: Count only converted leads in a related list
                description: >-
                  Shows a count request for the Leads related list, filtered to
                  include only converted records where the Status field equals
                  Qualified.
                value:
                  get_related_records_count:
                    - related_list:
                        api_name: Leads
                        id: '4150868000001038004'
                      params:
                        converted: true
                        filters:
                          comparator: equal
                          field:
                            api_name: Status
                          value: Qualified
              CategoryFilter:
                summary: Count related records filtered by category type
                description: >-
                  Shows a count request for the Attachments related list,
                  filtered by category to include only file-type attachments
                  where the File_Type field equals PDF.
                value:
                  get_related_records_count:
                    - related_list:
                        api_name: Attachments
                        id: '4150868000001038005'
                      params:
                        category: files
                        filters:
                          comparator: equal
                          field:
                            api_name: File_Type
                          value: PDF
              ApprovalStateFilter:
                summary: Count records filtered by approval state
                description: >-
                  Shows a count request for the Quotes related list, filtered to
                  include only records in the approved approval state where the
                  Quote_Stage field equals Accepted.
                value:
                  get_related_records_count:
                    - related_list:
                        api_name: Quotes
                        id: '4150868000001038006'
                      params:
                        approval_state: approved
                        filters:
                          comparator: equal
                          field:
                            api_name: Quote_Stage
                          value: Accepted
        required: true
      responses:
        '200':
          description: >-
            Returns an array of count results for the requested related lists,
            each containing the count of matching records and the related list
            identifier.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetRelatedRecordsCountResponse'
              examples:
                SuccessfulCount:
                  summary: Successful count response for a single related list
                  description: >-
                    Shows a successful response with the count of 15 Contacts
                    records associated with the specified parent record.
                  value:
                    get_related_records_count:
                      - count: 15
                        related_list:
                          api_name: Contacts
                          id: '4150868000001038001'
                MultipleRelatedLists:
                  summary: Successful count response for multiple related lists
                  description: >-
                    Shows a successful response with counts for two related
                    lists: 15 Contacts and eight Deals records associated with
                    the specified parent record.
                  value:
                    get_related_records_count:
                      - count: 15
                        related_list:
                          api_name: Contacts
                          id: '4150868000001038001'
                      - count: 8
                        related_list:
                          api_name: Deals
                          id: '4150868000001038002'
                EmptyCount:
                  summary: Count response with zero matching records
                  description: >-
                    Shows a successful response where no Tasks records match the
                    specified criteria, returning a count of zero.
                  value:
                    get_related_records_count:
                      - count: 0
                        related_list:
                          api_name: Tasks
                          id: '4150868000001038003'
                FilteredCountResult:
                  summary: Count response after applying filter criteria
                  description: >-
                    Shows a successful response with the count of three Deals
                    records that match the specified filter criteria.
                  value:
                    get_related_records_count:
                      - count: 3
                        related_list:
                          api_name: Deals
                          id: '4150868000001038002'
        '207':
          description: >-
            Multi-Status. Returned when the request contains multiple related
            list count items where some succeed and others fail (partial
            success). Each item in the get_related_records_count array
            independently reports either a successful count or an error.
          content:
            application/json:
              schema:
                x-zs-$id: GetRelatedRecordsCount207Response
                oneOf:
                  - $ref: '#/components/schemas/PartialSuccessResponse'
                  - $ref: >-
                      #/components/schemas/PartialSuccessMandatoryNotFoundResponse
              examples:
                PartialSuccessInvalidData:
                  summary: Partial success with INVALID_DATA error
                  description: >-
                    Response with a mix of successful counts and per-item
                    errors. Index 0 returned a count successfully; index 1
                    failed because the related_list id was invalid.
                  value:
                    get_related_records_count:
                      - count: 0
                        related_list:
                          api_name: Notes
                          id: '4987786000000002730'
                      - code: INVALID_DATA
                        details:
                          api_name: id
                          json_path: $.get_related_records_count[1].related_list.id
                        message: Given related_list is invalid
                        status: error
                PartialSuccessMandatoryNotFound:
                  summary: Partial success with MANDATORY_NOT_FOUND error
                  description: >-
                    Response with a mix of successful counts and per-item
                    errors. Index 0 returned a count successfully; index 1
                    failed because the related_list field was missing.
                  value:
                    get_related_records_count:
                      - count: 0
                        related_list:
                          api_name: Notes
                          id: '4987786000000002730'
                      - code: MANDATORY_NOT_FOUND
                        details:
                          api_name: related_list
                          json_path: $.get_related_records_count[1].related_list
                        message: required field not found
                        status: error
        '400':
          description: >-
            The request contains invalid, missing, or unsupported data.

            **Resolution:** The error code and details in the response body
            identify the specific validation failure. The request must be
            corrected before retrying.
          content:
            application/json:
              schema:
                x-zs-$id: GetRelatedRecordsCount400Response
                oneOf:
                  - $ref: '#/components/schemas/InvalidDataError'
                  - $ref: '#/components/schemas/InvalidDataRecordIdError'
                  - $ref: '#/components/schemas/MandatoryNotFoundError'
                  - $ref: '#/components/schemas/InvalidModuleError'
                  - $ref: '#/components/schemas/ExpectedFieldMissingError'
                  - $ref: '#/components/schemas/AmbiguityDuringProcessingError'
                  - $ref: '#/components/schemas/NotSupportedFiltersError'
                  - $ref: '#/components/schemas/NotSupportedRelatedListError'
                  - $ref: '#/components/schemas/AuthorizationFailedError'
                  - $ref: '#/components/schemas/InvalidRequestMethodError'
                  - $ref: '#/components/schemas/InvalidRequestError'
              examples:
                InvalidRecordId:
                  summary: Invalid record ID in URL path
                  description: The related record ID given in the URL path is invalid
                  value:
                    code: INVALID_DATA
                    details:
                      resource_path_index: 1
                    message: the related id given seems to be invalid
                    status: error
                IdAlreadyConverted:
                  summary: Record ID already converted
                  description: >-
                    The given record ID refers to an already converted record
                    and cannot be processed again
                  value:
                    code: INVALID_DATA
                    details:
                      resource_path_index: 1
                    message: id already converted
                    status: error
                InvalidDataRelatedList:
                  summary: Invalid related list ID or API name
                  description: The given related_list is invalid
                  value:
                    get_related_records_count:
                      - code: INVALID_DATA
                        details:
                          api_name: id
                          json_path: $.get_related_records_count[0].related_list.id
                        message: Given related_list is invalid
                        status: error
                MandatoryNotFound:
                  summary: MANDATORY_NOT_FOUND error for a missing required field
                  description: >-
                    Shows a 400 error response when the required related_list
                    field is absent from a request object in the
                    get_related_records_count array.
                  value:
                    get_related_records_count:
                      - code: MANDATORY_NOT_FOUND
                        details:
                          api_name: related_list
                          json_path: $.get_related_records_count[0].related_list
                        message: required field not found
                        status: error
                InvalidModule:
                  summary: Invalid module API name
                  description: The module name given seems to be invalid
                  value:
                    code: INVALID_MODULE
                    details:
                      resource_path_index: 0
                    message: the module name given seems to be invalid
                    status: error
                ExpectedFieldMissing:
                  summary: Missing ID or API name
                  description: Specify at least one field
                  value:
                    get_related_records_count:
                      - code: EXPECTED_FIELD_MISSING
                        details:
                          expected_fields:
                            - api_name: api_name
                              json_path: >-
                                $.get_related_records_count[0].related_list.api_name
                            - api_name: id
                              json_path: $.get_related_records_count[0].related_list.id
                        message: Specify atleast one field
                        status: error
                AmbiguityDuringProcessing:
                  summary: ID and API name mismatch
                  description: >-
                    The ID and API name of the related list do not match,
                    causing ambiguity
                  value:
                    get_related_records_count:
                      - code: AMBIGUITY_DURING_PROCESSING
                        details:
                          ambiguity_due_to:
                            - api_name: id
                              json_path: $.get_related_records_count[0].related_list.id
                            - api_name: api_name
                              json_path: >-
                                $.get_related_records_count[0].related_list.api_name
                        message: Ambiguity while processing the request
                        status: error
                NotSupportedFilters:
                  summary: Filters not supported for module
                  description: >-
                    Filters are not supported for the specified module's related
                    list
                  value:
                    get_related_records_count:
                      - code: NOT_SUPPORTED
                        details:
                          expected_data_type: json_type
                          api_name: filters
                          json_path: $.get_related_records_count[0].params.filters
                        message: Filters are not supported for this modules
                        status: error
                NotSupportedRelatedList:
                  summary: Related list not supported in API
                  description: The given related list ID is not supported in API
                  value:
                    get_related_records_count:
                      - code: NOT_SUPPORTED
                        details: {}
                        message: The given related list id is not supported in api
                        status: error
                AuthorizationFailed:
                  summary: Insufficient permissions
                  description: >-
                    You do not have sufficient permission to read the module
                    records
                  value:
                    code: AUTHORIZATION_FAILED
                    details: {}
                    message: >-
                      You do not have sufficient permission to read the module
                      records
                    status: error
                InvalidRequestMethod:
                  summary: Invalid HTTP request method
                  description: The HTTP request method type is not valid
                  value:
                    code: INVALID_REQUEST_METHOD
                    details: {}
                    message: The http request method type is not a valid one
                    status: error
                InvalidRequest:
                  summary: Invalid request
                  description: Unable to process your request
                  value:
                    code: INVALID_REQUEST
                    details: {}
                    message: >-
                      unable to process your request. please verify whether you
                      have entered proper method name, parameter and parameter
                      values.
                    status: error
        '401':
          description: >-
            Unauthorized. Authentication failed due to invalid, expired, or
            missing access token, or the token lacks required OAuth scopes.
          content:
            application/json:
              schema:
                x-zs-$id: GetRelatedRecordsCount401Response
                oneOf:
                  - $ref: '#/components/schemas/AuthenticationFailureError'
                  - $ref: '#/components/schemas/InvalidTokenError'
                  - $ref: '#/components/schemas/OAuthScopeMismatchError'
              examples:
                AuthenticationFailure:
                  summary: Authentication failure
                  description: >-
                    You have not authenticated the API call with valid access
                    token
                  value:
                    code: AUTHENTICATION_FAILURE
                    details: {}
                    message: Authentication failed
                    status: error
                InvalidToken:
                  summary: Invalid or expired token
                  description: Your access token has expired or is invalid
                  value:
                    code: INVALID_TOKEN
                    details: {}
                    message: Invalid API token
                    status: error
                OAuthScopeMismatch:
                  summary: OAuth scope mismatch
                  description: >-
                    The access token you have used to make this API call does
                    not have the required scope
                  value:
                    code: OAUTH_SCOPE_MISMATCH
                    details: {}
                    message: The access token does not have the required scope
                    status: error
        '403':
          description: >-
            Forbidden. You do not have permission to perform this operation,
            either due to insufficient user privileges or organizational
            restrictions.
          content:
            application/json:
              schema:
                x-zs-$id: GetRelatedRecordsCount403Response
                oneOf:
                  - $ref: '#/components/schemas/NoPermissionError'
                  - $ref: '#/components/schemas/NotAllowedError'
              examples:
                NoPermission:
                  summary: No permission to read records
                  description: You do not have permission to read records from the module
                  value:
                    code: NO_PERMISSION
                    details: {}
                    message: You do not have permission to read records from the module
                    status: error
                NotAllowed:
                  summary: Not allowed to read related records
                  description: >-
                    You do not have permission to read related records from the
                    module
                  value:
                    code: NOT_ALLOWED
                    details: {}
                    message: >-
                      You do not have permission to read related records from
                      the module
                    status: error
        '404':
          description: >-
            Not Found. The requested URL pattern is incorrect or the resource
            does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidUrlPatternError'
              examples:
                InvalidUrlPattern:
                  summary: Invalid URL pattern
                  description: The request URL is incorrect
                  value:
                    code: INVALID_URL_PATTERN
                    details: {}
                    message: The request URL is incorrect. Please check the URL
                    status: error
        '500':
          description: >-
            Internal Server Error. Unexpected and unhandled exception in the
            server. Contact support if the error persists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalError'
              examples:
                InternalError:
                  summary: Internal server error
                  description: Unexpected and unhandled exception in the server
                  value:
                    code: INTERNAL_ERROR
                    details: {}
                    message: Internal Server Error
                    status: error
      security:
        - OAuth2:
            - ZohoCRM.modules.READ
components:
  schemas:
    RelatedListReference:
      type: object
      description: >-
        Represents a related list identified by its API name and unique ID. Used
        in both the request to specify the target related list and in the
        response to echo the queried related list.
      additionalProperties: false
      properties:
        api_name:
          type: string
          description: Represents the API name of the related list.
          pattern: ^[A-Za-z0-9_]+$
          minLength: 1
          maxLength: 100
          x-zs-$ref:
            resource: related_lists
            origins:
              - operationId: getRelatedLists
                propertyId: RelatedListsMultiselectApiName
        id:
          type: string
          description: >-
            Represents the unique ID of the related list.  Use the  [Get Related
            Records
            API](related_records.yaml#$.paths./{parentRecordModule}/{parentRecord}/{relatedList}.get)
            to get the ID of the related list in the key ID.
          pattern: ^[0-9]+$
          minLength: 1
          maxLength: 20
          x-zs-$ref:
            resource: related_lists
            origins:
              - operationId: getRelatedLists
                propertyId: RelatedListsMultiselectId
          format: int64
      required:
        - api_name
        - id
    FilterField:
      type: object
      description: >-
        Represents the field to use when filtering related records before
        counting.
      additionalProperties: false
      properties:
        api_name:
          type: string
          description: >-
            Represents the API name of the field to filter on when counting
            related records.
          pattern: ^[A-Za-z0-9_]+$
          minLength: 1
          maxLength: 100
          x-zs-$ref:
            resource: fields
            origins:
              - operationId: getFields
                propertyId: FieldsApiName
          example: api_name30
      required:
        - api_name
    FilterCriteria:
      type: object
      description: >-
        Represents the field-based filter criteria applied to related records
        before counting. Contains the field to evaluate, the comparison
        operator, and the value to compare against.
      additionalProperties: false
      properties:
        comparator:
          type: string
          description: >-
            Represents the comparison operator used to filter related records
            before counting.

            Possible values:

            **equal** - Matches records where the specified field value equals
            the given value.
          enum:
            - equal
        field:
          $ref: '#/components/schemas/FilterField'
        value:
          type: string
          description: >-
            Represents the value to compare the specified field against when
            filtering related records before counting.
          minLength: 1
          maxLength: 255
      required:
        - comparator
        - field
        - value
    CountParameters:
      type: object
      description: >-
        Represents optional filtering and selection parameters applied to
        related records before counting. Includes support for approval status,
        conversion status, category type, and field-level equality filters.
      additionalProperties: false
      properties:
        approved:
          type: boolean
          description: |-
            Indicates whether to restrict the count to approved records only.
            Possible values:
            **true** - Count only approved records.
            **false** - Count only records that are not approved.
        filters:
          $ref: '#/components/schemas/FilterCriteria'
        converted:
          type: boolean
          description: >-
            Indicates whether to restrict the count to converted records only.
            Applicable to the Leads module.

            Possible values:

            **true** - Count only converted records.

            **false** - Count only records that have not been converted.
        category:
          type: string
          description: >-
            Represents the category type used to filter related records before
            counting.

            Possible values:

            **link** - Count only link-type related records.

            **files** - Count only file-attachment related records.
          enum:
            - link
            - files
        approval_state:
          type: string
          description: >-
            Represents the approval workflow state used to filter related
            records before counting.

            Possible values:

            **approved** - Count only records in the approved workflow state.
          enum:
            - approved
      required:
        - filters
    RelatedRecordCountItem:
      type: object
      description: >-
        Represents a single related list count specification, including the
        target related list and optional filtering criteria to apply before
        counting.
      additionalProperties: false
      properties:
        related_list:
          $ref: '#/components/schemas/RelatedListReference'
        params:
          $ref: '#/components/schemas/CountParameters'
      required:
        - related_list
    GetRelatedRecordsCountRequest:
      type: object
      description: >-
        Represents the request payload for counting related records. Contains an
        array of related list count specifications, each identifying a related
        list and optional filtering criteria.
      additionalProperties: false
      properties:
        get_related_records_count:
          type: array
          description: >-
            Represents the array of related list count request objects. Each
            object specifies a related list to query and optional filtering
            criteria to apply before counting.
          items:
            $ref: '#/components/schemas/RelatedRecordCountItem'
          minItems: 1
          maxItems: 20
      required:
        - get_related_records_count
    RelatedRecordCountResult:
      type: object
      x-zs-$id: RelatedRecordCountResult
      description: >-
        Represents the count result for a specific related list, including the
        total number of matching records and the related list identifier.
      additionalProperties: false
      properties:
        count:
          type: integer
          format: int32
          description: >-
            Represents the total number of related records matching the
            specified criteria.
          minimum: 0
        related_list:
          $ref: '#/components/schemas/RelatedListReference'
      required:
        - count
        - related_list
    GetRelatedRecordsCountResponse:
      type: object
      x-zs-$id: GetRelatedRecordsCountResponse
      description: >-
        Represents the response returned when the count operation succeeds.
        Contains an array of count results, one entry for each related list
        requested.
      additionalProperties: false
      properties:
        get_related_records_count:
          type: array
          description: >-
            Represents the array of count results, one entry for each related
            list requested.
          items:
            $ref: '#/components/schemas/RelatedRecordCountResult'
          maxItems: 20
      required:
        - get_related_records_count
    PartialSuccessItemError:
      type: object
      x-zs-$id: PartialSuccessItemError
      description: >-
        Per-item error entry inside the get_related_records_count array of a
        partial-success (HTTP 207) response. Indicates that this particular
        related list count request failed while other items in the same array
        may have succeeded.
      additionalProperties: false
      properties:
        status:
          type: string
          description: |-
            Represents the status of the response. 
            Possible values:
            **error** - The request was unsuccessful.
          enum:
            - error
        code:
          type: string
          description: Error code identifying the failure reason for this item
          enum:
            - INVALID_DATA
            - EXPECTED_FIELD_MISSING
            - AMBIGUITY_DURING_PROCESSING
            - NOT_SUPPORTED
        message:
          type: string
          description: Represents the error message describing the validation failure.
          maxLength: 500
        details:
          description: >-
            Additional context about the per-item error (field info, expected
            fields, ambiguity info, or unsupported-filter info depending on the
            error code)
          oneOf:
            - $ref: '#/components/schemas/ErrorDetailsFieldInfo'
            - $ref: '#/components/schemas/ErrorDetailsExpectedFields'
            - $ref: '#/components/schemas/ErrorDetailsAmbiguity'
            - $ref: '#/components/schemas/ErrorDetailsNotSupportedFilters'
            - $ref: '#/components/schemas/ErrorDetailsEmpty'
      required:
        - status
        - code
        - message
        - details
    PartialSuccessResponseItem:
      x-zs-$id: PartialSuccessResponseItem
      description: >-
        A single entry inside the get_related_records_count array of a
        partial-success response. Each entry is independently either a
        successful count result or a per-item error.
      oneOf:
        - $ref: '#/components/schemas/RelatedRecordCountResult'
        - $ref: '#/components/schemas/PartialSuccessItemError'
    PartialSuccessResponse:
      type: object
      x-zs-$id: PartialSuccessResponse
      description: >-
        Multi-Status (HTTP 207) response returned when a request containing
        multiple related list count items has mixed results - some items succeed
        with a count while others fail with a per-item error. Each entry in
        get_related_records_count corresponds positionally to a requested item
        and independently reports either success (count + related_list) or an
        error (status, code, message, details).
      additionalProperties: false
      properties:
        get_related_records_count:
          type: array
          description: >-
            Array of per-item results, one entry per requested related list.
            Each entry is either a RelatedRecordCountResult (success) or a
            PartialSuccessItemError (failure).
          items:
            $ref: '#/components/schemas/PartialSuccessResponseItem'
          minItems: 1
