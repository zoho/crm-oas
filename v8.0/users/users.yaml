        microsoft:
          type: boolean
          description: >-
            Indicates whether the user is authenticated via a Microsoft
            account.\nPossible values:\ntrue - The user is a Microsoft account
            user.\nfalse - The user is not a Microsoft account user.
        Modified_By:
          oneOf:
            - x-zs-$id: UserModifiedBy
              type: object
              description: >-
                Represents the user who last modified this user record,
                identified by their unique ID and full name.
              properties:
                name:
                  type: string
                  description: >-
                    Represents the full name of the user who last modified this
                    user record.
                  maxLength: 100
                id:
                  type: string
                  description: >-
                    Represents the unique ID of the user who last modified this
                    user record.
                  maxLength: 19
              additionalProperties: false
              required:
                - name
                - id
            - type: 'null'
              description: >-
                Indicates that no modification has been recorded for this user
                record.
              x-zs-$id: NoUserModifiedBy
          description: >-
            Represents the user who last modified this user record. Returns null
            if no modification has occurred. Refer to the [Get
            Users](users.yaml#$.paths./users.get) endpoint for details.
        Modified_Time:
          oneOf:
            - type: string
              readOnly: true
              description: >-
                Represents the date and time at which this user record was last
                modified.
              format: date-time
              x-zs-$id: UserModifiedTime
            - type: 'null'
              description: >-
                Indicates that no modification time is recorded for this user
                record.
              x-zs-$id: NoUserModifiedTime
          description: >-
            Represents the date and time at which this user record was last
            modified, in ISO 8601 format. Returns null if no modification has
            occurred.
        phone:
          type:
            - string
            - 'null'
          description: >-
            Represents the user's phone number. Returns null when no phone
            number is associated with the account.
          maxLength: 30
        mobile:
          type:
            - string
            - 'null'
          description: >-
            Represents the user's mobile phone number. Returns null when no
            mobile number is associated with the account.
          maxLength: 30
        city:
          oneOf:
            - type: string
              maxLength: 100
              description: Represents the city associated with the user.
              x-zs-$id: UserCity
            - type: 'null'
              description: Indicates that no city is configured for the user.
              x-zs-$id: NoUserCity
          description: >-
            Represents the city associated with the user's address. Returns null
            if no city is configured.
        country:
          oneOf:
            - type: string
              maxLength: 100
              description: Represents the country associated with the user.
              x-zs-$id: UserCountry
            - type: 'null'
              description: Indicates that no country is configured for the user.
              x-zs-$id: NoUserCountry
          description: >-
            Represents the country associated with the user's address. Returns
            null if no country is configured.
        dob:
          oneOf:
            - type: string
              format: date
              description: Represents the user's date of birth.
              x-zs-$id: UserDOB
            - type: 'null'
              description: Indicates that no date of birth is set for the user.
              x-zs-$id: NoUserDOB
          description: >-
            Represents the user's date of birth. Returns null if no date of
            birth has been set.
        fax:
          oneOf:
            - type: string
              maxLength: 30
              description: Represents the user's fax number.
              x-zs-$id: UserFax
            - type: 'null'
              description: Indicates that no fax number is configured for the user.
              x-zs-$id: NoUserFax
          description: >-
            Represents the user's fax number. Returns null if no fax number is
            configured.
        number_separator:
          type: string
          enum:
            - Comma
            - Period
            - Space
            - comma
            - period
            - space
          description: >-
            Represents the character used as a separator when formatting numbers
            for the user. This field is case-insensitive.
        state:
          oneOf:
            - type: string
              maxLength: 100
              description: Represents the state or province associated with the user.
              x-zs-$id: UserState
            - type: 'null'
              description: Indicates that no state or province is set for the user.
              x-zs-$id: NoUserState
          description: >-
            Represents the user's state or province. Returns null if no state is
            set.
        street:
          oneOf:
            - type: string
              maxLength: 250
              description: Represents the street address associated with the user.
              x-zs-$id: UserStreet
            - type: 'null'
              description: Indicates that no street address is set for the user.
              x-zs-$id: NoUserStreet
          description: >-
            Represents the user's street address. Returns null if no street
            address is set.
        time_format:
          type: string
          description: >-
            Represents the time format preferred by the user for displaying time
            values.
          enum:
            - HH:mm
            - hh:mm a
        website:
          oneOf:
            - type: string
              maxLength: 250
              pattern: >-
                ^(http:\/\/www.|https:\/\/www.|ftp:\/\/www.|www.|http:\/\/|https:\/\/|ftp:\/\/|){1}[^\x00-\x19\x22-\x27\x2A-\x2C\x2E-\x2F\x3A-\x3F\x5B-\x5E\x60\x7B\x7D-\x7F]+(\.[^\x00-\x19\x22\x24-\x2C\x2E-\x2F\x3C\x3E\x40\x5B-\x5E\x60\x7B\x7D-\x7F]+)+([\/\?].*)*$
              description: Represents the website URL associated with the user.
              x-zs-$id: UserWebsite
            - type: 'null'
              description: Indicates that no website URL is configured for the user.
              x-zs-$id: NoUserWebsite
          description: >-
            Represents the user's website URL. Returns null if no website is
            configured.
        zip:
          oneOf:
            - type: string
              maxLength: 30
              description: Represents the postal code or ZIP code associated with the user.
              x-zs-$id: UserPostalCode
            - type: 'null'
              description: Indicates that no postal code is set for the user.
              x-zs-$id: NoUserPostalCode
          description: >-
            Represents the user's postal code or ZIP code. Returns null if no
            postal code is set.
        sandboxDeveloper:
          type: boolean
          description: >-
            Indicates whether the user is designated as a sandbox
            developer.\n\nPossible values:\ntrue - The user is a sandbox
            developer.\nfalse - The user is not a sandbox developer.
        name_format__s:
          type: string
          description: Represents the format used to display the user's name.
          enum:
            - Salutation,First Name,Last Name
            - Salutation,Last Name,First Name
            - First Name,Salutation,Last Name
            - First Name,Last Name,Salutation
            - Last Name,Salutation,First Name
            - Last Name,First Name,Salutation
