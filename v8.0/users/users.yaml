                x-zs-$id: PermissionDeniedResponse
                description: >-
                  Represents the response payload schema returned when the
                  requesting user does not have permission to create a user.
                type: object
                properties:
                  code:
                    type: string
                    description: >-
                      Indicates the error code returned when the requesting user
                      lacks permission to create a user. Possible values:
                      `NO_PERMISSION`, `PERMISSION_DENIED`.
                    enum:
                      - NO_PERMISSION
                      - PERMISSION_DENIED
                  details:
                    type: object
                    description: >-
                      Contains additional context about the permission denied
                      error, including the list of required permissions that are
                      missing.
                    properties:
                      permissions:
                        description: >-
                          Contains the list of Zoho CRM permission identifiers
                          required for this operation that are absent from the
                          requesting user profile.
                        maxItems: 1
                        type: array
                        items:
                          type: string
                          description: >-
                            Represents a missing Zoho CRM permission identifier.
                            Possible values: .
                          enum:
                            - Crm_Implied_Manage_Users
                    additionalProperties: false
                  message:
