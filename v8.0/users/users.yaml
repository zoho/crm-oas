            - ar_EG
            - hi_IN
            - th_TH
            - ja_JP
            - ko_KR
        phone:
          type:
            - string
            - 'null'
          description: >-
            Specify the user's phone number. Set to null to clear an existing
            phone number.
          maxLength: 30
        mobile:
          type:
            - string
            - 'null'
          description: >-
            Specify the user's mobile phone number. Set to null to clear an
            existing mobile number.
          maxLength: 30
        city:
          oneOf:
            - type: string
              maxLength: 100
              description: Represents the city value to set for the user.
              x-zs-$id: UserCityUpdate
            - type: 'null'
              description: Indicates that the city value should be cleared.
              x-zs-$id: NoUserCityUpdate
          description: >-
            Specify the city for the user's address. Set to null to clear an
            existing city value.
        country:
          oneOf:
            - type: string
              maxLength: 100
              description: Represents the country value to set for the user.
              x-zs-$id: UserCountryUpdate
            - type: 'null'
              description: Indicates that the country value should be cleared.
              x-zs-$id: NoUserCountryUpdate
          description: >-
            Specify the country for the user's address. Set to null to clear an
            existing country value.
        dob:
          oneOf:
            - type: string
              format: date
              description: >-
                Represents the date of birth value in YYYY-MM-DD format to set
                for the user.
              x-zs-$id: UserDOBUpdate
            - type: 'null'
              description: Indicates that the date of birth should be cleared.
              x-zs-$id: NoUserDOBUpdate
          description: >-
            Specify the user's date of birth in YYYY-MM-DD format. Set to null
            to clear an existing date of birth.
        fax:
          oneOf:
            - type: string
              maxLength: 30
              description: Represents the fax number to set for the user.
              x-zs-$id: UserFaxUpdate
            - type: 'null'
              description: Indicates that the fax number should be cleared.
              x-zs-$id: NoUserFaxUpdate
          description: >-
            Specify the user's fax number. Set to null to clear an existing fax
            number.
        number_separator:
          type: string
          x-zs-llm-description: >
            Valid values are system-defined picklist options available in the
            Fields Get API (Users module). Call the Fields Get API with
            module=Users to retrieve the complete set of supported number
            separators. Use 'actual_value'. (api_name :number_separator ).
          enum:
            - Comma
            - Period
            - Space
            - comma
            - period
            - space
          description: >-
            Specify the character to use as a separator when formatting numbers
            for the user. This field is case-insensitive.
        state:
          oneOf:
            - type: string
              maxLength: 100
              description: Represents the state or province to set for the user.
              x-zs-$id: UserStateUpdate
            - type: 'null'
              description: Indicates that the state value should be cleared.
              x-zs-$id: NoUserStateUpdate
          description: >-
            Specify the state or province for the user's address. Set to null to
            clear an existing state value.
        street:
          oneOf:
            - type: string
              maxLength: 250
              description: Represents the street address to set for the user.
              x-zs-$id: UserStreetUpdate
            - type: 'null'
              description: Indicates that the street address should be cleared.
              x-zs-$id: NoUserStreetUpdate
          description: >-
            Specify the street address for the user. Set to null to clear an
            existing street address.
        time_format:
          type: string
          description: >-
            Specify the time format to use for displaying time values for the
            user.
          x-zs-llm-description: >
            Valid values are system-defined picklist options available in the
            Fields Get API (Users module). Call the Fields Get API with
            module=Users to retrieve the complete set of supported time formats.
            Use 'actual_value'. (api_name :time_format ).
          enum:
            - HH:mm
            - hh:mm a
        website:
          oneOf:
            - type: string
              maxLength: 250
              pattern: >-
                ^(http:\/\/www.|https:\/\/www.|ftp:\/\/www.|www.|http:\/\/|https:\/\/|ftp:\/\/|){1}[^\x00-\x19\x22-\x27\x2A-\x2C\x2E-\x2F\x3A-\x3F\x5B-\x5E\x60\x7B\x7D-\x7F]+(\.[^\x00-\x19\x22\x24-\x2C\x2E-\x2F\x3C\x3E\x40\x5B-\x5E\x60\x7B\x7D-\x7F]+)+([\/\?].*)*$
              description: Represents the website URL to set for the user.
              x-zs-$id: UserWebsiteUpdate
            - type: 'null'
              description: Indicates that the website URL should be cleared.
              x-zs-$id: NoUserWebsiteUpdate
          description: >-
            Specify the user's website URL. Set to null to clear an existing
            website URL.
        zip:
          oneOf:
            - type: string
              maxLength: 30
              description: Represents the postal code or ZIP code to set for the user.
              x-zs-$id: UserPostalCodeUpdate
            - type: 'null'
              description: Indicates that the postal code should be cleared.
              x-zs-$id: NoUserPostalCodeUpdate
          description: >-
            Specify the user's postal code or ZIP code. Set to null to clear an
            existing postal code.
        name_format__s:
          type: string
          description: Specify the format to use when displaying the user's name.
          enum:
            - Salutation,First Name,Last Name
            - Salutation,Last Name,First Name
            - First Name,Salutation,Last Name
            - First Name,Last Name,Salutation
            - Last Name,Salutation,First Name
            - Last Name,First Name,Salutation
        language:
          type: string
          description: >-
            Specify the preferred language for the user. This value can be
            updated only by the user themselves.
          x-zs-llm-description: >
            Valid values are system-defined picklist options available in the
            Fields Get API (Users module). Call the Fields Get API with
