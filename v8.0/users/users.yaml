        image_link:
          type: string
          description: >-
            Specify the URL of the user's profile image from the Identity and
            Access Management (IAM) system.
          maxLength: 100
        sort_order_preference__s:
          type: string
          description: Specify the user's preferred sort order for displaying records.
          enum:
            - First Name,Last Name
            - Last Name,First Name
        Reporting_To:
          oneOf:
            - x-zs-$id: ReportingToUser
              type: object
              description: >-
                Represents the reporting manager object with the manager user ID
                and name.
              properties:
                name:
                  type: string
                  description: >-
                    Specify the full name of the user to assign as the reporting
                    manager.
                  maxLength: 100
                id:
                  type: string
                  description: >-
                    Specify the unique ID of the user to assign as the reporting
                    manager.
                  maxLength: 19
                  x-zs-$ref:
                    resource: users
                    origins:
                      - operationId: getUsers
                        propertyId: UserId
              additionalProperties: false
              required:
                - name
                - id
            - type: 'null'
              description: Indicates that no reporting manager is assigned to this user.
              x-zs-$id: NoReportingToUser
          description: >-
            Specify the user to whom this user reports. Set to null to remove
            the reporting relationship. Refer to the [Get
            Users](users.yaml#$.paths./users.get) endpoint for valid user IDs.
        share_among_subordinates:
          type: boolean
          description: >-
            Specify whether the user's records should be shared with their
            subordinates.\n\nPossible values:\ntrue - Records are shared with
            subordinates.\nfalse - Records are not shared with subordinates.
        time_zone:
          type: string
          description: >-
            Specify the time zone for the user. This value can be updated only
            by the user themselves.
          maxLength: 150
          x-zs-llm-description: >
            Valid values are system-defined picklist options available in the
            Fields Get API (Users module). Call the Fields Get API with
            module=Users to retrieve the complete set of supported time zones.
            Use 'actual_value'. (api_name :time_zone ).
        distance_preference__s:
          type: string
          description: >-
            Specify the user's preferred unit of measurement for displaying
            distance values.
          enum:
            - Kilometers
            - Miles
        default_tab_group:
          type: integer
          description: >-
            Specify the default tab group for the user, determining which group
            of tabs is shown upon login.
          format: int32
        signature:
          type:
            - string
            - 'null'
          maxLength: 200
          description: >-
            Specify the email signature for the user. Set to null to remove an
            existing signature.
        customize_info:
          type: object
          description: >-
            Specify user interface customization preferences for the user's
            account.
          properties:
            notes_desc:
              type: boolean
              description: >-
                Specify whether notes should be displayed in descending order
                for the user.\n\nPossible values:\ntrue - Notes are displayed in
                descending order.\nfalse - Notes are not displayed in descending
                order.
            show_left_panel:
              type: boolean
              description: >-
                Specify whether the left panel is displayed in the user
                interface.\n\nPossible values:\ntrue - The left panel is
                shown.\nfalse - The left panel is hidden.
            show_detail_view:
              type: boolean
              description: >-
                Specify whether the detail view panel is displayed for the
                user.\n\nPossible values:\ntrue - The detail view panel is
                displayed.\nfalse - The detail view panel is not displayed.
          additionalProperties: true
        theme:
          type: object
          description: >-
            Specify the theme configuration for the user's CRM interface,
            including color and display settings for the background, screen,
            header, normal tab, and selected tab elements.
          readOnly: true
          properties:
            normal_tab:
              type: object
              description: >-
                Specify the theme settings for the normal (unselected) tab in
                the user's CRM interface, including background color and font
                color.
              properties:
                background:
                  type: string
                  description: >-
                    Specify the background color for the normal tab in the
                    user's theme.
                  format: hex-color
                font_color:
                  type: string
                  description: >-
                    Specify the font color for the normal tab in the user's
                    theme.
                  format: hex-color
              additionalProperties: false
            selected_tab:
              type: object
              description: >-
                Specify the theme settings for the selected tab in the user's
                CRM interface, including background color and font color.
              properties:
                background:
                  type: string
                  description: >-
                    Specify the background color for the selected tab in the
                    user's theme.
                  format: hex-color
                font_color:
                  type: string
                  description: >-
                    Specify the font color for the selected tab in the user's
                    theme.
                  format: hex-color
              additionalProperties: false
            header:
              type: object
              description: >-
                Specify the theme settings for the header area of the user's CRM
                interface, including background color and font color.
              properties:
                background:
                  type: string
                  description: >-
                    Specify the background color for the header area of the
                    user's theme.
                  format: hex-color
                font_color:
                  type: string
                  description: >-
                    Specify the font color for the header area of the user's
                    theme.
                  format: hex-color
              additionalProperties: false
            new_background:
              type:
                - string
                - 'null'
              description: Specify the updated background color for the user's theme.
              format: hex-color
            background:
              type: string
              description: Specify the background color for the user's theme.
              format: hex-color
            screen:
              type: string
              description: Specify the screen type or layout for the user's CRM interface.
              enum:
                - fixed
            type:
              type: string
              description: Specify the type of theme to apply to the user's CRM interface.
              enum:
                - default
                - custom
          additionalProperties: false
      additionalProperties: true
    GetUserDetails:
      type: object
      description: >-
        Represents the details of a Zoho CRM user, including personal
        information, preferences, role, profile, and account settings.
      properties:
        $next_shift:
          description: >-
            Represents the upcoming shift scheduled for the user, including the
            shift's ID and name.
          oneOf:
            - type: object
              x-zs-$id: NextShiftAssigned
              description: >-
                Represents the upcoming shift assigned to the user, identified
                by its unique ID and display name.
              properties:
                name:
                  type: string
                  description: Represents the display name of the user's upcoming shift.
                  maxLength: 80
                id:
                  type: string
                  maxLength: 19
                  description: Represents the unique ID of the user's upcoming shift.
              additionalProperties: false
              required:
                - id
                - name
            - type: 'null'
              description: Indicates that no upcoming shift is assigned to the user.
              x-zs-$id: NoNextShiftAssigned
        $current_shift:
          description: >-
            Represents the shift currently assigned to the user, including the
            shift's ID and name.
          oneOf:
            - type: object
              x-zs-$id: CurrentShiftAssigned
              description: >-
                Represents the current shift assigned to the user, identified by
                its unique ID and display name.
              properties:
                name:
                  type: string
                  description: Represents the display name of the user's current shift.
                  maxLength: 80
                id:
                  type: string
                  format: int64
                  description: Represents the unique ID of the user's current shift.
              additionalProperties: false
              required:
                - id
                - name
            - type: 'null'
              description: Indicates that no current shift is assigned to the user.
              x-zs-$id: NoCurrentShiftAssigned
        $shift_effective_from:
          description: >-
            Represents the date on which the user's upcoming shift becomes
            effective.
          oneOf:
            - x-zs-$id: NextShiftEffectiveFromDate
              type: string
              format: date
              pattern: ([0-9]{4})-([0-9]{2})-([0-9]{2})
              description: >-
                Represents the date from which the upcoming shift assignment
                becomes effective.
            - type: 'null'
              description: Indicates that no upcoming shift effective date is set.
              x-zs-$id: NoNextShiftEffectiveFromDate
        confirm:
          type: boolean
          description: >-
            Indicates whether the user has accepted the invitation to join the
            organization.\n\nPossible values:\ntrue - The user has accepted the
            invitation.\nfalse - The user has not yet accepted the invitation.
          readOnly: true
        date_format:
          type: string
          description: >-
            Represents the user's preferred date format used for displaying date
            values throughout the application.
          enum:
            - dd-MM-yyyy
            - dd/MM/yyyy
            - dd.MM.yyyy
            - dd MM yyyy
            - dd-MM-yy
            - dd/MM/yy
            - dd.MM.yy
            - d.MM.yy
            - d-M-yy
            - d/M/yy
            - d.M.yy
            - d.M.yy.
            - d-M-yyyy
            - d/M/yyyy
            - d.M.yyyy
            - d. M. yyyy.
            - d. M. yyyy
            - d MMM, yyyy
            - dd MMM, yyyy
            - d. MMMM yyyy
            - dd.MM.yyyy.
            - dd.MM.yy.
            - yyyy-MM-dd
            - yyyy/MM/dd
            - yyyy.MM.dd
            - yyyy MM dd
            - yy/MM/dd
            - yy-MM-dd
            - yy.M.d
            - yy-M-d
            - yy. M. d
            - yyyy/M/d
            - yyyy年MM月dd日
            - yy年M月d日
            - yyyy.MM.dd.
            - yyyy. MM. dd
            - MM-dd-yyyy
            - MM/dd/yyyy
            - MM.dd.yyyy
            - MM dd yyyy
            - MM-dd-yy
            - MM/dd/yy
            - M/dd/yy
            - MMM-dd-yyyy
            - MMM dd, yyyy
            - MMM d, yyyy
            - MMMM d, yyyy
            - yyyy.dd.MM
            - yy.d.M
        decimal_separator:
          type: string
          description: >-
            Represents the user's preferred decimal separator character used
            when displaying numerical values.
          enum:
            - Comma
            - Period
        email:
          x-zs-$id: UserEmail
          type: string
          description: Represents the email address associated with the user's account.
          pattern: >-
            ^[\+\-\p{L}\p{M}\p{N}_]([\p{L}\p{M}\p{N}!#$%&'*+\-\/=?^_`{|}~.]*)@(?=.{4,256}$)(([\p{L}\p{N}\p{M}]+)(([\-_]*[\p{L}\p{M}\p{N}])*)[.])+[\p{L}\p{M}]{2,22}$
          maxLength: 100
        first_name:
          oneOf:
            - type: string
              description: Represents the first name of the user.
              maxLength: 50
              x-zs-$id: UserFirstName
            - type: 'null'
              description: Indicates that no first name is set for the user.
              x-zs-$id: NoUserFirstName
          description: >-
            Represents the user's first name. Returns null if no first name is
            set.
        full_name:
          type: string
          readOnly: true
          description: Represents the user's full name.
          maxLength: 100
        id:
          x-zs-$id: UserId
          type: string
          maxLength: 19
          description: Represents the unique identifier of the user.
          readOnly: true
        last_name:
          oneOf:
            - type: string
              description: Represents the last name of the user.
              maxLength: 50
              x-zs-$id: UserLastName
            - type: 'null'
              description: Indicates that no last name is set for the user.
              x-zs-$id: NoUserLastName
          description: >-
            Represents the user's last name. Returns null if no last name is
            set.
        type__s:
          type: string
          description: Represents the account type of the user.
          readOnly: true
          enum:
            - Sandbox Developer User
            - Support User
            - Client Portal User
            - Regular User
            - Team User
            - System User
            - Digital Employee
        profile:
          type: object
          description: >-
            Represents the profile associated with the user, including the
            profile's unique identifier and display name.
          properties:
            name:
              type: string
              description: >-
                Represents the display name of the profile associated with the
                user.
              maxLength: 50
            id:
              type: string
              description: >-
                Represents the unique identifier of the profile associated with
                the user.
              maxLength: 19
          additionalProperties: false
          required:
            - name
            - id
        role:
          type: object
          description: >-
            Represents the role assigned to the user, containing the role's
            unique identifier and display name.
          properties:
            name:
              type: string
              description: Represents the display name of the role assigned to the user.
              maxLength: 200
            id:
              type: string
              description: >-
                Represents the unique identifier of the role assigned to the
                user.
              maxLength: 19
          additionalProperties: false
          required:
            - name
            - id
        status:
          oneOf:
            - readOnly: true
              type: string
              x-zs-$id: UserStatusInGet
              description: >-
                Represents the current status of the user in the Zoho CRM
                organization.
              enum:
                - deleted
                - disabled
                - closed
                - disabled dormant
            - type: string
              x-zs-$id: UserStatusInUpdate
              description: Indicates that no status is set for the user.
              enum:
                - active
                - inactive
          description: >-
            Represents the current status of the user in the Zoho CRM
            organization.

            Possible values:

            active - The user is active and can access the CRM.

            inactive - The user is deactivated and cannot access the CRM.

            deleted - The user account has been deleted.

            disabled - The user account is disabled.

            closed - The user account is closed.

            disabled dormant - The user account is disabled and dormant.
        zuid:
          readOnly: true
          description: >-
            Represents the Zoho User ID (ZUID) associated with the user's Zoho
            account.
          oneOf:
            - x-zs-$id: UserZUID
              type: string
              description: Represents the Zoho User ID (ZUID) associated with the user.
              maxLength: 19
            - type: 'null'
              description: Indicates that no ZUID is associated with the user.
              x-zs-$id: NoUserZUID
        alias:
          oneOf:
            - type: string
              description: Represents the alias or short name associated with the user.
              maxLength: 50
              x-zs-$id: UserAlias
            - type: 'null'
              description: Indicates that no alias is configured for the user.
              x-zs-$id: NoUserAlias
          description: >-
            Represents the alias or short name associated with the user. Returns
            null if no alias is configured.
        created_by:
          oneOf:
            - x-zs-$id: UserCreatedBy
              type: object
              description: >-
                Represents the user who created this user record, identified by
                their unique ID and full name.
              readOnly: true
              properties:
                name:
                  type: string
                  description: >-
                    Represents the full name of the user who created this
                    record.
                  maxLength: 100
                id:
                  type: string
                  description: >-
                    Represents the unique ID of the user who created this
                    record.
                  maxLength: 19
              additionalProperties: false
              required:
                - name
                - id
            - type: 'null'
              description: >-
                Indicates that no creator information is available for this user
                record.
              x-zs-$id: NoUserCreatedBy
          description: >-
            Represents the user who created this user record. Returns null if
            the creator information is not available. Refer to the [Get
            Users](users.yaml#$.paths./users.get) endpoint for details.
        created_time:
          oneOf:
            - type: string
              readOnly: true
              description: >-
                Represents the date and time when this user record was first
                created.
              format: date-time
              x-zs-$id: UserCreatedTime
            - type: 'null'
              description: >-
                Indicates that no creation time is available for this user
                record.
              x-zs-$id: NoUserCreatedTime
          description: >-
            Represents the date and time when this user record was first added
            to the system, in ISO 8601 format. Returns null if the creation time
            is not available.
        locale:
          type: string
          description: Represents the locale of the user.
          enum:
            - in_ID
            - en_IN
