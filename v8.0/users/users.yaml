                      Indicates the error message returned when permission to
                      create a user is denied. Possible values: `permission
                      denied`.
                    type: string
                    enum:
                      - permission denied
                  status:
                    type: string
                    description: >-
                      Indicates the overall response status when access is
                      denied. Possible values: `error`.
                    enum:
                      - error
                additionalProperties: false
              examples:
                NoPermissionToCreateUser:
                  value:
                    code: NO_PERMISSION
                    details:
                      permissions:
                        - Crm_Implied_Manage_Users
                    message: permission denied
                    status: error
                  description: >-
                    Shows the 403 error response returned when the requesting
                    user does not have the Manage Users permission required to
                    create a user.
                  summary: Insufficient permission to create a user
