        ezuid:
          type: string
          description: >-
            Represents the encrypted Zoho User ID (ZUID), used to securely
            identify the user without showing their actual ID.
          maxLength: 100
          readOnly: true
          x-visibility: internal
        image_link:
          type: string
          description: >-
            Represents the URL of the user's profile image as provided by the
            Identity and Access Management (IAM) system.
          maxLength: 100
        sort_order_preference__s:
          type: string
          description: Represents the user's preferred sort order for displaying records.
          enum:
            - First Name,Last Name
            - Last Name,First Name
        Reporting_To:
          oneOf:
            - x-zs-$id: UserReportingTo
              type: object
              description: >-
                Represents the user to whom this user reports, identified by
                their unique ID and full name.
              properties:
                name:
                  type: string
                  description: >-
                    Represents the full name of the user to whom this user
                    reports.
                  maxLength: 100
                id:
                  type: string
                  description: >-
                    Represents the unique ID of the user to whom this user
                    reports.
                  maxLength: 19
              additionalProperties: false
              required:
                - name
                - id
            - type: 'null'
              description: Indicates that no reporting manager is assigned to this user.
              x-zs-$id: NoReportingToUserId
          description: >-
            Represents the user to whom this user reports within the
            organizational hierarchy. Returns null if no reporting manager is
            assigned. Refer to the [Get Users](users.yaml#$.paths./users.get)
            endpoint for details.
        share_among_subordinates:
          type: boolean
          description: >-
            Indicates whether the user's records are shared with their
            subordinates.\n\nPossible values:\ntrue - Records are shared with
            subordinates.\nfalse - Records are not shared with subordinates.
        imap_status:
          type: boolean
          description: >-
            Indicates whether IMAP access is enabled for the user.\nPossible
            values:\ntrue - IMAP access is enabled.\nfalse - IMAP access is
            disabled.
          x-visibility: internal
        time_zone:
          type: string
          description: >-
            Represents the time zone of the user. This value can be updated only
            by the user themselves.
          maxLength: 150
        distance_preference__s:
          type: string
          description: >-
            Represents the user's preferred unit of measurement for displaying
            distance values.
          enum:
            - Kilometers
            - Miles
        default_tab_group:
          type: string
          description: >-
            Represents the default tab group assigned to the user, determining
            which group of tabs is presented upon login.
          maxLength: 100
        signature:
          type:
            - string
            - 'null'
          maxLength: 200
          description: >-
            Represents the email signature configured for the user. Returns null
            if no signature has been set.
        personal_account:
          type: boolean
          description: >-
            Indicates whether the user has a personal account associated with
            their profile.\n\nPossible values:\ntrue - The user has a personal
            account.\nfalse - The user does not have a personal account.
        customize_info:
          type: object
          description: >-
            Represents a collection of user interface customization preferences
            associated with the user's account.
          properties:
            notes_desc:
              type:
                - boolean
                - 'null'
              description: >-
                Indicates whether notes are displayed in descending order for
                the user.\nPossible values:\ntrue - Notes are displayed in
                descending order.\nfalse - Notes are not displayed in descending
                order.
            show_left_panel:
              type:
                - boolean
                - 'null'
              description: >-
                Indicates whether the left panel is displayed in the user
                interface.\n\nPossible values:\ntrue - The left panel is
                shown.\nfalse - The left panel is hidden.
            show_right_panel:
              oneOf:
                - type: string
                  maxLength: 20
                  description: >-
                    Indicates that the right panel is displayed in the user
                    interface.
                  x-zs-$id: ShowRightPanelValue
                - type: 'null'
                  description: >-
                    Indicates that the right panel is not displayed in the user
                    interface.
                  x-zs-$id: ShowRightPanelDefaultValue
              description: >-
                Indicates whether the right panel is displayed in the user
                interface.\n\nPossible values:\ntrue - The right panel is
                shown.\nfalse - The right panel is hidden.
            show_detail_view:
              type: boolean
              description: >-
                Indicates whether the detail view panel is displayed for the
                user.\nPossible values:\ntrue - The detail view panel is
                displayed.\nfalse - The detail view panel is not displayed.
            unpin_recent_item:
              oneOf:
                - type: boolean
                  description: >-
                    Indicates that the recent item is unpinned from its fixed
                    position.
                  x-zs-$id: UnpinRecentItemValue
                - type: 'null'
                  description: >-
                    Indicates that the recent item remains pinned in its fixed
                    position.
                  x-zs-$id: UnpinRecentItemDefaultValue
              description: >-
                Indicates whether the recent item is unpinned from its fixed
                position in the user interface.\n\nPossible values:\ntrue - The
                recent item is unpinned.\nfalse - The recent item remains
                pinned.
            bc_view:
              oneOf:
                - type: boolean
                  description: >-
                    Indicates that the breadcrumb view is displayed for the
                    user.
                  x-zs-$id: BcViewValue
                - type: 'null'
                  description: >-
                    Indicates that the breadcrumb view is not displayed for the
                    user.
                  x-zs-$id: BcViewDefaultValue
              description: >-
                Indicates whether the breadcrumb view is displayed for the
                user.\nPossible values:\ntrue - The breadcrumb view is
                displayed.\nfalse - The breadcrumb view is not displayed.
            show_home:
              type: boolean
              description: >-
                Indicates whether the home screen is displayed for the
                user.\nPossible values:\ntrue - The home screen is
                displayed.\nfalse - The home screen is not displayed.
          additionalProperties: true
        theme:
          type: object
          description: >-
            Represents the theme configuration applied to the user's CRM
            interface. Includes color and display settings for the background,
            screen, header, normal tab, and selected tab elements.
          readOnly: true
          properties:
            normal_tab:
              type: object
              description: >-
                Represents the theme configuration for the normal (unselected)
                tab in the user's CRM interface, including background color and
                font color settings.
              properties:
                background:
                  type: string
                  description: >-
                    Represents the background color of the normal tab in the
                    user's theme.
                  format: hex-color
                font_color:
                  type: string
                  description: >-
                    Represents the font color of the normal tab in the user's
                    theme.
                  format: hex-color
              additionalProperties: false
            selected_tab:
              type: object
              description: >-
                Represents the theme configuration for the currently selected
                tab in the user's CRM interface, including background color and
                font color settings.
              properties:
                background:
                  type: string
                  description: >-
