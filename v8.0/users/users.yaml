openapi: 3.1.0
info:
  title: Users API
  description: >-
    Users are the individuals who access and operate a Zoho CRM organization,
    each assigned a role, profile, and account type that determine their
    permissions and capabilities. This API enables developers to retrieve,
    create, update, and delete user records within a Zoho CRM organization.
  version: '8.0'
  license:
    name: Zoho CRM API License
    url: https://www.zoho.com/crm/developer/docs/api/v8/
servers:
  - url: https://zohoapis.{dc}/crm/{version}
    description: API Server URL
    variables:
      dc:
        enum:
          - com
          - eu
          - in
          - cn
          - au
        default: com
        description: API Server URL TLD
      version:
        default: v8
        description: API Version
paths:
  /users:
    get:
      operationId: getUsers
      summary: Get users
      description: >-
        To retrieve all users in your Zoho CRM organization based on the
        specified filter parameters, including type, role, query criteria, and
        field selection.
      security:
        - OAuth2:
            - ZohoCRM.users.READ
      parameters:
        - $ref: '#/components/parameters/Type'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/IncludeLiteUsers'
        - $ref: '#/components/parameters/RoleId'
        - $ref: '#/components/parameters/QueryId'
        - $ref: '#/components/parameters/ChildData'
        - $ref: '#/components/parameters/Ids'
        - $ref: '#/components/parameters/Fields'
        - name: type__s
          in: query
          style: form
          explode: false
          description: >-
            Filter users by their account type.

            Possible values:

            **Regular User** - Standard CRM user with full access to the
            organization.

            **Sandbox Developer User** - User with access to the sandbox
            environment for development and testing.

            **Team User** - User operating as part of a team account.

            **Digital Employee** - Automated or bot-type user representing a
            digital workforce entity.

            **Support User** - User with access granted for support purposes.

            **Client Portal User** - User with limited access via the
            client-facing portal.
          required: false
          schema:
            type: string
            enum:
              - Regular User
              - Sandbox Developer User
              - Team User
              - Digital Employee
              - Support User
              - Client Portal User
      responses:
        '200':
          description: >-
            Returns user records matching the specified filter parameters. The
            response body contains a list of user objects and an info object.
          content:
            application/json:
              schema:
                x-zs-$id: UsersGetResponse
                type: object
                description: >-
                  Contains the paginated response for the getUsers operation.
                  Includes a list of user objects and an info object.
                properties:
                  users:
                    maxItems: 200
                    type: array
                    description: >-
                      List of user objects, each representing an individual Zoho
                      CRM user returned by the query.
                    items:
                      $ref: '#/components/schemas/GetUserDetails'
                  info:
                    $ref: '#/components/schemas/Info'
                additionalProperties: false
              examples:
                UsersGetResponse:
                  summary: Successful retrieval of a paginated list of users
                  value:
                    users:
                      - role:
                          name: CEO
                          id: '111133000000000861'
                        microsoft: false
                        locale: en_US
                        Modified_By:
                          name: Thuvassshhhh test test
                          id: '111133000000057662'
                        $shift_effective_from: null
                        $current_shift:
                          id: '111133000000012345'
                          name: Morning Shift
                        alias: aaaa
                        id: '111133000000057662'
                        sandboxDeveloper: false
                        first_name: Thuvassshhhh
                        email: user@example.com
                        Reporting_To: null
                        status_reason__s: null
                        decimal_separator: Period
                        created_time: '2025-11-12T11:20:12+05:30'
                        Modified_Time: '2025-12-08T16:53:16+05:30'
                        image_link: >-
                          https://profile.csez.zohocorpin.com/file?ID=43318041&fs=thumb
                        $next_shift:
                          id: '111133000000023456'
                          name: Evening Shift
                        profile:
                          name: Administrator
                          id: '111133000000000497'
                        last_name: test test
                        created_by:
                          name: Thuvassshhhh test test
                          id: '111133000000057662'
                        zuid: '43318041'
                        confirm: true
                        full_name: Thuvassshhhh test test
                        phone: null
                        date_format: MM/dd/yyyy
                        status: disabled
                        type__s: Regular User
                    info:
                      per_page: 200
                      count: 1
                      page: 1
                      more_records: false
                  description: >-
                    A successful response contains a paginated list of Zoho CRM
                    users, each with identity, role, profile, locale, and
                    preference details.
        '204':
          description: >-
            Returns no content when no users match the specified filter
            criteria.
        '400':
          description: >-
            Invalid query parameter or missing required dependent parameter.
            **Resolution:** The query_id parameter must contain a valid
            identifier, and the child_data dependent parameter must be provided
            alongside it.
          content:
            application/json:
              schema:
                x-zs-$id: UsersGetBadRequestResponse
                oneOf:
                  - $ref: '#/components/schemas/UsersGetInvalidParamResponse'
                  - $ref: '#/components/schemas/UsersGetDependentFieldMissingResponse'
                description: >-
                  The request contains an invalid or missing parameter. The
                  INVALID_DATA error occurs when the query_id parameter has an
                  invalid value. The DEPENDENT_PARAM_MISSING error occurs when
                  query_id is provided but the required child_data dependent
                  parameter is absent.
              examples:
                InvalidDataErrorResponse:
                  value:
                    code: INVALID_DATA
                    details:
                      param_name: query_id
                    message: Invalid queryId
                    status: error
                  description: >-
                    Shows a 400 error when the query_id parameter contains an
                    invalid value.
                  summary: 400 error for an invalid query_id parameter value
                DependentFieldMissingErrorResponse:
                  value:
                    code: DEPENDENT_PARAM_MISSING
                    details:
                      dependee:
                        param_name: child_data
                      param_name: query_id
                    message: Dependent Param missing
                    status: error
                  description: >-
                    Shows a 400 error when a required dependent parameter is
                    missing. This example demonstrates the response when
                    query_id is provided but the required child_data dependent
                    parameter is absent.
                  summary: Missing required dependent parameter triggers a 400 error
    post:
      operationId: createUser
      description: >-
        To create a new user record in your Zoho CRM organization. The request
        body must contain a `users` array with one user object including the
        required fields such as email, role, profile, and first name.
      summary: Create User
      security:
        - OAuth2:
            - ZohoCRM.users.CREATE
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: >-
                Represents the request payload schema for creating a user in
                Zoho CRM. Contains the `users` array with user detail objects.
              properties:
                users:
                  maxItems: 1
                  type: array
                  description: >-
                    The request body must contain a `users` array. You can
                    include a maximum of one object per request.
                  items:
                    $ref: '#/components/schemas/UserDetails'
              additionalProperties: false
              required:
                - users
            examples:
              UserAdded:
                value:
                  users:
                    - first_name: rfdc2
                      email: user@example.com
                      role:
                        name: CEO
                        id: '2922942000000015966'
                      profile:
                        name: Administrator
                        id: '2922942000000015972'
                      $invitation_details:
                        COMPANYLOGOURL: >-
                          https://static.zohocdn.com/crm/CRMClient/images/crm_logonew_18ad4a6d3fca927f423b0a15f6dbc241_.svg
                        COMPANYNAME: ZohoCRM
                        DISPLAYNAME: User 1
                description: >-
                  Demonstrates a sample request body for creating a new user
                  with the required fields including first name, email, role,
                  profile, last name, name format, and sort order preference.
                summary: Create User Request
        description: The request body must contain a `users` array with one object.
      responses:
        '201':
          description: >-
            Returns the result of the user creation request, including the
            unique ID of the newly created user.
          content:
            application/json:
              schema:
                x-zs-$id: CreateUserSuccessResponse
                description: >-
                  Represents the response payload schema returned upon
                  successful user creation. Contains the `users` array with the
                  result objects.
                type: object
                properties:
                  users:
                    type: array
                    maxItems: 1
                    description: >-
                      Contains the result of the user creation request,
                      including the status, response code, confirmation message,
                      and the unique ID of the newly created user.
                    items:
                      description: >-
                        Represents the outcome of the user creation request.
                        Each object contains a status indicating success, a
                        response code, a confirmation message, and a object that
                        holds the unique ID of the newly created user.
                      type: object
                      properties:
                        code:
                          type: string
                          description: >-
                            Indicates the result code for the user creation
                            request. Possible values: `SUCCESS`.
                          enum:
                            - SUCCESS
                        details:
                          type: object
                          description: >-
                            Contains additional information about the created
                            user, including the unique ID assigned to the user
                            record in Zoho CRM.
                          properties:
                            id:
                              x-zs-$id: UserResultId
                              type: string
                              description: >-
                                Represents the unique ID of the user record
                                created in Zoho CRM.
                              maxLength: 19
                          required:
                            - id
                          additionalProperties: false
                        message:
                          type: string
                          description: >-
                            Indicates the confirmation message returned upon
                            successful user creation. Possible values: `User
                            added`.
                          enum:
                            - User added
                        status:
                          type: string
                          description: >-
                            Indicates the overall status of the user creation
                            request. Possible values: `success`.
                          enum:
                            - success
                      additionalProperties: false
                additionalProperties: false
              examples:
                UserCreatedSuccessfully:
                  value:
                    users:
                      - code: SUCCESS
                        details:
                          id: '111113000000071587'
                        message: User added
                        status: success
                  description: >-
                    Shows the response returned after a user is successfully
                    added to the CRM organization, including the unique ID of
                    the new user record.
                  summary: Successful user creation response
        '400':
          description: >-
            The request contains invalid, missing, or unsupported field values.

            **Resolution:** The invalid field details are available in the
            `users[].details` object. The request must be corrected and
            resubmitted.
          content:
            application/json:
              schema:
                x-zs-$id: CreateUserBadRequestResponse
                description: >-
                  Represents the response payload schema returned when a user
                  creation request fails. Contains the `users` array with error
                  result objects.
                type: object
                properties:
                  users:
                    type: array
                    maxItems: 1
                    description: >-
                      Contains one or more error objects returned when the user
                      creation request fails validation or cannot be processed.
                    items:
                      description: >-
                        Represents an error result for the user creation
                        request. Each object contains an error code, a
                        descriptive message, and a `details` object with
                        additional context about the failure.
                      oneOf:
                        - x-zs-$id: CreateUserInvalidDataError
                          type: object
                          description: >-
                            Represents an error result returned when the user
                            creation request contains invalid data (code:
                            `INVALID_DATA`).
                          properties:
                            code:
                              type: string
                              description: >-
                                Represents the error classification code
                                returned when a user creation request contains
                                invalid data.

                                Possible values: INVALID_DATA.
                              enum:
                                - INVALID_DATA
                            details:
                              type: object
                              description: >-
                                Contains additional context about the validation
                                error, including the affected field API name,
                                JSON path, maximum permitted length, expected
                                data type, and applicable date range
                                constraints.
                              properties:
                                api_name:
                                  type: string
                                  description: >-
                                    Represents the API name of the request field
                                    that triggered the validation error.
                                  maxLength: 100
                                json_path:
                                  type: string
                                  description: >-
                                    Represents the JSON path of the request
                                    field that triggered the validation error.
                                  maxLength: 200
                                maximum_length:
                                  type: integer
                                  description: >-
                                    Represents the maximum number of characters
                                    permitted for the field that triggered the
                                    validation error.
                                  format: int32
                                expected_data_type:
                                  type: string
                                  description: >-
                                    Represents the data type that was expected
                                    for the field that triggered the validation
                                    error.
                                  maxLength: 100
                                range:
                                  type: object
                                  description: >-
                                    Contains the acceptable date range for the
                                    field that triggered the validation error,
                                    expressed as a start date and an end date.
                                  properties:
                                    from:
                                      type: string
                                      description: >-
                                        Represents the start date of the
                                        acceptable date range for the field that
                                        triggered the validation error.
                                      format: date
                                    to:
                                      type: string
                                      description: >-
                                        Represents the end date of the
                                        acceptable date range for the field that
                                        triggered the validation error.
                                      format: date
                                  additionalProperties: false
                              additionalProperties: true
                            message:
                              type: string
                              description: >-
                                Represents the message describing the nature of
                                the validation error encountered during user
                                creation.
                              enum:
                                - invalid data
                                - INVALID_DATA
                                - Give a proper time zone value
                                - >-
                                  This email address is already registered with
                                  another datacenter and cannot be registered
                                  with this account's data centre US
                                - >-
                                  Invalid Email Id. Please choose a different
                                  email id
                                - >-
                                  Email Id should not contain @zoho.com. Please
                                  choose a different email id
                                - Special Characters Found
                                - Pattern not matched
                                - >-
                                  Effective from should be greater than current
                                  date
                                - Effective from should be less than 6 months
                                - >-
                                  Invalid data. Valid values are
                                  Comma/Period/Space (Not case-sensitive)
                                - >-
                                  Invalid data. Valid values are Comma/Period
                                  (Not case-sensitive)
                                - Valid date format should be given
                                - >-
                                  Shift effective from date should be greater
                                  than Current Shift date
                            status:
                              type: string
                              description: >-
                                Indicates the status of the user creation
                                request. Possible values: `error`.
                              enum:
                                - error
                          required:
                            - code
                            - message
                            - status
                          additionalProperties: false
                        - x-zs-$id: CreateUserDependentFieldMissingError
                          type: object
                          description: >-
                            Represents an error result returned when a dependent
                            field value is null or missing (code:
                            `DEPENDENT_MISMATCH`).
                          properties:
                            code:
                              type: string
                              description: >-
                                Indicates the error code identifying a dependent
                                field value mismatch condition. Possible values:
                                `DEPENDENT_MISMATCH`.
                              enum:
                                - DEPENDENT_MISMATCH
                            details:
                              type: object
                              description: >-
                                Contains additional context about the dependent
                                field mismatch error, including the API name and
                                JSON path of the offending field and information
                                about the field it depends on.
                              properties:
                                dependee:
                                  type: object
                                  description: >-
                                    Contains the API name and JSON path of the
                                    field upon which the erroring field depends.
                                  properties:
                                    api_name:
                                      type: string
                                      description: >-
                                        Represents the API name of the field
                                        upon which the erroring field depends.
                                      maxLength: 100
                                    json_path:
                                      type: string
                                      description: >-
                                        Represents the JSON path of the field
                                        upon which the erroring field depends.
                                      maxLength: 200
                                  additionalProperties: false
                                api_name:
                                  type: string
                                  description: >-
                                    Represents the API name of the field
                                    associated with the dependent field mismatch
                                    error.
                                  maxLength: 100
                                json_path:
                                  type: string
                                  description: >-
                                    Represents the JSON path of the field
                                    associated with the dependent field mismatch
                                    error.
                                  maxLength: 200
                              additionalProperties: true
                            message:
                              type: string
                              description: >-
                                Indicates the error message returned when a
                                dependent field value is missing. Possible
                                values: `Dependent Field value should not be
                                null`.
                              enum:
                                - Dependent Field value should not be null
                            status:
                              type: string
                              description: >-
                                Indicates the status of the user creation
                                request. Possible values: `error`.
                              enum:
                                - error
                          required:
                            - code
                            - message
                            - status
                          additionalProperties: false
                        - x-zs-$id: CreateUserUnapprovableError
                          type: object
                          description: >-
                            Represents an error result returned when a user
                            cannot be created due to an unapproved account type
                            or external account restriction (code:
                            `UNAPPROVABLE`).
                          properties:
                            code:
                              type: string
                              description: >-
                                Indicates the error code returned when the user
                                type cannot be approved for creation. Possible
                                values: `UNAPPROVABLE`.
                              enum:
                                - UNAPPROVABLE
                            details:
                              type: object
                              description: >-
                                Contains additional context about the
                                unapprovable user creation error.
                              additionalProperties: true
                            message:
                              type: string
                              description: >-
                                Indicates the error message returned when a user
                                cannot be added from the CRM interface for
                                certain account types. Possible values: `Cannot
                                add user for ZohoOne account from CRM. Kindly
                                add user through ZohoOne`, `Cannot add user for
                                CRMPlus account from CRM. Kindly add user
                                through CRMPlus`.
                              enum:
                                - >-
                                  Cannot add user for ZohoOne account from CRM.
                                  Kindly add user through ZohoOne
                                - >-
                                  Cannot add user for CRMPlus account from CRM.
                                  Kindly add user through CRMPlus
                            status:
                              type: string
                              description: >-
                                Indicates the status of the user creation
                                request. Possible values: `error`.
                              enum:
                                - error
                          required:
                            - code
                            - message
                            - status
                          additionalProperties: false
                        - x-zs-$id: CreateUserNotAllowedError
                          type: object
                          description: >-
                            Represents an error result returned when the user
                            creation operation is not allowed for the specified
                            context or user type (code: `NOT_ALLOWED`).
                          properties:
                            code:
                              type: string
                              description: >-
                                Indicates the error code identifying an
                                operation that is not permitted. Possible
                                values: `NOT_ALLOWED`.
                              enum:
                                - NOT_ALLOWED
                            details:
                              type: object
                              description: >-
                                Contains additional context about the
                                not-allowed error, including the API name and
                                JSON path of the field that triggered the
                                restriction.
                              properties:
                                api_name:
                                  type: string
                                  description: >-
                                    Represents the API name of the field that
                                    triggered the not-allowed error.
                                  maxLength: 100
                                json_path:
                                  type: string
                                  description: >-
                                    Represents the JSON path of the field that
                                    triggered the not-allowed error.
                                  maxLength: 200
                              additionalProperties: true
                            message:
                              type: string
                              description: >-
                                Indicates the error message returned when a user
                                creation attempt is not allowed for the
                                specified user type or organization context.
                                Possible values: `You cannot create user in a
                                sandbox org`, `Support user cannot be added`,
                                `System user cannot be added`, `the id given
                                seems to be already deleted`, `current shift and
                                next shift should not be same`.
                              enum:
                                - You cannot create user in a sandbox org
                                - Support user cannot be added
                                - System user cannot be added
                                - the id given seems to be already deleted
                                - >-
                                  current shift and next shift should not be
                                  same
                            status:
                              type: string
                              description: >-
                                Indicates the status of the user creation
                                request. Possible values: `error`.
                              enum:
                                - error
                          required:
                            - code
                            - message
                            - status
                          additionalProperties: false
                        - x-zs-$id: CreateUserNotSupportedError
                          type: object
                          description: >-
                            Represents an error result returned when a field or
                            operation is not supported for the user type being
                            created (code: `NOT_SUPPORTED`).
                          properties:
                            code:
                              type: string
                              description: >-
                                Indicates the error code returned when the
                                requested operation is not supported for the
                                user type. Possible values: `NOT_SUPPORTED`.
                              enum:
                                - NOT_SUPPORTED
                            details:
                              type: object
                              description: >-
                                Contains additional context about the
                                not-supported error, including the API name and
                                JSON path of the field that triggered the
                                restriction.
                              properties:
                                api_name:
                                  type: string
                                  description: >-
                                    Represents the API name of the field that
                                    triggered the not-supported error.
                                  maxLength: 100
                                json_path:
                                  type: string
                                  description: >-
                                    Represents the JSON path of the field that
                                    triggered the not-supported error.
                                  maxLength: 200
                              additionalProperties: true
                            message:
                              type: string
                              description: >-
                                Indicates the error message returned when an
                                update to a restricted field is attempted
                                through the API. Possible values: `type__s is
                                cannot be updated by api`, `Created by &
                                Modified by fields cannot be updated by api`.
                              enum:
                                - type__s is cannot be updated by api
                                - >-
                                  Created by & Modified by fields cannot be
                                  updated by api
                            status:
                              type: string
                              description: >-
                                Indicates the status of the user creation
                                request. Possible values: `error`.
                              enum:
                                - error
                          required:
                            - code
                            - message
                            - status
                          additionalProperties: false
                        - x-zs-$id: CreateUserMandatoryNotFoundError
                          type: object
                          description: >-
                            Represents an error result returned when a required
                            field is missing from the request (code:
                            `MANDATORY_NOT_FOUND`).
                          properties:
                            code:
                              type: string
                              description: >-
                                Indicates the error code returned when a
                                required field is missing in the request.
                                Possible values: `MANDATORY_NOT_FOUND`.
                              enum:
                                - MANDATORY_NOT_FOUND
                            details:
                              type: object
                              description: >-
                                Contains additional context about the mandatory
                                field missing error.
                              additionalProperties: true
                            message:
                              type: string
                              description: >-
                                Indicates the error message returned when a
                                required company detail is missing from the
                                request. Possible values: `Company Name is
                                required`.
                              enum:
                                - Company Name is required
                            status:
                              type: string
                              description: >-
                                Indicates the status of the user creation
                                request. Possible values: `error`.
                              enum:
                                - error
                          required:
                            - code
                            - message
                            - status
                          additionalProperties: false
                        - x-zs-$id: CreateUserLicenseLimitExceededError
                          type: object
                          description: >-
                            Represents an error result returned when the request
                            exceeds the account license limit for users (code:
                            `LICENSE_LIMIT_EXCEEDED`).
                          properties:
                            code:
                              type: string
                              description: >-
                                Indicates the error code returned when the
                                request exceeds the account license limit for
                                users. Possible values:
                                `LICENSE_LIMIT_EXCEEDED`.
                              enum:
                                - LICENSE_LIMIT_EXCEEDED
                            details:
                              type: object
                              description: >-
                                Contains additional context about the license
                                limit exceeded error.
                              additionalProperties: true
                            message:
                              type: string
                              description: >-
                                Indicates the error message returned when the
                                license limit for users is exceeded. Possible
                                values: `Request exceeds your license limit.
                                Need to upgrade in order to add a user`,
                                `Request exceeds your license limit. Need to
                                upgrade in order to add a team user`.
                              enum:
                                - >-
                                  Request exceeds your license limit. Need to
                                  upgrade in order to add a user
                                - >-
                                  Request exceeds your license limit. Need to
                                  upgrade in order to add a team user
                            status:
                              type: string
                              description: >-
                                Indicates the status of the user creation
                                request. Possible values: `error`.
                              enum:
                                - error
                          required:
                            - code
                            - message
                            - status
                          additionalProperties: false
                        - x-zs-$id: CreateUserDuplicateDataError
                          type: object
                          description: >-
                            Represents an error result returned when the email
                            address submitted is already associated with an
                            existing user (code: `DUPLICATE_DATA`).
                          properties:
                            code:
                              type: string
                              description: >-
                                Indicates the error code returned when a
                                duplicate user email address is detected.
                                Possible values: `DUPLICATE_DATA`.
                              enum:
                                - DUPLICATE_DATA
                            details:
                              type: object
                              description: >-
                                Contains additional context about the duplicate
                                data error.
                              additionalProperties: true
                            message:
                              type: string
                              description: >-
                                Indicates the error message returned when a user
                                with the same email address already exists.
                                Possible values: `Failed to add user since same
                                email id is already present`.
                              enum:
                                - >-
                                  Failed to add user since same email id is
                                  already present
                            status:
                              type: string
                              description: >-
