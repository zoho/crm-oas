                    enum:
                      - permission denied
                      - You can't perform this action over a closed/deleted user
                      - >-
                        User deletion is not allowed for the org because of
                        CrmKeyValue entry RESTRICT_USER_DELETION_FOR_THE_ORG &
                        deleted users count exceeded 10
                  status:
                    description: |-
                      Indicates the status of the API request.
                      Possible values:
                      error - The request failed.
                    type: string
                    enum:
                      - error
                additionalProperties: false
              examples:
                PermissionDeniedResponse:
                  value:
                    code: NO_PERMISSION
                    details:
                      permissions:
                        - Crm_Implied_Manage_Users
                    message: permission denied
                    status: error
                  description: >-
                    Shows the PERMISSION_DENIED error response returned when the
                    authenticated caller profile does not include the permission
                    required to delete users in the Zoho CRM organization.
                  summary: >-
                    Delete request denied due to insufficient profile
                    permissions
                DeletingClosedOrDeletedUser:
                  value:
                    code: PERMISSION_DENIED
                    details: {}
                    message: You can't perform this action over a closed/deleted user
                    status: error
                  description: >-
                    Shows the 403 error response returned when the DELETE
                    request targets a user belonging to a closed or deleted Zoho
                    CRM organization, rendering the operation forbidden.
                  summary: Delete attempt targeting a closed or deleted organization
                DeletionLimitExceededForOrg:
                  value:
                    code: PERMISSION_DENIED
                    details: {}
                    message: >-
                      User deletion is not allowed for the org because of
                      CrmKeyValue entry RESTRICT_USER_DELETION_FOR_THE_ORG &
                      deleted users count exceeded 10
                    status: error
                  description: >-
                    Shows the 403 error response returned when the Zoho CRM
                    organization has reached the maximum allowable number of
                    user deletions, preventing further delete operations.
                  summary: >-
                    Delete request rejected because the organization deletion
                    limit is exceeded
components:
  parameters:
    User:
      name: user
      in: path
      description: Specify the unique ID of the user to retrieve, update, or delete.
      required: true
      schema:
        x-zs-$ref:
          resource: users
          origins:
            - operationId: getUsers
              propertyId: UserId
        type: string
        maxLength: 19
        description: Represents the unique identifier of the user.
    PerPage:
      name: per_page
      in: query
      description: Specify the number of user records to return per page.
      required: false
      schema:
        type: integer
        format: int32
    Page:
      name: page
      in: query
      description: Specify the page number to retrieve in the paginated response.
      required: false
      schema:
        type: integer
        format: int32
    Type:
      name: type
      in: query
      description: >-
        Specify the type of users to retrieve.

        Possible values:

        CurrentUser - Retrieves the currently authenticated user.

        DeletedUsers - Retrieves only deleted users.

        DeactiveUsers - Retrieves only deactivated users.

        NotConfirmedUsers - Retrieves only unconfirmed users.

        ConfirmedUsers - Retrieves only confirmed users.

        ActiveUsers - Retrieves only active users.

        AdminUsers - Retrieves only administrator users.

        ActiveConfirmedAdmins - Retrieves active, confirmed, and administrator
        users.

        ActiveConfirmedUsers - Retrieves active and confirmed users.

        DeveloperUsers - Retrieves only developer users.

        AllUsers - Retrieves all users.

        AllActiveUsers - Retrieves all active users.

        ActiveLiteUser - Retrieves active lite users.

        ActiveAndDeactive - Retrieves both active and deactivated users.

        ChildRoleUsers - Retrieves users belonging to child roles.

        ParentRoleUsers - Retrieves users belonging to the parent role.

        SubordinateRoleUsers - Retrieves users in subordinate roles.

        ConfirmedReportingUsers - Retrieves confirmed users who have reporting
        relationships.
      required: false
      schema:
        type: string
        enum:
          - CurrentUser
          - DeletedUsers
          - DeactiveUsers
          - NotConfirmedUsers
          - ConfirmedUsers
          - ActiveUsers
          - AdminUsers
          - ActiveConfirmedAdmins
          - ActiveConfirmedUsers
          - DeveloperUsers
          - AllUsers
          - AllActiveUsers
          - ActiveLiteUser
          - ActiveAndDeactive
          - ChildRoleUsers
          - ParentRoleUsers
          - SubordinateRoleUsers
          - ConfirmedReportingUsers
    IncludeLiteUsers:
      name: include_lite_users
      in: query
      description: >-
        Specify whether to include lite users in the result set.\n\nPossible
        values:\ntrue - Lite users are included.\nfalse - Lite users are not
        included.
      required: false
      schema:
        type: boolean
    RoleId:
      name: role_id
      in: query
      description: >-
        Specify the role ID to filter users. The API retrieves users with the
        specified role and higher or lower roles based on the value of the
        **type** parameter. Applicable only for **ParentRoleUsers**,
        **ChildRoleUsers**, and **SubordinateRoleUsers** types.
      required: false
      schema:
        x-zs-$ref:
          resource: roles
          origins:
            - operationId: getRoles
              propertyId: RoleId
        description: 'Represents the unique ID of the role. '
        type: string
        maxLength: 19
    QueryId:
      name: query_id
      in: query
      description: >-
        Specify the query ID of the user lookup field. Used to retrieve users
        based on the filter criteria of the lookup field.
      required: false
      schema:
        type: string
        format: int64
    ChildData:
      name: child_data
      in: query
      description: >-
        Specify the child data object containing the record ID of the module
        with a user lookup field. This is required only if the user lookup field
        has criteria based on the dynamic value of a record. The **query_id**
        parameter is required when this parameter is provided.
      required: false
      schema:
        type: object
        properties:
          id:
            type: string
            format: int64
            description: Record ID of the module with user look up field
            x-zs-$ref:
              resource: record
              origins:
                - operationId: getRecords
                  propertyId: RecordsId
        required:
          - id
        additionalProperties: true
    Ids:
      name: ids
      in: query
      description: >-
        Specify a comma-separated list of user IDs to retrieve. If not provided,
        the API retrieves all users based on the other parameters.
      required: false
      style: form
      explode: false
      schema:
        type: array
        minItems: 1
        maxItems: 100
        items:
          type: string
          description: Represents the unique ID of a user in the Zoho CRM organization.
          x-zs-$ref:
            resource: users
            origins:
              - operationId: getUsers
                propertyId: UserId
          maxLength: 19
    Fields:
      name: fields
      in: query
      description: >-
        Specify the comma-separated list of field API names to include in the
        response.
      required: false
      style: form
      explode: false
      schema:
        type: string
        maxLength: 3000
        example: First_Name,Last_Name,Email,Isonline
        x-zs-$ref:
          resource: fields
          origins:
            - operationId: getFields
              propertyId: FieldsApiName
        description: >-
          API name of the resource. It will start with alphabets and can contain
          alphanumeric characters and underscores.
        pattern: ^[A-Za-z][A-Za-z0-9_]*$
    TypeS:
      name: type__s
      in: query
      description: |-
        Specify the account type of the users to retrieve.
        Possible values:
        Sandbox Developer User - User with access to the sandbox environment.
        Support User - User with support access.
        Client Portal User - External client portal user.
        Regular User - Standard CRM user.
        Team User - User operating as part of a team account.
        System User - User designated as a system-level account.
        Digital Employee - Automated or digital worker account.
      required: false
      schema:
        type: string
        description: |-
          Represents the type of the user account.
          Possible values:
          **Regular User** - A standard CRM user.
          **System User** - A system-level user account.
          **Sandbox Developer User** - A user with sandbox developer access.
          **Support User** - A support-level user account.
          **Client Portal User** - A user with client portal access.
          **Team User** - A user account used for team-level access.
        readOnly: true
        enum:
          - Sandbox Developer User
          - Support User
          - Client Portal User
          - Regular User
          - Team User
          - System User
          - Digital Employee
  headers: {}
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://accounts.zoho.com/oauth/v2/auth
          tokenUrl: https://accounts.zoho.com/oauth/v2/token
          refreshUrl: https://accounts.zoho.com/oauth/v2/token
          scopes:
            ZohoCRM.users.DELETE: Grants permission to delete users from the Zoho CRM organization.
            ZohoCRM.users.CREATE: >-
              Grants permission to create new users in the Zoho CRM
              organization.
            ZohoCRM.users.UPDATE: >-
              Grants permission to update existing users' details in the Zoho
              CRM organization.
            ZohoCRM.users.READ: >-
              Grants permission to read and retrieve user details from the Zoho
              CRM organization.
  schemas:
    UserDetails:
      type: object
      description: >-
        Represents the user details object used to create or update a Zoho CRM
        user, including personal information, preferences, role, profile, and
        account settings.
      properties:
        $next_shift:
          description: >-
            Specify the upcoming shift to be assigned to the user. Set to null
            to clear the upcoming shift.
          oneOf:
            - type: object
              x-zs-$id: NextShiftDetails
              description: >-
                Represents the upcoming shift object with the shift ID and
                display name to assign to the user.
              properties:
                name:
                  type: string
                  description: >-
                    Specify the display name of the shift to assign as the
                    upcoming shift.
                  maxLength: 80
                id:
                  type: string
                  format: int64
                  description: >-
                    Specify the unique ID of the shift to assign as the upcoming
                    shift.
                  x-zs-$ref:
                    resource: shift_hours
                    origins:
                      - operationId: getShifts
                        propertyId: ShiftsId
                  pattern: ^[0-9]+$
                  maxLength: 100
              additionalProperties: false
              required:
                - id
                - name
            - type: 'null'
              description: Indicates that no upcoming shift is assigned to the user.
              x-zs-$id: NoNextShiftDetails
        $current_shift:
          description: >-
            Specify the current shift assigned to the user. Set to null to clear
            the assigned shift.
          oneOf:
            - type: object
              x-zs-$id: CurrentShiftDetials
              description: >-
                Represents the current shift object with the shift ID and
                display name to assign to the user.
              properties:
                name:
                  type: string
                  description: >-
                    Specify the display name of the shift to assign as the
                    current shift.
                  maxLength: 80
                id:
                  type: string
                  maxLength: 19
                  description: >-
                    Specify the unique ID of the shift to assign as the current
                    shift.
                  x-zs-$ref:
                    resource: shift_hours
                    origins:
                      - operationId: getShifts
                        propertyId: ShiftsId
                  pattern: ^[0-9]+$
              additionalProperties: false
              required:
                - id
                - name
            - type: 'null'
              description: Indicates that no current shift is assigned to the user.
              x-zs-$id: NoCurrentShiftUpdate
        $shift_effective_from:
          description: >-
            Specify the date on which the upcoming shift assignment becomes
            effective.
          oneOf:
            - x-zs-$id: NextShiftEffectiveFromDateUpdate
              type: string
              format: date
              pattern: ([0-9]{4})-([0-9]{2})-([0-9]{2})
              description: >-
                Represents the date on which the upcoming shift assignment
                becomes effective.
            - type: 'null'
              description: Indicates that no upcoming shift effective date is set.
              x-zs-$id: NoNextShiftEffectiveFromDateUpdate
        date_format:
          type: string
          description: Specify the user's preferred date format for displaying date values.
          x-zs-llm-description: >
            Valid values are system-defined picklist options available in the
            Fields Get API (Users module). Call the Fields Get API with
            module=Users to retrieve the complete set of supported  date
            formats. Use 'reference_value'. (api_name :date_format ).
          enum:
            - dd-MM-yyyy
            - dd/MM/yyyy
            - dd.MM.yyyy
            - dd MM yyyy
            - dd-MM-yy
            - dd/MM/yy
            - dd.MM.yy
            - d.MM.yy
            - d-M-yy
            - d/M/yy
            - d.M.yy
            - d.M.yy.
            - d-M-yyyy
            - d/M/yyyy
            - d.M.yyyy
            - d. M. yyyy.
            - d. M. yyyy
            - d MMM, yyyy
            - dd MMM, yyyy
            - d. MMMM yyyy
            - dd.MM.yyyy.
            - dd.MM.yy.
            - yyyy-MM-dd
            - yyyy/MM/dd
            - yyyy.MM.dd
            - yyyy MM dd
            - yy/MM/dd
            - yy-MM-dd
            - yy.M.d
            - yy-M-d
            - yy. M. d
            - yyyy/M/d
            - yyyy年MM月dd日
            - yy年M月d日
            - yyyy.MM.dd.
            - yyyy. MM. dd
            - MM-dd-yyyy
            - MM/dd/yyyy
            - MM.dd.yyyy
            - MM dd yyyy
            - MM-dd-yy
            - MM/dd/yy
            - M/dd/yy
            - MMM-dd-yyyy
            - MMM dd, yyyy
            - MMM d, yyyy
            - MMMM d, yyyy
            - yyyy.dd.MM
            - yy.d.M
        decimal_separator:
          type: string
          description: >-
            Specify the user's preferred decimal separator character for
            displaying numerical values.
          x-zs-llm-description: >
            Valid values are system-defined picklist options available in the
            Fields Get API (Users module). Call the Fields Get API with
            module=Users to retrieve the complete set of supported decimal
            separator options. Use 'actual_value'. (api_name :decimal_separator
            ). 
          enum:
            - Comma
            - Period
        email:
          type: string
          description: Specify the email address for the user's account.
          pattern: >-
            ^[\+\-\p{L}\p{M}\p{N}_]([\p{L}\p{M}\p{N}!#$%&'*+\-\/=?^_`{|}~.]*)@(?=.{4,256}$)(([\p{L}\p{N}\p{M}]+)(([\-_]*[\p{L}\p{M}\p{N}])*)[.])+[\p{L}\p{M}]{2,22}$
          maxLength: 100
        first_name:
          type: string
          description: Specify the user's first name.
          maxLength: 50
        full_name:
          type: string
          readOnly: true
          description: Specify the user's full name.
          maxLength: 100
        id:
          type: string
          maxLength: 19
          description: Represents the unique identifier of the user record.
          readOnly: true
        last_name:
          oneOf:
            - type: string
              description: Represents the last name to set for the user.
              maxLength: 50
              x-zs-$id: UserLastNameUpdate
            - type: 'null'
              description: Indicates that the last name should be cleared.
              x-zs-$id: NoUserLastNameUpdate
          description: >-
            Specify the user's last name. Set to null if no last name is to be
            stored.
        profile:
          type: object
          description: >-
            Specify the profile to assign to the user, including the profile's
            unique identifier and display name.
          properties:
            name:
              type: string
              description: Specify the display name of the profile to assign to the user.
              maxLength: 50
            id:
              type: string
              description: Specify the unique ID of the profile to assign to the user.
              maxLength: 19
              x-zs-$ref:
                resource: profiles
                origins:
                  - operationId: getProfiles
                    propertyId: ProfileId
              format: int64
              pattern: ^[0-9]{1,19}$
              minLength: 1
              example: '4832675000000850800'
          additionalProperties: false
          required:
            - name
            - id
        role:
          type: object
          description: >-
            Specify the role to assign to the user, including the role's unique
            identifier and display name.
          properties:
            name:
              type: string
              description: Specify the display name of the role to assign to the user.
              maxLength: 200
            id:
              type: string
              description: Specify the unique ID of the role to assign to the user.
              maxLength: 19
              x-zs-$ref:
                resource: roles
                origins:
                  - operationId: getRoles
                    propertyId: RoleId
          additionalProperties: false
          required:
            - name
            - id
        status:
          type: string
          x-zs-$id: UserStatusUpdate
          description: Specify the status of the user account.
          x-zs-llm-description: >
            Valid values are system-defined picklist options available in the
            Fields Get API (Users module). Call the Fields Get API with
            module=Users to retrieve the complete set of available status
            values. Use 'reference_value'. (api_name :status ).
          enum:
            - active
            - inactive
        alias:
          oneOf:
            - type: string
              description: Represents the alias or short name to assign to the user.
              maxLength: 50
              x-zs-$id: UserAliasUpdate
            - type: 'null'
              description: Indicates that no alias is set for the user.
              x-zs-$id: NoUserAliasUpdate
          description: >-
            Specify an alias or short name for the user. Set to null to remove
            an existing alias.
        locale:
          type: string
          description: Specify the locale for the user.
          x-zs-llm-description: >
            Valid values are system-defined picklist options available in the
            Fields Get API (Users module). Call the Fields Get API with
            module=Users to retrieve the complete set of supported locales. Use
            'actual_value'. (api_name :locale ).
          enum:
            - in_ID
            - zh_CN
            - zh_TW
            - da_DK
            - de_DE
            - en_GB
            - en_US
            - es_ES
            - fr_FR
            - iw_IL
            - hr_HR
