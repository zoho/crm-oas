            Represents the total number of user records returned in the current
            response.
          format: int32
        page:
          type: integer
          description: Represents the current page number in the paginated response.
          format: int32
        more_records:
          type: boolean
          description: >-
            Indicates whether additional records are available beyond the
            current page.\n\nPossible values:\ntrue - More records are available
            on subsequent pages.\nfalse - No more records are available.
