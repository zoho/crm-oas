    put:
      operationId: updateSingleUser
      description: >-
        To update the details of a specific user in your Zoho CRM organization
        by user ID.
      summary: Update a single user by user ID
      parameters:
        - $ref: '#/components/parameters/User'
      security:
        - OAuth2:
            - ZohoCRM.users.UPDATE
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: >-
                Represents the structure of the user update request body.
                Contains a users array with the details of the user to update.
              properties:
                users:
                  maxItems: 1
                  type: array
                  description: >-
                    Specify the user details to update. Only one user record can
                    be submitted per request.
                  items:
                    $ref: '#/components/schemas/UserDetails'
              additionalProperties: false
              required:
                - users
            examples:
              UserAdded:
                value:
                  users:
                    - first_name: rfdc2
                      email: user@example.com
                      role:
                        name: CEO
                        id: '2922942000000015966'
                      profile:
                        name: Administrator
                        id: '2922942000000015972'
                description: >-
                  Shows a sample request body for updating an individual user
                  with their ID and the fields to modify.
                summary: Update Single User Request
        description: The request body must contain a users array with one object.
      responses:
        '200':
          description: >-
            Returns the result of the user update operation, including the
            status and unique ID of the updated user.
          content:
            application/json:
              schema:
                x-zs-$id: UpdateSingleUserSuccessResponse
                description: >-
                  Represents the structure of the user update success response.
                  Contains a users array with the outcome of the update
                  operation.
                type: object
                properties:
                  users:
                    type: array
                    maxItems: 10
                    description: >-
                      Represents the list of outcome objects returned after
                      processing the user update request. Each element reports
                      the result status for the updated user record.
                    items:
                      description: >-
                        Represents the outcome of a single user update
                        operation. Contains the status code, a message, the
                        unique identifier of the updated user, and the overall
                        request status.
                      type: object
                      properties:
                        code:
                          type: string
                          description: >-
                            Indicates the API-level result code for the user
                            update operation.


                            Possible values:

                            SUCCESS - The user record updates successfully.
                          enum:
                            - SUCCESS
                        details:
                          type: object
                          description: >-
                            Represents an object containing identifying
                            information about the updated user. Includes the
                            unique ID of the user.
                          properties:
                            id:
                              type: string
                              description: >-
                                Represents the unique system-generated
                                identifier of the updated user.
                              maxLength: 19
                          required:
                            - id
                          additionalProperties: false
                        message:
                          type: string
                          description: >-
                            Indicates the message describing the outcome of the
                            user update operation.


                            Possible values:

                            User updated - The user record updates successfully.
                          enum:
                            - User updated
                        status:
                          type: string
                          description: >-
                            Indicates the overall processing status of the user
                            update request.


                            Possible values:

                            success - The request processes and the user record
                            updates without errors.
                          enum:
                            - success
                      additionalProperties: false
                additionalProperties: false
              examples:
                UserUpdatedSuccessfully:
                  value:
                    users:
                      - code: SUCCESS
                        details:
                          id: '111113000000071587'
                        message: User updated
                        status: success
                  description: >-
                    Shows a successful single user update response including the
                    updated user ID and confirmation of the update.
                  summary: Single User Updated Successfully
