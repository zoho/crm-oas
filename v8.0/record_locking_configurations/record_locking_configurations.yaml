  /settings/record_locking_configurations/{id}:
    put:
      operationId: updateRecordLockingConfigurationPassingIdInURL
      description: >-
        Updates an existing record locking configuration for the specified
        module using the configuration ID provided in the URL path.
      summary: Update specific record locking configuration
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: module
          in: query
          required: true
          description: >-
            API name of the module. Use the [Get Modules
            API](modules.yaml#$.paths./settings/modules.get) to retrieve module
            names.
          schema:
            type: string
            maxLength: 256
            examples:
              - Leads
              - Contacts
      security:
        - OAuth2:
            - ZohoCRM.settings.record_locking_configurations.UPDATE
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: Request body for updating a record locking configuration.
              additionalProperties: false
              properties:
                record_locking_configurations:
                  type: array
                  maxItems: 1
                  description: Array containing the updated configuration.
                  items:
                    type: object
                    additionalProperties: false
                    description: The configuration object to update.
                    properties:
                      lock_type:
                        type: string
                        enum:
                          - automatic
                          - manual
                          - both
                        description: >-
                          Defines the locking mode. `automatic` locks records
                          based on rules, `manual` requires explicit action,
                          `both` supports both.
                      locked_for:
                        type: string
                        enum:
                          - all_profiles
                          - all_profiles_except_excluded_profiles
                        description: Indicates which profiles the lock applies to.
                      restricted_actions:
                        type: array
