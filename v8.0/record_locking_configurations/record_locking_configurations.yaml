                    maxItems: 1
                    items:
                      type: object
                      additionalProperties: false
                      description: Details of the record locking configuration.
                      properties:
                        lock_type:
                          type: string
                          enum:
                            - automatic
                            - manual
                            - both
                          description: The locking mode used for this configuration.
                        locked_for:
                          type: string
                          enum:
                            - all_profiles
                            - all_profiles_except_excluded_profiles
                          description: Indicates which profiles the lock applies to.
                        restricted_actions:
                          type: array
                          maxItems: 5
                          description: >-
                            List of actions that are restricted on locked
                            records.
                          items:
                            type: string
                            enum:
                              - change_owner
                              - update
                              - delete
                              - tags
                              - convert
                            description: A restricted action.
                        created_time:
                          type: string
                          format: date-time
                          description: Timestamp when the configuration was created.
                        excluded_fields:
                          type: array
                          maxItems: 15
                          description: Fields that are exempt from locking.
                          items:
                            type: object
                            additionalProperties: false
                            description: Minimal details of an excluded field.
                            properties:
                              api_name:
                                type: string
                                description: API name of the excluded field.
                                maxLength: 256
                              id:
                                type: string
                                description: Unique identifier of the excluded field.
                                maxLength: 32
                            required:
                              - api_name
                              - id
                        feature_type:
                          type: string
                          enum:
                            - record_locking
                          default: record_locking
                          description: Feature type identifier (always `record_locking`).
                        locking_rules:
                          type: array
                          maxItems: 5
                          description: List of locking rules defined in the configuration.
                          items:
                            type: object
                            description: Details of a locking rule.
                            additionalProperties: false
                            properties:
                              name:
                                type: string
                                maxLength: 256
                                description: Name of the locking rule.
                              id:
                                type: string
                                description: Unique identifier of the locking rule.
                                maxLength: 32
                              lock_existing_records:
                                type: boolean
                                default: false
                                description: >-
                                  Indicates whether existing records are locked
                                  when the rule is applied.
                              criteria:
                                type: object
                                additionalProperties: false
                                description: >-
                                  Criteria that records must match for the rule
                                  to apply.
                                properties:
                                  comparator:
                                    type: string
                                    description: The comparator used in the criteria.
                                    maxLength: 256
                                  field:
                                    type: object
                                    description: Details of the field used in the criteria.
                                    additionalProperties: false
                                    properties:
                                      api_name:
                                        type: string
                                        description: API name of the field.
                                        maxLength: 256
                                      id:
                                        type: string
                                        description: Unique identifier of the field.
                                        maxLength: 32
                                    required:
                                      - api_name
                                      - id
                                  type:
                                    type: string
                                    description: Type of the criteria.
                                    maxLength: 256
                                  value: {}
                                required:
                                  - comparator
                                  - field
                                  - type
                            required:
                              - name
                              - id
                              - lock_existing_records
                        modified_time:
                          type: string
                          format: date-time
                          description: Timestamp when the configuration was last modified.
                        restricted_communications:
                          type: array
                          description: >-
                            List of communication actions restricted on locked
                            records.
                          maxItems: 1
                          items:
                            type: string
                            enum:
                              - send_mail
                            description: A restricted communication action.
                        system_defined:
                          type: boolean
                          description: >-
                            Indicates whether the configuration is
                            system-defined.
                        created_by:
                          type: object
                          additionalProperties: false
                          description: User who created the configuration.
                          properties:
                            name:
                              type: string
                              description: Name of the user.
                              maxLength: 256
                            id:
                              type: string
                              description: Unique identifier of the user.
                              maxLength: 32
                          required:
                            - name
                            - id
                        modified_by:
                          type: object
                          additionalProperties: false
                          description: User who last modified the configuration.
                          properties:
                            name:
                              type: string
                              description: Name of the user.
                              maxLength: 256
                            id:
                              type: string
                              description: Unique identifier of the user.
                              maxLength: 32
                          required:
                            - name
                            - id
                        id:
                          type: string
                          description: Unique identifier of the configuration.
                          maxLength: 32
                        restricted_custom_buttons:
                          type:
                            - array
                            - 'null'
                          description: >-
                            List of custom buttons restricted on locked records
                            (may be null).
                          items:
                            type: object
                            additionalProperties: false
                            description: Minimal details of a restricted custom button.
                            properties:
                              name:
                                type: string
                                description: Name of the custom button.
                                maxLength: 256
                              id:
                                type: string
                                description: Unique identifier of the custom button.
                                maxLength: 32
                            required:
                              - id
                        lock_excluded_profiles:
                          type: array
                          maxItems: 15
                          description: Profiles that are excluded from locking.
                          items:
                            type: object
                            additionalProperties: false
                            description: Minimal details of an excluded profile.
                            properties:
                              name:
                                type: string
                                description: Name of the profile.
                                maxLength: 256
                              id:
                                type: string
                                description: Unique identifier of the profile.
                                maxLength: 32
                            required:
                              - name
                              - id
                        lock_for_portal_users:
                          type: boolean
                          default: true
                          description: >-
                            Indicates whether portal users are subject to
                            locking.
                      required:
                        - lock_type
                        - locked_for
                        - created_time
                        - excluded_fields
                        - feature_type
                        - locking_rules
                        - modified_time
                        - system_defined
                        - created_by
                        - modified_by
                        - id
                        - lock_for_portal_users
                        - restricted_communications
                        - restricted_custom_buttons
                        - restricted_actions
                        - lock_excluded_profiles
                required:
                  - record_locking_configurations
