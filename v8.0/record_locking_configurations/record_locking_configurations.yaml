    put:
      operationId: updateRecordLockingConfiguration
      description: >-
        Updates an existing record locking configuration for the specified
        module. You can modify any of the configuration settings.
      summary: Update record locking configuration
      parameters:
        - $ref: '#/components/parameters/Module'
      security:
        - OAuth2:
            - ZohoCRM.settings.record_locking_configurations.UPDATE
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: Request body for updating a record locking configuration.
              additionalProperties: false
              properties:
                record_locking_configurations:
                  type: array
                  maxItems: 1
                  description: Array containing the updated record locking configuration.
                  items:
                    type: object
                    additionalProperties: false
                    description: The record locking configuration object to update.
                    properties:
                      lock_type:
                        type: string
                        enum:
                          - automatic
                          - manual
                          - both
                        description: >-
                          Defines the locking mode. `automatic` locks records
                          based on rules, `manual` requires explicit action,
                          `both` supports both.
                      locked_for:
                        type: string
                        enum:
                          - all_profiles
                          - all_profiles_except_excluded_profiles
                        description: >-
                          Indicates which profiles the lock applies to. Use
                          `all_profiles` for everyone, or
                          `all_profiles_except_excluded_profiles` to exclude
                          specific profiles.
                      restricted_actions:
                        type: array
                        maxItems: 10
                        description: List of actions that are restricted on locked records.
                        items:
                          type: string
                          enum:
                            - change_owner
                            - update
                            - delete
                            - tags
                          default: update
                          description: >-
                            A restricted action that is prohibited on locked
                            records.
                      excluded_fields:
                        type: array
                        maxItems: 15
                        description: >-
                          Fields that are exempt from locking. Even if a record
                          is locked, these fields can still be modified.
                        items:
                          type: object
                          additionalProperties: false
                          description: >-
                            Field descriptor for a field to be excluded from
                            locking.
                          properties:
                            id:
                              description: >-
                                The unique identifier of the field. Use the [Get
                                Fields Metadata
                                API](fields.yaml#$.paths./settings/fields.get)
                                to retrieve field IDs.
                              x-zs-$ref:
                                resource: fields
                                origins:
                                  - operationId: getFields
                                    propertyId: FieldsId
                              type: string
                              format: int64
                              example: '1385208000000973001'
                          required:
                            - id
                      feature_type:
                        type: string
                        enum:
                          - record_locking
                        default: record_locking
                        description: Feature type identifier. Must be `record_locking`.
                      locking_rules:
                        type: array
                        maxItems: 5
                        description: >-
                          A set of rules that define when records should be
                          automatically locked.
                        items:
                          type: object
                          additionalProperties: false
                          description: A locking rule object.
                          properties:
                            name:
                              type: string
                              description: Unique name for the locking rule.
                              maxLength: 256
                            id:
                              type: string
                              description: >-
                                Unique identifier of the locking rule. Required
                                when updating an existing rule.
                              maxLength: 32
                            lock_existing_records:
                              type: boolean
                              default: false
                              description: >-
                                If `true`, existing records that match the
                                criteria will also be locked when the rule is
                                saved.
                            criteria:
                              type: object
                              additionalProperties: true
                              description: >-
                                Criteria that records must satisfy for the rule
                                to apply.
                          required:
                            - name
                            - criteria
                      restricted_communications:
                        type: array
                        maxItems: 10
                        description: >-
                          List of communication actions that are restricted for
                          locked records.
                        items:
                          type: string
                          enum:
                            - send_mail
                          description: A restricted communication action.
                      id:
                        type: string
                        description: >-
                          Unique identifier of the record locking configuration
                          to update. This field is required.
                        maxLength: 32
                      lock_excluded_profiles:
                        type: array
                        maxItems: 15
                        description: >-
                          Profiles that are excluded from locking. This property
                          is required when `locked_for` is
                          `all_profiles_except_excluded_profiles`.
                        items:
                          type: object
                          additionalProperties: false
                          description: >-
                            Profile descriptor for a profile to be excluded from
                            locking.
                          properties:
                            id:
                              description: >-
                                Profile ID. Use the [Get Profiles
                                API](profiles.yaml#$.paths./settings/profiles.get)
                                to retrieve profile IDs.
                              x-zs-$ref:
                                resource: profiles
                                origins:
                                  - operationId: getProfiles
                                    propertyId: ProfileId
                              type: string
                              format: int64
                              pattern: ^[0-9]{1,19}$
                              minLength: 1
                              maxLength: 19
                              example: '4832675000000850800'
                          required:
                            - id
                      lock_for_portal_users:
                        type: boolean
                        default: true
                        description: >-
                          If `true`, portal users are also subject to the
                          locking restrictions.
                    required:
                      - id
              required:
                - record_locking_configurations
            examples:
              RequestBody:
                summary: Request body for updating a record locking configuration
                value:
                  record_locking_configurations:
                    - id: '2000000066499'
                      lock_type: both
                      locked_for: all_profiles
                      restricted_actions:
                        - update
                        - delete
                        - change_owner
                      excluded_fields:
                        - id: '2000000004846'
                        - id: '2000000004924'
                      feature_type: record_locking
                      locking_rules:
                        - name: High Value Deal Lock
                          id: '2000000066513'
                          lock_existing_records: true
                          criteria:
                            amount:
                              gte: 50000
                      restricted_communications:
                        - send_mail
                      lock_excluded_profiles:
                        - id: '2000000000497'
                        - id: '2000000000499'
                      lock_for_portal_users: true
        required: true
      responses:
        '200':
          description: >-
            Successfully updated the record locking configuration for the
            specified module.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                x-zs-$id: UpdateRecordLockingConfiguration200Response
                description: Response object for a successful configuration update.
                properties:
                  record_locking_configurations:
                    type: array
