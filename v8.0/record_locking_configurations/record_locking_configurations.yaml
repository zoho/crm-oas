                            - SUCCESS
                          maxLength: 256
                          description: Success code for the operation.
                        message:
                          type: string
                          maxLength: 256
                          description: Informational message about the update.
                        details:
                          type: object
                          additionalProperties: false
                          description: Additional details about the updated configuration.
                          properties:
                            id:
                              type: string
                              maxLength: 256
                              description: Unique identifier of the updated configuration.
                          required:
                            - id
                      required:
                        - status
                        - code
                        - message
                        - details
                required:
                  - record_locking_configurations
              examples:
