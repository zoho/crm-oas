    get:
      operationId: getRecordLockingConfiguration
      description: >-
        Retrieves the existing record locking configuration for the specified
        module.
      summary: Get record locking configuration
      parameters:
        - $ref: '#/components/parameters/Module'
      security:
        - OAuth2:
            - ZohoCRM.settings.record_locking_configurations.READ
      responses:
        '200':
          description: >-
            Successfully retrieved the record locking configuration details for
            the specified module.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                x-zs-$id: GetRecordLockingConfiguration200Response
