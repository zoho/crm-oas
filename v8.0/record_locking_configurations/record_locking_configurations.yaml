openapi: 3.1.0
info:
  title: Record Locking Configuration
  description: >-
    Record locking configuration allows you to set up the configuration needed
    to lock the records in modules manually or automatically when certain
    conditions are met. This API enables you to configure and manage record
    locking rules for modules in Zoho CRM. You can lock records manually,
    automatically based on criteria, or both, and define which actions, fields,
    profiles, and communications are restricted when records are locked.
  version: '8'
servers:
  - url: https://zohoapis.{dc}/crm/{version}
    description: API Server URL
    variables:
      dc:
        enum:
          - com
          - eu
          - in
          - cn
          - au
        default: com
        description: API Server URL TLD
      version:
        default: v8
        description: API Version
paths:
  /settings/record_locking_configurations:
    post:
      operationId: createRecordLockingConfiguration
      description: >-
        Creates a new record locking configuration for the specified module. You
        can define locking rules, restricted actions, excluded fields, and other
        settings.
      summary: Create record locking configuration
      parameters:
        - $ref: '#/components/parameters/Module'
      security:
        - OAuth2:
            - ZohoCRM.settings.record_locking_configurations.CREATE
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              description: Request body for creating a record locking configuration.
              properties:
                record_locking_configurations:
                  type: array
                  maxItems: 1
                  description: >-
                    Array containing the record locking configuration details to
                    be created.
                  items:
                    type: object
                    additionalProperties: true
                    description: >-
                      Object representing the record locking configuration to
                      create.
                    properties:
                      lock_type:
                        type: string
                        enum:
                          - automatic
                          - manual
                          - both
                        description: >-
                          Defines the locking mode. `automatic` locks records
                          based on rules, `manual` requires explicit action,
                          `both` supports both.
                      locked_for:
                        type: string
                        enum:
                          - all_profiles
                          - all_profiles_except_excluded_profiles
                        description: >-
                          Indicates which profiles the lock applies to. Use
                          `all_profiles` for everyone, or
                          `all_profiles_except_excluded_profiles` to exclude
                          specific profiles.
                      restricted_actions:
                        type: array
                        maxItems: 10
                        description: >-
                          List of actions that are restricted on locked records.
                          These actions cannot be performed on locked records.
                        items:
                          type: string
                          enum:
                            - change_owner
                            - update
                            - delete
                            - tags
                          default: update
                          description: >-
                            A restricted action that is prohibited on locked
                            records.
                      excluded_fields:
                        type: array
                        maxItems: 15
                        description: >-
                          Fields that are exempt from locking. Even if a record
                          is locked, these fields can still be modified.
                        items:
                          type: object
                          additionalProperties: false
                          description: >-
                            Field descriptor for a field to be excluded from
                            locking.
                          properties:
                            id:
                              description: >-
                                The unique identifier of the field. Use the [Get
                                Fields Metadata
                                API](fields.yaml#$.paths./settings/fields.get)
                                to retrieve field IDs.
                              x-zs-$ref:
                                resource: fields
                                origins:
                                  - operationId: getFields
                                    propertyId: FieldsId
                              type: string
                              format: int64
                              example: '1385208000000973001'
                          required:
                            - id
                      feature_type:
                        type: string
                        enum:
                          - record_locking
                        default: record_locking
                        description: >-
                          Feature type identifier. Must be `record_locking` for
                          this configuration.
                      locking_rules:
                        type: array
                        maxItems: 5
                        description: >-
                          A set of rules that define when records should be
                          automatically locked. Each rule contains criteria that
                          records must match to be locked.
                        items:
                          type: object
                          additionalProperties: false
                          description: A locking rule object.
                          properties:
                            name:
                              type: string
                              description: Unique name for the locking rule.
                              maxLength: 256
                            lock_existing_records:
                              type: boolean
                              default: false
                              description: >-
                                If `true`, existing records that match the
                                criteria will also be locked when the rule is
                                saved.
                            criteria:
                              type: object
                              additionalProperties: true
                              description: >-
                                Criteria that records must satisfy for the rule
                                to apply. The structure depends on the field
                                type and operator.
                          required:
                            - name
                            - criteria
                      restricted_communications:
                        type: array
                        maxItems: 10
                        items:
                          type: string
                          enum:
                            - send_mail
                          description: >-
                            A restricted communication action that is prohibited
                            on locked records.
                        description: >-
                          List of communication actions that are restricted for
                          locked records.
                      restricted_custom_buttons:
                        type: array
                        maxItems: 30
                        description: >-
                          List of custom buttons that are restricted on locked
                          records. These buttons cannot be used on locked
                          records.
                        items:
                          type: object
                          additionalProperties: false
                          description: Descriptor of a restricted custom button.
                          properties:
                            id:
                              description: Unique identifier of the custom button.
                              x-zs-$ref:
                                resource: custom_button_api
                                origins:
                                  - operationId: getCustomButtons
                                    propertyId: CustomButtonId
                              type: string
                              format: int64
                              maxLength: 19
                          required:
                            - id
                      lock_excluded_profiles:
                        type: array
                        maxItems: 15
                        description: >-
                          Profiles that are excluded from locking. These
                          profiles can still edit locked records. This property
                          is required when `locked_for` is
                          `all_profiles_except_excluded_profiles`.
                        items:
                          type: object
                          additionalProperties: false
                          description: >-
                            Profile descriptor for a profile to be excluded from
                            locking.
                          properties:
                            id:
                              description: >-
                                Profile ID. Use the [Get Profiles
                                API](profiles.yaml#$.paths./settings/profiles.get)
                                to retrieve profile IDs.
                              x-zs-$ref:
                                resource: profiles
                                origins:
                                  - operationId: getProfiles
                                    propertyId: ProfileId
                              type: string
                              format: int64
                              pattern: ^[0-9]{1,19}$
                              minLength: 1
                              maxLength: 19
                              example: '4832675000000850800'
                          required:
                            - id
                      lock_for_portal_users:
                        type: boolean
                        default: true
                        description: >-
                          If `true`, portal users are also subject to the
                          locking restrictions.
                    required:
                      - lock_type
              required:
                - record_locking_configurations
            examples:
              RequestBody:
                summary: Request body for creating a record locking configuration
                value:
                  record_locking_configurations:
                    - lock_type: automatic
                      locked_for: all_profiles
                      restricted_actions:
                        - update
                        - delete
                      excluded_fields:
                        - id: '2000000004846'
                        - id: '2000000004924'
                      feature_type: record_locking
                      locking_rules:
                        - name: HighValueDealsRule
                          lock_existing_records: true
                          criteria:
                            field: Amount
                            operator: greater_than
                            value: 50000
                        - name: CriticalStatusRule
                          criteria:
                            field: Status
                            operator: equals
                            value: Critical
                      restricted_communications:
                        - send_mail
                      restricted_custom_buttons:
                        - id: '2000000034237'
                        - id: '2000000034564'
                      lock_excluded_profiles:
                        - id: '2000000000497'
                        - id: '2000000000495'
                      lock_for_portal_users: true
        required: true
      responses:
        '201':
          description: >-
            Successfully created the record locking configuration for the
            specified module.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                x-zs-$id: CreateRecordLockingConfiguration201Response
                description: Response object for a successful configuration creation.
                properties:
                  record_locking_configurations:
                    type: array
                    description: >-
                      Array containing details of the created record locking
                      configuration.
                    maxItems: 1
                    items:
                      type: object
                      additionalProperties: false
                      description: Details of the created record locking configuration.
                      properties:
                        status:
                          type: string
                          enum:
                            - success
                          description: >-
                            Indicates that the creation operation was
                            successful.
                        code:
                          type: string
                          enum:
                            - SUCCESS
                          description: Success code for the operation.
                        message:
                          type: string
                          description: Informational message about the creation.
                          maxLength: 255
                        details:
                          type: object
                          additionalProperties: false
                          description: Additional details about the created configuration.
                          properties:
                            id:
                              type: string
                              description: >-
                                Unique identifier of the newly created record
                                locking configuration.
                              maxLength: 255
                          required:
                            - id
                      required:
                        - status
                        - code
                        - message
                        - details
                required:
                  - record_locking_configurations
              examples:
                SuccessCase:
                  summary: >-
                    Successful response for creating a record locking
                    configuration
                  value:
                    record_locking_configurations:
                      - code: SUCCESS
                        details:
                          id: '431525000001114019'
                        message: record locking configuration created successfully
                        status: success
        '400':
          description: >-
            Bad Request - The request could not be processed due to invalid
            syntax, missing parameters, or invalid data.
          content:
            application/json:
              schema:
                type: object
                x-zs-$id: CreateRecordLockingConfiguration400ResponseWrapper
                additionalProperties: true
                oneOf:
                  - type: object
                    x-zs-$id: CreateRecordLockingConfiguration400Response1
                    additionalProperties: false
                    description: >-
                      Simple error envelope for parameter, module, or permission
                      errors.
                    properties:
                      code:
                        type: string
                        description: Error code that identifies the failure reason.
                        maxLength: 256
                        enum:
                          - INVALID_MODULE
                          - REQUIRED_PARAM_MISSING
                          - INVALID_DATA
                          - FEATURE_NOT_SUPPORTED
                          - NO_PERMISSION
                          - NOT_SUPPORTED
                          - LIMIT_EXCEEDED
                          - MANDATORY_NOT_FOUND
                          - DEPENDENT_FIELD_MISSING
                          - DUPLICATE_DATA
                      message:
                        type: string
                        description: An error message explaining the issue.
                        maxLength: 256
                      status:
                        type: string
                        description: Status indicator, always `error`.
                        enum:
                          - error
                      details:
                        description: Additional information that varies by error code.
                        oneOf:
                          - type: object
                            additionalProperties: false
                            x-zs-$id: >-
                              CreateRecordLockingConfiguration400Response1ParamMissingDetails
                            description: Indicates which parameter is missing.
                            properties:
                              param_name:
                                type: string
                                description: Name of the missing parameter.
                                maxLength: 256
                            required:
                              - param_name
                          - type: object
                            additionalProperties: false
                            x-zs-$id: >-
                              CreateRecordLockingConfiguration400Response1ResourcePathIndexDetails
                            description: Indicates which path element is invalid.
                            properties:
                              resource_path_index:
                                type: integer
                                format: int32
                                description: Index of the invalid path element.
                            required:
                              - resource_path_index
                          - type: object
                            additionalProperties: false
                            x-zs-$id: >-
                              CreateRecordLockingConfiguration400Response1PermissionDetails
                            description: >-
                              Lists required permissions when permission is
                              denied.
                            properties:
                              permissions:
                                type: array
                                description: >-
                                  List of permissions required to perform the
                                  operation.
                                maxItems: 1
                                items:
                                  type: string
                                  maxLength: 256
                                  description: A required permission name.
                            required:
                              - permissions
                          - type: object
                            additionalProperties: false
                            x-zs-$id: >-
                              CreateRecordLockingConfiguration400Response1LimitExceededDetails
                            description: Provides limit details when a limit is exceeded.
                            properties:
                              limit:
                                type: integer
                                description: The maximum allowed value.
                                format: int32
                              available_limit:
                                type: integer
                                description: Remaining available capacity, if applicable.
                                format: int32
                              param_name:
                                type: string
                                maxLength: 256
                                description: >-
                                  Parameter name that hit the limit (e.g.,
                                  module).
                            required:
                              - limit
                          - type: object
                            additionalProperties: false
                            x-zs-$id: >-
                              CreateRecordLockingConfiguration400Response1EmptyDetails
                            description: Empty details object used by some error codes.
                    required:
                      - code
                      - message
                      - status
                      - details
                  - type: object
                    additionalProperties: false
                    x-zs-$id: CreateRecordLockingConfiguration400Response2
                    description: >-
                      Array-wrapped error envelope for
                      record-locking-configuration errors.
                    properties:
                      record_locking_configurations:
                        type: array
                        maxItems: 1
                        description: >-
                          Array containing a single error object for the
                          configuration item.
                        items:
                          type: object
                          additionalProperties: false
                          description: Error object for a specific locking configuration.
                          properties:
                            code:
                              type: string
                              description: Error code for the configuration error.
                              maxLength: 256
                              enum:
                                - INVALID_DATA
                                - NOT_SUPPORTED
                                - LIMIT_EXCEEDED
                                - DEPENDENT_FIELD_MISSING
                                - MANDATORY_NOT_FOUND
                                - EXPECTED_FIELD_MISSING
                                - AMBIGUITY_DURING_PROCESSING
                                - DUPLICATE_DATA
                            details:
                              description: >-
                                Detailed metadata for the configuration error.
                                The structure varies by error type.
                              oneOf:
                                - type: object
                                  x-zs-$id: >-
                                    CreateRecordLockingConfiguration400Response2FieldDetail
                                  additionalProperties: false
                                  description: >-
                                    Indicates a field-related error with API
                                    name and JSON path.
                                  properties:
                                    api_name:
                                      type: string
                                      maxLength: 256
                                      description: API name of the field involved.
                                    json_path:
                                      type: string
                                      maxLength: 256
                                      description: >-
                                        JSON path pointing to the location of
                                        the error.
                                  required:
                                    - api_name
                                    - json_path
                                - type: object
                                  additionalProperties: false
                                  x-zs-$id: >-
                                    CreateRecordLockingConfiguration400Response2SupportedValuesDetail
                                  description: >-
                                    Lists supported values when an invalid value
                                    is provided.
                                  properties:
                                    supported_values:
                                      type: array
                                      description: List of allowed values.
                                      maxItems: 15
                                      items:
                                        type: string
                                        maxLength: 256
                                        description: A supported value.
                                    api_name:
                                      type: string
                                      maxLength: 256
                                      description: API name of the field.
                                    json_path:
                                      type: string
                                      maxLength: 256
                                      description: JSON path to the error location.
                                  required:
                                    - supported_values
                                    - api_name
                                    - json_path
                                - type: object
                                  additionalProperties: false
                                  x-zs-$id: >-
                                    CreateRecordLockingConfiguration400Response2LimitExceededNestedDetail
                                  description: >-
                                    Provides limit details for nested arrays
                                    (locking rules, excluded fields, etc.).
                                  properties:
                                    limit:
                                      type: integer
                                      description: Maximum allowed count.
                                      format: int32
                                    available_limit:
                                      type: integer
                                      description: Remaining available count, if positive.
                                      format: int32
                                    api_name:
                                      type: string
                                      maxLength: 256
                                      description: >-
                                        API name of the array that exceeded the
                                        limit.
                                    json_path:
                                      type: string
                                      maxLength: 256
                                      description: JSON path to the array location.
                                  required:
                                    - limit
                                    - api_name
                                    - json_path
                                - type: object
                                  additionalProperties: false
                                  x-zs-$id: >-
                                    CreateRecordLockingConfiguration400Response2DependeeDetail
                                  description: Indicates a missing dependent field.
                                  properties:
                                    dependee:
                                      type: object
                                      additionalProperties: false
                                      description: >-
                                        Information about the field that is
                                        causing the dependency.
                                      properties:
                                        api_name:
                                          type: string
                                          maxLength: 256
                                          description: API name of the dependee field.
                                        json_path:
                                          type: string
                                          maxLength: 256
                                          description: JSON path of the dependee field.
                                      required:
                                        - api_name
                                        - json_path
                                    api_name:
                                      type: string
                                      maxLength: 256
                                      description: API name of the missing dependent field.
                                    json_path:
                                      type: string
                                      maxLength: 256
                                      description: >-
                                        JSON path of the missing dependent
                                        field.
                                  required:
                                    - dependee
                                    - api_name
                                    - json_path
                                - type: object
                                  additionalProperties: false
                                  x-zs-$id: >-
                                    CreateRecordLockingConfiguration400Response2ExpectedFieldsDetail
                                  description: >-
                                    Lists expected fields when both `id` and
                                    `api_name` are missing.
                                  properties:
                                    expected_fields:
                                      type: array
                                      maxItems: 15
                                      description: >-
                                        List of expected field descriptors (each
                                        with JSON path and API name).
                                      items:
                                        type: object
                                        additionalProperties: false
                                        description: Descriptor for an expected field.
                                        properties:
                                          json_path:
                                            type: string
                                            maxLength: 256
                                            description: JSON path of the expected field.
                                          api_name:
                                            type: string
                                            maxLength: 256
                                            description: API name of the expected field.
                                        required:
                                          - json_path
                                          - api_name
                                  required:
                                    - expected_fields
                                - type: object
                                  additionalProperties: false
                                  x-zs-$id: >-
                                    CreateRecordLockingConfiguration400Response2AmbiguityDueToDetail
                                  description: >-
                                    Indicates ambiguity when `id` and `api_name`
                                    refer to different fields.
                                  properties:
                                    ambiguity_due_to:
                                      type: array
                                      maxItems: 15
                                      description: List of ambiguous field descriptors.
                                      items:
                                        type: object
                                        additionalProperties: false
                                        description: Descriptor for an ambiguous field.
                                        properties:
                                          json_path:
                                            type: string
                                            maxLength: 256
                                            description: JSON path of the ambiguous field.
                                          api_name:
                                            type: string
                                            maxLength: 256
                                            description: API name of the ambiguous field.
                                        required:
                                          - json_path
                                          - api_name
                                  required:
                                    - ambiguity_due_to
                                - type: object
                                  additionalProperties: false
                                  x-zs-$id: >-
                                    CreateRecordLockingConfiguration400Response2MinimalDetail
                                  description: >-
                                    Minimal details fallback when no specific
                                    fields apply.
                            message:
                              type: string
                              maxLength: 256
                              description: An error message explaining the issue.
                            status:
                              type: string
                              enum:
                                - error
                              description: Status indicator, always `error`.
                          required:
                            - code
                            - details
                            - message
                            - status
                description: >-
                  Union of a simple error object or an array-wrapped error
                  envelope.
              examples:
                RequiredParamMissing:
                  summary: Missing required `module` parameter
                  value:
                    code: REQUIRED_PARAM_MISSING
                    details:
                      param_name: module
                    message: One of the expected parameter is missing
                    status: error
                InvalidModuleData:
                  summary: Invalid module name provided
                  value:
                    code: INVALID_MODULE
                    details: {}
                    message: the module name given seems to be invalid
                    status: error
                NotSupportedModule:
                  summary: Module does not support record locking
                  value:
                    code: NOT_SUPPORTED
                    details:
                      param_name: module
                    message: the module name given is not supported for the  feature
                    status: error
                InvalidFieldData:
                  summary: The provided field API name is incorrect or does not exist
                  value:
                    record_locking_configurations:
                      - code: INVALID_DATA
                        details:
                          api_name: api_name
                          json_path: >-
                            $.record_locking_configurations[0].locking_rules[0].criteria.fields.api_name
                        message: field not found
                        status: error
                NotSupportedField:
                  summary: Unsupported field used in criteria
                  value:
                    record_locking_configurations:
                      - code: NOT_SUPPORTED
                        details:
                          api_name: api_name
                          json_path: >-
                            $.record_locking_configurations[0].locking_rules[0].criteria.group[0].field.api_name
                        message: field not supported
                        status: error
                LimitExceededLockrules:
                  summary: Exceeded maximum number of locking rules
                  value:
                    record_locking_configurations:
                      - code: LIMIT_EXCEEDED
                        details:
                          limit: 5
                          available_limit: 2
                          api_name: locking_rules
                          json_path: $.record_locking_configurations[0].locking_rules
                        message: Maximum limit for locking rules exceeded
                        status: error
                InvalidFeaturetypeData:
                  summary: Invalid feature type (must be `record_locking`)
                  value:
                    record_locking_configurations:
                      - code: INVALID_DATA
                        details:
                          api_name: feature_type
                          json_path: $.record_locking_configurations[0].feature_type
                        message: invalid data
                        status: error
                InvalidRestrictedActionData:
                  summary: Invalid restricted action value
                  value:
                    record_locking_configurations:
                      - code: INVALID_DATA
                        details:
                          supported_values:
                            - convert
                            - update
                            - delete
                            - change_owner
                            - tags
                          api_name: restricted_actions
                          json_path: >-
                            $.record_locking_configurations[0].restricted_actions[1]
                        message: action not found
                        status: error
                InvalidRestrictedCustomButtonData:
                  summary: Invalid custom button ID
                  value:
                    record_locking_configurations:
                      - code: INVALID_DATA
                        details:
                          api_name: id
                          json_path: >-
                            $.record_locking_configurations[0].restricted_custom_buttons[0].id
                        message: custom button not found
                        status: error
                InvalidRestrictedCommunicationData:
                  summary: Invalid restricted communication value
                  value:
                    record_locking_configurations:
                      - code: INVALID_DATA
                        details:
                          supported_values:
                            - send_mail
                            - send_survey
                            - send_portal_invitation
                          api_name: restricted_communications
                          json_path: >-
                            $.record_locking_configurations[0].restricted_communications[1]
                        message: communications not found
                        status: error
                NotSupportedCommunication:
                  summary: Restricted communication not supported
                  value:
                    record_locking_configurations:
                      - code: NOT_SUPPORTED
                        details:
                          api_name: restricted_communications
                          json_path: >-
                            $.record_locking_configurations[0].restricted_communications
                        message: communications not found
                        status: error
                InvalidLocktypeData:
                  summary: Invalid lock type value
                  value:
                    record_locking_configurations:
                      - code: INVALID_DATA
                        details:
                          supported_values:
                            - manual
                            - automatic
                            - both
                          api_name: lock_type
                          json_path: $.record_locking_configurations[0].lock_type
                        message: lock_type not found
                        status: error
                InvalidLockedforData:
                  summary: Invalid `locked_for` value
                  value:
                    record_locking_configurations:
                      - code: INVALID_DATA
                        details:
                          supported_values:
                            - all_profiles
                            - all_profiles_except_excluded_profiles
                          api_name: locked_for
                          json_path: $.record_locking_configurations[0].locked_for
                        message: locked_for not found
                        status: error
                InvalidExcludedProfileData:
                  summary: Invalid profile ID in `lock_excluded_profiles`
                  value:
                    record_locking_configurations:
                      - code: INVALID_DATA
                        details:
                          api_name: id
                          json_path: >-
                            $.record_locking_configurations[0].lock_excluded_profiles[0].id
                        message: lock_excluded_profiles not found
                        status: error
                DependentFieldMissingExcludedProfiles:
                  summary: >-
                    Missing `lock_excluded_profiles` when `locked_for` is
                    `all_profiles_except_excluded_profiles`
                  value:
                    record_locking_configurations:
                      - code: DEPENDENT_FIELD_MISSING
                        details:
                          dependee:
                            api_name: locked_for
                            json_path: $.record_locking_configurations[0].locked_for
                          api_name: lock_excluded_profiles
                          json_path: >-
                            $.record_locking_configurations[0].lock_excluded_profiles
                        message: >-
                          lock_excluded_profiles should have been given when
                          locked_for is given as
                          all_profiles_except_excluded_profiles 
                        status: error
                DependentFieldMissingLocktype:
                  summary: >-
                    Missing `locking_rules` when `lock_type` is `automatic` or
                    `both`
                  value:
                    record_locking_configurations:
                      - code: DEPENDENT_FIELD_MISSING
                        details:
                          dependee:
                            api_name: lock_type
                            json_path: $.record_locking_configurations[0].lock_type
                          api_name: locking_rules
                          json_path: $.record_locking_configurations[0].locking_rules
                        message: >-
                          locking_rules should have been given when lock_type is
                          given as automatic or both
                        status: error
                FeatureNotSupported:
                  summary: Record locking not supported in the user's edition
                  value:
                    code: FEATURE_NOT_SUPPORTED
                    details: {}
                    message: >-
                      Record Locking Configuration is not supported in your
