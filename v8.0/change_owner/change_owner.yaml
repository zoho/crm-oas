  /{module}/actions/change_owner:
    post:
      summary: Change Owner
      description: >-
        Updates the owner of multiple records in the module. Note: The module
        name `Deals` is accepted and internally resolved to `Potentials`.
        `Meetings` is internally resolved to `Events`.
      operationId: changeOwnerBulk
      parameters:
        - $ref: '#/components/parameters/Module'
        - name: ids
          in: query
          deprecated: true
          required: false
          schema:
            type: string
            maxLength: 9975
          description: Deprecated — use the `ids` array in the request body instead.
        - name: notify
          in: query
          deprecated: true
          required: false
          schema:
            type: boolean
          description: Deprecated — use the `notify` field in the request body instead.
        - name: owner_id
          in: query
          deprecated: true
          required: false
          schema:
            type: string
            maxLength: 19
          description: Deprecated — use the `owner.id` field in the request body instead.
        - name: related_modules
          in: query
          deprecated: true
          required: false
          schema:
            type: string
            maxLength: 2000
          description: >-
            Deprecated — use the `related_modules` array in the request body
            instead.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: >-
                Specify the record IDs and owner details for the bulk owner
                change request.
              additionalProperties: false
              properties:
                ids:
                  type: array
                  description: >-
                    Specify the IDs of the records for which you want to change
                    the owner.
                  maxItems: 500
                  items:
                    type: string
                    description: Specify a record ID.
                    maxLength: 19
                owner:
                  type: object
                  description: Specify the details of the new owner for the records.
                  additionalProperties: false
                  properties:
                    id:
                      type: string
                      description: Specify the user ID of the new owner.
                      maxLength: 19
                  required:
                    - id
                notify:
                  type:
                    - boolean
                    - 'null'
                  description: >-
                    Specify whether to notify the new owner via email when the
                    records are assigned.\nPossible values:\n**true** - The new
                    owner is notified via email.\n**false** - The new owner is
                    not notified via email.
                related_modules:
                  type: array
                  description: >-
                    Specify the related modules for which you want to transfer
                    record ownership along with the main record.
                  maxItems: 5
                  items:
                    type: object
                    description: >-
                      Specify the API name and record ID of a related module
                      record to transfer to the new owner.
                    additionalProperties: false
                    properties:
                      api_name:
                        type: string
