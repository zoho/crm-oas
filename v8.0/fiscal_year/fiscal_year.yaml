    SwitchToCustomFiscalYearUpdate:
      type: object
      additionalProperties: false
      description: >-
        Represents the request payload to switch the organization from a
        standard fiscal year to a custom fiscal year. When `start_month` is
        provided alongside `start_date`, its value must match the month
        component of `start_date`.
      x-zs-$id: SwitchToCustomFiscalYearUpdate
      properties:
        calendar_type:
          type: string
          description: >-
            Specify the calendar type used to switch to a custom fiscal year.
            Possible values: `custom`.
          enum:
            - custom
          maxLength: 10
        display_based_on:
          $ref: '#/components/schemas/FiscalYearDisplayBasedOnForCustom'
        surplus_week:
          $ref: '#/components/schemas/SurplusWeekNested'
          description: >-
            Specify the surplus week configuration for the custom fiscal year.
            Send `null` to clear the configured surplus week.
        interval_display_option:
          $ref: '#/components/schemas/FiscalYearIntervalDisplayOption'
        structure:
          $ref: '#/components/schemas/FiscalYearStructure'
        start_date:
          $ref: '#/components/schemas/FiscalYearStartDate'
        start_month:
          $ref: '#/components/schemas/FiscalYearStartMonth'
          description: >-
            Specify the start month of the fiscal year. This field is optional.
            When provided, its value must match the month component of the
            configured start_date.
      required:
        - calendar_type
        - interval_display_option
        - start_date
        - structure
      if:
        description: >-
          Applies additional date restrictions when the display_based_on field
          is set to end_month.
        properties:
          display_based_on:
            const: end_month
        required:
          - display_based_on
      then:
        description: >-
          Restricts the start_date to months other than January and February
          when display_based_on is set to end_month.
        properties:
          start_date:
            description: >-
              Represents the constrained start_date value when display_based_on
              is set to end_month.
            not:
              description: >-
                Start dates in January or February are not allowed when
                display_based_on is set to end_month.
              pattern: ^\d{4}-0[12]-
    CustomFiscalYearPartialUpdate:
