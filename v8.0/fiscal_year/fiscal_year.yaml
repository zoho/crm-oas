      properties:
        display_based_on:
          type: string
          description: >-
            Specify whether the fiscal year label is based on the start month or
            the end month of the fiscal period. Possible values: `start_month`,
            `end_month`.
          enum:
            - start_month
            - end_month
          maxLength: 20
      required:
        - display_based_on
    StandardFiscalYearUpdate:
      type: object
      additionalProperties: false
      description: >-
        Represents the request payload to update standard fiscal year settings.
        When `display_based_on` is set to `end_month`, the `start_month` cannot
        be `JANUARY`.
      x-zs-$id: StandardFiscalYearUpdate
      properties:
        start_month:
          $ref: '#/components/schemas/FiscalYearStartMonth'
        display_based_on:
          $ref: '#/components/schemas/FiscalYearDisplayBasedOn'
      required:
        - start_month
      if:
        description: >-
          Applies additional constraints when the display_based_on field is set
          to end_month.
        properties:
          display_based_on:
            const: end_month
        required:
          - display_based_on
      then:
        description: >-
          Disallows JANUARY as the start_month when display_based_on is set to
          end_month.
        properties:
          start_month:
            description: >-
              Represents the constrained value for start_month when
              display_based_on is set to end_month.
            not:
              description: >-
                JANUARY is not allowed as the start_month when display_based_on
                is set to end_month.
              const: JANUARY
    SwitchToStandardFiscalYearUpdate:
      type: object
