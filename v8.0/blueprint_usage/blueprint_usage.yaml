openapi: 3.1.0
info:
  title: Blueprint Usage
  description: >-
    Blueprint is a Zoho CRM feature that maps out a business process for a
    module and guides users through it stage by stage. This API enables
    developers to retrieve the usage configuration that defines the limits,
    capabilities, and constraints for configuring a blueprint in a specific
    module.
  version: '8'
servers:
  - url: https://zohoapis.{dc}/crm/{version}
    description: API Server URL
    variables:
      dc:
        description: API Server URL TLD
        default: com
        enum:
          - eu
          - com
          - au
          - in
          - jp
          - cn
          - ca
      version:
        description: API Version
        default: v8
security:
  - OAuth2:
      - ZohoCRM.settings.blueprint.READ
paths:
  /settings/blueprints/usage_configurations:
    get:
      summary: Get blueprint usage configurations
      description: >-
        To retrieve the configuration details required to configure a blueprint
        for a specific module in your Zoho CRM organization.
      x-zs-llm-description: >-
        Get blueprint usage configuration details for a given module query
        parameter
      operationId: getBlueprintUsageConfigurations
      parameters:
        - $ref: '#/components/parameters/ParamQueryModule1'
      responses:
        '200':
          description: >-
            Returns the blueprint usage configuration details required to
            configure a blueprint for the specified module.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlueprintUsageConfigurationsResponse'
              examples:
                Success200:
                  summary: >-
                    Successful retrieval of a module's blueprint usage
                    configuration
                  value:
                    blueprints:
                      - process:
                          name:
                            unsupported_characters:
                              - '%'
                              - '&'
                            max_length: 50
                          description:
                            unsupported_characters:
                              - '%'
                              - '&'
                            max_length: 500
                          type:
                            - blueprint_type: normal
                              unsupported_components: null
                            - blueprint_type: continuous
                              unsupported_components:
                                - name: input_components
                                  input_components:
                                    - kiosk
                                    - widget
                                - name: transitions
                                  types:
                                    - parallel_transition
                        states:
                          supported_components:
                            - name: actions
                              supported_subcomponents:
                                - Escalation Alerts
                              mandate_subcomponent: true
                            - name: timebox
                              supported_subcomponents: null
                              mandate_subcomponent: true
                          limit: 50
                        transitions:
                          name:
                            unsupported_characters:
                              - '%'
                              - '&'
                            max_length: 50
                          description:
                            unsupported_characters:
                              - '%'
                              - '&'
                            max_length: 500
                          trigger_type:
                            - name: automatic
                              supported_transition_types:
                                - name: standalone_transition
                                  common_source: true
                                  limit: 50
                                  supported_components:
                                    - name: timebox
                                      mandate_subcomponent: false
                                      supported_subcomponents: null
                                    - name: transition_groups
                                      mandate_subcomponent: true
                                      supported_subcomponents:
                                        - after
                            - name: manual
                              supported_transition_types:
                                - name: standalone_transition
                                  common_source: true
                                  limit: 50
                                  supported_components:
                                    - name: transition_groups
                                      mandate_subcomponent: true
                                      supported_subcomponents:
                                        - before
                                        - during
                                        - after
                                - name: parallel_transition
                                  common_source: false
                                  limit: 5
                                  supported_components:
                                    - name: transition_groups
                                      mandate_subcomponent: true
                                      supported_subcomponents:
                                        - before
                                        - after
                                - name: child_transition
                                  common_source: false
                                  limit: 5
                                  supported_components:
                                    - name: transition_groups
                                      mandate_subcomponent: true
                                      supported_subcomponents:
                                        - before
                                        - during
                        actions:
                          - api_name: tags
                            name: Tags
                            display_name: Tags
                            associate_action: false
                            clickable: true
                            limit_per_action: 10
                            new: true
                            limit: 1
                            sub_actions:
                              - api_name: add_tags
                                name: AddTags
                                display_name: Add Tag(s)
                              - api_name: remove_tags
                                name: RemoveTags
                                display_name: Remove Tag(s)
                          - name: Alert
                            api_name: email_notifications
                            display_name: Email Notification
                            associate_action: true
                            clickable: true
                            limit_per_action: null
                            new: true
                            limit: 5
                          - name: Task
                            api_name: tasks
                            display_name: Tasks
                            associate_action: true
                            clickable: true
                            limit_per_action: null
                            new: true
                            limit: 5
                          - name: CreateRecord
                            api_name: create_record
                            display_name: Create Record
                            associate_action: true
                            clickable: true
                            limit_per_action: null
                            new: true
                            limit: 5
                          - name: AddMeeting
                            api_name: add_meeting
                            display_name: Add Meeting
                            associate_action: true
                            clickable: true
                            limit_per_action: null
                            new: false
                            limit: 5
                          - name: ScheduleCall
                            api_name: schedule_call
                            display_name: Schedule Call
                            associate_action: true
                            clickable: true
                            limit_per_action: null
                            new: false
                            limit: 5
                          - name: Convert
                            api_name: convert
                            display_name: Convert
                            associate_action: true
                            clickable: true
                            limit_per_action: null
                            unsupported_actions:
                              - tasks
                              - fieldupdates
                              - tags
                            new: false
                            limit: 5
                          - name: Webhook
                            api_name: webhooks
                            display_name: Webhooks
                            associate_action: true
                            clickable: true
                            limit_per_action: null
                            new: false
                            limit: 5
                          - name: Deluge
                            api_name: functions
                            display_name: Function
                            associate_action: true
                            clickable: true
                            limit_per_action: null
                            new: false
                            limit: 5
                          - name: Circuits
                            api_name: circuits
                            display_name: Circuit
                            associate_action: false
                            clickable: false
                            limit_per_action: null
                            new: false
                            limit: 5
                          - name: Whatsappnotification
                            api_name: whatsapp_notification
                            display_name: WhatsApp Notification
                            associate_action: false
                            clickable: false
                            limit_per_action: null
                            new: false
                            limit: 3
                          - name: SMS
                            api_name: sms
                            display_name: SMS
                            associate_action: false
                            clickable: false
                            limit_per_action: null
                            new: false
                            limit: 3
                          - name: SLA Alert
                            api_name: sla_alert
                            display_name: ' Default SLA Alert'
                            associate_action: false
                            clickable: true
                            limit_per_action: null
                            new: false
                            limit: 1
                          - name: Escalation Alerts
                            api_name: trigger_details
                            display_name: Escalation Alerts
                            associate_action: false
                            clickable: true
                            limit_per_action: null
                            new: false
                            limit: 3
                            execute_type:
                              - name: before
                                period:
                                  - name: hours
                                    display_name: Hour(s)
                                  - name: minute
                                    display_name: Minute(s)
                                  - name: days
                                    display_name: Day(s)
                                timebox_required: true
                              - name: 'on'
                                period: null
                                timebox_required: false
                              - name: after
                                period:
                                  - name: hours
                                    display_name: Hour(s)
                                  - name: minute
                                    display_name: Minute(s)
                                  - name: days
                                    display_name: Day(s)
                                  - name: b_hours
                                    display_name: Bsuiness Hour(s)
                                  - name: b_days
                                    display_name: Bsuiness Day(s)
                                timebox_required: true
                            sub_actions:
                              - api_name: field_updates
                                name: Fieldupdate
                                display_name: Field Update
                              - api_name: sla
                                name: SLA
                                display_name: SLA
                              - api_name: email_notifications
                                name: Alert
                                display_name: Alert
                              - api_name: tasks
                                name: Task
                                display_name: Task
                              - api_name: webhooks
                                name: Webhook
                                display_name: Webhook
                              - api_name: functions
                                name: Deluge
                                display_name: Deluge
                            mandate_subactions: true
                        input_components:
                          types:
                            - name: Fields
                              api_name: fields
                              validation_supported: true
                              standalone_component: false
                              unsupported_values:
                                - layout
                              limit_per_component: null
                            - name: Field of Lookup
                              api_name: field_of_lookup
                              validation_supported: true
                              standalone_component: false
                              unsupported_values:
                                - lookup
                              limit_per_component: null
                            - name: Associated Items
                              api_name: associated_items
                              validation_supported: false
                              standalone_component: false
                              unsupported_values: null
                              limit_per_component: null
                              sub_components:
                                - name: Notes
                                  api_name: notes
                                  validation_supported: false
                                  standalone_component: false
                                  unsupported_values: null
                                  limit_per_component: 1
                                - name: Attachments
                                  api_name: attachments
                                  validation_supported: false
                                  standalone_component: false
                                  unsupported_values: null
                                  limit_per_component: 1
                                - name: Related Lists
                                  api_name: related_list
                                  validation_supported: true
                                  standalone_component: false
                                  unsupported_values: null
                                  limit_per_component: 5
                            - name: Message
                              api_name: info_message
                              validation_supported: false
                              standalone_component: false
                              unsupported_values: null
                              limit_per_component: null
                            - name: Tags
                              api_name: tags
                              validation_supported: false
                              standalone_component: false
                              unsupported_values: null
                              limit_per_component: 1
                            - name: Checklists
                              api_name: checklist
                              validation_supported: false
                              standalone_component: false
                              unsupported_values: null
                              limit_per_component: 1
                            - name: Widgets
                              api_name: widgets
                              validation_supported: false
                              standalone_component: true
                              unsupported_values: null
                              limit_per_component: 1
                            - name: Kiosk
                              api_name: kiosk
                              validation_supported: false
                              standalone_component: true
                              unsupported_values: null
                              limit_per_component: 1
                          limit: 50
                        owners:
                          display_name: Owners
                          types:
                            - user
                            - role
                            - user_group
                            - portal
                            - team_user
                            - team_profile
                          limit: 100
                        transition_groups:
                          - name: before
                            display_name: BEFORE
                            supported_components:
                              - name: owners
                                mandate_subcomponent: false
                                supported_subcomponents: null
                              - name: criteria
                                mandate_subcomponent: false
                                supported_subcomponents: null
                          - name: during
                            display_name: DURING
                            supported_components:
                              - name: input_components
                                mandate_subcomponent: false
                                supported_subcomponents: null
                          - name: after
                            display_name: AFTER
                            supported_components:
                              - name: actions
                                mandate_subcomponent: false
                                supported_subcomponents:
                                  - Tags
                                  - Alert
                                  - Task
                                  - Field update
                                  - CreateRecord
                                  - AddMeeting
                                  - ScheduleCall
                                  - Convert
                                  - Webhook
                                  - Deluge
                                  - Functions
                                  - Whatsapp notification
                                  - SMS
                                  - Circuits
                        timebox:
                          period:
                            - name: hours
                              display_name: Hour(s)
                            - name: minute
                              display_name: Minute(s)
                            - name: days
                              display_name: Day(s)
                            - name: business_hour(s)
                              display_name: Business Hour(s)
                            - name: business_day(s)
                              display_name: Business Day(s)
                          minimum_values:
                            unit: 15
                            period: minutes
                  description: >-
                    Shows a successful response that returns the blueprint usage
                    configuration for a module, including its process, states,
                    transitions, actions, input components, owners, transition
                    groups, and timebox constraints.
          headers:
            X-API-CREDITS-REMAINING:
              schema:
                type: string
                format: int64
                description: >
                  Present when >=50% of base daily credits (excluding add-on
                  credits) are consumed. Value is total remaining credits
                  including add-on credits for the rolling 24-hour window.
                pattern: ^[0-9]+$
                minLength: 1
                maxLength: 19
              required: false
        '400':
          description: >-
            The request cannot be processed because the required module
            parameter is missing or the specified module API name is invalid.

            **Resolution:** Specify a valid API name for the module parameter.
          content:
            application/json:
              schema:
                x-zs-$id: BlueprintUsageConfigurationErrorResponse1
                oneOf:
                  - $ref: '#/components/schemas/MissingModuleParameterError'
                  - $ref: '#/components/schemas/InvalidModuleError'
                description: >-
                  Represents the error returned when the request cannot be
                  processed, either because the required module parameter is
                  missing or because the specified module API name is invalid.
              examples:
                RequiredParamMissingResponse1:
                  summary: REQUIRED_PARAM_MISSING error for a missing module parameter
                  value:
                    code: REQUIRED_PARAM_MISSING
                    details:
                      param_name: module
                    message: One of the expected parameter is missing
                    status: error
                  description: >-
                    Demonstrates the error response returned when the required
                    module parameter is missing from the request, with the code
                    REQUIRED_PARAM_MISSING.
                InvalidModuleResponse1:
                  summary: INVALID_MODULE error for an invalid module API name
                  value:
                    code: INVALID_MODULE
                    details:
                      param_name: Leads
                    message: the module name given seems to be invalid
                    status: error
                  description: >-
                    Demonstrates the error response returned when the specified
                    module API name is invalid, with the code INVALID_MODULE.
          headers:
            X-API-CREDITS-REMAINING:
              schema:
                type: string
                format: int64
                description: >
                  Present when >=50% of base daily credits (excluding add-on
                  credits) are consumed. Value is total remaining credits
                  including add-on credits for the rolling 24-hour window.
                pattern: ^[0-9]+$
                minLength: 1
                maxLength: 19
              required: false
      security:
        - OAuth2:
            - ZohoCRM.settings.blueprint.READ
components:
  schemas:
    InvalidModuleError:
      type: object
      additionalProperties: false
      description: Error response indicating that the provided module name is invalid.
      properties:
        code:
          type: string
          description: |-
            Represents the error code.
            Possible values:
            **INVALID_MODULE** - The module name given is invalid.
          enum:
            - INVALID_MODULE
        details:
          type: object
          additionalProperties: false
          description: >-
            Contains the error details, including the name of the parameter that
            caused the error.
          properties:
            param_name:
              type: string
              description: Represents the name of the parameter implicated in the error.
              maxLength: 255
          required:
            - param_name
        message:
          type: string
          description: >-
            Represents the error message returned when the module name given
            seems to be invalid.

            Possible values:

            the module name given seems to be invalid - The specified module
            name is invalid.
          enum:
            - the module name given seems to be invalid
        status:
          type: string
          description: |-
            Represents the status of the failed request.
            Possible values:
            error - The request failed.
          enum:
            - error
      required:
        - code
        - details
        - message
        - status
      title: Invalid Module Error
      x-zs-$id: ErrorResponseCore1604218802
    BlueprintUsageConfigurationsResponse:
      type: object
      additionalProperties: false
      description: >-
        Contains the list of Blueprint usage configuration objects returned in a
        successful response.
      properties:
        blueprints:
          type: array
          description: >-
            List of Blueprint usage configuration objects for the module, each
            detailing the capabilities, limits, and constraints per Blueprint
            element.
          items:
            $ref: '#/components/schemas/BlueprintUsageConfiguration'
          maxItems: 1
      required:
        - blueprints
      title: Blueprint Usage Configurations Response
      x-zs-$id: GetblueprintusageconfigurationsResponse200
    BlueprintUsageConfiguration:
      type: object
      additionalProperties: false
      description: >-
        Represents the aggregated usage configuration for Blueprints, covering
        timebox, process, transitions, actions, states, input components,
        owners, and transition groups.
      properties:
        timebox:
          $ref: '#/components/schemas/TimeboxConfiguration'
        process:
          $ref: '#/components/schemas/ProcessUsageConstraints'
        owners:
          $ref: '#/components/schemas/OwnerSelectionConstraints'
        transitions:
          $ref: '#/components/schemas/TransitionUsageConstraints'
        input_components:
          $ref: '#/components/schemas/InputComponentConstraints'
        actions:
          type: array
          description: >-
            List of capability profile objects for the actions in the Blueprint,
            detailing the limits and constraints of each action.
          items:
            oneOf:
              - $ref: '#/components/schemas/ActionCapabilityProfile'
              - $ref: '#/components/schemas/ActionCapabilityProfileBasic'
              - $ref: '#/components/schemas/ActionCapabilityProfileWithRestrictions'
              - $ref: '#/components/schemas/ActionCapabilityProfileWithExecution'
            description: >-
              Represents the capability profile of a single action in the
              Blueprint, including its limits and constraints.
          maxItems: 14
        states:
          $ref: '#/components/schemas/StateUsageConstraints'
        transition_groups:
          type: array
          description: >-
            List of transition group profile objects, each describing the
            capabilities and constraints of a transition group in the Blueprint.
          items:
            oneOf:
              - $ref: '#/components/schemas/TransitionGroupProfile'
              - $ref: '#/components/schemas/TransitionGroupProfileDetailed'
            description: >-
              Represents the profile of a single transition group in the
              Blueprint, including its capabilities and constraints.
          maxItems: 3
      required:
        - actions
        - input_components
        - owners
        - process
        - states
        - timebox
        - transition_groups
        - transitions
      title: Blueprint Usage Configuration
    ActionCapabilityProfileWithExecution:
      type: object
      x-zs-$id: ActionCapabilityProfileWithExecution
      additionalProperties: false
      description: >-
        Represents the capabilities of an action, including execution types,
        sub-action rules, and usage limits.
      properties:
        new:
          type: boolean
          description: |-
            Indicates whether the Blueprint action is newly available.
            Possible values:
            **true** - The action is newly available.
            **false** - The action is not newly available.
        sub_actions:
          type: array
          description: List of sub-action objects nested under the Blueprint action.
          items:
            $ref: '#/components/schemas/ActionSubOption'
          maxItems: 6
        associate_action:
          type: boolean
          description: >-
            Indicates whether the action can be associated with a Blueprint
            transition.

            Possible values:

            **true** - The action can be associated with a Blueprint transition.

            **false** - The action cannot be associated with a Blueprint
            transition.
        limit_per_action:
          type:
            - 'null'
            - integer
          format: int32
          description: Represents the maximum number of times the action can be used.
        execute_type:
          type: array
          description: List of execution types supported by the action.
          items:
            oneOf:
              - $ref: '#/components/schemas/ActionExecutionTypeProfile'
              - $ref: '#/components/schemas/ActionExecutionTypeProfileBasic'
            description: Represents one execution type of the action.
          maxItems: 3
        api_name:
          type: string
          description: Represents the API name of the Blueprint action.
          maxLength: 255
        mandate_subactions:
          type: boolean
          description: >-
            Indicates whether the sub-actions of the Blueprint action are
            mandatory.

            Possible values:

            **true** - The sub-actions are mandatory.

            **false** - The sub-actions are not mandatory.
        clickable:
          type: boolean
          description: |-
            Indicates whether the action is clickable in the CRM UI.
            Possible values:
            **true** - The action is clickable in the CRM UI.
            **false** - The action is not clickable in the CRM UI.
        name:
          type: string
          description: Represents the internal name of the Blueprint action.
          maxLength: 255
        limit:
          type: integer
          format: int32
          description: Represents the maximum number of actions allowed in the Blueprint.
        display_name:
          type: string
          description: Represents the display label of the Blueprint action.
          maxLength: 255
      required:
        - api_name
        - associate_action
        - clickable
        - display_name
        - execute_type
        - limit
        - limit_per_action
        - mandate_subactions
        - name
        - new
        - sub_actions
      title: Action Capability Profile With Execution
    ProcessUsageConstraints:
      type: object
      additionalProperties: false
      description: >-
        Represents the constraints for defining a process, including name and
        description validation and the supported type values.
      properties:
        name:
          $ref: '#/components/schemas/ProcessNameConstraints'
        description:
          $ref: '#/components/schemas/ProcessDescriptionConstraints'
        type:
          type: array
          description: List of supported process types.
          items:
            oneOf:
              - $ref: '#/components/schemas/BlueprintTypeCompatibility'
              - $ref: '#/components/schemas/BlueprintTypeUnsupportedComponents'
            description: Represents one supported process type.
          maxItems: 2
      required:
        - description
        - name
        - type
      title: Process Usage Constraints
    ProcessNameConstraints:
      type: object
      additionalProperties: false
      description: >-
        Represents the validation rules for process names in Blueprint usage
        configurations, including the unsupported characters and the maximum
        length.
      properties:
        unsupported_characters:
          type: array
          description: List of characters not allowed in the Blueprint process name.
          items:
            type: string
            description: >-
              Represents one character not allowed in the Blueprint process
              name.
            maxLength: 255
          maxItems: 25
        max_length:
          type: integer
          format: int32
          description: Represents the maximum allowed length of the Blueprint process name.
      required:
        - max_length
        - unsupported_characters
      title: Process Name Constraints
    ActionExecutionTypeProfileBasic:
      type: object
      x-zs-$id: ActionExecutionTypeProfileBasic
      additionalProperties: false
      description: >-
        Represents the basic metadata of an execution type, where period options
        may be unspecified.
      properties:
        timebox_required:
          type: boolean
          description: >-
            Indicates whether a timebox period is required for the execution
            type.

            Possible values:

            **true** - A timebox period is required for the execution type.

            **false** - A timebox period is not required for the execution type.
        name:
          type: string
          description: Represents the internal name of the execution type.
          maxLength: 255
        period:
          type: 'null'
          description: Reserved for future use.
      required:
        - name
        - period
        - timebox_required
      title: Action Execution Type Profile (Basic)
    TransitionGroupProfileDetailed:
      type: object
      x-zs-$id: TransitionGroupProfileDetailed
      additionalProperties: false
      description: >-
        Represents a detailed transition group profile that lists the supported
        components along with their sub-components.
      properties:
        supported_components:
          type: array
          description: >-
            Represents the components allowed in the transition group, along
            with the policy defined for each component.
          items:
            $ref: >-
              #/components/schemas/TransitionGroupComponentDescriptorWithSubcomponents
          maxItems: 2
        name:
          type: string
          description: Represents the internal name of the transition group.
          maxLength: 255
        display_name:
          type: string
          description: Represents the display label of the transition group.
          maxLength: 255
      required:
        - display_name
        - name
        - supported_components
      title: Transition Group Profile (Detailed)
    BlueprintTypeUnsupportedComponents:
      type: object
      x-zs-$id: BlueprintTypeUnsupportedComponents
      additionalProperties: false
      description: >-
        Specifies a Blueprint type and the components that are unsupported for
        that type.
      properties:
        blueprint_type:
          type: string
          description: Represents the internal name of the Blueprint type.
          maxLength: 255
        unsupported_components:
          type: array
          description: List of components unsupported by the Blueprint type.
          items:
            oneOf:
              - $ref: '#/components/schemas/UnsupportedComponentInputRules'
              - $ref: '#/components/schemas/UnsupportedComponentTypeRules'
            description: >-
              Represents a Blueprint component that the Blueprint type does not
              support.
          maxItems: 2
      required:
        - blueprint_type
        - unsupported_components
      title: Blueprint Type Unsupported Components
    UnsupportedComponentInputRules:
      type: object
      x-zs-$id: UnsupportedComponentInputRules
      additionalProperties: false
      description: >-
        Identifies an unsupported component and lists the input sub-components
        that cannot be used with it.
      properties:
        name:
          type: string
          description: Represents the name of the unsupported component.
          maxLength: 255
        input_components:
          type: array
          description: List of input sub-components that cannot be used with the component.
          items:
            type: string
            description: Represents one input sub-component that cannot be used.
            maxLength: 255
          maxItems: 2
      required:
        - input_components
        - name
      title: Unsupported Component Input Rules
