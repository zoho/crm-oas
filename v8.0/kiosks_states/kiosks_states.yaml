            decision condition.
          maxLength: 20
          minLength: 1
        id:
          type:
            - string
            - 'null'
          description: >-
            Represents the unique identifier of the resource — a get_record or
            created-record configuration — used when evaluating the decision
            condition.
          maxLength: 19
          minLength: 1
    ActionAttachment:
      type: object
      additionalProperties: false
      description: >-
        Represents a single attachment entry for a note created by the add note
        action. Each entry contains a merge field reference to a File Upload
        field.
      properties:
        id:
          type:
            - string
            - 'null'
          description: >-
            Represents a merge field reference to a File Upload field. Three
            formats are supported: (1) Record field —
            `${!<kiosk_group_api_name>.<resource_api_name>.<field_api_name>}`,
            where the resource is `CurrentRecord` or a GetRecord API name (for
            example, `GetRecords_1`). (2) CRM module field —
            `${!<module_api_name>.<field_api_name>}`, for example,
            `${!users.email}`. (3) Kiosk screen field —
            `${!<kiosk_group_api_name>.<screen_field_api_name>}`, which
            references a File Upload field on a kiosk screen.
          maxLength: 200
    ActionCreateDetails:
      type: object
      additionalProperties: false
