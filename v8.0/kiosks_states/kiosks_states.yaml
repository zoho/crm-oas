                const: field
                description: Conditional schema when type is field
          then:
            description: 'Schema requiring fields: field'
            additionalProperties: false
            type: object
            properties:
              field:
                description: The required field is field
            required:
              - field
        - description: >-
            Represents the conditional schema constraint that requires
            selected_fields when the element type is get_records.
          if:
            description: Conditional schema when type is get_records
            additionalProperties: false
            type: object
            properties:
              type:
                const: get_records
                description: Conditional schema when type is get_records
          then:
            description: 'Schema requiring fields: selected_fields'
            additionalProperties: false
            type: object
            properties:
              selected_fields:
                description: The required field is selected_fields
            required:
              - selected_fields
        - description: >-
            Represents the conditional schema constraint that requires the
