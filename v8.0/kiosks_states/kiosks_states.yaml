    ActionWebhooks:
      type: object
      additionalProperties: false
      description: >-
        Represents the webhook action configuration for a kiosk action state.
        Contains the identifier and name of the pre-created webhook workflow
        action to be associated.
      x-zs-llm-description: >-
        PREREQUISITES: Ensure execute_for_record is configured (get
        record/current record). Call the webhooks action API via workflow tool
        with related_module:{api_name:<kiosk_api_name>,id:<kiosk_id>} and
        feature_type:kiosk. Capture returned action id and name.

        MANDATORY: type (const 'webhooks'), details (object).

        DETAILS CONTRACT: webhooks (REQUIRED: id, name from created action),
        execute_for_record (REQUIRED), sequential_action (boolean). Errors:
        invalid_data/invalid_configuration/not_supported if respective keys are
        missing or not created in kiosk context.

        EXAMPLE:{"states":[{"name":"Action
        2","from_transition":{"id":"4676645000001264057"},"type":"action","details":{"type":"webhooks","execute_for_record":{"name":"GetRecords
        2","id":"4676645000001246014"},"sequential_action":true,"sequential_action_details":{"enable_failure_path":false},"webhooks":{"id":"4676645000001264070","name":"Action
        2"}},"handledError":true}]}
      properties:
        name:
          type:
            - string
            - 'null'
          description: >-
            Represents the name of the webhook action pre-created in Zoho CRM
            and associated with the kiosk action state.
          maxLength: 9
        id:
          description: >-
            Represents the record ID of the webhook action pre-created in Zoho
            CRM and associated with the kiosk action state.
          x-zs-$ref:
            resource: webhooks
            origins:
              - operationId: getWebhooks
                propertyId: WebhooksId
          type: string
          format: int64
          maxLength: 20
      required:
        - id
    ActionWebhooksUpdate:
      type: object
      additionalProperties: false
      description: >-
        Represents the webhook action configuration for updating a kiosk action
        state. Contains the identifier and name of the pre-created webhook
        workflow action.
      properties:
        name:
          type:
            - string
            - 'null'
          description: >-
            Represents the name of the webhook action pre-created in Zoho CRM
            Workflow and associated with the kiosk action state.
          maxLength: 20
        id:
          description: >-
            Represents the record ID of the webhook action pre-created in Zoho
            CRM Workflow and associated with the kiosk action state.
          x-zs-$ref:
            resource: webhooks
            origins:
              - operationId: getWebhooks
                propertyId: WebhooksId
          type: string
          format: int64
          maxLength: 20
    KioskStateErrorAssociationNotAllowed:
      type: object
      additionalProperties: false
      description: >-
        Represents the error response returned when the get_record component is
        already associated with another kiosk state.
      example:
        code: NOT_ALLOWED
        details:
          api_name: id
          json_path: $.states[0].details.get_record.id
        message: GetRecord already associated with other component
        status: error
      properties:
        code:
          type: string
          description: >-
            Represents the error code indicating the type of validation failure.
            Always 'NOT_ALLOWED' when the get_record component is already
            associated with another state.
          enum:
            - NOT_ALLOWED
        details:
          type: object
          additionalProperties: false
          description: >-
            Represents contextual details about the error, including the API
            name and JSON path of the affected field.
          properties:
            api_name:
              type: string
              description: Represents the API name of the field associated with the error.
              maxLength: 255
            json_path:
              type: string
              description: >-
                Represents the JSON path pointing to the problematic field in
                the request body.
              maxLength: 1000
          required:
            - api_name
            - json_path
        message:
          type: string
          description: Represents the error message describing the association conflict.
          enum:
            - GetRecord already associated with other component
        status:
          type: string
          description: >-
            Represents the status of the response. Always 'error' for error
            responses.
          enum:
            - error
      required:
        - code
        - details
        - message
        - status
      title: Get Record Association Not Allowed Error
      x-consolidated-into: KioskStateErrorResponse
      x-zs-$id: KioskStateErrorAssociationNotAllowed
