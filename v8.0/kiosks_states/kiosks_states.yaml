          message: Provide one custom path for decision path details
          description: >-
            This error occurs when the default attribute is not defined for the
            paths in the decision configuration. The default field determines
            whether a path is a fallback branch that should execute when none of
            the defined conditions are satisfied. Since the system must clearly
            identify which path acts as the default, the absence of this field
            creates ambiguity during decision evaluation. As a result, the API
            returns an AMBIGUITY_DURING_PROCESSING error requesting the user to
            define a custom path configuration properly.
        - code: NOT_ALLOWED
          message: We cant provide the default path start or between of paths
          description: >-
            This error occurs when the path with default set to true appears
            before the last position in the path_details array. In the decision
            configuration, the default path must always be the final path
            because it acts as the fallback after all other conditional paths
            have been evaluated. Placing the default path earlier would cause
            the system to prematurely resolve the decision without evaluating
            subsequent conditions. The API therefore returns a NOT_ALLOWED error
            indicating that the default path cannot appear at the beginning or
            middle of the path list.
        - code: DEPENDENT_FIELD_MISSING
          message: Dependent field is missing
          description: Auto-generated from ApiDefinition for DEPENDENT_FIELD_MISSING
        - code: INVALID_DATA
          message: invalid data
          description: >-
            This error occurs when the criteria_groupings field inside
            filter_conditions is not provided as a JSON array. The system
            expects criteria_groupings to be a list of condition objects that
            will be evaluated according to the logical pattern defined in the
            decision configuration. If a different data type such as a string or
            object is provided instead of an array, the API cannot interpret the
            conditions properly. Therefore, the request fails with an
            INVALID_DATA error specifying that the expected data type is
            jsonarray.
        - code: DUPLICATE_DATA
          message: Duplicate path name not allow
          description: >-
            This error occurs when two or more paths in path_details share the
            same name value. Path names must be unique so that each branch in
            the decision configuration can be clearly identified. Duplicate
            names would create conflicts during processing and make it
            impossible for the system to distinguish between paths. To prevent
            this ambiguity, the API returns a DUPLICATE_DATA error indicating
            that duplicate path names are not allowed.
        - code: INVALID_DATA
          message: Invalid data
          description: Auto-generated from ApiDefinition for INVALID_DATA
        - code: API_NOT_SUPPORTED
          message: api version is not supported
          description: >-
            Api not supported error is thrown in case a version where Kiosk is
            not supported is given for the post call.
        - code: INVALID_DATA
          message: Invalid data
          description: Auto-generated from ApiDefinition for INVALID_DATA
        - code: INVALID_DATA
          message: invalid data
          description: >-
            When 'states[0].type' is a string but not one of: screen, decision,
            action, get_records, invalid data error is thrown
        - code: MANDATORY_NOT_FOUND
          message: Path filter conditions missed
          description: >-
            This error occurs when a non-default path does not include the
            filter_conditions object. The filter_conditions define the criteria
            that must be evaluated to determine whether the kiosk should follow
            that path. Without these conditions, the system cannot determine
            when the path should be triggered. Because these conditions are
            mandatory for non-default paths, the API returns a
            MANDATORY_NOT_FOUND error indicating that the filter condition
            configuration is missing.
        - code: AMBIGUITY_DURING_PROCESSING
          message: Default path not supported the filter conditions
          description: >-
            This error occurs when a path marked as the default path also
            contains filter conditions. The default path is intended to act as a
            fallback branch and should not include any conditional logic. If
            filter conditions are provided for a default path, the system cannot
            determine whether the path should behave as a conditional path or a
            fallback path. This creates ambiguity, and the API returns an
            AMBIGUITY_DURING_PROCESSING error stating that default paths do not
            support filter conditions.
        - code: NOT_ALLOWED
          message: Screen contains fields which are associated in other components
          description: >-
            Error response when a user tries to delete a state which has one or
            more elements associated in another state
        - code: INVALID_DATA
          message: Invalid data
          description: Auto-generated from ApiDefinition for INVALID_DATA
        - code: INVALID_DATA
          message: No such state exists in Kiosk
          description: >-
            Error response when the user tries to delete a state which is not
            available in the Kiosk
        - code: DEPENDENT_FIELD_MISSING
          message: currency details not found
          description: >-
            Dependent field missing error message is thrown if a dependent key
            which is needed if the data type is a specific value. For example,
            currency data type should have a field "currency" in the same field
            json to be valid
        - code: AMBIGUITY_DURING_PROCESSING
          message: Provide one default path for decision path details
          description: >-
            This error occurs when none of the paths in path_details have the
            default field set to true. The default path serves as a fallback
            branch that the kiosk decision state will follow if none of the
            defined path conditions evaluate to true. Without a default path,
            the system would not know how to proceed when no conditions match.
            This results in ambiguity during execution, so the API returns an
            AMBIGUITY_DURING_PROCESSING error instructing the user to provide
            exactly one default path.
      x-zs-$id: KioskStateErrorResponse
    GETDataHubSelectionDetails:
