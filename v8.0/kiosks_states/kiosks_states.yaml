                          id: '4676645000001212034'
                        message: Kiosk state updated successfully
                        status: success
                  description: >-
                    Returns the success response for a completed kiosk state
                    update operation. The response body contains a states array
                    with a single entry confirming the update via a SUCCESS
                    code, the updated state ID, and a descriptive status
                    message.
          headers:
            X-API-CREDITS-REMAINING:
              schema:
                type: string
                format: int64
