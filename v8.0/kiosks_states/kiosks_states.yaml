                      from_transition:
                        id: '3480060000005475069'
                      type: get_records
                      details:
                        get_record:
                          id: '2296900000011011184'
                          name: GetRecords 2
                description: >-
                  Demonstrates creating a get_records state that references a
                  previously created Get Record component to retrieve CRM
                  records within the kiosk workflow. The Get Record component
                  must be created before this state is configured.
