          type: string
          description: >-
            Represents the data source used for condition evaluation. Possible
            values:current_record - Evaluates a field from the current CRM
            record. Possible values: get_record - Evaluates a field from a
            get_record result. kiosk_fields - Evaluates a kiosk screen field.
            data_hub - Evaluates a data hub field. created_record - Evaluates a
            field from a record created earlier in the kiosk. loop_record -
            Evaluates a field from a loop record.
          enum:
            - current_record
            - get_record
            - kiosk_fields
            - data_hub
            - created_record
            - loop_record
        resource:
          $ref: '#/components/schemas/DecisionResource'
          description: >-
            The resource object identifies the specific data resource that
            should be used when evaluating the condition. This object is
            primarily used when the condition type refers to external data
            sources such as records retrieved using a GetRecord configuration or
            records created earlier in the kiosk execution. The resource object
            ensures that the decision condition references the correct record
            source.
        value:
          type: string
          description: |
            Indicates whether the evaluated field must contain data.
            Possible values:
            ${NOTEMPTY} - The field must have a value.
            ${EMPTY} - The field must be empty.
          enum:
            - ${EMPTY}
            - ${NOTEMPTY}
        criteria:
          $ref: '#/components/schemas/FilterCriterionRequest'
          description: >-
            The actual comparison logic for this criteria grouping. Supports
            both simple field-value comparisons (via
            SimpleFilterCriterionRequest) and nested grouped conditions (via
            GroupedFilterCriterionRequest). Defined in Criterion.json. Note: The
            only possible types for the 'value' will be 'value' and 'field' (If
            you want to compare with any field in the Kiosk itself, you should
            send the type as 'field' and the format will be
            <kiosk_api_name>.<screen_field_api_name> in case referring to
            Kiosk's screen field. Example: 'criteria': {'field': { 'api_name':
            'Screen_2_Single_Line_2', 'id': '2296900000013105115',
            'field_label': 'Single Line 2', 'data_type': 'text'}, 'comparator':
            'equal', 'value': { 'api_name': 'Bug2.Screen_2_Single_Line_2', 'id':
            '2296900000013105115' },'type': 'field' }. If the type is just
            'value', then a simple string is used for comparison. Strictly
            follow this pattern for Kiosk's criteria overriding any
            discrepancies in Criterion.json.
      required:
        - sequence_number
        - type
        - value
    DecisionFilterConditions:
      type: object
      additionalProperties: false
      description: >-
        Represents the filter conditions that determine whether a decision path
        is taken. Contains a logical pattern and a list of criteria groupings
        that must be evaluated.
      properties:
        pattern:
          type:
            - string
            - 'null'
          description: >-
            Represents the logical expression that combines multiple criteria
            groupings. Each number references a criteria grouping's sequence
            number, and logical operators such as **and** and **or** determine
            how conditions are combined. For example, (1and2) requires both
            grouping 1 and grouping 2 to be satisfied.
          maxLength: 100
          minLength: 1
        criteria_groupings:
          type:
            - array
            - 'null'
          description: >-
            Represents the list of conditions evaluated as part of the decision
            state. Each grouping defines one logical condition, and its position
            is referenced by the pattern field.
          items:
            $ref: '#/components/schemas/DecisionCriteriaGrouping'
          maxItems: 5
      x-zs-$id: DecisionFilterConditions
    DecisionPathDetails:
      type: object
      additionalProperties: false
      description: >-
        Represents a single decision path within a kiosk decision state. Each
        path includes a name, a default flag, and filter conditions that
        determine whether the path is taken.
      properties:
        name:
          type:
            - string
            - 'null'
          description: >-
            Represents the display name of the decision path, used to identify
            the branch during configuration.
          maxLength: 20
        default:
          type:
            - boolean
            - 'null'
          description: >
            Indicates whether this path is the default fallback path. When set
            to **true**, the filter_conditions may be null, and the kiosk
            follows this path if no other path's conditions are satisfied.

            Possible values:

            true - This path is the default fallback.

            false - This path requires filter conditions to be met.

            values:\\ntrue - This path is the default fallback.\\nfalse - This
            path

            requires filter conditions to be met."
        id:
          type:
            - string
            - 'null'
          description: >-
            Represents the unique identifier of the decision path, generated by
            the system and used when referencing or updating the path
            configuration.
          maxLength: 19
          minLength: 1
        filter_conditions:
          description: >-
            Represents the conditions that must be satisfied for this decision
            path to be taken. For the default fallback path, this value may be
            null. For all other paths, the object must include a pattern and
            criteria_groupings.
          oneOf:
            - $ref: '#/components/schemas/DecisionFilterConditions'
            - type: 'null'
              description: >-
                Represents the null variant of filter_conditions, permitted only
                when the path is the default fallback path.
              x-zs-$id: NullFilterConditions
      required:
        - filter_conditions
      allOf:
        - description: >-
            Represents the constraint block that requires filter_conditions to
            be a valid object for all non-default decision paths.
          if:
            not:
              properties:
                default:
                  const: true
                  description: Whether this is the default path.
              required:
                - default
              description: 'Negated condition: path is not the default path.'
            description: 'Condition: default is not True'
          then:
            description: >-
              Non-default paths must have filter_conditions as a valid
              DecisionFilterConditions object (not null).
            properties:
              name: {}
              id: {}
              default: {}
              filter_conditions:
                $ref: '#/components/schemas/DecisionFilterConditions'
    DecisionResource:
      type: object
      additionalProperties: false
      description: >-
        Represents the data resource used when evaluating a decision condition.
        Contains the identifier and name of the get_record or created-record
        configuration referenced by the condition.
      properties:
        name:
