                oneOf:
                  - $ref: '#/components/schemas/SimpleFilterCriterionValueString'
            - $ref: '#/components/schemas/SimpleFilterCriterionValueString'
        type:
          type: string
          enum:
            - merge_field
            - pre_defined
            - value
            - field
          default: value
          description: >-
            Indicates the value resolution mode of the criterion, distinguishing
            whether the filter value is a literal value, a merge field
            reference, a predefined system variable, or another field reference.

            Possible values:

            value - The value is a direct literal.

            merge_field - The value is a merge field reference.

            pre_defined - The value is a predefined system variable placeholder.

            field - The value references another field.
      required:
        - field
        - comparator
        - value
      additionalProperties: false
    OrderingFilterCriterionRequest:
      type: object
      x-zs-$id: OrderingFilterCriterionRequest
      description: >-
        Represents a filter criterion for the less_than, less_equal,
        greater_than, and greater_equal comparators. The value must be a scalar;
        arrays and objects are not supported. The value type is determined by
        the field's data_type: use SimpleFilterCriterionValueString for date or
        datetime fields, and SimpleFilterCriterionValueNumber for integer,
        currency, or double fields.
      properties:
        field:
          allOf:
            - $ref: '#/components/schemas/FilterFieldBase'
            - type: object
              additionalProperties: true
              description: >-
                Represents the field reference constraint that requires the
                api_name property to be present for the ordering filter
                criterion.
              required:
                - api_name
          unevaluatedProperties: false
          description: >-
            Represents the target field definition to which the ordering filter
            criterion is applied, conforming to the base field structure.
        comparator:
          type: string
          enum:
            - less_than
            - less_equal
            - greater_than
            - greater_equal
          description: >-
            Represents the ordering comparison operator applied to the
            criterion.

            Possible values:

            less_than - Matches records where the field value is less than the
            specified filter value.

            less_equal - Matches records where the field value is less than or
            equal to the specified filter value.

            greater_than - Matches records where the field value is greater than
            the specified filter value.

            greater_equal - Matches records where the field value is greater
            than or equal to the specified filter value.
        value:
          anyOf:
            - $ref: '#/components/schemas/SimpleFilterCriterionValueString'
            - $ref: '#/components/schemas/SimpleFilterCriterionValueNumber'
            - $ref: '#/components/schemas/SimpleFilterCriterionValueAgeDuePredefined'
          description: >-
            Represents the scalar filter value used in the ordering comparator.
            Arrays and objects are not supported for ordering comparators.
        type:
          type: string
          enum:
            - merge_field
            - pre_defined
            - value
            - field
          default: value
          description: >-
            Indicates the value resolution mode of the criterion, distinguishing
            whether the filter value is a literal value, a merge field
            reference, a predefined system variable, or another field reference.

            Possible values:

            value - The value is a direct literal.

            merge_field - The value is a merge field reference.

            pre_defined - The value is a predefined system variable placeholder.

            field - The value references another field.
      required:
        - field
        - comparator
        - value
      additionalProperties: false
    BetweenFilterCriterionRequest:
      type: object
      x-zs-$id: BetweenFilterCriterionRequest
      description: >-
        Represents a filter criterion for the between and not_between
        comparators. The value must be an array of exactly two elements —
        [lower_bound, upper_bound]. The value type is determined by the field's
        data_type: use SimpleFilterCriterionValueString for date or datetime
        fields, and SimpleFilterCriterionValueNumber for integer, currency, or
        double fields. Resolve the data_type from the field's FieldSchema. For
        formula fields, use formula.return_type as the effective data_type; for
        rollup_summary fields, use rollup_summary.return_type.
      properties:
        field:
          allOf:
            - $ref: '#/components/schemas/FilterFieldBase'
            - type: object
              additionalProperties: true
              description: >-
                Represents the field reference constraint that requires the
                api_name property to be present for the range filter criterion.
              required:
                - api_name
          unevaluatedProperties: false
          description: >-
            Represents the target field definition to which the range filter
            criterion is applied, conforming to the base field structure.
        comparator:
          type: string
          enum:
            - between
            - not_between
          description: >-
            Represents the range comparison operator applied to the criterion,
            indicating whether the field value falls within or outside the
            specified bounds.

            Possible values:

            between - Matches records where the field value falls within the
            specified range.

            not_between - Matches records where the field value falls outside
            the specified range.
        value:
          type: array
          x-zs-$id: BetweenFilterCriterionRequestValueArray
          description: >-
            Contains the two boundary values — [lower_bound, upper_bound] —
            against which the field is evaluated for the between or not_between
            comparator.
          minItems: 2
          maxItems: 2
          items:
            x-zs-$id: BetweenFilterCriterionRequestValueArrayItems
            oneOf:
              - $ref: '#/components/schemas/SimpleFilterCriterionValueString'
              - $ref: '#/components/schemas/SimpleFilterCriterionValueNumber'
        type:
          type: string
          enum:
            - merge_field
            - pre_defined
            - value
            - field
          default: value
          description: >-
            Indicates the value resolution mode of the criterion, distinguishing
            whether the filter value is a literal value, a merge field
            reference, a predefined system variable, or another field reference.

            Possible values:

            value - The value is a direct literal.

            merge_field - The value is a merge field reference.

            pre_defined - The value is a predefined system variable placeholder.

            field - The value references another field.
      required:
        - field
        - comparator
        - value
      additionalProperties: false
    SetFilterCriterionRequest:
      type: object
      x-zs-$id: SetFilterCriterionRequest
      description: >-
        Represents a filter criterion for the in and not_in comparators. The
        value must be an array of primitive values. The value type is determined
        by the field's data_type: use SimpleFilterCriterionValueString for
        text-based types, and SimpleFilterCriterionValueNumber for integer,
        currency, or double fields.
      properties:
        field:
          allOf:
            - $ref: '#/components/schemas/FilterFieldBase'
            - type: object
              additionalProperties: true
              description: >-
                Represents the field reference constraint that requires the
                api_name property to be present for the set filter criterion.
              required:
                - api_name
          unevaluatedProperties: false
          description: >-
            Represents the target field definition to which the set filter
            criterion is applied, conforming to the base field structure.
        comparator:
          type: string
          enum:
            - in
            - not_in
          description: >-
            Represents the set membership comparison operator applied to the
            criterion.

            Possible values:

            in - Matches records where the field value is in the specified set
            of values.

            not_in - Matches records where the field value is not in the
            specified set of values.
        value:
          type: array
          x-zs-$id: SetFilterCriterionRequestValueArray
          description: >-
            Contains an array of primitive filter values used in the set
            comparison.
          minItems: 1
          maxItems: 500
          items:
            x-zs-$id: SetFilterCriterionRequestValueArrayItems
            oneOf:
              - $ref: '#/components/schemas/SimpleFilterCriterionValueString'
              - $ref: '#/components/schemas/SimpleFilterCriterionValueNumber'
        type:
          type: string
          enum:
            - merge_field
            - pre_defined
            - value
            - field
          default: value
          description: >-
            Indicates the value resolution mode of the criterion, distinguishing
            whether the filter value is a literal value, a merge field
            reference, a predefined system variable, or another field reference.

            Possible values:

            value - The value is a direct literal.

            merge_field - The value is a merge field reference.

            pre_defined - The value is a predefined system variable placeholder.

            field - The value references another field.
      required:
        - field
        - comparator
        - value
      additionalProperties: false
    MultiSelectLookupFilterCriterionRequest:
      type: object
      x-zs-$id: MultiSelectLookupFilterCriterionRequest
      description: >-
        Represents a filter criterion for the include_all, include_any,
        exclude_all, and exclude_any comparators. Applicable only when the
        field's data_type is multiuserlookup or multiselectlookup. The value
        must be an array of SimpleFilterCriterionValueObjectRequest lookup
        objects.
      properties:
        field:
          allOf:
            - $ref: '#/components/schemas/FilterFieldBase'
            - type: object
              additionalProperties: true
              description: >-
                Represents the field reference constraint that requires the
                api_name property to be present for the multi-select lookup
                filter criterion.
              required:
                - api_name
          unevaluatedProperties: false
          description: >-
            Represents the target field definition to which the multi-select
            lookup filter criterion is applied. The field must have a data_type
            of multiuserlookup or multiselectlookup.
        comparator:
          type: string
          enum:
            - include_all
            - include_any
            - exclude_all
            - exclude_any
          description: >-
            Represents the multi-select lookup comparison operator applied to
            the criterion. Applicable only when the field's data_type is
            multiuserlookup or multiselectlookup.

            Possible values:

            include_all - Matches records that include all specified lookup
            values.

            include_any - Matches records that include at least one of the
            specified lookup values.

            exclude_all - Matches records that exclude all specified lookup
            values.

            exclude_any - Matches records that exclude at least one of the
            specified lookup values.
        value:
          maxItems: 5
          type: array
          x-zs-$id: MultiSelectLookupFilterCriterionRequestValueArray
          description: >-
            Contains an array of lookup object references used in the
            multi-select comparison.
          minItems: 1
          items:
            x-zs-$id: MultiSelectLookupFilterCriterionRequestValueArrayItems
            $ref: '#/components/schemas/SimpleFilterCriterionValueObjectRequest'
        type:
          type: string
          enum:
            - merge_field
            - pre_defined
            - value
            - field
          default: value
          description: >-
            Indicates the value resolution mode of the criterion, distinguishing
            whether the filter value is a literal value, a merge field
            reference, a predefined system variable, or another field reference.

            Possible values:

            value - The value is a direct literal.

            merge_field - The value is a merge field reference.

            pre_defined - The value is a predefined system variable placeholder.

            field - The value references another field.
      required:
        - field
        - comparator
        - value
      additionalProperties: false
    SimpleFilterCriterionRequest:
      x-zs-$id: SimpleFilterCriterionRequest
      description: >-
        Represents a simple field-based filter criterion that dispatches to the
        appropriate comparator-specific schema. The equal and not_equal
        comparators support scalar or array values; text comparators support
        scalar or array strings; ordering comparators require a scalar; between
        and not_between comparators require a two-element array; in and not_in
        comparators require an array of primitives; and include_all,
        include_any, exclude_all, and exclude_any comparators require an array
        of lookup objects and apply only when the field's data_type is
        multiuserlookup or multiselectlookup.
      oneOf:
        - $ref: '#/components/schemas/EqualityFilterCriterionRequest'
        - $ref: '#/components/schemas/TextFilterCriterionRequest'
        - $ref: '#/components/schemas/OrderingFilterCriterionRequest'
        - $ref: '#/components/schemas/BetweenFilterCriterionRequest'
        - $ref: '#/components/schemas/SetFilterCriterionRequest'
        - $ref: '#/components/schemas/MultiSelectLookupFilterCriterionRequest'
    GroupedFilterCriterionRequest:
      type: object
      x-zs-$id: GroupedFilterCriterionRequest
      description: >-
        Represents a grouped filter criterion containing multiple filter
        conditions evaluated with a logical operator. Supports recursive nesting
        for complex filtering logic.
      properties:
        group:
          type: array
          description: >-
            Contains an array of filter conditions grouped together and
            evaluated with the specified logical operator.
          minItems: 2
          maxItems: 25
          items:
            oneOf:
              - $ref: '#/components/schemas/SimpleFilterCriterionRequest'
              - $ref: '#/components/schemas/GroupedFilterCriterionRequest'
        group_operator:
          type: string
          enum:
            - AND
            - OR
            - and
            - or
          description: >-
            Represents the logical operator applied between the filter
            conditions in the group.

            Possible values:

            AND - All conditions in the group must be satisfied.

            OR - At least one condition in the group must be satisfied.

            and - Equivalent to AND; all conditions in the group must be
            satisfied.

            or - Equivalent to OR; at least one condition in the group must be
            satisfied.
      required:
        - group
        - group_operator
      additionalProperties: false
    FilterCriterionRequest:
      x-zs-$id: FilterCriterionRequest
      description: >-
        Represents the top-level filter criterion for data selection, supporting
        both simple field-based filters and complex grouped filters with logical
        operators.
      oneOf:
        - $ref: '#/components/schemas/SimpleFilterCriterionRequest'
        - $ref: '#/components/schemas/GroupedFilterCriterionRequest'
    AutomationTagRef:
      x-zs-$id: AutomationTagRef
      type: object
      additionalProperties: false
      description: >-
        PURPOSE: Tag reference for add_tags/remove_tags. Tags must pre-exist -
        GET /settings/tags?module={api_name} to list, POST to create. MANDATORY:
        id, name. Both must resolve to same tag (AMBIGUITY_DURING_PROCESSING if
        mismatch). Non-existent = INVALID_DATA. Limits: 100 tags/module, 10
        tags/record, name max 25 chars.
      x-zs-llm-description: >-
        PURPOSE: Tag reference for add_tags/remove_tags. Tags must pre-exist -
        `getTags` for the module to list, POST to create. MANDATORY: id, name.
        Both must resolve to same tag (AMBIGUITY_DURING_PROCESSING if mismatch).
        Non-existent = INVALID_DATA. Limits: 100 tags/module, 10 tags/record,
        name max 25 chars.
      properties:
        id:
          type: string
          description: >-
            Unique identifier of the tag. Obtain from GET
            /settings/tags?module={module_api_name}. If provided alone, the tag
            is resolved by ID. If both id and name are provided, they must
            resolve to the same tag.
          maxLength: 20
          example: '3361265000001715141'
        name:
          type: string
          description: >-
            Name of the tag. Obtain from GET
            /settings/tags?module={module_api_name}. If provided alone, the tag
            is resolved by name. Must match an existing tag  - providing a
            non-existent name returns INVALID_DATA. Max 25 characters, cannot
            contain <, >, commas, or emojis.
          maxLength: 25
          example: criteria
        color_code:
          type: string
          description: >-
            Hex color code of the tag (e.g., '#879BFC'). Optional in requests;
            present in GET responses. Allowed values: #F17574, #F48435, #E7A826,
            #A8C026, #63C57E, #1DB9B4, #57B1FD, #879BFC, #D297EE, #FD87BD,
            #969696, #658BA8, #B88562.
          maxLength: 25
          example: '#879BFC'
      required:
        - id
        - name
      title: Automation Tag Reference
    AutomationModuleRef:
      x-zs-$id: AutomationModuleRef
      type: object
      additionalProperties: false
      minProperties: 1
      description: >-
        PURPOSE: Module reference used across non-associate actions. At least
        one of api_name or id required (EXPECTED_FIELD_MISSING if neither). If
        both given, must match (AMBIGUITY_DURING_PROCESSING). GET
        /settings/modules to discover. Always use full 19-digit module ID.
      x-zs-llm-description: >-
        PURPOSE: Module reference used across non-associate actions. At least
        one of api_name or id required (EXPECTED_FIELD_MISSING if neither). If
        both given, must match (AMBIGUITY_DURING_PROCESSING). `getModules` to
        discover. Always use full 19-digit module ID.
      properties:
        api_name:
          type: string
          description: API name of the module (e.g., Leads, Contacts, Deals, Vendors).
          maxLength: 255
          example: Leads
        id:
          type: string
          description: >-
            Unique module ID (19-digit format). Always use the full ID as
            returned by GET /settings/modules - truncated or shortened IDs
            return INVALID_DATA ('the tabId given seems to be invalid').
            Optional in requests if api_name is provided; always present in
            responses.
          maxLength: 20
          example: '1189654000000000037'
      title: Automation Module Reference
    AutomationAddTagsDetails:
      x-zs-$id: AutomationAddTagsDetails
      type: object
      additionalProperties: false
      description: >-
        PURPOSE: Details object for add_tags action. Adds pre-existing tags to
        the triggering record. PREREQUISITES: Tags must exist - GET
        /settings/tags?module={api_name} to list, POST to create first.
        MANDATORY: tags (array 1-10, each {id, name}). OPTIONAL: over_write
        (bool, default false - true replaces ALL existing tags), module
        ({api_name, id}). CONSTRAINTS: Not allowed with convert on Leads
        (AMBIGUITY_DURING_PROCESSING). over_write=true + remove_tags in same
        rule = INVALID_DATA. Unsupported: Visits, Users, LinkingModules
        (NOT_ALLOWED).
      x-zs-llm-description: Use `getTags` for the module to list existing tags.
      properties:
        over_write:
          type: boolean
          description: >-
            Whether to overwrite all existing tags on the record with the
            specified tags (true) or append to existing tags (false). Default is
            false. When set to true, any RemoveTags action in the same workflow
            rule becomes invalid and returns INVALID_DATA ('Remove tag not
            supported with Overwrite Add Tag').
          default: false
        tags:
          type: array
          description: >-
            List of tags to add to the record. All tags must pre-exist in the
            org  - fetch available tags from GET
            /settings/tags?module={module_api_name}. To create new tags: POST
            /settings/tags?module={module_api_name}. If the list is empty after
            parsing, the API returns FAILURE ('Empty Tag'). If the tag count
            exceeds the edition limit, the API returns FAILURE ('Invalid Tag
            Count').
          items:
            $ref: '#/components/schemas/AutomationTagRef'
            description: >-
              Represents a tag reference, conforming to the AutomationTagRef
              schema, that identifies a pre-existing org tag to be added to the
              record. Both id and name are mandatory fields on each entry; the
              referenced tag must already exist in the org before the action
              executes.
          minItems: 1
          maxItems: 10
        module:
          $ref: '#/components/schemas/AutomationModuleRef'
          description: >-
            Target module for the tag action. Must match the workflow rule's
            trigger module. Supported modules: Leads, Accounts, Contacts, Deals,
            Campaigns, Tasks, Cases, Events, Calls, Solutions, Products,
            Vendors, Price_Books, Quotes, Sales_Orders, Purchase_Orders,
            Invoices, and custom modules. Unsupported modules (Visits, Users,
            LinkingModules) return NOT_ALLOWED.
        id:
          type: string
          description: >-
            Server-generated unique identifier for this add tags action. Present
            only in GET responses; not required in POST requests.
          maxLength: 20
          example: '111111000000002440'
      required:
        - tags
      title: Automation Add Tags Details
    AutomationFieldAttributes:
      x-zs-$id: AutomationFieldAttributes
      type: object
      additionalProperties: false
      description: >-
        Identifies the target CRM field to which a mapping value is applied
        within an automation rule. The api_name and ID properties must both be
        supplied and must refer to the same field; a mismatch between the two
        causes an AMBIGUITY_DURING_PROCESSING error. Available fields for a
        given module can be discovered via GET
        /settings/fields?module={api_name}.
      x-zs-llm-description: >-
        PURPOSE: Target field reference. MANDATORY: api_name, id. Both must
        refer to same field (AMBIGUITY_DURING_PROCESSING if mismatch).
        `getFields` for the module to discover.
      properties:
        api_name:
          type: string
          description: >-
            Represents the API name of the target field in the destination
            module — for example, Subject, Due_Date, or Owner — used to identify
            the field receiving the mapped value within automation actions such
            as workflow tasks, create_record, and convert.
          maxLength: 255
          example: Subject
        id:
          type: string
          description: >-
            Represents the numeric identifier of the target CRM field. Used in
            conjunction with the field's API name, both of which must resolve to
            the same field for a mapping to be valid.
          maxLength: 255
          example: '111111000000003529'
      required:
        - api_name
        - id
      title: Automation Field Attributes
    StaticStringValue:
      x-zs-$id: StaticStringValue
      type: string
      description: >-
        Represents a plain string value used as the static value for text,
        picklist, phone, email, URL, number, decimal, currency, and percentage
        fields. Numeric values are expressed as strings rather than numeric
        literals. Picklist values must exactly match one of the options defined
        for the field.
      x-zs-llm-description: >-
        PURPOSE: String value for type=static. For text, picklist, phone, email,
        URL, number, decimal, currency, percentage fields. Numbers as strings
        (e.g., "1234"). Picklist values must match available options.
      maxLength: 1000
      example: High
    StaticArrayValue:
      x-zs-$id: StaticArrayValue
      type: array
      description: >-
        Represents an array of string values used as the static value for
        multiselectpicklist fields, where each element corresponds to an
        available picklist option. Valid option labels are retrievable from the
        GET /settings/fields endpoint filtered by data_type=multiselectpicklist.
      x-zs-llm-description: >-
        PURPOSE: Array value for type=static on multiselectpicklist fields. Each
        element must match an available picklist option. `getFields` for
        data_type=multiselectpicklist.
      items:
        type: string
        description: >-
          A single picklist option string to include in the multi-select field
          value. Each entry corresponds to one selectable option as defined for
          the target field in Zoho CRM.
        maxLength: 255
        example: Option1
      minItems: 1
      maxItems: 50
    StaticObjectValue:
      x-zs-$id: StaticObjectValue
      type: object
      additionalProperties: true
      description: >-
        Represents an object value used as the static value for ownerlookup and
        layout fields, containing an ID that identifies the target user or
        layout and an optional name that the server resolves from the ID when
        not supplied. Typically used to assign record ownership by providing the
        user ID.
      x-zs-llm-description: >-
        PURPOSE: Object value for type=static on ownerlookup and layout fields.
        MANDATORY: id (string - user/layout ID). OPTIONAL: name (server resolves
        from id). Use for Owner assignment: {"id": "user_id", "name": "John"}.
      properties:
        id:
          type: string
          description: >-
            The system identifier of the referenced entity, such as a user or
            layout record. This value drives entity resolution by the automation
            engine and must be provided when the target field references an
            entity.
          maxLength: 255
          example: '111113000000059916'
        name:
          type: string
          description: >-
            The display name of the referenced entity, such as a user full name
            or a layout label. When omitted from a request payload, the server
            resolves and populates this property from the supplied ID. The
            property is present in all GET responses.
          maxLength: 255
          example: John Doe
      required:
        - id
      title: Static Object Value
    StaticFieldMapping:
      x-zs-$id: StaticFieldMapping
      type: object
      additionalProperties: false
      description: >-
        Represents a static-type mapping that assigns a literal value directly
        to the target field at execution time. The value shape varies by field
        data type: a plain string for text, picklist, phone, email, URL, number,
        decimal, currency, and percentage fields (numeric values expressed as
        strings); an array of strings for multiselectpicklist fields; and an
        object containing ID and name for ownerlookup fields. Date, datetime,
        and ALARM fields do not support this type — use execution_time instead,
        as static on those fields produces a DEPENDENT_MISMATCH error. Fields
        marked unique in the module settings also require merge_field rather
        than static for create_record actions.
      x-zs-llm-description: >-
        Use getFields and check unique=true before selecting this mapping type.
        Example: {"field": {"api_name": "Subject"}, "type": "static", "value":
        "Follow-up"}.
      properties:
        display_value:
          type: string
          description: >-
            The server-computed representation of the mapped value, included in
            GET responses. Omitted from create and update requests.
          maxLength: 500
        field:
          $ref: '#/components/schemas/AutomationFieldAttributes'
          description: >-
            Target field to populate when the automation executes. api_name is
            required. If id is also provided, both must refer to the same field;
            otherwise the API returns AMBIGUITY_DURING_PROCESSING.
        type:
          type: string
          const: static
          description: >-
            Identifies the mapping strategy for this field assignment. The value
            must be `static`, which instructs the automation engine to assign a
            fixed, literal value to the target field at execution time rather
            than resolving it dynamically.
        value:
          description: >-
            The literal value assigned to the target field at automation
            execution time. The expected shape is determined by the target field
            data_type, discoverable via GET /settings/fields?module={module}.
            For most field types, supply a string (for example, "High", "Not
            Started", "1234"). For multi-select picklist fields (data_type:
            multiselectpicklist), supply an array of option strings. For fields
            that reference an entity such as an owner or layout (data_type:
            ownerlookup), supply an object with at minimum the entity ID.
          x-zs-llm-description: >-
            MANDATORY. PURPOSE: The literal value to assign. VALUES: the shape
            follows the target field data_type - a string for most fields, for
            example "High" or "1234"; an array of option strings for
            multiselectpicklist; an object with id (required) and name
            (optional) for fields that reference an entity, such as ownerlookup
            or layout fields. PREREQUISITES: Read the target field data_type
            from `getFields` for the module before choosing the shape.
          oneOf:
            - $ref: '#/components/schemas/StaticStringValue'
            - $ref: '#/components/schemas/StaticArrayValue'
            - $ref: '#/components/schemas/StaticObjectValue'
      required:
        - field
        - type
        - value
      title: Static Field Mapping
    MergeFieldStringValue:
      x-zs-$id: MergeFieldStringValue
      type: string
      description: >-
        Represents the string value carried by a merge_field mapping, containing
        one or more runtime-resolved token references. Supports direct field
        tokens (${!Module.Field}), lookup traversal tokens
        (${!Module.Lookup.Field}), and system tokens (${CURRENTTIME},
        ${CURRENTUSER}). Tokens may be combined with surrounding text for
        multi-line field targets. Fields that hold a single typed value such as
        email or URL accept exactly one token.
      x-zs-llm-description: >-
        PURPOSE: String with merge-field tokens for type=merge_field. Resolved
        at runtime. Formats: ${!Module.Field} (direct), ${!Module.Lookup.Field}
        (traversal), ${CURRENTTIME}, ${CURRENTUSER}. Chain with text for
        multi-line fields. Single-value fields (email, URL): one token only.
      maxLength: 1000
      example: ${!Leads.First_Name}
    MergeFieldMapping:
      x-zs-$id: MergeFieldMapping
      type: object
      additionalProperties: false
      description: >-
        Represents a merge_field-type mapping whose value is resolved at
        execution time by substituting token references with live field data.
        Supports direct field tokens (${!Module.Field}), traversal tokens
        (${!Module.Lookup.Field}), and system tokens (${CURRENTTIME},
        ${CURRENTUSER}). Applies to text-based fields such as Subject,
        Description, and custom text fields. Targeting owner or lookup fields
        with this type produces a DEPENDENT_MISMATCH error; those fields require
        a static mapping using an object with a numeric identifier and an
        optional name. Multiple tokens may be chained with surrounding text for
        multi-line fields, while single-value fields such as email or URL accept
        exactly one token.
      x-zs-llm-description: >-
        Example: {"field": {"api_name": "Description"}, "type": "merge_field",
        "value": "Lead ${!Leads.First_Name} ${!Leads.Last_Name}"}.
      properties:
        display_value:
          type: string
          description: >-
            The server-computed representation of the mapped value, included in
            GET responses. Omitted from create and update requests.
          maxLength: 500
        field:
          $ref: '#/components/schemas/AutomationFieldAttributes'
          description: >-
            Target field to populate when the automation executes. api_name is
            required. If id is also provided, both must refer to the same field;
            otherwise the API returns AMBIGUITY_DURING_PROCESSING.
        type:
          type: string
          const: merge_field
          description: >-
            Identifies the mapping strategy for this field assignment. The value
            must be `merge_field`, which instructs the automation engine to
            resolve the field value dynamically from a merge field token at
            execution time rather than from a static literal.
        value:
          $ref: '#/components/schemas/MergeFieldStringValue'
          description: >-
            A string containing one or more ${!...} merge-field tokens resolved
            at runtime.
        allow_agent_user:
          type: boolean
          description: >-
            Controls whether agent users are eligible for record assignment.
            Possible values:

            **true** — agent users are included in the assignment pool alongside
            standard users.

            **false** — agent users are excluded from assignment.

            Applies to mapping types role, group, profile, merge_field, and
            criteria. Does not apply to user or assignment_rule types.
          x-zs-llm-description: >-
            PURPOSE: Whether the record may be assigned to an agent user.
            VALUES: true - agent users are included in the assignment pool.
            false - agent users are excluded. KEY CONSTRAINTS: Applicable only
            for the types role, group, profile, merge_field, and criteria. NOT
            supported for types user and assignment_rule.
          default: false
      required:
        - field
        - type
        - value
      title: Merge Field Mapping
    ExecutionTimeValue:
      x-zs-$id: ExecutionTimeValue
      type: object
      additionalProperties: false
      description: >-
        Represents the offset configuration used by an execution_time mapping to
        compute a final date, datetime, or ALARM value at runtime. Contains
        period (the time unit granularity), unit (the numeric magnitude
        expressed as a string integer), and trigger_field (a merge token or
        ${CURRENTTIME}). Date fields use period, unit, and trigger_field with an
        implied positive direction. Datetime fields additionally accept sign to
        control direction. ALARM fields additionally accept time and
        notify_type, and always require a minus sign. Workflow task actions
        restrict period to days or business_days.
      properties:
        period:
          type: string
          description: >-
            The calendar or time unit applied to the offset. Possible values:

            **days** — counts all calendar days including weekends and holidays;
            supported by every action type.

            **business_days** — excludes weekends and requires the
            organisation's business-day setting to be enabled; supported by all
            action types.

            **hours** — available only for create_record, add_meeting, and
            schedule_call.

            **minutes** — available only for create_record, add_meeting, and
            schedule_call.

            workflow_tasks accept only **days** or **business_days**.
          x-zs-llm-description: >-
            MANDATORY. PURPOSE: The calendar or time unit for the offset.
            VALUES: 'days' - calendar days including weekends and holidays,
            supported by all actions. 'business_days' - excludes weekends and
            requires the org business-day setting to be enabled, supported by
            all actions. 'hours' and 'minutes' - supported ONLY by
            create_record, add_meeting, and schedule_call. KEY CONSTRAINTS:
            workflow_tasks accept only 'days' and 'business_days'.
          enum:
            - days
            - business_days
            - hours
            - minutes
        unit:
          type: string
          description: >-
            The number of period units to offset from the trigger date, supplied
            as a non-negative integer string (for example, "1", "30"). Passing
            "0" produces a same-day result, such as scheduling a Remind_At on
            the same day as the due date.
          x-zs-llm-description: >-
            MANDATORY. PURPOSE: The number of periods to offset from the trigger
            date. VALUES: a non-negative integer passed as a STRING, for example
            "1" or "30" - not a number. Use "0" for same-day, such as a
            Remind_At on the same day as the due date.
          pattern: ^[0-9]+$
          maxLength: 20
          example: '1'
        sign:
          type: string
          description: >-
            The direction of the offset relative to the trigger date. Possible
            values:

            **plus** — places the computed value after the trigger (for example,
            a due date two days after record creation).

            **minus** — places the computed value before the trigger (for
            example, a reminder one day before the due date).

            For datetime fields (data_type=datetime) a value is expected;
            omitting it returns a DEPENDENT_FIELD_MISSING error. For date-only
            fields (data_type=date) the value defaults to **plus** when absent.
            When targeting Remind_At (data_type=ALARM), **minus** is the only
            applicable direction.
          enum:
            - plus
            - minus
          default: plus
        trigger_field:
          type: string
          description: >-
            The reference date or datetime field from which the offset is
            measured. Accepts a merge-field token that resolves to a Date or
            DateTime field on the parent module (for example,
            "${!Leads.Modified_Time}", "${!Tasks.Due_Date}"), or the reserved
            constant "${CURRENTTIME}" to use the automation execution timestamp.
            When computing a Remind_At (ALARM) value, "${!Tasks.Due_Date}" is
            the typical anchor.
          x-zs-llm-description: >-
            MANDATORY. PURPOSE: The reference date or datetime field the offset
            is measured from. VALUES: a merge-field token pointing to a Date or
            DateTime field of the parent module, for example
            "${!Leads.Modified_Time}" or "${!Tasks.Due_Date}", or the constant
            "${CURRENTTIME}" for the automation execution timestamp. For
            Remind_At this is typically "${!Tasks.Due_Date}". PREREQUISITES: Use
            `getFields` to confirm the referenced field is a Date or DateTime
            field.
          maxLength: 255
          example: ${CURRENTTIME}
        time:
          type: string
          description: >-
            The time-of-day component of the computed value, expressed in
            24-hour HH:mm format (for example, "13:00", "01:30"). Applies when
            the target field carries data type datetime or ALARM (as reported by
            GET /settings/fields). Supplying this property for a date-only field
            (data_type=date) produces a validation error.
          x-zs-llm-description: >-
            PURPOSE: Time-of-day component for the computed value, in 24-hour
            HH:mm format, for example "13:00" or "01:30". KEY CONSTRAINTS:
            Required when the target field data_type is datetime or ALARM. Do
            NOT include it when data_type=date - sending it for a date-only
            field causes a validation error. PREREQUISITES: Check the target
            field data_type with `getFields`.
          maxLength: 20
          example: '13:00'
        notify_type:
          type: string
          description: >-
            The notification channel used to deliver the reminder. Applies
            exclusively when the target field carries data type ALARM (i.e.,
            Remind_At); date and datetime fields do not use this property.
            Possible values:

            **popup** — triggers an in-app notification.

            **email** — sends a message to the task owner.

            **emailandpopup** — delivers both simultaneously.
          x-zs-llm-description: >-
            PURPOSE: Notification method for the reminder. VALUES: 'popup' -
            in-app popup notification. 'email' - email to the task owner.
            'emailandpopup' - both. KEY CONSTRAINTS: Required only when the
            target field data_type is ALARM (Remind_At); not applicable to date
            or datetime fields.
          enum:
            - popup
            - email
            - emailandpopup
      required:
        - period
        - unit
        - trigger_field
      title: Execution Time Value
    ExecutionTimeFieldMapping:
      x-zs-$id: ExecutionTimeFieldMapping
      type: object
      additionalProperties: false
      description: >-
        Represents an execution_time-type field mapping that computes a date,
        datetime, or ALARM value at runtime by applying a signed offset to a
        trigger field or the current time. The value carries an
        ExecutionTimeValue object specifying the period, unit, trigger_field,
        and optional time or notify_type properties. A plus sign places the
        result after the trigger; a minus sign places it before. ALARM fields
        always require minus. Workflow task actions support only days and
        business_days as period values.
      x-zs-llm-description: >-
        Construct value by field data_type: date uses period, unit, and
        trigger_field and does not need time; datetime also requires sign, whose
        omission returns DEPENDENT_FIELD_MISSING; ALARM also uses time and
        notify_type. Example: {"field": {"api_name": "Due_Date"}, "type":
        "execution_time", "value": {"period": "days", "unit": "2",
        "trigger_field": "${CURRENTTIME}"}}.
      properties:
        display_value:
          type: string
          description: >-
            The server-computed representation of the mapped value, included in
            GET responses. Omitted from create and update requests.
          maxLength: 500
        field:
          $ref: '#/components/schemas/AutomationFieldAttributes'
          description: >-
            Target field to populate when the automation executes. api_name is
            required. If id is also provided, both must refer to the same field;
            otherwise the API returns AMBIGUITY_DURING_PROCESSING.
        type:
          type: string
          const: execution_time
          description: >-
            Identifies the mapping variant as an execution-time offset. The
            value is always "execution_time" for this schema and acts as the
            polymorphic discriminator across the AutomationFieldMappings union.
        value:
          $ref: '#/components/schemas/ExecutionTimeValue'
          description: >-
            Execution-time object specifying how to compute the date/datetime
            offset from a reference field.
      required:
        - field
        - type
        - value
      title: Execution Time Field Mapping
    CompositeFieldMapping:
      x-zs-$id: CompositeFieldMapping
      type: object
      additionalProperties: false
      description: >-
        Represents a composite-type field mapping used exclusively for the
        Participants field in the Events module via the add_meeting action. The
        value carries a structured object that encodes participant data and is
        not applicable to any other field or automation action type.
      x-zs-llm-description: >-
        PURPOSE: Composite value mapping. Used ONLY for the Participants field
        in Events module (add_meeting action). value is a structured object
        representing participant data. Not applicable to any other field or
        action.
      properties:
        display_value:
          type: string
          description: >-
            The server-computed representation of the mapped value, included in
            GET responses. Omitted from create and update requests.
          maxLength: 500
        field:
          $ref: '#/components/schemas/AutomationFieldAttributes'
          description: >-
            Target field to populate when the automation executes. api_name is
            required. If id is also provided, both must refer to the same field;
            otherwise the API returns AMBIGUITY_DURING_PROCESSING.
        type:
          type: string
          const: composite
          description: >-
            Serves as the polymorphic discriminator that identifies this field
            mapping as a composite mapping; the value must be set to "composite"
            to select this schema variant.
        value:
          type: object
          description: >-
            Holds the structured composite object that encodes participant data
            for the Events module Participants field; the shape of this object
            varies according to the participant type configuration defined for
            the automation rule.
          x-zs-llm-description: >-
            MANDATORY. PURPOSE: Structured composite object carrying participant
            data for the Events module Participants field. KEY CONSTRAINTS: The
            exact shape depends on the participant type configuration; this
            value is only valid on the Participants field via add_meeting.
          additionalProperties: true
      required:
        - field
        - type
        - value
      title: Composite Field Mapping
    AutomationFieldMappings:
      x-zs-$id: AutomationFieldMappings
      description: >-
        Represents a single field-to-value mapping used within automation
        actions such as workflow tasks, create_record, add_meeting, and
        schedule_call. Each mapping identifies a target field via api_name or
        ID, declares a type discriminator that determines value interpretation,
        and supplies a value whose shape varies by type: static supplies a
        literal value, merge_field supplies a runtime-resolved token string,
        execution_time supplies a date or datetime offset object, and composite
        supplies structured participant data for the Events Participants field.
        The field_mappings array must include all fields the target module
        requires; omitting any produces a REQUIRED_DATA_NOT_FOUND error.
      oneOf:
        - $ref: '#/components/schemas/StaticFieldMapping'
        - $ref: '#/components/schemas/MergeFieldMapping'
        - $ref: '#/components/schemas/ExecutionTimeFieldMapping'
        - $ref: '#/components/schemas/CompositeFieldMapping'
      discriminator:
        propertyName: type
        mapping:
          static: '#/components/schemas/StaticFieldMapping'
          merge_field: '#/components/schemas/MergeFieldMapping'
          execution_time: '#/components/schemas/ExecutionTimeFieldMapping'
          composite: '#/components/schemas/CompositeFieldMapping'
      title: Automation Field Mappings
    AutomationRelatedRecord:
      x-zs-$id: AutomationRelatedRecord
      type: object
      additionalProperties: false
      description: >-
        Identifies a related module whose open records' ownership should be
        transferred alongside the parent record. Used by assign_owner actions,
        field_updates (Owner field), and convert actions
        (change_owner.related_modules). Common activity modules (Tasks, Calls,
        Events) are available for all modules and actions. Contacts is available
        for assign_owner when parent is Accounts, and for convert when
        converting Leads. Deals is available for assign_owner when parent is
        Accounts or Contacts, and for convert when converting Leads (requires
        create_deal=true).
      x-zs-llm-description: >-
        Identifies a related module whose open records should also change
        ownership when the parent record's owner changes. Used by assign_owner
        (related_records array) and convert (change_owner.related_modules).
        Requires api_name and/or id to identify the child module. Valid modules
        depend on parent: for Leads Events, Calls, Tasks, Contacts, Deals.
      properties:
        api_name:
          type: string
          description: >-
            API name of the related module. Events, Calls, Tasks - open activity
            records, available for all modules and actions (assign_owner,
            convert). Contacts - available for assign_owner when parent is
            Accounts, and for convert when converting Leads. Deals - available
            for assign_owner when parent is Accounts or Contacts, and for
            convert when converting Leads (requires create_deal=true).
          enum:
            - Events
            - Calls
            - Tasks
            - Contacts
            - Deals
          maxLength: 255
          example: Events
        id:
          type: string
          description: >-
            Unique identifier of the related module. This is the module ID
            corresponding to the api_name.
          maxLength: 255
          example: '3361265000000000145'
      required:
        - api_name
      title: Automation Related Record
    AutomationConvertChangeOwner:
      x-zs-$id: AutomationConvertChangeOwner
      type: object
      additionalProperties: false
      description: >-
        PURPOSE: Owner assignment during convert action. MANDATORY: id (user ID
        from GET /users). OPTIONAL: name, related_modules ([{api_name, id}] -
        which converted modules get new owner), apply_assignment_threshold
        (bool). For Leads: related_modules can include Events, Calls, Tasks,
        Contacts, Deals.
      x-zs-llm-description: >-
        PURPOSE: Owner assignment during convert action. MANDATORY: id (user ID
        from `getUsers`). OPTIONAL: name, related_modules ([{api_name, id}] -
        which converted modules get new owner), apply_assignment_threshold
        (bool). For Leads: related_modules can include Events, Calls, Tasks,
        Contacts, Deals.
      properties:
        id:
          type: string
          description: >-
            Unique user ID of the new owner. Obtain from GET /users. Must be an
            active user with permissions on the target modules.
          maxLength: 20
          example: '111111000000002005'
        name:
          type: string
          description: >-
            Full name of the new owner. Optional  - present in GET responses for
            display purposes.
          maxLength: 255
          example: Patricia Boyle
        related_modules:
          type: array
          description: >-
            List of target modules whose records should receive the new owner
            during conversion. Reuses the same related-record concept as
            assign_owner. For Leads conversion: Events, Calls, Tasks, Contacts,
            Deals are valid. For Quotes/SalesOrders conversion: only Events,
            Calls, Tasks are valid.
          items:
            $ref: '#/components/schemas/AutomationRelatedRecord'
            description: >-
              Represents a related module reference, conforming to the
              AutomationRelatedRecord schema, that identifies a child module
              whose records should also receive the new owner assignment during
              the conversion operation. At least one of api_name or id is
              required to identify the child module.
          maxItems: 10
        apply_assignment_threshold:
          type: boolean
          description: >-
            Whether to enforce assignment-threshold rules (record count limits
            per user) on the new owner for each converted module. When true, the
            system checks whether the new owner has reached their record limit
            before assigning ownership.
          default: false
      required:
        - id
      title: Automation Convert Change Owner
    AutomationConvertDetails:
      x-zs-$id: AutomationConvertDetails
      type: object
      additionalProperties: false
      description: >-
        PURPOSE: Details object for convert action. Converts records - Leads to
        Contacts+Accounts+Deals, Quotes to SalesOrders/Invoices, SalesOrders to
        Invoices. PREREQUISITES: criteria_details.criteria MUST be non-null
        (NOT_ALLOWED otherwise). Module MUST be Leads/Quotes/Sales_Orders.
        MANDATORY (Leads): add_to_existing_contact (bool),
        add_to_existing_account (bool). MANDATORY (Quotes/Sales_Orders):
        convert_to ({api_name, id}). OPTIONAL: change_owner, carry_tags (ARRAY
        [{api_name, id}] NOT boolean), field_mappings (max 25),
        move_attachment_to, create_deal (Leads only), contact_role (with
        create_deal). CONSTRAINTS: No add_tags/remove_tags with convert on
        Leads. No scheduled actions with convert.
      properties:
        add_to_existing_contact:
          type: boolean
          description: >-
            MANDATORY for Leads conversion (omitting returns
            MANDATORY_NOT_FOUND). Whether to link the converted record to an
            existing Contact instead of creating a new one. Only applicable for
            Leads module. When true, if a matching Contact exists (based on
            duplicate-check criteria), the Lead is merged into it rather than
            creating a new Contact. Not applicable for Quotes or Sales_Orders
            conversions.
          x-zs-llm-description: >-
            MANDATORY for Leads conversion - omitting it returns
            MANDATORY_NOT_FOUND. PURPOSE: Whether to link the converted record
            to an existing Contact instead of creating a new one. VALUES: true -
            when a matching Contact exists per the duplicate-check criteria, the
            Lead is merged into it. false - a new Contact is always created. KEY
            CONSTRAINTS: Leads module only; not applicable to Quotes or
            Sales_Orders conversions.
          default: false
        add_to_existing_account:
          type: boolean
          description: >-
            MANDATORY for Leads conversion (omitting returns
            MANDATORY_NOT_FOUND). Whether to link the converted record to an
            existing Account instead of creating a new one. Only applicable for
            Leads module. When true, if a matching Account exists (based on
            Company name), the Lead is linked to it rather than creating a new
            Account. Not applicable for Quotes or Sales_Orders conversions.
          x-zs-llm-description: >-
            MANDATORY for Leads conversion - omitting it returns
            MANDATORY_NOT_FOUND. PURPOSE: Whether to link the converted record
            to an existing Account instead of creating a new one. VALUES: true -
            when a matching Account exists (matched on Company name), the Lead
            is linked to it. false - a new Account is always created. KEY
            CONSTRAINTS: Leads module only; not applicable to Quotes or
            Sales_Orders conversions.
          default: false
        move_attachment_to:
          $ref: '#/components/schemas/AutomationModuleRef'
          description: >-
            Target module to which attachments from the source record should be
            moved during conversion. For Leads: typically Contacts or Accounts.
            For Quotes/SalesOrders: the target conversion module. Provide
            api_name and/or id.
        carry_tags:
          type: array
          description: >-
            List of target modules that should inherit tags from the source
            record during conversion. For Leads: may include Contacts, Accounts,
            Deals. Each entry identifies a module by api_name and/or id.
          items:
            $ref: '#/components/schemas/AutomationModuleRef'
            description: >-
              Represents a module reference, conforming to the
              AutomationModuleRef schema, that identifies a target module whose
              records should inherit tags from the source record during
              conversion. At least one of api_name or id is required to identify
              the module; valid values are obtainable from GET
              /settings/modules.
          maxItems: 10
        field_mappings:
          type: array
          description: >-
            List of field-value pairs to populate in the converted record(s).
            Each entry maps a target field to a value using one of the supported
            types: static, merge_field, or execution_time. For Leads conversion,
            field mappings can target Contacts, Accounts, and Deals modules.
            Fetch available fields from GET
            /settings/fields?module={target_module_api_name}.
          items:
            $ref: '#/components/schemas/AutomationFieldMappings'
            description: >-
              Represents a single field-to-value mapping entry for the converted
              record, conforming to the AutomationFieldMappings schema. Each
              entry identifies the target field and specifies the value
              resolution strategy: static for literal values, merge_field for
              runtime token substitution, or execution_time for dynamically
              resolved values.
          maxItems: 25
        create_deal:
          type: boolean
          description: >-
            Whether to create a Deal record as part of Leads conversion. Only
            applicable when the trigger module is Leads. When true, the Deal
            module field mappings in field_mappings are used to populate the new
            Deal.
          default: false
        change_owner:
          $ref: '#/components/schemas/AutomationConvertChangeOwner'
          description: >-
            New owner assignment for the converted records. Specifies the user
            (by id) who should own the converted records, which modules should
            receive the new owner (via related_modules), and whether to enforce
            assignment thresholds. When omitted, the source record's owner is
            retained.
        contact_role:
          type: string
          description: >-
            Unique ID of the Contact Role to assign when a Deal is created
            during Leads conversion. Only applicable when create_deal=true.
            Obtain valid Contact Role IDs from GET /Contacts/roles.
          maxLength: 20
          example: '111111000000002174'
        convert_to:
          type: object
          description: >-
            MANDATORY for Quotes and Sales_Orders conversion (omitting returns
            MANDATORY_NOT_FOUND). Identifies the target module for conversion as
            an object with api_name and id. For Quotes: convert_to can be
            {api_name: 'SalesOrders', id: '<module_id>'} or {api_name:
            'Invoices', id: '<module_id>'}. For Sales_Orders: convert_to must be
            {api_name: 'Invoices', id: '<module_id>'}. Obtain the module id from
            GET /settings/modules. Not applicable for Leads conversion (Leads
            always convert to Contacts+Accounts, optionally +Deals).
          x-zs-llm-description: Use `getModules` to obtain the target module ID.
          properties:
            api_name:
              type: string
              description: >-
                API name of the target module. For Quotes: 'SalesOrders' or
                'Invoices'. For Sales_Orders: 'Invoices'.
              maxLength: 50
              example: SalesOrders
            id:
              type: string
              description: >-
                Unique 19-digit module ID of the target module. Obtain from GET
                /settings/modules. Always use the full 19-digit ID as returned
                by the API; truncated IDs cause INVALID_DATA.
              maxLength: 20
              example: '1189654000000000109'
          required:
            - api_name
            - id
          additionalProperties: false
        portal_user_type:
          type: object
          description: >-
            Portal user type to assign during Leads conversion. Only applicable
            when the org has portals configured and the converted Contact should
            be provisioned as a portal user. The id and name must match an
            existing portal user type - validated against the org's portal
            metadata (CrmClientPortalFilterUtil). Not applicable for Quotes or
            Sales_Orders conversions.
          properties:
            id:
              type: string
              description: >-
                Unique identifier of the portal user type. Must match an
                existing portal user type in the org's portal configuration.
              maxLength: 20
              example: '1189654000000007039'
            name:
              type: string
              description: Display name of the portal user type.
              maxLength: 100
              example: Standard
          required:
            - id
            - name
          additionalProperties: false
        apply_restriction:
          type:
            - boolean
            - 'null'
          description: >-
            Whether to enforce assignment-threshold rules on the record owner
            during conversion. Present in GET responses.
          default: false
        id:
          type: string
          description: >-
            Server-generated unique identifier for this convert action. Present
            only in GET responses; not required in POST requests.
          maxLength: 20
          example: '111111000000002430'
      title: Automation Convert Details
    AutomationLayoutRef:
      x-zs-$id: AutomationLayoutRef
      type: object
      additionalProperties: false
      description: >-
        PURPOSE: Layout reference for create_record, add_meeting, schedule_call
        actions. MANDATORY: id (string). Determines field availability and
        validation rules. GET /settings/layouts?module={api_name} to discover.
      x-zs-llm-description: >-
        PURPOSE: Layout reference for create_record, add_meeting, schedule_call
        actions. MANDATORY: id (string). Determines field availability and
        validation rules. `getLayouts` for the module to discover.
      properties:
        id:
          type: string
          description: >-
            Unique layout ID. Required. Obtain from GET
            /settings/layouts?module={module_api_name}.
          maxLength: 20
          example: '111111000000000167'
        name:
          type:
            - string
            - 'null'
          description: >-
            Display name of the layout. Optional in requests; present in GET
            responses.
          maxLength: 50
          example: Standard
        display_label:
          type: string
          description: Human-readable label of the layout. Present in GET responses.
          maxLength: 50
          example: Standard
      required:
        - id
      title: Automation Layout Reference
    AutomationCreateRecordDetails:
      x-zs-$id: AutomationCreateRecordDetails
      type: object
      additionalProperties: false
      description: >-
        PURPOSE: Details object for create_record action. Creates a record in a
        module with field values from static data, merge fields, or
        execution-time refs. NOT for Tasks/Events/Calls (use tasks, add_meeting,
        schedule_call). PREREQUISITES: GET /settings/modules for id. GET
        /settings/layouts?module={api_name} for layout + mandatory fields. GET
        /settings/fields?module={api_name} for field ids. MANDATORY: module
        ({api_name, id}), layout ({id}), field_mappings (array 1-25, include all
        mandatory fields). OPTIONAL: apply_restriction (bool). EXAMPLE:
        {"module": {"api_name": "Contacts", "id": "111111000000000129"},
        "layout": {"id": "111111000000000403"}, "field_mappings": [{"field":
        {"api_name": "Last_Name"}, "type": "merge_field", "value":
        "${!Leads.Last_Name}"}]}
      x-zs-llm-description: >-
        Use `getModules` to obtain the module ID, `getLayouts` to obtain the
        layout ID and mandatory fields, and `getFields` to obtain field IDs.
      properties:
        module:
          $ref: '#/components/schemas/AutomationModuleRef'
          description: >-
            Target module in which the new record will be created. Supported
            modules: Leads, Contacts, Potentials (Deals), Accounts, Products,
            Cases, custom modules, and team modules. NOT supported: Tasks,
            Events, Calls - use add_meeting for Events and schedule_call for
            Calls. Fetch available modules from GET /settings/modules. At least
            api_name or id must be provided; always use the full 19-digit module
            ID as returned by the modules API.
        layout:
          $ref: '#/components/schemas/AutomationLayoutRef'
          description: >-
            Layout to use when creating the record. Determines which fields are
            available and their validation rules. Fetch valid layouts from GET
            /settings/layouts?module={module_api_name}. The layout.id is
            required.
        field_mappings:
          type: array
          description: >-
            Field mappings for the new record. Each entry: {"field":
            {"api_name": "Last_Name"}, "type": "static", "value": "Test"}. Must
            include all mandatory fields (system_mandatory=true or
            api_mandatory=true from GET /settings/layouts?module={module}) -
            missing ones cause REQUIRED_DATA_NOT_FOUND. Mapping types: static -
            literal values for text, picklist, phone, number fields; NOT for
            Date/DateTime/ALARM (DEPENDENT_MISMATCH) or unique fields
            (INVALID_DATA, check unique=true in GET /settings/fields).
            merge_field - runtime tokens like ${!Leads.Company} for text-based
            fields; NOT for lookup/owner fields (DEPENDENT_MISMATCH).
            execution_time - REQUIRED for Date/DateTime/ALARM fields; periods:
            days, business_days, hours, minutes; sign required for datetime
            fields.
          x-zs-llm-description: >-
            Accepts 1-25 entries. Use `getLayouts` to identify all
            system_mandatory or api_mandatory fields, and `getFields` to check
            field data types and the unique flag.
          items:
            $ref: '#/components/schemas/AutomationFieldMappings'
            description: >-
              Represents a single field-to-value mapping entry for the new
              record, conforming to the AutomationFieldMappings schema. Each
              entry identifies the target field via a field reference and
              specifies the value resolution strategy through a type
              discriminator: static for literal values, merge_field for runtime
              token substitution, execution_time for dynamically resolved
              values, or composite for compound values.
          minItems: 1
          maxItems: 25
        apply_restriction:
          type:
            - boolean
            - 'null'
          description: >-
            Whether to enforce assignment-threshold rules (record count limits
            per user) on the record owner when creating the record. When true,
            the system checks whether the owner has reached their record limit
            before creating the record. Only effective when the org has
            assignment thresholds configured.
          default: false
        id:
          type: string
          description: >-
            Server-generated unique identifier for this create record action.
            Present only in GET responses; not required in POST requests.
          maxLength: 20
          example: '111111000000002415'
      required:
        - module
        - layout
        - field_mappings
      title: Automation Create Record Details
    AutomationAssignOwnerResource:
      x-zs-$id: AutomationAssignOwnerResource
      type: object
      additionalProperties: false
      description: >-
        PURPOSE: Resource reference for assign_to entry. MANDATORY: id (string).
        OPTIONAL: name, type. Obtain from GET /settings/users (user),
        /settings/roles (role), /settings/user_groups (group),
        /settings/automation/assignment_rules (assignment_rule),
        /settings/profiles (profile). If both id and name given, must match
        (AMBIGUITY_DURING_PROCESSING).
      x-zs-llm-description: >-
        PURPOSE: Resource reference for assign_to entry. MANDATORY: id (string).
        OPTIONAL: name, type. Obtain from `getUsers` (user), `getRoles` (role),
        `getUserGroups` (group), `getAssignmentRules` (assignment_rule),
        `getProfiles` (profile). If both id and name given, must match
        (AMBIGUITY_DURING_PROCESSING).
      properties:
        id:
          type: string
          description: >-
            Unique identifier of the target entity. Obtain from the
            corresponding API: GET /settings/users (for user), GET
            /settings/roles (for role), GET /settings/user_groups (for group),
            GET /settings/automation/assignment_rules (for assignment_rule), or
            GET /settings/profiles (for profile).
          maxLength: 255
          example: '111111000000053889'
        name:
          type: string
          description: >-
            Display name of the target entity. Optional in POST/PUT requests
            (server resolves from id); always present in GET responses.
          maxLength: 255
          example: Sri
        type:
          type: string
          description: >-
            Type of the target entity. Present in GET responses; not required in
            POST/PUT requests.
          enum:
            - user
            - role
            - group
            - assignment_rule
            - profile
      required:
        - id
      title: Assign Owner Resource
    AutomationAssignToResourceEntry:
      x-zs-$id: AutomationAssignToResourceEntry
      type: object
      additionalProperties: false
      description: >-
        PURPOSE: assign_to entry for resource-based ownership. MANDATORY: type
        (user|role|group|assignment_rule|profile), resource ({id, name}). For
        type=profile: associated_to must be 'team_profile'. For round-robin: use
        multiple entries of type=user.
      x-zs-llm-description: >-
        PURPOSE: assign_to entry for resource-based ownership. MANDATORY: type
        (user|role|group|assignment_rule|profile), resource ({id, name}). For
        type=profile: associated_to must be 'team_profile'. For round-robin: use
        multiple entries of type=user.
      properties:
        type:
          type: string
          description: >-
            Assignment method. Determines what kind of entity receives
            ownership. Values: "user" - assign to a specific CRM user (GET
            /settings/users), for round-robin include multiple assign_to entries
            of type=user; "role" - assign to a user holding the specified role
            (GET /settings/roles), system picks an eligible user at execution
            time; "group" - assign to a member of the specified user group (GET
            /settings/user_groups); "assignment_rule" - assign using a
            pre-configured assignment rule (GET
            /settings/automation/assignment_rules), the rule's criteria and
            round-robin logic determine the final owner; "profile" - assign to a
            user matching the specified profile (GET /settings/profiles), must
            include associated_to=team_profile.
          enum:
            - user
            - role
            - group
            - assignment_rule
            - profile
        resource:
          $ref: '#/components/schemas/AutomationAssignOwnerResource'
          description: >-
            Identifies the target user, role, group, assignment rule, or profile
            by ID and/or name. At least one of id or name must be provided; if
            both are given and they do not match, the API returns
            AMBIGUITY_DURING_PROCESSING.
        allow_agent_user:
          type: boolean
          description: >-
            Whether to allow assignment to an agent user or not. When true, the
            record can be assigned to an agent user also. When false, agent
            users are excluded from assignment. Applicable only for types: role,
            group, profile, merge_field, criteria. Not supported for types user
            and assignment_rule.
          default: false
        associated_to:
          type:
            - string
            - 'null'
          description: >-
            Association context for profile-based assignment. Must be
            "team_profile" when type=profile. Not applicable for other
            assignment types; if provided for a non-profile type, the API
            returns DEPENDENT_MISMATCH.
          enum:
            - team_profile
            - null
        details:
          type: 'null'
          description: >-
            Always null for resource-based assignments. Present in GET responses
            for schema consistency with other assign_to types.
      required:
        - type
        - resource
      title: Assign To Resource Entry
    AutomationAssignToMergeFieldEntry:
      x-zs-$id: AutomationAssignToMergeFieldEntry
      type: object
      additionalProperties: false
      description: >-
        PURPOSE: assign_to entry for merge-field-based ownership. Resolves to a
        user at execution time from a user-type field. MANDATORY: type (const
        'merge_field'), details.api_name (merge field token e.g.,
        '${!Leads.Created_By}'). Field must be data_type=ownerlookup or
        userlookup. GET /settings/fields?module={api_name} to discover.
      x-zs-llm-description: >-
        PURPOSE: assign_to entry for merge-field-based ownership. Resolves to a
        user at execution time from a user-type field. MANDATORY: type (const
        'merge_field'), details.api_name (merge field token e.g.,
        '${!Leads.Created_By}'). Field must be data_type=ownerlookup or
        userlookup. `getFields` for the module to discover.
      properties:
        type:
          type: string
          description: Assignment method indicating merge field resolution.
          const: merge_field
        details:
          type: object
          additionalProperties: false
          description: >-
            Contains the merge field reference that resolves to a user at
            execution time.
          properties:
            api_name:
              type: string
              description: >-
                Merge field token referencing a user-type field. Must use the
                format ${!Module.User_Field}
                ,${!Module.Lookup_Field_API_Name.User_Field} where Field is a
                user-type field (data_type=ownerlookup or userlookup) from the
                trigger module. Fetch valid fields from GET
                /settings/fields?module={module_api_name}. Common user-type
                fields: Owner, Created_By, Modified_By. Examples:
                ${!Leads.Created_By}, ${!Deals.Owner},
                ${!Contacts.Account_Manager}.
              maxLength: 255
              example: ${!Leads.Created_By}
          required:
            - api_name
        resource:
          type: 'null'
          description: >-
            Always null for merge field assignments. The owner is resolved
            dynamically from the merge field at execution time.
        allow_agent_user:
          type: boolean
          description: >-
            Whether to allow assignment to an agent user or not. When true, the
            record can be assigned to an agent user also. When false, agent
            users are excluded from assignment. Applicable only for types: role,
            group, profile, merge_field, criteria. Not supported for types user
            and assignment_rule.
          default: false
      required:
        - type
        - details
      title: Assign To Merge Field Entry
    AutomationAssignToCriteriaEntry:
      x-zs-$id: AutomationAssignToCriteriaEntry
      type: object
      additionalProperties: false
      description: >-
        PURPOSE: assign_to entry for criteria-based ownership. Evaluates filter
        criteria against the triggering record at execution time. MANDATORY:
        type (const 'criteria'), details.criteria (filter condition - simple or
        grouped with AND/OR). Criteria fields must reference valid trigger
        module fields - GET /settings/fields?module={api_name}.
      x-zs-llm-description: >-
        PURPOSE: assign_to entry for criteria-based ownership. Evaluates filter
        criteria against the triggering record at execution time. MANDATORY:
        type (const 'criteria'), details.criteria (filter condition - simple or
        grouped with AND/OR). Criteria fields must reference valid trigger
        module fields - `getFields` for the module.
      properties:
        type:
          type: string
          description: Assignment method indicating criteria-based evaluation.
          const: criteria
        details:
          type: object
          additionalProperties: false
          description: >-
            Contains the filter criteria to evaluate against the triggering
            record.
          properties:
            criteria:
              $ref: '#/components/schemas/FilterCriterionRequest'
              description: >-
                Filter criteria defining when this assignment applies. Can be a
                simple condition (field + comparator + value) or a grouped
                condition (group_operator + group array). The field references
                in criteria must be valid fields of the trigger module  - fetch
                available fields from GET
                /settings/fields?module={module_api_name}. For example:
                {"field": {"api_name": "Department"}, "comparator": "equal",
                "value": "Engineering"} assigns ownership when the record's
                Department is Engineering.
          required:
            - criteria
        resource:
          type: 'null'
          description: >-
            Always null for criteria-based assignments. The owner is determined
            by the criteria evaluation logic.
        allow_agent_user:
          type: boolean
          description: >-
            Whether to allow assignment to an agent user or not. When true, the
            record can be assigned to an agent user also. When false, agent
            users are excluded from assignment. Applicable only for types: role,
            group, profile, merge_field, criteria. Not supported for types user
            and assignment_rule.
          default: false
      required:
        - type
        - details
      title: Assign To Criteria Entry
    AutomationLookupFieldRef:
      x-zs-$id: AutomationLookupFieldRef
      type: object
      additionalProperties: false
      minProperties: 1
      description: >-
        Identifies a lookup field that links the workflow rule's trigger module
        to the target module of a cross-module action. For example, if the
        trigger module is Leads and the assign owner action targets Contacts,
        the lookup_field identifies which lookup field on Leads points to
        Contacts (e.g., Lookup_2_cont).
      x-zs-llm-description: >-
        Identifies a lookup field linking the rule's trigger module to an
        action's target module. Required for cross-module field_updates (via
        related_details.lookup_field) and cross-module assign_owner (when
        targeting a different module). Both api_name and id should refer to the
        same lookup field mismatch returns AMBIGUITY_DURING_PROCESSING. Obtain
        from getFields filtered by field_type=lookup.
      properties:
        api_name:
          type: string
          description: API name of the lookup field (e.g., Lookup_1_same, Lookup_2_cont).
          maxLength: 255
          example: Lookup_1_same
        id:
          type: string
          description: Unique field ID of the lookup field.
          maxLength: 20
          example: '111111000000070986'
      title: Automation Lookup Field Reference
    AutomationAssignOwnerDetails:
      x-zs-$id: AutomationAssignOwnerDetails
      type: object
      additionalProperties: false
      description: >-
        PURPOSE: Details object for assign_owner action. Assigns/reassigns
        record owner via user, role, group, profile, assignment_rule,
        merge_field, or criteria. MANDATORY: module ({api_name, id} - must match
        trigger module), assign_to (array 1-5 entries). OPTIONAL: notify (bool),
        related_records ([{api_name, id}] - Tasks/Calls/Events),
        apply_assignment_threshold (bool), user_availability_based_on,
        lookup_field (for cross-module). EXAMPLE: {"module": {"api_name":
        "Leads", "id": "111111000000000175"}, "assign_to": [{"type": "user",
        "resource": {"id": "111111000000050001", "name": "John"}}], "notify":
        true}
      properties:
        module:
          $ref: '#/components/schemas/AutomationModuleRef'
          description: >-
            Target module for the ownership assignment. Must match the workflow
            rule's trigger module for direct assignments, or the lookup field's
            related module for cross-module assignments. At least api_name or id
            must be provided; if both are given and they do not match, the API
            returns AMBIGUITY_DURING_PROCESSING.
        assign_to:
          type: array
          description: >-
            Specifies how the new owner is determined. Each entry defines an
            assignment method  - a specific user, role, group, assignment rule,
            profile, merge field, or criteria-based filter. For round-robin
            assignment across multiple users, provide multiple entries of
            type=user. For criteria-based assignment, provide a single entry of
            type=criteria with filter conditions.
          items:
            oneOf:
              - $ref: '#/components/schemas/AutomationAssignToResourceEntry'
              - $ref: '#/components/schemas/AutomationAssignToMergeFieldEntry'
              - $ref: '#/components/schemas/AutomationAssignToCriteriaEntry'
            description: >-
              Represents a single owner-assignment entry that determines how the
              new record owner is resolved. Each entry is one of three variants:
              AutomationAssignToResourceEntry (assigns ownership to a specific
              user, role, group, assignment rule, or profile),
              AutomationAssignToMergeFieldEntry (resolves the owner at runtime
              from a user-type lookup field on the trigger record), or
              AutomationAssignToCriteriaEntry (determines the owner by
              evaluating filter criteria at runtime).
          minItems: 1
          maxItems: 5
        related_records:
          type:
            - array
            - 'null'
          description: >-
            Related modules whose open record ownership should also be
            transferred when the parent record is reassigned. Common activity
            modules (Tasks, Calls, Events) are available for all modules.
            Additional modules depend on the parent module: Accounts can also
            include Contacts and Deals; Contacts can also include Deals. Null
            when no related modules are selected for ownership transfer.
          items:
            $ref: '#/components/schemas/AutomationRelatedRecord'
          maxItems: 5
        notify:
          type: boolean
          description: >-
            Whether to send an email notification to the new owner when the
            record is reassigned. When true, the newly assigned owner receives
            an email informing them of the ownership change.
          default: false
        apply_assignment_threshold:
          type: boolean
          description: >-
            Whether to enforce assignment-threshold rules (record count limits
            per user) when assigning ownership. When true, the system checks
            whether the new owner has reached their record limit before applying
            the assignment. Only effective when the org has assignment
            thresholds configured.
          default: false
        user_availability_based_on:
          type:
            - array
            - 'null'
          description: >-
            Restricts assignment to users who are currently available. When set
            to ["online_status"], only users logged in to the Zoho CRM web
            interface are eligible for assignment. If the selected user is
            offline, the assignment is skipped or deferred. Null means no
            availability check is applied.
          items:
            type: string
            description: >-
              Availability criterion. Currently only "online_status" is
              supported - restricts to users currently logged in to Zoho CRM web
              interface.
            enum:
              - online_status
          maxItems: 1
        lookup_field:
          $ref: '#/components/schemas/AutomationLookupFieldRef'
          description: >-
            The lookup field linking the trigger module to the target module.
            Required only for cross-module assign owner actions (where the
            action's module differs from the workflow rule's trigger module).
            For same-module assignments, this field is omitted and the action
            operates directly on the triggering record.
        id:
          type: string
          description: >-
            Server-generated unique identifier for this assign owner action.
            Present only in GET responses; not required in POST or PUT requests.
          maxLength: 20
          example: '111111000000002412'
      required:
        - module
        - assign_to
      title: Automation Assign Owner Details
    AutomationRemoveTagsDetails:
      x-zs-$id: AutomationRemoveTagsDetails
      type: object
      additionalProperties: false
      description: >-
        PURPOSE: Details object for remove_tags action. Removes tags from the
        triggering record. PREREQUISITES: Tags must exist - GET
        /settings/tags?module={api_name} to list. MANDATORY: tags (array 1-10,
        each {id, name}). OPTIONAL: module ({api_name, id}). CONSTRAINTS: Not
        allowed with convert on Leads (AMBIGUITY_DURING_PROCESSING). If same
        rule has add_tags with over_write=true, this returns INVALID_DATA.
        Unsupported: Visits, Users, LinkingModules (NOT_ALLOWED). Note:
        over_write field is type-checked but its value is ignored for
        remove_tags.
      x-zs-llm-description: Use `getTags` for the module to list existing tags.
      properties:
        tags:
          type: array
          description: >-
            List of tags to remove from the record. All tags must pre-exist in
            the org  - fetch available tags from GET
            /settings/tags?module={module_api_name}. If the list is empty after
            parsing, the API returns FAILURE ('Empty Tag'). If the tag count
            exceeds the edition limit, the API returns FAILURE ('Invalid Tag
            Count').
          items:
            $ref: '#/components/schemas/AutomationTagRef'
            description: >-
              Represents a tag reference, conforming to the AutomationTagRef
              schema, that identifies a pre-existing org tag to be removed from
              the record. Both id and name are mandatory fields on each entry;
              the referenced tag must already exist in the org before the action
              executes.
          minItems: 1
          maxItems: 10
        module:
          $ref: '#/components/schemas/AutomationModuleRef'
          description: >-
            Target module for the tag action. Must match the workflow rule's
            trigger module. Supported modules: Leads, Accounts, Contacts, Deals,
            Campaigns, Tasks, Cases, Events, Calls, Solutions, Products,
            Vendors, Price_Books, Quotes, Sales_Orders, Purchase_Orders,
            Invoices, and custom modules. Unsupported modules (Visits, Users,
            LinkingModules) return NOT_ALLOWED.
        over_write:
          type: boolean
          description: >-
            Present in GET responses. Its value is ignored for remove_tags
            actions.
          default: false
        id:
          type: string
          description: >-
            Server-generated unique identifier for this remove tags action.
            Present only in GET responses; not required in POST or PUT requests.
          maxLength: 20
          example: '111111000000002443'
      required:
        - tags
      title: Automation Remove Tags Details
    AutomationMeetingDuration:
      x-zs-$id: AutomationMeetingDuration
      type: object
      additionalProperties: false
      description: >-
        PURPOSE: Meeting duration for add_meeting. MANDATORY unless
        All_Day=true. REQUIRED: unit (integer - quantity), period (string -
        'hours' or 'minutes'). Must be a JSON object (not int/string -
        INVALID_DATA). Omitting returns MANDATORY_NOT_FOUND. If All_Day=true and
        provided, returns INVALID_DATA (field1/field2 conflict). EXAMPLE:
        {"unit": 1, "period": "hours"}
      x-zs-llm-description: >-
        PURPOSE: Meeting duration for add_meeting. MANDATORY unless
        All_Day=true. REQUIRED: unit (integer - quantity), period (string -
        'hours' or 'minutes'). Must be a JSON object (not int/string -
        INVALID_DATA). Omitting returns MANDATORY_NOT_FOUND. If All_Day=true and
        provided, returns INVALID_DATA (field1/field2 conflict). EXAMPLE:
        {"unit": 1, "period": "hours"}
      properties:
        unit:
          type: integer
          format: int32
          description: The numeric duration value (e.g., 1, 2, 30).
          example: 1
        period:
          type: string
          description: >-
            The time unit for the duration. "hours" - duration in hours (e.g.,
            unit=1, period=hours means a 1-hour meeting). "minutes" - duration
            in minutes (e.g., unit=30, period=minutes means a 30-minute
            meeting).
          enum:
            - hours
            - minutes
          maxLength: 10
          example: hours
      required:
        - unit
        - period
      title: Automation Meeting Duration
    AutomationHostUnavailable:
      x-zs-$id: AutomationHostUnavailable
      type: object
      additionalProperties: false
      description: >-
        PURPOSE: Fallback when meeting host or caller is unavailable. Exactly
        ONE must be specified: assign_record_owner_as_host (bool) OR assign_task
        ({id}). Both = INVALID_DATA. Neither = EXPECTED_FIELD_MISSING.
      x-zs-llm-description: >-
        PURPOSE: Fallback when meeting host or caller is unavailable. Exactly
        ONE must be specified: assign_record_owner_as_host (bool) OR assign_task
        ({id}). Both = INVALID_DATA. Neither = EXPECTED_FIELD_MISSING.
      properties:
        assign_record_owner_as_host:
          type: boolean
          description: >-
            When true, the record owner is automatically assigned as the
            host/caller if the originally designated host is unavailable.
            Mutually exclusive with assign_task.
        assign_task:
          type:
            - object
            - 'null'
          additionalProperties: false
          description: >-
            A follow-up task to create when the host is unavailable. Mutually
            exclusive with assign_record_owner_as_host. The task must be
            pre-configured in the CRM.
          properties:
            name:
              type: string
              description: Name of the follow-up task.
              maxLength: 255
            id:
              type: string
              description: Unique ID of the pre-configured task.
              maxLength: 20
          required:
            - id
      title: Automation Host Unavailable
    AutomationAddMeetingDetails:
      x-zs-$id: AutomationAddMeetingDetails
      type: object
      additionalProperties: false
      description: >-
        PURPOSE: Details object for add_meeting action. Creates an Event record
        when workflow fires. PREREQUISITES: GET /settings/layouts?module=Events
        for layout + mandatory fields. GET /settings/fields?module=Events for
        field ids. MANDATORY: module ({api_name: 'Events', id}), layout ({id}),
