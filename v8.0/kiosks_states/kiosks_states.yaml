        Represents the response for a filter criterion using the include_all,
        include_any, exclude_all, and exclude_any comparators. Applicable only
        when the field's data_type is multiuserlookup or multiselectlookup.
      properties:
        field:
          allOf:
            - $ref: '#/components/schemas/FilterFieldBase'
            - type: object
              additionalProperties: true
              description: >-
                Represents the field reference constraint that requires the
                api_name property to be present for the multi-select lookup
                filter criterion response.
              required:
                - api_name
          unevaluatedProperties: false
          description: >-
            Represents the target field definition to which the multi-select
            lookup filter criterion was applied. The field has a data_type of
            multiuserlookup or multiselectlookup.
        comparator:
          type: string
          enum:
            - include_all
            - include_any
            - exclude_all
            - exclude_any
          description: >-
            Represents the multi-select lookup comparison operator returned for
            the criterion. Applicable only when the field's data_type is
            multiuserlookup or multiselectlookup.

            Possible values:

            include_all - Matches records that include all specified lookup
            values.

            include_any - Matches records that include at least one of the
            specified lookup values.

            exclude_all - Matches records that exclude all specified lookup
            values.

            exclude_any - Matches records that exclude at least one of the
            specified lookup values.
        value:
          type: array
          x-zs-$id: MultiSelectLookupFilterCriterionResponseValueArray
          description: >-
            Contains an array of lookup object references returned for the
            multi-select comparison.
          minItems: 1
          maxItems: 500
          items:
            x-zs-$id: MultiSelectLookupFilterCriterionResponseValueArrayItems
            $ref: '#/components/schemas/SimpleFilterCriterionValueObjectResponse'
        type:
          type: string
          enum:
            - merge_field
            - pre_defined
            - value
            - field
          default: value
          description: >-
            Indicates the value resolution mode of the criterion, distinguishing
            whether the filter value is a literal value, a merge field
            reference, a predefined system variable, or another field reference.

            Possible values:

            value - The value is a direct literal.

            merge_field - The value is a merge field reference.

            pre_defined - The value is a predefined system variable placeholder.

            field - The value references another field.
        $disrupted:
          type: boolean
          description: >-
            Indicates whether the multi-select lookup filter criterion is in a
            disrupted state, typically due to an invalid or unresolvable field
            or value reference.
      required:
        - field
        - comparator
        - value
      additionalProperties: false
    SimpleFilterCriterionResponse:
      x-zs-$id: SimpleFilterCriterionResponse
      description: >-
        Represents the response for a simple field-based filter criterion,
        dispatching to the appropriate comparator-specific response schema.
      oneOf:
        - $ref: '#/components/schemas/EqualityFilterCriterionResponse'
        - $ref: '#/components/schemas/TextFilterCriterionResponse'
        - $ref: '#/components/schemas/OrderingFilterCriterionResponse'
        - $ref: '#/components/schemas/BetweenFilterCriterionResponse'
        - $ref: '#/components/schemas/SetFilterCriterionResponse'
        - $ref: '#/components/schemas/MultiSelectLookupFilterCriterionResponse'
    GroupedFilterCriterionResponse:
      type: object
      x-zs-$id: GroupedFilterCriterionResponse
      description: >-
        Represents the grouped filter criterion returned in the response,
        containing multiple filter conditions evaluated with a logical operator.
        Supports recursive nesting for complex filtering logic.
      properties:
        group:
          type: array
          description: >-
            Contains an array of filter conditions grouped together and
            evaluated with the specified logical operator.
          minItems: 2
          maxItems: 25
          items:
            oneOf:
              - $ref: '#/components/schemas/SimpleFilterCriterionResponse'
              - $ref: '#/components/schemas/GroupedFilterCriterionResponse'
        group_operator:
          type: string
          enum:
            - AND
            - OR
            - and
            - or
          description: >-
            Represents the logical operator applied between the filter
            conditions in the group.

            Possible values:

            AND - All conditions in the group must be satisfied.

            OR - At least one condition in the group must be satisfied.

            and - Equivalent to AND; all conditions in the group must be
            satisfied.

            or - Equivalent to OR; at least one condition in the group must be
            satisfied.
        $disrupted:
          type: boolean
          description: >-
            Indicates whether the grouped filter criterion is in a disrupted
            state, typically due to an invalid or unresolvable condition within
            the group.
      required:
        - group
        - group_operator
      additionalProperties: false
    FilterCriterionResponse:
      x-zs-$id: FilterCriterionResponse
      description: >-
        Represents the top-level filter criterion returned in the response,
        supporting both simple field-based filters and complex grouped filters
        with logical operators.
      oneOf:
        - $ref: '#/components/schemas/SimpleFilterCriterionResponse'
        - $ref: '#/components/schemas/GroupedFilterCriterionResponse'
  parameters:
    ParamPathStateid:
      name: stateId
      in: path
      description: Specify the unique identifier of the kiosk state.
      required: true
      schema:
        type: string
        example: '{stateId}'
        maxLength: 255
    ParamQueryDeleteDependentStates:
      name: delete_dependent_states
      in: query
      description: >
        When a state is deleted, all its associated configurations, transitions,
        and connected elements are removed. Use the delete_dependent_states
        query parameter to control whether dependent/child states should also be
        deleted or left as disconnected components. The default value is true.

        Possible values:

        true

        false
      required: false
      schema:
        type: string
        enum:
          - true|false
    ParamQueryInclude:
      name: include
      in: query
      description: >
        Specify additional properties to be included in the response for each
        Kiosk state. By default, the response returns only the basic metadata of
        each state which includes each state's id, name, and associated_fields.


        **Possible values:**


        **configured_properties** - Includes the configured_properties key in
        the response for each state, which holds the list of merge fields and
        other dynamic references that have been configured within that state.
        When a state has no such configured properties, the value is returned as
        null.
      required: false
      schema:
        type: string
        enum:
          - configured_properties
    ParamPathKioskid:
      name: kioskId
      in: path
      description: Specify the unique identifier of the Kiosk.
      required: true
      schema:
        type: string
        example: '{kioskId}'
        maxLength: 255
    ParamQueryIncludeInnerDetails:
      name: include_inner_details
      in: query
      description: >-
        Specify to include additional inner details in the GET response for the
        kiosk state.
      required: false
      schema:
        type: string
        enum:
          - details.type
  securitySchemes:
    OAuth2:
      type: oauth2
      description: OAuth2 authentication for API access
      flows:
        authorizationCode:
          authorizationUrl: https://accounts.zoho.com/oauth/v2/auth
          tokenUrl: https://accounts.zoho.com/oauth/v2/token
          refreshUrl: https://accounts.zoho.com/oauth/v2/token
          scopes:
            ZohoCRM.settings.kiosks: >-
              Grants full access permission to manage kiosk settings in Zoho
              CRM.
            ZohoCRM.settings.kiosks.ALL: >-
              Grants full access to create, read, update, and delete kiosk
              settings and states in Zoho CRM.
            ZohoCRM.settings.kiosks.CREATE: Grants permission to create kiosk states in Zoho CRM.
            ZohoCRM.settings.kiosks.READ: Grants permission to read kiosk states in Zoho CRM.
            ZohoCRM.settings.kiosks.UPDATE: Grants permission to update kiosk states in Zoho CRM.
            ZohoCRM.settings.kiosks.DELETE: Grants permission to delete kiosk states in Zoho CRM.
