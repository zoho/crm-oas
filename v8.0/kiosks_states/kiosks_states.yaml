        component_name:
          type: string
          description: >-
            Represents the specific type of Zia AI insight component, such as
            prediction or recommendation.
          enum:
            - best_time_to_contact
            - prediction
            - churn_prediction
            - similarity
            - recommendation_early_access
            - Competitors_Alert
            - zia_score
            - next_best_action
            - voc_primary
