                        field_updates:
                          id: '4676645000001212731'
                          name: Action 1
                description: >-
                  Demonstrates creating an action state that executes a CRM
                  operation within a kiosk workflow. The `details.type` field
                  determines the specific operation performed, such as updating
                  field values, sending email notifications, or triggering a
                  webhook.
              GetRecordsStateRequest:
                summary: >-
                  Creates a get_records state that retrieves CRM records via a
                  Get Record component
                value:
