    ScreenCurrency:
      type: object
      additionalProperties: false
      description: >-
        Represents the currency field configuration, including the rounding
        option and precision for storing currency values.
      properties:
        rounding_option:
          type:
            - string
            - 'null'
          description: >
            Specify the rounding method to apply to the currency value. The
            default value is Normal.


            Possible values:


            normal - Truncates the value to the configured number of decimal
            places without rounding.


            round_off - Rounds the value to the configured number of decimal
            places using standard rounding rules.


            round_up - Always rounds the value up to the configured number of
            decimal places.


            round_down - Always rounds the value down to the configured number
            of decimal places.
          enum:
            - normal
            - round_off
            - round_up
            - round_down
        precision:
          type:
            - integer
            - 'null'
          format: int32
          description: >-
            Represents the number of digits displayed after the decimal point
            for the currency field value.
      allOf:
        - description: >-
            Represents the conditional schema constraint that requires the
            precision field when the rounding_option is round_off.
          if:
            description: Conditional schema when rounding_option is round_off
            additionalProperties: false
            type: object
            properties:
              rounding_option:
                const: round_off
                description: Conditional schema when rounding_option is round_off
          then:
            description: 'Schema requiring fields: precision'
            additionalProperties: false
            type: object
            properties:
              precision:
                description: The required field is precision
            required:
              - precision
        - description: >-
            Represents the conditional schema constraint that requires the
            precision field when the rounding_option is round_up.
          if:
            description: Conditional schema when rounding_option is round_up
            additionalProperties: false
            type: object
            properties:
              rounding_option:
                const: round_up
                description: Conditional schema when rounding_option is round_up
          then:
            description: 'Schema requiring fields: precision'
            additionalProperties: false
            type: object
            properties:
              precision:
                description: The required field is precision
            required:
              - precision
        - description: >-
            Represents the conditional schema constraint that requires the
            precision field when the rounding_option is round_down.
          if:
            description: Conditional schema when rounding_option is round_down
            additionalProperties: false
            type: object
            properties:
              rounding_option:
                const: round_down
                description: Conditional schema when rounding_option is round_down
          then:
            description: 'Schema requiring fields: precision'
            additionalProperties: false
            type: object
            properties:
              precision:
                description: The required field is precision
            required:
              - precision
