                description: >-
                  Demonstrates creating a decision state that evaluates filter
                  conditions and routes the kiosk workflow down one of several
                  named paths. Each path is configured with its own criteria
                  groupings and an optional default flag.
              ActionStateRequest:
                summary: Creates an action state that executes a CRM operation
                value:
