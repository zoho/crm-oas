            current_record - Criteria evaluated against the current record.


            get_record - Criteria evaluated based on whether the Get Records
            response contains data or not.


            kiosk_fields - Criteria evaluated against the screen fields or
            action fields from Kiosk.


            loop_record - Evaluates a field from a loop record.
