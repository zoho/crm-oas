                                #/components/schemas/KioskStateErrorInvalidGetRecordReference
                            - $ref: >-
                                #/components/schemas/KioskStateErrorAssociationNotAllowed
                            - $ref: >-
                                #/components/schemas/KioskStateErrorMandatoryFieldMissing
                          description: >-
                            Represents one of the possible error variants for
                            each item in the states array, covering generic
                            validation errors, invalid get_record component
                            references, get_record component association
                            conflicts, and missing required get_record details.
                        description: List of individual state validation errors.
                    required:
                      - states
                    description: >-
                      Batch error response containing individual state
                      validation errors.
                    additionalProperties: false
                    x-zs-$id: UpdateStateBatchErrorResponse
                x-zs-$id: UpdateStateErrorResponse
                description: >-
                  Represents the 400 error response for the updateKioskState
                  operation. Contains either a generic error response with a
                  code, message, and details, or a batch validation response
                  with a states array of per-state error objects.
              examples:
                SingleError:
                  value:
                    code: INVALID_DATA
                    details:
                      api_name: name
                      json_path: $.states[0].name
                      expected_data_type: string
                    message: the value contains invalid data
                    status: error
                  description: >-
                    Represents a single flat 400 error response using the
                    KioskStateErrorResponse shape, without a states array
                    wrapper. The INVALID_DATA code indicates the name field
                    received a value that does not match the expected string
                    data type.
                  summary: >-
                    Single flat error response with an INVALID_DATA code on the
                    name field
                BatchError:
                  value:
                    states:
                      - code: DUPLICATE_DATA
                        details:
                          api_name: name
                          json_path: $.states[0].name
                        message: Duplicate Kiosk state name
                        status: error
                  description: >-
                    Represents a batch 400 response where a kiosk state update
                    failed, returned as a states array of per-state error
                    objects. Each item carries a DUPLICATE_DATA code and a
                    json_path pointer identifying the offending field.
                  summary: >-
                    Batch error response with a DUPLICATE_DATA error on the name
                    field
          headers:
            X-API-CREDITS-REMAINING:
              schema:
                type: string
                format: int64
                description: >
                  Present when >=50% of base daily credits (excluding add-on
                  credits) are consumed. Value is total remaining credits
                  including add-on credits for the rolling 24-hour window.
              required: false
      security:
        - OAuth2:
            - ZohoCRM.settings.kiosks.UPDATE
    delete:
      summary: Delete a kiosk state
      description: >-
        To delete a specific state from a kiosk configuration in your Zoho CRM
        account. Removing a state eliminates all its associated configurations,
        transitions, and connected elements. Use the delete_dependent_states
        query parameter to control whether dependent states are also removed or
        left as disconnected components. The kiosk must be in draft status to
        perform this action. Predefined states (start state and end state)
        cannot be deleted. Available in Standard, Professional, Enterprise, and
        Ultimate editions.
      x-zs-llm-description: >-
        Use the `delete_dependent_states` query parameter to control whether
        dependent/child states should also be deleted or left as disconnected
        components.
      operationId: deleteKioskState
      parameters:
        - $ref: '#/components/parameters/ParamQueryDeleteDependentStates'
        - $ref: '#/components/parameters/ParamPathKioskid'
        - $ref: '#/components/parameters/ParamPathStateid'
      responses:
        '200':
          description: >-
            Returns a confirmation that the specified kiosk state has been
            removed from the kiosk configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteStateResponse'
              examples:
                Success200:
                  summary: Successful deletion of a kiosk state
                  value:
                    states:
                      code: SUCCESS
                      details:
                        id: '111111000000083249'
                        rid: d7fc5a12-0514-4a81-a561-bf112fc7a197
                      message: Kiosk state deleted successfully
                      status: success
                  description: >-
                    Demonstrates a successful deletion of a kiosk state,
                    returning a SUCCESS code along with the deleted state's
                    unique ID.
          headers:
            X-API-CREDITS-REMAINING:
              schema:
                type: string
                format: int64
                description: >
                  Present when >=50% of base daily credits (excluding add-on
                  credits) are consumed. Value is total remaining credits
                  including add-on credits for the rolling 24-hour window.
              required: false
        '400':
          description: >-
            Returned when the request cannot be completed due to invalid input
            or a constraint violation. Errors include referencing a state ID
            that does not exist in the kiosk, attempting to delete a state from
            an active (non-draft) kiosk, or attempting to delete a state whose
            fields are associated with other components. Resolution: Verify the
            state ID is valid, ensure the kiosk is in draft status, and remove
            any dependent component associations before retrying, or use the
            delete_dependent_states query parameter to remove dependent states
            automatically.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KioskStateErrorResponse'
              examples:
                InvalidDataResponse1:
                  summary: >-
                    INVALID_DATA error when the state ID does not exist in the
                    kiosk
                  value:
                    code: INVALID_DATA
                    details:
                      resource_path_index: 4
                    message: No such state exists in Kiosk
                    status: error
                  description: >-
                    Returned when the provided state ID does not correspond to
                    any existing state in the kiosk. The request can be retried
                    with a valid state ID from the kiosk configuration.
                NotAllowedResponse1:
                  summary: >-
                    NOT_ALLOWED error when the state has fields associated with
                    other components
                  value:
                    code: NOT_ALLOWED
                    details:
                      resource_path_index: 4
                    message: >-
                      Screen contains fields which are associated in other
                      components
                    status: error
                  description: >
                    Returned when the state being deleted contains fields that
                    are linked to other components within the kiosk. The
                    dependent associations must be removed first, or the
                    delete_dependent_states parameter can be set to true to
                    delete the state along with all its dependent states.
                NotAllowedResponse2:
                  summary: >-
                    NOT_ALLOWED error when the kiosk is active and not in draft
                    status
                  value:
                    code: NOT_ALLOWED
                    details:
                      resource_path_index: 2
                    message: Active kiosk does not allow perform given operation
                    status: error
                  description: >-
                    Returned when a deletion is attempted on a kiosk that is
                    currently active rather than in draft status. States can
                    only be deleted from kiosks that are in draft status.
          headers:
            X-API-CREDITS-REMAINING:
              schema:
                type: string
                format: int64
                description: >
                  Present when >=50% of base daily credits (excluding add-on
                  credits) are consumed. Value is total remaining credits
                  including add-on credits for the rolling 24-hour window.
              required: false
      security:
        - OAuth2:
            - ZohoCRM.settings.kiosks.DELETE
components:
  schemas:
    CreateStatePayload:
      type: object
      description: >-
        Represents the kiosk state creation payload. The type field determines
        whether the state is a screen, decision, action, or get_records state,
        and the corresponding structure of the details object.
      properties:
        from_transition:
          $ref: '#/components/schemas/FromTransition'
        name:
          type: string
          maxLength: 250
          description: >-
            Specify the unique display name of the state. The maximum length is
            50 characters, and it must match the regex pattern
            [0-9a-zA-Z_\-\.\|\$\?\,\'\/\!\P{InBasicLatin}\s]+.
        type:
          $ref: '#/components/schemas/StateType'
        details:
          description: >-
            Represents the state-specific configuration object. The structure
            varies by the state type: screen uses ScreenCreateDetails, decision
            uses DecisionCreateDetails, action uses ActionCreateDetails, and
            get_records uses GetRecordCreateDetails.
          oneOf:
            - $ref: '#/components/schemas/ScreenCreateDetails'
            - $ref: '#/components/schemas/DecisionCreateDetails'
            - $ref: '#/components/schemas/ActionCreateDetails'
            - $ref: '#/components/schemas/GetRecordCreateDetails'
      required:
        - from_transition
        - name
        - type
        - details
      additionalProperties: false
      allOf:
        - if:
            properties:
              type:
                const: screen
                description: 'State type value: screen'
            description: 'Condition: type is screen'
          then:
            properties:
              from_transition: {}
              name: {}
              type: {}
              details:
                $ref: '#/components/schemas/ScreenCreateDetails'
            description: 'Properties applied when condition is met: details'
          description: >-
            Represents the from_transition property that identifies the
            transition edge activating the new kiosk state.
        - if:
            properties:
              type:
                const: decision
                description: 'State type value: decision'
            description: 'Condition: type is decision'
          then:
            properties:
              from_transition: {}
              name: {}
              type: {}
              details:
                $ref: '#/components/schemas/DecisionCreateDetails'
            description: 'Properties applied when condition is met: details'
          description: >-
            Represents the name property that defines the display name of the
            new kiosk state.
        - if:
            properties:
              type:
                const: action
                description: 'State type value: action'
            description: 'Condition: type is action'
          then:
            properties:
              from_transition: {}
              name: {}
              type: {}
              details:
                $ref: '#/components/schemas/ActionCreateDetails'
            description: 'Properties applied when condition is met: details'
          description: >-
            Represents the type discriminator property that specifies the state
            type.
        - if:
            properties:
              type:
                const: get_records
                description: 'State type value: get_records'
            description: 'Condition: type is get_records'
          then:
            properties:
              from_transition: {}
              name: {}
              type: {}
              details:
                $ref: '#/components/schemas/GetRecordCreateDetails'
            description: 'Properties applied when condition is met: details'
          description: >-
            Represents the details property containing the state-specific
            configuration object.
    CreateStateRequest:
      type: object
      additionalProperties: false
      description: >-
        Represents the request body for creating a kiosk state. The states array
        contains exactly one state object, and the type field determines which
        details schema applies.
      properties:
        states:
          type: array
          maxItems: 1
          description: Represents the array containing exactly one state object to create.
          items:
            $ref: '#/components/schemas/CreateStatePayload'
      required:
        - states
    GetStateResponse:
      type: object
      additionalProperties: false
      description: >-
        Represents the response for retrieving a specific kiosk state. The state
        details structure varies by type and can be a screen, decision, action,
        or get_records state.
      properties:
        states:
          type: array
          maxItems: 1
          items:
            oneOf:
              - $ref: '#/components/schemas/GETScreenState'
              - $ref: '#/components/schemas/GETDecisionState'
              - $ref: '#/components/schemas/GETActionStateDetail'
              - $ref: '#/components/schemas/GETGetRecordState'
            description: >-
              Represents a single kiosk state, either a screen, decision,
              action, or get_records state, with its full configuration details.
          description: Represents the list of states returned for the kiosk.
      required:
        - states
      x-zs-$id: GetStateResponse
    StateType:
      type: string
      description: >
        Represents the type of the kiosk state. Determines the structure of the
        details configuration object.

        Possible values:

        screen - A visual screen state with form elements.

        decision - A conditional branching state.

        action - A CRM operation state.

        get_records - A record retrieval state.
      enum:
        - screen
        - decision
        - action
        - get_records
      x-zs-$id: StateType
    UpdateStatePayload:
      type: object
      additionalProperties: false
      description: >-
        Represents the kiosk state update payload. The ID field is the only
        required property; all other fields are optional and only the included
        fields are changed.
      x-zs-llm-description: >-
        MANDATORY: The state id is the only mandatory field in the update
        payload. All other top-level keys (from_transition, name, type, details)
        are optional - include only what you intend to change, and unspecified
        fields will retain their current values. CONDITIONAL VALIDATION: If a
        top-level key is included in the payload, its own internal mandatory
        rules still apply - for example, if execute_for_record is provided
        within the action details, its id field becomes mandatory.
      properties:
        from_transition:
          $ref: '#/components/schemas/FromTransitionUpdate'
        name:
          type:
            - string
            - 'null'
          maxLength: 250
          description: Represents the display name of the kiosk state.
        type:
          oneOf:
            - $ref: '#/components/schemas/StateType'
            - type: 'null'
              description: >-
                Represents the null variant of the type field, used when
                updating a state without changing its type.
              x-zs-$id: NullStateType
          description: >-
            Represents the type of the kiosk state. The value determines the
            structure of the details object.
        id:
          type: string
          maxLength: 19
          description: Represents the unique identifier of the kiosk state to be updated.
        details:
          description: >-
            Represents the state-specific configuration object to be updated.
            The structure varies by the state type.
          oneOf:
            - $ref: '#/components/schemas/ScreenUpdateDetails'
            - $ref: '#/components/schemas/DecisionCreateDetails'
            - $ref: '#/components/schemas/ActionUpdateDetails'
            - $ref: '#/components/schemas/GetRecordUpdateDetails'
      allOf:
        - if:
            properties:
              type:
                const: screen
                description: 'State type value: screen'
            description: 'Condition: type is screen'
          then:
            properties:
              from_transition: {}
              name: {}
              type: {}
              id: {}
              details:
                $ref: '#/components/schemas/ScreenUpdateDetails'
            description: 'Properties applied when condition is met: details'
          description: >-
            Represents the screen state variant of the update payload. Applies
            when the state type is screen.
        - if:
            properties:
              type:
                const: decision
                description: 'State type value: decision'
            description: 'Condition: type is decision'
          then:
            properties:
              from_transition: {}
              name: {}
              type: {}
              id: {}
              details:
                $ref: '#/components/schemas/DecisionCreateDetails'
            description: 'Properties applied when condition is met: details'
          description: >-
            Represents the decision state variant of the update payload. Applies
            when the state type is decision.
        - if:
            properties:
              type:
                const: action
                description: 'State type value: action'
            description: 'Condition: type is action'
          then:
            properties:
              from_transition: {}
              name: {}
              type: {}
              id: {}
              details:
                $ref: '#/components/schemas/ActionUpdateDetails'
            description: 'Properties applied when condition is met: details'
          description: >-
            Represents the action state variant of the update payload. Applies
            when the state type is action.
        - if:
            properties:
              type:
                const: get_records
                description: 'State type value: get_records'
            description: 'Condition: type is get_records'
          then:
            properties:
              from_transition: {}
              name: {}
              type: {}
              id: {}
              details:
                $ref: '#/components/schemas/GetRecordUpdateDetails'
            description: 'Properties applied when condition is met: details'
          description: >-
            Represents the get_records state variant of the update payload.
            Applies when the state type is get_records.
    UpdateStateRequest:
      type: object
      additionalProperties: false
      description: >-
        Represents the request body for updating a kiosk state. The states array
