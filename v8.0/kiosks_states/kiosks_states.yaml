            action configured in the workflow. If we give ID of the configured
            action, it will be associated here. It is mandatory for this field
            update action id to be associated in only one place or state of the
            Kiosk. You cannot a single field update action in many action
            states.
        quick_create_record:
          $ref: '#/components/schemas/ActionQuickCreateRecordUpdate'
          description: >-
            It is an action used to quickly configure a create record action
            with minimal field input. However, there will be a pop up during the
            execution of the action where the user must provide the values for
            the fields configured. Then, the record will be created.
        tasks:
          $ref: '#/components/schemas/ActionTasksUpdate'
          description: >-
            Tasks is another associate action which helps in assigning tasks to
            specific records. This JSON will consist of the resource identifiers
            for the Tasks action in the workflow.
        schedule_call:
          $ref: '#/components/schemas/AutomationScheduleCallDetails'
