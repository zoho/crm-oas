        Represents the details configuration object for updating a kiosk action
        state. The structure is composed using allOf to include one or more
        optional action-type properties depending on the configured action.
      properties:
        execute_for_record:
          $ref: '#/components/schemas/ActionExecuteForRecordUpdate'
          description: >-
            For associate actions and few non associate actions, the action
            should be performed on a specific record in the CRM system. For
            example, if the user is creating the field update action to modify a
            company name, he must provide which record's company name should be
            changed. So, he should provide either a get record reference or a
            current record reference in "execute_for_record" key. ID and name of
            the resource will be enough. However, for actions which are
            unrelated for a specific record, this key can be ignored. 
        add_tags:
          $ref: '#/components/schemas/AutomationAddTagsDetails'
          description: >-
            Configuration for the add_tags action. Referenced from
            AutomationNonAssociateActions.json. MANDATORY: id (state id), and id
            (action's id inside "details") is mandatory for update.
        note:
          $ref: '#/components/schemas/ActionNoteUpdate'
          description: >-
            Configuration used to create a note associated with a CRM record.
            For example, a specific Lead detail view page can have a note by
            running this particular action.
        functions:
          $ref: '#/components/schemas/ActionFunctionsUpdate'
          description: >-
            Functions is an associated action which will execute a piece of code
            or other operations upon execution. These functions would have been
            created either previously or during the creation of the action which
            can be associated and run during action execution. It acts as a
            server-side function executed when kiosk is executed.
        open_record:
          $ref: '#/components/schemas/ActionOpenRecordUpdate'
          description: >-
            It is an action to open a particular record fetched from the CRM
            modules. The user will configure either a get record or a current
            record with this action. The fetched record is opened automatically
            when the action is executed.
        get_record:
          $ref: '#/components/schemas/ActionGetRecordAssociationUpdate'
          description: >-
            This is the JSON which contains the association details of the
            get_record component for a get_records state.
        criteria:
          $ref: '#/components/schemas/FilterCriterionRequest'
          description: >-
            Criteria for ownership assignment comparison. Referenced from
            Criterion.json.
        open_link:
          $ref: '#/components/schemas/ActionOpenLinkUpdate'
          description: >-
            Open link is an action used to open a specific link which is
            configured during state creation when triggered. This json will
            consist of the link and encoding details.
        convert:
          $ref: '#/components/schemas/AutomationConvertDetails'
          description: >-
            Configuration for the convert action. Referenced from
            AutomationNonAssociateActions.json. MANDATORY: id (state id), and id
            (action's id inside "details")  is mandatory for update.
        type:
          type:
            - string
            - 'null'
          description: >-
            Indicates the action type for the kiosk action state. The specified
            type determines which action configuration object must be present in
            the details object.
          enum:
            - field_updates
            - assign_owner
            - add_tags
            - create_record
            - note
            - remove_tags
            - email_notifications
            - tasks
            - webhooks
            - functions
            - add_meeting
            - schedule_call
            - convert
            - open_record
            - open_link
            - quick_create_record
          maxLength: 20
        create_record:
          $ref: '#/components/schemas/AutomationCreateRecordDetails'
          description: >-
            Configuration for the create_record action. Referenced from
            AutomationNonAssociateActions.json. MANDATORY: id (state id), and id
            (action's id inside "details")  is mandatory for update.
        assign_owner:
          $ref: '#/components/schemas/AutomationAssignOwnerDetails'
          description: >-
            Configuration for the assign_owner action. Referenced from
            AutomationNonAssociateActions.json. MANDATORY: id (state id), and id
            (action's id inside "details")  is mandatory for update.
        remove_tags:
          $ref: '#/components/schemas/AutomationRemoveTagsDetails'
          description: >-
            Configuration for the remove_tags action. Referenced from
            AutomationNonAssociateActions.json. MANDATORY: id (state id), and id
            (action's id inside "details")  is mandatory for update.
        add_meeting:
          $ref: '#/components/schemas/AutomationAddMeetingDetails'
          description: >-
            Configuration for the add_meeting action. Referenced from
            AutomationNonAssociateActions.json. MANDATORY: id (state id), and id
            (action's id inside "details")  is mandatory for update.
        webhooks:
          $ref: '#/components/schemas/ActionWebhooksUpdate'
          description: >-
            Represents a webhook action that triggers an external HTTP callback
            when executed. The webhook configuration can be done during the
            creation of the state. However, these configuration details won't
            come in the webhook action payload. The payload will only refer the
            webhook created.
        api_name:
          type:
            - string
            - 'null'
          description: >-
            Represents the merge field API name used to dynamically resolve the
            owner for the assign_owner action. When the user is not provided
            directly, the merge field expression identifies the user. Supported
            formats: (1) Record field:
            `${!<kiosk_group_api_name>.<resource_api_name>.<field_api_name>}`
            where resource can be `CurrentRecord` or a GetRecord API name. (2)
            CRM module field: `${!<module_api_name>.<field_api_name>}` for
            example, `${!users.email}`. (3) Kiosk screen field:
            `${!<kiosk_group_api_name>.<screen_field_api_name>}`.
