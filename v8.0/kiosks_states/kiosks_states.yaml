openapi: 3.1.0
info:
  title: Kiosk States
  description: >
    Kiosk states are the individual nodes that compose a Kiosk in Zoho CRM, each
    representing a discrete step - screen, decision, action, or get-record that
    guides users through a structured business process. This API enables
    developers to create, retrieve, update, and delete kiosk states across all
    four state types within a kiosk.
  version: '8'
servers:
  - url: https://zohoapis.{dc}/crm/{version}
    description: API Server for /crm
    variables:
      dc:
        default: com
        enum:
          - com
          - eu
          - in
          - cn
          - au
          - ca
          - jp
        description: Data center region
      version:
        default: v8
        description: API version
paths:
  /settings/kiosks/{kioskId}/states:
    get:
      summary: Get all states of a kiosk
      description: >
        To retrieve all the states configured in a kiosk in your Zoho CRM
        organization, along with their transition details and basic metadata
        such as name, type, and associated fields. Each state represents a
        screen, action, decision, or GetRecords.


        Available in: Standard, Professional, Enterprise, and Ultimate editions.
      operationId: getAllKioskStates
      parameters:
        - $ref: '#/components/parameters/ParamQueryInclude'
        - $ref: '#/components/parameters/ParamQueryIncludeInnerDetails'
        - $ref: '#/components/parameters/ParamPathKioskid'
      responses:
        '200':
          description: >-
            Returns the list of all states configured in the specified kiosk,
            including each state name, type, transitions, and associated fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllStatesResponse'
              examples:
                Success200:
                  summary: Successful response with action and get_records kiosk states
                  value:
                    states:
                      - associated_fields: null
                        name: Action 117
                        id: '4676645000000888060'
                        type: action
                        transitions:
                          - name: Action 117
                            id: '4676645000000888061'
                      - associated_fields: []
                        name: GetRecords 131
                        id: '4676645000000888425'
                        type: get_records
                        transitions:
                          - name: GetRecords 131
                            id: '4676645000000888426'
                      - associated_fields: null
                        name: Decision 21
                        id: '4676645000000887142'
                        type: decision
                        transitions:
                          - name: Path 1
                            id: '4676645000000887137'
                          - name: Default
                            id: '4676645000000887139'
                      - associated_fields:
                          - api_name: Pick_List_1
                            id: '4676645000000877779'
                          - api_name: Query_1
                            id: '4676645000000885198'
                          - api_name: GetRecords_1
                            id: '4676645000000885247'
                          - api_name: Single_Line_1
                            id: '4676645000000885268'
                          - api_name: Multi_Line_1
                            id: '4676645000000885283'
                          - api_name: Phone_1
                            id: '4676645000000885298'
                          - api_name: Number_1
                            id: '4676645000000885313'
                          - api_name: Currency_1
                            id: '4676645000000885328'
                          - api_name: URL_1
                            id: '4676645000000885343'
                          - api_name: Date_Time_1
                            id: '4676645000000885358'
                          - api_name: Email_1
                            id: '4676645000000885373'
                          - api_name: Checkbox_1
                            id: '4676645000000885388'
                          - api_name: GetRecords_1
                            id: '4676645000000885247'
                        name: Screen 1
                        details:
                          screen_details:
                            width: 670px
                            title: Screen 1
                            button_align: right_to_left
                        id: '4676645000000877750'
                        type: screen
                        transitions:
                          - name: Done
                            id: '4676645000000877748'
                  description: >-
                    Shows a successful response containing two kiosk states: one
                    of type **action** and one of type **get_records**, each
                    with their transitions and associated fields.
          headers:
            X-API-CREDITS-REMAINING:
              schema:
                type: string
                format: int64
                description: >
                  Present when >=50% of base daily credits (excluding add-on
                  credits) are consumed. Value is total remaining credits
                  including add-on credits for the rolling 24-hour window.
              required: false
        '204':
          description: Returns no content. The specified kiosk contains no states.
          headers:
            X-API-CREDITS-REMAINING:
              schema:
                type: string
                format: int64
                description: >
                  Present when >=50% of base daily credits (excluding add-on
                  credits) are consumed. Value is total remaining credits
                  including add-on credits for the rolling 24-hour window.
              required: false
        '400':
          description: >-
            The request contains invalid data or parameters.

            **Resolution:** A valid kiosk ID must be specified in the request
            URL, and all query parameter values must be valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KioskStateErrorResponse'
              examples:
                SingleError:
                  value:
                    code: INVALID_DATA
                    details:
                      api_name: name
                      json_path: $.states[0].name
                      expected_data_type: string
                    message: the value contains invalid data
                    status: error
                  description: >-
                    Shows an INVALID_DATA error response returned when the kiosk
                    ID specified in the request URL does not exist.
                  summary: INVALID_DATA error for a nonexistent kiosk ID
          headers:
            X-API-CREDITS-REMAINING:
              schema:
                type: string
                format: int64
                description: >
                  Present when >=50% of base daily credits (excluding add-on
                  credits) are consumed. Value is total remaining credits
                  including add-on credits for the rolling 24-hour window.
              required: false
      security:
        - OAuth2:
            - ZohoCRM.settings.kiosks.READ
    post:
      summary: Create a kiosk state
      description: >
        Creates a state (screen, action, decision, or GetRecords) in a Kiosk
        identified by Kiosk ID. Only **one state** can be created per request.


        The Kiosk must be in **draft** status; use the [Clone a Kiosk
        API](kiosks.yaml#$.paths./settings/kiosks/{kioskId}/actions/clone.post)
        if it is published or inactive. Call this API repeatedly to add more
        states, then
        [publish](kiosks.yaml#$.paths./settings/kiosks/{kioskId}/actions/activate.put)
        the Kiosk and
        [associate](kiosks_get_records.yaml#$.paths./settings/kiosks/{kioskId}/associations.put)
        it with the required CRM component. To modify an existing state, use the
        [Update Kiosk States
        API](kiosks_state.yaml#$.paths./settings/kiosks/{kioskId}/states.put).
      x-zs-llm-description: >-
        The state must be attached to an existing transition in the kiosk flow
        using `from_transition.id`.
