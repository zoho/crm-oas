        Defines the field label, data type, API name, UI type, validation rules,
        and additional type-specific properties.
      properties:
        allow_multiple_upload:
          type:
            - boolean
            - 'null'
          description: |
            Indicates whether multiple file uploads are allowed for the field.
            Possible values:
            true - Multiple file uploads are allowed.
            false - Only a single file upload is allowed.
        field_label:
          type:
            - string
            - 'null'
          description: >-
            Represents the display label shown to the user for the input field.
            This label is visible on the screen but does not affect backend
            storage.
          maxLength: 255
          pattern: >-
            [0-9a-zA-Z_\\-\\.\\|\\$\\&@\\(\\)\\?\\,\\'\\/\\!\\P{InBasicLatin}\\s]+
        length:
          type:
            - integer
            - 'null'
          format: int32
          description: >-
            Represents the maximum number of characters or digits allowed for
            the field. For file upload fields, the value must be 1 or 5.
          x-zs-llm-description: >-
            REQUIRED when data_type is currency, textarea, integer, or
            fileupload. For fileupload: must be 1 or 5 (enum). For percent: must
            be 1-5. For currency: decimal_place must always be greater than the
            precision value in the currency object.
        tooltip:
          $ref: '#/components/schemas/ScreenTooltip'
          description: >
