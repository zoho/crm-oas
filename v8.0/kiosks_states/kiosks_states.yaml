        '400':
          description: >-
            The request contains invalid or incomplete state configuration data.

            **Resolution:** Review the error response for the specific `code`
            and affected field details. Correct any invalid values, supply all
            required fields, resolve duplicate data conflicts, and ensure Get
            Record references are valid and not already associated with another
            component before retrying.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/KioskStateErrorResponse'
                  - type: object
                    properties:
                      states:
                        type: array
                        maxItems: 25
                        items:
                          oneOf:
                            - $ref: '#/components/schemas/KioskStateErrorResponse'
                            - $ref: >-
                                #/components/schemas/KioskStateErrorInvalidGetRecordReference
                            - $ref: >-
                                #/components/schemas/KioskStateErrorAssociationNotAllowed
                            - $ref: >-
                                #/components/schemas/KioskStateErrorMandatoryFieldMissing
                          description: >-
                            Validation error details for a single kiosk state.
                            Each item conforms to one of these shapes:


                            - **KioskStateErrorResponse** — General validation
                            error. `code` is one of `INVALID_DATA`,
                            `MANDATORY_NOT_FOUND`, `NOT_ALLOWED`,
                            `DUPLICATE_DATA`, `LIMIT_EXCEEDED`,
                            `AMBIGUITY_DURING_PROCESSING`,
                            `DEPENDENT_FIELD_MISSING`, or `DEPENDENT_MISMATCH`.

                            - **KioskStateErrorInvalidGetRecordReference** —
                            Invalid Get Record reference (`code: INVALID_DATA`).

                            - **KioskStateErrorAssociationNotAllowed** — Get
                            Record already associated with another element
                            (`code: NOT_ALLOWED`).

                            - **KioskStateErrorMandatoryFieldMissing** —
                            Required field missing from the state configuration
                            (`code: MANDATORY_NOT_FOUND`).
                        description: >-
                          Represents the list of per-state validation errors
                          returned when one or more states in the request fail
                          processing. Each item describes the error encountered
                          for an individual state.
                    required:
                      - states
                    description: >-
                      Represents a batch error response in which one or more
                      kiosk state creation requests failed, returning an array
                      of per-state error details.
                    additionalProperties: false
                    x-zs-$id: CreateStateBatchErrorResponse
                x-zs-$id: CreateStateErrorResponse
                description: >-
                  Error response body returned when state creation fails
                  validation. Conforms to one of these shapes:


                  - **Single error** — A `KioskStateErrorResponse` object
                  describing a request-level failure.

                  - **Batch errors** — An object with a `states` array, where
                  each item is the validation error for an individual state.


                  Possible error codes: `INVALID_DATA`, `MANDATORY_NOT_FOUND`,
                  `NOT_ALLOWED`, `DUPLICATE_DATA`, `LIMIT_EXCEEDED`,
                  `AMBIGUITY_DURING_PROCESSING`, `DEPENDENT_FIELD_MISSING`,
                  `DEPENDENT_MISMATCH`.
              examples:
                SingleError:
                  value:
                    code: INVALID_DATA
                    details:
                      api_name: name
                      json_path: $.states[0].name
                      expected_data_type: string
                    message: the value contains invalid data
                    status: error
                  description: >-
                    Returns a single KioskStateErrorResponse object representing
                    a validation failure for the submitted state. The response
                    includes an error code, a descriptive message, a status of
                    error, and a details object providing additional context
                    such as the field name, JSON path, and expected data type.
                  summary: Single validation error for the submitted state
                BatchError:
                  value:
                    states:
                      - code: DUPLICATE_DATA
                        details:
                          api_name: name
                          json_path: $.states[0].name
                        message: Duplicate Kiosk state name
                        status: error
                  description: >-
                    Returns a states array in which each element represents a
                    per-state validation error for a submitted state
                    configuration that failed validation. Each element conforms
                    to one of the KioskStateErrorResponse variants and contains
                    the error code, message, and contextual details.
                  summary: Batch validation errors for one or more submitted states
          headers:
            X-API-CREDITS-REMAINING:
              schema:
                type: string
                format: int64
                description: >
                  Present when >=50% of base daily credits (excluding add-on
                  credits) are consumed. Value is total remaining credits
                  including add-on credits for the rolling 24-hour window.
              required: false
