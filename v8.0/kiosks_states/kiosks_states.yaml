            currency data type should have a field "currency" in the same field
            json to be valid
        - code: INVALID_DATA
          message: invalid data
          description: >-
            Invalid data error is thrown with "maximum_length" key if any value
            exceeds the maximum length configuration.
        - code: INVALID_DATA
          message: invalid data
          description: >-
            This error occurs when the number of paths in the path_details array
            exceeds the maximum allowed limit. The system restricts the number
            of decision paths to 11 to maintain performance and ensure
            manageable decision logic complexity. If more than 11 paths are
            included, the API returns an INVALID_DATA error specifying the
            maximum allowed length for the path_details array.
        - code: DUPLICATE_DATA
          message: Duplicate Kiosk state name
          description: >-
            State's name cannot be duplicate. So duplicate data error is thrown
            when the state's name is already existing.
        - code: INVALID_DATA
          message: Invalid data
          description: Auto-generated from ApiDefinition for INVALID_DATA
        - code: DEPENDENT_MISMATCH
          message: invalid length found
          description: >-
            When 'length' is an integer but exceeds the allowed maximum for the
            given data_type (e.g., max 2000 for text), dependent mismatch error
            will be thrown.
        - code: INVALID_DATA
          message: Invalid data
          description: Auto-generated from ApiDefinition for INVALID_DATA
        - code: MANDATORY_NOT_FOUND
          message: required field not found
          description: >-
            This error occurs when the details.path_details field is missing
            from the decision state payload. The path_details array is mandatory
            because it defines the possible execution paths that the kiosk
            decision state can follow. Each path represents a conditional branch
            that determines how the kiosk proceeds based on evaluated
            conditions. Without this field, the system cannot determine how the
            decision should behave. Therefore, the request fails with a
            MANDATORY_NOT_FOUND error indicating that the decision configuration
            is incomplete.
        - code: INVALID_DATA
          message: Invalid data type
          description: Auto-generated from ApiDefinition for INVALID_DATA
        - code: INVALID_DATA
          message: Invalid data
          description: Auto-generated from ApiDefinition for INVALID_DATA
        - code: INVALID_DATA
          message: No such Kiosk exists
          description: No such Kiosk exists error message is thrown if the given Kiosk ID.
        - code: INVALID_DATA
          message: invalid data
          description: >-
            When 'states[0].type' is a non-string value (e.g., integer), so it
            fails both the data type check and enum validation
        - code: MANDATORY_NOT_FOUND
          message: Required field is missing
          description: Auto-generated from ApiDefinition for MANDATORY_NOT_FOUND
        - code: NOT_ALLOWED
          message: Buttons cannot be empty for intermediate states
          description: >-
            When 'buttons' in screen_details is empty or absent for a state that
            is not a final/end state (intermediate states require at least one
            button), not allowed error message is thrown.
