        - code: NOT_ALLOWED
          message: Active kiosk does not allow perform given operation
          description: >-
            Error response when a user tries to delete a state from an active
            kiosk 
        - code: DEPENDENT_FIELD_MISSING
          message: Dependent field is missing
          description: Auto-generated from ApiDefinition for DEPENDENT_FIELD_MISSING
        - code: DEPENDENT_MISMATCH
          message: invalid length found
          description: >-
            When 'length' is an integer but exceeds the allowed maximum for the
