            Represents the style type of the button.

            Possible values:

            primary - Displays the button as the primary action on the screen,
            typically used for actions such as Next, Submit, or Save.


            default - Displays the button with the standard appearance, suitable
            for secondary actions.


            outlineprimary - Displays the button with a primary-colored outline,
            emphasizing the action without making it the primary button.


            failure - Displays the button with a solid error-themed style,
            typically used for destructive or critical actions such as Delete or
            Reject.


            outlineredlight - Displays the button with a red outline, typically
            used for secondary destructive actions such as Cancel, Discard, or
            Remove.
          enum:
            - outlineprimary
            - primary
            - default
            - failure
            - outlineredlight
        name:
          type: string
          description: Specify the display label of the button shown to the user.
          maxLength: 255
      required:
        - prop_name
        - name
    ScreenConfiguration:
      type: object
      additionalProperties: false
      description: >-
        Represents the UI screen configuration rendered to the kiosk user.
        Contains the elements array, optional buttons, layout width, title, and
        button alignment.
      x-zs-llm-description: >-
        REQUIRED field: elements. If buttons are provided, each button must
        include prop_name (one of: outlineprimary, primary, default, failure,
        outlineredlight) and name - both REQUIRED. If width is provided, it must
        be one of: 670px, 1000px.
      properties:
        buttons:
          type:
            - array
            - 'null'
          description: >-
            Represents the list of action buttons on the screen. Each button
            triggers a transition to another state. When provided, each button
            must include a prop_name and name.
          x-zs-llm-description: >-
            If provided, each button MUST include prop_name (one of:
            outlineprimary, primary, default, failure, outlineredlight) and
            name. At least one button should be present on all screens except
            the final screen with no subsequent state.
          items:
            $ref: '#/components/schemas/ScreenButton'
          maxItems: 10
        elements:
          type: array
          description: >-
            Specify the array of UI elements to be rendered on the screen. You
            can configure a maximum of 30 UI elements per screen. If this array
            is provided, it must contain at least one UI element.
          x-zs-llm-description: >-
            REQUIRED. Each element needs a 'type' key. For 'field': include
            field JSON with ui_type, field_label, api_name, required, read_only,
            data_type. For 'get_records': include get_record (id+name) and
            selected_fields. Currency fields need a currency JSON;
            picklist/multiselect need pick_list_values. At least one element
            should be present on all screens except the final screen with no
            subsequent state.
          items:
            $ref: '#/components/schemas/ScreenElement'
          maxItems: 30
        width:
          type:
            - string
            - 'null'
          description: >
            Represents the visual width of the screen container. Controls layout
            and element alignment inside the screen.

            Possible values:

            670px - Standard width layout.

            1000px - Wide layout.
          x-zs-llm-description: 'If provided, must be one of: 670px, 1000px.'
          pattern: ^(670px|1000px)$
          maxLength: 50
        title:
          type:
            - string
            - 'null'
          description: >-
            Represents the display title shown at the top of the kiosk screen,
            providing contextual information about the screen's purpose.
          maxLength: 255
        button_align:
          type:
            - string
            - 'null'
