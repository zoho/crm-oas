openapi: 3.1.0
info:
  title: Related Notes
  description: >-
    Notes are supplementary text records that can be attached to any CRM record
    to capture additional context, follow-up information, or communication
    history. This API enables developers to create, retrieve, update, and delete
    notes associated with parent records across all supported CRM modules, with
    support for both single and bulk operations.
  version: '8'
servers:
  - url: https://zohoapis.{dc}/crm/{version}
    description: >-
      Production API server for Zoho CRM, supporting requests across multiple
      data center regions.
    variables:
      dc:
        enum:
          - com
          - eu
          - in
          - cn
          - au
        default: com
        description: >-
          The top-level domain (TLD) of the API server, corresponding to the
          Zoho data center region.

          Possible values:

          com - United States.

          eu - Europe.

          in - India.

          cn - China.

          au - Australia.
      version:
        default: v8
        description: The version of the Zoho CRM API. The default value is v8.
paths:
  /{parentRecordModule}/{parentRecordId}/Notes:
    get:
      summary: Related Notes
      description: >-
        Retrieves a paginated list of notes associated with a specific parent
        record in a CRM module.
      x-zs-llm-description: >-
        Use this endpoint when notes are scoped to a known parent record. Always
        pass parentRecordModule and parentRecordId from the same record context,
        and use fields to limit payload size when only specific note fields are
        needed.
      operationId: getNotes
      security:
        - OAuth2:
            - ZohoCRM.modules.Leads.READ
            - ZohoCRM.modules.notes.READ
        - OAuth2:
            - ZohoCRM.modules.Contacts.READ
            - ZohoCRM.modules.notes.READ
        - OAuth2:
            - ZohoCRM.modules.Accounts.READ
            - ZohoCRM.modules.notes.READ
        - OAuth2:
            - ZohoCRM.modules.Deals.READ
            - ZohoCRM.modules.notes.READ
        - OAuth2:
            - ZohoCRM.modules.Tasks.READ
            - ZohoCRM.modules.notes.READ
        - OAuth2:
            - ZohoCRM.modules.Events.READ
            - ZohoCRM.modules.notes.READ
        - OAuth2:
            - ZohoCRM.modules.Calls.READ
            - ZohoCRM.modules.notes.READ
        - OAuth2:
            - ZohoCRM.modules.Products.READ
            - ZohoCRM.modules.notes.READ
        - OAuth2:
            - ZohoCRM.modules.Vendors.READ
            - ZohoCRM.modules.notes.READ
        - OAuth2:
            - ZohoCRM.modules.Campaigns.READ
            - ZohoCRM.modules.notes.READ
        - OAuth2:
            - ZohoCRM.modules.Cases.READ
            - ZohoCRM.modules.notes.READ
        - OAuth2:
            - ZohoCRM.modules.Solutions.READ
            - ZohoCRM.modules.notes.READ
        - OAuth2:
            - ZohoCRM.modules.Pricebooks.READ
            - ZohoCRM.modules.notes.READ
        - OAuth2:
            - ZohoCRM.modules.Quotes.READ
            - ZohoCRM.modules.notes.READ
        - OAuth2:
            - ZohoCRM.modules.Salesorders.READ
            - ZohoCRM.modules.notes.READ
        - OAuth2:
            - ZohoCRM.modules.Purchaseorders.READ
            - ZohoCRM.modules.notes.READ
        - OAuth2:
            - ZohoCRM.modules.Custom.READ
            - ZohoCRM.modules.notes.READ
      parameters:
        - $ref: '#/components/parameters/ParentRecordModule'
        - $ref: '#/components/parameters/ParentRecordId'
        - $ref: '#/components/parameters/Fields'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/SortBy'
        - $ref: '#/components/parameters/SortOrder'
      responses:
        '200':
          description: >-
            Returns the list of notes associated with the specified parent
            record.
          content:
            application/json:
              schema:
                type: object
                x-zs-$id: GetNotesResponse
                description: >-
                  Response payload containing the list of note records and
                  pagination metadata for the specified parent record.
                additionalProperties: false
                properties:
                  data:
                    type: array
                    description: >-
                      Represents the list of note records returned for the
                      specified parent record.
                    maxItems: 200
                    items:
                      type: object
                      description: >-
                        Represents an individual note record associated with the
                        parent record.
                      additionalProperties: true
                      properties:
                        id:
                          type: string
                          description: Represents the unique identifier of the note.
                          format: int64
                        Note_Title:
                          type:
                            - string
                            - 'null'
                          description: Represents the title of the note.
                          maxLength: 255
                        Note_Content:
                          type:
                            - string
                            - 'null'
                          description: The content of the note.
                          maxLength: 65535
                        $attachments:
                          type:
                            - array
                            - 'null'
                          description: >-
                            Represents the list of file attachments associated
                            with the note.
                          maxItems: 5
                          items:
                            type: object
                            description: >-
                              Specifies an individual file attachment associated
                              with the note.
                            additionalProperties: true
                            properties:
                              $file_id:
                                type: string
                                description: >-
                                  Specifies the unique file identifier of the
                                  attachment.
                                maxLength: 255
                              File_Name:
                                type: string
                                description: Specifies the name of the attached file.
                                maxLength: 255
                              Size:
                                type: string
                                description: >-
                                  Represents the size of the attached file in
                                  bytes.
                                format: int64
                              id:
                                type: string
                                description: >-
                                  Indicates the unique identifier of the
                                  attachment record.
                                format: int64
                        Parent_Id:
                          type: object
                          description: >-
                            Represents the parent record associated with the
                            note.
                          additionalProperties: false
                          properties:
                            module:
                              type: object
                              description: Represents the module of the parent record.
                              additionalProperties: false
                              properties:
                                api_name:
                                  type: string
                                  description: >-
                                    Represents the API name of the parent record
                                    module. Refer to [Get
                                    Modules](modules.yaml#$.paths./settings/modules.get)
                                    for the list of supported modules.
                                  maxLength: 50
                                id:
                                  type: string
                                  description: >-
                                    Represents the unique identifier of the
                                    parent record module.
                                  format: int64
                              required:
                                - api_name
                                - id
                            name:
                              type: string
                              description: Represents the name of the parent record.
                              maxLength: 255
                            id:
                              type: string
                              description: >-
                                Specify the unique ID of the parent record.
                                Refer to Refer the [GET Records
                                API](record.yaml#.$path./{module}.get) to get
                                valid record IDs.
                              format: int64
                          required:
                            - module
                            - id
                            - name
                      required:
                        - id
                  info:
                    type: object
                    description: Represents the pagination metadata for this response.
                    additionalProperties: false
                    properties:
                      page:
                        type: integer
                        format: int32
                        description: Specifies the current page number.
                      per_page:
                        type: integer
                        format: int32
                        description: Represents the number of records returned per page.
                      count:
                        type: integer
                        format: int32
                        description: >-
                          The number of note records returned in the current
                          page.
                      more_records:
                        type: boolean
                        description: >-
                          Represents whether more note records are available
                          beyond the current page.
                      next_page_token:
                        type:
                          - string
                          - 'null'
                        maxLength: 1024
                        description: >-
                          Indicates the token used to retrieve the next page of
                          results.
                      previous_page_token:
                        type:
                          - string
                          - 'null'
                        maxLength: 500
                        description: >-
                          Represents the token used to retrieve the previous
                          page of results.
                      page_token_expiry:
                        type:
                          - string
                          - 'null'
                        format: date-time
                        description: >-
                          Represents the expiry date and time of the page
                          tokens.
                    required:
                      - page
                      - per_page
                      - count
                      - more_records
                required:
                  - data
                  - info
              examples:
                SuccessResponse:
                  summary: Success response for status 200
                  value:
                    data:
                      - id: '1043386000020244003'
                        Note_Title: null
                        Note_Content: sdf
                        $attachments:
                          - $file_id: 2rsp48b6960fb9f4d444dada8740791775f35
                            File_Name: 20251117_194524.jpg
                            Size: '1623514'
                            id: '1043386000020248003'
                        Parent_Id:
                          module:
                            api_name: Leads
                            id: '1043386000000002175'
                          name: a
                          id: '1043386000019763257'
                        Owner:
                          name: Prasanna
                          id: '1043386000000322001'
                          email: prasanna.saravanan@zohocorp.com
                        Modified_Time: '2025-11-19T19:27:53+05:30'
                        Created_Time: '2025-11-14T11:54:12+05:30'
                    info:
                      page: 1
                      per_page: 200
                      count: 1
                      more_records: false
                      next_page_token: null
                      previous_page_token: null
                      page_token_expiry: null
                  description: >-
                    Shows a successful response listing notes associated with
                    the specified parent record, including attachment and
                    pagination details.
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          description: >-
            The request parameters are invalid. Resolution: Ensure the module
            name, parent record ID, and query parameters are valid.
          content:
            application/json:
              schema:
                x-zs-$id: GetNotesBadRequestError
                description: Validation error response for the GET notes request.
                oneOf:
                  - $ref: '#/components/schemas/BadRequestError'
                  - $ref: '#/components/schemas/RequiredParamMissingError'
                  - $ref: '#/components/schemas/DiscretePaginationLimitExceededError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      summary: Related Notes
      description: >-
        Creates one or more notes associated with a specific parent record.
        Either note content or note title must be provided (at least one is
        mandatory).
      x-zs-llm-description: >-
        Creates related notes under a specific parent record path. For each
        item, include at least one of Note_Content or Note_Title. Use this when
        creating notes in parent-context flows instead of the module-level notes
        endpoint.
      operationId: createNotes
      security:
        - OAuth2:
            - ZohoCRM.modules.Leads.READ
            - ZohoCRM.modules.notes.CREATE
        - OAuth2:
            - ZohoCRM.modules.Contacts.READ
            - ZohoCRM.modules.notes.CREATE
        - OAuth2:
            - ZohoCRM.modules.Accounts.READ
            - ZohoCRM.modules.notes.CREATE
        - OAuth2:
            - ZohoCRM.modules.Deals.READ
            - ZohoCRM.modules.notes.CREATE
        - OAuth2:
            - ZohoCRM.modules.Tasks.READ
            - ZohoCRM.modules.notes.CREATE
        - OAuth2:
            - ZohoCRM.modules.Events.READ
            - ZohoCRM.modules.notes.CREATE
        - OAuth2:
            - ZohoCRM.modules.Calls.READ
            - ZohoCRM.modules.notes.CREATE
        - OAuth2:
            - ZohoCRM.modules.Products.READ
            - ZohoCRM.modules.notes.CREATE
        - OAuth2:
            - ZohoCRM.modules.Vendors.READ
            - ZohoCRM.modules.notes.CREATE
        - OAuth2:
            - ZohoCRM.modules.Campaigns.READ
            - ZohoCRM.modules.notes.CREATE
        - OAuth2:
            - ZohoCRM.modules.Cases.READ
            - ZohoCRM.modules.notes.CREATE
        - OAuth2:
            - ZohoCRM.modules.Solutions.READ
            - ZohoCRM.modules.notes.CREATE
        - OAuth2:
            - ZohoCRM.modules.Pricebooks.READ
            - ZohoCRM.modules.notes.CREATE
        - OAuth2:
            - ZohoCRM.modules.Quotes.READ
            - ZohoCRM.modules.notes.CREATE
        - OAuth2:
            - ZohoCRM.modules.Salesorders.READ
            - ZohoCRM.modules.notes.CREATE
        - OAuth2:
            - ZohoCRM.modules.Purchaseorders.READ
            - ZohoCRM.modules.notes.CREATE
        - OAuth2:
            - ZohoCRM.modules.Custom.READ
            - ZohoCRM.modules.notes.CREATE
      parameters:
        - $ref: '#/components/parameters/ParentRecordModule'
        - $ref: '#/components/parameters/ParentRecordId'
      requestBody:
        description: >-
          The request body must contain a data array with one or more note
          objects.
        content:
          application/json:
            schema:
              type: object
              description: Request payload for creating one or more notes.
              additionalProperties: false
              properties:
                data:
                  type: array
                  description: A JSON array containing the notes to create.
                  maxItems: 200
                  items:
                    type: object
                    description: >-
                      A note object containing the title, content, and parent
                      record information.
                    additionalProperties: true
                    properties:
                      Note_Content:
                        type: string
                        description: Specify the content of the note.
                        maxLength: 65535
                      Note_Title:
                        type: string
                        description: Provide the title of the note.
                        maxLength: 120
                      Parent_Id:
                        type: object
                        description: Specify the parent record for this note.
                        additionalProperties: false
                        properties:
                          module:
                            type: object
                            description: >-
                              Represents the details of the requested module. It
                              is mandatory to specify either the API name or the
                              unique ID of the requested module. Refer to [GET
                              Modules
                              API](modules.yaml#$.paths./settings/modules.get) 
                              to get the details.
                            additionalProperties: false
                            properties:
                              api_name:
                                type: string
                                description: >-
                                  Specify the API name of the parent record
                                  module. Refer to [Get
                                  Modules](modules.yaml#$.paths./settings/modules.get)
                                  for the list of supported modules.
                                maxLength: 50
                              id:
                                type: string
                                description: >-
                                  Specify the unique identifier of the parent
                                  record module.
                                format: int64
                          id:
                            type: string
                            description: >-
                              Specify the unique ID of the parent record. Refer
                              to Refer the [GET Records
                              API](record.yaml#.$path./{module}.get) to get
                              valid record IDs.
                            format: int64
                        required:
                          - module
                          - id
              required:
                - data
            examples:
              CreateNote:
                summary: Sample request body for creating a note for a lead
                value:
                  data:
                    - Note_Title: Contacted
                      Note_Content: Need to do further tracking
                      Parent_Id:
                        module:
                          api_name: Leads
                          id: '4876876000000002175'
                        id: '4876876000005996165'
                description: >-
                  Shows a sample POST request body for creating a note with a
                  title, content, and parent record reference.
            x-zs-llm-examples:
              - CreateNote
        required: true
      responses:
        '201':
          description: Returns the action status for each newly created note.
          content:
            application/json:
              schema:
                type: object
                x-zs-$id: CreateNotesResponse
                description: >-
                  Success response for note creation, containing the action
                  status for each created note.
                additionalProperties: false
                properties:
                  data:
                    type: array
                    description: >-
                      JSON array representing the list of action status objects
                      for each note created in this request.
                    maxItems: 200
                    items:
                      type: object
                      description: >-
                        Represents the action status for an individual note
                        creation.
                      additionalProperties: false
                      properties:
                        code:
                          type: string
                          description: Represents the result code for this note creation.
                          enum:
                            - SUCCESS
                        message:
                          type: string
                          description: >-
                            Represents the result message for this note
                            creation.
                          maxLength: 500
                        status:
                          type: string
                          description: Represents the status of this note creation.
                          enum:
                            - success
                        details:
                          type: object
                          description: Contains the details of the created note record.
                          additionalProperties: false
                          properties:
                            id:
                              type: string
                              description: The unique identifier of the created note.
                              format: int64
                            Modified_Time:
                              type: string
                              description: >-
                                Specifies the date and time when the note was
                                last modified.
                              format: date-time
                            Created_Time:
                              type: string
                              description: >-
                                Represents the creation date and time of the
                                note.
                              format: date-time
                            Created_By:
                              type: object
                              description: Specifies the user who created the note.
                              additionalProperties: false
                              properties:
                                name:
                                  type: string
                                  description: >-
                                    Represents the name of the user who created
                                    the note.
                                  maxLength: 255
                                id:
                                  type: string
                                  description: >-
                                    Indicaates the ID of the user who created
                                    the note.
                                  format: int64
                              required:
                                - name
                                - id
                            Modified_By:
                              type: object
                              description: Represents the user who last modified the note.
                              additionalProperties: false
                              properties:
                                name:
                                  type: string
                                  description: >-
                                    Specifies the name of the user who last
                                    modified the note.
                                  maxLength: 255
                                id:
                                  type: string
                                  description: >-
                                    Represents the ID of the user who last
                                    modified the note.
                                  format: int64
                              required:
                                - name
                                - id
                          required:
                            - id
                            - Modified_Time
                            - Created_Time
                            - Created_By
                            - Modified_By
                      required:
                        - code
                        - message
                        - status
                        - details
                required:
                  - data
              examples:
                SuccessfulCreation:
                  summary: Success response for status 201
                  value:
                    data:
                      - code: SUCCESS
                        details:
                          Modified_Time: '2023-12-19T16:45:07+05:30'
                          Modified_By:
                            name: Patricia Boyle
                            id: '4876876000000327001'
                          Created_Time: '2023-12-19T16:45:07+05:30'
                          id: '4876876000006021002'
                          Created_By:
                            name: Patricia Boyle
                            id: '4876876000000327001'
                        message: record added
                        status: success
                  description: >-
                    Shows a successful 201 response with the action status for
                    each newly created note.
        '207':
          description: >-
            Returns mixed results where some notes were created successfully and
            others failed validation.
          content:
            application/json:
              schema:
                x-zs-$id: CreateNotesMultiStatusResponse207
                type: object
                description: >-
                  Mixed-status response for note creation where some notes were
                  created successfully and others failed.
                additionalProperties: false
                properties:
                  data:
                    type: array
                    description: >-
                      JSON array representing the list of mixed action status
                      objects for each note in this request.
                    maxItems: 200
                    items:
                      oneOf:
                        - x-zs-$id: CreateNoteSuccessResult
                          type: object
                          description: >-
                            Successful note creation result with action status
                            and note details.
                          additionalProperties: false
                          properties:
                            code:
                              type: string
                              description: >-
                                Represents the result code for this note
                                creation.
                              enum:
                                - SUCCESS
                            message:
                              type: string
                              description: >-
                                Represents the result message for this note
                                creation.
                              maxLength: 500
                            status:
                              type: string
                              description: Represents the status of this note creation.
                              enum:
                                - success
                            details:
                              type: object
                              description: Contains the details of the created note record.
                              additionalProperties: false
                              properties:
                                id:
                                  type: string
                                  description: >-
                                    Represents the unique identifier of the
                                    created note.
                                  format: int64
                                Modified_Time:
                                  type: string
                                  description: >-
                                    Represents the date and time when the note
                                    was last modified.
                                  format: date-time
                                Created_Time:
                                  type: string
                                  description: >-
                                    Represents the creation date and time of the
                                    note.
                                  format: date-time
                                Created_By:
                                  type: object
                                  description: Represents the user who created the note.
                                  additionalProperties: false
                                  properties:
                                    name:
                                      type: string
                                      description: >-
                                        Represents the name of the user who
                                        created the note.
                                      maxLength: 255
                                    id:
                                      type: string
                                      description: >-
                                        Represents the ID of the user who
                                        created the note.
                                      format: int64
                                  required:
                                    - name
                                    - id
                                Modified_By:
                                  type: object
                                  description: >-
                                    Represents the user who last modified the
                                    note.
                                  additionalProperties: false
                                  properties:
                                    name:
                                      type: string
                                      description: >-
                                        Represents the name of the user who last
                                        modified the note.
                                      maxLength: 255
                                    id:
                                      type: string
                                      description: >-
                                        Represents the ID of the user who last
                                        modified the note.
                                      format: int64
                                  required:
                                    - name
                                    - id
                              required:
                                - id
                                - Modified_Time
                                - Created_Time
                                - Created_By
                                - Modified_By
                          required:
                            - code
                            - message
                            - status
                            - details
                        - x-zs-$id: CreateNoteErrorResult
                          type: object
                          description: >-
                            Failed note creation result with error code and
                            details.
                          additionalProperties: false
                          properties:
                            code:
                              type: string
                              description: >-
                                Represents the error code for this note creation
                                failure.
                              enum:
                                - EXPECTED_FIELD_MISSING
                                - INVALID_DATA
                            message:
                              type: string
                              description: >-
                                Represents the error message for this note
                                creation failure.
                              maxLength: 500
                            status:
                              type: string
                              description: >-
                                Represents the status of this note creation
                                failure.
                              enum:
                                - error
                            details:
                              type: object
                              description: >-
                                Contains additional details about the note
                                creation error.
                              additionalProperties: true
                          required:
                            - code
                            - message
                            - status
                            - details
                      description: >-
                        Represents an individual note creation result, which may
                        be a success or an error.
                required:
                  - data
              examples:
                PartialSuccess:
                  summary: Partial success - some notes created, some failed
                  value:
                    data:
                      - code: SUCCESS
                        details:
                          Modified_Time: '2026-01-05T14:27:48+05:30'
                          Modified_By:
                            name: Prasanna CEO
                            id: '111111000000059489'
                          Created_Time: '2026-01-05T14:27:48+05:30'
                          id: '111111000000116018'
                          Created_By:
                            name: Prasanna CEO
                            id: '111111000000059489'
                        message: record added
                        status: success
                      - code: EXPECTED_FIELD_MISSING
                        details:
                          expected_fields:
                            - api_name: Note_Content
                              json_path: $.data[1].Note_Content
                            - api_name: Note_Title
                              json_path: $.data[1].Note_Title
                        message: should contain either content or title
                        status: error
                  description: >-
                    Shows a 207 mixed-status response where some notes were
                    created successfully and others failed validation.
        '400':
          description: >-
            The request data is invalid. Resolution: Ensure the request body
            contains valid field values, and that at least one of Note_Title or
            Note_Content is provided.
          content:
            application/json:
              schema:
                x-zs-$id: CreateNotesBadRequestError
                description: Validation error response for the POST create notes request.
                oneOf:
                  - $ref: '#/components/schemas/BadRequestError'
                  - $ref: '#/components/schemas/ExpectedFieldMissingError'
                  - $ref: '#/components/schemas/InvalidDataError'
                  - $ref: '#/components/schemas/NotAllowedError'
                  - $ref: '#/components/schemas/FileSizeExceedsError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: >-
            Permission denied to create notes. Resolution: Verify that the OAuth
            token includes the ZohoCRM.modules.notes.CREATE scope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoPermissionError'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      summary: Related Notes
      description: >-
        Updates one or more notes associated with a specific CRM record in your
        Zoho CRM organization. Either note content or note title must be
        provided (at least one is mandatory) for each note.
      x-zs-llm-description: >-
        Bulk-updates notes for a specific parent record. Each item must include
        note id and at least one of Note_Content or Note_Title. Use this for
        batch edits when multiple related notes need updates in one call.
