components:
  responses:
    NoContent:
      description: >-
        The request was successful but there are no notes to return for the
        specified parent record.
    Unauthorized:
      description: >-
        Authentication failed. Resolution: Verify that the OAuth token is valid
        and that the required scope is included.
      content:
        application/json:
          schema:
            x-zs-$id: UnauthorizedErrorResponse
            type: object
            description: Error response schema for 401 Unauthorized responses.
            additionalProperties: false
            properties:
              code:
                type: string
                description: Represents the error code for this response.
                enum:
                  - AUTHENTICATION_FAILURE
                  - OAUTH_SCOPE_MISMATCH
              details:
                type: object
                description: Contains additional details about the error.
                additionalProperties: false
              message:
                type: string
                description: Represents the error message for this response.
                maxLength: 500
              status:
                type: string
                description: Represents the status of the response.
                enum:
                  - error
            required:
              - code
              - details
              - message
              - status
          examples:
            AuthenticationFailure:
              summary: 'AUTHENTICATION_FAILURE error: authentication failed'
              value:
                code: AUTHENTICATION_FAILURE
                details: {}
                message: Authentication failed
                status: error
              description: >-
                Shows an AUTHENTICATION_FAILURE error when the provided OAuth
                token is invalid or expired.
            OAuthScopeMismatch:
              summary: 'OAUTH_SCOPE_MISMATCH error: OAuth scope mismatch'
              value:
                code: OAUTH_SCOPE_MISMATCH
                details: {}
                message: invalid oauth scope to access this URL
                status: error
              description: >-
                Shows an OAUTH_SCOPE_MISMATCH error when the OAuth token does
                not include the required scope for this API.
    NotFound:
      description: >-
        The requested resource could not be found. Resolution: Verify that the
        URL pattern in the request is correct.
      content:
        application/json:
          schema:
            type: object
            x-zs-$id: NotFoundErrorResponse
            description: Error response schema for 404 Not Found responses.
            additionalProperties: false
            properties:
              code:
                type: string
                description: Represents the error code for this response.
                enum:
                  - INVALID_URL_PATTERN
              details:
                type: object
                description: Contains additional details about the error.
                additionalProperties: false
              message:
                type: string
                description: Represents the error message for this response.
                maxLength: 500
              status:
                type: string
                description: Indicates status of the response.
                enum:
                  - error
            required:
              - code
              - details
              - message
              - status
          examples:
            InvalidUrlPattern:
              summary: 'INVALID_URL_PATTERN error: invalid URL pattern'
              value:
                code: INVALID_URL_PATTERN
                details: {}
                message: Please check if the URL trying to access is a correct one
                status: error
              description: >-
                Shows an INVALID_URL_PATTERN error when the request URL does not
                match a valid API endpoint pattern.
    InternalServerError:
      description: >-
        An unexpected error occurred on the server. Resolution: Retry the
        request after a brief delay. If the error persists, contact Zoho CRM
        support.
      content:
        application/json:
          schema:
            type: object
            x-zs-$id: InternalServerErrorResponse
            description: Error response schema for 500 Internal Server Error responses.
            additionalProperties: false
            properties:
              code:
                type: string
                description: Represents the error code for this response.
                enum:
                  - INTERNAL_ERROR
              details:
                type: object
                description: Contains additional details about the error.
                additionalProperties: false
              message:
                type: string
                description: Specifies the error message for this response.
                maxLength: 500
              status:
                type: string
                description: Represents the status of the response.
                enum:
                  - error
            required:
              - code
              - details
              - message
              - status
          examples:
            InternalError:
              summary: 'INTERNAL_ERROR error: internal server error'
              value:
                code: INTERNAL_ERROR
                details: {}
                message: Internal Server Error
                status: error
              description: >-
                Shows an INTERNAL_ERROR response when an unexpected error occurs
                on the server.
  parameters:
    ParentRecordModule:
      name: parentRecordModule
      in: path
      required: true
      description: >-
        Specify the API name of the parent record module. Refer to [Get
        Modules](modules.yaml#$.paths./settings/modules.get) for the list of
        supported modules.
      schema:
        type: string
        pattern: ^[A-Za-z_][A-Za-z0-9_]*$
        maxLength: 50
      examples:
        Contacts:
          value: Contacts
          summary: Contacts module
        Leads:
          value: Leads
          summary: Leads module
        Deals:
          value: Deals
          summary: Deals module
    ParentRecordId:
      name: parentRecordId
      in: path
      required: true
      description: Specify the unique numeric ID of the parent record.
      schema:
        type: string
        pattern: ^[0-9]+$
        format: int64
      examples:
        ContactId:
          value: '1043386000019763257'
          summary: Contact record ID
        LeadId:
          value: '1043386000019763258'
          summary: Lead record ID
    NoteId:
      name: noteId
      in: path
      required: true
      description: Specify the unique numeric ID of the note record.
      schema:
        type: string
        pattern: ^[0-9]+$
        format: int64
      examples:
        NoteId:
          value: '1043386000020244003'
          summary: Note record ID
    Fields:
      name: fields
      in: query
      required: false
      description: >-
        A comma-separated list of field API names to return in the response. If
        not specified, all available fields are included in the response.
      schema:
        type: string
        pattern: ^[A-Za-z_][A-Za-z0-9_]*(,[A-Za-z_][A-Za-z0-9_]*)*$
        maxLength: 1000
      examples:
        BasicFields:
          value: Note_Title,Note_Content,Created_Time
          summary: Basic note fields
    Ids:
      name: ids
      in: query
      required: true
      description: Specify a comma-separated list of note record IDs to delete.
      schema:
        type: string
        pattern: ^[0-9]+(,[0-9]+)*$
        maxLength: 2000
      examples:
        SingleId:
          value: '1043386000020244003'
          summary: Single note ID
        MultipleIds:
          value: 1043386000020244003,1043386000020244004,1043386000020244005
          summary: Multiple note IDs
    Page:
      name: page
      in: query
      required: false
      description: >-
        Specify the page number for pagination. The value must be **1 or
        greater**.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 10000
        default: 1
      examples:
        FirstPage:
          value: 1
          summary: First page
        SecondPage:
          value: 2
          summary: Second page
    PerPage:
      name: perPage
      in: query
      required: false
      description: >-
        To get the list of records available per page. The default and the
        maximum possible value is **200.**
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 200
        default: 200
      examples:
        DefaultPageSize:
          value: 200
          summary: Default page size
        SmallPageSize:
          value: 50
          summary: Smaller page size for limited data
    SortBy:
      name: sort_by
      in: query
      required: false
      description: |-
        Specify the field name to sort the note records by.
        Possible values:
        id - Sort by the note ID.
        Created_Time - Sort by the creation date and time.
        Modified_Time - Sort by the last modification date and time.
      schema:
        type: string
        enum:
          - id
          - Created_Time
          - Modified_Time
        maxLength: 50
      examples:
        SortById:
          value: id
          summary: Sort by note ID
        SortByCreatedTime:
          value: Created_Time
          summary: Sort by creation time
        SortByModifiedTime:
          value: Modified_Time
          summary: Sort by modification time
    SortOrder:
      name: sort_order
      in: query
      required: false
      description: |-
        The order in which results are returned.
        Possible values:
        **asc** - Returns results in ascending order.
        **desc** - Returns results in descending order.
      schema:
        type: string
        enum:
          - asc
          - desc
        maxLength: 10
      examples:
        Ascending:
          value: asc
          summary: Ascending order
        Descending:
          value: desc
          summary: Descending order
  schemas:
    BadRequestError:
      type: object
      x-zs-$id: RecentItemsErrorResponse
      description: >-
        Error response schema for 400 bad request errors, covering
        INVALID_MODULE, INVALID_DATA, and NOT_SUPPORTED error codes.
      additionalProperties: false
      properties:
        code:
          type: string
          description: Represents the error code for this response.
          enum:
            - INVALID_MODULE
            - INVALID_DATA
            - NOT_SUPPORTED
        details:
          type: object
          description: Contains additional details about the error.
          additionalProperties: true
        message:
          type: string
          description: Represents the error message for this response.
          maxLength: 500
        status:
          type: string
          description: Indicates the status of the response.
          enum:
            - error
      required:
        - code
        - details
        - message
        - status
    RequiredParamMissingError:
      type: object
      x-zs-$id: RequiredParamMissingError
      description: >-
        Error response schema for requests where a required query parameter is
        absent.
      additionalProperties: false
      properties:
        code:
          type: string
          description: Represents the error code for this response.
          enum:
            - REQUIRED_PARAM_MISSING
        details:
          type: object
          description: Contains additional details about the missing parameter.
          additionalProperties: true
          properties:
            param_name:
              type: string
              description: >-
                Represents the name of the required parameter that is missing
                from the request.
              maxLength: 255
        message:
          type: string
          description: Represents the error message for this response.
          maxLength: 500
        status:
          type: string
          description: Represents the status of the response.
          enum:
            - error
      required:
        - code
        - details
        - message
        - status
    ExpectedFieldMissingError:
      x-zs-$id: ExpectedFieldMissingError
      type: object
      description: >-
        Error response schema returned when both Note_Content and Note_Title are
        absent from the request, violating the at-least-one requirement.
      additionalProperties: false
      properties:
        data:
          type: array
          description: Represents the list of error objects for each note in the request.
          maxItems: 200
          items:
            type: object
            description: >-
              Represents an individual error indicating that at least one of the
              expected fields is missing.
            additionalProperties: false
            properties:
              code:
                type: string
                description: Represents the error code for this response.
                enum:
                  - EXPECTED_FIELD_MISSING
              details:
                type: object
                description: >-
                  Contains the list of expected fields that are missing from the
                  request.
                additionalProperties: false
                properties:
                  expected_fields:
                    type: array
                    description: >-
                      A list of fields from which at least one must be provided.
                      Returned when none of the required fields are present in
                      the request.
                    maxItems: 2
                    items:
                      type: object
                      description: Represents an individual expected field that is missing.
                      additionalProperties: false
                      properties:
                        api_name:
                          type: string
                          description: >-
                            Represents the API name of the missing expected
                            field.
                          maxLength: 255
                        json_path:
                          type: string
                          description: >-
                            Represents the JSON path to the missing expected
                            field.
                          maxLength: 500
                      required:
                        - api_name
                        - json_path
                required:
                  - expected_fields
              message:
                type: string
                description: Represents the error message for this response.
                maxLength: 500
              status:
                type: string
                description: The status of the response.
                enum:
                  - error
            required:
              - code
              - details
              - message
              - status
      required:
        - data
    MandatoryNotFoundError:
      x-zs-$id: MandatoryNotFoundError
      type: object
      description: >-
        Error response schema returned when a mandatory field, such as `id`, is
        missing from the request body.
      additionalProperties: false
      properties:
        data:
          type: array
          description: Represents the list of error objects for each note in the request.
          maxItems: 200
          items:
            type: object
            description: >-
              Specifies an individual error indicating that a mandatory field is
              missing.
            additionalProperties: false
            properties:
              code:
                type: string
                description: Represents the error code for this response.
                enum:
                  - MANDATORY_NOT_FOUND
              details:
                type: object
                description: >-
                  Contains additional details identifying the missing mandatory
                  field.
                additionalProperties: true
                properties:
                  api_name:
                    type: string
                    description: Represents the API name of the missing mandatory field.
                    maxLength: 255
                  json_path:
                    type: string
                    description: Specifies the JSON path to the missing mandatory field.
                    maxLength: 500
              message:
                type: string
                description: Represents the error message for this response.
                maxLength: 500
              status:
                type: string
                description: Represents the status of the response.
                enum:
                  - error
            required:
              - code
              - details
              - message
              - status
      required:
        - data
    NoPermissionError:
      x-zs-$id: NoPermissionError
      type: object
      description: >-
        Error response schema returned when the user does not have the required
        permission to perform the operation, such as the
        Crm_Implied_Create_Attachments permission.
      additionalProperties: false
      properties:
        data:
          type: array
          description: Represents the list of error objects for each note in the request.
          maxItems: 200
          items:
            type: object
            description: >-
              Represents an individual error indicating that the user lacks a
              required permission.
            additionalProperties: false
            properties:
              code:
                type: string
                description: Represents the error code for this response.
                enum:
                  - NO_PERMISSION
              details:
                type: object
                description: >-
                  Contains the list of required permissions that the user does
                  not have.
                additionalProperties: false
                properties:
                  permissions:
                    type: array
                    description: >-
                      Represents the list of required permissions for this
                      operation.
                    maxItems: 10
                    items:
                      type: string
                      description: Represents a required permission name.
                      maxLength: 255
                required:
                  - permissions
              message:
                type: string
                description: Represents the error message for this response.
                maxLength: 500
              status:
                type: string
                description: Represents the status of the response.
                enum:
                  - error
            required:
              - code
              - details
              - message
              - status
      required:
        - data
    FileSizeExceedsError:
      x-zs-$id: FileSizeExceedsError
      type: object
      description: >-
        Error response schema returned when the total size of attachments in the
        request exceeds the 20 MB limit.
      additionalProperties: false
      properties:
        data:
          type: array
          description: Represents the list of error objects for each note in the request.
          maxItems: 200
          items:
            type: object
            description: >-
              Represents an individual error indicating that the attachment file
              size exceeds the allowed limit.
            additionalProperties: false
            properties:
              code:
                type: string
                description: Represents the error code for this response.
                enum:
                  - FILE_SIZE_EXCEEDS
              details:
                type: object
                description: >-
                  Contains additional details identifying the attachment field
                  that exceeded the size limit.
                additionalProperties: false
                properties:
                  api_name:
                    type: string
                    description: >-
                      Represents the API name of the attachment field that
                      exceeded the size limit.
                    maxLength: 255
                  json_path:
                    type: string
                    description: >-
                      Represents the JSON path to the attachment field that
                      exceeded the size limit.
                    maxLength: 255
                required:
                  - api_name
                  - json_path
              message:
                type: string
                description: Represents the error message for this response.
                maxLength: 500
              status:
                type: string
                description: Represents the status of the response.
                enum:
                  - error
            required:
              - code
              - details
              - message
              - status
      required:
        - data
    NotAllowedError:
      x-zs-$id: NotAllowedError
      type: object
      description: >-
        Error response schema returned when an operation is not permitted, such
        as sharing a note with a portal user whose parent record is
        inaccessible.
      additionalProperties: false
      properties:
        data:
          type: array
          description: Represents the list of error objects for each note in the request.
          maxItems: 200
          items:
            type: object
            description: >-
              Specifies an individual error indicating that the operation is not
              allowed on this note.
            additionalProperties: false
            properties:
              code:
                type: string
                description: Represents the error code for this response.
                enum:
                  - NOT_ALLOWED
              details:
                type: object
                description: >-
                  Contains additional details identifying the field on which the
                  operation is not allowed.
                additionalProperties: false
                properties:
                  api_name:
                    type: string
                    description: >-
                      The API name of the field associated with the not-allowed
                      operation.
                    maxLength: 255
                  json_path:
                    type: string
                    description: >-
                      The JSON path to the field associated with the not-allowed
                      operation.
                    maxLength: 500
                required:
                  - api_name
                  - json_path
              message:
                type: string
                description: Represents the error message for this response.
                maxLength: 500
              status:
                type: string
                description: Represents the status of the response.
                enum:
                  - error
            required:
              - code
              - details
              - message
              - status
      required:
        - data
    NotAllowedErrorSingle:
      x-zs-$id: NotAllowedErrorSingle
      type: object
      description: >-
        Error response schema for single-record update operations where the
        action is not permitted on the specified note.
      additionalProperties: false
      properties:
        data:
          type: array
          description: Represents the list of error objects for the note in the request.
          maxItems: 1
          items:
            type: object
            description: >-
              Represents an individual error indicating that the operation is
              not allowed on this note.
            additionalProperties: false
            properties:
              code:
                type: string
                description: Represents the error code for this response.
                enum:
                  - NOT_ALLOWED
              details:
                type: object
                description: >-
                  Contains additional details identifying the field on which the
                  operation is not allowed.
                additionalProperties: false
                properties:
                  api_name:
                    type: string
                    description: >-
                      Represents the API name of the field associated with the
                      not-allowed operation.
                    maxLength: 255
                  json_path:
                    type: string
                    description: >-
                      Represents the JSON path to the field associated with the
                      not-allowed operation.
                    maxLength: 500
                required:
                  - api_name
                  - json_path
              message:
                type: string
                description: Represents the error message for this response.
                maxLength: 500
              status:
                type: string
                description: Represents the status of the response.
                enum:
                  - error
            required:
              - code
              - details
              - message
              - status
      required:
        - data
    CannotPerformActionError:
      x-zs-$id: CannotPerformActionError
      type: object
      description: >-
        Error response schema returned when the user lacks permission to perform
        the requested action on a note, such as modifying another user's note.
      additionalProperties: false
      properties:
        data:
          type: array
          description: Represents the list of error objects for each note in the request.
          maxItems: 200
          items:
            type: object
            description: >-
              Represents an individual error indicating that the user cannot
              perform the requested action on this note.
            additionalProperties: false
            properties:
              code:
                type: string
                description: Represents the error code for this response.
                enum:
                  - CANNOT_PERFORM_ACTION
              details:
                type: object
                description: >-
                  Contains additional details about the cannot-perform-action
                  error.
                additionalProperties: false
              message:
                type: string
                description: Represents the error message for this response.
                maxLength: 500
              status:
                type: string
                description: Represents the status of the response.
                enum:
                  - error
            required:
              - code
              - details
              - message
              - status
      required:
        - data
    CannotPerformActionErrorSingle:
      x-zs-$id: CannotPerformActionErrorSingle
      type: object
      description: >-
        Error response schema for single-record operations where the user cannot
        perform the requested action on the specified note.
      additionalProperties: false
      properties:
        data:
          type: array
          description: Represents the list of error objects for the note in the request.
          maxItems: 1
          items:
            type: object
            description: >-
              Represents an individual error indicating that the user cannot
              perform the requested action on this note.
            additionalProperties: false
            properties:
              code:
                type: string
                description: Represents the error code for this response.
                enum:
                  - CANNOT_PERFORM_ACTION
              details:
                type: object
                description: >-
                  Contains additional details about the cannot-perform-action
                  error.
                additionalProperties: false
              message:
                type: string
                description: Represents the error message for this response.
                maxLength: 500
              status:
                type: string
                description: Represents the status of the response.
                enum:
                  - error
            required:
              - code
              - details
              - message
              - status
      required:
        - data
    InvalidDataError:
      x-zs-$id: InvalidDataError
      type: object
      description: >-
        Error response schema returned when a field value fails validation, such
        as exceeding the maximum length.
      additionalProperties: false
      properties:
        data:
          type: array
          description: Represents the list of error objects for each note in the request.
          maxItems: 200
          items:
            type: object
            description: >-
              Represents an individual error indicating that a field value is
              invalid.
            additionalProperties: false
            properties:
              code:
                type: string
                description: Represents the error code for this response.
                enum:
                  - INVALID_DATA
              details:
                type: object
                description: >-
                  Contains additional validation details about the invalid
                  field, including constraint information.
                additionalProperties: true
              message:
                type: string
                description: Represents the error message for this response.
                maxLength: 500
              status:
                type: string
                description: Represents the status of the response.
                enum:
                  - error
            required:
              - code
              - details
              - message
              - status
      required:
        - data
    DiscretePaginationLimitExceededError:
      x-zs-$id: DiscretePaginationLimitExceededError
      type: object
      description: >-
        Error response returned when a request exceeds the discrete pagination
        limit without providing a **page_token**.
      additionalProperties: false
      properties:
        code:
          type: string
          description: Represents the error code for this response.
          enum:
            - DISCRETE_PAGINATION_LIMIT_EXCEEDED
        details:
          type: object
          description: Contains additional details about the pagination limit.
          additionalProperties: true
          properties:
            limit:
              type: integer
              description: >-
                Represents the maximum number of records that can be retrieved
                without a page_token parameter.
              format: int32
        message:
          type: string
          description: Represents the error message for this response.
          maxLength: 500
        status:
          type: string
          description: Represents the status of the response.
          enum:
            - error
      required:
        - code
        - details
        - message
        - status
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://accounts.zoho.com/oauth/v2/auth
          tokenUrl: https://accounts.zoho.com/oauth/v2/token
          refreshUrl: https://accounts.zoho.com/oauth/v2/token
          scopes:
            ZohoCRM.modules.notes.READ: Read access to Notes
            ZohoCRM.modules.notes.CREATE: Create access to Notes
            ZohoCRM.modules.notes.UPDATE: Update access to Notes
            ZohoCRM.modules.notes.DELETE: Delete access to Notes
            ZohoCRM.modules.Leads.READ: Read access to Leads module
            ZohoCRM.modules.Contacts.READ: Read access to Contacts module
            ZohoCRM.modules.Accounts.READ: Read access to Accounts module
            ZohoCRM.modules.Deals.READ: Read access to Deals module
            ZohoCRM.modules.Tasks.READ: Read access to Tasks module
            ZohoCRM.modules.Events.READ: Read access to Events module
            ZohoCRM.modules.Calls.READ: Read access to Calls module
            ZohoCRM.modules.Products.READ: Read access to Products module
            ZohoCRM.modules.Vendors.READ: Read access to Vendors module
            ZohoCRM.modules.Campaigns.READ: Read access to Campaigns module
            ZohoCRM.modules.Cases.READ: Read access to Cases module
            ZohoCRM.modules.Solutions.READ: Read access to Solutions module
            ZohoCRM.modules.Pricebooks.READ: Read access to Price Books module
            ZohoCRM.modules.Quotes.READ: Read access to Quotes module
            ZohoCRM.modules.Salesorders.READ: Read access to Sales Orders module
            ZohoCRM.modules.Purchaseorders.READ: Read access to Purchase Orders module
            ZohoCRM.modules.Invoices.READ: Read access to Invoices module
            ZohoCRM.modules.Forecasts.READ: Read access to Forecasts module
            ZohoCRM.modules.Activities.READ: Read access to Activities module
            ZohoCRM.modules.Notes.READ: Read access to Notes module
            ZohoCRM.modules.Attachments.READ: Read access to Attachments module
            ZohoCRM.modules.Custom.READ: Read access to Custom modules
            ZohoCRM.users.READ: Read access to users modules
