openapi: 3.1.0
info:
  title: Deal Contact Roles
  description: >-
    API for managing contact roles in Deal records. Track and manage which
    contacts are associated with deals and their specific roles (e.g., Decision
    Maker, Influencer). Supports full CRUD operations to maintain accurate
    relationship data between contacts and deal opportunities.
  version: '8.0'
servers:
  - url: https://zohoapis.{dc}/crm/{version}
    description: API Server URL
    variables:
      dc:
        enum:
          - com
          - eu
          - in
          - cn
          - au
        default: com
        description: API Server URL TLD
      version:
        default: v8
        description: API Version
paths:
  /{module}/{dealId}/Contact_Roles:
    get:
      summary: Deal Contact Roles
      description: Retrieve contact roles associated with a deal.
      operationId: getAssociatedContactRoles
      parameters:
        - $ref: '#/components/parameters/Module'
        - $ref: '#/components/parameters/DealId'
        - $ref: '#/components/parameters/Fields'
      responses:
        '200':
          description: Successfully retrieved contact roles associated with the deal.
          content:
            application/json:
              schema:
                type: object
                x-zs-$id: Successresponse
                description: Response containing contact roles data and pagination details.
                properties:
                  data:
                    type: array
                    maxItems: 100
                    description: >-
                      Array of contact role records with fields specified in the
                      query parameter
                    items:
                      type: object
                      description: >-
                        Contact role record with dynamic fields based on the
                        'fields' query parameter
                      properties:
                        Owner:
                          type: object
                          description: Owner information for the contact role
                          properties:
                            name:
                              type: string
                              description: Owner's display name
                              maxLength: 255
                            id:
                              type: string
                              description: Owner's unique identifier
                              format: int64
                            email:
                              type: string
                              description: Owner's email address
                              format: email
                          additionalProperties: false
                        Department:
                          type:
                            - string
                            - 'null'
                          description: Department of the contact
                        Contact_Role:
                          type: object
                          description: Contact role information
                          properties:
                            name:
                              type: string
                              description: Role name (e.g., Developer/Evaluator)
                              maxLength: 255
                            id:
                              type: string
                              description: Role's unique identifier
                              format: int64
                          required:
                            - name
                            - id
                          additionalProperties: false
                      additionalProperties: true
                  info:
                    type: object
                    description: Pagination and response metadata
                    properties:
                      per_page:
                        type: integer
                        description: Number of records per page
                        format: int32
                      next_page_token:
                        type:
                          - string
                          - 'null'
                        maxLength: 1024
                        description: Token for retrieving the next page of results
                      count:
                        type: integer
                        format: int32
                        description: Number of records in the current response
                      page:
                        type: integer
                        format: int32
                        description: Current page number
                      previous_page_token:
                        type:
                          - string
                          - 'null'
                        maxLength: 1024
                        description: Token for retrieving the previous page of results
                      page_token_expiry:
                        type:
                          - string
                          - 'null'
                        maxLength: 1024
                        description: Expiry timestamp for page tokens
                      more_records:
                        type: boolean
                        description: Indicates if more records are available
                    required:
                      - per_page
                      - count
                      - page
                      - more_records
                    additionalProperties: false
                required:
                  - data
                  - info
                additionalProperties: false
              examples:
                ContactRolesResponse:
                  value:
                    data:
                      - Owner:
                          name: luffy
                          id: '4408068000000623001'
                          email: luffy@zohotest.com
                        Department: null
                        Contact_Role:
                          name: Developer/Evaluator
                          id: '4408068000000007170'
                        Email: null
                        id: '4408068000000963425'
                    info:
                      per_page: 100
                      next_page_token: null
                      count: 1
                      page: 1
                      previous_page_token: null
                      page_token_expiry: null
                      more_records: false
        '204':
          description: No contact roles found for the specified deal.
        '400':
          description: >-
            The response body of errors such as Invalid data, invalid module,
            field limit exceeded, or required parameter missing.
          content:
            application/json:
              schema:
                x-zs-$id: ErrorResponse400
                description: >-
                  Represents the error response, which can be one of several
                  specific following error types.
                oneOf:
                  - $ref: '#/components/schemas/InvalidDataError'
                  - $ref: '#/components/schemas/InvalidModuleError'
                  - $ref: '#/components/schemas/RequiredParamMissingError'
                  - $ref: '#/components/schemas/InvalidRelationNameError'
        '403':
          description: >-
            Error response when the user does not have enough permission to
            access deals or contacts.
          content:
            application/json:
              schema:
                x-zs-$id: ErrorResponse403
                description: >-
                  Represents the error response body when the user lacks
                  permission to access deals or contacts.
                oneOf:
                  - $ref: '#/components/schemas/NoPermissionDealsError'
                  - $ref: '#/components/schemas/NoPermissionContactsError'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
        - OAuth2:
            - ZohoCRM.modules.CONTACTS.READ
            - ZohoCRM.modules.DEALS.READ
    put:
      summary: Deal Contact Roles
      description: >-
        Add contact roles to a deal or update existing contact role relations in
        bulk.
      operationId: upsertContactRoleRelations
      parameters:
        - $ref: '#/components/parameters/Module'
        - $ref: '#/components/parameters/DealId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertRelationsRequest'
      responses:
        '200':
          description: >-
            Response of a successfully added or updated the specified contact
            role relations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpsertRelationsSuccessResponse'
        '400':
          description: >-
            Represents the error response of cases such as Invalid data, invalid
            module, field limit exceeded, or required parameter missing.
          content:
            application/json:
              schema:
                x-zs-$id: UpdateErrorResponse400
                description: >-
                  Error response for a bad request, which can be one of several
                  specific error types.
                oneOf:
                  - $ref: '#/components/schemas/InvalidDataError'
                  - $ref: '#/components/schemas/InvalidModuleError'
                  - $ref: '#/components/schemas/RequiredParamMissingError'
                  - $ref: '#/components/schemas/InvalidRelationNameError'
        '403':
          description: >-
            Represents the error response when the use does not have enough
            permission to access deals or contacts.
          content:
            application/json:
              schema:
                x-zs-$id: ForbiddenErrorResponse
                description: >-
                  Represents the error response when the user lacks permission
                  to access deals or contacts.
                oneOf:
                  - $ref: '#/components/schemas/NoPermissionDealsError'
                  - $ref: '#/components/schemas/NoPermissionContactsError'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
        - OAuth2:
            - ZohoCRM.modules.CONTACTS.UPDATE
            - ZohoCRM.modules.DEALS.UPDATE
    delete:
      summary: Deal Contact Roles
      description: >-
        Remove one or more contact role associations from a deal using their
        relation IDs.
      operationId: deleteContactRoleRelations
      parameters:
        - $ref: '#/components/parameters/Module'
        - $ref: '#/components/parameters/DealId'
        - $ref: '#/components/parameters/Ids'
      responses:
        '200':
          description: >-
            Represents the response of a successfully removed the specified
            contact role relations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteRelationsSuccessResponse'
        '400':
          description: >-
            Represents the error response of cases such as Invalid data, invalid
            module, field limit exceeded, or required parameter missing.
          content:
            application/json:
              schema:
                x-zs-$id: DeleteErrorResponse
                description: >-
                  Error response for a bad request, which can be one of several
                  specific error types.
                oneOf:
                  - $ref: '#/components/schemas/InvalidDataError'
                  - $ref: '#/components/schemas/InvalidModuleError'
                  - $ref: '#/components/schemas/RequiredParamMissingError'
                  - $ref: '#/components/schemas/InvalidRelationNameError'
        '403':
          description: >-
            Represents the error response when the user does not have enough
            permission to access deals or contacts.
          content:
            application/json:
              schema:
                x-zs-$id: DeleteForbiddenErrorResponse
                description: >-
                  Represents the error response body when the user lacks
                  permission to access deals or contacts.
                oneOf:
                  - $ref: '#/components/schemas/NoPermissionDealsError'
                  - $ref: '#/components/schemas/NoPermissionContactsError'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
        - OAuth2:
            - ZohoCRM.modules.CONTACTS.DELETE
            - ZohoCRM.modules.DEALS.DELETE
  /{module}/{dealId}/Contact_Roles/{contactId}:
    get:
      summary: Deal Contact Roles
      description: >-
        Retrieves the contact role relation for a specific contact associated
        with a deal.
      operationId: getDealContactRoleForContact
      parameters:
        - $ref: '#/components/parameters/Module'
        - $ref: '#/components/parameters/DealId'
        - $ref: '#/components/parameters/Contact'
        - $ref: '#/components/parameters/Fields'
      responses:
        '200':
          description: >-
            Response body of a successfully retrieved the contact role relation
            for the given contact.
          content:
            application/json:
              schema:
                type: object
                x-zs-$id: SuccessResponseGet
                description: >-
                  Response body containing the contact role relation for the
                  specified contact.
                properties:
                  data:
                    type: array
                    maxItems: 1
                    description: >-
                      Array containing the contact role record for the specified
                      contact
                    items:
                      type: object
                      description: >-
                        Contact role record with dynamic fields based on the
                        'fields' query parameter
                      properties:
                        Owner:
                          type: object
                          description: Owner information for the contact role
                          properties:
                            name:
                              type: string
                              description: Owner's display name
                              maxLength: 255
                            id:
                              type: string
                              description: Owner's unique identifier
                              format: int64
                            email:
                              type: string
                              description: Owner's email address
                              format: email
                          additionalProperties: false
                        Department:
                          type:
                            - string
                            - 'null'
                          description: Department of the contact
                        Contact_Role:
                          type: object
                          description: Contact role information
                          properties:
                            name:
                              type: string
                              description: Role name (e.g., Developer/Evaluator)
                              maxLength: 255
                            id:
                              type: string
                              description: Role's unique identifier
                              format: int64
                          required:
                            - name
                            - id
                          additionalProperties: false
                      additionalProperties: true
                    minItems: 1
                required:
                  - data
                additionalProperties: false
              examples:
                ContactRoleForContactResponse:
                  value:
                    data:
                      - Owner:
                          name: luffy
                          id: '4408068000000623001'
                          email: luffy@zohotest.com
                        Department: null
                        Contact_Role:
                          name: Developer/Evaluator
                          id: '4408068000000007170'
                        Email: null
                        id: '4408068000000963425'
        '204':
          description: >-
            No contact role relation exists for the specified contact on this
            deal.
        '400':
          description: >-
            Represents the response body of errors such as Invalid data, invalid
            module, field limit exceeded, or required parameter missing.
          content:
            application/json:
              schema:
                x-zs-$id: ErrorResponseGet400
                description: >-
                  Represents the error response for a bad request, which can be
                  one of several specific error types.
                oneOf:
                  - $ref: '#/components/schemas/InvalidDataError'
                  - $ref: '#/components/schemas/InvalidModuleError'
                  - $ref: '#/components/schemas/RequiredParamMissingError'
                  - $ref: '#/components/schemas/InvalidRelationNameError'
        '403':
          description: >-
            Represents the error response when the user does not have enough
            permission to access deals or contacts.
          content:
            application/json:
              schema:
                x-zs-$id: ErrorResponseGet403
                description: >-
                  Represents the error response for when the user lacks
                  permission to access deals or contacts.
                oneOf:
                  - $ref: '#/components/schemas/NoPermissionDealsError'
                  - $ref: '#/components/schemas/NoPermissionContactsError'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
        - OAuth2:
            - ZohoCRM.modules.CONTACTS.READ
            - ZohoCRM.modules.DEALS.READ
    put:
      summary: Deal Contact Roles
      description: Assign or update a contact role for a specific contact on a deal.
      operationId: associateContactRoleToDeal
      parameters:
        - $ref: '#/components/parameters/Module'
        - $ref: '#/components/parameters/DealId'
        - $ref: '#/components/parameters/Contact'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: >-
                Represents the request body containing the contact role
                assignment to apply.
              properties:
                data:
                  type: array
                  description: Single contact role relation definition
                  minItems: 1
                  maxItems: 1
                  items:
                    type: object
                    description: Contact role configuration for the specified contact
                    properties:
                      Contact_Role:
                        type: object
                        description: Contact role details to associate
                        properties:
                          name:
                            type: string
                            description: Contact role display name
                            maxLength: 255
                          id:
                            type: string
                            format: int64
                            description: Unique identifier of the contact role
                        additionalProperties: false
                    required:
                      - Contact_Role
                    additionalProperties: false
              required:
                - data
              additionalProperties: false
            examples:
              AssociateContactRoleRequest:
                value:
                  data:
                    - Contact_Role:
                        name: Engineering Lead
                        id: '4408068000000007178'
      responses:
        '200':
          description: >-
            Represents the response of a successfully associated the contact
            role with the deal.
          content:
            application/json:
              schema:
                type: object
                x-zs-$id: SuccessresponsePut
                description: Provides the response of updating the contact role relation.
                properties:
                  data:
                    type: array
                    description: Status entries for the processed contact relation
                    minItems: 1
                    maxItems: 1
                    items:
                      type: object
                      description: Operation result for the contact relation
                      properties:
                        code:
                          type: string
                          description: Operation status code
                          const: SUCCESS
                        details:
                          type: object
                          description: Details about the processed relation
                          properties:
                            id:
                              type: string
                              format: int64
                              description: Identifier of the contact-deal relation
                          required:
                            - id
                          additionalProperties: false
                        message:
                          type: string
                          description: Result message
                          const: relation updated
                        status:
                          type: string
                          description: Operation status
                          const: success
                      required:
                        - code
                        - details
                        - message
                        - status
                      additionalProperties: false
                required:
                  - data
                additionalProperties: false
              examples:
                AssociateContactRoleResponse:
                  value:
                    data:
                      - code: SUCCESS
                        details:
                          id: '4408068000000963455'
                        message: relation updated
                        status: success
        '400':
          description: >-
            Bad Request - Invalid data, invalid module, field limit exceeded, or
            required parameter missing
          content:
            application/json:
              schema:
                x-zs-$id: ErrorresponsePut400
                description: >-
                  Error response for a bad request, which can be one of several
                  specific error types.
                oneOf:
                  - $ref: '#/components/schemas/InvalidDataError'
                  - $ref: '#/components/schemas/InvalidModuleError'
                  - $ref: '#/components/schemas/RequiredParamMissingError'
                  - $ref: '#/components/schemas/InvalidRelationNameError'
        '403':
          description: >-
            Represents the error response when the user does not have permission
            to access deals or contacts.
          content:
            application/json:
              schema:
                x-zs-$id: ErrorresponsePut403
                description: >-
                  Error response for when the user lacks permission to access
                  deals or contacts.
                oneOf:
                  - $ref: '#/components/schemas/NoPermissionDealsError'
                  - $ref: '#/components/schemas/NoPermissionContactsError'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
        - OAuth2:
            - ZohoCRM.modules.CONTACTS.UPDATE
            - ZohoCRM.modules.DEALS.UPDATE
    delete:
      summary: Deal Contact Roles
      description: >-
        Remove a specific contact-deal relation using the contact identifier in
        the path.
      operationId: deleteContactRoleRelation
      parameters:
        - $ref: '#/components/parameters/Module'
        - $ref: '#/components/parameters/DealId'
        - $ref: '#/components/parameters/Contact'
      responses:
        '200':
          description: >-
            Represents the response body of a successfully removed the specified
            contact relation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteRelationsSuccessResponse'
              examples:
                DeleteSingleRelationSuccess:
                  value:
                    data:
                      - code: SUCCESS
                        details:
                          id: '4408068000000963455'
                        message: relation removed
                        status: success
        '400':
          description: >-
            Represents the error response of cases such as invalid data, invalid
            module, field limit exceeded, or required parameter missing.
          content:
            application/json:
              schema:
                x-zs-$id: DeleteErrorResponse400
                description: >-
                  Error response for a bad request, which can be one of several
                  specific error types.
                oneOf:
                  - $ref: '#/components/schemas/InvalidDataError'
                  - $ref: '#/components/schemas/InvalidModuleError'
                  - $ref: '#/components/schemas/RequiredParamMissingError'
                  - $ref: '#/components/schemas/InvalidRelationNameError'
        '403':
          description: >-
            Represents the error response when the user does not have permission
            to access deals or contacts.
          content:
            application/json:
              schema:
                x-zs-$id: DeleteErrorResponse403
                description: >-
                  Error response for when the user lacks permission to access
                  deals or contacts.
                oneOf:
                  - $ref: '#/components/schemas/NoPermissionDealsError'
                  - $ref: '#/components/schemas/NoPermissionContactsError'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
        - OAuth2:
            - ZohoCRM.modules.CONTACTS.DELETE
            - ZohoCRM.modules.DEALS.DELETE
components:
  schemas:
    InvalidDataError:
      type: object
      x-zs-$id: InvalidDataError
      description: Error response of an invalid related ID provided in the request.
      properties:
        code:
          type: string
          description: Error code indicating invalid deal ID
          const: INVALID_DATA
        details:
          type: object
          description: Error details containing the path index
          properties:
            resource_path_index:
              type: integer
              format: int64
              description: Index of the path parameter that is invalid (1 for deal ID)
              const: 1
          required:
            - resource_path_index
          additionalProperties: false
        message:
          type: string
          description: Error message indicating the deal ID is invalid
          const: the related id given seems to be invalid
        status:
          type: string
          description: Response status
          const: error
      required:
        - code
        - details
        - message
        - status
      additionalProperties: false
    InvalidModuleError:
      type: object
      x-zs-$id: InvalidModuleError
      description: Error response of an invalid module name provided in the request.
      properties:
        code:
          type: string
          description: Error code indicating invalid module name
          const: INVALID_MODULE
        details:
          type: object
          description: Error details containing the path index
          properties:
            resource_path_index:
              type: integer
              format: int32
              description: Index of the path parameter that is invalid (0 for module)
              const: 0
          required:
            - resource_path_index
          additionalProperties: false
        message:
          type: string
          description: Error message indicating the module name is invalid
          const: the module name given seems to be invalid
        status:
          type: string
          description: Response status
          const: error
      required:
        - code
        - details
        - message
        - status
      additionalProperties: false
    InvalidRelationNameError:
      type: object
      x-zs-$id: InvalidRelationNameError
      description: >-
        Error response when the user provided an invalid relation name in the
        request.
      properties:
        code:
          type: string
          description: Error code indicating invalid relation name
          const: INVALID_DATA
        details:
          type: object
          description: Error details containing the path index
          properties:
            resource_path_index:
              type: integer
              format: int32
              description: >-
                Index of the path parameter that is invalid (2 for relation
                name)
              const: 2
          required:
            - resource_path_index
          additionalProperties: false
        message:
          type: string
          description: Error message indicating the relation name is invalid
          const: the relation name given seems to be invalid
        status:
          type: string
          description: Response status
          const: error
      required:
        - code
        - details
        - message
        - status
      additionalProperties: false
    RequiredParamMissingError:
      type: object
      x-zs-$id: RequiredParamMissingError
      description: Error response of a missing required parameter.
      properties:
        code:
          type: string
          description: Error code indicating a required parameter is missing
          const: REQUIRED_PARAM_MISSING
        details:
          type: object
          description: Error details containing the missing parameter name
          properties:
            param_name:
              type: string
              description: Name of the missing required parameter
              const: fields
          required:
            - param_name
          additionalProperties: false
        message:
          type: string
          description: Error message indicating a parameter is missing
          const: One of the expected parameter is missing
        status:
          type: string
          description: Response status
          const: error
      required:
        - code
        - details
        - message
        - status
      additionalProperties: false
    NoPermissionDealsError:
      type: object
      x-zs-$id: NoPermissionDealsError
      description: >-
        Represents the error response when the user does not have permission to
        view deals.
      properties:
        code:
          type: string
          description: Error code indicating lack of permission
          const: NO_PERMISSION
        details:
          type: object
          description: Details about the missing permissions
          properties:
            permissions:
              type: array
              description: List of required permissions that are missing
              items:
                type: string
                description: Permission identifier for viewing deals
                const: Crm_Implied_View_Potentials
              maxItems: 1
          required:
            - permissions
          additionalProperties: false
        message:
          type: string
          description: Error message indicating permission denial
          const: permission denied
        status:
          type: string
          description: Response status
          const: error
      required:
        - code
        - details
        - message
        - status
      additionalProperties: false
    NoPermissionContactsError:
      type: object
      x-zs-$id: NoPermissionContactsError
      description: >-
        Represents the error response when the user does not have permission to
        view contacts.
      properties:
        code:
          type: string
          description: Error code indicating lack of permission
          const: NO_PERMISSION
        details:
          type: object
          description: Details about the missing permissions
          properties:
            permissions:
              type: array
              description: List of required permissions that are missing
              items:
                type: string
                description: Permission identifier for viewing contacts
                const: Crm_Implied_View_Contacts
              maxItems: 1
          required:
            - permissions
          additionalProperties: false
        message:
          type: string
          description: Error message indicating permission denial
          const: permission denied
        status:
          type: string
          description: Response status
          const: error
      required:
        - code
        - details
        - message
        - status
      additionalProperties: false
    DeleteRelationsSuccessResponse:
      type: object
      x-zs-$id: DeleteRelationsSuccessResponse
      description: Represents the response returned after deleting contact role relations.
      properties:
        data:
          type: array
          description: Status entries for each deleted relation
          maxItems: 100
          items:
            type: object
            description: Result for a single relation delete operation
            properties:
              code:
                type: string
                description: Operation status code
                const: SUCCESS
              details:
                type: object
                description: Details about the deleted relation
                properties:
                  id:
                    type: string
                    format: int64
                    description: Identifier of the deleted relation
                required:
                  - id
                additionalProperties: false
              message:
                type: string
                description: Result message
                const: relation removed
              status:
                type: string
                description: Operation status
                const: success
            required:
              - code
              - details
              - message
              - status
            additionalProperties: false
          minItems: 1
      required:
        - data
      additionalProperties: false
    UpsertRelationsRequest:
      type: object
      description: >-
        Represents the request body for adding or updating contact role
        relations on a deal.
      properties:
        data:
          type: array
          description: List of contact role relations to upsert
          minItems: 1
          maxItems: 100
          items:
            type: object
            description: Contact role relation definition
            properties:
              Contact_Role:
                type: object
                description: Contact role to associate with the relation
                properties:
                  name:
                    type: string
                    description: Contact role display name
                    maxLength: 255
                  id:
                    type: string
                    format: int64
                    description: Contact role identifier
                required:
                  - id
                additionalProperties: false
              id:
                type: string
                format: int64
                description: Identifier of the contact relation for the deal
            required:
              - Contact_Role
              - id
            additionalProperties: false
      required:
        - data
      additionalProperties: false
    UpsertRelationsSuccessResponse:
      type: object
      x-zs-$id: UpsertRelationsSuccessResponse
      description: >-
        Represents the response body of a successfully added after adding or
        updating contact role relations.
      properties:
        data:
          type: array
          description: Status entries for each processed relation
          minItems: 1
          maxItems: 100
          items:
            type: object
            description: Result for processing a single relation
            properties:
              code:
                type: string
                description: Operation status code
                const: SUCCESS
              details:
                type: object
                description: Details about the processed relation
                properties:
                  id:
                    type: string
                    format: int64
                    description: Identifier of the processed relation
                required:
                  - id
                additionalProperties: false
              message:
                type: string
                description: Result message describing the action performed
                enum:
                  - relation updated
                  - relation added
              status:
                type: string
                description: Operation status
                const: success
            required:
              - code
              - details
              - message
              - status
            additionalProperties: false
      required:
        - data
      additionalProperties: false
  responses:
    InternalServerError:
      description: Response body of an Internal Server Error.
      content:
        application/json:
          schema:
            type: object
            x-zs-$id: InternalServerErrorResponse
            description: >-
              Provides the internal server error response object containing
              code, message, details, and status.
            properties:
              code:
                type: string
                description: Provides the error code indicating the type of error.
                maxLength: 50
              message:
                type: string
                description: Provides the details of the error.
                maxLength: 255
              details:
                type: object
                description: Specifies the additional details about the error.
                additionalProperties: true
              status:
                type: string
                description: Provides the status of the error response.
                enum:
                  - error
            required:
              - code
              - message
              - details
              - status
            additionalProperties: false
          examples:
            ErrorExample:
              value:
                code: INTERNAL_ERROR
                message: Internal Server Error
                details: {}
                status: error
  parameters:
    Module:
      name: module
      in: path
      required: true
      description: >-
        Represents the module name for the deal record. Use the [Get Modules
        API](modules.yaml#$.paths./settings/modules.get) to get the required
        module API name.
      schema:
        type: string
        enum:
          - Deals
    DealId:
      name: dealId
      in: path
      required: true
      description: >-
        Represents the unique identifier of the deal record. Use the [Get
        Records API](record.yaml#$.paths./{module}.get) and get the unique ID of
        the Deal.
      schema:
        type: string
        format: int64
    Contact:
      name: contactId
      in: path
      required: true
      description: >-
        Represents the unique identifier of the contact record. Use the [Get
        Records API](record.yaml#$./{module}.get) to get the valid Contact IDs.
      schema:
        type: string
        format: int64
    Ids:
      name: ids
      in: query
      required: false
      description: >-
        Represents the comma-separated list of contact role relation IDs to
        delete. Use the [Get Contact Roles
        API](deal_contact_roles.yaml#$.paths./{module}/{dealId}/Contact_Roles.get)
        to get the valide IDs.
      schema:
        type: string
        format: int64
    Fields:
      name: fields
      in: query
      required: true
      description: >-
        Comma-separated list of field names to include in the response. Field
        names must follow API naming conventions. Use the [Get Fields
        API](fields.yaml#$.paths./settings/fields.get) to get the valide field
        API names.
      schema:
        type: string
        pattern: ^[A-Za-z_][A-Za-z0-9_]*(?:,[A-Za-z_][A-Za-z0-9_]*)*$
        minLength: 1
        maxLength: 1000
      examples:
        BasicFields:
          value: First_Name,Last_Name,Email
          summary: Basic contact fields
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://accounts.zoho.com/oauth/v2/auth
          tokenUrl: https://accounts.zoho.com/oauth/v2/token
          refreshUrl: https://accounts.zoho.com/oauth/v2/token
          scopes:
            ZohoCRM.modules.CONTACTS.READ: View access to all Contacts module
            ZohoCRM.modules.CONTACTS.CREATE: Create access to all Contacts module
            ZohoCRM.modules.CONTACTS.UPDATE: Edit access to all Contacts module
            ZohoCRM.modules.CONTACTS.DELETE: Delete access to all Contacts module
            ZohoCRM.modules.DEALS.READ: View access to all Deals module
            ZohoCRM.modules.DEALS.CREATE: Create access to all Deals module
            ZohoCRM.modules.DEALS.UPDATE: Edit access to all Deals module
            ZohoCRM.modules.DEALS.DELETE: Delete access to all Deals module
