    DeleteLayoutBadRequestResponse:
      description: >-
        Bad request response returned when a layout deletion request contains
        invalid or missing parameters, or when the requested deletion action is
        not permitted due to existing associations.
      content:
        application/json:
          schema:
            x-zs-$id: LayoutErrorResponseStructure
