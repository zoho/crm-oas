openapi: 3.1.0
info:
  title: Layouts API
  description: >-
    CRUD operations on Layout customization for modules in Zoho CRM. Supports
    getting the details of all layouts or a specific layout of a module,
    updating a layout, deactivating/activating a layout, and deleting a layout.
  version: '8'
servers:
  - url: https://zohoapis.{dc}/crm/{version}
    description: API Server URL
    variables:
      dc:
        enum:
          - com
          - eu
          - in
          - cn
          - au
        default: com
        description: API Server URL TLD
      version:
        default: v8
        description: API Version
paths:
  /settings/layouts:
    get:
      summary: Get layouts metadata
      description: >-
        To retrieve the layout configurations for a specified module in your
        Zoho CRM organization.  **Note:** - The **profiles** array is **null**
        if the user does not have the Module Customization permission in their
        profile. - For the Deals module, when the pipeline feature is enabled,
        multiple layouts exist per pipeline, each with its own set of layouts. -
        Score and Visit Summary sections are system-generated and read-only. -
        The API returns all layouts for the module in a single response;
        pagination is not supported.
      operationId: getLayouts
      parameters:
        - $ref: '#/components/parameters/ModuleParameter'
        - $ref: '#/components/parameters/ModeParameter'
        - $ref: '#/components/parameters/Includes'
        - $ref: '#/components/parameters/IncludeInnerDetails'
        - $ref: '#/components/parameters/MirrorComponentParameter'
      responses:
        '200':
          $ref: '#/components/responses/LayoutSuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'
      security:
        - OAuth2:
            - ZohoCRM.settings.layouts.READ
  /settings/layouts/{id}:
    get:
      summary: Get layout by ID
      description: >-
        To retrieve the details of a specific layout by its layout ID for a
        specified module in your Zoho CRM account.  **Important Notes:** - The
        `profiles` array is `null` when the user does not have "Module
        Customization" permission in their profile. - For Deals module: When the
        pipeline feature is enabled, multiple layouts exist per pipeline. Each
        pipeline can have its own set of layouts. - The `mode` parameter filters
        the layout by mode. Possible values: **all**, **business_card**,
        **quick_create**. - Score and Visit Summary sections are
        system-generated and read-only.  **Prerequisite:** The layout ID can be
        obtained from the Get All Layouts API.
      operationId: getLayoutById
      parameters:
        - $ref: '#/components/parameters/LayoutIdParameter'
        - $ref: '#/components/parameters/ModuleParameter'
        - $ref: '#/components/parameters/ModeParameter'
        - $ref: '#/components/parameters/Includes'
        - $ref: '#/components/parameters/IncludeInnerDetails'
        - $ref: '#/components/parameters/MirrorComponentParameter'
      responses:
        '200':
          $ref: '#/components/responses/LayoutSuccessResponse'
        '204':
          description: >-
            Indicates that the request was processed successfully, but no layout
            data matches the specified criteria.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'
      security:
        - OAuth2:
            - ZohoCRM.settings.layouts.READ
    patch:
      operationId: updateLayout
      summary: Update a custom layout
      description: >-
        To update a custom layout in your Zoho CRM organization, including
        renaming it, modifying profile permissions, enabling or disabling the
        business card display, and creating, updating, or deleting sections and
        fields within sections.
      tags:
        - Layouts
      security:
        - OAuth2:
            - ZohoCRM.settings.layouts.UPDATE
      parameters:
        - $ref: '#/components/parameters/LayoutIdParameter'
        - $ref: '#/components/parameters/ModuleParameter'
      requestBody:
        required: true
        description: >-
          The request body must contain a layouts array with one object. You can
          include a maximum of five sections per request, with no more than five
          fields in total across all sections.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateLayoutRequest'
            examples:
              RenameLayout:
                summary: Rename an existing custom layout
                description: >-
                  Demonstrates renaming a custom layout by supplying a new name
                  value in the request body. The existing layout identified by
                  the path parameter retains all other configuration; only the
                  display name changes.
                value:
                  layouts:
                    - name: Updated CL1
              AddProfilePermission:
                summary: Granting a CRM profile access to a layout
                description: >-
                  Shows a layout update request that grants a CRM profile access
                  to the specified layout. The profile is associated with the
                  layout so that users assigned to that profile can view and
                  interact with it when working on records.
                value:
                  layouts:
                    - profiles:
                        - id: '111111000000000395'
              RemoveProfilePermission:
                summary: Revokes a CRM profile's access to a layout via the delete flag
                description: >-
                  Demonstrates revoking a CRM profile's access to a layout by
                  setting the delete flag on the profile entry. This removes the
                  profile's visibility and usage rights for the layout without
                  affecting other profiles assigned to it.
                value:
                  layouts:
                    - profiles:
                        - id: '111111000000000393'
                          _delete: true
              ToggleBusinessCard:
                summary: Toggle the business card display setting on a layout
                description: >-
                  Illustrates toggling the business card display setting on a
                  layout by setting the business card display property to the
                  desired Boolean state. All other layout properties remain
                  unchanged while only the business card visibility is modified.
                value:
                  layouts:
                    - show_business_card: false
              CreateCustomSection:
                summary: Creating a new custom section within a layout
                description: >-
                  Shows a layout update request that introduces a new custom
                  section into the layout structure. The section is defined with
                  a name and display configuration, providing a dedicated
                  grouping area for fields within the layout.
                value:
                  layouts:
                    - sections:
                        - sequence_number: 6
                          tab_traversal: left_to_right
                          column_count: 1
                          name: Custom Section 2
                          display_label: Custom Section 2
              AddFieldToSection:
                summary: Adding an existing field to a layout section
                description: >-
                  Shows a layout update request that places an existing CRM
                  field into a designated section. The field is referenced by
                  its identifier and positioned within the section's field
                  sequence without creating a new field definition.
                value:
                  layouts:
                    - sections:
                        - id: '3722469000001374014'
                          fields:
                            - id: '3722469000001347394'
              UpdateFieldSequence:
                summary: Reorder a field's position within a layout section
                description: >-
                  Shows how to reorder a field within its section by specifying
                  the target field identifier alongside a new sequence or
                  position value. The updated ordering is applied to the named
                  section without altering any other field configuration.
                value:
                  layouts:
                    - sections:
                        - id: '3722469000001374014'
                          fields:
                            - id: '3722469000001347394'
                              sequence_number: 2
              DeleteSection:
                summary: >-
                  Permanently removes a section and its field assignments from a
                  layout
                description: >-
                  Demonstrates permanently removing an entire section from a
                  layout. Unlike moving fields to unused, this operation
                  irreversibly eliminates the section and all of its field
                  assignments from the layout.
                value:
                  layouts:
                    - sections:
                        - id: '3722469000001374014'
                          _delete:
                            permanent: true
              MoveFieldToUnused:
                summary: >-
                  Relocates a field to the unused items section without deleting
                  it
                description: >-
                  Demonstrates relocating a field to the unused items section of
                  a layout without permanently deleting it. The field is
                  preserved and can be reassigned to an active section at a
                  later time.
                value:
                  layouts:
                    - sections:
                        - id: '3722469000001347180'
                          fields:
                            - id: '3722469000001347394'
                              _delete:
                                permanent: false
              CreateNewField:
                summary: Adds a new custom field definition to a layout section
                description: >-
                  Demonstrates adding a new custom field definition to an
                  existing section of a layout. The request specifies the field
                  type, label, and target section, creating a field that did not
                  previously exist in the layout.
                value:
                  layouts:
                    - sections:
                        - id: '3722469000001347180'
                          fields:
                            - field_label: CF1
                              length: 16
                              sequence_number: 1
                              data_type: text
              MultipleFieldsAcrossSections:
                summary: >-
                  Adds up to five fields spread across multiple layout sections
                  in one request
                description: >-
                  Demonstrates adding up to five fields distributed across two
                  or more distinct layout sections within a single request. This
                  approach reduces round-trips when populating several sections
                  simultaneously, subject to the five-field-per-request limit.
                value:
                  layouts:
                    - sections:
                        - id: '3722469000001374014'
                          fields:
                            - id: '3722469000001347394'
                            - id: '3722469000001347395'
                        - id: '3722469000001374015'
                          fields:
                            - id: '3722469000001347396'
                            - id: '3722469000001347397'
                            - id: '3722469000001347398'
              CreateFieldWithAssociation:
                summary: Creating a new field with a Field-Of-Lookup association
                description: >-
                  Shows a layout update request that creates a new field inline
                  and establishes a Field-Of-Lookup (FOL) mapping to a related
                  field in another module. This association allows the field to
                  surface data from a linked record via an existing lookup
                  field, connecting the two modules at the field level.
                value:
                  layouts:
                    - sections:
                        - id: '3722469000001347180'
                          fields:
                            - field_label: Account Revenue
                              data_type: integer
                              length: 9
                              association_details:
                                lookup_field:
                                  id: '3722469000001347500'
                                  api_name: Account_Lookup
                                related_field:
                                  id: '3722469000001347600'
                                  api_name: Annual_Revenue
              UpdateFieldWithAssociation:
                summary: >-
                  Attach a Field-Of-Lookup association to an existing layout
                  field
                description: >-
                  Demonstrates attaching a Field-Of-Lookup (FOL) association to
                  an existing layout field by providing the field identifier
                  together with association details that reference the lookup
                  field and its related field. This pattern links two fields so
                  that the layout can derive values from the specified lookup
                  relationship.
                value:
                  layouts:
                    - sections:
                        - id: '3722469000001347180'
                          fields:
                            - id: '3722469000001347394'
                              association_details:
                                lookup_field:
                                  id: '3722469000001347500'
                                related_field:
                                  id: '3722469000001347600'
              AddMirrorComponentToSection:
                summary: Adding a mirror field component to a layout section
                description: >-
                  Shows a layout update request that adds a mirror field
                  component to a section. A mirror component reflects the value
                  of a field from a related module, allowing users to view
                  cross-module data directly within the layout.
                value:
                  layouts:
                    - sections:
                        - id: '3722469000001374014'
                          fields:
                            - id: '3359388011000000523'
                              sequence_number: 3
                              element_type: mirror_field
                              lookup_field:
                                id: '3359388000000000523'
                                api_name: Account_Name
            x-zs-llm-examples:
              - RenameLayout
              - CreateNewField
              - CreateCustomSection
              - MoveFieldToUnused
      responses:
        '200':
          description: >-
            Returns a layouts array containing the result of the update
            operation, including a SUCCESS status code and the ID of the updated
            layout.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateLayoutSuccessResponse'
              examples:
                Success:
                  summary: Layout updated successfully with confirmation details
                  value:
                    layouts:
                      - code: SUCCESS
                        details:
                          id: '3722469000001346011'
                        message: layout updated
                        status: success
        '400':
          description: >-
            Invalid data or parameters in the request. **Resolution:** The
            caller must verify that the layout ID, module name, and all required
            fields and section identifiers in the request body are valid and
            present.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateLayoutErrorResponse'
              examples:
                InvalidFieldId:
                  summary: Invalid field ID provided
                  value:
                    layouts:
                      - code: INVALID_DATA
                        details:
                          api_name: id
                          json_path: $.layouts[0].sections[0].fields[0].id
                        message: the id given seems to be invalid
                        status: error
                InvalidTabTraversal:
                  summary: Invalid data type for tab traversal value
                  value:
                    layouts:
                      - code: INVALID_DATA
                        details:
                          expected_data_type: text
                          api_name: tab_traversal
                          json_path: $.layouts[0].sections[0].tab_traversal
                        message: invalid data
                        status: error
                SystemKeywordNotAllowed:
                  summary: Layout name contains a reserved system keyword
                  description: >-
                    Returned when the layout name contains a reserved system
                    keyword. Zoho CRM responds with code INVALID_DATA and the
                    message "System keyword not allowed in layout label".
                  value:
                    layouts:
                      - code: INVALID_DATA
                        details:
                          api_name: name
                          json_path: $.layouts[0].name
                        message: System keyword not allowed in layout label
                        status: error
                RequiredParamMissing:
                  summary: Required module parameter missing from request
                  value:
                    code: REQUIRED_PARAM_MISSING
                    details:
                      param_name: module
                    message: One of the expected parameter is missing
                    status: error
                InvalidModule:
                  summary: Invalid module name provided
                  value:
                    code: INVALID_MODULE
                    details: {}
                    message: the module name given seems to be invalid
                    status: error
                InvalidSectionIdOrApiName:
                  summary: Section missing required ID or display label
                  value:
                    layouts:
                      - code: EXPECTED_FIELD_MISSING
                        details:
                          expected_fields:
                            - api_name: id
                              json_path: $.layouts[0].sections[0].id
                            - api_name: display_label
                              json_path: $.layouts[0].sections[0].display_label
                        message: should contain either id or display_label
                        status: error
                DependentFieldMissingForSection:
                  summary: Section ID or api_name absent during a section operation
                  value:
                    layouts:
                      - code: DEPENDENT_FIELD_MISSING
                        details:
                          dependee:
                            api_name: _delete
                            json_path: $.layouts[0].sections[0]._delete
                          api_name: api_name
                          json_path: $.layouts[0].sections[0].api_name
                        message: section id or api_name is missing
                        status: error
                DependentFieldMissingForField:
                  summary: Field ID or field_label absent during a field operation
                  value:
                    layouts:
                      - code: EXPECTED_FIELD_MISSING
                        details:
                          expected_fields:
                            - api_name: id
                              json_path: $.layouts[0].sections[0].fields[0].id
                            - api_name: field_label
                              json_path: $.layouts[0].sections[0].fields[0].field_label
                        message: should contain either id or field_label
                        status: error
                NotAllowedRelatedFieldLengthHigher:
                  summary: >-
                    Related field length exceeds target field length in FoL
                    mapping
                  description: >-
                    Returned when the related field's length exceeds the target
                    field's length during a Field-of-Lookup mapping operation.
                    Zoho CRM responds with code NOT_ALLOWED and the message
                    "related field length is higher".
                  value:
                    layouts:
                      - code: NOT_ALLOWED
                        details:
                          api_name: id
                          json_path: >-
                            $.layouts[0].sections[0].fields[0].association_details.related_field.id
                        message: related field length is higher
                        status: error
                DependentMismatchFieldLength:
                  summary: >-
                    Field length and related field length incompatible for FoL
                    mapping
                  description: >-
                    Returned when the field length and related field length are
                    incompatible during a Field-of-Lookup (FoL) mapping
                    operation, triggering error code DEPENDENT_MISMATCH with
                    message "Field length mismatch for FOL mapping".
                  value:
                    layouts:
                      - code: DEPENDENT_MISMATCH
                        details:
                          dependee:
                            api_name: length
                            json_path: $.layouts[0].sections[0].fields[0].length
                          api_name: id
                          json_path: >-
                            $.layouts[0].sections[0].fields[0].association_details.related_field.id
                        message: Field length mismatch for FOL mapping
                        status: error
                NotSupportedAssociationDetails:
                  summary: >-
                    Field-of-Lookup association not supported for the specified
                    field
                  description: >-
                    Returned when association_details is provided for a field
                    that does not support Field-of-Lookup mapping. Zoho CRM
                    responds with code NOT_SUPPORTED and the message "Field of
                    lookup association is not supported for this field".
                  value:
                    layouts:
                      - code: NOT_SUPPORTED
                        details:
                          api_name: association_details
                          json_path: >-
                            $.layouts[0].sections[0].fields[0].association_details
                        message: >-
                          Field of lookup association is not supported for this
                          field
                        status: error
                FeatureNotSupportedAssociationDetails:
                  summary: License does not support Field-of-Lookup feature
                  description: >-
                    Returned when the user's license does not support
                    Field-of-Lookup mapping. Zoho CRM responds with code
                    FEATURE_NOT_SUPPORTED and the message "Your License does not
                    support this feature".
                  value:
                    layouts:
                      - code: FEATURE_NOT_SUPPORTED
                        details:
                          api_name: association_details
                          json_path: >-
                            $.layouts[0].sections[0].fields[0].association_details
                        message: Your License does not support this feature
                        status: error
                LimitExceededFoLMapping:
                  summary: Field-of-Lookup mapping limit reached for lookup
                  description: >-
                    Returned when the maximum number of Field-of-Lookup mappings
                    permitted for a lookup has been reached. Zoho CRM responds
                    with code LIMIT_EXCEEDED and the message "Field of Lookup
                    mapping limit is reached for the lookup".
                  value:
                    layouts:
                      - code: LIMIT_EXCEEDED
                        details:
                          limit: 5
                          limit_due_to:
                            - api_name: id
                              json_path: >-
                                $.layouts[0].sections[0].fields[0].association_details.lookup_field.id
                        message: >-
                          Field of Lookup mapping limit is reached for the
                          lookup
                        status: error
                AmbiguityDuringProcessingRelatedField:
                  summary: >-
                    Ambiguity detected when both ID and api_name identify
                    different related_fields
                  description: >-
                    Returned when both ID and api_name are provided for
                    related_field but resolve to different fields, triggering
                    error code AMBIGUITY_DURING_PROCESSING with message
                    "ambiguity while processing the related_field".
                  value:
                    layouts:
                      - code: AMBIGUITY_DURING_PROCESSING
                        details:
                          ambiguity_due_to:
                            - api_name: id
                              json_path: >-
                                $.layouts[0].sections[0].fields[0].association_details.related_field.id
                            - api_name: api_name
                              json_path: >-
                                $.layouts[0].sections[0].fields[0].association_details.related_field.api_name
                        message: ambiguity while processing the related_field
                        status: error
                ExpectedFieldMissingRelatedField:
                  summary: >-
                    No ID or api_name supplied for related_field in
                    association_details
                  description: >-
                    Returned when neither ID nor api_name is provided for the
                    related_field within association_details, triggering error
                    code EXPECTED_FIELD_MISSING with message "One of the
                    required fields is missing".
                  value:
                    layouts:
                      - code: EXPECTED_FIELD_MISSING
                        details:
                          expected_fields:
                            - api_name: id
                              json_path: >-
                                $.layouts[0].sections[0].fields[0].association_details.related_field.id
                            - api_name: api_name
                              json_path: >-
                                $.layouts[0].sections[0].fields[0].association_details.related_field.api_name
                        message: One of the required fields is missing
                        status: error
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          description: >-
            Permission denied. **Resolution:** The user does not have permission
            to update the layout. The administrator must grant the required CRM
            profile permissions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                NoPermission:
                  summary: CRM profile lacks permission to update layouts
                  description: >-
                    Returned when the requesting user does not have the CRM
                    profile permission required to update layouts. Zoho CRM
                    responds with code NO_PERMISSION and the message "permission
                    denied".
                  value:
                    code: NO_PERMISSION
                    details:
                      permissions:
                        - Crm_Implied_Customize_Zoho_CRM
                    message: permission denied
                    status: error
        '405':
          description: >-
            The HTTP request method is not valid for this endpoint.
            **Resolution:** The caller must specify a valid HTTP request method
            for the API URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                InvalidMethod:
                  summary: Invalid HTTP method used for this endpoint
                  value:
                    code: INVALID_REQUEST_METHOD
                    details: {}
                    message: The http request method type is not a valid one
                    status: error
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'
    delete:
      operationId: deleteLayout
      summary: Delete a custom layout
      description: >-
        To delete a custom layout from a module in your Zoho CRM organization.
        When the layout being deleted has associated records, a target layout
        must be specified to receive the transferred records and profile
        associations. If the layout has an associated pipeline, the target
        pipeline and stage must also be provided. Specifying a transfer target
        is optional only when the layout is deactivated and has no associated
        records. Only one custom layout can be deleted per API call, and the
        standard layout cannot be deleted.
      security:
        - OAuth2:
            - ZohoCRM.settings.layouts.DELETE
      parameters:
        - $ref: '#/components/parameters/LayoutIdParameter'
        - $ref: '#/components/parameters/ModuleParameter'
        - $ref: '#/components/parameters/TransferToParameter'
        - $ref: '#/components/parameters/PipelineParameter'
        - $ref: '#/components/parameters/StageParameter'
      responses:
        '200':
          $ref: '#/components/responses/DeleteLayoutSuccessResponse'
        '400':
          $ref: '#/components/responses/DeleteLayoutBadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          description: >-
            Permission denied to delete the layout. **Resolution:** The Zoho CRM
            administrator grants the user's profile the CRM customization
            permission required to delete layouts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                NoPermission:
                  summary: User lacks permission to delete the layout
                  description: >-
                    Returned when the authenticated user's profile lacks the CRM
                    customization permission required to delete layouts. The
                    response includes a list of the missing permissions.
                  value:
                    code: NO_PERMISSION
                    details:
                      permissions:
                        - Crm_Implied_Customize_Zoho_CRM
                    message: permission denied
                    status: error
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'
  /settings/layouts/{id}/convert_mapping: {}
components:
  parameters:
    LayoutIdParameter:
      name: id
      in: path
      required: true
      description: >-
        Specify the unique identifier of the layout. Refer to the [Get
        Layouts](layouts.yaml#$.paths./settings/layouts.get) resource for valid
        values.
      schema:
        type: string
        maxLength: 19
        x-zs-$ref:
          resource: layouts
          origins:
            - operationId: getLayouts
              propertyId: LayoutId
        format: int64
        pattern: ^[0-9]{1,19}$
        minLength: 1
        description: >-
          Represents a unique numeric identifier for a CRM entity, expressed as
          a 64-bit integer serialized as a string to preserve precision in JSON.
        example: '4832675000000850800'
      examples:
        ValidId:
          summary: Valid layout ID
          value: '111111000000098320'
    ModuleParameter:
      name: module
      in: query
      required: true
      description: >-
        Specify the API name of the required module. Refer to the [Get
        Modules](modules.yaml#$.paths./settings/modules.get) resource for valid
        values.
      schema:
        type: string
        maxLength: 50
        x-zs-$ref:
          resource: modules
          origins:
            - operationId: getModules
              propertyId: ModulesApiName
        description: >-
          Unique API identifier for the module used in third-party integrations;
          starts with a letter, contains only alphanumeric characters and
          underscores, and has no consecutive or trailing underscores.
      examples:
        StandardModule:
          summary: Standard module
          value: Leads
        CustomModule:
          summary: Custom module
          value: Custom_Projects
    ModeParameter:
      name: mode
      in: query
      required: false
      description: >-
        Specify the layout mode to filter the response. Available modes vary by
        module type. Possible values: `all` - Request all available layout
        modes. `business_card` - Business card layout view. `quick_create` -
        Quick create form layout.
      schema:
        type: string
        enum:
          - all
          - business_card
          - quick_create
      examples:
        BusinessCard:
          summary: Business card mode
          value: business_card
        QuickCreate:
          summary: Quick create mode
          value: quick_create
        AllModes:
          summary: All modes
          value: all
    TransferToParameter:
      name: transfer_to
      in: query
      required: false
      description: >-
        Specify the ID of the layout to which records associated with the
        current layout move upon layout deletion or deactivation. Refer to the
        [Get Layouts](layouts.yaml#$.paths./settings/layouts.get) resource for
        valid values.
      schema:
        $ref: '#/components/schemas/Id'
      examples:
        TransferLayoutId:
          summary: Transfer to layout ID
