        deactivating a layout. Refer to the [Get
        Pipelines](pipeline.yaml#$.paths./settings/pipeline.get) resource for
        valid values.
      schema:
        $ref: '#/components/schemas/Id'
      examples:
        PipelineId:
          summary: Pipeline ID
          value: '111111000000098500'
    StageParameter:
      name: stage
      in: query
      required: false
      description: >-
        Specify the ID of the stage within the pipeline to assign transferred
        records when deleting or deactivating a layout. Refer to the [Get
        Pipelines](pipeline.yaml#$.paths./settings/pipeline.get) resource for
        valid values.
      schema:
        $ref: '#/components/schemas/Id'
      examples:
        StageId:
          summary: Stage ID
          value: '111111000000098510'
    Includes:
      name: include
      in: query
      required: false
      description: >-
        Specify additional data to include in the response beyond the default
        layout structure. Possible values: `total_profiles` — include the total
        count of profiles associated with each layout. `portal_user_types` —
        include portal user type associations for each layout.
      schema:
        type: string
        enum:
          - total_profiles
          - portal_user_types
      examples:
        IncludeTotalProfiles:
          summary: Include total profiles
          value: total_profiles
    IncludeInnerDetails:
      name: include_inner_details
      in: query
      required: false
      description: >-
        Specify additional inner details to include in the response for each
        field. Possible values: `fields.allowed_permissions_to_update` - Include
        the set of permissions eligible for update per field.
        `fields.portal_user_types` - Include portal user type permission entries
        per field.
      schema:
        type: string
        pattern: ^[a-z_]+(\.[a-z_]+)?(,[a-z_]+(\.[a-z_]+)?)*$
        maxLength: 255
        example: >-
          profiles.type,fields.portal_user_types,fields.allowed_permissions_to_update
      examples:
        ProfileType:
          summary: Include profile type information
          value: profiles.type
        FieldsPortalUserTypes:
          summary: Include portal user types for fields
          value: fields.portal_user_types
        FieldsAllowedPermissions:
          summary: Include allowed permissions to update for fields
          value: fields.allowed_permissions_to_update
        MultipleDetails:
          summary: Include multiple inner details
          value: profiles.type,fields.portal_user_types
    MirrorComponentParameter:
      name: include_element_types
      in: query
      required: false
      description: >-
        Specify the type of field component in the layout, distinguishing
        standard fields from mirror fields that derive their value from a lookup
        source. Possible values: `field` — a standard data field in the layout.
        `mirror_field` — a field that reflects a value from a related module
        lookup.
      schema:
        type: string
        enum:
          - field
          - mirror_field
      examples:
        FieldsType:
          summary: Field type
          value: field
        MirrorFieldType:
          summary: Mirror field type
          value: mirror_field
