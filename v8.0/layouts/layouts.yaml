          examples:
            MissingTransferTo:
              summary: Required transfer_to parameter missing
              description: >-
                Returned when the layout has records associated with it but the
                required transfer_to parameter is absent from the request.
              value:
                code: REQUIRED_PARAM_MISSING
                details:
                  param_name: transfer_to
                message: One of the expected parameter is missing
                status: error
            MissingModule:
              summary: Required module parameter missing
              value:
                code: REQUIRED_PARAM_MISSING
                details:
                  param_name: module
                message: One of the expected parameter is missing
                status: error
            MissingPipeline:
              summary: Required pipeline parameter missing
              description: >-
                Returned when the layout has an associated pipeline but the
                required pipeline parameter is absent from the request.
              value:
                code: REQUIRED_PARAM_MISSING
                details:
                  param_name: pipeline
                message: One of the expected parameter is missing
                status: error
            MissingStage:
              summary: Required stage parameter missing
              description: >-
                Returned when the layout has an associated pipeline but the
                required stage parameter is absent from the request.
              value:
                code: REQUIRED_PARAM_MISSING
                details:
                  param_name: stage
                message: One of the expected parameter is missing
