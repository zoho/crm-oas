                message: The id given seems to be invalid
                status: error
            InvalidRequestMethod:
              summary: Invalid HTTP method used
              value:
                code: INVALID_REQUEST_METHOD
                details: {}
                message: The http request method type is not a valid one
                status: error
            DependentPipelineParamMissing:
              summary: Dependent pipeline parameter missing
              description: >-
                Returned when the pipeline parameter is required as a dependent
