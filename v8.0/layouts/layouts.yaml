    BadRequest:
      description: >-
        Bad request response returned when the request contains invalid or
        missing parameters.
      content:
        application/json:
          schema:
            x-zs-$id: ErrorResponseStructure
            type: object
            description: >-
              Represents the error response body returned when a request is
              rejected due to invalid parameters, missing required inputs, or
              unsupported operations.
            additionalProperties: false
            properties:
              code:
                type: string
                description: >-
                  Represents the error classification for the bad request.
                  Possible values: `REQUIRED_PARAM_MISSING` — a required
                  parameter was absent from the request; `INVALID_MODULE` — the
                  specified module does not exist or is not accessible;
                  `INVALID_REQUEST_METHOD` — the HTTP method used is not
                  supported for this endpoint; `PATTERN_NOT_MATCHED` — a
                  parameter value did not conform to the expected format;
                  `NOT_SUPPORTED` — the requested operation is not supported.
                enum:
                  - REQUIRED_PARAM_MISSING
                  - INVALID_MODULE
                  - INVALID_REQUEST_METHOD
                  - PATTERN_NOT_MATCHED
                  - NOT_SUPPORTED
              details:
                type: object
                description: >-
                  Contains supplementary information about the bad request
                  error, identifying the specific parameter or condition
                  responsible for the failure.
                additionalProperties: false
                properties:
                  param_name:
                    type: string
                    description: >-
                      Represents the name of the request parameter that
                      triggered the bad request error.
                    maxLength: 100
              message:
                type: string
                description: >-
                  Represents a plain-language description of the bad request
                  error, suitable for logging or surfacing to an end user.
                maxLength: 255
              status:
                type: string
                description: >-
                  Indicates the outcome of the request. Possible values: `error`
                  — the request was not processed successfully due to a bad
                  request condition.
                enum:
                  - error
            required:
              - code
              - details
              - message
              - status
          examples:
            MissingModuleParam:
              summary: Missing required module parameter
              description: >-
                Returned when the required module query parameter is absent from
                the request.
              value:
                code: REQUIRED_PARAM_MISSING
                details:
                  param_name: module
                message: One of the expected parameter is missing
                status: error
            InvalidModule:
              summary: Invalid module name provided
              description: >-
                Returned when the module name provided does not exist or is not
                accessible in the Zoho CRM organization.
              value:
                code: INVALID_MODULE
                details: {}
                message: the module name given seems to be invalid
                status: error
            PatternNotMatched:
              summary: Invalid mode parameter value
              description: >-
                Returned when the mode parameter value is case-sensitive and
                does not match any of the accepted values.
              value:
                code: PATTERN_NOT_MATCHED
                details:
                  param_name: mode
                message: Please check whether the input values are correct
                status: error
            InvalidRequestMethod:
              summary: Invalid HTTP method used
              description: >-
                Returned when an HTTP method other than the supported method
                applies to this endpoint.
              value:
                code: INVALID_REQUEST_METHOD
                details: {}
                message: The http request method type is not a valid one
                status: error
