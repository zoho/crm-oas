  schemas:
    Id:
      x-zs-$id: IdStructure
      type: string
      format: int64
      pattern: ^[0-9]{1,19}$
      minLength: 1
      maxLength: 19
      description: >-
        Represents a unique numeric identifier for a CRM entity, expressed as a
        64-bit integer serialized as a string to preserve precision in JSON.
      example: '4832675000000850800'
    ApiName:
      x-zs-$id: ApiNameStructure
      type: string
      pattern: ^[A-Za-z][A-Za-z0-9_]*$
      minLength: 1
      maxLength: 50
      description: >-
        Represents an API identifier string composed of alphanumeric characters
        and underscores, used as a programmatic reference for fields, modules,
        and other CRM entities.
      example: Lead_Owner
    ModuleName:
      type: string
      pattern: ^[A-Za-z0-9_]+$
      minLength: 1
      maxLength: 50
      description: >-
        Represents the API name of a CRM module, used as a programmatic
        identifier in API requests, automation configurations, and cross-module
        references.
      example: Leads
    TypeNull:
      x-zs-$id: TypeNullStructure
      type: 'null'
      description: >-
        Represents a null value used in `oneOf` schemas where a property may be
        absent or explicitly set to null.
    ReferenceId:
      type: string
      maxLength: 255
      pattern: \{\{[a-zA-Z0-9]+\}\}
      description: >-
        Represents a temporary identifier used to reference a section or element
        within a layout update request payload, enabling cross-referencing
        between newly created elements before their permanent IDs are assigned.
      example: '{{12345}}'
    UserReference:
      x-zs-$id: UserReferenceStructure
      type: object
      description: >-
        Represents a reference to the CRM user who performed an action, such as
        creating or modifying a layout, identified by their unique ID and
        display name.
      additionalProperties: false
      properties:
        name:
          type: string
          description: >-
            Represents the display name of the CRM user, shown in audit fields
            and reference contexts such as created_by and modified_by.
          minLength: 1
          maxLength: 100
          example: John Doe
        id:
          $ref: '#/components/schemas/Id'
      required:
        - name
        - id
    ActionsAllowed:
      type: object
      description: >-
        Represents the set of Boolean permission flags indicating which
        modification operations are permitted on a layout section, such as
        adding fields, renaming, reordering, and deleting.
      additionalProperties: false
      properties:
        add_field:
          type: boolean
          description: >-
            Indicates whether new fields may be introduced into the layout
            section. Possible values: `true` — adding fields to the section is
            permitted; `false` — adding fields to the section is not permitted.
        rename:
          type: boolean
          description: >-
            Indicates whether the display name of the layout section may be
            changed. Possible values: `true` — renaming the section is
            permitted; `false` — renaming the section is not permitted.
        change_tab_traversal:
          type: boolean
          description: >-
            Indicates whether the keyboard tab traversal order of fields within
            the layout section may be modified. Possible values: `true` —
            changing the tab traversal order is permitted; `false` — changing
            the tab traversal order is not permitted.
        reorder:
          type: boolean
          description: >-
            Indicates whether the relative ordering of sections or fields within
            the layout may be changed. Possible values: `true` — reordering is
            permitted; `false` — reordering is not permitted.
        delete:
          type: boolean
          description: >-
            Indicates whether the layout section may be permanently removed from
            the layout. Possible values: `true` — deleting the section is
            permitted; `false` — deleting the section is not permitted.
        remove_field:
          type: boolean
          description: >-
            Indicates whether existing fields may be detached from the layout
            section. Possible values: `true` — removing fields from the section
            is permitted; `false` — removing fields from the section is not
            permitted.
        change_column_count:
          type: boolean
          description: >-
            Indicates whether the number of columns displayed within the layout
            section may be modified. Possible values: `true` — adjusting the
            column count for the section is permitted; `false` — adjusting the
            column count for the section is not permitted.
      required:
        - add_field
        - rename
        - change_tab_traversal
        - reorder
        - delete
        - remove_field
        - change_column_count
    LayoutActionsAllowed:
      type: object
      description: >-
        Represents the set of Boolean permission flags indicating which
        operations are permitted on a layout, such as editing, renaming,
        cloning, deactivating, and deleting.
      additionalProperties: false
      properties:
        edit:
          type: boolean
          description: >-
            Indicates whether the layout's field arrangement, sections, and
            configuration can be modified. Possible values: `true` — editing the
            layout is permitted; `false` — the layout is locked against edits.
        rename:
          type: boolean
          description: >-
            Indicates whether the layout's display name can be changed. Possible
            values: `true` — renaming the layout is permitted; `false` — the
            layout name is locked.
        clone:
          type: boolean
          description: >-
            Indicates whether the layout can be duplicated to create a new
            layout with the same field and section configuration. Possible
            values: `true` — cloning the layout is permitted; `false` — the
            layout cannot be cloned.
        downgrade:
          type: boolean
          description: >-
            Indicates whether the layout can be downgraded to a lower-tier
            configuration or reverted to a previous edition-level feature set.
            Possible values: `true` — downgrading the layout is permitted;
            `false` — the layout cannot be downgraded.
        delete:
          type: boolean
          description: >-
            Indicates whether the layout can be permanently removed from the
            module configuration. Possible values: `true` — deleting the layout
            is permitted; `false` — the layout cannot be deleted.
        deactivate:
          type: boolean
          description: >-
            Indicates whether the layout can be deactivated, preventing it from
            being assigned to new records while preserving existing
            associations. Possible values: `true` — deactivating the layout is
            permitted; `false` — the layout cannot be deactivated.
        set_layout_permissions:
          type: boolean
          description: >-
            Indicates whether profile-level permission assignments for the
            layout can be configured. Possible values: `true` — managing layout
            permissions is permitted; `false` — permission settings cannot be
            modified for this layout.
      required:
        - edit
        - rename
        - clone
        - downgrade
        - delete
        - deactivate
        - set_layout_permissions
    ProfileReference:
      type: object
      description: >-
        Represents the profile associated with a layout, including the profile's
        display name, type classification, default view assignment, and whether
        this is the default layout for that profile.
      additionalProperties: true
      properties:
        _default_assignment_view:
          type: object
          description: >-
            Represents the default view configuration used for record assignment
            for users belonging to this profile and layout combination.
          additionalProperties: false
          properties:
            name:
              type: string
              description: >-
                Represents the name of the view used as the default for record
                assignment for this profile.
              minLength: 1
              maxLength: 100
              example: Standard
            id:
              $ref: '#/components/schemas/Id'
            type:
              type: string
              description: >-
                Indicates the type of view used for record assignment. Possible
                values: `canvas` — a custom canvas view; `layout` — a standard
                field layout.
              enum:
                - canvas
                - layout
              example: layout
          required:
            - name
            - id
            - type
        default:
          type: boolean
          description: >-
            Indicates whether this profile is the default profile assignment for
            the layout. Possible values: `true` — this is the default profile;
            `false` — this is not the default profile.
        name:
          type: string
          description: >-
            Represents the display name of the CRM profile associated with this
            layout assignment.
          minLength: 1
          maxLength: 60
          example: Administrator
        id:
          $ref: '#/components/schemas/Id'
        _default_view:
          type: object
          description: >-
            Represents the default view assigned to this profile for the layout,
            used when users of this profile open a record in the standard detail
            context.
          additionalProperties: false
          properties:
            name:
              type: string
              description: >-
                Represents the name of the default view assigned to this profile
                for the layout.
              minLength: 1
              maxLength: 100
              example: Standard
            id:
              $ref: '#/components/schemas/Id'
            type:
              type: string
              description: >-
                Indicates the type of the default view assigned to this profile.
                Possible values: `layout` — a standard field layout; `wizard` —
                a guided multi-step wizard.
              enum:
                - layout
                - wizard
              example: layout
          required:
            - name
            - id
            - type
        type:
          type: string
          description: >-
            Represents the classification type of the profile, distinguishing
            between available profile tiers. Possible values: `normal_profile` —
            a full-access standard CRM profile. `lite_profile` — a
            restricted-access lite profile.
          enum:
            - normal_profile
            - lite_profile
          example: normal_profile
      required:
        - _default_assignment_view
        - default
        - name
        - id
        - _default_view
    ConvertMappingModule:
      x-zs-$id: ConvertMappingModuleStructure
      description: >-
        Represents the convert mapping configuration that defines how record
        field values are transferred across modules during a record conversion
        operation.
      oneOf:
        - type: object
          x-zs-$id: LeadsConvertMapping
          title: Leads Convert Mapping
          description: >-
            Represents the lead conversion mapping configuration, specifying how
            fields from the Leads module are mapped to corresponding fields in
            the Contacts, Deals, and Accounts modules.
          additionalProperties: false
          properties:
            Contacts:
              $ref: '#/components/schemas/ConvertMappingTargetModule'
            Deals:
              $ref: '#/components/schemas/ConvertMappingTargetModuleWithFields'
            Accounts:
              $ref: '#/components/schemas/ConvertMappingTargetModule'
          required:
            - Contacts
            - Deals
            - Accounts
        - type: object
          x-zs-$id: QuotesConvertMapping
          title: Quotes Convert Mapping
          description: >-
            Represents the Quotes module conversion mapping configuration,
            specifying how fields from a Quote are mapped to corresponding
            fields in the Invoices and Sales_Orders modules.
          additionalProperties: false
          properties:
            SalesOrders:
              $ref: '#/components/schemas/ConvertMappingTargetModule'
            Invoices:
              $ref: '#/components/schemas/ConvertMappingTargetModule'
          required:
            - SalesOrders
            - Invoices
        - type: object
          x-zs-$id: SalesOrdersConvertMapping
          title: Sales Orders Convert Mapping
          description: >-
            Represents the Sales Order conversion mapping configuration,
            specifying how fields from a Sales Order are mapped to corresponding
            fields in the Invoices module.
          additionalProperties: false
          properties:
            Invoices:
              $ref: '#/components/schemas/ConvertMappingTargetModule'
          required:
            - Invoices
        - type: object
          x-zs-$id: EmptyLayoutConvertMappingObject
          title: No Convert Mapping
          description: >-
            Represents a null or empty convert mapping object indicating that no
            field conversion mapping is configured for this field.
          additionalProperties: false
          maxProperties: 0
    ConvertMappingTargetModule:
      type: object
      x-zs-$id: ConvertMappingTargetModuleStructure
      description: >-
        Represents the target layout configuration for a module involved in a
        record conversion operation, identifying the layout by its API name and
        display label.
      additionalProperties: false
      properties:
        display_label:
          type: string
          description: >-
            Represents the label of the target module's layout as it appears in
            the CRM interface during record conversion.
          maxLength: 255
          example: Standard
        name:
          type: string
          description: >-
            Represents the unique API name that programmatically identifies the
            target layout within the conversion mapping configuration.
          maxLength: 255
          example: Standard
        id:
          $ref: '#/components/schemas/Id'
          description: Unique identifier of the target layout.
      required:
        - display_label
        - name
        - id
    ConvertMappingTargetModuleWithFields:
      type: object
      x-zs-$id: ConvertMappingTargetModuleWithFieldsStructure
      description: >-
        Represents the target layout configuration for a module involved in a
        record conversion, including field-level mapping details that define how
        source field values are transferred.
      additionalProperties: false
      properties:
        display_label:
          type: string
          description: >-
            Represents the label of the target module's layout as it appears in
            the CRM interface during record conversion. This variant is
            accompanied by field-level mapping details.
          maxLength: 255
          example: Standard
        name:
          type: string
          description: >-
            Represents the unique API name that programmatically identifies the
            target layout within the conversion mapping configuration. This
            variant is accompanied by field-level mapping details.
          maxLength: 255
          example: Standard
        id:
          $ref: '#/components/schemas/Id'
          description: Unique identifier of the target layout.
        fields:
          type: array
          description: >-
            Contains the collection of field configurations belonging to the
            target module's layout that participate in the record conversion
            process, each describing how a specific field is handled during the
            transfer of data.
          maxItems: 100
          items:
            type: object
            description: >-
              Represents a single field entry within the target module's layout,
              capturing the field's label and any constraints that apply when
              transferring record data during conversion.
            additionalProperties: false
            properties:
              api_name:
                $ref: '#/components/schemas/ApiName'
                description: API name of the field in the target module.
              field_label:
                type: string
                description: >-
                  Represents the name of the field as it appears in the CRM
                  interface within the target module's layout during record
                  conversion.
                maxLength: 255
                example: Deal Name
              id:
                $ref: '#/components/schemas/Id'
                description: Unique identifier of the field.
              required:
                type: boolean
                description: >-
                  Indicates whether the field must be populated for the record
                  conversion to proceed successfully. Possible values: `true` —
                  the field is mandatory and a value must be provided before
                  conversion can complete; `false` — the field is optional and
                  may be left unpopulated during conversion.
                example: true
            required:
              - api_name
              - field_label
              - id
              - required
      required:
        - display_label
        - name
        - id
        - fields
    SectionProperties:
      x-zs-$id: SectionPropertiesStructure
      type: object
      description: >-
        Represents the additional configuration properties for subform sections,
        including row-level interaction settings, tooltip configuration, and
        conditional display preferences.
      additionalProperties: false
      properties:
        reorder_rows:
          type: boolean
          description: >-
            Indicates whether users are permitted to reorder existing rows
            within the subform section by dragging them to a new position.
            Possible values: `true` — row reordering is allowed; `false` — rows
            cannot be reordered.
        bulk_addition:
          oneOf:
            - type: object
              x-zs-$id: BulkAdditionObject
              description: >-
                Represents the active bulk addition configuration for a subform
                section, enabling users to add multiple rows simultaneously to
                the subform.
              additionalProperties: false
              properties:
                lookup_field:
                  type: object
                  description: The lookup field used for bulk addition
                  additionalProperties: false
                  properties:
                    api_name:
                      $ref: '#/components/schemas/ApiName'
                    id:
                      $ref: '#/components/schemas/Id'
                    name:
                      type: string
                      description: Display name of the lookup field
                      maxLength: 100
                  required:
                    - api_name
                    - id
                    - name
                subform_fields:
                  oneOf:
                    - type: array
                      x-zs-$id: SubformFieldsArray
                      description: List of subform fields available for bulk addition
                      maxItems: 50
                      items:
                        type: object
                        description: A subform field available for bulk addition
                        additionalProperties: false
                        properties:
                          api_name:
                            $ref: '#/components/schemas/ApiName'
                          id:
                            $ref: '#/components/schemas/Id'
                          name:
                            type: string
                            description: Display name of the subform field
                            maxLength: 100
                        required:
                          - api_name
                          - id
                          - name
                    - $ref: '#/components/schemas/TypeNull'
              required:
                - lookup_field
                - subform_fields
            - type: object
              x-zs-$id: BulkAdditionEmpty
              description: Empty object when bulk addition is not configured
              additionalProperties: false
              maxProperties: 0
            - $ref: '#/components/schemas/TypeNull'
        tooltip:
          oneOf:
            - type: object
              x-zs-$id: SectionTooltipStructure
              description: >-
                Represents the active tooltip configuration for this section,
                specifying the help text and display mechanism shown to users
                when they hover over the section header.
              additionalProperties: false
              properties:
                name:
                  type: string
                  description: >-
                    Indicates the delivery mechanism for the section tooltip,
                    such as whether it is rendered as a static label or as a
                    modal help popup.
                  example: info_icon
                  maxLength: 255
                value:
                  type: string
                  description: >-
                    Contains the help text displayed in the section tooltip,
                    providing contextual guidance about the purpose or use of
                    the section.
                  maxLength: 255
                  example: Enter subform data
              required:
                - name
                - value
            - $ref: '#/components/schemas/TypeNull'
        maximum_rows:
          type: number
          format: int32
          minimum: 1
          description: >-
            Indicates the maximum number of rows that can be added to the
            subform section, controlling how many related records can be
            embedded in a single parent record's layout.
        preference:
          type: array
          description: >-
            Contains the conditional display criteria for the section, defining
            the field conditions that must be satisfied for the section to be
            shown or for certain section behaviors to be applied.
          maxItems: 50
          items:
            type: object
            description: >-
              Represents a single conditional display criterion for the section,
              specifying the field, comparison operator, value type, and
              comparison value used to evaluate whether the condition is met.
            additionalProperties: false
            properties:
              comparator:
                type: string
                description: >-
                  Represents the comparison operator applied when evaluating the
                  section preference criterion, such as equals, contains, or is
                  not null.
                example: not_equal
                maxLength: 50
              field:
                type: object
                description: >-
                  Identifies the field whose value is evaluated against the
                  comparator and preference value to determine whether the
                  section's conditional display condition is met.
                additionalProperties: false
                properties:
                  api_name:
                    $ref: '#/components/schemas/ApiName'
                    description: API name of the field used in the criteria.
                  id:
                    $ref: '#/components/schemas/Id'
                    description: Unique identifier of the field used in the criteria.
                required:
                  - api_name
                  - id
              type:
                type: string
                description: >-
                  Indicates whether the comparison value in the preference
                  criterion is a static literal or a dynamic contextual
                  reference resolved at runtime.
                example: value
                maxLength: 50
              value:
                description: >-
                  Represents the value compared against the selected field when
                  evaluating the section preference criterion, which may be a
                  string, number, or Boolean depending on the field type.
                oneOf:
                  - type: string
                    x-zs-$id: PreferenceValueString
                    description: >-
                      Represents a string value used as the comparison operand
                      in the section preference criterion.
                    maxLength: 255
                    example: ${EMPTY}
                  - type: number
                    x-zs-$id: PreferenceValueNumber
                    description: >-
                      Represents a numeric value used as the comparison operand
                      in the section preference criterion.
                    example: 100
                  - type: boolean
                    x-zs-$id: PreferenceValueBoolean
                    description: >-
                      Represents a Boolean value used as the comparison operand
                      in the section preference criterion.
                    example: true
                  - $ref: '#/components/schemas/TypeNull'
            required:
              - comparator
              - field
              - type
              - value
    FieldSchema:
      type: object
      description: >-
        Represents a comprehensive schema for a CRM field in a module layout,
        encapsulating all field-level configuration including data type, display
        settings, permissions, lookup relationships, formula definitions, and
        audit metadata.
      additionalProperties: false
      properties:
        associated_module:
          description: >-
            Contains the details of the CRM module linked to this field when the
            field represents a subform, identifying the related module and the
            layout governing how its records are embedded and displayed within
            the parent module's layout.
          oneOf:
            - type: object
              x-zs-$id: AssociatedModuleStructure
              description: >-
                Represents the associated module details when this field is a
                subform field, including the module API name and the layout used
                to render the embedded records.
              additionalProperties: false
              properties:
                module:
                  description: API name of the associated module
                  $ref: '#/components/schemas/ModuleName'
                id:
                  description: Unique identifier of the associated module
                  $ref: '#/components/schemas/Id'
                layout:
                  type: object
                  description: >-
                    Represents the name of the layout applied to the associated
                    module's records when displayed within the subform field,
                    determining which set of fields and sections are rendered in
                    the embedded view.
                  additionalProperties: false
                  properties:
                    name:
                      type: string
                      description: >-
                        Represents the name of the layout applied to the
                        associated module's records when displayed within the
                        subform field, determining which set of fields and
                        sections are rendered in the embedded view.
                      minLength: 1
                      maxLength: 100
                    id:
                      description: Unique identifier of the layout
                      $ref: '#/components/schemas/Id'
                  required:
                    - name
                    - id
              required:
                - module
                - id
            - $ref: '#/components/schemas/TypeNull'
        webhook:
          type: boolean
          description: >-
            Indicates whether webhook notifications are triggered when this
            field's value changes on a record. Possible values: `true` — changes
            to this field trigger configured webhook endpoints; `false` — field
            changes do not initiate webhook notifications.
          example: false
        operation_type:
          type: object
          additionalProperties: false
          description: >-
            Represents the set of operations permitted on this field, specifying
            independently whether values can be supplied or modified through
            API-based create/update calls and through the CRM web interface
            create/update forms.
          properties:
            web_update:
              type: boolean
              description: >-
                Indicates whether this field accepts a new value when a record
                is saved through the CRM web interface during an update.
                Possible values: `true` — the field is editable in the web edit
                form; `false` — the field is read-only or hidden in the web
                update form.
              example: false
            api_create:
              type: boolean
              description: >-
                Indicates whether this field accepts a value when a record is
                saved through the API during creation. Possible values: `true` —
                the field value can be set via API during record creation;
                `false` — the field value cannot be set via API at record
                creation time.
              example: false
            web_create:
              type: boolean
              description: >-
                Indicates whether this field appears and accepts a value when a
                record is saved through the CRM web interface during creation.
                Possible values: `true` — the field is editable in the web
                create form; `false` — the field does not appear or is locked in
                the web create form.
              example: false
            api_update:
              type: boolean
              description: >-
                Indicates whether this field accepts a new value when a record
                is saved through the API during an update. Possible values:
                `true` — the field can be modified via API during a record
                update; `false` — the field is read-only for API-based update
                operations.
              example: false
          required:
            - web_update
            - api_create
            - web_create
            - api_update
        colour_code_enabled_by_system:
          type: boolean
          description: >-
            Indicates whether color-code functionality has been activated for
            this field by the system platform rather than by a user or
            administrator. Possible values: `true` — the system has enabled
            color coding for this field; `false` — color coding on this field is
            not system-activated.
          example: false
        field_label:
          type: string
          description: >-
            Represents the label assigned to the field, displayed in forms,
            detail views, and list columns within the module layout.
          example: Last Name
          minLength: 1
          maxLength: 100
        tooltip:
          description: >-
            Represents the tooltip configuration attached to this field,
            defining contextual help text displayed to users when they hover
            over or focus on the field in a record form.
          oneOf:
            - type: object
              x-zs-$id: FieldTooltipStructure
              description: >-
                Represents the active tooltip configuration for this field,
                specifying the help text and delivery mechanism shown to users
                when they interact with the field.
              additionalProperties: false
              properties:
                name:
                  type: string
                  description: >-
                    Indicates the delivery mechanism for the tooltip, such as
                    whether it is rendered as a static label or as a modal help
                    popup.
                  example: info_icon
                  maxLength: 25
                value:
                  type: string
                  description: >-
                    Contains the help text displayed in the tooltip when users
                    interact with this field, providing contextual guidance on
                    the field's purpose or expected input.
                  example: Enter last name
                  maxLength: 255
              required:
                - name
                - value
            - $ref: '#/components/schemas/TypeNull'
        display_format_properties:
          description: >-
            Contains supplementary rendering configuration for field types that
            require additional display directives beyond a simple format string,
            such as phone number dial-code positioning or the orientation and
            layout style of radio button groups.
          oneOf:
            - type: object
              x-zs-$id: DisplayFormatPropertiesStructure
              description: >-
                Represents the active supplementary rendering configuration for
                this field type, such as phone split settings or radio button
                orientation.
              additionalProperties: false
              properties:
                split:
                  type: number
                  description: >-
                    Indicates the formatting pattern applied to split a phone
                    number into its dial-code prefix and local number segments
                    when rendering the field in the UI.
                  example: 3
                  format: int32
                radio_display_type:
                  type: string
                  description: >-
                    Specifies the layout orientation used to render radio button
                    options in the UI, such as arranging choices horizontally in
                    a row or vertically in a stacked column.
                  example: all
                  maxLength: 25
            - $ref: '#/components/schemas/TypeNull'
        type:
          type: string
          description: >-
            Indicates the field's layout usage status, determining whether the
            field appears in layout sections. Possible values: `used` — the
            field is placed in at least one layout section. `unused` — the field
            exists in the module but has no assignment to any section. `all` —
            the field appears regardless of layout placement status.
          enum:
            - all
            - unused
            - used
          example: used
          maxLength: 25
        field_read_only:
          type: boolean
          description: >-
            Indicates whether the field is locked against user edits at the
            field level, independent of profile-based permissions. Possible
            values: `true` — the field value cannot be modified by users;
            `false` — the field is editable subject to applicable profile
            permissions.
          example: false
        customizable_properties:
          description: >-
            Contains the set of field attributes that administrators are
            permitted to modify through the CRM layout editor, such as label,
            required status, or visibility, reflecting which aspects of the
            field definition are not locked by the system.
          oneOf:
            - type: array
              x-zs-$id: CustomizablePropertiesArray
              description: >-
                Represents the list of field attribute names that administrators
                can modify through the layout editor, with unique values only.
              uniqueItems: true
              items:
                type: string
                description: >-
                  Represents the API name of a single field attribute that can
                  be modified by an administrator, identifying a specific
                  configurable aspect of the field such as its label, tooltip,
                  or mandatory setting.
                example: mandatory
                maxLength: 50
              maxItems: 100
            - $ref: '#/components/schemas/TypeNull'
        required:
          type: boolean
          description: >-
            Indicates whether this field must contain a value before a record
            can be saved. Possible values: `true` — the field is mandatory and a
            value must be supplied; `false` — the field is optional.
          example: false
        subform_properties:
          description: >-
            Contains the display configuration settings for this field when it
            appears within a subform section, such as custom column width and
            column pinning behavior.
          oneOf:
            - type: object
              x-zs-$id: SubformPropertiesStructure
              description: >-
                Represents the active subform display configuration for this
                field, specifying column width and pinning behavior when the
                field appears in a subform section.
              additionalProperties: false
              properties:
                custom_width:
                  description: >-
                    Indicates the custom column width in pixels assigned to this
                    field when it is displayed as a column in a subform,
                    overriding the default column sizing.
                  oneOf:
                    - type: integer
                      x-zs-$id: CustomWidthInteger
                      format: int32
                      description: >-
                        Represents the active custom column width in pixels for
                        this field when displayed in a subform section.
                      minimum: 50
                      maximum: 1000
                      example: 265
                    - $ref: '#/components/schemas/TypeNull'
                pinned_column:
                  type: boolean
                  description: >-
                    Indicates whether this field's column is frozen in place
                    when users scroll horizontally through a subform, keeping
                    the field visible regardless of scroll position. Possible
                    values: `true` — the column is pinned; `false` — the column
                    scrolls with the subform.
                  example: false
              required:
                - custom_width
                - pinned_column
            - $ref: '#/components/schemas/TypeNull'
        display_label:
          type: string
          description: >-
            Represents the name of the field displayed in the module layout,
            used as the visible title in forms, list views, and detail pages.
          example: Last Name
          minLength: 1
          maxLength: 100
        allowed_permissions_to_update:
          type: object
          description: >-
            Represents the set of permission levels that can be actively
            assigned to this field across profiles, indicating which visibility
            and access states are eligible for modification. Returned only when
            the query parameter
            `include_inner_details=fields.allowed_permissions_to_update` is
            specified in the request.
          additionalProperties: false
          properties:
            read_write:
              type: boolean
              description: >-
                Indicates whether the read-write permission level is eligible to
                be assigned to this field. Possible values: `true` — the field
                can be configured for full read and write access for specific
                profiles, permitting both viewing and editing; `false` — the
                read-write permission cannot be applied to this field.
              example: true
            hidden:
              type: boolean
              description: >-
                Indicates whether the hidden permission level is eligible to be
                assigned to this field. Possible values: `true` — the field's
                visibility can be set to hidden for specific profiles,
                concealing it entirely from their layout view; `false` — the
                hidden permission cannot be applied to this field.
              example: false
            read_only:
              type: boolean
              description: >-
                Indicates whether the read-only permission level is eligible to
                be assigned to this field. Possible values: `true` — the field
                can be configured as read-only for specific profiles, allowing
                users to view but not edit its value; `false` — the read-only
                permission cannot be applied to this field.
              example: true
          required:
            - read_write
            - hidden
            - read_only
        read_only:
          type: boolean
          description: >-
            Indicates whether this field is locked against user edits through
            the CRM interface and API, preventing any modification of its value
            after it has been set. Possible values: `true` — the field cannot be
            modified; `false` — the field is editable subject to applicable
            permissions.
          example: false
        association_details:
          description: >-
            Contains the relationship metadata for fields connected to other
            records through lookup associations, describing the linked module,
            the nature of the relationship, and any constraints governing how
            related records appear or display.
          oneOf:
            - type: object
              x-zs-$id: AssociationDetailsStructure
              description: >-
                Represents the lookup association details when this field is
                connected to another module through a lookup relationship,
                including the lookup and related field metadata.
              additionalProperties: false
              properties:
                related_field:
                  type: object
                  description: >-
                    Represents the corresponding field on the related module
                    that is linked through the association, containing
                    identifying metadata such as the field's API name and
                    display label.
                  additionalProperties: false
                  properties:
                    api_name:
                      description: API name of the related field
                      $ref: '#/components/schemas/ApiName'
                    id:
                      description: Unique identifier of the related field
                      $ref: '#/components/schemas/Id'
                  required:
                    - api_name
                    - id
                lookup_field:
                  type: object
                  description: >-
                    Represents the lookup field on the source module that
                    establishes the association, containing identifying metadata
                    such as the field's API name and display label.
                  additionalProperties: false
                  properties:
                    api_name:
                      description: API name of the lookup field
                      $ref: '#/components/schemas/ApiName'
                    id:
                      description: Unique identifier of the lookup field
                      $ref: '#/components/schemas/Id'
                  required:
                    - api_name
                    - id
              required:
                - related_field
                - lookup_field
            - $ref: '#/components/schemas/TypeNull'
        businesscard_supported:
          type: boolean
          description: >-
            Indicates whether the field is eligible to appear on the business
            card view, which surfaces key record details in compact preview
            panels across Zoho CRM. Possible values: `true` — the field can be
            included in the business card layout; `false` — the field is
            excluded from business card display.
          example: false
        sharing_properties:
          type: object
          description: >-
            Contains the sharing configuration for this field, defining how its
            value participates in record-level sharing rules and whether
            specific sharing preferences are active.
          additionalProperties: false
          properties:
            scheduler_status:
              oneOf:
                - type: string
                  x-zs-$id: SchedulerStatusStringStructure
                  description: >-
                    Represents the active status of the sharing scheduler for
                    this field, indicating the current state of sharing rule
                    propagation.
                  example: enabled
                  maxLength: 50
                - $ref: '#/components/schemas/TypeNull'
            share_permission:
              type: string
              description: >-
                Represents the sharing access level assigned to this field,
                controlling whether users who receive shared record access can
                read, edit, or are restricted from this field's value.
              example: read_write
              maxLength: 50
            share_preference_enabled:
              type: boolean
              description: >-
                Indicates whether the sharing preference configuration is active
                for this field. Possible values: `true` — sharing preference
                settings are applied to this field; `false` — sharing preference
                is not enabled.
              example: true
            share_with_superiors:
              type: boolean
              description: >-
                Indicates whether this field's value is shared with users in
                superior roles in the CRM role hierarchy when record sharing
                propagates upward. Possible values: `true` — the field is shared
                with superior role users; `false` — the field is not shared with
                superiors.
              example: false
          required:
            - scheduler_status
            - share_permission
            - share_preference_enabled
        multi_module_lookup:
          description: >-
            Represents the multi-module lookup configuration for fields that can
            reference records from more than one CRM module within a single
            lookup relationship, including the participating modules and dynamic
            addition settings.
          oneOf:
            - type: object
              x-zs-$id: MultiModuleLookupStructure
              description: >-
                Represents the active multi-module lookup configuration,
                specifying the participating modules, display label, and dynamic
                addition settings.
              additionalProperties: false
              properties:
                display_label:
                  type: string
                  description: >-
                    Represents the identifying label of the multi-module lookup
                    field in the CRM interface, identifying the lookup
                    relationship across its participating modules.
                  example: Appointments
                  maxLength: 50
                api_name:
                  description: API name of the multi module lookup field
                  $ref: '#/components/schemas/ApiName'
                modules:
                  type: array
                  description: >-
                    Contains the collection of CRM modules that participate in
                    this multi-module lookup relationship, each representing a
                    valid source from which the user can select a referenced
                    record.
                  items:
                    type: object
                    description: >-
                      Represents a single module entry included in the
                      multi-module lookup configuration, encapsulating
                      identifying and display attributes for that module.
                    additionalProperties: false
                    properties:
                      api_name:
                        description: API name of the module
                        $ref: '#/components/schemas/ApiName'
                      module_name:
                        type: string
                        description: >-
                          Indicates the internal API name of the module
                          participating in the multi-module lookup, used to
                          identify the module programmatically across CRM
                          operations.
                        example: Leads
                        maxLength: 50
                      id:
                        description: Unique identifier of the module
                        $ref: '#/components/schemas/Id'
                    required:
                      - api_name
                      - module_name
                      - id
                  maxItems: 100
                dynamic_module_addition_allowed:
                  type: boolean
                  description: >-
                    Indicates whether additional CRM modules can be incorporated
                    into this multi-module lookup relationship at runtime
                    without requiring a layout reconfiguration. Possible values:
                    `true` — new modules may be added dynamically; `false` — the
                    participating modules are fixed at configuration time.
                  example: true
            - $ref: '#/components/schemas/TypeNull'
        id:
          description: Unique identifier of the field
          $ref: '#/components/schemas/Id'
        created_time:
          description: >-
            Represents the date and time at which the field definition was first
            created in the CRM, recorded for audit and chronological tracking
            purposes.
          oneOf:
            - type: string
              x-zs-$id: CreatedTimeDateTime
              description: >-
                Represents the ISO 8601 datetime with timezone offset recording
                when this field definition was first created in the CRM.
              example: '2024-05-17T09:15:56+05:30'
              format: date-time
            - $ref: '#/components/schemas/TypeNull'
        filterable:
          type: boolean
          description: >-
            Indicates whether the field can be used as a filter criterion in
            record search, list view filtering, and report conditions. Possible
            values: `true` — the field is available as a filter option; `false`
            — the field cannot be used for filtering.
          example: true
        visible:
          type: boolean
          description: >-
            Indicates whether this field is currently displayed in the module
            layout. Possible values: `true` — the field is shown in the layout
            and visible to users with appropriate permissions; `false` — the
            field is hidden from the layout.
          example: true
        mask_details:
          description: >-
            Represents the field masking configuration that controls how the
            field's stored value is partially or fully hidden from users who do
            not have permission to view sensitive data, including rules for how
            many characters are revealed and which profiles can bypass masking.
          oneOf:
            - type: object
              x-zs-$id: PartialMaskDetails
              title: Partial Mask
              description: >-
                Represents the partial masking configuration where a specified
                number of characters at the beginning and end of the field value
                are revealed while the middle portion is masked.
              additionalProperties: false
              properties:
                show_first:
                  type: integer
                  format: int32
                  description: >-
                    Indicates the number of characters revealed at the start of
                    the field value when partial masking is applied, allowing a
                    prefix of the data to remain visible while the remainder is
                    hidden.
                  minimum: 0
                  maximum: 50
                  example: 3
                complete_mask:
                  type: boolean
                  description: >-
                    Indicates whether the entire field value is hidden from
                    unauthorized users rather than partially revealed. Possible
                    values: `true` — the value is completely obscured; `false` —
                    partial character reveal rules defined by show_first and
                    show_last apply.
                  example: false
                show_last:
                  type: integer
                  format: int32
                  description: >-
                    Indicates the number of characters revealed at the end of
                    the field value when partial masking is applied, allowing a
                    suffix of the data to remain visible while the preceding
                    portion is hidden.
                  minimum: 0
                  maximum: 50
                  example: 1
                profiles:
                  type: array
                  description: >-
                    Contains the list of CRM profiles whose members are
                    permitted to view the unmasked field value, exempting those
                    users from the masking rules applied to all other profiles.
                  maxItems: 50
                  items:
                    $ref: '#/components/schemas/MaskDetailsProfile'
              required:
                - show_first
                - complete_mask
                - show_last
                - profiles
            - type: object
              x-zs-$id: CompleteMaskDetails
              title: Complete Mask
              description: >-
                Represents the complete masking configuration where the entire
                field value is hidden from users who do not have an exempted
                profile.
              additionalProperties: false
              properties:
                complete_mask:
                  type: boolean
                  description: >-
                    Indicates whether the entire field value is hidden in this
                    alternate masking schema variant. Possible values: `true` —
                    the value is completely obscured; `false` — partial reveal
                    rules apply.
                  example: true
                profiles:
                  type: array
                  description: >-
                    Contains the list of CRM profiles whose members can view the
                    unmasked field value in this alternate masking schema
                    variant, exempting those users from the masking rules
                    applied to all other profiles.
                  maxItems: 50
                  items:
                    $ref: '#/components/schemas/MaskDetailsProfile'
              required:
                - complete_mask
                - profiles
            - $ref: '#/components/schemas/TypeNull'
        refer_from_field:
          description: >-
            Represents the source field from which this mirror or derived field
            obtains its value, establishing a read-through relationship where
            the field reflects data from another field in a related module.
          oneOf:
            - type: object
              x-zs-$id: ReferFromFieldStructure
              description: >-
                Represents the active reference field configuration for a mirror
                field, identifying the source lookup field from which this
                field's value is derived.
              additionalProperties: false
              properties:
                api_name:
                  description: API name of the reference field
                  $ref: '#/components/schemas/ApiName'
                id:
                  description: Unique identifier of the reference field
                  $ref: '#/components/schemas/Id'
            - $ref: '#/components/schemas/TypeNull'
        portal_user_types:
          type: array
          description: >-
            Contains the list of portal user type permission configurations for
            this field, specifying which portal user type categories can view or
            edit the field's value when accessing records through a customer or
            partner portal.
          maxItems: 50
          items:
            type: object
            description: >-
              Represents the permission configuration for a single portal user
              type, defining the level of access that users of that type have to
              this field when interacting through the portal.
            additionalProperties: false
            properties:
              permission_type:
                type: string
                description: >-
                  Represents the access level granted to portal users of this
                  type for the field. Possible values: `read_write` — full read
                  and write access; portal users can view and edit the field.
                  `read_only` — view access only; portal users can see but
                  cannot modify the field value. `hidden` — the field is not
                  visible to portal users of this type.
                enum:
                  - read_write
                  - read_only
                  - hidden
                example: read_write
              name:
                type: string
                description: >-
                  Represents the name of the portal user type, identifying the
                  category of external users whose field permissions are
                  described in this entry.
                maxLength: 255
                example: Customer Portal
              id:
                $ref: '#/components/schemas/Id'
                description: Unique identifier of the portal user type
            required:
              - permission_type
              - name
              - id
        profiles:
          type: array
          description: >-
            Contains the list of profile-level permission entries for this
            field, each describing the access level a specific CRM profile has
            to view or edit the field's value.
          uniqueItems: true
          items:
            type: object
            description: >-
              Represents the permission assignment for a single CRM profile,
              specifying whether users of that profile can view, edit, or are
              restricted from accessing this field.
            additionalProperties: false
            properties:
              permission_type:
                type: string
                description: >-
                  Represents the level of access granted to users of this
                  profile for the field. Possible values: `read_write` — full
                  read and write access; users can view and edit the field.
                  `read_only` — view access only; users can see but cannot
                  modify the field value. `hidden` — the field is not visible to
                  users of this profile.
                enum:
                  - read_write
                  - read_only
                  - hidden
                example: read_write
                maxLength: 25
              name:
                type: string
                description: >-
                  Represents the name of the CRM profile for which this field
                  permission entry applies.
                maxLength: 60
                example: Administrator
              id:
                description: Unique identifier of the profile
                $ref: '#/components/schemas/Id'
            required:
              - permission_type
              - name
              - id
          maxItems: 100
        view_type:
          type: object
          description: >-
            Represents the view-mode availability settings for this field,
            specifying in which CRM interaction contexts — such as record
            creation, editing, viewing, or quick-create — the field is shown or
            editable.
          additionalProperties: false
          properties:
            view:
              type: boolean
              description: >-
                Indicates whether this field is visible when a record is viewed
                in detail mode. Possible values: `true` — the field is displayed
                on the record detail page; `false` — the field is hidden from
                the detail view.
              example: true
            edit:
              type: boolean
              description: >-
                Indicates whether this field is presented and editable in the
                record edit form. Possible values: `true` — the field is shown
                in edit mode; `false` — the field is hidden or read-only during
                editing.
              example: true
            quick_create:
              type: boolean
              description: >-
                Indicates whether this field is included in the abbreviated
                quick-create form. Possible values: `true` — the field appears
                in the quick-create panel; `false` — the field is excluded from
                quick-create.
              example: true
            create:
              type: boolean
              description: >-
                Indicates whether this field is presented in the record creation
                form. Possible values: `true` — the field is shown when creating
                a new record; `false` — the field does not appear in the create
                form.
              example: true
          required:
            - view
            - edit
            - quick_create
            - create
        subform:
          description: >-
            Represents the subform configuration for fields that embed a related
            module's records inline within the parent module's layout, including
            the API name of the associated subform module and its subform tab
            identifier.
          oneOf:
            - type: object
              x-zs-$id: SubformStructure
              description: >-
                Represents the active subform reference configuration for this
                field, including the API name of the associated subform module
                and any layout reference for embedded record rendering.
              additionalProperties: false
              properties:
                module:
                  type: string
                  description: >-
                    Represents the API name of the module whose records are
                    embedded as a subform in the parent module's layout.
                  maxLength: 50
                  example: Ordered_Items
                id:
                  $ref: '#/components/schemas/Id'
                  description: Unique identifier of the subform tab.
              required:
                - module
                - id
            - $ref: '#/components/schemas/TypeNull'
        separator:
          type: boolean
          description: >-
            Indicates whether this field functions as a visual separator element
            in the layout rather than a data-entry field. Possible values:
            `true` — the element is a layout separator that creates a visual
            break between sections or field groups; `false` — the element is a
            standard data field.
          example: false
        searchable:
          type: boolean
          description: >-
            Indicates whether this field's value can be used as a search term in
            the CRM's global and module-level search functionality. Possible
            values: `true` — the field is indexed for search and returns results
            when matched; `false` — the field is excluded from search indexing.
          example: true
        history_tracking_enabled:
          type: boolean
          description: >-
            Indicates whether change history recording is active for this field,
            controlling whether updates to the field's value are logged in the
            audit trail. Possible values: `true` — field value changes are
            captured and retained in history tracking; `false` — changes to this
            field are not recorded in the audit trail.
          example: false
        show_type:
          type: number
          format: int32
          description: >-
            Represents the internal numeric code that controls the display
            behavior or rendering mode of the field in the CRM UI, supplementing
            the data_type classification with additional display context.
          example: 1
        external:
          description: >-
            Contains the integration configuration for fields that receive or
            expose values through external systems, such as third-party
            connectors or Zoho marketplace extensions.
          oneOf:
            - $ref: '#/components/schemas/TypeNull'
        api_name:
          description: API identifier for the field
          $ref: '#/components/schemas/ApiName'
        parent_field:
          description: >-
            Represents the parent field reference for nested or composite fields
            such as address components, identifying the field under which this
            field is grouped in the module layout.
          oneOf:
            - type: object
              x-zs-$id: ParentFieldStructure
              description: >-
                Represents the parent field reference for nested composite
                fields such as address child components, identifying the parent
                field by its API name.
              additionalProperties: false
              properties:
                api_name:
                  description: API name of the parent field
                  $ref: '#/components/schemas/ApiName'
                name:
                  type: string
                  description: >-
                    Represents the API name of the parent field under which this
                    nested field is organized within the module layout.
                  example: Address 1 - Coordinates
                  maxLength: 50
                id:
                  description: Unique identifier of the parent field
                  $ref: '#/components/schemas/Id'
              required:
                - api_name
                - name
                - id
            - $ref: '#/components/schemas/TypeNull'
        unique:
          type: object
          description: >-
            Represents the uniqueness constraint configuration for this field,
            controlling whether duplicate values are permitted across records in
            the module and whether the check is case-sensitive.
          additionalProperties: false
          properties:
            case_sensitive:
              type: boolean
              description: >-
                Indicates whether the field's uniqueness constraint treats
                values differing only in letter case as distinct. Possible
                values: `true` — case-sensitive comparison is applied and values
                with different casing are treated as unique; `false` — the
                uniqueness check is case-insensitive.
              example: false
        enable_colour_code:
          type: boolean
          description: >-
            Indicates whether color coding is currently active for this field,
            allowing field values to be visually differentiated by color in list
            views and kanban boards. Possible values: `true` — color coding is
            enabled for the field; `false` — color coding is not active.
          example: false
        child_fields:
          description: >-
            Contains the ordered collection of sub-fields that compose a
            composite field, such as the individual address components (street,
            city, state, country, zip) grouped under a single parent field.
          oneOf:
            - type: array
              x-zs-$id: ChildFieldsArray
              description: >-
                Represents the ordered list of child field entries for a
                composite field such as an address field, each associating a
                sub-field's identity with its display sequence.
              items:
                type: object
                description: >-
                  Represents a single sub-field entry within a composite field,
                  bundling the field's identity and its display position
                  relative to sibling sub-fields.
                additionalProperties: false
                properties:
                  sequence_number:
                    type: number
                    description: >-
                      Indicates the ordinal position of the child field within
                      the composite field, determining the rendering order of
                      sub-fields in the layout UI.
                    example: 1
                    format: int32
                    minimum: 1
                  field:
                    type: object
                    description: >-
                      Contains the identifying attributes of the child field,
                      such as its API name, used to reference the corresponding
                      FieldSchema within the module layout.
                    additionalProperties: false
                    properties:
                      api_name:
                        description: API name of the child field
                        $ref: '#/components/schemas/ApiName'
                      name:
                        type: string
                        description: >-
                          Represents the API name of the child field, used to
                          uniquely identify it within the parent composite field
                          and reference it in layout and data operations.
                        example: Address 1 - City
                        maxLength: 100
                      id:
                        description: Unique identifier of the child field
                        $ref: '#/components/schemas/Id'
                    required:
                      - api_name
                      - name
                      - id
                required:
                  - sequence_number
                  - field
              maxItems: 100
            - $ref: '#/components/schemas/TypeNull'
        pick_list_values:
          description: >-
            Contains the list of selectable options defined for a picklist
            field, each representing a distinct choice that users can select
            when populating the field on a record.
          oneOf:
            - type: array
              x-zs-$id: PickListValuesArray
              description: >-
                Represents the active list of picklist options for this field,
                ordered by sequence number, each containing the stored value,
                display label, and associated metadata.
              items:
                type: object
                description: >-
                  Represents a single picklist option, encapsulating the stored
                  value, the display label, and any associated metadata such as
                  color coding, deal category, or forecast information.
                additionalProperties: false
                properties:
                  display_value:
                    type: string
                    description: >-
                      Represents the label displayed to users for this picklist
                      option in forms, detail views, and filter dropdowns, which
                      may be a localized version of the stored actual value.
                    example: Option 1
                    maxLength: 120
                  sequence_number:
                    type: number
                    description: >-
                      Indicates the ordinal position of this picklist option
                      within the field's list of available choices, determining
                      the display order in dropdown menus and filter panels.
                    example: 1
                    format: int32
                    minimum: 1
                  record_category_value:
                    type: object
                    description: >-
                      Reference to an existing record category value mapped to
                      this picklist option. **At least one identifier must be
                      provided**: `id`, `rid`, or `api_name`. Multiple
                      identifiers can be provided for validation purposes.
                      Server-side validation enforces this requirement.
                    properties:
                      id:
                        type: string
                        format: int64
                        description: Unique identifier of the record category value
                      api_name:
                        type: string
                        description: API name of the record category value
                        maxLength: 255
                    additionalProperties: false
                  deal_category:
                    type: string
                    description: >-
                      Represents the deal pipeline category classification
                      associated with this picklist option, used to group and
                      report on deals by their stage category.
                    example: Open
                    maxLength: 100
                  reference_value:
                    type: string
                    description: >-
                      Represents the system-internal reference identifier for
                      this picklist option, used in cross-field mapping and
                      dependent picklist resolution where the display value
                      alone is insufficient to uniquely identify the option.
                    example: option_1
                    maxLength: 120
                  maps:
                    type: array
                    description: >-
                      Contains the dependent picklist mapping configuration for
                      this option, defining which values become available in
                      dependent fields when this option is selected in the
                      parent picklist.
                    maxItems: 4000
                    items:
                      type: object
                      description: >-
                        Represents a single dependent field mapping entry,
                        associating this parent picklist option with a specific
                        set of allowed values in a dependent picklist field.
                      additionalProperties: false
                      properties:
                        api_name:
                          $ref: '#/components/schemas/ApiName'
                          description: API name of the dependent picklist field.
                        id:
                          $ref: '#/components/schemas/Id'
                          description: Unique identifier of the dependent picklist field.
                        pick_list_values:
                          type: array
                          description: >-
                            Contains the subset of picklist values available in
                            the dependent field when this parent option is
                            selected, restricting user choices to contextually
                            appropriate options.
                          maxItems: 500
                          items:
                            type: object
                            description: >-
                              Represents a single allowed value entry in the
                              dependent picklist, defining one option that
                              becomes selectable in the dependent field when the
                              parent picklist option is chosen.
                            additionalProperties: false
                            properties:
                              display_value:
                                type: string
                                description: >-
                                  Represents the label displayed in the CRM
                                  interface for this dependent picklist option,
                                  which may differ from its stored actual value.
                                maxLength: 120
                                example: Option 1
                              colour_code:
                                description: >-
                                  Represents the hexadecimal color code
                                  associated with this dependent picklist
                                  option, used to color-code records by their
                                  selected value when color coding is enabled
                                  for the field.
                                oneOf:
                                  - type: string
                                    x-zs-$id: DependentPicklistColorCode
                                    description: >-
                                      Represents the hexadecimal color code in
                                      #RRGGBB format for this dependent picklist
                                      option when color coding is active.
                                    pattern: ^#[0-9A-Fa-f]{6}$
                                    minLength: 7
                                    maxLength: 7
                                    example: '#c9651a'
                                  - $ref: '#/components/schemas/TypeNull'
                              actual_value:
                                type: string
                                description: >-
                                  Represents the internal value stored when this
                                  dependent picklist option is selected, used as
                                  the system identifier for the choice in data
                                  storage and API responses.
                                maxLength: 120
                                example: Option 1
                              id:
                                $ref: '#/components/schemas/Id'
                                description: Unique identifier of the picklist value.
                            required:
                              - display_value
                              - colour_code
                              - actual_value
                              - id
                      required:
                        - api_name
                        - id
                        - pick_list_values
                  colour_code:
                    description: >-
                      Represents the color associated with this picklist option
                      when color-coded list views are enabled for the field,
                      used to visually distinguish records by their selected
                      value.
                    oneOf:
                      - type: string
                        x-zs-$id: HexColorCode
                        description: >-
                          Represents the hexadecimal color code in #RRGGBB
                          format associated with this picklist option when color
                          coding is active.
                        example: '#FF5733'
                        pattern: ^#[0-9A-Fa-f]{6}$
                        minLength: 7
                        maxLength: 7
                      - $ref: '#/components/schemas/TypeNull'
                  probability:
                    type: number
                    description: >-
                      Represents the percentage probability of deal closure
                      associated with this picklist option, used in forecast
                      calculations and reporting for deal stage fields.
                    example: 10
                    format: int32
                    minimum: 0
                    maximum: 100
                  forecast_category:
                    type: object
                    description: >-
                      Represents the sales forecast classification associated
                      with this picklist option, grouping deals in a given stage
                      into a defined forecast bucket such as Pipeline, Best
                      Case, or Closed Won.
                    additionalProperties: false
                    properties:
                      name:
                        type: string
                        description: >-
                          Represents the name of the forecast category assigned
                          to this picklist option, identifying the forecast
                          bucket to which deals at this stage are attributed.
                        maxLength: 100
                      id:
                        description: Unique identifier of the forecast category
                        $ref: '#/components/schemas/Id'
                  actual_value:
                    type: string
                    description: >-
                      Represents the internal value stored in the database when
                      this picklist option is selected, which may differ from
                      the label displayed to the user.
                    example: Option 1
                    maxLength: 120
                  id:
                    description: Unique identifier of the pick list value
                    $ref: '#/components/schemas/Id'
                  forecast_type:
                    type: string
                    description: >-
                      Indicates the type of forecast behavior associated with
                      this picklist option, classifying how deals at this stage
                      are treated in forecast calculations.
                    example: Open
                    maxLength: 50
                  type:
                    type: string
                    description: >-
                      Represents the classification type of this picklist
                      option, distinguishing system-defined choices from
                      user-created ones or categorizing options by their
                      behavioral role within the field.
                    example: used
                    maxLength: 50
                required:
                  - display_value
                  - sequence_number
                  - maps
                  - actual_value
              maxItems: 4000
            - $ref: '#/components/schemas/TypeNull'
        system_mandatory:
          type: boolean
          description: >-
            Indicates whether this field is enforced as mandatory by the CRM
            system itself, as opposed to being made required through an
            administrator's layout configuration. Possible values: `true` — the
            field is system-level mandatory and cannot be made optional; `false`
            — the mandatory status is controlled by layout configuration.
          example: false
        private:
          oneOf:
            - type: object
              x-zs-$id: PrivateFieldStructure
              description: >-
                Represents the active privacy configuration for this field,
                specifying the access restriction type and export suppression
                settings when the field is marked as private.
              properties:
                restricted:
                  type: boolean
                  description: >-
                    Indicates whether this field is subject to privacy
                    restrictions that limit its visibility to the record owner
                    and administrators. Possible values: `true` — access to the
                    field value is restricted based on record ownership; `false`
                    — the field is accessible to all users with the appropriate
                    module permissions.
                  example: false
                type:
                  type: string
                  description: >-
                    Represents the privacy restriction level applied to this
                    field. Possible values: `High` — high-level privacy
                    restriction with strict access control. `Low` — low-level
                    privacy restriction with relaxed access control.
                  enum:
                    - High
                    - Low
                  example: High
                  maxLength: 25
                export:
                  type: boolean
                  description: >-
                    Indicates whether this field's value is included when
                    records are exported from the CRM, subject to the field's
                    privacy settings. Possible values: `true` — the field is
                    included in exports; `false` — the field is excluded from
                    exported data.
                  example: false
              required:
                - restricted
                - type
                - export
              additionalProperties: false
            - $ref: '#/components/schemas/TypeNull'
        virtual_field:
          type: boolean
          description: >-
            Indicates whether this field is a computed or transient field that
            exists only at the API layer and does not map to a persistent
            database column. Possible values: `true` — the field is virtual and
            its value is derived at runtime; `false` — the field is backed by a
            database column.
          example: false
        json_type:
          type: string
          description: >-
            Represents the primitive JSON data type used to serialize this
            field's value in API request and response payloads. Possible values:
            `string` — a text value. `integer` — a whole number. `boolean` — a
            true or false value. `double` — a decimal number. `long` — a large
            integer. `jsonobject` — a structured object. `jsonarray` — an array
            of values.
          enum:
            - jsonarray
            - integer
            - string
            - jsonobject
            - boolean
            - double
            - long
          example: string
          maxLength: 25
        crypt:
          description: >-
            Contains the encryption settings applied to this field, specifying
            how sensitive data stored in the field is protected at rest within
            the CRM platform.
          oneOf:
            - $ref: '#/components/schemas/TypeNull'
        range:
          description: >-
            Represents the numeric range constraint applied to this field,
            specifying the minimum and maximum values that the field accepts
            when a record is saved.
          oneOf:
            - type: object
              x-zs-$id: NumericRangeStructure
              description: >-
                Represents the active numeric range constraint for this field,
                specifying the minimum and maximum allowed values.
              additionalProperties: false
              properties:
                from:
                  oneOf:
                    - type: number
                      x-zs-$id: RangeFromDoubleStructure
                      description: >-
                        Represents the lower bound of the numeric range
                        constraint, defining the minimum value the field
                        accepts.
                      example: 1
                      format: double
                    - $ref: '#/components/schemas/TypeNull'
                to:
                  oneOf:
                    - type: number
                      x-zs-$id: RangeToDoubleStructure
                      description: >-
                        Represents the upper bound of the numeric range
                        constraint, defining the maximum value the field
                        accepts.
                      example: 100
                      format: double
                    - $ref: '#/components/schemas/TypeNull'
              required:
                - from
                - to
            - $ref: '#/components/schemas/TypeNull'
        created_source:
          type: string
          description: >-
            Indicates the origin channel through which this field originates in
            the module. Possible values: `default` — the field is part of the
            standard CRM module definition; `extension` — the field was added
            through a CRM extension or plug-in package; `integration` — the
            field was provisioned via a third-party integration.
          enum:
            - ''
            - default
            - extension
            - integration
          example: default
          maxLength: 60
        display_type:
          type: number
          description: >-
            Indicates the internal numeric code that controls how the field is
            rendered in the CRM UI, mapping to predefined display modes such as
            text box, drop-down, or date picker.
          example: 1
          format: int32
        ui_type:
          type: number
          description: >-
            Represents the internal numeric code that identifies the UI
            component type used to render and interact with this field in the
            CRM interface, such as a text input, date picker, or reference
            selector.
          example: 1
          format: int32
        validation_rule:
          description: >-
            Represents the Validation Rule configuration applied to this field,
            referencing the rule that governs acceptable input formats, value
            ranges, or logical conditions evaluated when a record is saved.
          oneOf:
            - type: object
              x-zs-$id: ValidationRuleStructure
              description: >-
                Represents the active Validation Rule reference applied to this
                field, identifying the rule used to enforce input constraints
                when a record is saved.
              additionalProperties: false
              properties:
                id:
                  $ref: '#/components/schemas/Id'
                  description: >-
                    Unique identifier of the validation rule applied to this
                    field.
              required:
                - id
            - $ref: '#/components/schemas/TypeNull'
        modified_time:
          description: >-
            Represents the date and time at which the field's definition or
            configuration was most recently changed in the CRM, recorded for
            audit and change-tracking purposes.
          oneOf:
            - type: string
              x-zs-$id: ModifiedTimeDateTime
              description: >-
                Represents the ISO 8601 datetime with timezone offset recording
                when this field's configuration was most recently changed.
              example: '2024-05-17T09:15:56+05:30'
              format: date-time
            - $ref: '#/components/schemas/TypeNull'
        file_upolad_optionlist:
          description: >-
            Contains the list of permitted file source options for file-upload
            fields, defining where users may select files from when populating
            the field.
          oneOf:
            - type: array
              x-zs-$id: FileUploadOptionListArray
              description: >-
                Represents the list of permitted file upload source options
                available for this field, each identifying an upload channel by
                its display label and internal value.
              maxItems: 20
              items:
                type: object
                description: >-
                  Represents a single permitted file source entry, identifying
                  an upload channel such as local device storage, cloud drive,
                  or URL by its display label and internal value.
                additionalProperties: false
                properties:
                  display_value:
                    type: string
                    description: >-
                      Represents the label shown in the CRM interface for the
                      file upload source option, communicating the upload
                      channel name to the end user.
                    maxLength: 100
                    example: Upload File
                  actual_value:
                    type: string
                    description: >-
                      Represents the system-level identifier for the file upload
                      source, used internally to route the upload request to the
                      correct provider.
                    maxLength: 100
                    example: Upload File
                required:
                  - display_value
                  - actual_value
            - $ref: '#/components/schemas/TypeNull'
        public:
          type: boolean
          description: >-
            Indicates whether this field's value is accessible to external users
            or public-facing integrations. Possible values: `true` — the field
            is marked as public and may be exposed through portals or external
            APIs; `false` — the field is restricted to internal CRM users.
          example: true
        section_id:
          type: number
          format: int32
          description: >-
            Indicates the numeric identifier of the section within the module
            layout that contains this field, used to group fields and determine
            their organizational placement on record forms.
        static_values:
          description: >-
            Contains the predefined option list for fields with a fixed set of
            choices, such as static picklists and radio button fields, where the
            available values are defined at layout configuration time.
          oneOf:
            - type: array
              x-zs-$id: StaticValuesArray
              description: >-
                Represents the active list of static value options available for
                this field, each containing a sequence number and stored value.
              maxItems: 500
              items:
                type: object
                description: >-
                  Represents a single option within the field's static value
                  list, encapsulating the option's display order and the stored
                  value associated with that choice.
                additionalProperties: false
                properties:
                  sequence_number:
                    type: integer
                    format: int32
                    description: >-
                      Indicates the display order of this static option within
                      the field's predefined choice list, determining the
                      position in which the option appears to users.
                    minimum: 1
                    example: 1
                  id:
                    $ref: '#/components/schemas/Id'
                    description: Unique identifier of the static value option.
                  value:
                    type: string
                    description: >-
                      Represents the stored value for this static option, used
                      as the system identifier and the data written to the
                      record when the option is selected.
                    maxLength: 255
                    example: Option 1
                required:
                  - sequence_number
                  - id
                  - value
            - $ref: '#/components/schemas/TypeNull'
        currency:
          description: >-
            Contains the currency-specific display and calculation settings for
            the field, including the number of decimal places to retain and the
            rounding strategy applied when storing or presenting monetary
            values.
          oneOf:
            - type: object
              x-zs-$id: CurrencyFieldConfigurationStructure
              description: >-
                Represents the active currency configuration for this field,
                specifying the decimal precision and rounding rule applied when
                storing and displaying monetary values.
              additionalProperties: false
              properties:
                rounding_option:
                  type: string
                  description: >-
                    Specifies the rounding rule applied to currency values when
                    the raw amount exceeds the configured precision. Possible
                    values: `round_up` — always rounds the value up.
                    `round_down` — always rounds the value down. `round_off` —
                    rounds to the nearest value. `normal` — no rounding applied.
                  enum:
                    - round_up
                    - round_down
                    - round_off
                    - normal
                  example: round_off
                  maxLength: 25
                precision:
                  type: number
                  description: >-
                    Indicates the number of decimal places retained when storing
                    and displaying currency values for this field, controlling
                    the granularity of monetary amounts.
                  format: int32
                  example: 2
            - $ref: '#/components/schemas/TypeNull'
        multiuserlookup:
          type: object
          description: >-
            Represents the configuration of a multi-user lookup field, which
            enables associating a record with multiple CRM users through a
            linking module rather than a single user reference.
          properties:
            linking_details:
              type: object
              description: >-
                Contains the configuration of the linking module and its lookup
                fields that connect the source module to multiple CRM users in a
                multi-user lookup relationship.
              properties:
                module:
                  type: object
                  description: >-
                    Represents the linking module that intermediates the
                    connection between the source module and the Users module in
                    a multi-user lookup relationship.
                  properties:
                    plural_label:
                      type: string
                      description: >-
                        Contains the plural display name of the linking module
                        used in the multi-user lookup, as shown in navigation
                        and relational panels within the CRM.
                      example: Users
                      maxLength: 100
                    api_name:
                      $ref: '#/components/schemas/ApiName'
                    id:
                      $ref: '#/components/schemas/Id'
                  required:
                    - plural_label
                    - api_name
                    - id
                  additionalProperties: false
                lookup_field:
                  type: object
                  description: >-
                    Represents the lookup field on the linking module that
                    references the source module, establishing the origin side
                    of the multi-user lookup relationship.
                  properties:
                    api_name:
                      $ref: '#/components/schemas/ApiName'
                    field_label:
                      type: string
                      description: >-
                        Contains the display label of the lookup field on the
                        linking module that references the source module, as
                        presented in the CRM interface.
                      example: User Name
                      maxLength: 100
                    id:
                      $ref: '#/components/schemas/Id'
                  required:
                    - api_name
                    - field_label
                    - id
                  additionalProperties: false
                connected_lookup_field:
                  type: object
                  description: >-
                    Represents the lookup field on the linking module that
                    references the Users module, forming the user-side join in
                    the multi-user lookup relationship.
                  properties:
                    api_name:
                      $ref: '#/components/schemas/ApiName'
                    field_label:
                      type: string
                      description: >-
                        Contains the display label of the lookup field on the
                        linking module that points to the Users module, as
                        presented in the CRM interface.
                      example: Role Name
                      maxLength: 100
                    id:
                      $ref: '#/components/schemas/Id'
                  required:
                    - api_name
                    - field_label
                    - id
                  additionalProperties: false
              required:
                - module
                - lookup_field
                - connected_lookup_field
              additionalProperties: false
            record_access:
              type: boolean
              description: >-
                Indicates whether the multi-user lookup grants the associated
                users access to the record being linked, in addition to
                recording the relationship. Possible values: `true` — linked
                users gain record-level access; `false` — the relationship is
                recorded without affecting the users' access to the record.
              example: true
          required:
            - linking_details
            - record_access
          additionalProperties: false
        global_map_dependency:
          description: >-
            Represents the global map dependency linked to this field, which
            governs how the field's available values or behavior are influenced
            by a shared mapping configuration defined at the organization level.
            Contains identifying metadata for the associated global map
            dependency, or is absent when no such dependency applies.
          oneOf:
            - type: object
              x-zs-$id: GlobalMapDependencyStructure
              description: >-
                Represents the active global map dependency configuration
                linking this field to a shared organizational mapping
                definition.
              additionalProperties: false
              properties:
                id:
                  $ref: '#/components/schemas/Id'
                  description: Unique identifier of the global map dependency.
              required:
                - id
            - $ref: '#/components/schemas/TypeNull'
        custom_field:
          type: boolean
          description: >-
            Indicates whether this field was defined by an administrator or
            developer beyond the standard module schema, rather than being a
            built-in system field. Possible values: `true` — the field is
            user-created and does not belong to the default module definition;
            `false` — the field is a standard, system-defined field.
          example: true
        lookup:
          description: >-
            Represents the lookup configuration that links this field to records
            in another CRM module, encapsulating the target module reference,
            the field's API name and display label within that module, and the
            unique identifier of the lookup relationship.
          oneOf:
            - type: object
              x-zs-$id: LookupFieldStructure
              description: >-
                Represents the active lookup field configuration, encapsulating
                the target module reference, the lookup field's API name,
                display label, unique identifier, and any query filter settings.
              additionalProperties: false
              properties:
                display_label:
                  oneOf:
                    - type: string
                      x-zs-$id: LookupDisplayLabelString
                      description: >-
                        Represents the active display label of the lookup field,
                        shown to users in the CRM interface when the lookup
                        relationship is referenced.
                      example: Related List Label 1
                      maxLength: 50
                    - $ref: '#/components/schemas/TypeNull'
                revalidate_filter_during_edit:
                  type: boolean
                  description: >-
                    Indicates whether the lookup's filter criteria are
                    re-evaluated each time the record is opened in edit mode,
                    ensuring that the selectable records reflect current field
                    values rather than the values at the time the record was
                    first created. Possible values: `true` — filter criteria are
                    reapplied during edit; `false` — filter criteria are applied
                    only at initial field population.
                  example: true
                api_name:
                  oneOf:
                    - description: API name of the lookup field
                      $ref: '#/components/schemas/ApiName'
                    - $ref: '#/components/schemas/TypeNull'
                module:
                  type: object
                  description: >-
                    Represents the target CRM module that this lookup field
                    references, providing the module's identifying metadata —
                    such as its name and encryption status — required to resolve
                    and navigate the cross-module relationship.
                  additionalProperties: false
                  properties:
                    api_name:
                      description: API name of the lookup module
                      $ref: '#/components/schemas/ApiName'
                    crypt:
                      type: boolean
                      description: >-
                        Indicates whether data stored in the lookup's target
                        module is encrypted at rest, informing consumers that
                        records retrieved through this lookup relationship may
                        be subject to field-level encryption policies. Possible
                        values: `true` — the target module's data is encrypted;
                        `false` — the target module's data is not encrypted.
                      example: false
                    id:
                      description: Unique identifier of the lookup module
                      $ref: '#/components/schemas/Id'
                id:
                  description: >-
                    Represents the unique system-generated identifier for the
                    lookup field definition within the target module. May be
                    null for lookups created implicitly by the system rather
                    than explicitly configured by an administrator.
                  oneOf:
                    - $ref: '#/components/schemas/Id'
                    - $ref: '#/components/schemas/TypeNull'
                query_details:
                  description: >-
                    Contains the query configuration used to filter the
                    selectable records in the lookup dropdown, restricting
                    available options based on field criteria or system-defined
                    query identifiers.
                  oneOf:
                    - type: object
                      x-zs-$id: LookupQueryDetailsWithCriteria
                      title: Query Details with Criteria
                      description: >-
                        Represents the active query configuration with
                        field-level filter criteria used to narrow the
                        selectable records in the lookup dropdown.
                      additionalProperties: false
                      properties:
                        query_id:
                          description: >-
                            Represents the unique identifier of the custom query
                            used to filter the lookup's selectable records,
                            referencing a predefined query configuration that
                            determines which records appear in the dropdown.
                          oneOf:
                            - type: string
                              x-zs-$id: LookupQueryIdString
                              description: >-
                                Represents the custom query identifier as a
                                string value, referencing a predefined query
                                configuration that filters the lookup's
                                selectable records.
                              format: int64
                              maxLength: 30
                              example: '4832675000000850792'
                            - type: integer
                              x-zs-$id: LookupQueryIdInteger
                              format: int64
                              description: >-
                                Represents the custom query identifier as an
                                integer value, referencing a predefined query
                                configuration that filters the lookup's
                                selectable records.
                              example: 4832675000001314000
                        criteria:
                          type: object
                          description: >-
                            Represents the field-level filter condition applied
                            to the lookup query, defining the field, comparison
                            operator, value, and type of criterion used to
                            narrow the set of records displayed in the lookup.
                          additionalProperties: false
                          properties:
                            comparator:
                              type: string
                              description: >-
                                Represents the comparison operator applied when
                                evaluating the filter criterion, such as equals,
                                contains, starts with, or greater than,
                                determining how the field value is tested
                                against the specified filter value.
                              example: not_equal
                              maxLength: 50
                            field:
                              type: object
                              description: >-
                                Represents the field used as the left-hand
                                operand in the lookup filter criterion,
                                identifying which field's value is evaluated
                                against the specified comparator and value.
                              additionalProperties: false
                              properties:
                                api_name:
                                  type: string
                                  description: >-
                                    Represents the API name of the field used in
                                    the lookup filter criterion, which may
                                    reference a standard field, a custom field,
                                    or a related field accessed through dot
                                    notation.
                                  maxLength: 100
                                  example: Contact_Name.Full_Name
                                id:
                                  $ref: '#/components/schemas/Id'
                                  description: >-
                                    Unique identifier of the field used in the
                                    criteria.
                            type:
                              type: string
                              description: >-
                                Indicates whether the filter value is a static
                                literal or a dynamic reference, controlling how
                                the comparison value is resolved at runtime when
                                the lookup list is rendered.
                              example: value
                              maxLength: 50
                            value:
                              description: >-
                                Represents the value compared against the
                                selected field when evaluating the lookup filter
                                criterion. Can be a string, number, or Boolean
                                depending on the field type and the configured
                                comparator.
                              oneOf:
                                - type: string
                                  x-zs-$id: LookupCriteriaValueString
                                  description: >-
                                    Represents a string value used as the
                                    right-hand operand when evaluating the
                                    lookup filter criterion.
                                  maxLength: 255
                                  example: ${EMPTY}
                                - type: number
                                  x-zs-$id: LookupCriteriaValueNumber
                                  description: >-
                                    Represents a numeric value used as the
                                    right-hand operand when evaluating the
                                    lookup filter criterion.
                                  example: 100
                                - type: boolean
                                  x-zs-$id: LookupCriteriaValueBoolean
                                  description: >-
                                    Represents a Boolean value used as the
                                    right-hand operand when evaluating the
                                    lookup filter criterion.
                                  example: true
                                - $ref: '#/components/schemas/TypeNull'
                          required:
                            - comparator
                            - field
                            - type
                        system_query_id:
                          description: >-
                            Represents the system-assigned identifier for a
                            platform-managed query that filters the lookup's
                            record list, used when the filter logic is
                            maintained by the CRM system rather than defined by
                            a custom query.
                          oneOf:
                            - type: string
                              x-zs-$id: LookupSystemQueryIdString
                              description: >-
                                Represents the system-assigned query identifier
                                as a string, referencing a platform-managed
                                query that filters the lookup's record list.
                              format: int64
                              maxLength: 30
                              example: '4832675000000850800'
                            - $ref: '#/components/schemas/TypeNull'
                      required:
                        - query_id
                        - criteria
                        - system_query_id
                    - type: object
                      x-zs-$id: LookupQueryDetailsSystemOnly
                      title: Query Details System Only
                      description: >-
                        Represents the query configuration variant that contains
                        only a system query identifier, without custom filter
                        criteria, used when the lookup filter logic is entirely
                        managed by the CRM platform.
                      additionalProperties: false
                      properties:
                        system_query_id:
                          description: >-
                            Represents the system-assigned identifier for an
                            alternate platform-managed query variant that
                            filters the lookup's record list in this
                            configuration schema variant.
                          oneOf:
                            - type: string
                              x-zs-$id: LookupSystemQueryIdStringOnly
                              description: >-
                                Represents the system-assigned query identifier
                                as a string in the system-query-only variant,
                                referencing a platform-managed filter for the
                                lookup.
                              format: int64
                              maxLength: 30
                              example: '4832675000000850800'
                            - $ref: '#/components/schemas/TypeNull'
                      required:
                        - system_query_id
            - $ref: '#/components/schemas/TypeNull'
        hipaa_compliance:
          oneOf:
            - type: object
              x-zs-$id: HIPAAComplianceStructure
              description: >-
                Represents the active HIPAA compliance configuration for this
                field, specifying the access restriction and export suppression
                settings applied when HIPAA compliance is enabled.
              properties:
                restricted_in_export:
                  type: boolean
                  description: >-
                    Indicates whether this field's value is suppressed or masked
                    when records are exported, in accordance with HIPAA data
                    handling requirements. Possible values: `true` — the field
                    is excluded or redacted in exported data sets; `false` — the
                    field value is included in exports without HIPAA-based
                    redaction.
                  example: false
                restricted:
                  type: boolean
                  description: >-
                    Indicates whether access to this field's value is restricted
                    under HIPAA compliance rules, limiting visibility to only
                    those users or roles authorized to handle protected health
                    information. Possible values: `true` — the field is treated
                    as restricted PHI and access controls are enforced; `false`
                    — the field is not subject to HIPAA access restrictions.
                  example: false
              required:
                - restricted_in_export
                - restricted
              additionalProperties: false
            - $ref: '#/components/schemas/TypeNull'
        convert_mapping:
          description: >-
            Contains the cross-module field mapping configuration that governs
            how this field's value is transferred to corresponding fields in
            target modules (such as Accounts, Contacts, Deals, Invoices, or
            Sales Orders) when a record conversion is performed.
          oneOf:
            - type: object
              x-zs-$id: LeadsFieldConvertMapping
              title: Leads Field Convert Mapping
              description: >-
                Represents the Leads module field conversion mapping, specifying
                the destination field API names in the Contacts, Deals, and
                Accounts modules for this field during lead conversion.
              additionalProperties: false
              properties:
                Contacts:
                  description: >-
                    Represents the API name of the destination field in the
                    **Contacts** module to which this field's value is mapped
                    during record conversion, or null when no mapping to
                    Contacts is defined.
                  oneOf:
                    - type: string
                      x-zs-$id: ContactsFieldMapping
                      description: >-
                        Represents the API name of the target field in the
                        **Contacts** module for this field's value during
                        lead-to-Contacts conversion.
                      maxLength: 100
                      example: Contact_Name
                    - $ref: '#/components/schemas/TypeNull'
                Deals:
                  description: >-
                    Represents the API name of the destination field in the
                    **Deals** module to which this field's value is mapped
                    during record conversion, or null when no mapping to Deals
                    is defined.
                  oneOf:
                    - type: string
                      x-zs-$id: DealsFieldMapping
                      description: >-
                        Represents the API name of the target field in the
                        **Deals** module for this field's value during
                        lead-to-Deals conversion.
                      maxLength: 100
                      example: Deal_Name
                    - $ref: '#/components/schemas/TypeNull'
                Accounts:
                  description: >-
                    Represents the API name of the destination field in the
                    **Accounts** module to which this field's value is mapped
                    during record conversion, or null when no mapping to
                    Accounts is defined.
                  oneOf:
                    - type: string
                      x-zs-$id: AccountsFieldMapping
                      description: >-
                        Represents the API name of the target field in the
                        **Accounts** module for this field's value during
                        lead-to-Accounts conversion.
                      maxLength: 100
                      example: Account_Name
                    - $ref: '#/components/schemas/TypeNull'
              required:
                - Contacts
                - Deals
                - Accounts
            - type: object
              x-zs-$id: QuotesFieldConvertMapping
              title: Quotes Field Convert Mapping
              description: >-
                Represents the Quotes module field conversion mapping,
                specifying the destination field API names in the Invoices and
                Sales_Orders modules for this field during quote conversion.
              additionalProperties: false
              properties:
                Invoices:
                  description: >-
                    Represents the API name of the destination field in the
                    **Invoices** module to which this field's value is mapped
                    during record conversion, or null when no mapping to
                    Invoices is defined.
                  oneOf:
                    - type: string
                      x-zs-$id: QuotesInvoicesFieldMapping
                      description: >-
                        Represents the API name of the target field in the
                        **Invoices** module for this field's value during
                        quote-to-Invoices conversion.
                      maxLength: 100
                      example: Account_Name
                    - $ref: '#/components/schemas/TypeNull'
                Sales_Orders:
                  description: >-
                    Represents the API name of the destination field in the
                    **Sales_Orders** module to which this field's value is
                    mapped during record conversion, or null when no mapping to
                    Sales Orders is defined.
                  oneOf:
                    - type: string
                      x-zs-$id: SalesOrdersFieldMapping
                      description: >-
                        Represents the API name of the target field in the
                        **Sales_Orders** module for this field's value during
                        quote-to-Sales_Orders conversion.
                      maxLength: 100
                      example: Account_Name
                    - $ref: '#/components/schemas/TypeNull'
              required:
                - Invoices
                - Sales_Orders
            - type: object
              x-zs-$id: SalesOrdersFieldConvertMapping
              title: Sales Orders Field Convert Mapping
              description: >-
                Represents the Sales Orders module field conversion mapping,
                specifying the destination field API name in the Invoices module
                for this field during Sales Order conversion.
              additionalProperties: false
              minProperties: 1
              maxProperties: 1
              properties:
                Invoices:
                  description: >-
                    Represents the API name of the destination field in the
                    **Invoices** module to which this field's value is mapped
                    under an alternate conversion schema variant, or null when
                    no mapping to Invoices is defined in this context.
                  oneOf:
                    - type: string
                      x-zs-$id: SalesOrdersInvoicesFieldMapping
                      description: >-
                        Represents the API name of the target field in the
                        **Invoices** module for this field's value during Sales
                        Order-to-Invoices conversion.
                      maxLength: 100
                      example: Status
                    - $ref: '#/components/schemas/TypeNull'
              required:
                - Invoices
            - type: object
              x-zs-$id: EmptyConvertMappingObject
              title: No Convert Mapping
              description: >-
                Represents an empty convert mapping object indicating that no
                cross-module field mapping is configured for this field.
              additionalProperties: false
              maxProperties: 0
        address:
          description: >-
            Contains the address sub-field configuration applicable when the
            field represents a composite address type, such as mailing or
            billing address, grouping individual components like street, city,
            state, and country into a structured object.
          oneOf:
            - type: object
              x-zs-$id: AddressFieldStructure
              description: >-
                Represents the detailed address sub-field configuration when the
                field is a composite address type, providing the address
                category classification.
              additionalProperties: false
              properties:
                type:
                  type: string
                  description: >-
                    Represents the classification of the address, distinguishing
                    between address categories such as mailing, billing, or
                    shipping to determine how the composite address field is
                    labeled and used within the module layout.
                  example: shipping
                  maxLength: 25
              required:
                - type
            - $ref: '#/components/schemas/TypeNull'
        rollup_summary:
          description: >-
            Represents the rollup summary configuration for this field, defining
            how aggregated values from related records in a child module are
            calculated and displayed in the parent record's field.
          oneOf:
            - type: object
              x-zs-$id: RollupSummaryFieldStructure
              description: >-
                Represents the active rollup summary configuration for this
                field, detailing the aggregation function, child module, filter
                criteria, and related list used to compute the summarized value.
              additionalProperties: false
              properties:
                return_type:
                  type: string
                  description: >-
                    Indicates the data type of the value produced by the rollup
                    summary calculation, such as integer, decimal, or date,
                    which determines how the computed result is stored and
                    displayed.
                  example: number
                  maxLength: 50
                expression:
                  type: object
                  description: >-
                    Contains the expression configuration for the rollup summary
                    calculation, including the aggregation function, the field
                    being summarized, and any filter criteria applied to
                    restrict which related records are included.
                  additionalProperties: false
                  properties:
                    function_parameters:
                      type: array
                      description: >-
                        Contains the list of parameters passed to the rollup
                        aggregation function, specifying which fields or values
                        are used as inputs to the calculation.
                      items:
                        type: object
                        description: >-
                          Represents a single parameter supplied to the rollup
                          aggregation function, identifying a field or constant
                          value used as an input to the summary calculation.
                        additionalProperties: false
                        properties:
                          api_name:
                            description: API name of the parameter field
                            $ref: '#/components/schemas/ApiName'
                        required:
                          - api_name
                      maxItems: 100
                    criteria:
                      description: >-
                        Represents the filter conditions applied to limit which
                        related records in the child module are included in the
                        rollup summary calculation.
                      oneOf:
                        - type: object
                          x-zs-$id: RollupSummaryCriteriaStructure
                          description: >-
                            Represents the active filter criteria configuration
                            for the rollup summary, specifying the conditions
                            that child module records must satisfy to be
                            included in the aggregation.
                          additionalProperties: false
                          properties:
                            comparator:
                              type: string
                              description: >-
                                Represents the comparison operator used in the
                                rollup filter criterion, applied when evaluating
                                whether a related record's field value satisfies
                                the filter condition.
                              example: equals
                              maxLength: 25
                            field:
                              type: object
                              description: >-
                                Identifies the field in the child module whose
                                value is tested against the comparator and
                                filter value when determining which related
                                records are included in the rollup.
                              additionalProperties: false
                              properties:
                                api_name:
                                  type: string
                                  description: >-
                                    Represents the API name of the child module
                                    field used in the rollup filter criterion.
                                  example: Status
                                  maxLength: 100
                                id:
                                  description: Unique identifier of the criteria field
                                  $ref: '#/components/schemas/Id'
                              required:
                                - api_name
                                - id
                            type:
                              type: string
                              description: >-
                                Indicates whether the filter value in the rollup
                                criterion is a static literal or a dynamic
                                reference resolved at runtime.
                              example: custom
                              maxLength: 25
                            value:
                              type: string
                              description: >-
                                Represents the value compared against the child
                                module field when evaluating the rollup filter
                                criterion.
                              example: Approved
                              maxLength: 100
                          required:
                            - comparator
                            - field
                            - type
                            - value
                        - $ref: '#/components/schemas/TypeNull'
                    function:
                      type: string
                      description: >-
                        Represents the aggregation function applied to the child
                        module records when computing the rollup summary, such
                        as SUM, COUNT, MIN, MAX, or AVERAGE.
                      example: SUM
                      maxLength: 25
                  required:
                    - function_parameters
                    - function
                based_on_module:
                  type: object
                  description: >-
                    Represents the child module from which related records are
                    aggregated when computing the rollup summary value for this
                    field.
                  additionalProperties: false
                  properties:
                    api_name:
                      description: API name of the base module
                      $ref: '#/components/schemas/ApiName'
                    id:
                      description: Unique identifier of the base module
                      $ref: '#/components/schemas/Id'
                  required:
                    - api_name
                    - id
                related_list:
                  description: >-
                    Represents the related list configuration that defines the
                    child module relationship from which records are drawn for
                    the rollup summary calculation.
                  oneOf:
                    - type: object
                      x-zs-$id: RelatedListStructure
                      description: >-
                        Represents the active related list configuration for the
                        rollup summary, identifying the child module
                        relationship from which records are drawn for
                        aggregation.
                      additionalProperties: false
                      properties:
                        api_name:
                          description: API name of the related list
                          $ref: '#/components/schemas/ApiName'
                        id:
                          description: Unique identifier of the related list
                          $ref: '#/components/schemas/Id'
                      required:
                        - api_name
                        - id
                    - $ref: '#/components/schemas/TypeNull'
                rollup_based_on:
                  type: string
                  description: >-
                    Indicates the basis of the rollup calculation, specifying
                    whether the aggregation operates on all related records or
                    only on a filtered subset defined by the expression
                    criteria.
                  example: Created_Time
                  maxLength: 50
            - $ref: '#/components/schemas/TypeNull'
        length:
          type: number
          description: >-
            Represents the maximum number of characters or digits permitted for
            this field's value, defining the storage and input boundary enforced
            by the CRM when records are saved.
          example: 255
          format: int32
        column_name:
          type: string
          description: >-
            Represents the underlying database column identifier mapped to this
            field, used for direct data-layer references and query construction
            within the CRM storage layer.
          example: WEBSITE
          maxLength: 100
        display_field:
          type: boolean
          description: >-
            Indicates whether this field is designated as the primary display
            field for the module, used to represent the record in lookups,
            related lists, and search results. Possible values: `true` — the
            field serves as the record's display identifier; `false` — the field
            is not the primary display field.
          example: false
        pick_list_values_sorted_lexically:
          type: boolean
          description: >-
            Indicates whether the picklist options for this field are
            automatically sorted in alphabetical order for display, rather than
            in the administrator-defined sequence order. Possible values: `true`
            — options are sorted alphabetically; `false` — options appear in the
            order defined by the administrator.
          example: false
        default_value:
          description: >-
            Represents the pre-populated value automatically applied to this
            field when a new record is saved, serving as a baseline entry that
            users can override during data entry.
          oneOf:
            - type: string
              x-zs-$id: DefaultValueString
              description: >-
                Represents the default string or numeric value pre-populated in
                this field when a new record is saved.
              maxLength: 255
            - type: boolean
              x-zs-$id: DefaultValueBoolean
              description: >-
                Represents the default Boolean value pre-populated in this field
                when a new record is saved.
            - $ref: '#/components/schemas/TypeNull'
        sortable:
          type: boolean
          description: >-
            Indicates whether records can be sorted by this field's value in
            list views, reports, and search results. Possible values: `true` —
            the field is available as a sort key; `false` — the field cannot be
            used for sorting.
          example: true
        sequence_number:
          type: number
          description: >-
            Represents the ordinal position of this field within its containing
            section, controlling the order in which fields are rendered on
            record forms. Sequence numbering generally starts from one but may
            contain gaps.
          format: int32
          minimum: 1
        global_picklist:
          description: >-
            Represents the organization-level picklist configuration shared
            across multiple modules that this field draws its allowed values
            from. When present, the field's pick options are centrally managed
            through the referenced global picklist rather than defined locally
            on the field itself.
          oneOf:
            - type: object
              x-zs-$id: GlobalPicklistStructure
              description: >-
                Represents the active global picklist configuration linking this
                field to a shared organization-level picklist definition.
              additionalProperties: false
              properties:
                api_name:
                  description: API name of the global picklist
                  $ref: '#/components/schemas/ApiName'
                id:
                  description: Unique identifier of the global picklist
                  $ref: '#/components/schemas/Id'
              required:
                - api_name
                - id
            - $ref: '#/components/schemas/TypeNull'
        display_format:
          description: >-
            Specifies the presentation pattern applied when rendering the
            field's value in the UI, such as a date format string, a time
            pattern, or a number format template controlling separators and
            symbol placement.
          oneOf:
            - type: string
              x-zs-$id: DisplayFormatString
              description: >-
                Represents the active display format pattern for this field,
                such as a date format string or number format template applied
                when rendering the field's value in the UI.
              example: slider
              maxLength: 50
            - $ref: '#/components/schemas/TypeNull'
        history_tracking:
          description: >-
            Represents the history tracking configuration for this field,
            capturing how and for how long changes to the field's value are
            recorded in the audit trail. Includes details about tracked
            duration, associated modules, related list linkage, and the specific
            fields whose changes are followed.
          oneOf:
            - type: object
              x-zs-$id: HistoryTrackingStructure
              description: >-
                Represents the active history tracking configuration for this
                field, detailing the retention duration, tracked fields,
                associated module, and related list configuration.
              additionalProperties: false
              properties:
                related_list_name:
                  type: string
                  description: >-
                    Represents the display name of the related list through
                    which the field's historical change records are surfaced on
                    the associated module's detail view, allowing end users to
                    review the audit trail directly within the record context.
                  example: Module_Histories
                  maxLength: 100
                module:
                  type: object
                  description: >-
                    Represents the CRM module with which this field's history
                    tracking is associated, providing the module-level context
                    required to correctly scope, store, and surface field change
                    records in the appropriate audit trail.
                  additionalProperties: false
                  properties:
                    api_name:
                      description: API name of the history tracking module
                      $ref: '#/components/schemas/ApiName'
                    id:
                      description: Unique identifier of the history tracking module
                      $ref: '#/components/schemas/Id'
                  required:
                    - api_name
                    - id
                duration_configured_field:
                  oneOf:
                    - type: object
                      x-zs-$id: DurationConfiguredFieldStructure
                      description: >-
                        Represents the active configuration of the field
                        designated to supply the retention duration value for
                        history tracking.
                      additionalProperties: false
                      properties:
                        api_name:
                          description: API name of the duration field
                          $ref: '#/components/schemas/ApiName'
                        id:
                          description: Unique identifier of the duration field
                          $ref: '#/components/schemas/Id'
                      required:
                        - api_name
                        - id
                    - $ref: '#/components/schemas/TypeNull'
                duration_configuration:
                  type: string
                  description: >-
                    Contains the settings that govern the time window over which
                    field value changes are retained in the history log, such as
                    the retention period length and applicable time units used
                    to define how far back historical data is preserved.
                  example: 7_DAYS
                  maxLength: 120
                followed_fields:
                  type: array
                  description: >-
                    Contains the collection of fields whose value changes are
                    actively monitored and recorded as part of this field's
                    history tracking configuration, allowing administrators to
                    scope audit trail capture to a defined subset of related
                    fields.
                  items:
                    type: object
                    description: >-
                      Represents an individual field entry being tracked for
                      history, including its identifying metadata and the module
                      context in which changes to that field are captured for
                      the audit log.
                    additionalProperties: false
                    properties:
                      api_name:
                        description: API name of the followed field
                        $ref: '#/components/schemas/ApiName'
                      id:
                        description: Unique identifier of the followed field
                        $ref: '#/components/schemas/Id'
                    required:
                      - api_name
                      - id
                  maxItems: 100
            - $ref: '#/components/schemas/TypeNull'
        data_type:
          type: string
          description: >-
            Identifies the data category assigned to the field, such as text,
            integer, decimal, date, Boolean, picklist, or lookup, which governs
            validation rules, storage format, and applicable UI controls.
          example: text
          maxLength: 50
        formula:
          description: >-
            Contains the formula configuration for fields whose values are
            automatically calculated from expressions referencing other fields
            or functions, rather than being entered directly by users.
          oneOf:
            - type: object
              x-zs-$id: FormulaFieldStructure
              description: >-
                Represents the active formula configuration for this calculated
                field, containing the expression, return type, evaluation order,
                and any conditional stop logic.
              additionalProperties: true
              properties:
                return_type:
                  type: string
                  description: >-
                    Identifies the data type produced by the formula expression,
                    such as string, integer, decimal, date, or Boolean, which
                    determines how the computed value is stored and displayed.
                  example: text
                  maxLength: 25
                expression:
                  type: string
                  description: >-
                    Contains the formula expression string that defines the
                    calculation logic, composed of function calls, field API
                    name references, and operators that the CRM engine evaluates
                    to produce the field's computed value.
                  example: Substring(${Lead_Source},2,5)
                  maxLength: 3000
                evaluation_order:
                  type: integer
                  format: int32
                  description: >-
                    Indicates the relative priority in which this formula field
                    is evaluated when multiple formula fields exist in the same
                    module and share dependencies, ensuring upstream values are
                    resolved before downstream ones.
                  minimum: 1
                  example: 1
                sub_return_type:
                  description: >-
                    Represents a secondary classification of the formula's
                    output type, refining the primary return type to indicate a
                    more specific data size or unit. Possible values: `small` —
                    a compact representation of the return type. `medium` — a
                    standard-size representation. `large` — a large-size
                    representation.
                  oneOf:
                    - type: string
                      x-zs-$id: SubReturnTypeString
                      description: >-
                        Represents the active secondary type classification for
                        the formula's return value. Possible values: `small` — a
                        compact representation. `medium` — a standard-size
                        representation. `large` — a large-size representation.
                      enum:
                        - small
                        - medium
                        - large
                      example: small
                      maxLength: 25
                    - $ref: '#/components/schemas/TypeNull'
                dynamic:
                  type: boolean
                  description: >-
                    Indicates whether the formula is recalculated in real time
                    as dependent field values change, rather than being
                    evaluated only at save time. Possible values: `true` — the
                    formula updates dynamically during record editing; `false` —
                    the formula is evaluated only when the record is saved.
                  example: false
                stop_compute_conditionally:
                  type: boolean
                  description: >-
                    Indicates whether the formula evaluation halts when a
                    specified logical condition is met. Possible values: `true`
                    — the formula stops computing once the stop condition
                    expression evaluates to true; `false` — the formula computes
                    to completion regardless of intermediate conditions.
                  example: false
                assume_default:
                  type: boolean
                  description: >-
                    Indicates whether null or missing operand values in the
                    formula expression are treated as zero or an equivalent
                    default, rather than causing the formula result to be null.
                    Possible values: `true` — null operands are substituted with
                    default values; `false` — null operands propagate as null
                    through the calculation.
                  example: false
                stop_compute_expression:
                  description: >-
                    Contains the logical expression evaluated at runtime to
                    determine whether formula computation should be interrupted.
                    When the expression resolves to true and
                    stop_compute_conditionally is enabled, further formula
                    processing is skipped and the current interim value is
                    retained.
                  oneOf:
                    - type: string
                      x-zs-$id: StopComputeExpressionString
                      description: >-
                        Represents the active logical expression evaluated to
                        determine whether formula computation should be halted
                        before completion.
                      maxLength: 3000
                      example: ${Status} == 'Closed'
                    - $ref: '#/components/schemas/TypeNull'
              required:
                - return_type
                - expression
                - dynamic
                - stop_compute_conditionally
                - stop_compute_expression
            - type: object
              x-zs-$id: EmptyFormulaObject
              title: No Formula
              description: >-
                Represents an empty formula configuration object indicating that
                no formula calculation is configured for this field.
              additionalProperties: false
              maxProperties: 0
        static_field:
          type: boolean
          description: >-
            Indicates whether this field is a static layout element with a fixed
            value that does not accept user input. Possible values: `true` — the
            field is a static display-only element; `false` — the field accepts
            dynamic user-entered or system-computed values.
          example: false
        additional_column:
          oneOf:
            - type: string
              x-zs-$id: AdditionalColumnString
              description: >-
                Represents the additional column configuration for the field,
                specifying display settings when the field appears as an extra
                column in module list views.
              example: Custom_Column_1
              maxLength: 100
            - $ref: '#/components/schemas/TypeNull'
        hipaa_compliance_enabled:
          type: boolean
          description: >-
            Indicates whether HIPAA compliance enforcement is active for this
            field, determining whether the associated HIPAA access and export
            restrictions are applied at runtime. Possible values: `true` — HIPAA
            compliance rules are enforced for this field; `false` — HIPAA
            compliance is not enforced and the field is treated as non-PHI data.
          example: false
        query_details:
          description: >-
            Contains the query configuration applied to filter the selectable
            records in this field's lookup or dependent logic, using either
            custom query identifiers or field-level criteria expressions.
          oneOf:
            - type: object
              x-zs-$id: QueryDetailsStructure
              description: >-
                Represents the active query configuration for this field's
                lookup filter, using field-level criteria expressions to narrow
                selectable records.
              additionalProperties: false
              properties:
                query_id:
                  type: integer
                  format: int64
                  description: >-
                    Represents the unique identifier of the custom query used to
                    filter this field's selectable options or lookup results.
                  example: 4832675000001314000
                criteria:
                  type: object
                  description: >-
                    Represents the field-level filter condition for the query,
                    specifying the field, comparator, type, and value used to
                    narrow down the set of records or options.
                  additionalProperties: false
                  properties:
                    comparator:
                      type: string
                      description: >-
                        Represents the comparison operator used in the filter
                        criterion, such as equals, contains, or greater than,
                        applied when evaluating whether a record or value
                        satisfies the filter.
                      example: equal
                      maxLength: 25
                    field:
                      type: object
                      description: >-
                        Identifies the field whose value is evaluated against
                        the comparator and filter value in the query criteria.
                      additionalProperties: false
                      properties:
                        api_name:
                          $ref: '#/components/schemas/ApiName'
                          description: API name of the field used in the criteria.
                        id:
                          $ref: '#/components/schemas/Id'
                          description: Unique identifier of the field used in the criteria.
                      required:
                        - api_name
                        - id
                    type:
                      type: string
                      description: >-
                        Indicates whether the comparison value in the filter
                        criterion is a static literal or a dynamic contextual
                        reference resolved at runtime.
                      example: value
                      maxLength: 50
                    value:
                      description: >-
                        Represents the value compared against the selected field
                        when evaluating the query filter criterion.
                      oneOf:
                        - type: string
                          x-zs-$id: CriteriaValueString
                          description: >-
                            Represents a string value used as the comparison
                            operand in the field-level lookup filter criterion.
                          maxLength: 255
                          example: Option 1
                        - type: number
                          x-zs-$id: CriteriaValueNumber
                          description: >-
                            Represents a numeric value used as the comparison
                            operand in the field-level lookup filter criterion.
                          example: 100
                        - type: boolean
                          x-zs-$id: CriteriaValueBoolean
                          description: >-
                            Represents a Boolean value used as the comparison
                            operand in the field-level lookup filter criterion.
                          example: true
                        - $ref: '#/components/schemas/TypeNull'
                  required:
                    - comparator
                    - field
                    - type
              required:
                - query_id
                - criteria
            - $ref: '#/components/schemas/TypeNull'
        decimal_place:
          oneOf:
            - type: number
              description: >-
                Represents the number of decimal places configured for the
                field, defining the precision applied when storing and
                displaying fractional values.
              example: 2
              x-zs-$id: DecimalPlaceInteger
              format: int32
            - $ref: '#/components/schemas/TypeNull'
        mass_update:
          type: boolean
          description: >-
            Indicates whether this field can be updated simultaneously across
            multiple records using the mass update operation. Possible values:
            `true` — the field is available for mass update; `false` — the field
            cannot be modified through bulk update actions.
          example: true
        multiselectlookup:
          oneOf:
            - type: object
              x-zs-$id: MultiModuleLookupFieldStructure
              description: >-
                Represents the active multi-select lookup configuration for this
                field, including the connected module details, linking module
                information, and related list configuration.
              properties:
                linking_details:
                  type: object
                  description: >-
                    Contains the configuration of the intermediary linking
                    module that joins the source and target modules in a
                    multi-select lookup relationship, including the relevant
                    lookup fields on each side.
                  properties:
                    module:
                      type: object
                      description: >-
                        Represents the intermediary linking module that bridges
                        the source and target modules in a multi-select lookup,
                        storing the join records that implement the many-to-many
                        relationship.
                      properties:
                        visibility:
                          type: number
                          description: >-
                            Indicates the visibility state of the linking
                            module, controlling whether it appears in the CRM
                            interface and navigation for end users.
                          example: 1
                          format: int32
                        plural_label:
                          type: string
                          description: >-
                            Contains the plural display name of the linking
                            module, as shown in navigation and relational UI
                            elements within the CRM.
                          example: Contacts
                          maxLength: 100
                        api_name:
                          $ref: '#/components/schemas/ApiName'
                        id:
                          $ref: '#/components/schemas/Id'
                      required:
                        - visibility
                        - plural_label
                        - api_name
                        - id
                      additionalProperties: false
                    lookup_field:
                      type: object
                      description: >-
                        Represents the lookup field on the linking module that
                        points back toward the source module, establishing the
                        origin side of the multi-select lookup relationship.
                      properties:
                        api_name:
                          $ref: '#/components/schemas/ApiName'
                        field_label:
                          type: string
                          description: >-
                            Contains the display label of the lookup field on
                            the linking module that references the source
                            module, as presented in the CRM interface.
                          example: Contact Name
                          maxLength: 100
                        id:
                          $ref: '#/components/schemas/Id'
                      required:
                        - api_name
                        - field_label
                        - id
                      additionalProperties: false
                    connected_lookup_field:
                      type: object
                      description: >-
                        Represents the lookup field on the linking module that
                        points toward the connected (target) module, completing
                        the many-to-many association in the multi-select lookup.
                      properties:
                        api_name:
                          $ref: '#/components/schemas/ApiName'
                        field_label:
                          type: string
                          description: >-
                            Contains the display label of the lookup field on
                            the linking module that references the connected
                            target module, as presented in the CRM interface.
                          example: Account Name
                          maxLength: 100
                        id:
                          $ref: '#/components/schemas/Id'
                      required:
                        - api_name
                        - field_label
                        - id
                      additionalProperties: false
                  required:
                    - module
                    - lookup_field
                    - connected_lookup_field
                  additionalProperties: false
                connected_details:
                  type: object
                  description: >-
                    Contains metadata about the target module and its associated
                    layouts and fields that the multi-select lookup field
                    resolves records against.
                  properties:
                    field:
                      type: object
                      description: >-
                        Represents the specific field in the connected module
                        that is referenced by the multi-select lookup, used to
                        surface a meaningful value from the related record.
                      properties:
                        api_name:
                          $ref: '#/components/schemas/ApiName'
                        field_label:
                          type: string
                          description: >-
                            Contains the display label of the referenced field
                            in the connected module, as shown to users when
                            viewing or configuring the multi-select lookup.
                          example: Account Name
                          maxLength: 100
                        id:
                          $ref: '#/components/schemas/Id'
                      required:
                        - api_name
                        - field_label
                        - id
                      additionalProperties: false
                    module:
                      type: object
                      description: >-
                        Represents the target module to which the multi-select
                        lookup field resolves, providing display and
                        identification attributes for that module.
                      properties:
                        plural_label:
                          type: string
                          description: >-
                            Contains the plural display name of the connected
                            module, typically shown in list views and
                            relationship panels referencing multiple records.
                          example: Accounts
                          maxLength: 100
                        api_name:
                          $ref: '#/components/schemas/ApiName'
                        id:
                          $ref: '#/components/schemas/Id'
                      required:
                        - plural_label
                        - api_name
                        - id
                      additionalProperties: false
                    layouts:
                      type: array
                      description: >-
                        Contains the collection of layouts within the connected
                        module in which the multi-select lookup field is
                        available or rendered.
                      items:
                        type: object
                        description: >-
                          Represents a single layout entry from the connected
                          module, identifying a page layout in which the
                          multi-select lookup field participates.
                        properties:
                          api_name:
                            $ref: '#/components/schemas/ApiName'
                          id:
                            $ref: '#/components/schemas/Id'
                        required:
                          - api_name
                          - id
                        additionalProperties: false
                      maxItems: 100
                  required:
                    - field
                    - module
                    - layouts
                  additionalProperties: false
                related_list:
                  type: object
                  description: >-
                    Represents the related list configuration associated with
                    the multi-select lookup field, defining how linked records
                    from the target module are displayed within the source
                    record's detail view.
                  properties:
                    display_label:
                      type: string
                      description: >-
                        Contains the label for the related list panel as
                        rendered on the source record's detail page, identifying
                        the collection of linked target-module records.
                      example: Related List Label 1
                      maxLength: 50
                    api_name:
                      $ref: '#/components/schemas/ApiName'
                    id:
                      $ref: '#/components/schemas/Id'
                  required:
                    - display_label
                    - api_name
                    - id
                  additionalProperties: false
              required: []
              additionalProperties: false
            - $ref: '#/components/schemas/TypeNull'
        auto_number:
          oneOf:
            - type: object
              x-zs-$id: AutoNumberStructure
              description: >-
                Represents the active auto-number configuration for this field,
                containing the prefix, suffix, starting number, and digit length
                used to generate sequential identifiers.
              properties:
                starting_number_length:
                  type: number
                  description: >-
                    Represents the total digit length of the starting number
                    used in the auto-number sequence, controlling zero-padding
                    and minimum width of generated values.
                  example: 5
                  format: int32
                prefix:
                  oneOf:
                    - type: string
                      x-zs-$id: AutoNumberPrefixString
                      description: >-
                        Represents the text string prepended to each
                        auto-generated number in the sequence.
                      example: INV-
                      maxLength: 10
                    - $ref: '#/components/schemas/TypeNull'
                start_number:
                  oneOf:
                    - type: number
                      x-zs-$id: AutoNumberStartNumberInteger
                      description: >-
                        Represents the numeric value at which the auto-number
                        sequence begins.
                      example: 1
                      format: int32
                    - $ref: '#/components/schemas/TypeNull'
                suffix:
                  oneOf:
                    - type: string
                      x-zs-$id: AutoNumberSuffixString
                      description: >-
                        Represents the text string appended to each
                        auto-generated number in the sequence.
                      example: '-2024'
                      maxLength: 10
                    - $ref: '#/components/schemas/TypeNull'
              required: []
              additionalProperties: false
            - $ref: '#/components/schemas/TypeNull'
        quick_sequence_number:
          type: string
          description: >-
            Represents the ordinal position of this field in the quick-create
            form layout, determining the display order of fields when users
            create records through abbreviated entry panels.
          example: '1'
          maxLength: 10
        category:
          type: number
          description: >-
            Indicates the classification category of the field, used to group
            fields by their functional role or origin within the module layout,
            such as standard, custom, or system-defined categories.
          example: 2
          format: int32
        blueprint_supported:
          type: boolean
          description: >-
            Indicates whether the field can participate in Blueprint process
            definitions, enabling it to be referenced in transition conditions
            and actions within automated workflow stages. Possible values:
            `true` — the field is eligible for use in Blueprint configurations;
            `false` — the field cannot be included in Blueprint process logic.
          example: true
        textarea:
          type: object
          description: >-
            Contains the textarea-specific configuration for fields that render
            as multi-line text input areas, including details about the text
            area subtype.
          properties:
            type:
              type: string
              description: >-
                Represents the subtype of the textarea field, distinguishing
                between multi-line input variants that affect formatting and
                storage behavior. Possible values: `small` — a compact
                single-line or short textarea. `large` — a standard multi-line
                plain text area. `rich_text` — a rich text editor with
                formatting support.
              example: large
              maxLength: 50
              enum:
                - small
                - large
                - rich_text
          required:
            - type
          additionalProperties: false
        element_type:
          type: string
          description: >-
            Represents the structural element type of this entry in the layout,
            distinguishing standard data fields from mirror fields. Possible
            values: `field` — a standard data field that accepts or displays a
            value. `mirror_field` — a field that reflects a value from a related
            module through a lookup relationship.
          enum:
            - field
            - mirror_field
          example: field
          maxLength: 50
        enable_record_category:
          type: boolean
          description: >-
            Indicates if the record category feature is enabled for this
            picklist field. Only returned when the record category feature is
            available.
          example: false
        record_category_tracking_field:
          description: >-
            Reference to the field used to track record category changes over
            time in the timeline view. Only present when enable_record_category
            is true and a tracking field is configured.
          oneOf:
            - type: object
              x-zs-$id: RecordCategoryTrackingFieldStructure
              description: Field reference for tracking record category changes.
              additionalProperties: false
              properties:
                api_name:
                  $ref: '#/components/schemas/ApiName'
                  description: API name of the tracking field.
                id:
                  $ref: '#/components/schemas/Id'
                  description: Unique identifier of the tracking field.
              required:
                - api_name
                - id
            - $ref: '#/components/schemas/TypeNull'
        enable_transition_for_record_category:
          type: boolean
          description: >-
            Indicates if transitions between record categories are enabled. Only
            returned when enable_record_category is true.
          example: false
        record_category_values:
          type: array
          description: >-
            List of record category values defined for this picklist field. Only
            returned when enable_record_category is true.
          maxItems: 50
          items:
            type: object
            description: Individual record category configuration.
            additionalProperties: false
            properties:
              id:
                $ref: '#/components/schemas/Id'
                description: Unique identifier of the record category.
              api_name:
                $ref: '#/components/schemas/ApiName'
                description: API name of the record category.
              value:
                type: string
                description: Display value of the record category.
                maxLength: 120
                example: Closed Won
              nature_of_category:
                type: string
                description: Nature of the record category indicating sentiment or outcome.
                enum:
                  - none
                  - thumbs_up
                  - thumbs_down
                example: thumbs_up
            required:
              - id
              - api_name
              - value
              - nature_of_category
        lookup_field:
          type: object
          description: >-
            Represents the source lookup field on which a mirror field is based,
            identifying the cross-module lookup relationship from which this
            field's value is derived.
          additionalProperties: false
          properties:
            id:
              $ref: '#/components/schemas/Id'
            api_name:
              $ref: '#/components/schemas/ApiName'
          example:
            api_name: Contact_Name
            id: '3477061000002058001'
    MaskDetailsProfile:
      type: object
      x-zs-$id: MaskDetailsProfileStructure
      description: >-
        Represents a CRM profile that is permitted to view the unmasked value of
        a masked field, exempting users of this profile from the field's masking
        rules.
      additionalProperties: false
      properties:
        name:
          type: string
          description: >-
            Represents the name of the CRM profile that is permitted to view the
            unmasked field value, identifying which user group is exempt from
            the field's masking rules.
          maxLength: 60
          example: Administrator
        id:
          $ref: '#/components/schemas/Id'
          description: Unique identifier of the profile.
      required:
        - name
        - id
    LayoutFieldsResponseSchema:
      x-zs-$id: LayoutFieldsResponseSchema
      type: object
      description: >-
        Represents the response returned when the `fields` query parameter trims
        each layout to the requested keys. Only `id` is guaranteed - it is
        returned even when it is not requested - every other key appears only
        when it was asked for, and keys with no value for a layout are returned
        as null.
      additionalProperties: false
      properties:
        layouts:
          type: array
          description: >-
            Represents the array of layout objects trimmed to the keys requested
            through the `fields` parameter, ordered by layout name.
          maxItems: 15
          items:
            type: object
            additionalProperties: false
            description: >-
              Represents an individual layout carrying only the keys requested
              through the `fields` parameter, plus the always-present `id`.
            properties:
              id:
                $ref: '#/components/schemas/Id'
                description: Unique identifier of the layout.
              name:
                type: string
                description: Represents the internal API name of the layout.
                minLength: 1
                maxLength: 40
                example: Standard
              api_name:
                $ref: '#/components/schemas/ApiName'
                description: API name of the layout.
              display_label:
                type: string
                description: >-
                  Represents the display label of the layout shown in the CRM
                  interface.
                minLength: 1
                maxLength: 100
                example: Standard
              created_time:
                oneOf:
                  - x-zs-$id: LayoutFieldsCreatedTimeStructure
                    type: string
                    description: >-
                      ISO 8601 datetime with timezone offset indicating when the
                      layout was created.
                    format: date-time
                    example: '2024-05-17T09:15:22+05:30'
                  - $ref: '#/components/schemas/TypeNull'
              modified_time:
                oneOf:
                  - x-zs-$id: LayoutFieldsModifiedTimeStructure
                    type: string
                    description: >-
                      ISO 8601 datetime with timezone offset indicating when the
                      layout was last modified.
                    format: date-time
                    example: '2024-05-17T09:15:22+05:30'
                  - $ref: '#/components/schemas/TypeNull'
              created_by:
                oneOf:
                  - $ref: '#/components/schemas/UserReference'
                    description: User who created the layout.
                  - $ref: '#/components/schemas/TypeNull'
              modified_by:
                oneOf:
                  - $ref: '#/components/schemas/UserReference'
                    description: User who last modified the layout.
                  - $ref: '#/components/schemas/TypeNull'
              status:
                type: string
                description: Represents the current status of the layout.
                enum:
                  - active
                  - inactive
                example: active
              visible:
                type: boolean
                description: >-
                  Indicates whether the layout is visible to users in the CRM
                  interface.
                example: true
              show_business_card:
                type: boolean
                description: >-
                  Indicates whether the business card view is enabled for this
                  layout.
                example: true
              generated_type:
                type: string
                description: >-
                  Indicates whether the layout was generated by the system or
                  created by a user.
                enum:
                  - system
                  - custom
                example: system
              source:
                type: string
                description: Represents the source from which this layout was created.
                enum:
                  - crm
                  - platform_plugin
                  - marketplace_plugin
                  - campaign_integration
                example: crm
            required:
              - id
      required:
        - layouts
    LayoutResponseSchema:
      x-zs-$id: LayoutResponseSchema
      type: object
      description: >-
        Represents the response schema for layout retrieval operations,
        containing an array of layout objects each with complete configuration
        details including sections, profiles, and portal user type associations.
      additionalProperties: false
      properties:
        layouts:
          type: array
          description: >-
            Contains the array of layout objects returned for the specified
            module, each representing a complete layout configuration including
            sections, fields, profiles, and portal user type associations.
          maxItems: 15
          items:
            type: object
            additionalProperties: false
            description: >-
              Represents the complete configuration of a single layout in the
              module, including its sections, field assignments, profile
              associations, and display metadata.
            properties:
              has_more_profiles:
                type: boolean
                description: >-
                  Indicates whether additional profile associations exist for
                  this layout beyond those included in the current response.
                  Possible values: `true` — more profile associations are
                  available; `false` — all profile associations are represented.
              created_time:
                oneOf:
                  - x-zs-$id: LayoutCreatedTimeStructure
                    type: string
                    description: >-
                      Represents the ISO 8601 datetime with timezone offset
                      recording when this layout was first created in the CRM.
                    format: date-time
                    example: '2024-05-17T09:15:56+05:30'
                  - $ref: '#/components/schemas/TypeNull'
              convert_mapping:
                oneOf:
                  - $ref: '#/components/schemas/ConvertMappingModule'
                  - $ref: '#/components/schemas/TypeNull'
              visible:
                type: boolean
                description: >-
                  Indicates whether this layout is currently visible and
                  accessible to users in the CRM interface. Possible values:
                  `true` — the layout is visible and selectable; `false` — the
                  layout is hidden.
                example: true
              created_for:
                oneOf:
                  - type: string
                    x-zs-$id: CreatedForString
                    description: >-
                      Represents the integration or system context that prompted
                      the creation of this layout, identifying the source
                      platform or feature responsible for provisioning it.
                    maxLength: 100
                  - $ref: '#/components/schemas/TypeNull'
              portal_user_types:
                type: array
                description: >-
                  Contains the list of portal user type associations for this
                  layout, each specifying which portal user category the layout
                  is associated with and the default view configuration for that
                  user type.
                maxItems: 50
                items:
                  type: object
                  description: >-
                    Represents the portal user type configuration entry for this
                    layout, specifying the user type, default view settings, and
                    whether this is the default layout for that user type.
                  additionalProperties: false
                  properties:
                    default:
                      type: boolean
                      description: >-
                        Indicates whether this layout is the default for the
                        associated portal user type. Possible values: `true` —
                        this is the default layout for this portal user type;
                        `false` — it is not the default.
                      example: true
                    name:
                      type: string
                      description: >-
                        Represents the name of the portal user type associated
                        with this layout entry.
                      maxLength: 255
                      example: Customer Portal
                    id:
                      $ref: '#/components/schemas/Id'
                      description: Unique identifier of the portal user type
                    _default_view:
                      type: object
                      description: >-
                        Represents the default view assigned to this portal user
                        type for the layout, defining which view is presented to
                        portal users of this type by default.
                      additionalProperties: false
                      properties:
                        name:
                          type: string
                          description: >-
                            Represents the API name of the default view assigned
                            to this portal user type.
                          maxLength: 255
                          example: Standard
                        id:
                          $ref: '#/components/schemas/Id'
                          description: Unique identifier of the default view
                        type:
                          type: string
                          description: >-
                            Indicates the category of the default view assigned
                            to this portal user type, such as a layout view or a
                            wizard-based view.
                          enum:
                            - layout
                            - wizard
                          example: layout
                      required:
                        - name
                        - id
                        - type
                  required:
                    - default
                    - name
                    - id
                    - _default_view
              profiles:
                oneOf:
                  - type: array
                    x-zs-$id: ProfileReferenceArray
                    description: >-
                      Represents the list of CRM profiles associated with this
                      layout. Contains an empty array when no profiles are
                      assigned.
                    items:
                      $ref: '#/components/schemas/ProfileReference'
                    minItems: 1
                    maxItems: 50
                  - $ref: '#/components/schemas/TypeNull'
              source:
                type: string
                description: >-
                  Represents the origin channel of this layout. Possible values:
                  `crm` — the layout is built into the standard module
                  definition. `platform_plugin` — the layout comes from a Zoho
                  platform plugin. `marketplace_plugin` — the layout comes from
                  a Marketplace extension. `campaign_integration` — the layout
                  comes from a Campaigns integration.
                enum:
                  - crm
                  - platform_plugin
                  - marketplace_plugin
                  - campaign_integration
                example: campaign_integration
              created_by:
                oneOf:
                  - $ref: '#/components/schemas/UserReference'
                    description: User who created the layout
                  - $ref: '#/components/schemas/TypeNull'
              sections:
                type: array
                description: >-
                  Contains the ordered list of sections within this layout, each
                  grouping a set of fields and defining display properties such
                  as column count and tab traversal order.
                minItems: 0
                maxItems: 100
                items:
                  type: object
                  additionalProperties: false
                  description: >-
                    Represents a single section within the layout, encapsulating
                    the section's field collection, display label, column
                    configuration, and any subform or parent-section
                    relationships.
                  properties:
                    isSubformSection:
                      type: boolean
                      description: >-
                        Indicates whether this section renders as an embedded
                        subform that displays related module records inline
                        within the parent record's layout. Possible values:
                        `true` — the section is a subform; `false` — the section
                        is a standard field group.
                    parent_section:
                      description: >-
                        Represents a reference to the parent section when this
                        section is nested as a subform or dependent section
                        within the layout hierarchy.
                      oneOf:
                        - type: object
                          x-zs-$id: ParentSectionStructure
                          description: >-
                            Represents the parent section reference for a nested
                            section, identifying the containing parent section
                            by name when a hierarchical section relationship
                            exists.
                          additionalProperties: false
                          properties:
                            id:
                              $ref: '#/components/schemas/Id'
                              description: Unique identifier of the parent section.
                            name:
                              type: string
                              description: >-
                                Represents the name of the parent section under
                                which this nested section is organized within
                                the layout.
                              maxLength: 100
                              example: Address Information
                          required:
                            - id
                            - name
                        - $ref: '#/components/schemas/TypeNull'
                    type:
                      type: string
                      description: >-
                        Represents the usage status type of this section within
                        the layout. Possible values: `used` — the section
                        contains fields assigned to it. `unused` — the section
                        exists in the layout but contains no assigned fields.
                      enum:
                        - used
                        - unused
                      example: used
                    display_label:
                      type: string
                      description: >-
                        Represents the name of the section as displayed in the
                        CRM interface, used as the section heading on record
                        create and detail pages.
                      minLength: 1
                      maxLength: 100
                      example: Contact Information
                    mode:
                      type: string
                      description: >-
                        Represents the layout mode for which this section
                        applies, controlling in which view contexts the section
                        and its fields render. Possible values: `all` — applies
                        across all layout modes. `business_card` — applies to
                        the business card view. `quick_create` — applies to the
                        quick-create form. `default_create` — applies to the
                        default record creation form. `create_edit` — applies to
                        both create and edit forms. `view` — applies to the
                        record detail view. `quick_view` — applies to the quick
                        view panel. `subform_default_create` — applies to the
                        default create form within a subform context.
                      enum:
                        - all
                        - business_card
                        - quick_create
                        - default_create
                        - create_edit
                        - view
                        - quick_view
                        - subform_default_create
                      example: all
                    sequence_number:
                      type: number
                      format: int32
                      minimum: 1
                      description: >-
                        Represents the ordinal position of this section within
                        the layout, controlling the order in which sections are
                        rendered on record forms.
                    actions_allowed:
                      $ref: '#/components/schemas/ActionsAllowed'
                      description: >-
                        Permissions for section operations. System sections
                        (Score, Visit Summary) will have restricted permissions.
                    tab_traversal:
                      type: string
                      description: >-
                        Indicates the direction of keyboard tab navigation
                        within this section, determining the order in which
                        focus moves between fields when users press Tab.
                        Possible values: `left_to_right` — focus moves
                        horizontally across columns first. `top_to_bottom` —
                        focus moves vertically down each column first.
                      enum:
                        - left_to_right
                        - top_to_bottom
                      example: left_to_right
                    api_name:
                      $ref: '#/components/schemas/ApiName'
                      description: API identifier for the section
                    column_count:
                      type: number
                      format: int32
                      description: >-
                        Indicates the number of columns in which fields are
                        arranged within this section, controlling the
                        side-by-side or single-column display of fields on
                        record forms.
                      enum:
                        - 1
                        - 2
                      example: 2
                    is_parent_section:
                      type: boolean
                      description: >-
                        Indicates whether this section acts as the parent
                        container for a dependent subform section, establishing
                        a hierarchical section relationship within the layout.
                        Possible values: `true` — this is a parent section;
                        `false` — this section is not a parent container.
                      example: false
                    name:
                      type: string
                      description: >-
                        Represents the internal name of the section used to
                        reference it in layout configurations and API
                        operations.
                      minLength: 1
                      maxLength: 50
                    generated_type:
                      type: string
                      description: >-
                        Indicates whether this section originates from automatic
                        system generation or from an administrator's manual
                        configuration. Possible values: `default` —
                        automatically generated by the CRM platform. `custom` —
                        defined manually by an administrator.
                      enum:
                        - default
                        - custom
                      example: custom
                    id:
                      $ref: '#/components/schemas/Id'
                    fields:
                      type: array
                      description: >-
                        Contains the ordered list of fields assigned to this
                        section. Fields are presented in ascending
                        sequence_number order.
                      maxItems: 500
                      items:
                        $ref: '#/components/schemas/FieldSchema'
                    properties:
                      oneOf:
                        - $ref: '#/components/schemas/SectionProperties'
                        - $ref: '#/components/schemas/TypeNull'
                  required:
                    - isSubformSection
                    - display_label
                    - mode
                    - sequence_number
                    - actions_allowed
                    - tab_traversal
                    - api_name
                    - column_count
                    - name
                    - generated_type
                    - id
                    - fields
              display_label:
                type: string
                description: >-
                  Represents the label of the layout as displayed in the CRM
                  interface, shown in layout selection dropdowns and record
                  settings.
                minLength: 1
                maxLength: 100
                example: Standard
              show_business_card:
                type: boolean
                description: >-
                  Indicates whether the business card view is enabled for this
                  layout, allowing a compact summary of key fields to be shown
                  in preview and lookup contexts. Possible values: `true` —
                  business card view is active; `false` — business card view is
                  not enabled.
                example: true
              actions_allowed:
                $ref: '#/components/schemas/LayoutActionsAllowed'
                description: >-
                  Permissions indicating which operations are allowed on this
                  layout
              modified_time:
                oneOf:
                  - x-zs-$id: LayoutModifiedTimeStructure
                    type: string
                    description: >-
                      Represents the ISO 8601 datetime with timezone offset
                      recording when this layout's configuration was most
                      recently changed.
                    format: date-time
                    example: '2024-05-17T09:15:56+05:30'
                  - $ref: '#/components/schemas/TypeNull'
              api_name:
                $ref: '#/components/schemas/ApiName'
                description: API name of the layout
                x-zs-$id: LayoutApiName
              name:
                type: string
                description: >-
                  Represents the internal API name of the layout, used as a
                  programmatic identifier in API operations and automation
                  configurations.
                minLength: 1
                maxLength: 40
                example: Standard
              modified_by:
                oneOf:
                  - $ref: '#/components/schemas/UserReference'
                    description: User who last modified the layout
                  - $ref: '#/components/schemas/TypeNull'
              generated_type:
                type: string
                description: >-
                  Indicates whether this layout originates from automatic system
                  generation or from an administrator's manual configuration.
                  Possible values: `system` — automatically generated by Zoho
                  CRM. `custom` — created manually by an administrator.
                enum:
                  - system
                  - custom
                example: system
              id:
                $ref: '#/components/schemas/Id'
                x-zs-$id: LayoutId
              total_profiles:
                type: number
                format: int32
                description: >-
                  Indicates the total number of CRM profiles associated with
                  this layout, which may exceed the number of profiles included
                  in the current response when has_more_profiles is true.
                example: 3
              status:
                type: string
                description: >-
                  Indicates the current operational status of the layout.
                  Possible values: `active` — the layout is in use and can be
                  assigned to profiles; `inactive` — the layout has been
                  deactivated and is not available for new assignments.
                enum:
                  - active
                  - inactive
                  - downgraded
                  - hidden
                example: active
            required:
              - has_more_profiles
              - created_time
              - visible
              - created_for
              - profiles
              - source
              - sections
              - display_label
              - show_business_card
              - actions_allowed
              - modified_time
              - api_name
              - name
              - modified_by
              - generated_type
              - id
              - status
      required:
        - layouts
    ErrorResponse:
      x-zs-$id: ErrorResponse
      type: object
      description: >-
        Represents the standard error response structure returned by the API
        when a request fails, containing a structured error code, a descriptive
        message, and a status indicator.
      required:
        - code
        - details
        - message
        - status
      properties:
        code:
          type: string
          description: >-
            Identifies the category of error returned by the API. Possible
            values: `REQUIRED_PARAM_MISSING` — a mandatory parameter was absent
            from the request; `DEPENDENT_PARAM_MISSING` — a parameter required
            by another supplied parameter was not provided; `INVALID_MODULE` —
            the specified module does not exist or is not accessible;
            `INVALID_DATA` — one or more field values failed validation;
            `NOT_SUPPORTED` — the requested operation is not supported for the
            target resource; `NOT_ALLOWED` — the operation is not permitted in
            the current context; `AUTHENTICATION_FAILURE` — the supplied
            credentials could not be verified; `OAUTH_SCOPE_MISMATCH` — the
            OAuth token does not carry the scope required for the operation;
            `INVALID_REQUEST_METHOD` — the HTTP method used is not accepted by
            the endpoint; `INTERNAL_ERROR` — an unexpected server-side failure
            occurred; `NO_PERMISSION` — the authenticated user lacks the CRM
            profile permission needed to perform the action.
          enum:
            - REQUIRED_PARAM_MISSING
            - DEPENDENT_PARAM_MISSING
            - INVALID_MODULE
            - INVALID_DATA
            - NOT_SUPPORTED
            - NOT_ALLOWED
            - AUTHENTICATION_FAILURE
            - OAUTH_SCOPE_MISMATCH
            - INVALID_REQUEST_METHOD
            - INTERNAL_ERROR
            - NO_PERMISSION
        details:
          $ref: '#/components/schemas/ErrorDetails'
        message:
          type: string
          description: >-
            Contains a short, descriptive explanation of the error condition,
            providing context that supplements the structured error code.
          maxLength: 1000
        status:
          type: string
          enum:
            - error
          description: >-
            Indicates the outcome of the request. Possible values: `error` — the
            request did not complete successfully and the response body contains
            error details.
      additionalProperties: false
    ErrorDetails:
      type: object
      description: >-
        Contains additional context-specific details accompanying an API error
        response, providing structured diagnostics such as the offending
        parameter name, expected data type, supported values, or dependency
        information.
      properties:
        param_name:
          type: string
          description: >-
            Identifies the specific request parameter whose value or absence
            triggered the error, enabling targeted correction of the offending
            input.
          maxLength: 100
          example: module
        id:
          $ref: '#/components/schemas/Id'
          description: Resource ID related to the error, if applicable.
        expected_data_type:
          type: string
          description: >-
            Indicates the data type that the API expects for the parameter that
            failed validation, enabling callers to correct the value format
            before retrying the request.
          maxLength: 50
          example: int64
        supported_values:
          type: array
          description: >-
            Contains the discrete values accepted for the parameter identified
            in the error, providing a reference set to correct the offending
            request.
          items:
            description: >-
              Represents one accepted value for the parameter that caused the
              error.
            type: string
            maxLength: 100
          maxItems: 10
          example:
            - delete
            - deactivate
        dependee:
          type: object
          description: >-
            Contains structured information about the controlling parameter
            whose presence or value is required before the missing dependent
            parameter becomes valid or applicable.
          additionalProperties: false
          properties:
            param_name:
              type: string
              description: >-
                Identifies the API parameter name of the dependee — the
                controlling parameter that must be supplied or satisfied to make
                the associated dependent parameter applicable in the request.
              maxLength: 100
              example: transfer_to
        resource_path_index:
          type: integer
          format: int32
          description: >-
            Indicates the zero-based position within a multi-segment URL path at
            which the invalid or unrecognised segment was detected, helping to
            locate the exact portion of the resource path that caused the error.
          example: 2
        permissions:
          type: array
          description: >-
            Contains the set of OAuth permission scopes that must be granted to
            the authenticating user or application before the requested action
            can be completed. Returned when the request is denied due to
            insufficient permissions.
          items:
            type: string
            description: >-
              Represents a single OAuth scope string that the caller must hold
              to perform the attempted operation.
            maxLength: 100
            example: Crm_Implied_Customize_Zoho_CRM
          maxItems: 20
          example:
            - Crm_Implied_Customize_Zoho_CRM
      additionalProperties: true
    LayoutErrorResponse:
      x-zs-$id: LayoutErrorResponse
      type: object
      description: >-
        Represents the layout-specific error response structure returned when
        one or more layouts in a batch operation fail, containing per-layout
        error entries.
      required:
        - layouts
      properties:
        layouts:
          type: array
          description: >-
            Contains the array of layout-specific error entries, each describing
            a failure encountered for an individual layout within a batch
            operation.
          items:
            type: object
            description: >-
              Represents the error details for a single layout within a batch
              operation that failed, including the error code, message, and
              status for that layout.
            required:
              - code
              - details
              - message
              - status
            properties:
              code:
                type: string
                description: >-
                  Represents the error classification code for the individual
                  layout operation failure, identifying the category of problem
                  encountered.
                enum:
                  - NOT_ALLOWED
                  - INVALID_DATA
              details:
                $ref: '#/components/schemas/LayoutErrorDetails'
              message:
                type: string
                description: >-
                  Contains a descriptive explanation of the error encountered
                  for this individual layout operation, providing context for
                  diagnosing the failure.
                maxLength: 1000
              status:
                type: string
                enum:
                  - error
                description: >-
                  Indicates the outcome of the layout operation. Possible
                  values: `error` — the layout operation did not complete
                  successfully.
            additionalProperties: false
          maxItems: 100
      additionalProperties: false
    LayoutErrorDetails:
      x-zs-$id: LayoutErrorDetails
      type: object
      description: >-
        Represents error details specific to layout operations, providing
        structured diagnostics such as the offending parameter name, JSON path,
        and any dependency or limit information relevant to the failure.
      properties:
        action:
          type: string
          description: >-
            Represents the operation that was being executed when the error
            occurred, providing context for diagnosing which layout action —
            such as update, delete, or deactivate — triggered the failure.
          maxLength: 255
          example: delete
        id:
          $ref: '#/components/schemas/Id'
          description: Resource ID related to the error, if applicable.
        resource_path_index:
          type: integer
          format: int32
          description: >-
            Indicates the zero-based position within the request resource path
            at which the invalid or unrecognised segment was detected, helping
            to locate the exact path segment that caused the layout operation
            error.
          example: 2
        param_name:
          type: string
          description: >-
            Identifies the specific request parameter whose value or absence
            caused the layout operation to fail, enabling targeted correction of
            the offending input.
          maxLength: 100
          example: transfer_to
      additionalProperties: true
    DeleteLayoutSuccessResponseBody:
      x-zs-$id: DeleteLayoutSuccessResponseBody
      type: object
      description: >-
        Represents the response body returned when one or more layouts are
        successfully deleted, containing per-layout deletion results.
      required:
        - layouts
      properties:
        layouts:
          type: array
          description: >-
            Contains one entry per layout included in the deletion request, each
            reporting the individual outcome — such as success or failure — for
            that specific layout.
          items:
            $ref: '#/components/schemas/DeleteLayoutResult'
          minItems: 1
          maxItems: 1
      additionalProperties: false
    DeleteLayoutResult:
      type: object
      description: >-
        Represents the outcome of a single layout deletion attempt within a
        batch operation, including a status code and descriptive message for
        that layout.
      required:
        - code
        - details
        - message
        - status
      properties:
        code:
          type: string
          description: >-
            Indicates the outcome code returned for the layout deletion attempt.
            Possible values: `SUCCESS` — the layout deletion completes
            successfully.
          enum:
            - SUCCESS
          example: SUCCESS
        details:
          $ref: '#/components/schemas/DeleteLayoutDetails'
        message:
          type: string
          description: >-
            Contains a descriptive message summarising the outcome of the layout
            deletion operation, providing context for both successful
            completions and failure conditions.
          example: layout deleted
          maxLength: 500
        status:
          type: string
          description: >-
            Represents the overall processing state of the layout deletion
            request. Possible values: `success` — the layout was removed as
            requested.
          enum:
            - success
          example: success
      additionalProperties: false
    DeleteLayoutDetails:
      type: object
      description: >-
        Represents the identifying details of a layout that has been
        successfully deleted, returned in the deletion response to confirm which
        layout was removed.
      required:
        - id
      properties:
        id:
          $ref: '#/components/schemas/Id'
          description: Unique identifier of the deleted layout.
      additionalProperties: false
    UpdateLayoutRequest:
      type: object
      description: >-
        Represents the request body for updating a layout, containing exactly
        one layout object with the configuration changes to apply.
      required:
        - layouts
      properties:
        layouts:
          type: array
          description: >-
            Contains exactly one layout object defining the update operations to
            be applied, including sections, profiles, and display settings.
          minItems: 1
          maxItems: 1
          items:
            $ref: '#/components/schemas/LayoutUpdateObject'
      additionalProperties: false
    LayoutUpdateObject:
      type: object
      description: >-
        Represents the layout configuration object supplied in an update
        request, containing at least one of the updatable attributes: name,
        sections, profiles, or business card display setting.
      minProperties: 1
      properties:
        name:
          type: string
          description: >-
            Represents the new display name for the layout. Must be unique
            within the module's layout configurations.
          minLength: 1
          maxLength: 255
          examples:
            - Updated CL1
            - Sales Layout V2
        show_business_card:
          type: boolean
          description: >-
            Specifies whether the business card view is enabled or disabled for
            this layout as part of the update.
          examples:
            - true
            - false
        profiles:
          type: array
          description: >-
            Contains the array of profile objects to be added to or removed from
            the layout's profile associations in this update operation.
          items:
            $ref: '#/components/schemas/ProfileUpdateObject'
          minItems: 1
          maxItems: 50
        sections:
          type: array
          description: >-
            Contains the array of section objects to be created, modified, or
            deleted as part of this layout update, defining the field and
            configuration changes within each section.
          items:
            $ref: '#/components/schemas/SectionUpdateObject'
          minItems: 1
          maxItems: 5
      additionalProperties: false
    ProfileUpdateObject:
      type: object
      description: >-
        Represents a profile operation object used in layout update requests to
        add a profile to or remove a profile from the layout's permission
        associations.
      required:
        - id
      properties:
        id:
          $ref: '#/components/schemas/Id'
          description: Unique identifier of the profile.
        _delete:
          type: boolean
          description: >-
            Indicates whether this profile's association with the layout should
            be removed. Possible values: `true` — the profile is disassociated
            from the layout; `false` — the profile association is retained or
            added.
          examples:
            - true
      additionalProperties: false
    SectionUpdateObject:
      type: object
      description: >-
        Represents a section operation object used in layout update requests to
        create, modify, or delete a section within the layout, including its
        label, field assignments, column count, and sequence.
      minProperties: 1
      properties:
        id:
          $ref: '#/components/schemas/Id'
          description: >-
            Unique identifier of the section. Required for updating or deleting
            existing sections. Omit when creating a new section.
        name:
          type: string
          description: >-
            Represents the internal API name of the section. Required when
            creating a new section through a layout update.
          minLength: 1
          maxLength: 255
          examples:
            - Custom Section 2
            - Address_Information
        display_label:
          type: string
          description: >-
            Represents the heading label of the section as displayed in the CRM
            interface. Required when creating a new section.
          minLength: 1
          maxLength: 255
          examples:
            - Custom Section 2
            - Address Information
        sequence_number:
          type: integer
          format: int32
          description: >-
            Indicates the one-based ordinal position of the section within the
            layout, controlling the order in which sections are rendered.
          minimum: 1
          maximum: 100
          examples:
            - 1
            - 6
        tab_traversal:
          type: string
          description: >-
            Specifies the tab key navigation direction within the section.
            Defines how focus moves between fields when users press Tab.
            Possible values: `left_to_right` — focus moves horizontally across
            columns first. `top_to_bottom` — focus moves vertically down each
            column first.
          enum:
            - left_to_right
            - top_to_bottom
          examples:
            - left_to_right
            - top_to_bottom
        column_count:
          type: integer
          format: int32
          description: >-
            Indicates the number of columns in which fields are arranged within
            this section when the layout is rendered on record forms.
          minimum: 1
          maximum: 2
          example: 1
        fields:
          type: array
          description: >-
            Contains the array of field operations to perform within this
            section, including adding, updating, creating, or removing field
            entries.
          items:
            $ref: '#/components/schemas/FieldUpdateObject'
          minItems: 1
          maxItems: 25
        _delete:
          $ref: '#/components/schemas/DeleteObject'
          description: >-
            Delete configuration for removing the section. When provided, the
            section identified by id will be deleted.
      additionalProperties: true
    FieldUpdateObject:
      type: object
      description: >-
        Represents a field operation object used in layout update requests to
        add, modify, create, or remove a field within a section.
      minProperties: 1
      properties:
        id:
          $ref: '#/components/schemas/Id'
          description: >-
            Unique identifier of an existing field. Required when adding,
            updating position, or removing an existing field. Omit when creating
            a new custom field.
        field_label:
          type: string
          description: >-
            Represents the display label shown for the field in the CRM
            interface. Required when creating a new custom field through a
            layout update.
          minLength: 1
          maxLength: 255
          examples:
            - CF1
            - Custom Text Field
        data_type:
          type: string
          description: >-
            Represents the data type of the field. Required when adding a new
            custom field to the layout. Possible values: `text`, `textarea`,
            `email`, `phone`, `website`, `integer`, `bigint`, `currency`,
            `double`, `percent`, `date`, `datetime`, `boolean`, `picklist`,
            `multiselectpicklist`, `lookup`, `multiselectlookup`, `autonumber`,
            `fileupload`, `imageupload`, `formula`, `rollup_summary`,
            `consent_lookup`, `profileimage`, `richtextarea`, `userlookup`,
            `multiuserlookup`, `event_reminder`.
          enum:
            - text
            - textarea
            - email
            - phone
            - website
            - integer
            - bigint
            - currency
            - double
            - percent
            - date
            - datetime
            - boolean
            - picklist
            - multiselectpicklist
            - lookup
            - multiselectlookup
            - autonumber
            - fileupload
            - imageupload
            - formula
            - rollup_summary
            - consent_lookup
            - profileimage
            - richtextarea
            - userlookup
            - multiuserlookup
            - event_reminder
          examples:
            - text
            - picklist
            - lookup
        length:
          type: integer
          format: int32
          description: >-
            Represents the maximum number of characters permitted for this
            field's value. Applicable to text and textarea field types.
          minimum: 1
          maximum: 32000
          examples:
            - 16
            - 255
            - 2000
        sequence_number:
          type: integer
          format: int32
          description: >-
            Represents the one-based ordinal position of the field within its
            containing section, controlling the rendering order of fields on
            record forms.
          minimum: 1
          examples:
            - 1
            - 2
            - 10
        element_type:
          type: string
          description: >-
            Represents the element type for special field components in the
            layout, distinguishing standard data fields from mirror fields.
            Possible values: `field` — a standard data field. `mirror_field` — a
            field that mirrors a value from a lookup source.
          enum:
            - field
            - mirror_field
          examples:
            - mirror_field
        lookup_field:
          type: object
          description: >-
            Represents the source lookup field from which a mirror field derives
            its value, establishing the cross-module field reference for mirror
            field creation.
          properties:
            id:
              $ref: '#/components/schemas/Id'
              description: Unique identifier of the source lookup field.
            api_name:
              type: string
              maxLength: 100
              description: >-
                Represents the API name of the source lookup field on which this
                mirror field is based.
              examples:
                - Account_Name
          additionalProperties: false
        _delete:
          $ref: '#/components/schemas/DeleteObject'
          description: >-
            Delete configuration for removing the field. Set permanent to false
            to move to unused section (can be re-added later), true to
            permanently delete the field and its data.
        association_details:
          $ref: '#/components/schemas/PatchAssociationDetails'
          description: >-
            Association details for Field-Of-Lookup (FOL) mapping. Links this
            field to a related field in another module through a lookup field.
      additionalProperties: false
    DeleteObject:
      type: object
      description: >-
        Represents the configuration object used to specify the deletion mode
        when removing a layout or resource, indicating whether the deletion is
        permanent or a soft delete to the recycle bin.
      required:
        - permanent
      properties:
        permanent:
          type: boolean
          description: >-
            Indicates whether the resource is removed irrecoverably or placed in
            the recycle bin for potential recovery. Possible values: `true` —
            the resource is permanently destroyed and cannot be restored;
            `false` — the resource is moved to trash and may be recovered before
            final purge.
          examples:
            - true
            - false
      additionalProperties: false
    PatchAssociationDetails:
      oneOf:
        - type: object
          x-zs-$id: PatchAssociationDetails
          description: >-
            Represents the association details for a Field-Of-Lookup
            relationship, providing the lookup field and the related field that
            together define the association being updated.
          properties:
            related_field:
              type: object
              description: >-
                Represents the related field on the associated module used to
                complete the lookup association, identifiable by its ID or API
                name.
              properties:
                api_name:
                  $ref: '#/components/schemas/ApiName'
                id:
                  $ref: '#/components/schemas/Id'
              additionalProperties: false
            lookup_field:
              type: object
              description: >-
                Represents the lookup field used to establish the association,
                identifiable by its ID, API name, or a combination of both.
              properties:
                api_name:
                  $ref: '#/components/schemas/ApiName'
                id:
                  $ref: '#/components/schemas/Id'
                reference_id:
                  $ref: '#/components/schemas/ReferenceId'
              additionalProperties: false
          required:
            - related_field
            - lookup_field
          additionalProperties: false
        - $ref: '#/components/schemas/TypeNull'
    UpdateLayoutSuccessResponse:
      x-zs-$id: UpdateLayoutSuccessResponse
      type: object
      description: >-
        Represents the successful response returned when a layout update
        operation completes, containing the per-layout update results.
      required:
        - layouts
      properties:
        layouts:
          type: array
          description: >-
            Contains the array of result entries for the layout update
            operation, each reporting the outcome for an individual layout.
          items:
            $ref: '#/components/schemas/LayoutUpdateSuccessResult'
          minItems: 1
          maxItems: 1
      additionalProperties: false
    LayoutUpdateSuccessResult:
      type: object
      description: >-
        Represents the success result returned when a layout update operation
        completes without error, containing a confirmation code, message, and
        the identifying details of the updated layout.
      required:
        - code
        - details
        - message
        - status
      properties:
        code:
          type: string
          description: >-
            Represents the success code returned when the layout update
            operation completes without error.
          enum:
            - SUCCESS
          example: SUCCESS
        details:
          type: object
          description: >-
            Contains the identifying details of the layout that was successfully
            updated, such as its ID.
          required:
            - id
          properties:
            id:
              $ref: '#/components/schemas/Id'
              description: Unique identifier of the updated layout.
          additionalProperties: false
        message:
          type: string
          description: >-
            Contains a confirmation message indicating that the layout update
            operation completed successfully.
          maxLength: 255
          example: layout updated
        status:
          type: string
          description: >-
            Indicates the outcome of the layout update operation. Possible
            values: `success` — the layout update completes successfully.
          enum:
            - success
          example: success
      additionalProperties: false
    UpdateLayoutErrorResponse:
      x-zs-$id: UpdateLayoutErrorResponse
      type: object
      description: >-
        Represents the error response returned for layout update operations that
        fail, containing either a wrapped per-layout error array or a top-level
        error code and message.
      properties:
        layouts:
          type: array
          description: >-
            Contains the array of layout-specific error results for batch layout
            update operations that encountered failures.
          items:
            $ref: '#/components/schemas/LayoutUpdateErrorResult'
          minItems: 1
          maxItems: 1
        code:
          type: string
          description: >-
            Represents the error classification code returned for layout update
            failures that are not wrapped in a layout-specific error array.
          maxLength: 255
          example: REQUIRED_PARAM_MISSING
        details:
          $ref: '#/components/schemas/ErrorDetails'
        message:
          type: string
          description: >-
            Contains a descriptive explanation of the layout update error that
            occurred.
          maxLength: 255
          example: One of the expected parameter is missing
        status:
          type: string
          description: >-
            Indicates the outcome of the layout update operation. Possible
            values: `error` — the operation did not complete successfully.
          enum:
            - error
          example: error
      additionalProperties: false
    LayoutUpdateErrorResult:
      type: object
      description: >-
        Represents the error result returned for a failed layout update
        operation, containing a classification code, descriptive message, and
        status indicator.
      required:
        - code
        - details
        - message
        - status
      properties:
        code:
          type: string
          description: >-
            Represents the error classification code returned for a failed
            layout update operation. Possible values: `INVALID_DATA` — a field
            value fails validation. `MANDATORY_NOT_FOUND` — a required field is
            absent. `NOT_ALLOWED` — the operation is not permitted for this
            field. `LIMIT_EXCEEDED` — a maximum count or size limit was
            exceeded. `DUPLICATE_DATA` — a duplicate value was detected.
            `EXPECTED_FIELD_MISSING` — a conditionally required field is absent.
            `DEPENDENT_FIELD_MISSING` — a dependent field required by another
            field is not provided. `DEPENDENT_MISMATCH` — a dependent field's
            value does not match the expected configuration. `NOT_SUPPORTED` —
            the operation is not supported for this field type.
            `FEATURE_NOT_SUPPORTED` — the requested feature is not available.
            `AMBIGUITY_DURING_PROCESSING` — conflicting references prevent
            unambiguous processing.
          enum:
            - INVALID_DATA
            - MANDATORY_NOT_FOUND
            - NOT_ALLOWED
            - LIMIT_EXCEEDED
            - DUPLICATE_DATA
            - EXPECTED_FIELD_MISSING
            - DEPENDENT_FIELD_MISSING
            - DEPENDENT_MISMATCH
            - NOT_SUPPORTED
            - FEATURE_NOT_SUPPORTED
            - AMBIGUITY_DURING_PROCESSING
          example: INVALID_DATA
        details:
          $ref: '#/components/schemas/LayoutUpdateErrorDetails'
        message:
          type: string
          description: >-
            Contains a descriptive explanation of the error encountered during
            the layout update operation.
          maxLength: 1000
          example: the id given seems to be invalid
        status:
          type: string
          description: >-
            Indicates the outcome of the layout update operation. Possible
            values: `error` — the operation did not complete successfully.
          enum:
            - error
          example: error
      additionalProperties: false
    LayoutUpdateErrorDetails:
      type: object
      description: >-
        Represents the structured error details for a layout update failure,
        providing diagnostic information such as the offending field's JSON path
        and API name, dependency violations, ambiguity sources, limit breaches,
        and expected field constraints.
      properties:
        api_name:
          type: string
          description: >-
            Represents the API name of the field whose value or configuration
            caused the layout update error.
          maxLength: 100
          example: id
        json_path:
          type: string
          description: >-
            Represents the JSON path to the field within the layout update
            request payload that caused the error, enabling precise
            identification of the offending input.
          maxLength: 500
          example: $.layouts[0].sections[0].fields[0].id
        expected_data_type:
          type: string
          description: >-
            Indicates the data type that the API expected for the field that
            failed validation during the layout update.
          maxLength: 50
          example: text
        maximum_length:
          type: integer
          format: int32
          description: >-
            Indicates the maximum character length allowed for the field that
            failed validation during the layout update.
          example: 255
        limit:
          type: integer
          format: int32
          description: >-
            Indicates the maximum allowed value or count that was exceeded
            during the layout update, providing the threshold value for the
            violated constraint.
          example: 100
        dependee:
          type: object
          description: >-
            Contains information about the dependent field that caused a
            mismatch or dependency violation during the layout update operation.
          properties:
            api_name:
              type: string
              description: >-
                Represents the API name of the dependent field involved in the
                layout update dependency error.
              maxLength: 100
              example: length
            json_path:
              type: string
              description: >-
                Represents the JSON path to the dependent field within the
                layout update request payload.
              maxLength: 500
              example: $.layouts[0].sections[0].fields[0].length
          additionalProperties: false
        limit_due_to:
          type: array
          description: >-
            Contains the list of fields responsible for causing a limit to be
            exceeded during the layout update, identifying which fields
            contributed to the constraint violation.
          items:
            type: object
            description: >-
              Represents a single field reference that caused the layout update
              limit to be exceeded, including its API name and JSON path.
            required:
              - api_name
              - json_path
            properties:
              api_name:
                type: string
                description: >-
                  Represents the API name of the field that contributed to
                  exceeding the layout update limit.
                maxLength: 100
                example: id
              json_path:
                type: string
                description: >-
                  Represents the JSON path to the field within the layout update
                  request payload that contributed to exceeding the limit.
                maxLength: 500
                example: >-
                  $.layouts[0].sections[0].fields[0].association_details.lookup_field.id
            additionalProperties: false
          maxItems: 10
        ambiguity_due_to:
          type: array
          description: >-
            Contains the list of fields that caused an ambiguity error during
            layout update processing, identifying conflicting or duplicate field
            references in the request.
          items:
            type: object
            description: >-
              Represents a single field reference that contributed to the
              ambiguity error, providing its API name and JSON path within the
              request payload.
            required:
              - api_name
              - json_path
            properties:
              api_name:
                type: string
                description: >-
                  Represents the API name of the field that contributed to the
                  layout update ambiguity error.
                maxLength: 100
                example: id
              json_path:
                type: string
                description: >-
                  Represents the JSON path to the field within the layout update
                  request payload that contributed to the ambiguity error.
                maxLength: 500
                example: >-
                  $.layouts[0].sections[0].fields[0].association_details.related_field.id
            additionalProperties: false
          maxItems: 10
        expected_fields:
          type: array
          description: >-
            Contains the list of fields of which at least one must be provided
            for the layout update to proceed, describing a conditional required
            field constraint.
          items:
            type: object
            description: >-
              Represents a single field from the set of conditionally required
              fields, identifying which field is expected but missing from the
              layout update request.
            required:
              - api_name
              - json_path
            properties:
              api_name:
                type: string
                description: >-
                  Represents the API name of the expected field that is missing
                  from the layout update request.
                maxLength: 100
                example: id
              json_path:
                type: string
                description: >-
                  Represents the JSON path to the expected field within the
                  layout update request payload.
                maxLength: 500
                example: >-
                  $.layouts[0].sections[0].fields[0].association_details.related_field.id
            additionalProperties: false
          maxItems: 10
      additionalProperties: true
