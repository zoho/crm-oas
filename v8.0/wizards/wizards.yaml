                      - error
                    description: Status indicating failure.
                required:
                  - code
                  - details
                  - message
                  - status
              examples:
                NoPermission:
                  summary: User lacks permission to delete wizards.
                  value:
                    code: NO_PERMISSION
                    details:
                      permissions:
                        - 'Zoho CRM: Settings Permission'
                    message: Permission denied to delete wizards
                    status: error
                  description: >-
                    Shows a 403 error response when the user's profile does not
                    have permission to delete wizards.
          headers:
            X-API-CREDITS-REMAINING:
              schema:
                type: string
                format: int64
                description: >
                  Present when >=50% of base daily credits (excluding add-on
                  credits) are consumed. Value is total remaining credits
                  including add-on credits for the rolling 24-hour window.
                pattern: ^[0-9]+$
                minLength: 1
                maxLength: 19
              required: false
        '404':
          description: >-
