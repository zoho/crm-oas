                                            additionalProperties: true
                                            description: >-
                                              Use this form when referencing a screen
                                              by a temporary reference_id within the
                                              same request.
                                            x-zs-$id: ScreenReferenceByReferenceIdForNodes
                                            required:
                                              - reference_id
                                    required:
                                      - pos_x
                                      - pos_y
                                      - start_node
                                      - screen
                                connections:
                                  type: array
                                  description: >-
