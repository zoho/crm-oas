                                            maxLength: 19
                                            format: int64
                                            pattern: ^[0-9]+$
                                            minLength: 1
                                          reference_id:
                                            type: string
                                            maxLength: 50
                                            pattern: \{\{[a-zA-Z0-9]+\}\}
                                            description: >-
