      responses:
        '201':
          description: The response body after a successful wizard creation.
          content:
            application/json:
              schema:
                x-zs-$id: CreateWizardResponse
                description: >-
                  The definition of the response body structure after a
                  successful wizard creation.
                additionalProperties: false
                type: object
                properties:
                  wizards:
                    description: The wizards that have been created.
                    maxItems: 1
                    type: array
                    items:
                      description: Each wizard created using the API.
                      additionalProperties: false
                      type: object
                      properties:
                        status:
                          description: >-
                            This describes whether the wizard creation was
                            successful or not.
                          type: string
                          enum:
                            - success
                        code:
                          description: >-
                            This represents the success or error codes of the
                            request.
                          type: string
                          enum:
                            - SUCCESS
                        message:
                          description: >-
                            This describes the message returned from the server
                            after wizard a successful wizard creation.
                          type: string
                          maxLength: 255
                        details:
                          description: >-
                            Additional information about the request payload
                            after successful execution.
                          additionalProperties: false
                          type: object
                          properties:
                            id:
                              type: string
                              description: Numeric unique identifier of the wizard.
                              maxLength: 19
                              format: int64
                              x-zs-$id: CreatedWizardId
                              pattern: ^[0-9]+$
                              minLength: 1
                          required:
                            - id
                      required:
                        - status
                        - code
                        - message
                        - details
                required:
                  - wizards
              examples:
                ValidWizardCreation:
                  summary: Valid request creating a wizard with 3 screens
                  value:
                    wizards:
                      - code: SUCCESS
                        details:
                          id: '1111130000001064593'
                        message: Wizard created successfully
                        status: success
                  description: >-
                    Shows the success response after creating a wizard,
                    including the unique ID of the newly created wizard.
          headers:
            X-API-CREDITS-REMAINING:
              schema:
                type: string
                format: int64
                description: >
                  Present when >=50% of base daily credits (excluding add-on
                  credits) are consumed. Value is total remaining credits
                  including add-on credits for the rolling 24-hour window.
                pattern: ^[0-9]+$
                minLength: 1
                maxLength: 19
              required: false
        '400':
          description: >-
            Bad Request. The wizard definition is invalid or fails one or more
            validation checks.
          content:
            application/json:
              schema:
                description: Validation error response returned when wizard creation fails.
                x-zs-$id: CreateWizardErrorResponses
                oneOf:
                  - type: object
                    x-zs-$id: CreateWizardWrappedValidationErrors
                    description: >-
                      Per-wizard validation errors returned when the request
                      contains one or more wizard definitions.
                    additionalProperties: false
                    properties:
                      wizards:
                        description: >-
                          List of validation results for each wizard in the
                          request body.
                        type: array
                        maxItems: 1
                        items:
                          description: Validation error object for a wizard field.
                          oneOf:
                            - type: object
                              x-zs-$id: CreateWizardWrappedDependentFieldMissingError
                              description: >-
                                Validation error when a dependent field is
                                missing.
                              additionalProperties: false
                              properties:
                                status:
                                  type: string
                                  enum:
                                    - error
                                  description: Indicates that the request failed.
                                code:
                                  type: string
                                  enum:
                                    - DEPENDENT_FIELD_MISSING
                                  description: >-
