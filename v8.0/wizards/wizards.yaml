                  including add-on credits for the rolling 24-hour window.
                pattern: ^[0-9]+$
                minLength: 1
                maxLength: 19
              required: false
        '401':
          description: Authentication credentials are missing or invalid.
          content:
            application/json:
              schema:
                x-zs-$id: DeleteWizardUnauthorizedErrorResponse
                oneOf:
                  - type: object
                    x-zs-$id: DeleteWizardOauthScopeMismatchError
                    description: >-
                      Error returned when the OAuth token does not have the
                      required scope.
                    additionalProperties: false
                    properties:
                      code:
                        type: string
                        enum:
                          - OAUTH_SCOPE_MISMATCH
                        description: Error code indicating OAuth scope mismatch.
                      details:
                        type: object
                        additionalProperties: false
                        description: Empty details object.
                      message:
                        type: string
                        description: Human-readable error message.
                        maxLength: 255
                      status:
                        type: string
                        enum:
                          - error
                        description: Status indicating failure.
                    required:
                      - code
                      - details
                      - message
                      - status
                  - type: object
                    x-zs-$id: DeleteWizardInvalidTokenError
                    description: Error returned when the OAuth token is invalid or expired.
                    additionalProperties: false
                    properties:
                      code:
                        type: string
                        enum:
                          - INVALID_TOKEN
                        description: Error code indicating an invalid token.
                      details:
                        type: object
                        additionalProperties: false
                        description: Empty details object.
                      message:
                        type: string
                        description: Human-readable error message.
                        maxLength: 255
                      status:
                        type: string
                        enum:
                          - error
                        description: Status indicating failure.
                    required:
                      - code
                      - details
                      - message
                      - status
                description: >-
                  Represents the error response returned when authentication
                  credentials are missing or invalid.
              examples:
                OauthScopeMismatch:
                  summary: OAuth token lacks ZohoCRM.settings.wizards.DELETE scope.
                  value:
                    code: OAUTH_SCOPE_MISMATCH
                    details: {}
                    message: invalid oauth scope to access this URL
                    status: error
                  description: >-
                    Shows a 401 error response when the access token does not
                    include the ZohoCRM.settings.wizards.DELETE scope.
                InvalidToken:
                  summary: OAuth token is invalid or expired.
                  value:
                    code: INVALID_TOKEN
                    details: {}
                    message: invalid oauth token
                    status: error
                  description: >-
                    Shows a 401 error response when the access token provided is
                    invalid or has expired.
          headers:
            X-API-CREDITS-REMAINING:
              schema:
                type: string
                format: int64
                description: >
                  Present when >=50% of base daily credits (excluding add-on
                  credits) are consumed. Value is total remaining credits
                  including add-on credits for the rolling 24-hour window.
                pattern: ^[0-9]+$
                minLength: 1
                maxLength: 19
              required: false
        '403':
          description: The authenticated user does not have permission to delete wizards.
          content:
            application/json:
              schema:
                type: object
                x-zs-$id: DeleteWizardForbiddenError
                description: >-
                  Error returned when the user lacks permission to perform the
