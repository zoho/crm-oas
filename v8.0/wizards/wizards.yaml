                                                  type: array
                                                  description: >-
                                                    Represents the list of client portal
                                                    user types that are exempted from the
                                                    conditional rule action on the screen.
                                                  maxItems: 500
                                                  items:
                                                    type: object
                                                    description: >-
                                                      Represents a client portal user type
                                                      that is exempted from the conditional
                                                      rule action on the screen.
                                                    additionalProperties: false
                                                    properties:
                                                      id:
                                                        type: string
                                                        description: >-
                                                          Represents the unique numeric identifier
                                                          of the portal user type that is exempted
                                                          from the conditional rule action.
                                                        maxLength: 19
                                                        format: int64
                                                      name:
                                                        type: string
                                                        maxLength: 255
                                                        description: >-
                                                          Represents the display name of the
                                                          portal user type that is exempted from
                                                          the conditional rule action.
                                              required:
                                                - id
                                                - type
