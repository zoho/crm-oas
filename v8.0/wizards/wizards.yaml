                                          - type: object
                                            x-zs-$id: ScreenReferenceByReferenceId
                                            additionalProperties: true
                                            description: >-
                                              Use this when the connection points to a
                                              screen addressed by reference within the
                                              same request.
                                            required:
                                              - reference_id
                                    required:
                                      - source_button
                                      - target_screen
