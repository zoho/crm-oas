    patch:
      operationId: updateWizard
      description: >-
        Updates the specified wizard including screens, containers, field
        configurations, and rules - based on the data provided in the request.
      summary: Wizard
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        content:
          application/json:
            schema:
              x-zs-$id: UpdateWizardRequest
              type: object
              description: Request body to update an existing wizard configuration.
              additionalProperties: false
              properties:
                wizards:
                  type: array
                  description: >-
                    List of wizard definitions to be updated. Only one wizard
                    can be updated per request.
                  maxItems: 1
                  items:
                    type: object
                    description: Wizard definition payload for update.
                    additionalProperties: false
                    properties:
                      module:
                        type: object
                        description: >-
                          Module information for which the wizard is configured.
                          Either api_name or id must be provided.
                        additionalProperties: false
                        properties:
                          api_name:
                            description: >-
                              API name of the module. Any valid module API name
                              is allowed.
                            x-zs-$ref:
                              resource: modules
                              origins:
                                - operationId: getModules
                                  propertyId: ModulesApiName
                            type: string
                            maxLength: 50
                          id:
                            description: Numeric unique identifier of the module.
                            x-zs-$ref:
                              resource: modules
                              origins:
                                - operationId: getModules
                                  propertyId: ModulesId
                            type: string
                            format: int64
                            pattern: ^[0-9]+$
                            minLength: 1
                            maxLength: 19
                        anyOf:
                          - type: object
                            description: Module is specified using its API name.
                            required:
                              - api_name
                            additionalProperties: true
                          - type: object
                            description: Module is specified using its unique identifier.
                            required:
                              - id
                            additionalProperties: true
                      name:
                        type: string
                        maxLength: 30
                        description: Unique name of the wizard used in the API.
                      portal_user_types:
                        type: array
                        description: >-
                          Client portal user types that are allowed to access
                          the wizard.
                        maxItems: 500
                        items:
                          type: object
                          description: Portal user type allowed to access the wizard.
                          additionalProperties: false
                          properties:
                            name:
                              type: string
                              maxLength: 255
                              description: Internal name of the portal user type.
                            id:
                              type: string
                              description: >-
                                Numeric unique identifier of the portal user
                                type.
                              maxLength: 19
                              format: int64
                              pattern: ^[0-9]+$
                              minLength: 1
                            _delete:
                              type: boolean
                              description: >-
                                Specify `true` to remove this existing portal
                                user type from the wizard.
                          required:
                            - id
                      profiles:
                        type: array
                        description: Profiles allowed to access the wizard.
                        maxItems: 500
                        items:
                          type: object
                          description: Profile that can access the wizard.
                          additionalProperties: false
                          properties:
                            name:
                              type: string
                              maxLength: 255
                              description: Name of the profile.
                            id:
                              description: Numeric unique identifier of the profile.
                              x-zs-$ref:
                                resource: profiles
                                origins:
                                  - operationId: getProfiles
                                    propertyId: ProfileId
                              type: string
                              format: int64
                              pattern: ^[0-9]{1,19}$
                              minLength: 1
                              maxLength: 19
                              example: '4832675000000850800'
                            _delete:
                              type: boolean
                              description: >-
                                Specify `true` to remove this existing profile
                                from the wizard.
                          required:
                            - id
                      active:
                        type: boolean
                        description: Indicates whether the wizard is active.
                      containers:
                        type: array
                        description: >-
                          Containers that bind a layout to its wizard screens
                          and chart definition.
                        maxItems: 7
                        items:
                          type: object
                          description: >-
                            Container that links a layout with its screens and
                            chart data for this wizard.
