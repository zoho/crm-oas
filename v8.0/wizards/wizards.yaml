    delete:
      operationId: deleteWizards
      description: Deletes the specified wizard configuration.
      summary: Wizard
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Wizard deleted successfully.
          content:
            application/json:
              schema:
                x-zs-$id: WizardDeletedResponse
                description: Response returned when a wizard is deleted successfully.
                type: object
                additionalProperties: false
                properties:
                  wizards:
                    description: >-
                      List of delete operation results, one entry per wizard in
                      the request.
                    type: array
                    maxItems: 1
                    items:
                      description: Result of deleting a single wizard.
                      type: object
                      additionalProperties: false
                      properties:
                        status:
                          description: Indicates that the delete operation was successful.
                          type: string
                          enum:
                            - success
                          maxLength: 7
                        code:
                          description: Operation result code.
                          type: string
                          enum:
                            - SUCCESS
                          maxLength: 7
                        message:
                          description: >-
                            Human-readable message describing the result of the
                            delete operation.
                          type: string
                          maxLength: 255
                        details:
                          description: Additional information about the deleted wizard.
                          type: object
                          additionalProperties: false
                          properties:
                            id:
                              type: string
                              description: Numeric unique identifier of the deleted wizard.
                              maxLength: 19
                              format: int64
                              pattern: ^[0-9]+$
                              minLength: 1
                          required:
                            - id
                      required:
                        - status
                        - code
                        - message
                        - details
                required:
                  - wizards
              examples:
                WizardDeleted:
                  summary: Wizard deleted successfully.
                  value:
                    wizards:
                      - code: SUCCESS
                        details:
                          id: '1111130000000104566'
                        message: wizard deleted successfully
                        status: success
                  description: >-
                    Shows the success response after deleting a wizard,
                    including the wizard ID in the details.
          headers:
            X-API-CREDITS-REMAINING:
              schema:
                type: string
                format: int64
                description: >
                  Present when >=50% of base daily credits (excluding add-on
                  credits) are consumed. Value is total remaining credits
                  including add-on credits for the rolling 24-hour window.
                pattern: ^[0-9]+$
                minLength: 1
                maxLength: 19
              required: false
        '400':
          description: Bad request. The wizard ID provided in the request is invalid.
          content:
            application/json:
              schema:
                x-zs-$id: InvalidWizardIdErrorResponse
                type: object
                description: >-
                  Error response returned when the wizard ID passed to the
                  delete API is invalid.
                additionalProperties: false
                properties:
                  code:
