                                                    Possible values include set_mandatory,
                                                    make_read_only, hide, and show.
                                                field:
                                                  type: object
                                                  additionalProperties: false
                                                  description: >-
                                                    Represents the wizard screen field to
                                                    which the conditional rule action is
