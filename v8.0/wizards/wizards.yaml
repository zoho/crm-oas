                  description: >-
                    Shows a 400 error response when a nested field value in the
                    wizard payload fails validation.
                WrappedMandatoryNotFound:
                  summary: Wrapped mandatory field missing — e.g., module not provided
                  value:
                    wizards:
                      - code: MANDATORY_NOT_FOUND
                        details:
                          api_name: module
                          json_path: $.wizards[0].module
                        message: Required field is missing
                        status: error
                  description: >-
                    Shows a 400 error response when a required nested field is
                    missing from the wizard creation request.
                WrappedDependentFieldMissing:
                  summary: >-
                    Wrapped dependent field missing — e.g., conditional rules
                    depend on screens
                  value:
                    wizards:
                      - code: DEPENDENT_FIELD_MISSING
                        details:
                          api_name: conditional_rules
                          json_path: $.wizards[0].screens[0].conditional_rules
                          dependee:
                            api_name: screens
                            json_path: $.wizards[0].screens
                        message: Dependent field missing
                        status: error
                  description: >-
                    Shows a 400 error response when a nested field in the wizard
                    payload depends on another field that is missing.
                TopLevelDependentFieldMissing:
                  summary: Top-level dependent field missing error
                  value:
                    status: error
                    code: DEPENDENT_FIELD_MISSING
                    message: Dependent field missing
                    details:
                      api_name: screens
                      json_path: $.wizards[0].screens
                      dependee:
                        api_name: module
                        json_path: $.wizards[0].module
                  description: >-
                    Shows a 400 error response when a top-level field depends on
                    another field that is missing from the request.
                TopLevelDuplicateData:
                  summary: >-
                    Top-level duplicate data error — e.g., wizard name already
                    exists
                  value:
                    status: error
                    code: DUPLICATE_DATA
                    message: Duplicate wizard name
                    details:
                      api_name: name
                      json_path: $.wizards[0].name
                  description: >-
                    Shows a 400 error response when duplicate data is detected
                    at the top level of the wizard creation request.
          headers:
            X-API-CREDITS-REMAINING:
              schema:
                type: string
                format: int64
                description: >
                  Present when >=50% of base daily credits (excluding add-on
                  credits) are consumed. Value is total remaining credits
                  including add-on credits for the rolling 24-hour window.
                pattern: ^[0-9]+$
                minLength: 1
                maxLength: 19
              required: false
        '401':
          description: Authentication credentials are missing or invalid.
          content:
            application/json:
              schema:
                x-zs-$id: CreateWizardUnauthorizedErrorResponse
                oneOf:
                  - type: object
                    x-zs-$id: CreateWizardOauthScopeMismatchError
                    description: >-
                      Error returned when the OAuth token does not have the
                      required scope.
                    additionalProperties: false
                    properties:
                      code:
                        type: string
                        enum:
                          - OAUTH_SCOPE_MISMATCH
                        description: Error code indicating OAuth scope mismatch.
                      details:
                        type: object
                        additionalProperties: false
                        description: Empty details object.
                      message:
                        type: string
                        description: Human-readable error message.
                        maxLength: 255
                      status:
                        type: string
                        enum:
                          - error
                        description: Status indicating failure.
                    required:
                      - code
                      - details
                      - message
                      - status
                  - type: object
                    x-zs-$id: CreateWizardInvalidTokenError
                    description: Error returned when the OAuth token is invalid or expired.
                    additionalProperties: false
                    properties:
                      code:
                        type: string
                        enum:
                          - INVALID_TOKEN
                        description: Error code indicating an invalid token.
                      details:
                        type: object
                        additionalProperties: false
                        description: Empty details object.
                      message:
                        type: string
                        description: Human-readable error message.
                        maxLength: 255
                      status:
                        type: string
                        enum:
                          - error
                        description: Status indicating failure.
                    required:
                      - code
                      - details
                      - message
                      - status
                description: >-
                  Represents the error response returned when authentication
                  credentials are missing or invalid.
              examples:
                OauthScopeMismatch:
                  summary: OAuth token lacks ZohoCRM.settings.wizards.CREATE scope.
                  value:
                    code: OAUTH_SCOPE_MISMATCH
                    details: {}
                    message: invalid oauth scope to access this URL
                    status: error
                  description: >-
                    Shows a 401 error response when the access token does not
                    include the ZohoCRM.settings.wizards.CREATE scope.
                InvalidToken:
                  summary: OAuth token is invalid or expired.
                  value:
                    code: INVALID_TOKEN
                    details: {}
                    message: invalid oauth token
                    status: error
                  description: >-
                    Shows a 401 error response when the access token provided is
                    invalid or has expired.
          headers:
            X-API-CREDITS-REMAINING:
              schema:
                type: string
                format: int64
                description: >
                  Present when >=50% of base daily credits (excluding add-on
                  credits) are consumed. Value is total remaining credits
                  including add-on credits for the rolling 24-hour window.
                pattern: ^[0-9]+$
                minLength: 1
                maxLength: 19
              required: false
        '403':
          description: The authenticated user does not have permission to create wizards.
          content:
            application/json:
              schema:
                type: object
                x-zs-$id: CreateWizardForbiddenError
                description: >-
                  Error returned when the user lacks permission to perform the
                  operation.
                additionalProperties: false
                properties:
                  code:
                    type: string
                    enum:
                      - NO_PERMISSION
                    description: Error code indicating insufficient permissions.
                  details:
                    type: object
                    description: Details about the required permissions.
                    additionalProperties: false
                    required:
                      - permissions
                    properties:
                      permissions:
                        type: array
                        maxItems: 50
                        items:
                          type: string
                          maxLength: 255
                          description: >-
                            Name of the permission required to access this
                            resource.
                        description: List of permissions required.
                  message:
                    type: string
                    description: Human-readable error message.
                    maxLength: 255
                  status:
                    type: string
                    enum:
                      - error
                    description: Status indicating failure.
                required:
                  - code
                  - details
                  - message
                  - status
              examples:
                NoPermission:
                  summary: User lacks permission to create wizards.
                  value:
                    code: NO_PERMISSION
                    details:
                      permissions:
                        - 'Zoho CRM: Settings Permission'
                    message: Permission denied to create wizards
                    status: error
                  description: >-
                    Shows a 403 error response when the user's profile does not
                    have permission to create wizards.
          headers:
            X-API-CREDITS-REMAINING:
              schema:
                type: string
                format: int64
                description: >
                  Present when >=50% of base daily credits (excluding add-on
                  credits) are consumed. Value is total remaining credits
                  including add-on credits for the rolling 24-hour window.
                pattern: ^[0-9]+$
                minLength: 1
                maxLength: 19
              required: false
        '404':
          description: Returned when the requested URL does not match any valid endpoint.
          content:
            application/json:
              schema:
                description: Schema for URL-related errors.
                x-zs-$id: CreateWizardErrorResponses404
                oneOf:
                  - description: >-
                      Returned when the URL format is incorrect or not
                      recognized.
                    type: object
                    x-zs-$id: CreateWizardErrorResponse404
                    additionalProperties: false
                    properties:
                      status:
                        type: string
                        enum:
                          - error
                        description: Indicates that the request failed.
                      code:
                        type: string
                        enum:
                          - INVALID_URL_PATTERN
                        description: >-
                          Error code indicating that the requested URL is
                          invalid.
                      message:
                        type: string
                        maxLength: 255
                        description: >-
                          Human-readable explanation of why the URL was
                          rejected.
                      details:
                        type: object
                        description: Additional contextual error information, if any.
                        additionalProperties: false
                    required:
                      - status
                      - code
                      - message
                      - details
              examples:
                InvalidUrlPattern:
                  summary: Example of invalid URL usage.
                  value:
                    code: INVALID_URL_PATTERN
                    details: {}
                    message: Please check if the URL trying to access is a correct one
                    status: error
                  description: >-
                    Shows a 404 error response when the request URL does not
                    match a valid endpoint pattern.
          headers:
            X-API-CREDITS-REMAINING:
              schema:
                type: string
                format: int64
                description: >
                  Present when >=50% of base daily credits (excluding add-on
                  credits) are consumed. Value is total remaining credits
                  including add-on credits for the rolling 24-hour window.
                pattern: ^[0-9]+$
                minLength: 1
                maxLength: 19
              required: false
      security:
        - OAuth2:
            - ZohoCRM.settings.wizards.CREATE
  /settings/wizards/{id}:
    get:
      operationId: getWizardDetails
      summary: Get wizard details
      description: >-
        To retrieve the complete configuration of a single wizard in your Zoho
        CRM organization, including its containers, screens, segments, buttons,
        and conditional rules.
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/LayoutId'
      responses:
        '200':
          description: >-
            Returns the detailed configuration of the specified wizard,
            including its containers, screens, segments, buttons, conditional
            rules, and associated metadata.
          content:
            application/json:
              schema:
                type: object
                x-zs-$id: GetWizardDetailResponse
                description: >-
                  Represents the response body containing the wizard
                  configuration for the requested identifier.
                additionalProperties: false
                properties:
                  wizards:
                    type: array
                    description: >-
                      Represents the list of wizards in the response. For this
                      operation, the array contains exactly one wizard object
                      corresponding to the requested identifier.
                    maxItems: 1
                    items:
                      type: object
                      description: >-
                        Represents a wizard object containing its complete
                        configuration, including its associated module, active
                        status, and the containers that define the multi-step
                        screen flow.
                      additionalProperties: false
                      properties:
                        created_time:
                          type: string
                          format: date-time
                          description: >-
                            Represents the timestamp when Zoho CRM created the
                            wizard.
                        modified_time:
                          type: string
                          format: date-time
                          description: >-
                            Represents the timestamp when Zoho CRM last modified
                            the wizard.
                        display_label:
                          type: string
                          maxLength: 255
                          description: >-
                            Represents the display label of the wizard,
                            translated into the available locale where
                            applicable.
                        portal_user_types:
                          description: >-
                            Represents the client portal user types for which
                            the wizard is available.
                          type:
                            - array
                            - 'null'
                          maxItems: 50
                          items:
                            type: object
                            description: Portal user type associated with this wizard.
                            additionalProperties: false
                            properties:
                              display_label:
                                type: string
                                maxLength: 255
                                description: >-
                                  Represents the display label of the portal
                                  user type.
                              name:
                                type: string
                                maxLength: 255
                                description: Represents the name of the portal user type.
                              id:
                                type: string
                                description: >-
                                  Represents the unique identifier of the portal
                                  user type.
                                maxLength: 19
                                format: int64
                                pattern: ^[0-9]+$
                                minLength: 1
                            required:
                              - display_label
                              - name
                              - id
                        module:
                          type: object
                          description: >-
                            Represents the Zoho CRM module associated with the
                            wizard.
                          additionalProperties: false
                          properties:
                            api_name:
                              type: string
                              maxLength: 50
                              description: >-
                                Represents the API name of the Zoho CRM module
                                associated with the wizard.
                            id:
                              type: string
                              description: >-
                                Represents the unique identifier of the Zoho CRM
                                module associated with the wizard.
                              maxLength: 19
                              format: int64
                              pattern: ^[0-9]+$
                              minLength: 1
                          required:
                            - api_name
                            - id
                        name:
                          type: string
                          maxLength: 30
                          description: Represents the API name of the wizard.
                        modified_by:
                          type:
                            - object
                            - 'null'
                          description: Represents the user who last modified the wizard.
                          additionalProperties: false
                          properties:
                            name:
                              type: string
                              maxLength: 255
                              description: Name of the user who last modified the wizard.
                            id:
                              type: string
                              description: >-
                                Represents the unique identifier of the user who
                                last modified the wizard.
                              maxLength: 19
                              format: int64
                              pattern: ^[0-9]+$
                              minLength: 1
                          required:
                            - name
                            - id
                        profiles:
                          type:
                            - array
                            - 'null'
                          description: >-
                            Represents the Zoho CRM profiles for which the
                            wizard is available.
                          maxItems: 50
                          items:
                            type: object
                            additionalProperties: false
                            description: >-
                              Represents a CRM profile associated with the
                              wizard.
                            properties:
                              display_label:
                                type: string
                                maxLength: 255
                                description: >-
                                  Represents the display label of the profile,
                                  translated into the available locale where
                                  applicable.
                              name:
                                type: string
                                maxLength: 255
                                description: Name of the profile.
                              id:
                                type: string
                                description: >-
                                  Represents the unique identifier of the
                                  profile.
                                maxLength: 19
                                format: int64
                                pattern: ^[0-9]+$
                                minLength: 1
                            required:
                              - display_label
                              - name
                              - id
                        active:
                          type: boolean
                          description: >-
                            Indicates whether the wizard is currently active.


                            Possible values:

                            true - The wizard is active and available for use in
                            the CRM module.

                            false - The wizard is inactive and not available for
                            use.
                        source:
                          description: Indicates the source that originated the wizard.
                          type: string
                          maxLength: 50
                          enum:
                            - crm
                            - platform_plugin
                            - marketplace_plugin
                        containers:
                          type: array
                          description: >-
                            Represents the list of containers associated with
                            the wizard. Each container links a specific layout
                            to the screens and segments that define the wizard
                            flow for that layout.
                          maxItems: 7
                          items:
                            type: object
                            additionalProperties: false
                            description: >-
                              Represents a container that associates a CRM
                              layout with its corresponding screens and chart
                              definition, establishing the navigation structure
                              for one segment of the wizard flow.
                            properties:
                              layout:
                                type: object
                                description: >-
                                  Represents the layout from which wizard fields
                                  are sourced for this container.
                                additionalProperties: false
                                properties:
                                  display_label:
                                    type: string
                                    maxLength: 255
                                    description: >-
                                      Represents the display label of the
                                      layout, translated into the user's locale
                                      where available.
                                  name:
                                    type: string
                                    maxLength: 50
                                    description: >-
                                      Represents the name of the layout
                                      associated with the wizard container.
                                  id:
                                    type: string
                                    description: >-
                                      Represents the unique identifier of the
                                      layout. Refer to the [Get
                                      Layouts](layouts.yaml#$.paths./settings/layouts.get)
                                      endpoint for details.
                                    maxLength: 19
                                    format: int64
                                    pattern: ^[0-9]+$
                                    minLength: 1
                                required:
                                  - display_label
                                  - name
                                  - id
                              chart_data:
                                type: object
                                description: >-
                                  Represents the metadata that describes the
                                  visual flow between screens in the wizard
                                  canvas, including the color palette applied to
                                  the canvas and the connections between
                                  screens.
                                additionalProperties: false
                                properties:
                                  nodes:
                                    type: array
                                    description: >-
                                      Represents the list of visual nodes on the
                                      wizard canvas, where each node corresponds
                                      to a screen in the wizard flow.
                                    maxItems: 75
                                    items:
                                      type: object
                                      description: >-
                                        Represents a single visual node on the
                                        wizard canvas, corresponding to a screen
                                        in the wizard flow and capturing its
                                        position and identity within the chart
                                        layout.
                                      additionalProperties: false
                                      properties:
                                        pos_x:
                                          type: integer
                                          format: int32
                                          description: >-
                                            Represents the X-coordinate position, in
                                            pixels, of the node on the wizard
                                            canvas.
                                        pos_y:
                                          type: integer
                                          format: int32
                                          description: >-
                                            Represents the Y-coordinate position, in
                                            pixels, of the node on the wizard
                                            canvas.
                                        start_node:
                                          type: boolean
                                          description: >-
                                            Indicates whether this node is the
                                            starting screen in the wizard flow.

                                            Possible values:

                                            true - The node is the starting screen
                                            of the wizard flow.

                                            false - The node is not the starting
                                            screen of the wizard flow.
                                        screen:
                                          type: object
                                          additionalProperties: false
                                          description: >-
                                            Represents the wizard screen associated
                                            with this node in the flow chart.
                                          properties:
                                            display_label:
                                              type: string
                                              maxLength: 255
                                              description: >-
                                                Represents the display label of the
                                                screen associated with the node.
                                            id:
                                              type: string
                                              description: >-
                                                Represents the unique identifier of the
                                                screen associated with the node.
                                              maxLength: 19
                                              format: int64
                                              pattern: ^[0-9]+$
                                              minLength: 1
                                          required:
                                            - display_label
                                            - id
                                      required:
                                        - pos_x
                                        - pos_y
                                        - start_node
                                        - screen
                                  connections:
                                    type:
                                      - array
                                      - 'null'
                                    description: >-
                                      Represents the list of connections between
                                      source and target screens that define the
                                      navigation flow within the wizard.
                                    maxItems: 75
                                    items:
                                      type: object
                                      description: >-
                                        Represents a single directed connection
                                        in the wizard flow, linking a source
                                        screen to a target screen to define the
                                        transition path between them.
                                      additionalProperties: false
                                      properties:
                                        source_screen:
                                          type: object
                                          description: >-
                                            Represents the screen from which the
                                            connection originates in the wizard
                                            flow, identifying the starting point of
                                            the transition.
                                          additionalProperties: false
                                          properties:
                                            display_label:
                                              type: string
                                              maxLength: 255
                                              description: >-
                                                Represents the display label of the
                                                source screen as it appears in the
                                                wizard canvas.
                                            id:
                                              type: string
                                              description: >-
                                                Represents the unique identifier of the
                                                source screen from which the connection
                                                originates.
                                              maxLength: 19
                                              format: int64
                                              pattern: ^[0-9]+$
                                              minLength: 1
                                          required:
                                            - display_label
                                            - id
                                        target_screen:
                                          type: object
                                          description: >-
                                            Represents the screen to which the
                                            connection points in the wizard flow,
                                            identifying the destination of the
                                            transition.
                                          additionalProperties: false
                                          properties:
                                            display_label:
                                              type: string
                                              maxLength: 255
                                              description: >-
                                                Represents the display label of the
                                                target screen as it appears in the
                                                wizard canvas.
                                            id:
                                              type: string
                                              description: >-
                                                Represents the unique identifier of the
                                                target screen to which the connection
                                                points.
                                              maxLength: 19
                                              format: int64
                                              pattern: ^[0-9]+$
                                              minLength: 1
                                          required:
                                            - display_label
                                            - id
                                        id:
                                          type: string
                                          description: >-
                                            Represents the unique identifier of the
                                            connection between the source screen and
                                            the target screen in the wizard flow.
                                          maxLength: 19
                                          format: int64
                                          pattern: ^[0-9]+$
                                          minLength: 1
                                      required:
                                        - source_screen
                                        - target_screen
                                        - id
                                  color_palette:
                                    type: object
                                    description: >-
                                      Represents the color palette applied to
                                      the wizard canvas, defining the colors
                                      used for visual elements such as button
                                      backgrounds. This key is present in the
                                      response only if at least one custom color
                                      has been chosen for a button on a screen.
                                    additionalProperties: false
                                    properties:
                                      button_background:
                                        type: array
                                        description: >-
                                          Represents the list of hex color values
                                          applied to button backgrounds in the
                                          wizard canvas.
                                        maxItems: 10
                                        items:
                                          type: string
                                          maxLength: 7
                                          description: >-
                                            Represents a hex color code that defines
                                            a button background color in the wizard
                                            canvas (for example, '#FFFFFF').
                                required:
                                  - nodes
                                  - connections
                              screens:
                                type: array
                                description: >-
                                  Represents the list of screens included in the
                                  wizard container. Each screen groups one or
                                  more segments presented to the user during the
                                  wizard flow. Available from API version 6
                                  onward.
                                maxItems: 75
                                items:
                                  type: object
                                  additionalProperties: false
                                  description: >-
                                    Represents a screen definition within the
                                    wizard container that organizes segments and
                                    governs the data-entry step presented to the
                                    user.
                                  properties:
                                    display_label:
                                      type: string
                                      maxLength: 255
                                      description: Display label of the screen.
                                    api_name:
                                      type: string
                                      maxLength: 255
                                      description: >-
                                        Represents the API name of the screen
                                        within the wizard container.
                                    id:
                                      type: string
                                      description: Numeric unique identifier of the screen.
                                      maxLength: 19
                                      format: int64
                                      x-zs-$id: ScreenId
                                      pattern: ^[0-9]+$
                                      minLength: 1
                                    conditional_rules:
                                      type:
                                        - array
                                        - 'null'
                                      description: >-
                                        Represents the list of conditional rules
                                        evaluated on the screen. Returns null
                                        when no conditional rules are configured
                                        for the screen.
                                      maxItems: 50
                                      items:
                                        type: object
                                        description: >-
                                          Represents a conditional rule configured
                                          for the screen, defining the criteria
                                          and the corresponding actions to execute
                                          when the criteria are satisfied.
                                        additionalProperties: false
                                        properties:
                                          query_id:
                                            type: string
                                            description: >-
                                              Represents the unique numeric identifier
                                              of the conditional rule.
                                            maxLength: 19
                                            format: int64
                                            pattern: ^[0-9]+$
                                            minLength: 1
                                          execute_on:
                                            type: string
                                            maxLength: 50
                                            enum:
                                              - create_edit
                                              - create
                                              - edit
                                            description: >-
                                              Represents the event on which the
                                              conditional rule executes, for example
                                              'create_edit'.
                                          criteria:
                                            type:
                                              - object
                                              - 'null'
                                            description: >-
                                              Represents the criteria expression
                                              evaluated to determine whether the
                                              conditional rule actions are triggered.
                                            additionalProperties: false
                                            properties:
                                              comparator:
                                                type: string
                                                maxLength: 50
                                                description: >-
                                                  Indicates the comparator used to
                                                  evaluate the criteria expression.
                                                  Possible values include not_equal,
                                                  equal, is_empty, and is_not_empty.
                                              field:
                                                type: object
                                                additionalProperties: false
                                                description: >-
                                                  Represents the field against which the
                                                  criteria expression is evaluated.
                                                properties:
                                                  api_name:
                                                    type: string
                                                    maxLength: 255
                                                    description: >-
                                                      Represents the API name of the field
                                                      used in the criteria expression.
                                                  id:
                                                    type: string
                                                    description: >-
                                                      Represents the unique identifier of the
                                                      field used in the criteria expression.
                                                    maxLength: 19
                                                    format: int64
                                                    pattern: ^[0-9]+$
                                                    minLength: 1
                                                required:
                                                  - api_name
                                                  - id
                                              type:
                                                type: string
                                                maxLength: 50
                                                description: >-
                                                  Represents the type of the criteria
                                                  applied in the conditional rule
                                                  evaluation, for example 'value'.
                                              value:
                                                type: string
                                                maxLength: 255
                                                description: >-
                                                  Represents the value used in the
                                                  criteria comparison during conditional
                                                  rule evaluation, for example ''.
                                            required:
                                              - comparator
                                              - field
                                              - type
                                              - value
                                          actions:
                                            type: array
                                            description: >-
                                              Represents the list of actions executed
                                              when the conditional rule criteria are
                                              satisfied on the screen.
                                            maxItems: 50
                                            items:
                                              type: object
                                              description: >-
                                                Represents an action configuration that
                                                is executed when the associated
                                                conditional rule criteria are met on the
                                                screen.
                                              additionalProperties: false
                                              properties:
                                                id:
                                                  type: string
                                                  description: >-
                                                    Represents the unique numeric identifier
                                                    of the conditional rule action.
                                                  maxLength: 19
                                                  format: int64
                                                  pattern: ^[0-9]+$
                                                  minLength: 1
                                                type:
                                                  type: string
                                                  maxLength: 50
                                                  description: >-
                                                    Indicates the type of action to perform
                                                    on the targeted field or segment.
                                                    Possible values include set_mandatory,
