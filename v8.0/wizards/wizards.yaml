                          Represents the status of the request, indicating that
                          the request failed.
                    required:
                      - code
                      - details
                      - message
                      - status
                description: >-
                  Represents the error response returned when authentication
                  credentials are missing or invalid.
              examples:
                OauthScopeMismatch:
                  summary: OAuth token lacks ZohoCRM.settings.wizards.READ scope.
                  value:
                    code: OAUTH_SCOPE_MISMATCH
                    details: {}
                    message: invalid oauth scope to access this URL
                    status: error
                  description: >-
                    Shows a 401 error response when the access token does not
                    include the ZohoCRM.settings.wizards.READ scope.
                InvalidToken:
                  summary: OAuth token is invalid or expired.
                  value:
                    code: INVALID_TOKEN
                    details: {}
                    message: invalid oauth token
                    status: error
                  description: >-
                    Shows a 401 error response when the access token provided is
                    invalid or has expired.
        '403':
          description: >-
            Permission denied to retrieve wizard details.

            **Resolution:** The Zoho CRM administrator must grant the required
            permission to the user's profile.
          content:
            application/json:
              schema:
                type: object
                x-zs-$id: GetWizardForbiddenError
                description: >-
                  Represents the error response returned when the user lacks the
                  required permission to perform the operation.
                additionalProperties: false
                properties:
                  code:
                    type: string
                    enum:
                      - NO_PERMISSION
                    description: >-
                      Represents the error code returned when the user does not
                      have permission to perform the operation.
                  details:
                    type: object
                    description: >-
                      Represents additional details about the permissions
                      required to perform the operation.
                    additionalProperties: false
                    required:
                      - permissions
                    properties:
                      permissions:
                        type: array
                        maxItems: 50
                        items:
                          type: string
                          maxLength: 255
                          description: >-
                            Represents the name of a permission required to
                            access this resource.
                        description: >-
                          Represents the list of permissions required to access
                          this resource.
                  message:
                    type: string
                    description: >-
                      Represents the error message describing the permission
                      denial.
                    maxLength: 255
                  status:
                    type: string
                    enum:
                      - error
                    description: >-
                      Represents the status of the request, indicating that the
                      request failed.
                required:
                  - code
                  - details
                  - message
                  - status
              examples:
                NoPermission:
                  summary: User lacks permission to read wizards.
                  value:
                    code: NO_PERMISSION
                    details:
                      permissions:
                        - 'Zoho CRM: Settings Permission'
                    message: Permission denied to read wizards
                    status: error
                  description: >-
                    Shows a 403 error response when the user's profile does not
                    have permission to read wizard details.
        '404':
          description: >-
            The requested wizard resource was not found.

            **Resolution:** The wizard ID and layout ID in the request must
            correspond to existing resources in the Zoho CRM organization.
          content:
            application/json:
              schema:
                description: >-
                  Represents the error response returned when the requested
                  wizard resource is not found.
                x-zs-$id: GetWizardErrorResponses404
                oneOf:
                  - x-zs-$id: GetWizardErrorResponse404
                    type: object
                    description: >-
                      Represents the error response returned when the URL
                      pattern is invalid or the wizard identifier does not
                      exist.
                    additionalProperties: false
                    properties:
                      status:
                        type: string
                        enum:
                          - error
                        description: >-
                          Represents the status of the request, indicating that
                          the request has failed.
                      code:
                        type: string
                        enum:
                          - INVALID_URL_PATTERN
                        description: >-
                          Represents the error code returned when the URL
                          pattern is invalid or the requested resource does not
                          exist.
                      message:
                        type: string
                        maxLength: 255
                        description: >-
                          Represents the error message explaining why the
                          requested resource was not found.
                      details:
                        type: object
                        description: Additional information about the error, if available.
                        additionalProperties: false
                    required:
                      - status
                      - code
                      - message
                      - details
              examples:
                InvalidUrlPattern:
                  summary: Invalid URL pattern or wizard identifier.
                  value:
                    code: INVALID_URL_PATTERN
                    details: {}
                    message: Please check if the URL trying to access is a correct one
                    status: error
                  description: >-
                    Shows a 404 error response when the request URL does not
                    match a valid endpoint pattern.
      security:
        - OAuth2:
            - ZohoCRM.settings.wizards.READ
components:
  parameters:
    Module:
      name: module
      in: query
      required: false
      description: >-
        Specify the API name of the module for which you want to retrieve
        wizards. Refer to the [Get
        Modules](modules.yaml#$.paths./settings/modules.get) resource for valid
        values.
      schema:
        type: string
        maxLength: 50
        description: API name of the module (e.g. Leads, Contacts, Deals).
    Id:
      name: id
      in: path
      required: true
      description: Specify the unique ID of the wizard to retrieve or delete.
      schema:
        type: string
        format: int64
        description: Numeric unique identifier of the wizard.
    LayoutId:
      name: layout_id
      in: query
      required: true
      description: >-
        Specify the unique ID of the layout associated with the wizard. Refer to
        the [Get Layouts](layouts.yaml#$.paths./settings/layouts.get) resource
        for valid values.
      schema:
        type: string
        format: int64
        description: Numeric unique identifier of the layout.
  securitySchemes:
    OAuth2:
      type: oauth2
      description: OAuth2 authentication scheme using Zoho Accounts.
      flows:
        authorizationCode:
          authorizationUrl: https://accounts.zoho.com/oauth/v2/auth
          tokenUrl: https://accounts.zoho.com/oauth/v2/token
          refreshUrl: https://accounts.zoho.com/oauth/v2/token
          scopes:
            ZohoCRM.settings.wizards.ALL: >-
              Grants full access to wizard configurations in the CRM
              organization, including read, create, update, and delete
              operations.
            ZohoCRM.settings.wizards.READ: >-
              Grants read access to wizard configurations in the CRM
              organization.
            ZohoCRM.settings.wizards.CREATE: >-
              Grants permission to create wizard configurations in the CRM
              organization.
            ZohoCRM.settings.wizards.UPDATE: >-
              Grants permission to update wizard configurations in the CRM
              organization.
            ZohoCRM.settings.wizards.DELETE: >-
              Grants permission to delete wizard configurations from the CRM
              organization.
