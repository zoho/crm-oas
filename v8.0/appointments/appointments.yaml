                  value:
                    data:
                      - code: INVALID_DATA
                        details:
                          api_name: Status
                          json_path: $.data[0].Status
                        message: invalid data
                        status: error
                  description: >-
                    Illustrates an **INVALID_DATA** error returned when the
                    **Status** field value provided in the request body fails
                    validation. The **details** object identifies the offending
                    field via **api_name** and **json_path** set to
