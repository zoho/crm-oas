                  description: >-
                    Illustrates a successful response for GET Appointments,
                    returning two appointment records with their owner, service
                    name, appointment times, and status.
        '400':
          description: >-
            The request fails due to an invalid module API name in the request
            URL or an unsupported HTTP request method.

            **Resolution:** The module API name in the request URL must be
            `Appointments__s`, and the request must use the GET method.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorResponseCore1604218709'
                  - $ref: '#/components/schemas/ErrorResponseCore1875045219'
                x-zs-$id: GetappointmentssError400
                description: >-
                  Represents the error response body returned for a failed GET
                  operation, capturing either an invalid module API name or an
                  unsupported HTTP request method error.
              examples:
                InvalidModuleResponse1:
                  summary: An error response for an invalid module API name.
                  value:
                    code: INVALID_MODULE
                    details:
                      resource_path_index: 0
                    message: the module name given seems to be invalid
                    status: error
                  description: >-
                    Illustrates an error response when an invalid module API
                    name is provided in the request URL, returning error code
                    `INVALID_MODULE`.
                InvalidRequestMethodResponse1:
                  summary: An error response for an unsupported HTTP request method
                  value:
                    code: INVALID_REQUEST_METHOD
                    details: {}
                    message: The http request method type is not a valid one
                    status: error
                  description: >-
                    Illustrates an error response when the request uses an
                    unsupported HTTP method instead of GET, returning error code
                    `INVALID_REQUEST_METHOD`.
      security:
        - OAuth2:
            - ZohoCRM.modules.appointments.READ
    put:
      summary: |
        Update appointment records
      description: >
        To update one or more appointment records in your Zoho CRM organization.
        You can update a maximum of 100 appointments per API call.
      operationId: updateAppointmentsS
      requestBody:
        description: >
          The request body must contain a **data** array with one or more
          appointment objects to update. You can include a maximum of **100**
          objects per request. Each object must include the **ID** field to
          identify the appointment record to update.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutappointmentssRequest'
            examples:
              SamplePutRequest:
                summary: |
                  PUT request body with two appointment objects for update
                value:
                  data:
                    - Appointment_Name: service06 - ll
                      Appointment_For:
                        module:
                          api_name: Contacts
                          id: '111115000000002654'
                        name: ll
                        id: '111115000000120725'
                      Service_Name:
                        name: service06
                        id: '111115000000127506'
                      Appointment_Start_Time: '2026-01-16T18:00:00+05:30'
                      Location: Business Address
                      Address: null
                      Owner:
                        name: madesh04
                        id: '111115000000058229'
                        email: madeshwaran.g+csez04@zohotest.com
                      Additional_Information: null
                      Remind_At:
                        - unit: 1
                          period: hours
                      Created_By:
                        name: madesh04
                        id: '111115000000058229'
                        email: madeshwaran.g+csez04@zohotest.com
                      Modified_By:
                        name: madesh04
                        id: '111115000000058229'
                        email: madeshwaran.g+csez04@zohotest.com
                      Created_Time: '2026-01-16T16:50:29+05:30'
                      Modified_Time: '2026-01-19T16:12:24+05:30'
                      Tag: []
                      Status: Overdue
                      Last_Activity_Time: '2026-01-19T16:12:24+05:30'
                      Rescheduled_From: null
                      Reschedule_Reason: null
                      Reschedule_Note: null
                      Rescheduled_By: null
                      Rescheduled_Time: null
                      Cancelled_By: null
                      Cancellation_Reason: null
                      Cancellation_Note: null
                      Job_Sheet_Created__s: false
                      Cancelled_Time: null
                      Job_Sheet_Name__s: null
                      Job_Sheet_Description__s: null
                      Date_1: null
                      Reschedule_Count: 0
                      Appointment_End_Time: '2026-01-16T18:30:00+05:30'
                      Duration: 30
                    - Appointment_Name: service06 - ll
                      Appointment_For:
                        module:
                          api_name: Contacts
                          id: '111115000000002654'
                        name: ll
                        id: '111115000000120725'
                      Service_Name:
                        name: service06
                        id: '111115000000127506'
                      Appointment_Start_Time: '2026-01-16T18:00:00+05:30'
                      Location: Business Address
                      Address: null
                      Owner:
                        name: madesh04
                        id: '111115000000058229'
                        email: madeshwaran.g+csez04@zohotest.com
                      Additional_Information: null
                      Remind_At:
                        - unit: 1
                          period: hours
                      Created_By:
                        name: madesh04
                        id: '111115000000058229'
                        email: madeshwaran.g+csez04@zohotest.com
                      Modified_By:
                        name: madesh04
                        id: '111115000000058229'
                        email: madeshwaran.g+csez04@zohotest.com
                      Created_Time: '2026-01-16T16:50:29+05:30'
                      Modified_Time: '2026-01-19T16:12:24+05:30'
                      Tag: []
                      Status: Overdue
                      Last_Activity_Time: '2026-01-19T16:12:24+05:30'
                      Rescheduled_From: null
                      Reschedule_Reason: null
                      Reschedule_Note: null
                      Rescheduled_By: null
                      Rescheduled_Time: null
                      Cancelled_By: null
                      Cancellation_Reason: null
                      Cancellation_Note: null
