    delete:
      summary: |
        Delete one or more appointment records
      description: >
        To delete one or more appointment records in your Zoho CRM organization.
        Note that this API will not delete any deals created on the completion
        of the deleted appointments.
      operationId: deleteAppointmentsS
      parameters:
        - $ref: '#/components/parameters/ParamQueryIds'
      responses:
        '200':
          description: >
            Returns a confirmation that all specified appointment records were
            deleted successfully. Each item in the data array contains the
            record ID, a SUCCESS code, and a "record deleted" message.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteappointmentssResponse200'
              examples:
                Success200:
                  summary: |
                    All three appointment records deleted successfully.
                  value:
                    data:
                      - code: SUCCESS
                        details:
                          id: '111115000000147279'
                        message: record deleted
                        status: success
                      - code: SUCCESS
                        details:
                          id: '111115000000147229'
                        message: record deleted
                        status: success
                      - code: SUCCESS
                        details:
                          id: '111115000000147224'
                        message: record deleted
                        status: success
                  description: >
                    Shows a successful deletion response for three appointment
                    records. Each entry in the data array returns a SUCCESS
                    code, a "record deleted" message, and the corresponding
                    record ID.
        '207':
          description: >
            Returns a mixed-status response when the delete operation partially
            succeeds. Each item in the data array contains either a SUCCESS code
            with a "record deleted" message or an INVALID_DATA code with a
            "record not deleted" message, based on the outcome for each
            individual record.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                description: >
                  Represents the Multi-Status response body returned when a bulk
                  deletion request results in a mix of successful and failed
                  appointment deletion attempts.
                properties:
                  data:
                    type: array
                    allOf:
                      - contains:
                          $ref: '#/components/schemas/Delete207SuccessResponse'
                        description: >
                          Represents the constraint that the data array contains
                          at least one successful deletion result, where each
                          matching item holds the deleted record ID.
                        minContains: 1
                      - contains:
                          $ref: '#/components/schemas/ErrorResponseCore2137699283'
                        description: >
                          Represents the constraint that the data array contains
                          at least one failed deletion result, where each
                          matching item describes an appointment record that
                          could not be deleted.
                        minContains: 1
                    description: >
                      Represents the list of result objects for each appointment
                      deletion attempt. Each item is either a success
                      confirmation or an error response.
                    items:
                      oneOf:
                        - $ref: '#/components/schemas/Delete207SuccessResponse'
                      description: >
                        Represents a single result item for an appointment
                        deletion attempt, which is either a success confirmation
                        or an error response.
                    maxItems: 200
                    minItems: 2
                required:
                  - data
                x-zs-$id: DeleteappointmentssResponse207
              examples:
                Success207:
                  summary: >
                    Partial deletion where one record deleted, one failed with
                    INVALID_DATA.
                  value:
                    data:
                      - code: SUCCESS
                        details:
                          id: '111115000000147279'
                        message: record deleted
                        status: success
                      - code: INVALID_DATA
                        details:
                          id: '23132423'
                        message: record not deleted
                        status: error
                  description: >
                    Shows a partial deletion response where the API deleted one
                    appointment record and could not delete another. The data
                    array returns a SUCCESS entry for the deleted record and an
                    INVALID_DATA entry with a "record not deleted" message for
                    the failed record.
        '400':
          description: >-
            The request could not be processed due to an invalid appointment ID,
            an invalid module name, or an unsupported HTTP request method.


            **Resolution:** For INVALID_DATA, make a GET Appointments API call
            and provide a valid appointment ID. For INVALID_REQUEST_METHOD, use
            only the DELETE method. For INVALID_MODULE, verify that the module
            API name in the request is correct.
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    additionalProperties: false
                    description: >
                      Represents the error response body containing a list of
                      INVALID_DATA errors, where each item corresponds to an
                      appointment record that could not be deleted.
                    properties:
                      data:
                        type: array
                        description: >
                          Represents the list of error objects for the
                          appointment records that could not be deleted.
                        items:
                          $ref: '#/components/schemas/ErrorResponseCore2137699283'
                        maxItems: 25
                    required:
                      - data
                    x-zs-$id: DeleteappointmentssError400Wrapper
                  - $ref: '#/components/schemas/ErrorResponseCore1875045219'
                  - $ref: '#/components/schemas/ErrorResponseCore1604218709'
                x-zs-$id: DeleteappointmentssError400
                description: >
                  Represents the error response body for a failed DELETE
                  Appointments request, containing either a list of record-level
                  validation errors or a single request-level error.
              examples:
                InvalidDataResponse1:
                  summary: >
                    INVALID_DATA error where appointment ID is invalid or
                    already deleted
                  value:
                    data:
                      - code: INVALID_DATA
                        details:
                          id: '23132423'
                        message: record not deleted
                        status: error
                  description: >
                    Shows an error response when the specified appointment ID is
                    invalid or the record has already been deleted. The response
                    returns an INVALID_DATA code with a "record not deleted"
                    message and the corresponding record ID in the details
                    object.
                InvalidRequestMethodResponse1:
                  summary: |
                    Invalid HTTP request method type used in the request.
                  value:
                    code: INVALID_REQUEST_METHOD
                    details: {}
                    message: The http request method type is not a valid one
                    status: error
                  description: >
                    Shows an error response when the caller uses an invalid HTTP
                    request method to access this endpoint. Only the DELETE
                    method applies to this API.
                InvalidModuleResponse1:
                  summary: |
                    Invalid module API name provided in the request.
                  value:
                    code: INVALID_MODULE
                    details:
                      resource_path_index: 0
                    message: the module name given seems to be invalid
                    status: error
                  description: >
                    Shows an error response when the module name in the request
                    is invalid. The response returns an INVALID_MODULE code with
                    the message "the module name given seems to be invalid" and
                    a resource_path_index in the details object.
      security:
        - OAuth2:
            - ZohoCRM.modules.appointments.DELETE
