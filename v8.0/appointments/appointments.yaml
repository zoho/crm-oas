openapi: 3.1.0
info:
  title: Appointments Apis
  description: appointments module api
  version: '8'
servers:
  - url: https://zohoapis.{dc}/crm/{version}
    description: API Server for /crm
    variables:
      dc:
        description: API Server URL TLD
        default: com
        enum:
          - com
          - eu
          - in
          - cn
          - au
          - ca
          - jp
      version:
        description: API Version
        default: v8
paths:
  /Appointments__s:
    get:
      summary: Get Appointment Records
      description: >-
        To retrieve appointment records from your Zoho CRM organization. 


        Use the `page` and `per_page` parameters to paginate up to 2,000
        records, or use the `page_token` received in a prior response to
        paginate beyond 2,000 records up to a maximum of 100,000. Each request
        returns a maximum of 200 records. 


        Subform data is not included when retrieving multiple appointments. The
        API returns field values containing sensitive health data only when the
        Restrict Data access through API option is disabled in compliance
        settings.
      operationId: getAppointmentsS
      parameters:
        - $ref: '#/components/parameters/Fields'
        - $ref: '#/components/parameters/Cvid'
        - $ref: '#/components/parameters/PageToken'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/SortOrder'
        - $ref: '#/components/parameters/SortBy'
      responses:
        '200':
          description: >-
            Returns the list of appointment records that match the request
            criteria.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetappointmentssResponse200'
              examples:
                Success200:
                  summary: Successful retrieval of appointment records
                  value:
                    data:
                      - Owner:
                          name: madesh04
                          id: '111115000000058229'
                          email: madeshwaran.g+csez04@zohotest.com
                        $currency_symbol: £
                        Address: null
                        Appointment_Start_Time: '2026-01-16T18:00:00+05:30'
                        Cancellation_Reason: null
                        $field_states: null
