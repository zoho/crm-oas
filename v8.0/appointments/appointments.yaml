                          api_name: Status
                          json_path: $.data[0].Status
                        message: Appointment cannot be scheduled for past dates
                        status: error
                  description: >-
                    Illustrates a **DEPENDENT_MISMATCH** error returned when
                    **Status** is set to Scheduled but
                    **Appointment_Start_Time** falls in the past. The API
