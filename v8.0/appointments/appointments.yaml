  parameters:
    ParamPathAppointmentid:
      name: appointmentId
      in: path
      description: >-
        Specify the unique identifier of the appointment record. Use the [Get
        Appointments API](appointments.yaml#$.paths./Appointments__s.get) to
        retrieve all appointment records and obtain the ID of the required
        appointment record.
      required: true
      schema:
        type: string
        example: '{appointmentId}'
        maxLength: 100
    ParamQueryId:
      name: id
      in: query
      description: >-
        Specify the ID of the appointment record to update. Use the [Get
        Appointments API](appointments.yaml#$.paths./Appointments__s.get) to get
        the ID.
      required: false
      schema:
        type: number
        enum:
          - 111115000000147180
    ParamQueryIds:
      name: ids
      in: query
      description: >-
        Specify the IDs of the appointment records to delete. Accepts
        comma-separated record IDs. Use the [Get Appointments
        API](appointments.yaml#$.paths./Appointments__s.get) to get the IDs.
      required: false
      schema:
        type: number
        enum:
          - 111115000000147280
          - 111115000000147230
    Fields:
      name: fields
      description: >-
        Specify a comma-separated list of field API names to include in the
        response. Use the [Get Fields Metadata
        API](fields.yaml#$.paths./settings/fields.get) to retrieve the field IDs
        and API names.
      in: query
      required: true
      schema:
        type: string
    Cvid:
      name: cvid
      description: >-
        Specify the unique ID of the Custom View. Use the [Get Custom Views
        Metadata API](custom_views.yaml#$.paths./settings/custom_views.get) to
        retrieve the Custom View IDs.
      in: query
      schema:
        type: string
        format: int64
    PageToken:
      name: page_token
      description: >-
        Specify the page token to retrieve records beyond the first 2,000
        results. Use the **next_page_token** value from a previous response to
        access the next page of results.
      in: query
      schema:
        type: string
        maxLength: 96
    Page:
      name: page
      description: Specify the page number to retrieve. Starts at 1.
      in: query
      schema:
        type: integer
        format: int32
        minimum: 1
    PerPage:
      name: per_page
      description: Specify the number of records to return per page. Maximum is 200.
      in: query
      schema:
        type: integer
        format: int32
        maximum: 200
        minimum: 1
    SortOrder:
      name: sort_order
      description: >-
        Specify the sort order for the records.<br/> <b>Possible values:</b>
        <br/>desc - Returns records in descending order.<br/> asc - Returns
        records in ascending order.
      in: query
      schema:
        type: string
        enum:
          - desc
          - asc
    SortBy:
      name: sort_by
      description: >-
        Specify the field to sort records by.  Possible values:**id** - Sorts by
        record ID.  **Created_Time** - Sorts by creation timestamp. 
        **Modified_Time** - Sorts by last modification timestamp.
      in: query
      schema:
        type: string
        enum:
          - id
          - Created_Time
          - Modified_Time
