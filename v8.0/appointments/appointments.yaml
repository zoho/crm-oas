                    Appointment_For, Appointment_Name, and Status.
        '400':
          description: >
            The request was not processed because the module API name or the
            appointment ID in the request URL is invalid.


            **Resolution:** Verify that the module API name in the request URL
            is correct. Use the [Get Modules
            API](modules.yaml#$.paths./settings/modules.get) to retrieve the
            valid module API name, and confirm that the appointment ID
            corresponds to an existing record.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorResponseCore1604218709'
                  - $ref: '#/components/schemas/ErrorResponseCore2271053024'
                x-zs-$id: GetappointmentByIdError400
                description: >-
                  Represents the error response body when the module API name or
                  the appointment ID in the request URL is invalid. Contains one
                  of two error such as an INVALID_MODULE error when the module
                  name is unrecognized, or an INVALID_URL_PATTERN error when the
                  appointment ID cannot be resolved.
              examples:
                InvalidModuleResponse1:
                  summary: >-
                    INVALID_MODULE error when module API name in the URL is
                    invalid.
                  value:
                    code: INVALID_MODULE
                    details:
                      resource_path_index: 0
                    message: the module name given seems to be invalid
                    status: error
                  description: >
                    Shows an error when the module API name in the request URL
                    is invalid. The response includes the INVALID_MODULE error
                    code and the index of the resource path where the error was
                    detected.
        '404':
          description: >
            The request was not processed because the URL or the appointment ID
            is invalid.


            **Resolution:** Verify that the appointment ID in the request URL
            corresponds to an existing appointment record in the organization.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseCore2271053024'
                x-zs-$id: GetappointmentByIdError404
              examples:
                InvalidUrlPatternResponse1:
                  summary: >
                    INVALID_URL_PATTERN error when the appointment ID in the URL
                    is invalid.
                  value:
                    code: INVALID_URL_PATTERN
                    details: {}
                    message: Please check if the URL trying to access is a correct one
                    status: error
                  description: >
                    Shows an error when the appointment ID in the request URL
                    does not match a valid URL pattern. The response includes
                    the INVALID_URL_PATTERN error code and prompts the caller to
                    verify the URL.
      security:
        - OAuth2:
            - ZohoCRM.modules.appointments.READ
