                  objects with a full field set, including appointment name,
                  contact, service, start time, location, owner, reminders,
                  status, and rescheduling fields.
            x-zs-llm-examples:
              - SamplePutRequest
      responses:
        '200':
          description: >
            Returns a confirmation for each successfully updated appointment
            record, including the record ID, creation and modification
            timestamps, and the identities of the users who created and last
            modified the record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PutappointmentssResponse200'
              examples:
                Success200:
                  summary: |
                    Successful update of two appointment records
                  value:
                    data:
                      - code: SUCCESS
                        details:
                          Modified_Time: '2026-01-19T17:42:07+05:30'
                          Modified_By:
                            name: madesh04
                            id: '111115000000058229'
                          Created_Time: '2026-01-16T16:50:29+05:30'
                          id: '111115000000147279'
                          Created_By:
                            name: madesh04
                            id: '111115000000058229'
                        message: record updated
                        status: success
                      - code: SUCCESS
                        details:
                          Modified_Time: '2026-01-19T17:42:07+05:30'
                          Modified_By:
                            name: madesh04
                            id: '111115000000058229'
                          Created_Time: '2026-01-16T14:11:13+05:30'
                          id: '111115000000147238'
                          Created_By:
                            name: madesh04
                            id: '111115000000058229'
                        message: record updated
                        status: success
                  description: >
                    Shows a successful response for a batch update in which both
                    appointment records were updated. Each result object carries
                    a SUCCESS code, a confirmation message, and a details block
                    containing the record ID, creation timestamp, modification
                    timestamp, and the identities of the creating and modifying
                    users.
        '207':
          description: >
            Returns a mixed-status response when the batch contains both
            successfully updated appointment records and records that failed the
            update. Each item in the response array is either a success object
            or an error object with an INVALID_DATA code indicating an invalid
            appointment ID.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                description: >
                  Represents the Multi-Status response body returned when the
                  update request produces a mix of successfully updated and
                  failed appointment updates. The response contains at least one
                  success and at least one error.
                properties:
                  data:
                    type: array
                    allOf:
                      - contains:
                          $ref: '#/components/schemas/Post207multistatusResponse207'
                        description: >
                          Constrains the data array to contain at least one
                          success response object, ensuring the response always
                          reflects at least one successfully updated appointment
                          record.
                        minContains: 1
                      - contains:
                          $ref: '#/components/schemas/ErrorResponseCore1544688711'
                        description: >
                          Constrains the data array to contain at least one
                          error response object, ensuring the response always
                          reflects at least one failed appointment update
                          attempt.
                        minContains: 1
                    description: >
                      Represents the list of result objects returned for each
                      appointment update attempt. Each item is either a success
                      response for a successfully updated record or an error
                      response for a failed update.
                    items:
                      oneOf:
                        - $ref: '#/components/schemas/Post207multistatusResponse207'
                        - $ref: '#/components/schemas/ErrorResponseCore1544688711'
                      description: >
                        Represents a single result in the response array. it is
                        either a success object containing the updated record
                        details with a status code and message, or an error
                        object indicating a failed update due to an invalid
                        appointment ID.
                    maxItems: 200
                    minItems: 2
                required:
                  - data
                x-zs-$id: PutappointmentssResponse207
              examples:
                Success207:
                  summary: >
                    Multi-status response with one success and one invalid-ID
                    error.
                  value:
                    data:
                      - code: SUCCESS
                        details:
                          Modified_Time: '2026-01-19T17:45:52+05:30'
                          Modified_By:
                            name: madesh04
                            id: '111115000000058229'
                          Created_Time: '2026-01-16T16:50:29+05:30'
                          id: '111115000000147279'
                          Created_By:
                            name: madesh04
                            id: '111115000000058229'
                        message: record updated
                        status: success
                      - code: INVALID_DATA
                        details:
                          api_name: id
                          json_path: $.data[1].id
                        message: the id given seems to be invalid
                        status: error
                  description: >-
                    Illustrates a Multi-Status response in which one appointment
                    record updated successfully and a second record failed with
                    an invalid appointment ID error, showing how partial success
                    and error entries coexist in the same response payload.
        '400':
          description: >
            The request was not processed due to invalid or missing fields. 


            **Resolution:** Verify that all required fields are present and that
            field values satisfy the validation requirements for the requested
            appointment update operation.
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    additionalProperties: false
                    description: >
                      Represents the wrapped error response body returned when
                      one or more individual appointment update requests fail
                      validation. Contains an array of per-record error objects.
                    properties:
                      data:
                        type: array
                        description: >
                          Contains the list of error objects for appointment
                          records that failed validation during the update
                          request. Each object corresponds to one failed record.
                        items:
                          oneOf:
                            - $ref: '#/components/schemas/ErrorResponseCore1720623915'
                            - $ref: '#/components/schemas/ErrorResponseCore622374562'
                            - $ref: '#/components/schemas/ErrorResponseCore261228299'
                            - $ref: '#/components/schemas/ErrorResponseCore1207168962'
                            - $ref: '#/components/schemas/ErrorResponseCore1818284114'
                            - $ref: '#/components/schemas/ErrorResponseCore1277582131'
                            - $ref: '#/components/schemas/ErrorResponseCore1593946428'
                            - $ref: '#/components/schemas/ErrorResponseCore2114620743'
                            - $ref: >-
                                #/components/schemas/PostappointmentssDependentFieldMissingCancellationStatusErrorItem
                            - $ref: >-
                                #/components/schemas/PostappointmentssDependentMismatchCancellationStatusErrorItem
                            - $ref: '#/components/schemas/ErrorResponseCore1090893661'
                            - $ref: '#/components/schemas/ErrorResponseCore653152835'
                            - $ref: '#/components/schemas/ErrorResponseCore899638570'
                            - $ref: '#/components/schemas/ErrorResponseCore496791912'
                            - $ref: '#/components/schemas/ErrorResponseCore201487910'
                            - $ref: '#/components/schemas/ErrorResponseCore55175210'
                            - $ref: >-
                                #/components/schemas/ErrorResponseCoreRecordLocked
                            - $ref: '#/components/schemas/ErrorResponseCore1009543207'
                          description: >
                            Represents a single failed appointment update. Each
                            object contains the error code, the affected field
                            details, the error message, and the status.
                        maxItems: 25
                    required:
                      - data
                    x-zs-$id: PutappointmentssError400Wrapper
                  - $ref: '#/components/schemas/ErrorResponseCore1009543207'
                x-zs-$id: PutappointmentssError400
                description: >
                  Represents the error response body returned when the PUT
                  request to update appointment records fails. 


                  The response is one of two variants: a wrapped array of
                  per-record validation error objects, or a flat error object
                  for request-level failures.
              examples:
                MandatoryNotFoundResponse1:
                  summary: |
                    Error when required Appointment_For field is missing.
                  value:
                    data:
                      - code: MANDATORY_NOT_FOUND
                        details:
                          api_name: Appointment_For
                          json_path: $.data[2].Appointment_For
                        message: required field not found
                        status: error
                  description: >
                    Shows a MANDATORY_NOT_FOUND error returned when the required
                    Appointment_For field is absent from the request payload at
                    $.data[2].Appointment_For.
                DependentFieldUnchangedResponse1:
                  summary: >
                    Error when Rescheduled_From matches the existing appointment
                    start time.
                  value:
                    data:
                      - code: DEPENDENT_FIELD_UNCHANGED
                        details:
                          dependee:
                            api_name: Appointment_Start_Time
                            json_path: $.data[0].Appointment_Start_Time
                          api_name: Rescheduled_From
                          json_path: $.data[0].Rescheduled_From
                        message: >-
                          Reschedule_From and Appointment_Start_Time cannot be
                          same
                        status: error
                  description: >
                    Represents a DEPENDENT_FIELD_UNCHANGED error returned when
                    the Rescheduled_From value provided in the request matches
                    the existing Appointment_Start_Time, as the new appointment
                    time must differ from the current start time to constitute a
                    valid reschedule.
                DependentFieldUnchangedResponse2:
                  summary: >-
                    Error when reschedule information fields change without a
                    prior reschedule.
                  value:
                    data:
                      - code: DEPENDENT_FIELD_UNCHANGED
                        details:
                          dependee:
                            api_name: Reschedule_Reason
                            json_path: $.data[0].Reschedule_Reason
                          api_name: Rescheduled_From
                          json_path: $.data[0].Rescheduled_From
                        message: >-
                          Reschedule the appointment atleast once to Update the
                          fields of Reschedule Information Section
                        status: error
                  description: >
                    Represents a DEPENDENT_FIELD_UNCHANGED error returned when
                    reschedule information fields such as Reschedule_Reason are
                    included in the request without the appointment having been
                    rescheduled at least once, as those fields can only be
                    updated after Rescheduled_From has been set on a prior
                    update.
                DependentFieldMissingResponse1:
                  summary: >
                    Error when Reschedule_Reason is set but Rescheduled_From is
                    empty.
                  value:
                    data:
                      - code: DEPENDENT_FIELD_MISSING
                        details:
                          dependee:
                            api_name: Reschedule_Reason
                            json_path: $.data[0].Reschedule_Reason
                          api_name: Rescheduled_From
                          json_path: $.data[0].Rescheduled_From
                        message: Rescheduled_From cannot be empty
                        status: error
                  description: >
                    Represents a DEPENDENT_FIELD_MISSING error returned when a
                    Reschedule_Reason value is provided in the request but the
                    required Rescheduled_From field is left empty, as
                    Rescheduled_From must be populated whenever reschedule
                    information fields are included.
                DependentFieldMissingResponse2:
                  summary: >
                    Error when cancellation fields are set but Status is not
                    Cancelled.
                  value:
                    data:
                      - code: DEPENDENT_FIELD_MISSING
                        details:
                          dependee:
                            api_name: Cancellation_Reason
                            json_path: $.data[0].Cancellation_Reason
                          api_name: Status
                          json_path: $.data[0].Status
                        message: >-
                          To Update the fields of Cancellation Information
                          Section, value of Status should be Cancelled
                        status: error
                  description: >
                    Represents a DEPENDENT_FIELD_MISSING error returned when
                    cancellation information fields such as Cancellation_Reason
                    are included in the request but the appointment Status is
                    not set to Cancelled, as the Cancelled status is required to
                    process any cancellation-related fields.
                NotAllowedResponse1:
                  summary: >
                    Error when Service_Name is unavailable at the appointment
                    time.
                  value:
                    data:
                      - code: NOT_ALLOWED
                        details:
                          api_name: Appointment_Start_Time
                          json_path: $.data[0].Appointment_Start_Time
                        message: Service is not available on the given time
                        status: error
                  description: >
                    Shows a NOT_ALLOWED error returned when the selected
                    Service_Name is not available at the given appointment time,
                    as indicated at $.data[0].Service_Name.
                NotAllowedResponse2:
                  summary: |
                    Error when Appointment_Start_Time is outside business hours.
                  value:
                    data:
                      - code: NOT_ALLOWED
                        details:
                          api_name: Appointment_Start_Time
                          json_path: $.data[0].Appointment_Start_Time
                        message: Appointment time does not falls under business hours
                        status: error
                  description: >
                    Shows a NOT_ALLOWED error returned when the
                    Appointment_Start_Time falls outside configured business
                    hours, as indicated at $.data[0].Appointment_Start_Time.
                DependentMismatchResponse1:
                  summary: |
                    Error when appointment owner is not a member of the service
                  value:
                    data:
                      - code: DEPENDENT_MISMATCH
                        details:
                          dependee:
                            api_name: Services.Members
                            json_path: $.data[0].Services.Members
                          api_name: id
                          json_path: $.data[0].Owner.id
                        message: Appointment Owner is not a part of Service Members
                        status: error
                  description: >
                    Represents a DEPENDENT_MISMATCH error returned when the
                    specified appointment owner is not a member of the service
                    associated with the appointment.
                InvalidDataResponse1:
                  summary: |
                    Invalid data error for Appointment_For module format.
                  value:
                    data:
                      - code: INVALID_DATA
                        details:
                          expected_data_type: jsonobject
                          api_name: module
                          json_path: $.data[0].Appointment_For.module
                        message: invalid data
                        status: error
                  description: >
                    Shows an error when the Appointment_For field value has an
                    invalid format, indicated by the api_name field in the
                    details object.
                InvalidDataResponse2:
                  summary: >
                    Invalid data error for unknown module API name in
                    Appointment_For.
                  value:
                    data:
                      - code: INVALID_DATA
                        details:
                          api_name: api_name
                          json_path: $.data[0].Appointment_For.module.api_name
                        message: >-
                          the given module name is not exist in
                          multimodulelookup
                        status: error
                  description: >
                    Shows an error when the module API name provided in the
                    Appointment_For field does not match a valid module in the
                    CRM organization.
                NotAllowedResponse3:
                  summary: |
                    Error when appointment is completed without a job sheet.
                  value:
                    data:
                      - code: NOT_ALLOWED
                        details:
                          api_name: Status
                          json_path: $.data[0].Status
                        message: >-
                          Appointment cannot be marked as completed without
                          creating the jobsheet
                        status: error
                  description: >
                    Shows a NOT_ALLOWED error returned when an appointment is
                    marked as completed but no job sheet has been submitted, as
                    indicated at $.data[0].Job_Sheet_Created__s.
                DependentMismatchResponse2:
                  summary: >
                    Error when Status is set to Completed before appointment end
                    time.
                  value:
                    data:
                      - code: DEPENDENT_MISMATCH
                        details:
                          dependee:
                            api_name: Appointment_Start_Time
                            json_path: $.data[0].Appointment_Start_Time
                          api_name: Status
                          json_path: $.data[0].Status
                        message: >-
                          Appointment cannot be marked as completed before the
                          appointment ends
                        status: error
                  description: >
                    Represents a DEPENDENT_MISMATCH error returned when the
                    appointment Status is set to Completed before the scheduled
                    Appointment_End_Time has passed. An appointment can only be
                    marked as Completed after the appointment time has ended.
                DependentMismatchResponse3:
                  summary: >-
                    Error when a job sheet creation targets an incomplete
                    appointment
                  value:
                    data:
                      - code: DEPENDENT_MISMATCH
                        details:
                          dependee:
                            api_name: Status
                            json_path: $.data[0].Status
                          api_name: Job_Sheet_Name__s
                          json_path: $.data[0].Job_Sheet_Name__s
                        message: >-
                          Job Sheet can be created only for completed
                          appointment
                        status: error
                  description: >
                    Represents a DEPENDENT_MISMATCH error returned when
                    Job_Sheet_Created__s is set on an appointment whose Status
                    is not Completed. A job sheet can only be created for an
                    appointment that has been marked as Completed.
                DependentMismatchResponse4:
                  summary: >
                    Error when Status is set to Overdue before appointment end
                    time.
                  value:
                    data:
                      - code: DEPENDENT_MISMATCH
                        details:
                          dependee:
                            api_name: Appointment_Start_Time
                            json_path: $.data[0].Appointment_Start_Time
                          api_name: Status
                          json_path: $.data[0].Status
                        message: >-
                          Appointment cannot be marked as overdue before the
                          appointment ends
                        status: error
                  description: >
                    Represents a DEPENDENT_MISMATCH error returned when the
                    appointment Status is set to Overdue before the scheduled
                    Appointment_End_Time has passed. An appointment can only be
                    marked as Overdue after the appointment time has ended.
                DependentMismatchResponse5:
                  summary: >
                    Error when Appointment_Start_Time is set to a past date or
                    time.
                  value:
                    data:
                      - code: DEPENDENT_MISMATCH
                        details:
                          dependee:
                            api_name: Appointment_Start_Time
                            json_path: $.data[0].Appointment_Start_Time
                          api_name: Status
                          json_path: $.data[0].Status
                        message: Appointment cannot be scheduled for past dates
                        status: error
                  description: >
                    Represents a DEPENDENT_MISMATCH error returned when the
                    Appointment_Start_Time is set to a value in the past. The
                    appointment start time must be greater than the current
                    time.
                MandatoryNotFoundResponse2:
                  summary: |
                    Error when required unit key is missing from Remind_At.
                  value:
                    data:
                      - code: MANDATORY_NOT_FOUND
                        details:
                          api_name: unit
                          json_path: $.data[0].Remind_At[0].unit
                        message: mandatory key missing
                        status: error
                  description: >
                    Shows a MANDATORY_NOT_FOUND error returned when the required
                    unit key is absent from a Remind_At reminder object at
                    $.data[0].Remind_At[0].unit.
                InvalidDataResponse3:
                  summary: |
                    Invalid data error when data array exceeds 100-record limit.
                  value:
                    code: INVALID_DATA
                    details:
                      maximum_length: 4
                      api_name: data
                      json_path: $.data
                    message: invalid data
                    status: error
                  description: >
                    Shows an error when the data array in the request body
                    exceeds the maximum allowed limit of 100 appointments per
                    API call.
                RecordLockedResponse1:
                  summary: |
                    Error when appointment record is locked.
                  value:
                    data:
                      - code: RECORD_LOCKED
                        details:
                          api_name: id
                          action: record_locking
                          json_path: $.data[0].id
                        message: >-
                          Sorry, you cannot perform this operation as the record
                          is locked.
                        status: error
                  description: >
                    Returned when the target appointment record is locked and
                    the update operation cannot be performed. The response
                    includes the affected field path and the locking action that
                    prevented the request.
                InvalidDataResponse4:
                  summary: |
                    Invalid data error for Remind_At unit field.
                  value:
                    data:
                      - code: INVALID_DATA
                        details:
                          expected_data_type: integer
                          api_name: unit
                          json_path: $.data[0].Remind_At[0].unit
                        message: INVALID_DATA
                        status: error
                  description: >
                    Shows an error when the unit field in the Remind_At array
                    contains an invalid data type; the unit value must be an
                    integer.
                InvalidDataResponse5:
                  summary: |
                    Invalid data error for an invalid appointment ID
                  value:
                    data:
                      - code: INVALID_DATA
                        details:
                          api_name: id
                          json_path: $.data[0].id
                        message: the id given seems to be invalid
                        status: error
                  description: >
                    Shows an error when the appointment ID provided in the
                    request is invalid. Use the Get Appointments API to retrieve
                    valid appointment IDs.
        '403':
          description: >
            The authenticated user does not have the required Zoho CRM profile
            permission to perform the requested appointment action. A
            NOT_ALLOWED error is also returned when the operation attempts to
            reschedule or change the status of an appointment that is already
            completed or cancelled.


            **Resolution:** A CRM administrator must grant the appropriate
            appointment-action permissions in the Zoho CRM user's profile.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                description: >
                  Represents the error response returned when the authenticated
                  user lacks permission to update appointments, containing a
                  list of error objects that describe the permission failure.
                properties:
                  data:
                    type: array
                    description: >
                      Contains the list of error objects returned when the
                      caller lacks permission to update the requested
                      appointment records.
                    items:
                      $ref: '#/components/schemas/ErrorResponseCoreNoPermission'
                    maxItems: 25
                required:
                  - data
                x-zs-$id: PutappointmentssError403
              examples:
                NoPermissionCompleteResponse1:
                  summary: |
                    Permission denied to mark appointment as complete
                  value:
                    data:
                      - code: NO_PERMISSION
                        details:
                          permissions:
                            - Crm_Implied_Mark_As_Complete_Appointments
                        message: permission denied
                        status: error
                  description: >
                    Returned when the authenticated user lacks the
                    Crm_Implied_Mark_As_Complete_Appointments permission
                    required to mark an appointment as complete. The request is
                    denied with a NO_PERMISSION error.
                NoPermissionRescheduleResponse1:
                  summary: |
                    Permission denied to reschedule appointment.
                  value:
                    data:
                      - code: NO_PERMISSION
                        details:
                          permissions:
                            - Crm_Implied_Reschedule_Appointments
                        message: permission denied
                        status: error
                  description: >
                    Returned when the authenticated user lacks the
                    Crm_Implied_Reschedule_Appointments permission required to
                    reschedule an appointment. The request is denied with a
                    NO_PERMISSION error.
                NoPermissionCancelResponse1:
                  summary: |
                    Permission denied to cancel appointment.
                  value:
                    data:
                      - code: NO_PERMISSION
                        details:
                          permissions:
                            - Crm_Implied_Cancel_Appointments
                        message: permission denied
                        status: error
                  description: >
                    Returned when the authenticated user lacks the
                    Crm_Implied_Cancel_Appointments permission required to
                    cancel an appointment. The request is denied with a
                    NO_PERMISSION error.
      security:
        - OAuth2:
            - ZohoCRM.modules.appointments.UPDATE
