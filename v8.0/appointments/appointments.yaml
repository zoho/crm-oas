                  value:
                    data:
                      - code: INVALID_DATA
                        details:
                          expected_data_type: integer
                          api_name: unit
                          json_path: $.data[0].Remind_At[0].unit
                        message: INVALID_DATA
                        status: error
                  description: >-
                    Illustrates an **INVALID_DATA** error returned when the
                    **Remind_At[0].unit** field receives a value that is not an
                    integer. The **details** object identifies the offending
                    field via **api_name** `unit` and **expected_data_type**
                    `integer`, with **json_path** pointing to
                    `$.data[0].Remind_At[0].unit`.
                RecordLockedResponse1:
                  summary: >-
                    **RECORD_LOCKED** error when the appointment record is
                    locked and cannot be modified.
                  value:
                    data:
                      - code: RECORD_LOCKED
                        details:
                          api_name: id
