                InvalidDataResponse3:
                  summary: >-
                    **INVALID_DATA** error is thrown when the  **appointmentId**
                    path parameter does not match a valid appointment record.
                  value:
                    code: INVALID_DATA
                    details:
                      resource_path_index: 1
                    message: the id given seems to be invalid
                    status: error
                  description: >-
                    Illustrates an **INVALID_DATA** error returned when the
                    **appointmentId** path parameter in the request URL does not
                    correspond to a valid appointment record. 


                    The **details** object includes **resource_path_index** to
