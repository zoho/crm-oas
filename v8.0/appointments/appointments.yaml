    delete:
      summary: |
        Delete an Appointment by ID
      description: >
        To delete a single appointment record from your Zoho CRM organization by
        its unique ID. Note that this operation will not delete any deals
        created upon completion of the appointment.
      operationId: deleteAppointmentById
      parameters:
        - $ref: '#/components/parameters/ParamPathAppointmentid'
      responses:
        '200':
          description: >
            Returns a confirmation that the specified appointment record was
            successfully deleted from Zoho CRM, including the ID of the deleted
            record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteidResponse200'
              examples:
                Success200:
                  summary: |
                    Successful deletion of a single appointment record.
                  value:
                    data:
                      - code: SUCCESS
                        details:
                          id: '111115000000147279'
                        message: record deleted
                        status: success
                  description: >
                    Confirms successful deletion of a single appointment record
                    in Zoho CRM. The response includes the deleted appointment's
                    ID and a status of success.
        '400':
          description: >
            The request failed due to an invalid appointment ID, an unsupported
            HTTP method, or an invalid module name.


            **Resolution:** Verify that the appointment ID is correct and has
            not already been deleted. Use only the DELETE HTTP method and ensure
            the module name in the request URL is valid.
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    additionalProperties: false
                    description: >
                      Represents an error response in which the error details
                      are wrapped in a `data` array, returned when the
                      appointment ID provided in the request is invalid or
                      refers to a record that has already been deleted.
                    properties:
                      data:
                        type: array
                        description: >
                          Represents the list of error objects returned when the
                          DELETE request fails due to an invalid appointment ID
                          or a reference to a record that has already been
                          deleted. 
                        items:
                          $ref: '#/components/schemas/ErrorResponseCore2137699283'
                        maxItems: 25
                    required:
                      - data
                    x-zs-$id: DeleteidError400Wrapper
                  - $ref: '#/components/schemas/ErrorResponseCore1875045219'
                  - $ref: '#/components/schemas/ErrorResponseCore1604218709'
                  - $ref: '#/components/schemas/ErrorResponseCoreInvalidDataFlat'
                x-zs-$id: DeleteidError400
                description: >
                  Represents the error response body for a failed DELETE request
                  to remove a single appointment record. The response conforms
                  to one of several error variants depending on the cause of the
                  failure.
              examples:
                InvalidDataResponse1:
                  summary: >
                    INVALID_DATA error where the appointment ID is invalid or
                    record already deleted
                  value:
                    data:
                      - code: INVALID_DATA
                        details:
                          id: '23132423'
                        message: record not deleted
                        status: error
                  description: >
                    Illustrates a wrapped error response returned when the
                    appointment ID provided in the DELETE request URL is invalid
                    or refers to a record that has already been deleted. The
                    response includes the ID of the appointment for which the
                    DELETE request failed.
                InvalidRequestMethodResponse1:
                  summary: >
                    INVALID_REQUEST_METHOD error where unsupported HTTP method
                    used.
                  value:
                    code: INVALID_REQUEST_METHOD
                    details: {}
                    message: The http request method type is not a valid one
                    status: error
                  description: >
                    Represents an error response returned when a method other
                    than DELETE is called on this endpoint. The response
                    includes the INVALID_REQUEST_METHOD error code, indicating
                    that only the DELETE method is accepted.
                InvalidModuleResponse1:
                  summary: |
                    INVALID_MODULE error where module API name is invalid
                  value:
                    code: INVALID_MODULE
                    details:
                      resource_path_index: 0
                    message: the module name given seems to be invalid
                    status: error
                  description: >
                    Represents an error response returned when the module API
                    name provided in the request is invalid. The response
                    includes the INVALID_MODULE error code and the index of the
                    resource path parameter for which the value is invalid.
                InvalidDataFlatResponse1:
                  summary: >
                    INVALID_DATA error response when the appointment ID is
                    invalid or already deleted.
                  value:
                    code: INVALID_DATA
                    details:
                      resource_path_index: 1
                    message: record not deleted
                    status: error
                  description: >
                    Illustrates a structured error response returned when the
                    appointment ID provided in the request URL is invalid or
                    refers to a record that has already been deleted. The
                    response includes the resource path index in the error
                    details.
      security:
        - OAuth2:
            - ZohoCRM.modules.appointments.DELETE
