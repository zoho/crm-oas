                          json_path: $.data[0].Remind_At[0].unit
                        message: mandatory key missing
                        status: error
                  description: >-
                    Illustrates the **MANDATORY_NOT_FOUND** error returned when
                    the **unit** key is missing from a **Remind_At** reminder
