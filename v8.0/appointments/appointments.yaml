                description: >-
                  Represents the multi-status response body returned when bulk
                  creating appointment records. The data array contains
                  individual result items, each independently indicating success
                  or failure for the corresponding submitted record.
                properties:
                  data:
                    type: array
                    allOf:
                      - contains:
