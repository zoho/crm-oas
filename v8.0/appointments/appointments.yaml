                      oneOf:
                        - $ref: '#/components/schemas/Post207multistatusResponse207'
                        - $ref: >-
                            #/components/schemas/PostappointmentssResponse207ErrorItem
                      description: >-
                        Represents a single result item in the multi-status
                        response. Each item is either a success object
                        containing the created record details or an error object
                        describing the reason the corresponding record could not
                        be created.
                    maxItems: 200
                    minItems: 2
                required:
                  - data
