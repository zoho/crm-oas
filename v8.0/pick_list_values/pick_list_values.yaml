openapi: 3.1.0
info:
  title: Pick List Values
  description: >-
    Picklist values are the predefined options configured for picklist-type
    fields in a CRM module. This API enables developers to retrieve the
    available picklist values for a specified field, including display names,
    reference values, color codes, usage status, and layout associations.
  version: '8'
servers:
  - url: https://zohoapis.{dc}/crm/{version}
    description: API Server for /crm
    variables:
      dc:
        description: API Server URL TLD
        default: com
        enum:
          - com
          - eu
          - in
          - cn
          - au
          - ca
          - jp
      version:
        description: API Version
        default: v8
paths:
  /settings/fields/{fieldId}/pick_list_values:
    get:
      operationId: getPickListValues
      summary: Picklist Values for a Field
      x-zs-llm-description: >-
        This endpoint retrieves the available pick list values for a specified
        field in a module. It provides detailed information about each pick list
        value, including its display value (with translations if enabled),
        reference value, layout associations, and metadata such as sequence
        number, color code, and usage status. If the specified field exists but
        is not of a pick list type, the endpoint will return a 204 No Content
        response. Note that this endpoint does not support pagination, so all
        pick list values will be returned in a single response.
      description: >-
        Returns the available pick list values for a specified field in a
        module, including display values (with translations if enabled),
        reference values, layout associations, and metadata. Returns 204 if the
        field exists but is not a pick list type. Does not support pagination.
      parameters:
        - $ref: '#/components/parameters/FieldId'
        - $ref: '#/components/parameters/Module'
      responses:
        '200':
          description: >-
            Returns the list of picklist values for the specified field,
            including display values, reference values, color codes, usage
            status, and associated layouts.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                description: >-
                  Contains the picklist values with metadata for the specified
                  field, including display names, reference values, color codes,
                  usage status, and layout associations.
                properties:
                  pick_list_values:
                    type: array
                    description: >-
                      Represents the list of picklist value objects retrieved
                      for the specified field.
                    items:
                      type: object
                      additionalProperties: false
                      description: Pick list value object
                      properties:
                        sequence_number:
                          type: integer
                          format: int32
                          description: >-
                            Represents the display order position of the
                            picklist value in the list.
                          minimum: 1
                        display_value:
                          type: string
                          description: >-
                            Represents the translated display value of the
                            picklist option shown to users. When translation is
                            not enabled, this value matches **reference_value**.
                          maxLength: 120
                        reference_value:
                          type: string
                          description: >-
                            Represents the untranslated reference value of the
                            picklist option used in API operations.
                          maxLength: 120
                        colour_code:
                          type:
                            - string
                            - 'null'
                          maxLength: 9
                          description: >-
                            Hexadecimal color code for UI rendering. Null if no
                            color assigned.
                          pattern: ^#[0-9a-fA-F]{6}$
                        actual_value:
                          type: string
                          description: >-
                            Represents the actual internal value of the picklist
                            option stored in the system.
                          maxLength: 120
                        id:
                          type: string
                          format: int64
                          description: >-
                            Represents the unique identifier of this pick list
                            value
                          x-zs-$id: PickListValuesId
                        type:
                          type: string
                          description: >-
                            Represents the usage status of the picklist value in
                            the CRM field. Possible values: **used** - The
                            picklist value is active and available for
                            selection. **unused** - The picklist value is
                            inactive and not available for selection. Always
                            returned in the response.
                          enum:
                            - used
                            - unused
                        layout_associations:
                          type:
                            - array
                            - 'null'
                          description: >-
                            Represents the layouts with which this picklist
                            value is associated. Returns **null** if the value
                            is unused or not associated with any layout. Always
                            returned in the response. Refer to the [Get
                            Layouts](layouts.json#$.paths./settings/layouts.get)
                            endpoint for details. Layout IDs are unique within
                            this array.
                          maxItems: 10
                          items:
                            type: object
                            additionalProperties: false
                            description: Layout association object
                            properties:
                              api_name:
                                type: string
                                description: >-
                                  Represents the API name of the associated
                                  layout.
                                maxLength: 50
                              name:
                                type: string
                                description: Display name of the associated layout
                                maxLength: 40
                              id:
                                type: string
                                format: int64
                                description: Unique identifier of the associated layout
                            required:
                              - api_name
                              - id
                              - name
                      required:
                        - actual_value
                        - colour_code
                        - display_value
                        - id
                        - layout_associations
                        - reference_value
                        - sequence_number
                        - type
                    maxItems: 2000
                required:
                  - pick_list_values
                x-zs-$id: PickListValuesResponse
              examples:
                MultiplePickListValues:
                  summary: >-
                    Pick list with multiple values showing used/unused types and
                    color codes
                  value:
                    pick_list_values:
                      - sequence_number: 1
                        display_value: '-None-'
                        reference_value: '-None-'
                        colour_code: null
                        actual_value: '-None-'
                        id: '111111000000093642'
                        type: used
                        layout_associations:
                          - api_name: test_1
                            name: test 1
                            id: '111111000000081166'
                          - api_name: Standard__s
                            name: Standard
                            id: '111111000000003592'
                      - sequence_number: 2
                        display_value: Option 1
                        reference_value: Option 1
                        colour_code: '#fea36a'
                        actual_value: Option 1
                        id: '111111000000093637'
                        type: used
                        layout_associations:
                          - api_name: Standard__s
                            name: Standard
                            id: '111111000000003592'
                          - api_name: test_1
                            name: test 1
                            id: '111111000000081166'
                      - sequence_number: 3
                        display_value: Option 2
                        reference_value: Option 2
                        colour_code: '#c9651a'
                        actual_value: Option 2
                        id: '111111000000093639'
                        type: unused
                        layout_associations: null
                      - sequence_number: 4
                        display_value: op 3
                        reference_value: op 3
                        colour_code: '#ced9ff'
                        actual_value: op 3
                        id: '111111000000093683'
                        type: used
                        layout_associations:
                          - api_name: test_1
                            name: test 1
                            id: '111111000000081166'
                          - api_name: Standard__s
                            name: Standard
                            id: '111111000000003592'
        '204':
          description: >-
            The specified field exists in the module but is not a picklist type.
            The API returns an empty response body.
        '400':
          description: >-
            The request failed due to an invalid field ID, an invalid module API
            name, or an unsupported API version. Resolution: Verify that the
            field ID in the request URL is valid, the module API name is
            correct, and the API version is supported.
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    additionalProperties: false
                    description: >-
                      Represents the error response when an invalid picklist
                      field ID is provided in the request URL.
                    properties:
                      code:
                        type: string
                        description: >-
                          Represents the error code returned when an invalid
                          filed ID is provided in the request.
                        enum:
                          - INVALID_DATA
                      details:
                        type: object
                        additionalProperties: false
                        description: >-
                          Contains additional context about the invalid field ID
                          error, including the zero-based index of the invalid
                          path parameter.
                        properties:
                          resource_path_index:
                            type: integer
                            format: int32
                            description: >-
                              Represents the zero-based index of the invalid
                              path parameter in the request URL, where 2
                              indicates the **fieldId** position. Always
                              returned in the response.
                            maximum: 10
                            minimum: 0
                        required:
                          - resource_path_index
                      message:
                        type: string
                        description: >-
                          Represents the error message describing why the
                          request failed due to an invalid field ID.
                        maxLength: 255
                        minLength: 1
                      status:
                        type: string
                        description: >-
                          Represents the status of the response. **Possible
                          values:** **error** - The request was not processed
                          successfully.
                        enum:
                          - error
                    required:
                      - code
                      - details
                      - message
                      - status
                    x-zs-$id: InvalidFieldIdError
                  - type: object
                    additionalProperties: false
                    description: Invalid module name provided in query parameter
                    properties:
                      code:
                        type: string
                        description: >-
                          Represents the error code returned when an invalid
                          module API name is provided in the request. Possible
                          values: **INVALID_MODULE** - The module API name in
                          the request is invalid. Always returned in the
                          response.
                        enum:
                          - INVALID_MODULE
                      message:
                        type: string
                        description: >-
                          Represents the error message describing why the
                          request failed due to an invalid module name.
                        maxLength: 255
                        minLength: 1
                      details:
                        type: object
                        additionalProperties: false
                        description: >-
                          Contains additional error context for this response.
                          Returns an empty object for the **INVALID_MODULE**
                          error. Always returned in the response.
                      status:
                        type: string
                        description: >-
                          Represents the status of the response. Possible
                          values: **error** - The request was not processed
                          successfully. Always returned in the response.
                        enum:
                          - error
                    required:
                      - code
                      - details
                      - message
                      - status
                    x-zs-$id: InvalidModuleError
                  - type: object
                    additionalProperties: false
                    description: >-
                      Represents the error response when the specified API
                      version is not supported.
                    properties:
                      status:
                        type: string
                        description: >-
                          Represents the status of the response. Possible
                          values: **error** - The request was not processed
                          successfully. Always returned in the response.
                        enum:
                          - error
                      code:
                        type: string
                        description: >-
                          Represents the error code returned when the specified
                          API version is not supported. Possible values:
                          **VERSION_NOT_SUPPORTED** - The API version specified
                          in the request URL is not supported. Always returned
                          in the response.
                        enum:
                          - VERSION_NOT_SUPPORTED
                      message:
                        type: string
                        description: >-
                          Represents the error message describing why the
                          request failed due to an unsupported API version.
                        maxLength: 255
                        minLength: 1
                      details:
                        type: object
                        additionalProperties: false
                        description: >-
                          Contains additional error context for this response.
                          Returns an empty object for the
                          **VERSION_NOT_SUPPORTED** error.
                    required:
                      - code
                      - details
                      - message
                      - status
                    x-zs-$id: VersionNotSupportedError
                x-zs-$id: GetPickListValuesErrorResponse
              examples:
                InvalidFieldId:
                  summary: Invalid field ID in request URL
                  value:
                    code: INVALID_DATA
                    details:
                      resource_path_index: 2
                    message: the id given seems to be invalid
                    status: error
                InvalidModule:
                  summary: Invalid module API name in request
                  value:
                    code: INVALID_MODULE
                    details: {}
                    message: the module name given seems to be invalid
                    status: error
                VersionNotSupported:
                  summary: Unsupported API version in request URL
                  value:
                    code: VERSION_NOT_SUPPORTED
                    details: {}
                    message: api version is not supported
                    status: error
        '403':
          description: >-
            Permission denied to access field metadata. Resolution: The CRM
            administrator must grant the required permission to the user's
            profile (Crm_Implied_Customize_Zoho_CRM permission).
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                description: >-
                  Represents the error response when the user does not have the
                  required permissions to access picklist field metadata.
                properties:
                  code:
                    type: string
                    description: >-
                      Represents the error code returned when permission to
                      access field metadata is denied. Possible values:
                      **NO_PERMISSION** - The user does not have the required
                      permission to access this resource. Always returned in the
                      response.
                    enum:
                      - NO_PERMISSION
                  details:
                    type: object
                    additionalProperties: false
                    description: >-
                      Contains additional context about the permission error,
                      including the list of required permissions that are
                      missing.
                    properties:
                      permissions:
                        type: array
                        description: >-
                          Represents the list of CRM permissions required to
                          perform this action that are missing from the user's
                          profile. Always returned in the response. Array
                          contains unique permission identifiers; order is not
                          significant.
                        items:
                          type: string
                          description: >-
                            Represents a permission identifier required for this
                            action.
                          maxLength: 255
                          minLength: 1
                        maxItems: 10
                        minItems: 1
                        uniqueItems: true
                    required:
                      - permissions
                  message:
                    type: string
                    description: >-
                      Human-readable error message describing the permission
                      denial
                    maxLength: 255
                    minLength: 1
                  status:
                    type: string
                    description: >-
                      Represents the status of the response. Possible values:
                      **error** - The request was not processed successfully.
                      Always returned in the response.
                    enum:
                      - error
                required:
                  - code
                  - details
                  - message
                  - status
                x-zs-$id: NoPermissionError
              examples:
                NoPermission:
                  summary: Missing required permission to access field metadata
                  value:
                    code: NO_PERMISSION
                    details:
                      permissions:
                        - Crm_Implied_Customize_Zoho_CRM
                    message: permission denied
                    status: error
      security:
        - OAuth2:
            - ZohoCRM.settings.fields.READ
  /settings/fields/{fieldId}/pick_list_values/{pickListValueId}:
    get:
      summary: get a picklist field option
      x-zs-llm-description: >-
        This endpoint retrieves a specific picklist field option by its unique
        identifier (pickListValueId) for a given field (fieldId) in a specified
        module. It returns the details of the picklist option, including its
        display value, reference value, color code, actual value, type (used or
        unused), and layout associations. If the picklist option does not exist
        or is not associated with the specified field, appropriate error
        responses will be returned.
      description: Picklist field option GET
      operationId: getPickListValuesByPickListValueid
      parameters:
        - $ref: '#/components/parameters/Module'
        - $ref: '#/components/parameters/FieldId'
        - $ref: '#/components/parameters/ParamPathPickListValueId'
      responses:
        '200':
          description: OK - Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PicklistOptionLookupResponse'
              examples:
                Success200:
                  summary: Success response for status 200
                  value:
                    pick_list_values:
                      - sequence_number: 1
                        display_value: Referral
                        reference_value: Referral
                        colour_code: null
                        actual_value: Referral
                        id: '2423488000000002313'
                        type: used
                        layout_associations:
                          - api_name: Standard__s
                            name: Standard
                            id: '2423488000000095055'
                          - api_name: testing_layout
                            name: testing layout
                            id: '2423488000000771002'
        '204':
          description: No Content - Successful response with no body
        '400':
          description: Bad Request - The request cannot be processed due to invalid syntax.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: >-
                      #/components/schemas/InvalidFieldIdForPicklistValuesErrorResponse
                  - $ref: '#/components/schemas/InvalidModuleErrorResponse'
                  - $ref: >-
                      #/components/schemas/RequiredModuleParameterMissingErrorResponse
                  - $ref: '#/components/schemas/FeatureNotSupportedErrorResponse'
                x-zs-$id: GetpicklistvaluesbypicklistvalueidError400
              examples:
                InvalidDataResponse1:
                  summary: >-
                    Error response with code INVALID_DATA: The Field Id is
                    Invalid
                  value:
                    code: INVALID_DATA
                    details:
                      resource_path_index: 2
                    message: The Field Id is Invalid
                    status: error
                InvalidModuleResponse1:
                  summary: >-
                    Error response with code INVALID_MODULE: the module name
                    given seems to be invalid
                  value:
                    code: INVALID_MODULE
                    details:
                      param_name: module
                    message: the module name given seems to be invalid
                    status: error
                RequiredParamMissingResponse1:
                  summary: >-
                    Error response with code REQUIRED_PARAM_MISSING: One of the
                    expected parameter is missing
                  value:
                    code: REQUIRED_PARAM_MISSING
                    details:
                      param_name: module
                    message: One of the expected parameter is missing
                    status: error
                FeatureNotSupportedResponse1:
                  summary: >-
                    Error response with code FEATURE_NOT_SUPPORTED: Your License
                    does not support this feature
                  value:
                    code: FEATURE_NOT_SUPPORTED
                    details: {}
                    message: Your License does not support this feature
                    status: error
        '403':
          description: Forbidden - The client does not have access rights to the content.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionDeniedErrorResponse'
              examples:
                NoPermissionResponse1:
                  summary: 'Error response with code NO_PERMISSION: permission denied'
                  value:
                    code: NO_PERMISSION
                    details:
                      permissions:
                        - Crm_Implied_Customize_Zoho_CRM
                    message: permission denied
                    status: error
      security:
        - OAuth2:
            - ZohoCRM.settings.fields.READ
    delete:
      summary: Delete a picklist field option
      description: Delete picklist field option
      x-zs-llm-description: >-
        This endpoint allows you to delete a specific picklist field option by
        its unique identifier (pickListValueId) for a given field (fieldId) in a
        specified module. The deletion can be immediate or scheduled based on
        the system's processing capabilities. The response will indicate whether
        the deletion was successful, scheduled for later processing, or if there
        were any errors preventing the deletion, such as the option being in use
        or restricted.
      operationId: deletePickListValuesByPickListValueid
      parameters:
        - $ref: '#/components/parameters/Module'
        - $ref: '#/components/parameters/FieldId'
        - $ref: '#/components/parameters/ParamPathPickListValueId'
      responses:
        '200':
          description: OK - Picklist option deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectPicklistOptionDeletionResponse'
              examples:
                Success200:
                  summary: Success response for status 200
                  value:
                    pick_list_values:
                      - code: SUCCESS
                        details:
                          id: '111111000000004126'
                        message: PickList Option deleted successfully
                        status: success
        '202':
          description: Accepted - Request accepted for processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PicklistOptionDeletionResponse'
              examples:
                Success202:
                  summary: Success response for status 202
                  value:
                    pick_list_values:
                      - code: SCHEDULED
                        details:
                          job_id: '1111130000001941380'
                        message: Picklist Option deletion scheduled successfully
                        status: success
        '400':
          description: Bad Request - The request cannot be processed due to invalid syntax.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/InvalidPicklistOptionIdErrorResponse'
                  - $ref: '#/components/schemas/InvalidModuleErrorResponse'
                  - $ref: >-
                      #/components/schemas/InvalidFieldIdForPicklistValuesErrorResponse
                  - $ref: >-
                      #/components/schemas/RestrictedPicklistOptionDeletionErrorResponse
                  - $ref: '#/components/schemas/PicklistOptionInUseErrorResponse'
                  - $ref: >-
                      #/components/schemas/GlobalPicklistOptionDeletionErrorResponse
                  - $ref: >-
                      #/components/schemas/MinimumPicklistOptionConstraintErrorResponse
                  - $ref: >-
                      #/components/schemas/MultipleLayoutAssociationDeletionErrorResponse
                  - $ref: >-
                      #/components/schemas/RequiredModuleParameterMissingErrorResponse
                  - $ref: '#/components/schemas/FeatureNotSupportedErrorResponse'
                x-zs-$id: DeletepicklistvaluesbypicklistvalueidError400
              examples:
                InvalidDataResponse1:
                  summary: >-
                    Error response with code INVALID_DATA: pickList option is
                    not available
                  value:
                    code: INVALID_DATA
                    details:
                      resource_path_index: 4
                    message: pickList option is not available
                    status: error
                InvalidModuleResponse1:
                  summary: >-
                    Error response with code INVALID_MODULE: the module name
                    given seems to be invalid
                  value:
                    code: INVALID_MODULE
                    details:
                      param_name: module
                    message: the module name given seems to be invalid
                    status: error
                InvalidDataResponse2:
                  summary: >-
                    Error response with code INVALID_DATA: The Field Id is
                    Invalid
                  value:
                    code: INVALID_DATA
                    details:
                      resource_path_index: 2
                    message: The Field Id is Invalid
                    status: error
                NotAllowedResponse1:
                  summary: >-
                    Error response with code NOT_ALLOWED: Restricted Option
                    cannot be deleted
                  value:
                    code: NOT_ALLOWED
                    details:
                      resource_path_index: 4
                    message: Restricted Option cannot be deleted
                    status: error
                NotAllowedResponse2:
                  summary: >-
                    Error response with code NOT_ALLOWED: The picklist option is
                    used in features
                  value:
                    code: NOT_ALLOWED
                    details:
                      _associations:
                        - resources:
                            - name: Lead Nurturing blueprint
                              id: '1560451000004719301'
                              _details: null
                          type: blueprint
                        - resources:
                            - name: CadenceTest1
                              id: '1560451000004719986'
                              _details: null
                          type: cadences
                      resource_path_index: 4
                    message: The picklist option is used in features
                    status: error
                NotAllowedResponse3:
                  summary: >-
                    Error response with code NOT_ALLOWED: Global picklist option
                    cannot be deleted
                  value:
                    code: NOT_ALLOWED
                    details:
                      resource_path_index: 4
                    message: Global picklist option cannot be deleted
                    status: error
                NotAllowedResponse4:
                  summary: >-
                    Error response with code NOT_ALLOWED: PickList field should
                    have at least one option in the layouts
                  value:
                    code: NOT_ALLOWED
                    details:
                      resource_path_index: 4
                    message: >-
                      PickList field should have at least one option in the
                      layouts
                    status: error
                NotAllowedResponse5:
                  summary: >-
                    Error response with code NOT_ALLOWED: PickList field should
                    be in at most one layout or in unused state in all layouts
                  value:
                    code: NOT_ALLOWED
                    details:
                      resource_path_index: 4
                    message: >-
                      PickList field should be in at most one layout or in
                      unused state in all layouts
                    status: error
                RequiredParamMissingResponse1:
                  summary: >-
                    Error response with code REQUIRED_PARAM_MISSING: One of the
                    expected parameter is missing
                  value:
                    code: REQUIRED_PARAM_MISSING
                    details:
                      param_name: module
                    message: One of the expected parameter is missing
                    status: error
                FeatureNotSupportedResponse1:
                  summary: >-
                    Error response with code FEATURE_NOT_SUPPORTED: Your License
                    does not support this feature
                  value:
                    code: FEATURE_NOT_SUPPORTED
                    details: {}
                    message: Your License does not support this feature
                    status: error
        '403':
          description: Forbidden - The client does not have access rights to the content.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionDeniedErrorResponse'
              examples:
                NoPermissionResponse1:
                  summary: 'Error response with code NO_PERMISSION: permission denied'
                  value:
                    code: NO_PERMISSION
                    details:
                      permissions:
                        - Crm_Implied_Customize_Zoho_CRM
                    message: permission denied
                    status: error
      security:
        - OAuth2:
            - ZohoCRM.settings.fields.DELETE
  /settings/fields/{fieldId}/actions/replace_pick_list_values:
    post:
      summary: Replace Pick list values
      description: Replace picklist value
      x-zs-llm-description: >-
        This endpoint allows you to replace one or more picklist values in a
        specified field of a module. You can provide a old value to be replaced
        with new value, along with an option to delete the old values after
        replacement. The request body should contain the details of the old and
        new picklist values, including their IDs and display values. The
        response will indicate whether the replacement operation was scheduled
        successfully or if there were any errors during processing those
        respective errors will be mentioned.
      operationId: postReplacePickListValues
      parameters:
        - $ref: '#/components/parameters/Module'
        - $ref: '#/components/parameters/FieldId'
      requestBody:
        description: Request body
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PicklistReplaceRequestBody'
            examples:
              SamplePostRequest:
                summary: Sample request body
                value:
                  replace_pick_list_values:
                    - old_value:
                        id: '1111130000001470910'
                        display_value: Option 1
                      new_value:
                        id: '1111130000001470030'
                        display_value: Option 2
                      delete_old_value: true
      responses:
        '202':
          description: Accepted - Request accepted for processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PicklistReplaceResponse'
              examples:
                Success202:
                  summary: Success response for status 202
                  value:
                    replace_pick_list_values:
                      - code: SCHEDULED
                        details:
                          job_id: '2423488000000732044'
                        message: >-
                          Picklist option replace operation scheduled
                          successfully
                        status: success
        '400':
          description: Bad Request - The request cannot be processed due to invalid syntax.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/InvalidFieldIdErrorResponse'
