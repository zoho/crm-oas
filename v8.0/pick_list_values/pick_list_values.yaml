  parameters:
    FieldId:
      name: fieldId
      in: path
      description: >-
        Specify the unique numeric identifier of the field. Refer to the [Get
        Fields Metadata](fields.json#$.paths./settings/fields/{fieldId}.get)
        resource for valid values.
      required: true
      style: simple
      explode: false
      schema:
        type: string
        format: int64
        minLength: 1
      examples:
        StandardField:
          summary: Example field ID
          value: '1629307000006596211'
    Module:
      name: module
      in: query
      description: >-
        Specify the API name of the CRM module that contains the field. Refer to
        the [Get Modules](modules.json#$.paths./settings/modules.get) resource
        for valid values.
      required: true
      style: form
      explode: true
      schema:
        type: string
        maxLength: 50
        minLength: 1
      examples:
        Leads:
          summary: Leads module
          value: Leads
        Contacts:
          summary: Contacts module
          value: Contacts
        Accounts:
          summary: Accounts module
          value: Accounts
        Deals:
          summary: Deals module
          value: Deals
    ParamPathPickListValueId:
      name: pickListValueId
      in: path
      description: 'Path parameter: pickListValueId'
      required: true
      schema:
        type: string
        format: int64
        example: '{pickListValueId}'
        maxLength: 255
  securitySchemes:
    OAuth2:
      type: oauth2
      description: OAuth2 authentication for API access
      flows:
        authorizationCode:
          authorizationUrl: https://accounts.zoho.com/oauth/v2/auth
          tokenUrl: https://accounts.zoho.com/oauth/v2/token
          refreshUrl: https://accounts.zoho.com/oauth/v2/token
          scopes:
            ZohoCRM.settings.fields.READ: Access to ZohoCRM.settings.fields.READ scope
            ZohoCRM.settings.fields.DELETE: Access to ZohoCRM.settings.fields.DELETE scope
            ZohoCRM.settings.fields.UPDATE: Access to ZohoCRM.settings.fields.UPDATE scope
