        - OAuth2:
            - ZohoCRM.settings.global_picklist.DELETE
  /settings/global_picklists/{id}:
    get:
      summary: Get a Single Global Picklist by ID
      description: >-
        Fetches the global picklist for given id along with their
        pick_list_values. used_in_modules, and associated_fields_count can be
        included in the response based on the 'include' query parameter. Use the
        `fields` query parameter to filter the response by key, so that only the
        requested keys along with `id` are returned. A 204 is returned when no
        global picklists exist.
      x-zs-llm-description: >-
        Fetches one global picklist by numeric `id`. Always returns
        `pick_list_values` (internally calls `getGlobalFieldsWithOptions`). Use
        `include` to expand `used_in_modules` and `associated_fields_count`, and
        `fields` to restrict the response to specific keys — only the requested
        keys along with `id` are returned. Returns 204 when the row is hidden
        from the caller (e.g. feature unavailable and the record is not marked
        private).
      operationId: getSingleGlobalPicklists
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/Include'
        - $ref: '#/components/parameters/IncludeInnerDetails'
        - $ref: '#/components/parameters/Fields'
      responses:
        '200':
          description: >-
            Fetches the global picklist for given id along with their
            pick_list_values. used_in_modules, and associated_fields_count can
            be included in the response based on the 'include' query parameter.
            When the 'fields' query parameter is given, only the requested keys
            along with 'id' are returned. A 204 is returned when no global
            picklists exist.
          content:
            application/json:
              schema:
                type: object
                x-zs-$id: GetSingleGlobalPicklistResponseSchema
                description: Response object containing an array of global picklists.
                properties:
                  global_picklists:
                    type: array
                    description: Array of global picklists with their properties.
                    maxItems: 1
                    items:
                      type: object
                      description: >-
                        Global picklist object with details. Every key listed
                        here is returned by default. When the 'fields' query
                        parameter is used, only the requested keys along with
                        'id' are present in the response, hence 'id' is the only
                        key that is always returned.
                      additionalProperties: false
                      properties:
                        display_label:
                          type: string
                          description: Display label of the global picklist.
                          maxLength: 50
                        api_name:
                          $ref: '#/components/schemas/ApiName'
                        source:
                          type: string
                          description: Source of the global picklist.
                          maxLength: 50
                          enum:
                            - crm
                            - platform_plugin
                            - marketplace_plugin
                        created_time:
                          type:
                            - string
                            - 'null'
                          description: Creation timestamp of the global picklist.
                          format: date-time
                        modified_time:
                          type:
                            - string
                            - 'null'
                          description: Last modification timestamp of the global picklist.
                          format: date-time
                        id:
                          $ref: '#/components/schemas/Id'
                        actual_label:
                          type: string
                          description: Actual label of the global picklist.
                          maxLength: 50
                        description:
                          type:
                            - string
                            - 'null'
                          description: Description of the global picklist.
                          maxLength: 1000
                        associated_fields_count:
                          type: integer
                          description: >-
                            Number of fields associated with this global
                            picklist.
                          format: int32
                        modified_by:
                          description: User who last modified the global picklist.
                          oneOf:
                            - type: object
                              x-zs-$id: GetSingleGlobalPicklistModifiedByUserSchema
                              description: User object with name and id.
                              additionalProperties: false
                              properties:
