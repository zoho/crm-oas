openapi: 3.1.0
info:
  title: Global Picklists
  description: >-
    Global sets are collections of picklist values that can be associated with
    multiple picklists across modules. Example use cases include maintaining a
    consistent set of status values or priority levels across different modules
    in a CRM system. By using global sets, administrators can ensure uniformity
    and simplify the management of picklist values, as any updates to the global
    set automatically reflect in all associated picklists. This feature enhances
    data integrity and reduces redundancy, making it easier to manage and
    analyze data across various modules.
  version: '8.0'
servers:
  - url: https://zohoapis.{dc}/crm/{version}
    description: Production API server for Zoho CRM.
    variables:
      dc:
        enum:
          - com
          - eu
          - in
          - cn
          - au
        default: com
        description: API Server URL TLD
      version:
        description: The API version identifier. Default:v8.
        default: v8
security:
  - OAuth2:
      - ZohoCRM.settings.global_picklist.ALL
      - ZohoCRM.settings.ALL
      - ZohoCRM.settings.global_picklist.READ
      - ZohoCRM.settings.global_picklist.CREATE
      - ZohoCRM.settings.global_picklist.UPDATE
      - ZohoCRM.settings.global_picklist.DELETE
paths:
  /settings/global_picklists:
    get:
      summary: Get All Global Picklists
      description: >-
        Fetches the list of global picklists available in the organization along
        with their details. pick_list_values, used_in_modules, and
        associated_fields_count can be included in the response based on the
        "include" query parameter. The response can be filtered in three ways:
        use the "fields" query parameter to filter by key, so that only the
        requested keys along with "id" are returned; use the "filters" query
        parameter to filter the global picklists themselves by the value of a
        key; and use the "inner_details_filters" query parameter to filter the
        inner details of the global picklists. A 204 is returned when no global
        picklists exist.
      x-zs-llm-description: >-
        Lists every global picklist in the org. Use the "include" query
        (pick_list_values, used_in_modules, associated_fields_count) to expand
        inner details; pick_list_values triggers the heavier
        getGlobalFieldsWithOptions fetch internally. Use "fields" to restrict
        the response to specific keys — only the requested keys along with "id"
        are returned, and a key repeated in the list is processed once. Use
        "filters" to select the global picklists by the value of a key — either
        a single criteria (field/comparator/value) or a group of criteria
        combined with group_operator — and "inner_details_filters" to filter the
        inner details of the global picklists. Only api_name, source and
        customizable can be filtered on in "filters" (customizable is boolean
        and takes only equal); anything else returns 400 NOT_SUPPORTED.
        Internal/private global sets are filtered out unless the caller is
        explicitly entitled. Returns 204 when the feature is unavailable and no
        internal sets are requested.
      operationId: getBulkGlobalPicklists
      parameters:
        - $ref: '#/components/parameters/Include'
        - $ref: '#/components/parameters/IncludeInnerDetails'
        - $ref: '#/components/parameters/Fields'
        - $ref: '#/components/parameters/ParamQueryInnerDetailsFilters'
        - $ref: '#/components/parameters/Filters'
      responses:
        '200':
          description: >-
            Fetches the list of global picklists available in the organization
            along with their details. pick_list_values, used_in_modules, and
            associated_fields_count can be included in the response based on the
            "include" query parameter. When the "fields" query parameter is
            given, only the requested keys along with "id" are returned. When
            the "filters" query parameter is given, only the global picklists
            matching the criteria are returned. A 204 is returned when no global
            picklists exist.
          content:
            application/json:
              schema:
                type: object
                x-zs-$id: GetBulkGlobalPicklistsResponseSchema
                description: Response object containing an array of global picklists.
                properties:
                  global_picklists:
                    type: array
                    description: Array of global picklists with their properties.
                    maxItems: 100
                    items:
                      type: object
                      description: >-
                        Global picklist object with details. Every key listed
                        here is returned by default. When the 'fields' query
                        parameter is used, only the requested keys along with
                        'id' are present in the response, hence 'id' is the only
                        key that is always returned.
                      additionalProperties: false
                      properties:
                        display_label:
                          type: string
                          description: Display label of the global picklist.
                          maxLength: 50
                        source:
                          type: string
                          description: Source of the global picklist.
                          maxLength: 50
                          enum:
                            - crm
                            - platform_plugin
                            - marketplace_plugin
                        api_name:
                          $ref: '#/components/schemas/ApiName'
                          x-zs-$id: GlobalPicklistsApiName
                        created_time:
                          type:
                            - string
                            - 'null'
                          description: Creation timestamp of the global picklist.
                          format: date-time
                        modified_time:
                          type:
                            - string
                            - 'null'
                          description: Last modification timestamp of the global picklist.
                          format: date-time
                        id:
                          $ref: '#/components/schemas/Id'
                          x-zs-$id: GlobalPicklistsId
                        actual_label:
                          type: string
                          description: Actual label of the global picklist.
                          maxLength: 50
                        description:
                          type:
                            - string
                            - 'null'
                          description: Description of the global picklist.
                          maxLength: 1000
                        associated_fields_count:
                          type: integer
                          description: >-
                            Number of fields associated with this global
                            picklist.
                          format: int32
                        modified_by:
                          description: User who last modified the global picklist.
                          oneOf:
                            - type: object
                              x-zs-$id: UserObjectSchema
                              description: User object with name and id.
                              additionalProperties: false
                              properties:
                                name:
                                  type: string
                                  description: Name of the user.
                                  maxLength: 255
                                id:
                                  $ref: '#/components/schemas/Id'
                            - type: 'null'
                              x-zs-$id: NullUserSchema
                              description: Null if no user information is available.
                        used_in_modules:
                          type:
                            - array
                            - 'null'
                          description: Array of modules using this global picklist.
                          maxItems: 100
                          items:
                            type: object
                            description: Module object with details.
                            additionalProperties: false
                            properties:
                              plural_label:
                                $ref: '#/components/schemas/ModulepluralLabel'
                              api_name:
                                $ref: '#/components/schemas/ApiName'
                              id:
                                $ref: '#/components/schemas/Id'
                        created_by:
                          description: User who created the global picklist.
                          oneOf:
                            - type: object
                              x-zs-$id: UserObjectNameAndIDSchema
                              description: User object with name and id.
                              additionalProperties: false
                              properties:
                                name:
                                  type: string
                                  description: Name of the user.
                                  maxLength: 255
                                id:
                                  $ref: '#/components/schemas/Id'
                            - type: 'null'
                              x-zs-$id: NullCreatedByUserSchema
                              description: Null if no user information is available.
                        presence:
                          type: boolean
                          description: >-
                            Indicates if the global picklist is present. false
                            if global picklist is in delete scheduler.
                        customizable:
                          type: boolean
                          description: Indicates if the global picklist is customizable.
                        pick_list_values_sorted_lexically:
                          type: boolean
                          description: Indicates if picklist values are sorted lexically.
                        pick_list_values:
                          type: array
                          description: Array of picklist values.
                          maxItems: 5000
                          items:
                            type: object
                            description: Picklist value object.
                            additionalProperties: false
                            properties:
                              type:
                                type: string
                                description: Type of the picklist value (used or unused).
                                enum:
                                  - unused
                                  - used
                              id:
                                $ref: '#/components/schemas/Id'
                                x-zs-$id: GlobalPicklistsPickListValuesId
                              sequence_number:
                                type: integer
                                description: Sequence number of the picklist value.
                                format: int32
                              display_value:
                                $ref: '#/components/schemas/PickListDisplayValue'
                              reference_value:
                                $ref: '#/components/schemas/PickListReferenceValue'
                              actual_value:
                                $ref: '#/components/schemas/PickListActualValue'
                            required:
                              - id
                              - sequence_number
                              - type
                              - display_value
                              - reference_value
                      required:
                        - id
                required:
                  - global_picklists
                additionalProperties: false
              examples:
                GlobalPicklistsBulkMinimal:
                  summary: Minimal successful response
                  value:
                    global_picklists:
                      - display_label: Team Member Role
                        api_name: team_member_role__s
                        customizable: false
                        modified_by: null
                        source: crm
                        description: null
                        pick_list_values_sorted_lexically: false
                        id: '4793076000000560088'
                        presence: true
                        created_by: null
                        actual_label: Team Member Role
                        modified_time: '2023-10-10T10:00:00Z'
                        created_time: '2023-10-01T09:00:00Z'
                      - display_label: Access
                        api_name: access__s
                        customizable: false
                        modified_by: null
                        description: null
                        source: crm
                        pick_list_values_sorted_lexically: false
                        id: '4793076000000560089'
                        presence: true
                        created_by: null
                        actual_label: Access
                        modified_time: '2023-10-10T10:00:00Z'
                        created_time: '2023-10-01T09:00:00Z'
                GlobalPicklistsBulkExpanded:
                  summary: >-
                    Expanded response when
                    include=pick_list_values,used_in_modules,associated_fields_count
                  value:
                    global_picklists:
                      - display_label: Team Member Role
                        used_in_modules:
                          - plural_label: Preferred Team Members
                            api_name: Preferred_Team_Members__s
                            id: '4793076000000559061'
                          - plural_label: Team Selling
                            api_name: Team_Selling__s
                            id: '4793076000000559062'
                        api_name: team_member_role__s
                        customizable: false
                        modified_by: null
                        description: null
                        source: crm
                        pick_list_values_sorted_lexically: false
                        id: '4793076000000560088'
                        presence: true
                        created_by: null
                        actual_label: Team Member Role
                        pick_list_values:
                          - display_value: Owner
                            sequence_number: 1
                            actual_value: Owner
                            reference_value: Owner
                            id: '4793076000000564764'
                            type: used
                          - display_value: Admin
                            sequence_number: 2
                            actual_value: Admin
                            id: '4793076000000564765'
                            reference_value: Admin
                            type: used
                          - display_value: Member
                            sequence_number: 3
                            actual_value: Member
                            reference_value: Member
                            id: '4793076000000564766'
                            type: unused
                        modified_time: '2023-10-10T10:00:00Z'
                        created_time: '2023-10-01T09:00:00Z'
                      - display_label: Access
                        api_name: access__s
                        customizable: false
                        modified_by: null
                        description: null
                        source: crm
                        pick_list_values_sorted_lexically: false
                        id: '4793076000000560089'
                        presence: true
                        created_by: null
                        actual_label: Access
                        pick_list_values:
                          - display_value: Private
                            sequence_number: 1
                            actual_value: Private
                            reference_value: Private
                            id: '4793076000000564770'
                            type: used
                          - display_value: Public Read Only
                            sequence_number: 2
                            actual_value: Public Read Only
                            reference_value: Public Read Only
                            id: '4793076000000564771'
                            type: used
                          - display_value: Public Read/Write
                            sequence_number: 3
                            actual_value: Public Read/Write
                            reference_value: Public Read/Write
                            id: '4793076000000564772'
                            type: unused
                        modified_time: '2023-10-10T10:00:00Z'
                        created_time: '2023-10-01T09:00:00Z'
                GlobalPicklistsFilteredByKey:
                  summary: Response when fields=display_label,api_name,customizable
                  value:
                    global_picklists:
                      - display_label: Team Member Role
                        api_name: team_member_role__s
                        customizable: false
                        id: '4793076000000560088'
                      - display_label: Access
                        api_name: access__s
                        customizable: false
                        id: '4793076000000560089'
                      - display_label: Industry
                        api_name: Industry
                        customizable: true
                        id: '4793076000000560090'
                GlobalPicklistsFilteredByValue:
                  summary: >-
                    Response when filters selects a single global picklist by
                    api_name
                  value:
                    global_picklists:
                      - display_label: Industry
                        api_name: Industry
                        actual_label: Industry
                        customizable: true
                        description: null
                        source: crm
                        pick_list_values_sorted_lexically: false
                        presence: true
                        created_by: null
                        modified_by: null
                        created_time: null
                        modified_time: null
                        id: '4793076000000560090'
        '204':
          description: No global picklists available. (No content)
        '400':
          description: >-
            Bad Request - The request cannot be processed due to invalid syntax,
            or the "filters" or "inner_details_filters" query parameter is
            malformed, holds an unsupported key, comparator or value, or a
            mandatory/dependent key inside it is missing.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: >-
                      #/components/schemas/GlobalPicklistsInvalidFilterParamError
                  - $ref: >-
                      #/components/schemas/GlobalPicklistsMandatoryApiNameMissingError
                  - $ref: '#/components/schemas/GlobalPicklistsInvalidApiNameError'
                  - $ref: '#/components/schemas/GlobalPicklistsInvalidFiltersError'
                  - $ref: >-
                      #/components/schemas/GlobalPicklistsUnsupportedComparatorError
                  - $ref: >-
                      #/components/schemas/GlobalPicklistsDependentTypeMismatchError
                  - $ref: >-
                      #/components/schemas/GlobalPicklistsMissingComparatorForFieldError
                  - $ref: '#/components/schemas/GlobalPicklistsNotSupportedFieldError'
                  - $ref: >-
                      #/components/schemas/GlobalPicklistsInvalidGroupOperatorError
                x-zs-$id: GetbulkglobalpicklistsError400
              examples:
                InvalidDataResponse1:
                  summary: 'Error response with code INVALID_DATA: invalid data'
                  value:
                    code: INVALID_DATA
                    details:
                      expected_data_type: jsonarray
                      param_name: inner_details_filters
                    message: invalid data
                    status: error
                MandatoryNotFoundResponseApiName:
                  summary: >-
                    Error response with code MANDATORY_NOT_FOUND: required field
                    not found (Field: api_name)
                  value:
                    code: MANDATORY_NOT_FOUND
                    details:
                      api_name: api_name
                      json_path: $.inner_details_filters[0].api_name
                      param_name: inner_details_filters
                    message: required field not found
                    status: error
                MandatoryNotFoundResponseFilters:
                  summary: >-
                    Error response with code MANDATORY_NOT_FOUND: required field
                    not found (Field: filters)
                  value:
                    code: MANDATORY_NOT_FOUND
                    details:
                      api_name: filters
                      json_path: $.inner_details_filters[0].filters
                      param_name: inner_details_filters
                    message: required field not found
                    status: error
                MandatoryNotFoundResponseField:
                  summary: >-
                    Error response with code MANDATORY_NOT_FOUND: required field
                    not found (Field: field)
                  value:
                    code: MANDATORY_NOT_FOUND
                    details:
                      api_name: field
                      json_path: $.inner_details_filters[0].filters.field
                      param_name: inner_details_filters
                    message: required field not found
                    status: error
                MandatoryNotFoundResponseFieldApiName:
                  summary: >-
                    Error response with code MANDATORY_NOT_FOUND: required field
                    not found (Field: field.api_name)
                  value:
                    code: MANDATORY_NOT_FOUND
                    details:
                      api_name: api_name
                      json_path: $.inner_details_filters[0].filters.field.api_name
                      param_name: inner_details_filters
                    message: required field not found
                    status: error
                InvalidDataResponse2:
                  summary: >-
                    Error response with code INVALID_DATA: invalid data (Field:
                    api_name)
                  value:
                    code: INVALID_DATA
                    details:
                      api_name: api_name
                      json_path: $.inner_details_filters[0].api_name
                      param_name: inner_details_filters
                    message: invalid data
                    status: error
                InvalidDataResponse3:
                  summary: >-
                    Error response with code INVALID_DATA: invalid data (Field:
                    filters)
                  value:
                    code: INVALID_DATA
                    details:
                      api_name: filters
                      expected_data_type: jsonobject
                      json_path: $.inner_details_filters[0].filters
                      param_name: inner_details_filters
                    message: invalid data
                    status: error
                InvalidDataResponse4:
                  summary: >-
                    Error response with code INVALID_DATA: The value given is
                    not supported (Field: comparator)
                  value:
                    code: INVALID_DATA
                    details:
                      api_name: comparator
                      json_path: $.inner_details_filters[0].filters.comparator
                      supported_values:
                        - equal
                        - not_equal
                      param_name: inner_details_filters
                    message: The value given is not supported
                    status: error
                DependentMismatchResponse1:
                  summary: >-
                    Error response with code DEPENDENT_MISMATCH: dependent
                    mismatch (Field: value)
                  value:
                    code: DEPENDENT_MISMATCH
                    details:
                      dependee:
                        api_name: api_name
                        json_path: $.inner_details_filters[0].filters.field.api_name
                      expected_data_type: boolean
                      api_name: value
                      json_path: $.inner_details_filters[0].filters.value
                      param_name: inner_details_filters
                    message: dependent mismatch
                    status: error
                DependentFieldMissingResponse1:
                  summary: >-
                    Error response with code DEPENDENT_FIELD_MISSING: Dependent
                    Field missing (Field: comparator)
                  value:
                    code: DEPENDENT_FIELD_MISSING
                    details:
                      dependee:
                        api_name: field
                        json_path: $.inner_details_filters[0].filters.field
                      api_name: comparator
                      json_path: $.inner_details_filters[0].filters.comparator
                      param_name: inner_details_filters
                    message: Dependent Field missing
                    status: error
                NotSupportedFieldResponse1:
                  summary: >-
                    Error response with code NOT_SUPPORTED: The value given is
                    not supported (Field: api_name)
                  value:
                    code: NOT_SUPPORTED
                    details:
                      api_name: api_name
                      json_path: $.inner_details_filters[0].filters.field.api_name
                      param_name: inner_details_filters
                    message: The value given is not supported
                    status: error
                NotSupportedFieldResponse2:
                  summary: >-
                    Error response with code NOT_SUPPORTED: The value given is
                    not supported (Field: api_name in nested group)
                  value:
                    code: NOT_SUPPORTED
                    details:
                      api_name: api_name
                      json_path: >-
                        $.inner_details_filters[0].filters.group[1].field.api_name
                      param_name: inner_details_filters
                    message: The value given is not supported
                    status: error
                InvalidGroupOperatorResponse1:
                  summary: >-
                    Error response with code INVALID_DATA: invalid data (Field:
                    group_operator)
                  value:
                    code: INVALID_DATA
                    details:
                      api_name: group_operator
                      json_path: $.inner_details_filters[0].filters.group_operator
                      supported_values:
                        - and
                        - or
                      param_name: inner_details_filters
                    message: invalid data
                    status: error
                FiltersNotAJsonObject:
                  summary: filters is empty
                  value:
                    code: INVALID_DATA
                    details:
                      expected_data_type: jsonobject
                      param_name: filters
                    message: invalid data
                    status: error
                FiltersFieldNotFound:
                  summary: field is not given inside filters
                  value:
                    code: MANDATORY_NOT_FOUND
                    details:
                      api_name: field
                      json_path: $.filters.field
                      param_name: filters
                    message: required field not found
                    status: error
                FiltersFieldApiNameNotFound:
                  summary: api_name is not given inside filters.field
                  value:
                    code: MANDATORY_NOT_FOUND
                    details:
                      api_name: api_name
                      json_path: $.filters.field.api_name
                      param_name: filters
                    message: required field not found
                    status: error
                FiltersComparatorMissing:
                  summary: comparator is not given along with field
                  value:
                    code: DEPENDENT_FIELD_MISSING
                    details:
                      dependee:
                        api_name: field
                        json_path: $.filters.field
                      api_name: comparator
                      json_path: $.filters.comparator
                      param_name: filters
                    message: Dependent Field missing
                    status: error
                FiltersValueMissing:
                  summary: value is not given along with field
                  value:
                    code: DEPENDENT_FIELD_MISSING
                    details:
                      dependee:
                        api_name: field
                        json_path: $.filters.field
                      api_name: value
                      json_path: $.filters.value
                      param_name: filters
                    message: Dependent Field missing
                    status: error
                FiltersFieldApiNameNotSupported:
                  summary: The key given in filters.field.api_name cannot be filtered
                  value:
                    code: NOT_SUPPORTED
                    details:
                      api_name: api_name
                      json_path: $.filters.field.api_name
                      param_name: filters
                    message: The value given is not supported
                    status: error
                FiltersComparatorNotSupported:
                  summary: Unsupported comparator given in filters
                  value:
                    code: INVALID_DATA
                    details:
                      api_name: comparator
                      json_path: $.filters.comparator
                      supported_values:
                        - not_equal
                        - equal
                      param_name: filters
                    message: The value given is not supported
                    status: error
                FiltersValueDataTypeMismatch:
                  summary: filters.value is not a string for a string key
                  value:
                    code: DEPENDENT_MISMATCH
                    details:
                      dependee:
                        api_name: api_name
                        json_path: $.filters.field.api_name
                      expected_data_type: string
                      api_name: value
                      json_path: $.filters.value
                      param_name: filters
                    message: dependent mismatch
                    status: error
                FiltersComparatorNotSupportedForBooleanKey:
                  summary: Unsupported comparator given for a boolean key in filters
                  value:
                    code: INVALID_DATA
                    details:
                      api_name: comparator
                      json_path: $.filters.comparator
                      supported_values:
                        - equal
                      param_name: filters
                    message: The value given is not supported
                    status: error
                FiltersValueNotABoolean:
                  summary: filters.value is not a boolean for a boolean key
                  value:
                    code: DEPENDENT_MISMATCH
                    details:
                      dependee:
                        api_name: api_name
                        json_path: $.filters.field.api_name
                      expected_data_type: boolean
                      api_name: value
                      json_path: $.filters.value
                      param_name: filters
                    message: dependent mismatch
                    status: error
                FiltersGroupOperatorNotFound:
                  summary: group is given without group_operator
                  value:
                    code: MANDATORY_NOT_FOUND
                    details:
                      api_name: group_operator
                      json_path: $.filters.group_operator
                      param_name: filters
                    message: required field not found
                    status: error
                FiltersGroupNotFound:
                  summary: group_operator is given without group
                  value:
                    code: MANDATORY_NOT_FOUND
                    details:
                      api_name: group
                      json_path: $.filters.group
                      param_name: filters
                    message: required field not found
                    status: error
                FiltersGroupNotAJsonArray:
                  summary: filters.group is not a JSON array
                  value:
                    code: INVALID_DATA
                    details:
                      expected_data_type: jsonarray
                      api_name: group
                      json_path: $.filters.group
                      param_name: filters
                    message: invalid data
                    status: error
                FiltersGroupFieldNotAJsonObject:
                  summary: field inside a group criteria is not a JSON object
                  value:
                    code: INVALID_DATA
                    details:
                      expected_data_type: jsonobject
                      api_name: field
                      json_path: $.filters.group[1].field
                      param_name: filters
                    message: invalid data
                    status: error
                FiltersGroupFieldNotFound:
                  summary: field is not given inside a group criteria
                  value:
                    code: MANDATORY_NOT_FOUND
                    details:
                      api_name: field
                      json_path: $.filters.group[1].field
                      param_name: filters
                    message: required field not found
                    status: error
                FiltersGroupFieldApiNameNotSupported:
                  summary: The key given inside a group criteria cannot be filtered
                  value:
                    code: NOT_SUPPORTED
                    details:
                      api_name: api_name
                      json_path: $.filters.group[1].field.api_name
                      param_name: filters
                    message: The value given is not supported
                    status: error
                FiltersGroupOperatorNotSupported:
                  summary: Unsupported group_operator given in filters
                  value:
                    code: INVALID_DATA
                    details:
                      api_name: group_operator
                      json_path: $.filters.group_operator
                      supported_values:
                        - and
                        - or
                      param_name: filters
                    message: invalid data
                    status: error
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
        - OAuth2:
            - ZohoCRM.settings.global_picklist.READ
    post:
      summary: Create a Global Picklist
      description: >-
        Creates a new global picklist with the specified display label, API
        name, description, and picklist values. The actual_label, customizable,
        modified_by, created_by, and presence properties are generated by the
        backend. In pick_list_values, only display_value and type are
        considered.
      x-zs-llm-description: >-
        Creates a single global picklist. Required: `display_label` and at least
