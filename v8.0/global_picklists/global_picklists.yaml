    delete:
      operationId: deleteGlobalPicklists
      summary: Delete a Global Picklist
      description: >-
        Deletes a single global picklist by numeric id. This request is
        asynchronous: a 202 Accepted indicates deletion has been scheduled and
        the response includes a job_id in details. There is no status-check
        endpoint currently. If the provided id is not present or deletion has
        already been scheduled, a 400 Bad Request is returned with error
        details.
      x-zs-llm-description: >-
        Asynchronous bulk delete returning 202 with `details.job_id`. The
        picklist enters the delete scheduler; subsequent GET / replace /
        associations calls return 400 `global_picklist_in_delete_scheduler`
        until the job completes. There is no public status-check API for the
        job.
      parameters:
        - name: ids
          in: query
          required: true
          description: >-
            Numeric id of the global picklist to delete. Accepts a single
            numeric id (e.g. 12345).
          schema:
            type: string
            format: int64
          example: '111111000000055938'
      responses:
        '202':
          description: >-
            Accepted - deletion scheduled. Response contains job_id in details.
            No status endpoint is provided.
          content:
            application/json:
              schema:
                type: object
                x-zs-$id: DeleteGlobalPicklistSuccessResponseSchema
                description: Response object for scheduled deletion of a global picklist.
                properties:
                  global_picklists:
                    type: array
                    description: Array containing the scheduled deletion response.
                    maxItems: 1
                    items:
                      type: object
                      description: Scheduled deletion response details.
                      properties:
                        code:
                          type: string
                          description: >-
                            Response code indicating the operation was
                            scheduled.
                          enum:
                            - SCHEDULED
                        message:
                          type: string
                          description: >-
                            Human-readable message about the scheduled
                            operation.
                          maxLength: 255
                        details:
                          type: object
                          description: Additional details about the scheduled deletion.
                          properties:
                            job_id:
                              type: string
                              description: >-
                                Background job identifier for the scheduled
                                deletion.
                              maxLength: 100
                          required:
                            - job_id
                          additionalProperties: false
                        status:
                          type: string
                          description: Status of the operation.
                          enum:
                            - success
                      required:
                        - code
                        - message
                        - details
                        - status
                      additionalProperties: false
                required:
                  - global_picklists
                additionalProperties: false
              examples:
                AcceptedExample:
                  value:
                    global_picklists:
                      - code: SCHEDULED
                        message: Deletion scheduled
                        details:
                          job_id: job_01Fxxxxxx
                        status: success
        '400':
          description: >-
            Bad Request - canonical error shapes for invalid id, already
            scheduled, conversion in progress, association limits, or
            system-defined restrictions.
          content:
            application/json:
              schema:
                type: object
                x-zs-$id: DeleteGlobalPicklistErrorResponseSchema
                description: >-
                  Error response object for bad request containing global
                  picklist deletion errors.
                properties:
                  global_picklists:
                    type: array
                    description: Array of global picklist deletion error details.
                    maxItems: 1
                    items:
                      type: object
                      description: Global picklist deletion error object.
                      additionalProperties: false
                      properties:
                        code:
                          type: string
                          description: >-
                            Error code indicating the type of validation or
                            constraint failure.
                          enum:
                            - INVALID_DATA
                            - NOT_ALLOWED
                        details:
                          type: object
                          description: Additional error-specific details.
                          additionalProperties: false
                          properties:
                            id:
                              type: string
                              description: >-
                                The id of the global picklist that caused the
                                error.
                              maxLength: 100
                          required:
                            - id
                        message:
                          type: string
                          description: Human-readable message describing the error.
                          maxLength: 255
                        status:
                          type: string
                          description: Status of the error response.
                          enum:
                            - error
                      required:
                        - code
                        - details
                        - message
                        - status
                additionalProperties: false
              examples:
                InvalidId:
                  value:
                    global_picklists:
                      - code: INVALID_DATA
                        details:
                          id: '111111000000055935'
                        message: the id given seems to be invalid
                        status: error
                AlreadyScheduled:
                  value:
                    global_picklists:
                      - code: NOT_ALLOWED
                        details:
                          id: '111111000000075039'
                        message: global picklist deletion in progress.
                        status: error
                ConversionInProgress:
                  value:
                    global_picklists:
                      - code: NOT_ALLOWED
                        details:
                          id: '111111000000075039'
                        message: global picklist conversion in progress
                        status: error
                AssociatedTooMany:
                  value:
                    global_picklists:
                      - code: NOT_ALLOWED
                        details:
                          id: '111111000000068005'
                        message: >-
                          global set can't be deleted as it is associated to
                          more than 15 fields
                        status: error
                SystemDefined:
                  value:
                    global_picklists:
                      - code: NOT_ALLOWED
                        details:
                          id: '11111100000005593'
                        message: Deletion of system defined global set is not allowed
                        status: error
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
