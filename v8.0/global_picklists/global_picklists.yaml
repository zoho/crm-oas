  /settings/global_picklists/{id}/actions/replaced_values:
    get:
      summary: Get Replaced Picklist Values
      operationId: getReplacedValues
      tags:
        - Global Picklists
      description: >-
        Retrieves picklist values that are currently being replaced through a
        replace scheduler for the given global picklist ID.
      x-zs-llm-description: >-
        Returns option values currently in progress on the replace scheduler for
        `{id}`. Returns 204 when nothing is queued, 400
        `global_picklist_in_delete_scheduler` when the parent is in delete, and
        400 `invalid_data` when `{id}` is unknown.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: >-
            OK - Replace scheduler in progress. Returns values which are
            currently being replaced.
          content:
            application/json:
              schema:
                type: object
                x-zs-$id: GetReplacedPicklistValuesResponseSchema
                description: >-
                  Response object containing picklist values that are currently
                  being replaced.
                properties:
                  replaced_values:
                    type: array
                    description: >-
                      Array of picklist values that are currently being
                      replaced.
                    maxItems: 500
                    items:
                      type: object
                      description: Object representing a replaced picklist value.
                      properties:
                        display_value:
                          $ref: '#/components/schemas/PickListDisplayValue'
                        reference_value:
                          $ref: '#/components/schemas/PickListReferenceValue'
                      required:
                        - display_value
                        - reference_value
                      additionalProperties: false
                required:
                  - replaced_values
                additionalProperties: false
              examples:
                ReplacedValuesExample:
                  summary: Example response with replaced values
                  value:
                    replaced_values:
                      - display_value: Cold
                        reference_value: Colder
                      - display_value: Warm
                        reference_value: Warmer
        '204':
          description: >-
            No Content - No replace scheduler is currently in progress for the
            given picklist.
        '400':
          description: Bad Request - Invalid data or not allowed action.
          content:
            application/json:
              schema:
                description: >-
                  Error response object containing code, message, details, and
