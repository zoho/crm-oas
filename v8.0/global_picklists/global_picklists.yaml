    GlobalPicklistsNotSupportedFieldError:
      type: object
      additionalProperties: false
      description: >-
        400 error returned when a field api_name value is not supported in the
        global picklists filters or inner_details_filters query parameter. The
        param_name detail identifies the query parameter that caused the error.
        Includes code NOT_SUPPORTED, message 'The value given is not supported',
        status 'error', and details identifying the unsupported field. The
        json_path varies based on the parameter and its filter nesting depth
        (e.g. $.filters.field.api_name, $.filters.group[n].field.api_name,
        $.inner_details_filters[0].filters.field.api_name,
        $.inner_details_filters[0].filters.group[n].field.api_name,
        $.inner_details_filters[0].filters.group[n].group[m].field.api_name,
        etc.).
      properties:
        code:
          type: string
          description: Error code
          enum:
            - NOT_SUPPORTED
        details:
          type: object
          additionalProperties: false
          description: Error details with validation information
          properties:
            api_name:
              type: string
              description: API name contains unsupported field
              maxLength: 255
            json_path:
              type: string
              description: >-
                JSON path to the unsupported field. Varies based on filter
                nesting depth — can point to filters.field.api_name or any
                nested group level such as filters.group[n].field.api_name or
                filters.group[n].group[m].field.api_name.
              maxLength: 1000
            param_name:
              type: string
              description: Name of the parameter that contains the unsupported field
              maxLength: 255
          required:
            - api_name
            - json_path
            - param_name
        message:
          type: string
          description: Error message
          enum:
            - The value given is not supported
        status:
          type: string
          description: Error status
          enum:
            - error
      required:
        - code
        - details
        - message
        - status
      title: Global Picklists Not Supported Field Error
      x-zs-$id: GlobalPicklistsNotSupportedFieldError
    GlobalPicklistsInvalidGroupOperatorError:
      type: object
      additionalProperties: false
      description: >-
        400 error returned when the group_operator value in the filters or
        inner_details_filters query parameter is invalid. The param_name detail
        identifies the query parameter that caused the error. Includes code
        INVALID_DATA, message 'invalid data', status 'error', and details with
        the supported values (and, or).
      properties:
        code:
          type: string
          description: Error code
          enum:
            - INVALID_DATA
        details:
          type: object
          additionalProperties: false
          description: Error details with validation information
          properties:
            api_name:
              type: string
              description: 'Detail field: api_name. Always group_operator for this error.'
              maxLength: 255
              enum:
                - group_operator
            json_path:
              type: string
              description: JSON path to the invalid field
              maxLength: 1000
            supported_values:
              type: array
              description: List of supported values for the group_operator field.
              items:
                type: string
                description: A supported group_operator value.
                maxLength: 255
              maxItems: 25
            param_name:
              type: string
              description: Name of the parameter that contains the invalid field
              maxLength: 255
          required:
            - api_name
            - json_path
            - param_name
            - supported_values
        message:
          type: string
          description: Error message
          enum:
            - invalid data
        status:
          type: string
          description: Error status
          enum:
            - error
      required:
        - code
        - details
        - message
        - status
      title: Global Picklists Invalid Group Operator Error
      x-zs-$id: GlobalPicklistsInvalidGroupOperatorError
    GlobalPicklistInnerDetailsFilter:
      type: object
      x-zs-$id: GlobalPicklistInnerDetailsFilterSchema
      description: >-
        A filter applied on one inner detail of the global picklists. Both
        api_name and filters are mandatory.
      properties:
        api_name:
          type: string
          description: >-
            The inner resource of the global picklists on which the filter is
            applied. Only pick_list_values is supported.
          enum:
            - pick_list_values
        filters:
          $ref: '#/components/schemas/GlobalPicklistInnerDetailsFilters'
      required:
        - api_name
        - filters
      additionalProperties: false
    GlobalPicklistInnerDetailsFilterCriteria:
      type: object
      x-zs-$id: GlobalPicklistInnerDetailsFilterCriteriaSchema
      description: >-
        A single criteria that compares a key of the inner resource against the
        given value.
      properties:
        field:
          type: object
          description: The inner resource key on which the criteria is applied.
          properties:
            api_name:
              type: string
              description: >-
                The api_name of the inner resource key to be filtered on. Only
                type is supported for pick_list_values.
              enum:
                - type
          required:
            - api_name
          additionalProperties: false
        comparator:
          type: string
          description: >-
            Comparator applied between the key and the given value. Dependent on
            field.
          enum:
            - equal
            - not_equal
        value:
          type: string
          description: Value that the key is compared against. Dependent on field.
          enum:
            - used
            - unused
      required:
        - field
        - comparator
        - value
      additionalProperties: false
    GlobalPicklistInnerDetailsFilters:
      description: >-
        Criteria used to filter the inner resource. Either a single criteria or
        a group of criteria combined using a group operator. A group may be
        nested inside another group.
      oneOf:
        - $ref: '#/components/schemas/GlobalPicklistInnerDetailsFilterCriteria'
          x-zs-$id: GlobalPicklistInnerDetailsFiltersSingleCriteria
        - type: object
          x-zs-$id: GlobalPicklistInnerDetailsFiltersGroupSchema
          description: >-
            A group of criteria combined using a group operator. Both
            group_operator and group are mandatory to each other.
          properties:
            group_operator:
              type: string
              description: Operator used to combine the criteria given in group.
              enum:
                - and
                - or
            group:
              type: array
              description: Array of criteria or nested groups to be combined.
              minItems: 1
              maxItems: 10
              items:
                $ref: '#/components/schemas/GlobalPicklistInnerDetailsFilters'
          required:
            - group_operator
            - group
          additionalProperties: false
    GlobalPicklistFilterCriteria:
      type: object
      x-zs-$id: GlobalPicklistFilterCriteriaSchema
      description: >-
        A single filter criteria that compares a global picklist key against the
        given value. The supported comparator and the data type of value depend
        on the key given in field.
      properties:
        field:
          type: object
          description: The global picklist key on which the criteria is applied.
          properties:
            api_name:
              type: string
              description: >-
                The api_name of the key to be filtered on. Only api_name, source
                and customizable are supported.
              enum:
                - api_name
                - source
                - customizable
          required:
            - api_name
          additionalProperties: false
        comparator:
          type: string
          description: >-
            Comparator applied between the key and the given value. Dependent on
            field. The string keys api_name and source support equal and
            not_equal, and the boolean key customizable supports only equal.
          enum:
            - equal
            - not_equal
        value:
          description: >-
            Value that the key is compared against. Dependent on field. A string
            of up to 50 characters for the string keys api_name and source, and
            a boolean for the boolean key customizable.
          oneOf:
            - type: string
              description: Value compared against the string keys api_name and source.
              maxLength: 50
              x-zs-$id: GlobalPicklistFilterStringValue
            - type: boolean
              description: Value compared against the boolean key customizable.
              x-zs-$id: GlobalPicklistFilterBooleanValue
      required:
        - field
        - comparator
        - value
      additionalProperties: false
      allOf:
        - description: >-
            A criteria on the boolean key customizable supports only the equal
            comparator with a boolean value.
          if:
            description: Matches a criteria applied on the boolean key customizable.
            properties:
              field:
                description: >-
                  The field of a criteria applied on the boolean key
                  customizable.
                properties:
                  api_name:
                    type: string
                    description: The boolean key customizable.
                    const: customizable
                required:
                  - api_name
            required:
              - field
          then:
            description: >-
              Restricts a criteria on the boolean key customizable to the equal
              comparator and a boolean value.
            properties:
              field:
                type: object
                description: The boolean key on which the criteria is applied.
                properties:
                  api_name:
                    type: string
                    description: The boolean key customizable.
                    const: customizable
                required:
                  - api_name
                additionalProperties: false
              comparator:
                type: string
                description: >-
                  The only comparator supported for the boolean key
                  customizable.
                const: equal
              value:
                type: boolean
                description: Value compared against the boolean key customizable.
            required:
              - field
              - comparator
              - value
            additionalProperties: false
        - description: >-
            A criteria on the string keys api_name and source supports the equal
            and not_equal comparators with a string value.
          if:
            description: Matches a criteria applied on the string keys api_name and source.
            properties:
              field:
                description: The field of a criteria applied on a string key.
                properties:
                  api_name:
                    type: string
                    description: The string keys api_name and source.
                    enum:
                      - api_name
                      - source
                required:
                  - api_name
            required:
              - field
          then:
            description: >-
              Restricts a criteria on the string keys api_name and source to the
              equal and not_equal comparators and a string value.
            properties:
              field:
                type: object
                description: The string key on which the criteria is applied.
                properties:
                  api_name:
                    type: string
                    description: The string key to be filtered on.
                    enum:
                      - api_name
                      - source
                required:
                  - api_name
                additionalProperties: false
              comparator:
                type: string
                description: Comparators supported for the string keys api_name and source.
                enum:
                  - equal
                  - not_equal
              value:
                type: string
                description: Value compared against a string key.
                maxLength: 50
            required:
              - field
              - comparator
              - value
            additionalProperties: false
    GlobalPicklistFilters:
      description: >-
        Filter criteria used to select the global picklists by the value of a
        key. Either a single criteria or a group of criteria combined using a
        group operator.
      oneOf:
        - $ref: '#/components/schemas/GlobalPicklistFilterCriteria'
          x-zs-$id: GlobalPicklistFiltersSingleCriteria
        - type: object
          x-zs-$id: GlobalPicklistFiltersGroupSchema
          description: >-
            A group of filter criteria combined using a group operator. Both
            group_operator and group are mandatory to each other.
          properties:
            group_operator:
              type: string
              description: Operator used to combine the criteria given in group.
              enum:
                - and
                - or
            group:
              type: array
              description: >-
                Array of filter criteria to be combined. Criteria cannot be
                nested inside another group.
              minItems: 1
              maxItems: 10
              items:
                $ref: '#/components/schemas/GlobalPicklistFilterCriteria'
          required:
            - group_operator
            - group
          additionalProperties: false
