    delete:
      operationId: deleteGlobalPicklist
      summary: Delete a Global Picklist by ID
      description: >-
        Deletes a single global picklist identified by the path parameter
        \{id\}. This request is asynchronous: a 202 Accepted indicates deletion
        has been scheduled and the response contains a job_id in details. There
        is no status-check endpoint. A 400 Bad Request is returned for invalid
        id, deletion already scheduled, conversion in progress, association
        limits, or system-defined restrictions. When an error refers to a
        position in a multi-resource request/path, details.resource_path_index
        is provided.
      x-zs-llm-description: >-
        Asynchronous delete by path `{id}` returning 202 with `details.job_id`.
        Same scheduler-blocking behavior as the bulk variant: while the job is
        pending, dependent endpoints (`replace_picklist_values`, `associations`,
        `replaced_values`) return 400 `global_picklist_in_delete_scheduler`.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '202':
          description: >-
            Accepted - deletion scheduled. Response contains job_id in details.
            No status endpoint is provided.
          content:
            application/json:
              schema:
                type: object
                x-zs-$id: DeleteGlobalPicklistScheduledResponseSchema
                description: Response object for scheduled deletion of a global picklist.
                properties:
                  global_picklists:
                    type: array
                    description: Array containing the scheduled deletion response.
                    maxItems: 1
                    items:
                      type: object
                      description: Scheduled deletion response details.
                      properties:
                        code:
                          type: string
                          description: >-
                            Response code indicating the operation was
                            scheduled.
                          enum:
                            - SCHEDULED
                        message:
                          type: string
                          description: >-
                            Human-readable message about the scheduled
                            operation.
                          maxLength: 255
                        details:
                          type: object
                          description: Additional details about the scheduled deletion.
                          properties:
                            job_id:
                              type: string
                              description: >-
                                Background job identifier for the scheduled
                                deletion.
                              maxLength: 100
                          required:
                            - job_id
                          additionalProperties: false
                        status:
                          type: string
                          description: Status of the operation.
                          enum:
                            - success
                      required:
                        - code
                        - message
                        - details
                        - status
                      additionalProperties: false
                required:
                  - global_picklists
                additionalProperties: false
              examples:
                AcceptedExample:
                  value:
                    global_picklists:
                      - code: SCHEDULED
                        message: Deletion scheduled
                        details:
                          job_id: job_01Fxxxxxx
                        status: success
        '400':
          description: >-
            Bad Request - canonical error shapes (top-level or array-form). See
            examples for common cases. All variants include code, details,
            message, and status.
          content:
            application/json:
              schema:
                type: object
                x-zs-$id: DeleteIdGlobalPicklistErrorResponseSchema
                description: >-
                  Error response object for bad request containing code,
                  message, details, and status.
                properties:
                  code:
                    type: string
                    description: >-
                      Error code indicating the type of validation or constraint
                      failure.
                    enum:
                      - INVALID_DATA
                      - NOT_ALLOWED
