  /settings/global_picklists/{id}/actions/replace_picklist_values:
    post:
      summary: Replace Picklist Values
      operationId: replacePicklistValues
      tags:
        - Global Picklists
      description: >-
        Schedules or executes replacement of picklist values for the specified
        global picklist. You can specify either `id`, `display_value`, or both
        for `old_value` and `new_value`. If both are provided, the system
        validates them for consistency. The `from` (old) value can be
        non-existent in the current picklist, but the `to` (new) value must be
        in the **used** state of the picklist option.
      x-zs-llm-description: >-
        Schedules a replace for one or more option values inside the given
        global picklist. Each `old_value` / `new_value` pair may carry `id`
        and/or `display_value`; when both are present the `id` wins. Blocked
        with 400 `global_picklist_in_delete_scheduler` when the parent picklist
        is being deleted. After scheduling, poll `getReplacedValues` to observe
        in-flight replacements.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Request body for replacing picklist values in a global picklist.
              properties:
                replace_picklist_values:
                  type: array
                  description: Array of picklist value replacement pairs.
                  maxItems: 1
                  items:
                    type: object
                    description: Represents a single picklist value replacement pair.
                    properties:
                      old_value:
                        type: object
                        description: The existing picklist value to be replaced.
                        properties:
                          id:
                            $ref: '#/components/schemas/Id'
                          display_value:
                            $ref: '#/components/schemas/PickListDisplayValue'
                        additionalProperties: false
                      new_value:
                        type: object
                        description: The new picklist value that will replace the old one.
                        properties:
                          id:
                            $ref: '#/components/schemas/Id'
                          display_value:
                            $ref: '#/components/schemas/PickListDisplayValue'
                        additionalProperties: false
                    required:
                      - old_value
                      - new_value
                    additionalProperties: false
              required:
                - replace_picklist_values
              additionalProperties: false
            examples:
              ReplacedValuesExample:
                value:
                  replace_picklist_values:
                    - old_value:
                        id: '111111000000055938'
                        display_value: abc
                      new_value:
                        id: '111111000000055948'
                        display_value: def
            x-zs-llm-examples:
              - ReplacedValuesExample
      responses:
        '200':
          description: >-
            OK - Replacement completed immediately since the global set is not
            associated with any fields.
          content:
            application/json:
              schema:
                type: object
                x-zs-$id: ReplacePicklistValuesImmediateResponseSchema
                description: Response object for immediate replacement completion.
                properties:
                  replace_picklist_values:
                    type: array
                    description: Array of replacement operation results.
                    maxItems: 1
                    items:
                      type: object
                      description: Replacement operation result object.
                      properties:
                        code:
                          type: string
                          description: >-
                            Indicates that the replacement operation completed
                            successfully.
                          example: SUCCESS
                          maxLength: 50
                        details:
                          type: object
                          description: Additional details about the replacement operation.
                          example: {}
                          additionalProperties: false
                        message:
                          type: string
                          description: >-
                            Human-readable message about the replacement
                            operation.
                          example: success
                          maxLength: 255
                        status:
                          type: string
                          description: Status of the replacement operation.
                          example: success
                          maxLength: 50
                      required:
                        - code
                        - details
                        - message
                        - status
                      additionalProperties: false
                required:
                  - replace_picklist_values
                additionalProperties: false
              examples:
                ImmediateCompletionExample:
                  value:
                    replace_picklist_values:
                      - code: SUCCESS
                        details: {}
                        message: success
                        status: success
        '202':
          description: Accepted - Replacement scheduled successfully for associated fields.
          content:
            application/json:
              schema:
                description: response object for scheduled replacement of picklist values.
                type: object
                x-zs-$id: ReplacePicklistValuesScheduledResponseSchema
                properties:
                  replace_picklist_values:
                    maxItems: 1
                    type: array
                    description: Array of replacement operation results.
                    items:
                      type: object
                      description: Replacement operation result object.
                      properties:
                        code:
                          type: string
                          example: SCHEDULED
                          description: >-
                            Indicates that the replacement operation has been
                            scheduled.
                          maxLength: 50
                        details:
                          type: object
                          description: Additional details about the replacement operation.
                          properties:
                            job_id:
                              type: string
                              example: '111111000000084605'
                              description: The ID of the scheduled replacement job.
                              maxLength: 100
                          required:
                            - job_id
                          additionalProperties: false
                        message:
                          type: string
                          example: success
                          description: >-
                            Human-readable message about the replacement
                            operation.
                          maxLength: 255
                        status:
                          type: string
                          example: success
                          description: Status of the replacement operation.
                          maxLength: 50
                      required:
                        - code
                        - details
                        - message
                        - status
                      additionalProperties: false
                required:
                  - replace_picklist_values
                additionalProperties: false
              examples:
                ScheduledReplacementExample:
                  value:
                    replace_picklist_values:
                      - code: SCHEDULED
                        details:
                          job_id: '111111000000084605'
                        message: success
                        status: success
        '400':
          description: >-
            Bad Request - Invalid data, missing fields, ambiguity, or disallowed
            actions, or if limits exceeded.
          content:
            application/json:
              schema:
                x-zs-$id: ReplacePicklistValuesErrorResponseSchema
                oneOf:
                  - type: object
                    x-zs-$id: ReplacePicklistValuesArrayErrorResponseSchema
                    description: Error response with array of replacement operation errors.
                    properties:
                      replace_picklist_values:
                        type: array
                        description: Array of replacement operation error details.
                        maxItems: 1
                        items:
                          type: object
                          description: Replacement operation error object.
                          additionalProperties: false
                          properties:
                            code:
                              type: string
                              description: >-
                                Error code indicating the type of validation or
                                constraint failure.
                              enum:
                                - INVALID_DATA
                                - AMBIGUITY_DURING_PROCESSING
                                - MANDATORY_NOT_FOUND
                                - EXPECTED_FIELD_MISSING
                                - NOT_ALLOWED
                                - LIMIT_EXCEEDED
                              example: INVALID_DATA
                            details:
                              type: object
                              description: Additional error-specific details.
                              additionalProperties: false
                              properties:
                                api_name:
                                  type: string
                                  description: name of the field causing the error.
                                  maxLength: 100
                                  example: id
                                json_path:
                                  type: string
                                  description: JSON path to the field causing the error.
                                  maxLength: 255
                                  example: $.replace_picklist_values[0].old_value.id
                                ambiguity_due_to:
                                  type: array
                                  description: >-
