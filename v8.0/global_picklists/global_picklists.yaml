components:
  parameters:
    Include:
      name: include
      in: query
      required: false
      description: >-
        Comma-separated list of related resources to include. Allowed values:
        "used_in_modules", "pick_list_values", "associated_fields_count". Use
        CSV encoding (style=form, explode=false) for multiple values, e.g.
        include=used_in_modules,pick_list_values.
      schema:
        type: array
        items:
          type: string
          description: Allowed values for including related resources in the response.
          enum:
            - used_in_modules
            - pick_list_values
            - associated_fields_count
        maxItems: 3
      style: form
      explode: false
      examples:
        Single:
          summary: Single value
          value:
            - used_in_modules
        Multiple:
          summary: Multiple values (CSV)
          value:
            - used_in_modules
            - associated_fields_count
    IncludeInnerDetails:
      name: include_inner_details
      in: query
      required: false
      description: >-
        Optional detailed expansion keys. Currently only allowed when
        `used_in_modules` is present in `include`. Allowed value:
        used_in_modules.plural_label.
      schema:
        type: string
        enum:
          - used_in_modules.plural_label
      examples:
        Example:
          summary: plural label will be included in used_in_modules
          value: used_in_modules.plural_label
    Fields:
      name: fields
      in: query
      required: false
      description: >-
        Comma-separated list of the api_names of the global picklist keys to be
        returned in the response, which lets you filter the response by key.
        Only the requested keys along with `id` are returned. Keys need not be
        unique — a key repeated in the list is processed once and the duplicates
        are ignored. Use CSV encoding (style=form, explode=false) for multiple
        values, e.g. fields=display_label,api_name,customizable.
      schema:
        type: array
        items:
          type: string
          description: >-
            The api_name of a global picklist key to be returned in the
            response.
          pattern: ^[A-Za-z][A-Za-z0-9_]*$
          maxLength: 50
        minItems: 1
        maxItems: 20
      style: form
      explode: false
      examples:
        Single:
          summary: Single key
          value:
            - display_label
        Multiple:
          summary: Multiple keys (CSV)
          value:
            - display_label
            - api_name
            - customizable
    ParamQueryInnerDetailsFilters:
      name: inner_details_filters
      in: query
      required: false
      description: >-
        JSON array used to filter the inner details returned for each global
        picklist in the list response. Each entry gives the inner resource in
        "api_name" and the criteria to apply in "filters", both of which are
        mandatory. Only "pick_list_values" is supported in "api_name", and
        within it only the "type" key can be filtered on, using the "equal" and
        "not_equal" comparators with the value "used" or "unused". "filters"
        takes either a single criteria using "field", "comparator" and "value",
        or a set of criteria in "group" combined using "group_operator", and a
        group may be nested inside another group. Use the "filters" query
        parameter instead to filter the global picklists themselves.
      content:
        application/json:
          schema:
            type: array
            description: >-
              Array of filters, each applied on one inner detail of the global
              picklists.
            minItems: 1
            maxItems: 10
            items:
              $ref: '#/components/schemas/GlobalPicklistInnerDetailsFilter'
          examples:
            SingleCriteria:
              summary: Return only the unused picklist values of each global picklist
              value:
                - api_name: pick_list_values
                  filters:
                    field:
                      api_name: type
                    comparator: equal
                    value: unused
            NotEqualCriteria:
              summary: Exclude the unused picklist values of each global picklist
              value:
                - api_name: pick_list_values
                  filters:
                    field:
                      api_name: type
                    comparator: not_equal
                    value: unused
            GroupOfCriteria:
              summary: >-
                Filter the inner picklist values using multiple criteria
                combined with a group operator
              value:
                - api_name: pick_list_values
                  filters:
                    group_operator: or
                    group:
                      - field:
                          api_name: type
                        comparator: equal
                        value: used
                      - field:
                          api_name: type
                        comparator: equal
                        value: unused
    Filters:
      name: filters
      in: query
      required: false
      description: >-
        JSON object used to filter the global picklists by the value of a key.
        Give either a single criteria using "field", "comparator" and "value",
        or a set of criteria in "group" combined using "group_operator". "group"
        and "group_operator" are mandatory to each other, and within a criteria
        "comparator" and "value" are dependent on "field". Only the "api_name",
        "source" and "customizable" keys can be filtered on; any other key
        returns a 400 with the code NOT_SUPPORTED. The string keys "api_name"
        and "source" support the "equal" and "not_equal" comparators with a
        string value, and the boolean key "customizable" supports only the
        "equal" comparator with a boolean value. Criteria cannot be nested
        inside another "group".
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GlobalPicklistFilters'
          examples:
            SingleCriteria:
              summary: Filter the global picklists whose api_name is Industry
              value:
                field:
                  api_name: api_name
                comparator: equal
                value: Industry
            NotEqualCriteria:
              summary: Filter the global picklists that are not created from CRM
              value:
                field:
                  api_name: source
                comparator: not_equal
                value: crm
            GroupOfCriteria:
              summary: Filter using multiple criteria combined with a group operator
              value:
                group_operator: and
                group:
                  - field:
                      api_name: api_name
                    comparator: equal
                    value: Industry
                  - field:
                      api_name: source
                    comparator: equal
                    value: crm
            BooleanCriteria:
              summary: Filter the global picklists that are customizable
              value:
                field:
                  api_name: customizable
                comparator: equal
                value: true
    Id:
      name: id
      in: path
      required: true
      description: >
        Numeric id of the global picklist. Use the [Get All Global
        Picklists](global_picklists.yaml#$.paths./settings/global_picklists.get)
        resource to retrieve global picklist IDs.
      schema:
        type: string
        format: int64
      example: '111111000000055938'
    Page:
      name: page
      in: query
      required: false
      description: 'Page number (positive integer). Default: 1.'
      schema:
        type: integer
        format: int32
        minimum: 1
        default: 1
      example: 1
    PerPage:
      name: per_page
      in: query
      required: false
      description: 'Number of records per page. Default and maximum: 200.'
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 200
        format: int64
      example: 20
  responses:
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            type: object
            x-zs-$id: NoPermissionErrorResponse
            description: >-
              Error response object containing code, message, details, and
              status.
            properties:
              code:
                type: string
                description: Error code indicating the type of error.
                maxLength: 50
              message:
                type: string
                description: Human-readable error message.
                maxLength: 255
              details:
                type: object
                description: Additional details about the error.
                properties:
                  permissions:
                    type: array
                    description: List of permissions required to access the resource.
                    items:
                      type: string
                      enum:
                        - Crm_Implied_Customize_Zoho_CRM
                      description: Permission required to access the resource.
                    maxItems: 1
                additionalProperties: false
              status:
                type: string
                description: Status of the error response.
                enum:
                  - error
                maxLength: 100
            required:
              - code
              - message
              - details
              - status
            additionalProperties: false
          examples:
            ErrorExample:
              value:
                code: NO_PERMISSION
                message: permission denied
                details:
                  permissions:
                    - Crm_Implied_Customize_Zoho_CRM
                status: error
    InternalServerError:
      description: Internal Server Error
      content:
        application/json:
          schema:
            type: object
            x-zs-$id: InternalServerErrorResponse
            description: >-
              Internal server error response object containing code, message,
              details, and status.
            properties:
              code:
                type: string
                description: Error code indicating the type of error.
                maxLength: 50
              message:
                type: string
                description: Human-readable error message.
                maxLength: 255
              details:
                type: object
                description: Additional details about the error.
                additionalProperties: true
              status:
                type: string
                description: Status of the error response.
                enum:
                  - error
            required:
              - code
              - message
              - details
              - status
            additionalProperties: false
          examples:
            ErrorExample:
              value:
                code: INTERNAL_ERROR
                message: Internal Server Error
                details: {}
                status: error
