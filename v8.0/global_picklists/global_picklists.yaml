          description: >-
            Successful response containing picklist value associations with
            various features like blueprints, workflows, orchestrations, etc.
          content:
            application/json:
              schema:
                type: object
                x-zs-$id: GetPickListValuesAssociationsResponseSchema
                description: Response object containing picklist value associations.
