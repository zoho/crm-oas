    patch:
      summary: Update a Global Picklist
      description: >-
        Updates an existing global picklist. You can update display_label,
        api_name, description, pick_list_values_sorted_lexically, and
        pick_list_values. Backend-generated properties (actual_label,
        customizable, modified_by, created_by, presence) cannot be updated. For
        pick_list_values, you can add new values, update existing values (using
        id), move values between used/unused (one at a time), or delete values
        (one at a time using _delete: true). Bulk operations for moving to
        unused or deletion are not allowed.
      x-zs-llm-description: >-
        Bulk update one global picklist via top-level body. Editable:
        `display_label`, `description`, `api_name` (only when
        `isAPINameUpdateAllowed()` is true),
        `pick_list_values_sorted_lexically`, and `pick_list_values` (add /
        update / delete / move-to-unused). Adding values is bounded by
        `FIELD_ASSOCIATION_LIMIT` / `OPTION_ASSOCIATION_THRESHOLD` enforced in
        `validateOptionsCount`. Pick the request example that matches your
        intent (`AddPicklistValue`, `DeletePicklistValue`, `MoveToUnused`,
        `UpdateDisplayLabel`, `UpdatePicklistValue`).
      operationId: updateGlobalPicklist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Request body for updating a global picklist.
              properties:
                global_picklists:
                  type: array
                  description: Array containing the global picklist to update.
                  maxItems: 1
                  items:
                    type: object
                    description: Global picklist object with update details.
                    properties:
                      id:
                        $ref: '#/components/schemas/Id'
                      display_label:
                        type: string
                        description: Updated display label of the global picklist.
                        maxLength: 50
                      api_name:
                        $ref: '#/components/schemas/ApiName'
                      description:
                        type:
                          - string
                          - 'null'
                        description: Updated description of the global picklist.
                        maxLength: 1000
                      pick_list_values_sorted_lexically:
                        type: boolean
                        description: >-
                          Indicates if picklist values should be sorted
                          lexically.
                      pick_list_values:
                        type: array
                        description: >-
                          Array of picklist values to add, update, or delete.
                          For updates, include id and fields to update. For
                          deletion, include id and _delete: true. Only one value
                          can be moved to unused or deleted per request.
                        maxItems: 5000
                        items:
                          type: object
                          description: Picklist value object for update/add/delete.
                          properties:
                            id:
                              $ref: '#/components/schemas/Id'
                            display_value:
                              $ref: '#/components/schemas/PickListDisplayValue'
                            reference_value:
                              $ref: '#/components/schemas/PickListReferenceValue'
                            type:
                              type: string
                              description: >-
                                Type of the picklist value (used or unused).
                                Only one value can be moved to unused per
                                request.
                              enum:
                                - unused
                                - used
                            _delete:
                              type: boolean
                              description: >-
                                Set to true to delete this picklist value. Only
                                one value can be deleted per request.
                          additionalProperties: false
                    required:
                      - id
                    additionalProperties: false
              required:
                - global_picklists
              additionalProperties: false
            examples:
              UpdateDisplayLabel:
                summary: Update display label
                value:
                  global_picklists:
                    - id: '111111000000055935'
                      display_label: Updated Priority Level
              AddPicklistValue:
                summary: Add new picklist value
                value:
                  global_picklists:
                    - id: '111111000000055935'
                      pick_list_values:
                        - display_value: Critical
                          type: used
              UpdatePicklistValue:
                summary: Update existing picklist value
                value:
                  global_picklists:
                    - id: '111111000000055935'
                      pick_list_values:
                        - id: '111111000000055938'
                          display_value: High Priority
              MoveToUnused:
                summary: Move one value to unused
                value:
                  global_picklists:
                    - id: '111111000000055935'
                      pick_list_values:
                        - id: '111111000000055938'
                          type: unused
              DeletePicklistValue:
                summary: Delete one picklist value
                value:
                  global_picklists:
                    - id: '111111000000055935'
                      pick_list_values:
                        - id: '111111000000055938'
                          _delete: true
            x-zs-llm-examples:
              - AddPicklistValue
              - DeletePicklistValue
              - MoveToUnused
              - UpdateDisplayLabel
              - UpdatePicklistValue
      responses:
