openapi: 3.1.0
info:
  title: Data Sharing
  description: >-
    The Data Sharing Settings API retrieves and updates your organization's
    default data-sharing permissions for modules.
  version: '8.0'
servers:
  - url: https://zohoapis.{dc}/crm/{version}
    description: API Server URL
    variables:
      dc:
        enum:
          - com
          - eu
          - in
          - cn
          - au
        default: com
        description: API Server URL TLD
      version:
        default: v8
        description: API Version
paths:
  /settings/data_sharing:
    get:
      operationId: getDataSharing
      summary: Data Sharing Settings
      description: >-
        To retrieve your organization's default data-sharing permissions for
        modules.
      security:
        - OAuth2:
            - ZohoCRM.settings.data_sharing.READ
        - OAuth2:
            - ZohoCRM.settings.data_sharing.ALL
      responses:
        '200':
          description: The data sharing settings were retrieved successfully.
          content:
            application/json:
              schema:
                type: object
                x-zs-$id: DataSharingGetResponse
                description: >-
                  Response object containing the organization's default data
                  sharing settings.
                properties:
                  data_sharing:
                    type: array
                    description: >-
                      Contains the organization's default data-sharing
                      permissions for each module.
                    maxItems: 600
                    items:
                      type: object
                      description: >-
                        Object containing the data-sharing permission details
                        for a module.
                      properties:
                        share_type:
                          type: string
                          description: >-
                            Represents the access level for the module.
                            **Possible values:** **private** - Only the record
                            owner and their superior can view the records in the
                            module. **public_read_only** - Users can view
                            others' records but cannot modify or delete them.
                            **public_read_write** - Users can view and modify
                            others' records but cannot delete them. **public** -
                            Users can view, modify, and delete others' records.
                          enum:
                            - private
                            - public_read_write
                            - public
                            - public_read_only
                        public_in_portals:
                          type: boolean
                          description: >-
                            Indicates whether the module is configured in public
                            portals. **Possible values:** ** true** - The module
                            is configured in public portals. **false** - The
                            module is not configured in public portals.
                        module:
                          type: object
                          description: Specifies the module's API name and ID.
                          properties:
                            api_name:
                              type: string
                              description: Specifies the API name of the module.
                              maxLength: 100
                            id:
                              type: string
                              description: Specifies the unique ID of the module.
                              maxLength: 19
                          additionalProperties: false
                          required:
                            - api_name
                            - id
                        rule_computation_running:
                          type: boolean
                          description: >-
                            Indicates whether a sharing rule computation is
                            currently running for the module. If you rerun a
                            rule configured for a module, this key is true until
                            the process completes. If the value is false, no
                            rules are currently running for the module.
                            **Possible values:** **true** - A sharing rule
                            computation is running for the module. **false** -
                            No sharing rule computation is running for the
                            module.
                      additionalProperties: false
                      required:
                        - share_type
                        - public_in_portals
                        - module
                        - rule_computation_running
                additionalProperties: false
                required:
                  - data_sharing
              examples:
                DataSharingGetSuccessResponse:
                  value:
                    data_sharing:
                      - public_in_portals: false
                        share_type: private
                        module:
                          api_name: Leads
                          id: '111111000000002652'
                        rule_computation_running: false
                      - public_in_portals: false
                        share_type: private
                        module:
                          api_name: Accounts
                          id: '111111000000002656'
                        rule_computation_running: false
                      - public_in_portals: false
                        share_type: private
                        module:
                          api_name: Contacts
                          id: '111111000000002654'
                        rule_computation_running: false
                      - public_in_portals: false
                        share_type: private
                        module:
                          api_name: Deals
                          id: '111111000000002658'
                        rule_computation_running: false
                      - public_in_portals: false
                        share_type: private
                        module:
                          api_name: Campaigns
                          id: '111111000000002668'
                        rule_computation_running: false
                      - public_in_portals: false
                        share_type: private
                        module:
                          api_name: Tasks
                          id: '111111000000002676'
                        rule_computation_running: false
                      - public_in_portals: false
                        share_type: private
                        module:
                          api_name: Events
                          id: '111111000000002678'
                        rule_computation_running: false
                      - public_in_portals: false
                        share_type: private
                        module:
                          api_name: Calls
                          id: '111111000000002680'
                        rule_computation_running: false
                      - public_in_portals: false
                        share_type: private
                        module:
                          api_name: Cases
                          id: '111111000000002748'
                        rule_computation_running: false
                      - public_in_portals: false
                        share_type: private
                        module:
                          api_name: Solutions
                          id: '111111000000002754'
                        rule_computation_running: false
                      - public_in_portals: false
                        share_type: public_read_only
                        module:
                          api_name: Products
                          id: '111111000000002756'
                        rule_computation_running: false
                      - public_in_portals: false
                        share_type: private
                        module:
                          api_name: Vendors
                          id: '111111000000002758'
                        rule_computation_running: false
                      - public_in_portals: false
                        share_type: private
                        module:
                          api_name: Price_Books
                          id: '111111000000002760'
                        rule_computation_running: false
                      - public_in_portals: false
                        share_type: private
                        module:
                          api_name: Quotes
                          id: '111111000000002762'
                        rule_computation_running: false
                      - public_in_portals: false
                        share_type: private
                        module:
                          api_name: Sales_Orders
                          id: '111111000000002766'
                        rule_computation_running: false
                      - public_in_portals: false
                        share_type: private
                        module:
                          api_name: Purchase_Orders
                          id: '111111000000002770'
                        rule_computation_running: false
                      - public_in_portals: false
                        share_type: private
                        module:
                          api_name: Invoices
                          id: '111111000000002774'
                        rule_computation_running: false
                      - public_in_portals: false
                        share_type: public
                        module:
                          api_name: Emails
                          id: '111111000000002778'
                        rule_computation_running: false
                      - public_in_portals: false
                        share_type: public
                        module:
                          api_name: Visits
                          id: '111111000000002694'
                        rule_computation_running: false
                      - public_in_portals: false
                        share_type: private
                        module:
                          api_name: Testing_Testing
                          id: '111111000000119002'
                        rule_computation_running: false
        '403':
          description: >-
            The user does not have the required permission to retrieve data
            sharing settings.
          content:
            application/json:
              schema:
                type: object
                x-zs-$id: DataSharingGetForbidden
                description: >-
                  Error response returned when the user does not have the
                  Crm_Implied_Manage_Data_Sharing permission to retrieve data
                  sharing settings.
                properties:
                  code:
                    type: string
                    description: The error code identifying the type of error.
                    enum:
                      - NO_PERMISSION
                  details:
                    type: object
                    description: Object containing additional error details.
                    properties:
                      permissions:
                        type: array
                        description: >-
                          Array containing the list of missing permissions
                          required to perform the operation.
                        maxItems: 1
                        items:
                          type: string
                          description: The name of the required permission.
                          enum:
                            - Crm_Implied_Manage_Data_Sharing
                    additionalProperties: false
                    required:
                      - permissions
                  message:
                    type: string
                    description: A message describing the error.
                    enum:
                      - permission denied
                  status:
                    type: string
                    description: The status of the response.
                    enum:
                      - error
                additionalProperties: false
                required:
                  - code
                  - details
                  - message
                  - status
              examples:
                DataSharingGetForbidden:
                  summary: Data Sharing Get Forbidden
                  value:
                    code: NO_PERMISSION
                    details:
                      permissions:
                        - Crm_Implied_Manage_Data_Sharing
                    message: permission denied
                    status: error
    put:
      operationId: updateDataSharing
      summary: Data Sharing Settings
      description: >-
        To update your organization's default data-sharing permissions for
        modules. You can modify data-sharing access for both system-defined and
        custom modules.
      security:
        - OAuth2:
            - ZohoCRM.settings.data_sharing.UPDATE
        - OAuth2:
            - ZohoCRM.settings.data_sharing.ALL
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: Root request body for updating data sharing settings.
              properties:
                data_sharing:
                  type: array
                  maxItems: 100
                  description: >-
                    Contains the details of your organization's default
                    data-sharing permissions for modules.
                  items:
                    type: object
                    description: >-
                      Object containing the module and its data-sharing
                      permission details.
                    properties:
                      share_type:
                        type: string
                        description: >-
                          Represents the access level you want to set for the
                          module. **Possible values:** **private** - Only the
                          record owner and their superior can view the records
                          in the module. **public_read_only** - Users can view
                          others' records but cannot modify or delete them.
                          **public_read_write** - Users can view and modify
                          others' records but cannot delete them. **public** -
                          Users can view, modify, and delete others' records.
                        enum:
                          - private
                          - public_read_write
                          - public
                          - public_read_only
                      module:
                        type: object
                        description: >-
                          Contains the API name and ID of the module for which
                          you want to change user access. Mandatory.
                        properties:
                          api_name:
                            type: string
                            description: Represents the API name of the module.
                            maxLength: 100
                            x-zs-$ref:
                              resource: modules
                              origins:
                                - operationId: getModules
                                  propertyId: ModulesApiName
                          id:
                            type: string
                            description: Represents the unique ID of the module.
                            maxLength: 19
                            x-zs-$ref:
                              resource: modules
                              origins:
                                - operationId: getModules
                                  propertyId: ModulesId
                            format: int64
                        additionalProperties: false
                        required:
                          - id
                    additionalProperties: false
                    required:
                      - share_type
                      - module
              additionalProperties: false
              required:
                - data_sharing
            examples:
              UpdateDataSharingRequestBody:
                summary: Update Data Sharing Request Body
                value:
                  data_sharing:
                    - share_type: private
                      module:
                        id: '111111000000002652'
                        api_name: Leads
      responses:
        '200':
          description: The data sharing settings were updated successfully.
          content:
            application/json:
              schema:
                type: object
                x-zs-$id: UpdateDataSharingResponse
                description: >-
                  Response object containing the update status for data sharing
                  settings.
                properties:
                  data_sharing:
                    type: array
                    maxItems: 100
                    description: >-
                      Array containing the update status for each module's data
                      sharing setting.
                    items:
                      type: object
                      description: >-
                        Object containing the update status details for a
                        module's data sharing setting.
                      properties:
                        status:
                          type: string
                          description: Indicates the operation status.
                          enum:
                            - success
                        code:
                          type: string
                          description: The status code of the operation.
                          enum:
                            - SUCCESS
                        message:
                          type: string
                          description: A message describing the result of the operation.
                          enum:
                            - data sharing settings updated successfully
                        details:
                          type: object
                          description: >-
                            Object containing additional details about the
                            updated module.
                          properties:
                            module:
                              type: string
                              description: >-
                                The API name of the module whose data sharing
                                setting was updated.
                              maxLength: 100
                          additionalProperties: false
                      additionalProperties: false
                      required:
                        - status
                        - code
                        - message
                        - details
                additionalProperties: false
                required:
                  - data_sharing
              examples:
                UpdateDataSharingSuccessResponse:
                  value:
                    data_sharing:
                      - code: SUCCESS
                        details:
                          module: Leads
                        message: data sharing settings updated successfully
                        status: success
        '400':
          description: >-
            The request failed due to invalid data, missing mandatory fields, or
            an attempt to modify a module that is public in portals.
          content:
            application/json:
              schema:
                x-zs-$id: UpdateDataSharingBadRequest
                oneOf:
                  - x-zs-$id: UpdateDataSharingErrorDetailsResponse
                    type: object
                    description: >-
                      Wrapped error response containing an array of error
                      details in the data_sharing key.
                    properties:
                      data_sharing:
                        type: array
                        maxItems: 100
                        description: >-
                          Array containing the error details for each module's
                          data sharing setting.
                        items:
                          type: object
                          description: >-
                            Object containing the error details for a module's
                            data sharing setting.
                          properties:
                            status:
                              type: string
                              description: The status of the response.
                              enum:
                                - error
                            code:
                              type: string
                              description: >-
                                Represents the error code identifying the type
                                of error. **INVALID_DATA**- Indicates invalid
                                input such as an invalid share_type or module.
                                **NOT_ALLOWED**- Indicates the module is public
                                in portals and cannot be modified.
                              enum:
                                - INVALID_DATA
                                - NOT_ALLOWED
                            message:
                              type: string
                              description: A message describing the error.
                              enum:
                                - invalid data
                                - >-
                                  Cannot change the data sharing setting as
                                  module is made public in portals
                            details:
                              type: object
                              description: >-
                                Object containing additional details about the
                                error, such as the field name and JSON path that
                                caused the error.
                              properties:
                                api_name:
                                  type: string
                                  description: >-
                                    The API name of the field that caused the
                                    error.
                                  maxLength: 100
                                json_path:
                                  type: string
                                  maxLength: 2147483647
                                  description: >-
                                    The JSON path of the field that caused the
                                    error.
                                regex:
                                  type: string
                                  description: >-
                                    The expected regex pattern for the field
                                    value.
                                  enum:
                                    - >-
                                      private|public_read_only|public_read_write|public
                                expected_data_type:
                                  type: string
                                  description: The expected data type of the field.
                                  enum:
                                    - text
                                    - bigint
                              additionalProperties: false
                          additionalProperties: false
                          required:
                            - status
                            - code
                            - message
                            - details
                    additionalProperties: false
                  - x-zs-$id: UpdateDataSharingErrorResponse
                    type: object
                    description: >-
                      Flat error response returned when the request exceeds the
                      maximum number of data sharing settings or contains
                      structurally invalid input.
                    properties:
                      status:
                        type: string
                        description: The status of the response.
                        enum:
                          - error
                      code:
                        type: string
                        description: The error code identifying the type of error.
                        enum:
                          - INVALID_DATA
                      message:
                        type: string
                        description: A message describing the error.
                        enum:
                          - invalid data
                      details:
                        type: object
                        description: Object containing additional details about the error.
                        properties:
                          api_name:
                            type: string
                            description: The API name of the field that caused the error.
                            maxLength: 100
                          json_path:
                            type: string
                            maxLength: 2147483647
                            description: The JSON path of the field that caused the error.
                          maximum_length:
                            type: integer
                            format: int32
                            description: >-
                              The maximum number of items allowed in the
                              request.
                        additionalProperties: false
                    additionalProperties: false
              examples:
                InvalidSharingType:
                  value:
                    data_sharing:
                      - code: INVALID_DATA
                        details:
                          regex: private|public_read_only|public_read_write|public
                          api_name: share_type
                          json_path: $.data_sharing[0].share_type
                        message: invalid data
                        status: error
                InvalidDataType:
                  value:
                    data_sharing:
                      - code: INVALID_DATA
                        details:
                          expected_data_type: text
                          api_name: api_name
                          json_path: $.data_sharing[0].module.api_name
                        message: invalid data
                        status: error
                UpdateLimitExceeded:
                  value:
                    code: INVALID_DATA
                    details:
                      maximum_length: 100
                      api_name: data_sharing
                      json_path: $.data_sharing
                    message: invalid data
                    status: error
                InvalidModuleId:
                  value:
                    data_sharing:
                      - code: INVALID_DATA
                        details:
                          api_name: module
                          json_path: $.data_sharing[0].module
                        message: invalid data
                        status: error
                PublicModuleInPortalsError:
                  value:
                    data_sharing:
                      - code: NOT_ALLOWED
                        details:
                          api_name: module
                          json_path: $.data_sharing[0].module
                        message: >-
                          Cannot change the data sharing setting as module is
                          made public in portals
                        status: error
        '403':
          description: >-
            The user does not have the required permission to update data
            sharing settings.
          content:
            application/json:
              schema:
                x-zs-$id: DataSharingPermissionDenied
                type: object
                description: >-
                  Error response returned when the user does not have the
                  Crm_Implied_Manage_Data_Sharing permission to update data
                  sharing settings.
                properties:
                  status:
                    type: string
                    description: The status of the response.
                    enum:
                      - error
                  code:
                    type: string
                    description: The error code identifying the type of error.
                    enum:
                      - NO_PERMISSION
                  message:
                    type: string
                    description: A message describing the error.
                    enum:
                      - permission denied
                  details:
                    type: object
                    description: Object containing additional error details.
                    properties:
                      permissions:
                        type: array
                        maxItems: 1
                        description: >-
                          Array containing the list of permissions required to
                          perform the operation.
                        items:
                          type: string
                          description: The name of the required permission.
                          enum:
                            - Crm_Implied_Manage_Data_Sharing
                    additionalProperties: false
                    required:
                      - permissions
                additionalProperties: false
                required:
                  - status
                  - code
                  - message
                  - details
              examples:
                DataSharingPutForbidden:
                  value:
                    code: NO_PERMISSION
                    details:
                      permissions:
                        - Crm_Implied_Manage_Data_Sharing
                    message: permission denied
                    status: error
components:
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://accounts.zoho.com/oauth/v2/auth
          tokenUrl: https://accounts.zoho.com/oauth/v2/token
          refreshUrl: https://accounts.zoho.com/oauth/v2/token
          scopes:
            ZohoCRM.settings.data_sharing.READ: Read access to Data Sharing settings
            ZohoCRM.settings.data_sharing.UPDATE: Update access to Data Sharing settings
            ZohoCRM.settings.data_sharing.ALL: Full access to Data Sharing settings
