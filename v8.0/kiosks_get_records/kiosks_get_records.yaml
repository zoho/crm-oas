        type:
          type: string
          description: Type of association.
          maxLength: 255
        detail_view_page:
          type: array
          description: Detail view page configurations.
          items:
            $ref: '#/components/schemas/GETDetailViewPageWithDetails'
          maxItems: 50
      required:
        - detail_view_page
