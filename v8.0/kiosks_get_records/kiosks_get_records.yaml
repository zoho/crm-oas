    GETDetailViewPageWithDetails:
      type: object
      additionalProperties: false
      description: Detail view page information with layout and module details.
      properties:
        sequence_number:
          type: integer
          format: int32
          description: Display sequence number.
        layout:
          $ref: '#/components/schemas/GETAssociationLayout'
          description: Layout associated with this detail view page.
        module:
          $ref: '#/components/schemas/GETAssociationModule'
          description: Module associated with this detail view page.
        name:
          type: string
          description: Name of the detail view page association.
          maxLength: 255
        id:
          type: string
          description: Unique identifier.
          maxLength: 255
