        - code: MANDATORY_NOT_FOUND
          message: required field not found
          description: >-
            Returned when a required field (e.g., criteria, module, name) is
            missing from the request.
        - code: MANDATORY_NOT_FOUND
          message: Required field is missing
          description: >-
            Returned when a required sub-field (e.g., module.id,
            sort_order.order_by_name) is missing.
        - code: AMBIGUITY_DURING_PROCESSING
