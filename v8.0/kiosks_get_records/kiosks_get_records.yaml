        - id
        - layout
        - module
        - name
        - sequence_number
    GETAssociationLayout:
      type: object
      additionalProperties: false
      description: Layout details in association responses.
      properties:
        name:
          type: string
          description: Name of the layout.
          maxLength: 255
        id:
          type: string
          description: Unique identifier of the layout.
          maxLength: 19
        status:
          type: string
          description: Status of the layout.
          maxLength: 50
      required:
        - id
        - name
        - status
    GETAssociationModule:
      type: object
      additionalProperties: false
      description: Module details in association responses.
      properties:
        display_label:
          type: string
          description: Display label of the module.
          maxLength: 255
        api_name:
          type: string
          description: API name of the module.
          maxLength: 50
        name:
          type: string
          description: Name of the module.
          maxLength: 50
        id:
          type: string
          description: Unique identifier of the module.
          maxLength: 19
      required:
        - api_name
        - display_label
        - id
        - name
    FilterFieldBase:
      type: object
      x-zs-$id: FilterFieldBase
      description: >-
        Represents the base field reference used in filter operations,
        containing minimal required properties. The field's data_type is not
        part of this object; resolve it from the corresponding FieldSchema. For
        formula fields, use formula.return_type as the effective data_type; for
        rollup_summary fields, use rollup_summary.return_type.
      properties:
        id:
          type: string
          format: int64
          description: Represents the unique ID of the field used for filter operations.
        api_name:
          type: string
          description: >-
            Represents the API name of the field used for filter application.
            Supports relationship notation, for example, Deals__r.Stage.
      additionalProperties: true
    SimpleFilterCriterionValueString:
      type: string
      x-zs-$id: SimpleFilterCriterionValueString
      description: >-
        Represents a string filter criterion value applicable to fields with a
        data_type of text, textarea, email, phone, website, autonumber,
        picklist, multiselectpicklist, date, or datetime, as well as any
        data_type not explicitly covered by SimpleFilterCriterionValueNumber,
        SimpleFilterCriterionValueBoolean,
        SimpleFilterCriterionValueObjectRequest,
        SimpleFilterCriterionValueObjectResponse, or the multiselect lookup
        value schemas.
      maxLength: 255
    SimpleFilterCriterionValueNumber:
      type: number
      x-zs-$id: SimpleFilterCriterionValueNumber
      description: >-
        Represents a numeric filter criterion value applicable to fields with a
        data_type of integer, currency, or double.
    SimpleFilterCriterionValueObjectBase:
      type: object
      description: >-
        Represents the base minified record structure of a lookup module,
        containing the record's unique identifier and display name.
      properties:
        id:
          type: string
          format: int64
          description: Represents the unique ID of the lookup module record.
        name:
          type: string
          maxLength: 255
          description: Represents the display name of the lookup module record.
      additionalProperties: true
    SimpleFilterCriterionValueObjectResponse:
      x-zs-$id: SimpleFilterCriterionValueObjectResponse
      allOf:
        - $ref: '#/components/schemas/SimpleFilterCriterionValueObjectBase'
        - type: object
          additionalProperties: true
          description: >-
            Represents the constraint that both the ID and name properties are
            required for the lookup object filter criterion value in response
            bodies.
          required:
            - id
            - name
          properties:
            id: {}
            name: {}
      unevaluatedProperties: false
      description: >-
        Represents a lookup object filter criterion value for response bodies,
        applicable when the field's data_type is lookup, ownerlookup, or
        userlookup. Both the ID and name properties are included.
    SimpleFilterCriterionValueObjectPredefined:
      x-zs-$id: SimpleFilterCriterionValueObjectPredefined
      description: >-
        Represents a predefined placeholder object filter criterion value for
        lookup fields, applicable with equal or not_equal comparators when the
        field's data_type is ownerlookup or userlookup. Two forms are supported:
        (1) the currently logged-in user, represented by passing only the name
        property with the predefined value ${CURRENTUSER} and no ID property;
        and (2) the logged-in user's role, represented by passing the ID
        property with the predefined value ${CURRENTUSERROLE} and an optional
        display label in the name property. For specific real users or roles
        that are not predefined, use SimpleFilterCriterionValueObjectRequest,
        which requires the ID property.
      oneOf:
        - type: object
          x-zs-$id: SimpleFilterCriterionValueObjectPredefinedCurrentUser
          description: >-
            Represents the predefined object form for the currently logged-in
            user, in which only the name property carries the predefined value
            ${CURRENTUSER} and no ID property is included.
          required:
            - name
          properties:
            name:
              type: string
              enum:
                - ${CURRENTUSER}
              description: >-
                Represents the predefined placeholder for the currently
                logged-in user.

                Possible values:

                ${CURRENTUSER} - Represents the currently logged-in user.
          additionalProperties: false
        - type: object
          x-zs-$id: SimpleFilterCriterionValueObjectPredefinedCurrentUserRole
          description: >-
            Represents the predefined object form for the currently logged-in
            user's role, in which the ID property carries the predefined value
            ${CURRENTUSERROLE} and the name property is an optional display
            label.
          required:
            - id
          properties:
            id:
              type: string
              enum:
                - ${CURRENTUSERROLE}
              description: >-
                Represents the predefined placeholder for the logged-in user's
                role record ID.

                Possible values:

                ${CURRENTUSERROLE} - Represents the role of the currently
                logged-in user.
            name:
              type: string
              maxLength: 255
              description: >-
                Represents an optional display label for the predefined role,
                such as Logged in User Role.
          additionalProperties: true
    SimpleFilterCriterionValueBoolean:
      type: boolean
      x-zs-$id: SimpleFilterCriterionValueBoolean
      description: >-
        Represents a Boolean filter criterion value. Applicable only when the
        field has a Boolean data type (checkbox field).
    SimpleFilterCriterionValueGeneralPredefined:
      type: string
      x-zs-$id: SimpleFilterCriterionValueGeneralPredefined
      description: >-
        Represents a predefined placeholder value applicable to any field
        data_type with the equal comparator.

        Possible values:

        ${EMPTY} - Matches records where the field has no value.

        ${NOTEMPTY} - Matches records where the field has any non-empty value.
      enum:
        - ${EMPTY}
        - ${NOTEMPTY}
      x-enumDescriptions:
        ${EMPTY}: Matches records where the field has no value (null or empty string).
        ${NOTEMPTY}: Matches records where the field has any non-empty value.
    SimpleFilterCriterionValueDateTimePredefined:
      type: string
      x-zs-$id: SimpleFilterCriterionValueDateTimePredefined
      description: >-
        Represents a predefined placeholder value applicable only when the
        field's data_type is date or datetime, with the equal comparator.
      enum:
        - ${TODAY}
        - ${TOMORROW}
        - ${TOMORROWPLUS}
        - ${YESTERDAY}
        - ${YESTERDAYMINUS}
        - ${LASTMONTH}
        - ${THISMONTH}
        - ${NEXTMONTH}
        - ${LASTWEEK}
        - ${THISWEEK}
        - ${NEXTWEEK}
        - ${THISYEAR}
        - ${THISFY}
        - ${THISFQ}
        - ${LASTYEAR}
        - ${PREVFY}
        - ${PREVFQ}
        - ${NEXTYEAR}
        - ${NEXTFY}
        - ${NEXTFQ}
        - ${EMPTY}
        - ${NOTEMPTY}
      x-enumDescriptions:
        ${TODAY}: >-
          Matches records where the date field falls on the current calendar
          day.
        ${TOMORROW}: Matches records where the date field falls on the next calendar day.
        ${TOMORROWPLUS}: >-
          Matches records where the date field is on tomorrow or any later date
          (tomorrow onwards).
        ${YESTERDAY}: >-
          Matches records where the date field falls on the previous calendar
          day.
        ${YESTERDAYMINUS}: >-
          Matches records where the date field is on yesterday or any earlier
          date (up to and including yesterday).
        ${LASTMONTH}: >-
          Matches records where the date field falls within the entire previous
          calendar month.
        ${THISMONTH}: >-
          Matches records where the date field falls within the current calendar
          month.
        ${NEXTMONTH}: >-
          Matches records where the date field falls within the next calendar
          month.
        ${LASTWEEK}: >-
          Matches records where the date field falls within the previous
          calendar week (Monday–Sunday).
        ${THISWEEK}: >-
          Matches records where the date field falls within the current calendar
          week.
        ${NEXTWEEK}: >-
          Matches records where the date field falls within the next calendar
          week.
        ${THISYEAR}: >-
          Matches records where the date field falls within the current calendar
          year.
        ${THISFY}: >-
          Matches records where the date field falls within the current fiscal
          year.
        ${THISFQ}: >-
          Matches records where the date field falls within the current fiscal
          quarter.
        ${LASTYEAR}: >-
          Matches records where the date field falls within the previous
          calendar year.
        ${PREVFY}: >-
          Matches records where the date field falls within the previous fiscal
          year.
        ${PREVFQ}: >-
          Matches records where the date field falls within the previous fiscal
          quarter.
        ${NEXTYEAR}: >-
          Matches records where the date field falls within the next calendar
          year.
        ${NEXTFY}: >-
          Matches records where the date field falls within the next fiscal
          year.
        ${NEXTFQ}: >-
          Matches records where the date field falls within the next fiscal
          quarter.
        ${EMPTY}: Matches records where the date field has no value set.
        ${NOTEMPTY}: Matches records where the date field has a value set.
    SimpleFilterCriterionValueNDaysPredefined:
      maxLength: 255
      type: string
      x-zs-$id: SimpleFilterCriterionValueNDaysPredefined
      description: >-
        Represents a predefined N-period range placeholder value applicable only
        when the field's data_type is date or datetime, with the equal
        comparator. Follows the pattern ${NEXT_N_<PERIOD>:<n>} or
        ${LAST_N_<PERIOD>:<n>}, where PERIOD is DAYS, WEEKS, MONTHS, or YEARS
        and n is a positive integer. The current period is always excluded from
        the range.
      pattern: ^\$\{(LAST_N_|NEXT_N_)(DAYS|WEEKS|MONTHS|YEARS):([0-9]+)\}$
    SimpleFilterCriterionValueAgeDuePredefined:
      maxLength: 255
      type: string
      x-zs-$id: SimpleFilterCriterionValueAgeDuePredefined
      description: >-
        Represents a predefined age or due-in-days placeholder value applicable
        only when the field's data_type is date or datetime. Follows the pattern
        ${AGEINDAYS}+<n> for records where the date field was exactly n days in
        the past, or ${DUEINDAYS}+<n> for records where the date field is
        exactly n days in the future. Supported comparators are equal,
        not_equal, less_than, greater_than, less_equal, and greater_equal.
      pattern: ^\$\{(AGEINDAYS|DUEINDAYS)\}\+[0-9]+$
    EqualFilterCriterionResponse:
      type: object
      x-zs-$id: EqualFilterCriterionResponse
      description: >-
        Represents the response for a filter criterion using the equal
        comparator. The value type is determined by the field's data_type:
        SimpleFilterCriterionValueString for text, textarea, email, phone,
        website, autonumber, picklist, multiselectpicklist, date, or datetime;
        SimpleFilterCriterionValueNumber for integer, currency, or double;
        SimpleFilterCriterionValueBoolean for Boolean;
        SimpleFilterCriterionValueObjectResponse for lookup, ownerlookup, or
        userlookup; and SimpleFilterCriterionValueObjectPredefined for
        predefined user or role object placeholders.
      properties:
        field:
          allOf:
            - $ref: '#/components/schemas/FilterFieldBase'
            - type: object
              additionalProperties: true
              description: >-
                Represents the field reference constraint that requires the
                api_name property to be present for the equal filter criterion
                response.
              required:
                - api_name
          unevaluatedProperties: false
          description: >-
            Represents the target field definition to which the equal filter
            criterion was applied, conforming to the base field structure.
        comparator:
          type: string
          enum:
            - equal
          description: >-
            Represents the equal comparison operator returned for the criterion.

            Possible values:

            equal - Matches records where the field value equals the specified
            filter value.
        value:
          anyOf:
            - type: array
              x-zs-$id: EqualFilterCriterionResponseValueArray
              description: >-
                Contains an array of filter values returned for the equal
                comparator.
              minItems: 1
              maxItems: 500
              items:
                x-zs-$id: EqualFilterCriterionResponseValueArrayItems
                oneOf:
                  - $ref: '#/components/schemas/SimpleFilterCriterionValueString'
                  - $ref: '#/components/schemas/SimpleFilterCriterionValueNumber'
                  - x-zs-$id: EqualFilterCriterionResponseValueArrayItemsObject
                    anyOf:
                      - $ref: >-
                          #/components/schemas/SimpleFilterCriterionValueObjectResponse
                      - $ref: >-
                          #/components/schemas/SimpleFilterCriterionValueObjectPredefined
            - $ref: '#/components/schemas/SimpleFilterCriterionValueString'
            - $ref: '#/components/schemas/SimpleFilterCriterionValueNumber'
            - $ref: '#/components/schemas/SimpleFilterCriterionValueBoolean'
            - $ref: '#/components/schemas/SimpleFilterCriterionValueObjectResponse'
            - $ref: '#/components/schemas/SimpleFilterCriterionValueObjectPredefined'
            - $ref: '#/components/schemas/SimpleFilterCriterionValueGeneralPredefined'
            - $ref: >-
                #/components/schemas/SimpleFilterCriterionValueDateTimePredefined
            - $ref: '#/components/schemas/SimpleFilterCriterionValueNDaysPredefined'
            - $ref: '#/components/schemas/SimpleFilterCriterionValueAgeDuePredefined'
          description: >-
            Represents the filter value returned for the equal comparator.
            Contains a scalar or an array of values, depending on the field's
            data_type.
        type:
          type: string
          enum:
            - merge_field
            - value
            - pre_defined
            - field
          default: value
          description: >-
            Indicates the value resolution mode of the criterion, distinguishing
            whether the filter value is a literal value, a merge field
            reference, a predefined system variable, or another field reference.

            Possible values:

            value - The value is a direct literal.

            merge_field - The value is a merge field reference.

            pre_defined - The value is a predefined system variable placeholder.

            field - The value references another field.
        $disrupted:
          type: boolean
          description: >-
            Indicates whether the equal filter criterion is in a disrupted
            state, typically due to an invalid or unresolvable field or value
            reference.
      required:
        - field
        - comparator
        - value
      additionalProperties: false
    NotEqualFilterCriterionResponse:
      type: object
      x-zs-$id: NotEqualFilterCriterionResponse
      description: >-
        Represents the response for a filter criterion using the not_equal
        comparator. The value type is determined by the field's data_type:
        SimpleFilterCriterionValueString for text-based types;
        SimpleFilterCriterionValueNumber for numeric types;
        SimpleFilterCriterionValueBoolean for Boolean;
        SimpleFilterCriterionValueObjectResponse for lookup types; and
        SimpleFilterCriterionValueObjectPredefined for predefined user or role
        placeholders.
      properties:
        field:
          allOf:
            - $ref: '#/components/schemas/FilterFieldBase'
            - type: object
              additionalProperties: true
              description: >-
                Represents the field reference constraint that requires the
                api_name property to be present for the not-equal filter
                criterion response.
              required:
                - api_name
          unevaluatedProperties: false
          description: >-
            Represents the target field definition to which the not-equal filter
            criterion was applied, conforming to the base field structure.
        comparator:
          type: string
          enum:
            - not_equal
          description: >-
            Represents the not-equal comparison operator returned for the
            criterion.

            Possible values:

            not_equal - Matches records where the field value does not equal the
            specified filter value.
        value:
          anyOf:
            - type: array
              x-zs-$id: NotEqualFilterCriterionResponseValueArray
              description: >-
                Contains an array of filter values returned for the not_equal
                comparator.
              minItems: 1
              maxItems: 500
              items:
                x-zs-$id: NotEqualFilterCriterionResponseValueArrayItems
                oneOf:
                  - $ref: '#/components/schemas/SimpleFilterCriterionValueString'
                  - $ref: '#/components/schemas/SimpleFilterCriterionValueNumber'
                  - x-zs-$id: NotEqualFilterCriterionResponseValueArrayItemsObject
                    anyOf:
                      - $ref: >-
                          #/components/schemas/SimpleFilterCriterionValueObjectResponse
                      - $ref: >-
                          #/components/schemas/SimpleFilterCriterionValueObjectPredefined
            - $ref: '#/components/schemas/SimpleFilterCriterionValueString'
            - $ref: '#/components/schemas/SimpleFilterCriterionValueNumber'
            - $ref: '#/components/schemas/SimpleFilterCriterionValueBoolean'
            - $ref: '#/components/schemas/SimpleFilterCriterionValueObjectResponse'
            - $ref: '#/components/schemas/SimpleFilterCriterionValueObjectPredefined'
            - $ref: '#/components/schemas/SimpleFilterCriterionValueAgeDuePredefined'
          description: >-
            Represents the filter value returned for the not_equal comparator.
            Contains a scalar or an array of values, depending on the field's
            data_type.
        type:
          type: string
          enum:
            - merge_field
            - value
            - pre_defined
            - field
          default: value
          description: >-
            Indicates the value resolution mode of the criterion, distinguishing
            whether the filter value is a literal value, a merge field
            reference, a predefined system variable, or another field reference.

            Possible values:

            value - The value is a direct literal.

            merge_field - The value is a merge field reference.

            pre_defined - The value is a predefined system variable placeholder.

            field - The value references another field.
        $disrupted:
          type: boolean
          description: >-
            Indicates whether the not-equal filter criterion is in a disrupted
            state, typically due to an invalid or unresolvable field or value
            reference.
      required:
        - field
        - comparator
        - value
      additionalProperties: false
    EqualityFilterCriterionResponse:
      x-zs-$id: EqualityFilterCriterionResponse
      description: >-
        Represents the response for an equality filter criterion that dispatches
        to either the EqualFilterCriterionResponse or
        NotEqualFilterCriterionResponse schema based on the comparator value.
      oneOf:
        - $ref: '#/components/schemas/EqualFilterCriterionResponse'
        - $ref: '#/components/schemas/NotEqualFilterCriterionResponse'
    TextFilterCriterionResponse:
      type: object
      x-zs-$id: TextFilterCriterionResponse
      description: >-
        Represents the response for a filter criterion using the like, not_like,
        starts_with, ends_with, contains, and not_contains comparators. The
        value is a string scalar or array; SimpleFilterCriterionValueString
        applies to text-based field types.
      properties:
        field:
          allOf:
            - $ref: '#/components/schemas/FilterFieldBase'
            - type: object
              additionalProperties: true
              description: >-
                Represents the field reference constraint that requires the
                api_name property to be present for the text filter criterion
                response.
              required:
                - api_name
          unevaluatedProperties: false
          description: >-
            Represents the target field definition to which the text filter
            criterion was applied, conforming to the base field structure.
        comparator:
          type: string
          enum:
            - like
            - not_like
            - starts_with
            - ends_with
            - contains
            - not_contains
          description: >-
            Represents the text comparison operator returned for the criterion.

            Possible values:

            like - Matches records where the field value contains the specified
            pattern.

            not_like - Matches records where the field value does not contain
            the specified pattern.

            starts_with - Matches records where the field value begins with the
            specified string.

            ends_with - Matches records where the field value ends with the
            specified string.

            contains - Matches records where the field value contains the
            specified string.

            not_contains - Matches records where the field value does not
            contain the specified string.
        value:
          description: >-
            Represents the string filter value returned for the text comparator.
            Contains a scalar string or an array of string values.
          oneOf:
            - type: array
              x-zs-$id: TextFilterCriterionResponseValueArray
              description: >-
                Contains an array of primitive string values returned for the
                text filter comparator.
              minItems: 1
              maxItems: 500
              items:
                x-zs-$id: TextFilterCriterionResponseValueArrayItems
                oneOf:
                  - $ref: '#/components/schemas/SimpleFilterCriterionValueString'
            - $ref: '#/components/schemas/SimpleFilterCriterionValueString'
        type:
          type: string
          enum:
            - merge_field
            - pre_defined
            - value
            - field
          default: value
          description: >-
            Indicates the value resolution mode of the criterion, distinguishing
            whether the filter value is a literal value, a merge field
            reference, a predefined system variable, or another field reference.

            Possible values:

            value - The value is a direct literal.

            merge_field - The value is a merge field reference.

            pre_defined - The value is a predefined system variable placeholder.

            field - The value references another field.
        $disrupted:
          type: boolean
          description: >-
            Indicates whether the text filter criterion is in a disrupted state,
            typically due to an invalid or unresolvable field or value
            reference.
      required:
        - field
        - comparator
        - value
      additionalProperties: false
    OrderingFilterCriterionResponse:
      type: object
      x-zs-$id: OrderingFilterCriterionResponse
      description: >-
        Represents the response for a filter criterion using the less_than,
        less_equal, greater_than, and greater_equal comparators. The value is a
        scalar; arrays and objects are not valid.
      properties:
        field:
          allOf:
            - $ref: '#/components/schemas/FilterFieldBase'
            - type: object
              additionalProperties: true
              description: >-
                Represents the field reference constraint that requires the
                api_name property to be present for the ordering filter
                criterion response.
              required:
                - api_name
          unevaluatedProperties: false
          description: >-
            Represents the target field definition to which the ordering filter
            criterion was applied, conforming to the base field structure.
        comparator:
          type: string
          enum:
            - less_than
            - less_equal
            - greater_than
            - greater_equal
          description: >-
            Represents the ordering comparison operator returned for the
            criterion.

            Possible values:

            less_than - Matches records where the field value is less than the
            specified filter value.

            less_equal - Matches records where the field value is less than or
            equal to the specified filter value.

            greater_than - Matches records where the field value is greater than
            the specified filter value.

