openapi: 3.1.0
info:
  title: Kiosk Get Records API
  description: >-
    Unified API specification for managing Get Record components in Zoho CRM
    Kiosks. This API supports creating, reading, updating, and deleting
    get_record configurations, as well as managing their associations.


    Get Record is a component inside a Kiosk that acts as a record aggregator.
    It fetches records from a specified CRM module based on configured criteria
    and selection rules. During kiosk execution, it matches the criteria against
    the module's records and retrieves all matching entries for use in
    subsequent actions or display.


    Key capabilities:

    - **CRUD Operations** on get_record components within a kiosk

    - **Criteria Configuration** using simple or grouped filter conditions

    - **Selection Rules** for controlling how fetched records are presented
    (single/multiple/all)

    - **Association Management** for linking kiosks to detail view pages and
    tracking component dependencies
  version: '8'
servers:
  - url: https://zohoapis.{dc}/crm/{version}
    description: API Server for /crm
    variables:
      dc:
        default: com
        enum:
          - com
          - eu
          - in
          - cn
          - au
          - ca
          - jp
        description: Data center region
      version:
        default: v8
        description: API version
paths:
  /settings/kiosks/{kioskId}/get_records:
    get:
      summary: Kiosk GetRecords
      description: >
        To retrieve all GetRecords configurations associated with a Kiosk. The
        response includes details such as criteria, selection configuration,
        selected fields, module information, and sorting preferences. Use the
        [Get All Kiosks API](kiosks.yaml#$.paths./settings/kiosks.get) to
        retrieve the Kiosk ID.
      operationId: getAllKioskGetRecords
      parameters:
        - $ref: '#/components/parameters/ParamPathKioskid'
        - $ref: '#/components/parameters/ParamQueryIncludeInnerDetails'
      responses:
        '200':
          description: Successfully retrieved all get_record components from the kiosk.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllGetRecordsResponse'
              examples:
                Success200:
                  summary: >-
                    Success response containing get records with different
                    criteria types
                  value:
                    get_records:
                      - selection_details:
                          selection_type: null
                          result_type: single
                          limit: 1
                          range: 1
                        criteria:
                          comparator: not_equal
                          field:
                            api_name: Annual_Revenue
                            id: '4676645000000000581'
                          type: value
                          value: ${EMPTY}
                        module:
                          api_name: Leads
                          id: '4676645000000000125'
                        name: GetRecords 4
                        id: '4676645000000914086'
                        type: parent
                        selected_fields: null
                        sort_order:
                          order_by_name: descending
                          order_by_field:
                            api_name: Modified_Time
                            id: '4676645000000000595'
                      - selection_details:
                          selection_type: mandate
                          result_type: multiple
                          limit: 10
                          range: 100
                        criteria:
                          group_operator: AND
                          group:
                            - comparator: equal
                              field:
                                api_name: Annual_Revenue
                                id: '4676645000000000581'
                              type: value
                              value: '250'
                            - comparator: not_equal
                              field:
                                api_name: City
                                id: '4676645000000000605'
                              type: value
                              value: ${EMPTY}
                        module:
                          api_name: Leads
                          id: '4676645000000000125'
                        name: GetRecords 3
                        id: '4676645000000901064'
                        type: parent
                        selected_fields: null
                        sort_order:
                          order_by_name: descending
                          order_by_field:
                            api_name: Modified_Time
                            id: '4676645000000000595'
          headers:
            X-API-CREDITS-REMAINING:
              schema:
                type: string
                format: int64
                description: >
                  Present when >=50% of base daily credits (excluding add-on
                  credits) are consumed. Value is total remaining credits
                  including add-on credits for the rolling 24-hour window.
              required: false
        '204':
          description: No get_record components found in the kiosk.
          headers:
            X-API-CREDITS-REMAINING:
              schema:
                type: string
                format: int64
                description: >
                  Present when >=50% of base daily credits (excluding add-on
                  credits) are consumed. Value is total remaining credits
                  including add-on credits for the rolling 24-hour window.
              required: false
        '400':
          description: Invalid request. The specified kiosk does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetRecordErrorResponse'
              examples:
                InvalidKiosk:
                  summary: No such Kiosk exists
                  value:
                    code: INVALID_DATA
                    details:
                      resource_path_index: 2
                    message: No such Kiosk exists
                    status: error
          headers:
            X-API-CREDITS-REMAINING:
              schema:
                type: string
                format: int64
                description: >
                  Present when >=50% of base daily credits (excluding add-on
                  credits) are consumed. Value is total remaining credits
                  including add-on credits for the rolling 24-hour window.
              required: false
      security:
        - OAuth2:
            - ZohoCRM.settings.kiosks.READ
    post:
      summary: Kiosk GetRecord
      description: >
        To create a
        [GetRecords](https://help.zoho.com/portal/en/kb/crm/customize-crm-account/kiosk/articles/elements-of-a-kiosk#GetRecords)
        configuration associated with a Kiosk. It defines how records should be
        fetched from a module, including criteria, selection behavior, and
        sorting.

        Use the [Get All Kiosks API](kiosks.yaml#$.paths./settings/kiosks.get)
        to retrieve the Kiosk ID.

        **Note:**
         - You can configure GetRecords only for Kiosks in the draft state.
         - The maximum number of GetRecords configurations allowed per Kiosk depends on the CRM edition:
            - Enterprise: 50
            - Professional: 10
            - Standard: 5
      operationId: createKioskGetRecord
      parameters:
        - $ref: '#/components/parameters/ParamPathKioskid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGetRecordRequest'
            examples:
              CreateChildGetRecord:
                summary: Create a child-type get record with grouped criteria
                value:
                  get_records:
                    - name: GetRecords 3
                      module:
                        api_name: Leads
                        id: '2296900000010857048'
                        name: Leads
                      criteria:
                        group_operator: and
                        group:
                          - field:
                              api_name: Annual_Revenue
                              id: '2296900000010863615'
                              field_label: Annual Revenue
                              data_type: currency
                              decimal_place: 2
                            comparator: not_equal
                            value:
                              id: '2296900000010863615'
                              api_name: Annual_Revenue
                            type: value
                          - field:
                              api_name: City
                              id: '2296900000010863627'
                              field_label: City
                              data_type: text
                            comparator: equal
                            value:
                              api_name: users.last_name
                              id: '2296900000010863437'
                              data_type: text
                            type: field
                      sort_order:
                        order_by_name: descending
                        order_by_field:
                          display_label: Modified Time
                          api_name: Modified_Time
                          id: '2296900000010863622'
                      selection_details:
                        result_type: multiple
                        selection_type: mandate
                        range: 20
                        limit: 10
                      selected_fields: []
                      type: child
                      parent_record_field:
                        id: '2296900000011244175'
                      child_relationship:
                        id: '2296900000010872872'
                        display_label: Calls
            x-zs-llm-examples:
              - CreateChildGetRecord
      responses:
        '201':
          description: Get record created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateGetRecordResponse'
              examples:
                Success201:
                  summary: Successfully created get record
                  value:
                    get_records:
                      - code: SUCCESS
                        details:
                          id: '2296900000011244392'
                        message: Get record created successfully
                        status: success
          headers:
            X-API-CREDITS-REMAINING:
              schema:
                type: string
                format: int64
                description: >
                  Present when >=50% of base daily credits (excluding add-on
                  credits) are consumed. Value is total remaining credits
                  including add-on credits for the rolling 24-hour window.
              required: false
        '400':
          description: Invalid request due to validation errors.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetRecordErrorResponse'
              examples:
                InvalidKiosk:
                  summary: No such Kiosk exists
                  value:
                    code: INVALID_DATA
                    details:
                      resource_path_index: 2
                    message: No such Kiosk exists
                    status: error
                DuplicateName:
                  summary: Duplicate get record name
                  value:
                    get_records:
                      - code: DUPLICATE_DATA
                        details:
                          api_name: name
                          json_path: $.get_records[0].name
                        message: Duplicate get record name
                        status: error
                MandatoryFieldMissing:
                  summary: Required field criteria is missing
                  value:
                    get_records:
                      - code: MANDATORY_NOT_FOUND
                        details:
                          api_name: criteria
                          json_path: $.get_records[0].criteria
                        message: required field not found
                        status: error
                InvalidDataType:
                  summary: Invalid data type for name field
                  value:
                    get_records:
                      - code: INVALID_DATA
                        message: Invalid data type
                        details:
                          api_name: name
                          expected_data_type: text
                          json_path: $.get_records[*].name
                        status: error
                DependentMismatch:
                  summary: Selection range should be 1 for single record
                  value:
                    get_records:
                      - code: DEPENDENT_MISMATCH
                        details:
                          dependee:
                            api_name: result_type
                            json_path: $.get_records[0].selection_details.result_type
                          api_name: range
                          json_path: $.get_records[0].selection_details.range
                          maximum_value: 1
                        message: >-
                          Get Record selection range should be 1 for single
                          record
                        status: error
                DependentFieldMissing:
                  summary: parent_record_field required when type is child
                  value:
                    get_records:
                      - code: DEPENDENT_FIELD_MISSING
                        message: Dependent field is missing
                        details:
                          dependee:
                            api_name: type
                            json_path: $.get_records[*].type
                          api_name: parent_record_field
                          json_path: $.get_records[*].parent_record_field
                        status: error
          headers:
            X-API-CREDITS-REMAINING:
              schema:
                type: string
                format: int64
                description: >
                  Present when >=50% of base daily credits (excluding add-on
                  credits) are consumed. Value is total remaining credits
                  including add-on credits for the rolling 24-hour window.
              required: false
      security:
        - OAuth2:
            - ZohoCRM.settings.kiosks.CREATE
  /settings/kiosks/{kioskId}/get_records/{getRecordId}:
    get:
      summary: Retrieve a specific get_record component from a Kiosk
      description: >
        To retrieve the details of a specific GetRecords configuration
        associated with a Kiosk using its GetRecords ID. Use the [Get All Kiosks
        API](kiosks.yaml#$.paths./settings/kiosks.get) to retrieve the Kiosk ID
        and the Kiosk GetRecords API to retrieve the GetRecords ID.

        **Note:**

        The response structure is dynamic and depends on the GetRecords
        configuration. Fields such as criteria, type, and selection_details may
        vary based on the configured settings.
      operationId: getKioskGetRecord
      parameters:
        - $ref: '#/components/parameters/ParamPathKioskid'
        - $ref: '#/components/parameters/ParamPathGetRecordid'
        - $ref: '#/components/parameters/ParamQueryIncludeInnerDetails'
      responses:
        '200':
          description: >
            Returns the full configuration of the specified get_record
            component, including its module, type, criteria, sort order,
            selection details, and selected fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllGetRecordsResponse'
              examples:
                Success200:
                  summary: |
                    Successful retrieval of a single get_record component by ID
                  value:
                    get_records:
                      - selection_details:
                          selection_type: null
                          result_type: single
                          limit: 1
                          range: 1
                        criteria:
                          comparator: not_equal
                          field:
                            api_name: Annual_Revenue
                            id: '4676645000000000581'
                          type: value
                          value: ${EMPTY}
                        module:
                          api_name: Leads
                          id: '4676645000000000125'
                        name: GetRecords 4
                        id: '4676645000000914086'
                        type: parent
                        selected_fields: null
                        sort_order:
                          order_by_name: descending
                          order_by_field:
                            api_name: Modified_Time
                            id: '4676645000000000595'
                  description: >
                    Shows a successful retrieval of a single get_record
                    component with its full configuration, including module,
                    type, sort order, selection details, selected fields, and
                    criteria.
          headers:
            X-API-CREDITS-REMAINING:
              schema:
                type: string
                format: int64
                description: >
                  Present when >=50% of base daily credits (excluding add-on
                  credits) are consumed. Value is total remaining credits
                  including add-on credits for the rolling 24-hour window.
              required: false
        '400':
          description: >
            The request is invalid due to a malformed or nonexistent kiosk ID or
            get_record ID.

            **Resolution:** The caller must verify that the kioskId and
            getRecordId path parameters reference valid, existing resources
            before retrying the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetRecordErrorResponse'
              examples:
                InvalidKiosk:
                  summary: |
                    400 error when the kiosk ID does not exist
                  value:
                    code: INVALID_DATA
                    details:
                      resource_path_index: 2
                    message: No such Kiosk exists
                    status: error
                  description: >
                    Shows a 400 error response returned when the kioskId path
                    parameter does not match an existing kiosk. The response
                    uses the flat error schema with a status of error and a
                    message indicating the kiosk does not exist.
          headers:
            X-API-CREDITS-REMAINING:
              schema:
                type: string
                format: int64
                description: >
                  Present when >=50% of base daily credits (excluding add-on
                  credits) are consumed. Value is total remaining credits
                  including add-on credits for the rolling 24-hour window.
              required: false
      security:
        - OAuth2:
            - ZohoCRM.settings.kiosks.READ
    put:
      summary: Kiosk GetRecord
      description: >
        To update an existing
        [GetRecords](https://help.zoho.com/portal/en/kb/crm/customize-crm-account/kiosk/articles/elements-of-a-kiosk#GetRecords)
        configuration associated with a Kiosk. This API supports only draft
        Kiosks.


        You can update the following fields:
          - name
          - criteria
          - sort_order
          - result_type
          - limit

        Use the [Get All Kiosks API](kiosks.yaml#$.paths./settings/kiosks.get)
        to retrieve the Kiosk ID and use the Kiosk GetRecords API to retrieve
        the available GetRecords configurations for a Kiosk.


        **Note:** This API won't work for the Active Kiosks. The system will
        throw the **NOT_ALLOWED** error.
      operationId: updateKioskGetRecord
      parameters:
        - $ref: '#/components/parameters/ParamPathKioskid'
        - $ref: '#/components/parameters/ParamPathGetRecordid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateGetRecordRequest'
            examples:
              UpdateGetRecord:
                summary: Update a get record with new criteria and selection
                value:
                  get_records:
                    - name: GetRecords 3
                      module:
                        api_name: Leads
                        id: '2296900000010857048'
                        name: Leads
                      criteria:
                        group_operator: and
                        group:
                          - field:
                              api_name: Annual_Revenue
                              id: '2296900000010863615'
                              field_label: Annual Revenue
                              data_type: currency
                              decimal_place: 2
                            comparator: not_equal
                            value:
                              id: '2296900000010863615'
                              api_name: Annual_Revenue
                            type: value
                          - field:
                              api_name: City
                              id: '2296900000010863627'
                              field_label: City
                              data_type: text
                            comparator: equal
                            value:
                              api_name: users.last_name
                              id: '2296900000010863437'
                              data_type: text
                            type: field
                      sort_order:
                        order_by_name: descending
                        order_by_field:
                          display_label: Modified Time
                          api_name: Modified_Time
                          id: '2296900000010863622'
                      selection_details:
                        result_type: multiple
                        selection_type: mandate
                        range: 20
                        limit: 10
                      selected_fields: []
                      type: child
                      parent_record_field:
                        id: '2296900000011244175'
                      child_relationship:
                        id: '2296900000010872872'
                        display_label: Calls
            x-zs-llm-examples:
              - UpdateGetRecord
      responses:
        '200':
          description: Get record updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateGetRecordResponse'
              examples:
                Success200:
                  summary: Successfully updated get record
                  value:
                    get_records:
                      - code: SUCCESS
                        details:
                          id: '2296900000011244362'
                        message: Get record updated successfully
                        status: success
          headers:
            X-API-CREDITS-REMAINING:
              schema:
                type: string
                format: int64
                description: >
                  Present when >=50% of base daily credits (excluding add-on
                  credits) are consumed. Value is total remaining credits
                  including add-on credits for the rolling 24-hour window.
              required: false
        '400':
          description: Invalid request due to validation errors.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetRecordErrorResponse'
              examples:
                InvalidKiosk:
                  summary: No such Kiosk exists
                  value:
                    code: INVALID_DATA
                    details:
                      resource_path_index: 2
                    message: No such Kiosk exists
                    status: error
                DuplicateName:
                  summary: Duplicate get record name
                  value:
                    get_records:
                      - code: DUPLICATE_DATA
                        details:
                          api_name: name
                          json_path: $.get_records[0].name
                        message: Duplicate get record name
                        status: error
                DependentMismatch:
                  summary: Selection range should be 1 for single record
                  value:
                    get_records:
                      - code: DEPENDENT_MISMATCH
                        details:
                          dependee:
                            api_name: result_type
                            json_path: $.get_records[0].selection_details.result_type
                          api_name: range
                          json_path: $.get_records[0].selection_details.range
                          maximum_value: 1
                        message: >-
                          Get Record selection range should be 1 for single
                          record
                        status: error
          headers:
            X-API-CREDITS-REMAINING:
              schema:
                type: string
                format: int64
                description: >
                  Present when >=50% of base daily credits (excluding add-on
                  credits) are consumed. Value is total remaining credits
                  including add-on credits for the rolling 24-hour window.
              required: false
      security:
        - OAuth2:
            - ZohoCRM.settings.kiosks.UPDATE
    delete:
      summary: Kiosk GetRecord
      description: >
        To delete a specific
        [GetRecords](https://help.zoho.com/portal/en/kb/crm/customize-crm-account/kiosk/articles/elements-of-a-kiosk#GetRecords)
        configuration associated with a Kiosk.

        Use the [GetRecords Associations
        API](kiosks_get_records.yaml#$.paths./settings/kiosks/{kioskId}/get_records/{getRecordId}/associations.get)
        to identify all associations of the GetRecords configuration. Remove the
        associations from the respective Kiosk components, and then delete the
        GetRecords configuration.

        Use the [Get All Kiosks API](kiosks.yaml#$.paths./settings/kiosks.get)
        to retrieve the Kiosk ID and use the [Kiosk GetRecords
        API](kiosks_get_records.yaml#$.paths./settings/kiosks/{kioskId}/get_records.get)
        to retrieve the GetRecords ID.

        **Note:**

        The response structure is dynamic and depends on the GetRecords
        configuration. Fields such as criteria, type, and selection_details may
        vary based on the configured settings.
      operationId: deleteKioskGetRecord
      parameters:
        - $ref: '#/components/parameters/ParamPathKioskid'
        - $ref: '#/components/parameters/ParamPathGetRecordid'
      responses:
        '200':
          description: Get record deleted successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteGetRecordResponse'
              examples:
                Success200:
                  summary: Successfully deleted get record
                  value:
                    get_records:
                      - code: SUCCESS
                        details:
                          id: '4676645000000914120'
                        message: Get record deleted successfully
                        status: success
          headers:
            X-API-CREDITS-REMAINING:
              schema:
                type: string
                format: int64
                description: >
                  Present when >=50% of base daily credits (excluding add-on
                  credits) are consumed. Value is total remaining credits
                  including add-on credits for the rolling 24-hour window.
              required: false
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetRecordErrorResponse'
              examples:
                InvalidData:
                  summary: invalid data
                  value:
                    code: INVALID_DATA
                    details:
                      resource_path_index: 6
                    message: invalid data
                    status: error
          headers:
            X-API-CREDITS-REMAINING:
              schema:
                type: string
                format: int64
                description: >
                  Present when >=50% of base daily credits (excluding add-on
                  credits) are consumed. Value is total remaining credits
                  including add-on credits for the rolling 24-hour window.
              required: false
      security:
        - OAuth2:
            - ZohoCRM.settings.kiosks.DELETE
  /settings/kiosks/{kioskId}/get_records/{getRecordId}/associations:
    get:
      summary: GetRecords Associations
      description: >
        This API returns all the associations of a specific
        [GetRecords](https://help.zoho.com/portal/en/kb/crm/customize-crm-account/kiosk/articles/elements-of-a-kiosk#GetRecords)
        configuration. Associations represent where the configuration is being
        used, such as:
          - Kiosk states
          - Actions
          - Other dependent elements

        This API helps you understand the dependencies of a GetRecords
        configuration before
        [modifying](kiosks_states.yaml#$.paths./settings/kiosks/{kioskId}/states/{stateId}.put) 
        or
        [deleting](kiosks_states.yaml#$.paths./settings/kiosks/{kioskId}/states/{stateId}.delete)
        it. 



        **Note:** Predefined states, start state and end state, cannot be
        deleted.
      operationId: getKioskGetRecordAssociations
      parameters:
        - $ref: '#/components/parameters/ParamPathKioskid'
        - $ref: '#/components/parameters/ParamPathGetRecordid'
        - $ref: '#/components/parameters/ParamQueryIncludeInnerDetails'
      responses:
        '200':
          description: >-
            Returns the association data for the specified get_record component
            within the kiosk, including the list of resources and the type of
            each association.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetGetRecordAssociationsResponse'
              examples:
                Success200:
                  summary: >
                    Successful retrieval of associations for a get_record
                    component
                  value:
                    get_records:
                      - _associations:
                          - resources:
                              - name: GetRecords 8
                                id: '2296900000011244383'
                                _details:
                                  type: get_records
                            type: kiosk_states
                        id: '2296900000011244362'
                  description: >
                    The response contains association data for the specified
                    get_record component, with associations grouped by kiosk
                    states and each group listing the detail view page resources
                    that reference the component.
          headers:
            X-API-CREDITS-REMAINING:
              schema:
                type: string
                format: int64
                description: >
                  Present when >=50% of base daily credits (excluding add-on
                  credits) are consumed. Value is total remaining credits
                  including add-on credits for the rolling 24-hour window.
              required: false
        '400':
          description: >-
            Returned when the request contains invalid path parameters.

            **Resolution:** The kioskId and getRecordId path parameters must
            reference a valid, existing kiosk and get_record component in the
            organization.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetRecordErrorResponse'
              examples:
                InvalidKiosk:
                  summary: |
                    400 error when the kiosk ID in the path is invalid
                  value:
                    code: INVALID_DATA
                    details:
                      resource_path_index: 2
                    message: No such Kiosk exists
                    status: error
                  description: >-
                    Returns a 400 error when the kiosk ID supplied in the
                    request path does not correspond to any existing kiosk in
                    the organization. The error body carries an INVALID_DATA
                    code and a details object that identifies the offending path
                    segment via a resource path index.
                InvalidGetRecord:
                  summary: |
                    400 error when the get_record ID in the path is invalid
                  value:
                    code: INVALID_DATA
                    details:
                      resource_path_index: 4
                    message: No such Get Record exists in Kiosk
                    status: error
                  description: >-
                    Returns a 400 error when the get_record ID supplied in the
