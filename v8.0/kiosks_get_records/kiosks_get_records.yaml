components:
  schemas:
    CreateGetRecordRequest:
      type: object
      additionalProperties: false
      description: Request body for creating a new get_record component.
      properties:
        get_records:
          type: array
          description: Array containing the get_record configuration to create.
          items:
            $ref: '#/components/schemas/CreateGetRecordPayload'
          maxItems: 1
      required:
        - get_records
    CreateGetRecordPayload:
      type: object
      additionalProperties: false
      description: >-
        Payload for creating a get_record component. Defines the module,
        criteria, selection rules, and sort order.
      properties:
        name:
          type: string
          description: >-
            Human-readable name of the get_record component. Must be unique
            within the kiosk.
          maxLength: 50
        module:
          $ref: '#/components/schemas/ModuleRef'
          description: Module from which records will be fetched.
        criteria:
          $ref: '#/components/schemas/FilterCriterionRequest'
          description: >-
            Filter criteria configuration for selecting records. Supports both
            simple field-based filters and grouped conditions with logical
            operators (AND/OR). MANDATORY type key is required inside criteria
            even if it's not mentioned in the schema
          x-zs-llm-description: Always include 'type' inside criteria, even if not in schema.
        sort_order:
          $ref: '#/components/schemas/SortOrder'
          description: >-
            Sort order configuration for fetched records. order_by_name is
            always required. When order_by_name is 'not_sort', order_by_field
            must not be present. Otherwise, order_by_field is required and its
            'id' key must be provided
          x-zs-llm-description: >-
            order_by_name always required; omit order_by_field when value is
            'not_sort'.
        selection_details:
          $ref: '#/components/schemas/SelectionDetails'
          description: >-
            Selection rules controlling how many records are fetched and how
            users can select from them.
        selected_fields:
          type:
            - array
            - 'null'
          description: >-
            Fields to display when the get_record is shown on a screen. Only
            needed when associated with a screen state.
          items:
            type: string
            description: API name of a selected field.
            maxLength: 30
          maxItems: 50
        type:
          type:
            - string
            - 'null'
          description: >-
            Module type: 'parent' for direct modules (e.g., Leads) or 'child'
            for related modules (e.g., Calls).
          enum:
            - parent
            - child
        parent_record_field:
          $ref: '#/components/schemas/ParentRecordField'
          description: Reference to the parent module field. Required when type is 'child'.
        child_relationship:
          $ref: '#/components/schemas/ChildRelationship'
          description: Reference to the child relationship. Used when type is 'child'.
      required:
        - criteria
        - module
        - name
        - sort_order
      if:
        type: object
        properties:
          type:
            const: child
            description: Type value to match against.
        description: Check if the module type is child.
        additionalProperties: true
      then:
        type: object
        required:
          - parent_record_field
        description: When type is child, parent_record_field becomes required.
        additionalProperties: true
        properties:
          parent_record_field:
            description: Reference to the parent module field, required for child type.
    UpdateGetRecordRequest:
      type: object
      additionalProperties: false
      description: Request body for updating an existing get_record component.
      properties:
        get_records:
          type: array
          description: Array containing the get_record update payload.
          items:
            $ref: '#/components/schemas/UpdateGetRecordPayload'
          maxItems: 1
      required:
        - get_records
    UpdateGetRecordPayload:
      type: object
      additionalProperties: false
      description: >-
        Payload for updating a get_record component. All fields are optional -
        only fields provided will be updated.
      properties:
        name:
          type:
            - string
            - 'null'
          description: Human-readable name of the get_record component.
          maxLength: 50
        module:
          $ref: '#/components/schemas/ModuleRefUpdate'
          description: Module from which records will be fetched.
        criteria:
          $ref: '#/components/schemas/FilterCriterionRequest'
          description: Filter criteria configuration for selecting records.
        sort_order:
          $ref: '#/components/schemas/SortOrderUpdate'
          description: Sorting configuration for the fetched records.
        selection_details:
          $ref: '#/components/schemas/SelectionDetailsUpdate'
          description: Selection rules controlling how many records are fetched.
        selected_fields:
          type:
            - array
            - 'null'
          description: Fields to display when the get_record is shown on a screen.
          items:
            type: string
            description: API name of a selected field.
            maxLength: 30
          maxItems: 50
        type:
          type:
            - string
            - 'null'
          description: 'Module type: ''parent'' or ''child''.'
          enum:
            - parent
            - child
        parent_record_field:
          $ref: '#/components/schemas/ParentRecordFieldUpdate'
          description: Reference to the parent module field.
        child_relationship:
          $ref: '#/components/schemas/ChildRelationshipUpdate'
          description: Reference to the child relationship.
      if:
        type: object
        properties:
          type:
            const: child
            description: Type value to match against.
        description: Check if the module type is child.
        additionalProperties: true
      then:
        type: object
        required:
          - parent_record_field
        description: When type is child, parent_record_field becomes required.
        additionalProperties: true
        properties:
          parent_record_field:
