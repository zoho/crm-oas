              maxLength: 255
            maximum_length:
              type: integer
              description: Maximum allowed length when a value exceeds the limit.
              format: int32
            resource_path_index:
              type: integer
              description: Index in the resource path that is invalid.
              format: int32
            supported_values:
              type: array
              description: List of supported values when an invalid enum value is provided.
              items:
                type: string
                maxLength: 1000
                description: A supported enum value.
              maxItems: 50
        message:
          type: string
          description: Human-readable error message describing what went wrong.
          maxLength: 500
        status:
          type: string
          description: Status of the response. Always 'error' for error responses.
          enum:
            - error
      required:
        - code
        - details
        - message
        - status
      x-zs-$id: GetRecordErrorItem
    GetRecordBatchError:
      type: object
      description: >-
        Batch error response wrapping item-level validation errors in a
        get_records array.
      additionalProperties: false
      properties:
        get_records:
          type: array
          description: Array of get_record error items.
          items:
            $ref: '#/components/schemas/GetRecordErrorItem'
          maxItems: 1
      required:
        - get_records
      x-zs-$id: GetRecordBatchError
    KioskBatchError:
      type: object
      description: >-
        Batch error response wrapping item-level validation errors in a kiosks
