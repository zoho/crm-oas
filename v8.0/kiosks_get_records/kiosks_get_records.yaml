      additionalProperties: false
      properties:
        kiosks:
          type: array
          description: Array of kiosk error items.
          items:
            $ref: '#/components/schemas/GetRecordErrorItem'
          maxItems: 1
      required:
        - kiosks
      x-zs-$id: KioskBatchError
    GetAllKioskAssociationsListResponse:
      type: object
      additionalProperties: false
      description: Response containing association information for all kiosks.
      properties:
        kiosks:
          type: array
          description: Array of kiosk association data.
          items:
            $ref: '#/components/schemas/GETKioskAssociationsListEntry'
          maxItems: 200
      required:
        - kiosks
      x-zs-$id: GetAllKioskAssociationsListResponse
    GETKioskAssociationsListEntry:
      type: object
      additionalProperties: false
      description: Kiosk item with its detail view page association information.
      properties:
        _associations:
          type: array
          description: List of associations for this kiosk.
          items:
            $ref: '#/components/schemas/GETKioskDetailViewAssociationFull'
          maxItems: 50
        id:
          type: string
          description: Kiosk identifier.
          maxLength: 255
