                    items:
                      oneOf:
                        - x-zs-$id: UpdateNoteSuccessResult
                          type: object
                          description: Successful note update result
                          additionalProperties: false
                          properties:
                            code:
                              type: string
                              description: Result code
                              enum:
                                - SUCCESS
                            message:
                              type: string
                              description: Result message
                              maxLength: 500
                            status:
                              type: string
                              description: Status of the operation
                              enum:
                                - success
                            details:
                              type: object
                              description: Updated note details
                              additionalProperties: false
                              properties:
                                id:
                                  type: string
                                  description: Unique identifier of the updated note
                                  format: int64
                                Modified_Time:
                                  type: string
                                  description: Timestamp when the note was last modified
                                  format: date-time
                                Created_Time:
                                  type: string
                                  description: Timestamp recording note creation
                                  format: date-time
                                Created_By:
                                  type: object
                                  description: User who created the note
                                  additionalProperties: false
                                  properties:
                                    name:
                                      type: string
                                      description: Name of the user
                                      maxLength: 255
                                    id:
