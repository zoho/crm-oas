                              maxLength: 500
                            status:
                              type: string
                              description: Status of the operation
                              enum:
                                - success
                            details:
                              type: object
                              description: Created note details
                              additionalProperties: false
                              properties:
                                id:
                                  type: string
                                  description: Unique identifier of the created note
                                  format: int64
                                Modified_Time:
                                  type: string
                                  description: Timestamp when the note was last modified
                                  format: date-time
                                Created_Time:
                                  type: string
                                  description: Timestamp recording note creation
                                  format: date-time
                                Created_By:
                                  type: object
                                  description: User who created the note
                                  additionalProperties: false
                                  properties:
                                    name:
                                      type: string
                                      description: Name of the user
                                      maxLength: 255
                                    id:
                                      type: string
                                      description: Unique identifier of the user
                                      format: int64
                                  required:
                                    - name
                                    - id
                                Modified_By:
                                  type: object
                                  description: User who last modified the note
                                  additionalProperties: false
                                  properties:
                                    name:
                                      type: string
                                      description: Name of the user
                                      maxLength: 255
                                    id:
                                      type: string
                                      description: Unique identifier of the user
                                      format: int64
                                  required:
                                    - name
                                    - id
                              required:
                                - id
                                - Modified_Time
                                - Created_Time
                                - Created_By
                                - Modified_By
                          required:
                            - code
                            - message
                            - status
                            - details
                        - x-zs-$id: CreateNoteErrorResult
                          type: object
                          description: Failed note creation result
                          additionalProperties: false
                          properties:
                            code:
                              type: string
                              description: Error code
                              enum:
                                - EXPECTED_FIELD_MISSING
                                - INVALID_DATA
                            message:
                              type: string
                              description: Error message
                              maxLength: 500
                            status:
                              type: string
                              description: Status of the operation
                              enum:
                                - error
                            details:
                              type: object
                              description: Error details
                              additionalProperties: true
                          required:
                            - code
                            - message
                            - status
                            - details
                required:
                  - data
              examples:
                PartialSuccess:
                  summary: Partial success - some notes created, some failed
                  value:
                    data:
                      - code: SUCCESS
                        details:
                          Modified_Time: '2026-01-05T14:27:48+05:30'
                          Modified_By:
                            name: Prasanna CEO
                            id: '111111000000059489'
                          Created_Time: '2026-01-05T14:27:48+05:30'
                          id: '111111000000116018'
                          Created_By:
                            name: Prasanna CEO
                            id: '111111000000059489'
                        message: record added
                        status: success
                      - code: EXPECTED_FIELD_MISSING
                        details:
                          expected_fields:
                            - api_name: Note_Content
                              json_path: $.data[1].Note_Content
                            - api_name: Note_Title
                              json_path: $.data[1].Note_Title
                        message: should contain either content or title
                        status: error
        '400':
          description: Bad Request - Invalid parameters or malformed request
          content:
            application/json:
              schema:
                x-zs-$id: NotesPostErrorResponse
                oneOf:
                  - $ref: '#/components/schemas/ExpectedFieldMissingError'
                  - $ref: '#/components/schemas/InvalidDataError'
                  - $ref: '#/components/schemas/InvalidDataLimitExceededError'
                  - $ref: '#/components/schemas/NotAllowedError'
                  - $ref: '#/components/schemas/FileSizeExceedsError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Forbidden - User lacks required permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoPermissionError'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      operationId: updateNotesModule
      summary: Update Notes
      description: >-
        Updates one or more existing note records. Either note content or note
        title must be provided (at least one is mandatory) for each note.
      x-zs-llm-description: >-
        Bulk-updates existing notes by id. Each item must include id and at
        least one editable note field such as Note_Content or Note_Title. Prefer
        this endpoint when updating multiple notes in one request.
      security:
        - OAuth2:
            - ZohoCRM.modules.notes.UPDATE
      requestBody:
        description: Request body containing note data to update
        content:
          application/json:
            schema:
              type: object
              description: Request payload for updating notes
              additionalProperties: false
              properties:
                data:
                  type: array
                  description: Array of note objects to update
                  maxItems: 100
                  items:
                    type: object
                    description: Note object with an ID, title, and/or content to update.
                    additionalProperties: true
                    properties:
                      id:
                        type: string
                        description: Unique identifier of the note to update
                        format: int64
                      Note_Content:
                        type:
                          - string
                          - 'null'
                        description: The content/body of the note
                        maxLength: 65535
                      Note_Title:
                        type:
                          - string
                          - 'null'
                        description: The title of the note
                        maxLength: 120
                    required:
                      - id
              required:
                - data
            examples:
              UpdateMultipleNotes:
                summary: Update multiple notes
                value:
                  data:
                    - id: '4876876000006021002'
                      Note_Title: Follow-up Completed
                      Note_Content: Customer requested additional information
                    - id: '4876876000006021003'
                      Note_Title: Meeting Notes
                      Note_Content: Discussed project requirements
            x-zs-llm-examples:
              - UpdateMultipleNotes
        required: true
      responses:
        '200':
          description: Success - Note(s) successfully updated
          content:
            application/json:
              schema:
                type: object
                x-zs-$id: NotesUpdateSuccessResponse
                description: Success response for note update
                additionalProperties: false
                properties:
                  data:
                    type: array
                    description: Array of update results
                    maxItems: 100
                    items:
                      type: object
                      description: Individual note update result
                      additionalProperties: false
                      properties:
                        code:
                          type: string
                          description: Result code
                          enum:
                            - SUCCESS
                        message:
                          type: string
                          description: Result message
                          maxLength: 500
                        status:
                          type: string
                          description: Status of the operation
                          enum:
                            - success
                        details:
                          type: object
                          description: Updated note details
                          additionalProperties: false
                          properties:
                            id:
                              type: string
                              description: Unique identifier of the updated note
                              format: int64
                            Modified_Time:
                              type: string
                              description: Timestamp when the note was last modified
                              format: date-time
                            Created_Time:
                              type: string
                              description: Timestamp recording note creation
                              format: date-time
                            Created_By:
                              type: object
                              description: User who created the note
                              additionalProperties: false
                              properties:
                                name:
                                  type: string
                                  description: Name of the user
                                  maxLength: 255
                                id:
                                  type: string
                                  description: Unique identifier of the user
                                  format: int64
                              required:
                                - name
                                - id
                            Modified_By:
                              type: object
                              description: User who last modified the note
                              additionalProperties: false
                              properties:
                                name:
                                  type: string
                                  description: Name of the user
                                  maxLength: 255
                                id:
                                  type: string
                                  description: Unique identifier of the user
                                  format: int64
                              required:
                                - name
                                - id
                          required:
                            - id
                            - Modified_Time
                            - Created_Time
                            - Created_By
                            - Modified_By
                      required:
                        - code
                        - message
                        - status
                        - details
                required:
                  - data
              examples:
                SuccessfulUpdate:
                  summary: Notes successfully updated
                  value:
                    data:
                      - code: SUCCESS
                        details:
                          Modified_Time: '2023-12-19T17:30:15+05:30'
                          Modified_By:
                            name: Patricia Boyle
                            id: '4876876000000327001'
                          Created_Time: '2023-12-19T16:45:07+05:30'
                          id: '4876876000006021002'
                          Created_By:
                            name: Patricia Boyle
                            id: '4876876000000327001'
                        message: record updated
                        status: success
                      - code: SUCCESS
                        details:
                          Modified_Time: '2023-12-19T17:30:16+05:30'
                          Modified_By:
                            name: Patricia Boyle
                            id: '4876876000000327001'
