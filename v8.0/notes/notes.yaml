openapi: 3.1.0
info:
  title: Notes
  description: >-
    Retrieve, create, update, and delete note records attached to any Zoho CRM
    module record. Notes carry a title, body text, and a parent record
    reference, and support up to five file attachments.
  version: '8.0'
servers:
  - url: https://zohoapis.{dc}/crm/{version}
    description: >-
      Zoho CRM API server. Replace {dc} with your data-center TLD and {version}
      with the target API version.
    variables:
      dc:
        enum:
          - com
          - eu
          - in
          - cn
          - au
        default: com
        description: >-
          Data-center top-level domain for the CRM account (for example, com,
          eu, in, au, or cn).
      version:
        default: v8
        description: API version to target (for example, v8).
paths:
  /Notes:
    get:
      operationId: getNotesModule
      summary: Notes
      description: Retrieves a list of notes.
      x-zs-llm-description: >-
        Lists note records across modules and supports pagination, sorting, and
        field filtering. Use this to discover note ids before calling get-by-id,
        update, or delete operations.
      security:
        - OAuth2:
            - ZohoCRM.modules.notes.READ
      parameters:
        - $ref: '#/components/parameters/Fields'
        - $ref: '#/components/parameters/Ids'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageToken'
        - $ref: '#/components/parameters/SortOrder'
        - $ref: '#/components/parameters/SortBy'
      responses:
        '200':
          description: Successful response with note records
          content:
            application/json:
              schema:
                type: object
                x-zs-$id: NotesGetResponse
                description: Response containing note data and pagination information
                additionalProperties: false
                properties:
                  data:
                    type: array
                    description: Array of note records
                    maxItems: 200
                    items:
                      type: object
                      description: >-
                        A note record with static fields and dynamic additional
                        properties
                      additionalProperties: true
                      properties:
                        id:
                          type: string
                          description: Unique identifier of the note
                          format: int64
                        Note_Title:
                          type:
                            - string
                            - 'null'
                          description: The title of the note
                          maxLength: 120
                        Note_Content:
                          type:
                            - string
                            - 'null'
                          description: The content/body of the note
                          maxLength: 65535
                        $attachments:
                          type:
                            - array
                            - 'null'
                          description: Attachments associated with the note
                          maxItems: 5
                          items:
                            type: object
                            description: Attachment file details
                            additionalProperties: true
                            properties:
                              $file_id:
                                type: string
                                description: Unique file identifier for the attachment
                                maxLength: 255
                              File_Name:
                                type: string
                                description: Name of the attached file
                                maxLength: 255
                              Size:
                                type: string
                                description: File size in bytes
                                format: int64
                              id:
                                type: string
                                description: Unique identifier of the attachment record
                                format: int64
                        Parent_Id:
                          type: object
                          description: Parent record information
                          additionalProperties: false
                          properties:
                            module:
                              type: object
                              description: Module information of the parent record
                              additionalProperties: false
                              properties:
                                api_name:
                                  type: string
                                  description: API name of the parent module
                                  maxLength: 50
                                id:
                                  type: string
                                  description: Module ID
                                  format: int64
                              required:
                                - api_name
                                - id
                            name:
                              type: string
                              description: Name of the parent record
                              maxLength: 255
                            id:
                              type: string
                              description: Unique identifier of the parent record
                              format: int64
                          required:
                            - module
                            - id
                            - name
                      required:
                        - id
                  info:
                    type: object
                    description: Pagination metadata
                    additionalProperties: false
                    properties:
                      page:
                        type: integer
                        format: int32
                        description: Current page number
                      per_page:
                        type: integer
                        format: int32
                        description: Number of records per page
                      count:
                        type: integer
                        format: int32
                        description: Number of records in current page
                      more_records:
                        type: boolean
                        description: Indicates if more records are available
                      next_page_token:
                        type:
                          - string
                          - 'null'
                        description: Token for retrieving the next page of note records.
                        maxLength: 2000
                      previous_page_token:
                        type:
                          - string
                          - 'null'
                        description: >-
                          Token for retrieving the previous page of note
                          records.
                        maxLength: 2000
                      page_token_expiry:
                        type:
                          - string
                          - 'null'
                        format: date-time
                        description: Expiry time of page tokens
                      sort_by:
                        type: string
                        description: Field by which the results are sorted
                        maxLength: 50
                      sort_order:
                        type: string
                        description: Sort order of the results
                        enum:
                          - asc
                          - desc
                    required:
                      - page
                      - per_page
                      - count
                      - more_records
                required:
                  - data
                  - info
              examples:
                SuccessResponse:
                  summary: Successful notes retrieval
                  value:
                    data:
                      - id: '1043386000020244003'
                        Note_Title: null
                        Note_Content: sdf
                        $attachments:
                          - $file_id: 2rsp48b6960fb9f4d444dada8740791775f35
                            File_Name: 20251117_194524.jpg
                            Size: '1623514'
                            id: '1043386000020248003'
                        Parent_Id:
                          module:
                            api_name: Leads
                            id: '1043386000000002175'
                          name: a
                          id: '1043386000019763257'
                        Owner:
                          name: Prasanna
                          id: '1043386000000322001'
                          email: prasanna.saravanan@zohocorp.com
                        Modified_Time: '2025-11-19T19:27:53+05:30'
                        Created_Time: '2025-11-14T11:54:12+05:30'
                    info:
                      page: 1
                      per_page: 200
                      count: 1
                      more_records: false
                      next_page_token: null
                      previous_page_token: null
                      page_token_expiry: null
                      sort_by: Created_Time
                      sort_order: asc
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          description: Bad Request - Invalid parameters or malformed request
          content:
            application/json:
              schema:
                x-zs-$id: GetNotesBadRequestError
                oneOf:
                  - $ref: '#/components/schemas/RequiredParamMissingError'
                  - $ref: '#/components/schemas/DiscretePaginationLimitExceededError'
                  - $ref: '#/components/schemas/ExpiredValueError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      operationId: createNotesModule
      summary: Create Notes
      description: Creates one or more note records.
      x-zs-llm-description: >-
        Creates one or more standalone note records. For each item, provide at
        least one of Note_Content or Note_Title, and include Parent_Id when the
        note should be attached to a specific CRM record.
      security:
        - OAuth2:
            - ZohoCRM.modules.notes.CREATE
      requestBody:
        description: Request body containing note data to create
        content:
          application/json:
            schema:
              type: object
              description: Request payload for creating notes
              additionalProperties: false
              properties:
                data:
                  type: array
                  description: Array of note objects to create
                  maxItems: 100
                  items:
                    type: object
                    description: Note object with title, content, and parent information
                    additionalProperties: true
                    properties:
                      Note_Content:
                        type:
                          - string
                          - 'null'
                        description: The content/body of the note
                        maxLength: 65535
                      Note_Title:
                        type:
                          - string
                          - 'null'
                        description: The title of the note
                        maxLength: 120
                      Parent_Id:
                        type: object
                        description: Parent record information
                        additionalProperties: false
                        properties:
                          module:
                            type: object
                            description: Module information of the parent record
                            additionalProperties: false
                            properties:
                              api_name:
                                type: string
                                description: API name of the parent module
                                maxLength: 50
                              id:
                                type: string
                                description: Module ID
                                format: int64
                          id:
                            type: string
                            description: Unique identifier of the parent record
                            format: int64
                        required:
                          - module
                          - id
              required:
                - data
            examples:
              CreateNote:
                summary: Create a note for a lead
                value:
                  data:
                    - Note_Title: Contacted
                      Note_Content: Need to do further tracking
                      Parent_Id:
                        module:
                          api_name: Leads
                          id: '4876876000000002175'
                        id: '4876876000005996165'
            x-zs-llm-examples:
              - CreateNote
        required: true
      responses:
        '201':
          description: Created - Note(s) successfully created
          content:
            application/json:
              schema:
                type: object
                x-zs-$id: NotesPostSuccessResponse
                description: Success response for note creation
                additionalProperties: false
                properties:
                  data:
                    type: array
                    description: Array of creation results
                    maxItems: 100
                    items:
                      type: object
                      description: Individual note creation result
                      additionalProperties: false
                      properties:
                        code:
                          type: string
                          description: Result code
                          enum:
                            - SUCCESS
                        message:
                          type: string
                          description: Result message
                          maxLength: 500
                        status:
                          type: string
                          description: Status of the operation
                          enum:
                            - success
                        details:
                          type: object
                          description: Created note details
                          additionalProperties: false
                          properties:
                            id:
                              type: string
                              description: Unique identifier of the created note
                              format: int64
                            Modified_Time:
                              type: string
                              description: Timestamp when the note was last modified
                              format: date-time
                            Created_Time:
                              type: string
                              description: Timestamp recording note creation
                              format: date-time
                            Created_By:
                              type: object
                              description: User who created the note
                              additionalProperties: false
                              properties:
                                name:
                                  type: string
                                  description: Name of the user
                                  maxLength: 120
                                id:
                                  type: string
                                  description: Unique identifier of the user
                                  format: int64
                              required:
                                - name
                                - id
                            Modified_By:
                              type: object
                              description: User who last modified the note
                              additionalProperties: false
                              properties:
                                name:
                                  type: string
                                  description: Name of the user
                                  maxLength: 255
                                id:
                                  type: string
                                  description: Unique identifier of the user
                                  format: int64
                              required:
                                - name
                                - id
                          required:
                            - id
                            - Modified_Time
                            - Created_Time
                            - Created_By
                            - Modified_By
                      required:
                        - code
                        - message
                        - status
                        - details
                required:
                  - data
              examples:
                SuccessfulCreation:
                  summary: Note successfully created
                  value:
                    data:
                      - code: SUCCESS
                        details:
                          Modified_Time: '2023-12-19T16:45:07+05:30'
                          Modified_By:
                            name: Patricia Boyle
                            id: '4876876000000327001'
                          Created_Time: '2023-12-19T16:45:07+05:30'
                          id: '4876876000006021002'
                          Created_By:
                            name: Patricia Boyle
                            id: '4876876000000327001'
                        message: record added
                        status: success
        '207':
          description: >-
            Multi-Status - Partial success with some records created and some
            failed
          content:
            application/json:
              schema:
                x-zs-$id: CreateNotesMultiStatusResponse207
                type: object
                description: Multi-status response for note creation with mixed results
                additionalProperties: false
                properties:
                  data:
                    type: array
                    description: >-
                      Array of creation results with mixed success and error
