                                Modified_By:
                                  type: object
                                  description: User who last modified the note
                                  additionalProperties: false
                                  properties:
                                    name:
                                      type: string
                                      description: Name of the user
                                      maxLength: 255
                                    id:
                                      type: string
                                      description: Unique identifier of the user
                                      format: int64
                                  required:
                                    - name
                                    - id
                              required:
                                - id
                                - Modified_Time
                                - Created_Time
                                - Created_By
                                - Modified_By
                          required:
                            - code
                            - message
                            - status
                            - details
                        - x-zs-$id: UpdateNoteErrorResult
                          type: object
                          description: Failed note update result
                          additionalProperties: false
                          properties:
                            code:
                              type: string
                              description: Error code
                              enum:
                                - EXPECTED_FIELD_MISSING
                                - MANDATORY_NOT_FOUND
