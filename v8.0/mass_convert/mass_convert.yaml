components:
  parameters:
    JobId:
      name: job_id
      in: query
      required: true
      description: >-
        Specify the identifier of the mass convert job to retrieve the status
        for. You can get the Job ID from the response of the [Mass Convert
        API](mass_convert.yaml#$.paths./Leads/actions/mass_convert.get).
      schema:
        type: string
        maxLength: 255
  securitySchemes:
    OAuth2:
      type: oauth2
      description: OAuth2 authorization used for CRM operations.
      flows:
        authorizationCode:
          authorizationUrl: https://accounts.zoho.com/oauth/v2/auth
          tokenUrl: https://accounts.zoho.com/oauth/v2/token
          scopes:
            ZohoCRM.mass_convert.leads.CREATE: >-
              Grants permission to create a mass convert job to convert lead
              records into other CRM modules.
            ZohoCRM.mass_convert.leads.READ: >-
              Grants permission to retrieve the status and conversion counts of
              a scheduled mass convert job.
