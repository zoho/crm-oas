openapi: 3.1.0
info:
  title: Mass convert APIs
  description: >-
    This API helps you to convert multiple lead records with or without creating
    a deal. You can also retrieve the status of the mass convert job you
    created.
  version: '8'
servers:
  - url: https://zohoapis.{dc}/crm/{version}
    description: >
      Production API server for Zoho CRM. Sample request URL:
      `https://zohoapis.{dc}/crm/{version}`
    variables:
      dc:
        enum:
          - com
          - eu
          - in
          - cn
          - au
        default: com
        description: >
          The top-level domain identifying the Zoho data center
          region.\\nPossible values:\\n**com**, **eu**, **in**, **cn**, **au**.
          Default: **com**.
      version:
        default: v8
        description: |
          The API version to use in the request URL. Default: **v8**.
paths:
  /Leads/actions/mass_convert:
    post:
      operationId: massConvert
      summary: Submit mass convert job for leads
      description: >-
        To submit a mass convert job that converts lead records into Contacts,
        Accounts, or Deals in your Zoho CRM organization. The job runs
        asynchronously and returns a job identifier for status tracking.
      requestBody:
        description: >-
          The request body must contain the conversion parameters, including the
          required **ids** array of lead record IDs and optional conversion
          configuration fields.
        required: true
        content:
          application/json:
            schema:
              type: object
              description: >-
                Represents the request payload for a mass convert operation,
                containing the lead IDs to convert and optional configuration
                fields.
              additionalProperties: false
              properties:
                ids:
                  type: array
                  description: >-
                    The record IDs of the leads you want to convert. Use the
                    [Get Records API](record.yaml#$.paths./{module}.get) to get
                    the record IDs. Note that you can give a maximum of up to 50
                    records IDs in this array.
                  items:
                    type: string
                    description: >-
                      Each object specifies a lead record ID to include in the
                      mass convert job.
                    maxLength: 255
                  maxItems: 50
                Deals:
                  type: object
                  description: >-
                    Must contain the mandatory keys "Deal_Name", "Stage",
                    "Closing_Date", and "Pipeline"(if enabled), besides the
                    other mandatory fields configured for the Deals module. Note
                    that if there are layouts other than Standard, the
                    custom-defined mandatory fields will not be processed while
                    converting the lead.
                  additionalProperties: false
                  properties:
                    Deal_Name:
                      type: string
                      description: >-
                        Specify the name of the deal to create for the converted
                        lead.
                      maxLength: 255
                  required:
                    - Deal_Name
                assign_to:
                  type: object
                  description: >-
                    Specify the user to assign the converted records to. Refer
                    to the [Get Users](users.yaml#$.paths./users.get) resource
                    for valid values.
                  additionalProperties: false
                  properties:
                    id:
                      description: >-
                        Specify the ID of the user to assign the converted
                        records to. Refer to the [Get
                        Users](users.yaml#$.paths./users.get) resource for valid
                        values.
                      maxLength: 255
                      x-zs-$ref:
                        resource: users
                        origins:
                          - operationId: getUsers
                            propertyId: UserId
                      type: string
                  required:
                    - id
                portal_user_type:
                  type: object
                  description: >-
                    Specify the portal user type for the contact created from
                    the converted lead. Refer to the [Get Portal User
                    Types](portal_user_type.yaml#$.paths./settings/portals/{portal}/user_type/users.get)
                    resource for valid values.
                  additionalProperties: false
                  properties:
                    id:
                      description: >-
                        Specify the ID of the portal user type to assign to the
                        converted contact. Refer to the [Get Portal User
                        Types](portal_user_type.yaml#$.paths./settings/portals/{portal}/user_type/users.get)
                        resource for valid values.
                      maxLength: 255
                      x-zs-$ref:
                        resource: portal_user_type
                        origins:
                          - operationId: getPortalUserTypes
                            propertyId: PortalUserTypesId
                      type: string
                      format: int64
                  required:
                    - id
                related_modules:
                  type: array
                  description: >-
                    The API name and ID of the modules such as Tasks, Meetings,
                    or Calls. If the lead has one or all of these related
                    records, the owner of these records will be changed to the
                    user given in the "assign_to" key.

                    Use the [Get Modules
                    API](modules.yaml#$.paths./settings/modules.get) to get the
                    ID of the module.
                  items:
                    type: object
                    description: >-
                      Each object specifies the API name and ID of a related
                      module to include in the conversion.
                    additionalProperties: false
                    properties:
                      api_name:
                        type: string
                        description: >-
                          Specify the API name of the related module. Refer to
                          the [Get
                          Modules](modules.yaml#$.paths./settings/modules.get)
                          resource for API name.
                        maxLength: 100
                        x-zs-$ref:
                          resource: modules
                          origins:
                            - operationId: getModules
                              propertyId: ModulesApiName
                      id:
                        type: string
                        description: >-
                          Specify the ID of the related module. Refer to the
                          [Get
                          Modules](modules.yaml#$.paths./settings/modules.get)
                          resource for ID.
                        maxLength: 255
                        x-zs-$ref:
                          resource: modules
                          origins:
                            - operationId: getModules
                              propertyId: ModulesId
                        format: int64
                    required:
                      - api_name
                      - id
                  maxItems: 3
                carry_over_tags:
                  type: array
                  description: >-
                    The name and ID of the module you want to associate the tags
                    to while converting the lead. For example, if you give
                    contacts in this array, the tags of the lead will be carried
                    over to the contact that the lead is converted to. Use the
                    [Get Modules
                    API](modules.yaml#$.paths./settings/modules.get) to get the
                    ID of the module. Note that you can carry over tags to
                    Contacts, Deals, and Accounts.
                  items:
                    type: object
                    description: >-
                      Each object specifies the module API name and ID for each
                      tag to carry over to the converted record.
                    additionalProperties: false
                    properties:
                      api_name:
                        type: string
                        description: >-
                          Specify the API name of the module to carry the tags
                          over to. Refer to the [Get
                          Modules](modules.yaml#$.paths./settings/modules.get)
                          resource for valid values.
                        maxLength: 100
                        x-zs-$ref:
                          resource: modules
                          origins:
                            - operationId: getModules
                              propertyId: ModulesApiName
                      id:
                        type: string
                        description: >-
                          Specify the ID of the module to carry the tags over
                          to. Refer to the [Get
                          Modules](modules.yaml#$.paths./settings/modules.get)
                          resource for valid values.
                        maxLength: 255
                        x-zs-$ref:
                          resource: modules
                          origins:
                            - operationId: getModules
                              propertyId: ModulesId
                        format: int64
                    required:
                      - api_name
                      - id
                  maxItems: 3
                move_attachments_to:
                  type: object
                  description: >-
                    The name and ID of the module you want to move the
                    attachments of the lead to after converting. Use the Modules
                    API to get the ID of the module. Note that you can move the
                    attachments to either Contacts, Deals, or Accounts.
                  additionalProperties: false
                  properties:
                    api_name:
                      type: string
                      description: >-
                        Specify the API name of the module to move the lead's
                        attachments to. Refer to the [Get
                        Modules](modules.yaml#$.paths./settings/modules.get)
                        resource for valid values.
                      maxLength: 100
                      x-zs-$ref:
                        resource: modules
                        origins:
                          - operationId: getModules
                            propertyId: ModulesApiName
                    id:
                      type: string
                      description: >-
                        Specify the ID of the target module to move the lead's
                        attachments to.
                      maxLength: 255
                      x-zs-$ref:
                        resource: modules
                        origins:
                          - operationId: getModules
                            propertyId: ModulesId
                      format: int64
                  required:
                    - api_name
                    - id
                apply_assignment_threshold:
                  type: boolean
                  description: >
                    Specify whether assignment threshold rules should be applied
                    when assigning the converted records.

                    Possible values:

                    **true** - Apply assignment threshold rules (default).

                    **false** - Skip assignment threshold rules.
              required:
                - ids
            examples:
              Success:
                summary: >-
                  Example of mass convert request with two leads, Deal creation,
                  tag carry-over, and related module transfer.
                value:
                  ids:
                    - '3652397000009850001'
                    - '3652397000009851001'
                  Deals:
                    Deal_Name: test7000
                  carry_over_tags:
                    - id: '3652397000000002179'
                      api_name: Contacts
                    - id: '3652397000000002180'
                      api_name: Accounts
                    - id: '3652397000000002172'
                      api_name: Deals
                  related_modules:
                    - api_name: Tasks
                      id: '3652397000000002193'
                    - api_name: Events
                      id: '3652397000000002195'
                    - api_name: Calls
                      id: '3652397000000002197'
                  assign_to:
                    id: '3652397000000281001'
                  move_attachments_to:
                    api_name: Contacts
                    id: '3652397000000002179'
                description: >-
                  Shows a mass convert request with two lead IDs, a Deal
                  template, tag carry-over for three modules, related module
                  transfer for Tasks, Events, and Calls, and attachment movement
                  to Contacts.
      responses:
        '202':
          description: >-
            Returns confirmation that the mass convert job has been scheduled,
            along with a job identifier for status tracking.
          content:
            application/json:
              schema:
                x-zs-$id: MassConvert202Response
                type: object
                description: >-
                  Represents the response returned when the mass convert job is
                  successfully scheduled.
                additionalProperties: false
                properties:
                  code:
                    type: string
                    description: >
                      Represents the response code indicating the job has been
                      scheduled.

                      Possible values:

                      **SCHEDULED** - The mass convert job has been accepted and
                      scheduled for execution.
                    enum:
                      - SCHEDULED
                    maxLength: 50
                  message:
                    type: string
                    description: >-
                      Represents the message describing the outcome of the mass
                      convert job scheduling. 
                    maxLength: 512
                  status:
                    type: string
                    description: >
                      Represents the status category of the response.

                      Possible values:

                      *success** - The mass convert job was scheduled
                      successfully.
                    enum:
                      - success
                    maxLength: 50
                  details:
                    type: object
                    description: >-
                      Represents additional details about the scheduled mass
                      convert job, including the job identifier. 
                    additionalProperties: false
                    properties:
                      job_id:
                        type: string
                        description: >-
                          Represents the unique identifier of the scheduled mass
                          convert job, returned for use in subsequent job status
                          requests.
                        maxLength: 255
                    required:
                      - job_id
                required:
                  - code
                  - message
                  - status
                  - details
              examples:
                Success:
                  summary: >-
                    Example of a successful mass convert job scheduling
                    response.
                  value:
                    code: SCHEDULED
                    message: Mass Convert scheduled successfully
                    status: success
                    details:
                      job_id: '1234567890'
                  description: >-
                    Shows the response when a mass convert job is successfully
                    scheduled, including the job identifier.
        '400':
          description: >
            The request failed validation due to missing required fields,
            invalid data, or exceeded limits.

            **Resolution:** The request body must include the required fields
            with valid values and must not exceed the documented limits.
          content:
            application/json:
              schema:
                x-zs-$id: MassConvertErrorResponse
                oneOf:
                  - type: object
                    x-zs-$id: MassConvert400ErrorResponse
                    description: >-
                      Represents a validation error response returned when the
                      mass convert request fails due to invalid or missing data.
                    additionalProperties: false
                    properties:
                      code:
                        type: string
                        description: >
                          Represents the error code identifying the type of
                          validation failure.

                          Possible values:

                          **INVALID_REQUEST_METHOD** - The HTTP method used is
                          not allowed for this endpoint.

                          **INVALID_DATA** - The provided data is invalid.

                          **REQUIRED_PARAM_MISSING** - A required parameter is
                          missing.

                          **NOT_ALLOWED** - The requested operation is not
                          permitted.

                          **MANDATORY_NOT_FOUND** - A mandatory field is missing
                          from the request.

                          **LIMIT_EXCEEDED** - The request exceeds the allowed
                          limit.

                          **EXPECTED_FIELD_MISSING** - An expected field is
                          absent from the request.

                          **AMBIGUITY_DURING_PROCESSING** - The request contains
                          conflicting or ambiguous data.
                        enum:
                          - INVALID_REQUEST_METHOD
                          - INVALID_DATA
                          - REQUIRED_PARAM_MISSING
                          - NOT_ALLOWED
                          - MANDATORY_NOT_FOUND
                          - LIMIT_EXCEEDED
                          - EXPECTED_FIELD_MISSING
                          - AMBIGUITY_DURING_PROCESSING
                        maxLength: 100
                      message:
                        type: string
                        description: >-
                          Represents the error message describing the validation
                          failure. 
                        maxLength: 512
                      status:
                        type: string
                        description: >
                          Represents the status category of the response.

                          Possible values:

                          **error** - The request encountered a validation
                          error.
                        enum:
                          - error
                        maxLength: 50
                      details:
                        type: object
                        description: >-
                          Represents additional details about the validation
                          error, such as field names, JSON paths, expected data
                          types, and limit values. 
                        additionalProperties: true
                    required:
                      - code
                      - message
                      - status
                      - details
                description: >-
                  Represents the possible validation error responses for the
                  mass convert operation.
              examples:
                InvalidDataBoolean:
                  summary: >-
                    Example of invalid apply_assignment_threshold value in the
                    request.
                  value:
                    code: INVALID_DATA
                    message: invalid data
                    status: error
                    details:
                      api_name: apply_assignment_threshold
                      json_path: $.apply_assignment_threshold
                  description: >-
                    Shows the error response when a non-Boolean value is
                    provided for the apply_assignment_threshold field.
                MandatoryIdsMissing:
                  summary: Example of missing mandatory ids field in the request body.
                  value:
                    code: MANDATORY_NOT_FOUND
                    message: required field not found
                    status: error
                    details:
                      api_name: ids
                      json_path: $.ids
                  description: >-
                    Shows the error response when the mandatory Ids field is
                    absent from the request body.
                MandatoryDealFieldMissing:
                  summary: >-
                    Example of missing mandatory Deal_Name field in the Deals
                    object.
                  value:
                    code: MANDATORY_NOT_FOUND
                    message: required field missing
                    status: error
                    details:
                      api_name: Deal_Name
                      json_path: $.Deals.Deal_Name
                  description: >-
                    Shows the error response when the mandatory Deal_Name field
                    is missing from the Deals object.
                InvalidAssigneeData:
                  summary: Example of mismatched or invalid assign_to user data.
                  value:
                    code: INVALID_DATA
                    message: Given assignee param does not match
                    status: error
                    details:
                      api_name: id
                      json_path: $.assignee.id
                  description: >-
                    Shows the error response when the assign_to user data does
                    not match any valid user.
                InvalidPortalUserType:
                  summary: Example of invalid portal_user_type ID in the request.
                  value:
                    code: INVALID_DATA
                    message: invalid data
                    status: error
                    details:
                      api_name: id
                      json_path: $.portal_user_type.id
                  description: >-
                    Shows the error response when the portal_user_type ID is
                    invalid or does not correspond to a valid portal user type.
                InvalidRecordIds:
                  summary: Example of invalid lead record ID in the ids array.
                  value:
                    code: INVALID_DATA
                    message: invalid data
                    status: error
                    details:
                      api_name: ids
                      json_path: $.ids[0]
                  description: >-
                    Shows the error response when one or more values in the ids
                    array are not valid lead record IDs.
                AmbiguityDuringProcessing:
                  summary: >-
                    Example of conflicting api_name and ID in a related_modules
                    entry.
                  value:
                    code: AMBIGUITY_DURING_PROCESSING
                    message: two modules are different
                    status: error
                    details:
                      ambiguity_due_to:
                        - api_name: id
                          json_path: $.related_modules[0].id
                        - api_name: api_name
                          json_path: $.related_modules[0].api_name
                  description: >-
                    Shows the error response when the api_name and ID in a
                    related_modules entry refer to different modules.
                LimitExceeded:
                  summary: >-
                    Example of ids array exceeds the maximum limit of 50
                    entries.
                  value:
                    code: LIMIT_EXCEEDED
                    message: Limit exceeded for mass convert
                    status: error
                    details:
                      limit: 50
                      limit_due_to:
                        - api_name: ids
                          json_path: $.ids
                  description: >-
                    Shows the error response when the ids array exceeds the
                    maximum limit of 50 lead record IDs per request.
                ExpectedFieldMissing:
                  summary: >-
                    Example of missing expected field in a related_modules
                    entry.
                  value:
                    code: EXPECTED_FIELD_MISSING
                    message: Specify Atleast one field
                    status: error
                    details:
                      expected_fields:
                        - api_name: id
                          json_path: $.related_modules[0].id
                        - api_name: api_name
                          json_path: $.related_modules[0].api_name
                  description: >-
                    Shows the error response when the related_modules entry is
                    missing one or more expected fields.
                InvalidDataType:
                  summary: Example of non-integer value in the ids array.
                  value:
                    code: INVALID_DATA
                    message: invalid data
                    status: error
                    details:
                      expected_data_type: long
                      api_name: ids
                      json_path: $.ids[0]
                  description: >-
                    Shows the error response when an ids entry contains a value
                    that is not a valid Long integer.
                NonSubordinateUser:
                  summary: >-
                    Example of non-subordinate user specified in the assign_to
                    field.
                  value:
                    code: INVALID_DATA
                    details:
                      api_name: assign_to
                      json_path: $.assign_to.id
                    message: Non Subordinate User Found
                    status: error
                  description: >-
                    Shows the error response when the user specified in
                    assign_to is not a subordinate of the requesting user.
        '403':
          description: >
            Permission denied to perform the mass conversion.

            **Resolution:** The CRM administrator must grant the required
            permission to the user's profile.
          content:
            application/json:
              schema:
                type: object
                x-zs-$id: MassConvertNoPermissionResponse
                description: >-
                  Represents a permission error response returned when the
                  requesting user lacks permission to perform the mass
                  conversion.
                additionalProperties: false
                properties:
                  code:
                    type: string
                    description: >
                      Represents the error code indicating a permission failure.

                      Possible values:

                      **NO_PERMISSION** - The user does not have permission to
                      perform this action.
                    enum:
                      - NO_PERMISSION
                    maxLength: 100
                  message:
                    type: string
                    description: >-
                      Represents the error message describing the permission
                      failure. 
                    maxLength: 512
                  status:
                    type: string
                    description: >
                      Represents the status category of the response.

                      Possible values:

                      **error** - The request was denied due to insufficient
                      permissions.
                    enum:
                      - error
                    maxLength: 50
                  details:
                    type: object
                    description: 'Represents additional details about the permission error. '
                    additionalProperties: true
                required:
                  - code
                  - message
                  - status
                  - details
              examples:
                Failure:
                  summary: >-
                    Example of forbidden response when the user lacks mass
                    conversion permission.
                  value:
                    code: NO_PERMISSION
                    message: permission denied
                    details:
                      permissions:
                        - Crm_Implied_Mass_Convert_Leads
                    status: error
                  description: >-
                    Shows the error response when the requesting user lacks the
                    mass conversion permission.
        '500':
          description: >
            The server encountered an unexpected error while processing the mass
            convert request.

            **Resolution:** The request can be retried. If the error persists,
            the issue must be investigated on the server side.
          content:
            application/json:
              schema:
                type: object
                x-zs-$id: MassConvert500Response
                description: >-
                  Represents a server error response returned when an unexpected
                  error occurs during the mass convert operation.
                additionalProperties: false
                properties:
                  code:
                    type: string
                    description: >
                      Represents the error code indicating a server-side
                      failure.

                      Possible values:

                      **INTERNAL_ERROR** - The server encountered an unexpected
                      error.
                    enum:
                      - INTERNAL_ERROR
                    maxLength: 100
                  message:
                    type: string
                    description: >-
                      Represents the error message describing the server
                      failure. 
                    maxLength: 512
                  status:
                    type: string
                    description: |
                      Represents the status category of the response.
                      Possible values:
                      **error** - The request failed due to a server error.
                    enum:
                      - error
                    maxLength: 50
                  details:
                    type: object
                    description: >-
                      Represents additional details about the server error, if
                      available. 
                    additionalProperties: true
                required:
                  - code
                  - message
                  - status
                  - details
              examples:
                Failure:
                  summary: >-
                    Example of internal server error during mass convert
                    request.
                  value:
                    code: INTERNAL_ERROR
                    message: Internal Server Error
                    details: {}
                    status: error
                  description: >-
                    Shows the error response when the server encounters an
                    unexpected internal error while processing the mass convert
                    request.
      security:
        - OAuth2:
            - ZohoCRM.mass_convert.leads.CREATE
    get:
      operationId: getMassConvertJobStatus
      summary: Get mass convert job status
      description: >-
        To retrieve the current status and conversion counts of a previously
        scheduled mass convert job in your Zoho CRM organization.
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: >-
            Returns the current status and conversion counts for the specified
            mass convert job.
          content:
            application/json:
              schema:
                x-zs-$id: MassConvert200Response
                type: object
                description: >-
                  Represents the successful response for a mass convert job
                  status request, containing a data array of job status entries.
                additionalProperties: false
                properties:
                  data:
                    type: array
                    description: >-
                      Represents the list of job status objects for the
                      scheduled mass convert job. 
                    items:
                      type: object
                      description: >-
                        Represents a single job status entry containing
                        conversion counts and the current processing status of
                        the mass convert job.
                      additionalProperties: false
                      properties:
                        Status:
                          type: string
                          description: >
                            Indicates the current processing status of the mass
                            convert job.

                            Possible values:

                            **completed** - The job finished processing all
                            scheduled leads.

                            **scheduled** - The job is queued for execution.

                            **in progress** - The job is currently running.

                            **failed** - The job did not complete.
                          maxLength: 50
                        Total_Count:
                          type: integer
                          format: int32
                          description: >-
                            Represents the total number of leads scheduled for
                            conversion in the job. 
                        Converted_Count:
                          type: integer
                          format: int32
                          description: >-
                            Represents the number of leads that were
                            successfully converted in the job. 
                        Not_Converted_Count:
                          type: integer
                          format: int32
                          description: >-
                            Represents the number of leads that have not yet
                            been converted. 
                        Failed_Count:
                          type: integer
                          format: int32
                          description: >-
                            Represents the number of leads for which conversion
                            failed. 
                      required:
                        - Status
                        - Total_Count
                        - Converted_Count
                        - Not_Converted_Count
                        - Failed_Count
                    maxItems: 5
                required:
                  - data
              examples:
                Success:
                  summary: >-
                    Example of completed mass convert job with all leads
                    converted.
                  value:
                    data:
                      - Status: Completed
                        Total_Count: 50
                        Converted_Count: 50
                        Not_Converted_Count: 0
                        Failed_Count: 0
                  description: >-
                    Shows the job status response for a successfully completed
                    mass convert job where all scheduled leads were converted.
                CompletedStatus:
                  summary: >-
                    Example of completed mass convert job with partial
                    conversion failures.
                  value:
                    data:
                      - Total_Count: 40
                        Converted_Count: 45
                        Not_Converted_Count: 0
                        Failed_Count: 5
                        Status: completed
                  description: >-
                    Shows the job status response for a completed mass convert
                    job where some leads failed conversion.
                FailedStatus:
                  summary: Example of failed mass convert job with no leads converted.
                  value:
                    data:
                      - Total_Count: 50
                        Converted_Count: 0
                        Not_Converted_Count: 0
                        Failed_Count: 50
                        Status: failed
                  description: >-
                    Shows the job status response for a mass convert job that
                    encountered a complete failure, with no leads converted.
                InProgressStatus:
                  summary: >-
                    Example of mass convert job currently in progress with
                    partial conversions.
                  value:
                    data:
                      - Total_Count: 50
                        Converted_Count: 25
                        Not_Converted_Count: 20
                        Failed_Count: 5
                        Status: in progress
                  description: >-
                    Shows the job status response for a mass convert job
                    currently in progress, with conversion partially complete.
                ScheduledStatus:
                  summary: Example of scheduled mass convert job awaiting execution.
                  value:
                    data:
                      - Status: scheduled
                        Failed_Count: 0
                        Converted_Count: 0
                        Not_Converted_Count: 50
                        Total_Count: 50
                  description: >-
                    Shows the job status response for a mass convert job that is
                    scheduled and awaiting execution.
        '400':
          description: >
            The request is invalid due to a missing or invalid **job_id**
            parameter.

