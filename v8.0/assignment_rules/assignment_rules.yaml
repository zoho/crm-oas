openapi: 3.1.0
info:
  title: Assignment Rules
  description: >-
    Assignment rules are automation configurations that assign CRM records to
    users based on matching criteria. This API enables developers to create,
    retrieve, update, delete, clone, reorder, and inspect Assignment Rule
    configurations.
  version: '8'
servers:
  - url: https://zohoapis.{dc}/crm/{version}
    description: >-
      Production API server for Zoho CRM Assignment Rule operations. Sample
      request URL: `https://zohoapis.{dc}/crm/{version}`.
    variables:
      dc:
        description: >-
          The regional API domain for the Zoho CRM data center. Possible values:
          **eu**, **com**, **au**, **in**, **jp**, **cn**, **ca**. Default:
          **com**.
        default: com
        enum:
          - eu
          - com
          - au
          - in
          - jp
          - cn
          - ca
      version:
        description: >-
          Determines the Zoho CRM API version used for Assignment Rule requests.
          Default: **v8**.
        default: v8
paths:
  /settings/automation/assignment_rules:
    get:
      summary: Assignment Rules
      description: >-
        To retrieve all Assignment Rules configured in your Zoho CRM
        organization.
      operationId: getAssignmentRules
      security:
        - OAuth2:
            - ZohoCRM.settings.assignment_rules.READ
      parameters:
        - $ref: '#/components/parameters/ParamQueryModuleSchema'
        - $ref: '#/components/parameters/ParamQueryIncludeInnerDetails'
      responses:
        '200':
          description: >-
            Returns the Assignment Rule response details for the completed
            operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllAssignmentRulesSuccessResponse'
              examples:
                Success200:
                  summary: Successful Assignment Rule operation
                  value:
                    assignment_rules:
                      - api_name: OrderAssignment
                        module:
                          api_name: Orders
                          id: '5264350000312423443'
                          name: Orders
                        name: Order owner assignment rule
                        id: '5264350000141324328'
                        description: Assignment rule to assign owners for order records
                        created_by:
                          id: '5264350000141324329'
                          name: Nivedha
                        created_time: '2025-01-23T00:00:00+05:30'
                        modified_by:
                          id: '5264350000141111111'
                          name: Ravivarma
                        modified_time: '2025-01-01T16:43:11+05:30'
                        default_assignee:
                          id: '5264350000141111111'
                          name: Ravivarma
                          type: user
                          resource:
                            id: '5264350000141111111'
                            name: Ravivarma
                      - api_name: OrderAssignment
