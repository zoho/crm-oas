    SimpleFilterCriterionValueDateTimePredefined:
      type: string
      x-zs-$id: SimpleFilterCriterionValueDateTimePredefined
      description: >-
        Represents a predefined placeholder value applicable only when the
        field's data_type is date or datetime, with the equal comparator.
      enum:
        - ${TODAY}
        - ${TOMORROW}
        - ${TOMORROWPLUS}
        - ${YESTERDAY}
        - ${YESTERDAYMINUS}
        - ${LASTMONTH}
        - ${THISMONTH}
        - ${NEXTMONTH}
        - ${LASTWEEK}
        - ${THISWEEK}
        - ${NEXTWEEK}
        - ${THISYEAR}
        - ${THISFY}
        - ${THISFQ}
        - ${LASTYEAR}
        - ${PREVFY}
        - ${PREVFQ}
        - ${NEXTYEAR}
        - ${NEXTFY}
        - ${NEXTFQ}
        - ${EMPTY}
        - ${NOTEMPTY}
      x-enumDescriptions:
        ${TODAY}: >-
          Matches records where the date field falls on the current calendar
          day.
        ${TOMORROW}: Matches records where the date field falls on the next calendar day.
        ${TOMORROWPLUS}: >-
          Matches records where the date field is on tomorrow or any later date
          (tomorrow onwards).
        ${YESTERDAY}: >-
          Matches records where the date field falls on the previous calendar
          day.
        ${YESTERDAYMINUS}: >-
          Matches records where the date field is on yesterday or any earlier
          date (up to and including yesterday).
        ${LASTMONTH}: >-
          Matches records where the date field falls within the entire previous
          calendar month.
        ${THISMONTH}: >-
          Matches records where the date field falls within the current calendar
          month.
        ${NEXTMONTH}: >-
          Matches records where the date field falls within the next calendar
          month.
        ${LASTWEEK}: >-
          Matches records where the date field falls within the previous
          calendar week (Monday–Sunday).
        ${THISWEEK}: >-
          Matches records where the date field falls within the current calendar
          week.
        ${NEXTWEEK}: >-
          Matches records where the date field falls within the next calendar
          week.
        ${THISYEAR}: >-
          Matches records where the date field falls within the current calendar
          year.
        ${THISFY}: >-
          Matches records where the date field falls within the current fiscal
          year.
        ${THISFQ}: >-
          Matches records where the date field falls within the current fiscal
          quarter.
        ${LASTYEAR}: >-
          Matches records where the date field falls within the previous
          calendar year.
        ${PREVFY}: >-
          Matches records where the date field falls within the previous fiscal
          year.
        ${PREVFQ}: >-
          Matches records where the date field falls within the previous fiscal
          quarter.
        ${NEXTYEAR}: >-
          Matches records where the date field falls within the next calendar
          year.
        ${NEXTFY}: >-
          Matches records where the date field falls within the next fiscal
          year.
        ${NEXTFQ}: >-
          Matches records where the date field falls within the next fiscal
          quarter.
        ${EMPTY}: Matches records where the date field has no value set.
        ${NOTEMPTY}: Matches records where the date field has a value set.
    SimpleFilterCriterionValueNDaysPredefined:
      maxLength: 255
      type: string
      x-zs-$id: SimpleFilterCriterionValueNDaysPredefined
      description: >-
