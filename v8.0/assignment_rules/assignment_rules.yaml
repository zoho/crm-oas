            token must include the required scope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseNoPermissionToAccessAPI'
    post:
      summary: Create an Assignment Rule
      description: To create a single Assignment Rule in your Zoho CRM organization.
      x-zs-llm-description: To create an assignment rule
      operationId: postAssignmentRules
      security:
        - OAuth2:
            - ZohoCRM.settings.assignment_rules.CREATE
      parameters:
        - $ref: '#/components/parameters/ParamQueryModuleRequiredSchema'
      requestBody:
        description: >-
          The request body must contain an **assignment_rules** array with one
          object. Specify the Assignment Rule details, rule entries, and default
          assignee configuration.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestBodySchemaForCreate'
            examples:
              SamplePostRequest:
                summary: Sample request body
                value:
                  assignment_rules:
                    - api_name: Lead_Assignment_Rule_US
                      name: Lead owner assignment rule - US
                      description: Rule to assign owners for US leads
                      default_assignee:
                        type: user
                        resource:
                          id: '32425678'
                      rule_entries:
                        - criteria:
                            field:
                              api_name: Annual_Revenue
                            comparator: equal
                            value: '123'
                          assign_to:
                            type: users
                            resources:
                              - id: '526435000000670072'
                              - id: '526435000000227013'
                          user_availability_based_on:
                            - online_status
                            - shift_timing
                          followup_actions:
                            - type: tasks
                              resources:
                                - id: '526435000014344004'
                description: >-
                  Shows an Assignment Rule request payload with the fields
                  required for this operation.
            x-zs-llm-examples:
              - SamplePostRequest
