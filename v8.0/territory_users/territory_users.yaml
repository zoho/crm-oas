                  summary: Example For Territory Not yet Enabled
                  value:
                    code: TERRITORY_NOT_ENABLED
                    details: {}
                    message: the territory feature is not enabled
                    status: error
                TerritoryDisabled:
                  summary: Example For Territory Diabled Error
                  value:
                    code: TERRITORY_DISABLED
                    details: {}
                    message: the territory feature is disabled
                    status: error
        '500':
          description: >-
            An internal server error occurred while processing the request.
            **Resolution:** Retry the request after some time. If the error
            persists, contact Zoho CRM support.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/TerritoryInternalServerErrorSchema'
                    description: Internal server error.
                description: >-
                  Represents the error response body returned when an internal
                  server error occurs.
                x-zs-$id: GetUsersInternalservererror
              examples:
                AutoGeneratedExample:
                  summary: Auto-generated example to satisfy zest rule
                  value:
                    code: INTERNAL_SERVER_ERROR
                    details: {}
                    message: Internal Server Error
                    status: error
    put:
      operationId: associateUsersToTerritory
      description: >-
        To associate one or more users with a territory in your Zoho CRM
        organization.
      summary: Territory Users
      security:
        - OAuth2:
            - ZohoCRM.users.ALL
            - ZohoCRM.settings.territories.ALL
      parameters:
        - name: territory
          in: path
          required: true
          schema:
            type: string
            maxLength: 100
            description: >-
              Specify the unique ID of the territory for which you want to add
              users. Use the [Get Territories
              API](territories.yaml#$.paths./settings/territories.get) to
              retrieve the territory ID.
          description: >-
            Specify the unique ID of the territory for which you want to add
            users.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                users:
                  type: array
                  maxItems: 100
                  items:
                    type: object
                    additionalProperties: false
                    properties:
                      id:
                        type: string
                        maxLength: 100
                        description: >-
                          Specify the unique ID of the user to associate with
                          the territory.
                        x-zs-$ref:
                          resource: users
                          origins:
                            - operationId: getUsers
                              propertyId: UserId
                    required:
                      - id
                    description: Represents a user to associate with the territory.
                  description: Specify the list of users to associate with the territory.
              required:
                - users
              description: >-
                Represents the request body for associating users with a
                territory.
            examples:
              UserAssociationViaRequestBody:
                summary: Example request body to associate users to a territory
                value:
                  users:
                    - id: '111111000000042726'
        description: >-
          The request body must contain a **users** array. You can include a
          maximum of 100 objects per request.
      responses:
        '200':
          description: Returns the result of the user-territory association.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  users:
                    type: array
                    maxItems: 100
                    items:
                      type: object
                      additionalProperties: false
                      properties:
                        code:
                          type: string
                          enum:
                            - SUCCESS
                          description: >-
                            Represents the status code of the association
                            operation for the user.
                        details:
                          type: object
                          additionalProperties: false
                          properties:
                            id:
                              type: string
                              maxLength: 100
                              description: Represents the unique ID of the user.
                          required:
                            - id
                          description: >-
                            Represents additional details about the association
                            operation.
                        message:
                          type: string
                          maxLength: 250
                          description: >-
                            Represents the status message of the association
                            operation.
                        status:
                          type: string
                          enum:
                            - success
                          description: >-
                            Represents the status of the association operation
                            for the user.
                      required:
                        - code
                        - details
                        - message
                        - status
                      description: >-
                        Represents the result of a user-territory association
                        operation.
                    description: Represents the list of user-territory association results.
                required:
                  - users
                description: >-
                  Represents the success response body returned after
                  associating users with the territory.
                x-zs-$id: UpdateUsersSuccess
              examples:
                SuccessExample:
                  summary: Example success response for adding user to Territory
                  value:
                    users:
                      - code: SUCCESS
                        details:
                          id: '111111000000044193'
                        message: >-
                          Given User added to the mentioned territory
                          Successfully
                        status: success
        '400':
          description: >-
            Returns an error when the request body contains invalid user IDs or
            duplicate entries. **Resolution:** Verify the user IDs provided and
            ensure they are valid and unique.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/UserInvalidErrorSchemaOnRequestBody'
                    description: >-
                      Represents the invalid-request error schema returned when
                      the users array in the request body fails validation.
                  - type: object
                    additionalProperties: false
                    description: >-
                      Represents the limit exceeded error schema for the 400 Bad
                      Request response.
                    properties:
                      users:
                        type: array
                        maxItems: 100
                        items:
                          oneOf:
                            - $ref: >-
                                #/components/schemas/TerritoryUsersLimitExceededErrorSchema
                              description: >-
                                Represents the limit exceeded error schema
                                returned when the territory user limit is
                                reached.
                        description: >-
                          Represents the list of users whose association
                          exceeded the territory limit.
                    x-zs-$id: UsersUsersObject
                description: >-
                  Represents the error response body returned when the request
                  data is invalid.
                x-zs-$id: UpdateUsersBadrequest
              examples:
                DuplicateUserAddition:
                  summary: Example error response for adding existing user to Territory
                  value:
                    users:
                      - code: DUPLICATE_DATA
                        message: Given user id already exists for that record
                        status: error
                        details:
                          api_name: id
                          json_path: $.users[0].id
                LimitExceeded:
                  summary: Example error response for Limit Exceeded
                  value:
                    users:
                      - code: LIMIT_EXCEEDED
                        message: Maximum Users Limit reached for a territory
                        details:
                          limit: 100
                        status: error
                InvalidUserAddition:
                  summary: Invalid User Addition
                  value:
                    users:
                      - code: INVALID_DATA
                        details:
                          api_name: id
                          json_path: $.users[0].id
                          owner_status: deleted
                        message: The user to whom you are trying to update is deleted.
                        status: error
        '403':
          description: >-
            Returns an error when the territory feature is not yet enabled, is
            disabled, or access is denied. **Resolution:** Ensure the
            Territories feature is active and that your OAuth token includes the
            required scopes.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/TerritoryErrorPermissionDenied'
                    description: Territory Not yet Enabled.
                description: >-
                  Represents the error response body returned when access is
                  denied or the territory feature is not enabled.
                x-zs-$id: UpdateUsersForbidden
              examples:
                TerritoryNotYetEnabled:
                  summary: Example For Territory Not yet Enabled
                  value:
                    code: TERRITORY_NOT_ENABLED
                    details: {}
                    message: the territory feature is not enabled
                    status: error
                TerritoryDisabled:
                  summary: Example For Territory Diabled Error
                  value:
                    code: TERRITORY_DISABLED
                    details: {}
                    message: the territory feature is disabled
                    status: error
        '500':
          description: >-
            An internal server error occurred while processing the request.
            **Resolution:** Retry the request after some time. If the error
            persists, contact Zoho CRM support.
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      code:
                        type: string
                        enum:
                          - INTERNAL_SERVER_ERROR
                        description: >-
                          Represents the error code for the internal server
                          error.
                      details:
                        type: object
                        description: >-
                          Represents additional details about the internal
                          server error.
                        additionalProperties: false
                      message:
                        type: string
                        description: >-
                          Represents the error message describing the internal
                          server error.
                        maxLength: 100
                      status:
                        type: string
                        enum:
                          - error
                        description: >-
                          Represents the status of the internal server error
                          response.
                    required:
                      - code
                      - details
                      - message
                      - status
                    description: >-
                      Represents the TerritoryInternalServerErrorSchema for the
                      500 Internal Server Error response.
                    additionalProperties: false
                    x-zs-$id: UsersInternalservererrorObject
                description: >-
                  Represents the error response body returned when an internal
                  server error occurs.
                x-zs-$id: UpdateUsersInternalservererror
              examples:
                InternalServerError:
                  summary: Internal Server Error
                  value:
                    code: INTERNAL_SERVER_ERROR
                    details: {}
                    message: ''
                    status: error
