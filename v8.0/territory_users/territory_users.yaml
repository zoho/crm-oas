    UserInvalidErrorSchemaOnRequestBody:
      title: Territory Error Response
      description: >-
        Represents the error response when one or more users in the request body
        fail validation during a territory user operation.
      type: object
      additionalProperties: false
      properties:
        users:
          type: array
          description: >-
            Represents the list of user entries, each containing the result
