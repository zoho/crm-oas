components:
  parameters:
    Territory:
      name: territory
      in: path
      required: true
      schema:
        type: string
        maxLength: 100
        description: >-
          Territory Id Param in URL. Use the [Get Territories
          API](territories.yaml#$.paths./settings/territories.get) to retrieve
          the territory ID.
      description: Specify the unique ID of the territory.
    User:
      name: user
      in: path
      required: true
      schema:
        type: string
        maxLength: 100
        description: >-
          Represents the unique ID of the user as a string, with a maximum
          length of 100 characters. Use the [Users
          API](users.yaml#$.paths./users/bulk.get) to retrieve the user ID.
      description: Specify the unique ID of the user.
    Ids:
      name: ids
      in: query
      required: true
      schema:
        type: string
        maxLength: 500
        description: >-
          Represents a comma-separated list of user IDs as a string, with a
          maximum length of 500 characters.
      description: >-
        Specify the unique IDs of the users to disassociate from the territory
        as a comma-separated list.
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://accounts.zoho.com/oauth/v2/auth
          tokenUrl: https://accounts.zoho.com/oauth/v2/token
          refreshUrl: https://accounts.zoho.com/oauth/v2/token
          scopes:
            ZohoCRM.users.ALL: Full access to user resources (read/write) within Zoho CRM
            ZohoCRM.settings.territories.ALL: Full access to territories settings (read/write) within Zoho CRM
            ZohoCRM.users.READ: Read-only access to user resources within Zoho CRM
            ZohoCRM.settings.territories.READ: Read-only access to territories settings within Zoho CRM
            ZohoCRM.users.UPDATE: Update access to user resources within Zoho CRM
            ZohoCRM.settings.territories.UPDATE: Update access to territories settings within Zoho CRM
            ZohoCRM.users.DELETE: Delete access to user resources within Zoho CRM
            ZohoCRM.settings.territories.DELETE: Delete access to territories settings within Zoho CRM
      description: >-
        Represents the OAuth 2.0 security scheme used to authorize Zoho CRM API
        requests.
  schemas:
    User:
      type: object
      additionalProperties: false
      description: >-
        Represents a user record in Zoho CRM, including personal details, role,
        profile, and related information.
      properties:
        id:
          type: string
          maxLength: 100
          description: Represents the unique identifier of the user.
        first_name:
          type: string
          maxLength: 50
          description: Represents the user's first name.
        last_name:
          type:
            - string
            - 'null'
          maxLength: 50
          description: Represents the user's last name.
        full_name:
          type: string
          maxLength: 200
          description: Represents the user's full name.
        country:
          type:
            - string
            - 'null'
          maxLength: 100
          description: Represents the user's country.
        state:
          type:
            - string
            - 'null'
          maxLength: 100
          description: Represents the user's state or province.
        city:
          type:
            - string
            - 'null'
          maxLength: 100
          description: Represents the user's city.
        zip:
          type:
            - string
            - 'null'
          maxLength: 30
          description: Represents the user's postal or zip code.
        fax:
          type:
            - string
            - 'null'
          maxLength: 30
          description: Represents the user's fax number.
        street:
          type:
            - string
            - 'null'
          maxLength: 250
          description: Represents the user's street address.
        status:
          type: string
          enum:
            - inactive
            - deleted
            - rejected
            - active
            - closed
            - disabled
          description: Represents the user's account status.
        category:
          type: string
          enum:
            - regular_user
            - sandbox_user
            - light_user
          description: Represents the user's category or type.
        profile:
          type: object
          additionalProperties: false
          properties:
            id:
              type: string
              maxLength: 100
              description: Represents the unique ID of the user's profile.
            name:
              type: string
              maxLength: 100
              description: Represents the name of the user's profile.
          required:
            - id
            - name
          description: Represents the user's profile.
        role:
          type: object
          additionalProperties: false
          properties:
            id:
              type: string
              maxLength: 100
              description: Represents the unique ID of the user's role.
            name:
              type: string
              maxLength: 100
              description: Represents the name of the user's role.
          required:
            - id
            - name
          description: Represents the user's role.
        created_by:
          type: object
          additionalProperties: false
          properties:
            id:
              type: string
              maxLength: 100
              description: Represents the unique ID of the creator.
            name:
              type: string
              maxLength: 200
              description: Represents the full name of the creator.
          required:
            - id
            - name
          description: Represents the user who created this user record.
        created_time:
          type: string
          format: date-time
          description: Represents the date and time when the user account was created.
        Modified_By:
          type: object
          additionalProperties: false
          properties:
            id:
              type: string
              maxLength: 100
              description: Represents the unique ID of the modifier.
            name:
              type: string
              maxLength: 200
              description: Represents the full name of the modifier.
          required:
            - id
            - name
          description: Represents the user who last modified this user record.
        Modified_Time:
          type: string
          format: date-time
          description: >-
            Represents the date and time when the user account was last
            modified.
        language:
          type: string
          maxLength: 50
          description: Represents the user's preferred language.
        locale:
          type: string
          maxLength: 50
          description: Represents the user's locale.
        time_zone:
          type: string
          maxLength: 50
          description: Represents the user's time zone.
        time_format:
          type: string
          enum:
            - HH:mm
            - hh:mm a
          description: Represents the user's preferred time format.
        date_format:
          type: string
          maxLength: 50
          description: Represents the user's preferred date format.
        decimal_separator:
          type: string
          enum:
            - Comma
            - Period
          description: Represents the user's preferred decimal separator.
        number_separator:
          type: string
          maxLength: 10
          description: Represents the user's preferred number separator.
        country_locale:
          type: string
          maxLength: 50
          description: Represents the user's country locale.
        microsoft:
          type: boolean
          description: Indicates whether the user has Microsoft integration enabled.
        sandboxDeveloper:
          type: boolean
          description: Indicates whether the user is a sandbox developer.
        personal_account:
          type: boolean
          description: Indicates whether this is a personal account.
        Isonline:
          type: boolean
          description: Indicates whether the user is currently online.
        confirm:
          type: boolean
          description: Indicates whether the user has confirmed their account.
        offset:
          type: integer
          format: int32
          description: Represents the time zone offset in milliseconds.
        zuid:
          type: string
          maxLength: 100
          description: Represents the Zoho user ID.
        alias:
          type:
            - string
            - 'null'
          maxLength: 50
          description: Represents the user's alias.
        dob:
          type:
            - string
            - 'null'
          format: date
          description: Represents the user's date of birth.
        website:
          type:
            - string
            - 'null'
          pattern: '[a-z0-9]{5}[.]com'
          maxLength: 250
          description: Represents the user's website URL.
        signature:
          type:
            - string
            - 'null'
          maxLength: 200
          description: Represents the user's email signature.
        name_format__s:
          type: string
          enum:
            - First Name,Last Name,Salutation
            - Salutation,First Name,Last Name
            - First Name,Salutation,Last Name
            - Last Name,Salutation,First Name
            - Salutation,Last Name,First Name
            - Last Name,First Name,Salutation
          description: Represents the user's preferred name format.
        sort_order_preference__s:
          type: string
          maxLength: 50
          description: Represents the user's sort order preference.
        status_reason__s:
          type:
            - string
            - 'null'
          maxLength: 100
          description: Represents the reason for the user's current status.
        default_tab_group:
          type: string
          maxLength: 100
          description: Represents the user's default tab group.
        $shift_effective_from:
          type:
            - object
            - 'null'
          description: Represents the date from which the user's shift becomes effective.
        $current_shift:
          type:
            - object
            - 'null'
          description: Represents the user's current shift assignment.
        $next_shift:
          type:
            - object
            - 'null'
          description: Represents the user's next upcoming shift assignment.
        customize_info:
          type: object
          additionalProperties: false
          properties:
            notes_desc:
              type:
                - object
                - 'null'
              description: Indicates whether the notes description is visible.
            show_right_panel:
              type:
                - boolean
                - 'null'
              description: Indicates whether the right panel is visible.
            show_left_panel:
              type:
                - boolean
                - 'null'
              description: Indicates whether the left panel is visible.
            bc_view:
              type:
                - object
                - 'null'
              description: Represents the business card view preference.
            show_home:
              type: boolean
              description: Indicates whether the home page is visible.
            show_detail_view:
              type: boolean
              description: Indicates whether the detail view is visible.
            unpin_recent_item:
              type:
                - object
                - 'null'
              description: Indicates whether recent items are unpinned.
          description: Represents the user's customization preferences.
        theme:
          type: object
          additionalProperties: false
          properties:
            normal_tab:
              type: object
              additionalProperties: false
              properties:
                font_color:
                  type: string
                  pattern: ^#([A-Fa-f0-9]{6}|[A-Fa-f0-9]{3})$
                  maxLength: 7
                  description: >-
                    Represents the font color of the normal tab in hexadecimal
                    format.
                background:
                  type: string
                  pattern: ^#([A-Fa-f0-9]{6}|[A-Fa-f0-9]{3})$
                  maxLength: 7
                  description: >-
