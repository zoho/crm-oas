              schema:
                oneOf:
                  - $ref: '#/components/schemas/UserInvalidErrorSchemaInURL'
                    description: >-
                      Represents the invalid-request error schema when the
                      territory ID in the URL is invalid.
                description: >-
                  Represents the error response body returned when the request
                  contains invalid parameters.
                x-zs-$id: GetUsersBadrequest
              examples:
                ErrorExample:
                  summary: Invalid ID
                  value:
                    code: INVALID_DATA
                    details:
                      resource_path_index: 2
                    message: the given id given seems to be invalid
                    status: error
        '403':
          description: >-
            Returns an error when the territory feature is not yet enabled, is
            disabled, or access is denied. **Resolution:** Ensure the
            Territories feature is active and that your OAuth token includes the
            required scopes.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/TerritoryErrorPermissionDenied'
                    description: Territory Not yet Enabled.
                description: >-
