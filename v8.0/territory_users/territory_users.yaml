            properties:
              code:
                type: string
                description: >-
                  Represents the error or status code for the user entry.
                  Possible values: **INVALID_DATA**, **DUPLICATE_DATA**,
                  **MANDATORY_NOT_FOUND**, **NOT_ALLOWED**,
                  **DEPENDENT_FIELD_MISSING**.
                enum:
                  - INVALID_DATA
                  - DUPLICATE_DATA
                  - MANDATORY_NOT_FOUND
                  - NOT_ALLOWED
                  - DEPENDENT_FIELD_MISSING
              details:
                type: object
                description: >-
                  Represents additional contextual information about the
                  validation error for the user entry.
                additionalProperties: false
                properties:
                  api_name:
                    format: string
                    type: string
                    description: >-
                      Represents the API field name associated with the
                      validation error.
                    minLength: 1
                  json_path:
                    format: string
                    type: string
                    description: >-
                      Represents the JSON path to the field that caused the
                      validation error.
                    minLength: 1
                  supported_values:
                    type: array
                    items:
                      type: string
                      description: >-
                        Represents a supported value for the field associated
                        with the validation error.
                      maxLength: 100
                    description: >-
                      Represents the list of supported values for the field
                      associated with the validation error.
                    maxItems: 100
                  id:
                    format: string
                    type: string
                    description: >-
                      Represents the unique identifier of the resource related
                      to the validation error.
                  resource_path_index:
                    format: int32
                    type: integer
                    description: >-
                      Represents the index in the resource path where the
                      validation error occurred.
                  dependee:
                    type: object
                    description: >-
                      Represents the dependent field information related to the
                      validation error.
                    additionalProperties: false
                    properties:
                      api_name:
                        format: string
                        type: string
                        description: >-
                          Represents the API field name of the dependent field
                          that caused the validation error.
                      json_path:
                        format: string
                        type: string
                        description: >-
                          Represents the JSON path to the dependent field that
                          caused the validation error.
                        minLength: 1
                      resource_path_index:
                        format: int32
                        type: integer
                        description: >-
                          Represents the index in the resource path where the
                          dependent field is located.
                  owner_status:
                    format: string
                    type: string
                    description: >-
                      Represents the status of the user being added to the
                      territory, indicating why the operation failed.
                required: []
              message:
                format: string
                type: string
                description: >-
                  Represents the detailed error message describing the
                  validation issue for the user entry.
              status:
                type: string
                description: >-
                  Represents the outcome status of the user entry in the
                  response. Possible values: **error**, **success**,
                  **failure**.
                enum:
                  - error
                  - success
                  - failure
            required:
              - code
              - details
              - message
              - status
            description: >-
              Represents the result for one user entry in the request, including
              the outcome code, error details, status, and message.
      required:
        - users
      x-zs-$id: UserInvalidErrorSchemaOnRequestBody
