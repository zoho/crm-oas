openapi: 3.1.0
info:
  title: Territory Users
  description: >-
    Manage the association between users and territories in Zoho CRM. This API
    enables developers to associate, disassociate, and retrieve users for
    specific territories.
  version: '8'
servers:
  - url: https://zohoapis.{dc}/crm/{version}
    description: Represents the Local Zoho Server URL
    variables:
      dc:
        enum:
          - com
          - eu
          - in
          - cn
          - au
        default: com
        description: >-
          The top-level domain for the API server. Possible values: **com**,
          **eu**, **in**, **cn**, **au**.
      version:
        default: v8
        description: Represents the API Version
paths:
  /settings/territories/{territory}/users:
    get:
      operationId: getTerritoryUsers
      description: >-
        To retrieve the list of users associated with a territory in your Zoho
        CRM organization.
      summary: Territory Users
      parameters:
        - name: territory
          description: >-
            Specify the unique ID of the territory for which you want to
            retrieve the list of users. Use the [Get Territories
            API](territories.yaml#$.paths./settings/territories.get) to retrieve
            the territory ID.
          in: path
          required: true
          schema:
            type: string
            maxLength: 100
            description: >-
              Represents the unique ID of the territory as a string, with a
              maximum length of 100 characters.
      security:
        - OAuth2:
            - ZohoCRM.users.READ
            - ZohoCRM.settings.territories.READ
        - OAuth2:
            - ZohoCRM.users.ALL
            - ZohoCRM.settings.territories.ALL
      responses:
        '200':
          description: Returns the list of users associated with the specified territory.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  users:
                    type: array
                    maxItems: 100
                    items:
                      $ref: '#/components/schemas/User'
                      description: >-
                        Represents an individual user record associated with the
                        territory.
                    description: >-
                      Represents the list of users associated with the
                      territory.
                  info:
                    type: object
                    additionalProperties: false
                    properties:
                      per_page:
                        type: integer
                        format: int32
                        description: Represents the number of records per page.
                      count:
                        type: integer
                        format: int32
                        description: Represents the total number of records returned.
                      page:
                        type: integer
                        format: int32
                        description: Represents the current page number.
                      more_records:
                        type: boolean
                        description: >-
                          Indicates whether there are more records available
                          beyond the current page.
                    required:
                      - per_page
                      - count
                      - page
                      - more_records
                    description: Represents the pagination metadata for the response.
                required:
                  - users
                  - info
                description: >-
                  Represents the success response body containing the list of
                  users associated with the territory.
                x-zs-$id: GetUsersSuccess
              examples:
                SuccessExample:
                  value:
                    users:
                      - country: IN
                        name_format__s: Salutation,First Name,Last Name
                        language: en_US
                        microsoft: false
                        $shift_effective_from: null
                        id: '431581000000258001'
                        state: Karnataka
                        fax: null
                        country_locale: en_US
                        sandboxDeveloper: false
                        zip: null
                        decimal_separator: Period
                        created_time: '2023-02-01T10:09:10+05:30'
                        time_format: hh:mm a
                        offset: 19800000
                        profile:
                          name: Administrator
                          id: '431581000000031157'
                        created_by:
                          name: Patricia Boyle
                          id: '431581000000258001'
                        zuid: '60019394663'
                        full_name: Patricia Boyle
                        phone: null
                        dob: null
                        sort_order_preference__s: First Name,Last Name
                        status: active
                        role:
                          name: CEO
                          id: '431581000000031151'
                        customize_info:
                          notes_desc: null
                          show_right_panel: null
