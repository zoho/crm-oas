        Represents a filter criterion for the between and not_between
        comparators. The value must be an array of exactly two elements —
        [lower_bound, upper_bound]. The value type is determined by the field's
        data_type: use SimpleFilterCriterionValueString for date or datetime
        fields, and SimpleFilterCriterionValueNumber for integer, currency, or
        double fields. Resolve the data_type from the field's FieldSchema. For
        formula fields, use formula.return_type as the effective data_type; for
        rollup_summary fields, use rollup_summary.return_type.
      properties:
        field:
          allOf:
            - $ref: '#/components/schemas/FilterFieldBase'
