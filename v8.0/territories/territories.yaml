              Represents the error details for a single territory with its
              associated user count.
            additionalProperties: false
          description: >-
            Represents the list of objects containing the count of users
            associated with each territory.
          maxItems: 200
          minItems: 1
        info:
          type: object
          properties:
            per_page:
              type: integer
              format: int32
