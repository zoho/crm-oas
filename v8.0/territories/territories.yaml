                request body.
              maxLength: 512
        message:
          type: string
          description: >-
            Error message describing the DEPENDENT_FIELD_MISSING condition
            returned in the response envelope.
          maxLength: 512
        status:
          type: string
          enum:
            - error
          description: 'Status of the response. Possible values: error.'
