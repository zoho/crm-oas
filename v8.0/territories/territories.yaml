openapi: 3.1.0
info:
  title: Territories
  description: >-
    Territories are organizational units in Zoho CRM that partition records,
    such as accounts, contacts, leads, and deals, into distinct groups governed
    by criteria-based assignment rules. This API enables developers to create,
    retrieve, update, and delete territories, manage the territory hierarchy,
    assign territories to records, and perform transfer-and-delete operations.
  version: '8'
  license:
    name: Zoho CRM API License
    url: https://www.zoho.com/crm/developer/docs/api/v8/
servers:
  - url: https://zohoapis.{dc}/crm/{version}
    description: API Server URL
    variables:
      dc:
        enum:
          - com
          - eu
          - in
          - cn
          - au
        default: com
        description: The top-level domain (TLD) of the Zoho CRM API server.
      version:
        default: v8
        description: The version of the Zoho CRM API.
paths:
  /settings/territories:
    get:
      summary: Get all territories
      description: >-
        To retrieve the list of territories enabled for your Zoho CRM
        organization.
      x-zs-llm-description: >-
        Available only in Enterprise and above editions. Use this API to list
        all territories. Supports filtering by ids, pagination, and including
        rule criteria (account_rule_criteria, lead_rule_criteria,
        deal_rule_criteria) via the include parameter. Returns 204 when no
        territories exist. Before triggering Territory CRUD and other territory
        assignment and user association operations, ensure Territory Management
        is enabled. Refer to territory_configuration.json
        (getTerritoryConfiguration, updateTerritoryConfiguration).
      operationId: getTerritories
      tags:
        - Territories
      security:
        - OAuth2:
            - ZohoCRM.settings.territories.READ
      parameters:
        - $ref: '#/components/parameters/Include'
          description: >-
            Include account_rule_criteria, lead_rule_criteria (or)
            deal_rule_criteria.
        - $ref: '#/components/parameters/Ids'
          description: List of Territory Ids
        - $ref: '#/components/parameters/Page'
          description: Page Numeber
        - $ref: '#/components/parameters/PerPage'
          description: Per Page Number
        - $ref: '#/components/parameters/Filters'
          description: Filter Out the Territories based on Given Criteria
        - $ref: '#/components/parameters/IncludeInnerDetails'
          description: Include manager status & zuid
      responses:
        '200':
          description: >-
            Returns the list of territories enabled for the Zoho CRM
            organization. Use the **info** object to navigate through paginated
            results.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TerritoryListResponse'
              examples:
                GetAllTerritories:
                  summary: Get all territories with pagination
                  value:
                    territories:
                      - created_time: '2024-07-09T20:50:29+05:30'
                        permission_type: read_only
                        modified_time: '2024-07-09T20:50:29+05:30'
                        manager:
                          name: Patricia
                          id: '2276164000000471001'
                          zuid: '8186088'
                          status: active
                        api_name: zoho
                        name: zoho
                        modified_by:
                          name: Patricia
                          id: '2276164000000471001'
                        description: Organization Parent Territory
                        id: '2276164000001054020'
                        reporting_to: null
                        created_by:
                          name: Patricia
                          id: '2276164000000471001'
                    info:
                      per_page: 1
                      count: 0
                      page: 1
                      more_records: false
                GetTerritoriesByIncludeParam:
                  summary: >-
                    Get territories with criteria rules using the include
                    parameter
                  value:
                    territories:
                      - created_time: '2023-06-10T12:17:53+05:30'
                        manager:
                          name: J Smith
                          id: '431581000000278001'
                        account_rule_criteria:
                          comparator: equal
                          field:
                            api_name: Billing_City
                            id: '431581000000000657'
                          value: Chennai
                        description: null
                        lead_rule_criteria: null
                        reporting_to:
                          name: Zoho
                          id: '431581000000272796'
                        deal_rule_criteria: null
                        created_by:
                          name: Patricia Boyle
                          id: '431581000000258001'
                        permission_type: read_write_delete
                        modified_time: '2023-06-10T12:23:23+05:30'
                        name: Chennai
                        modified_by:
                          name: Patricia Boyle
                          id: '431581000000258001'
                        id: '431581000000744113'
                        api_name: Chennai
                    info:
                      per_page: 1
                      count: 0
                      page: 1
                      more_records: false
                GetAllByIncludingIdsParam:
                  summary: Get territories filtered by specific IDs
                  value:
                    territories:
                      - created_time: '2024-07-09T20:50:29+05:30'
                        permission_type: read_only
                        modified_time: '2024-07-09T20:50:29+05:30'
                        manager:
                          name: Patricia
                          id: '2276164000000471001'
                          zuid: '8186088'
                          status: active
                        api_name: zoho
                        name: zoho
                        modified_by:
                          name: Patricia
                          id: '2276164000000471001'
                        description: Organization Parent Territory
                        id: '2276164000001054020'
                        reporting_to: null
                        created_by:
                          name: Patricia
                          id: '2276164000000471001'
        '204':
          description: No territories found for the given query parameters.
        '400':
          description: >-
            The request contains an invalid filter parameter.\n**Resolution:**
            The **filters** query parameter must use a supported field name.
          content:
            application/json:
              schema:
                x-zs-$id: FiltersErrorResponse
                description: >-
                  Represents the error response for the GET
                  /settings/territories request. Contains either an unsupported
                  filter field error or a territory feature not enabled error.
                oneOf:
                  - $ref: '#/components/schemas/NotSupportedFieldsInFilters'
                  - $ref: '#/components/schemas/FilterNotSupportedApiName'
                  - $ref: '#/components/schemas/FilterEmptyFilterObject'
                  - $ref: '#/components/schemas/FilterMandatoryNotFound'
                  - $ref: '#/components/schemas/FilterInvalidComparator'
                  - $ref: '#/components/schemas/FilterFieldComparatorValueMissing'
                  - $ref: '#/components/schemas/FilterFieldComparatorMismatch'
                  - $ref: '#/components/schemas/FilterFieldValueMismatch'
                  - $ref: '#/components/schemas/FilterComparatorValueMismatch'
                  - $ref: '#/components/schemas/FilterInvalidParamDataType'
                  - $ref: '#/components/schemas/FilterInvalidFieldDataType'
                  - $ref: '#/components/schemas/FilterFieldNotSupportedInCriteria'
                  - $ref: '#/components/schemas/TerritoryFeatureNotEnabledError'
              examples:
                TerritoryNotYetEnabled:
                  summary: Territory management not yet enabled error
                  value:
                    code: FEATURE_NOT_ENABLED
                    details: {}
                    message: Territory Management is not enabled
                    status: error
                TerritoryDisabled:
                  summary: Territory management disabled error
                  value:
                    code: FEATURE_NOT_ENABLED
                    details: {}
                    message: Territory Management is disabled
                    status: error
        '401':
          description: >-
            Authentication failure due to missing, expired, or invalid OAuth
            token.\n**Resolution:** A new access token must be generated with
            the required scope for this API.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
              examples:
                AuthenticationFailure:
                  summary: Authentication failure
                  value:
                    code: AUTHENTICATION_FAILURE
                    details: {}
                    message: Authentication failed
                    status: error
    post:
      operationId: createTerritories
      tags:
        - Territories
      security:
        - OAuth2:
            - ZohoCRM.settings.territories.CREATE
      requestBody:
        content:
          application/json:
            schema:
              x-zs-$id: CreateTerritoriesRequestBody
              type: object
              properties:
                territories:
                  type: array
                  items:
                    type: object
                    properties:
                      manager:
                        oneOf:
                          - x-zs-$id: ManagerIdPOST
                            type: object
                            properties:
                              id:
                                description: >-
                                  Specify the unique ID of the user to assign as
                                  the territory manager.
                                x-zs-$ref:
                                  resource: users
                                  origins:
                                    - operationId: getUsers
                                      propertyId: UserId
                                type: string
                                maxLength: 19
                            description: >-
                              Represents a territory manager specified by user
                              ID.
                            additionalProperties: false
                            required:
                              - id
                          - x-zs-$id: ManagerNullPOST
                            type: 'null'
                            const: null
                            description: >-
                              Represents the absence of a territory manager. Set
                              this value to remove any assigned manager from the
                              territory.
                      reporting_to:
                        oneOf:
                          - x-zs-$id: ReportingToIdPOST
                            type: object
                            properties:
                              id:
                                description: Specify the unique ID of the parent territory.
                                x-zs-$ref:
                                  resource: territories
                                  origins:
                                    - operationId: getTerritories
                                      propertyId: TerritoriesId
                                type: string
                                format: int64
                            required:
                              - id
                            description: >-
                              Represents the parent territory to which this
                              territory reports in the hierarchy.
                            additionalProperties: false
                          - x-zs-$id: ReportingToNullPOST
                            type: 'null'
                            const: null
                            description: >-
                              Represents the absence of a parent territory. Set
                              this field to **null** when the territory has no
                              parent in the hierarchy.
                      permission_type:
                        type: string
                        enum:
                          - read_write_delete
                          - read_only
                        description: >-
                          Specify the access permission for users in this
                          territory.

                          Possible values:

                          read_write_delete - Grants users read, write, and
                          delete access to records assigned to the territory.

                          read_only - Grants users read-only access to records
                          assigned to the territory.
                      description:
                        type:
                          - string
                          - 'null'
                        description: Specify the description for the territory.
                        maxLength: 250
                      account_rule_criteria:
                        oneOf:
                          - $ref: '#/components/schemas/SimpleFilterCriterionRequest'
                          - $ref: '#/components/schemas/GroupedFilterCriterionRequest'
                          - type: 'null'
                            const: null
                            x-zs-$id: AccountRuleCriteriaNullPOST
                            description: >-
                              Represents the absence of an account rule
                              criteria. Set this value to remove any existing
                              account rule criteria from the territory.
                        description: >-
                          Specify the criteria for auto-assigning accounts to
                          the territory. To remove an existing criteria, set
                          this field to **null**.
                      deal_rule_criteria:
                        oneOf:
                          - $ref: '#/components/schemas/SimpleFilterCriterionRequest'
                          - $ref: '#/components/schemas/GroupedFilterCriterionRequest'
                          - type: 'null'
                            const: null
                            x-zs-$id: DealRuleCriteriaNullPOST
                            description: >-
                              Represents the absence of a deal rule criteria.
                              Set this value to remove any existing deal rule
                              criteria from the territory.
                        description: >-
                          Specify the criteria for auto-assigning deals to the
                          territory. To remove an existing criteria, set this
                          field to **null**.
                      lead_rule_criteria:
                        oneOf:
                          - $ref: '#/components/schemas/SimpleFilterCriterionRequest'
                          - $ref: '#/components/schemas/GroupedFilterCriterionRequest'
                          - type: 'null'
                            const: null
                            x-zs-$id: LeadRuleCriteriaNullPOST
                            description: >-
                              Represents the absence of a lead rule criteria.
                              Set this value to remove any existing lead rule
                              criteria from the territory.
                        description: >-
                          Specify the criteria for auto-assigning leads to the
                          territory. To remove an existing criteria, set this
                          field to **null**.
                      name:
                        type: string
                        maxLength: 50
                        description: Specify the name of the territory.
                    required:
                      - reporting_to
                      - permission_type
                      - name
                    description: Specify the details for each territory to create.
                    additionalProperties: false
                  description: Specify the list of territories to create.
                  maxItems: 100
                  minItems: 1
              description: Specify the territories to create in your organization.
              additionalProperties: false
              required:
                - territories
            examples:
              TerritoryCreate:
                summary: >-
                  Create a territory with name, manager, and account rule
                  criteria
                value:
                  territories:
                    - name: Territory1000
                      reporting_to:
                        id: '431581000000272796'
                      manager:
                        id: '431581000000258001'
                      permission_type: read_only
                      description: 'null'
                      account_rule_criteria:
                        comparator: greater_than
                        field:
                          api_name: Annual_Revenue
                          id: '431581000000000625'
                        value: '1001'
                      lead_rule_criteria:
                        comparator: greater_than
                        field:
                          api_name: Annual_Revenue
                          id: '431581000000000893'
                        value: '1000'
                      deal_rule_criteria:
                        comparator: greater_than
                        field:
                          api_name: Amount
                          id: '431581000000000799'
                        value: '100000'
            x-zs-llm-examples:
              - TerritoryCreate
        required: true
        description: >-
          The request body must contain a **territories** array. You can include
          a maximum of 100 territory objects per request.
      responses:
        '201':
          description: >-
            Returns the result of the territory creation request for each
            territory in the **territories** array. The **code** field indicates
            **SUCCESS** for created territories and **ERROR** for failed ones,
            with the territory ID in the **details** object for successful
            entries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TerritoryCreateSuccessResponse'
              examples:
                AutoGeneratedExample:
                  summary: Successful territory creation response
                  value:
                    territories:
                      - code: SUCCESS
                        details:
                          id: '431581000000734292'
                        message: Territory Created Successfully
                        status: success
        '400':
          description: >-
            The territory creation request contains invalid or missing data.
            Resolution: All required fields must be provided, field values must
            not exceed the allowed length or limits, and the permission type
            must be valid.
          content:
            application/json:
              schema:
                x-zs-$id: TerritoryCreateErrorResponseSchema
                description: >-
                  Represents the error response for an invalid or failed
                  territory creation request.
                oneOf:
                  - $ref: '#/components/schemas/InvalidData'
                  - $ref: '#/components/schemas/InvalidDataWithSupportedValues'
                  - $ref: '#/components/schemas/DuplicateDataError'
                  - $ref: '#/components/schemas/MandatoryNotFoundError'
                  - $ref: >-
                      #/components/schemas/MandatoryNotFoundErrorWithSupportedValues
                  - $ref: '#/components/schemas/TerritoryMaxLimitExceededErrorSchema'
                  - $ref: >-
                      #/components/schemas/TerritoryMaxLimitExceededErrorSchemaForCriteria
                  - $ref: '#/components/schemas/InvalidDataWithMaximumLength'
                  - $ref: '#/components/schemas/InvalidDataWithMaximumLengthAsString'
                  - $ref: >-
                      #/components/schemas/NotSupportedForCriteriaOnModuleDisable
                  - $ref: '#/components/schemas/TerritoryParentNoPermission'
                  - $ref: '#/components/schemas/TerritoryCriteriaError'
                  - $ref: '#/components/schemas/TerritoryFeatureNotEnabledError'
              examples:
                MandatoryNotFoundReportingTo:
                  summary: Mandatory field reporting_to missing in request
                  value:
                    territories:
                      - code: MANDATORY_NOT_FOUND
                        details:
                          api_name: reporting_to
                          json_path: $.territories[0].reporting_to
                        message: required field not found
                        status: error
                MandatoryNotFoundName:
                  summary: Mandatory field name missing in request
                  value:
                    territories:
                      - code: MANDATORY_NOT_FOUND
                        details:
                          api_name: name
                          json_path: $.territories[0].name
                        message: required field not found
                        status: error
                MandatoryNotFoundPermissionType:
                  summary: Mandatory field permission_type missing in request
                  value:
                    territories:
                      - code: MANDATORY_NOT_FOUND
                        details:
                          api_name: permission_type
                          json_path: $.territories[0].permission_type
                        message: required field not found
                        status: error
                TerritoryMaximumLimit:
                  summary: Territory maximum limit reached
                  value:
                    territories:
                      - code: LIMIT_EXCEEDED
                        details:
                          limit: 250
                        message: Territory Limit reached
                        status: error
                CriteriaInvalidFieldDataType:
                  summary: Invalid field data type in criteria
                  value:
                    territories:
                      - code: INVALID_DATA
                        details:
                          api_name: field
                          json_path: $.territories[0].account_rule_criteria.field
                          expected_data_type: jsonobject
                        message: invalid data
                        status: error
                CriteriaFieldComparatorMismatch:
                  summary: Field and comparator mismatch in criteria
                  value:
                    territories:
                      - code: DEPENDENT_MISMATCH
                        details:
                          dependee:
                            api_name: field
                            json_path: $.territories[0].account_rule_criteria.field
                          api_name: comparator
                          json_path: $.territories[0].account_rule_criteria.comparator
                          supported_values:
                            - equal
                            - not_equal
                            - greater_than
                            - less_than
                        message: The comparator is not compatible with the given field
                        status: error
                CriteriaFieldValueMismatch:
                  summary: Field value type mismatch in criteria
                  value:
                    territories:
                      - code: DEPENDENT_MISMATCH
                        details:
                          dependee:
                            api_name: field
                            json_path: $.territories[0].account_rule_criteria.field
                          api_name: value
                          json_path: $.territories[0].account_rule_criteria.value
                          expected_data_type: integer
                        message: The value is not compatible with the given field
                        status: error
                CriteriaFieldComparatorValueMissing:
                  summary: Dependent field missing in criteria
                  value:
                    territories:
                      - code: DEPENDENT_FIELD_MISSING
                        details:
                          dependee:
                            api_name: field
                            json_path: $.territories[0].account_rule_criteria.field
                          api_name: comparator
                          json_path: $.territories[0].account_rule_criteria.comparator
                        message: required field not found
                        status: error
                CriteriaFieldNotSupported:
                  summary: Field not supported in territory rule criteria
                  value:
                    territories:
                      - code: NOT_SUPPORTED
                        details:
                          api_name: File_Upload
                          json_path: >-
                            $.territories[0].account_rule_criteria.field.api_name
                        message: The given field api_name is not supported in criteria
                        status: error
                TerritoryNotYetEnabled:
                  summary: Territory management not yet enabled error
                  value:
                    code: FEATURE_NOT_ENABLED
                    details: {}
                    message: Territory Management is not enabled
                    status: error
                TerritoryDisabled:
                  summary: Territory feature disabled error
                  value:
                    code: FEATURE_NOT_ENABLED
                    details: {}
                    message: Territory Management is disabled
                    status: error
        '401':
          description: >-
            Authentication failure due to missing, expired, or invalid OAuth
            token. Resolution: A new access token must be generated with the
            required scope for this API.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
              examples:
                AuthenticationFailure:
                  summary: Authentication failure error
                  value:
                    code: AUTHENTICATION_FAILURE
                    details: {}
                    message: Authentication failed
                    status: error
      summary: Create Territories
      description: To create one or more territories in your Zoho CRM organization.
      x-zs-llm-description: >-
        Available only in Enterprise and above editions. Creates one or more
        territories in a single request. Requires territory name and parent
        territory, permission type. Optionally configure manager, description,
        and rule criteria for automatic record assignment. Territory hierarchy
        must already be initialized via the Territory Configuration API before
        calling this. To provide the deal_rule_criteria and lead_rule_criteria,
        the territory_rules.module.api_name (Deals and Leads module)
        corresponding status key must be set to "enable" state. Before
        triggering Territory CRUD and other territory assignment and user
        association operations, ensure Territory Management is enabled. Refer to
        territory_configuration.json (getTerritoryConfiguration,
        updateTerritoryConfiguration).
    put:
      operationId: updateTerritories
      tags:
        - Territories
      requestBody:
        content:
          application/json:
            schema:
              x-zs-$id: UpdateTerritoriesRequestBody
              type: object
              properties:
                territories:
                  type: array
                  items:
                    type: object
                    properties:
                      manager:
                        oneOf:
                          - x-zs-$id: ManagerIdPUT
                            type: object
                            properties:
                              id:
                                description: >
                                  Specify the unique ID of the user to assign as
                                  the manager of this territory.
                                x-zs-$ref:
                                  resource: users
                                  origins:
                                    - operationId: getUsers
                                      propertyId: UserId
                                type: string
                                maxLength: 19
                            description: >
                              Specify the manager of this territory by providing
                              the user's unique ID.
                            additionalProperties: false
                            required:
                              - id
                          - x-zs-$id: ManagerNullPUT
                            type: 'null'
                            const: null
                            description: >
                              Specify **null** to remove the manager from this
                              territory.
                      reporting_to:
                        oneOf:
                          - x-zs-$id: ReportingToIdPUT
                            type: object
                            properties:
                              id:
                                description: |
                                  Specify the unique ID of the parent territory.
                                x-zs-$ref:
                                  resource: territories
                                  origins:
                                    - operationId: getTerritories
                                      propertyId: TerritoriesId
                                type: string
                                format: int64
                            required:
                              - id
                            description: >
                              Specify the parent territory of this territory by
                              providing its unique ID.
                            additionalProperties: false
                          - x-zs-$id: ReportingToNullPUT
                            type: 'null'
                            const: null
                            description: >
                              Specify **null** when this territory has no parent
                              territory.
                      permission_type:
                        type: string
                        enum:
                          - read_write_delete
                          - read_only
                        description: >
                          Specify the permission type for the territory.

                          Possible values:

                          read_write_delete - Grants full access to the
                          territory, including read, write, and delete
                          operations.

                          read_only - Restricts users to read-only access for
                          the territory.
                      description:
                        type:
                          - string
                          - 'null'
                        description: |
                          Specify the description of the territory.
                        maxLength: 250
                      id:
                        description: |
                          Specify the unique ID of the territory to update.
                        x-zs-$ref:
                          resource: territories
                          origins:
                            - operationId: getTerritories
                              propertyId: TerritoriesId
                        type: string
                        format: int64
                      name:
                        type: string
                        maxLength: 50
                        description: |
                          Specify the name of the territory.
                      account_rule_criteria:
                        oneOf:
                          - $ref: '#/components/schemas/SimpleFilterCriterionRequest'
                          - $ref: '#/components/schemas/GroupedFilterCriterionRequest'
                          - type: 'null'
                            x-zs-$id: AccountRuleCriteriaNullPUT
                            const: null
                            description: >
                              Represents a null value that removes the account
                              rule criteria from the territory.
                        description: >
                          Specify the account rule criteria for the territory.
                          Use a criteria object or a group criteria object to
                          define the conditions. Set to **null** to remove the
                          existing criteria.
                      deal_rule_criteria:
                        oneOf:
                          - $ref: '#/components/schemas/SimpleFilterCriterionRequest'
                          - $ref: '#/components/schemas/GroupedFilterCriterionRequest'
                          - type: 'null'
                            x-zs-$id: DealRuleCriteriaNullPUT
                            const: null
                            description: >
                              Represents a null value that removes the deal rule
                              criteria from the territory.
                        description: >
                          Specify the deal rule criteria for the territory. Use
                          a criteria object or a group criteria object to define
                          the conditions. Set to **null** to remove the existing
                          criteria.
                      lead_rule_criteria:
                        oneOf:
                          - $ref: '#/components/schemas/SimpleFilterCriterionRequest'
                          - $ref: '#/components/schemas/GroupedFilterCriterionRequest'
                          - type: 'null'
                            const: null
                            x-zs-$id: LeadRuleCriteriaNullPUT
                            description: >
                              Represents a null value that removes the lead rule
                              criteria from the territory.
                        description: >
                          Specify the lead rule criteria for the territory. Use
                          a criteria object or a group criteria object to define
                          the conditions. Set to **null** to remove the existing
                          criteria.
                    required:
                      - id
                    description: |
                      Specify the details of each territory to update.
                    additionalProperties: false
                  description: |
                    Specify the list of territories to update.
                  maxItems: 100
                  minItems: 1
              description: |
                Specify the territories to update.
              additionalProperties: false
              required:
                - territories
            examples:
              TerritoryUpdateExample:
                summary: >
                  Update a territory with deal rule criteria and read-only
                  permission
                value:
                  territories:
                    - id: '431581000000798016'
                      name: Territory1234
                      reporting_to:
                        id: '431581000000272796'
                      manager: null
                      permission_type: read_only
                      description: null
                      account_rule_criteria: null
                      lead_rule_criteria: null
                      deal_rule_criteria:
                        comparator: greater_than
                        field:
                          api_name: Amount
                          id: '431581000000000799'
                        value: '2000000'
            x-zs-llm-examples:
              - TerritoryUpdateExample
        required: true
        description: >
          The request body must contain a **territories** array. You can include
          a maximum of 100 territory objects per request.
      responses:
        '200':
          description: >
            Returns the result of the territory update for each territory in the
