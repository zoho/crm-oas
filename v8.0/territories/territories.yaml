            (api_name, json_path) and the dependee field that imposed the
            violated validation rule (dependee.api_name, dependee.json_path).
          additionalProperties: false
          required:
            - dependee
            - api_name
            - json_path
          properties:
            dependee:
              type: object
              description: >-
                Identifies the dependee field whose value determines the
                validation rules applied to the comparator of the criterion
                field in error. Contains the API name and JSON path of the
                dependee field.
              additionalProperties: false
              required:
                - api_name
                - json_path
              properties:
                api_name:
                  type: string
                  description: >-
                    API name of the dependee field whose value imposed the
                    violated validation rule on the criterion field comparator.
                  maxLength: 256
                json_path:
                  type: string
                  description: >-
                    JSON path locating the dependee field within the request
                    body.
                  maxLength: 512
            api_name:
              type: string
              description: >-
                API name of the criterion field whose comparator value does not
                satisfy the dependency rule imposed by the dependee field.
              maxLength: 256
            json_path:
              type: string
              description: >-
                JSON path locating the criterion field with the invalid
                comparator value within the request body.
              maxLength: 512
        message:
          type: string
          description: >-
            Descriptive message providing details about the comparator value
            mismatch error.
          maxLength: 512
        status:
          type: string
          enum:
            - error
          description: >-
            Status of the response indicating the outcome of the request.
            Possible values: error.
