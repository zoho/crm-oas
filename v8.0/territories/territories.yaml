            Possible values:

            less_than - Matches records where the field value is less than the
            specified filter value.

            less_equal - Matches records where the field value is less than or
            equal to the specified filter value.

            greater_than - Matches records where the field value is greater than
            the specified filter value.

            greater_equal - Matches records where the field value is greater
            than or equal to the specified filter value.
        value:
          anyOf:
            - $ref: '#/components/schemas/SimpleFilterCriterionValueString'
            - $ref: '#/components/schemas/SimpleFilterCriterionValueNumber'
            - $ref: '#/components/schemas/SimpleFilterCriterionValueAgeDuePredefined'
          description: >-
            Represents the scalar filter value returned for the ordering
            comparator.
        type:
          type: string
          enum:
            - merge_field
            - pre_defined
            - value
            - field
          default: value
          description: >-
            Indicates the value resolution mode of the criterion, distinguishing
            whether the filter value is a literal value, a merge field
            reference, a predefined system variable, or another field reference.

            Possible values:

            value - The value is a direct literal.

            merge_field - The value is a merge field reference.

            pre_defined - The value is a predefined system variable placeholder.

            field - The value references another field.
        $disrupted:
          type: boolean
          description: >-
            Indicates whether the ordering filter criterion is in a disrupted
            state, typically due to an invalid or unresolvable field or value
            reference.
      required:
        - field
        - comparator
        - value
      additionalProperties: false
    BetweenFilterCriterionResponse:
      type: object
      x-zs-$id: BetweenFilterCriterionResponse
      description: >-
        Represents the response for a filter criterion using the between and
        not_between comparators. The value is an array of exactly two elements —
        [lower_bound, upper_bound]. The value type is determined by the field's
        data_type: SimpleFilterCriterionValueString for date or datetime fields,
        and SimpleFilterCriterionValueNumber for integer, currency, or double
        fields.
      properties:
        field:
          allOf:
            - $ref: '#/components/schemas/FilterFieldBase'
            - type: object
              additionalProperties: true
              description: >-
                Represents the field reference constraint that requires the
                api_name property to be present for the range filter criterion
                response.
              required:
                - api_name
          unevaluatedProperties: false
          description: >-
            Represents the target field definition to which the range filter
            criterion was applied, conforming to the base field structure.
        comparator:
          type: string
          enum:
            - between
            - not_between
          description: >-
            Represents the range comparison operator returned for the criterion,
            indicating whether the field value falls within or outside the
            specified bounds.

            Possible values:

            between - Matches records where the field value falls within the
            specified range.

            not_between - Matches records where the field value falls outside
            the specified range.
        value:
          type: array
          x-zs-$id: BetweenFilterCriterionResponseValueArray
          description: >-
            Contains the two boundary values — [lower_bound, upper_bound] —
            against which the field was evaluated for the between or not_between
            comparator.
          minItems: 2
          maxItems: 2
          items:
            x-zs-$id: BetweenFilterCriterionResponseValueArrayItems
            oneOf:
              - $ref: '#/components/schemas/SimpleFilterCriterionValueString'
              - $ref: '#/components/schemas/SimpleFilterCriterionValueNumber'
        type:
          type: string
          enum:
            - merge_field
            - pre_defined
            - value
            - field
          default: value
          description: >-
            Indicates the value resolution mode of the criterion, distinguishing
            whether the filter value is a literal value, a merge field
            reference, a predefined system variable, or another field reference.

            Possible values:

            value - The value is a direct literal.

            merge_field - The value is a merge field reference.

            pre_defined - The value is a predefined system variable placeholder.

            field - The value references another field.
        $disrupted:
          type: boolean
          description: >-
            Indicates whether the between filter criterion is in a disrupted
            state, typically due to an invalid or unresolvable field or value
            reference.
      required:
        - field
        - comparator
        - value
      additionalProperties: false
    SetFilterCriterionResponse:
      type: object
      x-zs-$id: SetFilterCriterionResponse
      description: >-
        Represents the response for a filter criterion using the in and not_in
        comparators. The value is an array of primitive values.
      properties:
        field:
          allOf:
            - $ref: '#/components/schemas/FilterFieldBase'
            - type: object
              additionalProperties: true
              description: >-
                Represents the field reference constraint that requires the
                api_name property to be present for the set filter criterion
                response.
              required:
                - api_name
          unevaluatedProperties: false
          description: >-
            Represents the target field definition to which the set filter
            criterion was applied, conforming to the base field structure.
        comparator:
          type: string
          enum:
            - in
            - not_in
          description: >-
            Represents the set membership comparison operator returned for the
            criterion.

            Possible values:

            in - Matches records where the field value is in the specified set
            of values.

            not_in - Matches records where the field value is not in the
            specified set of values.
        value:
          type: array
          x-zs-$id: SetFilterCriterionResponseValueArray
          description: >-
            Contains an array of primitive filter values returned for the set
            comparison.
          minItems: 1
          maxItems: 500
          items:
            x-zs-$id: SetFilterCriterionResponseValueArrayItems
            oneOf:
              - $ref: '#/components/schemas/SimpleFilterCriterionValueString'
              - $ref: '#/components/schemas/SimpleFilterCriterionValueNumber'
        type:
          type: string
          enum:
            - merge_field
            - pre_defined
            - value
            - field
          default: value
          description: >-
            Indicates the value resolution mode of the criterion, distinguishing
            whether the filter value is a literal value, a merge field
            reference, a predefined system variable, or another field reference.

            Possible values:

            value - The value is a direct literal.

            merge_field - The value is a merge field reference.

            pre_defined - The value is a predefined system variable placeholder.

            field - The value references another field.
        $disrupted:
          type: boolean
          description: >-
            Indicates whether the set filter criterion is in a disrupted state,
            typically due to an invalid or unresolvable field or value
            reference.
      required:
        - field
        - comparator
        - value
      additionalProperties: false
    MultiSelectLookupFilterCriterionResponse:
      type: object
      x-zs-$id: MultiSelectLookupFilterCriterionResponse
      description: >-
        Represents the response for a filter criterion using the include_all,
        include_any, exclude_all, and exclude_any comparators. Applicable only
        when the field's data_type is multiuserlookup or multiselectlookup.
      properties:
        field:
          allOf:
            - $ref: '#/components/schemas/FilterFieldBase'
            - type: object
              additionalProperties: true
              description: >-
                Represents the field reference constraint that requires the
                api_name property to be present for the multi-select lookup
                filter criterion response.
              required:
                - api_name
          unevaluatedProperties: false
          description: >-
            Represents the target field definition to which the multi-select
            lookup filter criterion was applied. The field has a data_type of
            multiuserlookup or multiselectlookup.
        comparator:
          type: string
          enum:
            - include_all
            - include_any
            - exclude_all
            - exclude_any
          description: >-
            Represents the multi-select lookup comparison operator returned for
            the criterion. Applicable only when the field's data_type is
            multiuserlookup or multiselectlookup.

            Possible values:

            include_all - Matches records that include all specified lookup
            values.

            include_any - Matches records that include at least one of the
            specified lookup values.

            exclude_all - Matches records that exclude all specified lookup
            values.

            exclude_any - Matches records that exclude at least one of the
            specified lookup values.
        value:
          type: array
          x-zs-$id: MultiSelectLookupFilterCriterionResponseValueArray
          description: >-
            Contains an array of lookup object references returned for the
            multi-select comparison.
          minItems: 1
          maxItems: 500
          items:
            x-zs-$id: MultiSelectLookupFilterCriterionResponseValueArrayItems
            $ref: '#/components/schemas/SimpleFilterCriterionValueObjectResponse'
        type:
          type: string
          enum:
            - merge_field
            - pre_defined
            - value
            - field
          default: value
          description: >-
            Indicates the value resolution mode of the criterion, distinguishing
            whether the filter value is a literal value, a merge field
            reference, a predefined system variable, or another field reference.

            Possible values:

            value - The value is a direct literal.

            merge_field - The value is a merge field reference.

            pre_defined - The value is a predefined system variable placeholder.

            field - The value references another field.
        $disrupted:
          type: boolean
          description: >-
            Indicates whether the multi-select lookup filter criterion is in a
            disrupted state, typically due to an invalid or unresolvable field
            or value reference.
      required:
        - field
        - comparator
        - value
      additionalProperties: false
    SimpleFilterCriterionResponse:
      x-zs-$id: SimpleFilterCriterionResponse
      description: >-
        Represents the response for a simple field-based filter criterion,
        dispatching to the appropriate comparator-specific response schema.
      oneOf:
        - $ref: '#/components/schemas/EqualityFilterCriterionResponse'
        - $ref: '#/components/schemas/TextFilterCriterionResponse'
        - $ref: '#/components/schemas/OrderingFilterCriterionResponse'
        - $ref: '#/components/schemas/BetweenFilterCriterionResponse'
        - $ref: '#/components/schemas/SetFilterCriterionResponse'
        - $ref: '#/components/schemas/MultiSelectLookupFilterCriterionResponse'
    GroupedFilterCriterionResponse:
      type: object
      x-zs-$id: GroupedFilterCriterionResponse
      description: >-
        Represents the grouped filter criterion returned in the response,
        containing multiple filter conditions evaluated with a logical operator.
        Supports recursive nesting for complex filtering logic.
      properties:
        group:
          type: array
          description: >-
            Contains an array of filter conditions grouped together and
            evaluated with the specified logical operator.
          minItems: 2
          maxItems: 25
          items:
            oneOf:
              - $ref: '#/components/schemas/SimpleFilterCriterionResponse'
              - $ref: '#/components/schemas/GroupedFilterCriterionResponse'
        group_operator:
          type: string
          enum:
            - AND
            - OR
            - and
            - or
          description: >-
            Represents the logical operator applied between the filter
            conditions in the group.

            Possible values:

            AND - All conditions in the group must be satisfied.

            OR - At least one condition in the group must be satisfied.

            and - Equivalent to AND; all conditions in the group must be
            satisfied.

            or - Equivalent to OR; at least one condition in the group must be
            satisfied.
        $disrupted:
          type: boolean
          description: >-
            Indicates whether the grouped filter criterion is in a disrupted
            state, typically due to an invalid or unresolvable condition within
            the group.
      required:
        - group
        - group_operator
      additionalProperties: false
    FilterNotSupportedApiName:
      x-zs-$id: FilterNotSupportedApiName
      additionalProperties: false
      description: >-
        Represents an error response returned when a filter criterion references
        a field API name that is not supported for filtering. The details object
        identifies the unsupported field and its location within the filter
        parameter.
      type: object
      required:
        - code
        - details
        - message
        - status
      properties:
        code:
          type: string
          description: >-
            Indicates the error classification assigned to this response.

            Possible values:

            **NOT_SUPPORTED** - The referenced field API name is not permitted
            for use in filter criteria.
          enum:
            - NOT_SUPPORTED
        details:
          additionalProperties: false
          type: object
          required:
            - api_name
            - json_path
            - param_name
          properties:
            api_name:
              maxLength: 256
              type: string
              description: >-
                Represents the API name of the field that is not supported for
                use in filter criteria and triggered this error.
            json_path:
              maxLength: 512
              type: string
              description: >-
                Indicates the JSONPath location of the unsupported field within
                the filter expression.
            param_name:
              maxLength: 256
              type: string
              description: >-
                Represents the name of the filter request parameter that carried
                the unsupported field API name.
          description: >-
            Contains the contextual details identifying the unsupported field
            that caused the error, including its API name, its location within
            the filter expression, and the name of the filter parameter
            involved.
        message:
          maxLength: 512
          type: string
          description: >-
            Contains a descriptive message summarizing the nature of the error
            returned by the API.
        status:
          type: string
          enum:
            - error
          description: >-
            Indicates the outcome status of the API response.

            Possible values:

            **error** - The request failed because an unsupported field API name
            was used in the filter criteria.
    FilterEmptyFilterObject:
      x-zs-$id: FilterEmptyFilterObject
      type: object
      description: >-
        Represents the error response returned when a filter object is submitted
        without any recognized fields — such as group or criteria — where at
        least one is required for the expression to be valid. The error code is
        EXPECTED_FIELD_MISSING.
      additionalProperties: false
      required:
        - code
        - details
        - message
        - status
      properties:
        code:
          type: string
          description: >-
            Indicates the error classification for this failure.

            Possible values:

            **EXPECTED_FIELD_MISSING** - None of the expected filter fields were
            present in the submitted filter object.
          enum:
            - EXPECTED_FIELD_MISSING
        details:
          type: object
          description: >-
            Contains structured diagnostic detail about the empty filter object,
            including the parameter name and the list of fields that were
            expected but entirely absent from the filter expression.
          additionalProperties: false
          required:
            - expected_fields
            - param_name
          properties:
            expected_fields:
              type: array
              minItems: 1
              maxItems: 100
              uniqueItems: true
              description: >-
                Contains the collection of fields that the filter object was
                expected to include, of which at least one must be present for
                the request to be valid. Each entry identifies the field by its
                API name and JSON path.
              items:
                type: object
                description: >-
                  Represents a single expected field entry, providing its API
                  name and the JSON path at which it was anticipated within the
                  filter expression.
                additionalProperties: false
                required:
                  - api_name
                  - json_path
                properties:
                  api_name:
                    type: string
                    description: >-
                      Represents the API name of a field expected to be present
                      in the filter object.
                    maxLength: 256
                  json_path:
                    type: string
                    description: >-
                      Indicates the JSON path at which the expected field should
                      be present within the filter object.
                    maxLength: 512
            param_name:
              type: string
              description: >-
                Indicates the name of the filter parameter associated with the
                empty filter object error. This field is a filter-specific
                extension to the standard error detail structure.
              maxLength: 256
        message:
          type: string
          description: >-
            Contains a descriptive message summarizing the empty filter object
            error.
          maxLength: 512
        status:
          type: string
          enum:
            - error
          description: >-
            Represents the outcome status of the API response.

            Possible values:

            **error** - The request failed because the filter object did not
            contain any of the expected fields.
    FilterMandatoryNotFound:
      x-zs-$id: FilterMandatoryNotFound
      type: object
      description: >-
        Represents an error response returned when a mandatory field required by
        the filter criteria is absent from the request. Includes a
        filter-specific param_name field that extends the standard
        MANDATORY_NOT_FOUND error structure.
      additionalProperties: false
      required:
        - code
        - details
        - message
        - status
      properties:
        code:
          type: string
          description: >-
            Indicates the error code identifying the category of failure.

            Possible values:

            **MANDATORY_NOT_FOUND** - A mandatory field was absent from the
            filter criteria.
          enum:
            - MANDATORY_NOT_FOUND
        details:
          type: object
          description: >-
            Contains detailed information identifying the mandatory field that
            is absent from the request, including its API name, JSON path
            location, and, as a filter-specific extension, its parameter name.
          additionalProperties: false
          required:
            - api_name
            - json_path
            - param_name
          properties:
            api_name:
              type: string
              description: >-
                Represents the API name of the mandatory field that was not
                found in the filter criteria.
              maxLength: 256
            json_path:
              type: string
              description: >-
                Represents the JSON path locating the mandatory field that is
                missing from the filter criteria.
              maxLength: 512
            param_name:
              type: string
              description: >-
                Represents the parameter name associated with the missing
                mandatory field, as a filter-specific extension to the standard
                error detail.
              maxLength: 256
        message:
          type: string
          description: >-
            Contains a brief error message describing which mandatory field was
            not found in the filter criteria.
          maxLength: 512
        status:
          type: string
          enum:
            - error
          description: >-
            Indicates the outcome status of the response.

            Possible values:

            **error** - The request failed because a mandatory field was absent
            from the filter criteria.
    FilterInvalidComparator:
      x-zs-$id: FilterInvalidComparator
      type: object
      description: >-
        Represents an error response returned when a filter field is provided
        with a comparator operator that is not supported for that field. The
        error code is INVALID_DATA.
      additionalProperties: false
      required:
        - code
        - details
        - message
        - status
      properties:
        code:
          type: string
          description: >-
            Indicates the category of error associated with this response.

            Possible values:

            **INVALID_DATA** - An unsupported comparator operator was provided
            for the filter field.
          enum:
            - INVALID_DATA
        details:
          type: object
          description: >-
            Contains structured details identifying the filter field that
            received an unsupported comparator, including its location,
            parameter name, and the list of valid comparator values accepted for
            that field.
          additionalProperties: false
          required:
            - api_name
            - json_path
            - param_name
            - supported_values
          properties:
            api_name:
              type: string
              description: >-
                Represents the API name of the filter field to which an
                unsupported comparator operator was applied.
              maxLength: 256
            json_path:
              type: string
              description: >-
                Represents the JSON path locating the specific filter field
                within the request payload that carries the unsupported
                comparator operator.
              maxLength: 512
            param_name:
              type: string
              description: >-
                Indicates the name of the filter parameter whose comparator was
                rejected, scoped as a filter-specific extension to the standard
                error detail.
              maxLength: 256
            supported_values:
              type: array
              minItems: 1
              maxItems: 100
              uniqueItems: true
              items:
                description: >-
                  Represents a single comparator value that is valid and
                  accepted for the associated filter field.
                type: string
                maxLength: 256
              description: >-
                Contains the list of comparator values that are valid for the
                offending filter field.
        message:
          type: string
          description: >-
            Contains a descriptive summary of the invalid-comparator error,
            identifying the rejected operator and the affected filter parameter.
          maxLength: 512
        status:
          type: string
          enum:
            - error
          description: |-
            Indicates the overall outcome of the request.
            Possible values:
            **error** - The request failed due to an invalid filter comparator.
    FilterFieldComparatorValueMissing:
      x-zs-$id: FilterFieldComparatorValueMissing
      type: object
      description: >-
        Represents an error response returned when a filter field that requires
        a comparator value is submitted without one, typically because a
        required upstream dependee field is absent from the filter expression.
      additionalProperties: false
      required:
        - code
        - details
        - message
        - status
      properties:
        code:
          type: string
          description: >-
            Indicates the error classification assigned to this response.

            Possible values:

            **DEPENDENT_FIELD_MISSING** - A filter field's required comparator
            value is absent because its upstream dependee field was not supplied
            in the filter criteria.
          enum:
            - DEPENDENT_FIELD_MISSING
        details:
          type: object
          description: >-
            Contains structured details about the missing comparator value
            error, identifying the field in error, the upstream dependee field
            that constrains it, and the filter parameter context in which the
            violation occurred.
          additionalProperties: false
          required:
            - dependee
            - api_name
            - json_path
            - param_name
          properties:
            dependee:
              type: object
              description: >-
                Represents the upstream field whose value constrains the
                comparator requirements of the field currently in error.
                Contains the API name and JSONPath location of that upstream
                dependee field within the filter expression.
              additionalProperties: false
              required:
                - api_name
                - json_path
              properties:
                api_name:
                  type: string
                  description: >-
                    Indicates the API name of the upstream dependee field whose
                    value constrains the comparator requirements of the field
                    currently in error.
                  maxLength: 256
                json_path:
                  type: string
                  description: >-
                    Indicates the JSONPath location of the upstream dependee
                    field within the filter expression.
                  maxLength: 512
            api_name:
              type: string
              description: >-
                Indicates the API name of the filter field whose comparator
                value is absent, identifying which field in the filter
                expression triggered the error.
              maxLength: 256
            json_path:
              type: string
              description: >-
                Indicates the JSONPath location of the field in error within the
                filter expression, pinpointing where the missing comparator
                value was detected.
              maxLength: 512
            param_name:
              type: string
              description: >-
                Indicates the name of the filter parameter that carries the
                filter criteria in which the missing comparator value was
                detected.
              maxLength: 256
        message:
          type: string
          description: >-
            Contains a descriptive message summarizing the missing comparator
            value error.
          maxLength: 512
        status:
          type: string
          enum:
            - error
          description: >-
            Represents the outcome status of the response.

            Possible values:

            **error** - The request failed because a required comparator value
            was absent from the filter criteria.
    FilterFieldComparatorMismatch:
      x-zs-$id: FilterFieldComparatorMismatch
      type: object
      description: >-
        Represents an error response returned when a filter field's comparator
        value does not match any of the values permitted by the upstream
        dependee field's value. Contains the offending field's API name and
        JSONPath location, the dependee field's identity, the filter parameter
        context, and the list of supported comparator values.
      additionalProperties: false
      required:
        - code
        - details
        - message
        - status
      properties:
        code:
          type: string
          description: >-
            Indicates the error type for this response.

            Possible values:

            **DEPENDENT_MISMATCH** - The comparator supplied for the field does
            not match the set of comparators permitted given the current value
            of the dependee field.
          enum:
            - DEPENDENT_MISMATCH
        details:
          type: object
          description: >-
            Contains structured details about the comparator mismatch,
            identifying the field in error, the upstream dependee field whose
            value constrains valid comparators, and the set of comparator values
            that are permitted.
          additionalProperties: false
          required:
            - dependee
            - api_name
            - json_path
            - supported_values
            - param_name
          properties:
            dependee:
              type: object
              description: >-
                Represents the upstream field whose current value determines
                which comparators are valid for the field identified in
                `api_name`. Contains the upstream field's API name and its
                location within the filter expression.
              additionalProperties: false
              required:
                - api_name
                - json_path
              properties:
                api_name:
                  type: string
                  description: >-
                    Indicates the API name of the upstream dependee field whose
                    value constrains the set of comparators permitted for the
                    field currently in error.
                  maxLength: 256
                json_path:
                  type: string
                  description: >-
                    Contains the JSONPath expression locating the dependee field
                    within the filter expression submitted in the request.
                  maxLength: 512
            api_name:
              type: string
              description: >-
                Indicates the API name of the field whose supplied comparator
                value does not match the comparators permitted given the current
                value of the dependee field.
              maxLength: 256
            json_path:
              type: string
              description: >-
                Contains the JSONPath expression locating the field in error
                within the filter expression submitted in the request.
              maxLength: 512
            supported_values:
              type: array
              minItems: 1
              maxItems: 100
              uniqueItems: true
              items:
                description: >-
                  Represents a single comparator value that is valid for the
                  field in error given the current value of the dependee field.
                type: string
                maxLength: 256
              description: >-
                Contains the complete set of comparator values that are
                permitted for the field in error, as determined by the current
                value of the dependee field.
            param_name:
              type: string
              description: >-
                Indicates the name of the filter query parameter that carries
                the filter expression containing the comparator mismatch.
              maxLength: 256
        message:
          type: string
          description: >-
            Represents a short, descriptive summary of the comparator-field
            dependency violation.
          maxLength: 512
        status:
          type: string
          enum:
            - error
          description: >-
            Indicates the outcome of the request.

            Possible values:

            **error** - The request failed due to a comparator value mismatch in
            the filter criteria.
    FilterFieldValueMismatch:
      x-zs-$id: FilterFieldValueMismatch
      type: object
      description: >-
        Represents the error response returned when a filter field's value
        carries a data type that does not satisfy the requirement imposed by its
        dependee field's current value.
      additionalProperties: false
      required:
        - code
        - details
        - message
        - status
      properties:
        code:
          type: string
          description: >-
            Indicates the category of error associated with this response.

            Possible values:

            **DEPENDENT_MISMATCH** - A filter field's value has a data type that
            conflicts with the requirement set by the dependee field.
          enum:
            - DEPENDENT_MISMATCH
        details:
          type: object
          description: >-
            Contains diagnostic details identifying the offending filter field,
            its expected data type, the dependee field that governs that
            expectation, and the filter parameter in which the mismatch was
            detected.
          additionalProperties: false
          required:
            - dependee
