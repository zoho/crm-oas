      additionalProperties: false
      required:
        - code
        - details
        - message
        - status
      properties:
        code:
          type: string
          description: >-
            Represents the error code that identifies the category of failure
            for this error response.

            Possible values:

            DEPENDENT_FIELD_MISSING - Indicates that the comparator value
            required from the dependee criterion field is absent, preventing the
            comparator from being evaluated.
          enum:
            - DEPENDENT_FIELD_MISSING
        details:
          type: object
          description: >-
            Contains detailed information about the criterion field that caused
            the error and the dependee field whose comparator value is missing,
            including the API name and JSON path for each.
          additionalProperties: false
          required:
            - dependee
            - api_name
            - json_path
          properties:
            dependee:
              type: object
              description: >-
                Represents the dependee criterion field — that is, the field
                whose value determines what the current comparator accepts — and
                whose missing comparator value triggered this error. Contains
                the API name and JSON path of that dependee field.
              additionalProperties: false
              required:
                - api_name
                - json_path
              properties:
                api_name:
                  type: string
                  description: >-
