              description: >-
                Represents the field reference constraint that requires the
                api_name property to be present for the range filter criterion.
              required:
                - api_name
          unevaluatedProperties: false
          description: >-
            Represents the target field definition to which the range filter
            criterion is applied, conforming to the base field structure.
        comparator:
          type: string
          enum:
            - between
            - not_between
          description: >-
            Represents the range comparison operator applied to the criterion,
            indicating whether the field value falls within or outside the
            specified bounds.

            Possible values:

            between - Matches records where the field value falls within the
            specified range.

            not_between - Matches records where the field value falls outside
            the specified range.
        value:
          type: array
          x-zs-$id: BetweenFilterCriterionRequestValueArray
          description: >-
            Contains the two boundary values — [lower_bound, upper_bound] —
            against which the field is evaluated for the between or not_between
            comparator.
          minItems: 2
          maxItems: 2
          items:
            x-zs-$id: BetweenFilterCriterionRequestValueArrayItems
