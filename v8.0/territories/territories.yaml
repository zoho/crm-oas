      type: object
      x-zs-$id: LookupLimitExceeded
      description: >-
        Represents the error response returned when the count of lookup fields
        used in criterion expressions exceeds the allowed limit. The error code
        is LOOKUP_LIMIT_EXCEEDED. The details object contains a used_in array
        (minItems: 1, maxItems: 10) in which each entry identifies an affected
        location by name and provides the relevant lookup fields and the
        applicable lookup limit.
      additionalProperties: false
      required:
        - code
        - details
        - message
        - status
      properties:
        code:
          type: string
          description: >-
            Identifies the error code that signals the lookup field limit has
            been exceeded. Possible values: LOOKUP_LIMIT_EXCEEDED.
          enum:
            - LOOKUP_LIMIT_EXCEEDED
        details:
          type: object
          description: >-
            Provides structured information about the locations where the lookup
            field count exceeded the allowed limit. The required used_in array
            contains objects that each specify a location name (such as
            "criteria" or "cross_filters"), the lookup fields in use, and the
            applicable lookup limit.
          additionalProperties: false
          required:
            - used_in
          properties:
            used_in:
              type: array
              description: >-
                Lists the locations (for example, "criteria" or "cross_filters")
                where lookup field usage exceeded the allowed limit. Each entry
                in the array contains a location name, the lookup fields
                involved, and the applicable lookup limit. The array contains
                between 1 and 10 items.
              minItems: 1
              maxItems: 10
              items:
                type: object
                additionalProperties: false
                description: >-
                  Represents one location — such as criteria or cross_filters —
                  where lookup field usage has exceeded the allowed limit. Each
                  entry identifies the location by name, lists the offending
                  lookup fields, and specifies the maximum number of lookup
                  fields permitted in that location.
                required:
                  - name
                  - lookup_fields
                  - lookup_limit
                properties:
                  name:
                    type: string
                    description: >-
                      Identifies the location — such as criteria or
                      cross_filters — where the lookup field count exceeded the
                      allowed limit.
                    maxLength: 256
                  lookup_fields:
                    type: array
                    description: >-
                      Lists the lookup fields present in the specified location
                      that contributed to exceeding the allowed lookup field
                      limit. Contains between 1 and 100 entries, each
                      identifying a single lookup field by its API name.
                    minItems: 1
                    maxItems: 100
                    items:
                      type: object
                      additionalProperties: false
                      description: >-
                        Represents one lookup field used in the specified
                        criterion location that was counted against the lookup
                        field limit. Each entry exposes the API name of the
                        offending field.
                      required:
                        - api_name
                      properties:
                        api_name:
                          type: string
                          description: >-
                            Specifies the API name of a lookup field that was
                            counted against the lookup field limit for the
                            specified location.
                          maxLength: 256
                  lookup_limit:
                    type: integer
                    description: >-
                      Specifies the maximum number of lookup fields permitted in
                      the associated location, such as criteria or
                      cross_filters.
                    format: int32
        message:
          type: string
          description: >-
            Contains a descriptive error message explaining why the lookup field
            limit was exceeded.
          maxLength: 512
        status:
          type: string
          enum:
            - error
          description: 'Indicates the outcome of the request. Possible values: error.'
    NotSupportedApiName:
      type: object
      x-zs-$id: NotSupportedApiName
      description: >-
        Represents the error response returned when the API name specified in a
        criterion field is not supported by the target module. Contains the
        error code, a descriptive message, the response status, and details
        identifying the unsupported field and its location in the request body.
      additionalProperties: false
      required:
        - code
        - details
        - message
        - status
      properties:
        code:
          type: string
          description: >-
            Represents the error code that identifies the category of validation
            failure.

            Possible values:

            NOT_SUPPORTED - Indicates that the API name specified for the
            criterion field is not supported by the target module.
          enum:
            - NOT_SUPPORTED
        details:
          type: object
          description: >-
            Contains detailed information identifying the criterion field whose
            API name is not supported by the target module, including the field
            API name and its location within the request body.
          additionalProperties: false
          required:
            - api_name
            - json_path
          properties:
            api_name:
              type: string
              description: >-
                Represents the API name of the criterion field that is not
                supported by the target module.
              maxLength: 256
            json_path:
              type: string
              description: >-
                Represents the JSON path that locates the unsupported criterion
                field within the request body.
              maxLength: 512
        message:
          type: string
          description: >-
            Represents the error message describing why the criterion field API
            name is not supported by the target module.
          maxLength: 512
        status:
          type: string
          enum:
            - error
          description: >-
            Represents the outcome status of the response for this error
            condition.

            Possible values:

            error - Indicates the request failed because the specified criterion
            field API name is not supported by the target module.
    FieldNotSupportedInCriteria:
      type: object
      x-zs-$id: FieldNotSupportedInCriteria
      description: >-
        Represents the error response returned when a criterion field type is
        not supported in filter criteria. Field types such as file upload and
        image upload cannot be used as filter criteria fields. The error code is
        INVALID_DATA. The details object identifies the unsupported field via
        its api_name and json_path.
      additionalProperties: false
      required:
        - code
        - details
        - message
        - status
      properties:
        code:
          type: string
          description: >-
            Indicates the classification of the error returned by the API.


            Possible values:

            INVALID_DATA - The request contains a criterion field whose type is
            not supported in filter criteria.
          enum:
            - INVALID_DATA
        details:
          type: object
          description: >-
            Contains detailed information identifying the unsupported criterion
            field. The api_name property specifies the API name of the offending
            field, and the json_path property locates it within the request
            body.
          additionalProperties: false
          required:
            - api_name
            - json_path
          properties:
            api_name:
              type: string
              description: >-
                Specifies the API name of the criterion field whose type is not
                supported in filter criteria.
              maxLength: 256
            json_path:
              type: string
              description: >-
                Specifies the JSON path that locates the unsupported criterion
                field within the request body.
              maxLength: 512
        message:
          type: string
          description: >-
            Provides a fixed descriptive message identifying the unsupported
            criterion field.


            Possible values:

            "The given field api_name is not supported in criteria" - Indicates
            that the field identified by api_name cannot be used in filter
            criteria.
          enum:
            - The given field api_name is not supported in criteria
        status:
          type: string
          enum:
            - error
          description: >-
            Indicates the outcome status of the API response.


            Possible values:

            error - The request failed because the specified criterion field
            type is not supported in filter criteria.
    MandatoryNotFound:
      type: object
      x-zs-$id: MandatoryNotFound
      description: >-
        Error schema returned when a mandatory criterion field is absent from
        the request. The error code MANDATORY_NOT_FOUND is issued, and the
        details object identifies the missing field via its api_name and
        json_path properties.
      additionalProperties: false
      required:
        - code
        - details
        - message
        - status
      properties:
        code:
          type: string
          description: >-
            Error code identifying the category of error.


            Possible values:

            MANDATORY_NOT_FOUND - Indicates that a required criterion field was
            absent from the request.
          enum:
            - MANDATORY_NOT_FOUND
        details:
          type: object
          description: >-
            Object identifying the mandatory criterion field that is absent from
            the request. Contains the api_name of the missing field and the
            json_path indicating its expected location in the request body.
          additionalProperties: false
          required:
            - api_name
            - json_path
          properties:
            api_name:
              type: string
              description: >-
                API name of the criterion field that is required but was not
                found in the request.
              maxLength: 256
            json_path:
              type: string
              description: >-
                JSON path to the location in the request body where the
                mandatory criterion field was expected but not found.
              maxLength: 512
        message:
          type: string
          description: >-
            Error message describing the mandatory field not found condition
            returned in the response envelope.
          maxLength: 512
        status:
          type: string
          enum:
            - error
          description: >-
            Status of the error response.


            Possible values:

            error - Indicates that the request failed because a mandatory
            criterion field was not found.
