                        maxLength: 256
                      json_path:
                        type: string
                        description: >-
                          Represents the JSON path pointing to the field with
                          invalid data.
                        maxLength: 512
                      supported_values:
                        type: array
                        items:
                          type: string
                          description: Represents a single supported value for the field.
