                  maxLength: 512
            api_name:
              type: string
              description: >-
                API name of the criterion field whose value does not match the
                expected data type.
              maxLength: 256
            json_path:
              type: string
              description: >-
                JSON path locating the criterion field whose value contains the
                data type mismatch.
              maxLength: 512
            expected_data_type:
              type: string
              description: >-
                Data type expected for the criterion field value, as determined
                by the dependee field.
              maxLength: 256
        message:
          type: string
          description: >-
            Descriptive message providing details about the field value mismatch
