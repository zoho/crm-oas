            application/json:
              schema:
                x-zs-$id: ScheduledRunRuleJobsBadRequestError
                oneOf:
                  - $ref: '#/components/schemas/TerritoryFeatureNotEnabledError'
                  - $ref: >-
                      #/components/schemas/ScheduledRunRuleJobsRequiredParamMissing
                description: >
                  Represents the error response for a 400 Bad Request, which
                  occurs when the territory feature is not enabled or the
                  required **job_id** parameter is missing.
              examples:
                TerritoryNotYetEnabled:
                  summary: Territory management not yet enabled error
                  value:
                    code: FEATURE_NOT_ENABLED
                    details: {}
                    message: Territory Management is not enabled
                    status: error
                TerritoryDisabled:
                  summary: Territory management disabled error
                  value:
                    code: FEATURE_NOT_ENABLED
                    details: {}
                    message: Territory Management is disabled
                    status: error
                RequiredParamMissing:
                  summary: Required parameter job_id missing from the request
                  value:
                    code: REQUIRED_PARAM_MISSING
                    details:
                      param_name: job_id
                    message: One of the expected parameter is missing
                    status: error
        '401':
          description: >-
            Authentication failed for the request.

            **Resolution:** A new access token must be generated with the
            required scope for this API.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
              examples:
                AuthenticationFailure:
                  summary: Authentication failure error
                  value:
                    code: AUTHENTICATION_FAILURE
                    details: {}
                    message: Authentication failed
