              required:
                - api_name
                - json_path
              properties:
                api_name:
                  type: string
                  description: >-
                    API name of the dependee field that determines the expected
                    data type for the criterion field in error.
                  maxLength: 256
                json_path:
                  type: string
                  description: >-
                    JSON path locating the dependee field within the request
