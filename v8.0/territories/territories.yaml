              count:
                type: integer
                format: int32
                description: >-
                  Represents the total number of users associated with the
                  territory.
                minimum: 0
              territory:
                type: object
                properties:
                  id:
                    type: string
                    description: Represents the unique identifier of the territory.
                    format: int64
                  name:
                    type: string
                    maxLength: 50
                    description: Represents the display name of the territory.
                required:
                  - id
                  - name
                description: >-
                  Represents the territory object associated with the user
                  count.
                additionalProperties: false
            required:
              - count
              - territory
