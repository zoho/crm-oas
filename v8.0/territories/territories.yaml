        - $ref: '#/components/schemas/SimpleFilterCriterionValueObjectBase'
        - type: object
          additionalProperties: true
          description: >-
            Represents the constraint that both the ID and name properties are
            required for the lookup object filter criterion value in response
            bodies.
          required:
            - id
            - name
          properties:
            id: {}
            name: {}
      unevaluatedProperties: false
      description: >-
        Represents a lookup object filter criterion value for response bodies,
        applicable when the field's data_type is lookup, ownerlookup, or
        userlookup. Both the ID and name properties are included.
    EqualFilterCriterionResponse:
      type: object
