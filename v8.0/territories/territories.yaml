      additionalProperties: false
      required:
        - code
        - details
        - message
        - status
      properties:
        code:
          type: string
          description: >-
            Error code identifying the type of field comparator mismatch
            condition. Possible values: DEPENDENT_MISMATCH.
          enum:
            - DEPENDENT_MISMATCH
        details:
          type: object
          description: >-
            Detailed information about the field comparator mismatch, including
            the API name and JSON path of the criterion field in error, the
            dependee field that governs valid comparator values, and the array
            of supported comparator values.
          additionalProperties: false
          required:
            - dependee
            - api_name
            - json_path
            - supported_values
          properties:
            dependee:
              type: object
              description: >-
                The dependee field whose value determines which comparator
                values are valid for the criterion field that raised the
                DEPENDENT_MISMATCH error. Contains the API name and JSON path of
                the dependee field.
              additionalProperties: false
              required:
                - api_name
                - json_path
              properties:
                api_name:
                  type: string
                  description: >-
                    API name of the dependee field that determines the valid
                    comparator values for the criterion field in error.
                  maxLength: 256
                json_path:
                  type: string
                  description: >-
                    JSON path locating the dependee field within the request
                    body.
                  maxLength: 512
            api_name:
              type: string
              description: >-
                Represents the API name of the criterion field whose comparator
                value does not match any of the supported values determined by
                the dependee field.
              maxLength: 256
            json_path:
              type: string
              description: >-
                Represents the JSON path locating the criterion field whose
                comparator value does not match any of the supported values
                determined by the dependee field.
              maxLength: 512
            supported_values:
              type: array
              items:
                type: string
                description: >-
                  Represents one supported comparator value valid for the
                  criterion field, as determined by the dependee field.
                maxLength: 256
              minItems: 1
              maxItems: 100
              description: >-
                Contains the comparator values that are valid for the criterion
                field, as determined by the dependee field.
        message:
          type: string
          description: >-
            Represents the error message describing the comparator mismatch
            condition for the criterion field.
          maxLength: 512
        status:
          type: string
          enum:
            - error
          description: 'Represents the status of the error response. Possible values: error.'
    FieldValueMismatch:
