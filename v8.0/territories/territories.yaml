            territories:
              type: array
              items:
                $ref: '#/components/schemas/TerritoryGETSchema'
                description: >-
                  Individual territory object containing detailed information
                  about the territory.
              description: >-
                Represents the list of territory objects returned in the
                paginated response.
              maxItems: 200
              minItems: 1
            info:
              $ref: '#/components/schemas/InfoSchema'
              x-zs-$id: InfoGET
              description: Pagination metadata for the response.
          required:
            - territories
            - info
