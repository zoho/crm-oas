                **FEATURE_NOT_ENABLED**.
            details:
              type: object
              description: Represents additional details about the error.
              additionalProperties: false
            message:
              type: string
              description: >-
                Represents the error message returned when the territory deal
                rule is not enabled. Possible values: **Territory Deal Rule
                Disabled**.
              maxLength: 100
              enum:
                - Territory Deal Rule Disabled
            status:
              type: string
              enum:
                - error
              description: >-
                Represents the status of the operation. Possible values:
                **error**.
          required:
            - code
            - details
            - message
            - status
      required:
        - run_rules
      description: >-
        Represents the error response when the territory deal rule is not
        enabled.
      additionalProperties: false
    TerritoryCriteriaError:
      x-zs-$id: TerritoryCriteriaError
      title: Territory Criteria Validation Error
