      required:
        - code
        - details
        - message
        - status
      properties:
        code:
          type: string
          description: >-
            Error code identifying the category of error. Possible values:
            INVALID_DATA.
          enum:
            - INVALID_DATA
        details:
          type: object
          description: >-
            Contains structured information about the invalid comparator error.
            Identifies the offending criterion field by API name and JSON path,
            and provides the list of supported comparator values valid for the
            given field type.
          additionalProperties: false
          required:
            - api_name
            - json_path
            - supported_values
          properties:
            api_name:
              type: string
              description: >-
