    AuditLogAuditedTimeBetweenCriterion:
      type: object
      x-zs-$id: AuditLogAuditedTimeBetweenCriterion
      description: >-
        Match audit log entries audited within a time range. The range must not
        exceed 180 days.
      properties:
        field:
          type: object
          description: Field to apply the filter on.
          properties:
            api_name:
              type: string
              description: API name of the field.
              enum:
                - audited_time
          required:
            - api_name
          additionalProperties: false
        comparator:
          type: string
          description: Comparison operator.
          enum:
            - between
        value:
          type: array
          description: Start and end of the range, as exactly two ISO 8601 timestamps.
          minItems: 2
          maxItems: 2
          items:
            type: string
            description: An ISO 8601 timestamp.
            format: date-time
      required:
        - field
        - comparator
        - value
      additionalProperties: false
