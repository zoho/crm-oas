      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://accounts.zoho.com/oauth/v2/auth
          tokenUrl: https://accounts.zoho.com/oauth/v2/token
          refreshUrl: https://accounts.zoho.com/oauth/v2/token
          scopes:
            ZohoCRM.settings.audit_logs.CREATE: Grants permission to create audit log export jobs in Zoho CRM.
            ZohoCRM.settings.audit_logs.READ: >-
              Grants permission to retrieve audit log export jobs and their
              details from Zoho CRM.
