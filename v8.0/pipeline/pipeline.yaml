  /settings/pipeline/actions/transfer:
    post:
      security:
        - OAuth2:
            - ZohoCRM.settings.pipeline.CREATE
      description: >-
        Transfer records and stage mappings from one pipeline to another in the
        specified layout, and delete the source pipeline after the transfer is
        scheduled.
      summary: Transfer Pipeline
      operationId: transferAndDeletePipelines
      x-zs-llm-description: >-
        Irreversible: the source pipeline (pipeline.from) is deleted once the
        transfer job is scheduled — the response returns only a job_id, not
        immediate completion. Every stage belonging to the source pipeline must
        appear in the stages array with a valid target stage from the
        destination pipeline; an unmapped source stage causes the request to
        fail. Use the Get Pipelines API beforehand to enumerate the source
        pipeline's stage IDs and the destination pipeline's stage IDs.
      parameters:
        - $ref: '#/components/parameters/LayoutID'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PipelineTransferResponse'
            examples:
              PipelineTransferRequest:
                value:
                  transfer_pipeline:
                    - pipeline:
                        from: '2766660000056473266'
                        to: '2766660000056473305'
                      stages:
                        - from: '2766660000000007104'
                          to: '2766660000000007104'
                        - from: '2766660000000007106'
                          to: '2766660000000007106'
                        - from: '2766660000000007110'
                          to: '2766660000000007104'
                        - from: '2766660000000007112'
                          to: '2766660000000007106'
                        - from: '2766660000000007114'
                          to: '2766660000000007104'
                        - from: '2766660000030928184'
                          to: '2766660000000007104'
                        - from: '2766660000030928185'
                          to: '2766660000000007106'
                        - from: '2766660000030928272'
                          to: '2766660000000007104'
        required: true
      responses:
        '200':
          description: >-
            The pipeline transfer and delete operation was scheduled
            successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelineTransferSuccessResponse'
              examples:
                PipelineTransferResponseSuccess:
                  value:
                    transfer_pipeline:
                      - code: SUCCESS
                        details:
                          job_id: '2766660000056808404'
                        message: transfer pipeline scheduled successfully
                        status: success
        '400':
          description: >-
            The request is invalid due to invalid source or target pipeline or
            stage IDs, duplicate stage mappings, invalid layout_id, missing
            required fields, or a transfer that is already scheduled.
          content:
            application/json:
              schema:
                x-zs-$id: PipelineTransfer400ErrorResponse
                x-zs-llm-description: >-
                  Response matches PipelineGetErrorResponse when layout_id is
                  invalid, otherwise PipelineTransferErrorResponse for
                  transfer-specific validation failures (invalid source/target
                  pipeline or stage id, duplicate stage mapping,
