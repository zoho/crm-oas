      properties:
        code:
          enum:
            - INVALID_DATA
          type: string
          description: >-
            Represents the error code indicating the type of error (e.g.,
            'INVALID_DATA', 'RESOURCE_NOT_FOUND').
          example: INVALID_DATA
        details:
          type: object
          description: >-
            Additional context about the specific error, typically identifying
            the problematic parameter.
          properties:
            param_name:
              format: string
              type: string
              enum:
                - layout_id
              description: Name of the parameter that caused the validation error.
              example: layout_id
          required:
            - param_name
          additionalProperties: false
        message:
          format: string
          type: string
          description: Represents the error messsage.
          example: Invalid layoutid
        status:
          type: string
          description: Overall status indicator ('error' or 'success').
          enum:
            - error
          example: error
      required:
        - code
        - details
        - message
        - status
      additionalProperties: false
    PipelineCreateErrorResponse:
      x-zs-$id: PipelineCreateErrorResponse
      type: object
      description: >-
        Batch error response for pipeline operations maintaining 1:1
        correspondence with request items when validation fails.
      properties:
        pipeline:
          maxItems: 1
