components:
  parameters:
    Id:
      description: >-
        Specify the Pipeline ID. Use the [Get Pipeline
        API](pipeline.yaml#$.paths./settings/pipeline.get) to get the Pipeline
        ID.
      name: pipelineIdentifier
      in: path
      required: true
      schema:
        format: int64
        type: string
    LayoutID:
      description: >-
        Specify the Layout ID of the Deals module. Use the [Get Layouts Metadata
        API](layouts.yaml#$.paths./settings/layouts.get) to retrieve the Layout
        ID.
      name: layout_id
      in: query
      required: true
      x-zs-llm-description: >-
        ID of the Deals module layout. Pipelines are configured per layout, so
        the layout must be resolved via the Get Layouts Metadata API before
        calling this endpoint. Required for all pipeline operations.
      schema:
        format: int64
        type: string
        x-zs-$ref:
          resource: layouts
          origins:
            - operationId: getLayouts
              propertyId: LayoutId
        pattern: ^[0-9]{1,19}$
        minLength: 1
        maxLength: 19
        description: >-
          Represents a unique numeric identifier for a CRM entity, expressed as
          a 64-bit integer serialized as a string to preserve precision in JSON.
        example: '4832675000000850800'
  schemas:
    PipelineGetResponse:
      x-zs-$id: PipelineGetResponse
      additionalProperties: false
      type: object
      description: >-
        Root response object containing all pipeline configurations configured
        for a given Deals layout in Zoho CRM.
      properties:
        pipeline:
          minItems: 1
          maxItems: 90
          type: array
          description: Array of pipeline configuration items.
          items:
            additionalProperties: false
            type: object
            description: >-
              Picklist option representing a pipeline configuration with
              associated stage mappings.
            properties:
              display_value:
                format: string
                type: string
                description: Display name of the picklist value as shown to users.
                example: Standard (Standard)
              default:
                type: boolean
                description: Indicates if this is the default picklist value.
                example: true
              maps:
                minItems: 1
                maxItems: 200
                type: array
                description: Array of stage mappings for this picklist value.
                items:
                  type: object
                  additionalProperties: false
                  description: >-
                    Mapping between a picklist value and a specific pipeline
                    stage, including its position and forecasting details.
                  properties:
                    display_value:
                      format: string
                      type: string
                      description: User-facing display name of the pipeline stage.
                      example: Needs Analysis
                    sequence_number:
                      format: int32
                      type: integer
                      description: >-
                        Position of this stage in the pipeline sequence (1-based
                        indexing).
                      example: 1
                    colour_code:
                      format: string
                      type: string
                      description: >-
                        Hexadecimal color code associated with the stage for UI
                        representation.
                      example: '#FF5733'
                    forecast_category:
                      type: object
                      additionalProperties: false
                      description: >-
                        Represents a forecast category used in sales pipeline
                        stages for revenue forecasting and reporting.
                      properties:
                        name:
                          format: string
                          type: string
                          description: >-
                            Represents the name of the forecast category (e.g.,
                            'Pipeline', 'Closed', 'Omitted').
                          example: Pipeline
                        id:
                          format: int64
                          type: string
                          description: Unique system identifier for the forecast category.
                          example: '2766660000000007092'
                      required:
                        - name
                        - id
                    actual_value:
                      format: string
                      type: string
                      description: Internal system value/API name for the stage.
                      example: Needs Analysis
                    id:
                      format: int64
                      type: string
                      description: Unique identifier for this stage mapping.
                      example: '2766660000000007106'
                    forecast_type:
                      format: string
                      type: string
                      description: >-
                        Forecast type indicating stage status (e.g., 'Open',
                        'Closed Won', 'Closed Lost').
                      example: Open
                  required:
                    - display_value
                    - sequence_number
                    - forecast_category
                    - actual_value
                    - id
                    - forecast_type
              actual_value:
                format: string
                type: string
                description: Internal API value for the picklist option.
                example: Standard (Standard)
              id:
                format: int64
                type: string
                description: Unique identifier for this picklist value.
                example: '2766660000054211007'
                x-zs-$id: PipelineId
            required:
              - display_value
              - maps
              - actual_value
              - id
      required:
        - pipeline
    PipelineCreateRequest:
      type: object
      description: >-
        Request body for creating a pipeline configuration with a custom
        pipeline label and mapped stage values for a specific Deals layout.
      x-zs-llm-description: >-
        The pipeline array accepts exactly 1 item (minItems and maxItems are
        both 1) — one request creates one pipeline. Each maps[].id must
        reference an existing stage ID already defined on the layout.
      properties:
        pipeline:
          type: array
          description: Array of pipeline picklist configurations to create or update.
          minItems: 1
          maxItems: 1
          items:
            type: object
            description: >-
              Picklist value configuration for pipeline customization, including
              stage mappings.
            properties:
              display_value:
                format: string
                type: string
                description: User-facing display name for the picklist value.
                example: adfadf12adf
              default:
                type: boolean
                description: >-
                  Indicates if this picklist value should be set as the default
                  option.
                example: false
              maps:
                type: array
                description: >-
                  Array of stage mappings defining which stages this picklist
                  value connects to and their sequence.
                minItems: 1
                maxItems: 200
                items:
                  type: object
                  description: >-
                    Mapping configuration for associating a picklist value with
                    a specific pipeline stage.
                  properties:
                    id:
                      format: int64
                      type: string
                      description: Unique identifier of the target pipeline stage to map.
                      example: '2766660000000007106'
                    display_value:
                      format: string
                      type: string
                      description: User-facing display name for the pipeline stage.
                      example: Needs Analysis
                    sequence_number:
                      format: int32
                      type: integer
                      description: >-
                        Optional position of this stage mapping in the pipeline
                        sequence (overrides default positioning).
                      example: 2
                  required:
                    - id
                  additionalProperties: false
            required:
              - display_value
              - maps
            additionalProperties: false
      required:
        - pipeline
      additionalProperties: false
    PipelineUpdateOrDeleteUrlErrorResponse:
      additionalProperties: false
      x-zs-$id: PipelineUpdateOrDeleteUrlErrorResponse
      type: object
      description: Invalid pipeline error response
      properties:
        code:
          enum:
            - INVALID_DATA
          type: string
          description: >-
            The error code indicating the type of error (e.g., 'INVALID_DATA',
            'RESOURCE_NOT_FOUND').
          example: INVALID_DATA
        details:
          type: object
          description: >-
            Additional context about the specific error, typically identifying
            the problematic parameter.
          properties:
            resource_path_index:
              format: int32
              type: integer
              description: >-
                Unique identifier of the pipeline that caused the validation
