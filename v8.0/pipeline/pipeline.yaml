    PipelineUpdateRequestUrl:
      type: object
      description: >-
        Request body for updating or creating pipeline configurations with
        custom picklist values and stage mappings.
      x-zs-llm-description: >-
        Used only by the by-ID PATCH/PUT operations (path parameter identifies
        the pipeline), so items in this schema have no id field. To delete the
        pipeline, set _delete.permanent on the item instead of
        display_value/maps; to delete a specific stage, set _delete.permanent on
        that maps entry.
      properties:
        pipeline:
          type: array
          description: Array of pipeline picklist configurations to create or update.
          minItems: 1
          maxItems: 1
          items:
            type: object
            description: >-
              Picklist value configuration for pipeline customization, including
              stage mappings.
            properties:
              display_value:
                format: string
                type: string
                description: User-facing display name for the picklist value.
                example: adfadf12adf
              _delete:
                type: object
                description: Deletion metadata object.
                x-zs-llm-description: >-
                  To delete this pipeline, include this object with permanent
                  set to null (the only accepted value) and omit
                  display_value/maps from the item. This field is a delete
                  marker, not a soft/permanent-delete flag.
                properties:
                  permanent:
                    type:
                      - 'null'
                    description: >-
                      Indicates if the deletion was permanent (true), soft
                      delete (false), or status unknown/null.
                    x-zs-llm-description: >-
                      Always send null — the schema only accepts null (no
                      boolean values). Presence of this _delete object (with
                      permanent: null) is what triggers deletion; the value
                      itself carries no true/false meaning.
                    example: null
                required:
                  - permanent
                additionalProperties: false
              default:
                type: boolean
                description: >-
                  Indicates if this picklist value should be set as the default
                  option.
                example: false
              maps:
                type: array
                description: >-
                  Array of stage mappings defining which stages this picklist
                  value connects to and their sequence.
                minItems: 1
                maxItems: 200
                items:
                  type: object
                  description: >-
                    Mapping configuration for associating a picklist value with
                    a specific pipeline stage.
                  properties:
                    id:
                      format: int64
                      type: string
                      description: Unique identifier of the target pipeline stage to map.
                      example: '2766660000000007106'
                    display_value:
                      format: string
                      type: string
                      description: User-facing display name for the pipeline stage.
                      example: Needs Analysis
                    _delete:
                      type: object
                      description: Deletion metadata object.
                      x-zs-llm-description: >-
                        To delete this stage mapping, include this object with
                        permanent set to null (the only accepted value). At
                        least one stage mapping must remain on the pipeline
                        after deletion.
                      properties:
                        permanent:
                          type:
                            - 'null'
                          description: >-
                            Indicates if the deletion was permanent (true), soft
                            delete (false), or status unknown/null.
                          x-zs-llm-description: >-
                            Always send null — the schema only accepts null (no
                            boolean values). Presence of this _delete object
                            (with permanent: null) is what triggers deletion of
                            the stage mapping.
                          example: null
                      required:
                        - permanent
                      additionalProperties: false
                    sequence_number:
                      format: int32
                      type: integer
                      description: >-
                        Optional position of this stage mapping in the pipeline
                        sequence (overrides default positioning).
                      example: 2
                  required:
                    - id
                  additionalProperties: false
            additionalProperties: false
      required:
        - pipeline
      additionalProperties: false
