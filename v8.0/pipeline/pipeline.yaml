                  - $ref: '#/components/schemas/PipelineTransferErrorResponse'
                  - $ref: '#/components/schemas/PipelineGetErrorResponse'
              examples:
                AlreadyUsedStagedError:
                  value:
                    transfer_pipeline:
                      - code: ALREADY_USED
                        details:
                          api_name: from
                          exists_in:
                            json_path: $.transfer_pipeline[0].stages[0].from
                          json_path: $.transfer_pipeline[0].stages[1].from
                        message: from id is mapped more than once
                        status: error
                AlreadySchedulerError:
                  value:
                    transfer_pipeline:
                      - code: ALREADY_SCHEDULED
                        details:
                          api_name: cvid
                          value: '2766660000054211054'
                        message: Scheduler already running for this pipeline
                        status: error
                InvalidPipelineFromID:
                  value:
                    transfer_pipeline:
                      - code: INVALID_DATA
                        details:
                          api_name: from
                          json_path: $.transfer_pipeline[0].pipeline[0].from
                        message: Invalid from id
                        status: error
                InvalidPipelineToID:
                  value:
                    transfer_pipeline:
                      - code: INVALID_DATA
