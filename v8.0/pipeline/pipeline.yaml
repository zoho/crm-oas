openapi: 3.1.0
info:
  title: Pipeline
  description: >-
    The Pipeline API is used for retrieving, creating, updating, transferring,
    and deleting pipeline configurations in Zoho CRM Deals module for a
    particular layout. A sales pipeline is a visual representation of your sales
    process that shows where your prospects are in the buying cycle, how many
    open deals you have, how long a particular deal stayed in each stage, and
    whether you have a good chance of winning a deal.
  version: '8.0'
servers:
  - url: https://zohoapis.{dc}/crm/{version}
    description: API Server URL
    variables:
      dc:
        enum:
          - com
          - eu
          - in
          - cn
          - au
        default: com
        description: API Server URL TLD
      version:
        default: v8
        description: API Version
paths:
  /settings/pipeline:
    get:
      security:
        - OAuth2:
            - ZohoCRM.settings.pipeline.READ
      summary: Pipelines
      description: >-
        Retrieve all pipelines available for the specified Deals layout. Use the
        required layout_id query parameter to identify the layout.
      operationId: getPipelines
      parameters:
        - $ref: '#/components/parameters/LayoutID'
      responses:
        '200':
          description: >-
            Successfully retrieved all pipelines configured for the given
            layout.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelineGetResponse'
              examples:
                PipelineGetResponse:
                  value:
                    pipeline:
                      - display_value: Standard (JackFer)
                        default: true
                        maps:
                          - display_value: Qualification
                            sequence_number: 1
                            forecast_category:
                              name: Pipeline
                              id: '2766660000000007092'
                            actual_value: Qualification
                            id: '2766660000000007104'
                            forecast_type: Open
                          - display_value: Needs Analysis
                            sequence_number: 2
                            forecast_category:
                              name: Pipeline
                              id: '2766660000000007092'
                            actual_value: Needs Analysis
                            id: '2766660000000007106'
                            forecast_type: Open
                          - display_value: Identify Decision Makers
                            sequence_number: 3
                            forecast_category:
                              name: Pipeline
                              id: '2766660000000007092'
                            actual_value: Id. Decision Makers
                            id: '2766660000000007110'
                            forecast_type: Open
                          - display_value: Proposal/Price Quote
                            sequence_number: 4
                            forecast_category:
                              name: Pipeline
                              id: '2766660000000007092'
                            actual_value: Proposal/Price Quote
                            id: '2766660000000007112'
                            forecast_type: Open
                          - display_value: Negotiation/Review
                            sequence_number: 5
                            forecast_category:
                              name: Pipeline
                              id: '2766660000000007092'
                            actual_value: Negotiation/Review
                            id: '2766660000000007114'
                            forecast_type: Open
                          - display_value: Closed Won
                            sequence_number: 6
                            forecast_category:
                              name: Closed
                              id: '2766660000000007094'
                            actual_value: Closed Won
                            id: '2766660000000007116'
                            forecast_type: Closed Won
                          - display_value: Closed Lost
                            sequence_number: 7
                            forecast_category:
                              name: Omitted
                              id: '2766660000000007096'
                            actual_value: Closed Lost
                            id: '2766660000000007118'
                            forecast_type: Closed Lost
                          - display_value: Closed Lost to Competition
                            sequence_number: 8
                            forecast_category:
                              name: Omitted
                              id: '2766660000000007096'
                            actual_value: Closed Lost to Competition
                            id: '2766660000000007120'
                            forecast_type: Closed Lost
                          - display_value: dcba
                            sequence_number: 9
                            forecast_category:
                              name: Pipeline
                              id: '2766660000000007092'
                            actual_value: dcba
                            id: '2766660000030928184'
                            forecast_type: Open
                          - display_value: abcd
                            sequence_number: 10
                            forecast_category:
                              name: Pipeline
                              id: '2766660000000007092'
                            actual_value: abcd
                            id: '2766660000030928185'
                            forecast_type: Open
                          - display_value: ABC
                            sequence_number: 11
                            forecast_category:
                              name: Pipeline
                              id: '2766660000000007092'
                            actual_value: ABC
                            id: '2766660000030928272'
                            forecast_type: Open
                        actual_value: Standard (JackFer)
                        id: '2766660000055809075'
                      - display_value: New
                        default: false
                        maps:
                          - display_value: Qualification
                            sequence_number: 1
                            forecast_category:
                              name: Pipeline
                              id: '2766660000000007092'
                            actual_value: Qualification
                            id: '2766660000000007104'
                            forecast_type: Open
                          - display_value: Needs Analysis
                            sequence_number: 2
                            forecast_category:
                              name: Pipeline
                              id: '2766660000000007092'
                            actual_value: Needs Analysis
                            id: '2766660000000007106'
                            forecast_type: Open
                          - display_value: Identify Decision Makers
                            sequence_number: 3
                            forecast_category:
                              name: Pipeline
                              id: '2766660000000007092'
                            actual_value: Id. Decision Makers
                            id: '2766660000000007110'
                            forecast_type: Open
                          - display_value: Proposal/Price Quote
                            sequence_number: 4
                            forecast_category:
                              name: Pipeline
                              id: '2766660000000007092'
                            actual_value: Proposal/Price Quote
                            id: '2766660000000007112'
                            forecast_type: Open
                          - display_value: Negotiation/Review
                            sequence_number: 5
                            forecast_category:
                              name: Pipeline
                              id: '2766660000000007092'
                            actual_value: Negotiation/Review
                            id: '2766660000000007114'
                            forecast_type: Open
                          - display_value: Closed Won
                            sequence_number: 6
                            forecast_category:
                              name: Closed
                              id: '2766660000000007094'
                            actual_value: Closed Won
                            id: '2766660000000007116'
                            forecast_type: Closed Won
                        actual_value: New
                        id: '2766660000055809086'
        '204':
          description: No pipeline records were found for the given layout.
        '400':
          description: The request is invalid, for example when the layout_id is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelineGetErrorResponse'
              examples:
                InvalidLayoutID:
                  value:
                    code: INVALID_DATA
                    details:
                      param_name: layout_id
                    message: Invalid layoutid
                    status: error
    post:
      security:
        - OAuth2:
            - ZohoCRM.settings.pipeline.CREATE
      operationId: createPipeline
      summary: Pipeline
      description: >-
        Create a new pipeline for the specified Deals layout by providing a
        pipeline display label and one or more mapped stages.
      x-zs-llm-description: >-
        Creates exactly one pipeline per request (the pipeline array accepts
        only 1 item). Each stage entry in maps must reference an existing stage
        ID from the layout's picklist; use the Get Pipelines API to discover
        valid stage IDs before calling this endpoint.
      parameters:
        - $ref: '#/components/parameters/LayoutID'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PipelineCreateRequest'
            examples:
              PipelineCreateRequest:
                value:
                  pipeline:
                    - display_value: adfadf12adf
                      default: true
                      maps:
                        - id: '2766660000000007106'
                          sequence_number: 2
                        - id: '2766660000000007104'
                          sequence_number: 1
        required: true
      responses:
        '201':
          description: Success Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelineSuccessResponse'
              examples:
                PipelineCreateResponse:
                  value:
                    pipeline:
                      - code: SUCCESS
                        details:
                          id: '2766660000055809093'
                        message: Pipeline created successfully
                        status: success
        '400':
          description: >-
            The request body or layout_id is invalid, or mandatory fields
            required to create the pipeline are missing.
          content:
            application/json:
              schema:
                x-zs-$id: PipelineCreate400ErrorResponse
                x-zs-llm-description: >-
                  Response matches PipelineGetErrorResponse when layout_id
                  itself is invalid; otherwise it matches
                  PipelineCreateErrorResponse for request-body validation
                  failures (duplicate label, invalid stage id, missing mandatory
                  fields).
                oneOf:
                  - $ref: '#/components/schemas/PipelineCreateErrorResponse'
                  - $ref: '#/components/schemas/PipelineGetErrorResponse'
              examples:
                DuplicatePipelineNameError:
                  value:
                    pipeline:
                      - code: DUPLICATE_DATA
                        details:
                          api_name: display_value
                          json_path: $.pipeline[0].display_value
                        message: Duplicate pipeline label found
                        status: error
                InvalidMapStageIDError:
                  value:
                    pipeline:
                      - code: INVALID_DATA
                        details:
                          api_name: id
                          json_path: $.pipeline[0].maps[0].id
                        message: Invalid child option id
                        status: error
                DisplayValueIsNotFountError:
                  value:
                    pipeline:
                      - code: MANDATORY_NOT_FOUND
                        details:
                          api_name: display_value
                          json_path: $.pipeline[0].display_value
                        message: required  field not found
                        status: error
                MapIDNotFoundError:
                  value:
                    pipeline:
                      - code: MANDATORY_NOT_FOUND
                        details:
                          api_name: id
                          json_path: $.pipeline[0].maps[0].id
                        message: required field not found
                        status: error
                InvalidLayoutID:
                  value:
                    code: INVALID_DATA
                    details:
                      param_name: layout_id
                    message: Invalid layoutid
                    status: error
        '403':
          description: >-
            The user does not have permission to create or customize pipelines
            in Zoho CRM.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoPermissionErrorResponse'
              examples:
                NoPermissionErrorResponse:
                  value:
                    code: NO_PERMISSION
                    details:
                      permissions: Crm_Implied_Customize_Zoho_CRM
                    message: permission denied to customize Zoho CRM
                    status: error
    patch:
      security:
        - OAuth2:
            - ZohoCRM.settings.pipeline.UPDATE
      operationId: updatePipelines
      summary: Pipeline
      description: >-
        Update or delete a pipeline for the specified layout using a request
        body that identifies the pipeline and its stage mappings.
      x-zs-llm-description: >-
        Identifies the target pipeline by id inside the request body rather than
        the URL path, so a single request can only carry one pipeline item
        (maxItems: 1). To delete instead of update, set the item's
        _delete.permanent field instead of supplying display_value/maps. To
        delete a specific stage within maps, add _delete.permanent to that stage
        entry; at least one stage must remain after deletion.
      parameters:
        - $ref: '#/components/parameters/LayoutID'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PipelineUpdateRequest'
            examples:
              PipelineUpdateRequest:
                value:
                  pipeline:
                    - id: '12345678901234567890'
                      display_value: adfadf12adf
                      default: false
                      maps:
                        - id: '2766660000000007106'
                          sequence_number: 2
                        - id: '2766660000000007104'
                          sequence_number: 1
              PipelineDeleteRequest:
                value:
                  pipeline:
                    - id: '12345678901234567890'
                      _delete:
                        permanent: null
        required: true
      responses:
        '200':
          description: The pipeline was updated or deleted successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelineSuccessResponse'
              examples:
                PipelineUpdateResponse:
                  value:
                    pipeline:
                      - code: SUCCESS
                        details:
                          id: '2766660000055809093'
                        message: Pipeline updated
                        status: success
        '400':
          description: >-
            The request is invalid due to an invalid layout_id, invalid stage
            mapping, duplicate pipeline label, missing mandatory data, or other
            pipeline update/delete validation errors.
          content:
            application/json:
              schema:
                x-zs-$id: PipelineUpdateOrDeleteBulkErrorResponse
                x-zs-llm-description: >-
                  Response matches PipelineGetErrorResponse when layout_id is
                  invalid, MaximumLengthErrorResponse when the pipeline array
                  exceeds its maxItems limit, or
                  PipelineUpdateOrDeleteErrorResponse for all other body
                  validation failures (invalid pipeline/stage id, duplicate
                  label, cannot delete last stage, already-scheduled transfer).
                oneOf:
                  - $ref: '#/components/schemas/PipelineUpdateOrDeleteErrorResponse'
                  - $ref: '#/components/schemas/PipelineGetErrorResponse'
                  - $ref: '#/components/schemas/MaximumLengthErrorResponse'
              examples:
                NoMappingFoundErrorRespones:
                  value:
                    pipeline:
                      - code: INVALID_DATA
                        details: {}
                        message: 'No mapping found '
                        status: error
                CannotRemoveTheLastStageErrorResponse:
                  value:
                    pipeline:
                      - code: CANNOT_DELETE
                        details:
                          api_name: id
                          json_path: $.pipeline[0].maps[0].id
                        message: >-
                          Cannot delete the last stage associated with the
                          pipeline
                        status: error
                AlreadyScheduledError:
                  value:
                    pipeline:
                      - code: ALREADY_SCHEDULED
                        details:
                          api_name: pipeline
                          json_path: $.pipeline[0].pipeline
                          value: '2766660000056063000'
                        message: Scheduler already running for this pipeline
                        status: error
                DuplicatePipelineNameError:
                  value:
                    pipeline:
                      - code: DUPLICATE_DATA
                        details:
                          api_name: display_value
                          json_path: $.pipeline[0].display_value
                        message: Duplicate pipeline label found
                        status: error
                InvalidMapStageIDError:
                  value:
                    pipeline:
                      - code: INVALID_DATA
                        details:
                          api_name: id
                          json_path: $.pipeline[0].maps[0].id
                        message: Invalid child option id
                        status: error
                DisplayValueIsNotFountError:
                  value:
                    pipeline:
                      - code: MANDATORY_NOT_FOUND
                        details:
                          api_name: display_value
                          json_path: $.pipeline[0].display_value
                        message: required  field not found
                        status: error
                MapIDNotFoundError:
                  value:
                    pipeline:
                      - code: MANDATORY_NOT_FOUND
                        details:
                          api_name: id
                          json_path: $.pipeline[0].maps[0].id
                        message: required field not found
                        status: error
                InvalidLayoutID:
                  value:
                    code: INVALID_DATA
                    details:
                      param_name: layout_id
                    message: Invalid layoutid
                    status: error
        '403':
          description: >-
            The user does not have permission to update or delete pipeline
            settings in Zoho CRM.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoPermissionErrorResponse'
              examples:
                NoPermissionErrorResponse:
                  value:
                    code: NO_PERMISSION
                    details:
                      permissions: Crm_Implied_Customize_Zoho_CRM
                    message: permission denied to customize Zoho CRM
                    status: error
    put:
      security:
        - OAuth2:
            - ZohoCRM.settings.pipeline.UPDATE
      operationId: replacePipelines
      summary: Pipeline
      description: >-
        Update, or delete a pipeline for the specified layout using the supplied
        pipeline configuration in the request body.
      x-zs-llm-description: >-
        Behaves the same as the PATCH variant on this path (body-identified
        pipeline via id, maxItems: 1, delete via _delete.permanent) — this PUT
        is provided as an alternate HTTP verb for the identical operation, not a
        full-resource replace. Prefer either verb consistently within an
        integration to avoid confusion.
      parameters:
        - $ref: '#/components/parameters/LayoutID'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PipelineUpdateRequest'
            examples:
              PipelineUpdateRequest:
                value:
                  pipeline:
                    - id: '12345678901234567890'
                      display_value: adfadf12adf
                      default: false
                      maps:
                        - id: '2766660000000007106'
                          sequence_number: 2
                        - id: '2766660000000007104'
                          sequence_number: 1
              PipelineDeleteRequest:
                value:
                  pipeline:
                    - id: '12345678901234567890'
                      _delete:
                        permanent: null
        required: true
      responses:
        '200':
          description: The pipeline was updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelineSuccessResponse'
              examples:
                PipelineUpdateResponse:
                  value:
                    pipeline:
                      - code: SUCCESS
                        details:
                          id: '2766660000055809093'
                        message: Pipeline updated
                        status: success
        '400':
          description: >-
            The request is invalid due to an invalid layout_id, invalid pipeline
            or stage data, missing required fields, or a request size or length
            constraint violation.
          content:
            application/json:
              schema:
                x-zs-$id: PipelineUpdateOrDelete400ErrorResponse
                x-zs-llm-description: >-
                  Response matches PipelineGetErrorResponse when layout_id is
                  invalid, MaximumLengthErrorResponse when the pipeline array
                  exceeds its maxItems limit, or
                  PipelineUpdateOrDeleteErrorResponse for all other body
                  validation failures (invalid pipeline/stage id, duplicate
                  label, cannot delete last stage, already-scheduled transfer).
                oneOf:
                  - $ref: '#/components/schemas/PipelineUpdateOrDeleteErrorResponse'
                  - $ref: '#/components/schemas/PipelineGetErrorResponse'
                  - $ref: '#/components/schemas/MaximumLengthErrorResponse'
              examples:
                NoMappingFoundErrorRespones:
                  value:
                    pipeline:
                      - code: INVALID_DATA
                        details: {}
                        message: 'No mapping found '
                        status: error
                CannotRemoveTheLastStageErrorResponse:
                  value:
                    pipeline:
                      - code: CANNOT_DELETE
                        details:
                          api_name: id
                          json_path: $.pipeline[0].maps[0].id
                        message: >-
                          Cannot delete the last stage associated with the
                          pipeline
                        status: error
                AlreadyScheduledError:
                  value:
                    pipeline:
                      - code: ALREADY_SCHEDULED
                        details:
                          api_name: pipeline
                          json_path: $.pipeline[0].pipeline
                          value: '2766660000056063000'
                        message: Scheduler already running for this pipeline
                        status: error
                DuplicatePipelineNameError:
                  value:
                    pipeline:
                      - code: DUPLICATE_DATA
                        details:
                          api_name: display_value
                          json_path: $.pipeline[0].display_value
                        message: Duplicate pipeline label found
                        status: error
                InvalidMapStageIDError:
                  value:
                    pipeline:
                      - code: INVALID_DATA
                        details:
                          api_name: id
                          json_path: $.pipeline[0].maps[0].id
                        message: Invalid child option id
                        status: error
                DisplayValueIsNotFountError:
                  value:
                    pipeline:
                      - code: MANDATORY_NOT_FOUND
                        details:
                          api_name: display_value
                          json_path: $.pipeline[0].display_value
                        message: required  field not found
                        status: error
                MapIDNotFoundError:
                  value:
                    pipeline:
                      - code: MANDATORY_NOT_FOUND
                        details:
                          api_name: id
                          json_path: $.pipeline[0].maps[0].id
                        message: required field not found
                        status: error
                InvalidLayoutID:
                  value:
                    code: INVALID_DATA
                    details:
                      param_name: layout_id
                    message: Invalid layoutid
                    status: error
                MaximumLengthExceededError:
                  value:
                    code: INVALID_DATA
                    details:
                      maximum_length: 1
                      api_name: pipeline
                      json_path: $.pipeline
                    message: invalid data
                    status: error
        '403':
          description: >-
            The user does not have permission to update or delete pipeline
            settings in Zoho CRM.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoPermissionErrorResponse'
              examples:
                NoPermissionErrorResponse:
                  value:
                    code: NO_PERMISSION
                    details:
                      permissions: Crm_Implied_Customize_Zoho_CRM
                    message: permission denied to customize Zoho CRM
                    status: error
  /settings/pipeline/{pipelineIdentifier}:
    get:
      security:
        - OAuth2:
            - ZohoCRM.settings.pipeline.READ
      description: >-
        Retrieve a specific pipeline by pipeline ID for the specified Deals
        layout.
      summary: Specific Pipeline
      operationId: getPipeline
      parameters:
        - $ref: '#/components/parameters/LayoutID'
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Successfully retrieved the requested pipeline.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SinglePipelineGetResponse'
              examples:
                SinglePipelineGetResponse:
                  value:
                    pipeline:
                      - display_value: Standard (JackFer)
                        default: true
                        maps:
                          - display_value: Qualification
                            sequence_number: 1
                            forecast_category:
                              name: Pipeline
                              id: '2766660000000007092'
                            actual_value: Qualification
                            id: '2766660000000007104'
                            forecast_type: Open
                        actual_value: Standard (JackFer)
                        id: '2766660000055809075'
        '204':
          description: >-
            No pipeline was found for the given pipeline ID and layout
            combination.
        '400':
          description: The request is invalid, for example when the layout_id is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelineGetErrorResponse'
              examples:
                InvalidLayoutID:
                  value:
                    code: INVALID_DATA
                    details:
                      param_name: layout_id
                    message: Invalid layoutid
                    status: error
    patch:
      security:
        - OAuth2:
            - ZohoCRM.settings.pipeline.UPDATE
      operationId: updatePipelineById
      summary: Pipeline
      description: >-
        Update or delete a specific pipeline identified by the path ID within
        the specified layout.
      x-zs-llm-description: >-
        The pipeline is identified by the pipelineIdentifier path parameter, so
        unlike the body-identified PATCH on /settings/pipeline, request body
        items must NOT include id. To delete the pipeline instead of updating
        it, set _delete.permanent on the item instead of display_value/maps.
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/LayoutID'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PipelineUpdateRequestUrl'
            examples:
              PipelineUpdateRequest:
                value:
                  pipeline:
                    - display_value: adfadf12adf
                      default: false
                      maps:
                        - id: '2766660000000007106'
                          sequence_number: 2
                        - id: '2766660000000007104'
                          sequence_number: 1
              PipelineDeleteRequest:
                value:
                  pipeline:
                    - _delete:
                        permanent: null
        required: true
      responses:
        '200':
          description: The specified pipeline was updated or deleted successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelineSuccessResponse'
              examples:
                PipelineUpdateResponse:
                  value:
                    pipeline:
                      - code: SUCCESS
                        details:
                          id: '2766660000055809093'
                        message: Pipeline updated
                        status: success
        '400':
          description: >-
            The request is invalid due to an invalid pipeline ID, invalid
            layout_id, invalid stage mapping, duplicate pipeline label, missing
            required fields, or other pipeline validation errors.
          content:
            application/json:
              schema:
                x-zs-$id: PipelineUpdateOrDeleteByIdErrorResponse
                x-zs-llm-description: >-
                  Response matches PipelineUpdateOrDeleteUrlErrorResponse when
                  the pipelineIdentifier path parameter itself is invalid,
                  PipelineGetErrorResponse when layout_id is invalid, or
                  PipelineUpdateOrDeleteErrorResponse for all other body
                  validation failures (invalid stage id, duplicate label, cannot
                  delete last stage, already-scheduled transfer).
                oneOf:
                  - $ref: >-
                      #/components/schemas/PipelineUpdateOrDeleteUrlErrorResponse
                  - $ref: '#/components/schemas/PipelineUpdateOrDeleteErrorResponse'
                  - $ref: '#/components/schemas/PipelineGetErrorResponse'
              examples:
                NoMappingFoundErrorRespones:
                  value:
                    pipeline:
                      - code: INVALID_DATA
                        details: {}
                        message: 'No mapping found '
                        status: error
                CannotRemoveTheLastStageErrorResponse:
                  value:
                    pipeline:
                      - code: CANNOT_DELETE
                        details:
                          api_name: id
                          json_path: $.pipeline[0].maps[0].id
                        message: >-
                          Cannot delete the last stage associated with the
                          pipeline
                        status: error
                InvalidPipelineIdInUrlErrorResponse:
                  value:
                    code: INVALID_DATA
                    details:
                      resource_path_index: 2
                    message: invalid pick_list_values id
                    status: error
                AlreadyScheduledError:
                  value:
                    pipeline:
                      - code: ALREADY_SCHEDULED
                        details:
                          api_name: pipeline
                          json_path: $.pipeline[0].pipeline
                          value: '2766660000056063000'
                        message: Scheduler already running for this pipeline
                        status: error
                DuplicatePipelineNameError:
                  value:
                    pipeline:
                      - code: DUPLICATE_DATA
                        details:
                          api_name: display_value
                          json_path: $.pipeline[0].display_value
                        message: Duplicate pipeline label found
                        status: error
                InvalidMapStageIDError:
                  value:
                    pipeline:
                      - code: INVALID_DATA
                        details:
                          api_name: id
