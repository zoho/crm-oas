      summary: Get an Email Draft
      description: Retrieves the specified email draft for the given record in the module.
      x-zs-llm-description: >-
        Use this API to retrieve a single email draft by its `id` (the `draft`
        path parameter). The `id` can be obtained from the getEmailDrafts (list)
        response. Returns the full draft detail including recipients, content,
        attachments, schedule details, and owner.
      operationId: getEmailDraft
      parameters:
        - $ref: '#/components/parameters/Module'
        - $ref: '#/components/parameters/Record'
        - $ref: '#/components/parameters/Draft'
      responses:
        '200':
          description: Returns the details of the specified email draft.
          content:
            application/json:
              schema:
                x-zs-$id: GetDetailEmailDraftsResponse
                type: object
                description: Response containing a single email draft.
                additionalProperties: false
                properties:
                  __email_drafts:
                    type: array
