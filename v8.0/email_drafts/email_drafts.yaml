        Use this API to update a single specific email draft identified by the
        `draft` path parameter. The draft `id` is passed in the URL (not in the
        request body). The request body must contain `from` and `rich_text`.
        Pass `content` for HTML drafts (`rich_text: true`) or `plainTextContent`
