                              file_size:
                                type: string
                                description: File size in bytes as a numeric string.
                                maxLength: 20
                              service_name:
                                type: string
                                description: Storage service name.
                                maxLength: 100
                            required:
                              - id
                              - file_name
                              - file_size
                              - service_name
                        schedule_details:
                          type:
                            - object
                            - 'null'
                          description: Scheduling information; null if not scheduled.
                          additionalProperties: false
                          properties:
                            time:
                              type: string
                              format: date-time
                              description: Scheduled send time (ISO 8601 format).
                            timezone:
                              type:
                                - string
                                - 'null'
                              description: Timezone identifier or null.
                              maxLength: 100
                            source:
                              type: string
                              enum:
                                - ecOneHourAhead
                                - upTime
                                - ecSchduleBestTime
                                - ecUpComing
                                - ecSchduleTime
                              description: Source of the schedule decision.
                          required:
                            - time
                        rich_text:
                          type: boolean
                          description: >-
                            true when HTML editor was used; false for plain
                            text.
                        subject:
                          type:
                            - string
                            - 'null'
                          description: Email subject; null if not set.
                          maxLength: 512
                        content:
                          type:
                            - string
                            - 'null'
                          description: Email HTML body content; null if not set.
                          maxLength: 200000
                        summary:
                          type:
                            - string
                            - 'null'
                          description: Plain text preview of the draft body; null if empty.
                          maxLength: 500
                        owner:
                          type: object
                          description: Owner who created the draft.
                          additionalProperties: false
                          properties:
                            id:
                              type: string
                              description: >
                                Owner user identifier. Use the [Users
                                API](users.yaml#$.paths./users/bulk.get) to
                                retrieve user IDs.
                              maxLength: 64
                            name:
                              type: string
                              description: Owner display name.
                              maxLength: 256
                          required:
                            - id
                            - name
                        source:
                          type: string
                          description: >-
                            Source identifier string stored at draft creation
                            time.
                          maxLength: 256
                        linked_record:
                          type:
                            - object
                            - 'null'
                          description: CRM record linked to this draft; null if not linked.
                          additionalProperties: false
                          properties:
                            id:
                              type: string
                              description: Linked CRM record identifier.
                              maxLength: 64
                            module:
                              type: object
