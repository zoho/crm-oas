                          maxLength: 256
                        modified_time:
                          type: string
                          format: date-time
                          description: >-
                            Timestamp when the draft was last modified (ISO 8601
                            format).
                        created_time:
                          type: string
                          format: date-time
                          description: >-
                            Timestamp when the draft was created (ISO 8601
                            format).
                        from:
                          type: string
                          description: Sender email address.
                          maxLength: 256
                        to:
                          type:
                            - array
                            - 'null'
                          description: Primary recipients; null if none.
                          maxItems: 100
                          items:
                            type: object
                            description: Recipient object.
                            additionalProperties: false
                            properties:
                              user_name:
                                type:
                                  - string
                                  - 'null'
                                description: Recipient display name; null if not available.
                                maxLength: 256
                              email:
                                type: string
                                description: Recipient email address.
                                maxLength: 256
                            required:
                              - user_name
                              - email
                        reply_to:
                          type:
                            - string
                            - 'null'
                          description: Reply-to email address; null if not set.
                          maxLength: 256
                        cc:
                          type:
                            - array
                            - 'null'
                          description: CC recipients; null if none.
                          maxItems: 100
                          items:
                            type: object
                            description: CC recipient object.
                            additionalProperties: false
                            properties:
                              user_name:
                                type:
                                  - string
                                  - 'null'
                                description: >-
                                  CC recipient display name; null if not
                                  available.
                                maxLength: 256
                              email:
                                type: string
                                description: CC recipient email address.
                                maxLength: 256
                            required:
