                              enum:
                                - portrait
                                - landscape
                              description: Layout/view type for the inventory.
                            record:
                              type: object
                              description: CRM record associated with this inventory draft.
                              additionalProperties: false
                              properties:
                                id:
                                  type: string
                                  description: CRM record identifier.
                                  maxLength: 64
                                name:
                                  type: string
                                  description: CRM record display name.
                                  maxLength: 256
                              required:
                                - id
                                - name
                          required:
                            - inventory_template
                            - paper_type
                            - view_type
                        attachments:
