                      reply_to: reply@example.com
                      cc:
                        - user_name: user2
                          email: user2@example.com
                      bcc:
                        - user_name: user3
                          email: user3@example.com
                      schedule_details:
                        time: '2023-03-25T14:00:54+05:30'
