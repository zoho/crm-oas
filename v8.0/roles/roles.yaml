openapi: 3.1.0
info:
  title: Roles
  description: >-
    Roles define the reporting hierarchy in a Zoho CRM organization, determining
    data visibility and access across users. Use these APIs to retrieve, create,
    update, and delete roles in your CRM organization.
  version: '8.0'
servers:
  - url: https://zohoapis.{dc}/crm/{version}
    description: >-
      Represents the Local Zoho Server URL appropriate data center for your
      region.
    variables:
      dc:
        enum:
          - com
          - eu
          - in
          - cn
          - au
        default: com
        description: |-
          The data center domain suffix for the Zoho CRM API server.
          Possible values:
          **com** - United States
          **eu** - Europe
          **in** - India
          **cn** - China
          **au** - Australia
      version:
        default: v8
        description: Represents the API version
paths:
  /settings/roles:
    get:
      operationId: getRoles
      summary: Get all roles
      description: Returns the list of all roles configured in your Zoho CRM organization.
      x-zs-llm-description: >-
        Use it to look up role IDs before creating, updating, or deleting a
        role.
      responses:
        '200':
          description: Returns the list of all CRM roles configured in the organization.
          content:
            application/json:
              examples:
                Success:
                  summary: Successful roles retrieval response
                  value:
                    roles:
                      - id: '4413524000000991001'
                        name: Sales Manager
                        display_label: Sales Manager
                        api_name: sales_manager
                        description: Manages sales team and processes
                        share_with_peers: true
                        forecast_manager:
                          id: '4413524000000991002'
                          name: John Doe
                        reporting_to:
                          id: '4413524000000991003'
                          name: VP Sales
                        created_by__s:
                          id: '4413524000000991004'
                          name: Admin User
                        modified_by__s:
                          id: '4413524000000991005'
                          name: Admin User
                        modified_time__s: '2023-12-01T10:00:00Z'
                        created_time__s: '2023-11-01T09:00:00Z'
                  description: Shows a successful response with the list of roles.
              schema:
                x-zs-$id: GetRolesResponse
                description: >-
                  Represents the successful response for retrieving all CRM
                  roles in the organization.
                type: object
                additionalProperties: false
                properties:
                  roles:
                    description: >-
                      Represents the list of CRM roles returned in the
                      response. 
                    type: array
                    maxItems: 250
                    items:
                      description: 'Represents an individual role in the organization. '
                      type: object
                      additionalProperties: false
                      properties:
                        display_label:
                          description: >-
                            Represents the display label of the role as shown in
                            the Zoho CRM user interface. 
                          type: string
                          maxLength: 200
                        forecast_manager:
                          description: >-
                            Represents the forecast manager assigned to this
                            role. 
                          type:
                            - object
                            - 'null'
                          additionalProperties: false
                          properties:
                            id:
                              description: >-
                                Represents the unique ID of the forecast manager
                                assigned to the role. 
                              type: string
                              maxLength: 19
                            name:
                              description: >-
                                Represents the display name of the forecast
                                manager assigned to the role. 
                              type: string
                              maxLength: 255
                          required:
                            - id
                            - name
                        reporting_to:
                          description: >-
                            Represents the parent role to which this role
                            reports in the CRM role hierarchy.  Refer to the
                            [Get Roles](roles.yaml#$.paths./settings/roles.get)
                            resource for valid values.
                          type:
                            - object
                            - 'null'
                          additionalProperties: false
                          properties:
                            id:
                              description: >-
                                Represents the unique ID of the parent role in
                                the role hierarchy. 
                              type: string
                              maxLength: 19
                            name:
                              description: >-
                                Represents the display name of the parent role
                                in the role hierarchy. 
                              type: string
                              maxLength: 255
                          required:
                            - id
                            - name
                        api_name:
                          x-zs-$id: RoleApiName
                          description: >-
                            Represents the API name identifier for the role,
                            used to reference the role programmatically.
                          type: string
                          maxLength: 100
                        share_with_peers:
                          description: >-
                            Indicates whether users assigned to this role can
                            share records with users in peer roles at the same
                            level. 

                            Possible values:

                            **true** - Users assigned to this role can share
                            records with peer role users.

                            **false** - Users assigned to this role cannot share
                            records with peer role users.
                          type: boolean
                        description:
                          description: >-
                            Represents the description of the role, providing
                            additional context about its purpose and
                            responsibilities. 
                          type:
                            - string
                            - 'null'
                          maxLength: 1000
                        id:
                          x-zs-$id: RoleId
                          description: 'Represents the unique ID of the role. '
                          type: string
                          maxLength: 19
                        name:
                          description: 'Represents the display name of the role. '
                          type: string
                          maxLength: 200
                        created_by__s:
                          description: 'Represents the user who created this role. '
                          type:
                            - object
                            - 'null'
                          additionalProperties: false
                          properties:
                            name:
                              description: >-
                                Represents the display name of the user who
                                created the role. 
                              type: string
                              maxLength: 255
                            id:
                              description: >-
                                Represents the unique ID of the user who created
                                the role. 
                              type: string
                              maxLength: 19
                          required:
                            - name
                            - id
                        modified_by__s:
                          description: 'Represents the user who last modified this role. '
                          type:
                            - object
                            - 'null'
                          additionalProperties: false
                          properties:
                            name:
                              description: >-
                                Represents the display name of the user who last
                                modified the role. 
                              type: string
                              maxLength: 255
                            id:
                              description: >-
                                Represents the unique ID of the user who last
                                modified the role. 
                              type: string
                              maxLength: 19
                          required:
                            - name
                            - id
                        modified_time__s:
                          description: >-
                            Represents the timestamp at which the role was last
                            modified. 
                          type:
                            - string
                            - 'null'
                          format: date-time
                        created_time__s:
                          description: >-
                            Represents the timestamp indicating when the role
                            was added to the organization. 
                          type:
                            - string
                            - 'null'
                          format: date-time
                      required:
                        - display_label
                        - forecast_manager
                        - reporting_to
                        - share_with_peers
                        - description
                        - id
                        - name
                        - created_by__s
                        - modified_by__s
                        - modified_time__s
                        - created_time__s
                required:
                  - roles
      security:
        - OAuth2:
            - ZohoCRM.settings.roles.READ
    post:
      operationId: createRoles
      summary: Create a role
      description: Creates a new role in your Zoho CRM organization.
      x-zs-llm-description: Creates a single role per request; bulk creation is not supported.
      requestBody:
        content:
          application/json:
            x-zs-llm-examples:
              - CreateRole
            examples:
              CreateRole:
                summary: Create a new role with required and optional fields
                value:
                  roles:
                    - name: Marketing Manager
                      description: Manages marketing campaigns and strategies
                      share_with_peers: true
                      reporting_to:
                        id: '4413524000000991006'
                description: >-
                  Shows a create roles request specifying a new role with its
                  name, parent role, description, and peer sharing setting.
            schema:
              description: Represents the request body for creating one or more CRM roles.
              type: object
              additionalProperties: false
              properties:
                roles:
                  description: >-
                    Specify the array of role objects to create. You can include
                    exactly one object per request (bulk create/update is not
                    supported).
                  type: array
                  maxItems: 1
                  items:
                    description: Specify the details of an individual role to create.
                    type: object
                    additionalProperties: false
                    properties:
                      reporting_to:
                        description: >-
                          Specify the parent role to which this new role reports
                          in the CRM role hierarchy. Refer to the [Get
                          Roles](roles.yaml#$.paths./settings/roles.get)
                          resource for valid values.
                        type: object
                        additionalProperties: false
                        properties:
                          id:
                            description: >-
                              Specify the unique ID of the parent role in the
                              role hierarchy.
                            x-zs-$ref:
                              resource: roles
                              origins:
                                - operationId: getRoles
                                  propertyId: RoleId
                            type: string
                            maxLength: 19
                      share_with_peers:
                        description: >-
                          Specify whether users assigned to this role can share
                          records with users in peer roles at the same level.

                          Possible values:

                          **true** - Users assigned to this role can share
                          records with peer role users.

                          **false** - Users assigned to this role cannot share
                          records with peer role users.
                        type:
                          - boolean
                          - 'null'
                      description:
                        description: >-
                          Specify the description of the role to provide
                          additional context about its purpose and
                          responsibilities.
                        type:
                          - string
                          - 'null'
                        maxLength: 250
                      name:
                        description: Specify the display name for the role.
                        type: string
                        maxLength: 200
                    required:
                      - name
                      - reporting_to
              required:
                - roles
        required: true
        description: >-
          The request body must contain a roles array. You can include exactly
          one object per request (bulk create/update is not supported).
      responses:
        '201':
          description: Returns the creation result for each role submitted in the request.
          content:
            application/json:
              examples:
                Success:
                  summary: Successful role creation response
                  value:
                    roles:
                      - code: SUCCESS
                        details:
                          id: '4413524000000991004'
                        message: Role added
                        status: success
                  description: >-
                    Shows a successful response returning the creation result
                    with the ID of the newly created role.
              schema:
                x-zs-$id: CreateRolesResponse
                description: >-
                  Represents the successful response for the role creation
                  operation.
                type: object
                additionalProperties: false
                properties:
                  roles:
                    description: 'Represents the list of role creation results. '
                    type: array
                    maxItems: 1
                    items:
                      description: >-
                        Represents the creation result for an individual role in
                        the request. 
                      type: object
                      additionalProperties: false
                      properties:
                        code:
                          description: >-
                            Represents the result code of the role creation
                            operation. 

                            Possible values:

                            **SUCCESS** - The role creation succeeded.
                          type: string
                          enum:
                            - SUCCESS
                        details:
                          description: >-
                            Represents additional details about the created
                            role. 
                          type: object
                          additionalProperties: false
                          properties:
                            id:
                              x-zs-$id: RoleResultId
                              description: >-
                                Represents the unique ID of the newly created
                                role. 
                              type: string
                              maxLength: 19
                          required:
                            - id
                        message:
                          description: >-
                            Represents the status message for the role creation
                            result. 
                          type: string
                          maxLength: 100
                        status:
                          description: >-
                            Represents the status of the role creation
                            operation. 

                            Possible values:

                            **success** - The role creation succeeded.
                          type: string
                          enum:
                            - success
                      required:
                        - code
                        - details
                        - message
                        - status
                required:
                  - roles
        '400':
          description: >-
            The request is invalid. **Resolution**: Verify that all required
            fields are provided and that all field values conform to the allowed
            format and constraints.
          content:
            application/json:
              examples:
                Error:
                  summary: Validation error during role creation
                  value:
                    roles:
                      - status: error
                        code: INVALID_DATA
                        message: Invalid role name
                        details:
                          maximum_length: 200
                          api_name: name
                          json_path: $.roles[0].name
                  description: >-
                    Shows an error response when the request body contains
                    invalid or duplicate role data.
              schema:
                x-zs-$id: CreateRolesErrorResponse
                description: Represents the error response for the role creation operation.
                oneOf:
                  - x-zs-$id: CreateRolesDuplicateDataErrorResponse
                    description: >-
                      Represents the error response when one or more roles
                      conflict with existing data.
                    type: object
                    additionalProperties: false
                    properties:
                      roles:
                        description: >-
                          Represents the list of role creation failure results
                          for duplicate data errors. 
                        type: array
                        maxItems: 1
                        items:
                          description: >-
                            Represents the failure result for an individual role
                            where a duplicate data error occurred. 
                          type: object
                          additionalProperties: false
                          properties:
                            status:
                              description: >-
                                Represents the status of the role creation
                                operation for this item. 

                                Possible values:

                                **error** - The role creation failed.
                              type: string
                              enum:
                                - error
                            code:
                              description: >-
                                Represents the error code for the role creation
                                failure. 

                                Possible values:

                                **DUPLICATE_DATA** - The role data conflicts
                                with an existing role.
                              type: string
                              enum:
                                - DUPLICATE_DATA
                            message:
                              description: >-
                                Represents the error message describing the
                                duplicate data issue. 
                              type: string
                              maxLength: 500
                            details:
                              description: >-
                                Represents additional details identifying the
                                field that caused the duplicate data error. 
                              type: object
                              additionalProperties: false
                              properties:
                                api_name:
                                  description: >-
                                    Represents the API name of the field that
                                    contains the duplicate value. 
                                  type: string
                                  maxLength: 100
                                json_path:
                                  description: >-
                                    Represents the JSON path to the field in the
                                    request body that contains the duplicate
                                    value. 
                                  type: string
                                  maxLength: 200
                              required:
                                - api_name
                                - json_path
                          required:
                            - status
                            - code
                            - message
                            - details
                    required:
                      - roles
                  - x-zs-$id: CreateRolesInvalidDataErrorResponse
                    description: >-
                      Represents the error response when one or more roles
                      contain invalid data.
                    type: object
                    additionalProperties: false
                    properties:
                      roles:
                        description: >-
                          Represents the list of role creation failure results
                          for invalid data errors. 
                        type: array
                        maxItems: 1
                        items:
                          description: >-
                            Represents the failure result for an individual role
                            where an invalid data error occurred. 
                          type: object
                          additionalProperties: false
                          properties:
                            status:
                              description: >-
                                Represents the status of the role creation
                                operation for this item. 

                                Possible values:

                                **error** - The role creation failed.
                              type: string
                              enum:
                                - error
                            code:
                              description: >-
                                Represents the error code for the role creation
                                failure. 

                                Possible values:

                                **INVALID_DATA** - The provided data is invalid.
                              type: string
                              enum:
                                - INVALID_DATA
                                - invalid data
                            message:
                              description: >-
                                Represents the error message describing the
                                invalid data issue. 
                              type: string
                              maxLength: 500
                            details:
                              description: >-
                                Represents additional details identifying the
                                field that caused the invalid data error. 
                              type: object
                              additionalProperties: false
                              properties:
                                api_name:
                                  description: >-
                                    Represents the API name of the field that
                                    contains the invalid value. 
                                  type: string
                                  maxLength: 100
                                json_path:
                                  description: >-
                                    Represents the JSON path to the field in the
                                    request body that contains the invalid
                                    value. 
                                  type: string
                                  maxLength: 200
                              required:
                                - api_name
                                - json_path
                          required:
                            - status
                            - code
                            - message
                            - details
                    required:
                      - roles
                  - x-zs-$id: CreateRolesValidationErrorResponse
                    description: >-
                      Represents the error response when one or more role fields
                      exceed the allowed length or contain validation errors.
                    type: object
                    additionalProperties: false
                    properties:
                      roles:
                        description: >-
                          Represents the list of role creation failure results
                          for validation errors. 
                        type: array
                        maxItems: 1
                        items:
                          description: >-
                            Represents the failure result for an individual role
                            where a validation error occurred. 
                          type: object
                          additionalProperties: false
                          properties:
                            status:
                              description: >-
                                Represents the status of the role creation
                                operation for this item. 

                                Possible values:

                                **error** - The role creation failed.
                              type: string
                              enum:
                                - error
                            code:
                              description: >-
                                Represents the error code for the validation
                                failure. 

                                Possible values:

                                **INVALID_DATA** - The provided data failed
                                validation.
                              type: string
                              enum:
                                - INVALID_DATA
                            message:
                              description: >-
                                Represents the error message describing the
                                validation issue. 
                              type: string
                              maxLength: 500
                            details:
                              description: >-
                                Represents additional details identifying the
                                field that failed validation. 
                              type: object
                              additionalProperties: false
                              properties:
                                maximum_length:
                                  description: >-
                                    Represents the maximum allowed length for
                                    the field that failed validation. 
                                  type: integer
                                  format: int32
                                api_name:
                                  description: >-
                                    Represents the API name of the field that
                                    failed validation. 
                                  type: string
                                  maxLength: 100
                                json_path:
                                  description: >-
                                    Represents the JSON path to the field in the
                                    request body that failed validation. 
                                  type: string
                                  maxLength: 200
                              required:
                                - maximum_length
                                - api_name
                                - json_path
                          required:
                            - status
                            - code
                            - message
                            - details
                    required:
                      - roles
                  - x-zs-$id: CreateRolesMandatoryParamMissingError
                    description: >-
                      Represents the error response when a required parameter is
                      missing from the request.
                    type: object
                    additionalProperties: false
                    properties:
                      code:
                        description: >-
                          Represents the error code indicating a required
                          parameter is missing. 

                          Possible values:

                          **MANDATORY_PARAM_MISSING** - A required parameter was
                          not included in the request.
                        type: string
                        enum:
                          - MANDATORY_PARAM_MISSING
                      message:
                        description: >-
                          Represents the error message describing the missing
                          parameter issue. 
                        type: string
                        maxLength: 500
                        example: Required parameter is missing
                      status:
                        description: |-
                          Represents the error status of the request. 
                          Possible values:
                          **error** - The request failed.
                        type: string
                        enum:
                          - error
                      details:
                        description: >-
                          Represents additional details about the missing
                          parameter.
                        type: object
                        additionalProperties: false
                        properties:
                          api_name:
                            description: >-
                              Represents the API name of the missing required
                              parameter.
                            type: string
                            maxLength: 100
                    required:
                      - code
                      - message
                      - status
                  - x-zs-$id: CreateRolesNotAllowedError
                    description: >-
                      Represents the error response when the operation is not
                      permitted.
                    type: object
                    additionalProperties: false
                    properties:
                      code:
                        description: >-
                          Represents the error code indicating the operation is
                          not allowed. 

                          Possible values:

                          **NOT_ALLOWED** - The operation is not permitted.
                        type: string
                        enum:
                          - NOT_ALLOWED
                      message:
                        description: >-
                          Represents the error message describing why the
                          operation is not allowed. 
                        type: string
                        maxLength: 500
                        example: This operation is not allowed
                      status:
                        description: |-
                          Represents the error status of the request. 
                          Possible values:
                          **error** - The request failed.
                        type: string
                        enum:
                          - error
                      details:
                        description: >-
                          Represents additional details about why the operation
                          is not allowed.
                        type: object
                        additionalProperties: true
                    required:
                      - code
                      - message
                      - status
      security:
        - OAuth2:
            - ZohoCRM.settings.roles.CREATE
    put:
      operationId: updateRoles
      summary: Update a role
      description: Updates an existing role in your Zoho CRM organization.
      x-zs-llm-description: >-
        Updates a single role per request (identified by its ID in the body);
        bulk update is not supported.
      requestBody:
        content:
          application/json:
            x-zs-llm-examples:
              - UpdateRoles
            examples:
              UpdateRoles:
                summary: Update a role
                value:
                  roles:
                    - id: '4413524000000991001'
                      name: Senior Sales Manager
                      description: Updated description for senior sales manager role
                      share_with_peers: false
                      reporting_to:
                        id: '4413524000000991010'
                      forecast_manager:
                        id: '4413524000000991011'
                        name: John Doe
                description: Shows a request that updates a role.
            schema:
              description: Represents the request body for updating a role.
              type: object
              additionalProperties: false
              properties:
                roles:
                  description: Specify the array of role objects to update.
                  type: array
                  maxItems: 1
                  items:
                    description: Specify the details of an individual role to update.
                    type: object
                    additionalProperties: false
                    properties:
                      id:
                        description: >-
                          Specify the unique ID of the role to update. Refer to
                          the [Get
                          Roles](roles.yaml#$.paths./settings/roles.get)
                          resource for valid values.
                        x-zs-$ref:
                          resource: roles
                          origins:
                            - operationId: getRoles
                              propertyId: RoleId
                        type: string
                        maxLength: 19
                      reporting_to:
                        description: >-
                          Specify the updated parent role for this role in the
                          CRM hierarchy. Refer to the [Get
                          Roles](roles.yaml#$.paths./settings/roles.get)
                          resource for valid values.
                        type: object
                        additionalProperties: false
                        properties:
                          id:
                            description: Specify the unique ID of the updated parent role.
                            x-zs-$ref:
                              resource: roles
                              origins:
                                - operationId: getRoles
                                  propertyId: RoleId
                            type: string
                            maxLength: 19
                      forecast_manager:
                        description: Specify the forecast manager to assign to this role.
                        type: object
                        additionalProperties: false
                        properties:
                          id:
                            description: >-
                              Specify the unique ID of the forecast manager to
                              assign to the role.
                            x-zs-$ref:
                              resource: users
                              origins:
                                - operationId: getUsers
                                  propertyId: UserId
                            type: string
                            maxLength: 19
                          name:
                            description: >-
                              Specify the display name of the forecast manager
                              to assign to the role.
                            type:
                              - string
                              - 'null'
                            maxLength: 255
                      share_with_peers:
                        description: >-
                          Specify whether users assigned to this role can share
                          records with users in peer roles at the same level.

                          Possible values:

                          **true** - Users assigned to this role can share
                          records with peer role users.

                          **false** - Users assigned to this role cannot share
                          records with peer role users.
                        type: boolean
                      description:
                        description: Specify the updated description for the role.
                        type:
                          - string
                          - 'null'
                        maxLength: 250
                      name:
                        description: Specify the updated display name for the role.
                        type: string
                        maxLength: 200
                    required:
                      - id
              required:
                - roles
        required: true
        description: >-
          The request body must contain a roles array. You can include exactly
          one object per request (bulk create/update is not supported).
      responses:
        '200':
          description: Returns the update result for each role submitted in the request.
          content:
            application/json:
              examples:
                Success:
                  summary: Successful role update response
                  value:
                    roles:
                      - code: SUCCESS
                        details:
                          id: '4413524000000991001'
                        message: Role updated
                        status: success
                  description: >-
                    Shows a successful role update response showing the update
                    result for the submitted role in the request.
              schema:
                x-zs-$id: UpdateRolesResponse
                description: >-
                  Represents the successful response for the role update
                  operation.
                type: object
                additionalProperties: false
                properties:
                  roles:
                    description: 'Represents the role update result. '
                    type: array
                    maxItems: 1
                    items:
                      description: 'Represents the update result for an individual role. '
                      type: object
                      additionalProperties: false
                      properties:
                        code:
                          description: >-
                            Represents the result code of the role update
                            operation. 

                            Possible values:

                            **SUCCESS** - The role update succeeded.
                          type: string
                          enum:
                            - SUCCESS
                        details:
                          description: >-
                            Represents additional details about the updated
                            role. 
                          type: object
                          additionalProperties: false
                          properties:
                            id:
                              description: 'Represents the unique ID of the updated role. '
