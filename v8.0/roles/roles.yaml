security:
  - OAuth2:
      - ZohoCRM.settings.roles.ALL
components:
  parameters:
    Role:
      name: role
      in: path
      required: true
      description: The unique ID of the role.
      schema:
        type: integer
        format: int64
    TransferToId:
      name: transfer_to_id
      in: query
      required: true
      description: >-
        The unique ID of the role to which subordinate records are transferred
        before the deletion. Refer to the [Get
        Roles](roles.yaml#$.paths./settings/roles.get) resource for valid
        values.
      schema:
        type: integer
        format: int64
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://accounts.zoho.com/oauth/v2/auth
          tokenUrl: https://accounts.zoho.com/oauth/v2/token
          refreshUrl: https://accounts.zoho.com/oauth/v2/token
          scopes:
            ZohoCRM.settings.roles.ALL: Full access to CRM roles management
            ZohoCRM.settings.roles.READ: To get user roles
            ZohoCRM.settings.roles.CREATE: To create user roles
            ZohoCRM.settings.roles.UPDATE: To update user roles
            ZohoCRM.settings.roles.DELETE: To delete user roles
