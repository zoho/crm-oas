      style: form
      explode: true
      schema:
        format: int64
        type: string
    ParamQueryIds:
      name: ids
      in: query
      description: >-
        Comma-separated list of variable IDs to delete. Mandatory when deleting
        multiple variables. Maximum: 100 IDs.
      required: false
      style: form
      explode: false
      schema:
        type: array
        minItems: 1
        maxItems: 100
        uniqueItems: true
        items:
          type: string
          format: int64
          description: The unique ID of the variable to delete.
