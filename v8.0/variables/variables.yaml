openapi: 3.1.0
info:
  title: Variables
  description: >-
    Manage CRM variables that store reusable values for use in email templates,
    mail merge templates, inventory templates, and API authentication
    parameters. Supports creating, retrieving, updating, and deleting variables.
    Requires the ZohoCRM.settings.variables scope.
  version: '8'
servers:
  - url: https://zohoapis.{dc}/crm/{version}
    description: API Server URL
    variables:
      dc:
        description: API Server URL TLD
        default: com
        enum:
          - com
          - eu
          - in
          - cn
          - au
          - ca
          - jp
      version:
        description: API Version
        default: v8
paths:
  /settings/variables:
    get:
      summary: Retrieve all variables
      description: >-
        Retrieves all available CRM variables. Returns the API name, display
        name, description, type, value, and variable group for each variable.
        Requires the ZohoCRM.settings.variables.READ scope.
      operationId: getVariables
      responses:
        '200':
          description: OK - Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VariablesListResponse'
              examples:
                Success200:
                  summary: Success response for status 200
                  value:
                    variables:
                      - read_only: false
                        api_name: NewTEST
                        name: NewTEST
                        description: null
                        id: '111115000000091005'
                        source: crm
                        type: integer
                        variable_group:
                          api_name: General
                          id: '111115000000088076'
                        value: ''
                      - read_only: false
                        api_name: newtotest
                        name: newtotest
                        description: null
                        id: '111115000000094003'
                        source: crm
                        type: integer
                        variable_group:
                          api_name: General
                          id: '111115000000088076'
                        value: ''
                      - read_only: false
                        api_name: NTEST
                        name: NTEST
                        description: null
                        id: '111115000000091001'
                        source: crm
                        type: integer
                        variable_group:
                          api_name: General
                          id: '111115000000088076'
                        value: ''
        '403':
          description: Forbidden - The client does not have access rights to the content.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VariablesPermissionDeniedError'
              examples:
                NoPermissionResponse1:
                  summary: 'Error response with code NO_PERMISSION: permission denied'
                  value:
                    code: NO_PERMISSION
                    details:
                      permissions:
                        - Crm_Implied_Variables_Access
                    message: permission denied
                    status: error
      security:
        - OAuth2:
            - ZohoCRM.settings.variables.READ
    put:
      summary: Update variables
      description: >-
        Updates one or more CRM variables in a single request. The id key is
        mandatory in the request body to identify each variable. You cannot
        update the type or variable group of a variable. Requires the
        ZohoCRM.settings.variables.UPDATE scope.
      operationId: updateVariables
      requestBody:
        description: The request body containing the variable data to update.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VariablesBatchUpdateRequestAlt1'
            examples:
              SamplePutRequest:
                summary: Sample request body
                value:
                  variables:
                    - id: '111115000000091005'
                      value: This is a new value
      responses:
        '200':
          description: OK - Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VariablesBatchUpdateResponse'
              examples:
                Success200:
                  summary: Success response for status 200
                  value:
                    variables:
                      - code: SUCCESS
                        details:
                          id: '111111000000114001'
                        message: variable updated
                        status: success
        '400':
          description: Bad Request - The request cannot be processed due to invalid syntax.
          content:
            application/json:
              schema:
                x-zs-$id: UpdateInvalidRequestErrors
                description: Error response for invalid request
                oneOf:
                  - $ref: '#/components/schemas/VariablesInvalidTypeError'
                  - x-zs-$id: UpdateInvalidRequestBodyErrors
                    type: object
                    additionalProperties: false
                    description: Wrapped error response with variables
                    properties:
                      variables:
                        type: array
                        description: Array of error objects
                        items:
                          oneOf:
                            - $ref: >-
                                #/components/schemas/VariableValueInvalidDataError
                            - $ref: >-
                                #/components/schemas/VariablesInvalidDataTypeError
                            - $ref: '#/components/schemas/VariablesInvalidDataError'
                            - $ref: '#/components/schemas/VariableGroupAmbiguityError'
                            - $ref: >-
                                #/components/schemas/VariablesDuplicateDataExtendedError
                            - $ref: >-
                                #/components/schemas/VariableGroupInvalidReferenceError
                        maxItems: 25
                    required:
                      - variables
              examples:
                InvalidDataResponse1:
                  summary: >-
                    Error response with code INVALID_DATA: invalid data (Field:
                    variables)
                  value:
                    code: INVALID_DATA
                    details:
                      maximum_length: 1
                      api_name: variables
                      json_path: $.variables
                    message: invalid data
                    status: error
                InvalidDataResponse2:
                  summary: >-
                    Error response with code INVALID_DATA: invalid data (Field:
                    value)
                  value:
                    variables:
                      - code: INVALID_DATA
                        details:
                          expected_data_type: integer
                          api_name: value
                          json_path: $.variables[0].value
                        message: invalid data
                        status: error
                InvalidDataResponse3:
                  summary: >-
                    Error response with code INVALID_DATA: Invalid data type
                    (Field: id)
                  value:
                    variables:
                      - code: INVALID_DATA
                        message: Invalid data type
                        details:
                          api_name: id
                          expected_data_type: bigint
                          json_path: $.variables[*].id
                        status: error
                InvalidDataResponse4:
                  summary: >-
                    Error response with code INVALID_DATA: Invalid data (Field:
                    id)
                  value:
                    variables:
                      - code: INVALID_DATA
                        message: Invalid data
                        details:
                          api_name: id
                          maximum_length: 14
                          json_path: $.variables[*].id
                        status: error
                InvalidDataResponse5:
                  summary: >-
                    Error response with code INVALID_DATA: Invalid data type
                    (Field: value)
                  value:
                    variables:
                      - code: INVALID_DATA
                        message: Invalid data type
                        details:
                          api_name: value
                          expected_data_type: text
                          json_path: $.variables[*].value
                        status: error
                InvalidDataResponse6:
                  summary: >-
                    Error response with code INVALID_DATA: Invalid data (Field:
                    value)
                  value:
                    variables:
                      - code: INVALID_DATA
                        message: Invalid data
                        details:
                          api_name: value
                          maximum_length: 19
                          json_path: $.variables[*].value
                        status: error
                AmbiguityDuringProcessingResponse1:
                  summary: >-
                    Error response with code AMBIGUITY_DURING_PROCESSING:
                    Ambiguity while processing the request
                  value:
                    variables:
                      - code: AMBIGUITY_DURING_PROCESSING
                        details:
                          ambiguity_due_to:
                            - api_name: id
                              json_path: $.variables[0].id
                        message: Ambiguity while processing the request
                        status: error
                AmbiguityDuringProcessingResponse2:
                  summary: >-
                    Error response with code AMBIGUITY_DURING_PROCESSING:
                    Ambiguity while processing the request
                  value:
                    variables:
                      - code: AMBIGUITY_DURING_PROCESSING
                        details:
                          ambiguity_due_to:
                            - api_name: id
                              json_path: $.variables[0].id
                        message: Ambiguity while processing the request
                        status: error
      security:
        - OAuth2:
            - ZohoCRM.settings.variables.UPDATE
    post:
      summary: Create variables
      description: >-
        Creates one or more CRM variables. The name, api_name, and
        variable_group keys are mandatory. The type key specifies the data type
        of the variable. Possible types: integer, text, percent, decimal,
        currency, date, datetime, email, phone, url, checkbox, textarea, long.
        Requires the ZohoCRM.settings.variables.CREATE scope.
      operationId: createVariables
      requestBody:
        description: The request body containing the variable definitions to create.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VariablesBatchInput'
            examples:
              SamplePostRequest:
                summary: Sample request body
                value:
                  variables:
                    - name: Variable33
                      api_name: Variable33
                      variable_group:
                        id: '400000000470050090988'
                      type: integer
                      value: 33
                      description: This denotes variable 3 description
      responses:
        '201':
          description: Created - Resource created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VariablesBatchOperationCreated'
              examples:
                Success201:
                  summary: Success response for status 201
                  value:
                    variables:
                      - code: SUCCESS
                        details:
                          id: '40000000047009'
                        message: variable added
                        status: success
        '207':
          description: Multi-Status - Response contains mixed status results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VariablesBatchOperationMultiStatus'
              examples:
                Success207:
                  summary: Success response for status 207
                  value:
                    variables:
                      - code: MANDATORY_NOT_FOUND
                        details:
                          api_name: variables
                          json_path: $.variables[0].variables
                        message: Mandatory field variables not found
                        status: error
                      - code: SUCCESS
                        details:
                          id: '1234567890123456'
                        message: Proper success message
                        status: success
        '400':
          description: Bad Request - The request cannot be processed due to invalid syntax.
          content:
            application/json:
              schema:
                x-zs-$id: CreateInvalidRequestErrors
                description: Error response for invalid request
