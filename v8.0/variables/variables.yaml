    delete:
      summary: Delete variables
      description: >-
        Deletes one or more CRM variables by their IDs. Pass variable IDs as a
        comma-separated list in the ids query parameter, or pass rids in the
        rids query parameter. A variable that is associated with other features
        such as email templates, webhooks, or functions cannot be deleted until
        the association is removed. Requires the
        ZohoCRM.settings.variables.DELETE scope.
      operationId: deleteVariables
      parameters:
        - $ref: '#/components/parameters/ParamQueryIds'
      responses:
        '207':
          description: Multi-Status - Response contains mixed status results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VariablesBatchRemovalMultiStatusResponse'
              examples:
                Success207:
                  summary: Success response for status 207
                  value:
                    variables:
                      - code: SUCCESS
                        details:
                          id: '111114000000454011'
                        message: variable deleted
                        status: success
                      - code: SUCCESS
                        details:
                          id: '111114000000454008'
                        message: variable deleted
                        status: success
                      - code: INVALID_DATA
                        details:
                          id: '234576960'
                        message: variable not deleted
                        status: error
        '400':
          description: Bad Request - The request cannot be processed due to invalid syntax.
          content:
            application/json:
              schema:
                x-zs-$id: DeleteInvalidRequestErrors
                description: Error response for invalid request
                oneOf:
                  - $ref: '#/components/schemas/VariablesInvalidTypeError'
                  - x-zs-$id: DeleteVariablesRequiredParamMissingError
                    description: Error response for required parameter missing
                    type: object
                    additionalProperties: false
                    properties:
                      code:
                        description: Represents the error code.
                        type: string
                        enum:
                          - REQUIRED_PARAM_MISSING
                          - EXPECTED_PARAM_MISSING
                      details:
                        description: Additional error details
                        type: object
                        additionalProperties: false
                        properties:
                          param_name:
                            description: The name of the parameter that caused the error.
                            type: string
                            maxLength: 255
                        required:
                          - param_name
                      message:
                        description: A human-readable error message.
                        type: string
                        maxLength: 500
                      status:
                        description: Represents the status of the error.
                        type: string
                        enum:
                          - error
                    required:
                      - code
                      - details
                      - message
                      - status
