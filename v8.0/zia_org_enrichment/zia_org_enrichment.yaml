  /__zia_org_enrichment/{id}:
    get:
      operationId: getOrgEnrichmentById
      summary: Org Enrichment Details
      description: >-
        Fetches the enrichment status and enriched organization data for a
        specific enrichment job using its unique ID. Returns completed,
        scheduled, or failed enrichment information along with enriched fields
        such as name, website, email, address, CEO, revenue, employees, social
        media, and industries.
      x-zs-llm-description: >-
        Fetches enrichment status and enriched org data for a specific
        enrichment job ID.
      parameters:
        - $ref: '#/components/parameters/ZiaOrgEnrichmentId'
      responses:
        '200':
          description: >-
            Returns the details and enriched data of the requested organization
            enrichment job.
          content:
            application/json:
              schema:
                x-zs-$id: GetSpecificOrgEnrichmentResponse
                type: object
                description: >-
                  Defines the response body returned when the requested
                  organization enrichment job is retrieved successfully.
                additionalProperties: false
                properties:
                  __zia_org_enrichment:
                    type: array
                    description: >-
                      Contains the details of the requested organization
                      enrichment job.
                    items:
                      type: object
                      description: >-
                        Represents the full record of a single organization
                        enrichment job, including its trigger fields and
                        enriched output.
                      additionalProperties: false
                      properties:
                        id:
                          type: string
                          maxLength: 19
                          description: >-
                            Shows the unique identifier of the organization
                            enrichment job.
                          x-zs-$id: ZiaOrgEnrichmentByIdId
                        status:
                          type: string
                          enum:
                            - COMPLETED
                            - SCHEDULED
                            - FAILED
                            - DATA_NOT_FOUND
                            - RUNNING
                          description: >-
                            Indicates the current execution status of the
                            enrichment job.


                            Possible values:

                            **COMPLETED** - The job has finished and enriched
                            data is available.

                            **SCHEDULED** - The job is queued and yet to run.

                            **FAILED** - The job ended in a failure.

                            **DATA_NOT_FOUND** - The job completed but Zia could
                            not locate public data to enrich.
                        enrich_based_on:
                          type: object
                          description: >-
                            Shows the trigger values that were supplied when the
                            enrichment job was scheduled.
                          properties:
                            name:
                              type: string
                              description: >-
                                Shows the organization name that was used as a
                                trigger value.
                              maxLength: 255
                            email:
                              type: string
                              format: email
                              description: >-
                                Shows the email address that was used as a
                                trigger value.
                              maxLength: 255
                            website:
                              type: string
                              maxLength: 255
                              description: >-
                                Shows the website domain that was used as a
                                trigger value.
                          additionalProperties: false
                        enriched_data:
                          type:
                            - object
                            - 'null'
                          additionalProperties: true
                          description: >-
                            Contains the data retrieved by Zia for the
                            organization. The keys present in this object depend
                            on the fields configured in the enrichment
                            configuration of the organization. Returns `null`
                            when the job has not yet completed or when no public
                            data could be retrieved.
                      required:
                        - id
                        - status
                        - enrich_based_on
                        - enriched_data
                    maxItems: 1
                required:
                  - __zia_org_enrichment
              examples:
                Example1:
                  value:
                    __zia_org_enrichment:
                      - enriched_data:
                          website: https://www.zoho.com
                          address:
                            - country: India
                              city: Chengalpattu District
                              pin_code: '603202'
