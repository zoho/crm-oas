openapi: 3.1.0
info:
  title: Zia organization enrichment
  description: >-
    The Zia Organization Enrichment API exposes endpoints that schedule and
    track Zia-powered enrichment jobs in Zoho CRM. Use these endpoints to enrich
    organization records with publicly available details such as address,
    primary contact, industries, revenue, and social media handles based on
    supplied trigger values like name, email, or website.
  version: '8'
servers:
  - url: https://zohoapis.{dc}/crm/{version}
    description: >-
      Base URL for the Zoho CRM REST API. Substitute the `dc` and `version`
      variables to target the appropriate data center and API version.
    variables:
      dc:
        enum:
          - com
          - eu
          - in
          - ca
          - au
          - sa
          - ae
        default: com
        description: >-
          Specify the Zoho data center to which the CRM organization belongs.
          Selecting the correct data center is required to route the request to
          the right region.

          Possible values:

          **com** - United States data center.

          **eu** - European Union data center.

          **in** - India data center.

          **ca** - Canada data center.

          **au** - Australia data center.

          **sa** - Saudi Arabia data center.

          **ae** - United Arab Emirates data center.
      version:
        description: >-
          Specify the major version of the Zoho CRM REST API to invoke. The
          value forms part of the request path and selects the contract that the
          server uses to handle the request.
        default: v8
paths:
  /__zia_org_enrichment:
    post:
      operationId: submitOrgEnrichmentRequest
      summary: Trigger organization-level enrichment for a CRM record
      description: >-
        To submit a request that schedules a Zia organization enrichment job in
        your Zoho CRM organization. The job runs asynchronously and uses the
        supplied name, email, or website to retrieve publicly available details
        such as address, primary contact, industries, and social media handles,
        and to populate the configured fields of the target module or record.
      x-zs-llm-description: >-
        Triggers Zia organization enrichment for a CRM record by module and
        record ID.
      parameters:
        - name: module
          in: query
          required: true
          schema:
            type: string
            maxLength: 255
            description: CRM module name from which enrichment is triggered.
          description: >-
            Specify the API name of the CRM module for which enrichment is to be
            triggered. Use the [Get Modules
            API](modules.yaml#$.paths./settings/modules.get) to retrieve the
            list of valid module API names.
        - name: record_id
          in: query
          required: false
          schema:
            type: string
            maxLength: 19
            description: Unique CRM record ID for which enrichment is requested.
          description: >-
            Specify the unique identifier of the record for which enrichment is
            to be triggered. When omitted, the job runs at the module level. Use
            the records API of the target module to retrieve record identifiers.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: >-
                Defines the body of a Zia organization enrichment request. Wraps
                the list of enrichment inputs under the `__zia_org_enrichment`
                key.
              properties:
                __zia_org_enrichment:
                  type: array
                  description: >-
                    Specify the list of enrichment requests to schedule. You can
                    supply up to 50 entries in a single call.
                  items:
                    type: object
                    description: >-
                      Represents a single Zia organization enrichment request
                      that defines the trigger fields used to identify the
                      organization.
                    properties:
                      enrich_based_on:
                        type: object
                        description: >-
                          Specify the details of the fields on whose values you
                          want to trigger enrichment.  Note that you must
                          provide at least one of the following values in the
                          input. Based on these values, Zia will look for
                          information on the web and enrich fields as per
                          [Enrichment
                          Configuration.](zia_enrichment.yaml#$.paths./settings/zia/data_enrichment.get))
                          Note that the values of these keys must be at least
                          three characters long and only in English.
                        properties:
                          name:
                            type: string
                            description: >-
                              Specify the name of the organization  that Zia
                              uses as a trigger value to look up enrichment
                              data.
                            maxLength: 255
                          email:
                            type: string
                            format: email
                            description: >-
                              Specify the email address of the organization that
                              Zia uses as a trigger value to look up enrichment
                              data.
                          website:
                            type: string
                            format: website
                            description: >-
                              Specify the website domain of the organization
                              that Zia uses as a trigger value to look up
                              enrichment data.
                        required:
                          - name
                        additionalProperties: false
                    required:
                      - enrich_based_on
                    additionalProperties: false
                  maxItems: 50
              required:
                - __zia_org_enrichment
              additionalProperties: false
            examples:
              Example1:
                value:
                  __zia_org_enrichment:
                    - enrich_based_on:
                        name: zoho
                        email: sales@zohocorp.com
                        website: www.zoho.com
                description: >-
                  Demonstrates a request that triggers organization enrichment
                  for the Accounts module by supplying all three trigger fields.
                summary: Schedule enrichment with name, email, and website
        description: >-
          Specify the payload that contains the list of enrichment requests.
          Each request supplies trigger values that Zia uses to look up public
          information about the organization.
      responses:
        '202':
          description: >-
            Returns a confirmation that the enrichment job has been accepted and
            queued for asynchronous execution.
          content:
            application/json:
              schema:
                x-zs-$id: CreateOrgEnrichmentResponse
                type: object
                properties:
                  __zia_org_enrichment:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          description: >-
                            Indicates the scheduling outcome of the enrichment
                            request.


                            Possible values:

                            **SCHEDULED** - The enrichment job has been queued
                            for asynchronous execution.
                          enum:
                            - SCHEDULED
                        details:
                          type: object
                          properties:
                            id:
                              type: string
                              description: >-
                                Shows the unique identifier assigned to the
                                scheduled enrichment job. Use this identifier
                                with GET `/__zia_org_enrichment/{id}` to
                                retrieve job status and enriched data.
                              maxLength: 255
                          required:
                            - id
                          description: >-
                            Contains identifying information about the scheduled
                            enrichment job.
                          additionalProperties: false
                        message:
                          type: string
                          description: >-
                            Provides a message that describes the outcome of the
                            scheduling request.
                          maxLength: 255
                        status:
                          type: string
                          description: >-
                            Indicates whether the scheduling request succeeded.


                            Possible values:

                            **success** - The enrichment job was successfully
                            accepted and queued.
                          enum:
                            - success
                      required:
                        - code
                        - details
                        - message
                        - status
                      description: >-
                        Represents the scheduling result of a single enrichment
                        request.
                      additionalProperties: false
                    description: >-
                      Contains the list of scheduling results, one entry per
                      submitted enrichment request.
                    maxItems: 50
                required:
                  - __zia_org_enrichment
                description: >-
                  Defines the response body returned when a Zia organization
                  enrichment job is successfully scheduled.
                additionalProperties: false
              examples:
                Example:
                  value:
                    __zia_org_enrichment:
                      - code: SCHEDULED
                        details:
                          id: '917992000008742464'
                        message: Org Enrichment scheduled successfully
                        status: success
                  description: >-
                    Demonstrates the response returned when the enrichment
                    request is accepted and a job identifier is issued.
                  summary: Enrichment job scheduled
        '400':
          description: >-
            Returned when the request cannot be processed because of validation
            failures, missing inputs, exceeded enrichment limits, an unsupported
            module, or because the data enrichment feature is not enabled or not
            supported. Resolution: review the returned `code` and `details` to
            identify the offending input and resend the request after correcting
            it.
          content:
            application/json:
              schema:
                x-zs-$id: OrgEnrichmentErrorResponse
                oneOf:
                  - type: object
                    x-zs-$id: OrgEnrichmentValidationErrorResponse
                    properties:
                      __zia_org_enrichment:
                        type: array
                        items:
                          type: object
                          properties:
                            code:
                              type: string
                              description: >-
                                Identifies the validation failure that was
                                raised.


                                Possible values:

                                **INVALID_DATA** - A value supplied in
                                `enrich_based_on` is incorrect, shorter than
                                three characters, in a non-English language, or
                                has the wrong data type.

                                **MANDATORY_NOT_FOUND** - The mandatory key
                                `enrich_based_on` was not supplied in the input.
                              enum:
                                - INVALID_DATA
                                - MANDATORY_NOT_FOUND
                            details:
                              type: object
                              properties:
                                expected_data_type:
                                  type: string
                                  description: >-
                                    Indicates the data type that the field
                                    expects when the supplied value uses an
                                    incorrect type.
                                  maxLength: 255
                                api_name:
                                  type: string
                                  description: >-
                                    Identifies the field whose value failed
                                    validation.


                                    Possible values:

                                    **name** - The organization name in
                                    `enrich_based_on`.

                                    **email** - The organization email in
                                    `enrich_based_on`.

                                    **website** - The organization website in
                                    `enrich_based_on`.

                                    **enrich_based_on** - The `enrich_based_on`
                                    object itself.
                                  enum:
                                    - name
                                    - email
                                    - website
                                    - enrich_based_on
                                json_path:
                                  type: string
                                  description: >-
                                    Shows the JSON path that points to the exact
                                    field in the request payload that failed
                                    validation.
                                  enum:
                                    - >-
                                      $.__zia_org_enrichment[0].enrich_based_on.name
                                    - >-
                                      $.__zia_org_enrichment[0].enrich_based_on.email
                                    - >-
                                      $.__zia_org_enrichment[0].enrich_based_on.website
                                    - $.__zia_org_enrichment[0].enrich_based_on
                              required:
                                - api_name
                                - json_path
                              description: >-
                                Contains additional context that identifies the
                                invalid or missing input field.
                              additionalProperties: false
                            message:
                              type: string
                              description: >-
                                Provides a message that explains the validation
                                failure like "You have not specified the key
                                "enrich_based_on" in the input".
                              maxLength: 255
                            status:
                              type: string
                              description: >-
                                Indicates that the request ended in failure.


                                Possible values:

                                **error** - The request could not be processed
                                because of a validation error.
                              enum:
                                - error
                          required:
                            - code
                            - details
                            - message
                            - status
                          description: >-
                            Represents a single validation error related to the
                            `enrich_based_on` input.
                          additionalProperties: false
                        description: >-
                          Contains the list of validation errors detected in the
                          submitted enrichment requests.
                        maxItems: 50
                    required:
                      - __zia_org_enrichment
                    description: >-
                      Returned when one or more values inside `enrich_based_on`
                      are invalid or when the mandatory `enrich_based_on` key
                      itself is missing.
                    additionalProperties: false
                  - type: object
                    x-zs-$id: OrgEnrichmentLimitExceededErrorResponse
                    properties:
                      __zia_org_enrichment:
                        type: array
                        items:
                          type: object
                          properties:
                            code:
                              type: string
                              description: >-
                                Identifies the limit violation that was raised.


                                Possible values:

                                **LIMIT_EXCEEDED** - The organization has used
                                up its enrichment quota for the current edition.
                              enum:
                                - LIMIT_EXCEEDED
                            details:
                              type: object
                              properties:
                                limit:
                                  type: integer
                                  description: >-
                                    Shows the maximum number of enrichments
                                    allowed for the organization based on its
                                    CRM edition and user count.
                                  format: int32
                                limit_due_to:
                                  type: array
                                  items:
                                    type: object
                                    properties:
                                      api_name:
                                        type: string
                                        description: >-
                                          Identifies the API name of the field
                                          that contributed to the limit breach.
                                        enum:
                                          - enrich_based_on
                                      json_path:
                                        type: string
                                        description: >-
                                          Shows the JSON path that points to the
                                          field in the request payload that
                                          contributed to the limit breach.
                                        enum:
                                          - >-
                                            $.__zia_org_enrichment[0].enrich_based_on
                                    required:
                                      - api_name
                                      - json_path
                                    description: >-
                                      Identifies a single input field that
                                      contributed to the enrichment limit
                                      breach.
                                    additionalProperties: false
                                  description: >-
                                    Lists the input fields that contributed to
                                    the limit breach.
                                  maxItems: 1
                              required:
                                - limit
                                - limit_due_to
                              description: >-
                                Contains additional context about the enrichment
                                limit that was breached.
                              additionalProperties: false
                            message:
                              type: string
                              description: >-
                                Provides a message that explains the limit
                                violation like, "You have created more than the
                                allowed enrichments for your org."
                              maxLength: 255
                            status:
                              type: string
                              description: >-
                                Indicates that the request ended in failure.


                                Possible values:

                                **error** - The request could not be processed
                                because the enrichment limit was breached.
                              enum:
                                - error
                          required:
                            - code
                            - details
                            - message
                            - status
                          description: >-
                            Represents a single limit-exceeded error for an
                            enrichment request.
                          additionalProperties: false
                        description: >-
                          Contains the list of enrichment requests that breached
                          the configured limit.
                        maxItems: 1
                    required:
                      - __zia_org_enrichment
                    description: >-
                      Returned when the organization has reached its allowed
                      enrichment quota and the new request cannot be accepted.
                    additionalProperties: false
                  - type: object
                    x-zs-$id: CreateOrgEnrichmentExpectedFieldsMissingResponse
                    properties:
                      __zia_org_enrichment:
                        type: array
                        items:
                          type: object
                          properties:
                            code:
                              type: string
                              description: >-
                                Identifies the missing-input failure that was
                                raised.


                                Possible values:

                                **EXPECTED_FIELD_MISSING** - None of the trigger
                                fields expected inside `enrich_based_on` were
                                supplied.
                              enum:
                                - EXPECTED_FIELD_MISSING
                            details:
                              type: object
                              properties:
                                expected_fields:
                                  type: array
                                  items:
                                    type: object
                                    properties:
                                      api_name:
                                        type: string
                                        description: >-
                                          Shows the API name of the expected
                                          trigger field.
                                        enum:
                                          - name
                                          - email
                                          - website
                                      json_path:
                                        type: string
                                        description: >-
                                          Shows the JSON path at which the
                                          expected trigger field should appear in
                                          the request payload.
                                        enum:
                                          - >-
                                            $.__zia_org_enrichment[0].enrich_based_on.name
                                          - >-
                                            $.__zia_org_enrichment[0].enrich_based_on.email
                                          - >-
                                            $.__zia_org_enrichment[0].enrich_based_on.website
                                    required:
                                      - api_name
                                      - json_path
                                    description: >-
                                      Identifies a single trigger field that the
                                      request was expected to include.
                                    additionalProperties: false
                                  description: >-
                                    Lists the trigger fields that the request
                                    must include inside `enrich_based_on`.
                                  maxItems: 50
                              required:
                                - expected_fields
                              description: >-
                                Contains the list of trigger fields that the
                                request was expected to include.
                              additionalProperties: false
                            message:
                              type: string
                              description: >-
                                Provides a message that explains which trigger
                                fields are expected like, "You have not
                                specified any key in the "enrich_based_on" JSON
                                object."
                              maxLength: 255
                            status:
                              type: string
                              description: >-
                                Indicates that the request ended in failure.


                                Possible values:

                                **error** - The request could not be processed
                                because no expected trigger field was supplied.
                              enum:
                                - error
                          required:
                            - code
                            - details
                            - message
                            - status
                          description: >-
                            Represents a single error reporting the absence of
                            expected trigger fields.
                          additionalProperties: false
                        description: >-
                          Contains the list of errors identifying the missing
                          expected fields.
                        maxItems: 50
                    required:
                      - __zia_org_enrichment
                    description: >-
                      Returned when the `enrich_based_on` object was supplied
                      but does not include any of the expected trigger fields.
                    additionalProperties: false
                  - type: object
                    x-zs-$id: OrgEnrichmentInvalidParamErrorResponse
                    properties:
                      code:
                        type: string
                        description: >-
                          Identifies the parameter-level failure that was
                          raised.


                          Possible values:

                          **REQUIRED_PARAM_MISSING** - The required `module`
                          query parameter was not supplied.

                          **INVALID_DATA** - The supplied `module` value is not
                          supported for organization enrichment.
                        enum:
                          - REQUIRED_PARAM_MISSING
                          - INVALID_DATA
                          - NOT_SUPPORTED
                      details:
                        type: object
                        properties:
                          param_name:
                            type: string
                            description: >-
                              Shows the name of the query parameter that
                              triggered the failure.
                            enum:
                              - module
                              - record_id
                        required:
                          - param_name
                        description: >-
                          Contains additional context that identifies the
                          offending query parameter.
                        additionalProperties: false
                      message:
                        type: string
                        description: >-
                          Provides a message that explains the parameter-level
                          failure.
                        maxLength: 255
                      status:
                        type: string
                        description: >-
                          Indicates that the request ended in failure.


                          Possible values:

                          **error** - The request could not be processed because
                          of a parameter-level failure.
                        enum:
                          - error
                    required:
                      - code
                      - details
                      - message
                      - status
                    description: >-
                      Returned when a required query parameter is missing or
                      when the supplied `module` value is not supported for
                      organization enrichment.
                    additionalProperties: false
                  - $ref: '#/components/schemas/FeatureNotEnableOrNotSupported'
                  - type: object
                    x-zs-$id: OrgEnrichmentInvalidDataErrorResponse
                    properties:
                      code:
                        type: string
                        description: >-
                          Identifies the array-level validation failure that was
                          raised.


                          Possible values:

                          **INVALID_DATA** - The submitted
                          `__zia_org_enrichment` array contains more entries
                          than the allowed maximum.
                        enum:
                          - INVALID_DATA
                      details:
                        type: object
                        properties:
                          maximum_length:
                            type: integer
                            description: >-
                              Shows the maximum number of entries allowed in the
                              array.
                            format: int32
                          api_name:
                            type: string
                            description: >-
                              Identifies the array field whose cardinality was
                              exceeded.
                            enum:
                              - __zia_org_enrichment
                          json_path:
                            type: string
                            description: >-
                              Shows the JSON path that points to the array field
                              whose cardinality was exceeded.
                            enum:
                              - $.__zia_org_enrichment
                        required:
                          - maximum_length
                          - api_name
                          - json_path
                        description: >-
                          Contains additional context about the array-level
                          validation failure.
                        additionalProperties: false
                      message:
                        type: string
                        description: >-
                          Provides a message that explains the array cardinality
                          violation.
                        maxLength: 255
                      status:
                        type: string
                        description: >-
                          Indicates that the request ended in failure.


                          Possible values:

                          **error** - The request could not be processed because
                          the array exceeded its allowed cardinality.
                        maxLength: 255
                    required:
                      - code
                      - details
                      - message
                      - status
                    description: >-
                      Returned when the top-level `__zia_org_enrichment` array
                      exceeds its allowed cardinality.
                    additionalProperties: false
                description: >-
                  Defines the set of bad-request error envelopes that the POST
                  `/__zia_org_enrichment` endpoint can return. Exactly one
                  variant matches the failure condition.
              examples:
                Example:
                  value:
                    __zia_org_enrichment:
                      - code: INVALID_DATA
                        details:
                          expected_data_type: text
                          api_name: name
                          json_path: $.__zia_org_enrichment[0].enrich_based_on.name
                        message: invalid data
                        status: error
                  description: >-
                    Demonstrates the response returned when a value supplied
                    inside `enrich_based_on` is not valid.
                  summary: Invalid value in enrich_based_on
                Example2:
                  value:
                    __zia_org_enrichment:
                      - code: LIMIT_EXCEEDED
                        details:
                          limit: 1500
                          limit_due_to:
                            - api_name: enrich_based_on
                              json_path: $.__zia_org_enrichment[0].enrich_based_on
                        message: enrichment data limit exceeded
                        status: error
                  description: >-
                    Demonstrates the response returned when the organization has
                    used up its enrichment quota.
                  summary: Enrichment limit exceeded
                Example3:
                  value:
                    __zia_org_enrichment:
                      - code: EXPECTED_FIELD_MISSING
                        details:
                          expected_fields:
                            - api_name: name
                              json_path: $.__zia_org_enrichment[0].enrich_based_on.name
                            - api_name: email
                              json_path: $.__zia_org_enrichment[0].enrich_based_on.email
                            - api_name: website
                              json_path: >-
                                $.__zia_org_enrichment[0].enrich_based_on.website
                        message: Specify atleast one field
                        status: error
                  description: >-
                    Demonstrates the response returned when the
                    `enrich_based_on` object does not contain any of the
                    expected trigger fields.
                  summary: Expected trigger fields missing
                Example4:
                  value:
                    code: INVALID_DATA
                    details:
                      param_name: module
                    message: The given module is not supported for Org Enrichment
                    status: error
                  description: >-
                    Demonstrates the response returned when the supplied
                    `module` value is not supported for organization enrichment.
                  summary: Module not supported
                Example5:
                  value:
                    code: FEATURE_NOT_ENABLED
                    details: {}
                    message: Data Enrichment feature not enabled
                    status: error
                  description: >-
                    Demonstrates the response returned when the data enrichment
                    feature is not enabled for the organization.
                  summary: Data enrichment feature not enabled
                Example6:
                  value:
                    code: INVALID_DATA
                    details:
                      maximum_length: 1
                      api_name: __zia_org_enrichment
                      json_path: $.__zia_org_enrichment
                    message: invalid data
                    status: error
                  description: >-
                    Demonstrates the response returned when the top-level
                    `__zia_org_enrichment` array contains more entries than the
                    allowed maximum.
                  summary: Array cardinality exceeded
        '403':
          description: >-
            Returned when the authenticated user does not have the required
            permission to access the data enrichment feature. Resolution:
            contact the system administrator to be granted the Manage or View
            Data Enrichment profile permission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoPermission'
              examples:
                Example:
                  value:
                    code: NO_PERMISSION
                    details: {}
                    message: No permission to access this feature
                    status: error
                  description: >-
                    Demonstrates the response returned when the authenticated
                    user does not have permission to access the data enrichment
                    feature.
                  summary: Permission denied
      security:
        - OAuth2:
            - ZohoCRM.settings.intelligence.CREATE
    get:
      summary: Get Zia Org Enrichment
      description: >-
        To retrieve the paginated list of Zia organization enrichment jobs that
        have been scheduled in your Zoho CRM organization. Each entry includes
        the job identifier, current status, creation timestamp, and the user who
        triggered the job.
      x-zs-llm-description: >-
        Lists Zia organization enrichment records with pagination and filter
        support.
      operationId: getZiaOrgEnrichment
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Perpage'
        - $ref: '#/components/parameters/Sortby'
        - $ref: '#/components/parameters/Sortorder'
        - $ref: '#/components/parameters/Status'
      responses:
        '200':
          description: >-
            Returns the paginated list of organization enrichment jobs along
            with pagination metadata.
          content:
            application/json:
              schema:
                type: object
                x-zs-$id: GetOrgEnrichmentResponse
                description: >-
                  Defines the response body returned when the list of
                  organization enrichment jobs is retrieved successfully.
                additionalProperties: false
                properties:
                  __zia_org_enrichment:
                    type: array
                    description: >-
                      Contains the list of organization enrichment jobs for the
                      current page.
                    items:
                      type: object
                      description: >-
                        Represents a single organization enrichment job and its
                        scheduling metadata.
                      additionalProperties: false
                      properties:
                        id:
                          type: string
                          maxLength: 19
                          description: >-
                            Shows the unique identifier of the organization
                            enrichment job. Use this identifier with GET
                            `/__zia_org_enrichment/{id}` to retrieve the
                            enriched data of the job.
                          x-zs-$id: ZiaOrgEnrichmentId
                        status:
                          type: string
                          enum:
                            - SCHEDULED
                            - COMPLETED
