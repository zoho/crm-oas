components:
  parameters:
    Page:
      name: page
      in: query
      required: false
      description: >-
        Specify the page number to retrieve the list of records from the
        paginated results. Default value is 1. Accepts only positive integer
        values.
      schema:
        type: integer
        format: int32
        enum:
          - 1
          - 2
    Perpage:
      name: per_page
      in: query
      required: false
      description: >-
        Specify the number of records to retrieve per page. Default and maximum
        value is 100.
      schema:
        type: integer
        format: int32
        enum:
          - 100
    Sortby:
      name: sort_by
      in: query
      required: false
      description: >-
        Specify the field to use for sorting the response based on created time.
        Accepts the literal value `created_time`.
      schema:
        type: string
        enum:
          - created_time
    Sortorder:
      name: sort_order
      in: query
      required: false
      description: >-
        Specify the direction(ascending or descending) in which to sort the
        response.


        Possible values:

        **asc** - Sort results in ascending order.

        **desc** - Sort results in descending order.
      schema:
        type: string
        enum:
          - asc
          - desc
    Status:
      name: status
      in: query
      required: false
      description: >-
        Filter the response by the status of the scheduled enrichment job, using
        the create org enrichment API.


        Possible values:

        **COMPLETED** - Returns jobs that finished and produced enriched data.

        **FAILED** - Returns jobs that ended with a failure.

        **DATA_NOT_FOUND** - Returns jobs that completed but could not locate
        any public data to enrich.

        **SCHEDULED** - Returns jobs that are queued and yet to run.
      schema:
        type: string
        enum:
          - COMPLETED
          - FAILED
          - DATA_NOT_FOUND
          - SCHEDULED
    ZiaOrgEnrichmentId:
      name: id
      in: path
      required: true
      description: >-
        Specify the unique identifier of the Zia organization enrichment job to
        retrieve. Obtain this value from the response of POST
        `/__zia_org_enrichment` or from the listing returned by GET
        `/__zia_org_enrichment`.
      schema:
        type: string
        maxLength: 255
  schemas:
    FeatureNotEnableOrNotSupported:
      type: object
      x-zs-$id: FeatureNotEnableOrNotSupported
      properties:
        code:
          type: string
          description: >-
            Identifies the feature-availability failure that was raised.


            Possible values:

            **FEATURE_NOT_ENABLED** - The data enrichment feature has not been
            enabled for the organization.

            **FEATURE_NOT_SUPPORTED** - The current CRM edition does not support
            the data enrichment feature.
          enum:
            - FEATURE_NOT_ENABLED
            - FEATURE_NOT_SUPPORTED
        details:
          type: object
          properties: {}
          description: >-
            Contains additional context about the feature-availability failure.
            This object remains empty for this error.
          additionalProperties: false
        message:
          type: string
          description: Data enrichment is not available for your edition of CRM.
          maxLength: 255
        status:
          type: string
          description: >-
            Indicates that the request ended in failure.


            Possible values:

            **error** - The request could not be processed because the data
            enrichment feature is unavailable.
          enum:
            - error
      required:
        - code
        - details
        - message
        - status
      description: >-
        Error envelope returned when the data enrichment feature is either
        disabled for the organization or not available under the current CRM
        edition.
      additionalProperties: false
    NoPermission:
      type: object
      x-zs-$id: NoPermission
      properties:
        code:
          type: string
          description: >-
            Identifies the permission failure that was raised.


            Possible values:

            **NO_PERMISSION** - The authenticated user lacks the profile
            permission required to access the data enrichment feature.
          enum:
            - NO_PERMISSION
        details:
          type: object
          properties: {}
          description: >-
            Contains additional context about the permission failure. This
            object remains empty for this error.
          additionalProperties: false
        message:
          type: string
          description: >-
            You do not have the Manage or View Data Enrichment permission to
            access this feature.
          maxLength: 255
        status:
          type: string
          description: >-
            Indicates that the request ended in failure.


            Possible values:

            **error** - The request could not be processed because the user
            lacks the required permission.
          enum:
            - error
      required:
        - code
        - details
        - message
        - status
      description: >-
        Error envelope returned when the authenticated user does not have
        permission to access the data enrichment feature.
      additionalProperties: false
    ZiaOrgEnrichmentInvalidParam:
      type: object
      x-zs-$id: ZiaOrgEnrichmentInvalidParam
      description: >-
        Error envelope returned when a supplied query parameter such as
        `status`, `sort_by`, or `sort_order` does not match the allowed set of
        values.
      additionalProperties: false
      properties:
        code:
          type: string
          enum:
            - INVALID_DATA
          description: >-
            Identifies the parameter-validation failure that was raised.


            Possible values:

            **INVALID_DATA** - The supplied query parameter value is not among
            the allowed values.
        details:
          type: object
          description: >-
            Contains additional context that identifies the offending query
            parameter and lists the values that the parameter accepts.
          additionalProperties: false
          properties:
            param:
              type: string
              enum:
                - status
                - sort_order
                - sort_by
              description: >-
                Shows the name of the query parameter whose value failed
                validation.
            supported_values:
              oneOf:
                - type: array
                  x-zs-$id: ZiaOrgEnrichmentStatusSupportedValues
                  items:
                    type: string
                    description: >-
                      Represents a single value accepted by the `status` query
                      parameter.


                      Possible values:

                      **COMPLETED** - The job has finished and enriched data is
                      available.

                      **SCHEDULED** - The job is queued and yet to run.

                      **FAILED** - The job ended in a failure.

                      **RUNNING** - The job is currently running.

                      **DATA_NOT_FOUND** - The job completed but Zia could not
                      locate public data to enrich.
                    enum:
                      - COMPLETED
                      - SCHEDULED
                      - FAILED
                      - RUNNING
                      - DATA_NOT_FOUND
                      - UPDATED
                  maxItems: 5
                  description: Lists the values accepted by the `status` query parameter.
                - type: array
                  x-zs-$id: ZiaOrgEnrichmentSortOrderSupportedValues
                  items:
                    type: string
                    description: >-
                      Represents a single value accepted by the `sort_order`
                      query parameter.


                      Possible values:

                      **asc** - Sort results in ascending order.

                      **desc** - Sort results in descending order.
                    enum:
                      - asc
                      - desc
                  maxItems: 2
                  description: >-
                    Lists the values accepted by the `sort_order` query
                    parameter.
                - type: array
                  x-zs-$id: ZiaOrgEnrichmentSortBySupportedValues
                  items:
                    type: string
                    description: >-
                      Represents a single value accepted by the `sort_by` query
                      parameter.


                      Possible values:

                      **created_time** - Sort results by the timestamp at which
                      each enrichment job was scheduled.
                    enum:
                      - created_time
                  maxItems: 1
                  description: Lists the values accepted by the `sort_by` query parameter.
              description: >-
                Lists the values that the offending query parameter accepts. The
                exact list depends on which parameter raised the failure.
          required:
            - param
            - supported_values
        message:
          type: string
          maxLength: 255
          description: Provides a message that explains the parameter-validation failure.
        status:
          type: string
          enum:
            - error
          description: >-
            Indicates that the request ended in failure.


            Possible values:

            **error** - The request could not be processed because of a
            parameter-validation failure.
      required:
        - code
        - details
        - message
        - status
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://accounts.zoho.com/oauth/v2/auth
          tokenUrl: https://accounts.zoho.com/oauth/v2/token
          refreshUrl: https://accounts.zoho.com/oauth/v2/token
          scopes:
            ZohoCRM.settings.intelligence.ALL: >-
              Grants full access to read, create, update, and delete Zia
              organization enrichment jobs.
            ZohoCRM.settings.intelligence.READ: >-
              Grants permission to retrieve Zia organization enrichment jobs and
              their enriched data.
            ZohoCRM.settings.intelligence.CREATE: >-
              Grants permission to schedule new Zia organization enrichment
              jobs.
            ZohoCRM.settings.intelligence.UPDATE: >-
              Grants permission to update existing Zia organization enrichment
              jobs.
            ZohoCRM.settings.intelligence.DELETE: Grants permission to delete Zia organization enrichment jobs.
