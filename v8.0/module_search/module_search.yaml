                        description: Represents additional details about the error.
                        additionalProperties: false
                    required:
                      - status
                      - code
                      - message
                      - details
                  - type: object
                    x-zs-$id: GenericBadRequestErrorResponse
                    description: >-
                      Represents the error response returned for invalid request
                      scenarios not covered by other specific error codes.
                    additionalProperties: false
                description: >-
                  Represents the error response returned when the search request
                  is invalid. The specific error format depends on the type of
                  validation failure.
              examples:
                MissingParameter:
                  summary: Missing required search parameter
                  value:
                    status: error
                    code: EXPECTED_PARAM_MISSING
                    message: one of the expected parameter is missing
                    details:
                      param_names:
                        - criteria
                        - email
                        - phone
                        - word
                  description: >-
                    Shows the error response when none of the required search
                    parameters (criteria, email, phone, or word) are included in
                    the request.
                InvalidModule:
                  summary: Invalid module specified
                  value:
                    status: error
                    code: INVALID_MODULE
                    message: the module name given seems to be invalid
                    details:
                      resource_path_index: 0
                  description: >-
                    Shows the error response when a non-existent or unsearchable
                    module API name is provided.
        '401':
          description: >-
            Authentication failed or the access token does not include the
            required OAuth scope. Resolution: Generate a new access token that
            includes the required module-level READ scope and retry the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                OauthScopeMismatch:
                  summary: Missing required OAuth scope
                  value:
                    code: OAUTH_SCOPE_MISMATCH
                    details: {}
                    message: Unauthorized
                    status: error
                  description: >-
                    Shows the error response when the access token does not
                    include a valid module-level READ scope.
        '403':
          description: >-
            The authenticated user does not have permission to access the
            specified module. Resolution: Contact the Zoho CRM administrator to
            grant the required module access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                NoPermission:
                  summary: Insufficient permissions for module access
                  value:
                    code: NO_PERMISSION
                    details: {}
                    message: Permission denied to read
                    status: error
                  description: >-
                    Shows the error response when the authenticated user does
                    not have the required permission to access the module.
        '404':
          description: >-
            The request URL is invalid or the specified module does not exist.
            Resolution: Verify that the module API name and URL structure are
            correct.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                InvalidUrlPattern:
                  summary: Invalid API endpoint URL
                  value:
                    code: INVALID_URL_PATTERN
                    details: {}
                    message: Please check if the URL trying to access is a correct one
                    status: error
                  description: >-
                    Shows the error response when the request URL does not match
                    a valid API endpoint pattern.
        '429':
          description: >-
            The API request rate limit has been exceeded. Resolution: Reduce the
            frequency of API calls and retry the request after the rate limit
            window resets.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                RateLimitExceeded:
                  summary: API rate limit exceeded
                  value:
                    code: RATE_LIMIT_EXCEEDED
                    details: {}
                    message: Too many requests. Please try again later.
                    status: error
                  description: >-
                    Shows the error response when the API request rate limit has
                    been exceeded.
        '500':
          description: >-
            An unexpected error occurred on the server. Resolution: Retry the
            request. If the issue persists, contact Zoho CRM support.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                InternalError:
                  summary: Unexpected server error
                  value:
                    code: INTERNAL_ERROR
                    details: {}
                    message: Internal Server Error
                    status: error
                  description: >-
                    Shows the error response when an unexpected internal server
                    error is encountered.
        '502':
          description: >-
            A temporary upstream dependency failure occurred. Resolution: Retry
            the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                ServiceUnavailable:
                  summary: Upstream service failure
                  value:
                    code: SERVICE_UNAVAILABLE
                    details: {}
                    message: Service temporarily unavailable
                    status: error
                  description: >-
                    Shows the error response when a temporary upstream
                    dependency failure causes the request to fail.
        '503':
          description: >-
            The service is temporarily unavailable due to scheduled maintenance
            or capacity constraints. Resolution: Retry the request after the
            maintenance window ends.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                MaintenanceMode:
                  summary: Service unavailable for maintenance
                  value:
                    code: SERVICE_UNAVAILABLE
                    details: {}
                    message: Service temporarily unavailable for maintenance
                    status: error
                  description: >-
                    Shows the error response when the service is unavailable due
                    to scheduled maintenance.
