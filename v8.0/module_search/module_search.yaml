                            enum:
                              - '2000'
                        required:
                          - limit
                    required:
                      - status
                      - code
                      - message
                      - details
                  - type: object
                    x-zs-$id: CriteriaLimitExceededErrorResponse
                    description: >-
                      Represents the error response returned when the search
                      criteria contains more than 15 conditions.
                    additionalProperties: false
                    properties:
                      status:
                        type: string
                        description: |-
                          Represents the status of the response.
                          Possible values:
                          **error** - The request encountered an error.
                        enum:
                          - error
                      code:
                        type: string
                        description: >-
