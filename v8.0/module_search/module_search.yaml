                    additionalProperties: false
                    properties:
                      status:
                        type: string
                        description: |-
                          Represents the status of the response.
                          Possible values:
                          **error** - The request encountered an error.
                        enum:
                          - error
                      code:
                        type: string
                        description: >-
                          Represents the error code for the response.

                          Possible values:

                          **INVALID_QUERY** - The IN operator criteria exceeds
                          the allowed value count.
                        enum:
                          - INVALID_QUERY
                      message:
                        type: string
                        description: >-
                          Represents the error message describing the IN
