openapi: 3.1.0
info:
  title: Search Records
  description: >-
    The Search Records API retrieves records that match the specified search
    parameters within a single module in your Zoho CRM organization. It supports
    criteria-based filtering, full-text word search, and lookup by email or
    phone number.
  version: '8'
  summary: >-
    Zoho CRM Search API allows you to search for records in a specified module
    using various criteria and parameters.
servers:
  - url: https://zohoapis.{dc}/crm/{version}
    description: >-
      Production server for the Zoho CRM API. The URL includes the datacenter
      domain and API version.
    variables:
      dc:
        enum:
          - com
          - eu
          - in
          - cn
          - au
        default: com
        description: >-
          The top-level domain of the Zoho CRM datacenter where the organization
          is hosted.

          Possible values:

          **com** - United States.

          **eu** - European Union.

          **in** - India.

          **cn** - China.

          **au** - Australia.
      version:
        default: v8
        description: The version of the Zoho CRM API to use. Defaults to **v8**.
paths:
  /{module}/bulk/search:
    post:
      tags:
        - Search
      summary: Bulk Search Records by Criteria, Word, Email, or Phone
      operationId: bulkSearchRecords
      description: >-
        Searches for records in the specified module that match the given search
        criteria. This API accepts the same search parameters as the GET
        /{module}/search API, but they are provided in the request body instead
        of query parameters. Use this API when the search criteria are too long
        to be passed as query parameters. You must specify at least one of the
        following search parameters: criteria, email, phone, or word. A maximum
        of 2,000 records can be retrieved per search, with up to 15 criteria
        conditions. Newly created or updated records may not appear immediately
        in the search results due to indexing delays.
      parameters:
        - $ref: '#/components/parameters/Module'
        - $ref: '#/components/parameters/ApprovalState'
        - $ref: '#/components/parameters/Criteria'
        - $ref: '#/components/parameters/Converted'
        - $ref: '#/components/parameters/SearchWord'
        - $ref: '#/components/parameters/SearchEmail'
        - $ref: '#/components/parameters/SearchPhone'
        - $ref: '#/components/parameters/Fields'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/SortBy'
        - $ref: '#/components/parameters/SortOrder'
        - $ref: '#/components/parameters/Type'
      responses:
        '200':
          description: >-
            Successful response containing the list of records matching the
            search criteria.
          content:
            application/json:
              schema:
                type: object
                x-zs-$id: ModuleBulkSearchResponse
                description: >-
                  Successful bulk search response containing matched records and
                  pagination information
                additionalProperties: false
                properties:
                  data:
                    type: array
                    description: Array of records matching the search criteria
                    maxItems: 200
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: Unique identifier of the record
                          maxLength: 50
                        Owner:
                          type: object
                          description: Owner information of the record
                          additionalProperties: false
                          properties:
                            name:
                              type: string
                              description: Name of the record owner
                              maxLength: 255
                            id:
                              type: string
                              description: Unique identifier of the owner
                              maxLength: 50
                            email:
                              type: string
                              description: Email address of the owner
                              format: email
                        Created_Time:
                          type: string
                          description: Timestamp when the record was created
                          format: date-time
                        Modified_Time:
                          type: string
                          description: Timestamp when the record was last modified
                          format: date-time
                        Created_By:
                          type: object
                          description: User who created the record
                          additionalProperties: false
                          properties:
                            name:
                              type: string
                              description: Name of the user who created the record
                              maxLength: 255
                            id:
                              type: string
                              description: >-
                                Unique identifier of the user who created the
                                record
                              maxLength: 50
                            email:
                              type: string
                              description: Email address of the user who created the record
                              format: email
                          required:
                            - id
                        Modified_By:
                          type: object
                          description: User who last modified the record
                          additionalProperties: false
                          properties:
                            name:
                              type: string
                              description: Name of the user who last modified the record
                              maxLength: 255
                            id:
                              type: string
                              description: >-
                                Unique identifier of the user who last modified
                                the record
                              maxLength: 50
                            email:
                              type: string
                              description: >-
                                Email address of the user who last modified the
                                record
                              format: email
                      required:
                        - id
                      additionalProperties: true
                      description: >-
                        Record object containing module-specific fields and
                        system fields
                  info:
                    type: object
                    description: Pagination and response metadata
                    additionalProperties: false
                    properties:
                      per_page:
                        type: integer
                        description: Number of records per page
                        format: int32
                      count:
                        type: integer
                        description: Number of records in current response
                        format: int32
                      page:
                        type: integer
                        description: Current page number
                        format: int32
                      more_records:
                        type: boolean
                        description: Indicates if more records are available
                      sort_by:
                        type: string
                        description: Field used for sorting the records
                        maxLength: 100
                      sort_order:
                        type: string
                        description: Order of sorting the records
                        enum:
                          - asc
                          - desc
                required:
                  - data
              examples:
                LeadBulkSearchResult:
                  summary: Sample lead bulk search result
                  value:
                    data:
                      - id: <phone_number_or_numberic_id_or_random_id_26>
                        Owner:
                          name: John Smith
                          id: <phone_number_or_numberic_id_or_random_id_27>
                          email: john.smith@zylker.com
                        Company: Zylker
                        Email: john.smith@zylker.com
                        Lead_Status: Qualified
                        Created_Time: '2023-01-15T10:30:00+00:00'
                        Modified_Time: '2023-01-20T14:45:00+00:00'
                        Created_By:
                          name: John Smith
                          id: <phone_number_or_numberic_id_or_random_id_27>
                        Modified_By:
                          name: John Smith
                          id: <phone_number_or_numberic_id_or_random_id_27>
                    info:
                      per_page: 200
                      count: 1
                      page: 1
                      more_records: false
        '204':
          description: >-
            No Content - The request was successful, but no records matched the
            search criteria. This may occur due to indexing delays when
            searching for recently created/modified records.
        '400':
          description: >-
            Bad Request - The request could not be processed due to invalid
            input, missing mandatory parameters, or malformed search criteria.
          content:
            application/json:
              schema:
                x-zs-$id: ModuleBulkSearchBadRequestErrorResponse
                oneOf:
                  - $ref: '#/components/schemas/MissingRequiredParameterErrorResponse'
                  - $ref: '#/components/schemas/InvalidModuleErrorResponse'
              examples:
                MissingParameter:
                  summary: Missing required search parameter
                  value:
                    status: error
                    code: EXPECTED_PARAM_MISSING
                    message: one of the expected parameter is missing
                    details:
                      param_names:
                        - criteria
                        - email
                        - phone
                        - word
                InvalidModule:
                  summary: Invalid module specified
                  value:
                    status: error
                    code: INVALID_MODULE
                    message: the module name given seems to be invalid
                    details:
                      resource_path_index: 0
        '401':
          description: >-
            Unauthorized - Authentication failed or insufficient OAuth scope
            permissions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                OauthScopeMismatch:
                  summary: Missing required OAuth scope
                  value:
                    code: OAUTH_SCOPE_MISMATCH
                    details: {}
                    message: Unauthorized
                    status: error
        '403':
          description: >-
            Forbidden - User lacks permission to access the requested module or
            perform the search operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                NoPermission:
                  summary: Insufficient permissions for module access
                  value:
                    code: NO_PERMISSION
                    details: {}
                    message: Permission denied to read
                    status: error
        '404':
          description: >-
            Not Found - The requested URL pattern is invalid or the specified
            resource does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                InvalidUrlPattern:
                  summary: Invalid API endpoint URL
                  value:
                    code: INVALID_URL_PATTERN
                    details: {}
                    message: Please check if the URL trying to access is a correct one
                    status: error
        '429':
          description: >-
            Too Many Requests - Rate limit exceeded. Wait before making
            additional requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                RateLimitExceeded:
                  summary: API rate limit exceeded
                  value:
                    code: RATE_LIMIT_EXCEEDED
                    details: {}
                    message: Too many requests. Please try again later.
                    status: error
        '500':
          description: >-
            Internal Server Error - An unexpected error occurred on the server.
            Contact support if the issue persists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                InternalError:
                  summary: Unexpected server error
                  value:
                    code: INTERNAL_ERROR
                    details: {}
                    message: Internal Server Error
                    status: error
        '502':
          description: >-
            Bad Gateway - Temporary service dependency failure. The request
            should be retried.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                ServiceUnavailable:
                  summary: Upstream service failure
                  value:
                    code: SERVICE_UNAVAILABLE
                    details: {}
                    message: Service temporarily unavailable
                    status: error
        '503':
          description: >-
            Service Unavailable - The service is temporarily unavailable due to
            maintenance or capacity issues.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                MaintenanceMode:
                  summary: Service under maintenance
                  value:
                    code: SERVICE_UNAVAILABLE
                    details: {}
                    message: Service temporarily unavailable for maintenance
                    status: error
      security:
        - OAuth2:
            - ZohoCRM.modules.Leads.READ
        - OAuth2:
            - ZohoCRM.modules.Contacts.READ
        - OAuth2:
            - ZohoCRM.modules.Accounts.READ
        - OAuth2:
            - ZohoCRM.modules.Deals.READ
        - OAuth2:
            - ZohoCRM.modules.Tasks.READ
        - OAuth2:
            - ZohoCRM.modules.Events.READ
        - OAuth2:
            - ZohoCRM.modules.Calls.READ
        - OAuth2:
            - ZohoCRM.modules.Products.READ
        - OAuth2:
            - ZohoCRM.modules.Vendors.READ
        - OAuth2:
            - ZohoCRM.modules.Campaigns.READ
        - OAuth2:
            - ZohoCRM.modules.Cases.READ
        - OAuth2:
            - ZohoCRM.modules.Solutions.READ
        - OAuth2:
            - ZohoCRM.modules.Pricebooks.READ
        - OAuth2:
            - ZohoCRM.modules.Quotes.READ
        - OAuth2:
            - ZohoCRM.modules.Salesorders.READ
        - OAuth2:
            - ZohoCRM.modules.Purchaseorders.READ
        - OAuth2:
            - ZohoCRM.modules.Invoices.READ
        - OAuth2:
            - ZohoCRM.modules.Forecasts.READ
        - OAuth2:
            - ZohoCRM.modules.Activities.READ
        - OAuth2:
            - ZohoCRM.modules.Notes.READ
        - OAuth2:
            - ZohoCRM.modules.Attachments.READ
        - OAuth2:
            - ZohoCRM.modules.custom.READ
        - OAuth2:
            - ZohoCRM.users.READ
        - OAuth2:
            - ZohoCRM.modules.READ
            - ZohoCRM.users.READ
      x-zs-llm-description: >-
        Use this tool when you want to bulk search records matching for the
        given criteria within a single module in CRM using a POST request with
        the search parameters supplied in the request body (useful when the
        criteria payload is too large for a query string).
  /{module}/search:
    get:
      tags:
        - Search
      summary: Search Records by Criteria, Word, Email, or Phone
      operationId: searchRecords
      description: >-
        To search for records within a specified module in your Zoho CRM
        organization using criteria-based conditions, full-text word search, or
        lookup by email or phone number.
      parameters:
        - $ref: '#/components/parameters/Module'
        - $ref: '#/components/parameters/ApprovalState'
        - $ref: '#/components/parameters/Criteria'
        - $ref: '#/components/parameters/Converted'
        - $ref: '#/components/parameters/SearchWord'
        - $ref: '#/components/parameters/SearchEmail'
        - $ref: '#/components/parameters/SearchPhone'
        - $ref: '#/components/parameters/Fields'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/SortBy'
        - $ref: '#/components/parameters/SortOrder'
        - $ref: '#/components/parameters/Type'
        - $ref: '#/components/parameters/IncludeLiteUsers'
        - $ref: '#/components/parameters/RoleId'
      responses:
        '200':
          description: >-
            Returns the list of records that match the search criteria, along
            with pagination metadata.
          content:
            application/json:
              schema:
                type: object
                x-zs-$id: ModuleSearchResponse
                description: >-
                  Represents the successful response returned by the search
                  operation, containing the matched records and pagination
                  metadata.
                additionalProperties: false
                properties:
                  data:
                    type: array
                    description: >-
                      Represents the list of records matching the search
                      criteria.
                    maxItems: 200
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: Represents the unique ID of the record.
                          maxLength: 50
                        Owner:
                          type: object
                          description: Represents the owner of the record.
                          additionalProperties: false
                          properties:
                            name:
                              type: string
                              description: Represents the name of the record owner.
                              maxLength: 255
                            id:
                              type: string
                              description: Represents the unique ID of the record owner.
                              maxLength: 50
                            email:
                              type: string
                              description: >-
                                Searches for records using an email address. The
                                API searches across all email fields in the
                                specified module and returns matching records.
                              format: email
                        Created_Time:
                          type: string
                          description: Represents the creation timestamp of the record.
                          format: date-time
                        Modified_Time:
                          type: string
                          description: >-
                            Represents the date and time when the record was
                            last modified.
                          format: date-time
                        Created_By:
                          type: object
                          description: Represents the user who created the record.
                          additionalProperties: false
                          properties:
                            name:
                              type: string
                              description: >-
                                Represents the name of the user who created the
                                record.
                              maxLength: 255
                            id:
                              type: string
                              description: >-
                                Represents the unique ID of the user who created
                                the record.
                              maxLength: 50
                            email:
                              type: string
                              description: >-
                                Searches for records using an email address. The
                                API searches across all email fields in the
                                specified module and returns matching records.
                              format: email
                          required:
                            - id
                        Modified_By:
                          type: object
                          description: Represents the user who last modified the record.
                          additionalProperties: false
                          properties:
                            name:
                              type: string
                              description: >-
                                Represents the name of the user who last
                                modified the record.
                              maxLength: 255
                            id:
                              type: string
                              description: >-
                                Represents the unique ID of the user who last
                                modified the record.
                              maxLength: 50
                            email:
                              type: string
                              description: >-
                                Searches for records using an email address. The
                                API searches across all email fields in the
                                specified module and returns matching records.
                              format: email
                      required:
                        - id
                      additionalProperties: true
                      description: >-
                        Represents a record that matches the search criteria.
                        Contains standard system fields and module-specific
                        fields for the matched record.
                  info:
                    type: object
                    description: >-
                      Represents the pagination and sort metadata for the
                      response.
                    additionalProperties: false
                    properties:
                      per_page:
                        type: integer
                        description: >-
                          Specify how many records to return per page. The
                          default and the maximum possible value is 200.
                        format: int32
                      count:
                        type: integer
                        description: >-
                          Represents the number of records returned in the
                          current page.
                        format: int32
                      page:
                        type: integer
                        description: Represents the current page number of the response.
                        format: int32
                      more_records:
                        type: boolean
                        description: >-
                          Indicates whether more records are available beyond
                          the current page.

                          Possible values:

                          **true** - More records are available.

                          **false** - No more records are available.
                      sort_by:
                        type: string
                        description: >-
                          Represents the field used to sort the records in the
                          response.
                        maxLength: 100
                      sort_order:
                        type: string
                        description: >-
                          Represents the sort direction applied to the records
                          in the response.

                          Possible values:

                          **asc** - Ascending order.

                          **desc** - Descending order.
                        enum:
                          - asc
                          - desc
                required:
                  - data
              examples:
                LeadSearchResult:
                  summary: Sample lead search result
                  value:
                    data:
                      - id: '5843104000000624035'
                        Owner:
                          name: John Smith
                          id: '5843104000000411001'
                          email: john.smith@example.com
                        Company: Zylker
                        Email: lead@zylker.com
                        Lead_Status: Qualified
                        Created_Time: '2023-01-15T10:30:00+00:00'
                        Modified_Time: '2023-01-20T14:45:00+00:00'
                        Created_By:
                          name: John Smith
                          id: '5843104000000411001'
                        Modified_By:
                          name: John Smith
                          id: '5843104000000411001'
                    info:
                      per_page: 200
                      count: 1
                      page: 1
                      more_records: false
                  description: >-
                    Shows a successful search response returning a single lead
                    record with standard system fields and pagination metadata.
        '204':
          description: >-
            No matching records found. This may occur if no records match the
            search criteria or if recently created or modified records have not
            yet been indexed. Resolution: Verify the search parameters and
            retry.
        '400':
          description: >-
            The request could not be processed due to invalid, missing, or
            unsupported search parameters. Resolution: Ensure that at least one
            search parameter (criteria, email, phone, or word) is included and
            contains a valid value.
          content:
            application/json:
              schema:
                x-zs-$id: ModuleSearchBadRequestErrorResponse
                oneOf:
                  - type: object
                    x-zs-$id: InvalidRequestErrorResponse
                    description: >-
                      Represents the error response returned when the search
                      request contains an invalid value for one or more
                      parameters.
                    additionalProperties: false
                    properties:
                      status:
                        type: string
                        description: |-
                          Represents the status of the response.
                          Possible values:
                          **error** - The request encountered an error.
                        enum:
                          - error
                      code:
                        type: string
                        description: >-
                          Represents the error code for the response.

                          Possible values:

                          **INVALID_REQUEST** - The request contains one or more
                          invalid parameter values.
                        enum:
                          - INVALID_REQUEST
                      message:
                        type: string
                        description: >-
                          Represents the error message describing the invalid
                          request.
                        maxLength: 1000
                      details:
                        type: object
                        description: Represents additional details about the error.
                        additionalProperties: false
                    required:
                      - status
                      - code
                      - message
                  - type: object
                    x-zs-$id: NotSupportedErrorResponse
                    description: >-
                      Represents the error response returned when the search
                      operation is not supported for the specified module.
                    additionalProperties: false
                    properties:
                      status:
                        type: string
                        description: |-
                          Represents the status of the response.
                          Possible values:
                          **error** - The request encountered an error.
                        enum:
                          - error
                      code:
                        type: string
                        description: >-
                          Represents the error code for the response.

                          Possible values:

                          **NOT_SUPPORTED** - The search operation is not
                          supported for the specified module.
                        enum:
                          - NOT_SUPPORTED
                      message:
                        type: string
                        description: >-
                          Represents the error message describing the
                          unsupported operation.
                        maxLength: 1000
                      details:
                        type: object
                        description: >-
                          Represents additional details about the error,
                          including the name of the module that does not support
                          search.
                        additionalProperties: false
                        properties:
                          module:
                            type: string
                            description: >-
                              Represents the API name of the module that does
                              not support the search operation.
                            maxLength: 100
                        required:
                          - module
                    required:
                      - status
                      - code
                      - message
                      - details
                  - type: object
                    x-zs-$id: SearchMissingRequiredParameterErrorResponse
                    description: >-
                      Represents the error response returned when at least one
                      of the required search parameters (criteria, email, phone,
                      or word) is missing from the request.
                    additionalProperties: false
                    properties:
                      status:
                        type: string
                        description: |-
                          Represents the status of the response.
                          Possible values:
                          **error** - The request encountered an error.
                        enum:
                          - error
                      code:
                        type: string
                        description: >-
                          Represents the error code for the response.

                          Possible values:

                          **EXPECTED_PARAM_MISSING** - At least one of the
                          required search parameters is absent from the request.
                        enum:
                          - EXPECTED_PARAM_MISSING
                      message:
                        type: string
                        description: >-
                          Represents the error message describing the missing
                          parameter.
                        maxLength: 1000
                      details:
                        type: object
                        description: >-
                          Represents additional details about the error,
                          including the names of the missing search parameters.
                        additionalProperties: false
                        properties:
                          param_names:
                            type: array
                            description: >-
                              Represents the list of search parameters that are
                              missing from the request.

                              Possible values in the array: **criteria**,
                              **email**, **phone**, **word**.
                            maxItems: 4
                            items:
                              type: string
                              description: >-
                                Represents the name of a missing search
                                parameter.
                              enum:
                                - criteria
                                - email
                                - phone
                                - word
                        required:
                          - param_names
                    required:
                      - status
                      - code
                      - message
                      - details
                  - type: object
                    x-zs-$id: SearchInvalidModuleErrorResponse
                    description: >-
                      Represents the error response returned when the specified
                      module API name does not exist or is not a searchable
                      module.
                    additionalProperties: false
                    properties:
                      status:
                        type: string
                        description: |-
                          Represents the status of the response.
                          Possible values:
                          **error** - The request encountered an error.
                        enum:
                          - error
                      code:
                        type: string
                        description: >-
                          Represents the error code for the response.

                          Possible values:

                          **INVALID_MODULE** - The specified module does not
                          exist or is not searchable.
                        enum:
                          - INVALID_MODULE
                      message:
                        type: string
                        description: >-
                          Represents the error message describing the invalid
                          module.
                        maxLength: 1000
                      details:
                        type: object
                        description: >-
                          Represents additional details about the error,
                          including the resource path index where the invalid
                          module value was found.
                        additionalProperties: false
                        properties:
                          resource_path_index:
                            type: integer
                            description: >-
                              Represents the index position in the request URL
                              path where the invalid module value was found.
                            format: int32
                        required:
                          - resource_path_index
                    required:
                      - status
                      - code
                      - message
                      - details
                  - type: object
                    x-zs-$id: InvalidQueryErrorResponse
                    description: >-
                      Represents the error response returned when the search
                      criteria query is syntactically or semantically invalid.
                    additionalProperties: false
                    properties:
                      status:
                        type: string
                        description: |-
                          Represents the status of the response.
                          Possible values:
                          **error** - The request encountered an error.
                        enum:
                          - error
                      code:
                        type: string
                        description: >-
                          Represents the error code for the response.

                          Possible values:

                          **INVALID_QUERY** - The search criteria contains an
                          invalid condition, operator, or field reference.
                        enum:
                          - INVALID_QUERY
                      message:
                        type: string
                        description: >-
                          Represents the error message describing the query
                          issue.
                        enum:
                          - the field in restricted in GDPR
                          - the field in restricted in Hipaa
                          - Invalid query formed
                      details:
                        oneOf:
                          - type: object
                            x-zs-$id: DataTypeMismatchErrorDetails
                            description: >-
                              Represents the error details returned when a field
                              value in the search criteria does not match the
                              expected data type.
                            additionalProperties: false
                            properties:
                              expected_data_type:
                                type: string
