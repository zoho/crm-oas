      x-zs-llm-description: >-
        Use this tool when you want to search records matching for the given
        criteria in param within single module in CRM
components:
  parameters:
    Type:
      name: type
      in: query
      required: false
      description: >-
        Specify the user type to filter the search results by.

        Possible values: **ActiveAndDeactive**, **CurrentUser**,
        **DeletedUsers**, **ParentRoleUsers**, **ChildRoleUsers**,
        **DeactiveUsers**, **NotConfirmedUsers**, **ConfirmedUsers**,
        **ActiveUsers**, **AdminUsers**, **ActiveConfirmedAdmins**,
        **ActiveConfirmedUsers**, **DeveloperUsers**, **SubordinateRoleUsers**,
        **AllUsers**, **AllActiveUsers**.


        **Note**


        - Only one of the mandatory parameters (`criteria`, `email`, `phone`, or
        `word`) can be used in a single request.

        - If multiple parameters are provided, the API processes them in the
        following priority order:
           1. `criteria`
           2. `email`
           3. `phone`
           4. `word`
        - Only the highest-priority parameter in the request is processed.


        - The `page` and `per_page` parameters help retrieve records based on
        their position in Zoho CRM.

        - A single API call can fetch a maximum of 200 records.

        - To retrieve more records, adjust the `page` and `per_page` values.

           Example: To fetch 400 records:

           - First API call: `page=1&per_page=200` -> Fetches records 1-200
           - Second API call: `page=2&per_page=200` -> Fetches records 201-400

           By making two API calls, all 400 records can be retrieved.

        - The Search API allows you to search for and retrieve a maximum of
        2,000 records. If the search exceeds 2,000 records, the API returns a
        `LIMIT_REACHED` error.


        - Values of fields containing sensitive health data are retrieved only
        when the **Restrict Data Access through API** option in the compliance
        settings is disabled. If the option is enabled, the field value is
        returned as `null`. Refer to [HIPAA compliance
        documentation](https://www.zoho.com/crm/developer/docs/api/v8/hipaa-compliance.html)
        for more details.


        - When you create or edit a record and search for it immediately, you
        may receive a `204 NO CONTENT` response due to indexing delays. To fetch
        records without delay, use the [Query
        API](https://www.zoho.com/crm/developer/docs/api/v8/Get-Records-through-COQL-Query.html).

        - The `in` operator supports up to 100 values.

        - The `full_name` field contains the concatenated values of the `First
        Name` and `Last Name` fields.


        - `full_name` is a read-only field available only in the `Leads`,
        `Contacts`, and `Users` modules.


        To retrieve subform records that match your search criteria, use the API
        name of the corresponding subform module.


        To retrieve multi-select lookup (MxN) records that match your search
        criteria, use the API name of the corresponding linking module.
      schema:
        type: string
        maxLength: 50
        enum:
          - ActiveAndDeactive
          - CurrentUser
          - DeletedUsers
          - ParentRoleUsers
          - ChildRoleUsers
          - DeactiveUsers
          - NotConfirmedUsers
          - ConfirmedUsers
          - ActiveUsers
          - AdminUsers
          - ActiveConfirmedAdmins
          - ActiveConfirmedUsers
          - DeveloperUsers
          - SubordinateRoleUsers
          - AllUsers
          - AllActiveUsers
      examples:
        ActiveUsers:
          summary: Get only active users
          value: ActiveUsers
        AdminUsers:
          summary: Get admin users only
          value: AdminUsers
        ConfirmedUsers:
          summary: Get confirmed users
          value: ConfirmedUsers
        AllUsers:
          summary: Get all users regardless of status
          value: AllUsers
    IncludeLiteUsers:
      name: include_lite_users
      in: query
      required: false
      description: Indicates whether lite users should be included in the search results.
      schema:
        type: boolean
        default: false
    RoleId:
      name: role_id
      in: query
      required: false
      description: >-
        Filter users by role ID. This parameter is supported only for the Users
        module.
      schema:
        type: string
        format: int64
        maxLength: 20
    Module:
      name: module
      in: path
      required: true
      description: >-
        Specify the API name of the module to search within. Refer to [Get
        Modules](https://www.zoho.com/crm/developer/docs/api/v8/modules-api.html)
        to retrieve a list of available modules.
      schema:
        type: string
        maxLength: 100
      examples:
        Leads:
          value: Leads
          summary: Search within Leads module
        Contacts:
          value: Contacts
          summary: Search within Contacts module
        Accounts:
          value: Accounts
          summary: Search within Accounts module
    ApprovalState:
      name: approval_state
      in: query
      required: false
      description: >-
        Specify the approval state to filter records by. The search returns only
        records in the specified approval state.

        Possible values: **approval_process_pending**, **webform_invalid**,
        **review_process_pending**, **webform_invalid_approval**,
        **zia_vision_validation**, **review_process_rejected**,
        **webform_unapproved**, **email_parser_waiting**, **approved**,
        **merge_pending**, **email_parser_rejected**, **zia_vision_rejected**,
        **zia_vision_pending**, **approval_process_rejected**,
        **webform_double_optin**.
      schema:
        type: string
        maxLength: 50
        enum:
          - approval_process_pending
          - webform_invalid
          - review_process_pending
          - webform_invalid_approval
          - zia_vision_validation
          - review_process_rejected
          - webform_unapproved
          - email_parser_waiting
          - approved
          - merge_pending
          - email_parser_rejected
          - zia_vision_rejected
          - zia_vision_pending
          - approval_process_rejected
          - webform_double_optin
      examples:
        Approved:
          value: approved
          summary: Get only approved records
        Pending:
          value: approval_process_pending
          summary: Get records pending approval
        Rejected:
          value: approval_process_rejected
          summary: Get rejected records
    Criteria:
      name: criteria
      in: query
      required: false
      description: >+
        Specify a criteria string to filter records using field-specific
        conditions and operators.

        Performs a search using the following format:


        `(({field_API_name}:{operator}:{value}) and/or
        ({field_API_name}:{operator}:{value}))`


        Replace `{field_API_name}`, `{operator}`, and `{value}` with the

        appropriate field API name, condition, and value.

        -   You can search using a maximum of 10 criteria, with the same or
            different fields.
        -   The only operator supported for encrypted fields is `equals`.


        When using the `equals` operator in the Search API, it behaves like

        `contains`, retrieving records that include the specified value.

        For a single condition, if the condition is:


        `(Company:equals:ABC)`


        the response includes records with `ABC` as well as `ABC Inc.` in the

        `Company` field.

        For multiple conditions, `equals` continues to behave like `contains`.


        **For example:**

        `((Company:equals:ABC) and (First_Name:starts_with:M))`

        This retrieves records where:


        -   `First_Name` starts with `M`

        -   `Company` contains `ABC` (for example, `ABC` or `ABC Inc.`)


        ** Note**: This behavior does not apply to picklist fields.


        The `in` operator checks whether a field value matches any value in a
        given list.

        **For example:**


        `(Full_Name:in:Patricia,Boyle,Kate)`


        This retrieves records where the `Full_Name` is `Patricia`, `Boyle`, or

        `Kate`.


        When a single-line field value contains characters such as:


        `{ } [ ] ^ : - / ! ? * _ @` or spaces,


        the Search API may return records with similar-looking values, even when

        the characters are not an exact match.


        For example:


        -   Record A: `sales-team@zoho.com`

        -   Record B: `sales_team@zoho.com`


        A search using:


        `equals:sales-team@zoho.com`


        may return both records.


        **Escaping Special Characters**


        When using parentheses `(` `)`, commas `,`, or a backslash `\` as the

        last character in a search value:


        1.  Escape special characters using a backslash (`\`).

        2.  Encode the value before making the API request.

        3.  Select the value of the criteria, right-click the value, and choose
            the `EncodeURIComponent` option.

        **Example 1: Escaping Parentheses and Commas**


        Search term:


        `((Last_Name:equals:Burns,B) and (First_Name:starts_with:M))`


        Escape the comma:


        `((Last_Name:equals:Burns\,B) and (First_Name:starts_with:M))`


        Encode the value:


        `((Last_Name:equals:Burns%5C%2CB) and (First_Name:starts_with:M))`


        **Example 2: Escaping a Backslash at the End**


        Search term:


        `(Last_Name:equals:K\)`


        Escape the backslash:


        `(Last_Name:equals:K\\)`


        Encode the value:


        `(Last_Name:equals:K%5C%5C)`


        **Supported Data Types**


        -   `picklist`

        -   `owner_lookup`

        -   `user_lookup`

        -   `lookup`

        -   `phone`

        -   `email`

        -   `date`

        -   `datetime`

        -   `text`

        -   `textarea`

        -   `integer`

        -   `currency`

        -   `decimal`

        -   `multiselectpicklist`

        -   `bigint`

        -   `percent`

        -   `formula`

        -   `website`

        -   `boolean`

        -   `double`


        **Supported Operators**


        -   `equals`

        -   `starts_with`

        -   `in`

        -   `not_equal`

        -   `greater_equal`

        -   `greater_than`

        -   `less_equal`

        -   `less_than`

        -   `between`


        Refer to the following note for operator support by field type.

        * **Date, DateTime:** `equals`, `not_equal`, `greater_equal`,
        `greater_than`, `less_equal`, `less_than`, `between`, `in`

        * **Integer, Currency, Decimal:** `equals`, `not_equal`,
        `greater_equal`, `greater_than`, `less_equal`, `less_than`, `between`,
        `in`

        * **Boolean:** `equals`, `not_equal`

        * **textarea:** `equals`, `not_equal`, `starts_with`

        * **Lookup (user/owner):** `equals`, `not_equal`, `in`

        * **Picklist, Autonumber:** `equals`, `not_equal`, `in`

        * **Text, Email, Phone, Website:** `equals`, `not_equal`, `starts_with`,
        `in`

        * **multiselectpicklist:** `equals`, `not_equal`, `in`, `starts_with`

        * **bigint:** `equals`, `not_equal`, `greater_than`, `greater_equal`,
        `less_than`, `less_equal`, `between`, `in`

        * **percent:** `equals`, `not_equal`, `greater_than`, `greater_equal`,
        `less_than`, `less_equal`, `between`, `in`

        * **formula:** Operators depend on the formula return type. Check the
        corresponding data type's supported operators.

      schema:
        type: string
        maxLength: 3000
      examples:
        SimpleCriteria:
          value: (Company:equals:Zylker)
          summary: Simple equality condition
        ComplexCriteria:
          value: ((Company:equals:Zylker) and (Lead_Status:equals:Qualified))
          summary: Multiple conditions with AND operator
        DateRange:
          value: >-
            ((Created_Time:greater_equal:2023-01-01T00:00:00+00:00) and
            (Created_Time:less_equal:2023-12-31T23:59:59+00:00))
          summary: Date range criteria
        InOperator:
          value: (Lead_Status:in:Qualified,Contacted,Converted)
          summary: Using IN operator for multiple values
    SearchEmail:
      name: email
      in: query
      required: false
      description: >-
        Specify the email address to search for across all email-type fields in
        the module. Partial matches are supported and searches multiple email
        fields simultaneously.  *Mandatory if criteria, phone, and word are not
        present.*
      schema:
        type: string
        maxLength: 255
        format: string
      examples:
        ExactEmail:
          value: john.doe@example.com
          summary: Search for exact email address
        DomainSearch:
          value: '@company.com'
          summary: Search for all emails from a domain
        PartialEmail:
          value: john.doe
          summary: Partial email search (finds john.doe@any-domain.com)
    SearchPhone:
      name: phone
      in: query
      required: false
      description: >-
        Specify the phone number to search for across all phone-type fields in
        the module. The value must be at least three characters long and may
        include digits, spaces, hyphens, parentheses, and the plus sign.
        Supports various phone number formats including international, national,
        and partial numbers.

        *Mandatory if criteria, email, and word are not present.*
      schema:
        type: string
        minLength: 3
        maxLength: 50
        pattern: ^[+]?[0-9\s\-\(\)\.]+$
      examples:
        International:
          value: +1-555-123-4567
          summary: International format with country code
        National:
          value: (555) 123-4567
          summary: US national format with parentheses
        DigitsOnly:
          value: '5551234567'
          summary: Digits only format
        Partial:
          value: 555-123
          summary: Partial phone number search
    SearchWord:
      name: word
      in: query
      required: false
      description: >-
        Specify the word or phrase to search for across all searchable text
        fields in the module. The value must be at least two characters long.
        Performs a global search with minimum 2 characters required. This is the
        broadest search method but may be slower than specific field searches.

        *Mandatory if criteria, email, and phone are not present.*
      schema:
        type: string
        minLength: 2
        maxLength: 100
      examples:
        CompanyName:
          value: Zylker
          summary: Search for company name across fields
        PersonName:
          value: John Doe
          summary: Search for person name across fields
        ProductTerm:
          value: software
          summary: Search for product-related terms
        Phrase:
          value: marketing campaign
          summary: Search for multi-word phrases
    Fields:
      name: fields
      in: query
      required: false
      description: >-
        Specify a comma-separated list of field API names to include in the
        response. If omitted, the response includes all fields accessible to the
        current user.
      schema:
        type: string
        maxLength: 2000
      examples:
        BasicFields:
          value: First_Name,Last_Name,Email,Phone
          summary: Basic contact information fields
        LeadFields:
          value: Company,Lead_Status,Lead_Source,Created_Time
          summary: Essential lead tracking fields
        AccountFields:
          value: Account_Name,Industry,Annual_Revenue,Phone
          summary: Key account information fields
        Minimal:
          value: id,Created_Time,Modified_Time
          summary: Minimal system fields only
    Page:
      name: page
      in: query
      required: false
      description: >-
        Specify the page number to retrieve for paginated results. The minimum
        value is 1. Defaults to 1.
      schema:
        type: integer
        format: int32
        minimum: 1
        default: 1
      examples:
        FirstPage:
          value: 1
          summary: First page of results (default)
        SecondPage:
          value: 2
          summary: Second page of results
        TenthPage:
          value: 10
          summary: Jump to tenth page
    PerPage:
      name: per_page
      in: query
      required: false
      description: >-
        Specify the number of records to return per page. The minimum value is
        1, the maximum is 200, and the default is 200.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 200
        default: 200
      examples:
        SmallBatch:
          value: 10
          summary: Small batch for testing or preview
        MediumBatch:
          value: 50
          summary: Medium batch for regular processing
        LargeBatch:
          value: 100
          summary: Large batch for bulk operations
        Maximum:
          value: 200
          summary: Maximum records per page (default)
    SortBy:
      name: sort_by
      in: query
      required: false
      description: Specify the API name of the field to sort the search results by.
      schema:
        type: string
        maxLength: 100
        default: id
      examples:
        ById:
          value: id
          summary: Sort by record ID (default)
        ByName:
          value: Last_Name
          summary: Sort by last name for contacts
        ByCompany:
          value: Company
          summary: Sort by company name
        ByCreated:
          value: Created_Time
          summary: Sort by creation date
        ByModified:
          value: Modified_Time
          summary: Sort by last modification date
    SortOrder:
      name: sort_order
      in: query
      required: false
      description: >-
        Specify the direction in which to sort the results. Defaults to
        **desc**.

        Possible values:

        **asc** - Ascending order (A-Z, 1-9).

        **desc** - Descending order (Z-A, 9-1).
      schema:
        type: string
        maxLength: 10
        enum:
          - asc
          - desc
        default: desc
      examples:
        Descending:
          value: desc
          summary: Descending order (newest/highest first, default)
        Ascending:
          value: asc
          summary: Ascending order (oldest/lowest first)
    Converted:
      name: converted
      in: query
      required: false
      description: >-
        Specify whether to filter records by their conversion status. Applicable
        only for the Leads module.

        Possible values:

        **true** - Returns only converted leads.

        **false** - Returns only unconverted leads.

        **both** - Returns all leads regardless of conversion status.

        Defaults to **false**.
      schema:
        type: string
        maxLength: 10
        enum:
          - 'true'
          - 'false'
          - both
        default: 'false'
      examples:
        OnlyConverted:
          value: 'true'
          summary: Get only converted records (e.g., converted leads)
        OnlyUnconverted:
          value: 'false'
          summary: Get only non-converted records (default)
        AllRecords:
          value: both
          summary: Get all records regardless of conversion status
