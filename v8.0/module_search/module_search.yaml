                      2,000.
                    additionalProperties: false
                    properties:
                      status:
                        type: string
                        description: |-
                          Represents the status of the response.
                          Possible values:
                          **error** - The request encountered an error.
                        enum:
                          - error
                      code:
                        type: string
                        description: >-
