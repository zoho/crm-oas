                        enum:
                          - LIMIT_REACHED
                      message:
                        type: string
                        description: >-
                          Represents the error message describing the limit
                          reached condition.
                        enum:
                          - maximum response iteration limit reached
                      details:
                        type: object
                        description: >-
                          Represents additional details about the error,
                          including the maximum iteration limit value.
                        additionalProperties: false
                        properties:
