  schemas:
    ErrorDetails:
      type: object
      description: >-
        Represents additional details about the error, including information
        about the specific parameter or value that caused the issue.
      additionalProperties: false
    MissingRequiredParameterErrorResponse:
      type: object
      x-zs-$id: MissingRequiredParameterErrorResponse
      description: Missing required parameter error response
      additionalProperties: false
      properties:
        status:
          type: string
          description: Error status indicator
          enum:
            - error
        code:
          type: string
          description: Error code indicating missing parameters
          enum:
            - EXPECTED_PARAM_MISSING
        message:
          type: string
          description: Human-readable error message
          maxLength: 1000
        details:
          type: object
          description: Additional error details including missing parameter names
          additionalProperties: false
          properties:
            param_names:
              type: array
              description: List of missing parameter names
              maxItems: 4
              items:
                type: string
                description: Parameter name
                enum:
                  - criteria
                  - email
                  - phone
                  - word
          required:
            - param_names
      required:
        - status
        - code
        - message
        - details
    InvalidModuleErrorResponse:
      type: object
      x-zs-$id: InvalidModuleErrorResponse
      description: Invalid module error response
      additionalProperties: false
      properties:
        status:
          type: string
          description: Error status indicator
          enum:
            - error
        code:
          type: string
          description: Error code indicating invalid module
          enum:
            - INVALID_MODULE
        message:
          type: string
          description: Human-readable error message
          maxLength: 1000
        details:
          type: object
          description: Additional error details including resource path information
          additionalProperties: false
          properties:
            resource_path_index:
              type: integer
              description: Index of the invalid resource path segment
              format: int32
          required:
            - resource_path_index
      required:
        - status
        - code
        - message
        - details
    ErrorResponse:
      x-zs-$id: StandardErrorResponse
      type: object
      description: >-
        Represents the standard error response structure returned by the API,
        containing the error code, the message, and the response status.
      additionalProperties: false
      properties:
        code:
          type: string
          description: Represents the error code for the response.
          enum:
            - INVALID_DATA
            - INVALID_QUERY
            - EXPECTED_PARAM_MISSING
            - LIMIT_REACHED
            - NOT_SUPPORTED
            - INVALID_REQUEST_METHOD
            - AUTHORIZATION_FAILED
            - OAUTH_SCOPE_MISMATCH
            - NO_PERMISSION
            - INVALID_URL_PATTERN
            - INTERNAL_ERROR
            - RATE_LIMIT_EXCEEDED
            - SERVICE_UNAVAILABLE
            - INVALID_MODULE
        details:
          $ref: '#/components/schemas/ErrorDetails'
        message:
          type: string
          description: Represents the error message describing the reason for the failure.
          maxLength: 1000
        status:
          type: string
          description: |-
            Represents the status of the response.
            Possible values:
            **error** - The request encountered an error.
          enum:
            - error
          default: error
      required:
        - code
        - details
        - message
        - status
