        - OAuth2:
            - ZohoCRM.modules.custom.CREATE
        - OAuth2:
            - ZohoCRM.modules.CREATE
      requestBody:
        description: >-
          The request body must contain an **ids** array with up to 100 record
          IDs whose emails you want to share.
        content:
          application/json:
            schema:
              type: object
              description: >-
                Represents the request body schema for sharing emails in bulk,
                containing an array of record IDs.
              additionalProperties: false
              properties:
                ids:
                  type: array
                  description: >-
                    Specify the list of record IDs whose emails you want to
                    share. Accepts up to 100 record IDs per request.
                  maxItems: 100
                  items:
                    type: string
                    description: Represents the unique identifier of a CRM record.
                    format: string
              required:
                - ids
            examples:
              BulkShare:
                value:
                  ids:
                    - '1234567890'
                    - '0987654321'
                description: >-
                  Shows a sample request body for sharing emails of multiple
                  records, containing an array of record IDs.
                summary: Sample bulk email share request
        required: true
