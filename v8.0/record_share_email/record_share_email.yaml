components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      description: >-
        Specify the unique identifier of the record whose emails you want to
        manage. The ID must belong to a record in the specified module. Use the
        [Get Records API](record.yaml#$.paths./module.get) to retrieve the
        record IDs.
      schema:
        type: string
        format: int64
        pattern: ^[0-9]+$
        example: '1034369001076415228'
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://accounts.zoho.com/oauth/v2/auth
          tokenUrl: https://accounts.zoho.com/oauth/v2/token
          refreshUrl: https://accounts.zoho.com/oauth/v2/token
          scopes:
            ZohoCRM.modules.ALL: >-
              Grants full create, read, update, and delete access to records
              across all modules in the Zoho CRM organization.
            ZohoCRM.modules.CREATE: >-
              Grants permission to create records across all modules in the Zoho
              CRM organization.
            ZohoCRM.modules.DELETE: >-
              Grants permission to delete records across all modules in the Zoho
              CRM organization.
