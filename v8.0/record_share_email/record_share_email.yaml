  /{moduleApiName}/actions/unshare_emails:
    post:
      description: >-
        To revoke email sharing for multiple CRM records in a single request.
        Accepts up to 100 record IDs per request. The `data` array in the 207
        response contains an item for each record, indicating success or
        failure.
      summary: Unshare emails in bulk
      operationId: unshareBulkEmails
      parameters:
        - name: moduleApiName
          in: path
          required: true
          description: >-
            Specify the API name of the module that contains the records whose
            email sharing you want to revoke. Refer to [Get Modules
            API](modules.yaml#$.paths./settings/modules.get) to retrieve
            available module API names.
          schema:
            type: string
            enum:
              - Leads
              - Contacts
              - Accounts
              - Deals
              - CustomModule1
          example: Leads
      security:
        - OAuth2:
            - ZohoCRM.modules.Leads.DELETE
        - OAuth2:
            - ZohoCRM.modules.Contacts.DELETE
        - OAuth2:
            - ZohoCRM.modules.Accounts.DELETE
        - OAuth2:
            - ZohoCRM.modules.Deals.DELETE
        - OAuth2:
            - ZohoCRM.modules.Tasks.DELETE
        - OAuth2:
            - ZohoCRM.modules.Events.DELETE
        - OAuth2:
            - ZohoCRM.modules.Calls.DELETE
        - OAuth2:
            - ZohoCRM.modules.Products.DELETE
        - OAuth2:
            - ZohoCRM.modules.Vendors.DELETE
        - OAuth2:
            - ZohoCRM.modules.Campaigns.DELETE
        - OAuth2:
            - ZohoCRM.modules.Cases.DELETE
        - OAuth2:
            - ZohoCRM.modules.Solutions.DELETE
        - OAuth2:
            - ZohoCRM.modules.Quotes.DELETE
        - OAuth2:
            - ZohoCRM.modules.Invoices.DELETE
        - OAuth2:
            - ZohoCRM.modules.Forecasts.DELETE
        - OAuth2:
            - ZohoCRM.modules.Activities.DELETE
        - OAuth2:
            - ZohoCRM.modules.Notes.DELETE
        - OAuth2:
            - ZohoCRM.modules.Attachments.DELETE
        - OAuth2:
            - ZohoCRM.modules.custom.DELETE
        - OAuth2:
            - ZohoCRM.modules.DELETE
      requestBody:
        description: >-
          The request body must contain an **ids** array with up to 100 record
          IDs whose email sharing you want to revoke.
        content:
          application/json:
            schema:
              type: object
              description: >-
                Represents the request body schema for unsharing emails in bulk,
                containing an array of record IDs.
              additionalProperties: false
              properties:
                ids:
                  type: array
                  description: >-
                    Specify the list of record IDs whose email sharing you want
                    to revoke. Accepts up to 100 record IDs per request.
                  maxItems: 100
                  items:
                    type: string
                    description: Represents the unique identifier of a CRM record.
                    format: string
              required:
                - ids
            examples:
              BulkUnshare:
                value:
                  ids:
                    - '1234567890'
                    - '0987654321'
                description: >-
                  Shows a sample request body for revoking email sharing for
                  multiple records, containing an array of record IDs.
                summary: Sample bulk email unshare request
        required: true
      responses:
        '207':
          description: >-
            Returns a mix of success and failure results when some email
            unsharing operations succeed and others fail. Inspect each item in
            the `data` array for the individual outcome.
          content:
            application/json:
              schema:
                type: object
                description: >-
                  Represents the 207 partial success response schema for the
                  unshareBulkEmails operation, where each item indicates an
                  individual record's outcome.
                additionalProperties: false
                x-zs-$id: BulkUnshareEmailsMultiStatusResponse
                properties:
                  data:
                    type: array
                    description: >-
                      Represents the list of per-record results for the bulk
                      email unsharing operation. Always present in the response.
                    maxItems: 100
                    items:
                      oneOf:
                        - type: object
                          x-zs-$id: NotSharedError
                          description: >-
                            Represents a per-record result where the emails are
                            not currently shared for the specified record.
                          additionalProperties: false
                          properties:
                            code:
                              type: string
                              description: >-
                                Represents the result code for a record whose
                                emails are not currently shared.

                                Possible values: **NOT_SHARED** - the emails for
                                this record are not shared with colleagues.
                              enum:
                                - NOT_SHARED
                            details:
                              type: object
                              description: >-
                                Represents additional details about the record.
                                Always present in the response.
                              additionalProperties: false
                              properties:
                                id:
                                  type: string
                                  description: >-
                                    Represents the unique identifier of the
                                    record. Always present in the response.
                                  format: string
                              required:
                                - id
                            message:
                              type: string
                              description: >-
                                Represents the message describing the not-shared
                                status. Always present in the response.
                              enum:
                                - >-
                                  Emails are not  shared to the colleagues
                                  already
                            status:
                              type: string
                              description: >-
                                Represents the status for this result item.

                                Possible values: **error** - the emails are not
                                currently shared. Always present in the
                                response.
                              enum:
                                - error
                          required:
                            - code
                            - details
                            - message
                            - status
                        - type: object
                          x-zs-$id: SuccessResponseBulkUnshare
                          description: >-
                            Represents a per-record result where email sharing
                            was successfully revoked.
                          additionalProperties: false
                          properties:
                            code:
                              type: string
                              description: >-
                                Represents the result code for a successfully
                                unshared record.

                                Possible values: **SUCCESS** - the email sharing
                                was successfully revoked for this record.
                              enum:
                                - SUCCESS
                            details:
                              type: object
                              description: >-
                                Represents the details of the record whose email
                                sharing was revoked. Always present in the
                                response.
                              additionalProperties: false
                              properties:
                                id:
                                  type: string
                                  description: >-
                                    Represents the unique identifier of the
                                    successfully unshared record. Always present
                                    in the response.
                                  format: string
                              required:
                                - id
                            message:
                              type: string
                              description: >-
                                Represents the result message for the
                                successfully unshared record. Always present in
                                the response.
                              enum:
                                - Sharing revoked successfully
                            status:
                              type: string
                              description: >-
                                Represents the status for this result item.

                                Possible values: **success** - the email sharing
                                was revoked for this record. Always present in
                                the response.
                              enum:
                                - success
                          required:
                            - code
                            - details
                            - message
                            - status
                        - type: object
                          x-zs-$id: InvalidDataErrorResponseBulk
                          description: >-
