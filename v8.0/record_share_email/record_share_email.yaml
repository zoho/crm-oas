  /{moduleApiName}/actions/share_emails:
    post:
      description: >-
        To share email threads linked to multiple CRM records with colleagues in
        the same organization. Accepts up to 100 record IDs per request.
        Supports partial success - each record in the response is processed
        independently, and individual results indicate success or failure.
      summary: Share Record Emails
      operationId: shareBulkEmails
      parameters:
        - name: moduleApiName
          in: path
          required: true
          description: >-
            Specify the API name of the module that contains the records whose
            emails you want to share. Refer to [Get Modules
            API](modules.yaml#$.paths./settings/modules.get) to retrieve
            available module API names.
          schema:
            type: string
            enum:
              - Leads
              - Contacts
              - Accounts
              - Deals
              - CustomModule1
          example: Leads
      security:
        - OAuth2:
            - ZohoCRM.modules.Leads.CREATE
        - OAuth2:
            - ZohoCRM.modules.Contacts.CREATE
        - OAuth2:
            - ZohoCRM.modules.Accounts.CREATE
        - OAuth2:
            - ZohoCRM.modules.Deals.CREATE
        - OAuth2:
            - ZohoCRM.modules.Tasks.CREATE
        - OAuth2:
            - ZohoCRM.modules.Events.CREATE
        - OAuth2:
            - ZohoCRM.modules.Calls.CREATE
        - OAuth2:
            - ZohoCRM.modules.Products.CREATE
        - OAuth2:
