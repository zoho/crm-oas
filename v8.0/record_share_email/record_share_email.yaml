                              format: string
                            status:
                              type: string
                              description: >-
                                Represents the status for this result item.

                                Possible values: **error** - the operation is
                                not allowed. Always present in the response.
                              enum:
                                - error
                          required:
                            - code
                            - details
                            - message
                            - status
                        - type: object
                          x-zs-$id: DuplicateDataErrorResponseSharing
