                                - the related id given seems to be invalid
                            status:
                              type: string
                              description: >-
                                Represents the status for this result item.

                                Possible values: **error** - the record ID is
                                invalid. Always present in the response.
                              enum:
                                - error
                          required:
                            - code
                            - details
                            - message
                            - status
                        - type: object
                          x-zs-$id: NotAllowedErrorResponseSharing
                          description: >-
