  /settings/automation/workflow_rules/actions/reorder:
    put:
      summary: Update Workflow Rule Execution Order for Module
      description: >-
        To update the execution order of workflow rules for a specific module in
        your Zoho CRM organization. By default, rules execute in the order in
        which they were created. If any of the specified rule IDs are invalid,
        the entire request fails and no partial updates are applied.
      x-zs-llm-description: >-
        PURPOSE: Updates the execution order of workflow rules for a specific
        module. By default, rules execute in creation order. MANDATORY: module
        query parameter (string - module api_name), request body with ordered
        array of rule IDs representing the new execution sequence. KEY
        CONSTRAINTS: All active rules for the module must be included in the
        array. Missing rules return an error.
      operationId: reorderWorkflowRules
      security:
        - OAuth2:
            - ZohoCRM.settings.workflow_rules.UPDATE
      parameters:
        - $ref: '#/components/parameters/ParamQueryModuleSchema'
      requestBody:
        description: Workflow rule configuration payload.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReorderWorkflowRulesRequestSchema'
            examples:
              SamplePutRequest:
                summary: Sample request body
                value:
                  reorder:
                    workflow_rules:
                      - id: '3361265000006559113'
                        module_specific_sequence: 3
                      - id: '3361265000006559076'
                        module_specific_sequence: 1
                description: >-
                  Shows a reorder request body containing two workflow rules
                  assigned new module-specific sequence positions, demonstrating
                  how to reassign execution order by pairing each rule
                  identifier with its target position.
            x-zs-llm-examples:
              - SamplePutRequest
      responses:
        '200':
          description: OK - Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReOrderSuccessResponseSchema'
              examples:
                ReorderWorkflowSuccess:
                  summary: Success response for status 200
                  value:
                    reorder:
                      - code: SUCCESS
                        details:
                          id: '3361265000006559076'
                        message: rules reordered successfully
                        status: success
                      - code: SUCCESS
                        details:
                          id: '3361265000006559113'
                        message: rules reordered successfully
                        status: success
                  description: >-
                    Shows a successful 200 response in which each submitted
                    workflow rule is confirmed with a per-rule SUCCESS status
                    code and the rule's identifier returned in the details
                    object.
          headers:
            X-API-CREDITS-REMAINING:
              schema:
                type: string
                format: int64
                description: >
                  Present when >=50% of base daily credits (excluding add-on
                  credits) are consumed. Value is total remaining credits
                  including add-on credits for the rolling 24-hour window.
                pattern: ^[0-9]+$
                minLength: 1
                maxLength: 19
              required: false
        '400':
          description: >
            The response returned when the deletion request is invalid, such as
            a malformed or missing rule ID.
          content:
            application/json:
              schema:
                x-zs-$id: ReorderWorkflowErrorResponseSchema
                oneOf:
                  - $ref: '#/components/schemas/InvalidDataNoApiNameAndPathSchema'
                  - type: object
                    x-zs-$id: ReorderWorkflowErrorResponse
                    additionalProperties: false
                    description: Wrapped error response with reorder
                    properties:
                      reorder:
                        type: array
                        description: Array of error objects
                        maxItems: 10
              examples:
                RequiredParamMissingResponse1:
                  summary: >-
                    Error response with code REQUIRED_PARAM_MISSING: required
                    param not found
                  value:
                    code: REQUIRED_PARAM_MISSING
                    details:
                      param_name: module
                    message: required param not found
                    status: error
                  description: >-
                    Shows a REQUIRED_PARAM_MISSING error returned when the
                    mandatory module query parameter is absent from the request
                    entirely, distinguishing this case from an invalid module
                    name where the parameter is present but unrecognised.
                InvalidModuleResponse:
                  summary: 'Error response with code INVALID_MODULE: Invalid Module'
                  value:
                    code: INVALID_MODULE
                    details:
                      param_name: module
                    message: Invalid Module
                    status: error
                  description: >-
                    Shows an INVALID_MODULE error returned when the module query
                    parameter contains an API name that does not match any
                    recognised CRM module, with the offending parameter name
                    surfaced in the error details.
                InvalidDataResponse1:
                  summary: >-
                    Error response with code INVALID_DATA: duplicate data
                    (Field: module_specific_sequence)
                  value:
                    reorder:
                      - code: INVALID_DATA
                        details:
                          api_name: module_specific_sequence
                          json_path: $.reorder.workflow_rules[1].module_specific_sequence
                        message: duplicate data
                        status: error
                  description: >-
                    Shows an INVALID_DATA error triggered when the same sequence
                    number is assigned to more than one rule in the request,
                    with the duplicate module_specific_sequence value located at
                    the second array entry identified in the JSON path.
                InvalidDataResponse2:
                  summary: >-
                    Error response with code INVALID_DATA: duplicate data
                    (Field: id)
                  value:
                    reorder:
                      - code: INVALID_DATA
                        details:
                          api_name: id
                          json_path: $.reorder.workflow_rules[1].id
                        message: duplicate data
                        status: error
                  description: >-
                    Shows an INVALID_DATA error triggered when the same workflow
                    rule identifier appears more than once in the request array,
                    with the offending duplicate ID located at the second array
                    entry identified in the JSON path.
                InvalidDataResponse3:
                  summary: >-
                    Error response with code INVALID_DATA: Invalid process id
                    (Field: id)
                  value:
                    reorder:
                      - code: INVALID_DATA
                        details:
                          api_name: id
                          json_path: $.reorder.workflow_rules[0].id
                        message: Invalid process id
                        status: error
                  description: >-
                    Shows an INVALID_DATA error returned when a workflow rule
                    identifier in the request does not correspond to an existing
                    rule, with the invalid ID located at the first array entry
                    identified in the JSON path.
                InvalidDataResponse4:
                  summary: >-
                    Error response with code INVALID_DATA: Invalid sequence
                    number is given (Field: module_specific_sequence)
                  value:
                    reorder:
                      - code: INVALID_DATA
                        details:
                          api_name: module_specific_sequence
                          json_path: $.reorder.workflow_rules[1].module_specific_sequence
                        message: Invalid sequence number is given
                        status: error
                  description: >-
                    Shows an INVALID_DATA error returned when a
                    module_specific_sequence value falls outside the permissible
                    range, with the out-of-range position identified at the
                    second array entry in the JSON path.
                MandatoryNotFoundResponse1:
                  summary: >-
                    Error response with code MANDATORY_NOT_FOUND: The required
                    data missing (Field: module_specific_sequence)
                  value:
                    reorder:
                      - code: MANDATORY_NOT_FOUND
                        details:
                          api_name: module_specific_sequence
                          json_path: $.reorder.workflow_rules[1].module_specific_sequence
                        message: The required data missing
                        status: error
                  description: >-
                    Shows a MANDATORY_NOT_FOUND error returned when the
                    module_specific_sequence field is omitted from one of the
                    workflow rule objects in the request array, with the missing
                    field's JSON path pointing to the second array entry.
                Error400Response2:
                  summary: Error response
                  value:
                    reorder:
                      - code: INVALID_DATA
                        message: Invalid data type
                        details:
                          api_name: workflow_rules
                          expected_data_type: jsonarray
                          json_path: $.reorder.workflow_rules
                        status: error
                  description: >-
                    Shows an INVALID_DATA error returned when the workflow_rules
                    field is supplied with an incorrect data type instead of the
                    required JSON array, with the expected data type and JSON
                    path included in the error details.
                Error400Response3:
                  summary: Error response
                  value:
                    reorder:
                      - code: INVALID_DATA
                        message: Invalid data
                        details:
                          api_name: workflow_rules
                          maximum_length: 2
                          json_path: $.reorder.workflow_rules
                        status: error
                  description: >-
                    Shows an INVALID_DATA error returned when the workflow_rules
                    field contains structurally invalid content, distinguishing
                    this case from a data-type mismatch by indicating malformed
                    field values rather than a wrong container type.
          headers:
            X-API-CREDITS-REMAINING:
              schema:
                type: string
                format: int64
                description: >
                  Present when >=50% of base daily credits (excluding add-on
                  credits) are consumed. Value is total remaining credits
                  including add-on credits for the rolling 24-hour window.
                pattern: ^[0-9]+$
                minLength: 1
                maxLength: 19
              required: false
        '403':
          description: >
            Forbidden. The authenticated user does not have permission to
            perform this operation, or the workflow rules feature is not
            available in the current CRM edition. Resolution: verify the user's
            permissions and the organization's edition capabilities.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoPermissionSchema'
              examples:
                NoPermissionResponse:
                  summary: Error response for status 403
                  value:
                    code: NO_PERMISSION
                    details:
                      permissions:
                        - Crm_Implied_Manage_Workflow
                    message: feature not available in this edition
                    status: error
                  description: >-
                    Shows a 403 NO_PERMISSION error returned when the
                    authenticated user's CRM profile lacks the
                    Crm_Implied_Manage_Workflow permission required to reorder
                    workflow rules, with the missing permission name listed in
                    the error details.
          headers:
            X-API-CREDITS-REMAINING:
              schema:
                type: string
                format: int64
                description: >
                  Present when >=50% of base daily credits (excluding add-on
                  credits) are consumed. Value is total remaining credits
                  including add-on credits for the rolling 24-hour window.
                pattern: ^[0-9]+$
                minLength: 1
                maxLength: 19
              required: false
components:
  schemas:
    WorkflowSuccessSchema:
      type: object
      x-zs-$id: WorkflowSuccessSchema
      additionalProperties: false
      description: >-
        Represents the success response returned after creating a workflow rule,
        containing the result details of the created rule.
      x-zs-llm-description: >-
        Success response wrapper for POST/PUT workflow rule operations. Contains
        workflow_rules array with per-rule status objects indicating success or
        failure with details.
      properties:
        workflow_rules:
          type: array
          description: >-
            Represents the array of workflow rule objects returned in the
            success response.
          items:
            $ref: '#/components/schemas/SuccessResponseNestedSchema'
          maxItems: 200
    ReOrderSuccessResponseSchema:
      type: object
      x-zs-$id: ReOrderSuccessResponseSchema
      additionalProperties: false
      description: >-
        Represents the success response returned after reordering workflow
        rules.
      x-zs-llm-description: >-
        Success response wrapper for the reorderWorkflowRules operation.
        Contains reorder array confirming the new execution sequence was
        applied.
      properties:
        reorder:
          type: array
          description: >-
            Represents the array of workflow rule objects with their updated
            execution order.
          items:
            $ref: '#/components/schemas/SuccessResponseNestedSchema'
          maxItems: 125
    NoPermissionSchema:
      type: object
      x-zs-$id: NoPermissionSchema
      additionalProperties: false
      description: >-
        Represents the error response returned when the authenticated user does
        not have permission to access the requested feature or module.
      x-zs-llm-description: >-
        Error codes: NO_PERMISSION or FEATURE_NOT_SUPPORTED. Returned when the
        user lacks ManageAutomation permission or the workflow feature is not
        available in the current CRM edition. Resolution: verify user
        permissions and edition capabilities.
      properties:
        code:
          type: string
          description: >-
            Represents the error code that identifies the specific error
            condition.
          enum:
            - NO_PERMISSION
            - FEATURE_NOT_SUPPORTED
        message:
          type: string
          description: Represents the error message describing the issue.
          maxLength: 1000
          example: feature not available in this edition
        status:
          type: string
          description: Represents the response status for the error, typically **error**.
          enum:
            - error
        details:
          type: object
          additionalProperties: false
          description: >-
            Represents error details. For NO_PERMISSION, contains the list of
            permissions needed. For FEATURE_NOT_SUPPORTED, empty object.
          x-zs-llm-description: >-
            Error details. For NO_PERMISSION, contains the list of permissions
            needed. For FEATURE_NOT_SUPPORTED, empty object.
          properties:
            permissions:
              type: array
              maxItems: 10
              items:
                type: string
                maxLength: 255
                description: >-
                  Represents the name of a CRM profile permission required for
                  the requested action.
              description: >-
                Represents the list of CRM profile permissions required to
                perform the requested action.
      required:
        - code
        - message
        - status
        - details
      title: Error Response Core
    SuccessResponseNestedSchema:
      type: object
      x-zs-$id: SuccessResponseNestedSchema
      additionalProperties: false
      description: >-
        Represents a single item in a multi-status response array, including a
        response code, status indicator, message, and optionally the resource
        details.
      x-zs-llm-description: >-
        Individual success/error status object within a bulk operation response.
        Contains code (status code string), details (object with created/updated
        resource id), message (human-readable), and status ('success' or
        'error').
      properties:
        code:
          type: string
          description: >-
            Represents the API response code indicating the operation result,
            such as **SUCCESS** or **INVALID_DATA**.
          x-zs-llm-description: >-
            PURPOSE: API response code indicating the result status. VALUES:
            SUCCESS on a successful entry; otherwise an error code such as
            INVALID_DATA, MANDATORY_NOT_FOUND, DEPENDENT_FIELD_MISSING, or
            LIMIT_EXCEEDED. KEY CONSTRAINTS: A 200 or 207 envelope can still
            contain entries whose code is an error, so read this per entry
            rather than trusting the HTTP status.
          maxLength: 255
        details:
          $ref: '#/components/schemas/SuccessResponseDetailsSchema'
        message:
          type: string
          description: Represents the message describing the operation result or error.
