          const: create_record_email
        details:
          description: >
            Configuration for the create-record-from-email action. Requires the
            target module, either Leads or Contacts, and exactly one field
            mapping that assigns the record owner.
          $ref: '#/components/schemas/AutomationEmailCreateRecordDetails'
        id:
          type: string
          description: >-
            Represents the unique ID of the EmailCreateRecord action within the
