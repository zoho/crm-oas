    SocialActionSchema:
      type: object
      x-zs-$id: SocialActionSchema
      additionalProperties: false
      description: >-
        Represents a non-associate action that publishes a post to a social
        network such as Facebook or Twitter when the workflow rule condition is
        triggered.
      x-zs-llm-description: >-
        PURPOSE: Non-associate social action for Facebook or Twitter
        integrations. Available only with social triggers (fb_* for Facebook,
        tw_* for Twitter). Limit: 1 per type per rule. PREREQUISITES: Call
        `getWorkflowConfigurations` to check which social action types are
        enabled for the module. MANDATORY: type (one of: comment_to_post,
        reply_to_comment, like_to_comment, reply_to_message, retweet,
        reply_to_tweet). DETAILS CONTRACT: content (string - supports merge
        fields ${Module.Field}). Content is REQUIRED for comment_to_post,
        reply_to_comment, reply_to_message, reply_to_tweet. Content is NOT
        required for like_to_comment, retweet (details can be empty). EXAMPLE:
        {"type": "reply_to_comment", "details": {"content": "Thanks for reaching
        out, ${Leads.Full_Name}!"}}
      properties:
        name:
          type: string
          description: >-
            Represents the display name of the Social action as it appears
            within the workflow rule configuration.
          maxLength: 100
        type:
          type: string
          description: >-
            Represents the social action type. Facebook actions require
            Facebook-specific triggers, and Twitter actions require
            Twitter-specific triggers.
          enum:
            - comment_to_post
            - reply_to_comment
            - like_to_comment
            - reply_to_message
            - retweet
            - reply_to_tweet
        details:
          description: >
            Configuration for the social action, containing the message content
            with merge field support. Required for commenting or replying
            actions, and not needed for like or retweet actions.
          x-zs-llm-description: >-
            Social action configuration containing the content (message text
