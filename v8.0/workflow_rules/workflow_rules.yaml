                true - Delete all scheduled actions when the rule is
                deactivated.

                false - Preserve scheduled actions when the rule is deactivated.
              x-zs-llm-description: >-
                PURPOSE: Controls whether pending scheduled executions are
                removed when the rule is deactivated. VALUES: true - permanently
                removes pending scheduled executions. false or omitted -
                preserves them; they resume if the rule is reactivated. KEY
                CONSTRAINTS: Only applicable when active=false. If active=true
                is provided alongside delete_schedule_action, the field is
