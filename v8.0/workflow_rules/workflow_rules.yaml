            from 1, unique). KEY CONSTRAINTS: For convert action, the condition
            MUST include criteria_details with non-null criteria - without it
            returns NOT_ALLOWED.
          items:
            $ref: '#/components/schemas/ConditionsNestedSchema'
          maxItems: 10
        lock:
          type: object
          description: >-
            Specify the lock configuration to prevent other users from editing
            the rule. Only administrators can lock or unlock rules.
          x-zs-llm-description: >-
            PURPOSE: Lock configuration to prevent other users from editing the
            rule. PREREQUISITES: Only admin users can lock/unlock rules.
            MANDATORY: lock.status (boolean) if the lock object is provided.
            OPTIONAL: lock.message. KEY CONSTRAINTS: lock.message is only valid
            when lock.status=true - providing it with lock.status=false returns
            DEPENDENT_MISMATCH.
          additionalProperties: false
          properties:
            message:
              type: string
              description: >-
                Specify the reason or context for locking the rule. Valid only
                when **lock.status** is set to true.
              x-zs-llm-description: >-
                Reason or context for locking the rule. Only valid when
                lock.status is true. If provided with lock.status=false, returns
                DEPENDENT_MISMATCH error.
              format: string
            status:
              type: boolean
              description: |-
                Specify whether to lock the rule.
                Possible values:
                true - Locks the rule to prevent editing.
                false - Unlocks the rule.
      required:
        - conditions
        - execute_when
        - module
        - name
