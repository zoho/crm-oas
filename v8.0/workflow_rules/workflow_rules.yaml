                InvalidDataResponse4:
                  summary: >-
                    Error response with code INVALID_DATA: Invalid sequence
                    number is given (Field: module_specific_sequence)
                  value:
                    reorder:
                      - code: INVALID_DATA
                        details:
                          api_name: module_specific_sequence
