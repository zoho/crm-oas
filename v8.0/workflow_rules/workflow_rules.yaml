    delete:
      operationId: deleteWorkflowRules
      security:
        - OAuth2:
            - ZohoCRM.settings.workflow_rules.DELETE
      summary: Delete One or More Workflow Rules
      description: >
        To delete one or more workflow rules from your Zoho CRM organization.
        You can delete up to ten workflow rules in a single API call; when some
        deletions succeed and others fail, the API responds with a 207
        Multi-Status.
      x-zs-llm-description: >-
        Bulk-deletes workflow rules by IDs (comma-separated in ids query param,
        max 10). Locked rules cannot be deleted. Returns per-rule success/error
        status. Use getWorkflowRules first to discover rule IDs.
      parameters:
        - $ref: '#/components/parameters/ParamQueryIdsSchema'
      responses:
        '200':
          description: Workflow Rule deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowSuccessSchema'
              examples:
                SuccessResponse:
                  summary: DELETE- Success response for status 200
                  value:
                    workflow_rules:
                      - code: SUCCESS
                        details:
                          id: '3361265000006461011'
                        message: WorkFlow Rule deleted successfully
                        status: success
