        module ({api_name: 'Calls', id}), layout ({id}), field_mappings (array
        1-25, include Subject). OPTIONAL: apply_restriction (bool). KEY FIELDS:
        Subject, Call_Purpose, Call_Type, Call_Start_Time, Remind_At. EXAMPLE:
        {"type": "schedule_call", "details": {"module": {"api_name": "Calls",
        "id": "111111000000000191"}, "layout": {"id": "111111000000000197"},
        "field_mappings": [{"field": {"api_name": "Subject"}, "type": "static",
        "value": "Follow-up Call"}]}}
      properties:
        name:
          type: string
          description: >-
            Represents the display name of the ScheduleCall action as it appears
            within the workflow rule configuration.
          maxLength: 100
        type:
          type: string
          description: >-
            Represents the action type discriminator that identifies this as a
            ScheduleCall action within the workflow rule. The value is fixed for
            this action type and must be supported by the target module and
            trigger event.
          x-zs-llm-description: >-
            Action type discriminator. Required. Must be supported for the
            module and trigger -- verify via `getWorkflowConfigurations`.
          const: schedule_call
        details:
          description: >
            Configuration for the schedule_call action. Requires the Calls
