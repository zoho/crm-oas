    WorkflowRulePostNestedSchema:
      type: object
      additionalProperties: false
      description: >-
        Represents the configuration object for a new workflow rule, including
        required fields such as name, target module, and trigger configuration.
      x-zs-llm-description: >-
        Before constructing this object, call `getWorkflowConfigurations`
        because supported triggers, actions, and compatibility are
        module-specific. Call `getWorkflowRulesCount` for organization-specific
        rule, action, and scheduled-action limits; the conditions array is
        capped at 10 by this schema. Call `getFields` when criteria,
        field_mappings, or field_updates reference fields. Required properties
        are name (max 100 characters), module, execute_when, and conditions.
        Optional description is max 1000 characters; lock requires status and
        permits message only when status is true.
      properties:
        name:
          type: string
          description: >-
            Specify the workflow rule name. Required. Cannot exceed 100
            characters. Special characters are not allowed.
          x-zs-llm-description: >-
            The workflow rule name. Required. Max 100 characters. Special
            characters are not allowed. Cannot be empty.
          maxLength: 100
        description:
          type:
            - string
            - 'null'
          description: >-
            Specify an optional description for the workflow rule. Set to null
            to clear an existing description.
          maxLength: 1000
        module:
          $ref: '#/components/schemas/ModuleOrFieldNestedSchema'
          description: >-
            The module to which the workflow rule applies. Use the [Get Modules
            API](modules.yaml#$.paths./settings/modules.get) to retrieve module
            IDs. Required. Must be a workflow-supported module. If both id and
            api_name are provided, they must match. Use
            `getWorkflowConfigurations` to discover supported modules. Cannot be
            changed after creation.
          x-zs-llm-description: >-
            The module to which the workflow rule applies. Required. Must be a
            workflow-supported module. If both id and api_name are provided,
            they must match. Use `getWorkflowConfigurations` to discover
            supported modules. Cannot be changed after creation.
        execute_when:
          $ref: '#/components/schemas/ExecuteWhenNestedSchema'
          description: >-
            Specifies when the workflow rule is triggered. This is a required
            JSON object with "type" and "details" properties. For example:
            {"type": "create_or_edit", "details": {"trigger_module":
            {"api_name": "Leads", "id": "..."}, "repeat": false}}. Passing a
            string instead of a JSON object, such as "create_or_edit", returns
            an "INVALID_DATA" error. The "details.trigger_module" must match the
            module associated with the workflow rule. Use
            "getWorkflowConfigurations" to retrieve the available triggers and
            their supported actions.
          x-zs-llm-description: >-
            For INVALID_DATA caused by a non-object value, expected_data_type is
            jsonobject.
        conditions:
          type: array
          description: >-
            Specify the conditions that define the branching logic of the
            workflow rule. Each condition evaluates records against criteria and
            executes its own set of actions. At least one condition is required.
          x-zs-llm-description: >-
