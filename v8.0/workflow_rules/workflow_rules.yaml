        Represents usage metrics for a single workflow action, including its
        identifier, display name, action type, execution success and failure
        counts within a queried date range, and the timestamp of its last
        association.
      x-zs-llm-description: >-
        Basic action usage entry without queue or email details. Contains name,
        type, id, success_count, failure_count, and associated_time.
      properties:
