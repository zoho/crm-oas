        (const 'flow'), details (custom_action_id + custom_action_name).
        EXAMPLE: {"name": "Trigger deal sync", "type": "flow", "details":
        {"custom_action_id": "4839491000001566002", "custom_action_name": "Sync
        to ERP"}}
      properties:
        name:
          type: string
          description: >-
            Represents the display name of the Zoho Flow action. This field is
            required.
          maxLength: 100
        type:
          type: string
          description: >-
            Represents the action type discriminator that identifies this as a
            Zoho Flow action within the workflow rule.
          const: flow
        details:
          description: >
            Configuration for the Zoho Flow action. Requires the ID and name of
            the custom action to trigger in Zoho Flow.
          x-zs-llm-description: >-
            Zoho Flow configuration. Fetch values from `getCustomActions`
            (service_type='zoho_flow'): use `id` as custom_action_id,
            `action_name` as custom_action_name.
          $ref: '#/components/schemas/AutomationZohoFlowDetails'
        id:
          type: string
          description: >-
            Represents the unique ID of the Zoho Flow action within the workflow
            rule.
          maxLength: 20
        _delete:
          type: 'null'
          description: >-
            Indicates that this Zoho Flow action should be removed from the
