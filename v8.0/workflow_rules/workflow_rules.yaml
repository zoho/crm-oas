          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoPermissionSchema'
              examples:
                NoPermissionResponse:
                  summary: >-
                    Workflow rules feature not available in the current Zoho CRM
                    edition
                  value:
                    code: NO_PERMISSION
                    details:
                      permissions:
                        - Crm_Implied_Manage_Workflow
                    message: feature not available in this edition
                    status: error
                  description: >-
                    Returned when the workflow rules feature is not available in
                    the current Zoho CRM edition. The server responds with error
                    code NO_PERMISSION.
  /settings/automation/workflow_rules/actions/reorder:
    put:
      summary: Update Workflow Rule Execution Order for Module
      description: >-
        To update the execution order of workflow rules for a specific module in
        your Zoho CRM organization. By default, rules execute in the order in
        which they were created. If any of the specified rule IDs are invalid,
        the entire request fails and no partial updates are applied.
      x-zs-llm-description: >-
        Changes execution order of workflow rules for a module. Rules execute in
        the order specified in the request array. All active rules for the
        module must be included  missing rules cause an error. Requires module
        query parameter.
      operationId: reorderWorkflowRules
      security:
        - OAuth2:
            - ZohoCRM.settings.workflow_rules.UPDATE
      parameters:
        - $ref: '#/components/parameters/ParamQueryModuleSchema'
      requestBody:
        description: Workflow rule configuration payload.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReorderWorkflowRulesRequestSchema'
            examples:
              SamplePutRequest:
                summary: Sample request body
                value:
                  reorder:
                    workflow_rules:
                      - id: '3361265000006559113'
                        module_specific_sequence: 3
                      - id: '3361265000006559076'
                        module_specific_sequence: 1
                description: >-
                  Shows a reorder request body containing two workflow rules
                  assigned new module-specific sequence positions, demonstrating
                  how to reassign execution order by pairing each rule
                  identifier with its target position.
            x-zs-llm-examples:
              - SamplePutRequest
      responses:
        '200':
          description: OK - Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReOrderSuccessResponseSchema'
              examples:
                ReorderWorkflowSuccess:
                  summary: Success response for status 200
                  value:
                    reorder:
                      - code: SUCCESS
                        details:
                          id: '3361265000006559076'
                        message: rules reordered successfully
                        status: success
                      - code: SUCCESS
                        details:
                          id: '3361265000006559113'
                        message: rules reordered successfully
                        status: success
                  description: >-
                    Shows a successful 200 response in which each submitted
                    workflow rule is confirmed with a per-rule SUCCESS status
                    code and the rule's identifier returned in the details
                    object.
        '400':
          description: >
            The response returned when the deletion request is invalid, such as
            a malformed or missing rule ID.
          content:
            application/json:
              schema:
                x-zs-$id: ReorderWorkflowErrorResponseSchema
                oneOf:
                  - $ref: '#/components/schemas/InvalidDataNoApiNameAndPathSchema'
                  - type: object
                    x-zs-$id: ReorderWorkflowErrorResponse
                    additionalProperties: false
                    description: Wrapped error response with reorder
                    properties:
                      reorder:
                        type: array
                        description: Array of error objects
                        maxItems: 10
              examples:
                RequiredParamMissingResponse1:
                  summary: >-
                    Error response with code REQUIRED_PARAM_MISSING: required
                    param not found
                  value:
                    code: REQUIRED_PARAM_MISSING
                    details:
                      param_name: module
                    message: required param not found
                    status: error
                  description: >-
                    Shows a REQUIRED_PARAM_MISSING error returned when the
                    mandatory module query parameter is absent from the request
                    entirely, distinguishing this case from an invalid module
                    name where the parameter is present but unrecognised.
                InvalidModuleResponse:
                  summary: 'Error response with code INVALID_MODULE: Invalid Module'
                  value:
                    code: INVALID_MODULE
                    details:
                      param_name: module
                    message: Invalid Module
                    status: error
                  description: >-
                    Shows an INVALID_MODULE error returned when the module query
                    parameter contains an API name that does not match any
                    recognised CRM module, with the offending parameter name
                    surfaced in the error details.
                InvalidDataResponse1:
                  summary: >-
                    Error response with code INVALID_DATA: duplicate data
