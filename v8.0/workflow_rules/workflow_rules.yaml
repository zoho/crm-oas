          description: >-
            Represents the target field definition to which the multi-select
            lookup filter criterion is applied. The field must have a data_type
            of multiuserlookup or multiselectlookup.
        comparator:
          type: string
          enum:
            - include_all
            - include_any
            - exclude_all
            - exclude_any
          description: >-
            Represents the multi-select lookup comparison operator applied to
            the criterion. Applicable only when the field's data_type is
            multiuserlookup or multiselectlookup.

            Possible values:

            include_all - Matches records that include all specified lookup
            values.

            include_any - Matches records that include at least one of the
