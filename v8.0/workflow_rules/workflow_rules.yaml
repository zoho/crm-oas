        success_count:
          type: integer
          format: int32
          description: >-
            Represents the total number of successful executions recorded for
            this action within the queried date range.
        failure_count:
          type: integer
          format: int32
          description: >-
            Represents the total number of failed executions recorded for this
            action within the queried date range.
        id:
          type: string
          description: Represents the unique ID of the workflow action.
          maxLength: 20
        type:
          type: string
          description: Represents the category of workflow action executed by the rule.
          maxLength: 255
        associated_time:
          type: string
          description: >-
            Represents the ISO 8601 timestamp indicating when this action was
            last associated with or modified on a workflow rule.
          maxLength: 255
      required:
        - associated_time
