        executions), and condition id.
      properties:
        instant_actions:
          $ref: '#/components/schemas/InstantActionsUsageListSchema'
        scheduled_actions:
          type: array
          description: >-
            Represents the array of scheduled action groups configured for this
            condition.
          items:
            $ref: '#/components/schemas/ScheduledActionsUsageGroupSchema'
          maxItems: 5
        usage_count:
          type: integer
          format: int32
          description: >-
            Represents the total number of times the actions in this condition
            were executed.
        id:
          type: string
          description: >-
            Represents the unique ID of the WorkflowConditionUsageSummary within
            the workflow rule.
          maxLength: 20
      required:
        - id
        - instant_actions
        - scheduled_actions
        - usage_count
      title: Workflow Condition Usage Summary
    WorkflowConditionUsageWithTaggedInstantActionsSchema:
      type: object
      x-zs-$id: WorkflowConditionUsageWithTaggedInstantActionsSchema
