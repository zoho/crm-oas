    WorkflowSimpleFilterCriterion:
      type: object
      x-zs-$id: WorkflowSimpleFilterCriterion
      description: >-
        Represents a simple filter criterion for workflow rule queries,
        specifying the field API name, comparator, and value to match.
      x-zs-llm-description: >-
        Single filter criterion in a workflow criteria array. Required: field
        ({api_name, id}), comparator (equal, not_equal, like, starts_with,
        etc.), value. Special: '${ANYVALUE}' comparator supported only in
        field_update triggers to match any value change. Type field
        distinguishes value source: 'value' (literal), 'merge_field' (runtime
        token), 'pre_defined' (system), 'field' (other field comparison).
      properties:
        field:
          allOf:
            - $ref: '#/components/schemas/FilterFieldBase'
            - type: object
              additionalProperties: true
              description: >-
                Represents additional field reference constraints for the filter
                criterion, requiring the `api_name` property to identify the
                target field.
              required:
                - api_name
          unevaluatedProperties: false
          description: Represents the field to which the filter criterion is applied.
        comparator:
          type: string
          enum:
            - equal
            - not_equal
            - like
            - not_like
            - starts_with
            - ends_with
            - contains
            - not_contains
            - greater_than
            - greater_equal
            - less_equal
            - less_than
            - in
            - not_in
            - between
            - ${ANYVALUE}
          description: >-
            Represents the comparison operator applied to the filter criterion.
            **${ANYVALUE}** is a special value supported only in field update
            triggers; it matches any change to the monitored field value.
        value:
          oneOf:
            - $ref: '#/components/schemas/SimpleFilterCriterionValueString'
            - $ref: '#/components/schemas/SimpleFilterCriterionValueNumber'
            - $ref: '#/components/schemas/SimpleFilterCriterionValueBoolean'
            - $ref: '#/components/schemas/SimpleFilterCriterionValueObjectRequest'
        type:
          type: string
          enum:
            - merge_field
            - pre_defined
            - value
            - field
          default: value
          description: >-
            Indicates whether the criterion value is a direct value or a system
            variable placeholder.
      required:
        - field
        - comparator
        - value
      additionalProperties: false
    WorkflowGroupedFilterCriterion:
      type: object
      x-zs-$id: WorkflowGroupedFilterCriterion
      description: >-
        Represents a grouped filter criterion containing multiple simple filter
        conditions evaluated together using a logical operator such as AND or
        OR.
      x-zs-llm-description: >-
        Grouped filter criterion containing multiple
        WorkflowSimpleFilterCriterion items joined by group_operator (AND/OR).
        Use for complex multi-field conditions. The group array holds the
        individual criteria and group_operator defines their logical
        relationship.
      properties:
        group:
          type: array
          description: >-
            Represents the array of filter conditions to be evaluated together
            using the specified logical operator.
          minItems: 2
          maxItems: 25
          items:
            oneOf:
              - $ref: '#/components/schemas/WorkflowSimpleFilterCriterion'
              - $ref: '#/components/schemas/WorkflowGroupedFilterCriterion'
        group_operator:
          type: string
          enum:
            - AND
            - OR
          description: >-
            Represents the logical operator applied between the filter
            conditions in the group.
      required:
        - group
        - group_operator
      additionalProperties: false
    FilterFieldBase:
      type: object
      x-zs-$id: FilterFieldBase
      description: >-
        Represents the base field reference used in filter operations,
        containing minimal required properties. The field's data_type is not
        part of this object; resolve it from the corresponding FieldSchema. For
        formula fields, use formula.return_type as the effective data_type; for
        rollup_summary fields, use rollup_summary.return_type.
      properties:
        id:
          type: string
          format: int64
          description: Represents the unique ID of the field used for filter operations.
        api_name:
          type: string
          description: >-
            Represents the API name of the field used for filter application.
            Supports relationship notation, for example, Deals__r.Stage.
      additionalProperties: true
    SimpleFilterCriterionValueString:
      type: string
      x-zs-$id: SimpleFilterCriterionValueString
      description: >-
        Represents a string filter criterion value applicable to fields with a
        data_type of text, textarea, email, phone, website, autonumber,
        picklist, multiselectpicklist, date, or datetime, as well as any
        data_type not explicitly covered by SimpleFilterCriterionValueNumber,
        SimpleFilterCriterionValueBoolean,
        SimpleFilterCriterionValueObjectRequest,
        SimpleFilterCriterionValueObjectResponse, or the multiselect lookup
        value schemas.
      maxLength: 255
    SimpleFilterCriterionValueNumber:
      type: number
      x-zs-$id: SimpleFilterCriterionValueNumber
      description: >-
        Represents a numeric filter criterion value applicable to fields with a
        data_type of integer, currency, or double.
    SimpleFilterCriterionValueBoolean:
      type: boolean
      x-zs-$id: SimpleFilterCriterionValueBoolean
      description: >-
        Represents a Boolean filter criterion value. Applicable only when the
        field has a Boolean data type (checkbox field).
    SimpleFilterCriterionValueObjectBase:
      type: object
      description: >-
        Represents the base minified record structure of a lookup module,
        containing the record's unique identifier and display name.
      properties:
        id:
          type: string
          format: int64
          description: Represents the unique ID of the lookup module record.
        name:
          type: string
          maxLength: 255
          description: Represents the display name of the lookup module record.
      additionalProperties: true
    SimpleFilterCriterionValueObjectRequest:
      x-zs-$id: SimpleFilterCriterionValueObjectRequest
      allOf:
        - $ref: '#/components/schemas/SimpleFilterCriterionValueObjectBase'
        - type: object
          additionalProperties: true
          description: >-
            Represents the constraint that the ID property is required for the
            lookup object filter criterion value in request bodies.
          required:
            - id
          properties:
            id: {}
      unevaluatedProperties: false
      description: >-
        Represents a lookup object filter criterion value for request bodies,
        applicable when the field's data_type is lookup, ownerlookup, or
        userlookup. The ID property is required.
    AutomationModuleRef:
      x-zs-$id: AutomationModuleRef
      type: object
      additionalProperties: false
      minProperties: 1
      description: >-
        PURPOSE: Module reference used across non-associate actions. At least
        one of api_name or id required (EXPECTED_FIELD_MISSING if neither). If
        both given, must match (AMBIGUITY_DURING_PROCESSING). GET
        /settings/modules to discover. Always use full 19-digit module ID.
      x-zs-llm-description: >-
        Module reference for action targeting. At least one of api_name or id
        required  EXPECTED_FIELD_MISSING if neither is present. If both provided
        and they refer to different modules  AMBIGUITY_DURING_PROCESSING. Obtain
        from getModules. Used in most non-associate action details to specify
        where the action operates.
      properties:
        api_name:
          type: string
          description: API name of the module (e.g., Leads, Contacts, Deals, Vendors).
          maxLength: 255
          example: Leads
        id:
          type: string
          description: >-
            Unique module ID (19-digit format). Always use the full ID as
            returned by GET /settings/modules - truncated or shortened IDs
            return INVALID_DATA ('the tabId given seems to be invalid').
            Optional in requests if api_name is provided; always present in
            responses.
          maxLength: 20
          example: '1189654000000000037'
      title: Automation Module Reference
    AutomationAssignOwnerResource:
      x-zs-$id: AutomationAssignOwnerResource
      type: object
      additionalProperties: false
      description: >-
        PURPOSE: Resource reference for assign_to entry. MANDATORY: id (string).
        OPTIONAL: name, type. Obtain from GET /settings/users (user),
        /settings/roles (role), /settings/user_groups (group),
        /settings/automation/assignment_rules (assignment_rule),
        /settings/profiles (profile). If both id and name given, must match
        (AMBIGUITY_DURING_PROCESSING).
      x-zs-llm-description: >-
        Resource reference within an assign_to entry. id is mandatory
        (DEPENDENT_FIELD_MISSING if absent). name is optional (server resolves
        from id). type indicates resource kind when present. Obtain IDs from:
        getUsers (user), getRoles (role), getUserGroups (group),
        getAssignmentRules (assignment_rule), getProfiles (profile).
      properties:
        id:
          type: string
          description: >-
            Unique identifier of the target entity. Obtain from the
            corresponding API: GET /settings/users (for user), GET
            /settings/roles (for role), GET /settings/user_groups (for group),
            GET /settings/automation/assignment_rules (for assignment_rule), or
            GET /settings/profiles (for profile).
          maxLength: 255
          example: '111111000000053889'
        name:
          type: string
          description: >-
            Display name of the target entity. Optional in POST/PUT requests
            (server resolves from id); always present in GET responses.
          maxLength: 255
          example: Sri
        type:
          type: string
          description: >-
            Type of the target entity. Present in GET responses; not required in
            POST/PUT requests.
          enum:
            - user
            - role
            - group
            - assignment_rule
            - profile
      required:
        - id
      title: Assign Owner Resource
    AutomationAssignToResourceEntry:
      x-zs-$id: AutomationAssignToResourceEntry
      type: object
      additionalProperties: false
      description: >-
        PURPOSE: assign_to entry for resource-based ownership. MANDATORY: type
        (user|role|group|assignment_rule|profile), resource ({id, name}). For
        type=profile: associated_to must be 'team_profile'. For round-robin: use
        multiple entries of type=user.
      x-zs-llm-description: >-
        assign_to entry where ownership is assigned to a specific resource. type
        selects the resource kind: user, role, group, assignment_rule, or
        profile. resource object provides the target's id and optionally name.
        For profile type: associated_to must be 'team_profile'. Returns
        DEPENDENT_FIELD_MISSING if resource is omitted.
      properties:
        type:
          type: string
          description: >-
            Assignment method. Determines what kind of entity receives
            ownership. Values: "user" - assign to a specific CRM user (GET
            /settings/users), for round-robin include multiple assign_to entries
            of type=user; "role" - assign to a user holding the specified role
            (GET /settings/roles), system picks an eligible user at execution
            time; "group" - assign to a member of the specified user group (GET
            /settings/user_groups); "assignment_rule" - assign using a
            pre-configured assignment rule (GET
            /settings/automation/assignment_rules), the rule's criteria and
            round-robin logic determine the final owner; "profile" - assign to a
            user matching the specified profile (GET /settings/profiles), must
            include associated_to=team_profile.
          enum:
            - user
            - role
            - group
            - assignment_rule
            - profile
        resource:
          $ref: '#/components/schemas/AutomationAssignOwnerResource'
          description: >-
            Identifies the target user, role, group, assignment rule, or profile
            by ID and/or name. At least one of id or name must be provided; if
            both are given and they do not match, the API returns
            AMBIGUITY_DURING_PROCESSING.
        allow_agent_user:
          type: boolean
          description: >-
            Whether to allow assignment to an agent user or not. When true, the
            record can be assigned to an agent user also. When false, agent
            users are excluded from assignment. Applicable only for types: role,
            group, profile, merge_field, criteria. Not supported for types user
            and assignment_rule.
          default: false
        associated_to:
          type:
            - string
            - 'null'
          description: >-
            Association context for profile-based assignment. Must be
            "team_profile" when type=profile. Not applicable for other
            assignment types; if provided for a non-profile type, the API
            returns DEPENDENT_MISMATCH.
          enum:
            - team_profile
            - null
        details:
          type: 'null'
          description: >-
            Always null for resource-based assignments. Present in GET responses
            for schema consistency with other assign_to types.
      required:
        - type
        - resource
      title: Assign To Resource Entry
    AutomationAssignToMergeFieldEntry:
      x-zs-$id: AutomationAssignToMergeFieldEntry
      type: object
      additionalProperties: false
      description: >-
        PURPOSE: assign_to entry for merge-field-based ownership. Resolves to a
        user at execution time from a user-type field. MANDATORY: type (const
        'merge_field'), details.api_name (merge field token e.g.,
        '${!Leads.Created_By}'). Field must be data_type=ownerlookup or
        userlookup. GET /settings/fields?module={api_name} to discover.
      x-zs-llm-description: >-
        assign_to entry where ownership resolves at runtime from a user-type
        lookup field on the trigger record. type must be 'merge_field'.
        details.api_name specifies the field (e.g., a custom user lookup). The
        field must be a user-type field  non-user fields return INVALID_DATA.
      properties:
        type:
          type: string
          description: Assignment method indicating merge field resolution.
          const: merge_field
        details:
          type: object
          additionalProperties: false
          description: >-
            Contains the merge field reference that resolves to a user at
            execution time.
          properties:
            api_name:
              type: string
              description: >-
                Merge field token referencing a user-type field. Must use the
                format ${!Module.User_Field}
                ,${!Module.Lookup_Field_API_Name.User_Field} where Field is a
                user-type field (data_type=ownerlookup or userlookup) from the
                trigger module. Fetch valid fields from GET
                /settings/fields?module={module_api_name}. Common user-type
                fields: Owner, Created_By, Modified_By. Examples:
                ${!Leads.Created_By}, ${!Deals.Owner},
                ${!Contacts.Account_Manager}.
              maxLength: 255
              example: ${!Leads.Created_By}
          required:
            - api_name
        resource:
          type: 'null'
          description: >-
            Always null for merge field assignments. The owner is resolved
            dynamically from the merge field at execution time.
        allow_agent_user:
          type: boolean
          description: >-
            Whether to allow assignment to an agent user or not. When true, the
            record can be assigned to an agent user also. When false, agent
            users are excluded from assignment. Applicable only for types: role,
            group, profile, merge_field, criteria. Not supported for types user
            and assignment_rule.
          default: false
      required:
        - type
        - details
      title: Assign To Merge Field Entry
    SimpleFilterCriterionValueObjectPredefined:
      x-zs-$id: SimpleFilterCriterionValueObjectPredefined
      description: >-
        Represents a predefined placeholder object filter criterion value for
        lookup fields, applicable with equal or not_equal comparators when the
        field's data_type is ownerlookup or userlookup. Two forms are supported:
        (1) the currently logged-in user, represented by passing only the name
        property with the predefined value ${CURRENTUSER} and no ID property;
        and (2) the logged-in user's role, represented by passing the ID
        property with the predefined value ${CURRENTUSERROLE} and an optional
        display label in the name property. For specific real users or roles
        that are not predefined, use SimpleFilterCriterionValueObjectRequest,
        which requires the ID property.
      oneOf:
        - type: object
          x-zs-$id: SimpleFilterCriterionValueObjectPredefinedCurrentUser
          description: >-
            Represents the predefined object form for the currently logged-in
            user, in which only the name property carries the predefined value
            ${CURRENTUSER} and no ID property is included.
          required:
            - name
          properties:
            name:
              type: string
              enum:
                - ${CURRENTUSER}
              description: >-
                Represents the predefined placeholder for the currently
                logged-in user.

                Possible values:

                ${CURRENTUSER} - Represents the currently logged-in user.
          additionalProperties: false
        - type: object
          x-zs-$id: SimpleFilterCriterionValueObjectPredefinedCurrentUserRole
          description: >-
            Represents the predefined object form for the currently logged-in
            user's role, in which the ID property carries the predefined value
            ${CURRENTUSERROLE} and the name property is an optional display
            label.
          required:
            - id
          properties:
            id:
              type: string
              enum:
                - ${CURRENTUSERROLE}
              description: >-
                Represents the predefined placeholder for the logged-in user's
                role record ID.

                Possible values:

                ${CURRENTUSERROLE} - Represents the role of the currently
                logged-in user.
            name:
              type: string
              maxLength: 255
              description: >-
                Represents an optional display label for the predefined role,
                such as Logged in User Role.
          additionalProperties: true
    SimpleFilterCriterionValueGeneralPredefined:
      type: string
      x-zs-$id: SimpleFilterCriterionValueGeneralPredefined
      description: >-
        Represents a predefined placeholder value applicable to any field
        data_type with the equal comparator.

        Possible values:

        ${EMPTY} - Matches records where the field has no value.

        ${NOTEMPTY} - Matches records where the field has any non-empty value.
      enum:
        - ${EMPTY}
        - ${NOTEMPTY}
      x-enumDescriptions:
        ${EMPTY}: Matches records where the field has no value (null or empty string).
        ${NOTEMPTY}: Matches records where the field has any non-empty value.
    SimpleFilterCriterionValueDateTimePredefined:
      type: string
      x-zs-$id: SimpleFilterCriterionValueDateTimePredefined
      description: >-
        Represents a predefined placeholder value applicable only when the
        field's data_type is date or datetime, with the equal comparator.
      enum:
        - ${TODAY}
        - ${TOMORROW}
        - ${TOMORROWPLUS}
        - ${YESTERDAY}
        - ${YESTERDAYMINUS}
        - ${LASTMONTH}
        - ${THISMONTH}
        - ${NEXTMONTH}
        - ${LASTWEEK}
        - ${THISWEEK}
        - ${NEXTWEEK}
        - ${THISYEAR}
        - ${THISFY}
        - ${THISFQ}
        - ${LASTYEAR}
        - ${PREVFY}
        - ${PREVFQ}
        - ${NEXTYEAR}
        - ${NEXTFY}
        - ${NEXTFQ}
        - ${EMPTY}
        - ${NOTEMPTY}
      x-enumDescriptions:
        ${TODAY}: >-
          Matches records where the date field falls on the current calendar
          day.
        ${TOMORROW}: Matches records where the date field falls on the next calendar day.
        ${TOMORROWPLUS}: >-
          Matches records where the date field is on tomorrow or any later date
          (tomorrow onwards).
        ${YESTERDAY}: >-
          Matches records where the date field falls on the previous calendar
          day.
        ${YESTERDAYMINUS}: >-
          Matches records where the date field is on yesterday or any earlier
          date (up to and including yesterday).
        ${LASTMONTH}: >-
          Matches records where the date field falls within the entire previous
          calendar month.
        ${THISMONTH}: >-
          Matches records where the date field falls within the current calendar
          month.
        ${NEXTMONTH}: >-
          Matches records where the date field falls within the next calendar
          month.
        ${LASTWEEK}: >-
          Matches records where the date field falls within the previous
          calendar week (Monday–Sunday).
        ${THISWEEK}: >-
          Matches records where the date field falls within the current calendar
          week.
        ${NEXTWEEK}: >-
          Matches records where the date field falls within the next calendar
          week.
        ${THISYEAR}: >-
          Matches records where the date field falls within the current calendar
          year.
        ${THISFY}: >-
          Matches records where the date field falls within the current fiscal
          year.
        ${THISFQ}: >-
          Matches records where the date field falls within the current fiscal
          quarter.
        ${LASTYEAR}: >-
          Matches records where the date field falls within the previous
          calendar year.
        ${PREVFY}: >-
          Matches records where the date field falls within the previous fiscal
          year.
        ${PREVFQ}: >-
          Matches records where the date field falls within the previous fiscal
          quarter.
        ${NEXTYEAR}: >-
          Matches records where the date field falls within the next calendar
          year.
        ${NEXTFY}: >-
          Matches records where the date field falls within the next fiscal
          year.
        ${NEXTFQ}: >-
          Matches records where the date field falls within the next fiscal
          quarter.
        ${EMPTY}: Matches records where the date field has no value set.
        ${NOTEMPTY}: Matches records where the date field has a value set.
    SimpleFilterCriterionValueNDaysPredefined:
      maxLength: 255
      type: string
      x-zs-$id: SimpleFilterCriterionValueNDaysPredefined
      description: >-
        Represents a predefined N-period range placeholder value applicable only
        when the field's data_type is date or datetime, with the equal
        comparator. Follows the pattern ${NEXT_N_<PERIOD>:<n>} or
        ${LAST_N_<PERIOD>:<n>}, where PERIOD is DAYS, WEEKS, MONTHS, or YEARS
        and n is a positive integer. The current period is always excluded from
        the range.
      pattern: ^\$\{(LAST_N_|NEXT_N_)(DAYS|WEEKS|MONTHS|YEARS):([0-9]+)\}$
    SimpleFilterCriterionValueAgeDuePredefined:
      maxLength: 255
      type: string
      x-zs-$id: SimpleFilterCriterionValueAgeDuePredefined
      description: >-
        Represents a predefined age or due-in-days placeholder value applicable
        only when the field's data_type is date or datetime. Follows the pattern
        ${AGEINDAYS}+<n> for records where the date field was exactly n days in
        the past, or ${DUEINDAYS}+<n> for records where the date field is
        exactly n days in the future. Supported comparators are equal,
        not_equal, less_than, greater_than, less_equal, and greater_equal.
      pattern: ^\$\{(AGEINDAYS|DUEINDAYS)\}\+[0-9]+$
    EqualFilterCriterionRequest:
      type: object
      x-zs-$id: EqualFilterCriterionRequest
      description: >-
        Represents a filter criterion for the equal comparator. The value type
        is determined by the field's data_type: use
        SimpleFilterCriterionValueString for text, textarea, email, phone,
        website, autonumber, picklist, multiselectpicklist, date, or datetime
        fields; SimpleFilterCriterionValueNumber for integer, currency, or
        double fields; SimpleFilterCriterionValueBoolean for Boolean fields;
        SimpleFilterCriterionValueObjectRequest for lookup, ownerlookup, or
        userlookup fields; and SimpleFilterCriterionValueObjectPredefined for
        predefined user or role object placeholders. Accepts scalar or array
        values. Resolve the data_type from the field's FieldSchema.
      properties:
        field:
          allOf:
            - $ref: '#/components/schemas/FilterFieldBase'
            - type: object
              additionalProperties: true
              description: >-
                Represents the field reference constraint that requires the
                api_name property to be present for the equal filter criterion.
              required:
                - api_name
          unevaluatedProperties: false
          description: >-
            Represents the target field definition to which the equal filter
            criterion is applied, conforming to the base field structure.
        comparator:
          type: string
          enum:
            - equal
          description: >-
            Represents the equal comparison operator applied to the criterion.

            Possible values:

            equal - Matches records where the field value equals the specified
            filter value.
        value:
          anyOf:
            - type: array
              x-zs-$id: EqualFilterCriterionRequestValueArray
              description: Contains an array of filter values for the equal comparator.
              minItems: 1
              maxItems: 500
              items:
                x-zs-$id: EqualFilterCriterionRequestValueArrayItems
                oneOf:
                  - $ref: '#/components/schemas/SimpleFilterCriterionValueString'
                  - $ref: '#/components/schemas/SimpleFilterCriterionValueNumber'
                  - x-zs-$id: EqualFilterCriterionRequestValueArrayItemsObject
                    anyOf:
                      - $ref: >-
                          #/components/schemas/SimpleFilterCriterionValueObjectRequest
                      - $ref: >-
                          #/components/schemas/SimpleFilterCriterionValueObjectPredefined
            - $ref: '#/components/schemas/SimpleFilterCriterionValueString'
            - $ref: '#/components/schemas/SimpleFilterCriterionValueNumber'
            - $ref: '#/components/schemas/SimpleFilterCriterionValueBoolean'
            - $ref: '#/components/schemas/SimpleFilterCriterionValueObjectRequest'
            - $ref: '#/components/schemas/SimpleFilterCriterionValueObjectPredefined'
            - $ref: '#/components/schemas/SimpleFilterCriterionValueGeneralPredefined'
            - $ref: >-
                #/components/schemas/SimpleFilterCriterionValueDateTimePredefined
            - $ref: '#/components/schemas/SimpleFilterCriterionValueNDaysPredefined'
            - $ref: '#/components/schemas/SimpleFilterCriterionValueAgeDuePredefined'
          description: >-
            Represents the filter value used in the equal comparator. Accepts a
            scalar or an array of values, depending on the field's data_type.
        type:
          type: string
          enum:
            - merge_field
            - pre_defined
            - value
            - field
          default: value
          description: >-
            Indicates the value resolution mode of the criterion, distinguishing
            whether the filter value is a literal value, a merge field
            reference, a predefined system variable, or another field reference.

            Possible values:

            value - The value is a direct literal.

            merge_field - The value is a merge field reference.

            pre_defined - The value is a predefined system variable placeholder.

            field - The value references another field.
      required:
        - field
        - comparator
        - value
      additionalProperties: false
    NotEqualFilterCriterionRequest:
      type: object
      x-zs-$id: NotEqualFilterCriterionRequest
      description: >-
        Represents a filter criterion for the not_equal comparator. The value
        type is determined by the field's data_type: use
        SimpleFilterCriterionValueString for text, textarea, email, phone,
        website, autonumber, picklist, multiselectpicklist, date, or datetime
