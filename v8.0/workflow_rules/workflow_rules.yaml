  /settings/automation/workflow_rules/{id}:
    parameters:
      - $ref: '#/components/parameters/ParamQueryIdSchema'
    put:
      operationId: updateWorkflowRuleById
      summary: |
        Update Workflow Rule by ID
      security:
        - OAuth2:
            - ZohoCRM.settings.workflow_rules.UPDATE
      description: >-
        To update an existing workflow rule in your Zoho CRM organization, use
        this operation with the rule's unique ID. You can modify the rule's
        name, description, triggers, criteria, conditions, and actions, or
        activate and deactivate the rule. Use the [Get Workflow Rules
        API](workflow_rules.yaml#$.paths./settings/automation/workflow_rules.get)
        to retrieve available rule IDs. Only include the fields you want to
        change; existing actions not specified in the request are preserved. To
        remove an existing condition or action, set its `_delete` key to null.
        You cannot change the module or trigger module of a workflow rule, and
        the trigger type cannot be changed across categories.
      x-zs-llm-description: >-
        Updates a single workflow rule by path ID. Same behavior as bulk PUT but
        targets one rule via URL. Supports partial updates  omitted fields are
        preserved. To remove an action include it with _delete: null. GET the
        rule first to know current state.
      requestBody:
        description: >
          The request body must contain a workflow_rules array with exactly one
          object representing the updated workflow rule configuration.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWorkflowRuleSchema'
            examples:
              SamplePutRequest:
                summary: Sample request body for updating a workflow rule by ID
                value:
                  workflow_rules:
                    - execute_when:
                        type: create_or_edit
                        details:
                          repeat: true
                          trigger_module:
                            api_name: Contacts
                            id: '3361265000000000129'
                      conditions:
                        - criteria_details:
                            criteria:
                              field:
                                api_name: Department
                                id: '3361265000000000455'
                              comparator: equal
                              value: ${EMPTY}
                          instant_actions:
                            actions:
                              - id: '3361265000006492245'
                                name: 'To users : user2 testUser, testUser1'
                                type: assign_owner
                                details:
                                  module:
                                    api_name: Vendors
                                  assign_to:
                                    - resource:
                                        id: '3361265000002134004'
                                        name: user2 testUser
                                      type: user
                                    - resource:
                                        id: '3361265000002134024'
                                        name: testUser1
                                      type: user
                                  related_records: null
                                  notify: false
                                  apply_assignment_threshold: false
                                  user_availability_based_on: null
                              - id: '3361265000006458562'
                                type: email_notifications
                                name: EmailNotification
                          id: '3361265000006492242'
                          sequence_number: 1
                      id: '3361265000006492241'
                description: >
                  Demonstrates a partial update request for an existing workflow
                  rule identified by its path parameter. The payload includes a
                  workflow_rules array containing the fields to be modified,
                  such as name, description, triggers, criteria, conditions, or
                  actions.
            x-zs-llm-examples:
              - SamplePutRequest
      responses:
        '200':
          description: >
            Returns the result of the workflow rule update, including the unique
            ID of the updated rule.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowSuccessSchema'
              examples:
                SuccessResponse:
                  summary: Success response for updating a workflow rule
                  value:
                    workflow_rules:
                      - code: SUCCESS
                        details:
                          id: '3361265000006294001'
                        message: workflow updated
                        status: success
                  description: >
                    Shows the response returned when a workflow rule is
                    successfully updated. The workflow_rules array contains a
                    SUCCESS code, the ID of the updated rule in the details
                    object, and a status of success.
        '400':
          description: >-
            The request contains invalid or conflicting data.

            **Resolution:** Review the error details in the response body and
            correct the request. Common causes include invalid field values,
            duplicate actions, missing dependent fields, ambiguous criteria, or
            exceeded rule and action limits.
          content:
            application/json:
              schema:
                x-zs-$id: WorkflowRuleUpdateByIdErrorResponses
                oneOf:
                  - $ref: '#/components/schemas/UrlIdMissingSchema'
                  - type: object
                    x-zs-$id: WorkflowRuleUpdateByIdErrorResponse
                    additionalProperties: false
                    description: >
                      Represents the error response returned when the request
                      body fails validation and multiple field-level errors are
                      reported.
                    properties:
                      workflow_rules:
                        type: array
                        description: >
                          Represents the array of workflow rule error objects
                          returned when the request body fails validation.
                        items:
                          oneOf:
                            - $ref: '#/components/schemas/DependentFieldMissingSchema'
                            - $ref: '#/components/schemas/AlreadyUsedSchema'
                            - $ref: '#/components/schemas/ExpectedFieldMissingSchema'
                            - $ref: >-
                                #/components/schemas/AmbiguityDuringProcessingSchema
                            - $ref: '#/components/schemas/LimitExceededSchema'
                            - $ref: '#/components/schemas/CannotRemoveSchema'
                            - $ref: '#/components/schemas/RequiredDataNotFoundSchema'
                            - $ref: '#/components/schemas/FailureSchema'
                        maxItems: 25
                    required:
                      - workflow_rules
              examples:
                UrlPathIdMissing:
                  summary: >-
                    INVALID_DATA error when the URL path workflow rule ID is
                    invalid
                  value:
                    code: INVALID_DATA
                    details:
                      resource_path_index: 3
                    message: the id given seems to be invalid
                    status: error
                  description: >-
                    Returned when the URL path workflow rule ID provided does
                    not correspond to a valid workflow rule ID. The API responds
                    with an INVALID_DATA error and the message 'the id given
                    seems to be invalid'.
                InvalidConditionId:
                  summary: >-
                    INVALID_DATA error when the provided condition ID is not
                    valid
                  value:
                    workflow_rules:
                      - code: INVALID_DATA
                        details:
                          api_name: id
                          json_path: $.workflow_rules[0].conditions[0].id
                        message: This given conditionid seems to be invalid
                        status: error
                  description: >
                    Returned when the condition ID supplied in the request body
                    does not correspond to a valid, existing condition. The API
                    responds with an INVALID_DATA error and the message "This
                    given conditionid seems to be invalid".
                DependentFieldMissingResponse1:
                  summary: Error response when a required dependent field is missing
                  value:
                    workflow_rules:
                      - code: DEPENDENT_FIELD_MISSING
                        details:
                          dependee:
                            api_name: type
                            json_path: >-
                              $.workflow_rules[0].conditions[0].instant_actions.actions[1].type
                          api_name: id
                          json_path: >-
                            $.workflow_rules[0].conditions[0].instant_actions.actions[1].id
                        message: Dependent Field missing
                        status: error
                  description: >
                    Shows the 400 error response returned when a required
                    dependent field is absent from the update request. The
                    DEPENDENT_FIELD_MISSING code identifies the missing field as
                    details, which must be supplied for the update to succeed.
                DuplicateActionNotAllowedResponse:
                  summary: INVALID_DATA error when a duplicate action type is detected
                  value:
                    workflow_rules:
                      - code: DUPLICATE_DATA
                        details:
                          api_name: actions
                          json_path: >-
                            $.workflow_rules[0].conditions[0].instant_actions.actions[0]
                        message: Duplicate action not allowed
                        status: error
                  description: >
                    Returned when the same action type appears more than once
                    within a single condition in the workflow rule update
                    request. The API rejects the payload with an INVALID_DATA
                    error and the message "Duplicate action not allowed".
                AlreadyUsedResponse:
                  summary: >-
                    Error response when a condition is already used in the
                    workflow
                  value:
                    workflow_rules:
                      - code: ALREADY_USED
                        details:
                          api_name: criteria_details
                          exists_in:
                            api_name: criteria_details
                            json_path: $.workflow_rules[0].conditions[0].criteria_details
                          json_path: $.workflow_rules[0].conditions[1].criteria_details
                        message: duplicate criteria details.
                        status: error
                  description: >
                    Shows the 400 error response returned when a condition is
                    already in use within the specified workflow rule. The
                    response carries the ALREADY_USED code, indicating the
                    update cannot proceed without resolving the conflict.
        '403':
          description: >-
            Permission denied for the requested resource.

            **Resolution:** The authenticated user does not have permission to
            perform this action. Only users with the Manage Workflow permission
            in their CRM profile can update workflow rules.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoPermissionSchema'
              examples:
                NoPermissionResponse:
                  summary: >-
                    NO_PERMISSION error when user lacks the Manage Workflow
                    permission
                  value:
                    code: NO_PERMISSION
                    details:
                      permissions:
                        - Crm_Implied_Manage_Workflow
                    message: feature not available in this edition
                    status: error
                  description: >
                    Returned when the authenticated user's CRM profile lacks the
                    Manage Workflow permission required to update a workflow
                    rule. The API responds with a 403 status and the
                    NO_PERMISSION error code.
