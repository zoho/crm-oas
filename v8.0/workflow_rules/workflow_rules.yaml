    ReorderWorkflowRulesRequestSchema:
      type: object
      additionalProperties: false
      description: >-
        Represents the request body for reordering workflow rules, containing
        the new position assignments for each rule.
      x-zs-llm-description: >-
        Request body for reorderWorkflowRules. Contains reorder array with rule
        IDs in the desired execution sequence. All active rules for the target
        module must be included.
      properties:
        reorder:
          type: object
          additionalProperties: false
          description: >-
            Represents the reorder payload containing the list of workflow rules
            and their updated execution order.
          properties:
            workflow_rules:
              type: array
              description: >-
                Represents the array of workflow rule objects for which you want
                to update the execution order.
              items:
                type: object
                additionalProperties: false
                description: >-
                  Represents a single workflow rule entry in the reorder
                  request, specifying the rule ID and its new module-specific
                  sequence number.
                properties:
                  module_specific_sequence:
                    type: integer
                    format: int32
                    description: >-
                      Specify the new execution order for this workflow rule
                      within the module. The index must start from one.
                  id:
                    type: string
                    description: >-
                      Specify the ID of the workflow rule for which you want to
                      update the execution order.
                    maxLength: 20
                required:
                  - id
                  - module_specific_sequence
              maxItems: 10
      required:
        - reorder
      title: Reorder Workflow Rules Request V2
    InfoNestedSchema:
      type: object
      additionalProperties: false
      description: >-
        Represents the pagination metadata included in list response payloads,
        including the current page, records per page, total count, and whether
        more records exist.
      x-zs-llm-description: >-
        Pagination metadata in list responses. Contains per_page (items per
        page), count (items in current page), page (current page number),
        more_records (boolean  -  whether additional pages exist). Use
        more_records to determine if next page should be fetched.
      properties:
        per_page:
          type: integer
          format: int32
          description: Represents the number of records returned per page.
        count:
          type: integer
          format: int32
          description: Represents the total number of records matching the query.
        page:
          type: integer
          format: int32
          description: Represents the current page number in the paginated response.
        more_records:
          type: boolean
          description: Indicates whether more records exist beyond the current page.
      required:
        - count
        - more_records
        - page
        - per_page
    AssignOwnerActionSchema:
      type: object
      x-zs-$id: AssignOwnerActionSchema
      additionalProperties: false
      description: >-
        Represents a non-associate action that assigns or reassigns the record
        owner when the workflow rule condition is triggered.
      x-zs-llm-description: >-
        Inline action type='assign_owner'. Requires module and assign_to array
        (1-5 entries). assign_to discriminates on type:
        user/role/group/profile/assignment_rule need resource.id; merge_field
        needs details.api_name (user-type field); criteria needs criteria array.
        Optional: notify (trigger notification), related_records (transfer child
        record ownership), apply_assignment_threshold.
      properties:
        name:
          type: string
          description: >-
            Represents the display name of the AssignOwner action as it appears
            within the workflow rule configuration.
          maxLength: 100
        type:
          type: string
          description: >-
            Represents the action type discriminator that identifies this as a
            AssignOwner action within the workflow rule. The value is fixed for
            this action type and must be supported by the target module and
            trigger event.
          const: assign_owner
        details:
          description: >-
            Configuration for the assign_owner action. Requires a module
            reference and an assign_to array with one to five entries, each
            specifying who to assign the record to — a user, role, group,
            assignment rule, or profile, a merge field, or matching criteria.
            Optionally sends a notification, includes related records, applies
            an assignment threshold, or bases assignment on user availability.
          $ref: '#/components/schemas/AutomationAssignOwnerDetails'
        related_details:
          description: >-
            Optional. For assign_owner, related_details is not typically used.
            Applicable sub-fields: best_time (for email_notifications only),
            followup_details (for tasks only), lookup_field (for field_updates
            only).
          $ref: '#/components/schemas/RelatedDetailsNestedSchema'
        id:
          type: string
          description: >-
            Represents the unique ID of the AssignOwner action within the
            workflow rule.
          maxLength: 20
        _delete:
          type: 'null'
          description: >-
            Indicates that this action should be removed from the workflow rule
            when set in a PUT request. Provide a null value to signal deletion.
      required:
        - type
        - details
    CreateRecordActionSchema:
      type: object
      x-zs-$id: CreateRecordActionSchema
      additionalProperties: false
      description: >-
        Represents a non-associate action that creates a new record in a
        specified CRM module when the workflow rule condition is triggered.
      x-zs-llm-description: >-
        Inline action type='create_record'. Creates a record in a specified
        module (NOT Tasks/Events/Calls  -  use tasks/add_meeting/schedule_call).
        Requires module, layout, and field_mappings (1-25 entries, must include
        all mandatory fields). Each mapping: {field, type, value} with type
        discriminating: static (literal), merge_field (${!Module.Field} token),
        execution_time (date offset), composite (multi-value).
      properties:
        name:
          type: string
          description: >-
            Represents the display name of the CreateRecord action as it appears
            within the workflow rule configuration.
          maxLength: 100
        type:
          type: string
          description: >-
            Represents the action type discriminator that identifies this as a
            CreateRecord action within the workflow rule. The value is fixed for
            this action type and must be supported by the target module and
            trigger event.
          const: create_record
        details:
          description: >
            Configuration for the create_record action. Requires a module, a
            layout, and one to twenty-five field mappings that supply values for
            the new record fields, using a static value, a merge field, an
            execution-time offset, or a composite value. All fields marked
            mandatory by the layout must be included. Optionally restricts
            creation to prevent duplicate records.
          $ref: '#/components/schemas/AutomationCreateRecordDetails'
        related_details:
          description: >-
            Optional. For create_record, related_details is not typically used.
            Applicable sub-fields: best_time (for email_notifications only),
            followup_details (for tasks only), lookup_field (for field_updates
            only).
          $ref: '#/components/schemas/RelatedDetailsNestedSchema'
        id:
          type: string
          description: >-
            Represents the unique ID of the CreateRecord action within the
            workflow rule.
          maxLength: 20
        _delete:
          type: 'null'
          description: >-
            Indicates that this action should be removed from the workflow rule
            when set in a PUT request. Provide a null value to signal deletion.
      required:
        - type
        - details
    AddMeetingActionSchema:
      type: object
      x-zs-$id: AddMeetingActionSchema
      additionalProperties: false
      description: >-
        Represents a non-associate action that schedules a meeting when the
        workflow rule condition is triggered.
      x-zs-llm-description: >-
        Inline action type='add_meeting'. Creates an Event record. Requires
        module (Events), layout, field_mappings (must include Event_Title,
        Start_DateTime), meeting_duration ({value, period}  -  not when
        All_Day=true), and host_unavailable (either
        assign_record_owner_as_host:true or assign_task:{id}). Optional:
        apply_restriction.
      properties:
        name:
          type: string
          description: >-
            Represents the display name of the add-meeting action as it appears
            within the workflow rule configuration.
          maxLength: 100
        type:
          type: string
          description: >-
            Represents the action type discriminator that identifies this action
            as an add-meeting action within the workflow rule. The value is
            fixed for this action type and must correspond to a type supported
            by the target module and trigger event.
          const: add_meeting
        details:
          description: >
            Configuration for the add_meeting action. Requires the Events
            module, a layout, and field mappings that include the event title
            and start date and time. Also requires the meeting duration, unless
            the event is set to all day, and specifies whether the record owner
            or another assigned user hosts the meeting. Optionally restricts
            creation to prevent duplicate records.
          $ref: '#/components/schemas/AutomationAddMeetingDetails'
        related_details:
          description: >-
            Optional. For add_meeting, related_details is not typically used.
            Applicable sub-fields: best_time (for email_notifications only),
            followup_details (for tasks only), lookup_field (for field_updates
            only).
          $ref: '#/components/schemas/RelatedDetailsNestedSchema'
        id:
          type: string
          description: >-
            Represents the unique ID of the add-meeting action within the
            workflow rule.
          maxLength: 20
        _delete:
          type: 'null'
          description: >-
            Indicates that this add-meeting action should be removed from the
            workflow rule when set in a PUT request. When this field is provided
            with a null value, the platform interprets it as a deletion signal
            and removes the action from the rules action list.
      required:
        - type
        - details
    ScheduleCallActionSchema:
      type: object
      x-zs-$id: ScheduleCallActionSchema
      additionalProperties: false
      description: >-
        Represents a non-associate action that schedules a call activity on the
        triggering record when the workflow rule condition is met.
      x-zs-llm-description: >-
        Inline action type='schedule_call'. Creates a Calls record. Requires
        module (Calls), layout, and field_mappings (must include Subject). Key
        fields: Subject, Call_Purpose, Call_Type, Call_Start_Time, Remind_At.
        Optional: apply_restriction.
      properties:
        name:
          type: string
          description: >-
            Represents the display name of the ScheduleCall action as it appears
            within the workflow rule configuration.
          maxLength: 100
        type:
          type: string
          description: >-
            Represents the action type discriminator that identifies this as a
            ScheduleCall action within the workflow rule. The value is fixed for
            this action type and must be supported by the target module and
            trigger event.
          const: schedule_call
        details:
          description: >
            Configuration for the schedule_call action. Requires the Calls
            module, a layout, and field mappings that include the call subject.
            Optionally restricts creation to prevent duplicate records.
          $ref: '#/components/schemas/AutomationScheduleCallDetails'
        related_details:
          description: >-
            Optional. For schedule_call, related_details is not typically used.
            Applicable sub-fields: best_time (for email_notifications only),
            followup_details (for tasks only), lookup_field (for field_updates
            only).
          $ref: '#/components/schemas/RelatedDetailsNestedSchema'
        id:
          type: string
          description: >-
            Represents the unique ID of the ScheduleCall action within the
            workflow rule.
          maxLength: 20
        _delete:
          type: 'null'
          description: >-
            Indicates that this action should be removed from the workflow rule
            when set in a PUT request. Provide a null value to signal deletion.
      required:
        - type
        - details
    AddTagsActionSchema:
      type: object
      x-zs-$id: AddTagsActionSchema
      additionalProperties: false
      description: >-
        Represents a non-associate action that adds pre-existing tags to the
        triggering record when the workflow rule condition is met.
      x-zs-llm-description: >-
        Inline action type='add_tags'. Adds pre-existing tags to the triggering
        record. Requires details.tags array (1-10 entries, each {id, name}).
        Optional: over_write (bool  -  true replaces all existing tags). Cannot
        coexist with convert action on Leads. Tags must be pre-created via
        getTags/POST.
      properties:
        name:
          type: string
          description: >-
            Represents the display name of the add-tags action as it appears
            within the workflow rule configuration.
          maxLength: 100
        type:
          type: string
          description: >-
            Represents the action type discriminator that identifies this action
            as an add-tags action within the workflow rule. The value is fixed
            for this action type and must correspond to a type supported by the
            target module and trigger event.
          const: add_tags
        details:
          description: ''
          $ref: '#/components/schemas/AutomationAddTagsDetails'
        related_details:
          description: >-
            Optional. For add_tags, related_details is not typically used.
            Applicable sub-fields: best_time (for email_notifications only),
            followup_details (for tasks only), lookup_field (for field_updates
            only).
          $ref: '#/components/schemas/RelatedDetailsNestedSchema'
        id:
          type: string
          description: >-
            Represents the unique ID of the add-tags action within the workflow
            rule.
          maxLength: 20
        _delete:
          type: 'null'
          description: >-
            Indicates that this add-tags action should be removed from the
            workflow rule when set in a PUT request. When this field is provided
            with a null value, the platform interprets it as a deletion signal
            and removes the action from the rules action list.
      required:
        - type
        - details
    RemoveTagsActionSchema:
      type: object
      x-zs-$id: RemoveTagsActionSchema
      additionalProperties: false
      description: >-
        Represents a non-associate action that removes one or more tags from the
        triggering record when the workflow rule condition is met.
      x-zs-llm-description: >-
        Inline action type='remove_tags'. Removes specified tags from the
        triggering record. Requires details.tags (1-10 entries, each {id,
        name}). Cannot coexist with convert on Leads. Invalid if same rule has
        add_tags with over_write=true. Tags must already exist on the record.
      properties:
        name:
          type: string
          description: >-
            Represents the display name of the RemoveTags action as it appears
            within the workflow rule configuration.
          maxLength: 100
        type:
          type: string
          description: >-
            Represents the action type discriminator that identifies this as a
            RemoveTags action within the workflow rule. The value is fixed for
            this action type and must be supported by the target module and
            trigger event.
          const: remove_tags
        details:
          description: >
            Configuration for remove_tags actions. The tags array is required
            and must contain between 1 and 10 entries, each specifying both the
            tag identifier and name. Tags must already exist in the system
            before they can be removed. The module reference is optional but
            when provided, its API name and identifier must match the trigger
            module. The over_write field is accepted for type compatibility but
            its value is ignored for remove_tags operations.


            This action is invalid when the same rule contains an add_tags
            action with over_write set to true. It cannot be used alongside a
            convert action on Leads modules, as this combination triggers an
            AMBIGUITY_DURING_PROCESSING error. The remove_tags action is not
            supported for Visits, Users, or LinkingModules.


            Example configuration: {"tags": [{"id": "111111000000050001",
            "name": "Hot Lead"}], "module": {"api_name": "Leads", "id":
            "111111000000000175"}}
          $ref: '#/components/schemas/AutomationRemoveTagsDetails'
        related_details:
          description: >-
            Optional. For remove_tags, related_details is not typically used.
            Applicable sub-fields: best_time (for email_notifications only),
            followup_details (for tasks only), lookup_field (for field_updates
            only).
          $ref: '#/components/schemas/RelatedDetailsNestedSchema'
        id:
          type: string
          description: >-
            Represents the unique ID of the RemoveTags action within the
            workflow rule.
          maxLength: 20
        _delete:
          type: 'null'
          description: >-
            Indicates that this action should be removed from the workflow rule
            when set in a PUT request. Provide a null value to signal deletion.
      required:
        - type
        - details
    ConvertActionSchema:
      type: object
      x-zs-$id: ConvertActionSchema
      additionalProperties: false
      description: >-
        Represents a non-associate action that converts a record to another
        module type, such as converting a lead to a contact, account, and deal.
      x-zs-llm-description: >-
        Inline action type='convert'. Converts records across modules:
        Leads->Contacts+Accounts+Deals, Quotes->SalesOrders/Invoices,
        SalesOrders->Invoices. Limit 1 per rule. Requires
        criteria_details.criteria to be non-null. For Leads:
        add_to_existing_contact, add_to_existing_account, change_owner are
        mandatory. For Quotes/SalesOrders: convert_to is mandatory. No scheduled
        actions allowed with convert.
      properties:
        name:
          type: string
          description: >-
            Represents the display name of the Convert action as it appears
            within the workflow rule configuration.
          maxLength: 100
        type:
          type: string
          description: >-
            Represents the action type discriminator that identifies this as a
            Convert action within the workflow rule. The value is fixed for this
            action type and must be supported by the target module and trigger
            event.
          const: convert
        details:
          description: >-
            Configuration for converting records. This action is only available
            when the trigger module is Leads, Quotes, or Sales_Orders. The
            convert action requires non-null criteria in the condition; null
            criteria will result in a dependent field missing error. For Leads
            conversion, the following fields are mandatory:
            add_to_existing_contact, add_to_existing_account, apply_restriction,
            and change_owner which is an object containing the
            apply_assignment_threshold flag. Key optional fields include
            create_deal for creating a deal, carry_tags which is an array of
            module references and not a boolean, field_mappings with a maximum
            of 25 entries, move_attachment_to for specifying a target module,
            contact_role which is applicable only when create_deal is true, and
            convert_to which is used for Quotes and SalesOrders conversions.
            Example configuration for a Leads conversion without creating a
            deal.
          $ref: '#/components/schemas/AutomationConvertDetails'
        related_details:
          description: >-
            Optional. For convert, related_details is not typically used.
            Applicable sub-fields: best_time (for email_notifications only),
            followup_details (for tasks only), lookup_field (for field_updates
            only).
          $ref: '#/components/schemas/RelatedDetailsNestedSchema'
        id:
          type: string
          description: >-
            Represents the unique ID of the Convert action within the workflow
            rule.
          maxLength: 20
        _delete:
          type: 'null'
          description: >-
            Indicates that this action should be removed from the workflow rule
            when set in a PUT request. Provide a null value to signal deletion.
      required:
        - type
        - details
    CreateConnectedRecordActionSchema:
