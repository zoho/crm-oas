          type: integer
          format: int32
          description: Represents number of emails that bounced back.
        clicked:
          type: integer
          format: int32
          description: Represents number of emails where recipients clicked a link.
        sent:
          type: integer
          format: int32
          description: Represents total number of emails sent.
      required:
        - bounced
        - bulk_mail
        - clicked
        - delivered
        - opened
        - sent
        - sent_percentage
        - unopened
        - unsent
      title: Email Engagement Metrics
    ActionUsageMetricsSchema:
      type: object
      x-zs-$id: ActionUsageMetricsSchema
      additionalProperties: false
      description: >-
        Represents usage metrics for a single workflow action, including its
        identifier, display name, action type, execution success and failure
        counts within a queried date range, and the timestamp of its last
        association.
      x-zs-llm-description: >-
        Basic action usage entry without queue or email details. Contains name,
        type, id, success_count, failure_count, and associated_time.
      properties:
        name:
          type: string
          description: >-
            Represents the display name of the workflow rule or its associated
            action as configured in Zoho CRM.
          maxLength: 255
        success_count:
          type: integer
          format: int32
          description: >-
            Represents the total number of successful executions recorded for
            this action within the queried date range.
        failure_count:
          type: integer
          format: int32
          description: >-
            Represents the total number of failed executions recorded for this
            action within the queried date range.
        id:
          type: string
          description: Represents the unique ID of the workflow action.
          maxLength: 20
        type:
          type: string
          description: Represents the category of workflow action executed by the rule.
          maxLength: 255
        associated_time:
          type: string
          description: >-
            Represents the ISO 8601 timestamp indicating when this action was
            last associated with or modified on a workflow rule.
          maxLength: 255
      required:
        - associated_time
        - failure_count
        - id
        - name
        - success_count
        - type
      title: Action Usage Metrics
    ReorderWorkflowRulesRequestSchema:
      type: object
      additionalProperties: false
      description: >-
        Represents the request body for reordering workflow rules, containing
        the new position assignments for each rule.
      x-zs-llm-description: >-
        PURPOSE: Request body for reorderWorkflowRules - sets the execution
        order of workflow rules within one module. MANDATORY: reorder is an
        OBJECT (not an array) holding a single workflow_rules array. Each entry
        MUST carry both id (the workflow rule ID) and module_specific_sequence
        (integer, starting from 1). KEY CONSTRAINTS: Order is determined by
        module_specific_sequence, NOT by array position. A partial list is
        accepted - you do not need to send every rule of the module - and the
        sequence numbers you send need not be contiguous. The module query
        parameter is required on the request. EXAMPLE: {"reorder":
        {"workflow_rules": [{"id": "1719020000004143025",
        "module_specific_sequence": 3}, {"id": "1719020000002957011",
        "module_specific_sequence": 4}, {"id": "1719020000002957027",
        "module_specific_sequence": 7}]}}
      properties:
        reorder:
          type: object
          additionalProperties: false
          description: >-
            Represents the reorder payload containing the list of workflow rules
            and their updated execution order.
          properties:
            workflow_rules:
              type: array
              description: >-
                Represents the array of workflow rule objects for which you want
                to update the execution order.
              x-zs-llm-description: >-
                An array containing the list of Workflow rules whose execution
                order you want to update. Each object in this array specifies
                the Workflow rule ID and its new position in the execution order
                for the given module. (Required)
              items:
                type: object
                additionalProperties: false
                description: >-
                  Represents a single workflow rule entry in the reorder
                  request, specifying the rule ID and its new module-specific
                  sequence number.
                properties:
                  module_specific_sequence:
                    type: integer
                    format: int32
                    description: >-
                      Specify the new execution order for this workflow rule
                      within the module. The index must start from one.
                    x-zs-llm-description: >-
                      Specify the new execution order for this Workflow rule
                      within the module. The index starts from 1. (Required)
                  id:
                    type: string
                    description: >-
                      Specify the ID of the workflow rule for which you want to
                      update the execution order.
                    maxLength: 20
                required:
                  - id
                  - module_specific_sequence
              maxItems: 10
      required:
        - reorder
      title: Reorder Workflow Rules Request V2
    InfoNestedSchema:
      type: object
      additionalProperties: false
      description: >-
        Represents the pagination metadata included in list response payloads,
        including the current page, records per page, total count, and whether
        more records exist.
      x-zs-llm-description: >-
        Pagination metadata in list responses. Contains per_page (items per
        page), count (items in current page), page (current page number),
        more_records (boolean - whether additional pages exist). Use
        more_records to determine if next page should be fetched.
      properties:
        per_page:
          type: integer
          format: int32
          description: Represents the number of records returned per page.
        count:
          type: integer
          format: int32
          description: Represents the total number of records matching the query.
        page:
          type: integer
          format: int32
          description: Represents the current page number in the paginated response.
        more_records:
          type: boolean
          description: Indicates whether more records exist beyond the current page.
      required:
        - count
        - more_records
        - page
        - per_page
    AssignOwnerActionSchema:
      type: object
      x-zs-$id: AssignOwnerActionSchema
      additionalProperties: false
      description: >-
        Represents a non-associate action that assigns or reassigns the record
        owner when the workflow rule condition is triggered.
      x-zs-llm-description: >-
        PURPOSE: Assigns/reassigns record owner. Supports user, role, group,
        profile, assignment_rule, merge_field, or criteria. PREREQUISITES:
        `getModules` for module id. `getUsers`/`getRoles`/`getUserGroups` for
        resource IDs. MANDATORY in details: module ({api_name, id}), assign_to
        (array 1-5). Each assign_to: {type, resource: {id, name}}. Types:
        user|role|group|assignment_rule|profile. merge_field: {type:
        'merge_field', details: {api_name}}. criteria: {type: 'criteria',
        criteria: [...]}. OPTIONAL: notify (bool), related_records ([{api_name,
        id}]), apply_assignment_threshold (bool). EXAMPLE: {"type":
        "assign_owner", "details": {"module": {"api_name": "Leads", "id":
        "111111000000000175"}, "assign_to": [{"type": "user", "resource": {"id":
        "111111000000050001", "name": "John"}}], "notify": true}}
      properties:
        name:
          type: string
          description: >-
            Represents the display name of the AssignOwner action as it appears
            within the workflow rule configuration.
          maxLength: 100
        type:
          type: string
          description: >-
            Represents the action type discriminator that identifies this as a
            AssignOwner action within the workflow rule. The value is fixed for
            this action type and must be supported by the target module and
            trigger event.
          x-zs-llm-description: >-
            Action type discriminator. Required. Must be supported for the
            module and trigger -- verify via `getWorkflowConfigurations`.
          const: assign_owner
        details:
          description: >-
            Configuration for the assign_owner action. Requires a module
            reference and an assign_to array with one to five entries, each
            specifying who to assign the record to — a user, role, group,
            assignment rule, or profile, a merge field, or matching criteria.
            Optionally sends a notification, includes related records, applies
            an assignment threshold, or bases assignment on user availability.
          x-zs-llm-description: >-
            Configuration for assign_owner. REQUIRED: module (api_name + id via
            `getModules`), assign_to (array, 1-5 entries). assign_to types:
            user/role/group/assignment_rule/profile (with resource: {id, name}),
            merge_field (with details: {api_name}), criteria (with criteria
            array). Optional: notify, related_records,
            apply_assignment_threshold, user_availability_based_on,
            lookup_field. Example: {"module": {"api_name": "Leads", "id":
            "..."}, "assign_to": [{"type": "user", "resource": {"id": "...",
            "name": "John"}}], "notify": true}
          $ref: '#/components/schemas/AutomationAssignOwnerDetails'
        related_details:
          description: >-
            Optional. For assign_owner, related_details is not typically used.
            Applicable sub-fields: best_time (for email_notifications only),
            followup_details (for tasks only), lookup_field (for field_updates
            only).
          $ref: '#/components/schemas/RelatedDetailsNestedSchema'
        id:
          type: string
          description: >-
            Represents the unique ID of the AssignOwner action within the
            workflow rule.
          maxLength: 20
        _delete:
          type: 'null'
          description: >-
            Indicates that this action should be removed from the workflow rule
            when set in a PUT request. Provide a null value to signal deletion.
      required:
        - type
        - details
    CreateRecordActionSchema:
      type: object
      x-zs-$id: CreateRecordActionSchema
      additionalProperties: false
      description: >-
        Represents a non-associate action that creates a new record in a
        specified CRM module when the workflow rule condition is triggered.
      x-zs-llm-description: >-
        PURPOSE: Creates a record in a module when workflow fires. NOT for
        Tasks/Events/Calls (use tasks, add_meeting, schedule_call).
        PREREQUISITES: `getModules` for id. `getLayouts` for layout + mandatory
        fields. `getFields` for field ids. MANDATORY in details: module
        ({api_name, id}), layout ({id}), field_mappings (array 1-25, include all
        mandatory fields). Each: {field: {api_name, id}, type, value}. Types:
        static (literal), merge_field ("${!Module.Field}"), execution_time
        ({unit, period, sign, trigger_field}), composite. OPTIONAL:
        apply_restriction (bool). EXAMPLE: {"type": "create_record", "details":
        {"module": {"api_name": "Contacts", "id": "111111000000000129"},
        "layout": {"id": "111111000000000403"}, "field_mappings": [{"field":
        {"api_name": "Last_Name"}, "type": "merge_field", "value":
        "${!Leads.Last_Name}"}]}}
      properties:
        name:
          type: string
          description: >-
            Represents the display name of the CreateRecord action as it appears
            within the workflow rule configuration.
          maxLength: 100
        type:
          type: string
          description: >-
            Represents the action type discriminator that identifies this as a
            CreateRecord action within the workflow rule. The value is fixed for
            this action type and must be supported by the target module and
            trigger event.
          x-zs-llm-description: >-
            Action type discriminator. Required. Must be supported for the
            module and trigger -- verify via `getWorkflowConfigurations`.
          const: create_record
        details:
          description: >
            Configuration for the create_record action. Requires a module, a
            layout, and one to twenty-five field mappings that supply values for
            the new record fields, using a static value, a merge field, an
            execution-time offset, or a composite value. All fields marked
            mandatory by the layout must be included. Optionally restricts
            creation to prevent duplicate records.
          x-zs-llm-description: >-
            Configuration for create_record. REQUIRED: module (api_name + id via
            `getModules`), layout (id via `getLayouts`), field_mappings (array,
            1-25 entries). Use `getFields` to discover field api_name and id.
            field_mappings types: static, merge_field ("${!Module.Field}"),
            execution_time ({unit, period}), composite. All mandatory fields
            must be included (use `getLayouts` to check required fields).
            Optional: apply_restriction. Example: {"module": {"api_name":
            "Contacts", "id": "..."}, "layout": {"id": "..."}, "field_mappings":
            [{"field": {"api_name": "Last_Name", "id": "..."}, "type":
            "merge_field", "value": "${!Leads.Last_Name}"}]}
          $ref: '#/components/schemas/AutomationCreateRecordDetails'
        related_details:
          description: >-
            Optional. For create_record, related_details is not typically used.
            Applicable sub-fields: best_time (for email_notifications only),
            followup_details (for tasks only), lookup_field (for field_updates
            only).
          $ref: '#/components/schemas/RelatedDetailsNestedSchema'
        id:
          type: string
          description: >-
            Represents the unique ID of the CreateRecord action within the
            workflow rule.
          maxLength: 20
        _delete:
          type: 'null'
          description: >-
            Indicates that this action should be removed from the workflow rule
            when set in a PUT request. Provide a null value to signal deletion.
      required:
        - type
        - details
    AddMeetingActionSchema:
      type: object
      x-zs-$id: AddMeetingActionSchema
      additionalProperties: false
      description: >-
        Represents a non-associate action that schedules a meeting when the
        workflow rule condition is triggered.
      x-zs-llm-description: >-
        PURPOSE: Schedules a meeting (Event) when workflow fires. PREREQUISITES:
        `getModules` for Events id. `getLayouts` for layout + mandatory fields.
        `getFields` for field ids. MANDATORY in details: module ({api_name:
        'Events', id}), layout ({id}), field_mappings (array 1-25, include
        Event_Title, Start_DateTime), meeting_duration ({value: int, period:
        'hours'|'minutes'|'days'} - NOT when All_Day=true), host_unavailable
        (one of: {assign_record_owner_as_host: true} or {assign_task: {id}}).
        OPTIONAL: apply_restriction (bool). EXAMPLE: {"type": "add_meeting",
        "details": {"module": {"api_name": "Events", "id":
        "111111000000000189"}, "layout": {"id": "111111000000000195"},
        "field_mappings": [{"field": {"api_name": "Event_Title"}, "type":
        "static", "value": "Follow-up"}], "meeting_duration": {"value": 1,
        "period": "hours"}, "host_unavailable": {"assign_record_owner_as_host":
        true}}}
      properties:
        name:
          type: string
          description: >-
            Represents the display name of the add-meeting action as it appears
            within the workflow rule configuration.
          maxLength: 100
        type:
          type: string
          description: >-
            Represents the action type discriminator that identifies this action
            as an add-meeting action within the workflow rule. The value is
            fixed for this action type and must correspond to a type supported
            by the target module and trigger event.
          x-zs-llm-description: >-
            Action type discriminator. Required. Must be supported for the
            module and trigger -- verify via `getWorkflowConfigurations`.
          const: add_meeting
        details:
          description: >
            Configuration for the add_meeting action. Requires the Events
            module, a layout, and field mappings that include the event title
            and start date and time. Also requires the meeting duration, unless
            the event is set to all day, and specifies whether the record owner
            or another assigned user hosts the meeting. Optionally restricts
            creation to prevent duplicate records.
          x-zs-llm-description: >-
            Use module api_name Events with its id, a layout id, and 1-25
            field_mappings. Useful Event fields include Event_Title,
            Start_DateTime, End_DateTime, All_Day, Participants (type
            composite), Description, Remind_At, and Location. Set
            meeting_duration with value and period (hours, minutes, or days),
            but omit it when All_Day is true. In host_unavailable, provide
            exactly one of assign_record_owner_as_host=true or assign_task with
            a task id. apply_restriction is optional.
          $ref: '#/components/schemas/AutomationAddMeetingDetails'
        related_details:
          description: >-
            Optional. For add_meeting, related_details is not typically used.
            Applicable sub-fields: best_time (for email_notifications only),
            followup_details (for tasks only), lookup_field (for field_updates
            only).
          $ref: '#/components/schemas/RelatedDetailsNestedSchema'
        id:
          type: string
          description: >-
            Represents the unique ID of the add-meeting action within the
            workflow rule.
          maxLength: 20
        _delete:
          type: 'null'
          description: >-
            Indicates that this add-meeting action should be removed from the
            workflow rule when set in a PUT request. When this field is provided
            with a null value, the platform interprets it as a deletion signal
            and removes the action from the rules action list.
      required:
        - type
        - details
    ScheduleCallActionSchema:
      type: object
      x-zs-$id: ScheduleCallActionSchema
      additionalProperties: false
      description: >-
        Represents a non-associate action that schedules a call activity on the
        triggering record when the workflow rule condition is met.
      x-zs-llm-description: >-
        PURPOSE: Schedules a call (Calls record) when workflow fires.
        PREREQUISITES: `getModules` for Calls id. `getLayouts` for layout +
