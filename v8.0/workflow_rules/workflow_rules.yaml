            characters. Special characters are not allowed.
          maxLength: 100
        description:
          type:
            - string
            - 'null'
          description: >-
            Specify an optional description for the workflow rule. Set to null
            to clear an existing description.
          maxLength: 1000
        module:
          $ref: '#/components/schemas/ModuleOrFieldNestedSchema'
          description: >-
            The module to which the workflow rule applies. Use the [Get Modules
            API](modules.yaml#$.paths./settings/modules.get) to retrieve module
            IDs. Required. Must be a workflow-supported module. If both id and
            api_name are provided, they must match. Use
            `getWorkflowConfigurations` to discover supported modules. Cannot be
            changed after creation.
        execute_when:
          $ref: '#/components/schemas/ExecuteWhenNestedSchema'
          description: >-
            Specifies when the workflow rule is triggered. This is a required
            JSON object with "type" and "details" properties. For example:
            {"type": "create_or_edit", "details": {"trigger_module":
            {"api_name": "Leads", "id": "..."}, "repeat": false}}. Passing a
            string instead of a JSON object, such as "create_or_edit", returns
            an "INVALID_DATA" error. The "details.trigger_module" must match the
            module associated with the workflow rule. Use
            "getWorkflowConfigurations" to retrieve the available triggers and
            their supported actions.
        conditions:
          type: array
          description: >-
            Specify the conditions that define the branching logic of the
            workflow rule. Each condition evaluates records against criteria and
            executes its own set of actions. At least one condition is required.
          items:
            $ref: '#/components/schemas/ConditionsNestedSchema'
          maxItems: 10
        lock:
          type: object
          description: >-
            Specify the lock configuration to prevent other users from editing
            the rule. Only administrators can lock or unlock rules.
          additionalProperties: false
          properties:
            message:
              type: string
              description: >-
                Specify the reason or context for locking the rule. Valid only
                when **lock.status** is set to true.
              format: string
            status:
              type: boolean
              description: |-
                Specify whether to lock the rule.
                Possible values:
                true - Locks the rule to prevent editing.
                false - Unlocks the rule.
      required:
        - conditions
        - execute_when
        - module
        - name
    UpdateWorkflowRuleSchema:
      type: object
      additionalProperties: false
      description: >-
        Represents the request body wrapper for updating an existing workflow
        rule. Contains a single-element array with the updated rule
        configuration.
      x-zs-llm-description: >-
        Top-level request body for PUT /settings/automation/workflow_rules (bulk
        update). Contains workflow_rules array with exactly 1 rule object that
        must include its id for identification.
      properties:
        workflow_rules:
          type: array
          description: >-
            The request body must contain a **workflow_rules** array with one
            object.
          items:
            $ref: '#/components/schemas/WorkflowRulePutNestedSchema'
          maxItems: 1
      required:
        - workflow_rules
    WorkflowRulePutNestedSchema:
      type: object
      additionalProperties: false
      description: >-
        Represents the configuration object for updating an existing workflow
        rule, including the rule ID and optional fields such as name, trigger,
        conditions, and lock status.
      x-zs-llm-description: >-
        Rule object inside the PUT request body. All fields are optional for
        partial update: id (required for identification in bulk PUT), name,
        description, status ({active: bool}), execute_when (trigger), conditions
        (actions), lock, module. Omitted fields retain their current values.
      properties:
        id:
          type: string
          description: Represents the unique ID of the workflow rule to update. Required.
          maxLength: 30
        status:
          type: object
          additionalProperties: false
          properties:
            active:
              type: boolean
              description: |-
                Specify whether the workflow rule is active or inactive.
                Possible values:
                true - The rule is active and executes when triggered.
                false - The rule is inactive and does not execute.
            delete_schedule_action:
              type: boolean
              description: >-
                Specify whether to delete all scheduled actions associated with
                the workflow rule when deactivating it.

                Possible values:

                true - Delete all scheduled actions when the rule is
                deactivated.

                false - Preserve scheduled actions when the rule is deactivated.
          description: >-
            Specify the activation state of the workflow rule. When setting
            **active** to false, you can optionally delete all associated
            scheduled actions.
        execute_when:
          $ref: '#/components/schemas/ExecuteWhenNestedSchema'
          description: >-
            Defines the conditions under which the workflow rule will be
            executed. (Required)
        name:
          type: string
          description: Specify the workflow rule name. Required.
          maxLength: 100
        description:
          type: string
          description: Specify the workflow rule description.
          maxLength: 1000
        conditions:
          type: array
          description: >-
            Specify the array of condition objects to update. On update,
            unspecified conditions are preserved. Conditions with a null ID are
            added; conditions with an existing ID get replaced; conditions with
            a **_delete** flag are removed.
          items:
            $ref: '#/components/schemas/ConditionsNestedSchema'
          maxItems: 20
        lock:
          type: object
          description: >-
            Specify whether the workflow rule should be locked to prevent
            editing by other users.
          additionalProperties: false
          properties:
            message:
              type: string
              description: >-
                Specify a note or label indicating the reason or context for
                locking the rule.
              format: string
            status:
              type: boolean
              description: |-
                Specify whether to lock or unlock the workflow rule.
                Possible values:
                true - Locks the rule to prevent editing.
                false - Unlocks the rule.
              enum:
                - true
                - false
        module:
          $ref: '#/components/schemas/ModuleOrFieldNestedSchema'
    WorkflowRulesGetResponseSchema:
      type: object
      x-zs-$id: WorkflowRulesGetResponseSchema
      additionalProperties: false
      description: >-
        Represents the paginated list response for workflow rules, containing an
        array of workflow rule objects and pagination metadata.
      x-zs-llm-description: >-
        Response wrapper for getWorkflowRules (list). Contains workflow_rules
        array of rule objects and info object with pagination metadata (page,
        per_page, count, more_records).
      properties:
        workflow_rules:
          type: array
          description: >-
            Represents the array of workflow rule objects returned in the list
            response.
          items:
            $ref: '#/components/schemas/WorkflowRuleSingleGetSchema'
          maxItems: 200
        info:
          $ref: '#/components/schemas/InfoNestedSchema'
      required:
        - workflow_rules
        - info
      title: Workflow Rule List Response
    WorkflowRuleSingleGetResponseSchema:
      type: object
      x-zs-$id: WorkflowRuleSingleGetResponseSchema
      additionalProperties: false
      description: >-
        Represents the response body for a single workflow rule retrieval,
        containing a single-element array with the full rule details.
      x-zs-llm-description: >-
        Response wrapper for getWorkflowRuleById. Contains workflow_rules array
        with exactly one complete rule object.
      properties:
        workflow_rules:
          type: array
          description: Represents the array containing the single workflow rule retrieved.
          items:
            $ref: '#/components/schemas/WorkflowRuleSingleGetSchema'
          maxItems: 10
      required:
        - workflow_rules
      title: Workflow Rule List Response
    WorkflowRuleSingleGetSchema:
      type: object
      additionalProperties: false
      description: >-
        Represents the full configuration and metadata of a single workflow
        rule, including its trigger, conditions, actions, lock status, and audit
        timestamps.
      x-zs-llm-description: >-
        Complete workflow rule entity as returned in GET responses. Contains all
        rule metadata: trigger (execute_when), conditions with actions, module
        reference, ownership (created_by, modified_by), timestamps, lock status,
        activation status, and capabilities (editable, deletable, deprecated).
        Use this to understand current rule state before updating.
      properties:
        created_time:
          type: string
          format: date-time
          description: >-
            Represents the ISO 8601 timestamp indicating when the system created
            this workflow rule.
          maxLength: 255
        execute_when:
          $ref: '#/components/schemas/ExecuteWhenNestedSchema'
        editable:
          type: boolean
          description: >-
            Indicates whether the requesting user has permission to edit this
            workflow rule.
        module:
          $ref: '#/components/schemas/ModuleOrFieldNestedSchema'
        deprecated:
          type: boolean
          description: >-
            Indicates whether this workflow rule is deprecated and should be
            migrated to a newer configuration.
        deletable:
          type: boolean
          description: >-
            Indicates whether the requesting user has permission to delete this
            workflow rule.
        description:
          type:
            - string
            - 'null'
          description: >-
            Represents the user-defined description of the workflow rule. Null
            if not set.
          maxLength: 255
        source:
          type: string
          description: >-
            Represents the origin of the workflow rule. For example, **crm** for
            rules created through the CRM UI, or **API** for rules created
            through the API.
          maxLength: 255
        created_by:
          $ref: '#/components/schemas/CreatedModifiedByObjectSchema'
        last_executed_time:
          type:
            - string
            - 'null'
          format: date-time
          description: >-
            Represents the ISO 8601 timestamp of the last time this workflow
            rule was triggered. Null if the rule has never been triggered.
        modified_time:
          $ref: '#/components/schemas/TimeObjectSchema'
        name:
          type: string
          description: Represents the name of the workflow rule.
          maxLength: 255
        modified_by:
          $ref: '#/components/schemas/CreatedModifiedByObjectSchema'
        lock:
          $ref: '#/components/schemas/LockStatusSchema'
        id:
          type: string
          description: Represents the unique ID of the workflow rule.
          maxLength: 20
        category:
          type: string
          description: Represents the classification category of the workflow rule.
          maxLength: 255
        conditions:
          type: array
          description: >-
            Represents the array of condition objects that define the criteria
            for executing the actions of the workflow rule.
          items:
            $ref: '#/components/schemas/ConditionsNestedSchema'
          maxItems: 10
        status:
          $ref: '#/components/schemas/ActivationStatusSchema'
      required:
        - created_by
        - created_time
        - deletable
        - description
        - editable
        - execute_when
        - id
        - last_executed_time
        - lock
        - modified_by
        - modified_time
        - module
        - name
        - source
        - status
      title: Workflow Rule
    ModuleOrFieldNestedSchema:
      type: object
      x-zs-$id: ModuleOrFieldNestedSchema
      additionalProperties: false
      description: >-
        Represents a CRM module or field reference using its API name and unique
        numeric ID.
      x-zs-llm-description: >-
        Reusable reference object for modules and fields. Both api_name and id
        must be provided  -  API returns MANDATORY_NOT_FOUND if id is missing.
        Used across: rule module, action module, criteria field, field_mappings
        field, lookup_field.
      properties:
        api_name:
          type: string
          description: >-
            Represents the API name of the module or field, such as **Leads**,
            **Contacts**, or a custom field API name.
          maxLength: 100
        id:
          type: string
          description: Represents the unique numeric ID of the module or field.
          maxLength: 20
      required:
        - api_name
        - id
      minProperties: 1
    ExecuteWhenNestedSchema:
      description: >-
        Represents the trigger configuration that defines when the workflow rule
        fires, including the trigger type and its associated details.
      x-zs-llm-description: >-
        Trigger configuration discriminator (oneOf). The type field selects the
        trigger template  -  route to the matching schema: T1 (simple
        lifecycle/event types), T2 (field_update), T3 (section_update), T4
        (date_or_datetime), T5 (time offset), T6 (score_update), T7
        (mail_sent_replied_within). Not all triggers work on all modules  - 
        validate with getWorkflowConfigurations first.
      discriminator:
        propertyName: type
        mapping:
          create: '#/components/schemas/ExecuteWhenT1Simple'
          edit: '#/components/schemas/ExecuteWhenT1Simple'
          create_or_edit: '#/components/schemas/ExecuteWhenT1Simple'
          delete: '#/components/schemas/ExecuteWhenT1Simple'
          cancel: '#/components/schemas/ExecuteWhenT1Simple'
          reschedule: '#/components/schemas/ExecuteWhenT1Simple'
          reassign: '#/components/schemas/ExecuteWhenT1Simple'
          anyaction: '#/components/schemas/ExecuteWhenT1Simple'
          deactivate: '#/components/schemas/ExecuteWhenT1Simple'
          activate: '#/components/schemas/ExecuteWhenT1Simple'
          marked_as_complete: '#/components/schemas/ExecuteWhenT1Simple'
          incoming_call_ring: '#/components/schemas/ExecuteWhenT1Simple'
          incoming_call_start: '#/components/schemas/ExecuteWhenT1Simple'
          incoming_call_createedit: '#/components/schemas/ExecuteWhenT1Simple'
          incoming_call_edit: '#/components/schemas/ExecuteWhenT1Simple'
          outgoing_call_ring: '#/components/schemas/ExecuteWhenT1Simple'
          outgoing_call_start: '#/components/schemas/ExecuteWhenT1Simple'
          outgoing_call_edit: '#/components/schemas/ExecuteWhenT1Simple'
          outgoing_call_createedit: '#/components/schemas/ExecuteWhenT1Simple'
          missed_call: '#/components/schemas/ExecuteWhenT1Simple'
          scheduled_call_createedit: '#/components/schemas/ExecuteWhenT1Simple'
          scheduled_call_edit: '#/components/schemas/ExecuteWhenT1Simple'
          email_received: '#/components/schemas/ExecuteWhenT1Simple'
          mail_sent: '#/components/schemas/ExecuteWhenT1Simple'
          mail_sent_clicked: '#/components/schemas/ExecuteWhenT1Simple'
          mail_sent_replied: '#/components/schemas/ExecuteWhenT1Simple'
          mail_sent_opened: '#/components/schemas/ExecuteWhenT1Simple'
          mail_sent_bounced: '#/components/schemas/ExecuteWhenT1Simple'
          fb_post_on_page: '#/components/schemas/ExecuteWhenT1Simple'
          fb_comment_on_page: '#/components/schemas/ExecuteWhenT1Simple'
          fb_like_on_post: '#/components/schemas/ExecuteWhenT1Simple'
          fb_send_message: '#/components/schemas/ExecuteWhenT1Simple'
          tw_mention_on: '#/components/schemas/ExecuteWhenT1Simple'
          tw_retweet_on_tweet: '#/components/schemas/ExecuteWhenT1Simple'
          tw_comment_on_tweet: '#/components/schemas/ExecuteWhenT1Simple'
          tw_send_message: '#/components/schemas/ExecuteWhenT1Simple'
          voc_incoming_signal: '#/components/schemas/ExecuteWhenT1Simple'
          field_update: '#/components/schemas/ExecuteWhenT2FieldUpdate'
          incoming_call_field_update: '#/components/schemas/ExecuteWhenT2FieldUpdate'
          outgoing_call_field_update: '#/components/schemas/ExecuteWhenT2FieldUpdate'
          scheduled_call_field_update: '#/components/schemas/ExecuteWhenT2FieldUpdate'
          stage_automation_field_update: '#/components/schemas/ExecuteWhenT2FieldUpdate'
          rollup_summary_update: '#/components/schemas/ExecuteWhenT2FieldUpdate'
          section_update: '#/components/schemas/ExecuteWhenT3SectionUpdate'
          incoming_call_section_update: '#/components/schemas/ExecuteWhenT3SectionUpdate'
          outgoing_call_section_update: '#/components/schemas/ExecuteWhenT3SectionUpdate'
          scheduled_call_section_update: '#/components/schemas/ExecuteWhenT3SectionUpdate'
          date_or_datetime: '#/components/schemas/ExecuteWhenT4DateBased'
          overdue: '#/components/schemas/ExecuteWhenT5TimeOffset'
          email_received_notreplied: '#/components/schemas/ExecuteWhenT5TimeOffset'
          email_received_opened_notreplied: '#/components/schemas/ExecuteWhenT5TimeOffset'
          mail_sent_opened_notreplied: '#/components/schemas/ExecuteWhenT5TimeOffset'
          mail_sent_notreplied: '#/components/schemas/ExecuteWhenT5TimeOffset'
          mail_sent_notopened: '#/components/schemas/ExecuteWhenT5TimeOffset'
          recommendation_rebuy: '#/components/schemas/ExecuteWhenT5TimeOffset'
          score_increase: '#/components/schemas/ExecuteWhenT6ScoreUpdate'
          score_decrease: '#/components/schemas/ExecuteWhenT6ScoreUpdate'
          score_update: '#/components/schemas/ExecuteWhenT6ScoreUpdate'
          zia_scoring_rule: '#/components/schemas/ExecuteWhenT6ScoreUpdate'
          mail_sent_replied_within: '#/components/schemas/ExecuteWhenT7EmailRepliedWithin'
      oneOf:
        - $ref: '#/components/schemas/ExecuteWhenT1Simple'
        - $ref: '#/components/schemas/ExecuteWhenT2FieldUpdate'
        - $ref: '#/components/schemas/ExecuteWhenT3SectionUpdate'
        - $ref: '#/components/schemas/ExecuteWhenT4DateBased'
        - $ref: '#/components/schemas/ExecuteWhenT5TimeOffset'
        - $ref: '#/components/schemas/ExecuteWhenT6ScoreUpdate'
        - $ref: '#/components/schemas/ExecuteWhenT7EmailRepliedWithin'
    ExecuteWhenT1Simple:
      type: object
      description: >-
        Represents a simple trigger type (T1) that fires on record creation,
        editing, deletion, or when specific CRM events occur, with optional
        repeat and cross-module support.
      x-zs-llm-description: >-
        Simple trigger template for record lifecycle and event types: create,
        edit, create_or_edit, delete, cancel, and module-specific variants
        (email_received, missed_call, mail_sent_*, fb_*, tw_*). Only requires
        details.repeat (bool). Email/call/social triggers require their
        dedicated module with relational_criteria linking to target module.
        Validate availability via getWorkflowConfigurations.
      additionalProperties: false
      x-zs-$id: ExecuteWhenT1Simple
      required:
        - type
      properties:
        type:
          description: >-
            Represents the trigger API name that activates the workflow rule.
            Supported values vary by module; use the getWorkflowConfigurations
            endpoint to retrieve supported triggers for the target module.
          type: string
          enum:
            - create
            - edit
            - create_or_edit
            - delete
            - cancel
            - reschedule
            - reassign
            - anyaction
            - deactivate
            - activate
            - marked_as_complete
            - incoming_call_ring
            - incoming_call_start
            - incoming_call_createedit
            - incoming_call_edit
            - outgoing_call_ring
            - outgoing_call_start
            - outgoing_call_edit
            - outgoing_call_createedit
            - missed_call
            - scheduled_call_createedit
            - scheduled_call_edit
            - email_received
            - mail_sent
            - mail_sent_clicked
            - mail_sent_replied
            - mail_sent_opened
            - mail_sent_bounced
            - fb_post_on_page
            - fb_comment_on_page
            - fb_like_on_post
            - fb_send_message
            - tw_mention_on
            - tw_retweet_on_tweet
            - tw_comment_on_tweet
            - tw_send_message
            - voc_incoming_signal
        details:
          type: object
          additionalProperties: false
          description: >-
            Represents the optional trigger configuration details, including
            **repeat** (Boolean) and **trigger_module** (object) for
            cross-module triggers.
          properties:
            repeat:
              type: boolean
              description: >-
                Indicates whether the rule fires every time the trigger
                condition is met. When false, the rule fires only on the first
                occurrence.
            trigger_module:
              description: >-
                The module that actually triggers the rule. Defaults to the
                rule's top-level module if omitted. Must be explicitly set when
                the trigger targets a different module, such as a rule on Leads
                triggered by a note creation event, which requires the trigger
                module to reference the Notes module. To discover module API
                names and identifiers, retrieve the available modules from the
                system.
              $ref: '#/components/schemas/ModuleOrFieldNestedSchema'
    ExecuteWhenT2FieldUpdate:
      type: object
      description: >-
        Represents a field update trigger type that fires when a specified field
        value on a record changes according to defined criteria.
      x-zs-llm-description: |
        Field update trigger. Fires when a specific field value
        changes. The monitored field is defined inside
        details.criteria.field  -  not at top level. Set details.criteria.value
        to '${ANYVALUE}' to fire on any change regardless of new value.
        Call-prefixed variants require the Calls module. details.repeat controls
        re-execution on subsequent edits. details.match_all controls
        multi-criteria evaluation.
      additionalProperties: false
      x-zs-$id: ExecuteWhenT2FieldUpdate
      required:
        - type
        - details
      properties:
        type:
          description: >-
            Represents the trigger type for field update rules. Availability
            varies by the target module.
          type: string
          enum:
            - field_update
            - incoming_call_field_update
            - outgoing_call_field_update
            - scheduled_call_field_update
            - stage_automation_field_update
            - rollup_summary_update
        details:
          type: object
          additionalProperties: false
          description: >-
            Represents the field update trigger details, including the criteria
            that define which field value change activates the rule.
          required:
            - criteria
          properties:
            criteria:
              description: >-
                Represents the field value change criteria that activate the
                trigger. Defines which field is monitored and what change
                condition fires the rule.
              oneOf:
                - $ref: '#/components/schemas/WorkflowSimpleFilterCriterion'
                - $ref: '#/components/schemas/WorkflowGroupedFilterCriterion'
            match_all:
              type: boolean
              description: |-
                Controls the logic applied across criteria groups.
                Possible values:
                true - All criteria groups must match (AND logic).
                false - Any one criteria group is sufficient (OR logic).
            repeat:
              type: boolean
              description: >-
                Indicates whether the rule fires every time the field update
                condition is met. When false, the rule fires only on the first
                occurrence.
            trigger_module:
              description: >-
                The module that actually triggers the rule. Defaults to the
                rule's top-level module if omitted. Must be explicitly set when
                the trigger targets a different module  - e.g., a rule on Leads
                triggered by 'note created' requires trigger_module = {api_name:
                'Notes', id: '...'}. Use `getModules` to discover module
                api_name and id values.
              $ref: '#/components/schemas/ModuleOrFieldNestedSchema'
    ExecuteWhenT3SectionUpdate:
      type: object
      description: >
        Represents the trigger type for section update rules. Availability
        varies by the target module
      x-zs-llm-description: >-
        Section update trigger. Fires when any field within specific layout
        sections is modified. Required: details.sections (array of section
        objects). Call-prefixed variants require the Calls module. Validate
        available sections via getLayouts for the module.
      additionalProperties: false
      x-zs-$id: ExecuteWhenT3SectionUpdate
      required:
        - type
        - details
      properties:
        type:
          description: >-
            Represents the trigger type for section update rules. Use
            getWorkflowConfigurations to verify the trigger is available for the
            target module.
          type: string
          enum:
            - section_update
            - incoming_call_section_update
            - outgoing_call_section_update
            - scheduled_call_section_update
        details:
          type: object
          additionalProperties: false
          description: >-
            Represents the section update trigger details, including the layout
            section IDs to monitor.
          required:
            - section_ids
          properties:
            section_ids:
              type: array
              description: >-
                Represents the array of layout section IDs to monitor for
                updates. Each ID must correspond to a valid section ID for the
                target module.
              items:
                type: string
                format: int64
                description: Represents the unique ID of a layout section to monitor.
              minItems: 1
              maxItems: 10
            repeat:
              type: boolean
              description: |
                Indicates whether the rule fires every time a section update
                condition is met. When false, the rule fires only on the first
                occurrence.
            trigger_module:
              description: >-
                Optional. The module that actually triggers the rule. Defaults
                to the rule's top-level module if omitted. Must be explicitly
                set when the trigger targets a different module  - e.g., a rule
                on Leads triggered by 'note created' requires trigger_module =
                {api_name: 'Notes', id: '...'}. Use `getModules` to discover
                module api_name and id values.
              $ref: '#/components/schemas/ModuleOrFieldNestedSchema'
    ExecuteWhenT4DateBased:
      type: object
      description: >
        Represents the date or datetime field to monitor for triggering the
        rule. Must reference an existing date or datetime field on the module.
      x-zs-llm-description: >-
        Date-based trigger. Fires relative to a date/datetime field value
        (before or after). Required: details.field ({api_name, id}  -  must be
        date/datetime type), details.period ('days'|'hours'), details.sign
        ('negative' for before, 'positive' for after), details.unit (integer  - 
        number of days/hours). Broadly available across modules.
      additionalProperties: false
      x-zs-$id: ExecuteWhenT4DateBased
      required:
        - type
        - details
      properties:
        type:
          description: >-
            Represents the trigger type for date or datetime-based rules, which
            fire relative to a date field value on the record.
          type: string
          enum:
            - date_or_datetime
        details:
          type: object
          additionalProperties: false
          description: >-
            Represents the date-based trigger details, including the target date
            field, time offset, and recurrence configuration.
          required:
            - field
            - period
            - unit
          properties:
            field:
              type: object
              additionalProperties: false
              description: >-
                Represents the date or datetime field to monitor for triggering
                the rule. Use the getFields endpoint to discover available date
                and datetime fields.
              required:
                - api_name
              properties:
                api_name:
                  type: string
                  maxLength: 255
                  description: >-
                    Represents the API name of the date or datetime field, such
                    as **Created_Time**, **Modified_Time**, or a custom field
                    API name.
                id:
                  type: string
                  maxLength: 20
                  description: Represents the unique ID of the date or datetime field.
            period:
              type: string
              description: >-
                Represents the time unit for the offset relative to the
                monitored date field. For example, **days**, **weeks**, or
                **months**.
              enum:
                - minutes
                - hours
                - days
                - weeks
                - months
                - years
                - b_hours
                - b_days
            unit:
              type: integer
              format: int32
              description: >-
                Represents the offset magnitude relative to the monitored date
                field value. Negative values indicate before the date; positive
                values indicate after.
            execute_at:
              type: string
              format: time
              description: >-
                Represents the exact time of day at which to fire the trigger,
                in 24-hour HH:mm format. Applicable only to datetime fields.
            recur_cycle:
              type: string
              description: |-
                Represents the recurrence frequency for the date-based trigger.
                Possible values:
                once - Fires once.
                monthly - Fires monthly on the same date.
                yearly - Fires yearly on the same date.
              enum:
                - once
                - monthly
                - yearly
            repeat:
              type: boolean
              description: >-
                Indicates whether the trigger fires repeatedly. When true, the
                trigger fires on each recurrence as configured.
            trigger_module:
              description: >
                Specifies the module that triggers the workflow rule. If
                omitted,

                it defaults to the rule's top-level module. Specify this when
                the trigger

                targets a different module. For example, a workflow rule on
                Leads triggered

                when a note is created requires 'trigger_module': {"api_name":
                "Notes",

                'id': '...'}. Use 'getModules' to retrieve the module API name
                and ID.
              $ref: '#/components/schemas/ModuleOrFieldNestedSchema'
    ExecuteWhenT5TimeOffset:
      type: object
      description: >
        Represents the trigger type for time-offset rules. Availability varies
        by the target module.
      x-zs-llm-description: >
        Time offset trigger. Fires after a specified delay from an event.
        Required: details.period ('days'|'hours'), details.unit (integer).
        Module-specific triggers: email time-offset types
        (email_received_notreplied, mail_sent_notopened) require a dedicated
        email module with relational_criteria. 'overdue' requires an activity
        module. Does not support repeat.
      additionalProperties: false
      x-zs-$id: ExecuteWhenT5TimeOffset
      required:
        - type
        - details
      properties:
        type:
          description: >-
            Represents the trigger type for time-offset rules. Use
            getWorkflowConfigurations to verify the trigger is available for the
            target module.
          type: string
          enum:
            - overdue
            - email_received_notreplied
            - email_received_opened_notreplied
            - mail_sent_opened_notreplied
            - mail_sent_notreplied
            - mail_sent_notopened
            - recommendation_rebuy
        details:
          type: object
          additionalProperties: false
          description: >-
            Represents the time offset trigger details, including the time unit
            and magnitude for the offset.
          required:
            - period
            - unit
          properties:
            period:
              type: string
              description: |-
                Represents the time unit for the offset.
                Possible values:
                days - Offset in days.
                hours - Offset in hours.
              enum:
                - days
                - hours
            unit:
              type: integer
              format: int32
              description: >-
                Represents the time offset magnitude. Always a positive integer
                for time-offset triggers, such as 1 for one day or 3 for three
                hours.
            trigger_module:
              description: |
                The module that actually triggers the rule. Defaults to
                the rule's top-level module if omitted. Must be explicitly set
                when the trigger targets a different module  - e.g., a rule on
                Leads triggered by 'note created' requires trigger_module =
                {api_name: 'Notes', id: '...'}. Use `getModules` to discover
                module api_name and id values.
              $ref: '#/components/schemas/ModuleOrFieldNestedSchema'
            field:
              type: object
              description: >-
                Represents the field reference returned in GET responses for
                time-offset triggers, including the trigger field details.
              additionalProperties: false
              properties:
                id:
                  type: string
                  description: >-
                    Represents the field identifier for the time-offset trigger.
                    Returns **-1** when the field is system-determined.
                  maxLength: 20
    ExecuteWhenT6ScoreUpdate:
      type: object
      description: >-
        Represents a score update trigger type (T6) that fires when a record
        score changes due to configured scoring rules.
      x-zs-llm-description: >-
        Score update trigger. Fires when a record's score changes based on
        scoring rules. Required: details.type ('All_Rules' for any scoring rule,
        'Selective_Rules' for specific ones). For Selective_Rules also requires
        details.scoring_rules array with rule IDs. Trigger types:
        score_increase, score_decrease, score_update, zia_scoring_rule.
      additionalProperties: false
      x-zs-$id: ExecuteWhenT6ScoreUpdate
      required:
        - type
        - details
      properties:
        type:
          description: >-
            Represents the trigger type for scoring rules. Supports score
            increase and score decrease trigger events.
          type: string
          enum:
            - score_increase
            - score_decrease
            - score_update
            - zia_scoring_rule
        details:
          type: object
          additionalProperties: false
          description: >-
            Represents the score update trigger details, including the Scoring
            Rule scope and the applicable scoring rules.
          required:
            - type
          properties:
            type:
              type: string
              description: >-
                Represents the trigger type for scoring rules. Supports score
                increase and score decrease trigger events.
              enum:
                - All_Rules
                - Selective_Rules
            rules:
              type: array
              description: >-
                Represents the array of Scoring Rule references to monitor.
                Required when **type** is set to **Selective_Rules**.
              items:
                type: object
                description: >-
                  Represents a single Scoring Rule reference. Must include the
                  Scoring Rule ID for POST and PUT requests. The name field is
                  read-only and returned in GET responses.
                additionalProperties: false
                properties:
                  id:
                    type: string
                    maxLength: 20
                    description: Represents the unique ID of the Scoring Rule.
                  name:
                    type: string
                    maxLength: 255
                    readOnly: true
                    description: >-
                      Represents the display name of the Scoring Rule. This
                      field is read-only and returned in GET responses.
                required:
                  - id
              minItems: 1
              maxItems: 50
            repeat:
              type: boolean
              description: >-
                Indicates whether the rule fires every time the score condition
                is met. When false, the rule fires only on the first occurrence.
            trigger_module:
              description: >-
                The module that actually triggers the rule. Defaults to the
                rule's top-level module if omitted. Must be explicitly set when
                the trigger targets a different module, such as a rule on Leads
                triggered by a note creation event, which requires the trigger
                module to reference the Notes module. To discover module API
                names and identifiers, retrieve the available modules from the
                system.
              $ref: '#/components/schemas/ModuleOrFieldNestedSchema'
    ExecuteWhenT7EmailRepliedWithin:
      type: object
      description: >-
        Represents an email-reply-window trigger type (T7) that fires when a
        sent email receives a reply within a configured time window.
      x-zs-llm-description: >
        Email replied-within trigger. Fires when a sent email

        receives a reply within a time window.Required-details.period
        ('days'|'hours'), details.unit (integer). Only type:
        mail_sent_replied_within. Typically requires a dedicated email module
        with relational_criteria. Does not support repeat.
      additionalProperties: false
      x-zs-$id: ExecuteWhenT7EmailRepliedWithin
      required:
        - type
        - details
      properties:
        type:
          description: >-
            Represents the trigger type for email-reply-window rules. Requires a
            dedicated email module workflow rule.
          type: string
          enum:
            - mail_sent_replied_within
        details:
          type: object
          additionalProperties: false
          description: >-
            Represents the email-reply-window trigger details, including the
            time unit and magnitude for the reply window.
          required:
            - period
            - unit
          properties:
            period:
              type: string
              description: |-
                Represents the time unit for the reply window.
                Possible values:
                days - Window measured in days.
                hours - Window measured in hours.
              enum:
                - days
                - hours
            unit:
              type: integer
              format: int32
              description: >-
                Represents the reply window magnitude, such as 3 for a window of
                three days or three hours.
            trigger_module:
              description: >-
                The module that actually triggers the rule. Defaults to the
                rule's top-level module if omitted. Must be explicitly set when
                the trigger targets a different module  - e.g., a rule on Leads
                triggered by 'note created' requires trigger_module = {api_name:
                'Notes', id: '...'}. Use `getModules` to discover module
                api_name and id values.
              $ref: '#/components/schemas/ModuleOrFieldNestedSchema'
    ConditionsNestedSchema:
      type: object
      additionalProperties: false
      description: >-
        Represents a single condition within a workflow rule that defines which
        records are evaluated and what actions are executed when the criteria
        are met.
      x-zs-llm-description: >-
        A condition defines WHICH records to act on and WHAT actions to execute.
        Each rule has 1+ conditions evaluated in sequence_number order.
        Required: sequence_number (integer, starting from 1). At least one of
        instant_actions or scheduled_actions must be present. Optional:
        criteria_details (filter gate). Convert action requires
        criteria_details.criteria to be non-null.
      properties:
        sequence_number:
          type: integer
          format: int32
          description: >-
            Represents the execution order of this condition within the workflow
            rule, starting from one. Must be unique across all conditions in the
            rule.
        instant_actions:
          $ref: '#/components/schemas/InstantActionsNestedSchema'
          description: >-
            Actions to execute immediately when the condition is met. At least
            one of instant_actions or scheduled_actions must be present  -
            returns MANDATORY_NOT_FOUND if both are absent.
        scheduled_actions:
          $ref: '#/components/schemas/ScheduledActionsNestedSchema'
          description: >-
            Actions to execute after a configured delay. Scheduled actions
            require both the trigger and the action type to support scheduling.
        criteria_details:
          $ref: '#/components/schemas/CriteriaDetailsNestedSchema'
          description: >-
            Record matching criteria for this condition. When provided,
            criteria_details must be a JSON object and cannot be null. To match
            all records, pass an object with criteria set to null, but do not
            set criteria_details itself to null. This field is required for
            certain trigger types, such as related module triggers like Notes on
            Leads. The convert action type requires criteria_details.criteria to
            be a non-null filter object. Omit criteria_details entirely or pass
            criteria as null to match all records when the trigger does not
            require specific criteria and no convert action is present.
        id:
          type: string
          format: int64
          description: >-
            Represents the unique ID of the condition. Auto-generated on
            creation. Required on PUT to identify which condition to update.
        _delete:
          type: 'null'
          description: >-
            Indicates that this condition should be removed from the workflow
            rule when set in a PUT request. Provide a null value to signal
            deletion.
      required:
        - sequence_number
    CriteriaDetailsNestedSchema:
      type: object
      additionalProperties: false
      description: >-
        Represents the filter criteria that determine which records satisfy the
        workflow rule condition.
      x-zs-llm-description: >-
        Filter configuration determining which records pass through to action
        execution. Contains two independent blocks: criteria (filters on trigger
        module's own fields) and relational_criteria (filters on a related
        module). Both are optional  -  null or omitted criteria matches ALL
        records. Required for certain triggers (related-module triggers) and for
        convert action.
      properties:
        criteria:
          oneOf:
            - $ref: '#/components/schemas/SimpleFilterCriterionRequest'
            - $ref: '#/components/schemas/GroupedFilterCriterionRequest'
            - type: 'null'
              x-zs-$id: CriteriaNullDetailsNestedSchema1
              description: >-
                Represents a null variant indicating no criteria or module
                filter is applied.
          description: >-
            Represents the filter criteria applied to the trigger module
            records. When null, the rule applies to all records without
            additional field-level filtering.
        relational_criteria:
          type: object
          description: >-
            Represents the filter criteria applied to a related module when the
            trigger involves cross-module data, such as emails, calls, or notes.
          additionalProperties: false
          properties:
            criteria:
              oneOf:
                - $ref: '#/components/schemas/SimpleFilterCriterionRequest'
                - $ref: '#/components/schemas/GroupedFilterCriterionRequest'
                - type: 'null'
                  description: >-
                    Represents a null variant indicating no criteria or module
                    filter is applied.
                  x-zs-$id: CriteriaNullDetailsNestedSchema2
              description: >-
                Represents the filter criteria applied to the related module
                records. Follows the same structure as the top-level criteria
                field.
            module_selection:
              type:
                - string
                - 'null'
              enum:
                - all
                - specific
                - unknown
                - null
              description: >-
                Represents the scope selector for the related module filter.
                Required when **relational_criteria** is present.
            module:
              oneOf:
                - $ref: '#/components/schemas/ModuleOrFieldNestedSchema'
                - type: 'null'
                  x-zs-$id: ModuleOrFieldNullDetailsNestedSchema
                  description: >-
                    Represents a null variant indicating no criteria or module
                    filter is applied.
              description: >-
                Represents the related module to filter on. Required when
                **module_selection** is set to **specific**.
    InstantActionsNestedSchema:
      type: object
      additionalProperties: false
      description: >-
        Represents the container for instant actions that execute immediately
        when the workflow rule condition is met.
      x-zs-llm-description: >-
        Container for actions that execute immediately when the condition is
        met. Contains actions array (non-empty required). Each action is either
        associate (pre-configured entity referenced by type+id) or non-associate
        (inline type+details). Check getWorkflowConfigurations
        actions[].associate_action to determine which pattern to use for each
        action type.
      properties:
        actions:
          type: array
          description: >-
            Represents the array of action objects configured for this
            condition. Required and must be non-empty. Each action object
            specifies the action type and its configuration or reference ID.
          items:
            oneOf:
              - $ref: '#/components/schemas/NonAssociateActionsNestedSchema'
              - $ref: '#/components/schemas/AssociateActionsNestedSchema'
          maxItems: 50
      required:
        - actions
    ScheduledActionsNestedSchema:
      type:
        - array
        - 'null'
      x-zs-$id: ScheduledActionsNestedSchema
      description: >-
        Represents the container for scheduled actions that execute after a
        configured delay from the time the workflow rule condition is triggered.
      x-zs-llm-description: >-
        Container for delayed action groups. Each group has execute_after
        ({period, unit}) defining the delay and an actions array. Not supported
        when: trigger has repeat=true, convert action present in
        instant_actions, or trigger doesn't support scheduling
        (DEPENDENT_MISMATCH). Max groups governed by getWorkflowRulesCount
        scheduled_actions_per_rule_limit.
      items:
        type:
          - object
          - 'null'
        additionalProperties: false
        description: Specify when the scheduled actions should be executed
        properties:
          execute_after:
            type: object
            additionalProperties: false
            description: >-
              Defines the delay before the scheduled actions execute. Required.
              Cannot be an empty object.
            properties:
              period:
                type: string
                description: >-
                  Represents the type of time interval. Required. Must be one of
                  the allowed period values (invalid_schedule_actions_period if
                  invalid). business_hours and business_days are only available
                  when org business hours are configured. The API returns
                  available periods from getWorkflowConfigurations.
                enum:
                  - minutes
                  - hours
                  - days
                  - weeks
                  - months
                  - years
                  - business_hours
                  - business_days
              unit:
                type: integer
                format: int32
                description: >-
                  Represents the numeric delay value. Required. Allowed ranges
                  per period (unit_not_allowed_for_period if out of range):
                  minutes: 5-180 (2-180 if 1-min repetition feature is enabled),
                  hours: 0-99, days: 0-2000, weeks: 0-100, months: 0-24, years:
                  0-10, business_hours: 0-99, business_days: 0-2000. All values
                  must be non-negative (no pre-event offsets for scheduled
                  actions).
            required:
              - period
              - unit
          actions:
            type: array
            description: >
              Represents the array of action objects for this scheduled group.
              Uses the same associate and non-associate action structure as
              instant actions, but only action types that support scheduled
              execution are allowed. Per-type limits apply independently to
              instant and scheduled actions.
            items:
              oneOf:
                - $ref: '#/components/schemas/NonAssociateActionsNestedSchema'
                - $ref: '#/components/schemas/AssociateActionsNestedSchema'
            maxItems: 50
          id:
            type: string
            description: Represents unique Id of the scheduled action
            maxLength: 20
        required:
          - actions
      maxItems: 5
    AssociateActionsNestedSchema:
      x-zs-$id: AssociateActionsNestedSchema
      description: >-
        Represents an associate action that references a pre-configured action
        entity by its unique ID. Use the appropriate entity API to retrieve
        valid IDs.
      x-zs-llm-description: >-
        Union (oneOf) for pre-configured action references. Routes to:
        EmailNotificationAssociateActionSchema,
        FieldUpdateAssociateActionSchema, TaskAssociateActionSchema, or
        SimpleAssociateActionSchema based on type value. Associate actions
        reference an entity created via its own API  -  they carry type + id
        (and optionally related_details).
      discriminator:
        propertyName: type
      oneOf:
        - $ref: '#/components/schemas/EmailNotificationAssociateActionSchema'
        - $ref: '#/components/schemas/FieldUpdateAssociateActionSchema'
        - $ref: '#/components/schemas/TaskAssociateActionSchema'
        - $ref: '#/components/schemas/SimpleAssociateActionSchema'
    EmailNotificationAssociateActionSchema:
      type: object
      x-zs-$id: EmailNotificationAssociateActionSchema
      additionalProperties: false
      description: >-
        Represents an associate action that sends a pre-configured email
        notification when the workflow rule condition is triggered.
      x-zs-llm-description: >-
        References a pre-configured email notification entity by ID. Create the
        entity first via postEmailNotifications, then use its ID here. Supports
        related_details.best_time for optimal send timing. Entity must be
        created for the correct module (main module, or
        relational_criteria.module if module_selection='specific' with
        Emails/Facebook/Twitter).
      properties:
        id:
          type: string
          description: >-
            Represents the unique ID of the email notification. Required when
            associating an existing email notification with the rule.
          maxLength: 20
          x-zs-$ref:
            resource: email_notifications
            origins:
              - operationId: getEmailNotifications
                propertyId: EmailNotificationsId
          example: '6660682000001435009'
          title: Email Notification Action Id
        name:
          type: string
          description: >-
            Represents the display name of the EmailNotificationAssociate
            action. Returned in GET responses and derived from the associated
            action configuration.
          maxLength: 500
        type:
          type: string
          description: >-
            Represents the action type discriminator that identifies this as a
            EmailNotificationAssociate action within the workflow rule. The
            value is fixed for this action type and must be supported by the
            target module and trigger event.
          const: email_notifications
        details:
          type: object
          description: >-
            Represents the read-only details of the associated email
            notification. Returned in GET responses and not required in POST or
            PUT requests.
          additionalProperties: false
          properties:
            module:
              $ref: '#/components/schemas/ModuleOrFieldNestedSchema'
              description: The module this action applies to.
        related_details:
          description: >-
            Controls whether the email is sent at the best time for the
            recipient (powered by Data Intelligence). Null when best_time is not
            enabled.
          $ref: '#/components/schemas/EmailNotificationRelatedDetailsSchema'
        _delete:
          type: 'null'
          description: >-
            Indicates that this action should be removed from the workflow rule
            when set in a PUT request. Provide a null value to signal deletion.
      required:
        - type
        - id
    FieldUpdateAssociateActionSchema:
      type: object
      x-zs-$id: FieldUpdateAssociateActionSchema
      additionalProperties: false
      description: >-
        Represents an associate action that updates field values using a
        pre-configured field update action when the workflow rule condition is
        triggered.
      x-zs-llm-description: >-
        References a pre-configured field update entity by ID. Create the entity
        first via createFieldUpdates, then use its ID here. Supports
        related_details.lookup_field for targeting a related module's field  - 
        set null for same-module updates. Entity must be created for the correct
        module context.
      properties:
        id:
          type: string
          description: >-
            Represents the unique ID of the field update action. Use the Get
            Field Updates API to retrieve available IDs.
          maxLength: 20
          x-zs-$ref:
            resource: field_updates
            origins:
              - operationId: getFieldUpdates
                propertyId: FieldUpdatesId
          example: '3361265000006176255'
          title: Field Update Action Id
        name:
          type: string
          description: >-
            Represents the display name of the FieldUpdateAssociate action.
            Returned in GET responses and derived from the referenced action
            configuration.
          maxLength: 500
        type:
          type: string
          description: >-
            Represents the action type discriminator that identifies this as a
            FieldUpdateAssociate action within the workflow rule. The value is
            fixed for this action type and must be supported by the target
            module and trigger event.
          const: field_updates
        details:
          type: object
          description: >-
            Represents the read-only details of the associated field update
            action. Returned in GET responses and not required in POST or PUT
            requests.
          additionalProperties: false
          properties:
            module:
              $ref: '#/components/schemas/ModuleOrFieldNestedSchema'
              description: The module this action applies to.
        related_details:
          description: >-
            Specifies the lookup field when the field update targets a related
            module. Null when the update targets the workflow rule's own module.
          $ref: '#/components/schemas/FieldUpdateRelatedDetailsSchema'
        _delete:
          type: 'null'
          description: >-
            Indicates that this action should be removed from the workflow rule
            when set in a PUT request. Provide a null value to signal deletion.
      required:
        - type
        - id
    TaskAssociateActionSchema:
      type: object
      x-zs-$id: TaskAssociateActionSchema
      additionalProperties: false
      description: >-
        Represents an associate action that creates a task based on a
        pre-configured task template when the workflow rule condition is
        triggered.
      x-zs-llm-description: >-
        References a pre-configured task action entity by ID. Create the entity
        first via createWorkflowTasks, then use its ID here. Supports
        related_details.followup_details for auto-creating follow-up tasks on
        status change. Entity must be created for the correct module context.
      properties:
        id:
          type: string
          description: >-
            Represents the unique ID of the task action. Required to associate a
            pre-configured task with the workflow rule.
          maxLength: 20
          x-zs-$ref:
            resource: workflow_tasks
            origins:
              - operationId: getWorkflowTasks
                propertyId: WorkflowTaskId
        name:
          type: string
          description: >-
            Represents the display name of the TaskAssociate action. Returned in
            GET responses and derived from the referenced action configuration.
          maxLength: 500
        type:
          type: string
          description: >-
            Represents the action type discriminator that identifies this as a
            TaskAssociate action within the workflow rule. The value is fixed
            for this action type and must be supported by the target module and
            trigger event.
          const: tasks
        details:
          type: object
          description: >-
            Represents the read-only details of the associated task action.
            Returned in GET responses and not required in POST or PUT requests.
          additionalProperties: false
          properties:
            module:
              $ref: '#/components/schemas/ModuleOrFieldNestedSchema'
              description: The module this action applies to.
        related_details:
          description: >-
            Configures a followup task that is automatically created after the
            original task, based on a status condition and time delay. Null when
            no followup is configured.
          $ref: '#/components/schemas/TaskRelatedDetailsSchema'
        _delete:
          type: 'null'
          description: >-
            Indicates that this action should be removed from the workflow rule
            when set in a PUT request. Provide a null value to signal deletion.
      required:
        - type
        - id
    SimpleAssociateActionSchema:
      type: object
      x-zs-$id: SimpleAssociateActionSchema
      additionalProperties: false
      description: >-
        Represents an associate action that references a pre-configured action
        entity by its unique ID, applicable to action types such as webhooks,
        functions, and notifications.
      x-zs-llm-description: >-
        References a pre-configured action entity (webhooks, functions, sms,
        whatsapp) by type and ID. No related_details supported. Create entities
        via: webhooks->createWebhooks, functions->Create_Functions,
        sms/whatsapp->postMessageNotifications. Entity must target the correct
        module based on module_selection context.
      properties:
        id:
          type: string
          description: >-
            Represents the unique ID of the pre-configured action entity.
            Required to associate an existing action with the workflow rule.
          maxLength: 20
        name:
          type: string
          description: >-
            Represents the display name of the SimpleAssociate action. Returned
            in GET responses and derived from the referenced action
            configuration.
          maxLength: 500
        type:
          type: string
          description: |-
            Represents the type of associate action.
            Possible values:
            webhooks - HTTP callback to an external URL.
            functions - Custom function execution.
            email_notifications - Automated email notification.
            tasks - Task creation action.
          enum:
            - webhooks
            - functions
            - sms
            - whatsapp
        details:
          type: object
          description: >-
            Represents the read-only details of the associated action entity.
            Returned in GET responses and not required in POST or PUT requests.
          additionalProperties: false
          properties:
            module:
              $ref: '#/components/schemas/ModuleOrFieldNestedSchema'
              description: The module this action applies to.
        _delete:
          type: 'null'
          description: >-
            Indicates that this action should be removed from the workflow rule
            when set in a PUT request. Provide a null value to signal deletion.
      required:
        - type
        - id
    NonAssociateActionsNestedSchema:
      x-zs-$id: NonAssociateActionsNestedSchema
      description: >-
        Represents an inline action configuration that is defined directly
        within the workflow rule condition, rather than referencing a
        pre-created action entity by ID.
      x-zs-llm-description: >-
        Union (oneOf) for inline action configurations. Routes by type to:
        AssignOwnerActionSchema, CreateRecordActionSchema,
        AddMeetingActionSchema, ScheduleCallActionSchema, AddTagsActionSchema,
        RemoveTagsActionSchema, ConvertActionSchema,
        ChatNotificationActionSchema, CircuitsActionSchema,
        ZohoFlowActionSchema, SocialActionSchema, EmailCreateRecordActionSchema,
        CreateConnectedRecordActionSchema. Each carries type + details with full
        inline config.
      discriminator:
        propertyName: type
      oneOf:
        - $ref: '#/components/schemas/AssignOwnerActionSchema'
        - $ref: '#/components/schemas/CreateRecordActionSchema'
        - $ref: '#/components/schemas/CreateConnectedRecordActionSchema'
        - $ref: '#/components/schemas/AddMeetingActionSchema'
        - $ref: '#/components/schemas/ScheduleCallActionSchema'
        - $ref: '#/components/schemas/AddTagsActionSchema'
        - $ref: '#/components/schemas/RemoveTagsActionSchema'
        - $ref: '#/components/schemas/ConvertActionSchema'
        - $ref: '#/components/schemas/ChatNotificationActionSchema'
        - $ref: '#/components/schemas/CircuitsActionSchema'
        - $ref: '#/components/schemas/ZohoFlowActionSchema'
        - $ref: '#/components/schemas/SocialActionSchema'
        - $ref: '#/components/schemas/EmailCreateRecordActionSchema'
    RelatedDetailsNestedSchema:
      description: >-
        Represents the optional action-specific configuration attached to an
        associate action, such as best-time delivery settings for email
        notifications or lookup field references for field updates.
      x-zs-llm-description: >-
        Discriminator (oneOf) for action-specific supplementary configuration.
        Only three action types support related_details: email_notifications
        (best_time delivery), tasks (followup_details), and field_updates
        (lookup_field for cross-module targeting). Other action types do not use
        related_details.
      oneOf:
        - type: object
          x-zs-$id: RelatedDetailsBestTimeSchema
          description: >-
            Represents the email notification related details, including
            best-time delivery configuration.
          additionalProperties: false
          properties:
            best_time:
              type: boolean
              description: >-
                Indicates whether to send the email notification at the best
                time for the recipient. When set to true, the platform
                determines the optimal send time.
        - type: object
          x-zs-$id: RelatedDetailsFollowupSchema
          description: >-
            Represents the task related details, including followup task
            configuration.
          additionalProperties: false
          properties:
            followup_details:
              type: object
              description: >-
                Represents the followup task configuration, including the
                trigger condition and delay settings.
              additionalProperties: false
              properties:
                condition:
                  type: string
                  description: >-
                    Represents the task status condition that triggers the
                    followup task, such as **Completed** or **Not Started**.
                  maxLength: 255
                unit:
                  type: integer
                  format: int32
                  description: >-
                    Represents the numeric time value for the delay before
                    creating the followup task.
                period:
                  type: string
                  description: >-
                    Represents the time period label for the delay before
                    creating the followup task, such as **days**, **hours**, or
                    **minutes**.
                  maxLength: 50
        - type: object
          x-zs-$id: RelatedDetailsLookupFieldSchema
          description: >-
            Represents the field update related details, including the lookup
            field for cross-module updates.
          additionalProperties: false
          properties:
            lookup_field:
              $ref: '#/components/schemas/ModuleOrFieldNestedSchema'
              description: >-
                The lookup field linking the rule module to the target module
                (e.g., Account_Name on Contacts). Provide the field's id and
                api_name. When the field update targets the same module,
                related_details is null.
        - type: 'null'
          x-zs-$id: RelatedDetailsNullSchema
          description: >-
            Represents a null value indicating no related details are configured
            for this action.
    EmailNotificationRelatedDetailsSchema:
      description: >-
        Represents the optional related configuration details for email
        notification actions, including best-time delivery settings.
      x-zs-llm-description: >-
        Supplementary config for email_notifications associate action. Controls
        best-time delivery scheduling  -  when best_time=true, the email is sent
        at the recipient's optimal engagement time rather than immediately.
      oneOf:
        - type: object
          x-zs-$id: EmailNotificationRelatedDetailsBestTimeSchema
          additionalProperties: false
          description: >-
            Represents the best-time delivery configuration for the email
            notification action, controlling when the email sends to reach the
            recipient at the optimal delivery time.
          properties:
            best_time:
              type: boolean
              description: >-
                Indicates whether to send the email notification at the best
                time for the recipient. When set to true, the platform
                determines the optimal send time.
        - type: 'null'
          x-zs-$id: EmailNotificationRelatedDetailsNullSchema
          description: >-
            Represents a null value indicating best-time delivery is not
            configured for this email notification action.
    TaskRelatedDetailsSchema:
      description: >-
        Represents the optional related configuration details for task actions,
        specifying whether and how a followup task should be created.
      x-zs-llm-description: >-
        Supplementary config for tasks associate action. Configures automatic
        followup task creation based on condition/unit/period  -  creates a new
        followup task after the original task's status changes.
      oneOf:
        - type: object
          x-zs-$id: TaskRelatedDetailsFollowupSchema
          additionalProperties: false
          description: >-
            Represents the followup task configuration that defines the status
            condition and delay for automatically creating a followup task.
          properties:
            followup_details:
              type: object
              description: >-
                Represents the followup task configuration, including the
                trigger condition and delay settings.
              additionalProperties: false
              properties:
                condition:
                  type: string
                  description: >-
                    Represents the task status condition that triggers the
                    followup task, such as **Completed** or **Not Started**.
                  maxLength: 255
                unit:
                  type: integer
                  format: int32
                  description: >-
                    Represents the numeric time value for the delay before
                    creating the followup task.
                period:
                  type: string
                  description: >-
                    Represents the time period label for the delay before
                    creating the followup task, such as **days**, **hours**, or
                    **minutes**.
                  maxLength: 50
        - type: 'null'
          x-zs-$id: TaskRelatedDetailsNullSchema
          description: >-
            Represents a null value indicating no followup task is configured
            for this task action.
    FieldUpdateRelatedDetailsSchema:
      description: >-
        Represents the optional related configuration details for field update
        actions, specifying the lookup field used for cross-module field
        updates.
      x-zs-llm-description: >-
        Supplementary config for field_updates associate action. Specifies
        lookup_field ({api_name, id}) to target a related module's field via a
        lookup relationship. Set to null for same-module field updates.
      oneOf:
        - type: object
          x-zs-$id: FieldUpdateRelatedDetailsLookupSchema
          additionalProperties: false
          description: >-
            Represents the lookup field configuration that identifies the
            related module record for cross-module field update actions.
          properties:
            lookup_field:
              $ref: '#/components/schemas/ModuleOrFieldNestedSchema'
              description: >-
                The lookup field linking the rule module to the target module
                (e.g., Account_Name on Contacts). Provide the field's id and
                api_name.
        - type: 'null'
          x-zs-$id: FieldUpdateRelatedDetailsNullSchema
          description: >-
            Represents a null value indicating the field update targets the
            workflow rule own module with no lookup field required.
    CreatedModifiedByObjectSchema:
      type: object
      additionalProperties: false
      description: >-
        Represents the identity details of the CRM user who created or last
        modified the workflow rule.
      x-zs-llm-description: >-
        User reference object containing name and id. Used in GET responses for
        created_by and modified_by fields showing who created or last modified
        the workflow rule.
      properties:
        name:
          type: string
          format: string
          description: >-
            Represents the name of the CRM user who created or last modified the
            workflow rule.
        id:
          type: string
          format: string
          description: Represents the unique ID of the CRM user.
    TimeObjectSchema:
      type:
        - string
        - 'null'
      format: date-time
      description: >-
        Represents a time offset specification combining a period label and a
        numeric magnitude, used in time-based workflow trigger configurations.
      x-zs-llm-description: >-
        Timestamp object used in GET responses for created_time, modified_time,
        and last_executed_time fields.
      maxLength: 255
    LockStatusSchema:
      type: object
      additionalProperties: false
      description: >-
        Represents the lock configuration of a workflow rule, including the lock
        state and the identity of the user who applied the lock.
      x-zs-llm-description: >-
        Lock state of a workflow rule. Contains status (boolean  -  is currently
        locked), locked_by (user object), and message (lock reason string).
        Locked rules cannot be deleted or updated  -  returns RECORD_LOCKED
        error.
      properties:
        locked_by:
          description: Represents the details of the CRM user who locked the workflow rule.
          oneOf:
            - $ref: '#/components/schemas/LockedByObjectSchema'
            - type: 'null'
              x-zs-$id: LockedByNullSchema
              description: >-
                Represents a null value indicating the workflow rule is not
                currently locked by any user.
        message:
          description: >-
            Represents the note or label indicating the reason or context for
            locking the rule.
          type:
            - string
            - 'null'
          format: string
        status:
          type: boolean
          description: |-
            Indicates whether the workflow rule is locked.
            Possible values:
            true - The rule is locked.
            false - The rule is not locked.
      title: Lock Status
    LockedByObjectSchema:
      type: object
      x-zs-$id: LockedByObjectSchema
      additionalProperties: false
      description: >-
        Represents the identity of the CRM user who locked the workflow rule,
        including their display name and unique ID.
      x-zs-llm-description: >-
        User reference within lock status showing who locked the workflow rule.
        Contains name and id.
      properties:
        name:
          type: string
          format: string
          description: Represents the name of the CRM user who locked the workflow rule.
        id:
          type: string
          format: string
          description: >-
            Represents the unique ID of the CRM user who locked the workflow
            rule.
    ActivationStatusSchema:
      type: object
      additionalProperties: false
      description: >-
        Represents the activation state of a workflow rule, indicating whether
        the rule is currently active.
      x-zs-llm-description: >-
        Activation state as returned in GET responses. Contains active
        (boolean). Used in the status property of the rule entity. To change:
        PUT with status.active=true/false.
      properties:
        active:
          type: boolean
          description: >-
            Indicates whether the workflow rule is currently active.


            Possible values:

            true - The workflow rule is active and executes its configured
            actions when trigger conditions are met.

            false - The workflow rule is inactive and does not execute, even
            when trigger conditions are met.
      title: Activation Status
    WorkflowActionCountsResponseSchema:
      type: object
      additionalProperties: false
      description: >-
        Represents the response body containing the action count breakdown for
        one or more workflow rules, grouped by condition.
      x-zs-llm-description: >-
        Response from getWorkflowRulesActionsCount. Contains workflow_rules
        array where each entry has rule id and conditions array with
        per-condition action counts split by instant and scheduled types.
      properties:
        workflow_rules:
          type: array
          description: >-
            Represents the array of workflow rule objects with their action
            count details.
          items:
            $ref: '#/components/schemas/WorkflowRuleActionCountGroupSchema'
          maxItems: 10
      required:
        - workflow_rules
      title: Workflow Action Counts Response
      x-zs-$id: GetactionscountResponse200
    WorkflowRuleActionCountGroupSchema:
      type: object
      additionalProperties: false
      description: >-
        Represents the action count breakdown for a single workflow rule,
        encapsulating the rule ID and its associated condition-level action
        count groups.
      x-zs-llm-description: >-
        Single rule entry in the action counts response. Contains the rule id
        and conditions array listing action count summaries per condition.
      properties:
        id:
          type: string
          description: >-
            Represents the unique ID of the WorkflowRuleActionCountGroup within
            the workflow rule.
          maxLength: 20
        conditions:
          type: array
          description: >-
            Represents array of condition objects containing criteria and
            actions for this rule.
          items:
            $ref: '#/components/schemas/WorkflowConditionActionCountSummarySchema'
          maxItems: 10
      required:
        - conditions
        - id
      title: Workflow Rule Action Count Group
    WorkflowConditionActionCountSummarySchema:
      type: object
      additionalProperties: false
      description: >-
        Represents the action count summary for a single workflow rule
        condition, including the condition ID, sequence number, and counts for
        instant and scheduled actions.
      x-zs-llm-description: >-
        Per-condition action count breakdown. Contains sequence_number, id
        (condition ID), instant_actions (count by type), and scheduled_actions
        (count by type). Use to check slot availability.
      properties:
        sequence_number:
          type: integer
          format: int32
          description: >-
            Represents the execution order of this condition within the workflow
            rule, starting from one.
        instant_actions:
          oneOf:
            - $ref: '#/components/schemas/ActionsCountSummarySchema'
            - type: 'null'
              x-zs-$id: LockedByNullSchema2
              description: >-
                Represents a null value indicating no instant actions are
                configured for this condition.
        scheduled_actions:
          type:
            - array
            - 'null'
          description: >-
            Represents the array of scheduled action groups configured for this
            condition.
          items:
            $ref: '#/components/schemas/ActionsCountSummarySchema'
          maxItems: 5
        id:
          type: string
          description: >-
            Represents the unique ID of the WorkflowConditionActionCountSummary
            within the workflow rule.
          maxLength: 20
      required:
        - id
        - instant_actions
        - scheduled_actions
        - sequence_number
      title: Workflow Condition Action Count Summary
    ActionsCountSummarySchema:
      type: object
      x-zs-$id: ActionsCountSummarySchema
      additionalProperties: false
      description: >-
        Represents a summary of execution count entries for instant actions in a
