  /settings/automation/workflow_rules/actions/rules_count:
    get:
      summary: |
        Get Workflow Rule Quota and Usage Counts
      description: >
        To retrieve the organization-level quota and current usage counts for
        workflow rules and actions in your Zoho CRM organization. The response
        includes the total and active rule limits (both organization-wide and
        per module), the number of rules currently configured, and the per-rule
        limits for actions and scheduled action groups.
      x-zs-llm-description: >-
        Returns org-level workflow rules quota: configured vs maximum allowed
        rules and actions for your plan. Call this before postWorkflowRule to
        verify you have capacity. Also reveals per-rule limits (max conditions,
        max scheduled actions).
      security:
        - OAuth2:
            - ZohoCRM.settings.workflow_rules.READ
      operationId: getWorkflowRulesCount
      responses:
        '200':
          description: >
            Returns the organization-level workflow rule quota and current usage
            counts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowRulesCountResponseSchema'
              examples:
                Success200:
                  summary: |
                    Successful retrieval of workflow rule quota and usage counts
                  value:
                    rules_count:
                      scheduled_actions_per_rule_limit: 5
                      total_rules_limit: 2500
                      active_rules_configured: 2
                      rules_per_process_limit: 10
                      total_rules_limit_per_module: 125
                      active_rules_limit: 2000
                      total_rules_configured: 2
                      active_rules_limit_per_module: 75
                      total_actions_per_rule_limit: 50
                  description: >
                    Returns workflow rule quota details for an organization with
                    two total rules configured and two active rules, against a
                    total limit of 2,500 rules and an active limit of 2,000
                    rules.
        '403':
          description: >
            The caller does not have permission to retrieve workflow rule
            counts, or the feature is not available in the current Zoho CRM
            edition.

            **Resolution:** The CRM administrator must grant the
            `Crm_Implied_Manage_Workflow` permission to the user's profile in
            Zoho CRM.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoPermissionSchema'
              examples:
                NoPermissionResponse:
                  summary: >
                    Access denied due to missing permission or unsupported
                    edition
                  value:
                    code: NO_PERMISSION
                    details:
                      permissions:
                        - Crm_Implied_Manage_Workflow
                    message: feature not available in this edition
                    status: error
                  description: >
                    Returned when the caller lacks the
                    `Crm_Implied_Manage_Workflow` permission or the feature is
                    not available in the current Zoho CRM edition.
  /settings/automation/workflow_rules/{workflowRuleId}/actions/usage:
    get:
      summary: Retrieve Action Usage for a Workflow Rule
      description: >-
        To retrieve the action usage report for a specific workflow rule in your
        Zoho CRM organization, including trigger count and per-action success,
        failure, and queue metrics, as well as email engagement statistics.
        Results are scoped to a configurable date range.
      x-zs-llm-description: >-
        Returns execution metrics for a specific workflow rule: trigger count,
        per-action success/failure counts, email engagement stats (sent, opened,
        clicked, bounced). Supports date range filtering via executed_from and
        executed_till (yyyy-MM-dd). Use to monitor rule health.
      operationId: getWorkflowRuleUsage
      security:
        - OAuth2:
            - ZohoCRM.settings.workflow_rules.READ
      parameters:
        - $ref: '#/components/parameters/ParamQueryExecutedFrom'
        - $ref: '#/components/parameters/ParamQueryExecutedTill'
        - $ref: '#/components/parameters/ParamPathWorkflowRuleId'
      responses:
        '200':
          description: >-
            Returns detailed execution usage metrics for the specified workflow
            rule, including trigger counts, conditions breakdowns, and instant
            and scheduled action usage statistics within the queried date range.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowRuleUsageResponseSchema'
              examples:
                Success200:
                  summary: Successful retrieval of workflow rule action usage metrics
                  value:
                    workflow_rules:
                      - trigger_count: 3
                        name: High Value Lead Rule
                        id: '4876876000013248001'
                        conditions:
                          - instant_actions:
                              actions:
                                - queue_count: 0
