    put:
      operationId: updateWorkflowRule
      summary: |
        Update workflow rules by ID in the request body
      description: >
        To update one or more existing workflow rules in your Zoho CRM
        organization, submit a `workflow_rules` array in the request body with
        each entry containing the rule's `id`. You can modify a rule's name,
        description, criteria, conditions, actions, and active status. Triggers
        may be updated only within the same trigger type — changing from one
        trigger category to another (for example, from a Record Action trigger
        to a Score-based trigger) is not supported. The module associated with a
        workflow rule cannot be changed after creation. To remove an existing
        condition or action, include it in the request with `_delete` set to
        `null`. Use the [Get Workflow Rules
        API](workflow_rules.yaml#$.paths./settings/automation/workflow_rules.get)
        to retrieve rule IDs before calling this operation.
      x-zs-llm-description: >-
        Updates one or more workflow rules identified by id in the request body.
        Supports partial updates  include only fields to change. Omitted actions
        are preserved; to remove an action set _delete: null. Cannot change
        module after creation. Locked rules return RECORD_LOCKED. Always GET the
        current rule first to avoid overwriting concurrent changes.
      security:
        - OAuth2:
            - ZohoCRM.settings.workflow_rules.UPDATE
      requestBody:
        description: Workflow rule configuration payload.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWorkflowRuleSchema'
            examples:
              SamplePutRequest:
                summary: Sample request body
                value:
                  workflow_rules:
                    - execute_when:
                        type: create_or_edit
                        details:
                          repeat: true
                          trigger_module:
                            api_name: Contacts
                            id: '3361265000000000129'
                      conditions:
                        - criteria_details:
                            criteria:
                              field:
                                api_name: Department
                                id: '3361265000000000455'
                              comparator: equal
                              value: ${EMPTY}
                          instant_actions:
                            actions:
                              - id: '3361265000006492245'
                                name: 'To users : user2 testUser, testUser1'
                                type: assign_owner
                                details:
                                  module:
                                    api_name: Vendors
                                  assign_to:
                                    - resource:
                                        id: '3361265000002134004'
                                        name: user2 testUser
                                      type: user
                                    - resource:
                                        id: '3361265000002134024'
                                        name: testUser1
                                      type: user
                                  related_records: null
                                  notify: false
                                  apply_assignment_threshold: false
                                  user_availability_based_on: null
                              - id: '3361265000006458562'
                                type: email_notifications
                                name: EmailNotification
                          scheduled_actions:
                            - id: '3361265000006526070'
                              actions:
                                - type: remove_tags
                                  name: criteria
                                  details:
                                    tags:
                                      - id: '3361265000001715141'
                                        name: criteria
                                        color_code: '#879BFC'
                                    module:
                                      api_name: Contacts
                                      id: '3361265000000000129'
                          id: '3361265000006492242'
                          sequence_number: 1
                      id: '3361265000006492241'
            x-zs-llm-examples:
              - SamplePutRequest
      responses:
        '200':
          description: Workflow Rule updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowSuccessSchema'
              examples:
                SuccessResponse:
                  summary: PUT- Success response for status 200
                  value:
                    workflow_rules:
                      - code: SUCCESS
                        details:
                          id: '3361265000006294001'
                        message: workflow updated
                        status: success
        '400':
          description: >
            The response returned when the request contains invalid, missing, or
            unsupported data. Resolution: review the error details to identify
            the field or value that failed validation, correct it, and resubmit
            the request.
          content:
            application/json:
              schema:
                x-zs-$id: WorkflowRuleUpdateErrorResponses
                oneOf:
                  - type: object
                    x-zs-$id: WorkflowRuleUpdateErrorResponse
                    additionalProperties: false
                    description: Wrapped error response with workflow_rules
                    properties:
                      workflow_rules:
                        type: array
                        description: Array of error objects
                        items:
                          oneOf:
                            - $ref: '#/components/schemas/DependentFieldMissingSchema'
                            - $ref: '#/components/schemas/AlreadyUsedSchema'
                            - $ref: '#/components/schemas/ExpectedFieldMissingSchema'
                            - $ref: >-
                                #/components/schemas/AmbiguityDuringProcessingSchema
                            - $ref: '#/components/schemas/LimitExceededSchema'
                            - $ref: '#/components/schemas/CannotRemoveSchema'
                            - $ref: '#/components/schemas/RequiredDataNotFoundSchema'
                            - $ref: '#/components/schemas/FailureSchema'
                        maxItems: 25
                    required:
                      - workflow_rules
              examples:
                InvalidConditionId:
                  summary: >-
                    Error response with code INVALID_DATA: This given
                    conditionid seems to be invalid
                  value:
                    workflow_rules:
                      - code: INVALID_DATA
                        details:
                          api_name: id
                          json_path: $.workflow_rules[0].conditions[0].id
                        message: This given conditionid seems to be invalid
                        status: error
                DependentFieldMissingResponse1:
                  summary: >-
                    Error response with code DEPENDENT_FIELD_MISSING: Dependent
                    Field missing (Field: details)
                  value:
                    workflow_rules:
                      - code: DEPENDENT_FIELD_MISSING
                        details:
                          dependee:
                            api_name: type
                            json_path: >-
                              $.workflow_rules[0].conditions[0].instant_actions.actions[1].type
                          api_name: id
                          json_path: >-
                            $.workflow_rules[0].conditions[0].instant_actions.actions[1].id
                        message: Dependent Field missing
                        status: error
                DuplicateActionNotAllowedResponse:
                  summary: >-
                    Error response with code INVALID_DATA: Duplicate action not
                    allowed
                  value:
                    workflow_rules:
                      - code: DUPLICATE_DATA
                        details:
                          api_name: actions
                          json_path: >-
                            $.workflow_rules[0].conditions[0].instant_actions.actions[0]
                        message: Duplicate action not allowed
                        status: error
                AlreadyUsedResponse:
                  summary: >-
                    Error response with code ALREADY_USED: The condition is
                    already used in the mentioned workflow
                  value:
                    workflow_rules:
                      - code: ALREADY_USED
                        details:
                          api_name: criteria_details
                          exists_in:
                            api_name: criteria_details
                            json_path: $.workflow_rules[0].conditions[0].criteria_details
                          json_path: $.workflow_rules[0].conditions[1].criteria_details
                        message: duplicate criteria details.
                        status: error
                CannotRemoveLastActionResponse:
                  summary: >-
                    Error response with code CANNOT_REMOVE: cannot delete the
                    last remaining action from a condition
                  value:
                    workflow_rules:
                      - code: CANNOT_REMOVE
                        details: {}
                        message: Actions cannot be empty
                        status: error
                NoUrlIdResponse:
                  summary: >-
                    Error response with code INVALID_DATA: Workflow Rule Id is
                    missing in the request body
                  value:
                    workflow_rules:
                      - code: MANDATORY_NOT_FOUND
                        details:
                          api_name: id
                          json_path: $.workflow_rules[0].id
                        message: The workflow processid is mandatory
                        status: error
                InvalidRuleIdResponse:
                  summary: >-
                    Error response with code INVALID_DATA: the id given seems to
                    be invalid
                  value:
                    workflow_rules:
                      - code: INVALID_DATA
                        details:
                          api_name: id
                          json_path: $.workflow_rules[0].id
                        message: the id given seems to be invalid
                        status: error
        '403':
          description: >
            Forbidden. The authenticated user does not have permission to
            perform this operation, or the workflow rules feature is not
            available in the current CRM edition. Resolution: verify the user's
            permissions and the organization's edition capabilities.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoPermissionSchema'
              examples:
                NoPermissionResponse:
                  summary: Error response for status 403
                  value:
                    code: NO_PERMISSION
                    details:
                      permissions:
                        - Crm_Implied_Manage_Workflow
                    message: feature not available in this edition
                    status: error
    get:
      summary: |
        List Workflow Rules in your Zoho CRM Organization
      description: >
        To retrieve the list of workflow rules configured in your Zoho CRM
        organization, including their trigger conditions, module associations,
        and action configurations. By default, each rule includes only
        summary-level data; set the `include_inner_details` parameter to `true`
        to include full condition criteria and action configurations in the
        response. Results are paginated and can be filtered by module,
        activation status, trigger type, or rule name.
      x-zs-llm-description: >-
        Lists workflow rules with optional filters: module (api_name),
        status_active (bool), execute_on (trigger type). Set
        include_inner_details=true to get full conditions, criteria, and action
        configurations  without it only summary metadata is returned. Paginated:
        page + per_page (max 200). Use this to discover rule IDs before
        PUT/DELETE operations.
      operationId: getWorkflowRules
      security:
        - OAuth2:
            - ZohoCRM.settings.workflow_rules.READ
      parameters:
        - $ref: '#/components/parameters/ParamQueryPageSchema'
        - $ref: '#/components/parameters/ParamQueryPerPageSchema'
        - $ref: '#/components/parameters/ParamQueryModuleSchema'
        - $ref: '#/components/parameters/ParamQueryStatusActiveSchema'
        - $ref: '#/components/parameters/ParamQueryExecuteOnSchema'
        - $ref: '#/components/parameters/ParamQuerySortOrderSchema'
        - $ref: '#/components/parameters/ParamQuerySortBySchema'
        - $ref: '#/components/parameters/ParamQueryIncludeInnerDetailsSchema'
        - $ref: '#/components/parameters/ParamQueryFilterSchema'
