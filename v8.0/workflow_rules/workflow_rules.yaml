      x-zs-llm-description: >-
        Collection of action-type-to-count pairs within a condition. Contains
        actions_count array where each entry maps an action type to its
        configured count.
      properties:
        actions_count:
          type: array
          description: >-
            Represents the list of action count entries, each categorized by
