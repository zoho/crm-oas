          type: string
          description: >-
            Represents the unique ID of the Social action within the workflow
            rule.
          maxLength: 20
        _delete:
          type: 'null'
          description: >-
            Indicates that this action should be removed from the workflow rule
            when set in a PUT request. Provide a null value to signal deletion.
      required:
        - type
    EmailCreateRecordActionSchema:
      type: object
      x-zs-$id: EmailCreateRecordActionSchema
      additionalProperties: false
      description: >-
        Represents a non-associate action that creates a record via an
        email-based trigger, applicable to modules such as Leads or Contacts.
      x-zs-llm-description: >-
        Limit: one create_record_email action per rule. Before constructing it,
