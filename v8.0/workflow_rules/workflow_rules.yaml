          description: Represents action counts broken down by CRM module.
          items:
            $ref: '#/components/schemas/ModuleSpecificActionsCountSchema'
          maxItems: 500
      required:
        - module_specific_count
      title: Module-Specific Counts Response (Alternate)
    ModuleSpecificActionsCountSchema:
      type: object
      additionalProperties: false
      description: >-
        Represents the workflow rule count details for a specific CRM module,
