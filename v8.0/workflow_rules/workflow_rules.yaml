          maxLength: 255
        success_count:
          type: integer
          format: int32
          description: >-
            Represents the total number of successful executions recorded for
            this tagged action within the queried date range.
        tag_id:
          type: string
          description: Represents the unique ID of the tag associated with this action.
          maxLength: 20
        failure_count:
          type: integer
          format: int32
          description: >-
            Represents the total number of failed executions recorded for this
            tagged action within the queried date range.
        id:
          type: string
          description: >-
            Represents the unique ID of the TaggedActionUsageMetrics within the
            workflow rule.
          maxLength: 20
        type:
          type: string
          description: >-
            Represents the category of tagged workflow action executed by the
            rule.
          maxLength: 255
        associated_time:
          type: string
          description: >-
            Represents the ISO 8601 timestamp indicating when this tagged action
            was last associated with or modified on a workflow rule.
          maxLength: 255
      required:
        - associated_time
        - failure_count
        - id
        - name
        - success_count
        - tag_id
        - type
      title: Tagged Action Usage Metrics
    ScheduledActionsForWorkflowUsageSchema:
      type: array
      description: >-
        Represents the list of scheduled action groups for a workflow rule, each
        group containing the actions and their execution usage metrics.
      x-zs-llm-description: >-
        Container for scheduled action usage groups in the rule usage response.
        Lists action groups by their scheduled delay.
      maxItems: 5
      items:
        type: object
        description: >-
          Represents a scheduled action group configured for the workflow rule,
          including its execute-after delay and the list of actions within the
          group.
        additionalProperties: false
        properties:
          id:
            type: string
            format: string
            description: Represents unique identifier for the scheduled action.
          actions:
            type: array
            description: >-
              Represents the list of action execution records within this
              scheduled action group.
            maxItems: 5
            items:
              type: object
              description: >-
                Represents the usage details for a single action within the
                scheduled action group.
              additionalProperties: false
              properties:
                id:
                  type: string
                  format: string
                  description: Represents the unique ID of the executed action.
                name:
                  type: string
                  format: string
                  description: Represents the name of the executed action.
                type:
                  type: string
                  format: string
                  description: >-
                    Represents the type of action executed, such as
                    **email_notifications**.
                queue_count:
                  type: integer
                  format: int32
                  description: >-
                    Represents the number of execution instances currently in
                    queue for this action.
                success_count:
                  type: integer
                  format: int32
                  description: >-
                    Represents the number of successful executions for this
                    action within the date range.
                failure_count:
                  type: integer
                  format: int32
                  description: >-
                    Represents the number of failed executions for this action
                    within the date range.
                associated_time:
                  type: string
                  format: date-time
                  description: >-
                    Represents the ISO 8601 timestamp when this action was last
                    executed or associated.
                related_details:
                  type: object
                  description: >-
                    Represents additional information related to the action
                    execution, such as email notification performance metrics.
                  additionalProperties: true
                  properties: {}
              required:
                - id
                - name
                - type
                - queue_count
                - success_count
                - failure_count
                - associated_time
        required:
          - id
          - actions
    InstantActionsUsageListSchema:
      type: object
      additionalProperties: false
      description: >-
        Represents a container for the list of instant action usage detail
        objects associated with a workflow rule condition.
      x-zs-llm-description: >-
        Container for instant action usage metrics without tag information.
        Contains actions array with per-action success/failure/queue counts.
      properties:
        actions:
          type: array
          description: >-
            Represents the array of action usage detail objects for the instant
            actions configured in this condition.
          items:
            x-zs-$id: InstantActionsUsageListItemsSchema
            oneOf:
              - $ref: '#/components/schemas/QueuedActionUsageMetricsSchema'
              - $ref: '#/components/schemas/ActionUsageMetricsSchema'
          maxItems: 5
      required:
        - actions
      title: Instant Actions Usage List
    ScheduledActionsUsageGroupSchema:
      type: object
      additionalProperties: false
      description: >-
        Represents a single scheduled action group within a workflow rule,
        containing the group ID and usage metrics for each action in the group.
      x-zs-llm-description: >-
        A scheduled action group in usage. Contains group id and actions array
        with per-action execution metrics.
      properties:
        id:
          type: string
          description: >-
            Represents the unique ID of the ScheduledActionsUsageGroup within
            the workflow rule.
          maxLength: 255
        actions:
          type: array
          description: >-
            Represents the array of action usage detail objects within this
            scheduled action group.
          items:
            $ref: '#/components/schemas/QueuedActionUsageMetricsSchema'
          maxItems: 5
      required:
        - actions
        - id
      title: Scheduled Actions Usage Group
    QueuedActionUsageMetricsSchema:
      type: object
      x-zs-$id: QueuedActionUsageMetricsSchema
      additionalProperties: false
      description: >-
        Represents usage metrics for a single queued workflow action, including
        success, failure, and queue counts within a queried date range.
      x-zs-llm-description: >-
        Action usage entry with queue tracking. Contains queue_count (pending
        executions), success_count, failure_count, related_details (email
        engagement if applicable), name, id, type, and associated_time.
      properties:
        queue_count:
          type: integer
          format: int32
          description: >-
            Represents the number of executions currently queued and pending for
            this action.
        related_details:
          $ref: '#/components/schemas/EmailEngagementMetricsSchema'
        name:
          type: string
          description: >-
            Represents the display name of the workflow rule or its associated
            queued action as configured in Zoho CRM.
          maxLength: 255
        success_count:
          type: integer
          format: int32
          description: >-
            Represents the total number of successful executions recorded for
            this queued action within the queried date range.
        failure_count:
          type: integer
          format: int32
          description: >-
            Represents the total number of failed executions recorded for this
            queued action within the queried date range.
        id:
          type: string
          description: >-
            Represents the unique ID of the QueuedActionUsageMetrics within the
            workflow rule.
          maxLength: 20
        type:
          type: string
          description: >-
            Represents the category of queued workflow action. Possible values
            include **email_notifications**, **field_updates**, **tasks**,
            **webhooks**, **functions**, **assign_owner**, **add_tags**,
            **remove_tags**, **create_record**, **add_meeting**,
            **schedule_call**, and **convert**.
          maxLength: 255
        associated_time:
          type: string
          description: >-
            Represents the ISO 8601 timestamp indicating when this queued action
            was last associated with or modified on a workflow rule.
          maxLength: 255
      required:
        - associated_time
        - failure_count
        - id
        - name
        - queue_count
        - related_details
        - success_count
        - type
      title: Queued Action Usage Metrics
    EmailEngagementMetricsSchema:
      type: object
      additionalProperties: false
      description: >-
        Represents email engagement metrics for an email notification action,
        including sent, delivered, opened, clicked, bounced, and unsent counts.
      x-zs-llm-description: >-
        Email-specific engagement stats within action usage. Contains sent,
        delivered, opened, clicked, bounced, unsent, unopened counts,
        sent_percentage, and bulk_mail flag. Only populated for
        email_notifications actions.
      properties:
        bulk_mail:
          type: boolean
          description: Represents number of bulk email messages sent.
        unopened:
          type: integer
          format: int32
          description: Represents number of emails not opened by recipients.
        sent_percentage:
          type: integer
          format: int32
          description: >-
            Represents percentage of emails successfully sent out of total
            attempted.
        opened:
          type: integer
          format: int32
          description: Represents number of emails opened by recipients.
        delivered:
          type: integer
          format: int32
          description: Represents number of emails successfully delivered.
        unsent:
          type: integer
          format: int32
          description: Represents number of emails that failed to send.
        bounced:
          type: integer
          format: int32
          description: Represents number of emails that bounced back.
        clicked:
          type: integer
          format: int32
          description: Represents number of emails where recipients clicked a link.
        sent:
          type: integer
          format: int32
          description: Represents total number of emails sent.
      required:
        - bounced
        - bulk_mail
        - clicked
        - delivered
        - opened
        - sent
        - sent_percentage
        - unopened
        - unsent
      title: Email Engagement Metrics
    ActionUsageMetricsSchema:
