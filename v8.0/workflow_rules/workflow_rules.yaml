    WorkflowConditionUsageSummarySchema:
      type: object
      x-zs-$id: WorkflowConditionUsageSummarySchema
      additionalProperties: false
      description: >-
        Represents the execution usage summary for a single workflow rule
        condition, including total execution count and breakdowns for instant
        and scheduled action groups.
      x-zs-llm-description: >-
        Per-condition usage metrics. Contains instant_actions (list of action
