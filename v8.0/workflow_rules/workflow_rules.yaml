          items:
            $ref: '#/components/schemas/AutomationFieldMappings'
            description: >-
              Represents a single field-to-value mapping entry for the new Call
              record, conforming to the AutomationFieldMappings schema. Each
              entry identifies a target Call field and specifies the value
              resolution strategy: static for literal values, merge_field for
              runtime token substitution, or execution_time for dynamically
              resolved DateTime and ALARM fields.
          minItems: 1
          maxItems: 25
        apply_restriction:
          type:
            - boolean
            - 'null'
          description: >-
            Whether to enforce assignment-threshold rules (record count limits
            per user) on the record owner when creating the Call record. When
            true, the system checks whether the owner has reached their record
            limit before creating the record. Only effective when the org has
            assignment thresholds configured.
          default: false
        id:
          type: string
          description: >-
            Server-generated unique identifier for this schedule call action.
            Present only in GET responses; not required in POST requests.
          maxLength: 20
          example: '111111000000002421'
      required:
        - module
        - layout
        - field_mappings
      title: Automation Schedule Call Details
    AutomationTagRef:
      x-zs-$id: AutomationTagRef
      type: object
      additionalProperties: false
      description: >-
        PURPOSE: Tag reference for add_tags/remove_tags. Tags must pre-exist -
        GET /settings/tags?module={api_name} to list, POST to create. MANDATORY:
        id, name. Both must resolve to same tag (AMBIGUITY_DURING_PROCESSING if
        mismatch). Non-existent = INVALID_DATA. Limits: 100 tags/module, 10
        tags/record, name max 25 chars.
      x-zs-llm-description: >-
        Tag reference for add_tags/remove_tags. Both id and name are mandatory 
        missing either returns MANDATORY_NOT_FOUND. Tags must pre-exist.
        Discover via getTags?module={api_name}, create via POST /settings/tags.
        Invalid tag id returns INVALID_DATA.
      properties:
        id:
          type: string
          description: >-
            Unique identifier of the tag. Obtain from GET
            /settings/tags?module={module_api_name}. If provided alone, the tag
            is resolved by ID. If both id and name are provided, they must
            resolve to the same tag.
          maxLength: 20
          example: '3361265000001715141'
        name:
          type: string
          description: >-
            Name of the tag. Obtain from GET
            /settings/tags?module={module_api_name}. If provided alone, the tag
            is resolved by name. Must match an existing tag  - providing a
            non-existent name returns INVALID_DATA. Max 25 characters, cannot
            contain <, >, commas, or emojis.
          maxLength: 25
          example: criteria
        color_code:
          type: string
          description: >-
            Hex color code of the tag (e.g., '#879BFC'). Optional in requests;
            present in GET responses. Allowed values: #F17574, #F48435, #E7A826,
            #A8C026, #63C57E, #1DB9B4, #57B1FD, #879BFC, #D297EE, #FD87BD,
            #969696, #658BA8, #B88562.
          maxLength: 25
          example: '#879BFC'
      required:
        - id
        - name
      title: Automation Tag Reference
    AutomationAddTagsDetails:
      x-zs-$id: AutomationAddTagsDetails
      type: object
      additionalProperties: false
      description: >-
        PURPOSE: Details object for add_tags action. Adds pre-existing tags to
        the triggering record. PREREQUISITES: Tags must exist - GET
        /settings/tags?module={api_name} to list, POST to create first.
        MANDATORY: tags (array 1-10, each {id, name}). OPTIONAL: over_write
        (bool, default false - true replaces ALL existing tags), module
        ({api_name, id}). CONSTRAINTS: Not allowed with convert on Leads
        (AMBIGUITY_DURING_PROCESSING). over_write=true + remove_tags in same
        rule = INVALID_DATA. Unsupported: Visits, Users, LinkingModules
        (NOT_ALLOWED).
      x-zs-llm-description: >-
        Details for type='add_tags'. Requires tags array (1-10, each {id,
        name}). Optional: over_write (true replaces all existing tags), module
        ({api_name, id}). Cannot coexist with convert on Leads. over_write=true
        + remove_tags in same rule = INVALID_DATA. Tags must pre-exist  discover
        via getTags or create via POST.
      properties:
        over_write:
          type: boolean
          description: >-
            Whether to overwrite all existing tags on the record with the
            specified tags (true) or append to existing tags (false). Default is
            false. When set to true, any RemoveTags action in the same workflow
            rule becomes invalid and returns INVALID_DATA ('Remove tag not
            supported with Overwrite Add Tag').
          default: false
        tags:
          type: array
          description: >-
            List of tags to add to the record. All tags must pre-exist in the
            org  - fetch available tags from GET
            /settings/tags?module={module_api_name}. To create new tags: POST
            /settings/tags?module={module_api_name}. If the list is empty after
            parsing, the API returns FAILURE ('Empty Tag'). If the tag count
            exceeds the edition limit, the API returns FAILURE ('Invalid Tag
            Count').
          items:
            $ref: '#/components/schemas/AutomationTagRef'
            description: >-
              Represents a tag reference, conforming to the AutomationTagRef
              schema, that identifies a pre-existing org tag to be added to the
              record. Both id and name are mandatory fields on each entry; the
              referenced tag must already exist in the org before the action
              executes.
          minItems: 1
          maxItems: 10
        module:
          $ref: '#/components/schemas/AutomationModuleRef'
          description: >-
            Target module for the tag action. Must match the workflow rule's
            trigger module. Supported modules: Leads, Accounts, Contacts, Deals,
            Campaigns, Tasks, Cases, Events, Calls, Solutions, Products,
            Vendors, Price_Books, Quotes, Sales_Orders, Purchase_Orders,
            Invoices, and custom modules. Unsupported modules (Visits, Users,
            LinkingModules) return NOT_ALLOWED.
        id:
          type: string
          description: >-
            Server-generated unique identifier for this add tags action. Present
            only in GET responses; not required in POST requests.
          maxLength: 20
          example: '111111000000002440'
      required:
        - tags
      title: Automation Add Tags Details
    AutomationRemoveTagsDetails:
      x-zs-$id: AutomationRemoveTagsDetails
      type: object
      additionalProperties: false
      description: >-
        PURPOSE: Details object for remove_tags action. Removes tags from the
        triggering record. PREREQUISITES: Tags must exist - GET
        /settings/tags?module={api_name} to list. MANDATORY: tags (array 1-10,
        each {id, name}). OPTIONAL: module ({api_name, id}). CONSTRAINTS: Not
        allowed with convert on Leads (AMBIGUITY_DURING_PROCESSING). If same
        rule has add_tags with over_write=true, this returns INVALID_DATA.
        Unsupported: Visits, Users, LinkingModules (NOT_ALLOWED). Note:
        over_write field is type-checked but its value is ignored for
        remove_tags.
      x-zs-llm-description: >-
        Details for type='remove_tags'. Requires tags array (1-10, each {id,
        name}). Optional: module ({api_name, id}). Cannot coexist with convert
        on Leads. Invalid if same rule has add_tags with over_write=true. Tags
        must already exist on the record for removal to have effect.
      properties:
        tags:
          type: array
          description: >-
            List of tags to remove from the record. All tags must pre-exist in
            the org  - fetch available tags from GET
            /settings/tags?module={module_api_name}. If the list is empty after
            parsing, the API returns FAILURE ('Empty Tag'). If the tag count
            exceeds the edition limit, the API returns FAILURE ('Invalid Tag
            Count').
          items:
            $ref: '#/components/schemas/AutomationTagRef'
            description: >-
              Represents a tag reference, conforming to the AutomationTagRef
              schema, that identifies a pre-existing org tag to be removed from
              the record. Both id and name are mandatory fields on each entry;
              the referenced tag must already exist in the org before the action
              executes.
          minItems: 1
          maxItems: 10
        module:
          $ref: '#/components/schemas/AutomationModuleRef'
          description: >-
            Target module for the tag action. Must match the workflow rule's
            trigger module. Supported modules: Leads, Accounts, Contacts, Deals,
            Campaigns, Tasks, Cases, Events, Calls, Solutions, Products,
            Vendors, Price_Books, Quotes, Sales_Orders, Purchase_Orders,
            Invoices, and custom modules. Unsupported modules (Visits, Users,
            LinkingModules) return NOT_ALLOWED.
        over_write:
          type: boolean
          description: >-
            Present in GET responses. Its value is ignored for remove_tags
            actions.
          default: false
        id:
          type: string
          description: >-
            Server-generated unique identifier for this remove tags action.
            Present only in GET responses; not required in POST or PUT requests.
          maxLength: 20
          example: '111111000000002443'
      required:
        - tags
      title: Automation Remove Tags Details
    AutomationConvertChangeOwner:
      x-zs-$id: AutomationConvertChangeOwner
      type: object
      additionalProperties: false
      description: >-
        PURPOSE: Owner assignment during convert action. MANDATORY: id (user ID
        from GET /users). OPTIONAL: name, related_modules ([{api_name, id}] -
        which converted modules get new owner), apply_assignment_threshold
        (bool). For Leads: related_modules can include Events, Calls, Tasks,
        Contacts, Deals.
      x-zs-llm-description: >-
        Owner configuration during convert action. id (user ID) is mandatory 
        specifies who receives ownership of converted records. Optional: name,
        related_modules (which converted childmodules get new owner  e.g.,
        Events, Calls, Tasks for Leads), apply_assignment_threshold (enforce
        per-user record limits). Obtain user ID from getUsers.
      properties:
        id:
          type: string
          description: >-
            Unique user ID of the new owner. Obtain from GET /users. Must be an
            active user with permissions on the target modules.
          maxLength: 20
          example: '111111000000002005'
        name:
          type: string
          description: >-
            Full name of the new owner. Optional  - present in GET responses for
            display purposes.
          maxLength: 255
          example: Patricia Boyle
        related_modules:
          type: array
          description: >-
            List of target modules whose records should receive the new owner
            during conversion. Reuses the same related-record concept as
            assign_owner. For Leads conversion: Events, Calls, Tasks, Contacts,
            Deals are valid. For Quotes/SalesOrders conversion: only Events,
            Calls, Tasks are valid.
          items:
            $ref: '#/components/schemas/AutomationRelatedRecord'
            description: >-
              Represents a related module reference, conforming to the
              AutomationRelatedRecord schema, that identifies a child module
              whose records should also receive the new owner assignment during
              the conversion operation. At least one of api_name or id is
              required to identify the child module.
          maxItems: 10
        apply_assignment_threshold:
          type: boolean
          description: >-
            Whether to enforce assignment-threshold rules (record count limits
            per user) on the new owner for each converted module. When true, the
            system checks whether the new owner has reached their record limit
            before assigning ownership.
          default: false
      required:
        - id
      title: Automation Convert Change Owner
    AutomationConvertDetails:
      x-zs-$id: AutomationConvertDetails
      type: object
      additionalProperties: false
      description: >-
        PURPOSE: Details object for convert action. Converts records - Leads to
        Contacts+Accounts+Deals, Quotes to SalesOrders/Invoices, SalesOrders to
        Invoices. PREREQUISITES: criteria_details.criteria MUST be non-null
        (NOT_ALLOWED otherwise). Module MUST be Leads/Quotes/Sales_Orders.
        MANDATORY (Leads): add_to_existing_contact (bool),
        add_to_existing_account (bool). MANDATORY (Quotes/Sales_Orders):
        convert_to ({api_name, id}). OPTIONAL: change_owner, carry_tags (ARRAY
        [{api_name, id}] NOT boolean), field_mappings (max 25),
        move_attachment_to, create_deal (Leads only), contact_role (with
        create_deal). CONSTRAINTS: No add_tags/remove_tags with convert on
        Leads. No scheduled actions with convert.
      x-zs-llm-description: >-
        Details for type='convert'. Converts records across modules
        (Leads→Contacts+Accounts+Deals, Quotes→SalesOrders/Invoices,
        SalesOrders→Invoices). Limit 1/rule. For Leads: add_to_existing_contact,
        add_to_existing_account, change_owner mandatory. For Quotes/SalesOrders:
        convert_to required. Optional: create_deal, carry_tags (array not
        boolean), field_mappings, move_attachment_to, contact_role. No scheduled
        actions allowed alongside convert.
      properties:
        add_to_existing_contact:
          type: boolean
          description: >-
            MANDATORY for Leads conversion (omitting returns
            MANDATORY_NOT_FOUND). Whether to link the converted record to an
            existing Contact instead of creating a new one. Only applicable for
            Leads module. When true, if a matching Contact exists (based on
            duplicate-check criteria), the Lead is merged into it rather than
            creating a new Contact. Not applicable for Quotes or Sales_Orders
            conversions.
          default: false
        add_to_existing_account:
          type: boolean
          description: >-
            MANDATORY for Leads conversion (omitting returns
            MANDATORY_NOT_FOUND). Whether to link the converted record to an
            existing Account instead of creating a new one. Only applicable for
            Leads module. When true, if a matching Account exists (based on
            Company name), the Lead is linked to it rather than creating a new
            Account. Not applicable for Quotes or Sales_Orders conversions.
          default: false
        move_attachment_to:
          $ref: '#/components/schemas/AutomationModuleRef'
          description: >-
            Target module to which attachments from the source record should be
            moved during conversion. For Leads: typically Contacts or Accounts.
            For Quotes/SalesOrders: the target conversion module. Provide
            api_name and/or id.
        carry_tags:
          type: array
          description: >-
            List of target modules that should inherit tags from the source
            record during conversion. For Leads: may include Contacts, Accounts,
            Deals. Each entry identifies a module by api_name and/or id.
          items:
            $ref: '#/components/schemas/AutomationModuleRef'
            description: >-
              Represents a module reference, conforming to the
              AutomationModuleRef schema, that identifies a target module whose
              records should inherit tags from the source record during
              conversion. At least one of api_name or id is required to identify
              the module; valid values are obtainable from GET
              /settings/modules.
          maxItems: 10
        field_mappings:
          type: array
          description: >-
            List of field-value pairs to populate in the converted record(s).
            Each entry maps a target field to a value using one of the supported
            types: static, merge_field, or execution_time. For Leads conversion,
            field mappings can target Contacts, Accounts, and Deals modules.
            Fetch available fields from GET
            /settings/fields?module={target_module_api_name}.
          items:
            $ref: '#/components/schemas/AutomationFieldMappings'
            description: >-
              Represents a single field-to-value mapping entry for the converted
              record, conforming to the AutomationFieldMappings schema. Each
              entry identifies the target field and specifies the value
              resolution strategy: static for literal values, merge_field for
              runtime token substitution, or execution_time for dynamically
              resolved values.
          maxItems: 25
        create_deal:
          type: boolean
          description: >-
            Whether to create a Deal record as part of Leads conversion. Only
            applicable when the trigger module is Leads. When true, the Deal
            module field mappings in field_mappings are used to populate the new
            Deal.
          default: false
        change_owner:
          $ref: '#/components/schemas/AutomationConvertChangeOwner'
          description: >-
            New owner assignment for the converted records. Specifies the user
            (by id) who should own the converted records, which modules should
            receive the new owner (via related_modules), and whether to enforce
            assignment thresholds. When omitted, the source record's owner is
            retained.
        contact_role:
          type: string
          description: >-
            Unique ID of the Contact Role to assign when a Deal is created
            during Leads conversion. Only applicable when create_deal=true.
            Obtain valid Contact Role IDs from GET /Contacts/roles.
          maxLength: 20
          example: '111111000000002174'
        convert_to:
          type: object
          description: >-
            MANDATORY for Quotes and Sales_Orders conversion (omitting returns
            MANDATORY_NOT_FOUND). Identifies the target module for conversion as
            an object with api_name and id. For Quotes: convert_to can be
            {api_name: 'SalesOrders', id: '<module_id>'} or {api_name:
            'Invoices', id: '<module_id>'}. For Sales_Orders: convert_to must be
            {api_name: 'Invoices', id: '<module_id>'}. Obtain the module id from
            GET /settings/modules. Not applicable for Leads conversion (Leads
            always convert to Contacts+Accounts, optionally +Deals).
          properties:
            api_name:
              type: string
              description: >-
                API name of the target module. For Quotes: 'SalesOrders' or
                'Invoices'. For Sales_Orders: 'Invoices'.
              maxLength: 50
              example: SalesOrders
            id:
              type: string
              description: >-
                Unique 19-digit module ID of the target module. Obtain from GET
                /settings/modules. Always use the full 19-digit ID as returned
                by the API; truncated IDs cause INVALID_DATA.
              maxLength: 20
              example: '1189654000000000109'
          required:
            - api_name
            - id
          additionalProperties: false
        portal_user_type:
          type: object
          description: >-
            Portal user type to assign during Leads conversion. Only applicable
            when the org has portals configured and the converted Contact should
            be provisioned as a portal user. The id and name must match an
            existing portal user type - validated against the org's portal
            metadata (CrmClientPortalFilterUtil). Not applicable for Quotes or
            Sales_Orders conversions.
          properties:
            id:
              type: string
              description: >-
                Unique identifier of the portal user type. Must match an
                existing portal user type in the org's portal configuration.
              maxLength: 20
              example: '1189654000000007039'
            name:
              type: string
              description: Display name of the portal user type.
              maxLength: 100
              example: Standard
          required:
            - id
            - name
          additionalProperties: false
        apply_restriction:
          type:
            - boolean
            - 'null'
          description: >-
            Whether to enforce assignment-threshold rules on the record owner
            during conversion. Present in GET responses.
          default: false
        id:
          type: string
          description: >-
            Server-generated unique identifier for this convert action. Present
            only in GET responses; not required in POST requests.
          maxLength: 20
          example: '111111000000002430'
      title: Automation Convert Details
    AutomationChatNotificationDetails:
      x-zs-$id: AutomationChatNotificationDetails
      type: object
      additionalProperties: false
      description: >-
        PURPOSE: Details object for chat notification actions
        (slack/cliq/cisco/google_chat/microsoft_teams_notifications). Sends a
        message to a channel, user, or field-based recipient. Limit: 1 per type
        per rule. MANDATORY: message (string, supports ${Module.Field} merge
        fields), notify_to (object with type: 'user'|'channel'|'fields'). For
        user/channel: provide id + name. For fields: provide module +
        notify_fields.fields array. EXAMPLE: {"message": "New deal
        ${Deals.Deal_Name}", "notify_to": {"type": "channel", "id": "C0123",
        "name": "#sales"}}
      x-zs-llm-description: >-
        Details for chat notification actions
        (type=slack_notifications|cliq_notifications|cisco_notifications|google_chat_notifications|microsoft_teams_notifications).
        Requires message (string, supports ${Module.Field} merge tokens) and
        notify_to ({type: user|channel|fields}). For user/channel: provide id +
        name. For fields: provide module + notify_fields.fields array. Limit 1
        per chat type per rule.
      properties:
        message:
          type: string
          description: >-
            REQUIRED. Notification message body. Supports merge fields in
            ${Module.Field} format (e.g., "New deal ${Deals.Deal_Name} created
            by ${Deals.Owner}!").
          maxLength: 5000
        notify_to:
          type: object
          additionalProperties: false
          description: >-
            REQUIRED. Notification target  - a channel, user, or field-based
            recipient.
          properties:
            type:
              type: string
              description: >-
                Target type. 'user'  - send to a specific chat user. 'channel' 
                - send to a chat channel. 'fields'  - send to users resolved
                from CRM field values.
              enum:
                - user
                - channel
                - fields
            id:
              type: string
              description: >-
                Required for user/channel types. The integration-specific user
                or channel ID.
              maxLength: 255
            name:
              type: string
              description: >-
                Required for user/channel types. Display name of the user or
                channel (e.g., '#sales-alerts').
              maxLength: 255
            module:
              type: object
              additionalProperties: false
              description: >-
                Required for type='fields'. The CRM module to resolve field
                values from. Use GET /settings/modules to discover api_name and
                id.
              properties:
                id:
                  type: string
                  description: Module ID.
                  format: int64
                api_name:
                  type: string
                  description: Module API name.
                  maxLength: 255
            notify_fields:
              type: object
              additionalProperties: false
              description: >-
                Required for type='fields'. Field references to resolve
                notification recipients.
              properties:
                fields:
                  type: array
                  description: >-
                    Array of field references. Each must have api_name and
                    optionally id. If both given, cross-validated for
                    consistency (AMBIGUITY_DUE_TO if mismatch).
                  maxItems: 10
                  items:
                    type: object
                    description: A field reference with api_name and optional id.
                    additionalProperties: false
                    properties:
                      id:
                        type: string
                        description: Field ID.
                        format: int64
                      api_name:
                        type: string
                        description: >-
                          Field API name. Use GET
                          /settings/fields?module={api_name} to discover.
                        maxLength: 255
                static_fields:
                  type: array
                  description: Array of static field references.
                  maxItems: 10
                  items:
                    type: object
                    description: A static field reference with api_name and optional id.
                    additionalProperties: false
                    properties:
                      id:
                        type: string
                        description: Static field ID.
                        format: int64
                      api_name:
                        type: string
                        description: Static field API name.
                        maxLength: 255
          required:
            - type
        id:
          type: string
          description: >-
            Read-only. Unique identifier for the action, returned in GET
            responses.
          maxLength: 20
      required:
        - message
        - notify_to
    AutomationCircuitsDetails:
      x-zs-$id: AutomationCircuitsDetails
      type: object
      additionalProperties: false
      description: >-
        PURPOSE: Details object for circuits action. Executes a Zoho Circuits
        workflow. Limit: 1/rule. MANDATORY: circuit_id (string). EXAMPLE:
        {"circuit_id": "7389640000001234"}
      x-zs-llm-description: >-
        Details for type='circuits'. Executes a Zoho Circuits workflow. Requires
        circuit_id (string  the Circuits workflow identifier). Limit 1/rule.
        Verify 'circuits' is enabled via getWorkflowConfigurations before using.
      properties:
        circuit_id:
          type: string
          description: REQUIRED. Zoho Circuits circuit ID.
          maxLength: 255
        id:
          type: string
          description: Read-only. Unique identifier for the action.
          maxLength: 20
      required:
        - circuit_id
    AutomationZohoFlowDetails:
      x-zs-$id: AutomationZohoFlowDetails
      type: object
      additionalProperties: false
      description: >-
        PURPOSE: Details object for flow action. Triggers a Zoho Flow custom
        action. Limit: 1/rule. Fetch values from `getCustomActions` (filter
        service_type='zoho_flow', component_type='workflow'): use response `id`
        as custom_action_id, `action_name` as custom_action_name. MANDATORY:
        custom_action_id (string), custom_action_name (string). EXAMPLE:
        {"custom_action_id": "4839491000001566002", "custom_action_name": "Sync
        to ERP"}
      x-zs-llm-description: >-
        Details for type='flow'. Triggers a Zoho Flow custom action. Requires
        custom_action_id and custom_action_name (obtain from getCustomActions
        filtered by service_type='zoho_flow', component_type='workflow'). Limit
        1/rule. Verify 'flow' is enabled via getWorkflowConfigurations.
      properties:
        custom_action_id:
          type: string
          format: int64
          description: >-
            REQUIRED. Zoho Flow custom action ID. Value = `id` from
            `getCustomActions` response.
        custom_action_name:
          type: string
          description: >-
            REQUIRED. Display name of the Zoho Flow action. Value =
            `action_name` from `getCustomActions` response.
          maxLength: 255
        id:
          type: string
          description: Read-only. Unique identifier for the action.
          maxLength: 20
      required:
        - custom_action_id
        - custom_action_name
    AutomationSocialDetails:
      x-zs-$id: AutomationSocialDetails
      type: object
      additionalProperties: false
      description: >-
        PURPOSE: Details object for social actions (Facebook/Twitter). Available
        only with fb_*/tw_* triggers. Limit: 1 per type per rule. content is
        REQUIRED for comment_to_post, reply_to_comment, reply_to_message,
        reply_to_tweet. NOT required for like_to_comment, retweet. Supports
        ${Module.Field} merge fields. EXAMPLE: {"content": "Thanks
        ${Leads.Full_Name}!"}
      x-zs-llm-description: >-
        Details for social actions (Facebook: comment_to_post, reply_to_comment,
        like_to_comment, reply_to_message; Twitter: retweet, reply_to_tweet).
        content (string with ${Module.Field} merge tokens) required for
        comment/reply types, not needed for like/retweet. Available only with
        matching social triggers.
      properties:
        content:
          type: string
          description: >-
            Message content. Supports merge fields in ${Module.Field} format.
            REQUIRED for: comment_to_post, reply_to_comment, reply_to_message,
            reply_to_tweet. NOT required for: like_to_comment, retweet (details
            can be empty).
          maxLength: 5000
        id:
          type: string
          description: Read-only. Unique identifier for the action.
          maxLength: 20
    AutomationEmailCreateRecordDetails:
      x-zs-$id: AutomationEmailCreateRecordDetails
      type: object
      additionalProperties: false
      description: >-
        PURPOSE: Details object for create_record_email action. Creates a record
        via email for Leads or Contacts only. Limit: 1/rule. MANDATORY: module
        ({api_name: 'Leads'|'Contacts'}), field_mappings (exactly 1 entry with
        field + value for owner assignment). value.type:
        'user'|'role'|'group'|'country'. Errors: no_data if empty,
        too_many_records if >1.
      x-zs-llm-description: >-
        Details for type='create_record_email'. Creates a Leads or Contacts
        record via email. Requires module ({api_name}  must be 'Leads' or
        'Contacts') and field_mappings (exactly 1 entry for owner assignment:
        field={api_name, id}, value={type: user|role|group|country, resource:
        {id}}). Limit 1/rule.
      properties:
        module:
          type: object
          additionalProperties: false
          description: REQUIRED. Target module  - only 'Leads' or 'Contacts' allowed.
          properties:
            api_name:
              type: string
              description: Module API name. Must be 'Leads' or 'Contacts'.
              enum:
                - Leads
                - Contacts
          required:
            - api_name
        field_mappings:
          type: array
          description: >-
            REQUIRED. Exactly 1 field mapping entry. More than 1 returns
            too_many_records, none returns no_data.
          items:
            type: object
            description: A field-to-value mapping entry for email-based record creation.
            additionalProperties: false
            properties:
              field:
                type: object
                description: >-
                  Field reference. Use GET /settings/fields?module={api_name} to
                  discover.
                additionalProperties: false
                properties:
                  api_name:
                    type: string
                    description: Field API name.
                    maxLength: 255
                  id:
                    type: string
                    description: Field ID.
                    format: int64
              value:
                type: object
                description: Owner assignment details.
                additionalProperties: false
                properties:
                  type:
                    type: string
                    description: Owner assignment type.
                    enum:
                      - user
                      - role
                      - group
                      - country
                  resource:
                    type: object
                    description: Assignment target reference.
                    additionalProperties: false
                    properties:
                      id:
                        type: string
                        description: Resource ID.
                        format: int64
                required:
                  - type
            required:
              - field
              - value
          minItems: 1
          maxItems: 1
        id:
          type: string
          description: Read-only. Unique identifier for the action.
          maxLength: 20
      required:
        - module
        - field_mappings
  parameters:
    ParamQueryIdSchema:
      name: id
      in: path
      description: >-
        Represents the unique 19-digit numeric ID of the workflow rule. Obtain
        valid IDs from the List Workflow Rules endpoint.
      required: true
      schema:
        type: string
        format: string
    ParamQueryIdsSchema:
      name: ids
      in: query
      description: >-
        Specifies one or more workflow rule IDs to filter the results. Provide
        multiple IDs as comma-separated values.
      required: true
      schema:
        type: string
        format: string
    ParamQueryModuleSchema:
      name: module
      in: query
      description: >-
        Specifies the CRM module API name to filter workflow rules by, such as
        Leads, Contacts, or Deals.
      required: false
      schema:
        type: string
        format: string
    ParamQueryExecutedFrom:
      name: executed_from
      in: query
      description: >-
        Specifies the start date of the usage data query window in ISO 8601
        format (yyyy-MM-dd).
      required: true
      schema:
        type: string
        format: date
    ParamQueryExecutedTill:
      name: executed_till
      in: query
      description: >-
        Specifies the end date of the usage data query window in ISO 8601 format
        (yyyy-MM-dd).
      required: true
      schema:
        type: string
        format: date
    ParamPathWorkflowRuleId:
      name: workflowRuleId
      in: path
      description: >-
        Represents the unique 19-digit numeric ID of the workflow rule to
        target. Obtain valid IDs from the List Workflow Rules endpoint.
      required: true
      schema:
        type: string
        format: string
    ParamQueryPageSchema:
      name: page
      in: query
      description: >-
        Specifies the page number for paginated results. Page numbering starts
        at 1.
      required: false
      schema:
        type: integer
        format: int32
        minimum: 1
    ParamQueryStatusActiveSchema:
      name: status_active
      in: query
      description: >-
        Filters workflow rules by activation status. Set to true to return only
        active rules, or false to return only inactive rules.
      required: false
      schema:
        type: boolean
    ParamQueryExecuteOnSchema:
      name: execute_on
      in: query
      description: >-
        Specifies the trigger type to filter workflow rules by, such as create,
        edit, or delete events.
      required: false
      schema:
        type: string
        maxLength: 25
    ParamQueryPerPageSchema:
      name: per_page
      in: query
      description: >-
        Specifies the number of workflow rules to return per page. The default
        and maximum value is 200.
      required: false
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 200
    ParamQueryIncludeInnerDetailsSchema:
      name: include_inner_details
      in: query
      description: >-
        When set to true, includes full condition details, criteria, and action
        configurations in the response. Defaults to false.
      required: false
      schema:
        type: boolean
    ParamQueryFilterSchema:
      name: filter
      in: query
      description: >-
        Specifies a JSON filter expression to search workflow rules by name.
        Supports only contains-type matching on the rule name field.
      required: false
      schema:
        type: string
        maxLength: 1000
      example: >-
        {"field":{"api_name":"name"},"comparator":"contains","value":"Lead
        Notification"}
    ParamQuerySortOrderSchema:
      name: sort_order
      in: query
      description: >-
        Specifies the sort direction for the workflow rule list. Accepted values
        are `asc` and `desc`.
      required: false
      schema:
        type: string
        enum:
          - asc
          - desc
    ParamQuerySortBySchema:
      name: sort_by
      in: query
      description: >-
        Specifies the field to sort workflow rules by. Only `modified_time` is
        supported.
      required: false
      schema:
        type: string
        enum:
          - modified_time
  securitySchemes:
    OAuth2:
      type: oauth2
      description: OAuth2 authentication for API access
      flows:
        authorizationCode:
          authorizationUrl: https://accounts.zoho.com/oauth/v2/auth
          tokenUrl: https://accounts.zoho.com/oauth/v2/token
          refreshUrl: https://accounts.zoho.com/oauth/v2/token
          scopes:
            ZohoCRM.settings.workflow_rules.CREATE: Grants permission to create new Zoho CRM workflow rules.
            ZohoCRM.settings.workflow_rules.UPDATE: Grants permission to update existing Zoho CRM workflow rules.
            ZohoCRM.settings.workflow_rules.DELETE: Grants permission to delete Zoho CRM workflow rules.
            ZohoCRM.settings.workflow_rules.READ: Grants read-only access to Zoho CRM workflow rules settings.
            ZohoCRM.settings.workflow_rules.ALL: >-
              Grants full access (read, create, update, and delete) to Zoho CRM
              workflow rules settings.
