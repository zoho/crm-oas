    WorkflowRulesGetResponseSchema:
      type: object
      x-zs-$id: WorkflowRulesGetResponseSchema
      additionalProperties: false
      description: >-
        Represents the paginated list response for workflow rules, containing an
        array of workflow rule objects and pagination metadata.
      x-zs-llm-description: >-
        Response wrapper for getWorkflowRules (list). Contains workflow_rules
        array of rule objects and info object with pagination metadata (page,
        per_page, count, more_records).
      properties:
        workflow_rules:
          type: array
          description: >-
            Represents the array of workflow rule objects returned in the list
            response.
          items:
            $ref: '#/components/schemas/WorkflowRuleSingleGetSchema'
          maxItems: 200
        info:
          $ref: '#/components/schemas/InfoNestedSchema'
      required:
        - workflow_rules
        - info
      title: Workflow Rule List Response
    WorkflowRuleSingleGetResponseSchema:
      type: object
      x-zs-$id: WorkflowRuleSingleGetResponseSchema
      additionalProperties: false
      description: >-
        Represents the response body for a single workflow rule retrieval,
        containing a single-element array with the full rule details.
      x-zs-llm-description: >-
        Response wrapper for getWorkflowRuleById. Contains workflow_rules array
        with exactly one complete rule object.
      properties:
        workflow_rules:
          type: array
          description: Represents the array containing the single workflow rule retrieved.
          items:
            $ref: '#/components/schemas/WorkflowRuleSingleGetSchema'
          maxItems: 10
      required:
        - workflow_rules
      title: Workflow Rule List Response
    WorkflowRuleSingleGetSchema:
      type: object
      additionalProperties: false
      description: >-
        Represents the full configuration and metadata of a single workflow
        rule, including its trigger, conditions, actions, lock status, and audit
        timestamps.
      x-zs-llm-description: >-
        Complete workflow rule entity as returned in GET responses. Contains all
        rule metadata: trigger (execute_when), conditions with actions, module
        reference, ownership (created_by, modified_by), timestamps, lock status,
        activation status, and capabilities (editable, deletable, deprecated).
        Use this to understand current rule state before updating.
      properties:
        created_time:
          type: string
          format: date-time
          description: >-
            Represents the ISO 8601 timestamp indicating when the system created
            this workflow rule.
          maxLength: 255
        execute_when:
          $ref: '#/components/schemas/ExecuteWhenNestedSchema'
        editable:
          type: boolean
          description: >-
            Indicates whether the requesting user has permission to edit this
            workflow rule.
        module:
          $ref: '#/components/schemas/ModuleOrFieldNestedSchema'
        deprecated:
          type: boolean
          description: >-
            Indicates whether this workflow rule is deprecated and should be
            migrated to a newer configuration.
        deletable:
          type: boolean
          description: >-
            Indicates whether the requesting user has permission to delete this
            workflow rule.
        description:
          type:
            - string
            - 'null'
          description: >-
            Represents the user-defined description of the workflow rule. Null
            if not set.
          maxLength: 255
        source:
          type: string
          description: >-
            Represents the origin of the workflow rule. For example, **crm** for
            rules created through the CRM UI, or **API** for rules created
            through the API.
          maxLength: 255
        created_by:
          $ref: '#/components/schemas/CreatedModifiedByObjectSchema'
        last_executed_time:
          type:
            - string
            - 'null'
          format: date-time
          description: >-
            Represents the ISO 8601 timestamp of the last time this workflow
            rule was triggered. Null if the rule has never been triggered.
        modified_time:
          $ref: '#/components/schemas/TimeObjectSchema'
        name:
          type: string
          description: Represents the name of the workflow rule.
          maxLength: 255
        modified_by:
          $ref: '#/components/schemas/CreatedModifiedByObjectSchema'
        lock:
          $ref: '#/components/schemas/LockStatusSchema'
        id:
          type: string
          description: Represents the unique ID of the workflow rule.
          maxLength: 20
        category:
          type: string
          description: Represents the classification category of the workflow rule.
          maxLength: 255
        conditions:
          type: array
          description: >-
            Represents the array of condition objects that define the criteria
            for executing the actions of the workflow rule.
          items:
            $ref: '#/components/schemas/ConditionsNestedSchema'
          maxItems: 10
        status:
          $ref: '#/components/schemas/ActivationStatusSchema'
      required:
        - created_by
        - created_time
        - deletable
        - description
        - editable
        - execute_when
        - id
        - last_executed_time
        - lock
        - modified_by
        - modified_time
        - module
        - name
        - source
        - status
      title: Workflow Rule
    ModuleOrFieldNestedSchema:
      type: object
      x-zs-$id: ModuleOrFieldNestedSchema
      additionalProperties: false
      description: >-
        Represents a CRM module or field reference using its API name and unique
        numeric ID.
      x-zs-llm-description: >-
        Reusable reference object for modules and fields. Both api_name and id
        must be provided - API returns MANDATORY_NOT_FOUND if id is missing.
        Used across: rule module, action module, criteria field, field_mappings
        field, lookup_field.
      properties:
        api_name:
          type: string
          description: >-
            Represents the API name of the module or field, such as **Leads**,
            **Contacts**, or a custom field API name.
          maxLength: 100
        id:
          type: string
          description: Represents the unique numeric ID of the module or field.
          x-zs-llm-description: >-
            PURPOSE: Unique numeric ID of the module or field (19-digit format).
            MANDATORY: Always use the full ID as returned by `getModules` or
            `getFields`. KEY CONSTRAINTS: Truncated or shortened IDs return
            INVALID_DATA.
          maxLength: 20
      required:
        - api_name
        - id
      minProperties: 1
    ExecuteWhenNestedSchema:
      description: >-
        Represents the trigger configuration that defines when the workflow rule
        fires, including the trigger type and its associated details.
      x-zs-llm-description: >-
        The `type` value selects the matching trigger-specific `details` schema
        through the discriminator. The discriminator covers trigger types used
        across modules, but a target module may support only a subset. Call
        `getWorkflowConfigurations` for the target module before constructing
        the rule. Provide both `type` and `details`; for example:
        {"type":"create","details":{"repeat":false}}.
      discriminator:
        propertyName: type
        mapping:
          create: '#/components/schemas/ExecuteWhenT1Simple'
          edit: '#/components/schemas/ExecuteWhenT1Simple'
          create_or_edit: '#/components/schemas/ExecuteWhenT1Simple'
          delete: '#/components/schemas/ExecuteWhenT1Simple'
          cancel: '#/components/schemas/ExecuteWhenT1Simple'
          reschedule: '#/components/schemas/ExecuteWhenT1Simple'
          reassign: '#/components/schemas/ExecuteWhenT1Simple'
          anyaction: '#/components/schemas/ExecuteWhenT1Simple'
          deactivate: '#/components/schemas/ExecuteWhenT1Simple'
          activate: '#/components/schemas/ExecuteWhenT1Simple'
          marked_as_complete: '#/components/schemas/ExecuteWhenT1Simple'
          incoming_call_ring: '#/components/schemas/ExecuteWhenT1Simple'
          incoming_call_start: '#/components/schemas/ExecuteWhenT1Simple'
          incoming_call_createedit: '#/components/schemas/ExecuteWhenT1Simple'
          incoming_call_edit: '#/components/schemas/ExecuteWhenT1Simple'
          outgoing_call_ring: '#/components/schemas/ExecuteWhenT1Simple'
          outgoing_call_start: '#/components/schemas/ExecuteWhenT1Simple'
          outgoing_call_edit: '#/components/schemas/ExecuteWhenT1Simple'
          outgoing_call_createedit: '#/components/schemas/ExecuteWhenT1Simple'
          missed_call: '#/components/schemas/ExecuteWhenT1Simple'
          scheduled_call_createedit: '#/components/schemas/ExecuteWhenT1Simple'
          scheduled_call_edit: '#/components/schemas/ExecuteWhenT1Simple'
          email_received: '#/components/schemas/ExecuteWhenT1Simple'
          mail_sent: '#/components/schemas/ExecuteWhenT1Simple'
          mail_sent_clicked: '#/components/schemas/ExecuteWhenT1Simple'
          mail_sent_replied: '#/components/schemas/ExecuteWhenT1Simple'
          mail_sent_opened: '#/components/schemas/ExecuteWhenT1Simple'
          mail_sent_bounced: '#/components/schemas/ExecuteWhenT1Simple'
          fb_post_on_page: '#/components/schemas/ExecuteWhenT1Simple'
          fb_comment_on_page: '#/components/schemas/ExecuteWhenT1Simple'
          fb_like_on_post: '#/components/schemas/ExecuteWhenT1Simple'
          fb_send_message: '#/components/schemas/ExecuteWhenT1Simple'
          tw_mention_on: '#/components/schemas/ExecuteWhenT1Simple'
          tw_retweet_on_tweet: '#/components/schemas/ExecuteWhenT1Simple'
          tw_comment_on_tweet: '#/components/schemas/ExecuteWhenT1Simple'
          tw_send_message: '#/components/schemas/ExecuteWhenT1Simple'
          voc_incoming_signal: '#/components/schemas/ExecuteWhenT1Simple'
          field_update: '#/components/schemas/ExecuteWhenT2FieldUpdate'
          incoming_call_field_update: '#/components/schemas/ExecuteWhenT2FieldUpdate'
          outgoing_call_field_update: '#/components/schemas/ExecuteWhenT2FieldUpdate'
          scheduled_call_field_update: '#/components/schemas/ExecuteWhenT2FieldUpdate'
          stage_automation_field_update: '#/components/schemas/ExecuteWhenT2FieldUpdate'
          rollup_summary_update: '#/components/schemas/ExecuteWhenT2FieldUpdate'
          section_update: '#/components/schemas/ExecuteWhenT3SectionUpdate'
          incoming_call_section_update: '#/components/schemas/ExecuteWhenT3SectionUpdate'
          outgoing_call_section_update: '#/components/schemas/ExecuteWhenT3SectionUpdate'
          scheduled_call_section_update: '#/components/schemas/ExecuteWhenT3SectionUpdate'
          date_or_datetime: '#/components/schemas/ExecuteWhenT4DateBased'
          overdue: '#/components/schemas/ExecuteWhenT5TimeOffset'
          email_received_notreplied: '#/components/schemas/ExecuteWhenT5TimeOffset'
          email_received_opened_notreplied: '#/components/schemas/ExecuteWhenT5TimeOffset'
          mail_sent_opened_notreplied: '#/components/schemas/ExecuteWhenT5TimeOffset'
          mail_sent_notreplied: '#/components/schemas/ExecuteWhenT5TimeOffset'
          mail_sent_notopened: '#/components/schemas/ExecuteWhenT5TimeOffset'
          recommendation_rebuy: '#/components/schemas/ExecuteWhenT5TimeOffset'
          score_increase: '#/components/schemas/ExecuteWhenT6ScoreUpdate'
          score_decrease: '#/components/schemas/ExecuteWhenT6ScoreUpdate'
          score_update: '#/components/schemas/ExecuteWhenT6ScoreUpdate'
          zia_scoring_rule: '#/components/schemas/ExecuteWhenT6ScoreUpdate'
          mail_sent_replied_within: '#/components/schemas/ExecuteWhenT7EmailRepliedWithin'
      oneOf:
        - $ref: '#/components/schemas/ExecuteWhenT1Simple'
        - $ref: '#/components/schemas/ExecuteWhenT2FieldUpdate'
        - $ref: '#/components/schemas/ExecuteWhenT3SectionUpdate'
        - $ref: '#/components/schemas/ExecuteWhenT4DateBased'
        - $ref: '#/components/schemas/ExecuteWhenT5TimeOffset'
        - $ref: '#/components/schemas/ExecuteWhenT6ScoreUpdate'
        - $ref: '#/components/schemas/ExecuteWhenT7EmailRepliedWithin'
    ExecuteWhenT1Simple:
      type: object
      description: >-
        Represents a simple trigger type (T1) that fires on record creation,
        editing, deletion, or when specific CRM events occur, with optional
        repeat and cross-module support.
      x-zs-llm-description: >-
        T1 - Simple trigger (repeat + trigger_module only). IMPORTANT: Not all
        T1 triggers are available on every module -- record lifecycle triggers
        are broadly available, but email/call/social triggers typically require
        their dedicated module with relational_criteria. MUST call
        `getWorkflowConfigurations` to verify. Repeat supported for: create,
        edit, create_or_edit, delete, call_edit variants, email_received,
        mail_sent variants, missed_call, call_ring/start variants. Unsupported
        repeat returns INVALID_DATA. Example: {"type": "create_or_edit",
        "details": {"repeat": false}}.
      additionalProperties: false
      x-zs-$id: ExecuteWhenT1Simple
      required:
        - type
      properties:
        type:
          description: >-
            Represents the trigger API name that activates the workflow rule.
            Supported values vary by module; use the getWorkflowConfigurations
            endpoint to retrieve supported triggers for the target module.
          x-zs-llm-description: >-
            Trigger API name. This enum lists ALL T1 triggers across ALL modules
            -- not all are available on every module. MUST call
            `getWorkflowConfigurations` to verify. CATEGORIES: Record lifecycle
            (create, edit, create_or_edit, delete, cancel, reschedule, reassign,
            anyaction, activate, deactivate, marked_as_complete) -- broadly
            available on most CRM modules. Email interaction (email_received,
            mail_sent_*) -- typically requires a dedicated email module with
            relational_criteria linking to target module. Call-specific
            (incoming_call_*, outgoing_call_*, missed_call, scheduled_call_*) --
            typically requires the calls module. Social (fb_*, tw_*) -- requires
            the corresponding social module.
          type: string
          enum:
            - create
            - edit
            - create_or_edit
            - delete
            - cancel
            - reschedule
            - reassign
            - anyaction
            - deactivate
            - activate
            - marked_as_complete
            - incoming_call_ring
            - incoming_call_start
            - incoming_call_createedit
            - incoming_call_edit
            - outgoing_call_ring
            - outgoing_call_start
            - outgoing_call_edit
            - outgoing_call_createedit
            - missed_call
            - scheduled_call_createedit
            - scheduled_call_edit
            - email_received
            - mail_sent
            - mail_sent_clicked
            - mail_sent_replied
            - mail_sent_opened
            - mail_sent_bounced
            - fb_post_on_page
            - fb_comment_on_page
            - fb_like_on_post
            - fb_send_message
            - tw_mention_on
            - tw_retweet_on_tweet
            - tw_comment_on_tweet
            - tw_send_message
            - voc_incoming_signal
        details:
          type: object
          additionalProperties: false
          description: >-
            Represents the optional trigger configuration details, including
            **repeat** (Boolean) and **trigger_module** (object) for
            cross-module triggers.
          properties:
            repeat:
              type: boolean
              description: >-
                Indicates whether the rule fires every time the trigger
                condition is met. When false, the rule fires only on the first
                occurrence.
              x-zs-llm-description: >-
                PURPOSE: When true, the rule fires every time the trigger
                condition is met (not just the first time). Default false. KEY
                CONSTRAINTS: Only supported for triggers marked repeat-capable
                by `getWorkflowConfigurations` - sending repeat=true for
                unsupported triggers returns INVALID_DATA or is silently
                ignored.
            trigger_module:
              description: >-
                The module that actually triggers the rule. Defaults to the
                rule's top-level module if omitted. Must be explicitly set when
                the trigger targets a different module, such as a rule on Leads
                triggered by a note creation event, which requires the trigger
                module to reference the Notes module. To discover module API
                names and identifiers, retrieve the available modules from the
                system.
              x-zs-llm-description: >-
                Optional. The module that actually triggers the rule. Defaults
                to the rule's top-level module if omitted. Must be explicitly
                set when the trigger targets a different module - e.g., a rule
                on Leads triggered by 'note created' requires trigger_module =
                {api_name: 'Notes', id: '...'}. Use `getModules` to discover
                module api_name and id values.
              $ref: '#/components/schemas/ModuleOrFieldNestedSchema'
    ExecuteWhenT2FieldUpdate:
      type: object
      description: >-
        Represents a field update trigger type that fires when a specified field
        value on a record changes according to defined criteria.
      x-zs-llm-description: >-
        T2 - Field Update trigger (criteria-based). Call-prefixed variants
        (incoming_call_field_update, etc.) typically require the calls module --
        MUST call `getWorkflowConfigurations` to verify. The monitored field is
        embedded INSIDE the criteria object -- no standalone 'field' property at
        details level. Required: criteria, match_all. Optional: repeat. Use
        ${ANYVALUE} as both comparator and value to trigger on ANY field change.
        Example: {"type": "field_update", "details": {"criteria": {"comparator":
        "${ANYVALUE}", "field": {"api_name": "Stage", "id": "..."}, "value":
        "${ANYVALUE}"}, "match_all": false}}.
      additionalProperties: false
      x-zs-$id: ExecuteWhenT2FieldUpdate
      required:
        - type
        - details
      properties:
        type:
          description: >-
            Represents the trigger type for field update rules. Availability
            varies by the target module.
          x-zs-llm-description: >-
            Field update trigger type. MUST call `getWorkflowConfigurations` to
            verify availability. Call-prefixed variants
            (incoming_call_field_update, outgoing_call_field_update,
            scheduled_call_field_update) typically require the calls module.
            VALUES: 'field_update' - field value change on record (broadly
            available). 'incoming_call_field_update' - field updated during
            incoming call. 'outgoing_call_field_update' - field updated during
            outgoing call. 'scheduled_call_field_update' - field updated during
            scheduled call. 'stage_automation_field_update' - stage automation
            field updated. 'rollup_summary_update' - rollup summary
            recalculated.
          type: string
          enum:
            - field_update
            - incoming_call_field_update
            - outgoing_call_field_update
            - scheduled_call_field_update
            - stage_automation_field_update
            - rollup_summary_update
        details:
          type: object
          additionalProperties: false
          description: >-
            Represents the field update trigger details, including the criteria
            that define which field value change activates the rule.
          x-zs-llm-description: >-
            Field update trigger details. REQUIRED: criteria (Lyte JSON with
            embedded field refs defining what change activates the trigger). The
            field to watch is specified INSIDE the criteria object, not as a
            standalone property.
          required:
            - criteria
          properties:
            criteria:
              description: >-
                Represents the field value change criteria that activate the
                trigger. Defines which field is monitored and what change
                condition fires the rule.
              x-zs-llm-description: >-
                REQUIRED. PURPOSE: Defines what field value change activates the
                trigger. The monitored field is embedded INSIDE this criteria
                object, not as a standalone details property. PREREQUISITES: Use
                `getFields` to discover field api_name and id values. FORMATS:
                (1) Simple: {"field": {"api_name": "Stage", "id": "..."},
                "comparator": "equal", "value": "Closed Won"}. (2) Grouped:
                {"group_operator": "and", "group": [{"field": {...},
                "comparator": "...", "value": "..."}]}. KEY CONSTRAINTS:
                ${ANYVALUE} is a special comparator supported ONLY in
                field_update triggers - set both comparator and value to
                "${ANYVALUE}" to trigger on ANY change to the field.
              oneOf:
                - $ref: '#/components/schemas/WorkflowSimpleFilterCriterion'
                - $ref: '#/components/schemas/WorkflowGroupedFilterCriterion'
            match_all:
              type: boolean
              description: |-
                Controls the logic applied across criteria groups.
                Possible values:
                true - All criteria groups must match (AND logic).
                false - Any one criteria group is sufficient (OR logic).
              x-zs-llm-description: >-
                PURPOSE: Controls logic across criteria groups. VALUES: true =
                AND logic (all criteria must match), false = OR logic (any
                criterion can match). Default true. KEY CONSTRAINTS: Must be
                provided at this level (sibling of criteria), NOT inside the
                criteria object.
            repeat:
              type: boolean
              description: >-
                Indicates whether the rule fires every time the field update
                condition is met. When false, the rule fires only on the first
                occurrence.
            trigger_module:
              description: >-
                The module that actually triggers the rule. Defaults to the
                rule's top-level module if omitted. Must be explicitly set when
                the trigger targets a different module  - e.g., a rule on Leads
                triggered by 'note created' requires trigger_module = {api_name:
                'Notes', id: '...'}. Use `getModules` to discover module
                api_name and id values.
              x-zs-llm-description: >-
                Optional. The module that actually triggers the rule. Defaults
                to the rule's top-level module if omitted. Must be explicitly
                set when the trigger targets a different module - e.g., a rule
                on Leads triggered by 'note created' requires trigger_module =
                {api_name: 'Notes', id: '...'}. Use `getModules` to discover
                module api_name and id values.
              $ref: '#/components/schemas/ModuleOrFieldNestedSchema'
    ExecuteWhenT3SectionUpdate:
      type: object
      description: >
        Represents the trigger type for section update rules. Availability
        varies by the target module
      x-zs-llm-description: >-
        T3 - Section Update trigger. Fires when fields within specified layout
        sections are updated. Call-prefixed variants
        (incoming_call_section_update, etc.) typically require the calls module
        -- MUST call `getWorkflowConfigurations` to verify. Required details:
        section_ids (array of layout section ID strings). Optional: repeat. All
        variants support repeat. Validation: section_ids must be non-empty,
        valid layout section IDs for the module -- invalid IDs return
        INVALID_DATA, too many return LIMIT_EXCEEDED. Example: {"type":
        "section_update", "details": {"section_ids": ["738964000000091001",
        "738964000000091002"], "repeat": true}}
      additionalProperties: false
      x-zs-$id: ExecuteWhenT3SectionUpdate
      required:
        - type
        - details
      properties:
        type:
          description: >-
            Represents the trigger type for section update rules. Use
            getWorkflowConfigurations to verify the trigger is available for the
            target module.
          x-zs-llm-description: >-
            Section update trigger type. MUST call `getWorkflowConfigurations`
            to verify availability. Call-prefixed variants typically require the
            calls module. VALUES: 'section_update' - fields in specified layout
            sections updated (broadly available). 'incoming_call_section_update'
            - section update during incoming call.
            'outgoing_call_section_update' - section update during outgoing
            call. 'scheduled_call_section_update' - section update during
            scheduled call.
          type: string
          enum:
            - section_update
            - incoming_call_section_update
            - outgoing_call_section_update
            - scheduled_call_section_update
        details:
          type: object
          additionalProperties: false
          description: >-
            Represents the section update trigger details, including the layout
            section IDs to monitor.
          x-zs-llm-description: >-
            Section update trigger details. REQUIRED: section_ids (array of
            layout section ID strings).
          required:
            - section_ids
          properties:
            section_ids:
              type: array
              description: >-
                Represents the array of layout section IDs to monitor for
                updates. Each ID must correspond to a valid section ID for the
                target module.
              x-zs-llm-description: >-
                REQUIRED. Array of layout section IDs to monitor. Each ID must
                be a valid section ID for the rule's module layout. Fetch
                sections via `getLayouts`. Invalid IDs return INVALID_DATA.
                Maximum 10 section IDs (LIMIT_EXCEEDED if exceeded).
              items:
                type: string
                format: int64
                description: Represents the unique ID of a layout section to monitor.
                pattern: ^[0-9]+$
                minLength: 1
                maxLength: 19
              minItems: 1
              maxItems: 10
            repeat:
              type: boolean
              description: |
                Indicates whether the rule fires every time a section update
                condition is met. When false, the rule fires only on the first
                occurrence.
            trigger_module:
              description: >-
                Optional. The module that actually triggers the rule. Defaults
                to the rule's top-level module if omitted. Must be explicitly
                set when the trigger targets a different module  - e.g., a rule
                on Leads triggered by 'note created' requires trigger_module =
                {api_name: 'Notes', id: '...'}. Use `getModules` to discover
                module api_name and id values.
              $ref: '#/components/schemas/ModuleOrFieldNestedSchema'
    ExecuteWhenT4DateBased:
      type: object
      description: >
        Represents the date or datetime field to monitor for triggering the
        rule. Must reference an existing date or datetime field on the module.
      x-zs-llm-description: >-
        T4 - Date-Based trigger. Fires relative to a date/datetime field value.
        Broadly available on most CRM modules but MUST call
        `getWorkflowConfigurations` to verify. Required details: field, period
        (string - time unit name), unit (integer - offset magnitude). Supports 8
        period types (minutes, hours, days, weeks, months, years, b_hours,
        b_days) with per-period range limits on unit. Recurrence: once, monthly,
        yearly only (daily/weekly NOT valid). Example: {"type":
        "date_or_datetime", "details": {"field": {"api_name": "Closing_Date",
        "id": "738964000000000567"}, "period": "days", "unit": -2, "execute_at":
        "10:00", "recur_cycle": "once"}}
      additionalProperties: false
      x-zs-$id: ExecuteWhenT4DateBased
      required:
        - type
        - details
      properties:
        type:
          description: >-
            Represents the trigger type for date or datetime-based rules, which
            fire relative to a date field value on the record.
          type: string
          enum:
            - date_or_datetime
        details:
          type: object
          additionalProperties: false
          description: >-
            Represents the date-based trigger details, including the target date
            field, time offset, and recurrence configuration.
          x-zs-llm-description: >-
            Date-based trigger details. REQUIRED: field, period, unit. The
            property name is 'field' (NOT 'date_field'). In this template,
            period is a STRING (time unit name like 'days') and unit is an
            INTEGER (offset magnitude) - same naming convention as
            scheduled_actions.execute_after.
          required:
            - field
            - period
            - unit
          properties:
            field:
              type: object
              additionalProperties: false
              description: >-
                Represents the date or datetime field to monitor for triggering
                the rule. Use the getFields endpoint to discover available date
                and datetime fields.
              x-zs-llm-description: >-
                REQUIRED. PURPOSE: The date or datetime field to monitor. The
                property name is 'field' (NOT 'date_field'). PREREQUISITES: Use
                `getFields` to discover date/datetime fields. KEY CONSTRAINTS:
                System fields (Created_Time, Modified_Time) work with api_name
                only; custom date fields should include both api_name and id.
              required:
                - api_name
              properties:
                api_name:
                  type: string
                  maxLength: 255
                  description: >-
                    Represents the API name of the date or datetime field, such
                    as **Created_Time**, **Modified_Time**, or a custom field
                    API name.
                id:
                  type: string
                  maxLength: 20
                  description: Represents the unique ID of the date or datetime field.
            period:
              type: string
              description: >-
                Represents the time unit for the offset relative to the
                monitored date field. For example, **days**, **weeks**, or
                **months**.
              x-zs-llm-description: >-
                REQUIRED. PURPOSE: Time unit name for the offset. In this
                template period is a STRING (time unit name) and unit is an
                INTEGER (offset magnitude) - same naming convention as
                scheduled_actions.execute_after. VALUES: minutes - only for
                datetime fields (unit must be one of {10,15,30,45}, 10 is Calls
                module only). hours/days/weeks/months/years - for date and
                datetime fields. b_hours/b_days - business hours/days (excludes
                non-working hours and holidays). KEY CONSTRAINTS: b_hours and
                b_days restrict recur_cycle to 'once' only.
              enum:
                - minutes
                - hours
                - days
                - weeks
                - months
                - years
                - b_hours
                - b_days
            unit:
              type: integer
              format: int32
              description: >-
                Represents the offset magnitude relative to the monitored date
                field value. Negative values indicate before the date; positive
                values indicate after.
              x-zs-llm-description: >-
                REQUIRED. PURPOSE: Offset magnitude relative to the field's
                date/datetime value. VALUES: Negative = before, 0 = on-the-day,
                positive = after. LIMITS: Allowed ranges depend on period -
                minutes: discrete set {10, 15, 30, 45} (10 is Calls module
                only), hours: -99 to +99, days: -2000 to +2000, weeks: -200 to
                +200, months: -60 to +60, years: -5 to +5, b_hours: -99 to +99,
                b_days: -2000 to +2000.
            execute_at:
              type: string
              format: time
              description: >-
                Represents the exact time of day at which to fire the trigger,
                in 24-hour HH:mm format. Applicable only to datetime fields.
              x-zs-llm-description: >-
                OPTIONAL. PURPOSE: The exact time of day to trigger, in 24h
                HH:mm format (e.g., '10:00', '09:30'). KEY CONSTRAINTS:
                Applicable when period is 'days', 'weeks', 'months', 'years', or
                'b_days'. Not used with 'minutes', 'hours', or 'b_hours', which
                already resolve to an exact instant.
            recur_cycle:
              type: string
              description: |-
                Represents the recurrence frequency for the date-based trigger.
                Possible values:
                once - Fires once.
                monthly - Fires monthly on the same date.
                yearly - Fires yearly on the same date.
              x-zs-llm-description: >-
                OPTIONAL. PURPOSE: Recurrence frequency. Defaults to 'once' when
                omitted. VALUES: Only 'once', 'monthly', 'yearly' are valid -
                'daily' and 'weekly' are NOT supported and return INVALID_DATA.
                KEY CONSTRAINTS: When period is 'b_hours' or 'b_days', only
                'once' is allowed.
              enum:
                - once
                - monthly
                - yearly
            repeat:
              type: boolean
              description: >-
                Indicates whether the trigger fires repeatedly. When true, the
                trigger fires on each recurrence as configured.
            trigger_module:
              description: >
                Specifies the module that triggers the workflow rule. If
                omitted,

                it defaults to the rule's top-level module. Specify this when
                the trigger

                targets a different module. For example, a workflow rule on
                Leads triggered

                when a note is created requires 'trigger_module': {"api_name":
                "Notes",

                'id': '...'}. Use 'getModules' to retrieve the module API name
                and ID.
              x-zs-llm-description: >-
                Optional. The module that actually triggers the rule. Defaults
                to the rule's top-level module if omitted. Must be explicitly
                set when the trigger targets a different module - e.g., a rule
                on Leads triggered by 'note created' requires trigger_module =
                {api_name: 'Notes', id: '...'}. Use `getModules` to discover
                module api_name and id values.
              $ref: '#/components/schemas/ModuleOrFieldNestedSchema'
    ExecuteWhenT5TimeOffset:
      type: object
      description: >
        Represents the trigger type for time-offset rules. Availability varies
        by the target module.
      x-zs-llm-description: >-
        T5 - Time Offset trigger (period + unit). Fires after a specified delay.
        IMPORTANT: These triggers are module-specific -- email time-offset
        triggers (email_received_notreplied, mail_sent_notopened, etc.)
        typically require a dedicated email module with relational_criteria
        linking to the target CRM module. 'overdue' typically requires an
        activity module. MUST call `getWorkflowConfigurations` to verify.
        Required details: period ('days' or 'hours'), unit (integer). Repeat NOT
        supported. Example: {"type": "mail_sent_notopened", "details":
        {"period": "days", "unit": 3}} (requires email module with
        relational_criteria). Example: {"type": "overdue", "details": {"period":
        "days", "unit": 1}}
      additionalProperties: false
      x-zs-$id: ExecuteWhenT5TimeOffset
      required:
        - type
        - details
      properties:
        type:
          description: >-
            Represents the trigger type for time-offset rules. Use
            getWorkflowConfigurations to verify the trigger is available for the
            target module.
          x-zs-llm-description: >-
            Time offset trigger type. These triggers are module-specific -- MUST
            call `getWorkflowConfigurations` to verify availability. Email
            offsets typically require a dedicated email module with
            relational_criteria linking to the target CRM module. VALUES:
            'overdue' - activity becomes overdue by offset (typically activity
            modules). 'email_received_notreplied' - received email not replied
            within period. 'email_received_opened_notreplied' - received email
            opened but not replied. 'mail_sent_opened_notreplied' - sent email
            opened but not replied. 'mail_sent_notreplied' - sent email not
            replied. 'mail_sent_notopened' - sent email not opened.
            'recommendation_rebuy' - Zia rebuy time offset.
          type: string
          enum:
            - overdue
            - email_received_notreplied
            - email_received_opened_notreplied
            - mail_sent_opened_notreplied
            - mail_sent_notreplied
            - mail_sent_notopened
            - recommendation_rebuy
        details:
          type: object
          additionalProperties: false
          description: >-
            Represents the time offset trigger details, including the time unit
            and magnitude for the offset.
          x-zs-llm-description: >-
            Time offset trigger details. REQUIRED: period (string - time unit
            name), unit (integer - offset magnitude). No other keys accepted -
            repeat is NOT supported for any T5 trigger.
          required:
            - period
            - unit
          properties:
            period:
              type: string
              description: |-
                Represents the time unit for the offset.
                Possible values:
                days - Offset in days.
                hours - Offset in hours.
              enum:
                - days
                - hours
            unit:
              type: integer
              format: int32
              description: >-
                Represents the time offset magnitude. Always a positive integer
                for time-offset triggers, such as 1 for one day or 3 for three
                hours.
            trigger_module:
              description: |
                The module that actually triggers the rule. Defaults to
                the rule's top-level module if omitted. Must be explicitly set
                when the trigger targets a different module  - e.g., a rule on
                Leads triggered by 'note created' requires trigger_module =
                {api_name: 'Notes', id: '...'}. Use `getModules` to discover
                module api_name and id values.
              x-zs-llm-description: >-
                Optional. The module that actually triggers the rule. Defaults
                to the rule's top-level module if omitted. Must be explicitly
                set when the trigger targets a different module - e.g., a rule
                on Leads triggered by 'note created' requires trigger_module =
                {api_name: 'Notes', id: '...'}. Use `getModules` to discover
                module api_name and id values.
              $ref: '#/components/schemas/ModuleOrFieldNestedSchema'
            field:
              type: object
              description: >-
                Represents the field reference returned in GET responses for
                time-offset triggers, including the trigger field details.
              additionalProperties: false
              properties:
                id:
                  type: string
                  description: >-
                    Represents the field identifier for the time-offset trigger.
                    Returns **-1** when the field is system-determined.
                  maxLength: 20
    ExecuteWhenT6ScoreUpdate:
      type: object
      description: >-
        Represents a score update trigger type (T6) that fires when a record
        score changes due to configured scoring rules.
      x-zs-llm-description: >-
        T6 - Score Update trigger (rule selection). Fires when a record's score
        changes based on scoring rules. Required details: type ('All_Rules' for
        any scoring rule, 'Selective_Rules' for specific rules). When
        type='Selective_Rules', the rules array is required with scoring rule
        IDs. Optional: repeat. Covers: score_increase, score_decrease,
        score_update, zia_scoring_rule. All support repeat except
        zia_scoring_rule. Validation: when type='Selective_Rules', rules must be
        non-empty, each rule ID must be a valid scoring rule belonging to the
        module (invalid -> INVALID_DATA), too many -> LIMIT_EXCEEDED. Example
        (All Rules): {"type": "score_update", "details": {"type": "All_Rules",
        "repeat": true}}. Example (Selective): {"type": "score_increase",
        "details": {"type": "Selective_Rules", "rules": [{"id":
        "738964000000085001"}], "repeat": false}}
      additionalProperties: false
      x-zs-$id: ExecuteWhenT6ScoreUpdate
      required:
        - type
        - details
      properties:
        type:
          description: >-
            Represents the trigger type for scoring rules. Supports score
            increase and score decrease trigger events.
          x-zs-llm-description: >-
            PURPOSE: Scoring trigger type. VALUES: 'score_increase' - triggers
            when the record's score increases. 'score_decrease' - triggers when
            the record's score decreases. 'score_update' - triggers when the
            record's score changes (increase or decrease). 'zia_scoring_rule' -
            system default scoring trigger from Zia. IMPORTANT: Distinct from
            details.type, which selects the scoring rule scope.
          type: string
          enum:
            - score_increase
            - score_decrease
            - score_update
            - zia_scoring_rule
        details:
          type: object
          additionalProperties: false
          description: >-
            Represents the score update trigger details, including the Scoring
            Rule scope and the applicable scoring rules.
          x-zs-llm-description: >-
            Score update trigger details. REQUIRED: type (All_Rules or
            Selective_Rules). Note: this 'type' is INSIDE details - separate
            from the outer execute_when.type.
          required:
            - type
          properties:
            type:
              type: string
              description: >-
                Represents the trigger type for scoring rules. Supports score
                increase and score decrease trigger events.
              x-zs-llm-description: >-
                REQUIRED. PURPOSE: Scoring rule scope. IMPORTANT: This 'type' is
                INSIDE details - separate from the outer execute_when.type.
                VALUES: 'All_Rules' - trigger on any scoring rule change.
                'Selective_Rules' - trigger only on specific scoring rules,
                which makes details.rules mandatory.
              enum:
                - All_Rules
                - Selective_Rules
            rules:
              type: array
              description: >-
                Represents the array of Scoring Rule references to monitor.
                Required when **type** is set to **Selective_Rules**.
              x-zs-llm-description: >-
                REQUIRED when details.type='Selective_Rules'. PURPOSE: Array of
                scoring rule references. The property is named 'rules' (NOT
                'scoring_rules'). PREREQUISITES: Fetch scoring rules via
                `getScoringRules`. MANDATORY: Each entry must have an 'id' field
                with a valid scoring rule ID belonging to the module. KEY
                CONSTRAINTS: Invalid IDs return INVALID_DATA. Too many entries
                return LIMIT_EXCEEDED.
              items:
                type: object
                description: >-
                  Represents a single Scoring Rule reference. Must include the
                  Scoring Rule ID for POST and PUT requests. The name field is
                  read-only and returned in GET responses.
                additionalProperties: false
                properties:
                  id:
                    type: string
                    maxLength: 20
                    description: Represents the unique ID of the Scoring Rule.
                  name:
                    type: string
                    maxLength: 255
                    readOnly: true
                    description: >-
                      Represents the display name of the Scoring Rule. This
                      field is read-only and returned in GET responses.
                required:
                  - id
              minItems: 1
              maxItems: 50
            repeat:
              type: boolean
              description: >-
                Indicates whether the rule fires every time the score condition
                is met. When false, the rule fires only on the first occurrence.
            trigger_module:
              description: >-
                The module that actually triggers the rule. Defaults to the
                rule's top-level module if omitted. Must be explicitly set when
                the trigger targets a different module, such as a rule on Leads
                triggered by a note creation event, which requires the trigger
                module to reference the Notes module. To discover module API
                names and identifiers, retrieve the available modules from the
                system.
              x-zs-llm-description: >-
                Optional. The module that actually triggers the rule. Defaults
                to the rule's top-level module if omitted. Must be explicitly
                set when the trigger targets a different module - e.g., a rule
                on Leads triggered by 'note created' requires trigger_module =
                {api_name: 'Notes', id: '...'}. Use `getModules` to discover
                module api_name and id values.
              $ref: '#/components/schemas/ModuleOrFieldNestedSchema'
    ExecuteWhenT7EmailRepliedWithin:
      type: object
      description: >-
        Represents an email-reply-window trigger type (T7) that fires when a
        sent email receives a reply within a configured time window.
      x-zs-llm-description: >-
        T7 - Email Replied Within trigger (period + unit with guard). Fires when
        a sent email receives a reply within a specified time window. Typically
        requires a dedicated email module with relational_criteria -- MUST call
        `getWorkflowConfigurations` to verify. Required details: period ('days'
        or 'hours'), unit (integer). Repeat NOT supported. This is the ONLY
        email trigger that accepts period/unit -- other email triggers
        (email_received, mail_sent, etc.) sending period/unit will receive
        INAPPROPRIATE_KEY_SENT. Example: {"type": "mail_sent_replied_within",
        "details": {"period": "days", "unit": 3}}
      additionalProperties: false
      x-zs-$id: ExecuteWhenT7EmailRepliedWithin
      required:
        - type
        - details
      properties:
        type:
          description: >-
            Represents the trigger type for email-reply-window rules. Requires a
            dedicated email module workflow rule.
          x-zs-llm-description: >-
            Email replied within trigger type. Typically requires a dedicated
            email module with relational_criteria -- MUST call
            `getWorkflowConfigurations` to verify. Value:
            'mail_sent_replied_within' - triggers when a sent email receives a
            reply within the specified time window.
          type: string
          enum:
            - mail_sent_replied_within
        details:
          type: object
          additionalProperties: false
          description: >-
            Represents the email-reply-window trigger details, including the
            time unit and magnitude for the reply window.
          x-zs-llm-description: >-
            Email replied within trigger details. REQUIRED: period (string -
            time unit name), unit (integer - time window magnitude). Repeat is
            NOT supported.
          required:
            - period
            - unit
          properties:
            period:
              type: string
              description: |-
                Represents the time unit for the reply window.
                Possible values:
                days - Window measured in days.
                hours - Window measured in hours.
              enum:
                - days
                - hours
            unit:
              type: integer
              format: int32
              description: >-
                Represents the reply window magnitude, such as 3 for a window of
                three days or three hours.
            trigger_module:
              description: >-
                The module that actually triggers the rule. Defaults to the
                rule's top-level module if omitted. Must be explicitly set when
                the trigger targets a different module  - e.g., a rule on Leads
                triggered by 'note created' requires trigger_module = {api_name:
                'Notes', id: '...'}. Use `getModules` to discover module
                api_name and id values.
              x-zs-llm-description: >-
                Optional. The module that actually triggers the rule. Defaults
                to the rule's top-level module if omitted. Must be explicitly
                set when the trigger targets a different module - e.g., a rule
                on Leads triggered by 'note created' requires trigger_module =
                {api_name: 'Notes', id: '...'}. Use `getModules` to discover
                module api_name and id values.
              $ref: '#/components/schemas/ModuleOrFieldNestedSchema'
    ConditionsNestedSchema:
      type: object
      additionalProperties: false
      description: >-
        Represents a single condition within a workflow rule that defines which
        records are evaluated and what actions are executed when the criteria
        are met.
      x-zs-llm-description: >-
        PURPOSE: A condition is the evaluation-and-action unit - it defines
        WHICH records to act on (via criteria_details) and WHAT to do (via
        instant_actions and/or scheduled_actions). Each condition is evaluated
        independently in sequence_number order. MANDATORY: sequence_number
        (integer, starting from 1, unique per rule). At least one of
        instant_actions or scheduled_actions MUST be present (both absent
        returns MANDATORY_NOT_FOUND). OPTIONAL: criteria_details (filter which
        records trigger actions - set criteria to null to match ALL records).
        KEY CONSTRAINTS: convert action REQUIRES criteria_details.criteria to be
        non-null (returns NOT_ALLOWED otherwise). EXAMPLE: {"sequence_number":
        1, "instant_actions": {"actions": [...]}, "criteria_details":
        {"criteria": null}}
      properties:
        sequence_number:
          type: integer
          format: int32
          description: >-
            Represents the execution order of this condition within the workflow
            rule, starting from one. Must be unique across all conditions in the
            rule.
          x-zs-llm-description: >-
            REQUIRED. PURPOSE: Execution order for the condition, starting from
            1. KEY CONSTRAINTS: Must be unique across conditions within the same
            rule - duplicate sequence numbers return INVALID_DATA.
        instant_actions:
          $ref: '#/components/schemas/InstantActionsNestedSchema'
          description: >-
            Actions to execute immediately when the condition is met. At least
            one of instant_actions or scheduled_actions must be present  -
            returns MANDATORY_NOT_FOUND if both are absent.
        scheduled_actions:
          $ref: '#/components/schemas/ScheduledActionsNestedSchema'
          description: >-
            Actions to execute after a configured delay. Scheduled actions
            require both the trigger and the action type to support scheduling.
          x-zs-llm-description: >-
            PURPOSE: Actions to execute after a configured delay. PREREQUISITES:
            Scheduled actions require both the trigger and the action type to
            support scheduling - use `getWorkflowConfigurations` to check
            triggers[].scheduled_actions_supported and
            actions[].supported_in_scheduled_action. KEY CONSTRAINTS: Not
            supported with repeat=true, or when a convert action is present in
            instant_actions.
        criteria_details:
          $ref: '#/components/schemas/CriteriaDetailsNestedSchema'
          description: >-
            Record matching criteria for this condition. When provided,
            criteria_details must be a JSON object and cannot be null. To match
            all records, pass an object with criteria set to null, but do not
            set criteria_details itself to null. This field is required for
            certain trigger types, such as related module triggers like Notes on
            Leads. The convert action type requires criteria_details.criteria to
            be a non-null filter object. Omit criteria_details entirely or pass
            criteria as null to match all records when the trigger does not
            require specific criteria and no convert action is present.
        id:
          type: string
          format: int64
          description: >-
            Represents the unique ID of the condition. Auto-generated on
            creation. Required on PUT to identify which condition to update.
          x-zs-llm-description: >-
            PURPOSE: Unique identifier for the condition. Auto-generated on
            create - never send it in a POST. MANDATORY on PUT to update an
            existing condition. KEY CONSTRAINTS: If omitted on PUT, the
            condition is added as new - returns INVALID_DATA if the
            sequence_number conflicts with an existing condition.
          pattern: ^[0-9]+$
          minLength: 1
          maxLength: 19
        _delete:
          type: 'null'
          description: >-
            Indicates that this condition should be removed from the workflow
            rule when set in a PUT request. Provide a null value to signal
            deletion.
      required:
        - sequence_number
    CriteriaDetailsNestedSchema:
      type: object
      additionalProperties: false
      description: >-
        Represents the filter criteria that determine which records satisfy the
        workflow rule condition.
      x-zs-llm-description: >-
        PURPOSE: Defines which records satisfy this condition - acts as a filter
        gate before actions execute. Contains two independent filter blocks:
        criteria (filters on the trigger module's own fields) and
        relational_criteria (filters on a related module's records).
        PREREQUISITES: Call `getFields` to discover available fields and their
        comparators. OPTIONAL: Both criteria and relational_criteria are
        optional - set criteria to null or omit to match ALL records. KEY
        CONSTRAINTS: (1) Required for certain trigger types (e.g., related
        module triggers) - returns DEPENDENT_FIELD_MISSING if omitted. (2)
        convert action REQUIRES non-null criteria. EXAMPLE (match all):
        {"criteria": null}. EXAMPLE (filter): {"criteria": {"field":
        {"api_name": "Lead_Status"}, "comparator": "equal", "value": "New"}}
      properties:
        criteria:
          oneOf:
            - $ref: '#/components/schemas/SimpleFilterCriterionRequest'
            - $ref: '#/components/schemas/GroupedFilterCriterionRequest'
            - type: 'null'
              x-zs-$id: CriteriaNullDetailsNestedSchema1
              description: >-
                Represents a null variant indicating no criteria or module
                filter is applied.
          description: >-
            Represents the filter criteria applied to the trigger module
            records. When null, the rule applies to all records without
            additional field-level filtering.
          x-zs-llm-description: >-
            PURPOSE: Filter on the trigger module's own fields. Null = match all
            records. FORMATS: (1) Simple - single condition:
            {"field":{"api_name":"Lead_Status"},"comparator":"equal","value":"New"}.
            (2) Grouped - AND/OR logic: {"group_operator":"and","group":[...]}
            (min 2 entries in group). COMPARATORS: equal, not_equal, contains,
            not_contains, starts_with, is_empty, is_not_empty, greater_than,
            less_than, between. LIMIT: Max 25 criteria leaf fields per criteria
            tree (returns LIMIT_EXCEEDED). Field api_name and comparator must be
            valid - returns INVALID_DATA otherwise.
        relational_criteria:
          type: object
          description: >-
            Represents the filter criteria applied to a related module when the
            trigger involves cross-module data, such as emails, calls, or notes.
          x-zs-llm-description: >-
            PURPOSE: Related-module filter for cross-module triggers (Email,
            Call, Notes, social, Appointments). MANDATORY on create when trigger
            supports related criteria (discover via
            `getWorkflowConfigurations`). Unsupported triggers return
            DEPENDENT_MISMATCH. MODES: 'specific' = one module (requires module,
            allows criteria), 'all' = all related (module and criteria must be
            null), 'unknown' = unlinked records (module and criteria must be
            null). ACTION MODULE RULE: Associate actions use main module.
            EXCEPTION: module_selection='specific' + main module
            Emails/Facebook/Twitter : actions must use
            relational_criteria.module. WRONG MODULE :
            AMBIGUITY_DURING_PROCESSING.
          additionalProperties: false
          properties:
            criteria:
              oneOf:
                - $ref: '#/components/schemas/SimpleFilterCriterionRequest'
                - $ref: '#/components/schemas/GroupedFilterCriterionRequest'
                - type: 'null'
                  description: >-
                    Represents a null variant indicating no criteria or module
                    filter is applied.
                  x-zs-$id: CriteriaNullDetailsNestedSchema2
              description: >-
                Represents the filter criteria applied to the related module
                records. Follows the same structure as the top-level criteria
                field.
              x-zs-llm-description: >-
                PURPOSE: Filter on related module's records. Same format as
                top-level criteria: simple
                {"field":{"api_name":"..."},"comparator":"...","value":"..."} or
                grouped {"group_operator":"and","group":[...]}. RULES: Allowed
                only when module_selection='specific' (concrete module context).
                MUST be null/absent when module_selection is 'all' or 'unknown'
                (non-null returns DEPENDENT_MISMATCH). Set to null under
                'specific' to match all records in the related module. Max 25
                criteria leaf fields per criteria tree.
            module_selection:
              type:
                - string
                - 'null'
              enum:
                - all
                - specific
                - unknown
                - null
              x-zs-llm-description: >-
                PURPOSE: Related module scope selector. MANDATORY when
                relational_criteria is provided. VALUES: 'specific' = one
                explicit module (REQUIRES module key, allows criteria for
                filtering), 'all' = all related modules (module MUST be
                null/absent, criteria MUST be null/absent; rejected if trigger
                does not support all-module mode), 'unknown' =
                unlinked/not-in-CRM records (module MUST be null/absent,
                criteria MUST be null/absent). Any other value returns
                INVALID_DATA.
              description: >-
                Represents the scope selector for the related module filter.
                Required when **relational_criteria** is present.
            module:
              oneOf:
                - $ref: '#/components/schemas/ModuleOrFieldNestedSchema'
                - type: 'null'
                  x-zs-$id: ModuleOrFieldNullDetailsNestedSchema
                  description: >-
                    Represents a null variant indicating no criteria or module
                    filter is applied.
              x-zs-llm-description: >-
                PURPOSE: Target related module. MANDATORY when
                module_selection='specific' (DEPENDENT_FIELD_MISSING if
                missing). MUST NOT be set when module_selection is 'all' or
                'unknown' (DEPENDENT_MISMATCH if present). Provide at least id
                or api_name; if both given they must resolve to same module.
                ACTION MODULE IMPACT: When main module is
                Emails/Facebook/Twitter, associate action entities must be
                created for THIS module (not the main module). For standard CRM
                main modules, actions use the main module regardless of this
                value.
              description: >-
                Represents the related module to filter on. Required when
                **module_selection** is set to **specific**.
    InstantActionsNestedSchema:
      type: object
      additionalProperties: false
      description: >-
        Represents the container for instant actions that execute immediately
        when the workflow rule condition is met.
      x-zs-llm-description: >-
        PURPOSE: Actions that execute immediately when the condition is met.
        PREREQUISITES: Call `getWorkflowConfigurations` for the target module to
        discover supported action types. DECISION: Check
        actions[].associate_action in response. If true: create entity first via
        its dedicated API, then send {type, id}. If false: send {type, details}
        with inline config. MANDATORY: actions array (non-empty). KEY
        CONSTRAINTS: Per-type limits from configurations; exceeding returns
        LIMIT_EXCEEDED.
      properties:
        actions:
          type: array
          description: >-
            Represents the array of action objects configured for this
            condition. Required and must be non-empty. Each action object
            specifies the action type and its configuration or reference ID.
          x-zs-llm-description: >-
            Array of action objects. Required, non-empty. DECISION PER ACTION:
            Check `getWorkflowConfigurations` actions[] for the target module.
            If associate_action=true: create entity first via its dedicated API,
            then send {type, id}. If associate_action=false: send {type,
            details} with inline config. LIMITS: Each type has per-type limit
            (actions[].limit) applied independently to instant_actions and
            scheduled_actions. Exceeding returns LIMIT_EXCEEDED.
          items:
            oneOf:
              - $ref: '#/components/schemas/NonAssociateActionsNestedSchema'
              - $ref: '#/components/schemas/AssociateActionsNestedSchema'
          maxItems: 50
      required:
        - actions
    ScheduledActionsNestedSchema:
      type:
        - array
        - 'null'
      x-zs-$id: ScheduledActionsNestedSchema
      description: >-
        Represents the container for scheduled actions that execute after a
        configured delay from the time the workflow rule condition is triggered.
      x-zs-llm-description: >-
        Use an array of up to five scheduled-action groups. For each group,
        provide execute_after and a non-empty actions array. Check
        getWorkflowConfigurations first: the trigger must support scheduled
        actions, and every action type must support scheduled execution. Also
        check getWorkflowRulesCount for the organization-specific
        scheduled-actions limit. Do not use scheduled actions when the trigger
        repeats or when instant_actions contains a convert action. An
        unsupported trigger can return DEPENDENT_MISMATCH.
      items:
        type:
          - object
          - 'null'
        additionalProperties: false
        description: Specify when the scheduled actions should be executed
        properties:
          execute_after:
            type: object
            additionalProperties: false
            description: >-
              Defines the delay before the scheduled actions execute. Required.
              Cannot be an empty object.
            x-zs-llm-description: >-
              REQUIRED. PURPOSE: Defines the delay before scheduled actions
              execute. PREREQUISITES: Verify scheduling support via
              `getWorkflowConfigurations` - check
              triggers[].scheduled_actions_supported and
              actions[].supported_in_scheduled_action. KEY CONSTRAINTS: Cannot
              be an empty object - returns MANDATORY_NOT_FOUND for the missing
              period and unit.
            properties:
              period:
                type: string
                description: >-
                  Represents the type of time interval. Required. Must be one of
                  the allowed period values (invalid_schedule_actions_period if
                  invalid). business_hours and business_days are only available
                  when org business hours are configured. The API returns
                  available periods from getWorkflowConfigurations.
                x-zs-llm-description: >-
                  The type of time interval. Required. Must be one of the
                  allowed period values (invalid_schedule_actions_period if
                  invalid). business_hours and business_days are only available
                  when org business hours are configured - omitted from allowed
                  periods otherwise. Available periods are returned by
                  `getWorkflowConfigurations`.
                enum:
                  - minutes
                  - hours
                  - days
                  - weeks
                  - months
                  - years
                  - business_hours
                  - business_days
              unit:
                type: integer
                format: int32
                description: >-
                  Represents the numeric delay value. Required. Allowed ranges
                  per period (unit_not_allowed_for_period if out of range):
                  minutes: 5-180 (2-180 if 1-min repetition feature is enabled),
                  hours: 0-99, days: 0-2000, weeks: 0-100, months: 0-24, years:
                  0-10, business_hours: 0-99, business_days: 0-2000. All values
                  must be non-negative (no pre-event offsets for scheduled
                  actions).
                x-zs-llm-description: >-
                  The numeric delay value. Required. Allowed ranges per period
                  (unit_not_allowed_for_period if out of range): minutes: 5-180
                  (2-180 if 1-min repetition feature is enabled), hours: 0-99,
                  days: 0-2000, weeks: 0-100, months: 0-24, years: 0-10,
                  business_hours: 0-99, business_days: 0-2000. All values must
                  be non-negative (no pre-event offsets for scheduled actions).
            required:
              - period
              - unit
          actions:
            type: array
            description: >
              Represents the array of action objects for this scheduled group.
              Uses the same associate and non-associate action structure as
              instant actions, but only action types that support scheduled
              execution are allowed. Per-type limits apply independently to
              instant and scheduled actions.
            x-zs-llm-description: >-
              PURPOSE: Array of action objects for this scheduled group.
              DECISION PER ACTION: Same associate vs non-associate decision as
              instant_actions - check actions[].associate_action via
              `getWorkflowConfigurations`. KEY CONSTRAINTS: Only types with
              supported_in_scheduled_action=true are allowed here. Per-type
              limits (actions[].limit) apply independently to instant and
              scheduled actions; exceeding returns LIMIT_EXCEEDED.
            items:
              oneOf:
                - $ref: '#/components/schemas/NonAssociateActionsNestedSchema'
                - $ref: '#/components/schemas/AssociateActionsNestedSchema'
            maxItems: 50
          id:
            type: string
            description: Represents unique Id of the scheduled action
            maxLength: 20
        required:
          - actions
      maxItems: 5
    AssociateActionsNestedSchema:
      x-zs-$id: AssociateActionsNestedSchema
      description: >-
        Represents an associate action that references a pre-configured action
        entity by its unique ID. Use the appropriate entity API to retrieve
        valid IDs.
      x-zs-llm-description: >-
        PURPOSE: References a pre-configured action entity by ID. WHEN TO USE:
        Check actions[].associate_action via `getWorkflowConfigurations` -- if
        true, use this schema. MANDATORY: type + id. OPTIONAL: related_details
        (varies by type). ENTITY MODULE RULE: - module_selection
        absent/all/unknown : create entity for main module. -
        module_selection='specific' + standard CRM module : create entity for
        main module. - module_selection='specific' + Emails/Facebook/Twitter :
        create entity for relational_criteria.module. WRONG MODULE :
        AMBIGUITY_DURING_PROCESSING. Fallback: re-create entity for
        relational_criteria.module and retry.
      discriminator:
        propertyName: type
      oneOf:
        - $ref: '#/components/schemas/EmailNotificationAssociateActionSchema'
        - $ref: '#/components/schemas/FieldUpdateAssociateActionSchema'
        - $ref: '#/components/schemas/TaskAssociateActionSchema'
        - $ref: '#/components/schemas/SimpleAssociateActionSchema'
    EmailNotificationAssociateActionSchema:
      type: object
      x-zs-$id: EmailNotificationAssociateActionSchema
      additionalProperties: false
      description: >-
        Represents an associate action that sends a pre-configured email
        notification when the workflow rule condition is triggered.
      x-zs-llm-description: >-
        PURPOSE: Sends a pre-configured email notification. PREREQUISITES:
        Create via `postEmailNotifications`, then reference by id. MANDATORY:
        type ('email_notifications'), id. OPTIONAL: related_details.best_time
        (bool - optimal send time). ENTITY MODULE: Create entity for main
        module. EXCEPTION: If module_selection='specific' and main module is
        Emails/Facebook/Twitter, create for relational_criteria.module instead.
        WRONG MODULE : AMBIGUITY_DURING_PROCESSING.
      properties:
        id:
          type: string
          description: >-
            Represents the unique ID of the email notification. Required when
            associating an existing email notification with the rule.
          x-zs-llm-description: >-
            MANDATORY. PURPOSE: The unique ID of the email notification.
            PREREQUISITES: List existing notifications via
            `getEmailNotifications`, or create one via `postEmailNotifications`
            and use the returned ID. KEY CONSTRAINTS: Omitting it returns
            DEPENDENT_FIELD_MISSING.
          maxLength: 20
          x-zs-$ref:
            resource: email_notifications
            origins:
              - operationId: getEmailNotifications
                propertyId: EmailNotificationsId
          example: '6660682000001435009'
          title: Email Notification Action Id
        name:
          type: string
          description: >-
            Represents the display name of the EmailNotificationAssociate
            action. Returned in GET responses and derived from the associated
            action configuration.
          maxLength: 500
        type:
          type: string
          description: >-
            Represents the action type discriminator that identifies this as a
            EmailNotificationAssociate action within the workflow rule. The
            value is fixed for this action type and must be supported by the
            target module and trigger event.
          x-zs-llm-description: >-
            Action type discriminator. Required. Must be supported for the
            module and trigger -- verify via `getWorkflowConfigurations`.
          const: email_notifications
        details:
          type: object
          description: >-
            Represents the read-only details of the associated email
            notification. Returned in GET responses and not required in POST or
            PUT requests.
          additionalProperties: false
          properties:
            module:
              $ref: '#/components/schemas/ModuleOrFieldNestedSchema'
              description: The module this action applies to.
        related_details:
          description: >-
            Controls whether the email is sent at the best time for the
            recipient (powered by Data Intelligence). Null when best_time is not
            enabled.
          $ref: '#/components/schemas/EmailNotificationRelatedDetailsSchema'
        _delete:
          type: 'null'
          description: >-
            Indicates that this action should be removed from the workflow rule
            when set in a PUT request. Provide a null value to signal deletion.
      required:
        - type
        - id
    FieldUpdateAssociateActionSchema:
      type: object
      x-zs-$id: FieldUpdateAssociateActionSchema
      additionalProperties: false
      description: >-
        Represents an associate action that updates field values using a
        pre-configured field update action when the workflow rule condition is
        triggered.
      x-zs-llm-description: >-
        PURPOSE: Updates fields using a pre-configured field update action.
        PREREQUISITES: Create via `createFieldUpdates`, then reference by id.
        MANDATORY: type ('field_updates'), id. OPTIONAL:
        related_details.lookup_field ({api_name, id} - targets related module's
        field; null for same-module). ENTITY MODULE: Create entity for main
        module. EXCEPTION: If module_selection='specific' and main module is
        Emails/Facebook/Twitter, create for relational_criteria.module instead.
        WRONG MODULE : AMBIGUITY_DURING_PROCESSING.
      properties:
        id:
          type: string
          description: >-
            Represents the unique ID of the field update action. Use the Get
            Field Updates API to retrieve available IDs.
          x-zs-llm-description: >-
            MANDATORY. PURPOSE: The unique ID of the field update.
            PREREQUISITES: List existing field updates via `getFieldUpdates`, or
            create one via `createFieldUpdates` and use the returned ID. KEY
            CONSTRAINTS: Omitting it returns DEPENDENT_FIELD_MISSING.
          maxLength: 20
          x-zs-$ref:
            resource: field_updates
            origins:
              - operationId: getFieldUpdates
                propertyId: FieldUpdatesId
          example: '3361265000006176255'
          title: Field Update Action Id
        name:
          type: string
          description: >-
            Represents the display name of the FieldUpdateAssociate action.
            Returned in GET responses and derived from the referenced action
            configuration.
          maxLength: 500
        type:
          type: string
          description: >-
            Represents the action type discriminator that identifies this as a
            FieldUpdateAssociate action within the workflow rule. The value is
            fixed for this action type and must be supported by the target
            module and trigger event.
          x-zs-llm-description: >-
            Action type discriminator. Required. Must be supported for the
            module and trigger -- verify via `getWorkflowConfigurations`.
          const: field_updates
        details:
          type: object
          description: >-
            Represents the read-only details of the associated field update
            action. Returned in GET responses and not required in POST or PUT
            requests.
          additionalProperties: false
          properties:
            module:
              $ref: '#/components/schemas/ModuleOrFieldNestedSchema'
              description: The module this action applies to.
        related_details:
          description: >-
            Specifies the lookup field when the field update targets a related
            module. Null when the update targets the workflow rule's own module.
          $ref: '#/components/schemas/FieldUpdateRelatedDetailsSchema'
        _delete:
          type: 'null'
          description: >-
            Indicates that this action should be removed from the workflow rule
            when set in a PUT request. Provide a null value to signal deletion.
      required:
        - type
        - id
    TaskAssociateActionSchema:
      type: object
      x-zs-$id: TaskAssociateActionSchema
      additionalProperties: false
      description: >-
        Represents an associate action that creates a task based on a
        pre-configured task template when the workflow rule condition is
        triggered.
      x-zs-llm-description: >-
        PURPOSE: Creates a task using a pre-configured task action.
        PREREQUISITES: Create via `createWorkflowTasks`, then reference by id.
        MANDATORY: type ('tasks'), id. OPTIONAL:
        related_details.followup_details ({condition, unit, period} -
        auto-followup after status change). ENTITY MODULE: Create entity for
        main module. EXCEPTION: If module_selection='specific' and main module
        is Emails/Facebook/Twitter, create for relational_criteria.module
        instead. WRONG MODULE : AMBIGUITY_DURING_PROCESSING.
      properties:
        id:
          type: string
          description: >-
            Represents the unique ID of the task action. Required to associate a
            pre-configured task with the workflow rule.
          x-zs-llm-description: >-
            MANDATORY. PURPOSE: The unique ID of the task action. PREREQUISITES:
            List existing workflow tasks via `getWorkflowTasks`, or create one
            via `createWorkflowTasks` and use the returned ID. KEY CONSTRAINTS:
            Omitting it returns DEPENDENT_FIELD_MISSING.
          maxLength: 20
          x-zs-$ref:
            resource: workflow_tasks
            origins:
              - operationId: getWorkflowTasks
                propertyId: WorkflowTaskId
        name:
          type: string
          description: >-
            Represents the display name of the TaskAssociate action. Returned in
            GET responses and derived from the referenced action configuration.
          maxLength: 500
        type:
          type: string
          description: >-
            Represents the action type discriminator that identifies this as a
            TaskAssociate action within the workflow rule. The value is fixed
            for this action type and must be supported by the target module and
            trigger event.
          x-zs-llm-description: >-
            Action type discriminator. Required. Must be supported for the
            module and trigger -- verify via `getWorkflowConfigurations`.
          const: tasks
        details:
          type: object
          description: >-
            Represents the read-only details of the associated task action.
            Returned in GET responses and not required in POST or PUT requests.
          additionalProperties: false
          properties:
            module:
              $ref: '#/components/schemas/ModuleOrFieldNestedSchema'
              description: The module this action applies to.
        related_details:
          description: >-
            Configures a followup task that is automatically created after the
            original task, based on a status condition and time delay. Null when
            no followup is configured.
          $ref: '#/components/schemas/TaskRelatedDetailsSchema'
        _delete:
          type: 'null'
          description: >-
            Indicates that this action should be removed from the workflow rule
            when set in a PUT request. Provide a null value to signal deletion.
      required:
        - type
        - id
    SimpleAssociateActionSchema:
      type: object
      x-zs-$id: SimpleAssociateActionSchema
      additionalProperties: false
      description: >-
        Represents an associate action that references a pre-configured action
        entity by its unique ID, applicable to action types such as webhooks,
        functions, and notifications.
      x-zs-llm-description: >-
        PURPOSE: Associate action referencing a pre-configured entity by ID. No
        related_details. CREATE ENTITY: webhooks : `createWebhooks`, functions :
        `createFunctions`, sms/whatsapp : `postMessageNotification`.
        sms/whatsapp require the channel enabled in org. MANDATORY: type, id.
        ENTITY MODULE: Create entity for main module. EXCEPTION: If
        module_selection='specific' and main module is Emails/Facebook/Twitter,
        create for relational_criteria.module instead. WRONG MODULE :
        AMBIGUITY_DURING_PROCESSING.
      properties:
        id:
          type: string
          description: >-
            Represents the unique ID of the pre-configured action entity.
            Required to associate an existing action with the workflow rule.
          x-zs-llm-description: >-
            MANDATORY. PURPOSE: The unique ID of the pre-configured action
            entity. PREREQUISITES: Fetch by type - webhooks: `getWebhooks`,
            functions: `getFunctions`, sms/whatsapp: `getMessageNotifications`.
            KEY CONSTRAINTS: Omitting it returns DEPENDENT_FIELD_MISSING.
          maxLength: 20
        name:
          type: string
          description: >-
            Represents the display name of the SimpleAssociate action. Returned
            in GET responses and derived from the referenced action
            configuration.
          maxLength: 500
        type:
          type: string
          description: |-
            Represents the type of associate action.
            Possible values:
            webhooks - HTTP callback to an external URL.
            functions - Custom function execution.
            email_notifications - Automated email notification.
            tasks - Task creation action.
          x-zs-llm-description: >-
            PURPOSE: Associate action type. VALUES: webhooks = HTTP callback to
            external URL. functions = custom Deluge function. sms =
            pre-configured SMS notification. whatsapp = pre-configured WhatsApp
            notification. KEY CONSTRAINTS: sms/whatsapp require the respective
            channel to be enabled in the org. email_notifications and tasks are
            NOT handled by this schema - they route to
            EmailNotificationAssociateActionSchema and
            TaskAssociateActionSchema, which support related_details.
          enum:
            - webhooks
            - functions
            - sms
            - whatsapp
        details:
          type: object
          description: >-
            Represents the read-only details of the associated action entity.
            Returned in GET responses and not required in POST or PUT requests.
          additionalProperties: false
          properties:
            module:
              $ref: '#/components/schemas/ModuleOrFieldNestedSchema'
              description: The module this action applies to.
        _delete:
          type: 'null'
          description: >-
            Indicates that this action should be removed from the workflow rule
            when set in a PUT request. Provide a null value to signal deletion.
      required:
        - type
        - id
    NonAssociateActionsNestedSchema:
      x-zs-$id: NonAssociateActionsNestedSchema
      description: >-
        Represents an inline action configuration that is defined directly
        within the workflow rule condition, rather than referencing a
        pre-created action entity by ID.
      x-zs-llm-description: >-
        PURPOSE: Inline action configured with type + details in the workflow
        rule body. WHEN TO USE: Check actions[].associate_action via
        `getWorkflowConfigurations` -- if false for the action type, use this
        schema. FLOW: Provide type (action discriminator) + details (object with
        full inline config). Each action type has a different details structure
        -- read the corresponding oneOf schema description for MANDATORY fields
        and EXAMPLE. MANDATORY: type (string), details (object). No pre-created
        entity or ID needed.
      discriminator:
        propertyName: type
      oneOf:
        - $ref: '#/components/schemas/AssignOwnerActionSchema'
        - $ref: '#/components/schemas/CreateRecordActionSchema'
        - $ref: '#/components/schemas/CreateConnectedRecordActionSchema'
        - $ref: '#/components/schemas/AddMeetingActionSchema'
        - $ref: '#/components/schemas/ScheduleCallActionSchema'
        - $ref: '#/components/schemas/AddTagsActionSchema'
        - $ref: '#/components/schemas/RemoveTagsActionSchema'
        - $ref: '#/components/schemas/ConvertActionSchema'
        - $ref: '#/components/schemas/ChatNotificationActionSchema'
        - $ref: '#/components/schemas/CircuitsActionSchema'
        - $ref: '#/components/schemas/ZohoFlowActionSchema'
        - $ref: '#/components/schemas/SocialActionSchema'
        - $ref: '#/components/schemas/EmailCreateRecordActionSchema'
    RelatedDetailsNestedSchema:
      description: >-
        Represents the optional action-specific configuration attached to an
        associate action, such as best-time delivery settings for email
        notifications or lookup field references for field updates.
      x-zs-llm-description: >-
        Discriminator (oneOf) for action-specific supplementary configuration.
        Only three action types support related_details: email_notifications
        (best_time delivery), tasks (followup_details), and field_updates
        (lookup_field for cross-module targeting). Other action types do not use
        related_details.
      oneOf:
        - type: object
          x-zs-$id: RelatedDetailsBestTimeSchema
          description: >-
            Represents the email notification related details, including
            best-time delivery configuration.
          additionalProperties: false
          properties:
            best_time:
              type: boolean
              description: >-
                Indicates whether to send the email notification at the best
                time for the recipient. When set to true, the platform
                determines the optimal send time.
        - type: object
          x-zs-$id: RelatedDetailsFollowupSchema
          description: >-
            Represents the task related details, including followup task
            configuration.
          additionalProperties: false
          properties:
            followup_details:
              type: object
              description: >-
                Represents the followup task configuration, including the
                trigger condition and delay settings.
              additionalProperties: false
              properties:
                condition:
                  type: string
                  description: >-
                    Represents the task status condition that triggers the
                    followup task, such as **Completed** or **Not Started**.
                  maxLength: 255
                unit:
                  type: integer
                  format: int32
                  description: >-
                    Represents the numeric time value for the delay before
                    creating the followup task.
                period:
                  type: string
                  description: >-
                    Represents the time period label for the delay before
                    creating the followup task, such as **days**, **hours**, or
                    **minutes**.
                  maxLength: 50
        - type: object
          x-zs-$id: RelatedDetailsLookupFieldSchema
          description: >-
            Represents the field update related details, including the lookup
            field for cross-module updates.
          additionalProperties: false
          properties:
            lookup_field:
              $ref: '#/components/schemas/ModuleOrFieldNestedSchema'
              description: >-
                The lookup field linking the rule module to the target module
                (e.g., Account_Name on Contacts). Provide the field's id and
                api_name. When the field update targets the same module,
                related_details is null.
        - type: 'null'
          x-zs-$id: RelatedDetailsNullSchema
          description: >-
            Represents a null value indicating no related details are configured
            for this action.
    EmailNotificationRelatedDetailsSchema:
      description: >-
        Represents the optional related configuration details for email
        notification actions, including best-time delivery settings.
      x-zs-llm-description: >-
        Supplementary config for email_notifications associate action. Controls
        best-time delivery scheduling - when best_time=true, the email is sent
        at the recipient's optimal engagement time rather than immediately.
      oneOf:
        - type: object
          x-zs-$id: EmailNotificationRelatedDetailsBestTimeSchema
          additionalProperties: false
          description: >-
            Represents the best-time delivery configuration for the email
            notification action, controlling when the email sends to reach the
            recipient at the optimal delivery time.
          properties:
            best_time:
              type: boolean
              description: >-
                Indicates whether to send the email notification at the best
                time for the recipient. When set to true, the platform
                determines the optimal send time.
        - type: 'null'
          x-zs-$id: EmailNotificationRelatedDetailsNullSchema
          description: >-
            Represents a null value indicating best-time delivery is not
            configured for this email notification action.
    TaskRelatedDetailsSchema:
      description: >-
        Represents the optional related configuration details for task actions,
        specifying whether and how a followup task should be created.
      x-zs-llm-description: >-
        Supplementary config for tasks associate action. Configures automatic
        followup task creation based on condition/unit/period - creates a new
        followup task after the original task's status changes.
      oneOf:
        - type: object
          x-zs-$id: TaskRelatedDetailsFollowupSchema
          additionalProperties: false
          description: >-
            Represents the followup task configuration that defines the status
            condition and delay for automatically creating a followup task.
          properties:
            followup_details:
              type: object
              description: >-
                Represents the followup task configuration, including the
                trigger condition and delay settings.
              additionalProperties: false
              properties:
                condition:
                  type: string
                  description: >-
                    Represents the task status condition that triggers the
                    followup task, such as **Completed** or **Not Started**.
                  maxLength: 255
                unit:
                  type: integer
                  format: int32
                  description: >-
                    Represents the numeric time value for the delay before
                    creating the followup task.
                period:
                  type: string
                  description: >-
                    Represents the time period label for the delay before
                    creating the followup task, such as **days**, **hours**, or
                    **minutes**.
                  maxLength: 50
        - type: 'null'
          x-zs-$id: TaskRelatedDetailsNullSchema
          description: >-
            Represents a null value indicating no followup task is configured
            for this task action.
    FieldUpdateRelatedDetailsSchema:
      description: >-
        Represents the optional related configuration details for field update
        actions, specifying the lookup field used for cross-module field
        updates.
      x-zs-llm-description: >-
        Supplementary config for field_updates associate action. Specifies
        lookup_field ({api_name, id}) to target a related module's field via a
        lookup relationship. Set to null for same-module field updates.
      oneOf:
        - type: object
          x-zs-$id: FieldUpdateRelatedDetailsLookupSchema
          additionalProperties: false
          description: >-
            Represents the lookup field configuration that identifies the
            related module record for cross-module field update actions.
          properties:
            lookup_field:
              $ref: '#/components/schemas/ModuleOrFieldNestedSchema'
              description: >-
                The lookup field linking the rule module to the target module
                (e.g., Account_Name on Contacts). Provide the field's id and
                api_name.
        - type: 'null'
          x-zs-$id: FieldUpdateRelatedDetailsNullSchema
          description: >-
            Represents a null value indicating the field update targets the
            workflow rule own module with no lookup field required.
    CreatedModifiedByObjectSchema:
      type: object
      additionalProperties: false
      description: >-
        Represents the identity details of the CRM user who created or last
        modified the workflow rule.
      x-zs-llm-description: >-
