        capacity.
      properties:
        active_rules_configured:
          type: integer
          format: int32
          description: Represents number of currently active workflow rules configured.
        module:
          $ref: '#/components/schemas/ModuleOrFieldNestedSchema'
        total_rules_configured:
          type: integer
          format: int32
          description: >-
            Represents total number of workflow rules configured (active +
