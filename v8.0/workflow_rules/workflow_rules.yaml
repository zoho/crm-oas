                Error400Response3:
                  summary: Error response
                  value:
                    reorder:
                      - code: INVALID_DATA
                        message: Invalid data
                        details:
                          api_name: workflow_rules
                          maximum_length: 2
                          json_path: $.reorder.workflow_rules
                        status: error
                  description: >-
                    Shows an INVALID_DATA error returned when the workflow_rules
