      x-zs-llm-description: >-
        PURPOSE: Creates a connected record in a child module. Same as
        create_record but module must be a connected-record child. Requires
        ManageAutomation or ManageConnectedWorkflow. Limit: 1/rule. Not for
        Notes, Rebuy, Competitor Mentions. PREREQUISITES:
        `getWorkflowConfigurations` to verify enabled. `getLayouts` for layout +
        mandatory fields. `getFields` for field ids. MANDATORY in details:
        module ({api_name, id} of child), layout ({id}), field_mappings (array
        1-25, include all mandatory fields). OPTIONAL: apply_restriction (bool).
        EXAMPLE: {"type": "create_connected_record", "details": {"module":
        {"api_name": "Tasks", "id": "738964000000000187"}, "layout": {"id":
        "738964000000091055"}, "field_mappings": [{"field": {"api_name":
        "Subject"}, "type": "static", "value": "Follow up"}]}}
      properties:
        name:
          type: string
          description: >-
            Represents the display name of the CreateConnectedRecord action as
            it appears within the workflow rule configuration.
          maxLength: 100
        type:
          type: string
          description: >-
            Represents the action type discriminator that identifies this as a
            CreateConnectedRecord action within the workflow rule. The value is
            fixed for this action type and must be supported by the target
            module and trigger event.
          x-zs-llm-description: >-
            Action type discriminator. Required. Must be supported for the
            module and trigger -- verify via `getWorkflowConfigurations`.
          const: create_connected_record
        details:
          description: >
            Configuration for the create_connected_record action. Uses the same
            structure as create_record — module, layout, and field mappings —
            but the module must be a valid connected-record child module. Not
            supported for the Notes, Rebuy, or Competitor Mentions modules.
          x-zs-llm-description: >-
            Configuration for create_connected_record. Same structure as
            create_record but module must be a valid connected-record child
            module. REQUIRED: module, layout, field_mappings. Not supported for
            Notes, Rebuy, or Competitor Mentions modules.
          $ref: '#/components/schemas/AutomationCreateConnectedRecordDetails'
        related_details:
          description: Optional. Not typically used for create_connected_record.
          $ref: '#/components/schemas/RelatedDetailsNestedSchema'
        id:
          type: string
          description: >-
            Represents the unique ID of the CreateConnectedRecord action within
            the workflow rule.
          maxLength: 20
        _delete:
          type: 'null'
          description: >-
            Indicates that this action should be removed from the workflow rule
            when set in a PUT request. Provide a null value to signal deletion.
      required:
        - type
        - details
    ChatNotificationActionSchema:
      type: object
      x-zs-$id: ChatNotificationActionSchema
      additionalProperties: false
      description: >-
        Represents a non-associate action that sends a chat notification to an
        integrated chat service, such as Slack or Zoho Cliq, when the workflow
        rule condition is triggered.
      x-zs-llm-description: >-
        Supports Slack, Zoho Cliq, Cisco Webex, Google Chat, and Microsoft
        Teams. Limit: one action per type per rule. Call
        `getWorkflowConfigurations` to identify chat services enabled for the
        module. Provide required `name`, `type`, and `details`. Valid types are
        `slack_notifications`, `cliq_notifications`, `cisco_notifications`,
        `google_chat_notifications`, and `microsoft_teams_notifications`. In
        `details`, provide required `message` and `notify_to`; messages support
        merge fields such as `${Module.Field}`. Set `notify_to.type` to `user`,
        `channel`, or `fields`. For `user` or `channel`, provide `id` and
        `name`; for `fields`, provide `module` and `notify_fields.fields`.
      properties:
        name:
          type: string
          description: >-
            Represents the display name of the ChatNotification action. This
            field is required.
          maxLength: 100
        type:
          type: string
          description: >-
            Represents chat service type. Each service has a limit of 1 action
            per rule.
          enum:
            - slack_notifications
            - cliq_notifications
            - cisco_notifications
            - google_chat_notifications
            - microsoft_teams_notifications
        details:
          description: >-
            Configuration for the chat notification action. Requires a message,
            which supports merge fields, and a target channel, user, or field to
            notify.
          x-zs-llm-description: >-
            Chat notification configuration. REQUIRED: message (supports merge
            fields), notify_to (target channel/user/fields). Errors:
            MANDATORY_NOT_FOUND if name/message/type missing,
            DEPENDENT_FIELD_MISSING if id/name missing for user/channel,
            INVALID_DATA if invalid type/module/field.
          $ref: '#/components/schemas/AutomationChatNotificationDetails'
        id:
          type: string
          description: >-
            Represents the unique ID of the ChatNotification action within the
            workflow rule.
          maxLength: 20
        _delete:
          type: 'null'
          description: >-
            Indicates that this action should be removed from the workflow rule
            when set in a PUT request. Provide a null value to signal deletion.
      required:
        - type
        - name
        - details
    CircuitsActionSchema:
