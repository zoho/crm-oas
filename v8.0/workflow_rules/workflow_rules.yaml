openapi: 3.1.0
info:
  title: Workflow Rules
  description: >
    Workflow Rules APIs create, manage, and monitor automation rules that
    trigger actions when specific events occur on CRM module records. These APIs
    automate repetitive tasks such as sending emails, updating fields, creating
    records, assigning owners, converting leads, and sending chat notifications.
    All automation is driven by record-level events including create, edit,
    field change, date-based triggers, score changes, and other supported
    trigger types.


    Before creating or updating rules, always retrieve the [Workflow
    Configurations](workflow_configurations.yaml#$.paths./workflow_configurations.get)
    for the target module to understand supported triggers, action types, and
    system limits. The platform enforces specific constraints, including a
    maximum of 10 conditions per rule and a maximum of 5 instant actions and 5
    scheduled actions per condition. Actions are categorized as either associate
    actions, which reference a pre-created entity by its unique identifier, or
    non-associate actions, which are configured inline within the rule body.


    This API provides comprehensive workflow rule management capabilities,
    including creation, updates, listing and retrieval, deletion, reordering
    execution priority, cloning rules, and retrieving action counts, usage
    reports, and organization-level quotas. For detailed guidance, refer to the
    official documentation on configuring workflow rules.
  version: '8'
servers:
  - url: https://zohoapis.{dc}/crm/{version}
    description: Zoho API Base URL
    variables:
      dc:
        enum:
          - com
          - eu
          - in
          - ca
          - au
          - sa
          - ae
        default: com
      version:
        description: API version identifier for endpoint routing
        default: v8
paths:
  /settings/automation/workflow_rules:
    post:
      summary: Create a workflow rule for a module
      description: >-
        To create a workflow rule for a specified module in your Zoho CRM
        organization. Each request accepts exactly one rule, defined within the
        workflow_rules array.
      x-zs-llm-description: >-
        Use this to create a new workflow rule. Always call
        getWorkflowConfigurations first to validate trigger availability for the
        target module  triggers are module-specific despite being listed
        globally. Call getWorkflowRulesCount to check org limits before
        creating. The response returns the created rule ID. Common failures:
        INVALID_DATA (unsupported trigger for module), LIMIT_EXCEEDED (org quota
        hit), DEPENDENT_FIELD_MISSING (missing action details).
      operationId: postWorkflowRule
      security:
        - OAuth2:
            - ZohoCRM.settings.workflow_rules.CREATE
      requestBody:
        description: Workflow rule configuration payload.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostWorkflowRuleSchema'
            examples:
              SamplePostRequest:
                summary: Sample request body
                value:
                  workflow_rules:
                    - name: WORKFLOWRULE-POST
                      description: null
                      module:
                        api_name: Contacts
                        id: '3361265000000000129'
                      execute_when:
                        type: create
                        details:
                          trigger_module:
                            api_name: Contacts
                            id: '3361265000000000129'
                      conditions:
                        - sequence_number: 1
                          criteria_details:
                            criteria:
                              group_operator: AND
                              group:
                                - comparator: equal
                                  field:
                                    api_name: Annual_Revenue
                                    id: '3361265000000000555'
                                  value: ${NOTEMPTY}
                                - comparator: equal
                                  field:
                                    api_name: Phone
                                    id: '3361265000000000557'
                                  value: ${NOTEMPTY}
                          instant_actions:
                            actions:
                              - name: CreateRecord-POST
                                details:
                                  layout:
                                    id: '3361265000000095023'
                                    name: Standard
                                  module:
                                    id: '3361265000000000131'
                                    api_name: Deals
                                  field_mappings:
                                    - field:
                                        id: '3361265000000000515'
                                        api_name: Owner
                                      type: static
                                      value:
                                        id: '3361265000002134004'
                                        name: user2 testUser
                                    - field:
                                        id: '3361265000000000519'
                                        api_name: Deal_Name
                                      type: static
                                      value: CreateRecord-POST
                                    - field:
                                        id: '3361265000000000521'
                                        api_name: Closing_Date
                                      type: execution_time
                                      value:
                                        period: business_days
                                        unit: '2'
                                        sign: plus
                                        trigger_field: ${CURRENTTIME}
                                    - field:
                                        id: '3361265000000236001'
                                        api_name: Pipeline
                                      type: static
                                      value: Test
                                    - field:
                                        id: '3361265000000000525'
                                        api_name: Stage
                                      type: static
                                      value: Qualification
                                  apply_restriction: true
                                type: create_record
                              - name: AddMeeting-POST
                                details:
                                  meeting_duration:
                                    unit: 2
                                    period: minutes
                                  host_unavailable:
                                    assign_record_owner_as_host: true
                                  layout:
                                    id: '3361265000000095045'
                                    name: Standard
                                  module:
                                    id: '3361265000000000145'
                                    api_name: Events
                                  field_mappings:
                                    - field:
                                        id: '3361265000000000249'
                                        api_name: Event_Title
                                      type: static
                                      value: AddMeeting-POST
                                    - field:
                                        id: '3361265000000101001'
                                        api_name: Start_DateTime
                                      type: execution_time
                                      value:
                                        period: minutes
                                        unit: '2'
                                        sign: plus
                                        trigger_field: ${CURRENTTIME}
                                    - field:
                                        id: '3361265000000057003'
                                        api_name: All_day
                                      type: static
                                      value: 'true'
                                    - field:
                                        id: '3361265000000000247'
                                        api_name: Owner
                                      type: static
                                      value:
                                        id: '3361265000002134004'
                                        name: user2 testUser
                                type: add_meeting
                              - name: ScheduleCall-POST
                                details:
                                  layout:
                                    id: '3361265000000095033'
                                    name: Standard
                                  module:
                                    id: '3361265000000017015'
                                    api_name: Calls
                                  field_mappings:
                                    - field:
                                        id: '3361265000000017021'
                                        api_name: Call_Type
                                      type: static
                                      value: Outbound
                                    - field:
                                        id: '3361265000000245003'
                                        api_name: Outgoing_Call_Status
                                      type: static
                                      value: Scheduled
                                    - field:
                                        id: '3361265000000017029'
                                        api_name: Call_Start_Time
                                      type: execution_time
                                      value:
                                        period: business_days
                                        unit: '2'
                                        sign: plus
                                        trigger_field: ${CURRENTTIME}
                                    - field:
                                        id: '3361265000000017017'
                                        api_name: Owner
                                      type: static
                                      value:
                                        id: '3361265000002134004'
                                        name: user2 testUser
                                    - field:
                                        id: '3361265000000017023'
                                        api_name: Call_Purpose
                                      type: static
                                      value: Demo
                                    - field:
                                        id: '3361265000000536391'
                                        api_name: Call_Agenda
                                      type: static
                                      value: Demo
                                type: schedule_call
                              - type: add_tags
                                name: criteria
                                details:
                                  over_write: false
                                  tags:
                                    - id: '3361265000001715141'
                                      name: criteria
                                      color_code: '#879BFC'
                                  module:
                                    api_name: Contacts
                                    id: '3361265000000000129'
                              - type: remove_tags
                                name: criteria
                                details:
                                  tags:
                                    - id: '3361265000001715141'
                                      name: criteria
                                      color_code: '#879BFC'
                                  module:
                                    api_name: Contacts
                                    id: '3361265000000000129'
                              - details:
                                  add_to_existing_contact: false
                                  add_to_existing_account: true
                                  move_attachment_to:
                                    id: '3361265000000000129'
                                    api_name: Contacts
                                  carry_tags:
                                    - id: '3361265000000000129'
                                      api_name: Contacts
                                    - id: '3361265000000000127'
                                      api_name: Accounts
                                    - id: '3361265000000000131'
                                      api_name: Deals
                                  field_mappings:
                                    - field:
                                        id: '3361265000000000519'
                                        api_name: Deal_Name
                                      type: static
                                      value: CreatedViaConvert
                                    - field:
                                        id: '3361265000000000521'
                                        api_name: Closing_Date
                                      type: execution_time
                                      value:
                                        period: days
                                        unit: '2'
                                        sign: plus
                                        trigger_field: ${CURRENTTIME}
                                    - field:
                                        id: '3361265000000000525'
                                        api_name: Stage
                                      type: static
                                      value: Qualification
                                    - field:
                                        id: '3361265000000236001'
                                        api_name: Pipeline
                                      type: static
                                      value: Standard (Standard)
                                  create_deal: true
                                  change_owner:
                                    apply_assignment_threshold: false
                                    id: '4554012000000623001'
                                  contact_role: '3361265000000000052'
                                type: convert
                                name: Create Contact, Account and Deal
                          scheduled_actions:
                            - execute_after:
                                period: minutes
                                unit: 2
                              actions:
                                - id: '3361265000006458562'
                                  type: email_notifications
                                  name: EmailNotification
                                  related_details:
                                    best_time: true
                                - name: 'To users : user2 testUser'
                                  type: assign_owner
                                  details:
                                    module:
                                      api_name: Vendors
                                      id: '3361265000000000165'
                                    assign_to:
                                      - type: user
                                        resource:
                                          id: '3361265000002134004'
                                          name: user2 testUser
                                      - type: role
                                        resource:
                                          id: '3361265000000015969'
                                          name: Manager
                                        allow_agent_user: true
                                      - type: group
                                        resource:
                                          id: '3361265000002284248'
                                          name: APGroup
                                      - type: profile
                                        resource:
                                          id: '3361265000001212003'
                                          name: Managers
                                        associated_to: team_profile
                                    related_records:
                                      - api_name: Events
                                      - api_name: Calls
                                    notify: true
                                    lookup_field:
                                      id: '3361265000000000447'
                                      api_name: Vendor_Name
                                    apply_assignment_threshold: true
                                    user_availability_based_on:
                                      - online_status
                                  related_details:
                                    lookup_field:
                                      id: '3361265000000000447'
                                      api_name: Vendor_Name
                                - id: '3361265000004189028'
                                  type: tasks
                                  name: test
                                - id: '3361265000006477034'
                                  type: webhooks
                                  name: Test
                                - id: '3361265000006131248'
                                  type: functions
                                  name: Function
                                - type: field_updates
                                  name: FieldUpdate
                                  id: '3361265000006526009'
                                  related_details:
                                    lookup_field:
                                      id: '3361265000000000447'
                                      api_name: Vendor_Name
            x-zs-llm-examples:
              - SamplePostRequest
      responses:
        '201':
          description: Workflow Rule created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowSuccessSchema'
              examples:
                SuccessResponse:
                  summary: POST- Success response for status 201
                  value:
                    workflow_rules:
                      - code: SUCCESS
                        details:
                          id: '3361265000006294001'
                        message: workflow created
                        status: success
        '400':
          description: >
            The response returned when the request contains invalid, missing, or
            unsupported data. Resolution: review the error details to identify
            the field or value that failed validation, correct it, and resubmit
            the request
          content:
            application/json:
              schema:
                x-zs-$id: WorkflowRuleCreateErrorResponses
                oneOf:
                  - type: object
                    x-zs-$id: WorkflowRuleCreateErrorResponse
                    additionalProperties: false
                    description: Wrapped error response with workflow_rules
                    properties:
                      workflow_rules:
                        type: array
                        description: Array of error objects
                        items:
                          oneOf:
                            - $ref: '#/components/schemas/DependentFieldMissingSchema'
                            - $ref: '#/components/schemas/ExpectedFieldMissingSchema'
                            - $ref: >-
                                #/components/schemas/AmbiguityDuringProcessingSchema
                            - $ref: '#/components/schemas/LimitExceededSchema'
                            - $ref: '#/components/schemas/DependentMisMatchSchema'
                            - $ref: '#/components/schemas/AlreadyUsedSchema'
                            - $ref: '#/components/schemas/CannotRemoveSchema'
                            - $ref: '#/components/schemas/RequiredDataNotFoundSchema'
                            - $ref: '#/components/schemas/FeatureDisabledSchema'
                            - $ref: '#/components/schemas/FailureSchema'
                        maxItems: 25
                    required:
                      - workflow_rules
              examples:
                InvalidDataResponse1:
                  summary: >-
                    Error response with code INVALID_DATA: invalid data (Field:
                    workflow_rules)
                  value:
                    code: INVALID_DATA
                    details:
                      api_name: workflow_rules
                      json_path: $.workflow_rules
                    message: invalid data
                    status: error
                InvalidDataResponse2:
                  summary: >-
                    Error response with code INVALID_DATA: Invalid data type
                    (Field: name)
                  value:
                    workflow_rules:
                      - code: INVALID_DATA
                        message: Invalid data type
                        details:
                          api_name: name
                          expected_data_type: text
                          json_path: $.workflow_rules[*].name
                        status: error
                InvalidDataResponse3:
                  summary: >-
                    Error response with code INVALID_DATA: Invalid data (Field:
                    type)
                  value:
                    workflow_rules:
                      - code: INVALID_DATA
                        message: invalid data
                        details:
                          api_name: type
                          supported_values:
                            - create
                            - edit
                            - create_or_edit
                            - delete
                            - field_update
                            - rollup_summary_update
                            - section_update
                            - date_or_datetime
                            - score_increase
                            - score_update
                            - score_decrease
                            - recommendation
                            - field_update
                            - score_increase
                            - score_decrease
                            - score_update
                            - scheduled_call_field_update
                            - scheduled_call_section_update
                            - scheduled_call_edit
                            - scheduled_call_createedit
                            - outgoing_call_ring
                            - outgoing_call_start
                            - outgoing_call_section_update
                            - outgoing_call_createedit
                            - outgoing_call_field_update
                            - outgoing_call_edit
                            - incoming_call_ring
                            - incoming_call_start
                            - incoming_call_edit
                            - incoming_call_field_update
                            - incoming_call_createedit
                            - incoming_call_section_update
                            - anyaction
                            - delete
                            - missed_call
                            - create
                            - reschedule
                            - cancel
                            - reassign
                            - delete
                            - overdue
                            - marked_as_complete
                            - anyaction
                            - email_received
                            - mail_sent
                            - mail_sent_clicked
                            - mail_sent_replied
                            - mail_sent_opened
                            - mail_sent_bounced
                            - email_received_notreplied
                            - email_received_opened_notreplied
                            - mail_sent_replied_within
                            - mail_sent_opened_notreplied
                            - mail_sent_notreplied
                            - mail_sent_notopened
                            - fb_post_on_page
                            - fb_comment_on_page
                            - fb_like_on_post
                            - fb_send_message
                            - tw_mention_on
                            - tw_retweet_on_tweet
                            - tw_comment_on_tweet
                            - tw_send_message
                          json_path: $.workflow_rules[*].execute_when.type
                        status: error
                MeetingCallInvalidDataResponse:
                  summary: 'Error response with code INVALID_DATA: Invalid Owner Id)'
                  value:
                    workflow_rules:
                      - code: INVALID_DATA
                        details:
                          api_name: id
                          json_path: >-
                            $.workflow_rules[0].conditions[0].instant_actions.actions[0].details.field_mappings[3].id
                        message: Invalid User ID
                        status: error
                DependentFieldMissingResponse1:
                  summary: >-
                    Error response with code DEPENDENT_FIELD_MISSING: Dependent
                    Field missing (Field: details)
                  value:
                    workflow_rules:
                      - code: DEPENDENT_FIELD_MISSING
                        details:
                          dependee:
                            api_name: type
                            json_path: >-
                              $.workflow_rules[0].conditions[0].instant_actions.actions[0].type
                          api_name: details
                          json_path: >-
                            $.workflow_rules[0].conditions[0].instant_actions.actions[0].details
                        message: Dependent Field missing
                        status: error
                TriggerDependentFieldMissingResponse1:
                  summary: >-
                    Error response with code DEPENDENT_FIELD_MISSING: Dependent
                    Field missing (Field: repeat)
                  value:
                    workflow_rules:
                      - code: DEPENDENT_FIELD_MISSING
                        details:
                          dependee:
                            api_name: type
                            json_path: $.workflow_rules[0].execute_when.type
                          api_name: repeat
                          json_path: $.workflow_rules[0].execute_when.details.repeat
                        message: Dependent Field missing
                        status: error
                ScheduledActionsDependentFieldMissingResponse:
                  summary: >-
                    Error response with code DEPENDENT_FIELD_MISSING:
                    unit/period is missing
                  value:
                    workflow_rules:
                      - code: DEPENDENT_FIELD_MISSING
                        details:
                          dependee:
                            api_name: execute_after
                            json_path: >-
                              $.workflow_rules[0].conditions[0].scheduled_actions[0].execute_after
                          api_name: unit
                          json_path: >-
                            $.workflow_rules[0].conditions[0].scheduled_actions[0].execute_after.unit
                        message: Dependent Field missing
                        status: error
                AssociateActionDependentFieldMissingResponse:
                  summary: >-
                    Error response with code DEPENDENT_FIELD_MISSING: Missing
                    Associated Action Id
                  value:
                    workflow_rules:
                      - code: DEPENDENT_FIELD_MISSING
                        details:
                          dependee:
                            api_name: type
                            json_path: >-
                              $.workflow_rules[0].conditions[0].instant_actions.actions[0].type
                          api_name: id
                          json_path: >-
                            $.workflow_rules[0].conditions[0].instant_actions.actions[0].id
                        message: Dependent Field missing
                        status: error
                ExpectedFieldMissingResponse1:
                  summary: >-
                    Error response with code EXPECTED_FIELD_MISSING: Specify
                    atleast one field
                  value:
                    workflow_rules:
                      - code: EXPECTED_FIELD_MISSING
                        details:
                          expected_fields:
                            - api_name: api_name
                              json_path: >-
                                $.workflow_rules[0].conditions[0].instant_actions.actions[0].details.module.api_name
                            - api_name: id
                              json_path: >-
                                $.workflow_rules[0].conditions[0].instant_actions.actions[0].details.module.id
                        message: Specify atleast one field
                        status: error
                ScheduledActionsExpectedFieldMissingResponse:
                  summary: >-
                    Error response with code EXPECTED_FIELD_MISSING: Specify
                    atleast one field
                  value:
                    workflow_rules:
                      - code: EXPECTED_FIELD_MISSING
                        details:
                          expected_fields:
                            - api_name: period
                              json_path: >-
                                $.workflow_rules[0].conditions[0].scheduled_actions[0].execute_after.period
                            - api_name: unit
                              json_path: >-
                                $.workflow_rules[0].conditions[0].scheduled_actions[0].execute_after.unit
                        message: Specify atleast one field
                        status: error
                MeetingExpectedFieldMissingResponse:
                  summary: >-
                    Error response with code EXPECTED_FIELD_MISSING: Specify
                    atleast one field
                  value:
                    workflow_rules:
                      - code: EXPECTED_FIELD_MISSING
                        details:
                          expected_fields:
                            - api_name: assign_record_owner_as_host
                              json_path: >-
                                $.workflow_rules[0].conditions[0].instant_actions.actions[0].details.host_unavailable.assign_record_owner_as_host
                            - api_name: assign_task
                              json_path: >-
                                $.workflow_rules[0].conditions[0].instant_actions.actions[0].details.host_unavailable.assign_task
                        message: Specify atleast one field
                        status: error
                MandatoryNotFoundResponse1:
                  summary: >-
                    Error response with code MANDATORY_NOT_FOUND: Required field
                    is missing (Field: name)
                  value:
                    workflow_rules:
                      - code: MANDATORY_NOT_FOUND
                        message: Required field is missing
                        details:
                          api_name: name
                          json_path: $.workflow_rules[*].name
                        status: error
                MeetingAmbiguityErrorResponse:
                  summary: >-
                    Error response with code AMBIGUITY_DURING_PROCESSING:
                    Ambiguity during processing (Field: meeting_duration)
                  value:
                    workflow_rules:
                      - code: AMBIGUITY_DURING_PROCESSING
                        details:
                          ambiguity_due_to:
                            - api_name: meeting_duration
                              json_path: >-
                                $.workflow_rules[0].conditions[0].instant_actions.actions[0].details.meeting_duration
                            - api_name: field_mappings
                              json_path: >-
                                $.workflow_rules[0].conditions[0].instant_actions.actions[0].details.field_mappings
                        message: >-
                          As All Day is passed true, meeting_duration cannot be
                          configured
                        status: error
                ActionVsTriggerADPResponse1:
                  summary: >-
                    Error response with code AMBIGUITY_DURING_PROCESSING: action
                    not supported for this trigger
                  value:
                    workflow_rules:
                      - code: AMBIGUITY_DURING_PROCESSING
                        details:
                          ambiguity_due_to:
                            - api_name: type
                              json_path: $.workflow_rules[0].execute_when.type
                            - api_name: type
                              json_path: >-
                                $.workflow_rules[0].conditions[0].instant_actions.actions[0].type
                        message: action not supported for this trigger
                        status: error
                ActionLimitExceededResponse:
                  summary: >-
                    Error response with code LIMIT_EXCEEDED: per-type action
                    limit exceeded in instant/scheduled actions
                  value:
                    workflow_rules:
                      - code: LIMIT_EXCEEDED
                        details:
                          api_name: actions
                          limit: 5
                          json_path: >-
                            $.workflow_rules[0].conditions[0].instant_actions.actions
                        message: actions limit exceeded
                        status: error
                NotAllowedErrorResponse:
                  summary: >-
                    Error response with code NOT_ALLOWED: The unsupported action
                    is given
                  value:
                    workflow_rules:
                      - code: NOT_ALLOWED
                        details:
                          api_name: type
                          json_path: >-
                            $.workflow_rules[0].conditions[0].scheduled_actions[0].actions[0].type
                        message: The unsupported action is given
                        status: error
                DependentMismatchResponse:
                  summary: >-
                    Error response with code DEPENDENT_MISMATCH: Dependent Field
                    is not matching (Field: module)
                  value:
                    workflow_rules:
                      - code: DEPENDENT_MISMATCH
                        details:
                          dependee:
                            api_name: module_selection
                            json_path: >-
                              $.workflow_rules[0].conditions[0].criteria_details.relational_criteria.module_selection
                          api_name: module
                          json_path: >-
                            $.workflow_rules[0].conditions[0].criteria_details.relational_criteria.module
                        message: Dependent Field is not matching
                        status: error
                ModuleMandatoryNotFoundResponse:
                  summary: >-
                    Error response with code MANDATORY_NOT_FOUND: module is
                    required
                  value:
                    workflow_rules:
                      - code: MANDATORY_NOT_FOUND
                        details:
                          api_name: module
                          json_path: $.workflow_rules[*].module
                        message: Required field is missing
                        status: error
                ModuleInvalidDataResponse:
                  summary: >-
                    Error response with code INVALID_DATA: invalid module
                    api_name or id
                  value:
                    workflow_rules:
                      - code: INVALID_DATA
                        details:
                          api_name: module
                          json_path: $.workflow_rules[*].module
                        message: the module name given seems to be invalid
                        status: error
                NameSpecialCharsResponse:
                  summary: >-
                    Error response with code INVALID_DATA: workflow name
                    contains special characters
                  value:
                    workflow_rules:
                      - code: INVALID_DATA
                        details:
                          api_name: name
                          json_path: $.workflow_rules[*].name
                        message: Special characters found
                        status: error
                NameLengthExceededResponse:
                  summary: >-
                    Error response with code INVALID_DATA: workflow name exceeds
                    max length
                  value:
                    workflow_rules:
                      - code: INVALID_DATA
                        details:
                          api_name: name
                          json_path: $.workflow_rules[*].name
                          maximum_length: 100
                        message: value too long
                        status: error
                CannotCreateInactiveResponse:
                  summary: >-
                    Error response with code INVALID_DATA: cannot create an
                    inactive workflow rule
                  value:
                    workflow_rules:
                      - code: INVALID_DATA
                        details:
                          api_name: active
                          json_path: $.workflow_rules[*].status.active
                        message: invalid data
                        status: error
                ExecuteWhenMissingResponse:
                  summary: >-
                    Error response with code MANDATORY_NOT_FOUND: execute_when
                    is required
                  value:
                    workflow_rules:
