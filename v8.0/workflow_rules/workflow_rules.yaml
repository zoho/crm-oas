components:
  schemas:
    WorkflowSuccessSchema:
      type: object
      x-zs-$id: WorkflowSuccessSchema
      additionalProperties: false
      description: >-
        Represents the success response returned after creating a workflow rule,
        containing the result details of the created rule.
      x-zs-llm-description: >-
        Success response wrapper for POST/PUT workflow rule operations. Contains
        workflow_rules array with per-rule status objects indicating success or
        failure with details.
      properties:
        workflow_rules:
          type: array
          description: >-
            Represents the array of workflow rule objects returned in the
            success response.
          items:
            $ref: '#/components/schemas/SuccessResponseNestedSchema'
          maxItems: 200
    ReOrderSuccessResponseSchema:
      type: object
      x-zs-$id: ReOrderSuccessResponseSchema
      additionalProperties: false
      description: >-
        Represents the success response returned after reordering workflow
        rules.
      x-zs-llm-description: >-
        Success response wrapper for the reorderWorkflowRules operation.
        Contains reorder array confirming the new execution sequence was
        applied.
      properties:
        reorder:
          type: array
          description: >-
            Represents the array of workflow rule objects with their updated
            execution order.
          items:
            $ref: '#/components/schemas/SuccessResponseNestedSchema'
          maxItems: 125
    NoPermissionSchema:
      type: object
      x-zs-$id: NoPermissionSchema
      additionalProperties: false
      description: >-
        Represents the error response returned when the authenticated user does
        not have permission to access the requested feature or module.
      x-zs-llm-description: >-
        Error codes: NO_PERMISSION or FEATURE_NOT_SUPPORTED. Returned when the
        user lacks ManageAutomation permission or the workflow feature is not
        available in the current CRM edition. Resolution: verify user
        permissions and edition capabilities.
      properties:
        code:
