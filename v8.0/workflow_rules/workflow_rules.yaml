            description: >-
              Represents a single action type entry containing the action name
              and its associated execution counts.
            properties:
              type:
                type: string
                description: >-
                  Represents the category of workflow action to which the
                  execution count applies, such as email notifications, field
                  updates, or webhooks.
                enum:
                  - create_record
                  - add_meeting
                  - schedule_call
                  - assign_owner
                  - add_tags
                  - remove_tags
                  - convert
                  - email_notifications
                  - field_updates
                  - tasks
                  - webhooks
                  - functions
                  - sms
                  - whatsapp
                  - flow
                  - circuits
                  - slack_notifications
                  - cliq_notifications
                  - cisco_notifications
                  - google_chat_notifications
                  - microsoft_teams_notifications
                  - create_record_email
                  - create_connected_record
                  - comment_to_post
                  - reply_to_comment
                  - like_to_comment
                  - reply_to_message
                  - retweet
                  - reply_to_tweet
              value:
                type: integer
                description: >-
                  Represents the total execution count for the specified action
                  type within the queried date range.
                format: int32
            required:
              - type
              - value
          maxItems: 10
      required:
        - actions_count
