                        message: duplicate data
                        status: error
                  description: >-
                    Shows an INVALID_DATA error triggered when the same workflow
                    rule identifier appears more than once in the request array,
                    with the offending duplicate ID located at the second array
                    entry identified in the JSON path.
                InvalidDataResponse3:
                  summary: >-
