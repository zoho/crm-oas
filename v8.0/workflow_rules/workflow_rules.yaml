        - total_rules_configured
      title: Module Workflow Rule Count
    WorkflowRulesCountResponseSchema:
      type: object
      x-zs-$id: WorkflowRulesCountResponseSchema
      additionalProperties: false
      description: >-
        Represents the response body containing the organization-level workflow
        rule quota and current usage counts.
      x-zs-llm-description: >-
        Response from getWorkflowRulesCount. Contains rules_count object with
        org-level limits: max rules, max actions per rule, max conditions per
        rule, max scheduled actions, and current usage counts.
      properties:
        rules_count:
          type: object
          additionalProperties: false
          description: >-
            Represents the workflow rule count and limit details for the
            organization.
          properties:
            scheduled_actions_per_rule_limit:
              type: integer
              format: int32
              description: >-
                Represents the maximum number of scheduled action groups allowed
                per workflow rule.
            total_rules_limit:
              type: integer
              format: int32
              description: >-
                Represents the maximum total number of workflow rules allowed in
                the organization.
            active_rules_configured:
              type: integer
              format: int32
              description: >-
                Represents the number of currently active workflow rules
                configured in the organization.
            rules_per_process_limit:
              type: integer
              format: int32
              description: >-
                Represents the maximum number of workflow rules allowed per
                business process.
            total_actions_per_rule_limit:
              type: integer
              format: int32
              description: >-
                Represents the maximum total number of actions (instant and
                scheduled combined) allowed per workflow rule.
            total_rules_limit_per_module:
              type: integer
              format: int32
              description: >-
                Represents the maximum number of workflow rules allowed per CRM
                module.
            active_rules_limit:
              type: integer
              format: int32
              description: >-
                Represents the maximum number of active workflow rules allowed
                in the organization.
            total_rules_configured:
              type: integer
              format: int32
              description: >-
                Represents the total number of workflow rules configured in the
                organization, including both active and inactive rules.
            active_rules_limit_per_module:
              type: integer
              format: int32
              description: >-
                Represents the maximum number of active workflow rules allowed
                per CRM module.
          required:
            - active_rules_configured
            - active_rules_limit
            - active_rules_limit_per_module
            - rules_per_process_limit
            - scheduled_actions_per_rule_limit
            - total_actions_per_rule_limit
            - total_rules_configured
            - total_rules_limit
            - total_rules_limit_per_module
      required:
        - rules_count
      title: Workflow Rules Quota Response
    WorkflowRuleUsageResponseSchema:
      type: object
      x-zs-$id: WorkflowRuleUsageResponseSchema
      additionalProperties: false
      description: >-
        Represents the response body containing detailed execution usage metrics
        for one or more workflow rules within a queried date range.
      x-zs-llm-description: >-
        Response from getWorkflowRuleUsage. Contains workflow_rules array with
        one entry holding per-condition usage metrics including success/failure
        counts and email engagement stats.
      properties:
        workflow_rules:
          type: array
          description: Represents the array of workflow rule usage objects.
          items:
            type: object
            description: >-
              Represents the usage report for a single workflow rule, including
              execution metrics at the condition level.
            additionalProperties: false
            properties:
              trigger_count:
                type: integer
                format: int32
                description: >-
                  Represents the number of times this workflow rule was
                  triggered within the queried date range.
              name:
                type: string
                description: Represents the name of the workflow rule.
                maxLength: 255
              id:
                type: string
                description: Represents the unique ID of the workflow rule.
                maxLength: 20
              conditions:
                type: array
                description: >-
                  Represents the array of condition objects with usage metrics
                  for the workflow rule.
                items:
                  oneOf:
                    - $ref: '#/components/schemas/WorkflowConditionUsageSummarySchema'
                    - $ref: >-
                        #/components/schemas/WorkflowConditionUsageWithTaggedInstantActionsSchema
                maxItems: 10
              reset_time:
                type:
                  - string
                  - 'null'
                description: >-
                  Represents the ISO 8601 timestamp when the usage counters were
