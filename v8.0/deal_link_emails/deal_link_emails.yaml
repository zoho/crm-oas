                      details:
                        description: >-
                          An empty object. No additional details are provided
                          for this error.
                        additionalProperties: false
                        type: object
                    required:
                      - status
                      - code
                      - message
                      - details
  /Contacts/{contactId}/Emails/{messageId}/actions/link_record:
    post:
      security:
        - OAuth2:
            - ZohoCRM.modules.contacts.CREATE
            - ZohoCRM.modules.emails.CREATE
            - ZohoCRM.modules.deals.CREATE
      summary: Link Deal Email
      description: Links an email to a specified record in CRM.
      operationId: linkEmailToRecord
      parameters:
        - $ref: '#/components/parameters/ContactId'
        - $ref: '#/components/parameters/MessageId'
      requestBody:
        content:
          application/json:
            examples:
              SampleRequestBody:
                summary: Link Email to Record - Request Body
                value:
                  Emails:
                    - owner:
                        id: '4876876000000362001'
                      linked_record:
                        module:
                          api_name: Deals
                          id: '4876876000000000131'
                        name: Acme Renewal Deal
                        id: '4876876000000514024'
            schema:
              description: Request body schema for linking email to record
              additionalProperties: false
              type: object
              properties:
                Emails:
                  description: List of emails to be linked to records
                  maxItems: 1
                  type: array
                  items:
