components:
  parameters:
    ContactId:
      name: contactId
      description: The ID of the contact to which the email is to be linked or unlinked
      in: path
      required: true
      schema:
        type: string
        pattern: ^[0-9]+$
        maxLength: 100
        examples:
          - '4876876000000476011'
    MessageId:
      description: The ID of the email message to be linked or unlinked
      name: messageId
      in: path
      required: true
      schema:
        type: string
        pattern: ^[a-zA-Z0-9]+$
        maxLength: 500
        examples:
          - >-
            f129cbd6953db55b4464b4dfc6f5cd3ebc57ab5c83a16c6d08843a24d4f4cfbc04e4b089882b920f306be5735ce55782
    MessageIds:
      description: The IDs of the email messages to be linked
      name: message_ids
      in: query
      required: true
      schema:
        type: string
        pattern: ^[a-zA-Z0-9]+(,[a-zA-Z0-9]+)*$
        maxLength: 2000
        examples:
          - >-
            f129cbd6953db55b4464b4dfc6f5cd3ebc57ab5c83a16c6d08843a24d4f4cfbc04e4b089882b920f306be5735ce55782,6e78663d9e92be2868fc339bf88fea06cadeb6f678479e5d3e8aacd7c544ae8eea1034c510cec43527a3eec50151290f
    OwnerId:
      description: The ID of the owner of the contact.
      name: owner_id
      in: query
      required: true
      schema:
        type: string
        pattern: ^[0-9]+$
        maxLength: 100
        examples:
          - '4876876000000362001'
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://accounts.zoho.com/oauth/v2/auth
          tokenUrl: https://accounts.zoho.com/oauth/v2/token
          refreshUrl: https://accounts.zoho.com/oauth/v2/token
          scopes:
            ZohoCRM.modules.contacts.CREATE: create access for linking email of contacts to deals module
            ZohoCRM.modules.deals.CREATE: create access for linking email of contacts to deals module
            ZohoCRM.modules.emails.CREATE: create access for linking email of contacts to deals module
