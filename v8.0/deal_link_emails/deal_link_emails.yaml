                                pattern: ^[0-9]+$
                                maxLength: 100
                                examples:
                                  - '4876876000000000131'
                            required:
                              - id
                          name:
                            description: Name of the record
                            type: string
                            maxLength: 255
                            examples:
                              - Acme Renewal Deal
                          id:
                            description: Unique identifier of the record
                            type: string
                            pattern: ^[0-9]+$
                            maxLength: 100
                            examples:
                              - '4876876000000514024'
                        required:
                          - module
                          - id
                    required:
                      - owner
                      - linked_record
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              examples:
                SampleResponse:
                  summary: Link Email to Record - Response
                  value:
                    Emails:
                      - status: success
                        code: SUCCESS
                        message: Email linked to the record successfully
                        details:
                          message_id: >-
                            f129cbd6953db55b4464b4dfc6f5cd3ebc57ab5c83a16c6d08843a24d4f4cfbc04e4b089882b920f306be5735ce55782
              schema:
                description: Response schema for linking email to record
                x-zs-$id: LinkEmailToRecordResponse
                additionalProperties: false
                type: object
                properties:
                  Emails:
                    maxItems: 1
                    description: List of email link operation results
                    type: array
                    items:
                      description: Email link operation result
                      additionalProperties: false
                      type: object
                      properties:
                        status:
                          description: Status of the link operation
                          type: string
                          enum:
                            - success
                        code:
                          description: Result code of the link operation
                          type: string
                          enum:
                            - SUCCESS
                        message:
                          description: Detailed message about the link operation
                          maxLength: 256
                          type: string
                        details:
                          additionalProperties: false
                          description: Additional details about the link operation
                          type: object
                          properties:
                            message_id:
                              description: Unique identifier of the email message
                              maxLength: 256
                              type: string
                          required:
                            - message_id
                      required:
                        - status
                        - code
                        - message
                        - details
                required:
                  - Emails
        '400':
          description: Bad Request - Invalid input parameters
          content:
            application/json:
              schema:
                x-zs-$id: LinkEmailToRecordErrorResponse
                oneOf:
                  - x-zs-$id: LinkEmailToRecordErrorDetails
                    description: Details of errors for the email link operation
                    additionalProperties: false
                    type: object
