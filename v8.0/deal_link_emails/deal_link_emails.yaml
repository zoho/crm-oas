openapi: 3.1.0
info:
  title: Deal Link Emails
  description: >-
    The Deal Link Emails API links or unlinks deals with a contact's emails in
    Zoho CRM.
  version: '8.0'
servers:
  - url: https://zohoapis.{dc}/crm/{version}
    description: API Server URL
    variables:
      version:
        default: v8
        description: API Version
      dc:
        enum:
          - com
          - eu
          - in
          - cn
          - au
        default: com
        description: API Server URL TLD
paths:
  /Contacts/{contactId}/Emails/actions/link_record:
    post:
      security:
        - OAuth2:
            - ZohoCRM.modules.emails.CREATE
            - ZohoCRM.modules.deals.CREATE
            - ZohoCRM.modules.contacts.CREATE
      summary: Link Emails to Deals
      description: >-
        To link a deal with one or more of a contact's emails. An email can only
        be linked to a single deal at a time. Zoho CRM automatically links a
        contact's incoming emails to the deals using the [Deal Prediction
        Mechanism](https://help.zoho.com/portal/en/kb/crm/connect-with-customers/email/user-functions/articles/email-association-with-deal#Auto-link_Emails_by_Deal_Prediction_Mechanism).
        You can also manage these links using the Link Deal to Emails API and
        [Unlink Deal from Emails
        API](deal_link_emails.yaml#$.paths./Contacts/{contactId}/Emails/{messageId}/actions/link_record.delete).
      operationId: linkEmailsToDeals
      parameters:
        - $ref: '#/components/parameters/ContactId'
      requestBody:
        description: The request body to link emails to deals.
        content:
          application/json:
            examples:
              SampleRequestBody:
                summary: Link Emails to Deals
                value:
                  Emails:
                    - message_id: >-
                        f129cbd6953db55b4464b4dfc6f5cd3ebc57ab5c83a16c6d08843a24d4f4cfbc04e4b089882b920f306be5735ce55782
                      owner:
                        id: '4876876000000362001'
                      linked_record:
                        module:
                          api_name: Deals
                          id: '4876876000000000131'
                        name: Acme Renewal Deal
                        id: '4876876000000514024'
                    - message_id: >-
                        f129cbd6953db55b4464b4dfc6f5cd3ebc57ab5c83a16c6d08843a24d4f4cfbc04e4b089882b920f306be5735ce55782
                      owner:
                        id: '4876876000000362001'
                      linked_record:
                        module:
                          api_name: Deals
                          id: '4876876000000000131'
                        id: '4876876000000002676'
            schema:
              description: The request body schema for linking emails to deals.
              additionalProperties: false
              type: object
              properties:
                Emails:
                  description: >-
                    Array containing the details of the emails to link to deals.
                    Mandatory.
                  type: array
                  maxItems: 20
                  items:
                    description: >-
                      Object containing the details of the email to link to a
                      deal.
                    additionalProperties: false
                    type: object
                    properties:
                      message_id:
                        description: >-
                          The unique message ID of the email to which the deal
                          will be linked. Mandatory when linking multiple
                          emails. You can obtain message ID of a record through
                          [Get Emails of a Record
                          API](emails.yaml#$.paths.{moduleApiName}/{id}/Emails/{messageId}.get).
                        type: string
                        pattern: ^[a-zA-Z0-9]+$
                        maxLength: 500
                        examples:
                          - >-
                            f129cbd6953db55b4464b4dfc6f5cd3ebc57ab5c83a16c6d08843a24d4f4cfbc04e4b089882b920f306be5735ce55782
                      owner:
                        description: >-
                          The details of the user whose email you want to link.
                          Mandatory.
                        additionalProperties: false
                        type: object
                        properties:
                          id:
                            description: >-
                              The unique ID of the user whose email you want to
                              link. Mandatory.
                            type: string
                            pattern: ^[0-9]+$
                            maxLength: 100
                            examples:
                              - '4876876000000362001'
                      linked_record:
                        description: >-
                          The details of the deal record to be linked to the
                          email. Mandatory. Use the [Get Modules
                          API](modules.yaml#$.paths./settings/modules.get) to
                          retrieve module IDs
                        additionalProperties: false
                        type: object
                        properties:
                          module:
                            description: The details of the Deals module. Mandatory.
                            additionalProperties: false
                            type: object
                            properties:
                              api_name:
                                description: The API name of the Deals module. Mandatory.
                                type: string
                                enum:
                                  - Deals
                              id:
                                description: The unique ID of the Deals module. Mandatory.
                                type: string
                                pattern: ^[0-9]+$
                                maxLength: 100
                                examples:
                                  - '4876876000000000131'
                            required:
                              - id
                          name:
                            description: >-
                              The name of the deal record that the email must be
                              linked to. Mandatory.
                            type: string
                            maxLength: 255
                            examples:
                              - Acme Renewal Deal
                          id:
                            description: >-
                              The unique ID of the deal record that the email
                              must be linked to. Mandatory.
                            type: string
                            pattern: ^[0-9]+$
                            maxLength: 100
                            examples:
                              - '4876876000000514024'
                        required:
                          - module
                          - id
                    required:
                      - message_id
                      - owner
                      - linked_record
        required: true
      responses:
        '200':
          description: The emails were linked to the deals successfully.
          content:
            application/json:
              examples:
                SampleResponse:
                  summary: Link Emails to Deals - Response
                  value:
                    Emails:
                      - status: success
                        code: SUCCESS
                        message: Email linked to the record successfully
                        details:
                          message_id: >-
                            f129cbd6953db55b4464b4dfc6f5cd3ebc57ab5c83a16c6d08843a24d4f4cfbc04e4b089882b920f306be5735ce55782
                      - status: success
                        code: SUCCESS
                        message: Email linked to the record successfully
                        details:
                          message_id: >-
                            f129cbd6953db55b4464b4dfc6f5cd3ebc57ab5c83a16c6d08843a24d4f4cfbc04e4b089882b920f306be5735ce55782
              schema:
                x-zs-$id: LinkEmailsToDealsResponse
                description: Successful response containing the link operation results.
                additionalProperties: false
                type: object
                properties:
                  Emails:
                    description: List of email link operation results
                    maxItems: 20
                    type: array
                    items:
                      additionalProperties: false
                      description: Email link operation result
                      type: object
                      properties:
                        status:
                          description: Status of the link operation
                          type: string
                          enum:
                            - success
                        code:
                          description: Result code of the link operation
                          type: string
                          enum:
                            - SUCCESS
                        message:
                          description: Detailed message about the link operation
                          type: string
                          maxLength: 256
                        details:
                          description: Additional details about the link operation
                          additionalProperties: false
                          type: object
                          properties:
                            message_id:
                              description: Unique identifier of the email message
                              maxLength: 255
                              type: string
                          required:
                            - message_id
                      required:
                        - status
                        - code
                        - message
                        - details
                required:
                  - Emails
        '400':
          description: Bad Request
          content:
            application/json:
              examples:
                SampleErrorResponse:
                  summary: Link Emails to Deals - Error Response
                  value:
                    Emails:
                      - - status: error
                          code: MANDATORY_NOT_FOUND
                          message: message_id is mandatory
                          details:
                            api_name: message_id
                            json_path: Emails[0].message_id
                      - - status: error
                          code: INVALID_DATA
                          message: invalid data
                          details:
                            api_name: linked_record.id
                            json_path: Emails[1].linked_record.id
              schema:
                x-zs-$id: LinkEmailsToDealsErrorResponse
                description: Error response schema
                oneOf:
                  - type: object
                    x-zs-$id: LinkEmailsToDealsErrorDetails
                    description: Details of errors for each email link operation
                    additionalProperties: false
                    properties:
                      Emails:
                        description: List of error details for each email link operation
                        maxItems: 20
                        type: array
                        items:
                          oneOf:
                            - x-zs-$id: MandatoryNotFoundError
                              type: array
                              description: Errors due to missing mandatory fields
                              maxItems: 20
                              items:
                                description: Details of a mandatory field missing error
                                additionalProperties: false
                                type: object
                                properties:
                                  status:
                                    description: Status of the error
                                    type: string
                                    enum:
                                      - error
                                  code:
                                    description: Error code
                                    type: string
                                    enum:
                                      - MANDATORY_NOT_FOUND
                                  message:
                                    description: Error message
                                    maxLength: 256
                                    type: string
                                  details:
                                    description: Additional details about the error
                                    additionalProperties: false
                                    type: object
                                    properties:
                                      api_name:
                                        description: API name of the missing field
                                        maxLength: 255
                                        type: string
                                      json_path:
                                        description: JSON path to the missing field
                                        maxLength: 255
                                        type: string
                                    required:
                                      - api_name
                                      - json_path
                                required:
                                  - status
                                  - code
                                  - message
                                  - details
                            - x-zs-$id: InvalidDataError
                              type: array
                              description: Errors due to invalid data
                              maxItems: 20
                              items:
                                description: Details of an invalid data error
                                additionalProperties: false
                                type: object
                                properties:
                                  status:
                                    description: Status of the error
                                    type: string
                                    enum:
                                      - error
                                  code:
                                    description: Error code
                                    type: string
                                    enum:
                                      - INVALID_DATA
                                  message:
                                    description: Error message
                                    maxLength: 256
                                    type: string
                                  details:
                                    description: Additional details about the error
                                    additionalProperties: false
                                    type: object
                                    properties:
                                      api_name:
                                        description: API name of the field with invalid data
                                        maxLength: 255
                                        type: string
                                      json_path:
                                        description: JSON path to the field with invalid data
                                        maxLength: 255
                                        type: string
                                    required:
                                      - api_name
                                      - json_path
                                required:
                                  - status
                                  - code
                                  - message
                                  - details
                    required:
                      - Emails
                  - type: object
                    x-zs-$id: LinkEmailsToDealsGeneralError
                    description: General error response for link emails to deals operation
                    additionalProperties: false
                    properties:
                      status:
                        description: Status of the error
                        type: string
                        enum:
                          - error
                      code:
                        description: Error code
                        type: string
                        enum:
                          - MANDATORY_NOT_FOUND
                      message:
                        description: Error message
                        maxLength: 256
                        type: string
                      details:
                        description: Additional details about the error
                        additionalProperties: false
                        type: object
                        properties:
                          api_name:
                            description: API name of the missing field
                            maxLength: 255
                            type: string
                          json_path:
                            maxLength: 255
                            description: JSON path to the missing field
                            type: string
                        required:
                          - api_name
                          - json_path
                    required:
                      - status
                      - code
                      - message
                      - details
        '404':
          description: Not Found
          content:
            application/json:
              examples:
                SampleNotFoundResponse:
                  summary: Link Emails to Deals - Not Found Response
                  value:
                    status: error
                    code: INVALID_URL_PATTERN
                    message: Please check if the URL trying to access is a correct one
                    details: {}
              schema:
                x-zs-$id: LinkEmailsToDealsNotFoundError
                description: Details of not found error
                additionalProperties: false
                type: object
                properties:
                  status:
                    description: Status of the error
                    type: string
                    enum:
                      - error
                  code:
                    description: Error code
                    type: string
                    enum:
                      - INVALID_URL_PATTERN
                  message:
                    description: Error message
                    type: string
                    enum:
                      - >-
                        Please check if the URL trying to access is a correct
                        one
                  details:
                    description: Additional details about the error
                    additionalProperties: false
                    type: object
                required:
                  - status
                  - code
                  - message
                  - details
    delete:
      security:
        - OAuth2:
            - ZohoCRM.modules.contacts.CREATE
            - ZohoCRM.modules.emails.CREATE
            - ZohoCRM.modules.deals.CREATE
      summary: Unlink Emails from Deals
      description: >-
        To unlink deals from one or more of a contact's emails. An email will
        only be linked to a single deal at a time.  When you call this API, the
        specified email(s) will be unlinked from them. The user's profile
        requires "View" permission for Deals and Contacts modules to use this
        API.
      operationId: unlinkEmailsFromDeal
      parameters:
        - $ref: '#/components/parameters/ContactId'
        - $ref: '#/components/parameters/MessageIds'
        - $ref: '#/components/parameters/OwnerId'
      responses:
        '200':
          description: The emails were unlinked from the deals successfully.
          content:
            application/json:
              examples:
                SampleResponse:
                  summary: Unlink Emails from Deals - Response
                  value:
                    Emails:
                      - status: success
                        code: SUCCESS
                        message: Email unlinked from the record successfully
                        details:
                          message_id: >-
                            f129cbd6953db55b4464b4dfc6f5cd3ebc57ab5c83a16c6d08843a24d4f4cfbc04e4b089882b920f306be5735ce55782
              schema:
                x-zs-$id: UnlinkEmailsFromRecordsResponse
                description: Response schema
                additionalProperties: false
                type: object
                properties:
                  Emails:
                    description: List of email unlink operation results
                    maxItems: 20
                    type: array
                    items:
                      description: Email unlink operation result
                      additionalProperties: false
                      type: object
                      properties:
                        status:
                          description: Status of the unlink operation
                          type: string
                          enum:
                            - success
                        code:
                          description: Result code of the unlink operation
                          type: string
                          enum:
                            - SUCCESS
                        message:
                          description: Detailed message about the unlink operation
                          maxLength: 256
                          type: string
                        details:
                          description: Additional details about the unlink operation
                          additionalProperties: false
                          type: object
                          properties:
                            message_id:
                              description: Unique identifier of the email message
                              maxLength: 256
                              type: string
                          required:
                            - message_id
                      required:
                        - status
                        - code
                        - message
                        - details
                required:
                  - Emails
        '400':
          description: Bad Request
          content:
            application/json:
              examples:
                SampleErrorResponse:
                  summary: Unlink Emails from Records - Error Response
                  value:
                    Emails:
                      - - status: error
                          code: MANDATORY_NOT_FOUND
                          message: message_id is mandatory
                          details:
                            api_name: message_id
                            json_path: message_ids[0]
              schema:
                x-zs-$id: UnlinkEmailsFromRecordsErrorResponse
                oneOf:
                  - x-zs-$id: UnlinkEmailsFromRecordsErrorDetails
                    description: Details of errors for each email unlink operation
                    additionalProperties: false
                    type: object
                    properties:
                      Emails:
                        description: >-
                          Array of error details for each email unlink
                          operation.
                        maxItems: 20
                        type: array
                        items:
                          oneOf:
                            - x-zs-$id: MandatoryNotFoundError1
                              description: Errors due to missing mandatory fields
                              maxItems: 20
                              type: array
                              items:
                                description: Details of a mandatory field missing error.
                                additionalProperties: false
                                type: object
                                properties:
                                  status:
                                    description: Status of the error
                                    type: string
                                    enum:
                                      - error
                                  code:
                                    description: Error code
                                    type: string
                                    enum:
                                      - MANDATORY_NOT_FOUND
                                  message:
                                    description: Error message
                                    maxLength: 256
                                    type: string
                                  details:
                                    description: >-
                                      Object containing additional details about
                                      the error.
                                    additionalProperties: false
                                    type: object
                                    properties:
                                      api_name:
                                        description: API name of the missing field
                                        maxLength: 255
                                        type: string
                                      json_path:
                                        description: JSON path to the missing field
                                        maxLength: 255
                                        type: string
                                    required:
                                      - api_name
                                      - json_path
                                required:
                                  - status
                                  - code
                                  - message
                                  - details
                            - x-zs-$id: InvalidDataError1
                              description: Errors due to invalid data
                              maxItems: 20
                              type: array
                              items:
                                description: Details of an invalid data error.
                                additionalProperties: false
                                type: object
                                properties:
                                  status:
                                    description: Status of the error
                                    type: string
                                    enum:
                                      - error
                                  code:
                                    description: Error code
                                    type: string
                                    enum:
                                      - INVALID_DATA
                                  message:
                                    description: Error message
                                    maxLength: 256
                                    type: string
                                    enum:
                                      - invalid data
                                  details:
                                    description: >-
                                      Object containing additional details about
                                      the error.
                                    additionalProperties: false
                                    type: object
                                    properties:
                                      api_name:
                                        description: API name of the field with invalid data
                                        maxLength: 255
                                        type: string
                                      json_path:
                                        description: JSON path to the field with invalid data
                                        maxLength: 255
                                        type: string
                                    required:
                                      - api_name
                                      - json_path
                                required:
                                  - status
                                  - code
                                  - message
                                  - details
                    required:
                      - Emails
                  - x-zs-$id: UnlinkEmailsFromRecordsGeneralError
                    description: >-
                      General error response for unlink emails from records
                      operation
                    additionalProperties: false
                    type: object
                    properties:
                      status:
                        description: The status of the response.
                        type: string
                        enum:
                          - error
                      code:
                        description: The error code identifying the type of error.
                        type: string
                        enum:
                          - MANDATORY_NOT_FOUND
                      message:
                        description: A message describing the error.
                        maxLength: 256
                        type: string
                      details:
                        description: Object containing additional details about the error.
                        additionalProperties: false
                        type: object
                        properties:
                          api_name:
                            description: The API name of the field that caused the error.
                            maxLength: 255
                            type: string
                          json_path:
                            description: The JSON path to the field that caused the error.
                            maxLength: 255
                            type: string
                        required:
                          - api_name
                          - json_path
                    required:
                      - status
                      - code
                      - message
                      - details
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                x-zs-$id: UnlinkEmailsFromRecordsNotFoundError
                description: Details of not found error
                additionalProperties: false
                type: object
                oneOf:
                  - x-zs-$id: UnlinkEmailsFromRecordsNotFoundErrorDetails
                    additionalProperties: false
                    description: Returned when the request URL is incorrect.
                    type: object
                    properties:
                      status:
                        description: The status of the response.
                        type: string
                        enum:
                          - error
                      code:
                        description: The error code identifying the type of error.
                        type: string
                        enum:
                          - INVALID_URL_PATTERN
                      message:
                        description: A message describing the error.
                        type: string
                        enum:
                          - >-
