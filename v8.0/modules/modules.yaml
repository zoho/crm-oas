      operationId: updateModules
      summary: Update CRM modules
      description: >-
        Updates existing modules in the CRM. Allows modification of module
        labels (`singular_label`, `plural_label`) and profile assignments.
        Supports batch updates of up to 100 modules per request. Returns 200
        when all modules update successfully, or 207 Multi-Status when some
        succeed and others fail. Module `access_type` cannot be updated and must
        not be included in the request body. This operation is idempotent -
        submitting the same request multiple times produces the same result.
      security:
        - OAuth2:
            - ZohoCRM.settings.modules.UPDATE
      requestBody:
        description: |-
          Request body for updating modules. Supports batch updates -
          multiple modules can be updated in a single request. Partial updates
          are supported: only `id` is required; `singular_label`,
          `plural_label`, and `profiles` are optional and can be updated
          independently. Profile updates use delta semantics: profiles without
          `_delete: null` are added (if not already present), profiles with
          `_delete: null` are removed. Batch updates may result in partial
          success (207 Multi-Status response) if some modules succeed and others
          fail. access_type is not accepted in PUT request payload and cannot be
          changed."
        content:
          application/json:
            schema:
              type: object
              description: >-
                Batch update request containing an array of module objects to
                update. Each module requires `id`; other fields are optional.
              additionalProperties: false
              properties:
                modules:
                  type: array
                  description: >-
                    Array of module objects to update, with one to 100 unique
                    entries. Each entry must include `id`; `singular_label`,
                    `plural_label`, and `profiles` are optional.
                  minItems: 1
                  maxItems: 100
                  uniqueItems: true
                  items:
                    type: object
                    description: >-
                      Module update definition containing labels, module ID, and
                      accessible profiles.
                    additionalProperties: false
                    properties:
                      singular_label:
                        type: string
                        description: >-
                          Singular display label for the module shown in the UI
                          while referring to a single record (for example,
                          `Contact` or `Deal`). Must contain only alphanumeric
                          characters and underscores, with no consecutive
                          underscores, and cannot be empty.
                        minLength: 1
                        maxLength: 50
                      plural_label:
                        type: string
                        description: >-
                          Plural display label for the module shown in the UI
                          while referring to multiple records (for example,
                          `Contacts` or `Deals`). Must contain only alphanumeric
                          characters and underscores, with no consecutive
                          underscores, and cannot be empty.
                        minLength: 1
                        maxLength: 50
                      id:
                        description: >-
                          Unique identifier of the module to update. Must be a
                          valid existing module ID.
                        x-zs-$ref:
                          resource: modules
                          origins:
                            - operationId: getModules
                              propertyId: ModulesId
                        type: string
                        format: int64
                      profiles:
                        type: array
                        description: >-
                          Optional list of user profiles to add or remove from
                          this module using delta semantics. Profiles without
                          `_delete` are added; profiles with `_delete: null` are
                          removed. Omit this to leave profile assignments
                          unchanged.Each profile ID represents a permission set
                          determining which users can view, create, edit, or
                          delete records in this module.
                        minItems: 1
                        maxItems: 203
                        uniqueItems: true
                        items:
                          type: object
                          description: Profile identifier object.
                          additionalProperties: false
                          properties:
                            id:
                              type: string
                              description: Unique numeric identifier of the user profile.
                              format: int64
                              minLength: 1
                              x-zs-$ref:
                                resource: profiles
                                origins:
                                  - operationId: getProfiles
                                    propertyId: ProfileId
                              pattern: ^[0-9]{1,19}$
                              maxLength: 19
                              example: '4832675000000850800'
                            _delete:
                              type: 'null'
                              description: >-
                                Deletion marker. Set to `null` to remove this
                                profile from the module's access list. Omit to
                                add or retain the profile.
                          required:
                            - id
                    required:
                      - id
              required:
                - modules
            examples:
              RemoveAndAddProfile:
                summary: >-
                  Remove admin profile and add standard profile for a custom
                  module
                description: >-
                  Demonstrates removing an existing profile assignment (admin)
                  and adding a new profile (standard) to a custom module while
                  updating labels. The _delete field marks a profile for
                  removal.
                value:
                  modules:
                    - singular_label: CMUpdated
                      plural_label: CMUpdated
                      id: '111111000000263276'
                      profiles:
                        - id: '111111000000000497'
                          _delete: null
                        - id: '111111000000000499'
              BatchUpdateMixedOperations:
                summary: Batch update with label changes and profile modifications
                description: >-
                  Updates two modules in a single request. The first module adds
                  admin profile and removes standard profile and the second
                  module updates only labels without profile changes.
                value:
                  modules:
                    - singular_label: CMUpdated
                      plural_label: CMUpdated
                      id: '111111000000263276'
                      profiles:
                        - id: '111111000000000497'
                        - id: '111111000000000499'
                          _delete: null
                    - id: '111111000000258973'
                      plural_label: CM2Updated
                      singular_label: CM2Updated
              UpdateLabelsOnly:
                summary: Update module labels without changing profiles
                description: >-
                  Updates singular and plural labels for the Deals module
                  without modifying profile assignments. Demonstrates that
                  profile updates are optional when only label changes are
                  needed.
                value:
                  modules:
                    - id: '111111000000002654'
                      plural_label: DealsUpdated
                      singular_label: DealUpdated
              RemoveProfileOnly:
                summary: Remove profile access without updating labels
                description: >-
                  Removes admin profile access from a module without changing
                  module labels. Use _delete field to mark profiles for removal.
                value:
                  modules:
                    - id: '111111000000002654'
                      profiles:
                        - id: '111111000000000497'
                          _delete: null
        required: true
      responses:
        '200':
          description: >-
            All modules in the batch updated successfully. Each entry in the
            `modules` array confirms the update with a `SUCCESS` code and the
            module ID.
          content:
            application/json:
              schema:
                type: object
                x-zs-$id: UpdateModulesResponseSuccess
                description: >-
                  Successful batch update response containing one result object
                  per updated module, each confirming the update with a
                  `SUCCESS` code.
                additionalProperties: false
                properties:
                  modules:
                    type: array
                    description: >-
                      Array of success results for each updated module in the
                      batch, preserving request order.
                    minItems: 1
                    maxItems: 100
                    items:
                      type: object
                      description: Successful module update result
                      additionalProperties: false
                      properties:
                        code:
                          type: string
                          description: >-
                            Returns `SUCCESS` when the module updates without
                            error.
                          enum:
                            - SUCCESS
                        details:
                          type: object
                          description: >-
                            Details of the successfully updated module,
                            containing its unique identifier.
                          additionalProperties: false
                          properties:
                            id:
                              type: string
                              description: >-
                                Unique identifier of the module that was
                                successfully updated.
                              format: int64
                              minLength: 1
                          required:
                            - id
                        message:
                          type: string
                          description: >-
                            Confirmation text returned when the module update
                            succeeds.
                          minLength: 1
                          maxLength: 1000
                        status:
                          type: string
                          description: Status indicator for successful operation
                          enum:
                            - success
                      required:
                        - code
                        - details
                        - message
                        - status
                required:
                  - modules
              examples:
                SingleModuleSuccess:
                  summary: Single module updated successfully
                  description: >-
                    200 response for a single-module batch update that completed
                    successfully.
                  value:
                    modules:
                      - code: SUCCESS
                        details:
                          id: '111111000000263276'
                        message: the module name has been updated successfully
                        status: success
                BatchSuccess:
                  summary: All modules in the batch updated successfully
                  description: >-
                    200 response where all modules in the batch updated
                    successfully, each returning a SUCCESS code and its module
                    ID.
                  value:
                    modules:
                      - code: SUCCESS
                        details:
                          id: '111111000000263276'
                        message: module updated successfully
                        status: success
                      - code: SUCCESS
                        details:
                          id: '111111000000002654'
                        message: module updated successfully
                        status: success
        '207':
          description: >-
            Multi-Status - partial success. Returned when batch update contains
            both successful and failed module updates. Response includes
            individual status for each module in the request.
          content:
            application/json:
              schema:
                type: object
                x-zs-$id: UpdateModulesResponseMultiStatus
                description: >-
                  Multi-status batch update response containing one result
                  object per module in the request. Results preserve request
                  order and include both successful and failed updates.
                additionalProperties: false
                properties:
                  modules:
                    type: array
                    description: >-
                      Array of per-module results for each entry in the request,
                      preserving request order. Each element is either a success
                      or an error variant.
                    minItems: 1
                    maxItems: 100
                    items:
                      oneOf:
                        - type: object
                          x-zs-$id: ModulesPutResponseSuccess
                          description: Successful module update result
                          additionalProperties: false
                          properties:
                            code:
                              type: string
                              description: Success code indicating that module was updated
                              enum:
                                - SUCCESS
                            details:
                              type: object
                              description: Success details containing the updated module ID
                              additionalProperties: false
                              properties:
                                id:
                                  type: string
                                  description: >-
                                    Unique identifier of the successfully
                                    updated module.
                                  format: int64
                                  minLength: 1
                              required:
                                - id
                            message:
                              type: string
                              description: >-
                                Confirmation text returned for the module entry
                                that succeeded.
                              minLength: 1
                              maxLength: 1000
                            status:
                              type: string
                              description: >-
                                Fixed value `success`, indicating this module's
                                update succeeded in the partial batch.
                              enum:
                                - success
                          required:
                            - code
                            - details
                            - message
                            - status
                        - type: object
                          x-zs-$id: ModulesPutResponseInvalidData
                          description: >-
                            Returned when a module update failed due to invalid
                            data - type mismatch, unsupported enum value, or
                            exceeded field length.
                          additionalProperties: false
                          properties:
                            code:
                              type: string
                              description: >-
                                Fixed value `INVALID_DATA`, indicating this
                                module's update failed because the submitted
                                data was invalid.
                              enum:
                                - INVALID_DATA
                            details:
                              oneOf:
                                - type: object
                                  x-zs-$id: ModulesPutResponseInvalidFieldValue
                                  description: >-
                                    Identifies a field that received a value of
                                    the wrong data type, including the API name,
                                    JSONPath, and expected type.
                                  additionalProperties: false
                                  properties:
                                    api_name:
                                      type: string
                                      description: >-
                                        API name of the field that received a
                                        value of an incorrect data type.
                                      minLength: 1
                                      maxLength: 50
                                    json_path:
                                      type: string
                                      description: >-
                                        JSONPath locating the field in the
                                        request body that contained the
                                        incorrect data type.
                                      minLength: 1
                                      maxLength: 100
                                    expected_data_type:
                                      type: string
                                      maxLength: 50
                                      description: Expected data type for the field
                                  required:
                                    - api_name
                                    - json_path
                                - type: object
                                  x-zs-$id: ModulesPutResponseInvalidParameterValue
                                  description: >-
                                    Identifies a parameter whose submitted value
                                    is not among the supported enum values, with
                                    the parameter name, index, and accepted
                                    values.
                                  additionalProperties: false
                                  properties:
                                    index:
                                      type: integer
                                      description: >-
                                        Zero-based index of the invalid
                                        parameter.
                                      format: int32
                                      minimum: 0
                                    supported_values:
                                      type: array
                                      maxItems: 10
                                      description: >-
                                        List of valid values accepted for the
                                        parameter.
                                      items:
                                        type: string
                                        description: >-
                                          A valid value accepted for this
                                          parameter
                                        minLength: 1
                                        maxLength: 50
                                      minItems: 1
                                    param_name:
                                      type: string
                                      description: Name of the invalid parameter
                                      minLength: 1
                                      maxLength: 50
                                  required:
                                    - param_name
                                - type: object
                                  x-zs-$id: ModulesPutResponseFieldLengthExceeded
                                  description: >-
                                    Identifies a field whose submitted value
                                    exceeded the maximum allowed character
                                    length, with the API name, JSONPath, and the
                                    limit.
                                  additionalProperties: false
                                  properties:
                                    maximum_length:
                                      type: integer
                                      description: >-
                                        Maximum number of characters permitted
                                        for the field.
                                      format: int32
                                      minimum: 1
                                    api_name:
                                      type: string
                                      description: >-
                                        API name of the field whose value
                                        exceeded the maximum allowed length.
                                      minLength: 1
                                      maxLength: 50
                                    json_path:
                                      type: string
                                      description: >-
                                        JSONPath of the field in the request
                                        whose value exceeded the maximum allowed
                                        length.
                                      minLength: 1
                                      maxLength: 100
                                  required:
                                    - api_name
                                    - json_path
                                    - maximum_length
                              description: >-
                                Represents the error details for the invalid
                                field.
                            message:
                              type: string
                              description: >-
                                Explanation of the validation failure for the
                                module entry that contained invalid data.
                              minLength: 1
                              maxLength: 1000
                            status:
                              type: string
                              description: >-
                                Fixed value `error`, indicating the module
                                update failed because the submitted data was
                                invalid.
                              enum:
                                - error
                          required:
                            - code
                            - details
                            - message
                            - status
                        - type: object
                          x-zs-$id: ModulesPutResponseMandatoryNotFound
                          description: >-
                            Returned when a module update failed because a
                            mandatory field was absent from the request.
                          additionalProperties: false
                          properties:
                            code:
                              type: string
                              description: >-
                                Fixed value `MANDATORY_NOT_FOUND`, indicating
                                the module update failed because a required
                                field was absent from the request.
                              enum:
                                - MANDATORY_NOT_FOUND
                            details:
                              type: object
                              description: >-
                                Details identifying the required field that was
                                missing, including its API name and JSONPath
                                location.
                              additionalProperties: false
                              properties:
                                api_name:
                                  type: string
                                  description: >-
                                    API name of the required field that was not
                                    provided in the request.
                                  minLength: 1
                                  maxLength: 50
                                json_path:
                                  type: string
                                  description: >-
                                    JSONPath location in the request where the
                                    required field was expected.
                                  minLength: 1
                                  maxLength: 100
                              required:
                                - api_name
                                - json_path
                            message:
                              type: string
                              description: >-
                                Explanation of the missing required field that
                                caused the module entry to fail.
                              minLength: 1
                              maxLength: 1000
                            status:
                              type: string
                              description: >-
                                Fixed value `error`, indicating the module
                                update failed because a mandatory field was
                                missing.
                              enum:
                                - error
                          required:
                            - code
                            - details
                            - message
                            - status
                        - type: object
                          x-zs-$id: ModulesPutResponseNotAllowed207
                          description: >-
                            Returned when a module update failed because the
                            request attempted to modify a restricted or
                            immutable field.
                          additionalProperties: false
                          properties:
                            code:
                              type: string
                              description: >-
                                Fixed value `NOT_ALLOWED`, indicating the module
                                update failed because the request attempted to
                                modify a field that cannot be changed.
                              enum:
                                - NOT_ALLOWED
                            details:
                              type: object
                              description: >-
                                Details identifying the restricted field that
                                was included in the request, by API name and
                                JSONPath.
                              additionalProperties: false
                              properties:
                                api_name:
                                  type: string
                                  description: >-
                                    API name of the field whose update is not
                                    permitted.
                                  minLength: 1
                                  maxLength: 50
                                json_path:
                                  type: string
                                  description: >-
                                    JSONPath location of the restricted field in
                                    the request.
                                  minLength: 1
                                  maxLength: 100
                              required:
                                - api_name
                                - json_path
                            message:
                              type: string
                              description: >-
                                Explanation of the disallowed field modification
                                that caused the module entry to be rejected,
                                identifying which field cannot be changed.
                              minLength: 1
                              maxLength: 1000
                            status:
                              type: string
                              description: >-
                                Fixed value `error`, indicating the module
                                update failed because a disallowed field
                                modification was attempted.
                              enum:
                                - error
                          required:
                            - code
                            - details
                            - message
                            - status
                        - type: object
                          x-zs-$id: ModulesPutResponseInvalidModuleTeam
                          description: >-
                            Returned when a module update failed because the
                            referenced module does not exist, the ID is invalid,
                            or the operation is unsupported for this module
                            type.
                          additionalProperties: false
                          properties:
                            code:
                              type: string
                              description: >-
                                Fixed value `INVALID_MODULE`, indicating the
                                module reference is invalid, does not exist, or
                                the operation is not supported for this module
                                type.
                              enum:
                                - INVALID_MODULE
                            details:
                              type: object
                              description: >-
                                Details identifying the field or reference that
                                caused the invalid-module error, by API name and
                                JSONPath.
                              additionalProperties: false
                              properties:
                                api_name:
                                  type: string
                                  description: >-
                                    API name of the field or reference
                                    associated with the invalid module.
                                  minLength: 1
                                  maxLength: 50
                                json_path:
                                  type: string
                                  description: >-
                                    JSONPath to the invalid module reference in
                                    the request.
                                  minLength: 1
                                  maxLength: 100
                              required:
                                - api_name
                                - json_path
                            message:
                              type: string
                              description: >-
                                Explanation of why the module identifier was not
                                recognized or could not be updated.
                              minLength: 1
                              maxLength: 1000
                            status:
                              type: string
                              description: >-
                                Fixed value `error`, indicating the module
                                update failed because the module reference is
                                invalid or the operation is unsupported for this
                                module type.
                              enum:
                                - error
                          required:
                            - code
                            - details
                            - message
                            - status
                      description: >-
                        Represents a single per-module result entry, which is
                        either a success result or an error result.
                required:
                  - modules
              examples:
                PartialSuccessInvalidProfile:
                  summary: Partial batch - one success, one invalid profile error
                  description: >-
                    207 Multi-Status response where one module updated
                    successfully and another failed because the specified
                    profile ID was invalid. Results preserve request order.
                  value:
                    modules:
                      - code: SUCCESS
                        details:
                          id: '111111000000263276'
                        message: module updated successfully
                        status: success
                      - code: INVALID_DATA
                        details:
                          api_name: id
                          json_path: $.modules[1].profiles[0].id
                        message: Invalid profile id passed
                        status: error
                PartialSuccessMissingId:
                  summary: >-
                    Partial success - first module succeeds, second fails with
                    missing required ID
                  description: >-
                    207 Multi-Status response where one module updated
                    successfully and another failed because the required `id`
                    field was not provided.
                  value:
                    modules:
                      - code: SUCCESS
                        details:
                          id: '111111000000002654'
                        message: module updated successfully
                        status: success
                      - code: MANDATORY_NOT_FOUND
                        details:
                          api_name: id
                          json_path: $.modules[1]
                        message: required field not found
                        status: error
                PartialSuccessLabelLength:
                  summary: Partial success - label length exceeded error for one module
                  description: >-
                    207 Multi-Status response where one module updated
                    successfully and another failed because the plural label
                    exceeded the maximum allowed length.
                  value:
                    modules:
                      - code: SUCCESS
                        details:
                          id: '111111000000263276'
                        message: module updated successfully
                        status: success
                      - code: INVALID_DATA
                        details:
                          maximum_length: 50
                          api_name: plural_label
                          json_path: $.modules[1].plural_label
                        message: invalid data
                        status: error
                PartialSuccessTeamModuleProfileUpdate:
                  summary: Partial success - profile update not allowed for team module
                  description: >-
                    207 Multi-Status response where one module updated
                    successfully and another failed because profile updates are
                    not supported for team-based modules.
                  value:
                    modules:
                      - code: SUCCESS
                        details:
                          id: '111111000000263276'
                        message: module updated successfully
                        status: success
                      - code: NOT_ALLOWED
                        details:
                          api_name: profiles
                          json_path: $.modules[1].profiles
                        message: profile update for team module is not allowed
                        status: error
        '400':
          description: >-
            Bad request - validation failure. Returned when input data fails
            validation (invalid module ID, unsupported field values, field
            length exceeded, missing required fields, attempting unsupported
            operations on system modules, attempting to update immutable fields
            such as access_type, or attempting to update profiles for a
            team-based module). No modules are updated when this error occurs.
          content:
            application/json:
              schema:
                type: object
                x-zs-$id: UpdateModulesResponseInvalid
                description: >-
                  Validation error response for batch update failures. Returned
                  when all modules in the request fail validation. No modules
                  are updated when this error occurs.
                additionalProperties: false
                properties:
                  modules:
                    type: array
                    description: >-
                      Error result objects for each module in the request,
                      preserving request order. Present when all modules fail
                      validation.
                    minItems: 1
                    maxItems: 100
                    items:
                      oneOf:
                        - type: object
                          x-zs-$id: ModulesPutResponseInvalidModule
                          description: >-
                            Returned when a module update failed because the
                            module ID is invalid, the module does not exist
                            (INVALID_MODULE), or a field value is invalid
                            (INVALID_DATA).
                          additionalProperties: false
                          properties:
                            code:
                              type: string
                              description: >-
                                `INVALID_MODULE` indicates the module ID does
                                not exist or is invalid; `INVALID_DATA`
                                indicates a field value in the module payload is
                                invalid.
                              enum:
                                - INVALID_MODULE
                                - INVALID_DATA
                            details:
                              oneOf:
                                - type: object
                                  x-zs-$id: ModulesPutResponseInvalidFieldModule
                                  description: >-
                                    Identifies the invalid field or module
                                    reference by its API name and JSONPath
                                    location within the request.
                                  additionalProperties: false
                                  properties:
                                    api_name:
                                      type: string
                                      description: >-
                                        API name of the field or module
                                        reference that failed validation.
                                      minLength: 1
                                      maxLength: 50
                                    json_path:
                                      type: string
                                      description: >-
                                        JSONPath to the invalid field or module
                                        reference in the request.
                                      minLength: 1
                                      maxLength: 100
                                  required:
                                    - api_name
                                    - json_path
                                - type: object
                                  x-zs-$id: ModulesPutResponseResourcePathIndex
                                  description: >-
                                    Identifies the invalid module by its
                                    zero-based position in the request array.
                                  additionalProperties: false
                                  properties:
                                    resource_path_index:
                                      type: integer
                                      description: >-
                                        Zero-based index of the invalid module
                                        in the request array.
                                      format: int32
                                      minimum: 0
                                  required:
                                    - resource_path_index
                              description: >-
                                Represents the error details about the invalid
                                module reference.
                            message:
                              type: string
                              description: >-
                                Explanation of the validation error that caused
                                the entire batch request to fail.
                              minLength: 1
                              maxLength: 1000
                            status:
                              type: string
                              description: >-
                                Fixed value `error`, indicating this module
                                update failed.
                              enum:
                                - error
                          required:
                            - code
                            - details
                            - message
                            - status
                        - type: object
                          x-zs-$id: ModulesPutResponseInvalidData400
                          description: >-
                            Returned when a module update failed because the
                            submitted data was invalid - type mismatch,
                            unsupported enum value, or value exceeding the
                            length limit.
                          additionalProperties: false
                          properties:
                            code:
                              type: string
                              description: >-
                                Fixed value `INVALID_DATA`, indicating the
                                module update failed because the submitted data
                                was invalid.
                              enum:
                                - INVALID_DATA
                            details:
                              oneOf:
                                - type: object
                                  x-zs-$id: ModulesPutResponseInvalidFieldValue400
                                  description: >-
                                    Identifies a parameter whose submitted value
                                    is not among the supported enum values, with
                                    the parameter name, index, and accepted
                                    values.
                                  additionalProperties: false
                                  properties:
                                    index:
                                      type: integer
                                      description: >-
                                        Zero-based position of the invalid value
                                        within the parameter array.
                                      format: int32
                                      minimum: 0
                                    supported_values:
                                      type: array
                                      description: >-
                                        List of valid values accepted for the
                                        parameter
                                      maxItems: 10
                                      items:
                                        type: string
