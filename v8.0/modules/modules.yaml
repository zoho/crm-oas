        '401':
          description: >-
            The access token does not include the required scope for this
            operation.

            **Resolution:** A new access token must be generated with the
            **ZohoCRM.settings.modules.CREATE** scope.
          content:
            application/json:
              schema:
                type: object
                x-zs-$id: CreateModulesErrorResponsesOAuthScopeMismatch
                description: >-
                  Represents the error response body returned when the OAuth
                  access token does not include the required scope for this
                  operation.
                additionalProperties: false
                properties:
                  code:
                    type: string
                    description: >-
                      Represents the error code returned when the OAuth token
                      does not include the required scope.

                      Possible values:

                      **OAUTH_SCOPE_MISMATCH** - The access token does not
                      include the required scope for this operation.
                    enum:
                      - OAUTH_SCOPE_MISMATCH
                  details:
                    type: object
                    description: >-
                      Represents additional context about the OAuth scope issue
                      encountered during the request.
                    additionalProperties: false
                  message:
                    type: string
                    description: >-
                      Represents the error message describing the OAuth scope
                      mismatch.
                    maxLength: 1000
                  status:
                    type: string
                    description: >-
                      Represents the error status of the response.

                      Possible values:

                      **error** - The module creation request failed because the
                      OAuth token lacks the required scope.
                    enum:
                      - error
                required:
                  - code
                  - details
                  - message
                  - status
              examples:
                OAuthScopeMismatch:
                  summary: >-
                    OAuth token missing required ZohoCRM.settings.modules.CREATE
                    scope
                  description: >-
                    Returned when the OAuth access token does not include the
                    **ZohoCRM.settings.modules.CREATE** scope required for this
                    operation.
                  value:
                    code: OAUTH_SCOPE_MISMATCH
                    details: {}
                    message: invalid oauth scope to access this URL
                    status: error
        '403':
          description: >-
            No permission to create custom modules.

            **Resolution:** The CRM administrator must grant the required
            module-creation permission to the user's profile.
          content:
            application/json:
              schema:
                type: object
                x-zs-$id: CreateModulesErrorResponsesNoPermission
                description: >-
                  Represents the error response body returned when the user's
                  CRM profile lacks the required permission to create a custom
                  module. Crm_Implied_Customize_Zoho_CRM is required for
                  org_based creation, and Crm_Implied_Create_Team_Module is
                  required for team_based creation.
                additionalProperties: false
                properties:
                  code:
                    type: string
                    description: >-
                      Represents the error code returned when the user lacks the
                      required CRM permission to create a custom module.

                      Possible values:

                      **NO_PERMISSION** - The user's profile does not have the
                      required permission for this operation.
                    enum:
                      - NO_PERMISSION
                  details:
                    type: object
                    description: >-
                      Represents additional information about the missing
                      permissions required to create the module.
                    additionalProperties: false
                    properties:
                      permissions:
                        type: array
                        description: >-
                          Represents the list of permission identifiers that the
                          user lacks for the requested access type.

                          Possible values:

                          **Crm_Implied_Customize_Zoho_CRM** - Required for
                          org-based module creation.

                          **Crm_Implied_Create_Team_Module** - Required for
                          team-based module creation.
                        maxItems: 1
                        items:
                          type: string
                          description: >-
                            Represents a permission identifier required to
                            create the module for the requested access type.

                            Possible values:

                            **Crm_Implied_Customize_Zoho_CRM** - Required for
                            org-based modules.

                            **Crm_Implied_Create_Team_Module** - Required for
                            team-based modules.
                          enum:
                            - Crm_Implied_Customize_Zoho_CRM
                            - Crm_Implied_Create_Team_Module
                    required:
                      - permissions
                  message:
                    type: string
                    description: >-
                      Represents the error message describing the permission
                      denial.
                    maxLength: 1000
                  status:
                    type: string
                    description: >-
                      Represents the error status of the response.

                      Possible values:

                      **error** - The module creation request failed because the
                      user lacks the required permission.
                    enum:
                      - error
                required:
                  - code
                  - details
                  - message
                  - status
              examples:
                NoPermission:
                  summary: User lacks Crm_Implied_Customize_Zoho_CRM permission
                  description: >-
                    Returned when the user's CRM profile lacks the
                    **Crm_Implied_Customize_Zoho_CRM** permission required to
                    create an org-based custom module.
                  value:
                    code: NO_PERMISSION
                    details:
                      permissions:
                        - Crm_Implied_Customize_Zoho_CRM
                    message: permission denied
                    status: error
                NoPermissionTeamBased:
                  summary: User lacks permission to create a team-based module
                  description: >-
                    Returned when the user's CRM profile lacks the
                    **Crm_Implied_Create_Team_Module** permission required to
                    create a team-based custom module.
                  value:
                    code: NO_PERMISSION
                    details:
                      permissions:
                        - Crm_Implied_Create_Team_Module
                    message: permission denied
                    status: error
