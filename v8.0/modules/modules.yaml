              schema:
                type: object
                x-zs-$id: ModulesGet200Response
                description: Response body containing the array of module metadata objects.
                additionalProperties: false
                properties:
                  modules:
                    maxItems: 600
                    type: array
                    description: >-
                      Array of module metadata objects returned for the Zoho CRM
                      account, up to 600 entries, each containing configuration,
                      capabilities, fields, layouts, profiles, and permissions.
                    items:
                      type: object
                      description: >-
                        Complete metadata for a single Zoho CRM module,
                        including configuration, capabilities, fields, layouts,
                        profiles, and related lists.
                      additionalProperties: false
                      properties:
                        global_search_supported:
                          type: boolean
                          description: >-
                            Indicates whether global search functionality is
                            supported for this module.
                        public_fields_configured:
                          type: boolean
                          description: >-
                            Indicates whether public fields have been configured
                            for this module.
                        recycle_bin_on_delete:
                          type: boolean
                          description: >-
                            Indicates whether deleted records are moved to the
                            recycle bin instead of being permanently deleted.
                        has_more_profiles:
                          type: boolean
                          description: >-
                            Indicates whether more profiles exist beyond those
                            returned in the current response.
                        sub_menu_available:
                          type: boolean
                          description: >-
                            Whether a submenu is available for this module in
                            the navigation.
                        lookupable:
                          type: boolean
                          description: >-
                            Indicates whether this module can be used as a
                            lookup target in other modules.
                        profile_count:
                          type: integer
                          format: int32
                          description: >-
                            Represents the number of profiles associated with
                            this module; 0 indicates no profile assignments.
                        module_type:
                          type: string
                          description: >-
                            Represents the type classification of the module;
                            exposed only for pathfinder and orchestration
                            modules. Possible values: `CONFIGURATION_ENTITIES`,
                            `ENTITIES`.
                          enum:
                            - CONFIGURATION_ENTITIES
                            - ENTITIES
                        cc_enabled:
                          type: boolean
                          description: >-
                            Whether CommandCenter functionality is enabled for
                            email communications in this module; exposed only
                            for orchestration modules and not applicable for
                            API-supported modules.
                        deletable:
                          type: boolean
                          description: >-
                            Indicates whether records in this module can be
                            deleted.
                        description:
                          type:
                            - string
                            - 'null'
                          maxLength: 255
                          description: >-
                            User-defined description of the module, up to 255
                            characters; null when no description has been set.
                        creatable:
                          type: boolean
                          description: >-
                            Indicates if new records can be created in this
                            module.
                        inventory_template_supported:
                          type: boolean
                          description: >-
                            Indicates whether inventory templates are supported
                            for this module.
                        modified_time:
                          type:
                            - string
                            - 'null'
                          format: date-time
                          description: >-
                            Timestamp of the most recent modification to the
                            module, returned as a timezone-aware date-time
                            string; null if the module has never been modified.
                        presence_sub_menu:
                          type: boolean
                          description: >-
                            Indicates whether this module has a presence submenu
                            option.
                        triggers_supported:
                          type: boolean
                          description: >-
                            Whether workflow triggers are supported for this
                            module.
                        id:
                          type: string
                          format: int64
                          description: Represents the unique identifier for the module.
                          x-zs-$id: ModulesId
                        api_name:
                          type: string
                          maxLength: 50
                          description: >-
                            Unique API identifier for the module used in
                            third-party integrations; starts with a letter,
                            contains only alphanumeric characters and
                            underscores, and has no consecutive or trailing
                            underscores.
                          x-zs-$id: ModulesApiName
                        plural_label:
                          type: string
                          maxLength: 50
                          description: >-
                            Plural display label for the module; returns the
                            translated label when translation is enabled,
                            otherwise matches `actual_plural_label`.
                        actual_plural_label:
                          type: string
                          maxLength: 50
                          description: >-
                            Original plural label of the module as stored in the
                            database, without any translation applied.
                        actual_singular_label:
                          type: string
                          maxLength: 50
                          description: >-
                            Original singular label of the module as stored in
                            the database, without any translation applied.
                        singular_label:
                          type: string
                          maxLength: 50
                          description: >-
                            Singular display label for the module; returns the
                            translated label when translation is enabled,
                            otherwise matches `actual_singular_label`.
                        isBlueprintSupported:
                          type: boolean
                          description: >-
                            Indicates whether Blueprint (process automation) is
                            supported for this module.
                        visibility:
                          type: integer
                          format: int32
                          description: >-
                            Bitwise feature visibility flags for the module; the
                            base value 1 indicates fully visible. Add flag
                            values to hide specific features: 2=WEBUIHIDDEN,
                            4=TABMENU, 8=LOOKUP, 16=RELATEDLIST,
                            32=MULTISELECTLOOKUP, 64=MODULE_SETTING,
                            128=AUTOMATION, 256=TEMPLATES, 512=IMPORT,
                            1024=EXPORT, 4096=REPORT, 8192=API.
                        convertable:
                          type: boolean
                          description: >-
                            Whether records in this module can be converted to
                            another module type.
                        editable:
                          type: boolean
                          description: >-
                            Whether records in this module can be edited by
                            users.
                        emailTemplate_support:
                          type: boolean
                          description: >-
                            Indicates whether Email Templates functionality is
                            supported for this module.
                        email_parser_supported:
                          type: boolean
                          description: >-
                            Indicates whether email parsing is supported for
                            this module.
                        filter_supported:
                          type: boolean
                          description: >-
                            Indicates whether records in this module can be
                            filtered.
                        show_as_tab:
                          type: boolean
                          description: >-
                            Indicates whether the module appears as a tab in the
                            main navigation.
                        web_link:
                          type:
                            - string
                            - 'null'
                          description: >-
                            URL for web tab modules; supports dynamic parameter
                            substitution via the arguments array.
                        viewable:
                          type: boolean
                          description: Whether records in this module can be viewed.
                        api_supported:
                          type: boolean
                          description: >-
                            Whether API operations are supported for this
                            module.
                        quick_create:
                          type: boolean
                          description: >-
                            Indicates whether the quick create form is available
                            for this module.
                        generated_type:
                          type: string
                          description: >-
                            Method by which this module was generated or
                            created.
                          enum:
                            - field_tracker
                            - default
                            - web
                            - linking
                            - custom
                            - picklisttracker
                            - subform
                            - static_subform
                            - webtab_link
                        static_subform_properties:
                          type:
                            - object
                            - 'null'
                          description: >-
                            Configuration properties for static subform modules,
                            including the list of field references.
                          additionalProperties: false
                          properties:
                            fields:
                              type: array
                              maxItems: 25
                              description: >-
                                Array of field references included in the static
                                subform, up to 25 entries.
                              items:
                                type: object
                                description: >-
                                  Represents the field reference object
                                  containing the field API name and unique
                                  identifier.
                                additionalProperties: false
                                properties:
                                  api_name:
                                    type: string
                                    maxLength: 50
                                    description: >-
                                      Represents the API name of the static
                                      subform field.
                                  id:
                                    type: string
                                    format: int64
                                    description: >-
                                      Represents the unique identifier of the
                                      static subform field.
                                required:
                                  - api_name
                                  - id
                          required:
                            - fields
                        feeds_required:
                          type: boolean
                          description: >-
                            Indicates whether activity feeds are required for
                            this module.
                        scoring_supported:
                          type: boolean
                          description: >-
                            Indicates whether lead or record scoring
                            functionality is supported for this module.
                        webform_supported:
                          type: boolean
                          description: >-
                            Whether webform integration is supported for this
                            module.
                        arguments:
                          type:
                            - array
                            - 'null'
                          description: >-
                            Array of argument objects used to substitute dynamic
                            parameters in web tab URLs; for example,
                            `https://...&id=${Users.User Id}&name=${Users.First
                            Name}`. Duplicates are allowed, up to 50 entries.
                          maxItems: 50
                          items:
                            type: object
                            description: >-
                              Argument object that defines a URL parameter
                              substitution, with a name (template key) and a
                              value (field reference expression).
                            properties:
                              name:
                                type: string
                                maxLength: 50
                                description: >-
                                  Key used in the web tab URL template to
                                  identify the substitution parameter.
                              value:
                                type: string
                                maxLength: 100
                                description: >-
                                  Field substitution reference expression (for
                                  example, `users.recordId`) resolved at runtime
                                  for web tab URL parameter substitution.
                            required:
                              - name
                              - value
                            additionalProperties: false
                        module_name:
                          type: string
                          maxLength: 50
                          description: Represents the display name of the module.
                        business_card_field_limit:
                          type: integer
                          format: int32
                          minimum: 0
                          description: >-
                            Maximum number of fields that can be displayed on
                            the business card view for this module; must be a
                            non-negative integer.
                        access_type:
                          type: string
                          description: >-
                            Access control type for the module; `org_based`
                            grants organization-wide access and `team_based`
                            grants team-specific access. This value is immutable
                            after module creation and cannot be updated via PUT
                            operations.
                          enum:
                            - org_based
                            - team_based
                        private_profile:
                          type:
                            - object
                            - 'null'
                          description: >-
                            Private profile configuration for the module,
                            containing the profile identifier and name.
                          additionalProperties: false
                          properties:
                            name:
                              type: string
                              maxLength: 101
                              description: >-
                                Name of the private profile associated with the
                                module.
                            id:
                              type: string
                              format: int64
                              description: >-
                                Unique identifier of the private profile
                                associated with the module.
                          required:
                            - name
                            - id
                        track_current_data:
                          type: boolean
                          description: >-
                            Whether current data tracking is enabled for this
                            module.
                        modified_by:
                          oneOf:
                            - type: object
                              x-zs-$id: ModulesModifiedByObjectResponse
                              additionalProperties: false
                              description: >-
                                User object representing the user who last
                                modified the module.
                              properties:
                                name:
                                  type: string
                                  maxLength: 101
                                  description: >-
                                    Represents the name of the user who last
                                    modified the module.
                                id:
                                  type: string
                                  format: int64
                                  description: >-
                                    Represents the unique identifier of the user
                                    who last modified the module.
                              required:
                                - name
                                - id
                            - type: 'null'
                              description: >-
                                Null value indicating the module has never been
                                modified.
                              x-zs-$id: ModulesModifiedByNullResponse
                        profiles:
                          type: array
                          maxItems: 203
                          description: >-
                            List of profiles that have permission to view this
                            module; may be empty for certain module types, with
                            up to 203 entries.
                          items:
                            type: object
                            description: >-
                              Represents the profile object containing the
                              profile identifier and display name.
                            additionalProperties: false
                            properties:
                              id:
                                type: string
                                format: int64
                                description: >-
                                  Represents the unique identifier of the
                                  profile.
                              name:
                                type: string
                                maxLength: 50
                                description: Represents the display name of the profile.
                            required:
                              - id
                              - name
                        parent_module:
                          type:
                            - object
                            - 'null'
                          description: >-
                            Reference to the parent module if this is a child or
                            related module; an empty object `{}` for standalone
                            modules, `null` in some cases, or an object with
                            `api_name` and `id` for child modules.
                          additionalProperties: false
                          properties:
                            api_name:
                              type: string
                              maxLength: 50
                              description: Represents the API name of the parent module.
                            id:
                              type: string
                              format: int64
                              description: >-
                                Represents the unique identifier of the parent
                                module.
                          required: []
                        status:
                          type: string
                          description: >-
                            Lifecycle state of the module. Possible values:
                            `visible`, `user_hidden`, `system_hidden`,
                            `scheduled_for_deletion`. This status is separate
                            from the numeric bitwise `visibility` flags. It does
                            not itself enable/disable individual features.
                          enum:
                            - visible
                            - scheduled_for_deletion
                            - user_hidden
                            - system_hidden
                        sequence_number:
                          type: integer
                          format: int32
                          description: >-
                            Represents the display order of the module in the
                            navigation list.
                        territory:
                          type:
                            - object
                            - 'null'
                          description: >-
                            Territory assignment for the module, containing the
                            territory identifier, name, and subordinates flag.
                          additionalProperties: false
                          properties:
                            name:
                              type: string
                              maxLength: 100
                              description: >-
                                Name of the territory; for example, "All
                                Territories" when the ID is 0.
                            id:
                              type: string
                              format: int64
                              description: >-
                                Unique identifier of the territory; 0 indicates
                                the special "All Territories" territory.
                            subordinates:
                              type: boolean
                              description: >-
                                Whether subordinate territories are included in
                                this territory assignment.
                          required:
                            - name
                            - id
                            - subordinates
                      required:
                        - id
                required:
                  - modules
        '204':
          description: No modules match the specified filter criteria.
        '400':
          description: >-
            Bad request returned when the `status` parameter contains
            unsupported values or when `feature_name` is provided as an empty
            string.
          content:
            application/json:
              schema:
                x-zs-$id: ModulesGet400Response
                oneOf:
                  - type: object
                    x-zs-$id: ModulesGet400ResponseInvalidStatus
                    description: >-
                      Error response returned when the `status` parameter
                      contains an unsupported value.
                    additionalProperties: false
                    properties:
                      code:
                        type: string
                        description: >-
                          Error code indicating invalid data in the request.
                          Always `INVALID_DATA`.
                        enum:
                          - INVALID_DATA
                      details:
                        type: object
                        description: >-
                          Details about the validation error, including the
                          parameter name, the invalid value index, and the list
                          of supported values.
                        additionalProperties: false
                        properties:
                          index:
                            type: integer
                            format: int32
                            description: >-
                              Zero-based index of the invalid value in the
                              comma-separated `status` parameter.
                          supported_values:
                            type: array
                            maxItems: 10
                            items:
                              type: string
                              maxLength: 50
                              description: A valid status value accepted by the API.
                            uniqueItems: true
                            description: >-
                              Unordered list of valid status values; each value
                              appears exactly once, up to 10 entries.
                          param_name:
                            type: string
                            enum:
                              - status
                            description: >-
                              Name of the parameter that contains the invalid
                              value. Always `status` for this error variant.
                        required:
                          - index
                          - supported_values
                          - param_name
                      message:
                        type: string
                        description: >-
                          A message describing the validation failure for the
                          invalid status parameter.
                        maxLength: 1000
                      status:
                        type: string
                        enum:
                          - error
                        description: >-
                          Status of the request. Always `error` for failed
                          requests.
                    required:
                      - code
                      - details
                      - message
                      - status
                  - type: object
                    x-zs-$id: ModulesGet400ResponseInvalidFeatureName
                    description: >-
                      Error response returned when the `feature_name` parameter
                      is provided as an empty string.
                    additionalProperties: false
                    properties:
                      code:
                        type: string
                        description: >-
                          Error code indicating invalid data in the request.
                          Always `INVALID_DATA`.
                        enum:
                          - INVALID_DATA
                      details:
                        type: object
                        additionalProperties: false
                        description: >-
                          Empty details object returned when the `feature_name`
                          parameter is provided as an empty string.
                      message:
                        type: string
                        description: >-
                          A message describing the validation failure for the
                          empty feature_name parameter.
                        maxLength: 1000
                      status:
                        type: string
                        enum:
                          - error
                        description: >-
                          Status of the request. Always `error` for failed
                          requests.
                    required:
                      - code
                      - details
                      - message
                      - status
                description: >-
                  Contains the error response when the request contains invalid
                  parameter values.
              examples:
                InvalidStatus:
                  summary: Invalid status parameter value
                  value:
                    code: INVALID_DATA
                    details:
                      index: 0
                      supported_values:
                        - visible
                        - user_hidden
                        - system_hidden
                        - scheduled_for_deletion
                      param_name: status
                    message: The status given is invalid.
                    status: error
                  description: >-
                    Shows the error response returned when the **status**
                    parameter contains an unsupported value.
                InvalidFeatureName:
                  summary: Empty or invalid feature_name parameter
                  value:
                    code: INVALID_DATA
                    details: {}
                    message: the given feature name is invalid
                    status: error
                  description: >-
                    Shows the error response returned when the **feature_name**
                    parameter is provided as an empty string.
    post:
      operationId: createModules
      summary: Create a custom module
      description: >-
        To create a custom module in your Zoho CRM organization. Only one module
        can be created per request. The required permission depends on the
        access type: **Crm_Implied_Customize_Zoho_CRM** for org-based modules
        and **Crm_Implied_Create_Team_Module** for team-based modules.
        Submitting the same api_name multiple times will result in validation
        errors. The optional access_type controls module access model
        (org_based/team_based).
      security:
        - OAuth2:
            - ZohoCRM.settings.modules.CREATE
      requestBody:
        description: >-
          The request body must contain a modules array with one object. Only
          single module creation is supported per request. access_type is
          optional and defaults to org_based. For team_based modules, do not
          pass profiles.
        content:
          application/json:
            schema:
              type: object
              description: >-
                Represents the request body structure for creating a custom
                module, containing the module definition in the **modules**
                array.
              additionalProperties: false
              properties:
                modules:
                  type: array
                  description: >-
                    Specify the module definitions to create. Only one module
                    definition object can be included per request.
                  minItems: 1
                  maxItems: 1
                  items:
                    type: object
                    description: >-
                      Specify the details of the Module definition object
                      containing module metadata, optional access_type, profiles
                      (not applicable for team_based), and optional display
                      field configuration
                    additionalProperties: false
                    properties:
                      singular_label:
                        type: string
                        pattern: ^[a-zA-Z0-9]+$
                        minLength: 1
                        maxLength: 50
                        description: >-
                          Specify the unique singular name of the module. Only
                          letters, numbers, and spaces are supported.
                      plural_label:
                        type: string
                        pattern: ^[a-zA-Z0-9]+$
                        minLength: 1
                        maxLength: 50
                        description: >-
                          Specify the unique plural name of the module. Only
                          letters, numbers, and spaces are supported.
                      api_name:
                        type: string
                        pattern: ^[a-zA-Z0-9]+$
                        minLength: 1
                        maxLength: 50
                        description: >-
                          Specify the unique API name for the module. The name
                          must begin with an English alphabet character, must
                          not end with an underscore, and must not contain two
                          consecutive underscores. If omitted, the system
                          generates the API name from the **plural_label**
                          value.
                      access_type:
                        type: string
                        enum:
                          - org_based
                          - team_based
                        default: org_based
                        description: >-
                          Specify the access type for the module.Defaults to
                          org_based when omitted. Use team_based to create a
                          team module.

                          Possible values:

                          **org_based** - The module is accessible based on
                          organizational profile settings.

                          **team_based** - The module is restricted to
                          team-based access.
                      profiles:
                        type: array
                        description: >-
                          Specify the array of profile IDs that determine which
                          user profiles can access this module. Required for
                          org_based modules. Do not pass this key for team_based
                          modules. Duplicate profile IDs are not allowed.
                        minItems: 1
                        maxItems: 203
                        uniqueItems: true
                        items:
                          type: object
                          additionalProperties: false
                          description: >-
                            Specify the details of a profile to be granted
                            access to the module.
                          properties:
                            id:
                              type: string
                              description: >-
                                Specify the unique ID of the profile to be
                                granted access to the module.
                              format: int64
                              x-zs-$ref:
                                resource: profiles
                                origins:
                                  - operationId: getProfiles
                                    propertyId: ProfileId
                              pattern: ^[0-9]{1,19}$
                              minLength: 1
                              maxLength: 19
                              example: '4832675000000850800'
                          required:
                            - id
                      display_field:
                        type: object
                        additionalProperties: false
                        description: >-
                          Specify the details of the display field for the
                          module. This is optional, but if provided, either
                          field_label or data_type is mandatory. Supported data
                          types are **autonumber** and **text**. If this is not
                          specified, the system generates a text display field. 
                          If data_type is 'autonumber', then auto_number
                          configuration with start_number is mandatory. 
                        properties:
                          field_label:
                            type: string
                            minLength: 1
                            maxLength: 100
                            description: >-
                              Specify the unique display label of the field used
                              as the module's display field. Either this
                              property or **data_type** must be provided when
                              specifying the display field.
                          data_type:
                            type: string
                            enum:
                              - autonumber
                              - text
                            description: >-
                              Specify the data type of the display field.

                              Possible values:

                              **autonumber** - Automatically generates a unique
                              number sequence for each record.

                              **text** - Allows users to enter text values
                              manually.
                          auto_number:
                            type: object
                            additionalProperties: false
                            description: >-
                              Specify the auto-number configuration for the
                              display field. Required when **data_type** is
                              **autonumber**.
                            properties:
                              prefix:
                                type: string
                                maxLength: 50
                                description: >-
                                  Specify the prefix to prepend to each
                                  auto-generated number value in the display
                                  field.
                              start_number:
                                type: string
                                pattern: ^[0-9]+$
                                maxLength: 16
                                description: >-
                                  Specify the starting number for the
                                  auto-number sequence. Only numeric characters
                                  are allowed.
                              suffix:
                                type: string
                                maxLength: 50
                                description: >-
                                  Specify the suffix to append to each
                                  auto-generated number value in the display
                                  field.
                            required:
                              - start_number
                    required:
                      - singular_label
                      - plural_label
                    allOf:
                      - if:
                          description: >-
                            Checks whether the module's access_type is
                            team_based to determine profile requirements.
                          properties:
                            access_type:
                              description: Module access type identifier
                              const: team_based
                          required:
                            - access_type
                        then:
                          description: >-
                            When access_type is team_based, profiles must not be
                            provided
                          not:
                            description: >-
                              Profiles must not be provided when access_type is
                              team_based
                            properties:
                              profiles:
                                type: array
                                description: List of profiles associated with the module
                                items:
                                  type: object
                                  description: Profile object
                                  additionalProperties: true
                                maxItems: 100
                            required:
                              - profiles
                          additionalProperties: true
                        else:
                          description: >-
                            Profiles configuration for non-team-based access
                            types
                          properties:
                            profiles:
                              type: array
                              description: List of profiles associated with the module
                              items:
                                type: object
                                description: Profile object
                                additionalProperties: true
                              maxItems: 100
                          required:
                            - profiles
                          additionalProperties: true
                        description: >-
                          Specifies the fields available for defining a new
                          custom module, including name labels, API name, and
                          optional display field configuration.
              required:
                - modules
            examples:
              MinimalModule:
                summary: Create a custom module with required fields only
                value:
                  modules:
                    - plural_label: CM123456
                      singular_label: CM123465
                      api_name: CustomModule1
                      profiles:
                        - id: '111111000000000497'
                description: >-
                  Shows a minimal POST request body with only the required
                  fields: **singular_label** and **plural_label**.
              ModuleWithTextDisplay:
                summary: Create a module with a text display field
                value:
                  modules:
                    - plural_label: CM1
                      singular_label: CM1
                      api_name: CustomModule2
                      profiles:
                        - id: '111111000000000497'
                      display_field:
                        field_label: fieldLabel
                        data_type: text
                description: >-
                  Shows a POST request body for a module with a text-based
                  display field configuration.
              ModuleWithAutonumber:
                summary: >-
                  Create a module with an auto-number display field including
                  prefix and suffix
                value:
                  modules:
                    - plural_label: CM21
                      singular_label: CM21
                      api_name: CustomModule3
                      profiles:
                        - id: '111111000000000497'
                      display_field:
                        field_label: fieldLabel
                        data_type: autonumber
                        auto_number:
                          prefix: M
                          suffix: H
                          start_number: '21'
                description: >-
                  Shows a POST request body for a module with an auto-number
                  display field, including prefix, start number, and suffix
                  configuration.
              TeamBasedModule:
                summary: Create a team-based custom module
                value:
                  modules:
                    - plural_label: TeamModule1
                      singular_label: TeamModule1
                      api_name: TeamModule1
                      access_type: team_based
                description: >-
                  Shows a POST request body for creating a team-based module
                  with the **access_type** set to **team_based** and no profile
                  assignments.
        required: true
      responses:
        '201':
          description: >-
            Returns the success result of the module creation, including the
            unique identifier of the newly created module.
          content:
            application/json:
              schema:
                type: object
                x-zs-$id: ModulesPost201Response
                description: >-
                  Represents the response body returned when a custom module is
                  successfully created, containing the resulting module details
                  in a modules array.
                additionalProperties: false
                properties:
                  modules:
                    type: array
                    description: >-
                      Represents the array containing the result of the single
                      module creation request. Contains exactly one item for
                      each module creation request.
                    minItems: 1
                    maxItems: 1
                    items:
                      type: object
                      description: >-
                        Represents the result of the module creation request,
                        including the status, message, and identifier of the
                        created module.
                      additionalProperties: false
                      properties:
                        code:
                          type: string
                          description: >-
                            Represents the status code of the module creation
                            operation.

                            Possible values:

                            **SUCCESS** - The module creation completed
                            successfully.
                          enum:
                            - SUCCESS
                        details:
                          type: object
                          description: >-
                            Represents the details of the created module,
                            including its unique identifier.
                          additionalProperties: false
                          properties:
                            id:
                              type: string
                              description: >-
                                Represents the unique identifier of the newly
                                created module.
                              x-zs-$id: ModuleDetailsId
                              format: int64
                          required:
                            - id
                        message:
                          type: string
                          description: >-
                            Represents the confirmation message for the module
                            creation operation.

                            Possible values:

                            **module created successfully** - The module
                            creation completed without errors.
                          enum:
                            - module created successfully
                        status:
                          type: string
                          description: >-
                            Represents the overall status of the module creation
                            operation.

                            Possible values:

                            **success** - The module creation completed
                            successfully.
                          enum:
                            - success
                      required:
                        - code
                        - details
                        - message
                        - status
                required:
                  - modules
              examples:
                SuccessfulCreation:
                  summary: Custom module created successfully
                  description: >-
                    Shows the response after successfully creating a custom
                    module, with the new module ID returned in the details
                    object.
                  value:
                    modules:
                      - code: SUCCESS
                        details:
                          id: '111111000000123456'
                        message: module created successfully
                        status: success
        '400':
          description: >-
            The request failed validation.

            **Resolution:** Verify that all required fields are provided with
            valid values. Returned when input data fails validation (invalid
            module properties, duplicate api_name, missing required fields,
            field length exceeded, unsupported operations, or mandatory fields
            not found). All modules in the batch must be valid; no partial
            success occurs.
          content:
            application/json:
              schema:
                x-zs-$id: CreateModulesErrorResponses
                oneOf:
                  - type: object
                    x-zs-$id: ModulesPost400ResponseBatchError
                    description: >-
                      Represents the array of error responses for validation
                      failures.
                    additionalProperties: false
                    properties:
                      modules:
                        type: array
                        description: >-
                          Represents the array of error responses for each
                          module that failed validation
                        maxItems: 1
                        items:
                          oneOf:
                            - type: object
                              x-zs-$id: ModulesPost400ResponseDuplicateData
                              description: >-
                                Represents the error object returned when the
                                module creation request contains a duplicate
                                value for a unique constraint field such as
                                **api_name**, **singular_label**, or
                                **plural_label**.
                              additionalProperties: false
                              properties:
                                code:
                                  type: string
                                  description: >-
                                    Represents the error code returned when the
                                    request contains duplicate data.

                                    Possible values:

                                    **DUPLICATE_DATA** - A duplicate value was
                                    found for **singular_label**,
                                    **plural_label**, or **api_name**.
                                  enum:
                                    - DUPLICATE_DATA
                                details:
                                  type: object
                                  description: >-
                                    Represents the details identifying the field
                                    that caused the duplicate data error,
                                    including its API name and location in the
                                    request.
                                  additionalProperties: false
                                  properties:
                                    api_name:
                                      type: string
                                      maxLength: 50
                                      description: >-
                                        Represents the API name of the field for
                                        which a duplicate value was found.
                                    json_path:
                                      type: string
                                      description: >-
                                        Represents the JSONPath expression
                                        identifying the location of the
                                        duplicate field in the request body.
                                      maxLength: 100
                                  required:
                                    - api_name
                                    - json_path
                                message:
                                  type: string
                                  description: >-
                                    Represents the error message describing the
                                    duplicate data constraint violation.
                                  maxLength: 1000
                                status:
                                  type: string
                                  description: >-
                                    Represents the error status of the response.

                                    Possible values:

                                    **error** - The module creation request
                                    failed due to a duplicate data constraint.
                                  enum:
                                    - error
                              required:
                                - code
                                - details
                                - message
                                - status
                            - type: object
                              x-zs-$id: CreateModulesErrorResponseMandatoryNotFound
                              description: >-
                                Represents the error object returned when a
                                required field is absent from the module
                                creation request.
                              additionalProperties: false
                              properties:
                                code:
                                  type: string
                                  description: >-
                                    Represents the error code returned when a
                                    mandatory field is absent from the request.

                                    Possible values:

                                    **MANDATORY_NOT_FOUND** - A required field
                                    is missing from the request.
                                  enum:
                                    - MANDATORY_NOT_FOUND
                                details:
                                  type: object
                                  description: >-
                                    Represents additional information
                                    identifying the mandatory field that is
                                    missing, including its API name and location
                                    in the request.
                                  additionalProperties: false
                                  properties:
                                    api_name:
                                      type: string
                                      maxLength: 50
                                      description: >-
                                        Represents the API name of the mandatory
                                        field that is missing from the request.
                                    json_path:
                                      type: string
                                      description: >-
                                        Represents the JSONPath expression
                                        identifying the location in the request
                                        where the mandatory field should be
                                        specified.
                                      maxLength: 100
                                  required:
                                    - api_name
                                    - json_path
                                message:
                                  type: string
                                  description: >-
                                    Represents the error message describing the
                                    missing mandatory field.
                                  maxLength: 1000
                                status:
                                  type: string
                                  description: >-
                                    Represents the error status of the response.

                                    Possible values:

                                    **error** - The module creation request
                                    failed due to a missing mandatory field.
                                  enum:
                                    - error
                              required:
                                - code
                                - details
                                - message
                                - status
                            - type: object
                              x-zs-$id: CreateModulesErrorResponsesDependentFieldMissing
                              description: >-
                                Represents the error object returned when a
                                dependent configuration field required by the
                                specified settings is missing from the request.
                              additionalProperties: false
                              properties:
                                code:
                                  type: string
                                  description: >-
                                    Represents the error code returned when a
                                    required dependent field is missing from the
                                    request.

                                    Possible values:

                                    **DEPENDENT_FIELD_MISSING** - A dependent
                                    field required by the specified
                                    configuration is absent.
                                  enum:
                                    - DEPENDENT_FIELD_MISSING
                                details:
                                  type: object
                                  description: >-
                                    Represents additional information
                                    identifying the dependent field that is
                                    missing, including its API name and location
                                    in the request.
                                  additionalProperties: false
                                  properties:
                                    api_name:
                                      type: string
                                      maxLength: 50
                                      description: >-
                                        Represents the API name of the dependent
                                        field that is missing from the request.
                                    json_path:
                                      type: string
                                      description: >-
                                        Represents the JSONPath expression
                                        identifying the location in the request
                                        where the dependent field should be
                                        specified.
                                      maxLength: 100
                                  required:
