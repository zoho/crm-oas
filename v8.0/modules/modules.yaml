          value: forecasts
          summary: Retrieve modules for forecasts feature
    Include:
      name: include
      in: query
      required: false
      description: >-
        Specify the additional module metadata fields to include in the
        response. Accepts comma-separated values. Allows retrieving optional
        module metadata that is not returned by default.
      schema:
        type: string
        maxLength: 3000
        pattern: >-
          ^(custom_view|related_lists|business_card_fields|layouts|fields)(,(custom_view|related_lists|business_card_fields|layouts|fields))*$
      examples:
        CustomView:
          value: custom_view
          summary: Include custom view metadata
        RelatedLists:
          value: related_lists
          summary: Include related lists configuration
        BusinessCardFields:
          value: business_card_fields
          summary: Include business card fields
        Layouts:
          value: layouts
          summary: Include layout configurations
        Fields:
          value: fields
          summary: Include field metadata
        Multiple:
          value: custom_view,related_lists,business_card_fields,layouts,fields
          summary: Include multiple optional fields
    IncludeInnerDetails:
      name: include_inner_details
      in: query
      required: false
      description: >-
        Specify the nested field paths to include additional inner details in
        the module response. Accepts comma-separated values. Allows requesting
        extra metadata beyond the default module fields(for example
        fields.lookup.query_details.criteria.)
      style: form
      explode: false
      schema:
        type: string
        maxLength: 512
      examples:
        FieldsLookupQueryDetailsCriteria:
          summary: Include query_details.criteria within lookup details
          value: fields.lookup.query_details.criteria
    ParamQueryFields:
      name: fields
      in: query
      description: >-
        Specify the module property names to include in the response. Accepts an
        array of property names to filter the returned module fields.
      required: false
      style: form
      explode: false
      schema:
        type: array
        maxItems: 100
        items:
          type: string
          maxLength: 255
          description: Specifies the properties to include in the response
    ParamPathModuleid:
      name: moduleid
      in: path
      description: >-
        Specify the API name of the module for which the web tab link has to be
        generated. This is case-sensitive Case-sensitive and should start with a
        letter and contain only alphanumeric characters and underscores.
      required: true
      schema:
        type: string
        maxLength: 50
        pattern: ^[A-Za-z][A-Za-z0-9_]*[A-Za-z0-9]$
      examples:
        Leads:
          summary: Leads module API name
          value: Leads
        CustomModule:
          summary: Custom module API name
          value: Custom_Module_1
  schemas:
    ModuleWebTabLink:
      type: object
      additionalProperties: false
      description: >-
        Represents a web tab link associated with a CRM module, including the
        tab identifier (id, int64), display name(name), and configured
        URL(web_link).
      properties:
        name:
          type: string
          description: Represents the display name of the web tab.
          maxLength: 50
          minLength: 3
        id:
          type: string
          format: int64
          description: Represents the unique ID of the web tab.
          maxLength: 20
          minLength: 18
          pattern: \d+
        web_link:
          type: string
          description: Represents the URL configured for the web tab.
          maxLength: 1000
      required:
        - id
        - name
        - web_link
      title: Module Web Tab Link
    ModuleWebTabLinkResponse:
      type: object
      additionalProperties: false
      description: >-
        Represents the response containing the generated web tab link for a CRM
        module, with the link details available in the generate_link property.
      properties:
        generate_link:
          $ref: '#/components/schemas/ModuleWebTabLink'
      required:
        - generate_link
      title: Module Web Tab Link Response
      x-zs-$id: ModuleWebTabLinkResponse
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://accounts.zoho.com/oauth/v2/auth
          tokenUrl: https://accounts.zoho.com/oauth/v2/token
          refreshUrl: https://accounts.zoho.com/oauth/v2/token
          scopes:
            ZohoCRM.settings.modules.ALL: >-
              Grants full access to create, retrieve, update, and delete module
              settings in Zoho CRM.
            ZohoCRM.settings.modules.DELETE: >-
              Grants permission to delete module settings and configurations in
              Zoho CRM.
            ZohoCRM.settings.modules.READ: >-
              Grants permission to retrieve and view module settings and
              configurations in Zoho CRM.
            ZohoCRM.settings.modules.UPDATE: >-
              Grants permission to update module settings and configurations in
              Zoho CRM.
            ZohoCRM.settings.modules.CREATE: >-
              Grants permission to create module settings and configurations in
              Zoho CRM.
