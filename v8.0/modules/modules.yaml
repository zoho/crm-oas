                                  minLength: 1
                                  maxLength: 100
                              required:
                                - api_name
                                - json_path
                            message:
                              type: string
                              description: >-
                                Explanation of the immutable field violation
                                that caused the module entry to fail.
                              minLength: 1
                              maxLength: 1000
                            status:
                              type: string
                              description: >-
                                Fixed value `error`, indicating the update
                                failed because a disallowed field modification
                                was attempted.
                              enum:
                                - error
                          required:
                            - code
                            - details
                            - message
                            - status
                        - type: object
                          x-zs-$id: ModulesPutResponseMandatoryNotFound400
                          description: >-
                            Returned when a module update failed because a
                            mandatory field was absent from the request.
                          additionalProperties: false
                          properties:
                            code:
                              type: string
                              description: >-
                                Fixed value `MANDATORY_NOT_FOUND`, indicating
                                the update failed because a required field was
                                not provided in the request.
                              enum:
                                - MANDATORY_NOT_FOUND
                            details:
                              type: object
                              description: >-
                                Details identifying the required field that was
                                absent from the request, by API name and
                                JSONPath.
                              additionalProperties: false
                              properties:
                                api_name:
                                  type: string
                                  description: >-
                                    API name of the required field that was not
                                    provided.
                                  minLength: 1
                                  maxLength: 50
                                json_path:
                                  type: string
                                  description: >-
                                    JSONPath location in the request body where
                                    the missing mandatory field was expected.
                                  minLength: 1
                                  maxLength: 100
                              required:
                                - api_name
                                - json_path
                            message:
                              type: string
                              description: >-
                                Explanation of the mandatory field that was
                                missing from the request, causing the module
                                update to fail.
                              minLength: 1
                              maxLength: 1000
                            status:
                              type: string
                              description: >-
                                Fixed value `error`, indicating the update
                                failed because a mandatory field was not
                                provided.
                              enum:
                                - error
                          required:
                            - code
                            - details
                            - message
                            - status
                        - type: object
                          x-zs-$id: ModulesPutResponseDependentFieldMissing
                          description: >-
                            Returned when a module update failed because a field
                            required by the presence of another field was absent
                            from the request.
                          additionalProperties: false
                          properties:
                            code:
                              type: string
                              description: >-
                                Fixed value `DEPENDENT_FIELD_MISSING`,
                                indicating a field required by the presence of
                                another field was absent from the request.
                              enum:
                                - DEPENDENT_FIELD_MISSING
                            details:
                              type: object
                              description: >-
                                Details identifying both the missing dependent
                                field relationship.
                              additionalProperties: false
                              properties:
                                api_name:
                                  type: string
                                  description: >-
                                    API name of the dependent field that was
                                    absent from the request.
                                  minLength: 1
                                  maxLength: 50
                                json_path:
                                  type: string
                                  description: >-
                                    JSONPath location in the request where the
                                    dependent field was expected.
                                  minLength: 1
                                  maxLength: 100
                                dependee:
                                  type: object
                                  description: >-
                                    The field that requires the dependent field
                                    to be present
                                  additionalProperties: false
                                  properties:
                                    api_name:
                                      type: string
                                      description: >-
                                        API name of the field that requires the
                                        dependent field.
                                      maxLength: 50
                                      minLength: 1
                                    json_path:
                                      type: string
                                      description: >-
                                        JSONPath location of the field that
                                        requires the dependent field.
                                      minLength: 1
                                      maxLength: 100
                                  required:
                                    - api_name
                                    - json_path
                              required:
                                - api_name
                                - json_path
                                - dependee
                            message:
                              type: string
                              description: >-
                                Explanation of the dependent field relationship
                                that was violated, identifying which field was
                                missing and which field required its presence.
                              minLength: 1
                              maxLength: 1000
                            status:
                              type: string
                              description: >-
                                Fixed value `error`, indicating the module
                                update failed due to a missing dependent field.
                              enum:
                                - error
                          required:
                            - code
                            - details
                            - message
                            - status
                        - type: object
                          x-zs-$id: ModulesPutResponseApiNotSupported
                          description: >-
                            Returned when a module update failed because the
                            request used an API version below the minimum
                            required version.
                          additionalProperties: false
                          properties:
                            code:
                              type: string
                              description: >-
                                Fixed value `API_NOT_SUPPORTED`, indicating the
                                request used an API version below the minimum
                                required for this operation.
                              enum:
                                - API_NOT_SUPPORTED
                            details:
                              type: object
                              description: >-
                                Object indicating the minimum supported API
                                version for this operation.
                              additionalProperties: false
                              properties:
                                supported_version:
                                  type: integer
                                  description: >-
                                    Minimum API version number required to
                                    perform this operation.
                                  format: int32
                                  minimum: 1
                              required:
                                - supported_version
                            message:
                              type: string
                              description: >-
                                Explanation of the API version requirement that
                                the request failed to meet, including the
                                minimum supported version.
                              minLength: 1
                              maxLength: 1000
                            status:
                              type: string
                              description: >-
                                Fixed value `error`, indicating the module
                                update failed because the API version is not
                                supported.
                              enum:
                                - error
                          required:
                            - code
                            - details
                            - message
                            - status
                      description: Represents a single per-module error result.
                required:
                  - modules
              examples:
                InvalidModuleId:
                  summary: Module ID does not exist
                  description: >-
                    400 error response when the request references a module ID
                    that does not exist in the CRM.
                  value:
                    modules:
                      - code: INVALID_DATA
                        details:
                          api_name: id
                          json_path: $.modules[0].id
                        message: the module id given seems to be invalid
                        status: error
                MissingRequiredId:
                  summary: Required module ID is missing
                  description: >-
                    400 error response when a module object in the request does
                    not include the required `id` field.
                  value:
                    modules:
                      - code: MANDATORY_NOT_FOUND
                        details:
                          api_name: id
                          json_path: $.modules[0].id
                        message: required data not found
                        status: error
                LabelLengthExceeded:
                  summary: Module label exceeds maximum length
                  description: >-
                    400 error response when a module label value exceeds the
                    maximum allowed character length of 50.
                  value:
                    modules:
                      - code: INVALID_DATA
                        details:
                          maximum_length: 50
                          api_name: singular_label
                          json_path: $.modules[0].singular_label
                        message: invalid data
                        status: error
                InvalidProfileId:
                  summary: Profile ID does not exist
                  description: >-
                    400 error response when the request includes a profile ID
                    that does not exist or is invalid.
                  value:
                    modules:
                      - code: INVALID_DATA
                        details:
                          api_name: id
                          json_path: $.modules[0].profiles[0].id
                        message: Invalid profile id passed
                        status: error
                ModuleRenameNotAllowed:
                  summary: Module rename not allowed
                  description: >-
                    400 error response when the request attempts to rename a
                    module that does not support label changes.
                  value:
                    modules:
                      - code: INVALID_DATA
                        details:
                          api_name: id
                          json_path: $.modules[0].id
                        message: Module rename not allowed
                        status: error
                AccessTypeUpdateNotAllowed:
                  summary: Attempt to update access_type rejected
                  description: >-
                    400 error when attempting to update access_type in PUT
                    request. access_type is immutable after module creation and
                    cannot be changed.
                  value:
                    modules:
                      - code: NOT_ALLOWED
                        details:
                          api_name: access_type
                          json_path: $.modules[0].access_type
                        message: access type update not allowed
                        status: error
                TeamModuleProfileUpdateNotAllowed:
                  summary: Profile update not allowed for team-based module
                  description: >-
                    400 error response when the request attempts to update
                    profiles on a team-based module, which does not support
                    profile assignments.
                  value:
                    modules:
                      - code: NOT_ALLOWED
                        details:
                          api_name: profiles
                          json_path: $.modules[0].profiles
                        message: profile update for team module is not allowed
                        status: error
  /settings/modules/{moduleIdentifier}:
    get:
      summary: Get module metadata by API name
      description: >-
        Retrieves complete metadata for a specific CRM module identified by its
        API name, including fields, layouts, profiles, related lists, and
        feature capabilities. Returns 204 when the module is not available
        through this endpoint, or 400 when the identifier is invalid or the
        module is unsupported
      security:
        - OAuth2:
            - ZohoCRM.settings.modules.READ
      operationId: getModuleByApiName
      parameters:
        - $ref: '#/components/parameters/ModuleIdentifier'
        - $ref: '#/components/parameters/ParamQueryFields'
        - $ref: '#/components/parameters/IncludeInnerDetails'
      responses:
        '200':
          description: >-
            200 OK - Module metadata retrieved successfully; returns the full
            configuration object for the requested CRM module
          content:
            application/json:
              schema:
                type: object
                x-zs-$id: GetModuleByApiNameSuccessResponse
                description: >-
                  Complete configuration metadata for a single CRM module,
                  including its fields, layouts, profiles, related lists, and
                  supported capabilities
                additionalProperties: false
                properties:
                  modules:
                    type: array
                    maxItems: 1
                    description: >-
                      Array of module metadata objects returned for the
                      specified API name. Contains at most one element, as each
                      API name maps to a single module.
                    items:
                      type: object
                      description: >-
                        Complete metadata for a CRM module including
                        configuration, capabilities, fields, layouts, profiles,
                        and related lists.
                      additionalProperties: false
                      properties:
                        global_search_supported:
                          type: boolean
                          description: >-
                            True when records in this module appear in global
                            search results; false when the module is excluded
                            from global search.
                        public_fields_configured:
                          type: boolean
                          description: >-
                            True when public fields have been configured for
                            this module.
                        recycle_bin_on_delete:
                          type: boolean
                          description: >-
                            True when deleted records are moved to the recycle
                            bin instead of being permanently deleted.
                        has_more_profiles:
                          type: boolean
                          description: >-
                            True when the profiles array is truncated and
                            additional profiles exist beyond those returned
                            (pagination indicator); false when the full profile
                            list is included.
                        sub_menu_available:
                          type: boolean
                          description: >-
                            True when a submenu is available for this module in
                            the UI navigation
                        lookupable:
                          type: boolean
                          description: >-
                            True when this module can be targeted as a lookup
                            field by other modules.
                        profile_count:
                          type: integer
                          format: int32
                          description: >-
                            Count of profiles assigned to this module; 0
                            indicates no profile assignments are configured.
                            Maximum 203 profiles per module.
                        module_type:
                          type: string
                          enum:
                            - CONFIGURATION_ENTITIES
                            - ENTITIES
                          description: >-
                            Categorizes the module as ENTITIES for standard data
                            modules or CONFIGURATION_ENTITIES for configuration
                            and settings modules.
                        cc_enabled:
                          type: boolean
                          description: >-
                            True when CommandCenter (workflow orchestration) is
                            enabled for this module; false when not configured
                            or unsupported.
                        deletable:
                          type: boolean
                          description: >-
                            True when records in this module can be permanently
                            deleted; false for protected modules such as
                            configuration entities or system-managed records.
                        description:
                          type:
                            - string
                            - 'null'
                          maxLength: 255
                          description: >-
                            User-defined description of the module. Null when no
                            description has been set. Maximum 255 characters;
                            empty string should not be used.
                        source:
                          type: string
                          enum:
                            - crm
                            - platform_plugin
                            - marketplace_plugin
                            - campaign_integration
                          description: >-
                            Origin of the module configuration. Possible values:
                            crm - native CRM module; platform_plugin - module
                            from a platform plugin; marketplace_plugin - module
                            from a marketplace plugin; campaign_integration -
                            module created via campaign integration
                        creatable:
                          type: boolean
                          description: >-
                            True when new records can be created in this module;
                            false for read-only modules such as analytics or
                            configuration entities.
                        inventory_template_supported:
                          type: boolean
                          description: >-
                            True when inventory templates (e.g., for quotes,
                            invoices) can be configured for this module; false
                            when not supported.
                        modified_time:
                          type:
                            - string
                            - 'null'
                          format: date-time
                          description: >-
                            ISO 8601 timestamp with timezone offset recording
                            when the module configuration was last modified.
                            Null when the module has never been modified after
                            creation.
                        presence_sub_menu:
                          type: boolean
                          description: >-
                            True when the presence submenu is available for this
                            module.
                        triggers_supported:
                          type: boolean
                          description: >-
                            True when workflow triggers are supported for this
                            module
                        id:
                          x-zs-$ref:
                            resource: modules
                            origins:
                              - operationId: getModules
                                propertyId: ModulesId
                          description: >-
                            Unique numeric identifier (as string) for this
                            module. Required field; used as the stable reference
                            across all API operations.
                          type: string
                          format: int64
                        api_name:
                          description: >-
                            Case-sensitive API name used to reference this
                            module in API requests (e.g., 'Leads', 'Contacts',
                            'CustomModule1').
                          x-zs-$ref:
                            resource: modules
                            origins:
                              - operationId: getModules
                                propertyId: ModulesApiName
                          type: string
                          maxLength: 50
                        plural_label:
                          type: string
                          maxLength: 50
                          description: >-
                            Localized plural display label for the module as
                            shown in the UI, reflecting the active language
                            setting. Maximum 50 characters.
                        actual_plural_label:
                          type: string
                          maxLength: 50
                          description: >-
                            System-level plural label for the module as stored
                            in the database, representing the untranslated base
                            value. Maximum 50 characters.
                        actual_singular_label:
                          type: string
                          maxLength: 50
                          description: >-
                            System-level singular label for the module as stored
                            in the database, representing the untranslated base
                            value. Maximum 50 characters.
                        singular_label:
                          type: string
                          maxLength: 50
                          description: >-
                            Localized singular display label for the module, up
                            to 50 characters
                        isBlueprintSupported:
                          type: boolean
                          description: >-
                            True when Blueprint process automation can be
                            configured for this module; false when Blueprint is
                            not available for this module type.
                        visibility:
                          type: integer
                          format: int32
                          minimum: 1
                          maximum: 16383
                          description: >-
                            Bitwise integer flags controlling module and feature
                            visibility, ranging from 1 to 16383. Base value 1
                            means fully visible. Add flag values to suppress
                            specific UI surfaces: 2=web UI hidden, 4=tab menu,
                            8=lookup, 16=related list, 32=multi-select lookup,
                            64=module settings, 128=automation, 256=templates,
                            512=import, 1024=export, 4096=reports, 8192=API. 
                          examples:
                            - 1
                            - 2
                            - 4612
                            - 14316
                        convertable:
                          type: boolean
                          description: >-
                            True when records in this module can be converted to
                            records in another module (e.g., Leads to
                            Contacts/Accounts).
                        editable:
                          type: boolean
                          description: >-
                            True when existing records in this module can be
                            edited by users with appropriate permissions; false
                            for read-only modules.
                        emailTemplate_support:
                          type: boolean
                          description: >-
                            True when email templates can be used to send emails
                            from records in this module; false when email
                            template functionality is not supported.
                        email_parser_supported:
                          type: boolean
                          description: >-
                            True when email parsing is supported for this
                            module, enabling automatic record creation or
                            updates from inbound emails.
                        filter_supported:
                          type: boolean
                          description: >-
                            True when this module supports custom view
                            filtering; false for modules that do not allow
                            filter configuration.
                        show_as_tab:
                          type: boolean
                          description: >-
                            True when this module is rendered as a tab in the
                            navigation UI
                        web_link:
                          type:
                            - string
                            - 'null'
                          description: >-
                            URL associated with this module; null when no web
                            link is configured
                        viewable:
                          type: boolean
                          description: >-
                            True when records in this module can be viewed by
                            the current user
                        api_supported:
                          type: boolean
                          description: >-
                            True when the module is accessible via the Zoho CRM
                            API; false for modules that are not externally
                            queryable through API endpoints.
                        quick_create:
                          type: boolean
                          description: >-
                            True when quick create functionality is enabled for
                            this module.
                        generated_type:
                          type: string
                          enum:
                            - field_tracker
                            - default
                            - web
                            - linking
                            - custom
                            - picklisttracker
                            - subform
                            - static_subform
                          description: >-
                            Classification of how this module was generated.
                            Possible values: default - standard system module;
                            custom - user-created module; web - web tab module;
                            linking - many-to-many linking module; subform -
                            dynamic subform module; static_subform - static
                            subform; field_tracker - field change tracker;
                            picklisttracker - picklist change tracker.
                        static_subform_properties:
                          type: object
                          description: >-
                            Static subform configuration properties defined for
                            fields within this module
                          additionalProperties: false
                          properties:
                            fields:
                              type: array
                              maxItems: 1000
                              description: >-
                                Field references included in the static subform,
                                up to 1000 items
                              items:
                                type: object
                                description: Field reference with API name and ID
                                additionalProperties: false
                                properties:
                                  api_name:
                                    type: string
                                    maxLength: 50
                                    description: >-
                                      API name of the static subform field, up
                                      to 50 characters
                                  id:
                                    type: string
                                    format: int64
