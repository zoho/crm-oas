                    organization.
                  value:
                    code: DUPLICATE_DATA
                    details:
                      api_name: singular_label
                      json_path: $.modules[0].singular_label
                    message: >-
                      A module with this singular label already exists. Please
                      use a unique singular_label.
                    status: error
                LimitExceeded:
                  summary: Module creation limit has been reached
                  description: >-
                    Returned when the organization has reached the maximum
