                                failed due to duplicate data being submitted
                              enum:
                                - error
                          required:
                            - code
                            - details
                            - message
                            - status
                    required:
                      - modules
                  - type: object
                    x-zs-$id: ModulesPutResponseNotAllowedError
                    description: >-
                      NOT_ALLOWED error returned when the request attempts to
                      update a field that is immutable or write-restricted, such
                      as access_type or api_name
                    additionalProperties: false
                    properties:
                      modules:
                        type: array
                        description: >-
                          Array of error objects, each describing a module field
                          that was rejected because the update is not permitted
                        minItems: 1
                        maxItems: 1
                        items:
                          type: object
                          description: >-
                            Error object identifying a field whose update was
                            rejected because it is restricted. Contains the
                            error code, the restricted field details, a message,
                            and a status indicator.
                          additionalProperties: false
                          properties:
                            code:
                              type: string
                              description: >-
                                Always "NOT_ALLOWED". Indicates that the
                                specified field cannot be updated because it is
                                immutable or write-restricted
                              enum:
                                - NOT_ALLOWED
                            details:
                              type: object
                              description: >-
                                Identifies the restricted field by its API name
                                and its JSONPath location in the request body
                              additionalProperties: false
                              properties:
                                api_name:
                                  type: string
                                  maxLength: 50
                                  description: >-
                                    API name of the restricted field that cannot
                                    be updated. Maximum 50 characters
                                  example: api_name
                                json_path:
                                  type: string
                                  maxLength: 100
                                  description: >-
                                    JSONPath expression identifying the location
                                    of the restricted field in the request body.
                                    Maximum 100 characters
                                  example: $.modules[0].api_name
                              required:
                                - api_name
                                - json_path
                            message:
                              type: string
                              maxLength: 1000
                              description: Explains why the field update was rejected.
                              example: Api name update not allowed
                            status:
                              type: string
                              description: >-
                                Always "error". Indicates the request failed
                                because a restricted field was included in the
                                update
                              enum:
                                - error
                          required:
                            - code
                            - details
                            - message
                            - status
                    required:
                      - modules
                  - type: object
                    x-zs-$id: ModulesPutResponseMinimumDataNotFoundError
                    description: >-
                      MINIMUM_DATA_NOT_FOUND error returned when a field value
                      is present but does not satisfy the minimum data
                      requirement for that field
                    additionalProperties: false
                    properties:
                      modules:
                        type: array
                        description: >-
                          Array of error objects, each describing a module field
                          whose submitted value does not satisfy minimum data
                          requirements
                        minItems: 1
                        maxItems: 1
                        items:
                          type: object
                          description: >-
                            Error object returned when a field is present in the
                            request but its value does not satisfy minimum data
                            requirements. Contains the error code, a details
                            block with the field location, a message, and a
                            status indicator.
                          additionalProperties: false
                          properties:
                            code:
                              type: string
                              description: >-
                                Always "MINIMUM_DATA_NOT_FOUND". Indicates that
                                a field is present but its value does not meet
                                the minimum data requirement
                              enum:
                                - MINIMUM_DATA_NOT_FOUND
                            details:
                              type: object
                              description: >-
                                Identifies the field that failed minimum data
                                validation by its API name and its JSONPath
                                location in the request body
                              additionalProperties: false
                              properties:
                                api_name:
                                  type: string
                                  maxLength: 50
                                  description: >-
                                    API name of the field that failed the
                                    minimum data requirement. Maximum 50
                                    characters
                                  example: profiles
                                json_path:
                                  type: string
                                  maxLength: 100
                                  description: >-
                                    JSONPath expression identifying the location
                                    of the field in the request body. Maximum
                                    100 characters
                                  example: $.modules[0].profiles
                              required:
                                - api_name
                                - json_path
                            message:
                              type: string
                              maxLength: 1000
                              description: >-
                                Explains the minimum data requirement that was
                                not satisfied for this field.
                              example: At least one profile needed
                            status:
                              type: string
                              description: >-
                                Always "error". Indicates the request failed
                                because a field does not meet the minimum data
                                requirement
                              enum:
                                - error
                          required:
                            - code
                            - details
                            - message
                            - status
                    required:
                      - modules
                description: >-
                  Contains the error response for a failed module update
                  request.
              examples:
                InvalidModuleApiName:
                  summary: Invalid Module Identifier
                  description: >-
                    INVALID_MODULE error returned when the {moduleIdentifier}
                    path parameter does not match any existing module API name
                  value:
                    code: INVALID_MODULE
                    details:
                      resource_path_index: 2
                    message: the module name given seems to be invalid
                    status: error
                LabelTooLong:
                  summary: Label exceeds maximum length
                  description: >-
                    INVALID_DATA error returned when a module label exceeds 50
                    characters, with maximum_length included in the error
                    details
                  value:
                    modules:
                      - code: INVALID_DATA
                        details:
                          maximum_length: 50
                          api_name: singular_label
                          json_path: $.modules[0].singular_label
                        message: invalid data
                        status: error
                LabelSpecialCharacters:
                  summary: Label contains special characters
                  description: >-
                    INVALID_DATA error returned when a module label includes
                    special characters; only alphanumeric characters and spaces
                    are permitted
                  value:
                    modules:
                      - code: INVALID_DATA
                        details:
                          api_name: singular_label
                          json_path: $.modules[0].singular_label
                        message: Special characters in module singular name
                        status: error
                InvalidDataType:
                  summary: Incorrect Field Data Type
                  description: >-
                    INVALID_DATA error returned when a field value has an
                    incorrect data type.
                  value:
                    modules:
                      - code: INVALID_DATA
                        details:
                          expected_data_type: jsonobject
                          api_name: _delete
                          json_path: $.modules.profiles[0]._delete
                        message: _delete is not an valid datatype
                        status: error
                ApiVersionNotSupported:
                  summary: API Version is not Supported
                  description: >-
                    API_NOT_SUPPORTED error is returned when the caller uses an
                    API version lower than the minimum version required for this
                    endpoint
                  value:
                    code: API_NOT_SUPPORTED
                    details:
                      supported_version: 2
                    message: api version is not supported
                    status: error
                MissingProfiles:
                  summary: Profiles field is missing or not provided
                  description: >-
                    MANDATORY_NOT_FOUND error returned when the required
                    profiles field is absent entirely from the request body
                  value:
                    modules:
                      - code: MANDATORY_NOT_FOUND
                        details:
                          api_name: profiles
                          json_path: $.modules[0].profiles
                        message: required field not found
                        status: error
                MissingPluralLabel:
                  summary: Plural Label Field Missing
                  description: >-
                    MANDATORY_NOT_FOUND error returned when the required
                    plural_label field is absent from the request body
                  value:
                    modules:
                      - code: MANDATORY_NOT_FOUND
                        details:
                          api_name: plural_label
                          json_path: $.modules[0].plural_label
                        message: required field not found
                        status: error
                MissingSingularLabel:
                  summary: Singular Label Field Missing
                  description: >-
                    MANDATORY_NOT_FOUND error returned when the required
                    singular_label field is absent from the request body
                  value:
                    modules:
                      - code: MANDATORY_NOT_FOUND
                        details:
                          api_name: singular_label
                          json_path: $.modules[0].singular_label
                        message: required field not found
                        status: error
                DuplicateSingularLabel:
                  summary: Duplicate Singular Label Conflict
                  description: >-
                    DUPLICATE_DATA error returned when the submitted
                    singular_label value is already in use by another module,
                    preventing the update
                  value:
                    modules:
                      - code: DUPLICATE_DATA
                        details:
                          api_name: singular_label
                          json_path: $.modules[0].singular_label
                        message: Module singular name duplicate
                        status: error
                DuplicatePluralLabel:
                  summary: Duplicate Plural Label Conflict
                  description: >-
                    DUPLICATE_DATA error is returned when the submitted
                    plural_label value is already in use by another module
                  value:
                    modules:
                      - code: DUPLICATE_DATA
                        details:
                          api_name: plural_label
                          json_path: $.modules[0].plural_label
                        message: Module plural name duplicate
                        status: error
                ApiNameUpdateNotAllowed:
                  summary: Api Name Update is Blocked
                  description: >-
                    NOT_ALLOWED error returned when the request body includes
                    api_name, which is an immutable field and cannot be modified
                    after creation
                  value:
                    modules:
                      - code: NOT_ALLOWED
                        details:
                          api_name: api_name
                          json_path: $.modules[0].api_name
                        message: Api name update not allowed
                        status: error
                MinimumProfilesNotFound:
                  summary: Profiles minimum requirement is not met
                  description: >-
                    MINIMUM_DATA_NOT_FOUND error returned when the profiles
                    array is provided but contains no valid entries, violating
                    the requirement that at least one profile must be assigned
                  value:
                    modules:
                      - code: MINIMUM_DATA_NOT_FOUND
                        details:
                          api_name: profiles
                          json_path: $.modules[0].profiles
                        message: At least one profile needed
                        status: error
                AccessTypeUpdateNotAllowed:
                  summary: Access Type Update is Blocked
                  description: >-
                    NOT_ALLOWED error returned when the request body includes
                    access_type, which is immutable and cannot be changed after
                    module creation
                  value:
                    modules:
                      - code: NOT_ALLOWED
                        details:
                          api_name: access_type
                          json_path: $.modules[0].access_type
                        message: access type update not allowed
                        status: error
                TeamModuleProfileUpdateNotAllowed:
                  summary: Team Module Profile Update Blocked
                  description: >-
                    NOT_ALLOWED error returned when the request attempts to
                    update profile assignments for a team-based module, which
                    does not support profile-based access control
                  value:
                    modules:
                      - code: NOT_ALLOWED
                        details:
                          api_name: profiles
                          json_path: $.modules[0].profiles
                        message: profile update for team module is not allowed
                        status: error
  /settings/module/{moduleid}/actions/generate_link:
    get:
      summary: Generate web-tab link for a module
      description: >-
        To generate the configured web-tab link for a specific module in your
        Zoho CRM organization. The moduleid path parameter must be the module's
        API name (e.g., Leads, Contacts, Custom_Module_1).
      operationId: getGenerateLink
      parameters:
        - $ref: '#/components/parameters/ParamPathModuleid'
      responses:
        '200':
          description: Returns the generated web-tab link for the specified module.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModuleWebTabLinkResponse'
              examples:
                Success200:
                  summary: Successful generation of web-tab link for a module
                  value:
                    generate_link:
                      name: WebTab1
                      id: '111111000000066002'
                      web_link: https://www.wikipedia.org/
        '400':
          description: >-
            The module name given seems to be invalid.

            **Resolution:** The module API name in the request path must match
            the API name of an existing module.
          content:
            application/json:
              schema:
                type: object
                x-zs-$id: GetGenerateLinkResponse400
                description: >-
                  Represents the error response returned when the provided
                  module API name is invalid.
                additionalProperties: false
                properties:
                  code:
                    type: string
                    description: Represents the error code returned for the request.
                    enum:
                      - INVALID_DATA
                  details:
                    type: object
                    description: >-
                      Represents additional context about the cause of the
                      error.
                    additionalProperties: false
                    properties:
                      param_name:
                        type: string
                        description: >-
                          Represents the name of the invalid parameter in the
                          request.
                        enum:
                          - module
                    required:
                      - param_name
                  message:
                    type: string
                    description: >-
                      Represents the error message describing the issue with the
                      request.
                    enum:
                      - the module name given seems to be invalid
                  status:
                    type: string
                    description: Represents the status of the response.
                    enum:
                      - error
                required:
                  - code
                  - details
                  - message
                  - status
              examples:
                InvalidModuleName:
                  summary: Invalid module name provided in path parameter
                  description: >-
                    Shows a 400 INVALID_DATA response returned when the module
                    API name provided in the path does not match any existing
                    module.
                  value:
                    code: INVALID_DATA
                    details:
                      param_name: module
                    message: the module name given seems to be invalid
                    status: error
      security:
        - OAuth2:
            - ZohoCRM.settings.modules.READ
components:
  parameters:
    ModuleIdentifier:
      name: moduleIdentifier
      in: path
      required: true
      description: >-
        Specify the module identifier, either the numeric module ID or the
        module API name(case-sensitive).
      schema:
        oneOf:
          - type: string
            format: int64
            description: >-
              Unique numeric identifier. Numeric string representation of a
              64-bit positive integer.
            x-zs-$id: ModuleIdentifierId
          - type: string
            description: >-
              API name of the module to retrieve. Case-sensitive identifier
              following specific naming rules: must start with a letter, contain
              only alphanumeric characters and underscores, cannot have
              consecutive underscores, and must end with alphanumeric character.
            x-zs-$id: ModuleIdentifierAPIName
            maxLength: 50
            pattern: ^[A-Za-z][A-Za-z0-9_]*[A-Za-z0-9]$
    Status:
      name: status
      in: query
      required: false
      description: >-
        Specify the visibility status to filter the modules returned in the
        response. Accepts comma-separated values to retrieve modules matching
        any of the specified statuses. This is case-sensitive.
      schema:
        type: string
        pattern: >-
          ^(visible|scheduled_for_deletion|user_hidden|system_hidden)(,(visible|scheduled_for_deletion|user_hidden|system_hidden))*$
        maxLength: 56
      examples:
        Single:
          value: system_hidden
          summary: Retrieve only system hidden modules
        Multiple:
          value: visible,user_hidden
          summary: Retrieve visible and user hidden modules
    FeatureName:
      name: feature_name
      in: query
      required: false
