                    modules:
                      - code: RESERVED_KEYWORD_NOT_ALLOWED
                        details:
                          api_name: api_name
                          json_path: $.modules[0].api_name
                        message: >-
                          The api_name contains a reserved system keyword.
                          Please choose a different name.
