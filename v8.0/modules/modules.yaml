                          additionalProperties: false
                          properties:
                            code:
                              type: string
                              description: >-
                                Fixed value `NOT_ALLOWED`, indicating the update
                                failed because the request attempted to modify a
                                field that cannot be changed.
                              enum:
                                - NOT_ALLOWED
                            details:
                              type: object
                              description: >-
                                Details identifying the restricted field that
                                was included in the request, by API name and
                                JSONPath.
                              additionalProperties: false
                              properties:
                                api_name:
                                  type: string
                                  description: >-
                                    API name of the field whose update is not
