    put:
      summary: Update Module Labels and Profiles
      description: >-
        Updates the singular label, plural label, and profile assignments for
        the module identified by {moduleIdentifier}. Immutable fields such as
        access_type and api_name cannot be changed; attempting to include them
        returns a NOT_ALLOWED error
      security:
        - OAuth2:
            - ZohoCRM.settings.modules.UPDATE
      operationId: updateModuleByApiName
      parameters:
        - $ref: '#/components/parameters/ModuleIdentifier'
      requestBody:
        description: >-
          Payload for updating a module. Provide the module ID, updated singular
          and plural labels, and the list of profiles that should have access.
          access_type is not accepted in this request.
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              description: >-
                Request body schema for updating a module. Contains a
                single-element modules array with the module ID, updated labels,
                and profile assignments
              properties:
                modules:
                  type: array
                  description: >-
                    Single-element array containing the module object with the
                    labels and profile assignments to update. Exactly one item
                    is required.
                  minItems: 1
                  maxItems: 1
                  items:
                    type: object
                    additionalProperties: false
                    description: >-
                      Module object specifying the updated singular label,
                      plural label, identifier, and profile assignments.
                    properties:
                      singular_label:
                        type: string
                        minLength: 1
                        maxLength: 50
                        pattern: ^[A-Za-z0-9 ]+$
                        description: >-
                          Singular display label for the module. Accepts 1–50
                          alphanumeric characters and spaces; special characters
                          are not permitted.
                        example: Custom Module
                      plural_label:
                        type: string
                        minLength: 1
                        maxLength: 50
                        pattern: ^[A-Za-z0-9 ]+$
                        description: >-
                          Plural display label for the module. Accepts 1–50
                          alphanumeric characters and spaces; special characters
                          are not permitted.
                        example: Custom Modules
                      id:
                        description: >-
                          Unique numeric identifier of the module to update.
                          Must match an existing module. Represented as a
                          numeric string encoding a 64-bit positive integer
                          (Java long/DB bigint).
                        x-zs-$ref:
                          resource: modules
                          origins:
                            - operationId: getModules
                              propertyId: ModulesId
                        type: string
                        format: int64
                      profiles:
                        type: array
                        description: >-
                          Non-empty list of unique profiles that should have
                          access to this module. Accepts 1–203 unique profile
                          objects; order is not significant. This cannot be
                          empty.
                        minItems: 1
                        maxItems: 203
                        uniqueItems: true
                        items:
                          type: object
                          additionalProperties: false
                          description: >-
                            Profile object specifying a single profile to grant
                            access to the module. Contains the profile numeric
                            identifier.
                          properties:
                            id:
                              type: string
                              format: int64
                              description: >-
                                Unique numeric identifier of the profile.
                                Represented as a numeric string encoding a
                                64-bit positive integer.
                              example: '111111000000000497'
                              x-zs-$ref:
                                resource: profiles
                                origins:
                                  - operationId: getProfiles
                                    propertyId: ProfileId
                              pattern: ^[0-9]{1,19}$
                              minLength: 1
                              maxLength: 19
                          required:
                            - id
                    required:
                      - singular_label
                      - plural_label
                      - id
                      - profiles
              required:
                - modules
            examples:
              UpdateModuleLabelsAndProfiles:
                summary: Update Module Labels And Profile Access
                description: >-
                  Demonstrates a PUT request that updates the singular and
                  plural labels of a module and replaces its profile list in a
                  single call
                value:
                  modules:
                    - singular_label: Custom Module
                      plural_label: Custom Modules
                      id: '111111000000242167'
                      profiles:
                        - id: '111111000000000497'
                        - id: '111111000000000499'
        required: true
      responses:
        '200':
          description: >-
            Module updated successfully. The response contains the updated
            module ID and a success confirmation
          content:
            application/json:
              schema:
                type: object
                x-zs-$id: ModulesPutResponse200
                description: >-
                  Response body schema for a successful module update. Contains
                  a single-element module array with the outcome code, updated
                  module ID, confirmation message, and status
                additionalProperties: false
                properties:
                  modules:
                    type: array
                    description: >-
                      Single-element array containing the success result for the
                      updated module.
                    minItems: 1
                    maxItems: 1
                    items:
                      type: object
                      description: >-
                        Success result object containing the operation outcome
                        code, the updated module identifier, a confirmation
                        message, and a status indicator.
                      additionalProperties: false
                      properties:
                        code:
                          type: string
                          description: >-
                            Always "SUCCESS". Indicates the module update
                            completed without errors.
                          enum:
                            - SUCCESS
                        details:
                          type: object
                          description: >-
                            Contains the identifier of the successfully updated
                            module.
                          additionalProperties: false
                          properties:
                            id:
                              type: string
                              format: int64
                              description: >-
                                Unique numeric identifier of the successfully
                                updated module. Represented as a numeric string
                                encoding a 64-bit positive integer(Java long/DB
                                bigint).
                              example: '111111000000242167'
                          required:
                            - id
                        message:
                          type: string
                          description: >-
                            Displays the success message and confirms that the
                            update was applied.
                          enum:
                            - module updated successfully
                        status:
                          type: string
                          description: Indicates that the operation completed successfully.
                          enum:
                            - success
                      required:
                        - code
                        - details
                        - message
                        - status
                required:
                  - modules
              examples:
                SuccessfulUpdate:
                  summary: Module Update Succeeded
                  description: >-
                    Successful update response containing code=SUCCESS, the
                    updated module ID in details.ID, a confirmation message, and
                    an OK status.
                  value:
                    modules:
                      - code: SUCCESS
                        details:
                          id: '111111000000242167'
                        message: module updated successfully
                        status: success
