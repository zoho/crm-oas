openapi: 3.1.0
info:
  title: Modules
  description: >-
    Modules represent the distinct sections of Zoho CRM such as Leads, Contacts,
    Deals, and custom modules - each of which organizes a collection of records
    with configurable fields, layouts, profiles, and related lists. This API
    enables developers to create, retrieve, and update CRM module metadata and
    configuration.
  version: '8'
servers:
  - url: https://zohoapis.{dc}/crm/{version}
    description: API Server URL
    variables:
      dc:
        enum:
          - com
          - eu
          - in
          - cn
          - au
        default: com
        description: API Server URL TLD
      version:
        default: v8
        description: API Version
paths:
  /settings/modules:
    get:
      operationId: getModules
      summary: Retrieve modules
      description: >-
        Retrieves the list of all modules available in the Zoho CRM account,
        including standard, custom, subform, and linking (MxN) modules. Supports
        optional filtering by `status`, `feature_name`, and `include` to control
        the scope and depth of the response. When both `status` and
        `feature_name` are provided, modules must satisfy both criteria. Returns
        all matching modules in a single response without pagination.
      security:
        - OAuth2:
            - ZohoCRM.settings.modules.READ
      parameters:
        - $ref: '#/components/parameters/Status'
        - $ref: '#/components/parameters/FeatureName'
        - $ref: '#/components/parameters/Include'
        - $ref: '#/components/parameters/ParamQueryFields'
      responses:
        '200':
          description: >-
            Returns all modules in the Zoho CRM account with their configuration
            details, permissions, fields, layouts, and related lists. All
            matching modules are included in a single response without
            pagination.
          content:
            application/json:
              examples:
                AllModulesWithVariations:
                  summary: Complete module list with all variations
                  description: >-
                    Comprehensive response showing all module types including
                    standard, custom, subform, and web-tab modules with their
                    full metadata.
                  value:
                    modules:
