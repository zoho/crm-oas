openapi: 3.1.0
info:
  title: Webforms
  description: >
    [Webforms](https://help.zoho.com/portal/en/kb/crm/connect-with-customers/webforms/articles/web-forms-introduction)
    is a Zoho CRM feature that enables organizations to create embedded web
    forms, which capture visitor and prospect information from websites and
    automatically generate records such as Leads or Contacts in Zoho CRM. This
    API enables developers to manage webforms and their configurations,
    including creating, retrieving, updating, and deleting webforms, as well as
    accessing sub-resources for preview embed codes, record associations,
    variant diff comparisons, and AI-generated improvement suggestions.
  version: '8'
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
servers:
  - url: https://zohoapis.{dc}/crm/{version}
    description: API Server URL
    variables:
      dc:
        description: API Server URL TLD
        default: com
        enum:
          - com
          - eu
          - in
          - cn
          - au
          - ca
          - jp
      version:
        description: API Version
        default: v8
paths:
  /settings/webforms:
    get:
      summary: Get webforms
      description: To retrieve all webforms from your Zoho CRM organization.
      x-zs-llm-description: >-
        Retrieve all webforms from your Zoho CRM account with optional filters
        for module, active status, layout, and other criteria.
      operationId: getWebforms
      security:
        - OAuth2:
            - ZohoCRM.settings.webforms.READ
      parameters:
        - $ref: '#/components/parameters/ParamQueryModule'
        - $ref: '#/components/parameters/ParamQueryIncludeInnerDetails'
        - $ref: '#/components/parameters/ParamQueryFeatureName'
        - $ref: '#/components/parameters/ParamQueryActive'
        - $ref: '#/components/parameters/ParamQueryLayoutId'
        - $ref: '#/components/parameters/ParamQueryFilters'
      responses:
        '200':
          description: >-
            Returns a paginated list of webforms configured in the CRM
            organization.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetWebformsSuccessResponse'
              examples:
                Success200:
                  summary: Successful response for the get webforms request
                  value:
                    webforms:
                      - layout:
                          display_label: Standard
                          name: Standard
                          id: '111111000000003656'
                        created_time: '2025-11-19T11:22:58+05:30'
                        analytics_data:
                          analytics_enabled: true
                          analytics_enabled_time: '2025-11-19T11:22:58+05:30'
                        module:
                          api_name: Leads
                          id: '111111000000002652'
                        name: Webform
                        active: true
                        id: '111111000000114316'
                        created_by:
                          name: balaraman_oct27
                          id: '111111000000057843'
                        last_submitted_time: null
                    info:
                      per_page: 25
                      count: 1
                      page: 1
                      sort_by: name
                      sort_order: desc
                      more_records: false
          headers:
            X-API-CREDITS-REMAINING:
              schema:
                type: string
                format: int64
                description: >
                  Present when >=50% of base daily credits (excluding add-on
                  credits) are consumed. Value is total remaining credits
                  including add-on credits for the rolling 24-hour window.
                pattern: ^[0-9]+$
                minLength: 1
                maxLength: 19
              required: false
        '400':
          description: >-
            One or more request parameters contain invalid or unsupported
            values.

            **Resolution:** The top-level query parameters must be valid —
            including module, layout_id, and active. When using the filters
            parameter, the sub-fields group, group_operator, and comparator must
            be correctly structured and present.
          content:
            application/json:
              schema:
                x-zs-$id: GetWebformsErrorResponses
                description: >-
                  Contains the error response returned when the request
                  parameters for listing webforms are invalid, such as when the
                  filters parameter is not provided as a JSON object, the group
                  field within filters is not a JSON array, or required filter
                  fields are missing.
                oneOf:
                  - $ref: '#/components/schemas/WebformsErrorResponse1'
                  - $ref: '#/components/schemas/ErrorResponse'
              examples:
                InvalidModuleResponse1:
                  summary: Invalid module name supplied in the request
                  value:
                    code: INVALID_DATA
                    details:
                      param_name: module
                    message: the module name given seems to be invalid
                    status: error
                InvalidDataResponse1:
                  summary: Invalid value supplied for the layout_id parameter
                  value:
                    code: INVALID_DATA
                    details:
                      param_name: layout_id
                    message: given value for the param is invalid
                    status: error
                InvalidDataResponse2:
                  summary: Invalid value supplied for the active parameter
                  value:
                    code: INVALID_DATA
                    details:
                      param_name: active
                    message: given value for the param is invalid
                    status: error
                InvalidDataResponse3:
                  summary: Invalid value for group_operator in the filters parameter
                  value:
                    code: INVALID_DATA
                    details:
                      api_name: group_operator
                      json_path: $.group_operator
                      supported_values:
                        - AND
                      param_name: filters
                    message: the value given is invalid
                    status: error
                InvalidDataResponse21:
                  summary: Pattern mismatch error for the active parameter
                  value:
                    code: PATTERN_NOT_MATCHED
                    details:
                      param_name: active
                    message: Please check whether the input values are correct
                    status: error
                DependentFieldMissingResponse1:
                  summary: >-
                    DEPENDENT_FIELD_MISSING error — group requires
                    group_operator in filters
                  value:
                    code: DEPENDENT_FIELD_MISSING
                    details:
                      dependee:
                        api_name: group_operator
                        json_path: $.group_operator
                      api_name: group
                      json_path: $.group
                      param_name: filters
                    message: Dependent Field missing
                    status: error
                MandatoryNotFoundResponse1:
                  summary: Required field group missing from the filters parameter
                  value:
                    code: MANDATORY_NOT_FOUND
                    details:
                      api_name: group
                      json_path: $.group
                      param_name: filters
                    message: required field not found
                    status: error
                DependentFieldMissingResponse2:
                  summary: Missing required field parameter in filters
                  value:
                    code: DEPENDENT_FIELD_MISSING
                    details:
                      dependee:
                        api_name: field
                        json_path: $.group[0].field
                      api_name: field
                      json_path: $.group[0].field
                      param_name: filters
                    message: Required Field missing
                    status: error
                InvalidDataResponse4:
                  summary: >-
                    Invalid data type for the filters parameter — JSON object
                    expected
                  value:
                    code: INVALID_DATA
                    details:
                      expected_data_type: jsonobject
                      param_name: filters
                    message: the value given is invalid
                    status: error
                InvalidDataResponse5:
                  summary: Invalid data type for the field property in filters group
                  value:
                    code: INVALID_DATA
                    details:
                      expected_data_type: jsonobject
                      api_name: field
                      json_path: $.group[0].field
                      param_name: filters
                    message: invalid data
                    status: error
                NotSupportedResponse1:
                  summary: >-
                    Unsupported value provided for api_name in the filters
                    parameter
                  value:
                    code: NOT_SUPPORTED
                    details:
                      api_name: api_name
                      json_path: $.group[0].field.api_name
                      param_name: filters
                    message: The value given is not supported
                    status: error
                DependentMismatchResponse1:
                  summary: >-
                    DEPENDENT_MISMATCH error — unsupported comparator value in
                    filters
                  value:
                    code: DEPENDENT_MISMATCH
                    details:
                      dependee:
                        api_name: api_name
                        json_path: $.group[0].field.api_name
                      api_name: comparator
                      json_path: $.group[0].comparator
                      supported_values:
                        - equal
                        - not_equal
                      param_name: filters
                    message: The value given seems to be invalid
                    status: error
                DependentMismatchResponse2:
                  summary: Invalid data type for value parameter in filters
                  value:
                    code: DEPENDENT_MISMATCH
                    details:
                      expected_data_type: boolean
                      dependee:
                        api_name: api_name
                        json_path: $.group[0].field.api_name
                      api_name: value
                      json_path: $.group[0].value
                      param_name: filters
                    message: The value given seems to be invalid
                    status: error
                InvalidDataResponse6:
                  summary: >-
                    Invalid data type for the group field in filters — JSON
                    array expected
                  value:
                    code: INVALID_DATA
                    details:
                      expected_data_type: jsonarray
                      api_name: group
                      json_path: $.group
                      param_name: filters
                    message: the value given is invalid
                    status: error
          headers:
            X-API-CREDITS-REMAINING:
              schema:
                type: string
                format: int64
                description: >
                  Present when >=50% of base daily credits (excluding add-on
                  credits) are consumed. Value is total remaining credits
                  including add-on credits for the rolling 24-hour window.
                pattern: ^[0-9]+$
                minLength: 1
                maxLength: 19
              required: false
        '403':
          description: >-
            Permission denied for accessing webforms.

            **Resolution:** The CRM administrator must grant the required
            permission to the user's profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                NoPermissionResponse1:
                  summary: Permission denied for accessing webforms
                  value:
                    code: NO_PERMISSION
                    details:
                      permissions:
                        - Crm_Implied_Web_To_Leads
                    message: permission denied
                    status: error
          headers:
            X-API-CREDITS-REMAINING:
              schema:
                type: string
                format: int64
                description: >
                  Present when >=50% of base daily credits (excluding add-on
                  credits) are consumed. Value is total remaining credits
                  including add-on credits for the rolling 24-hour window.
                pattern: ^[0-9]+$
                minLength: 1
                maxLength: 19
              required: false
    put:
      security:
        - OAuth2:
            - ZohoCRM.settings.webforms.UPDATE
      summary: Update webforms in Zoho CRM
      description: >-
        To update the settings of a webform in Zoho CRM, including its name,
        module, layout, form fields, double opt-in configuration, analytics
