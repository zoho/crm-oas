      responses:
        '200':
          description: >-
            Returns the result of the webform update operation, including a
            SUCCESS status code and the ID of the updated webform.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebformsSuccessResponse'
              examples:
                Success200:
                  summary: >-
                    Successful update response with SUCCESS code and updated
                    webform ID
                  value:
                    webforms:
                      - code: SUCCESS
                        details:
                          id: '4149211000002945898'
                        message: WebForm Updated Successfuly
                        status: success
          headers:
            X-API-CREDITS-REMAINING:
              schema:
                type: string
                format: int64
                description: >
                  Present when >=50% of base daily credits (excluding add-on
                  credits) are consumed. Value is total remaining credits
                  including add-on credits for the rolling 24-hour window.
                pattern: ^[0-9]+$
                minLength: 1
                maxLength: 19
              required: false
        '400':
          description: >-
            Invalid or conflicting field values in the request.

            **Resolution:** Review the error code and message in the response.
            Correct the offending field values and resubmit the request.
          content:
            application/json:
              schema:
                x-zs-$id: UpdateWebformsErrorResponses
                description: >-
                  Contains the error details returned when a webform update
                  request fails validation. The response resolves to either a
                  wrapped array of error objects or a single generic error
                  object.
                oneOf:
                  - $ref: '#/components/schemas/WebformsErrorResponse1'
                  - $ref: '#/components/schemas/ErrorResponse'
              examples:
                DependentMismatchResponse1:
                  summary: >-
                    DEPENDENT_MISMATCH error when double opt-in conflicts with
                    splash message action on submit
                  value:
                    webforms:
                      - code: DEPENDENT_MISMATCH
                        details:
                          dependee:
                            api_name: action_on_submit
                            json_path: $.webforms[0].action_on_submit
                          api_name: double_optin_enabled
                          json_path: $.webforms[0].double_optin_enabled
                        message: >-
                          double opt-in cannot be enabled when splash message is
                          chosen as action on submit
                        status: error
                InvalidDataResponse1:
                  summary: >-
                    INVALID_DATA error when the Company field is set as both
                    hidden and required
                  value:
                    webforms:
                      - code: INVALID_DATA
                        details:
                          api_name: Company
                          json_path: $.webforms[0].$.form_fields[0].hidden
                        message: >-
                          Company cannot be hidden and required it can be either
                          hidden or required
                        status: error
                InvalidDataResponse2:
                  summary: >-
                    INVALID_DATA when the webform name contains special
                    characters
                  value:
                    webforms:
                      - code: INVALID_DATA
                        details:
                          api_name: name
                          json_path: $.webforms[0].name
                        message: Name should not contain special characters
                        status: error
                NotSupportedResponse1:
                  summary: >-
                    NOT_SUPPORTED error when the CRM edition does not allow
                    double opt-in
                  value:
                    webforms:
                      - code: NOT_SUPPORTED
                        details:
                          api_name: double_optin_enabled
                          json_path: $.webforms[0].double_optin_enabled
                        message: your edition doesn't support this feature
                        status: error
                NotSupportedResponse2:
                  summary: >-
                    NOT_SUPPORTED error when the CRM edition does not allow
                    URL-based analytics
                  value:
                    webforms:
                      - code: NOT_SUPPORTED
                        details:
                          api_name: url_analytics_enabled
                          json_path: $.webforms[0].analytics_data.url_analytics_enabled
                        message: url based analytics is not supported in this edition
                        status: error
                DependentMismatchResponse2:
                  summary: >-
                    DEPENDENT_MISMATCH error when URL analytics is enabled with
                    only one location URL configured
                  value:
                    webforms:
                      - code: DEPENDENT_MISMATCH
                        details:
                          dependee:
                            api_name: location_url
                            json_path: $.webforms[0].location_url
                          api_name: url_analytics_enabled
                          json_path: $.webforms[0].analytics_data.url_analytics_enabled
                        message: >-
                          url based analytics can be enabled only when more than
                          one location_url is configured
                        status: error
                DuplicateDataResponse1:
                  summary: >-
                    DUPLICATE_DATA error when duplicate URLs appear in the
                    location_url array
                  value:
                    webforms:
                      - code: DUPLICATE_DATA
                        details:
                          api_name: location_url
                          index: 1
                          json_path: $.webforms[0].location_url
                        message: Duplicate URLs are not allowed in location_url
                        status: error
                NotAllowedResponse1:
                  summary: >-
                    NOT_ALLOWED error when more than one captcha field is added
                    to a webform
                  value:
                    webforms:
                      - code: NOT_ALLOWED
                        details:
                          api_name: recaptcha
                          index: 6
                          parent_api_name: fields
                        message: You cannot add more than one captcha in the same form
                        status: error
                InvalidDataResponse3:
                  summary: >-
                    INVALID_DATA when Last Name field is configured as hidden in
                    the webform
                  value:
                    webforms:
                      - code: INVALID_DATA
                        details:
                          id: '111113000000004822'
                        message: Last Name cannot be hidden
                        status: error
                InvalidDataResponse4:
                  summary: INVALID_DATA returned when Date 1 field is set to hidden
                  value:
                    webforms:
                      - code: INVALID_DATA
                        details:
