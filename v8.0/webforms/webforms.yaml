      summary: |
        Delete a webform by ID
      description: >-
        To delete a specific webform from your Zoho CRM organization, send a
        DELETE request with the webform ID. The webform is permanently removed
        and the operation cannot be undone.
      x-zs-llm-description: Delete a specific webform from your Zoho CRM account by its ID.
      operationId: deleteWebform
      parameters:
        - $ref: '#/components/parameters/ParamQueryModule1'
      responses:
        '200':
          description: >
            Returns a `webforms` array containing a success object with the
            status and ID of the deleted webform.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebformsSuccessResponse'
              examples:
                Success200:
                  summary: |
                    Successful deletion of a webform returns a SUCCESS status
                  value:
                    webforms:
                      - code: SUCCESS
                        details:
                          id: '4149211000002945884'
                        message: WebForm deleted successfully
                        status: success
          headers:
            X-API-CREDITS-REMAINING:
              schema:
                type: string
                format: int64
                description: >
                  Present when >=50% of base daily credits (excluding add-on
                  credits) are consumed. Value is total remaining credits
                  including add-on credits for the rolling 24-hour window.
                pattern: ^[0-9]+$
                minLength: 1
                maxLength: 19
              required: false
        '400':
          description: >-
            The request failed due to an invalid or missing parameter, an
            invalid module name, or a deletion constraint violation.

            **Resolution:** The caller must ensure the webform `id` path
            parameter and `module` query parameter are valid and present, and
            that the webform is not associated with active records before
            attempting deletion.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                InvalidDataResponse1:
                  summary: |
                    INVALID_DATA error when the provided webform ID is invalid
                  value:
