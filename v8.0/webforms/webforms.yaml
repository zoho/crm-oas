    delete:
      security:
        - OAuth2:
            - ZohoCRM.settings.webforms.DELETE
      summary: Delete webforms by IDs
      description: >
        To delete multiple webforms from Zoho CRM, specify the IDs of

        the webforms to be removed.


        **Note:**

        - When multiple Webform IDs are passed, if some deletions succeed and
        others fail, the API responds with **207 Multi-Status**. Check the
        **status** key in each response item to see the result of each deletion.

        - If an invalid or non-existent Webform ID is provided, the deletion
        fails for that entry. The API returns an error code and message for the
        specific entry in the response.
      x-zs-llm-description: Delete multiple webforms from your Zoho CRM account by their IDs.
      operationId: deleteWebforms
      parameters:
        - $ref: '#/components/parameters/ParamQueryIds'
        - $ref: '#/components/parameters/ParamQueryTriggerSource'
        - $ref: '#/components/parameters/ParamQueryModule'
      responses:
        '200':
          description: >-
            Returns the deletion status for each requested webform. Each item in
            the response includes a success code, the deleted webform ID, and a
            confirmation message.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletewebformsResponse200'
              examples:
                Success200:
                  summary: Successful deletion of two webforms with status 200
                  value:
                    webforms:
                      - code: SUCCESS
                        details:
                          id: '4149211000002945721'
                        message: WebForm deleted successfully
                        status: success
                      - code: SUCCESS
                        details:
                          id: '4149211000002945703'
                        message: WebForm deleted successfully
                        status: success
          headers:
            X-API-CREDITS-REMAINING:
              schema:
                type: string
                format: int64
                description: >
                  Present when >=50% of base daily credits (excluding add-on
                  credits) are consumed. Value is total remaining credits
                  including add-on credits for the rolling 24-hour window.
                pattern: ^[0-9]+$
                minLength: 1
                maxLength: 19
              required: false
        '207':
          description: >-
            Returns a mixed-status response when the DELETE request includes
            both valid and invalid webform IDs. Each item in the response
            indicates either a successful deletion or an error for the
            corresponding ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletewebformsResponse207'
              examples:
                Success207:
                  summary: >-
                    Partial deletion with one SUCCESS and one INVALID_FORM_ID
                    error
                  value:
                    webforms:
                      - code: INVALID_FORM_ID
                        details:
                          param_name: ids
                        message: The given form id is not part of given module
                        status: error
                      - code: SUCCESS
                        details:
                          id: '4149211000002945676'
                        message: WebForm deleted successfully
                        status: success
          headers:
            X-API-CREDITS-REMAINING:
              schema:
                type: string
                format: int64
                description: >
                  Present when >=50% of base daily credits (excluding add-on
                  credits) are consumed. Value is total remaining credits
                  including add-on credits for the rolling 24-hour window.
                pattern: ^[0-9]+$
                minLength: 1
                maxLength: 19
              required: false
        '400':
          description: >-
            The request contains invalid or missing parameters.

            **Resolution:** Verify that the `ids` parameter is present and
            contains valid webform IDs belonging to the specified module, that
            the `trigger_source` value is valid, and that the module name is
            correct.
          content:
            application/json:
              schema:
                x-zs-$id: DeleteWebformsErrorResponses
                description: >-
                  Represents the error response body for a failed webform DELETE
                  request. Contains either a wrapped object with a webforms
                  array of error objects or a single error object.
                anyOf:
                  - type: object
                    additionalProperties: false
                    description: >-
                      Represents the wrapped error response shape returned when
                      the 400 response body contains a webforms array of error
                      objects.
                    properties:
                      webforms:
                        type: array
                        description: >-
                          Represents the list of error objects returned when one
                          or more webform delete operations fail.
                        items:
                          $ref: '#/components/schemas/ErrorResponse'
                        maxItems: 100
                    required:
                      - webforms
                  - $ref: '#/components/schemas/ErrorResponse'
              examples:
                InvalidFormIdResponse1:
                  summary: >-
                    INVALID_FORM_ID error when all submitted form IDs are not
                    part of the module
                  value:
                    webforms:
                      - code: INVALID_FORM_ID
                        details:
                          param_name: ids
                        message: The given form id is not part of given module
                        status: error
                      - code: INVALID_FORM_ID
                        details:
                          param_name: ids
                        message: The given form id is not part of given module
                        status: error
                InvalidDataResponse1:
                  summary: >-
                    INVALID_DATA error caused by an invalid trigger_source
                    parameter value
                  value:
                    code: INVALID_DATA
                    details:
                      param_name: trigger_source
                    message: invalid data
                    status: error
                InvalidModuleResponse1:
                  summary: INVALID_DATA error when the supplied module name is invalid
                  value:
                    code: INVALID_DATA
                    details:
                      param_name: module
                    message: the module name given seems to be invalid
                    status: error
                RequiredParamMissingResponse1:
                  summary: >-
                    REQUIRED_PARAM_MISSING error when the ids parameter is
                    absent from the request
                  value:
                    code: REQUIRED_PARAM_MISSING
                    details:
                      param_name: ids
                    message: One of the expected param is missing
                    status: error
          headers:
            X-API-CREDITS-REMAINING:
              schema:
                type: string
                format: int64
                description: >
                  Present when >=50% of base daily credits (excluding add-on
                  credits) are consumed. Value is total remaining credits
                  including add-on credits for the rolling 24-hour window.
                pattern: ^[0-9]+$
                minLength: 1
                maxLength: 19
              required: false
  /settings/webforms/diff:
    get:
      security:
        - OAuth2:
            - ZohoCRM.settings.webforms.READ
      summary: Get webform diff
      description: |
        Retrieves the field-level differences between two webforms in
        the CRM organization. The base_form and variant_form query parameters 
        identify the two forms to compare. The response lists all fields that 
        differ between the two forms, including added, removed, and modified 
        fields.

         **Notes:**
          - The base and variant forms must belong to the same module.
          - The base and variant forms must not be the same Webform.
          - If there are no differences between the base and variant forms, the response returns an empty array.
      x-zs-llm-description: >-
        Compare two webforms to identify structural and content differences
        between them.
      operationId: getDiff
      parameters:
        - $ref: '#/components/parameters/ParamQueryBaseForm'
        - $ref: '#/components/parameters/ParamQueryVariantForm'
      responses:
        '200':
          description: >-
            Returns the diff result between the specified base and variant
            webform, including modified, added, and removed fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetdiffResponse200'
              examples:
                Success200:
                  summary: Webforms diff — no differences
                  value:
                    diff:
                      - modified_fields:
                          - type: advanced
                            field_info:
                              field_label: 1:flc:Upload a Filedddd
                              type: file_upload
                            required: false
                        added_fields:
                          - display_label: 0:flc:Email
                            help: null
                            field:
                              api_name: Email
                              field_label: 0:flc:Email
                              id: '111113000000004828'
                            hidden: false
                            type: general
                            required: true
                        removed_fields:
                          - type: advanced
                            field_info:
                              field_label: Enter the Captcha
                              type: standard_captcha
                        button_attributes: null
                        form_attributes: null
          headers:
            X-API-CREDITS-REMAINING:
              schema:
                type: string
                format: int64
                description: >
                  Present when >=50% of base daily credits (excluding add-on
                  credits) are consumed. Value is total remaining credits
                  including add-on credits for the rolling 24-hour window.
                pattern: ^[0-9]+$
                minLength: 1
                maxLength: 19
              required: false
        '400':
          description: >-
            One or more required query parameters are missing or contain invalid
            values.

            **Resolution:** The request must include valid base_form and
            variant_form query parameters, each containing a distinct webform ID
            that belongs to the correct module.
          content:
            application/json:
              schema:
                x-zs-$id: GetWebformsDiffErrorResponses
                description: >-
                  Represents the error response returned when the webform diff
                  request contains invalid or missing parameters.
                anyOf:
                  - type: object
                    additionalProperties: false
                    description: >-
                      Represents the wrapped error response containing an array
                      of webform-specific error objects.
                    properties:
                      webforms:
                        type: array
                        description: >-
                          Represents the list of error objects returned when the
                          diff request fails due to invalid or missing
                          parameters.
                        items:
                          $ref: '#/components/schemas/ErrorResponse'
                        maxItems: 25
                    required:
                      - webforms
                  - $ref: '#/components/schemas/ErrorResponse'
              examples:
                InvalidDataResponse1:
                  summary: Webforms diff — invalid form ID data
                  value:
                    code: INVALID_DATA
                    details:
                      param_name: variant_form
                    message: the given form id is seems to be invalid
                    status: error
                InvalidFormIdResponse1:
                  summary: Webforms diff — form ID not in module
                  value:
                    code: INVALID_FORM_ID
                    details:
                      param_name: variant_form
                    message: The given form id is not part of given module
                    status: error
                InvalidFormIdResponse2:
                  summary: Webforms diff — duplicate form IDs
                  value:
                    code: INVALID_FORM_ID
                    details:
                      param_name: variant_form
                    message: Both form id should not be same
                    status: error
                RequiredParamMissingResponse1:
                  summary: Webforms diff — required parameter missing
                  value:
                    code: REQUIRED_PARAM_MISSING
                    details:
                      param_name: base_form
                    message: One of the expected param is missing
                    status: error
          headers:
            X-API-CREDITS-REMAINING:
              schema:
                type: string
                format: int64
                description: >
                  Present when >=50% of base daily credits (excluding add-on
                  credits) are consumed. Value is total remaining credits
                  including add-on credits for the rolling 24-hour window.
                pattern: ^[0-9]+$
                minLength: 1
                maxLength: 19
              required: false
        '403':
          description: >-
            Permission denied.

            **Resolution:** An administrator must grant the user's CRM profile
            the required permission (Crm_Implied_Web_To_Cases) to access webform
            diff comparison.
          content:
            application/json:
              schema:
