          maxItems: 2
        conversion_rate:
          type: string
          description: >-
            Represents the conversion rate of the webform, indicating the
            percentage of visitors who submitted the form.
          maxLength: 255
      required:
        - conversion_rate
        - low_filled_rate_fields
    GETSuggestedVariantInfoNested:
      type: object
      additionalProperties: false
      description: >-
        Represents the suggested configuration for a variant webform, including
        button attributes, fields, and form attributes.
      properties:
        button_attributes:
          type: array
          description: >-
            Contains the list of button attribute configurations suggested for
            the variant webform.
          items:
            $ref: '#/components/schemas/GETButtonAttributesNested'
          maxItems: 2
        fields:
          type: array
          description: >-
            Contains the list of field configurations suggested for the variant
            webform.
          items:
            $ref: '#/components/schemas/GETFieldsNested'
          maxItems: 2
        form_attributes:
          $ref: '#/components/schemas/GETFormAttributesNested'
      required:
        - button_attributes
        - fields
        - form_attributes
    GETFormAttributesNested:
      type: object
      additionalProperties: false
      description: >-
        Represents the visual configuration retrieved for the webform, including
        color, width, alignment, and font attributes.
      properties:
        color:
          type: string
          description: Specifies the background color of the webform.
          maxLength: 255
        width:
          type: integer
          format: int32
          description: Specifies the width of the webform in pixels.
        font_attributes:
          $ref: '#/components/schemas/GETFontAttributesNested'
        align:
          type: string
          description: Specifies the horizontal alignment of the webform content.
          maxLength: 255
      required:
        - align
        - color
        - font_attributes
        - width
    GETFontAttributesNested:
      type: object
      additionalProperties: false
      description: >-
        Represents the font attribute settings applied to the webform text,
        including font size, color, and family.
      properties:
        size:
          type: integer
          format: int32
          description: Specifies the font size applied to the text in the webform.
        color:
          type: string
          description: Specifies the font color applied to the text in the webform.
          maxLength: 255
        family:
          type: string
          description: Specifies the font family applied to the text in the webform.
          maxLength: 255
      required:
        - color
        - family
        - size
    GETLowFilledRateFieldsNested:
      type: object
      additionalProperties: false
      description: >-
        Represents a CRM field with a low form-fill rate, used in webform
        improvement suggestions.
      properties:
        api_name:
          type: string
          description: Represents the API name of the CRM field with a low form-fill rate.
          maxLength: 255
        field_label:
          type: string
          description: >-
            Represents the display label of the CRM field with a low form-fill
            rate.
          maxLength: 255
        id:
          type: string
          description: >-
            Represents the unique identifier of the CRM field with a low
            form-fill rate.
          maxLength: 255
      required:
        - api_name
        - field_label
        - id
    GETButtonAttributesNested:
      type: object
      additionalProperties: false
      description: >-
        Represents the button attribute configuration retrieved for the webform,
        including the button name and color.
      properties:
        color:
          type: string
          description: >-
            Specifies the color applied to the button element within the
            webform.
          maxLength: 255
        name:
          type: string
          description: >-
            Represents the internal name identifier of the button attribute
            within the webform.
          maxLength: 255
      required:
        - color
        - name
    GETFieldsNested:
      type: object
      additionalProperties: false
      description: >-
        Represents the configuration of a CRM field retrieved from the webform,
        including its API name, label, visibility, and required status.
      properties:
        help:
          $ref: '#/components/schemas/GETHelpNested'
          description: 'Field: help'
        hidden:
          type: boolean
          description: >-
            Indicates whether the field is hidden on the webform. Possible
            values: true - The field is hidden. false - The field is visible.
        advanced:
          type: boolean
          description: >-
            Indicates whether the field is configured as an advanced field on
            the webform. Possible values: true - The field is an advanced field.
            false - The field is not an advanced field.
        api_name:
          type: string
          description: Represents the API name of the CRM field configured on the webform.
          maxLength: 255
        field_label:
          type: string
          description: >-
            Represents the display label of the CRM field as shown on the
            webform.
          maxLength: 255
        id:
          type: string
          description: >-
            Represents the unique identifier of the CRM field configured on the
            webform.
          maxLength: 255
        required:
          type: boolean
          description: >-
            Indicates whether the field is required on the webform. Possible
            values: true - The field is required. false - The field is not
            required.
        field_name:
          type: string
          description: >-
            Represents the display name of the CRM field as shown on the
            webform.
          maxLength: 255
      required:
        - advanced
        - api_name
        - field_label
        - field_name
        - help
        - hidden
        - id
        - required
    GETHelpNested:
      type:
        - object
        - 'null'
      additionalProperties: false
      description: >-
        Represents the help text configuration for a webform field, including
        the text and URL.
      properties:
        text:
          type: string
          description: >-
            Represents the help text displayed to the visitor alongside the
            webform field.
          maxLength: 255
        url:
          type: 'null'
          description: Represents the URL linked to the help content for the webform field.
      required:
        - text
        - url
    ErrorResponseCore1126545123:
      type: object
      additionalProperties: false
      description: Invalid webformId
      properties:
        code:
          type: string
          description: >-
            Represents the error code that identifies the type of error, such as
            an invalid webform ID.
          enum:
            - INVALID_DATA
        details:
          type: object
          additionalProperties: false
          description: >-
            Represents additional details providing context about the error,
            such as the path index of the invalid resource.
          properties:
            resource_path_index:
              type: integer
              format: int32
              description: >-
                Represents the index of the resource in the request path that
                caused the error.
          required:
            - resource_path_index
        message:
          type: string
          description: >-
            Represents the error message describing the reason for the invalid
            webform ID failure.
          enum:
            - The id given seems to be invalid.
        status:
          type: string
          description: >-
            Represents the status of the API response. Possible values: error -
            The request was not successful.
          enum:
            - error
      required:
        - code
        - details
        - message
        - status
      title: Error Response Core
      x-zs-$id: ErrorResponseCore1126545123
    ErrorResponseCore470490972:
      type: object
      additionalProperties: false
      description: Permission Denied
      properties:
        code:
          type: string
          description: >-
            Represents the error code identifying the type of error, such as a
            permission denial.
          enum:
            - NO_PERMISSION
        details:
          type: object
          additionalProperties: false
          description: >-
            Represents additional details about the permission denial, such as
            the permissions that are missing.
          properties:
            permissions:
              type: array
              description: >-
                Contains the list of CRM permissions that the user's profile
                lacks for the requested operation.
              items:
                type: string
                description: >-
                  Represents a single CRM permission name required for the
                  requested operation.
                maxLength: 255
              maxItems: 25
          required:
            - permissions
        message:
          type: string
          description: Represents the error message describing the permission denial.
          enum:
            - permission denied
        status:
          type: string
          description: >-
            Represents the status of the API response. Possible values: error -
            The request was not successful.
          enum:
            - error
      required:
        - code
        - details
        - message
        - status
      title: Error Response Core
      x-zs-$id: ErrorResponseCore470490972
  parameters:
    ParamQueryFeatureName:
      name: feature_name
      in: query
      description: >-
        Specify the feature name to check whether the required permission is
        granted for the feature.
      required: false
      schema:
        type: string
        enum:
          - Web_Forms | Orchestration
    ParamQueryFromTime:
      name: from_time
      in: query
      description: >-
        Specify the start date and time for the analytics data period in ISO
        8601 format.
      required: false
      schema:
        type: string
        enum:
          - 10-11-2025 12:00:00
    ParamQueryVariantForm:
      name: variant_form
      in: query
      description: >-
        Specify the ID of the variant webform for comparison in an A/B testing
        diff request.
      required: true
      schema:
        type: number
        enum:
          - 111111000000114400
    ParamQueryToTime:
      name: to_time
      in: query
      description: >-
        Specify the end date and time for the analytics data period in ISO 8601
        format.
      required: false
      schema:
        type: string
        enum:
          - 11-11-2025 12:00:00
    ParamQueryFilters:
      name: filters
      in: query
      description: >-
        Specify the filter criteria for the webforms list. The value must be a
        JSON object with group and group_operator fields.
      required: false
      schema:
        type: string
        enum:
          - '{"group_operator":"and"'
          - '"group":[{"field":{"api_name":"isenabled"'
          - '"field_label":"Status"'
          - '"data_type":"picklist"}'
          - '"comparator":"equal"'
          - '"value":"true"'
          - '"type":"value"}'
          - '{"field":{"api_name":"isenabled"'
          - '"value":"false"'
          - '{"field":{"api_name":"last_submitted_time"'
          - '"field_label":"Last Submission"'
          - '"data_type":"datetime"}'
          - '"comparator":"between"'
          - '"value":["2025-11-18T19:30:00+00:00"'
          - '"2025-11-18T19:30:59+00:00"]'
          - '{"field":{"api_name":"formname"'
          - '"field_label":"Form Name"'
          - '"data_type":"text"}'
          - '"comparator":"ends_with"'
          - '"value":"new"'
          - '"comparator":"starts_with"'
          - '"comparator":"not_contains"'
          - '"comparator":"contains"'
          - '"comparator":"not_equal"'
          - '{"field":{"api_name":"created_time"'
          - '"field_label":"Created Time"'
          - '"value":["2025-10-31T18:30:00+00:00"'
          - '"2025-11-26T10:17:25+00:00"]'
          - '"value":["2025-11-24T18:30:00+00:00"'
          - '"2025-11-25T18:29:59+00:00"]'
          - '"comparator":"not_between"'
          - '"2025-11-25T19:31:00+00:00"]'
          - '"value":["2025-11-25T19:30:00+00:00"'
          - '"2025-11-25T19:30:59+00:00"]'
          - '"comparator":"greater_than"'
          - '"value":"2025-11-25T19:30:59+00:00"'
          - '"comparator":"less_than"'
          - '"value":"2025-11-10T19:30:00+00:00"'
          - '{"field":{"api_name":"created_by"'
          - '"field_label":"Created By"'
          - '"data_type":"userlookup"}'
          - '"value":["4149211000000605001"]'
          - '"type":"value"}]}'
    ParamQueryLayoutId:
      name: layout_id
      in: query
      description: >-
        Specify the layout ID to filter the webforms list by layout. Refer to
        the [Get Layouts](layouts.yaml#$.paths./settings/layouts.get) resource
        for valid values.
      required: false
      schema:
        type: number
        enum:
          - 12345678909876
    ParamQueryModule1:
      name: module
      in: query
      description: >-
        Specify the module API name of the CRM module for which the webform is
        being created or updated. Refer to the [Get
        Modules](modules.yaml#$.paths./settings/modules.get) resource for valid
        values.
      required: true
      schema:
        type: string
        enum:
          - Leads
    ParamQueryTriggerSource:
      name: trigger_source
      in: query
      description: Specify the source that triggered the webform deletion.
      required: false
      schema:
        type: string
        enum:
          - admin_center
    ParamQueryBaseForm:
      name: base_form
      in: query
      description: >-
        Specify the ID of the base webform for comparison in an A/B testing diff
        request. Use the [Get Webforms
        API](webforms.yaml#$.paths./settings/webforms.get) to retrieve the
        webform ID.
      required: true
      schema:
        type: number
        enum:
          - 111111000000114140
    ParamQueryIncludeInnerDetails:
      name: include_inner_details
      in: query
      description: >-
        Specify whether to include inner details such as portal information in
        the webforms response. Possible values: true - Include inner details.
        false - Exclude inner details.
      required: false
      schema:
        type: string
        enum:
          - user_type.active
    ParamQueryModule:
      name: module
      in: query
      description: >-
        Specify the module API name to filter webforms by the target CRM module.
        Refer to the [Get Modules](modules.yaml#$.paths./settings/modules.get)
        resource for valid values.
      required: false
      schema:
        type: string
        enum:
          - Leads
    ParamQueryIds:
      name: ids
      in: query
      description: >-
        Specify the comma-separated list of webform IDs for bulk delete or other
        bulk operations. Use the [Get Webforms
        API](webforms.yaml#$.paths./settings/webforms.get) to retrieve the
        webform IDs.
      required: true
      schema:
        type: number
        enum:
          - 4149211000002945500
    ParamQueryActive:
      name: active
      in: query
      description: >-
        Specify the active status of the webforms to filter. Possible values:
        true - Return only active webforms. false - Return only inactive
        webforms.
      required: false
      schema:
        type: string
        enum:
          - 'true'
          - 'false'
