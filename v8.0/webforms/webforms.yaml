          description: >-
            The request contains an invalid or missing parameter.

            **Resolution:** The caller must ensure that the webform ID supplied
            in the path is valid and that all required query parameters —
            including the module name — are present and valid before
            resubmitting the request.
          content:
            application/json:
              schema:
                x-zs-$id: GetWebformByIdErrorResponses
                description: >-
                  Represents the error response returned for a failed GET
                  webform request, expressed as either a wrapped array of
                  webform errors or a generic error response.
                anyOf:
                  - type: object
                    additionalProperties: false
                    description: >-
                      Represents an error response object that wraps up to 25
                      webform-specific validation errors in the webforms array.
                    properties:
                      webforms:
                        type: array
                        description: >-
                          Contains the list of error objects returned when the
                          webform request fails validation.
                        items:
                          $ref: '#/components/schemas/ErrorResponse'
                        maxItems: 25
                    required:
                      - webforms
                  - $ref: '#/components/schemas/ErrorResponse'
              examples:
                InvalidModuleResponse1:
                  summary: >-
                    INVALID_MODULE error when an unrecognized module name is
                    provided
                  value:
                    code: INVALID_DATA
                    details:
                      param_name: module
                    message: the module name given seems to be invalid
                    status: error
                InvalidDataResponse1:
                  summary: >-
                    INVALID_DATA error when an unrecognized webform ID is
