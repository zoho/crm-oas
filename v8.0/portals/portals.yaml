    put:
      summary: Portal
      description: >-
        To update the configuration of an existing portal in the Zoho CRM
        organization, including the portal name and SAML single sign-on
        settings.
      x-zs-llm-description: Update the portal name or saml_configurations for portals.
      operationId: updatePortal
      parameters:
        - $ref: '#/components/parameters/Portals'
      security:
        - OAuth2:
            - ZohoCRM.settings.clientportal.UPDATE
      requestBody:
        content:
          application/json:
            schema:
              description: >-
                Represents the request body schema for updating a portal,
                supporting name and SAML configuration updates.
              type: object
              additionalProperties: false
              properties:
                portals:
                  description: >-
                    Specify the list of portal update objects. Only one portal
                    is allowed per request.
                  type: array
                  maxItems: 100
                  items:
                    description: Represents the set of portal properties to update.
                    type: object
                    additionalProperties: false
                    properties:
                      name:
                        description: >-
                          Specify the updated display name for the portal. The
                          name must be between 6 and 30 characters.
                        type: string
                        minLength: 6
                        maxLength: 30
                      saml_configuration:
                        description: Specify the SAML configuration to apply to the portal.
                        type: object
                        additionalProperties: false
                        properties:
                          login_url:
                            description: >-
                              Specify the SAML SSO login URL for the portal.
                              Must begin with `https://www.`. Required when
                              updating SAML configuration.
                            type: string
                            pattern: http[s]://www[.][a-z]{7}[.]com
                            maxLength: 2048
                          logout_url:
                            description: >-
                              Specify the SAML SSO logout URL for the portal.
                              Must begin with `https://www.`. Required when
                              updating SAML configuration.
                            type: string
                            pattern: http[s]://www[.][a-z]{7}[.]com
                            maxLength: 2048
                          public_key:
                            description: >-
                              Specify the SAML X.509 public key certificate.
                              Required when updating SAML configuration.
                            type: string
                            maxLength: 5000
                          active:
                            description: >-
                              Specify **true** to activate the SAML
                              configuration for the portal. Possible values:
                              **true**.
                            type: boolean
                            enum:
                              - true
                        required:
                          - login_url
                          - logout_url
                          - public_key
              required:
                - portals
            examples:
              Default:
                value:
                  portals:
                    - name: updateportal
                      saml_configuration:
                        login_url: https://www.example.com
                        logout_url: https://www.example.com
                        public_key: >-
                          -----BEGIN
                          CERTIFICATE----------END
                          CERTIFICATE-----
                        active: true
                description: >-
                  Shows a sample request body for updating a portal name and
                  SAML configuration.
                summary: Sample portal update request
            x-zs-llm-examples:
              - Default
        required: true
        description: >-
          The request body must contain a **portals** array with exactly one
          portal update object. You can update the portal name and SAML
          configuration. All SAML fields - `login_url`, `logout_url`, and
          `public_key` - are required when updating SAML settings.
      responses:
        '200':
          description: >-
            Returns the result of the portal update, including the updated
            portal name and a SUCCESS status code.
          content:
            application/json:
              schema:
                description: >-
                  Represents the 200 response schema for a successful portal
                  update, including the portal name and result code.
                x-zs-$id: UpdatePortalSuccessResponse
                type: object
                additionalProperties: false
                properties:
                  portals:
                    description: Represents the list of updated portal results.
                    type: array
                    maxItems: 100
                    items:
                      description: Represents the update result for a single portal.
                      type: object
                      additionalProperties: false
                      properties:
                        code:
                          description: >-
                            Represents the result code for the portal update.

                            Possible values: **SUCCESS** - the portal update
                            completed successfully. 
                          type: string
                          enum:
                            - SUCCESS
                        message:
                          description: >-
                            Represents the confirmation message for the portal
                            update.
                          type: string
                          maxLength: 255
                        details:
                          description: Represents the details of the updated portal.
                          type: object
                          additionalProperties: false
                          properties:
                            name:
                              description: Represents the name of the updated portal.
                              type: string
                              maxLength: 30
                          required:
                            - name
                        status:
                          description: >-
                            Represents the overall status of the portal update.

                            Possible values: **success** - the operation
                            completed successfully. 
                          type: string
                          enum:
                            - success
                      required:
                        - code
                        - message
                        - details
                        - status
                required:
                  - portals
              examples:
                Default:
                  value:
                    portals:
                      - code: SUCCESS
                        message: Portal updated successfully
                        details:
                          name: examplePortal
                        status: success
                  description: >-
                    Shows the response returned when a portal update is
                    completed successfully.
                  summary: Successful portal update
        '400':
          description: >-
            The request is invalid. Possible causes include an invalid portal
            name, a name already in use, a missing required SAML field, a null
            value for a required field, or a sandbox restriction. Resolution:
            Review the error details and correct the request before retrying.
          content:
            application/json:
              schema:
                x-zs-$id: UpdatePortalBadRequestResponseWrapper
                oneOf:
                  - description: >-
                      Represents the combined error response schema for the
                      Update Portal operation.
                    x-zs-$id: UpdatePortalBadRequestResponse
                    type: object
                    additionalProperties: false
                    properties:
                      portals:
                        description: >-
                          Represents the list of per-portal validation errors
                          returned when the update request is invalid.
                        type: array
                        maxItems: 100
                        items:
