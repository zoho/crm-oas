                                Possible values: **INVALID_DATA** - a field
                                value is invalid or out of range.
                                **ALREADY_USED** - the portal name is already in
                                use. **MANDATORY_NOT_FOUND** - a required field
                                is missing. **NOT_ALLOWED** - the operation is
                                not permitted. 
                              type: string
                              enum:
                                - ALREADY_USED
                                - PATTERN_NOT_MATCHED
                                - MANDATORY_NOT_FOUND
                                - INVALID_DATA
                                - NO_PERMISSION
                                - NOT_ALLOWED
                            message:
                              description: >-
