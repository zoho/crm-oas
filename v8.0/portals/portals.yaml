                                validation error.
                              type: object
                              additionalProperties: false
                              properties:
                                api_name:
                                  description: >-
                                    Represents the API name of the field that
                                    caused the validation error.
                                  type: string
                                  maxLength: 255
                                json_path:
                                  description: >-
                                    Represents the JSON Path location of the
                                    field that caused the validation error.
                                  type: string
                                  maxLength: 255
                                minimum_length:
                                  description: >-
                                    Represents the minimum required character
                                    length for the field.
                                  type: integer
                                  format: int32
                                maximum_length:
                                  description: >-
                                    Represents the maximum allowed character
                                    length for the field.
                                  type: integer
                                  format: int32
                                expected_data_type:
                                  description: >-
