openapi: 3.1.0
info:
  title: Portals
  description: >-
    Portals in Zoho CRM are branded, externally accessible web portals that
    allow organizations to share CRM records with customers, partners, or
    vendors. This API enables developers to create, retrieve, and update portal
    configurations, including SAML-based single sign-on settings.
  version: '8'
servers:
  - url: https://zohoapis.{dc}/crm/{version}
    description: >-
      Production API server for Zoho CRM. Includes the datacenter domain and API
      version.
    variables:
      dc:
        enum:
          - com
          - eu
          - in
          - cn
          - au
        default: com
        description: >-
          The top-level domain of the Zoho CRM datacenter where the organization
          is hosted.

          Possible values: **com** - United States. **eu** - European Union.
          **in** - India. **cn** - China. **au** - Australia.
      version:
        default: v8
        description: The version of the Zoho CRM API to use. Defaults to **v8**.
paths:
  /settings/portals:
    get:
      operationId: getPortals
      summary: Portals
      description: >-
        To retrieve the list of all portals configured for the Zoho CRM
        organization. A 204 response indicates no portal has been created yet.
      x-zs-llm-description: Retrieves basic portal info; returns 204 if no portal is configured.
      security:
        - OAuth2:
            - ZohoCRM.settings.clientportal.READ
      responses:
        '200':
          description: >-
            Returns the list of portals configured for the organization with
            their summary details.
          content:
            application/json:
              schema:
                description: >-
                  Represents the 200 response schema for listing portals,
                  containing the array of portal summary objects.
                x-zs-$id: GetPortalsResponse
                type: object
                additionalProperties: false
                properties:
                  portals:
                    description: >-
                      Represents the list of portals configured for the
                      organization.
                    type: array
                    maxItems: 100
                    items:
                      description: Represents the summary details of a single portal.
                      type: object
                      additionalProperties: false
                      properties:
                        created_time:
                          description: >-
                            Represents the timestamp when the portal was first
                            added.
                          type: string
                          format: date-time
                        modified_time:
                          description: >-
                            Represents the timestamp when the portal
                            configuration was last modified.
                          type: string
                          format: date-time
                        modified_by:
                          description: >-
                            Represents the Zoho CRM user who last modified this
                            portal.
                          type: object
                          additionalProperties: false
                          properties:
                            name:
                              description: >-
                                Represents the name of the user who last
                                modified this portal.
                              type: string
                              maxLength: 255
                            id:
                              description: >-
                                Represents the unique identifier of the user who
                                last modified this portal.
                              type: string
                              maxLength: 255
                          required:
                            - name
                            - id
                        created_by:
                          description: >-
                            Represents the Zoho CRM user who created this
                            portal.
                          type: object
                          additionalProperties: false
                          properties:
                            name:
                              description: >-
                                Represents the name of the user who created this
                                portal.
                              type: string
                              maxLength: 255
                            id:
                              description: >-
                                Represents the unique identifier of the user who
                                created this portal.
                              type: string
                              maxLength: 255
                          required:
                            - name
                            - id
                        zaid:
                          description: >-
                            Represents the Zoho account ID (`zaid`) associated
                            with the portal.
                          type: string
                          maxLength: 255
                        name:
                          description: Represents the unique name of the portal.
                          type: string
                          maxLength: 60
                          x-zs-$id: PortalsName
                        active:
                          description: Indicates whether the portal is active.
                          type: boolean
                        login_url:
                          description: Represents the login URL for the portal.
                          type: string
                          maxLength: 2048
                      required:
                        - created_time
                        - modified_time
                        - modified_by
                        - created_by
                        - zaid
                        - name
                        - active
                required:
                  - portals
              examples:
                Default:
                  value:
                    portals:
                      - created_time: '2022-12-20T10:23:57Z'
                        modified_time: '2022-12-20T10:23:57Z'
                        modified_by:
                          name: John Doe
                          id: '1234567890'
                        name: portalname
                        created_by:
                          name: Jane Doe
                          id: '0987654321'
                        zaid: '1234567890'
                        active: true
                        login_url: www.example.com
                  description: >-
                    Shows the list of portals returned for the organization,
                    including creation and modification metadata.
                  summary: Successful portal list retrieval
        '204':
          description: >-
            No portal has been created for this organization. The response body
            is empty.
        '400':
          description: >-
            The API is not supported in the current environment. Resolution:
            Retry the request in a production environment.
          content:
            application/json:
              schema:
                description: >-
                  Represents the API_NOT_SUPPORTED error returned when the Get
                  Portals API is called in a sandbox environment.
                x-zs-$id: GetPortalsSandboxErrorResponse
                type: object
                additionalProperties: false
                properties:
                  code:
                    description: >-
                      Represents the error code for this response.

                      Possible values: **API_NOT_SUPPORTED** - the API is not
                      supported in the current environment. 
                    type: string
                    enum:
                      - API_NOT_SUPPORTED
                  details:
                    description: Represents additional error context.
                    type: object
                    additionalProperties: false
                    properties:
                      unsupported_environment:
                        description: >-
                          Represents the environment type that does not support
                          this API.
                        type: string
                        maxLength: 255
                  message:
                    description: Represents the error message describing the failure.
                    type: string
                    maxLength: 255
                  status:
                    description: |-
                      Represents the overall response status.
                      Possible values: **error** - the request failed. 
                    type: string
                    enum:
                      - error
                required:
                  - code
                  - message
                  - details
                  - status
              examples:
                ApiNotSupportedResponse1:
                  summary: API_NOT_SUPPORTED - sandbox environment
                  value:
                    code: API_NOT_SUPPORTED
                    details:
                      unsupported_environment: sandbox
                    message: api not supported in sandbox
                    status: error
                  description: >-
                    Shows the error response when the Get Portals API is called
                    in a sandbox environment, which is not supported.
        '403':
          description: >-
            The authenticated user does not have the required
            `ZohoCRM.settings.clientportal.READ` permission. Resolution: Ensure
            the access token includes the correct scope.
          content:
            application/json:
              schema:
                description: >-
                  Represents the NO_PERMISSION error returned when the
                  authenticated user lacks the required portal read permission.
                x-zs-$id: GetPortalsForbiddenResponse
                type: object
                additionalProperties: false
                properties:
                  code:
                    description: >-
                      Represents the error code for this response.

                      Possible values: **NO_PERMISSION** - the authenticated
                      user lacks the required permission. 
                    type: string
                    enum:
                      - NO_PERMISSION
                  message:
                    description: >-
                      Represents the error message describing the missing
                      permission.
                    type: string
                    maxLength: 255
                  details:
                    description: >-
                      Represents additional context about the missing
                      permission.
                    type: object
                    additionalProperties: false
                    properties:
                      permissions:
                        description: >-
                          Represents the list of required permission identifiers
                          that the user lacks.
                        type: array
                        maxItems: 100
                        items:
                          description: Represents a required permission identifier.
                          type: string
                          maxLength: 255
                  status:
                    description: |-
                      Represents the overall response status.
                      Possible values: **error** - the request failed. 
                    type: string
                    enum:
                      - error
                required:
                  - code
                  - message
                  - details
                  - status
              examples:
                Example1:
                  value:
                    code: NO_PERMISSION
                    details: {}
                    message: Permission is invalid.
                    status: error
                  description: >-
                    Shows the error response when the authenticated user lacks
                    the required Read Portals permission.
                  summary: NO_PERMISSION - insufficient portal permission
    post:
      operationId: createPortal
      summary: Portal
      description: >-
        To create a Client Portal for the Zoho CRM organization. Only one portal
        can be created per organization. The portal name must be unique across
        Zoho, between 6 and 30 characters.
      x-zs-llm-description: Create portal for the org. Throws exception if portal already exist.
      security:
        - OAuth2:
            - ZohoCRM.settings.clientportal.CREATE
      requestBody:
        content:
          application/json:
            schema:
              description: >-
                Represents the request body schema for creating a portal,
                containing the portal name.
              type: object
              additionalProperties: false
              properties:
                portals:
                  description: >-
                    Specify the list of portals to create. Only one portal is
                    allowed per request.
                  type: array
                  maxItems: 100
                  items:
                    description: Represents the configuration for a new portal.
                    type: object
                    additionalProperties: false
                    properties:
                      name:
                        description: >-
                          Specify the display name for the portal. The name must
                          be between 6 and 30 characters.
                        type: string
                        minLength: 6
                        maxLength: 30
                    required:
                      - name
              required:
                - portals
            examples:
              Default:
                value:
                  portals:
                    - name: examplePortal
                description: Shows a sample request body for creating a portal with a name.
                summary: Sample portal creation request
            x-zs-llm-examples:
              - Default
        required: true
        description: >-
          The request body must contain a **portals** array with exactly one
          portal object specifying the portal name. The name must be unique,
          between 6 and 30 characters.
      responses:
        '200':
          description: >-
            Returns the result of the portal creation, including the portal name
            and a SUCCESS status code.
          content:
            application/json:
              schema:
                description: >-
                  Represents the 200 response schema for a successful portal
                  creation, including the portal name and result code.
                x-zs-$id: CreatePortalSuccessResponse
                type: object
                additionalProperties: false
                properties:
                  portals:
                    description: Represents the list of created portals.
                    type: array
                    maxItems: 100
                    items:
                      description: Represents the creation result for a single portal.
                      type: object
                      additionalProperties: false
                      properties:
                        code:
                          description: >-
                            Represents the result code for the portal creation.

                            Possible values: **SUCCESS** - the portal creation
                            completed successfully. 
                          type: string
                          enum:
                            - SUCCESS
                        message:
                          description: >-
                            Represents the confirmation message for the portal
                            creation.
                          type: string
                          maxLength: 255
                        details:
                          description: Represents the details of the created portal.
                          type: object
                          additionalProperties: false
                          properties:
                            name:
                              description: Represents the name of the created portal.
                              type: string
                              maxLength: 30
                          required:
                            - name
                        status:
                          description: >-
                            Represents the overall status of the portal
                            creation.

                            Possible values: **success** - the operation
                            completed successfully. 
                          type: string
                          enum:
                            - success
                      required:
                        - code
                        - message
                        - details
                        - status
                required:
                  - portals
              examples:
                Default:
                  value:
                    portals:
                      - code: SUCCESS
                        message: Portal created successfully
                        details:
                          name: examplePortal
                        status: success
                  description: >-
                    Shows the response after a portal creation completes
                    successfully.
                  summary: Successful portal creation
        '400':
          description: >-
            The request is invalid. Possible causes include an invalid portal
            name format, a portal name that is already in use, a missing
            required field, or a sandbox restriction. Resolution: Review the
            error details and correct the request before retrying.
          content:
            application/json:
              schema:
                x-zs-$id: CreatePortalBadRequestResponseWrapper
                oneOf:
                  - description: >-
                      Represents the 403 error response when the authenticated
                      user lacks the required permission to create a portal.
                    x-zs-$id: CreatePortalBadRequestResponse
                    type: object
                    additionalProperties: false
                    properties:
                      portals:
                        description: >-
                          Represents the list of per-portal validation errors
                          returned when the request is invalid.
                        type: array
                        maxItems: 100
                        items:
                          description: >-
                            Represents the validation error object for a single
                            portal in the request.
                          type: object
                          additionalProperties: false
                          properties:
                            code:
                              description: >-
                                Represents the error code identifying the type
                                of validation failure.

                                Possible values: **INVALID_DATA** - a field
                                value is invalid or out of range.
                                **ALREADY_USED** - the portal name is already in
                                use. **MANDATORY_NOT_FOUND** - a required field
                                is missing. 
                              type: string
                              enum:
                                - ALREADY_USED
                                - PATTERN_NOT_MATCHED
                                - MANDATORY_NOT_FOUND
                                - INVALID_DATA
                                - NO_PERMISSION
                            message:
                              description: >-
                                Represents the error message describing the
                                validation failure.
                              type: string
                              maxLength: 255
                            details:
                              description: >-
                                Represents additional context about the
                                validation error.
                              type: object
                              additionalProperties: false
                              properties:
                                api_name:
                                  description: >-
                                    Represents the API name of the field that
                                    caused the validation error.
                                  type: string
                                  maxLength: 255
                                json_path:
                                  description: >-
                                    Represents the JSON Path location of the
                                    field that caused the validation error.
                                  type: string
                                  maxLength: 255
                                minimum_length:
                                  description: >-
                                    Represents the minimum required character
                                    length for the field.
                                  type: integer
                                  format: int32
                                maximum_length:
                                  description: >-
                                    Represents the maximum allowed character
                                    length for the field.
                                  type: integer
                                  format: int32
                                expected_data_type:
                                  description: >-
                                    Represents the expected data type for the
                                    field that failed validation.
                                  type: string
                                  maxLength: 255
                                regex:
                                  description: >-
                                    Represents the regular expression pattern
                                    the field value must match.
                                  type: string
                                  maxLength: 255
                                resource_path_index:
                                  description: >-
                                    Represents the index of the array item
                                    associated with the validation error.
                                  type: integer
                                  format: int32
                            status:
                              description: >-
                                Represents the overall response status.

                                Possible values: **error** - the request
                                encountered a validation error. 
                              type: string
                              enum:
                                - error
                          required:
                            - code
                            - message
                            - details
                            - status
                  - description: >-
                      Represents the API_NOT_SUPPORTED error returned when the
                      Create Portal API is called in a sandbox environment.
                    x-zs-$id: CreatePortalSandboxErrorResponse
                    type: object
                    additionalProperties: false
                    properties:
                      code:
                        description: >-
                          Represents the error code for this response.

                          Possible values: **API_NOT_SUPPORTED** - the API is
                          not supported in the current environment. 
                        type: string
                        enum:
                          - API_NOT_SUPPORTED
                      details:
                        description: Represents additional error context.
                        type: object
                        additionalProperties: false
                        properties:
                          unsupported_environment:
                            description: >-
                              Represents the environment type that does not
                              support this API.
                            type: string
                            maxLength: 255
                      message:
                        description: Represents the error message describing the failure.
                        type: string
                        maxLength: 255
                      status:
                        description: |-
                          Represents the overall response status.
                          Possible values: **error** - the request failed. 
                        type: string
                        enum:
                          - error
                    required:
                      - code
                      - message
                      - details
                      - status
                description: >-
                  Represents the 400 error response schema for portal creation,
                  covering per-portal validation errors and sandbox
                  restrictions.
              examples:
                Example1:
                  value:
                    portals:
                      - code: INVALID_DATA
                        details:
                          api_name: name
                          json_path: $.portals[0].name
                          minimum_length: 6
                        message: invalid data
                        status: error
                  description: >-
                    Shows the error response when a portal name field value is
                    invalid or out of range.
                  summary: INVALID_DATA - portal name validation error
                Example2:
                  value:
                    portals:
                      - code: ALREADY_USED
                        details:
                          api_name: name
                        message: The entered portal name is already in use
                        status: error
                  description: >-
                    Shows the error response when the specified portal name is
                    already in use by another organization.
                  summary: ALREADY_USED - portal name already in use
                Example3:
                  value:
                    portals:
                      - code: MANDATORY_NOT_FOUND
                        details:
                          api_name: name
                          json_path: $.portals[0].name
                        message: required field not found
                        status: error
                  description: >-
                    Shows the error response when the required portal name field
                    is missing from the request.
                  summary: MANDATORY_NOT_FOUND - required field missing
                ApiNotSupportedResponse1:
                  summary: API_NOT_SUPPORTED - sandbox environment
                  value:
                    code: API_NOT_SUPPORTED
                    details:
                      unsupported_environment: sandbox
                    message: api not supported in sandbox
                    status: error
                  description: >-
                    Shows the error response when the Create Portal API is
                    called in a sandbox environment, which is not supported.
        '403':
          description: >-
            The authenticated user does not have the required
            `ZohoCRM.settings.clientportal.CREATE` permission. Resolution:
            Ensure the access token includes the correct scope.
          content:
            application/json:
              schema:
                description: >-
                  Represents the NO_PERMISSION error returned when the
                  authenticated user lacks the required portal creation
                  permission.
                x-zs-$id: CreatePortalForbiddenResponse
                type: object
                additionalProperties: false
                properties:
                  code:
                    description: >-
                      Represents the error code for this response.

                      Possible values: **NO_PERMISSION** - the authenticated
                      user lacks the required permission. 
                    type: string
                    enum:
                      - NO_PERMISSION
                  message:
                    description: >-
                      Represents the error message describing the missing
                      permission.
                    type: string
                    maxLength: 255
                  details:
                    description: >-
                      Represents additional context about the missing
                      permission.
                    type: object
                    additionalProperties: false
                    properties:
                      permissions:
                        description: >-
                          Represents the list of required permission identifiers
                          that the user lacks.
                        type: array
                        maxItems: 100
                        items:
                          description: Represents a required permission identifier.
                          type: string
                          maxLength: 255
                  status:
                    description: |-
                      Represents the overall response status.
                      Possible values: **error** - the request failed. 
                    type: string
                    enum:
                      - error
                required:
                  - code
                  - message
                  - details
                  - status
              examples:
                Example1:
                  value:
                    code: NO_PERMISSION
                    details:
                      permissions:
                        - Crm_Implied_Manage_ClientPortal
                    message: Permission is invalid.
                    status: error
                  description: >-
                    Shows the error response when the authenticated user lacks
                    the required Create Portal permission and a specific
                    permission identifier is included.
                  summary: NO_PERMISSION - required permission missing
                Example2:
                  value:
                    code: NO_PERMISSION
                    details: {}
                    message: Permission is invalid.
                    status: error
                  description: >-
                    Shows the error response when the authenticated user lacks
                    the required Create Portal permission.
                  summary: NO_PERMISSION - insufficient portal permission
  /settings/portals/{portal}:
    get:
      summary: Specific Portal
      description: >-
        To retrieve the complete configuration of a specific portal in the Zoho
        CRM organization, including its SAML authentication settings, active
        status, and creation metadata.
      x-zs-llm-description: Retrieves portal details, returns 204 if portalname was invalid.
      operationId: getPortal
      parameters:
        - $ref: '#/components/parameters/Portals'
      security:
        - OAuth2:
            - ZohoCRM.settings.clientportal.READ
      responses:
        '200':
          description: >-
            Returns the complete configuration of the specified portal,
            including SAML settings and metadata.
          content:
            application/json:
              schema:
                description: >-
                  Represents the 200 response schema for getting a portal by
                  identifier, containing the full portal configuration.
                x-zs-$id: GetPortalDetailsResponse
                type: object
                additionalProperties: false
                properties:
                  portals:
                    description: >-
                      Represents the list of portal objects returned by the
                      response.
                    type: array
                    maxItems: 100
                    items:
                      description: >-
                        Represents the detailed configuration of a single
                        portal.
                      type: object
                      additionalProperties: false
                      properties:
                        name:
                          description: Represents the unique name of the portal.
                          type: string
                          maxLength: 50
                          x-zs-$id: PortalName
                        created_time:
                          description: >-
                            Represents the timestamp when the portal was first
                            added.
                          type: string
                          format: date-time
                        modified_time:
                          description: >-
                            Represents the timestamp when the portal
                            configuration was last modified.
                          type: string
                          format: date-time
                        modified_by:
                          description: >-
                            Represents the Zoho CRM user who last modified this
                            portal.
                          type: object
                          additionalProperties: false
                          properties:
                            name:
                              description: >-
                                Represents the name of the user who last
                                modified this portal.
                              type: string
                              maxLength: 255
                            id:
                              description: >-
                                Represents the unique identifier of the user who
                                last modified this portal.
                              type: string
                              maxLength: 255
                          required:
                            - name
                            - id
                        created_by:
                          description: >-
                            Represents the Zoho CRM user who created this
                            portal.
                          type: object
                          additionalProperties: false
                          properties:
                            name:
                              description: >-
                                Represents the name of the CRM user who created
                                this portal.
                              type: string
                              maxLength: 255
                            id:
                              description: >-
                                Represents the unique identifier of the CRM user
                                who created this portal.
                              type: string
                              maxLength: 255
                          required:
                            - name
                            - id
                        zaid:
                          description: >-
                            Represents the Zoho account ID (`zaid`) associated
                            with the portal.
                          type: string
                          maxLength: 255
                        active:
                          description: Indicates whether the portal is active.
                          type: boolean
                        saml_configuration:
                          description: >-
                            Represents the SAML authentication configuration for
                            the portal.
                          type:
                            - object
                            - 'null'
                          additionalProperties: false
                          properties:
                            login_url:
                              description: >-
                                Represents the SAML SSO login URL where the
                                portal redirects users for authentication.
                              type: string
                              maxLength: 2048
                            logout_url:
                              description: >-
                                Represents the SAML SSO logout URL where the
                                portal redirects users when they sign out. Must
                                begin with `https://www.`.
                              type: string
                              maxLength: 2048
                              pattern: http[s]://www[.][a-z]{7}[.]com
                            public_key:
                              description: >-
                                Represents the SAML X.509 public key certificate
                                used to verify assertions from the identity
                                provider.
                              type: string
                              maxLength: 5000
                              enum:
                                - >-
                                  -----BEGIN
                                  CERTIFICATE----------END
                                  CERTIFICATE-----
                            active:
                              description: >-
                                Indicates whether the SAML configuration is
                                active for the portal. Possible values: **true**
                                - SAML SSO is enabled.
                              type: boolean
                              enum:
                                - true
                            modified_by:
                              description: >-
                                Represents the Zoho CRM user who last modified
                                this SAML configuration.
                              type: object
                              additionalProperties: false
                              properties:
                                name:
                                  description: >-
                                    Represents the name of the user who last
                                    modified this SAML configuration.
                                  type: string
                                  maxLength: 255
                                id:
                                  description: >-
                                    Represents the unique identifier of the user
                                    who last modified this SAML configuration.
                                  type: string
                                  maxLength: 255
                              required:
                                - name
                                - id
                            created_by:
                              description: >-
                                Represents the Zoho CRM user who created this
                                SAML configuration.
                              type: object
                              additionalProperties: false
                              properties:
                                name:
                                  description: >-
                                    Represents the name of the CRM user who
                                    created this SAML configuration.
                                  type: string
                                  maxLength: 255
                                id:
                                  description: >-
                                    Represents the unique identifier of the CRM
                                    user who created this SAML configuration.
                                  type: string
                                  maxLength: 255
                              required:
                                - name
                                - id
                          required:
                            - login_url
                            - logout_url
                            - public_key
                            - active
                        login_url:
                          description: >-
                            Represents the login URL for the portal. Displayed
                            on the portal login page.
                          type: string
                          maxLength: 2048
                        acs_url:
                          description: >-
                            Represents the Assertion Consumer Service (ACS) URL
                            for the portal.
                          type: string
                          maxLength: 2048
                        admin_zuid:
                          description: >-
                            Represents the Zoho account zone ID of the portal
                            administrator.
