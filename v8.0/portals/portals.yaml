components:
  parameters:
    Portals:
      description: >-
        Specify the API name of the portal to retrieve or update. Use the Get
        Portals operation to retrieve the list of available portals and their
        names.
      name: portal
      in: path
      required: true
      schema:
        x-zs-$ref:
          resource: portals
          origins:
            - operationId: getPortals
              propertyId: PortalsName
        description: Represents the unique name of the portal.
        type: string
        maxLength: 60
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://accounts.zoho.com/oauth/v2/auth
          tokenUrl: https://accounts.zoho.com/oauth/v2/token
          refreshUrl: https://accounts.zoho.com/oauth/v2/token
          scopes:
            ZohoCRM.settings.clientportal.CREATE: >-
              Grants permission to create Client Portal settings in the Zoho CRM
              organization.
            ZohoCRM.settings.clientportal.READ: >-
              Grants read-only access to Client Portal settings in the Zoho CRM
              organization.
            ZohoCRM.settings.clientportal.UPDATE: >-
              Grants permission to update Client Portal settings in the Zoho CRM
              organization.
            ZohoCRM.settings.clientportal.DELETE: >-
              Grants permission to delete Client Portal settings in the Zoho CRM
              organization.
            ZohoCRM.settings.clientportal.ALL: >-
              Grants full read, create, update, and delete access to Client
              Portal settings in the Zoho CRM organization.
