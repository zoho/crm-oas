    delete:
      tags:
        - Holidays
      summary: Holiday
      description: >-
        To permanently delete a holiday from Zoho CRM using its unique
        identifier. The deletion cannot be undone.
      security:
        - OAuth2:
            - ZohoCRM.settings.business_hours.DELETE
      operationId: deleteHoliday
      parameters:
        - $ref: '#/components/parameters/HolidayId'
        - $ref: '#/components/parameters/Year'
      responses:
        '200':
          description: Returns the result of the delete operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HolidaysSuccessResponse'
              examples:
                Default:
                  value:
                    holidays: []
                  description: >-
                    Shows the response the API returns after deleting the
                    holiday successfully.
                  summary: Default response confirming holiday deletion
        '400':
          description: >-
            Invalid holiday ID. **Resolution** The holiday ID in the request
