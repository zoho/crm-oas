                              maxLength: 255
                              x-zs-$id: HolidayShiftHourId
                          required:
                            - name
                            - id
                          description: >-
                            Represents the shift hour associated with this
                            holiday. Contains null for business holidays. 
                          additionalProperties: false
                        id:
                          type: string
                          description: >-
                            Represents the unique identifier of the holiday
                            record. 
                          maxLength: 255
                          x-zs-$id: HolidayId
                        year:
                          type: integer
                          format: int32
                          description: 'Specifies the year in which the holiday falls. '
                      required:
                        - name
                        - date
                        - type
                        - shift_hour
                        - id
                        - year
                      description: Specifies a single holiday record in the response.
