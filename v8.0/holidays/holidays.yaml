security:
  - OAuth2:
      - ZohoCRM.settings.business_hours.READ
      - ZohoCRM.settings.business_hours.CREATE
      - ZohoCRM.settings.business_hours.UPDATE
      - ZohoCRM.settings.business_hours.DELETE
components:
  schemas:
    HolidaysSuccessResponse:
      type: object
      x-zs-$id: HolidaysSuccessResponse
      properties:
        holidays:
          type: array
          items:
            type: object
            properties:
              code:
                type: string
                enum:
                  - SUCCESS
                description: >-
                  Indicates the result code for the holiday operation. Possible
                  values: SUCCESS. 
              details:
                type: object
                properties:
                  id:
                    type: string
                    description: Represents the unique identifier of the created holiday.
                    maxLength: 255
                description: >-
                  Contains the details of the processed holiday, including its
                  unique identifier. 
                additionalProperties: false
              message:
                type: string
                description: 'Describes the result of the holiday creation operation. '
                maxLength: 255
              status:
                type: string
                enum:
                  - success
                description: >-
                  Indicates the status of the holiday creation operation.
                  Possible values: success. 
            required:
              - code
              - details
              - message
              - status
            description: Represents the result for a single holiday creation request.
            additionalProperties: false
          description: >-
            Contains the result for each holiday included in the create
            request. 
          maxItems: 100
      required:
        - holidays
      description: >-
        Represents the success response body the API returns after creating
        holidays.
      additionalProperties: false
    InvalidDataResponse:
      x-zs-$id: HolidaysErrorResponse400UpdateWithoutRoot
      type: object
      properties:
        code:
          type: string
          enum:
            - DUPLICATE_DATA
            - INVALID_DATA
            - DEPENDENT_FIELD_MISSING
          description: >-
            Indicates the validation error type. Possible values:
            DUPLICATE_DATA, INVALID_DATA, DEPENDENT_FIELD_MISSING.
        details:
          type: object
          description: Contains additional information about the validation error.
          additionalProperties: true
        message:
          type: string
          description: Describes the specific validation error that occurred.
          maxLength: 255
        status:
          type: string
          enum:
            - error
          description: 'Indicates the response status. Possible values: error.'
      description: >-
        Represents the error response body returned when a holiday request fails
        due to validation errors.
      additionalProperties: false
  parameters:
    Year:
      name: year
      in: query
      required: false
      description: Specify the year for which to filter holidays.
      schema:
        type: integer
        format: int32
        minimum: 2000
        maximum: 2100
        description: The Year of the object.
      examples:
        Current:
          value: 2024
          summary: Current year
        Next:
          value: 2025
          summary: Next year
    Type:
      name: type
      in: query
      required: false
      description: |-
        Specify the type of holidays to retrieve.
        Possible values: business_holiday, shift_holiday.
      schema:
        type: string
        enum:
          - business_holiday
          - shift_holiday
        description: The Type of the object.
      examples:
        Business:
          value: business_holiday
          summary: Business holidays
        Shift:
          value: shift_holiday
          summary: Shift holidays
    ShiftId:
      name: shift_id
      in: query
      required: false
      description: >-
        Specify the unique identifier of the shift hour whose holidays to
        retrieve. Required when the type parameter is set to shift_holiday.
      schema:
        type: string
        pattern: ^[0-9]+$
        minLength: 1
        maxLength: 30
        description: The Shift id of the object.
      examples:
        Default:
          value: '5725767000000296005'
          summary: Example shift ID
    HolidayId:
      name: holidayId
      in: path
      required: true
      description: Specify the unique identifier of the holiday.
      schema:
        type: string
        pattern: ^[0-9]+$
        minLength: 1
        maxLength: 30
        description: The Holiday id of the object.
      examples:
        Default:
          value: '5725767000000525001'
          summary: Example holiday ID
  responses:
    HolidaysMultiStatusResponse:
      description: >-
        Returned when a batch request partially succeeds — some items succeed
        and some fail. Each item in the holidays array carries its own code,
        status, message, and details.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HolidaysSuccessResponse'
          examples:
            Default:
              value:
                holidays:
                  - code: SUCCESS
                    details:
                      id: '12345'
                    message: Holiday created successfully
                    status: success
              description: >-
                Example multi-status response where some items succeed and
                others fail.
              summary: An example multi-status response.
    ForbiddenError:
      description: >-
        The user does not have sufficient permission to perform the requested
        operation. **Resolution** The CRM administrator must grant the required
        permission to the user's profile.
      content:
        application/json:
          schema:
            type: object
            x-zs-$id: HolidaysForbiddenError
            properties:
              code:
                type: string
                enum:
                  - NO_PERMISSION
                description: >-
                  Indicates the error code for the permission violation.
                  Possible values: NO_PERMISSION. 
              details:
                type: object
                description: Contains additional information about the permission error.
                additionalProperties: true
              message:
                type: string
                description: >-
                  Describes the specific permission requirement that was not
                  met. 
                maxLength: 255
              status:
                type: string
                enum:
                  - error
                description: 'Indicates the response status. Possible values: error. '
            required:
              - code
              - message
              - status
            description: >-
              Represents the error response body returned when the user lacks
              permission to perform the requested operation.
            additionalProperties: false
          examples:
            NoPermission:
              value:
                code: NO_PERMISSION
                details: {}
                message: Permission to read holiday data is required
                status: error
              description: >-
                Shows the error response when a user lacks the CRM profile
                permission required to access holiday data.
              summary: No permission to access holiday data
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://accounts.zoho.com/oauth/v2/auth
          tokenUrl: https://accounts.zoho.com/oauth/v2/token
          refreshUrl: https://accounts.zoho.com/oauth/v2/token
          scopes:
            ZohoCRM.settings.business_hours.UPDATE: Grants permission to update holiday records in Zoho CRM.
            ZohoCRM.settings.business_hours.CREATE: Grants permission to create holiday records in Zoho CRM.
            ZohoCRM.settings.business_hours.READ: >-
              Grants permission to retrieve holiday and business hours settings
              in Zoho CRM.
            ZohoCRM.settings.business_hours.DELETE: Grants permission to delete holiday records in Zoho CRM.
