                  summary: Holiday date outside allowed range
                InvalidDataSpecialChars:
                  value:
                    holidays:
                      - code: INVALID_DATA
                        details:
                          api_name: name
                          json_path: $.holidays[0].name
                        message: >-
                          Holiday Name should not contain special characters:#,
                          %, ^, &, *
                        status: error
                  description: >-
                    Shows the error when the updated holiday name contains
                    disallowed special characters.
                  summary: Holiday name contains invalid special characters
                InvalidDataDateFormat:
                  value:
                    holidays:
                      - code: INVALID_DATA
                        details:
                          expected_data_type: date
                          api_name: date
                          json_path: $.holidays[0].date
                        message: invalid data
                        status: error
                  description: >-
                    Shows the error when the updated date does not conform to
                    the expected date format.
                  summary: Holiday date in invalid format
    get:
      tags:
        - Holidays
      summary: A specific holiday
      description: >-
        To retrieve the complete details of a specific holiday record from Zoho
        CRM using its unique identifier.
      security:
        - OAuth2:
            - ZohoCRM.settings.business_hours.READ
      operationId: getHoliday
      parameters:
        - $ref: '#/components/parameters/HolidayId'
        - $ref: '#/components/parameters/Year'
        - $ref: '#/components/parameters/Type'
        - $ref: '#/components/parameters/ShiftId'
      responses:
        '200':
          description: Returns the details of the requested holiday record.
          content:
            application/json:
              schema:
                type: object
                x-zs-$id: HolidaysSuccessResponseGet
                properties:
                  holidays:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                          maxLength: 80
                          description: 'Represents the name of the holiday. '
                        date:
                          type: string
                          format: date
                          description: >-
                            Represents the date of the holiday in **YYYY-MM-DD**
                            format. 
                        type:
                          type: string
                          enum:
                            - business_holiday
                            - shift_holiday
                          description: >-
                            Indicates the type of holiday. Possible values:
                            **business_holiday, shift_holiday**. 
                        shift_hour:
                          type:
                            - object
                            - 'null'
                          properties:
                            name:
                              type: string
                              description: >-
                                Represents the name of the shift hour. Always
