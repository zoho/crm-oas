                          additionalProperties: false
                        message:
                          type: string
                          description: >-
                            Describes the result of the holiday update
                            operation. 
                          maxLength: 255
                        status:
                          type: string
                          enum:
                            - success
                          description: >-
                            Indicates the status of the holiday update. Possible
                            values: success. 
                      required:
                        - code
                        - details
                        - message
                        - status
                      description: Represents the update result for the holiday record.
                      additionalProperties: false
                    description: 'Contains the result for the updated holiday. '
                    maxItems: 100
                required:
                  - holidays
                description: >-
                  Represents the response body the API returns after updating
