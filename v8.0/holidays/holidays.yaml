                  minItems: 1
                  maxItems: 1
                  items:
                    type: object
                    properties:
                      name:
                        type:
                          - string
                          - 'null'
                        description: Specify the new name for the holiday.
                        maxLength: 80
                        minLength: 1
                        pattern: ^[^#%^&*]+$
                      date:
                        type:
                          - string
                          - 'null'
                        format: date
                        description: >-
                          Specify the new date for the holiday in **YYYY-MM-DD**
                          format.
                    description: Specify the fields to update for the holiday.
                    additionalProperties: false
              description: >-
                Represents the request body schema for updating a single
                holiday.
              additionalProperties: false
            examples:
              Default:
                value: {}
                description: Shows the request body used to update the holiday record.
                summary: Default success response after updating a holiday
            x-zs-llm-examples:
              - Default
        required: true
      responses:
        '200':
          description: Returns the result of the holiday update operation.
          content:
            application/json:
              schema:
                type: object
                x-zs-$id: HolidaysSuccessResponseUpdateSingle
