  /settings/holidays/{holidayId}:
    put:
      tags:
        - Holidays
      summary: A specific holiday
      description: >-
        To update the name or date of a specific holiday record in Zoho CRM
        using its unique identifier.
      security:
        - OAuth2:
            - ZohoCRM.settings.business_hours.UPDATE
      operationId: updateHoliday
      parameters:
        - $ref: '#/components/parameters/HolidayId'
      requestBody:
        description: The request body must contain a holidays array with one object.
        content:
          application/json:
            schema:
              type: object
