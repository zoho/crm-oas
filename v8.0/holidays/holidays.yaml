                        maxItems: 100
                    required:
                      - holidays
                  - $ref: '#/components/schemas/InvalidDataResponse'
                description: >-
                  Represents the error response body returned when the holiday
                  update fails validation.
              examples:
                DuplicateData:
                  value:
                    holidays:
                      - code: DUPLICATE_DATA
                        details:
                          api_name: name
                          json_path: $.holidays[0].name
                        message: duplicate data
                        status: error
                  description: >-
                    Shows the error when the updated holiday name already exists
                    for another holiday.
                  summary: Duplicate holiday name
                InvalidDataMaxLength:
                  value:
                    holidays:
                      - code: INVALID_DATA
                        details:
                          maximum_length: 80
                          api_name: name
                          json_path: $.holidays[0].name
                        message: invalid data
                        status: error
                  description: >-
                    Shows the error when the updated holiday name exceeds the
                    maximum allowed length.
                  summary: Holiday name exceeds maximum length
                InvalidDataDateRange:
                  value:
                    holidays:
                      - code: INVALID_DATA
                        details:
                          api_name: date
                          json_path: $.holidays[0].date
                        message: Date Should be between current and next financial year
                        status: error
                  description: >-
                    Shows the error when the updated date falls outside the
