        Single success item after creation. Contains status, code, message, and
        details with the new notification's ID.
      properties:
        code:
          type: string
          description: >-
            Represents the result code for the email notification creation
            operation.

            Possible values:

            SUCCESS - The email notification action was created successfully.
          enum:
            - SUCCESS
        details:
          $ref: '#/components/schemas/CreateEmailNotificationSuccessDetails'
        message:
          type: string
          description: >-
            Represents the success message returned after the email notification
            action is created.
          example: alert created successfully
          maxLength: 255
        status:
          type: string
          description: |-
            Represents the status of the email notification creation operation.
            Possible values:
            success - The email notification action was created successfully.
          enum:
            - success
      required:
        - code
        - details
        - message
        - status
      title: Create Email Notification Success Item
    CreateEmailNotificationSuccessDetails:
      type: object
      x-zs-$id: CreateEmailNotificationSuccessDetails
      additionalProperties: false
      description: Identifier details returned for the created email notification action.
      x-zs-llm-description: >-
        Contains the id of the newly created email notification. Use this ID for
