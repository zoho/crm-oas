          maxLength: 255
        status:
          type: string
          description: |-
            Represents the status of the delete operation.
            Possible values:
            success - The delete operation was completed successfully.
          enum:
            - success
      required:
        - code
        - details
        - message
        - status
      title: Single Delete Success Item
    SingleDeleteInvalidDataError:
      type: object
      x-zs-$id: SingleDeleteInvalidDataError
      additionalProperties: false
      description: >-
        Represents the error response returned when the provided email
        notification ID is invalid.
      x-zs-llm-description: >-
        The notification ID in the path does not exist or is malformed. Verify
        the ID via GET list before retrying.
      properties:
        code:
          type: string
          description: >-
            Represents the error code indicating the type of failure that
            occurred.

            Possible values:

