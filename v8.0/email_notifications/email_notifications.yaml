    delete:
      summary: Delete Email Notifications
      description: >-
        To delete one or more email notifications configured in your Zoho CRM
        organization. Email notifications associated with an Approval Process,
        Workflow Rule, Blueprint, or CommandCenter automation cannot be deleted
        until they are disassociated from the corresponding automation.
      x-zs-llm-description: >-
        Bulk-deletes email notification definitions by their IDs; supply ids as
        a comma-separated query parameter. Notifications linked to active
        workflow rules, approval processes, or blueprints are rejected with
        NOT_ALLOWED. The response reports success or error per notification. Use
        GET /settings/automation/email_notifications to look up IDs first.
      operationId: deleteEmailNotifications
      parameters:
        - $ref: '#/components/parameters/ParamQueryIds'
      responses:
        '200':
          description: >-
            Returns the deletion results for all requested email notification
            IDs. Each item in the response array confirms a successful deletion
            with a SUCCESS code and the corresponding notification ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkDeleteSuccessResponse'
              examples:
                Success200:
                  summary: Successful bulk delete of all requested email notifications
                  value:
                    email_notifications:
                      - code: SUCCESS
                        details:
                          id: '6660682000001430003'
                        message: email notification deleted successfully
                        status: success
                      - code: SUCCESS
                        details:
                          id: '6660682000001445001'
                        message: email notification deleted successfully
                        status: success
                      - code: SUCCESS
                        details:
                          id: '6660682000001430012'
                        message: email notification deleted successfully
                        status: success
          headers:
            X-API-CREDITS-REMAINING:
              schema:
                type: string
                format: int64
                description: >
                  Present when >=50% of base daily credits (excluding add-on
                  credits) are consumed. Value is total remaining credits
                  including add-on credits for the rolling 24-hour window.
              required: false
        '207':
          description: >-
            Returns a multi-status response. Each item in the array
            independently indicates success or failure for the corresponding
            email notification ID in the request. Successful deletions return a
            SUCCESS code, while failed items include an INVALID_DATA or
            NOT_ALLOWED code with details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkDeleteMixedResponse'
              examples:
                Success207:
                  summary: Bulk delete with mixed success and failure results
                  value:
                    email_notifications:
                      - code: SUCCESS
                        details:
                          id: '111112000000035041'
                        message: email_notifications deleted successfully
                        status: success
                      - code: INVALID_DATA
                        details:
                          id: '111113000000121918'
                        message: the id given seems to be invalid
                        status: error
                      - code: INVALID_DATA
                        details:
                          id: '111113000000121973'
                        message: the id given seems to be invalid
                        status: error
                      - code: NOT_ALLOWED
                        details:
                          id: '111113000000071904'
                        message: >-
                          This email notification is associated with at least
                          one of Approval Process/Workflow Rules/Blueprint
                        status: error
          headers:
            X-API-CREDITS-REMAINING:
              schema:
                type: string
                format: int64
                description: >
                  Present when >=50% of base daily credits (excluding add-on
                  credits) are consumed. Value is total remaining credits
                  including add-on credits for the rolling 24-hour window.
              required: false
        '400':
          description: >-
            The bulk delete operation failed for all provided IDs. Resolution:
            Each requested email notification ID must be valid and must not be
            associated with an Approval Process, Workflow Rule, Blueprint, or
            CommandCenter automation before deletion is attempted.
          content:
            application/json:
              schema:
                x-zs-$id: DeleteEmailNotificationErrorResponseCore2Wrapper
                $ref: '#/components/schemas/BulkDeleteErrorResponse'
              examples:
                NotAllowedResponse1:
                  summary: Bulk delete failure with INVALID_DATA for all requested IDs
                  value:
                    email_notifications:
                      - code: INVALID_DATA
                        details:
                          id: '111113000000122012'
                        message: the id given seems to be invalid
                        status: error
                      - code: INVALID_DATA
                        details:
                          id: '111113000000121918'
                        message: the id given seems to be invalid
                        status: error
                      - code: INVALID_DATA
                        details:
                          id: '111113000000121973'
                        message: the id given seems to be invalid
                        status: error
                      - code: NOT_ALLOWED
                        details:
                          id: '111113000000071904'
                        message: >-
                          This email notification is associated with at least
                          one of Approval Process/Workflow Rules/Blueprint
                        status: error
          headers:
            X-API-CREDITS-REMAINING:
              schema:
                type: string
                format: int64
                description: >
                  Present when >=50% of base daily credits (excluding add-on
                  credits) are consumed. Value is total remaining credits
                  including add-on credits for the rolling 24-hour window.
              required: false
        '403':
          description: >-
            Permission denied to delete email notifications. Resolution: The CRM
