          maxItems: 100
        cc:
          type: array
          description: >-
            Represents the CC recipients of the email notification. Supported
            only when bulk_email is set to true.
          items:
            $ref: '#/components/schemas/DirectRecipients'
          maxItems: 50
        bcc:
          type: array
          description: >-
            Represents the BCC recipients of the email notification. Supported
            only when bulk_email is set to true.
