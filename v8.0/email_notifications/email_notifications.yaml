    delete:
      summary: Delete an Email Notification by ID
      description: >-
        Deletes a single email notification configured in your Zoho CRM
        organization. Email notifications associated with an Approval Process,
        Workflow Rules, or Blueprint cannot be deleted until they are
        disassociated from the corresponding automation.
      x-zs-llm-description: >-
        Removes a single email notification definition by the id path param.
        Notifications tied to active workflow rules, approval processes, or
        blueprints are blocked with NOT_ALLOWED. The response indicates success
        or error for the deletion.
      operationId: deleteEmailNotificationById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            maxLength: 20
          description: >-
            Specify the unique ID of the email notification to delete. 
            Notifications associated with active automation cannot be deleted  -
            returns NOT_ALLOWED
      responses:
        '200':
          description: >-
            Returns the result of the delete operation for the specified email
            notification.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SingleDeleteSuccessResponse'
              examples:
                Success200:
                  summary: Successful deletion of a single email notification
                  value:
                    email_notifications:
                      - code: SUCCESS
                        details:
                          id: '111113000000122050'
                        message: email notification is deleted
                        status: success
          headers:
            X-API-CREDITS-REMAINING:
              schema:
                type: string
                format: int64
                description: >
                  Present when >=50% of base daily credits (excluding add-on
                  credits) are consumed. Value is total remaining credits
                  including add-on credits for the rolling 24-hour window.
              required: false
        '400':
          description: >-
            The provided email notification ID is invalid, or the email
            notification is associated with at least one of an Approval Process,
            Workflow Rules, or Blueprint. Resolution: The email notification
            must be disassociated from the corresponding automation before it
            can be deleted.
          content:
            application/json:
              schema:
                x-zs-$id: DeleteEmailNotificationByIdErrorResponse
                oneOf:
                  - $ref: '#/components/schemas/SingleDeleteInvalidDataError'
                  - $ref: '#/components/schemas/SingleDeleteNotAllowedError'
              examples:
                InvalidDataResponse1:
                  summary: INVALID_DATA error when the email notification ID is invalid
                  value:
                    code: INVALID_DATA
                    details:
                      resource_path_index: 3
                    message: the id given seems to be invalid
                    status: error
                NotAllowedResponse1:
                  summary: >-
                    NOT_ALLOWED error when the notification is linked to an
                    automation rule
                  value:
                    code: NOT_ALLOWED
                    details:
                      resource_path_index: 3
                    message: >-
                      This email notification is associated with at least one of
                      Approval Process/Workflow Rules/Blueprint
                    status: error
          headers:
            X-API-CREDITS-REMAINING:
              schema:
                type: string
                format: int64
                description: >
                  Present when >=50% of base daily credits (excluding add-on
                  credits) are consumed. Value is total remaining credits
                  including add-on credits for the rolling 24-hour window.
              required: false
        '403':
          description: >-
            Permission denied to delete email notifications. Resolution: The CRM
            administrator must grant the manage workflow permission to the
            user's profile.
          content:
            application/json:
              schema:
                x-zs-$id: DeleteEmailNotificationByIdAuthorizationErrorResponse
                $ref: '#/components/schemas/PermissionDeniedError'
              examples:
                NoPermissionResponse1:
                  summary: >-
                    NO_PERMISSION error when the user lacks manage workflow
                    permission
                  value:
                    code: NO_PERMISSION
                    details:
                      permissions:
                        - Crm_Implied_manage_workflow
                    message: permission denied
                    status: error
          headers:
            X-API-CREDITS-REMAINING:
              schema:
                type: string
                format: int64
                description: >
                  Present when >=50% of base daily credits (excluding add-on
                  credits) are consumed. Value is total remaining credits
                  including add-on credits for the rolling 24-hour window.
              required: false
      security:
        - OAuth2:
            - ZohoCRM.settings.automation_actions.DELETE
  /settings/automation/email_notifications/actions/usage_reports:
    get:
      summary: Get Email Notification Action Usage Reports
      description: >-
        Retrieves usage statistics for email notification actions executed in
        your Zoho CRM organization over a specified date range, grouped by date,
        resource, or type according to the group_by parameter.
      x-zs-llm-description: >-
        PURPOSE: Returns daily usage counts for workflow email notification
        actions, optionally grouped by resource and action type. MANDATORY:
        group_by query parameter (must include 'date'). Two combinations
        accepted: 'date' alone (daily totals across all alerts) or
        'date,resource' (per-action rows with resource id/name). OPTIONAL: type
        (filter by automation context), from/to (date range in yyyy-MM-dd, org
        time zone, defaults to last 30 days), page, per_page (pagination),
        sort_order (asc/desc), include_inner_details (adds nested fields like
        resource.layout_id). Future dates return 400.
      operationId: getEmailNotificationUsageReports
      parameters:
        - $ref: '#/components/parameters/ParamQueryGroupBy'
        - $ref: '#/components/parameters/ParamQueryType'
        - $ref: '#/components/parameters/ParamQueryFrom'
        - $ref: '#/components/parameters/ParamQueryTo'
        - $ref: '#/components/parameters/ParamQueryPage'
        - $ref: '#/components/parameters/ParamQueryPerPage'
        - $ref: '#/components/parameters/ParamQuerySortOrder'
        - $ref: '#/components/parameters/ParamQueryUsageIncludeInnerDetails'
      responses:
        '200':
          description: >-
            Returns the email notification action usage statistics grouped
            according to the group_by parameter. The data_usage array contains
            one entry per action per day when group_by includes resource, or one
            entry per day when group_by is date only. The info object includes
            pagination details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutomationUsageReportResponse'
              examples:
                SuccessGroupByDateResource:
                  summary: >-
                    Usage grouped by date and resource, with per-action rows in
                    the response
                  value:
                    data_usage:
                      - date: '2025-10-23'
                        resource:
                          name: WF-C
                          id: '4876876000010792012'
                        count: 1
                        type: email_notifications
                      - date: '2025-10-21'
                        resource:
                          name: WF-C
                          id: '4876876000010792012'
                        count: 1
                        type: email_notifications
                      - date: '2025-10-17'
                        resource:
                          name: High revenue Lead added
                          id: '4876876000016390103'
                        count: 7
                        type: email_notifications
                      - date: '2025-10-17'
                        resource:
                          name: WF-C
                          id: '4876876000010792012'
                        count: 2
                        type: email_notifications
                    info:
                      max_limit: 2500
                      per_page: 200
                      count: 4
                      page: 1
                      more_records: false
                SuccessGroupByDateOnly:
                  summary: >-
                    Usage grouped by date only, with no resource object in the
                    response
                  value:
                    data_usage:
                      - date: '2025-10-23'
                        count: 1
                        type: email_notifications
                      - date: '2025-10-17'
                        count: 9
                        type: email_notifications
                    info:
                      max_limit: 2500
                      per_page: 200
                      count: 2
                      page: 1
                      more_records: false
          headers:
            X-API-CREDITS-REMAINING:
              schema:
                type: string
                format: int64
                description: >
                  Present when >=50% of base daily credits (excluding add-on
                  credits) are consumed. Value is total remaining credits
                  including add-on credits for the rolling 24-hour window.
              required: false
        '400':
          description: >-
            One of the expected parameters is missing or invalid. Resolution:
            The group_by parameter must be included and must contain date. The
            type parameter must use a supported value. Date values must not be
            in the future.
          content:
            application/json:
              schema:
                x-zs-$id: GetUsageReportsErrorResponseSchema
                oneOf:
                  - $ref: >-
                      #/components/schemas/AutomationUsageRequiredParamMissingError
                  - $ref: '#/components/schemas/AutomationUsageInvalidDataError'
              examples:
                RequiredParamMissingResponse1:
                  summary: >-
                    REQUIRED_PARAM_MISSING error when group_by parameter is
                    absent
                  value:
                    code: REQUIRED_PARAM_MISSING
                    details:
                      param_name: group_by
                    message: One of the expected param is missing
                    status: error
                InvalidDataResponse1:
                  summary: >-
                    INVALID_DATA error when an unsupported value is provided for
                    the type parameter
                  value:
                    code: INVALID_DATA
                    details:
                      param_name: type
                    message: provided param is invalid
                    status: error
                InvalidDataResponse2:
                  summary: >-
                    INVALID_DATA error when a future date is provided for the
                    date range parameters
                  value:
                    code: INVALID_DATA
                    details:
                      param_name: date
                    message: provided time is ahead
                    status: error
                InvalidDataResponse3:
                  summary: >-
                    INVALID_DATA error when an invalid value is provided for the
                    page parameter
                  value:
                    code: INVALID_DATA
                    details:
                      param_name: page
                    message: provided param is invalid
                    status: error
          headers:
            X-API-CREDITS-REMAINING:
              schema:
                type: string
                format: int64
                description: >
                  Present when >=50% of base daily credits (excluding add-on
                  credits) are consumed. Value is total remaining credits
                  including add-on credits for the rolling 24-hour window.
              required: false
        '403':
          description: >-
            Permission denied to retrieve email notification usage reports.
            Resolution: The CRM administrator must grant the manage workflow
            permission to the user's profile.
          content:
            application/json:
              schema:
                x-zs-$id: GetUsageReportsNoPermissionResponseWrapper
                $ref: '#/components/schemas/AutomationUsageNoPermissionError'
              examples:
                NoPermissionResponse1:
                  summary: >-
                    NO_PERMISSION error due to missing manage workflow
                    permission
                  value:
                    code: NO_PERMISSION
                    details:
                      permissions:
                        - Crm_Implied__Manage_Workflow
                    message: permission denied
                    status: error
          headers:
            X-API-CREDITS-REMAINING:
              schema:
                type: string
                format: int64
                description: >
                  Present when >=50% of base daily credits (excluding add-on
                  credits) are consumed. Value is total remaining credits
                  including add-on credits for the rolling 24-hour window.
              required: false
      security:
        - OAuth2:
            - ZohoCRM.settings.automation_actions.READ
components:
  schemas:
    AmbiguityInModuleError:
      type: object
      x-zs-$id: AmbiguityInModuleError
      additionalProperties: false
      description: >-
        Represents an error response returned when an ambiguity related to a
        module is detected during processing.
      x-zs-llm-description: >-
        Retry after resolving module ambiguity. Check if multiple modules match
        the given name and specify the exact module api_name.
      properties:
        code:
          type: string
          description: >-
            Represents the error code indicating that an ambiguity was
            encountered during module processing.

            Possible values:

            AMBIGUITY_DURING_PROCESSING - An ambiguity was detected while
            processing the module-related request.
          enum:
            - AMBIGUITY_DURING_PROCESSING
        details:
          type: object
          additionalProperties: false
          description: >-
            Represents the error details containing information about the
            ambiguities detected during module processing.
          properties:
            ambiguity_due_to:
              type: array
              description: >-
                Represents the list of items that caused the ambiguity during
                module processing.
              items:
                type: object
                additionalProperties: false
                description: >-
                  Represents an individual item that contributed to the
                  ambiguity detected during module processing, including its API
                  name and the JSON path where the conflict occurred.
                properties:
                  api_name:
                    type: string
                    description: >-
                      Represents the API name of the field or module that caused
                      the ambiguity.
                    maxLength: 255
                  json_path:
                    type: string
                    description: >-
                      Represents the JSON path to the field or property that
                      caused the ambiguity during processing.
                    maxLength: 1000
              maxItems: 25
        message:
          type: string
          description: >-
            Represents the error message describing the ambiguity encountered
            during module processing.
          example: required field not found
          maxLength: 255
        status:
          type: string
          description: >-
            Represents the status of the API response for this error.

            Possible values:

            error - Indicates that the request failed due to an ambiguity
            detected during module processing.
          enum:
            - error
      required:
        - code
        - details
        - message
        - status
      title: Ambiguity In Module Error
    LockedNotificationEditError:
      type: object
      x-zs-$id: LockedNotificationEditError
      additionalProperties: false
      description: >-
        Represents the error response returned when an attempt is made to edit a
        locked email notification, indicating an authorization error.
      x-zs-llm-description: >-
        The notification is locked by a parent automation
        (workflow/blueprint/approval). Unlock the parent rule or create a new
        notification instead of editing this one.
      properties:
        code:
          type: string
          description: >-
            Represents the error code indicating the type of error that
            occurred.

            Possible values:

            AUTHORIZATION_ERROR - The request was rejected because the email
            notification is locked and cannot be edited.
          enum:
            - AUTHORIZATION_ERROR
        details:
          type: object
          additionalProperties: false
          description: >-
            Represents the additional details associated with the authorization
            error for the locked email notification.
          properties: {}
        message:
          type: string
          description: >-
            Represents the error message describing why the email notification
            could not be edited.
          example: Insufficient privileges to perform this operation
          maxLength: 255
        status:
          type: string
          description: >-
            Represents the status of the API response for the locked
            notification edit attempt.

            Possible values:

            error - Indicates that the request failed due to an authorization
            error.
          enum:
            - error
      required:
        - code
        - details
        - message
        - status
      title: Locked Notification Edit Error
    UnauthorizedError:
      type: object
      x-zs-$id: UnauthorizedError
      additionalProperties: false
      description: >-
        Represents an unauthorized error response returned when the user lacks
        the required privilege to perform the requested operation.
      x-zs-llm-description: >-
        Caller lacks the required privilege. Verify the user has Automation or
        Workflow permission in their profile before retrying.
      properties:
        code:
          type: string
          description: >-
            Represents the error code indicating the authorization failure.

            Possible values:

            unauthorized - The request lacks valid authorization credentials to
            perform this operation.
          enum:
            - unauthorized
        details:
          type: object
          additionalProperties: false
          description: Represents additional details about the authorization error.
        message:
          type: string
          description: Represents the error message describing the authorization failure.
          example: Insufficient privileges to perform this operation.
          maxLength: 255
        status:
          type: string
          description: >-
            Represents the status of the response, indicating that an error
            occurred.

            Possible values:

            error - The request was not processed due to an authorization
            failure.
          enum:
            - error
      required:
        - code
        - details
        - message
        - status
      title: Unauthorized Error
    ModuleDetails:
      type: object
      additionalProperties: false
      description: >-
        Represents the CRM module associated with an email notification
        definition. Both api_name and id are required and must refer to the same
        module. Refer to the [Get
        Modules](modules.yaml#$.paths./settings/modules.get) resource for valid
        values.
      x-zs-llm-description: >-
        Carries the module context for the notification action; both api_name
        and id are required and must refer to the same module  a mismatch causes
        AMBIGUITY_DURING_PROCESSING. Discover available modules and their IDs
        via GET /settings/modules.
      properties:
        api_name:
          type: string
          description: >-
            Represents the API name of the CRM module whose records trigger the
            email notification. For example, Leads, Contacts, or Deals. Both
            api_name and id must refer to the same module.
          maxLength: 255
          example: Leads
        id:
          type: string
          description: >-
            Represents the unique numeric identifier of the CRM module. Both id
            and api_name must refer to the same module.
          maxLength: 255
          example: '4876876000000002179'
      required:
        - api_name
        - id
      title: Module Details
    RelatedModuleDetails:
      type:
        - object
        - 'null'
      additionalProperties: false
      description: >-
        Represents the related module metadata for automation contexts that
        operate on related records. Null when no related module context applies.
      x-zs-llm-description: >-
        Nullable  present only when the notification operates on a related
        module's records. Null means the notification targets the primary module
        directly.
      properties:
        api_name:
          type: string
          description: >-
            Represents the API name of the related CRM module used in the
            automation configuration, for example, Notes.
          maxLength: 255
          example: Notes
        id:
          type: string
          description: >-
            Represents the unique identifier of the related CRM module that
            corresponds to the api_name value.
          maxLength: 255
          example: '4876876000000002391'
      title: Related Module Details
    ModifiedBy:
      type: object
      additionalProperties: false
      description: >-
        Represents the last person who modified a resource, including their name
        and unique identifier.
      x-zs-llm-description: >-
        Read-only audit field. Contains the user who last updated this
        notification.
      properties:
        name:
          type: string
          description: Represents the full name of the user who last modified the resource.
          maxLength: 255
        id:
          type: string
          description: >-
            Represents the unique identifier of the user who last modified the
            resource.
          maxLength: 255
      title: Modified By
    NameLengthExceededError:
      type: object
      x-zs-$id: NameLengthExceededError
      additionalProperties: false
      description: >-
        Represents the error response returned when the length of a specified
        name exceeds the defined character limit.
      x-zs-llm-description: >-
        Shorten the notification name and retry. The maximum allowed length is
        indicated in the error details.
      properties:
        code:
          type: string
          description: >-
            Represents the error code indicating the nature of the failure.

            Possible values:

            INVALID_DATA - The request contains invalid data, such as a name
            that exceeds the allowed character limit.
          enum:
            - INVALID_DATA
        details:
          type: object
          additionalProperties: false
          description: >-
            Represents the details of the validation error, including the field
            API name, the JSON path of the invalid field, and the maximum
            character limit that was exceeded.
          properties:
            api_name:
              type: string
              description: >-
                Represents the API name of the field for which the name length
                limit was exceeded.
              maxLength: 255
            json_path:
              type: string
              description: >-
                Represents the JSON path of the field in the request body for
                which the name length limit was exceeded.
              maxLength: 1000
            maximum_limit:
              type: integer
              format: int32
              description: >-
                Represents the maximum number of characters allowed for the
                field name that was exceeded in the request.
        message:
          type: string
          description: Represents the error message describing why the request failed.
          example: The lenght of name has exceeded the limit
          maxLength: 255
        status:
          type: string
          description: >-
            Represents the status of the API response for this error.

            Possible values:

            error - Indicates that the request failed due to the name length
            exceeding the allowed limit.
          enum:
            - error
      required:
        - code
        - details
        - message
