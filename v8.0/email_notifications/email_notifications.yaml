            Possible values:

            AMBIGUITY_DURING_PROCESSING - An ambiguity was detected while
            processing the bulk email CC or BCC configuration.
          enum:
            - AMBIGUITY_DURING_PROCESSING
        details:
          type: object
          additionalProperties: false
          description: >-
            Represents the error details containing information about the fields
            that caused the ambiguity during bulk email CC or BCC configuration.
          properties:
            ambiguity_due_to:
              type: array
              description: >-
                Represents the list of fields that caused the ambiguity during
                bulk email CC or BCC configuration processing.
              items:
                type: object
                additionalProperties: false
                description: >-
                  Represents an individual field that contributed to the
                  ambiguity detected during bulk email CC or BCC configuration
                  processing.
                properties:
                  api_name:
                    type: string
                    description: >-
                      Represents the API name of the field that caused the
                      ambiguity during bulk email CC or BCC configuration
                      processing.
                    maxLength: 255
                  json_path:
                    type: string
                    description: >-
                      Represents the JSON path to the field that caused the
                      ambiguity during bulk email CC or BCC configuration
                      processing.
                    maxLength: 1000
              maxItems: 25
        message:
          type: string
          description: >-
            Represents the error message describing the ambiguity encountered
            during bulk email CC or BCC configuration processing.
          example: Set bulk_email as true to pass cc
          maxLength: 255
        status:
          type: string
          description: >-
            Represents the status of the response, indicating that an error
            occurred.

            Possible values:

            error - The request resulted in an error due to ambiguous CC or BCC
            configuration in bulk email settings.
          enum:
            - error
      required:
        - code
        - details
        - message
        - status
      title: Bulk Email CC Configuration Error
    NewEmailNotificationResponse:
      type: object
      additionalProperties: false
      description: >-
        Represents the response returned when a new email notification is
        created successfully, including the status code, status, and outcome
        message.
      x-zs-llm-description: >-
        Alternative success response structure for notification creation. Check
        the inner items for the created notification ID.
      properties:
        code:
          type: string
          description: >-
            Represents the status code returned after the email notification is
            created successfully.
          maxLength: 255
        details:
          $ref: '#/components/schemas/ResponseDetails'
        message:
          type: string
          description: >-
            Represents the message describing the outcome of the email
            notification creation request.
          maxLength: 255
        status:
          type: string
          description: >-
            Represents the status of the email notification creation operation,
            indicating whether the request was successful.
          maxLength: 255
      title: New Email Notification Response
    InvalidRecipientsError:
      type: object
      x-zs-$id: InvalidRecipientsError
      additionalProperties: false
      description: >-
        Represents an error response returned when one or more user-specified
        recipients in the request are not valid, including details about each
        erroneous entry such as the field API name, JSON path, and individual
        error codes.
      x-zs-llm-description: >-
        One or more recipient entries are invalid. Check recipient type, id
        format, and whether the type is allowed for the given bulk_email
        setting.
      properties:
        code:
          type: string
          description: >-
            Represents the error code identifying the type of recipient
            validation failure.

            Possible values:

            MULTIPLE_OR_MULTI_ERRORS - Indicates that multiple recipient
            validation errors were encountered in the request.
          enum:
            - MULTIPLE_OR_MULTI_ERRORS
        details:
          type: object
          additionalProperties: false
          description: >-
            Represents the validation details associated with the recipient
            error, including the field name, JSON path, and a list of individual
            error entries.
          properties:
            api_name:
              type: string
              description: >-
                Represents the API name of the field associated with the
                recipient validation error.
              maxLength: 255
            json_path:
              type: string
              description: >-
                Represents the JSON path of the field in the request payload
                that contains the invalid recipient value.
              maxLength: 1000
            error:
              type: array
              description: >-
                Represents the list of individual recipient validation errors
                encountered in the request.
              items:
                type: object
                additionalProperties: false
                description: >-
                  Represents an individual recipient validation error, including
                  its error code, details, message, and status.
                properties:
                  code:
                    type: string
                    description: >-
                      Represents the error code identifying the specific type of
                      validation failure for the recipient entry.
                    maxLength: 255
                  details:
                    type: object
                    additionalProperties: false
                    description: >-
                      Represents the additional details for the individual
                      recipient validation error, including the field API name
                      and JSON path of the erroneous entry.
                    properties:
                      api_name:
                        type: string
                        description: >-
                          Represents the API name of the field for which the
                          recipient validation error occurred.
                        maxLength: 255
                      json_path:
                        type: string
                        description: >-
                          Represents the JSON path to the specific field in the
                          request payload where the recipient validation error
                          occurred.
                        maxLength: 1000
                  message:
                    type: string
                    description: >-
                      Represents the error message describing the reason the
                      recipient entry failed validation.
                    maxLength: 255
                  status:
                    type: string
                    description: >-
                      Represents the status of the individual recipient
                      validation error.
                    maxLength: 255
              maxItems: 25
        message:
          type: string
          description: >-
            Represents the error message describing why the specified recipients
            are invalid.
          example: Some selected recipients are not available
          maxLength: 255
        status:
          type: string
          description: |-
            Represents the status of the error response.
            Possible values:
            error - Indicates that the request failed due to invalid recipients.
          enum:
            - error
      required:
        - code
        - details
        - message
        - status
      title: Invalid Recipients Error
    InvalidTemplateIdError:
      type: object
      x-zs-$id: InvalidTemplateIdError
      additionalProperties: false
      description: >-
        Represents the error response returned when a request contains an
        invalid or unrecognized email template ID, including the error code,
        status, message, and details about the field that caused the failure.
      x-zs-llm-description: >-
        The email_template.id does not match a valid template for this module.
        Fetch templates from GET /settings/email_templates?module={module}.
      properties:
        code:
          type: string
          description: >-
            Represents the error code indicating the nature of the failure.

            Possible values:

            INVALID_DATA - The request contains an invalid or unrecognized email
            template ID.
          enum:
            - INVALID_DATA
        details:
          type: object
          additionalProperties: false
          description: >-
            Represents an object containing additional details about the
            validation error, including the API name and JSON path of the field
            that caused the failure.
          properties:
            api_name:
              type: string
              description: >-
                Represents the API name of the field associated with the invalid
                template ID error.
              maxLength: 255
            json_path:
              type: string
              description: >-
                Represents the JSON path of the field in the request payload
                that caused the invalid template ID error.
              maxLength: 1000
        message:
          type: string
          description: >-
            Represents the error message describing the invalid template ID
            issue encountered during the request.
          example: the id given seems to be invalid
          maxLength: 255
        status:
          type: string
          description: >-
            Represents the status of the API response for this error.

            Possible values:

            error - Indicates that the request failed due to an invalid template
            ID.
          enum:
            - error
      required:
        - code
        - details
        - message
        - status
      title: Invalid Template ID Error
    EmailNotificationAddressMergeField:
      type: object
      x-zs-$id: EmailNotificationAddressMergeField
      additionalProperties: false
      description: >-
        Represents the address configuration for a merge_field type from or
        reply-to address in an email notification. Two hardcoded values are
        always available: ${!Current.User.Email} (the logged-in user's email)
        and ${!Record.Owner.Email} (the record owner's email). Any user lookup
        field available in the module can also be used as a from or reply-to
        address, for example, ${!Deals.Contact_Name.Email}. Use module and field
        metadata APIs to discover available user lookup fields.
      x-zs-llm-description: >-
        Use for dynamic sender addresses resolved from record fields at runtime.
        ${!Current.User.Email} and ${!Record.Owner.Email} are always available.
      example:
        type: merge_field
        details:
          api_name: ${!Deals.Contact_Name.Email}
      properties:
        type:
          type: string
          description: >-
            Represents the address type for this configuration.

            Possible values:

            merge_field - Indicates the address is resolved dynamically from a
            CRM module field or user lookup field.
          enum:
            - merge_field
          maxLength: 255
        details:
          type: object
          additionalProperties: false
          description: >-
            Represents the merge field details used to resolve the sender or
            reply-to address. The api_name property is required for merge_field
            address types.
          properties:
            api_name:
              type: string
              description: >-
                Represents the API name of the merge field used to resolve the
                sender or reply-to address. Supported reference formats include
                ${!{module_API_name}.{field_API_name}} for direct fields and
                ${!{module_API_name}.{lookup_APIname}.{field_API_name}} for
                lookup fields.
              maxLength: 100
            id:
              type: string
              description: Represents the optional identifier for the merge field.
              maxLength: 255
          required:
            - api_name
        resource:
          type: 'null'
          description: >-
            Represents the resource field, which is not applicable for
            merge_field address types and must be set to null.
      required:
        - type
        - details
      title: Email Notification Address Merge Field
    EmailNotificationAddressUser:
      type: object
      x-zs-$id: EmailNotificationAddressUser
      additionalProperties: false
      description: >-
        Represents the address configuration for a Zoho CRM user recipient in an
        email notification. The resource.id must be a valid CRM user ID from the
        Zoho CRM Users APIs.
      x-zs-llm-description: >-
        Use to set a specific CRM user as the sender. Provide a valid user ID
        from GET /settings/users.
      properties:
        type:
          type: string
          description: >-
            Represents the address type for the email notification recipient
            configuration.

            Possible values:

            user - Indicates that the recipient address is resolved from a Zoho
            CRM user.
          enum:
            - user
          maxLength: 255
        resource:
          $ref: '#/components/schemas/ResourceIdentifierUser'
          description: User resource. Use resource.id from Zoho CRM Users APIs.
        details:
          type: 'null'
          description: >-
            Represents additional address details. This field is not applicable
            when the type is set to `user` and should be omitted or set to null.
      required:
        - type
        - resource
      title: Email Notification Address User
    EmailNotificationAddressOrganizationEmail:
      type: object
      x-zs-$id: EmailNotificationAddressOrganizationEmail
      additionalProperties: false
      description: >-
        Represents the address configuration for an organization email sender in
        an email notification. The resource.id must be an organization email ID
        retrieved from Zoho CRM Organization APIs.
      x-zs-llm-description: >-
        Use to send from an organization-level email address. Provide the org
        email ID from organization email settings.
      properties:
        type:
          type: string
          description: >-
            Represents the address type for the email notification sender
            configuration.

            Possible values:

            organization_email - Indicates that the sender address is an
            organization email registered in the Zoho CRM organization.
          enum:
            - organization_email
          maxLength: 255
        resource:
          $ref: '#/components/schemas/ResourceIdentifierOrganizationEmail'
          description: >-
            Organization email resource. Use resource.id from Zoho CRM
            Organization APIs.
        details:
          type: 'null'
          description: >-
            Represents additional details for the address configuration. This
            field is not applicable when the type is organization_email.
      required:
        - type
        - resource
      title: Email Notification Address Organization Email
    EmailNotificationAddressEmails:
      type: object
      x-zs-$id: EmailNotificationAddressEmails
      additionalProperties: false
      description: >-
        Represents the sender address configuration for an email notification,
        used when the server assigns the address automatically or when the
        address resolves to a plain email address.
      x-zs-llm-description: >-
        READ ONLY - the server returns type 'email' for the notification address
        it assigns automatically and for addresses that resolve to a plain email
        address. It is not accepted on write, where only merge_field, user and
        organization_email are valid.
      properties:
        type:
          type: string
          description: |-
            Represents the type of sender address for the notification.
            Possible values:
            email - The sender address resolves to a plain email address.
          enum:
            - email
          maxLength: 255
        details:
          type: object
          additionalProperties: false
          description: >-
            Represents the email details for the sender address associated with
            the notification.
          properties:
            email:
              allOf:
                - $ref: '#/components/schemas/RecipientEmailAddress'
              description: Represents the sender email address in the local@domain format.
          required:
            - email
        resource:
          type: 'null'
          description: >-
            Represents the resource reference for the sender address. This field
            is not applicable when the address type is email.
      required:
        - type
        - details
      title: Email Notification Address Emails
    EmailNotificationAddressNull:
      type: 'null'
      x-zs-$id: EmailNotificationAddressNull
      description: >-
        Represents a null address value, indicating that no sender or reply-to
        address has been configured for the email notification.
      x-zs-llm-description: >-
        Address is null when not configured. Applies when from_address or
        reply_to_address is intentionally omitted (auto-assigned for internal
        recipients).
      title: Email Notification Address Null
    FromAddress:
      description: >-
        Represents the sender (From) address configuration for an email
        notification. Supports three types: merge_field, user, and
        organization_email. from_address is auto-assigned by the API (defaults
        to notifications@zohocrm.com) when all recipients are internal (resolve
        to CRM users). Providing from_address when all recipients are internal
        returns DEPENDENT_MISMATCH error. When bulk_email is true, the
        configured From address is used instead of notifications@zohocrm.com,
        and the From address is required for mass emails. from_address is also
        required when any recipient resolves to an external email address, such
        as a merge field that resolves to an email-type field (for example,
        ${!Module.Email} where ui_type=25).
      x-zs-llm-description: >-
        Union (oneOf)  select the from-address variant. Auto-assigned to
        notifications@zohocrm.com when all recipients are internal CRM users.
        Required when any recipient resolves to an external email.
      discriminator:
        propertyName: type
        mapping:
          merge_field: '#/components/schemas/EmailNotificationAddressMergeField'
          user: '#/components/schemas/EmailNotificationAddressUser'
          organization_email: '#/components/schemas/EmailNotificationAddressOrganizationEmail'
          email: '#/components/schemas/EmailNotificationAddressEmails'
      oneOf:
        - $ref: '#/components/schemas/EmailNotificationAddressMergeField'
        - $ref: '#/components/schemas/EmailNotificationAddressUser'
        - $ref: '#/components/schemas/EmailNotificationAddressOrganizationEmail'
        - $ref: '#/components/schemas/EmailNotificationAddressEmails'
      title: From Address
    InvalidModuleParamError:
      type: object
      x-zs-$id: InvalidModuleParamError
      additionalProperties: false
      description: >-
        Represents an error response returned when a module named in a query
        parameter cannot be resolved.
      x-zs-llm-description: >-
        Raised for the module and related_module query parameters when the value
        does not resolve to an accessible CRM module. details.param_name carries
        which parameter failed.
      properties:
        code:
          type: string
          description: >-
            Represents the error code identifying the type of module resolution
            failure.

            Possible values:

            INVALID_MODULE - The module named in the query parameter could not
            be resolved.
          enum:
            - INVALID_MODULE
        details:
          type: object
          additionalProperties: false
          description: >-
            Represents an object containing additional details about the
            validation error, including the name of the query parameter that
            could not be resolved.
          properties:
            param_name:
              type: string
              description: >-
                Represents the name of the query parameter for which the module
                value could not be resolved.
              maxLength: 255
          required:
            - param_name
        message:
          type: string
          description: >-
            Represents the error message describing why the module parameter
            could not be resolved.
          example: The value provided to the param is Invalid
          maxLength: 255
        status:
          type: string
          description: >-
            Represents the status of the response.

            Possible values:

            error - Indicates that the request failed due to an invalid module
            parameter.
          enum:
            - error
      required:
        - code
        - details
        - message
        - status
      title: Invalid Module Param Error
    InvalidFeatureTypeError:
      type: object
      x-zs-$id: InvalidFeatureTypeError
      additionalProperties: false
      description: >-
        Represents the error response returned when the request contains an
        invalid feature type, including the error code, a descriptive message,
        additional validation details, and the response status.
      x-zs-llm-description: >-
        The feature_type value is not recognized. Use one of: workflow,
        approval_process, blueprint, blueprint_transition, blueprint_state,
        review_process, orchestration, assignment_rules, kiosk, pathfinder,
        connected_workflows, commandcenter_service, cadences.
      properties:
        code:
          type: string
          description: >-
            Represents the error code indicating the type of validation failure.

            Possible values:

            INVALID_DATA - The request contains an invalid feature type in the
            data.
          enum:
            - INVALID_DATA
        details:
          type: object
          additionalProperties: false
          description: >-
            Represents an object containing additional details about the
            validation error, including the name of the parameter that caused
            the invalid feature type.
          properties:
            param_name:
              type: string
              description: >-
                Represents the name of the parameter that contained the invalid
                feature type value.
              maxLength: 255
        message:
          type: string
          description: >-
            Represents the error message describing the invalid feature type
            issue encountered in the request.
          example: feature type is invalid
          maxLength: 255
        status:
          type: string
          description: >-
            Represents the status of the response, indicating that an error
            occurred.

            Possible values:

            error - The request failed due to an invalid feature type in the
            provided data.
          enum:
            - error
      required:
        - code
        - details
        - message
        - status
      title: Invalid Feature Type Error
    EmailNotificationFeatureType:
      type: string
      description: >-
        Represents the automation feature this email notification is associated
        with.

        Possible values:

        workflow - Standard workflow rules.

        approval_process - Approval workflows.

        blueprint - Blueprint automation stages.

        blueprint_transition - Blueprint automation stages (transition level).

        blueprint_state - Blueprint automation stages (state level).

        review_process - Review process actions.

        orchestration - Orchestration flows.

        assignment_rules - Lead and record assignment rules.

        kiosk - Kiosk mode actions.

        pathfinder - Pathfinder actions.

        connected_workflows - Connected workflow chains.

        commandcenter_service - CommandCenter service.

        cadences - Cadence and sequence actions.
      x-zs-llm-description: >-
        Enum string identifying which automation feature owns this notification.
        Defaults to 'workflow' if omitted on creation.
      enum:
        - workflow
        - approval_process
        - blueprint
        - blueprint_transition
        - blueprint_state
        - review_process
        - orchestration
        - assignment_rules
        - kiosk
        - pathfinder
        - connected_workflows
        - commandcenter_service
        - cadences
      example: workflow
      maxLength: 255
      title: Email Notification Feature Type
    EmailNotificationsResponse:
      type: object
      x-zs-$id: EmailNotificationsResponse
      additionalProperties: false
      description: >-
        Represents the successful retrieval response for a page of email
        notification definitions, including pagination information.
      x-zs-llm-description: >-
        Paginated list response. Check info.more_records to determine if
        additional pages exist.
      properties:
        email_notifications:
          type: array
          description: >-
            Represents the list of email notification definitions returned for
            the current page.
          items:
            $ref: '#/components/schemas/EmailNotificationSummary'
          maxItems: 200
        info:
          $ref: '#/components/schemas/PaginationInfo'
      title: Email Notifications Response
    EmailNotificationDetail:
      type: object
      additionalProperties: false
      description: >-
        Represents a complete email notification action definition in Zoho CRM,
        including its configuration fields, email template, recipient details,
        sender and reply-to address settings, and server-managed metadata such
        as creation and modification timestamps.
      x-zs-llm-description: >-
        Full notification object returned by GET-by-ID. Use this schema to
        understand all configurable and read-only fields.
      properties:
        id:
          $ref: '#/components/schemas/EmailNotificationActionId'
          x-zs-$id: EmailNotificationId
          description: Unique identifier of the email notification action.
        name:
          type: string
          description: Represents the display name of the email notification action.
          maxLength: 255
        module:
          $ref: '#/components/schemas/ModuleDetails'
          description: Primary CRM module where this notification action is configured.
        related_module:
          $ref: '#/components/schemas/RelatedModuleDetails'
          description: >-
            Related module context for this notification configuration; null
            when not applicable.
        template:
          $ref: '#/components/schemas/EmailTemplate'
          description: Email template used by this notification action.
        recipients:
          $ref: '#/components/schemas/EmailRecipients'
          description: Recipient configuration containing to, cc, and bcc collections.
        from_address:
          $ref: '#/components/schemas/FromAddress'
          description: Sender address configuration used to send the notification email.
        reply_to_address:
          $ref: '#/components/schemas/ReplyToAddress'
          description: Reply-to address configuration for recipient replies.
        bulk_email:
          type: boolean
          description: >-
            Indicates whether the notification is sent as a single mass email
            with all recipient addresses visible to each other.

            Possible values:

            true - The notification is sent as a bulk email, displaying all
            recipients together.

            false - The notification is not sent as a bulk email.
        feature_type:
          $ref: '#/components/schemas/EmailNotificationFeatureType'
          description: Automation feature where this action is used.
        associated:
          type: boolean
          description: >-
            Indicates whether this email notification action is currently
            associated with any automation rule or process.

            Possible values:

            true - The action is linked to one or more automation rules or
            processes.

            false - The action is not linked to any automation rule or process.
        source:
          type: string
          description: >-
            Represents the source application that created or manages this email
            notification action, for example, crm.
          maxLength: 255
        recipient_count:
          type: string
          description: >-
            Represents the total number of configured recipients for this email
            notification action.
          maxLength: 255
        editable:
          type: boolean
          description: >-
            Indicates whether the current user has permission to edit this email
            notification action.

            Possible values:

            true - The current user can edit this action.

            false - The current user cannot edit this action.
        deletable:
          type: boolean
          description: >-
            Indicates whether the current user has permission to delete this
            email notification action.

            Possible values:

            true - The current user can delete this action.

            false - The current user cannot delete this action.
        lock_status:
          $ref: '#/components/schemas/LockStatus'
          description: >-
            Lock state of this action. Locked actions may not be editable or
            deletable.
        created_by:
          $ref: '#/components/schemas/CreatedBy'
          description: User who created this email notification action.
        created_time:
          type: string
          format: date-time
          description: >-
            Represents the date and time when this email notification action was
            created, as generated by the server.
          maxLength: 255
        modified_by:
          $ref: '#/components/schemas/ModifiedBy'
          description: User who last modified this email notification action.
        modified_time:
          type: string
          format: date-time
          description: >-
            Represents the date and time when this email notification action was
            last modified, as generated by the server.
          maxLength: 255
      required:
        - id
        - module
        - name
        - template
      title: Email Notification Detail
    EmailNotificationCreateInput:
      type: object
      additionalProperties: false
      description: >-
        Represents the writable fields for creating an email notification action
        in Zoho CRM. The module, name, recipients (with at least one entry in
        the to array), and template fields are required. Optionally configure
        from_address, reply_to_address, related_module, bulk_email, and
        feature_type.
      x-zs-llm-description: >-
        Defines the fields for a new email notification action. Before
        submitting: (1) call GET /settings/modules to confirm valid module
        api_names; (2) retrieve email templates from the Email Templates API -
        if none exist for that module, create one via the createEmailTemplate
        tool first and associate it. Required: module, name, recipients (at
        least one entry in to), and template. Additional optional fields:
        from_address, reply_to_address, related_module, bulk_email, and
        feature_type.
      properties:
        name:
          type: string
          description: >-
            Specify the display name of the email notification action. The
            following special characters are not allowed: ~`#%^&*()+={}[]|;"<>\.
          maxLength: 255
        module:
          $ref: '#/components/schemas/ModuleDetails'
          description: >-
            Primary CRM module whose records trigger this email notification
            (e.g., Leads, Contacts, Deals). Both api_name and id are required.
            If they mismatch, returns AMBIGUITY_DURING_PROCESSING. This value
            cannot be changed after creation. Use GET /settings/modules to
            discover available modules.
        related_module:
          $ref: '#/components/schemas/RelatedModuleDetails'
          description: >-
            Related module context for this notification configuration (e.g.,
            Notes as related module for a Leads notification). This value cannot
            be changed after creation. Pass null when not applicable.
        template:
          $ref: '#/components/schemas/EmailTemplate'
          description: >-
            Email template to be used for this notification action. Both name
            and id are required. Fetch available templates from the Email
            Templates API for the configured module. If no template exists yet
            for that module, create one first via the createEmailTemplate tool
            and then associate it here. Templates containing Consent or Survey
            links are not supported for mass emails; do not use a template
            containing these links when bulk_email is set to true.
        recipients:
          $ref: '#/components/schemas/EmailRecipients'
          description: >-
            Recipients of the email notification. Provide a JSON object with
            three arrays: to (required, at least one entry), cc (optional), and
            bcc (optional). CC and BCC are only allowed when bulk_email is true.
        from_address:
          $ref: '#/components/schemas/FromAddress'
          description: >-
            Sender (From) address. Supported types: merge_field, user,
            organization_email. When bulk_email is false, the From address
            defaults to notifications@zohocrm.com for notifications sent to
            internal CRM users; from_address must not be specified in this case
            and doing so returns DEPENDENT_MISMATCH. When bulk_email is true,
            the configured From address is used instead of
            notifications@zohocrm.com, and the From address is required for mass
            emails.
        reply_to_address:
          $ref: '#/components/schemas/ReplyToAddress'
          description: >-
            Reply-to address. Supported types: merge_field, user,
            organization_email. When all recipients are internal CRM users,
            reply_to_address must not be specified and doing so returns
            DEPENDENT_MISMATCH. Required when any recipient resolves to an
            external email.
        bulk_email:
          type: boolean
          description: >-
            Indicates whether mass email mode is enabled for this notification.
            When set to true, CC and BCC recipients are allowed in the
            recipients object; when omitted or set to false, including CC or BCC
            recipients returns an AMBIGUITY_DURING_PROCESSING error. When true,
            role, group, territory, role_and_subordinate, and
            territory_and_subterritory recipient types cannot be specified in
            the recipients.to array; use individual users or email addresses
            instead. This value cannot be changed after creation.

            Possible values:

            true - Mass email mode is enabled; CC and BCC recipients are
            permitted.

            false - Mass email mode is disabled; CC and BCC recipients are not
            permitted.
          x-zs-llm-description: >-
            Switches the notification into mass-email mode; defaults to false.
            Required when CC or BCC recipients are present  omitting it causes
            AMBIGUITY_DURING_PROCESSING. With bulk_email set to true,
            recipients.to may not include role, group, territory,
            role_and_subordinate, or territory_and_subterritory types. This
            setting cannot be changed once the notification is created.
          default: false
        feature_type:
          $ref: '#/components/schemas/EmailNotificationFeatureType'
          description: >-
            Automation feature this email notification belongs to. Defaults to
            'workflow' if omitted. All listed values are supported for creation
            via API.
      required:
        - module
        - name
        - recipients
        - template
      title: Email Notification Create Input
    EmailNotificationUpdateInput:
      type: object
      additionalProperties: false
      description: >-
        Represents the writable fields for updating an email notification action
        in Zoho CRM. This is a partial-update schema — any key omitted from the
        payload retains its current stored value. Only the name, template,
        recipients, from_address, and reply_to_address fields can be modified.
        The module, related_module, bulk_email, and feature_type fields are
        immutable after creation.
      x-zs-llm-description: >-
        Describes the updatable fields for an existing email notification. Start
        by calling GET /settings/automation/email_notifications/{id} to read the
        current values. name, template, and recipients are all required in the
        payload  partial updates are not allowed. from_address and
        reply_to_address can also be changed. module, related_module,
        bulk_email, and feature_type are fixed after creation and cannot be
        modified.
      properties:
        name:
          type: string
          description: >-
            Specify the display name of the email notification action. Special
            characters ~`#%^&*()+={}[]|;"<>\ are not allowed.
          maxLength: 255
        template:
          $ref: '#/components/schemas/EmailTemplate'
          description: >-
            Email template to be used for this notification action. Both name
            and id are required. Fetch available templates from the Email
            Templates API. If no template exists yet for that module, create one
            first via the createEmailTemplate tool and then associate it here.
        recipients:
          $ref: '#/components/schemas/EmailRecipients'
          description: >-
            Recipients of the email notification. Provide a JSON object with
            three arrays: to (required, at least one entry), cc (optional), and
            bcc (optional). CC and BCC are only allowed when bulk_email is true
            (set during creation).
        from_address:
          $ref: '#/components/schemas/FromAddress'
          description: >-
            Sender (From) address. Supported types: merge_field, user,
            organization_email. When bulk_email is false, the From address
            defaults to notifications@zohocrm.com for notifications sent to
            internal CRM users; from_address must not be specified in this case
            and doing so returns DEPENDENT_MISMATCH. When bulk_email is true,
            the configured From address is used instead of
            notifications@zohocrm.com, and the From address is required for mass
            emails.
        reply_to_address:
          $ref: '#/components/schemas/ReplyToAddress'
          description: >-
            Reply-to address. Supported types: merge_field, user,
            organization_email. When all recipients are internal CRM users,
            reply_to_address must not be specified and doing so returns
            DEPENDENT_MISMATCH. Required when any recipient resolves to an
            external email.
      required:
        - name
        - template
        - recipients
      title: Email Notification Update Input
    EmailNotificationSummary:
      type: object
      additionalProperties: false
      description: >-
        Represents a summary of an email notification action, including its
        template, sender and reply-to configuration, recipient collections,
        primary module context, audit metadata, and association status.
      x-zs-llm-description: >-
        Compact notification object returned by GET-all list. Contains key
        fields for display; use GET-by-ID for full configuration.
      properties:
        template:
          $ref: '#/components/schemas/EmailTemplate'
          description: Email template used by this notification (template id and name).
        reply_to_address:
          $ref: '#/components/schemas/ReplyToAddress'
          description: >-
            Reply-to configuration used when recipients reply to the
            notification email.
        created_time:
          $ref: '#/components/schemas/EmailNotificationActionCreatedTime'
        lock_status:
          $ref: '#/components/schemas/LockStatus'
          description: >-
            Indicates whether this notification action is locked for
            edit/delete.
        editable:
          type: boolean
          description: >-
            Indicates whether the current user can edit this notification
            action.

            Possible values:

            true - The current user has permission to edit this notification
            action.

            false - The current user does not have permission to edit this
            notification action.
        module:
          $ref: '#/components/schemas/ModuleDetails'
          description: Primary module on which this notification action is configured.
        related_module:
          $ref: '#/components/schemas/RelatedModuleDetails'
          description: >-
            Related module context when the automation is configured on related
            records; null when not applicable.
        deletable:
          type: boolean
          description: >-
            Indicates whether the current user can delete this notification
            action.

            Possible values:

            true - The current user has permission to delete this notification
            action.

            false - The current user does not have permission to delete this
            notification action.
        recipient_count:
          $ref: '#/components/schemas/EmailNotificationActionRecipientCount'
        source:
          type: string
          description: >-
            Represents the source application from which this notification
            action is configured, for example, crm.
          maxLength: 255
        created_by:
          $ref: '#/components/schemas/CreatedBy'
          description: User who created this notification action.
        feature_type:
          $ref: '#/components/schemas/EmailNotificationFeatureType'
          description: Automation feature where this action is used.
        modified_time:
          $ref: '#/components/schemas/EmailNotificationActionModifiedTime'
        bulk_email:
          type: boolean
          description: >-
            Indicates whether the notification is sent as a single mass email.

            Possible values:

            true - The notification is sent as a mass email, and CC and BCC
            recipients are allowed.

            false - The notification is sent as individual emails, and CC and
            BCC recipients are not included.
        recipients:
          $ref: '#/components/schemas/EmailRecipients'
          description: >-
            Recipient configuration containing to/cc/bcc collections for this
            notification action.
        associated:
          type: boolean
          description: >-
            Indicates whether this notification action is currently associated
            with an automation rule or process.

            Possible values:

            true - The notification action is linked to one or more active
            automation rules or processes.

            false - The notification action is not linked to any automation rule
            or process.
        name:
          type: string
          description: >-
            Represents the display name of the email notification action. The
            special characters ~`#%^&*()+={}[]|;"<>\ are not allowed.
          pattern: ^[^~`#%^&*()+={}\[\]|;"<>\\]+$
          maxLength: 255
        modified_by:
          $ref: '#/components/schemas/ModifiedBy'
          description: User who last modified this notification action.
        id:
          x-zs-$id: EmailNotificationsId
          $ref: '#/components/schemas/EmailNotificationActionId'
        from_address:
          $ref: '#/components/schemas/FromAddress'
          description: Sender configuration used to send the notification email.
      required:
        - module
        - name
        - template
      title: Email Notification Configuration
    EmailNotificationActionCreatedTime:
      type: string
      format: date-time
      description: Represents the date and time when this notification action was created.
      x-zs-llm-description: Read-only ISO date-time string set by the server on creation.
      maxLength: 255
      example: '2025-07-06T16:15:58+05:30'
      title: Email Notification Action Created Time
    EmailNotificationActionModifiedTime:
      type: string
      format: date-time
      description: >-
        Represents the date and time when this notification action was last
        modified.
      x-zs-llm-description: >-
        Read-only ISO date-time string updated by the server on every
        modification.
      maxLength: 255
      example: '2025-07-06T16:15:58+05:30'
      title: Email Notification Action Modified Time
    EmailNotificationActionRecipientCount:
      type: string
      description: >-
        Represents the total number of recipients configured for this email
        notification action.
      x-zs-llm-description: Read-only string count of total configured recipients across to/cc/bcc.
      maxLength: 255
      example: '1'
      title: Email Notification Action Recipient Count
    EmailNotificationActionId:
      type: string
      description: Represents the unique identifier of the email notification action.
      x-zs-llm-description: >-
        Read-only unique ID of this email notification action. Use this value to
