    InvalidDataTypeError:
      type: object
      x-zs-$id: ErrorResponseCore3
      additionalProperties: false
      description: >-
        Represents the error response returned when the recipient configuration
        in the `to` field includes only record-based recipients (such as the
        record owner, the owner's manager, or the created-by user) and a
        `from_address` or `reply_to_address` cannot be associated with that
        configuration.
      x-zs-llm-description: >-
        Recipient configuration conflict  when only internal recipients (owner,
        owner's manager, created_by) are in 'to', from_address/reply_to_address
        cannot be specified.
      properties:
        code:
          type: string
          description: >-
            Represents the error code identifying the type of dependency
            conflict.

            Possible values:

            DEPENDENT_MISMATCH - The specified recipient configuration conflicts
            with the from_address or reply_to_address settings.
          enum:
            - DEPENDENT_MISMATCH
        details:
          type: object
          additionalProperties: false
          description: >-
            Represents the error details identifying the field and its dependent
            field that caused the configuration conflict.
          properties:
            dependee:
              type: object
              additionalProperties: false
              description: >-
                Represents the dependent field whose configuration conflicts
                with the primary field identified in the error.
              properties:
                api_name:
                  type: string
                  description: >-
                    Represents the API name of the dependent field that
                    conflicts with the primary field configuration.
                  maxLength: 255
                json_path:
                  type: string
                  description: >-
                    Represents the JSON path to the dependent field within the
                    request payload.
                  maxLength: 1000
            api_name:
              type: string
              description: >-
                Represents the API name of the field that caused the dependency
                conflict.
              maxLength: 255
            json_path:
              type: string
              description: >-
                Represents the JSON path to the field within the request payload
                that caused the dependency conflict.
              maxLength: 1000
        message:
          type: string
          description: >-
            Represents the error message describing the dependency conflict
            between the recipient configuration and the sender or reply-to
            address settings.
          example: reply_to_adress can not be associated for this 'to' address type
          maxLength: 255
        status:
          type: string
          description: >-
            Represents the status of the API response.

            Possible values:

            error - Indicates that the request failed due to a dependency
            conflict in the configuration.
          enum:
            - error
      required:
        - code
        - details
        - message
        - status
      title: Error Response Core
    DependentFieldMissingError:
      type: object
      x-zs-$id: ErrorResponseCore1
      additionalProperties: false
      description: >-
        Represents the error response returned when a dependent field conflict
        is detected in the request, such as when bulk email is enabled and a
        role or group is specified as a recipient in the 'to' field.
      x-zs-llm-description: >-
        Dependent field constraint violated. Common cause: when bulk_email is
        true, role and group types cannot appear in recipients.to.
      properties:
        code:
          type: string
          description: >-
            Represents the error code indicating the nature of the dependency
            mismatch.

            Possible values:

            DEPENDENT_MISMATCH - The request contains a dependent field
            conflict, such as associating a role or group as a recipient when
            bulk email is enabled.
          enum:
            - DEPENDENT_MISMATCH
        details:
          type: object
          additionalProperties: false
          description: >-
            Represents the details of the validation error, identifying the
            fields involved in the dependency conflict.
          properties:
            dependee:
              type: object
              additionalProperties: false
              description: >-
                Represents the field whose value is required to be present for
                the dependent field to be valid.
              properties:
                api_name:
                  type: string
                  description: >-
                    Represents the API name of the dependee field involved in
                    the dependency conflict.
                  maxLength: 255
                json_path:
                  type: string
                  description: >-
                    Represents the JSON path of the dependee field within the
                    request payload where the dependency conflict was detected.
                  maxLength: 1000
            dependent_field:
              type: object
              additionalProperties: false
              description: >-
                Represents the field that has a dependency on another field and
                caused the validation error.
              properties:
                api_name:
                  type: string
                  description: >-
                    Represents the API name of the dependent field that
                    triggered the dependency conflict.
                  maxLength: 255
                json_path:
                  type: string
                  description: >-
                    Represents the JSON path of the dependent field within the
                    request payload where the conflict originated.
                  maxLength: 1000
        message:
          type: string
          description: >-
            Represents the error message describing the dependency conflict that
            occurred.
          example: >-
            Roles, groups, and territories type emails in 'to' cannot be
            associated when bulk_email is true.
          maxLength: 255
        status:
          type: string
          description: >-
            Represents the status of the API response.

            Possible values:

            error - Indicates that the request failed due to a dependency
            conflict.
          enum:
            - error
      required:
        - code
        - details
        - message
        - status
      title: Error Response Core
    AutomationUsageResource:
      x-zs-$id: AutomationUsageResource
      type: object
      additionalProperties: false
      description: >
        Represents a reference to the specific automation action that generated
        usage. The identifier and name are resolved from the action's
        configuration record; for deleted actions, the name falls back to the
        corresponding automation audit log entry. When the include_inner_details
        parameter includes resource.layout_id and the action is associated with
        a wizard layout, a layout_id field is included in the representation.
      properties:
        id:
          type: string
          description: >-
            Represents the unique identifier of the automation action, such as
            an email notification ID or a webhook ID.
          maxLength: 20
          example: '5586800000123001'
        name:
          type: string
          description: >
            Represents the display name of the automation action. Falls back to
            the name recorded in the automation audit log when the action has
            been deleted.
          maxLength: 255
          example: Notify Deal Owner
        layout_id:
          type: string
          description: >-
            Represents the identifier of the wizard layout associated with the
            automation action. Present only when the include_inner_details query
            parameter is set to resource.layout_id and the action is linked to a
            wizard layout.
          maxLength: 20
          example: '738964000000100045'
      title: Automation Usage Resource
    AutomationUsageDataEntry:
      x-zs-$id: AutomationUsageDataEntry
      type: object
      additionalProperties: false
      description: >
        Represents a single daily usage data point capturing the execution count
        for an automation action. When the group_by parameter includes resource,
        the embedded resource object identifies the individual email
        notification or webhook. When group_by is date only, the resource object
        is omitted and the count reflects total executions across all actions
        for that day. The type field indicates the automation feature
        responsible for the executions, such as workflow_rules,
        approval_process, or Blueprint.
      properties:
        date:
          type: string
          description: >-
            Represents the date of this usage data point in YYYY-MM-DD format.
            All dates are evaluated in the organization's time zone.
          format: date
          maxLength: 10
          example: '2025-10-23'
        resource:
          $ref: '#/components/schemas/AutomationUsageResource'
          description: >-
            Reference to the specific automation action (email notification or
            webhook) that generated the usage count. Only present when group_by
            includes 'resource'.
        count:
          type: integer
          format: int32
          description: >-
            Represents the number of times the automation action was executed on
            this date. When the group_by parameter is set to 'date' only, this
            value reflects the total across all actions.
          minimum: 0
        type:
          type: string
          description: >
            Represents the automation feature type associated with the reported
            executions. Values correspond to the filter types supported by the
            type query parameter, such as workflow_rules, approval_process,
            Blueprint, email_notifications, webhooks, and kiosks.
          maxLength: 50
      title: Automation Usage Data Entry
    AutomationUsagePaginationInfo:
      x-zs-$id: AutomationUsagePaginationInfo
      type: object
      additionalProperties: false
      description: >-
        Represents pagination metadata returned with automation usage report
        responses. Includes a max_limit value that reflects the edition-specific
        daily execution cap for the relevant action type, derived from the
        organization's feature limits.
      properties:
        per_page:
          type: integer
          format: int32
          description: >-
            Represents the number of records returned in each page of the result
            set.
          minimum: 1
          maximum: 200
          example: 200
        count:
          type: integer
          format: int32
          description: >-
            Represents the number of records included in the current page of
            results.
          minimum: 0
          example: 4
        page:
          type: integer
          format: int32
          description: >-
            Represents the one-based index of the current page within the
            paginated result set.
          minimum: 1
          example: 1
        more_records:
          type: boolean
          description: >-
            Indicates whether additional pages of results are available beyond
            the current page.

            Possible values:

            true - More records exist beyond the current page.

            false - The current page contains the last records.
          example: false
        max_limit:
          type: integer
          format: int32
          description: >-
            Represents the edition-specific daily execution cap for the
            automation action type. For email notifications, this reflects the
            WORKFLOWALERT day limit; for webhooks, it reflects the WFWEBHOOK day
            limit. Lower-tier editions carry smaller caps.
          minimum: 0
          example: 2500
      title: Automation Usage Pagination Info
    AutomationUsageReportResponse:
      x-zs-$id: AutomationUsageReportResponse
      type: object
      additionalProperties: false
      description: >
        Represents a successful response from an automation usage report
        endpoint. Contains an array of daily usage data points alongside
        pagination metadata that includes the edition-specific daily execution
        cap. When no usage exists for the queried period, the endpoint returns
        an empty data array rather than null, and the response resolves with
        HTTP 200.
      properties:
        data_usage:
          type: array
          description: >-
            Contains the collection of usage data points for the queried period.
            Each entry represents the execution count for a specific automation
            action on a given date. Returns an empty array when no usage exists
            for the queried period.
          items:
            $ref: '#/components/schemas/AutomationUsageDataEntry'
          maxItems: 200
        info:
          $ref: '#/components/schemas/AutomationUsagePaginationInfo'
          description: >-
            Pagination metadata including the edition-specific daily execution
            cap.
      title: Automation Usage Report Response
    AutomationUsageRequiredParamMissingError:
      x-zs-$id: AutomationUsageRequiredParamMissingError
      type: object
      additionalProperties: false
      description: >
        Represents the error structure returned when the group_by query
        parameter is omitted from the request. All automation usage report
        endpoints require group_by to be present and to include date as a
        mandatory grouping dimension.
      properties:
        code:
          type: string
          description: >-
            Indicates the error classification for a missing required parameter.

            Possible values:

            REQUIRED_PARAM_MISSING - A mandatory query parameter was omitted
            from the request.
          enum:
            - REQUIRED_PARAM_MISSING
        details:
          type: object
          additionalProperties: false
          description: >
            Contains details about the missing request parameter that caused the
            error.
          properties:
            param_name:
              type: string
              description: >-
                Indicates the name of the required parameter that was absent
                from the request.

                Possible values:

                group_by - The group_by parameter was not included in the
                request.
              enum:
                - group_by
        message:
          type: string
          description: >
            Represents a descriptive message explaining the error that caused
            the request to fail.
          example: One of the expected param is missing
          maxLength: 255
        status:
          type: string
          description: >
            Represents the outcome classification of the response.

            Possible values:

            error - The request was not processed due to a missing required
            parameter.
          enum:
            - error
      required:
        - code
        - details
        - message
        - status
      title: Automation Usage Required Param Missing Error
    AutomationUsageInvalidDataError:
      x-zs-$id: AutomationUsageInvalidDataError
      type: object
      additionalProperties: false
      description: >-
        Represents the error envelope returned when an invalid value is supplied
        for a usage report query parameter. The details object identifies which
        parameter is invalid. Common causes include an unsupported type filter
        value, an invalid group_by combination, a malformed date, an invalid
        sort_order, or a non-numeric page or per_page value.
      properties:
        code:
          type: string
          description: >-
            Represents the error code identifying the invalid-data condition.

            Possible values:

            INVALID_DATA - The value supplied for the identified query parameter
            is not valid.
          enum:
            - INVALID_DATA
        details:
          type: object
          additionalProperties: false
          description: |
            Contains details about the query parameter that failed validation.
          properties:
            param_name:
              type: string
              description: >-
                Represents the name of the query parameter that carried the
                invalid value, such as type, group_by, date, sort_order, page,
                or per_page.
              maxLength: 50
        message:
          type: string
          description: >
            Represents a descriptive message explaining the error that caused
            the request to fail.
          example: provided param is invalid
          maxLength: 255
        status:
          type: string
          description: |
            Represents the outcome classification of the response.
            Possible values:
            error - The request was not processed due to invalid input.
          enum:
            - error
      required:
        - code
        - details
        - message
        - status
      title: Automation Usage Invalid Data Error
    AutomationUsageNoPermissionError:
      x-zs-$id: AutomationUsageNoPermissionError
      type: object
      additionalProperties: false
      description: >
        Represents the error structure returned when the authenticated user
        lacks the required Manage Automation Actions privilege, or when the
        requested feature — email notifications or webhooks — is not available
        in the organization's current edition.
      properties:
        code:
          type: string
          description: >-
            Represents the error code identifying the permission-denied
            condition.

            Possible values:

            NO_PERMISSION - The user lacks the required privilege or the feature
            is unavailable in the current edition.
          enum:
            - NO_PERMISSION
        details:
          type: object
          additionalProperties: false
          description: >-
            Contains details about the missing permission or unavailable feature
            that caused the error.
          properties:
            permissions:
              type: array
              description: >-
                Contains the list of required permissions that the caller lacks
                and that prevented the request from succeeding.
              items:
                type: string
                description: >-
                  Represents a permission identifier denoting a specific access
                  right required to perform the requested operation.
                maxLength: 255
              maxItems: 5
        message:
          type: string
          description: >
            Represents a descriptive message explaining the error that caused
            the request to fail.
          example: permission denied
          maxLength: 255
        status:
          type: string
          description: |
            Represents the outcome classification of the response.
            Possible values:
            error - The request was denied due to insufficient permission.
          enum:
            - error
      required:
        - code
        - details
        - message
        - status
      title: Automation Usage No Permission Error
  parameters:
    ParamQueryRelatedModule:
      name: related_module
      in: query
      description: >-
        Specify the API name of the related module to filter the results. Refer
        to the [Get Modules](modules.yaml#$.paths./settings/modules.get)
        resource for valid values.
      required: false
      schema:
        type: string
        maxLength: 255
        example: Notes
    ParamQueryTo:
      name: to
      in: query
      description: >-
        Specify the end date (inclusive) for the query range in YYYY-MM-DD
        format. Evaluated in the organization's time zone. Defaults to the
        current date at 23:59:59 when omitted. Future dates return a 400 error
        with the code INVALID_DATA and the message 'provided_time_is_ahead'.
      required: false
      schema:
        type: string
        format: date
        maxLength: 10
        example: '2025-12-31'
    ParamQueryPerPage:
      name: per_page
      in: query
      description: >-
        Specify the number of records to return per page. The maximum value is
        200.
      required: false
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 200
        default: 200
        example: 200
    ParamQueryType:
      name: type
      in: query
      description: >-
        Specify the automation feature type to filter usage data. When omitted,
        returns usage across all supported feature types.

        Possible values:

        workflow_rules - Filters usage data for Workflow Rules.

        approval_process - Filters usage data for Approval Processes.

        blueprint - Filters usage data for Blueprint Processes.

        orchestrations - Filters usage data for Orchestrations.

        wizards - Filters usage data for Wizards.

        modules - Filters usage data for module-level limits.

        email_notifications - Filters usage data for email notification actions.

        email_templates - Filters usage data for Email Templates.

        kiosks - Filters usage data for Kiosks.

        cadences - Filters usage data for Cadences.

        connected_workflows - Filters usage data for connected workflows.
      required: false
      schema:
        type: string
        enum:
          - workflow_rules
          - approval_process
          - blueprint
          - orchestrations
          - wizards
          - modules
          - email_notifications
          - email_templates
          - kiosks
          - cadences
          - connected_workflows
        maxLength: 50
    ParamQueryFilter:
      name: filters
      in: query
      description: >-
        Specify the filter criteria as a JSON-encoded string to narrow the list
        of email notifications returned. Supported filter field:
        `field.api_name='name'` with `comparator='contains'`. The value field is
        dynamic and varies based on the filter input.
      required: false
      schema:
        type: string
        maxLength: 10000
        example: >-
          {"field":{"api_name":"name"},"comparator":"contains","value":"<dynamic>"}
    ParamQuerySortBy:
      name: sort_by
      in: query
      description: >-
        Specify the field by which to sort the results. Currently, only
        `modified_time` is supported.
      required: false
      schema:
        type: string
        enum:
          - modified_time
    ParamQueryGroupBy:
      name: group_by
      in: query
      description: >-
        Specify the grouping criteria for usage report data. The value must
        include `date`. Two combinations are accepted:

        `date` - Returns daily totals; the response omits the resource object,
        and the count represents the total number of alerts sent that day.

        `date,resource` - Returns per-action rows with the resource identifier
        and name populated; type is an optional addition.
      required: true
      schema:
        type: string
        enum:
          - date
          - date,resource
          - date,resource,type
        maxLength: 100
    ParamQueryPage:
      name: page
      in: query
      description: >-
        Specify the page number to retrieve results from. The first page is page
        one.
      required: false
      schema:
        type: integer
        format: int32
        minimum: 1
        default: 1
        example: 1
    ParamQueryFrom:
      name: from
      in: query
      description: >-
        Specify the start date (inclusive) for the date range filter, in
        YYYY-MM-DD format. The date is evaluated in the organization's time
        zone. When omitted, defaults to 30 days before the value set for the end
        date parameter. Future dates return an INVALID_DATA error.
      required: false
      schema:
        type: string
        format: date
        maxLength: 10
        example: '2025-12-01'
    ParamQueryFeatureType:
      name: feature_type
      in: query
      description: >-
        Specify the automation feature type to filter the results. When omitted,
        returns email notifications across all feature types.
      required: false
      schema:
        type: string
        description: >-
          Automation feature type filter. When omitted, returns all email
          notifications regardless of feature type. 'workflow'  - workflow
          rules. 'approval_process'  - approval workflows. 'blueprint' /
          'blueprint_transition' / 'blueprint_state'  - blueprint stages.
          'review_process'  - review processes. 'orchestration'  - orchestration
          flows. 'assignment_rules'  - assignment rules. 'kiosk'  - kiosk
          actions. 'pathfinder'  - pathfinder. 'connected_workflows'  -
          connected workflows. 'commandcenter_service'  - command center.
          'cadences'  - cadence actions.
        enum:
          - workflow
          - approval_process
          - blueprint
          - blueprint_transition
          - blueprint_state
          - review_process
          - orchestration
          - assignment_rules
          - kiosk
          - pathfinder
          - connected_workflows
          - commandcenter_service
          - cadences
        maxLength: 255
    ParamQueryModule:
      name: module
      in: query
      description: >-
        Specify the API name of the CRM module to filter the results. Refer to
        the [Get Modules](modules.yaml#$.paths./settings/modules.get) resource
        for valid values.
      required: false
      schema:
        type: string
        maxLength: 255
        example: Leads
    ParamQuerySortOrder:
      name: sort_order
      in: query
      description: |-
        Specify the sort order for the results.
        Possible values:
        desc - Sorts the results in descending order.
        asc - Sorts the results in ascending order.
      required: false
      schema:
        type: string
        enum:
          - desc
          - asc
    ParamQueryIds:
      name: ids
      in: query
      description: >-
        Specify the unique IDs of the email notifications to delete. Accepts
        comma-separated values. Maximum: 10.
      x-zs-llm-description: >-
        Comma-separated IDs of the email notifications to delete (e.g.,
        '111111000000012345,111111000000012346'). Maximum 10 IDs per request.
        Each ID must be a numeric string. Deletion may fail for notifications
        associated with workflows/approvals/blueprints, returning NOT_ALLOWED.
        Partial failures are possible; check individual response items.
      required: true
      schema:
        type: string
        maxLength: 250
        example: 111111000000012345,111111000000012346
    ParamQueryIncludeInnerDetails:
      name: include_inner_details
      in: query
      description: >-
        Specify the additional detail fields to include in the response. Accepts
        comma-separated values to request more than one.
      x-zs-llm-description: >-
        Comma-separated; the server splits on ',' and applies each token, so the
        enum constrains a single token only. 'module.plural_label' and
        'related_module.plural_label' add module_name, plural_label and
        singular_label inside that module object. 'from_address.field_label'
        adds the field label to the from_address object. Unrecognised tokens are
        ignored.
      required: false
      schema:
        type: string
        enum:
          - module.plural_label
          - related_module.plural_label
          - from_address.field_label
    ParamQueryUsageIncludeInnerDetails:
      name: include_inner_details
      in: query
      description: >-
        Specify the additional nested fields to include in usage report resource
        objects. Currently, only `resource.layout_id` is supported, which adds
        the layout ID inside the resource object when available, primarily for
        wizard usage rows. Other values are silently ignored.
      required: false
      schema:
        type: string
        enum:
          - resource.layout_id
        maxLength: 50
  securitySchemes:
    OAuth2:
      type: oauth2
      description: OAuth2 authentication for API access
      flows:
        authorizationCode:
          authorizationUrl: https://accounts.zoho.com/oauth/v2/auth
          tokenUrl: https://accounts.zoho.com/oauth/v2/token
          refreshUrl: https://accounts.zoho.com/oauth/v2/token
          scopes:
            ZohoCRM.settings.automation_actions.READ: Access to ZohoCRM.settings.automation_actions scope
            ZohoCRM.settings.automation_actions.CREATE: Access to ZohoCRM.settings.automation_actions scope
            ZohoCRM.settings.automation_actions.UPDATE: Access to ZohoCRM.settings.automation_actions scope
            ZohoCRM.settings.automation_actions.DELETE: Access to ZohoCRM.settings.automation_actions scope
