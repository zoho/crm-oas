  /settings/automation/email_notifications/{id}:
    get:
      summary: Get an Email Notification by ID
      description: >-
        Retrieves the details of a specific email notification configured in
        your Zoho CRM organization.
      x-zs-llm-description: >-
        Retrieves the full definition of one email notification including
        recipients, from_address, reply_to_address, template, module,
        bulk_email, and audit metadata; supply the notification definition ID as
        the id path param. Returns 204 when the notification does not exist. Run
        this to review current state before issuing a PUT.
      operationId: getEmailNotificationsById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            maxLength: 20
          description: >-
            Specify the unique ID of the email notification definition to
            retrieve.
        - $ref: '#/components/parameters/ParamQueryIncludeInnerDetails'
      responses:
        '200':
          description: Returns the details of the specified email notification.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailNotificationByIdResponse'
              examples:
                Success200:
