          enum:
            - INVALID_DATA
        details:
          type: object
          additionalProperties: false
          description: >-
            Represents additional details about the error, including the index
            position of the invalid identifier in the request path.
          properties:
            resource_path_index:
              type: integer
              format: int32
              description: >-
                Represents the index position of the invalid email notification
                ID within the request path context.
        message:
          type: string
          description: Represents the error message describing why the request failed.
          example: the id given seems to be invalid
          maxLength: 255
        status:
          type: string
          description: |-
            Represents the status of the API response for this error.
            Possible values:
            error - Indicates that the request failed due to invalid data.
          enum:
            - error
      required:
        - code
        - details
        - message
        - status
      title: Single Delete Invalid Data Error
    SingleDeleteNotAllowedError:
      type: object
      x-zs-$id: SingleDeleteNotAllowedError
      additionalProperties: false
      description: >-
        Represents the error response returned when an email notification cannot
        be deleted because it is associated with an Approval Process, Workflow
        Rule, or Blueprint.
      x-zs-llm-description: >-
        Cannot delete  the notification is bound to an Approval Process,
        Workflow Rule, or Blueprint. Remove the association first.
      properties:
        code:
          type: string
          description: >-
            Represents the error code indicating that the delete operation is
            not allowed.

            Possible values:

            NOT_ALLOWED - The email notification cannot be deleted because it is
            associated with an Approval Process, Workflow Rule, or Blueprint.
          enum:
            - NOT_ALLOWED
        details:
          type: object
          additionalProperties: false
          description: >-
            Represents additional details about the error, including the
            position of the affected resource identifier in the request path.
          properties:
            resource_path_index:
              type: integer
              format: int32
              description: >-
                Represents the index position of the associated identifier
                within the request path context.
        message:
          type: string
          description: >-
            Represents the error message describing why the delete operation is
            not allowed.
          example: >-
            This email notification is associated with at least one of Approval
            Process/Workflow Rules/Blueprint
          maxLength: 255
        status:
          type: string
          description: |-
            Represents the status of the error response.
            Possible values:
            error - Indicates that the request resulted in an error.
          enum:
            - error
      required:
        - code
        - details
        - message
        - status
      title: Single Delete Not Allowed Error
    PermissionDeniedError:
      type: object
      x-zs-$id: PermissionDeniedError
      additionalProperties: false
      description: >-
        Represents an error response returned when the requesting user lacks the
        necessary permissions to perform the operation.
      x-zs-llm-description: >-
        The authenticated user's profile does not include the required
        permission for this operation. Check profile settings.
      properties:
        code:
          type: string
          description: >-
            Represents the error code indicating the reason the request was
            denied.

            Possible values:

            NO_PERMISSION - The requesting user does not have the required
            permission to perform this operation.
          enum:
            - NO_PERMISSION
        details:
          type: object
          additionalProperties: false
          description: >-
            Represents an object containing additional details about the
            permission denial, including the specific permissions that were
            missing.
          properties:
            permissions:
              type: array
              description: >-
                Represents the list of permissions that the requesting user
                lacks for the attempted operation.
              items:
                type: string
                description: >-
                  Represents a permission identifier indicating a specific
                  access right that was denied.
                maxLength: 255
              maxItems: 25
        message:
          type: string
          description: >-
            Represents the error message describing the reason the requested
            operation was denied.
          example: permission denied
          maxLength: 255
        status:
          type: string
          description: >-
            Represents the status of the response.

            Possible values:

            error - Indicates that the request failed due to insufficient
            permissions.
          enum:
            - error
      required:
        - code
        - details
        - message
        - status
      title: Permission Denied Error
    DirectRecipientMergeField:
      type: object
      x-zs-$id: DirectRecipientMergeField
      additionalProperties: false
      description: >-
        Represents a recipient resolved dynamically from a merge field, where
        the recipient address depends on the triggering record and is resolved
        at runtime. Merge field recipients fall into two categories: INTERNAL —
        fields resolving to CRM users, such as ${!Module.Owner} or
        ${!Module.Created_By}, for which from_address must not be provided and
        defaults to the first registered email address; and EXTERNAL — fields
        resolving to email-type fields (ui_type=25), such as ${!Module.Email} or
        ${!Module.Lookup.Email}, for which from_address is required. Use module
        and field metadata APIs to retrieve valid field API names.
      x-zs-llm-description: >-
        Use for dynamic recipients resolved from the triggering record at
        runtime. If the merge field resolves to a CRM user (owner, created_by),
        from_address is auto-assigned. If it resolves to an external email field
        (ui_type=25), from_address becomes required.
      properties:
        type:
          type: string
          description: >-
            Represents the recipient type for this entry.

            Possible values:

            merge_field - Indicates that the recipient address is resolved
            dynamically from a record field at runtime.
          enum:
            - merge_field
          maxLength: 255
        details:
          type: object
          additionalProperties: false
          description: >-
            Represents the merge-field details used to resolve the recipient
            address at runtime, including the field API name and an optional
            identifier.
          properties:
            api_name:
              type: string
              description: >-
                Represents the API name of the merge field used to resolve the
                recipient address. Sample references:
                ${!{module_API_name}.{field_API_name}} for direct fields, or
                ${!{module_API_name}.{lookup_APIname}.{field_API_name}} for
                lookup fields.
              maxLength: 100
            id:
              type: string
              description: >-
                Represents the identifier of the merge field used to resolve the
                recipient.
              maxLength: 255
          required:
            - api_name
        resource:
          type: 'null'
          description: >-
            Represents the resource associated with the recipient. Not
            applicable for merge_field recipients; this field is always null.
        associated_to:
          type: 'null'
          description: >-
            Represents the associated entity for the recipient. Not applicable
            for merge_field recipients; this field is always null.
      required:
        - type
        - details
      title: Direct Recipient Merge Field
    DirectRecipientEmails:
      type: object
      x-zs-$id: DirectRecipientEmails
      additionalProperties: false
      description: >-
        Represents a recipient configuration that uses explicit email addresses
        to specify notification targets. Provide one or more addresses in the
        details.emails array.
      x-zs-llm-description: >-
        Use when you have explicit email addresses to notify, not CRM user
        references. Provide addresses in the details.emails array.
      properties:
        type:
          type: string
          description: >-
            Represents the recipient type for this configuration.

            Possible values:

            emails - Indicates that recipients are specified using explicit
            email addresses.
          enum:
            - emails
          maxLength: 255
        details:
          type: object
          additionalProperties: false
          description: >-
            Represents the details object containing the email addresses for
            this recipient.
          properties:
            emails:
              type: array
              description: >-
                Represents the list of explicit email addresses to notify for
                this recipient.
              items:
                $ref: '#/components/schemas/RecipientEmailAddress'
              minItems: 1
              maxItems: 10
          required:
            - emails
        resource:
          type: 'null'
          description: >-
            Represents the resource reference for this recipient type. Not
            applicable for direct email address recipients.
        associated_to:
          type: 'null'
          description: >-
            Represents the associated resource for this recipient type. Not
            applicable for direct email address recipients.
      required:
        - type
        - details
      title: Direct Recipient Emails
    DirectRecipientUser:
      type: object
      x-zs-$id: DirectRecipientUser
      additionalProperties: false
      description: >-
        Represents a recipient resolved from a specific CRM user, used when the
        notification must be sent to a named individual. Retrieve the user ID
        from the Get Users endpoint. For private modules, set the
        `associated_to` field to `team_module` to include team-scoped users.
      x-zs-llm-description: >-
        Use to notify a specific named CRM user by their user ID. Fetch user ID
        from GET /settings/users.
      properties:
        type:
          type: string
          description: >-
            Represents the recipient type for the notification target. For
            direct user recipients, this value is always `user`.

            Possible values:

            user - The recipient is a specific CRM user identified by their user
            ID.
          enum:
            - user
          maxLength: 255
        resource:
          $ref: '#/components/schemas/ResourceIdentifierUser'
          description: User resource (name/id) from Zoho CRM Users API.
        details:
          type: 'null'
          description: >-
            Represents additional details for the recipient. Not applicable for
            user recipients.
        associated_to:
          type:
            - string
            - 'null'
          description: >-
            Indicates the scope context for recipient resolution. Set to
            `team_module` when the notification module is a private module where
            record visibility is restricted to team members. When set, only
            team-scoped users and profiles are included. Leave null for standard
            modules.

            Possible values:

            team_module - The notification module is a private (team) module;
            only team-scoped users and profiles are included as recipients.

            null - The notification module is a standard module; all applicable
            users and profiles are included.
          enum:
            - team_module
            - null
          maxLength: 255
      required:
        - type
        - resource
      title: Direct Recipient User
    DirectRecipientProfile:
      type: object
      x-zs-$id: DirectRecipientProfile
      additionalProperties: false
      description: >-
        Represents a notification recipient resolved by a CRM profile, used to
        notify all users sharing a specific profile or permission level. Refer
        to the GET /settings/profiles endpoint to retrieve valid profile IDs.
        For private (team) modules, set the `associated_to` field to
        `team_module`.
      x-zs-llm-description: >-
        Use to notify all users sharing a specific profile (permission level).
        Fetch profile ID from GET /settings/profiles.
      properties:
        type:
          type: string
          description: >-
            Represents the recipient type for this notification recipient
            definition.

            Possible values:

            profile - The recipient is resolved by a CRM profile, notifying all
            users who share that profile.
          enum:
            - profile
          maxLength: 255
        resource:
          $ref: '#/components/schemas/ResourceIdentifierProfile'
          description: Profile resource (name/id) from Zoho CRM Profiles API.
        details:
          type: 'null'
          description: >-
            Represents additional recipient details. This field is not
            applicable for profile recipients and is always null.
        associated_to:
          type:
            - string
            - 'null'
          description: >-
            Indicates whether the notification module is a private (team)
            module. Set to `team_module` when the notification targets a private
            module. Leave null for standard modules.

            Possible values:

            team_module - The notification module is a private (team) module.
          enum:
            - team_module
            - null
          maxLength: 255
      required:
        - type
        - resource
      title: Direct Recipient Profile
    DirectRecipientGroup:
      type: object
      x-zs-$id: DirectRecipientGroup
      additionalProperties: false
      description: >-
        Represents a recipient resolved from a CRM user group, used when all
        members of a group should receive an email notification. Group IDs can
        be retrieved from the GET /settings/groups endpoint. Not supported in
        the recipients.to field when bulk_email is true.
      x-zs-llm-description: >-
        Use to notify all members of a CRM group. Not allowed in recipients.to
        when bulk_email is true.
      properties:
        type:
          type: string
          description: >-
            Represents the recipient type for this group recipient.

            Possible values:

            group - Indicates that the recipient is resolved from a CRM user
            group.
          enum:
            - group
          maxLength: 255
        resource:
          $ref: '#/components/schemas/ResourceIdentifierGroup'
          description: Group resource (name/id) from Zoho CRM Groups API.
        details:
          type: 'null'
          description: >-
            Represents additional recipient details. Not applicable for group
            recipients.
        associated_to:
          type: 'null'
          description: >-
            Represents the associated record for this recipient. Not applicable
            for group recipients.
      required:
        - type
        - resource
      title: Direct Recipient Group
    DirectRecipientRole:
      type: object
      x-zs-$id: DirectRecipientRole
      additionalProperties: false
      description: >-
        Represents a recipient resolved by a CRM role, used to notify all users
        assigned to a specific role. The role identifier must be retrieved from
        the GET /settings/roles endpoint. This recipient type is not supported
        in the recipients.to field when bulk_email is true.
      x-zs-llm-description: >-
        Use to notify all users assigned a specific role. Not allowed in
        recipients.to when bulk_email is true.
      properties:
        type:
          type: string
          description: >-
            Represents the recipient type for this role-based recipient entry.

            Possible values:

            role - Identifies the recipient as resolved by a CRM role, sending
            notifications to all users assigned to that role.
          enum:
            - role
          maxLength: 255
        resource:
          $ref: '#/components/schemas/ResourceIdentifierRole'
          description: Role resource (name/id) from Zoho CRM Roles API.
        details:
          type: 'null'
          description: >-
            Represents additional details about the recipient. Not applicable
            for role recipients.
        associated_to:
          type: 'null'
          description: >-
            Represents the associated record context for the recipient. Not
            applicable for role recipients.
      required:
        - type
        - resource
      title: Direct Recipient Role
    DirectRecipientRoleAndSubordinate:
      type: object
      x-zs-$id: DirectRecipientRoleAndSubordinate
      additionalProperties: false
      description: >-
        Represents a recipient resolved from a role and all subordinate roles
        below it in the hierarchy, used when a notification must reach a manager
        and everyone reporting under that role. The role ID must be retrieved
        from the GET /settings/roles endpoint. This recipient type is not
        supported in recipients.to when bulk_email is true.
      x-zs-llm-description: >-
        Use to notify a role plus all subordinate roles in the hierarchy. Not
        allowed in recipients.to when bulk_email is true.
      properties:
        type:
          type: string
          description: >-
            Represents the recipient type for this notification target.

            Possible values:

            role_and_subordinate - Resolves the recipient from a role and all
            subordinate roles below it in the hierarchy.
          enum:
            - role_and_subordinate
          maxLength: 255
        resource:
          $ref: '#/components/schemas/ResourceIdentifierRole'
          description: Role resource (name/id) from Zoho CRM Roles API.
        details:
          type: 'null'
          description: >-
            Represents additional details for the recipient. Not applicable for
            role_and_subordinate recipients.
        associated_to:
          type: 'null'
          description: >-
            Represents the associated record for this recipient. Not applicable
            for role_and_subordinate recipients.
      required:
        - type
        - resource
      title: Direct Recipient Role And Subordinate
    DirectRecipientTerritory:
      type: object
      x-zs-$id: DirectRecipientTerritory
      additionalProperties: false
      description: >-
        Represents a recipient resolved from a sales territory in Zoho CRM, used
        to notify all users assigned to a specific territory. The territory
        resource ID must be retrieved from the GET /settings/territories
        endpoint. This recipient type is not supported in the recipients.to
        field when bulk_email is true.
      x-zs-llm-description: >-
        Use to notify all users in a specific sales territory. Not allowed in
        recipients.to when bulk_email is true.
      properties:
        type:
          type: string
          description: >-
            Represents the recipient type for this territory-based recipient
            entry.

            Possible values:

            territory - Indicates that the recipient is resolved from a sales
            territory, notifying all users assigned to that territory.
          enum:
            - territory
          maxLength: 255
        resource:
          $ref: '#/components/schemas/ResourceIdentifierTerritory'
          description: Territory resource (name/id) from Zoho CRM Territories API.
        details:
          type: 'null'
          description: >-
            Represents additional details for this recipient. Not applicable for
            territory recipients.
        associated_to:
          type: 'null'
          description: >-
            Indicates the associated record for this recipient. Not applicable
            for territory recipients.
      required:
        - type
        - resource
      title: Direct Recipient Territory
    DirectRecipientTerritoryAndSubterritory:
      type: object
      x-zs-$id: DirectRecipientTerritoryAndSubterritory
      additionalProperties: false
      description: >-
        Represents a recipient resolved from a Territory and all its child
        sub-territories, used when notifying an entire territory hierarchy. The
        territory identifier can be retrieved from the Territories API. This
        recipient type is not supported in recipients.to when bulk_email is
        true.
      x-zs-llm-description: >-
        Use to notify an entire territory hierarchy including sub-territories.
        Not allowed in recipients.to when bulk_email is true.
      properties:
        type:
          type: string
          description: >-
            Represents the recipient type for this entry.

            Possible values:

            territory_and_subterritory - Indicates that the recipient is
            resolved from a Territory and all its child sub-territories.
          enum:
            - territory_and_subterritory
          maxLength: 255
        resource:
          $ref: '#/components/schemas/ResourceIdentifierTerritory'
          description: Territory resource (name/id) from Zoho CRM Territories API.
        details:
          type: 'null'
          description: >-
            Represents additional details for this recipient. Not applicable for
            territory_and_subterritory recipients.
        associated_to:
          type: 'null'
          description: >-
            Represents the associated record for this recipient. Not applicable
            for territory_and_subterritory recipients.
      required:
        - type
        - resource
      title: Direct Recipient Territory And Subterritory
    DirectRecipients:
      description: >-
        Represents a recipient object used in the to, cc, and bcc arrays of an
        email notification's recipients configuration. Choose the variant based
        on the intended recipient type: merge_field resolves dynamically from
        the record (owner, created_by, or lookup email); emails specifies
        explicit email addresses; user targets a specific CRM user by ID;
        profile targets all users assigned to a profile; group targets all users
        in a group; role targets all users with a role; role_and_subordinate
        targets a role and its reporting hierarchy; territory targets a sales
        territory; territory_and_subterritory targets a territory and its
        sub-territory hierarchy. When bulk_email is true, only merge_field,
        emails, and user types are permitted in the to array — role, group,
        territory, role_and_subordinate, and territory_and_subterritory types
        are not allowed.
      x-zs-llm-description: >-
        Union (oneOf)  select the recipient variant matching who should receive
        the email. When bulk_email is true, only merge_field, emails, and user
        types are allowed in recipients.to.
      discriminator:
        propertyName: type
        mapping:
          merge_field: '#/components/schemas/DirectRecipientMergeField'
          emails: '#/components/schemas/DirectRecipientEmails'
          user: '#/components/schemas/DirectRecipientUser'
          profile: '#/components/schemas/DirectRecipientProfile'
          group: '#/components/schemas/DirectRecipientGroup'
          role: '#/components/schemas/DirectRecipientRole'
          role_and_subordinate: '#/components/schemas/DirectRecipientRoleAndSubordinate'
          territory: '#/components/schemas/DirectRecipientTerritory'
          territory_and_subterritory: '#/components/schemas/DirectRecipientTerritoryAndSubterritory'
      oneOf:
        - $ref: '#/components/schemas/DirectRecipientMergeField'
        - $ref: '#/components/schemas/DirectRecipientEmails'
        - $ref: '#/components/schemas/DirectRecipientUser'
        - $ref: '#/components/schemas/DirectRecipientProfile'
        - $ref: '#/components/schemas/DirectRecipientGroup'
        - $ref: '#/components/schemas/DirectRecipientRole'
        - $ref: '#/components/schemas/DirectRecipientRoleAndSubordinate'
        - $ref: '#/components/schemas/DirectRecipientTerritory'
        - $ref: '#/components/schemas/DirectRecipientTerritoryAndSubterritory'
      title: Direct Recipients
    CreateEmailNotificationSuccessResponse:
      type: object
      x-zs-$id: CreateEmailNotificationSuccessResponse
      additionalProperties: false
