      properties:
        id:
          type: string
          description: >-
            Represents the unique identifier of the merge field. Applicable only
            when the type is merge_field.
          maxLength: 255
        email:
          type: string
          description: >-
            Represents the email address associated with the recipient or sender
            in the notification definition.
          maxLength: 255
        api_name:
          type: string
          description: >-
            Represents the API name of the merge field used to resolve the email
