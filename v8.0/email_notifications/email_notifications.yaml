openapi: 3.1.0
info:
  title: Email Notifications
  description: >-
    An email notification is an automated action in Zoho CRM that sends an email
    to specified recipients when the conditions of an automation are met.
    Recipients can be specified using email fields and user fields of module
    records, as well as users, roles, and groups. Email notifications can be
    linked to workflow rules, approval processes, blueprints, scoring rules, and
    other automation features. This API enables developers to create, retrieve,
    update, and delete email notification actions.
  x-zs-llm-description: >-
    PURPOSE: Updates an existing email notification action identified by the
    path parameter ID. PREREQUISITES: (1) Call GET
    /settings/automation/email_notifications/{id} to obtain the current
    notification structure. (2) Fetch available email templates from the Email
    Templates API. If no template exists yet for that module, create one first
    via the createEmailTemplate tool and then associate it here. BEHAVIOR:
    Partial update - the payload is merged over the stored record, so any key
    you omit keeps its current value. Only name, template, recipients,
    from_address, and reply_to_address can be modified. KEY CONSTRAINTS: module,
    related_module, bulk_email, and feature_type are immutable after creation.
    Locked notifications return 401 with code unauthorized.
  version: '8'
servers:
  - url: https://zohoapis.{dc}/crm/{version}
    description: API Server URL
    variables:
      dc:
        description: API Server URL TLD
        default: com
        enum:
          - com
          - eu
          - in
          - cn
          - au
          - ca
          - jp
      version:
        description: API Version
        default: v8
paths:
  /settings/automation/email_notifications:
    get:
      summary: List Email Notifications
      description: >-
        Retrieves the list of email notifications configured in your Zoho CRM
        organization.
      x-zs-llm-description: >-
        Fetches a paginated list of email notification definitions; narrow
        results by module, related_module, feature_type, or name via the filter
        param. page defaults to 1, per_page defaults to 200 (max 200); check
        more_records to see if further pages exist. A 204 means no notifications
        matched the filters. Run this before PUT/DELETE to look up notification
        IDs.
      operationId: getEmailNotifications
      parameters:
        - $ref: '#/components/parameters/ParamQueryFilter'
        - $ref: '#/components/parameters/ParamQueryModule'
        - $ref: '#/components/parameters/ParamQueryRelatedModule'
        - $ref: '#/components/parameters/ParamQueryFeatureType'
        - $ref: '#/components/parameters/ParamQueryPage'
        - $ref: '#/components/parameters/ParamQueryPerPage'
        - $ref: '#/components/parameters/ParamQuerySortBy'
        - $ref: '#/components/parameters/ParamQuerySortOrder'
      responses:
        '200':
          description: >-
            Returns a paginated list of email notifications configured in the
            Zoho CRM organization, along with pagination state in the info
            object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailNotificationsResponse'
              examples:
                Success200:
                  summary: Successful retrieval of all email notifications
                  value:
                    email_notifications:
                      - template:
                          name: LeadAlert
                          id: '6660682000001292005'
                        reply_to_address:
                          resource:
                            id: '6660682000000501001'
                          type: user
                        created_time: '2025-07-06T16:15:58+05:30'
                        lock_status:
                          locked: false
                        editable: true
                        module:
                          api_name: Leads
                          id: '6660682000000002175'
                        related_module: null
                        deletable: true
                        recipient_count: '1'
                        source: crm
                        created_by:
                          name: Patricia Boyle
                          id: '6660682000000501001'
                        feature_type: workflow
                        modified_time: '2025-07-06T16:15:58+05:30'
                        associated: true
                        name: NewLeadAlert
                        modified_by:
                          name: Patricia Boyle
                          id: '6660682000000501001'
                        id: '6660682000001435009'
                        from_address:
                          resource:
                            id: '6660682000000501001'
                          type: user
                      - template:
                          name: Big Deal Alert
                          id: '6660682000000000079'
                        created_time: '2025-02-26T14:35:51+05:30'
                        lock_status:
                          locked: false
                        editable: true
                        module:
                          api_name: Deals
                          id: '6660682000000002181'
                        related_module: null
                        deletable: true
                        recipient_count: '1'
                        source: crm
                        created_by:
                          name: Patricia Boyle
                          id: '6660682000000501001'
                        feature_type: workflow
                        modified_time: '2025-02-26T14:35:51+05:30'
                        associated: true
                        name: Big Deal Alert
                        modified_by:
                          name: Patricia Boyle
                          id: '6660682000000501001'
                        id: '6660682000000000353'
                        from_address:
                          details:
                            email: notifications@zohocrm.com
                          type: email
                    info:
                      per_page: 200
                      count: 2
                      page: 1
                      more_records: false
          headers:
            X-API-CREDITS-REMAINING:
              schema:
                type: string
                format: int64
                description: >
                  Present when >=50% of base daily credits (excluding add-on
                  credits) are consumed. Value is total remaining credits
                  including add-on credits for the rolling 24-hour window.
              required: false
        '400':
          description: >-
            The query parameter value in the request is invalid. Resolution: The
            feature_type or related_module parameter value must be valid before
            resubmitting the request.
          content:
            application/json:
              schema:
                x-zs-$id: GetEmailNotificationsError400
                oneOf:
                  - $ref: '#/components/schemas/InvalidFeatureTypeError'
                  - $ref: '#/components/schemas/InvalidModuleParamError'
              examples:
                InvalidDataResponse1:
                  summary: >-
                    INVALID_DATA error when feature_type parameter value is
                    invalid
                  value:
                    code: INVALID_DATA
                    details:
                      param_name: feature_type
                    message: feature type is invalid
                    status: error
                InvalidModuleParam:
                  summary: >-
                    INVALID_MODULE error when the module query parameter cannot
                    be resolved
                  value:
                    code: INVALID_MODULE
                    details:
                      param_name: module
                    message: The value provided to the param is Invalid
                    status: error
          headers:
            X-API-CREDITS-REMAINING:
              schema:
                type: string
                format: int64
                description: >
                  Present when >=50% of base daily credits (excluding add-on
                  credits) are consumed. Value is total remaining credits
                  including add-on credits for the rolling 24-hour window.
              required: false
        '403':
          description: >-
            Permission denied to retrieve email notifications. Resolution: The
            CRM administrator must grant the manage workflow permission to the
            user's profile.
          content:
            application/json:
              schema:
                x-zs-$id: PermissionDeniedErrorWrapper
                $ref: '#/components/schemas/PermissionDeniedError'
              examples:
                NoPermissionResponse1:
                  summary: >-
                    NO_PERMISSION error when the user lacks workflow management
                    permission
                  value:
                    code: NO_PERMISSION
                    details:
                      permissions:
                        - Crm_Implied_manage_workflow
                    message: permission denied
                    status: error
          headers:
            X-API-CREDITS-REMAINING:
              schema:
                type: string
                format: int64
                description: >
                  Present when >=50% of base daily credits (excluding add-on
                  credits) are consumed. Value is total remaining credits
                  including add-on credits for the rolling 24-hour window.
              required: false
      security:
        - OAuth2:
            - ZohoCRM.settings.automation_actions.READ
    post:
      summary: Create Email Notifications
      description: >-
        Creates an email notification action in your Zoho CRM organization by
        defining its name, associated module, email template, sender details,
        and recipients. The email notification can be linked to automation rules
        so that emails are automatically triggered when the specified conditions
        are met. A pre-existing Email Template is required before creating an
        email notification; the template ID must be referenced in the request
        payload.
      x-zs-llm-description: >-
        PURPOSE: Creates an email notification action that can be linked to
        workflow rules, approval processes, blueprints, kiosks, scoring rules,
        and case escalation rules. PREREQUISITES: (1) Call GET /settings/modules
        to discover valid module api_names. (2) Fetch available email templates
        from the Email Templates API for the configured module. If no template
        exists yet for that module, create one first via the createEmailTemplate
        tool and then associate it here. STRUCTURE: The request body contains an
        email_notifications array with exactly 1 object. MANDATORY: name,
        module, template, and recipients (at least one in recipients.to).
        Returns the created notification ID.
      x-zs-llm-examples:
        - SamplePostRequest
      operationId: postEmailNotifications
      requestBody:
        description: >-
          The request body must contain an email_notifications array with one
          object.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEmailNotificationsRequest'
            examples:
              SamplePostRequest:
                summary: >-
                  Create an email notification for the Deals module with
                  multiple recipient types
                value:
                  email_notifications:
                    - bulk_email: false
                      module:
                        api_name: Deals
                        id: '6660682000000002181'
                      name: BigDealNotify
                      recipients:
                        to:
                          - details:
                              api_name: ${!Deals.Created_By}
                            type: merge_field
                          - details:
                              api_name: ${!Deals.Owner}
                            type: merge_field
                          - details:
                              api_name: ${!Deals.Owner.Reporting_To}
                            type: merge_field
                          - details:
                              api_name: ${!Deals.Campaign_Source.Owner}
                            type: merge_field
                          - details:
                              api_name: ${!Deals.Campaign_Source.Created_By}
                            type: merge_field
                          - details:
                              api_name: ${!Deals.Account_Name.Owner}
                            type: merge_field
                          - details:
                              api_name: ${!Deals.Account_Name.Created_By}
                            type: merge_field
                          - resource:
                              name: Patricia Boyle
                              id: '6660682000000501001'
                            type: user
                          - details:
                              api_name: ${!Deals.Contact_Name.Email}
                            type: merge_field
                          - resource:
                              name: UserGroup
                              id: '6660682000001441002'
                            type: group
                          - resource:
                              name: CEO
                              id: '6660682000000026005'
                            type: role
                          - resource:
                              name: Manager
                              id: '6660682000000026008'
                            type: role_and_subordinate
                          - resource:
                              name: Territory_EU
                              id: '6660682000001453003'
                            type: territory
                          - resource:
                              name: CEO
                              id: '6660682000001454004'
                            type: territory_and_subterritory
                      from_address:
                        resource:
                          id: '6660682000000501001'
                        type: user
                      reply_to_address:
                        resource:
                          id: '6660682000000501001'
                        type: user
                      template:
                        name: Big Deal Alert
                        id: '6660682000000000079'
      responses:
        '201':
          description: >-
            Returns the unique identifier of the newly created email
            notification action.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateEmailNotificationSuccessResponse'
              examples:
                Success201:
                  summary: Successful creation of an email notification
                  value:
                    email_notifications:
                      - code: SUCCESS
                        details:
                          id: '6660682000001456001'
                        message: alert created successfully
                        status: success
          headers:
            X-API-CREDITS-REMAINING:
              schema:
                type: string
                format: int64
                description: >
                  Present when >=50% of base daily credits (excluding add-on
                  credits) are consumed. Value is total remaining credits
                  including add-on credits for the rolling 24-hour window.
              required: false
        '400':
          description: >-
            The request contains invalid or missing data. Resolution: The
            request must include all mandatory fields with valid values. The
            module API name and ID must refer to the same module, the
            email_notifications array must not exceed one object, and recipient
            details must be complete and correctly formatted.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                description: >-
                  Represents the error response returned when the create email
                  notification request fails validation. The structure varies
                  depending on the specific validation error encountered.
                x-zs-$id: CreateEmailNotificationErrorResponse
              examples:
                InvalidDataResponse1:
                  summary: >-
                    INVALID_DATA error for email_notifications array exceeding
                    maximum length
                  value:
                    code: INVALID_DATA
                    details:
                      maximum_length: 1
                      api_name: email_notifications
                      json_path: $.email_notifications
                    message: invalid data
                    status: error
                InvalidModuleResponse1:
                  summary: >-
                    INVALID_MODULE error when the module ID in the request is
                    invalid
                  value:
                    email_notifications:
                      - code: INVALID_MODULE
                        details:
                          api_name: id
                          json_path: $.email_notifications[0].module.id
                        message: the module name given seems to be invalid
                        status: error
                AmbiguityDuringProcessingResponse1:
                  summary: >-
                    AMBIGUITY_DURING_PROCESSING error when a required field is
                    missing
                  value:
                    email_notifications:
                      - code: AMBIGUITY_DURING_PROCESSING
                        message: required field not found
                        status: error
                        details:
                          ambiguity_due_to:
                            - api_name: id
                              json_path: $.email_notifications[0].module.id
                            - api_name: api_name
                              json_path: $.email_notifications[0].module.api_name
                ExpectedFieldMissingResponse1:
                  summary: >-
                    EXPECTED_FIELD_MISSING error — module id or api_name not
                    specified
                  value:
                    email_notifications:
                      - code: EXPECTED_FIELD_MISSING
                        details:
                          expected_fields:
                            - api_name: id
                              json_path: $.email_notifications[0].module.id
                            - api_name: api_name
                              json_path: $.email_notifications[0].module.api_name
                        message: Specify At least one field
                        status: error
                MultipleOrMultiErrorsResponse1:
                  summary: >-
                    MULTIPLE_OR_MULTI_ERRORS response when selected recipients
                    are unavailable
                  value:
                    email_notifications:
                      - code: MULTIPLE_OR_MULTI_ERRORS
                        details:
                          api_name: recipients
                          json_path: $.email_notifications[0].recipients
                          error:
                            - code: INVALID_DATA
                              details:
                                api_name: api_name
                                json_path: >-
                                  $.email_notifications[0].recipients.to[0].resource.api_name
                              message: Selected recipient is unavailable
                              status: error
                        message: Some selected recipients are not available
                        status: error
                InvalidDataResponse2:
                  summary: >-
                    INVALID_DATA error — unsupported value passed for
                    associated_to field
                  value:
                    email_notifications:
                      - code: INVALID_DATA
                        details:
                          api_name: associated_to
                          json_path: >-
                            $.email_notifications[0].recipients.to[0].associated_to
                          supported_values:
                            - team_module
                        message: invalid associated_to passed
                        status: error
                DependentMismatchResponse1:
                  summary: >-
                    DEPENDENT_MISMATCH error when associated_to is not supported
                    for the selected type
                  value:
                    email_notifications:
                      - code: DEPENDENT_MISMATCH
                        details:
                          dependee:
                            api_name: type
                            json_path: $.email_notifications[0].recipients.to[0].type
                          api_name: associated_to
                          json_path: >-
                            $.email_notifications[0].recipients.to[0].associated_to
                        message: associated_to not supported for the selected type
                        status: error
                InvalidDataResponse3:
                  summary: INVALID_DATA error — invalid ID supplied for the template
                  value:
                    email_notifications:
                      - code: INVALID_DATA
                        details:
                          api_name: id
                          json_path: $.email_notifications[0].template.id
                        message: the id given seems to be invalid
                        status: error
                InvalidDataResponse4:
                  summary: >-
                    INVALID_DATA error — invalid reply-to address in email
                    notification
                  value:
                    email_notifications:
                      - code: INVALID_DATA
                        details:
                          api_name: reply_to_address
                          json_path: $.email_notifications[0].reply_to_address
                        message: please specify a valid from/To address
                        status: error
                InvalidDataResponse5:
                  summary: >-
                    INVALID_DATA error — special characters not allowed in
                    notification name
                  value:
                    email_notifications:
                      - code: INVALID_DATA
                        details:
                          api_name: name
                          json_path: $.email_notifications[0].name
                        message: Special characters not allowed
                        status: error
                InvalidDataResponse6:
                  summary: >-
                    INVALID_DATA error when email notification name exceeds the
                    maximum length
                  value:
                    email_notifications:
                      - code: INVALID_DATA
                        details:
                          api_name: name
                          maximum_limit: 250
                          json_path: $.email_notifications[0].name
                        message: The lenght of name has exceeded the limit
                        status: error
                AmbiguityDuringProcessingResponse2:
                  summary: >-
                    AMBIGUITY_DURING_PROCESSING error when CC recipients are
                    added without enabling bulk_email
                  value:
                    email_notifications:
                      - code: AMBIGUITY_DURING_PROCESSING
                        message: Set bulk_email as true to pass cc
                        status: error
                        details:
                          ambiguity_due_to:
                            - api_name: id
                              json_path: $.email_notifications[0].bulk_email
                            - api_name: api_name
                              json_path: $.email_notifications[0].recipients.cc
                DepentdentMismatchResponse1:
                  summary: >-
                    DEPENDENT_MISMATCH error when from_address cannot be
                    associated with the to address type
                  value:
                    email_notifications:
                      - code: DEPENDENT_MISMATCH
                        details:
                          dependee:
                            api_name: from_address
                            json_path: $.email_notifications[0].from_address
                          api_name: type
                          json_path: $.email_notifications.recipients.to[0].type
                        message: >-
                          from_adress can not be associated for this 'to'
                          address type
                        status: error
                AmbiguityDuringProcessingResponse3:
                  summary: >-
                    AMBIGUITY_DURING_PROCESSING error when BCC recipients are
                    added without enabling bulk_email
                  value:
                    email_notifications:
                      - code: AMBIGUITY_DURING_PROCESSING
                        message: Set bulk_email as true to pass cc
                        status: error
                        details:
                          ambiguity_due_to:
                            - api_name: id
                              json_path: $.email_notifications[0].bulk_email
                            - api_name: api_name
                              json_path: $.email_notifications[0].recipients.cc
                DependentMismatchResponse2:
                  summary: >-
                    DEPENDENT_MISMATCH error when roles, groups, or territories
                    are used as to recipients with bulk_email true
                  value:
                    email_notifications:
                      - code: DEPENDENT_MISMATCH
                        details:
                          dependee:
                            api_name: bulk_email
                            json_path: $.email_notifications[0].bulk_email
                          dependent_field:
                            api_name: to
                            json_path: $.email_notifications[0].recipients.to
                        message: >-
                          Roles, groups, and territories type emails in 'to'
                          cannot be associated when bulk_email is true.
                        status: error
                InvalidDataResponse7:
                  summary: >-
                    INVALID_DATA error when bulk_email field contains an
                    incorrect data type
                  value:
                    email_notifications:
                      - code: INVALID_DATA
                        message: Invalid data type
                        details:
                          api_name: bulk_email
                          expected_data_type: boolean
                          json_path: $.email_notifications[*].bulk_email
                        status: error
                InvalidDataResponse8:
                  summary: >-
                    INVALID_DATA error when feature_type field contains an
                    incorrect data type
                  value:
                    email_notifications:
                      - code: INVALID_DATA
                        message: Invalid data type
                        details:
                          api_name: feature_type
                          expected_data_type: text
                          json_path: $.email_notifications[*].feature_type
                        status: error
                InvalidDataResponse9:
                  summary: >-
                    INVALID_DATA error when feature_type field contains an
                    invalid value
                  value:
                    email_notifications:
                      - code: INVALID_DATA
                        message: Invalid data
                        details:
                          api_name: feature_type
                          maximum_length: 8
                          json_path: $.email_notifications[*].feature_type
                        status: error
                InvalidDataResponse10:
                  summary: INVALID_DATA error for unsupported feature_type value
                  value:
                    email_notifications:
                      - code: INVALID_DATA
                        message: Invalid data
                        details:
                          api_name: feature_type
                          supported_values:
                            - workflow
                          json_path: $.email_notifications[*].feature_type
                        status: error
                MandatoryNotFoundResponse1:
                  summary: 'MANDATORY_NOT_FOUND error for missing required field: module'
                  value:
                    email_notifications:
                      - code: MANDATORY_NOT_FOUND
                        message: Required field is missing
                        details:
                          api_name: module
                          json_path: $.email_notifications[*].module
                        status: error
                InvalidDataResponse11:
                  summary: INVALID_DATA error for incorrect data type on module field
                  value:
                    email_notifications:
                      - code: INVALID_DATA
                        message: Invalid data type
                        details:
                          api_name: module
                          expected_data_type: jsonobject
                          json_path: $.email_notifications[*].module
                        status: error
                InvalidDataResponse12:
                  summary: INVALID_DATA error for invalid module field value
                  value:
                    email_notifications:
                      - code: INVALID_DATA
                        message: Invalid data
                        details:
                          api_name: module
                          maximum_length: 1
                          json_path: $.email_notifications[*].module
                        status: error
                Error400Response1:
                  summary: INVALID_DATA error for invalid data type on api_name field
                  value:
                    email_notifications:
                      code: INVALID_DATA
                      message: Invalid data type
                      details:
                        api_name: api_name
                        expected_data_type: text
                        json_path: $.email_notifications[*].module.api_name
                      status: error
                Error400Response2:
                  summary: >-
                    INVALID_DATA error for api_name field exceeding maximum
                    length
                  value:
                    email_notifications:
                      code: INVALID_DATA
                      message: Invalid data
                      details:
                        api_name: api_name
                        maximum_length: 100
                        json_path: $.email_notifications[*].module.api_name
                      status: error
                Error400Response3:
                  summary: >-
                    INVALID_DATA error for invalid data type in the module ID
                    field
                  value:
                    email_notifications:
                      code: INVALID_DATA
                      message: Invalid data type
                      details:
                        api_name: id
                        expected_data_type: bigint
                        json_path: $.email_notifications[*].module.id
                      status: error
                Error400Response4:
                  summary: >-
                    INVALID_DATA error for id field value exceeding maximum
                    length
                  value:
                    email_notifications:
                      code: INVALID_DATA
                      message: Invalid data
                      details:
                        api_name: id
                        maximum_length: 20
                        json_path: $.email_notifications[*].module.id
                      status: error
                MandatoryNotFoundResponse2:
                  summary: 'MANDATORY_NOT_FOUND error for missing required field: name'
                  value:
                    email_notifications:
                      - code: MANDATORY_NOT_FOUND
                        message: Required field is missing
                        details:
                          api_name: name
                          json_path: $.email_notifications[*].name
                        status: error
                InvalidDataResponse13:
                  summary: INVALID_DATA error for incorrect data type on name field
                  value:
                    email_notifications:
                      - code: INVALID_DATA
                        message: Invalid data type
                        details:
                          api_name: name
                          expected_data_type: text
                          json_path: $.email_notifications[*].name
                        status: error
                InvalidDataResponse14:
                  summary: >-
                    INVALID_DATA error for the name field exceeding maximum
                    length
                  value:
                    email_notifications:
                      - code: INVALID_DATA
                        message: Invalid data
                        details:
                          api_name: name
                          maximum_length: 100
                          json_path: $.email_notifications[*].name
                        status: error
                MandatoryNotFoundResponse3:
                  summary: >-
                    MANDATORY_NOT_FOUND error for missing required field:
                    recipients
                  value:
                    email_notifications:
                      - code: MANDATORY_NOT_FOUND
                        message: Required field is missing
                        details:
                          api_name: recipients
                          json_path: $.email_notifications[*].recipients
                        status: error
                InvalidDataResponse15:
                  summary: >-
                    INVALID_DATA error for the recipients field with an
                    incorrect data type
                  value:
                    email_notifications:
                      - code: INVALID_DATA
                        message: Invalid data type
                        details:
                          api_name: recipients
                          expected_data_type: jsonobject
                          json_path: $.email_notifications[*].recipients
                        status: error
                InvalidDataResponse16:
                  summary: >-
                    INVALID_DATA error for the recipients field exceeding
                    maximum length
                  value:
                    email_notifications:
                      - code: INVALID_DATA
                        message: Invalid data
                        details:
                          api_name: recipients
                          maximum_length: 1
                          json_path: $.email_notifications[*].recipients
                        status: error
                Error400Response5:
                  summary: >-
                    MANDATORY_NOT_FOUND error for missing required field in
                    recipients
                  value:
                    email_notifications:
                      code: MANDATORY_NOT_FOUND
                      message: Required field is missing
                      details:
                        api_name: to
                        json_path: $.email_notifications[*].recipients.to
                      status: error
                Error400Response6:
                  summary: INVALID_DATA error — invalid data type for the to field
                  value:
