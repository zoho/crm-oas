            Possible values:

            INVALID_MODULE - The specified module name is not recognized or does
            not exist in the CRM organization.
          enum:
            - INVALID_MODULE
        details:
          type: object
          additionalProperties: false
          description: >-
            Represents additional details about the invalid module error,
            including the API name and JSON path of the parameter that failed
            validation.
          properties:
            api_name:
              type: string
              description: >-
                Represents the API name of the module parameter that triggered
                the invalid module error.
              maxLength: 255
            json_path:
              type: string
              description: >-
                Represents the JSON path of the request parameter that caused
                the invalid module error.
              maxLength: 1000
        message:
          type: string
          description: >-
            Represents the error message describing why the module name provided
            in the request is invalid.
          example: the module name given seems to be invalid
          maxLength: 255
        status:
          type: string
          description: >-
            Represents the status of the API response for an invalid module
            error.

            Possible values:

            error - Indicates the request failed due to an invalid module name.
          enum:
            - error
      required:
        - code
        - details
        - message
        - status
      title: Invalid Module Error
    BulkEmailCCError:
      type: object
      x-zs-$id: BulkEmailCCError
      additionalProperties: false
      description: >-
        Represents the error response returned when bulk email settings
        incorrectly configure CC or BCC details while the bulk email option is
        disabled.
      x-zs-llm-description: >-
        CC/BCC recipients are only allowed when bulk_email is true. Either set
