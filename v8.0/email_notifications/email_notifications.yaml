      maxLength: 20
      example: '6660682000001435009'
      title: Email Notification Action Id
    LockStatus:
      type: object
      additionalProperties: false
      description: >-
        Indicates whether a particular component is locked, affecting its
        editability and usability.
      x-zs-llm-description: >-
        Indicates whether the notification is locked (non-editable). Locked
        notifications are typically managed by their parent automation.
      properties:
        locked:
          type: boolean
          description: |-
            Indicates whether the component is locked.
            Possible values:
            true - The component is locked and cannot be edited or used.
            false - The component is not locked and remains editable and usable.
      title: Lock Status
    ResponseDetails:
      type:
        - object
      additionalProperties: false
      description: >-
