      properties:
        id:
          type: string
          description: Unique identifier of the newly created email notification action.
          x-zs-$id: EmailNotificationResultId
          maxLength: 20
      required:
        - id
      title: Create Email Notification Success Details
    InvalidModuleError:
      type: object
      x-zs-$id: InvalidModuleError
      additionalProperties: false
      description: >-
        Represents the error response returned when the module name provided in
        the request is not recognized or does not exist in the Zoho CRM
        organization.
      x-zs-llm-description: >-
        The module api_name is not recognized. Fetch valid modules from GET
        /settings/modules and use the exact api_name value.
      properties:
        code:
          type: string
          description: >-
            Represents the error code indicating the nature of the module
