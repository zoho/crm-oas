openapi: 3.1.0
info:
  title: Variable Groups
  description: >-
    Variable groups in Zoho CRM are named containers that organize CRM variables
    into logical clusters. This API enables developers to list, retrieve, and
    update variable groups in a Zoho CRM organization.
  version: '8'
servers:
  - url: https://zohoapis.{dc}/crm/{version}
    description: >-
      Zoho CRM API server. Sample request URL:
      `https://zohoapis.{dc}/crm/{version}`
    variables:
      dc:
        description: >-
          Specifies the data center domain for the Zoho CRM API server. Possible
          values: **com**, **eu**, **in**, **cn**, **au**, **ca**, **jp**.
          Default: **com**.
        default: com
        enum:
          - com
          - eu
          - in
          - cn
          - au
          - ca
          - jp
      version:
        description: >-
          Specifies the API version. Possible values: **v7**, **v7.1**, **v8**.
          Default: **v8**.
        default: v8
paths:
  /settings/variable_groups:
    get:
      summary: Variable Groups
      description: To retrieve a list of all variable groups in your Zoho CRM organization.
      operationId: getVariableGroups
      responses:
        '200':
          description: Returns a list of all variable groups in the CRM organization.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VariableGroupListResponse'
              examples:
                Success200:
                  summary: Successful list variable groups response
                  value:
                    variable_groups:
                      - display_label: NewFToNew
                        api_name: NewFToNew
                        name: NewFToNew
                        description: null
                        id: '111114000000473989'
                        source: crm
                      - display_label: NewFToNew2
                        api_name: NewFToNew2
                        name: NewFToNew2
                        description: null
                        id: '111114000000473995'
                        source: crm
                  description: >-
                    Demonstrates a successful response containing the list of
                    all variable groups in the organization.
        '403':
          description: >-
            Returns an error response when the client does not have the required
            permissions.

            **Resolution:** Ensure the OAuth token includes the
            `ZohoCRM.settings.variable_groups.READ` scope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionDeniedError'
              examples:
                NoPermissionResponse1:
                  summary: Error response for insufficient permissions
                  value:
                    code: NO_PERMISSION
                    details:
                      permissions:
                        - Crm_Implied_Variables_Access
                    message: permission denied
                    status: error
                  description: >-
                    Demonstrates an error response when the client does not have
                    the required permissions.

                    **Resolution:** Ensure the OAuth token includes the
                    `ZohoCRM.settings.variable_groups.READ` scope.
      security:
        - OAuth2:
            - ZohoCRM.settings.variable_groups.READ
    put:
      summary: Variable Groups
      description: >-
        To update the details of one or more variable groups in your Zoho CRM
        organization. The request accepts a maximum of 10 variable group items.
        When individual items succeed or fail independently, the API returns a
        207 multi-status response with per-item results.
      operationId: updateVariableGroups
      requestBody:
        description: >-
          Accepts a JSON request body containing an array of up to 10 variable
          group items to update.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VariableGroupUpdateRequestAlt'
            examples:
              SamplePutRequest:
                summary: Sample bulk update variable groups request body
                value:
                  variable_groups:
                    - id: '111111000000117081'
                      name: VarGroup
                      api_name: VarGroup
                      description: description
                description: >-
                  Demonstrates a sample request body for the bulk update
                  variable groups operation.
      responses:
        '200':
          description: >-
            Returns the operation statuses for all updated variable groups when
            all items succeed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VariableGroupCollectionResponse'
              examples:
                Success200:
                  summary: Successful bulk update variable groups response
                  value:
                    variable_groups:
                      - code: SUCCESS
                        details:
                          id: '111111000000117081'
                        message: variable group updated successfully
                        status: success
                  description: >-
                    Demonstrates a successful response after updating all
                    variable groups in the request.
        '207':
          description: >-
            Returns a multi-status response when individual variable group items
            in the bulk update have different outcomes, with per-item success or
            error results.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VariableGroupMultiStatusResponseAlt'
              examples:
                Success207:
                  summary: Multi-status bulk update variable groups response
                  value:
                    variable_groups:
                      - code: SUCCESS
                        details:
                          id: '111111000000117081'
                        message: variable group updated successfully
                        status: success
                      - code: DUPLICATE_DATA
                        details:
                          api_name: name
                          json_path: $.variable_groups[1].name
                        message: duplicate data
                        status: error
                  description: >-
                    Demonstrates a multi-status response when some variable
                    group items succeed and others fail in the same bulk update
                    request.
        '400':
          description: >-
            Returns an error response when the request contains invalid or
            missing data.

            **Resolution:** Verify that all field values are valid and each ID
            refers to a user-defined variable group.
          content:
            application/json:
              schema:
                x-zs-$id: UpdatenvalidRequestErrors
                oneOf:
                  - $ref: '#/components/schemas/InvalidVariableGroupsTypeError'
                  - x-zs-$id: UpdatenvalidRequestBodyErrors
                    type: object
                    additionalProperties: false
                    description: >-
                      Represents an error response returned when the
                      `variable_groups` field in the bulk update request
                      contains invalid data.
                    properties:
                      variable_groups:
                        type: array
                        description: >-
                          Represents an array of error objects, one for each
                          variable group item in the request that failed
                          validation.
                        items:
                          oneOf:
                            - $ref: '#/components/schemas/DuplicateVariableGroupError'
                            - $ref: >-
                                #/components/schemas/SystemVariableGroupActionNotAllowedError
                            - $ref: >-
                                #/components/schemas/MandatoryFieldIdMissingError
                            - $ref: '#/components/schemas/ApiNamePatternMismatchError'
                            - $ref: '#/components/schemas/InvalidVariableGroupIdError'
                            - $ref: '#/components/schemas/ProcessingAmbiguityError'
                            - $ref: '#/components/schemas/MandatoryFieldMissingError'
                            - $ref: '#/components/schemas/InvalidFieldDataTypeError'
                            - $ref: '#/components/schemas/InvalidDataError'
                          description: >-
                            Represents a single validation error for a variable
                            group item in the bulk update request.
                        maxItems: 25
                    required:
                      - variable_groups
                description: >-
                  Represents an error response returned when the bulk update
                  variable groups request fails validation.
              examples:
                InvalidDataResponse1:
                  summary: Error response for invalid variable groups field data
                  value:
                    code: INVALID_DATA
                    details:
                      maximum_length: 10
                      api_name: variable_groups
                      json_path: $.variable_groups
                    message: invalid data
                    status: error
                  description: >-
                    Demonstrates an error response when the `variable_groups`
                    field in the request contains invalid data.

                    **Resolution:** Verify that the `variable_groups` array
                    contains valid data for all fields.
                DuplicateDataResponse1:
                  summary: Error response for duplicate variable group data
                  value:
                    variable_groups:
                      - code: DUPLICATE_DATA
                        details:
                          api_name: name
                          json_path: $.variable_groups[0].name
                        message: duplicate data
                        status: error
                      - code: DUPLICATE_DATA
                        details:
                          api_name: name
                          json_path: $.variable_groups[1].name
                        message: duplicate data
                        status: error
                  description: >-
                    Demonstrates an error response when the updated value
                    duplicates an existing variable group name or API name.

                    **Resolution:** Provide a unique `api_name` or `name` value
                    that does not conflict with existing variable groups.
                CannotPerformActionResponse1:
                  summary: Error response for system variable group action not allowed
                  value:
                    variable_groups:
                      - code: CANNOT_PERFORM_ACTION
                        details:
                          api_name: id
                          json_path: $.variable_groups[0].id
                        message: >-
                          the given operation is not supported for system
                          defined variable group
                        status: error
                  description: >-
                    Demonstrates an error response when the bulk update targets
                    a system-defined variable group.

                    **Resolution:** System-defined variable groups do not
                    support modification. Use user-defined variable group IDs.
                MandatoryNotFoundResponse1:
                  summary: Error response for missing required ID field
                  value:
                    variable_groups:
                      - code: MANDATORY_NOT_FOUND
                        details:
                          api_name: id
                          json_path: $.variable_groups[0].id
                        message: required field not found
                        status: error
                  description: >-
                    Demonstrates an error response when the required `id` field
                    is missing from the variable group item.

                    **Resolution:** Include the `id` field in each variable
                    group update item.
                DuplicateDataResponse2:
                  summary: Error response for duplicate field value
                  value:
                    variable_groups:
                      - code: DUPLICATE_DATA
                        details:
                          api_name: name
                          json_path: $.variable_groups[0].name
                        message: duplicate data
                        status: error
                  description: >-
                    Demonstrates an error response when the updated fields
                    contain duplicate values.

                    **Resolution:** Ensure the updated field values are unique
                    across all variable groups.
                DuplicateDataResponse3:
                  summary: Error response for multiple duplicate entries
                  value:
                    variable_groups:
                      - code: DUPLICATE_DATA
                        details:
                          api_name: api_name
                          json_path: $.variable_groups[0].api_name
                        message: duplicate data
                        status: error
                  description: >-
                    Demonstrates an error response when duplicate data is
                    detected for multiple variable groups in the request.

                    **Resolution:** Ensure that each variable group item has
                    unique field values.
                PatternNotMatchedResponse1:
                  summary: Error response for API name pattern mismatch
                  value:
                    variable_groups:
                      - code: PATTERN_NOT_MATCHED
                        details:
                          api_name: variable_group.api_name
                          json_path: $.variable_groups[0].variable_group.api_name
                        message: Please check whether the input values are correct
                        status: error
                  description: >-
                    Demonstrates an error response when the `api_name` value
                    does not comply with the required naming pattern.

                    **Resolution:** Provide an `api_name` value that matches the
                    required naming convention.
                InvalidDataResponse2:
                  summary: Error response for data exceeding maximum length
                  value:
                    variable_groups:
                      - code: INVALID_DATA
                        details:
                          api_name: id
                          json_path: $.variable_groups[0].id
                        message: the id given seems to be invalid
                        status: error
                  description: >-
                    Demonstrates an error response when a field value exceeds
                    the maximum allowed length.

                    **Resolution:** Reduce the field value length to within the
                    allowed limit.
                MandatoryNotFoundResponse2:
                  summary: Error response for missing required field in update request
                  value:
                    variable_groups:
                      - code: MANDATORY_NOT_FOUND
                        message: Required field is missing
                        details:
                          api_name: id
                          json_path: $.variable_groups[*].id
                        status: error
                  description: >-
                    Demonstrates an error response when a required field is
                    missing from the request body.

                    **Resolution:** Include all required fields in each variable
                    group update item.
                InvalidDataResponse3:
                  summary: Error response for API name pattern mismatch
                  value:
                    variable_groups:
                      - code: INVALID_DATA
                        message: Invalid data type
                        details:
                          api_name: id
                          expected_data_type: bigint
                          json_path: $.variable_groups[*].id
                        status: error
                  description: >-
                    Demonstrates an error response when the `api_name` value
                    does not match the required naming pattern.

                    **Resolution:** Provide an `api_name` value that complies
                    with the required naming pattern.
                InvalidDataResponse4:
                  summary: Error response for ambiguity during processing
                  value:
                    variable_groups:
                      - code: INVALID_DATA
                        message: Invalid data
                        details:
                          api_name: id
                          maximum_length: 18
                          json_path: $.variable_groups[*].id
                        status: error
                  description: >-
                    Demonstrates an error response when ambiguity occurs during
                    request processing.

                    **Resolution:** Ensure that field references in the request
                    are unique and non-conflicting.
                InvalidDataResponse5:
                  summary: Error response for missing required field
                  value:
                    variable_groups:
                      - code: INVALID_DATA
                        message: Invalid data type
                        details:
                          api_name: rid
                          expected_data_type: text
                          json_path: $.variable_groups[*].rid
                        status: error
                  description: >-
                    Demonstrates an error response when a required field is
                    missing from the request.

                    **Resolution:** Include all required fields in each variable
                    group item.
                InvalidDataResponse6:
                  summary: Error response for missing required field ID
                  value:
                    variable_groups:
                      - code: INVALID_DATA
                        message: Invalid data
                        details:
                          api_name: rid
                          maximum_length: 36
                          json_path: $.variable_groups[*].rid
                        status: error
                  description: >-
                    Demonstrates an error response when the required `id` field
                    is missing from a variable group item.

                    **Resolution:** Include the required `id` field in each
                    variable group item.
                InvalidDataResponse7:
                  summary: Error response for invalid variable group ID in item
                  value:
                    variable_groups:
                      - code: INVALID_DATA
                        message: Invalid data type
                        details:
                          api_name: name
                          expected_data_type: text
                          json_path: $.variable_groups[*].name
                        status: error
                  description: >-
                    Demonstrates an error response when the provided variable
                    group ID is invalid.

                    **Resolution:** Provide a valid variable group ID in the
                    request body.
                InvalidDataResponse8:
                  summary: Error response for invalid request data
                  value:
                    variable_groups:
                      - code: INVALID_DATA
                        message: Invalid data
                        details:
                          api_name: name
                          maximum_length: 50
                          json_path: $.variable_groups[*].name
                        status: error
                  description: >-
                    Demonstrates an error response when the request contains
                    invalid data.

                    **Resolution:** Review the field values and correct any
                    invalid entries.
                InvalidDataResponse9:
                  summary: Error response for invalid variable groups field type
                  value:
                    variable_groups:
                      - code: INVALID_DATA
                        message: Invalid data type
                        details:
                          api_name: api_name
                          expected_data_type: text
                          json_path: $.variable_groups[*].api_name
                        status: error
                  description: >-
                    Demonstrates an error response when the `variable_groups`
                    field contains invalid data type.

                    **Resolution:** Ensure the `variable_groups` field contains
                    a valid array of objects.
                InvalidDataResponse10:
                  summary: Error response for invalid field data type
                  value:
                    variable_groups:
                      - code: INVALID_DATA
                        message: Invalid data
                        details:
                          api_name: api_name
                          maximum_length: 100
                          json_path: $.variable_groups[*].api_name
                        status: error
                  description: >-
                    Demonstrates an error response when a field value contains
                    an invalid data type.

                    **Resolution:** Provide a value with the expected data type
                    for the field.
                InvalidDataResponse11:
                  summary: Error response for invalid field data
                  value:
                    variable_groups:
                      - code: INVALID_DATA
                        message: Invalid data type
                        details:
                          api_name: description
                          expected_data_type: text
                          json_path: $.variable_groups[*].description
                        status: error
                  description: >-
                    Demonstrates an error response when the request contains
                    invalid data for a field.

                    **Resolution:** Verify that all field values match the
                    expected data types and formats.
                InvalidDataResponse12:
                  summary: Error response for invalid variable group ID
                  value:
                    variable_groups:
                      - code: INVALID_DATA
                        message: Invalid data
                        details:
                          api_name: description
                          maximum_length: 3000
                          json_path: $.variable_groups[*].description
                        status: error
                  description: >-
                    Demonstrates an error response when the provided variable
                    group ID in the request is invalid.

                    **Resolution:** Provide a valid variable group ID in each
                    item of the request body.
        '403':
          description: >-
            Returns an error response when the client does not have the required
            permissions.

            **Resolution:** Ensure the OAuth token includes the
            `ZohoCRM.settings.variable_groups.UPDATE` scope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionDeniedError'
              examples:
                NoPermissionResponse1:
                  summary: Error response for insufficient permissions
                  value:
                    code: NO_PERMISSION
                    details:
                      permissions:
                        - Crm_Implied_Variables_Access
                    message: permission denied
                    status: error
                  description: >-
                    Demonstrates an error response when the client does not have
                    the required permissions.

                    **Resolution:** Ensure the OAuth token includes the
                    `ZohoCRM.settings.variable_groups.UPDATE` scope.
      security:
        - OAuth2:
            - ZohoCRM.settings.variable_groups.UPDATE
  /settings/variable_groups/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Specifies the unique ID of the variable group to retrieve or update.
        schema:
          type: string
          examples:
            - '111112000000092007'
          maxLength: 255
    get:
      summary: Get variable group by ID
      description: >-
        To retrieve the details of a specific variable group by its ID in your
        Zoho CRM organization.
      operationId: getVariableGroupById
      responses:
        '200':
          description: Returns the details of the variable group matching the specified ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VariableGroupQueryResponse'
              examples:
                Success200:
                  summary: Successful get variable group by ID response
                  value:
                    variable_groups:
                      - display_label: General
                        api_name: General
                        name: General
                        description: null
                        id: '111111000000117077'
                        source: crm
                  description: >-
                    Demonstrates a successful response containing the details of
                    the specified variable group.
        '204':
          description: >-
            Returns no content when no variable group is found for the specified
            ID.
        '400':
          description: >-
            Returns an error response when the provided ID in the request path
            is invalid.

            **Resolution:** Verify that the ID is a valid variable group ID
            before retrying.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidIdentifierError'
              examples:
                InvalidDataResponse1:
                  summary: Error response for invalid variable group ID
                  value:
                    code: INVALID_DATA
                    details:
                      resource_path_index: 2
                    message: Invalid ID
                    status: error
                  description: >-
                    Demonstrates an error response when the provided variable
                    group ID in the request path is invalid.

                    **Resolution:** Provide a valid variable group ID in the
                    request path.
        '403':
          description: >-
            Returns an error response when the client does not have the required
            permissions.

            **Resolution:** Ensure the OAuth token includes the
            `ZohoCRM.settings.variable_groups.READ` scope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionDeniedError'
              examples:
                NoPermissionResponse1:
                  summary: Error response for insufficient permissions
                  value:
                    code: NO_PERMISSION
                    details:
                      permissions:
                        - Crm_Implied_Variables_Access
                    message: permission denied
                    status: error
                  description: >-
                    Demonstrates an error response when the client does not have
                    the required permissions.

                    **Resolution:** Ensure the OAuth token includes the
                    `ZohoCRM.settings.variable_groups.READ` scope.
      security:
        - OAuth2:
            - ZohoCRM.settings.variable_groups.READ
    put:
      summary: Update variable group by ID
      description: >-
        To update the details of a specific variable group by its ID in your
        Zoho CRM organization.
      operationId: updateVariableGroupById
      requestBody:
        description: >-
          Accepts a JSON request body containing the updated variable group
          fields for the specified variable group.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VariableGroupDefinitionRequestAlt'
            examples:
              SamplePutRequest:
                summary: Sample update variable group by ID request body
                value:
                  variable_groups:
                    - name: VarGroup
                      api_name: VarGroup
                      description: description
                description: >-
                  Demonstrates a sample request body for the update variable
                  group by ID operation.
      responses:
        '200':
          description: Returns the operation status for the updated variable group.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VariableGroupOperationResponse'
              examples:
                Success200:
                  summary: Successful update variable group by ID response
                  value:
                    variable_groups:
                      - code: SUCCESS
                        details:
                          id: '111111000000117094'
                        message: variable group updated successfully
                        status: success
                  description: >-
                    Demonstrates a successful response after updating the
                    specified variable group.
        '400':
          description: >-
            Returns an error response when the request contains invalid or
            missing data.

            **Resolution:** Verify that all field values are valid and the ID
            refers to a user-defined variable group.
          content:
            application/json:
              schema:
                x-zs-$id: UpdateByIdInvalidRequestErrors
                oneOf:
                  - $ref: '#/components/schemas/InvalidVariableGroupsTypeError'
                  - x-zs-$id: UpdateByIdInvalidRequestBodyErrors
                    type: object
                    additionalProperties: false
                    description: >-
                      Represents an error response returned when the
                      `variable_groups` field in the update by ID request
                      contains invalid data.
                    properties:
                      variable_groups:
                        type: array
                        description: >-
                          Represents an array of error objects, one for each
                          variable group item in the request that failed
                          validation.
                        items:
                          oneOf:
                            - $ref: '#/components/schemas/DuplicateVariableGroupError'
                            - $ref: '#/components/schemas/ApiNamePatternMismatchError'
                            - $ref: >-
                                #/components/schemas/SystemVariableGroupActionNotAllowedError
                            - $ref: '#/components/schemas/InvalidFieldDataTypeError'
                            - $ref: '#/components/schemas/InvalidDataError'
                          description: >-
                            Represents a single validation error for a variable
                            group item in the update by ID request.
                        maxItems: 25
                    required:
                      - variable_groups
                  - $ref: '#/components/schemas/InvalidIdentifierError'
                description: >-
                  Represents an error response returned when the update variable
                  group by ID request fails validation.
              examples:
                InvalidDataResponse1:
                  summary: Error response for invalid variable groups field data
                  value:
                    code: INVALID_DATA
                    details:
                      maximum_length: 1
                      api_name: variable_groups
                      json_path: $.variable_groups
                    message: invalid data
                    status: error
                  description: >-
                    Demonstrates an error response when the `variable_groups`
                    field contains invalid data.

                    **Resolution:** Verify that the `variable_groups` array
                    contains valid data for all fields.
                DuplicateDataResponse1:
                  summary: Error response for duplicate variable group data
                  value:
                    variable_groups:
                      - code: DUPLICATE_DATA
                        details:
                          api_name: name
                          json_path: $.variable_groups[0].name
                        message: duplicate data
                        status: error
                  description: >-
                    Demonstrates an error response when the updated `api_name`
                    or `name` value duplicates an existing variable group.

                    **Resolution:** Provide a unique `api_name` or `name` value
                    that does not conflict with an existing variable group.
                DuplicateDataResponse2:
                  summary: Error response for duplicate field value
                  value:
                    variable_groups:
                      - code: DUPLICATE_DATA
                        details:
                          api_name: api_name
                          json_path: $.variable_groups[0].api_name
                        message: duplicate data
                        status: error
                  description: >-
                    Demonstrates an error response when the updated fields
                    contain duplicate values for another field.

                    **Resolution:** Ensure the updated field values are unique
                    across all variable groups in the organization.
                PatternNotMatchedResponse1:
                  summary: Error response for API name pattern mismatch
                  value:
                    variable_groups:
                      - code: PATTERN_NOT_MATCHED
                        details:
                          api_name: variable_group.api_name
                          json_path: $.variable_groups[0].variable_group.api_name
                        message: Please check whether the input values are correct
                        status: error
                  description: >-
                    Demonstrates an error response when the `api_name` value
                    does not match the required naming pattern.

                    **Resolution:** Provide an `api_name` value that complies
                    with the required naming pattern.
                CannotPerformActionResponse1:
                  summary: Error response for system variable group action not allowed
                  value:
                    variable_groups:
                      - code: CANNOT_PERFORM_ACTION
                        details:
                          api_name: id
                          json_path: $.variable_groups[0].id
                        message: >-
                          the given operation is not supported for system
                          defined variable group
                        status: error
                  description: >-
                    Demonstrates an error response when the update targets a
                    system-defined variable group.

                    **Resolution:** System-defined variable groups do not
                    support modification. Use a user-defined variable group ID.
                InvalidDataResponse2:
                  summary: Error response for data exceeding maximum length
                  value:
                    code: INVALID_DATA
                    details:
                      resource_path_index: 2
                    message: Invalid ID
                    status: error
                  description: >-
                    Demonstrates an error response when a field value exceeds
                    the maximum allowed length.

                    **Resolution:** Reduce the field value length to within the
                    allowed limit.
                InvalidDataResponse3:
                  summary: Error response for invalid variable group ID
                  value:
                    variable_groups:
                      - code: INVALID_DATA
                        message: Invalid data type
                        details:
                          api_name: name
                          expected_data_type: text
                          json_path: $.variable_groups[*].name
                        status: error
                  description: >-
                    Demonstrates an error response when the provided variable
                    group ID is invalid.

                    **Resolution:** Provide a valid variable group ID in the
                    request body.
                InvalidDataResponse4:
                  summary: Error response for invalid field data type
                  value:
                    variable_groups:
                      - code: INVALID_DATA
                        message: Invalid data
                        details:
                          api_name: name
                          maximum_length: 50
                          json_path: $.variable_groups[*].name
                        status: error
                  description: >-
                    Demonstrates an error response when a field contains an
