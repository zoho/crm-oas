                            - portals_invitation_accepted
                            - portals_invitation_resent
                            - portals_user_type_activated
                            - portals_user_type_deactivated
                            - portal_user_transferred
                            - portal_user_deleted
                            - image_removed
                            - image_uploaded
                            - find_and_merge_duplicate
                            - tag_removed
                            - tag_added
                            - tags_overwritten
                            - submitted_for_review
                            - resubmitted_for_review
                            - reviewed
                            - rejected_in_review
                            - reviewed_during_resubmit
                            - entered_in_system
                            - updated
                            - webinar_invitation_sent
                            - backstage_invitation_sent
                            - comment_to_post
                            - reply_to_message
                            - reply_to_comment
                            - like_to_comment
                            - retweet
                            - reply_to_tweet
                            - process_entry
                            - process_exit
                            - escalation_mail
                            - open
                            - click
                            - bounce
                            - received
                            - missed
                            - added
                            - image_approved
                            - image_approval
                            - rejection_mail_sent
                            - final_approval_mail_copy_sent
                            - automatic_transition
                            - record_exit_on_edit
                            - state_executed
                            - automatic_transition_action
                            - user_signature
                            - Message_template_sent
                            - action_executed
                            - mass_association
                            - deleted
                            - restored
                            - subform_automation_trigger
