                            - case_escalation
                            - assignment_rules
                            - macro
                            - mass_transfer
                            - deduplication
                            - findandmerge
                            - zohowebinar
                            - portals
                            - zohobackstage
                            - bulkapi
                            - prediction
                            - facebook
                            - twitter
                            - review_process
                            - rfm_segmentation
                            - orchestration
                            - gmail
                            - wizard
                            - scoringrule
                            - scoringrule_config
                            - scoringrule_config_downgrade
                            - bulk_action
                            - bulk_action_revert
                            - mass_delete_user_thread
