                            - zia_agent
                        extension:
                          type:
                            - object
                            - 'null'
                          description: >-
                            Represents the extension details associated with a
                            signal-type timeline entry, including the extension
                            namespace, ID, and signal information.
                          additionalProperties: false
                          properties:
                            namespace:
                              type: string
                              description: >-
                                Represents the namespace of the extension that
                                generated the signal.
                              maxLength: 255
                            id:
                              type: string
                              description: >-
                                Represents the unique ID of the extension that
                                generated the signal.
                              maxLength: 255
                            signal:
                              type: object
                              description: >-
                                Represents the signal details dispatched by the
                                extension.
                              additionalProperties: false
                              properties:
                                display_label:
                                  type: string
                                  description: >-
                                    Represents the display label shown for the
                                    extension signal in the CRM timeline.
                                  maxLength: 255
                                action:
                                  type: string
                                  description: >-
                                    Represents the action performed by the
                                    extension signal.
                                  maxLength: 255
                                id:
                                  type: string
                                  description: >-
                                    Represents the unique ID of the extension
                                    signal.
                                  maxLength: 255
                                medium:
                                  type: string
                                  description: >-
                                    Represents the medium through which the
                                    extension signal was generated.
                                  maxLength: 255
                        done_by:
                          type:
                            - object
                            - 'null'
                          description: >-
                            The details of the user who modified the record such
                            as the name, ID, name and ID of that user's profile,
                            and the user type.
                          additionalProperties: false
                          properties:
                            name:
                              type: string
                              description: >-
                                Represents the name of the user who performed
                                the action.
                              maxLength: 255
                            id:
                              type: string
                              description: >-
                                Represents the unique ID of the user who
                                performed the action.
                              maxLength: 255
                            profile:
                              type: object
                              description: >-
                                Represents the user profile associated with the
                                user who performed the action.
                              additionalProperties: false
                              properties:
                                name:
                                  type: string
                                  description: Represents the name of the user's profile.
                                  maxLength: 255
                                id:
                                  type: string
                                  description: >-
                                    Represents the unique ID of the user's
                                    profile.
                                  maxLength: 255
                            type__s:
                              type: string
                              description: >-
                                Represents the type of the user who performed
                                the action, such as a standard user, admin, or
                                system user.
                              maxLength: 255
                        related_record:
                          type:
                            - object
                            - 'null'
                          description: >-
                            The name and ID of the parent record which the task,
                            call, or meeting belongs to.
                          additionalProperties: false
                          properties:
                            name:
                              type:
                                - string
                                - 'null'
                              description: >-
                                Represents the name of the related CRM record.
                                This field is nullable.
                              maxLength: 255
                            id:
                              type:
                                - string
                                - 'null'
                              description: >-
                                Represents the unique ID of the related CRM
                                record. This field is nullable.
                              maxLength: 255
                            module:
                              type:
                                - object
                                - 'null'
                              description: >-
                                Represents the module information for the
                                related CRM record.
                              additionalProperties: false
                              properties:
                                name:
                                  type: string
                                  description: >-
                                    Represents the display name of the module
                                    containing the related CRM record.
                                  maxLength: 255
                                id:
                                  type: string
                                  description: >-
                                    Represents the unique ID of the module
                                    containing the related CRM record.
                                  maxLength: 255
                                api_name:
                                  type: string
                                  description: >-
                                    Represents the API name of the module
                                    containing the related CRM record.
                                  maxLength: 255
                        automation_details:
                          type:
                            - object
                            - 'null'
                          description: >-
                            Represents the automation context associated with
                            the timeline entry, including details about
                            triggered workflows, approval processes, scoring
                            rules, ownership changes, and review processes.
                          additionalProperties: false
                          properties:
                            type:
                              type: string
                              description: >-
                                Represents the type of automation action that
                                triggered the timeline event, such as a
                                workflow, Approval Process, or Scoring Rule.
                              maxLength: 255
                            rule:
                              type: object
                              description: >-
                                Represents the automation rule that triggered
                                the timeline event.
                              additionalProperties: false
                              properties:
                                name:
                                  type: string
                                  description: Represents the name of the automation rule.
                                  maxLength: 255
                                id:
                                  type: string
                                  description: >-
                                    Represents the unique ID of the automation
                                    rule.
                                  maxLength: 255
                            pathfinder:
                              type: object
                              description: >-
                                Represents the Blueprint process details
                                associated with the timeline entry, including
                                the triggered state and entry or exit flags.
                              additionalProperties: false
                              properties:
                                process_entry:
                                  type: boolean
                                  description: >-
                                    Indicates whether the Blueprint process
                                    entry action was triggered for this timeline
                                    event.
                                process_exit:
                                  type: boolean
                                  description: >-
                                    Indicates whether the Blueprint process exit
                                    action was triggered for this timeline
                                    event.
                                state:
                                  additionalProperties: false
                                  type: object
                                  description: >-
                                    Represents the Blueprint state associated
                                    with the timeline event.
                                  properties:
                                    trigger_type:
                                      type: string
                                      description: >-
                                        Represents the trigger type that caused
                                        the Blueprint state to activate.
                                      maxLength: 255
                                    name:
                                      type: string
                                      description: >-
                                        Represents the name of the Blueprint
                                        state.
                                      maxLength: 255
                                    is_last_state:
                                      type: boolean
                                      description: >-
                                        Indicates whether this Blueprint state
                                        is the final state in the process.
                                    id:
                                      type: string
                                      description: >-
                                        Represents the unique ID of the
                                        Blueprint state.
                                      maxLength: 255
                            workflow:
                              type: object
                              description: >-
                                Represents the workflow details associated with
                                the timeline entry.
                              additionalProperties: false
                              properties:
                                field_update_action:
                                  type: array
                                  maxItems: 50
                                  description: >-
                                    Represents an array of field update actions
                                    executed by the workflow.
                                  items:
                                    type: object
                                    description: >-
                                      Represents a single field update action
                                      executed by the workflow.
                                    additionalProperties: false
                                    properties:
                                      name:
                                        type: string
                                        description: >-
                                          Represents the name of the workflow
                                          field update action.
                                        maxLength: 255
                                      id:
                                        type: string
                                        description: >-
                                          Represents the unique ID of the workflow
                                          field update action.
                                        maxLength: 255
                            approval_process:
                              type: object
                              description: >-
                                Represents the Approval Process details
                                associated with the timeline entry.
                              additionalProperties: false
                              properties:
                                next_approver:
                                  type: array
                                  description: >-
                                    Represents an array of the next approvers in
                                    the Approval Process sequence.
                                  maxItems: 50
                                  items:
                                    type: object
                                    description: >-
                                      Represents a single next approver in the
                                      Approval Process.
                                    additionalProperties: false
                                    properties:
                                      name:
                                        type: string
                                        description: >-
                                          Represents the name of the next approver
                                          user.
                                        maxLength: 255
                                      id:
                                        type: string
                                        description: >-
                                          Represents the unique ID of the next
                                          approver user.
                                        maxLength: 255
                                comments:
                                  type: string
                                  description: >-
                                    Represents the comments added during the
                                    Approval Process action.
                                  maxLength: 1000
                                takeover_reason:
                                  type: string
                                  description: >-
                                    Represents the reason provided for the
                                    approval task takeover.
                                  maxLength: 255
                                current_stage:
                                  type: integer
                                  format: int32
                                  description: >-
                                    Represents the current stage number of the
                                    Approval Process at the time of the timeline
                                    event.
                                takeover_stage:
                                  type: string
                                  description: >-
                                    Represents the approval stage at which the
                                    takeover occurred.
                                  maxLength: 255
                                rejected_details:
                                  type: object
                                  description: >-
                                    Represents the details of the rejection
                                    event in the Approval Process.
                                  additionalProperties: false
                                  properties:
                                    stage:
                                      type: object
                                      description: >-
                                        Represents the stage transition details
                                        at the time of rejection.
                                      additionalProperties: false
                                      properties:
                                        from:
                                          type: string
                                          description: >-
                                            Represents the approval stage from which
                                            the rejection occurred.
                                          maxLength: 255
                                        to:
                                          type: string
                                          description: >-
                                            Represents the approval stage to which
                                            the process moved after rejection.
                                          maxLength: 255
                                    name:
                                      type: string
                                      description: >-
                                        Represents the name of the user who
                                        rejected the approval request.
                                      maxLength: 255
                                    id:
                                      type: string
                                      description: >-
                                        Represents the unique ID of the user who
                                        rejected the approval request.
                                      maxLength: 255
                                delegate_details:
                                  type: object
                                  description: >-
                                    Represents the delegation details when the
                                    approval task was delegated from one user to
                                    another.
                                  additionalProperties: false
                                  properties:
                                    from:
                                      type: object
                                      description: >-
                                        Represents the user from whom the
                                        approval task was delegated.
                                      additionalProperties: false
                                      properties:
                                        name:
                                          type: string
                                          description: >-
                                            Represents the name of the user from
                                            whom the approval task was delegated.
                                          maxLength: 255
                                        id:
                                          type: string
                                          description: >-
                                            Represents the unique ID of the user
                                            from whom the approval task was
                                            delegated.
                                          maxLength: 255
                                    to:
                                      type: object
                                      description: >-
                                        Represents the user to whom the approval
                                        task was delegated.
                                      additionalProperties: false
                                      properties:
                                        name:
                                          type: string
                                          description: >-
                                            Represents the name of the user to whom
                                            the approval task was delegated.
                                          maxLength: 255
                                        id:
                                          type: string
                                          description: >-
                                            Represents the unique ID of the user to
                                            whom the approval task was delegated.
                                          maxLength: 255
                                approver_details:
                                  type: object
                                  description: >-
                                    Represents the details of the approver who
                                    acted on the Approval Process.
                                  additionalProperties: false
                                  properties:
                                    name:
                                      type: string
                                      description: >-
                                        Represents the name of the approver
                                        user.
                                      maxLength: 255
                                    id:
                                      type: string
                                      description: >-
                                        Represents the unique ID of the approver
                                        user.
                                      maxLength: 255
                            assigned_to:
                              description: >-
                                Represents the user to whom the record was
                                assigned by an automation action.
                              additionalProperties: false
                              type: object
                              properties:
                                name:
                                  description: >-
                                    Represents the name of the user assigned to
                                    the record.
                                  maxLength: 255
                                  type: string
                                id:
                                  description: >-
                                    Represents the unique ID of the user
                                    assigned to the record.
                                  maxLength: 255
                                  type: string
                            scoring_rule:
                              type: object
                              description: >-
                                Represents the Scoring Rule details associated
                                with the timeline entry, including score changes
                                for positive and negative scoring and touchpoint
                                scoring.
                              additionalProperties: false
                              properties:
                                zia_type:
                                  type: boolean
                                  description: >-
                                    Indicates whether the Scoring Rule event was
                                    triggered by Zia, the AI assistant in Zoho
                                    CRM.
                                negative_score:
                                  type: object
                                  description: >-
                                    Represents the negative score change
                                    recorded for the record by the Scoring Rule.
                                  additionalProperties: false
                                  properties:
                                    new:
                                      type:
                                        - string
                                        - 'null'
                                      maxLength: 20
                                      description: >-
                                        Represents the new negative score value
                                        after the Scoring Rule was applied. This
                                        field is nullable.
                                    old:
                                      type:
                                        - string
                                        - 'null'
                                      maxLength: 20
                                      description: >-
                                        Represents the previous negative score
                                        value before the Scoring Rule was
                                        applied. This field is nullable.
                                positive_score:
                                  type: object
                                  description: >-
                                    Represents the positive score change
                                    recorded for the record by the Scoring Rule.
                                  additionalProperties: false
                                  properties:
                                    new:
                                      type:
                                        - string
                                        - 'null'
                                      maxLength: 20
                                      description: >-
                                        Represents the new positive score value
                                        after the Scoring Rule was applied. This
                                        field is nullable.
                                    old:
                                      type:
                                        - string
                                        - 'null'
                                      maxLength: 20
                                      description: >-
                                        Represents the previous positive score
                                        value before the Scoring Rule was
                                        applied. This field is nullable.
                                touch_point:
                                  type: object
                                  description: >-
                                    Represents the touchpoint score details
                                    associated with the Scoring Rule event.
                                  additionalProperties: false
                                  properties:
                                    negative_score:
                                      type: object
                                      description: >-
                                        Represents the touchpoint negative score
                                        change recorded by the Scoring Rule.
                                      additionalProperties: false
                                      properties:
                                        new:
                                          type:
                                            - string
                                            - 'null'
                                          maxLength: 20
                                          description: >-
                                            Represents the new touchpoint negative
                                            score value after the Scoring Rule was
                                            applied. This field is nullable.
                                        old:
                                          type:
                                            - string
                                            - 'null'
                                          maxLength: 20
                                          description: >-
                                            Represents the previous touchpoint
                                            negative score value before the Scoring
                                            Rule was applied. This field is
                                            nullable.
                                    positive_score:
                                      type: object
                                      description: >-
                                        Represents the touchpoint positive score
                                        change recorded by the Scoring Rule.
                                      additionalProperties: false
                                      properties:
                                        new:
                                          type:
                                            - string
