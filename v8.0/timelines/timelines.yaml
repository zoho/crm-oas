openapi: 3.1.0
info:
  title: Timelines
  description: >-
    The Timelines API provides a chronological audit log of all significant
    events and changes on a CRM record. This API enables developers to retrieve
    paginated timeline entries for any supported CRM module record, with support
    for filtering, sorting, and cursor-based pagination.
  version: '8.0'
servers:
  - url: https://zohoapis.{dc}/crm/{version}
    description: >-
      Zoho CRM API server. Sample request URL:
      `https://zohoapis.{dc}/crm/{version}`
    variables:
      dc:
        enum:
          - com
          - eu
          - in
          - cn
          - au
        default: com
        description: >-
          Specifies the data center domain for the Zoho CRM API server. Possible
          values: **com**, **eu**, **in**, **cn**, **au**, **ca**, **jp**.
          Default: **com**.
      version:
        default: v8
        description: >-
          Specifies the API version. Possible values: **v7**, **v7.1**, **v8**.
          Default: **v8**.
paths:
  /{module}/{recordId}/__timeline:
    get:
      operationId: getTimelines
      summary: Get Timelines
      description: >-
        To retrieve a paginated list of timeline entries for a specific record
        in your Zoho CRM organization. Each timeline entry captures an audited
        event such as field changes, ownership transfers, workflow actions,
        Approval Process progressions, Scoring Rule updates, and signal events
        from extensions.
      x-zs-llm-description: >-
        Retrieves the activity timeline (audit trail) for a specific record in a
        given module. Returns chronological entries showing actions performed on
        the record - such as field updates, owner changes, workflow executions,
        email events, portal activity, blueprint transitions, and more. Requires
        the module-specific READ scope (e.g., ZohoCRM.modules.Leads.READ).
        Returns 204 No Content when no timeline entries exist for the record.
        Supports pagination via page_token or page/per_page (fixed at 3 per
        page), sorting by audited_time (asc/desc), and filtering by timeline
        type. The include_inner_details parameter expands nested field-change
        details within each timeline entry. Only works for standard and custom
        modules that support timeline tracking.
      security:
        - OAuth2:
            - ZohoCRM.modules.Leads.READ
        - OAuth2:
            - ZohoCRM.modules.Contacts.READ
        - OAuth2:
            - ZohoCRM.modules.Accounts.READ
        - OAuth2:
            - ZohoCRM.modules.Deals.READ
        - OAuth2:
            - ZohoCRM.modules.Tasks.READ
        - OAuth2:
            - ZohoCRM.modules.Events.READ
        - OAuth2:
            - ZohoCRM.modules.Calls.READ
        - OAuth2:
            - ZohoCRM.modules.Products.READ
        - OAuth2:
            - ZohoCRM.modules.Vendors.READ
        - OAuth2:
            - ZohoCRM.modules.Campaigns.READ
        - OAuth2:
            - ZohoCRM.modules.Cases.READ
        - OAuth2:
            - ZohoCRM.modules.Solutions.READ
        - OAuth2:
            - ZohoCRM.modules.Pricebooks.READ
        - OAuth2:
            - ZohoCRM.modules.Quotes.READ
        - OAuth2:
            - ZohoCRM.modules.Salesorders.READ
        - OAuth2:
            - ZohoCRM.modules.Purchaseorders.READ
        - OAuth2:
            - ZohoCRM.modules.Custom.READ
      parameters:
        - $ref: '#/components/parameters/Module'
        - $ref: '#/components/parameters/RecordId'
        - $ref: '#/components/parameters/IncludeInnerDetails'
        - $ref: '#/components/parameters/PageToken'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Filter'
        - $ref: '#/components/parameters/SortBy'
        - $ref: '#/components/parameters/SortOrder'
        - $ref: '#/components/parameters/IncludeTimelineType'
        - $ref: '#/components/parameters/Include'
      responses:
        '200':
          description: >-
            Returns a paginated list of timeline entries for the specified CRM
            record.
          content:
            application/json:
              schema:
                type: object
                x-zs-$id: TimelineResponse
                description: >-
                  Represents the successful response body for the Get Timelines
                  operation.
                additionalProperties: false
                properties:
                  __timeline:
                    type: array
                    description: >-
                      Represents an array of timeline entries for the specified
                      CRM record. Each entry captures an audited event with its
                      timestamp, action type, source, and contextual details.
                    maxItems: 200
                    items:
                      description: >-
                        Represents a single timeline entry recording an audited
                        event on the CRM record.
                      type: object
                      additionalProperties: false
                      properties:
                        audited_time:
                          type: string
                          description: >-
                            Represents the timestamp at which the action was
                            audited and recorded in the timeline.
                          format: date-time
                        action:
                          type:
                            - string
                            - 'null'
                          description: >-
                            Represents the type of action performed on the
                            record. This field is nullable.
                          enum:
                            - converted
                            - score_updated
                            - survey_sent
                            - email_notification_sent
                            - consent_mail_sent
                            - recommendation_feedback
                            - webhook_invoked
                            - function_executed
                            - owner_assigned
                            - owner_reassigned
                            - task_assigned
                            - create_record
                            - create_connected_record
                            - transition_executed
                            - command_center_log
                            - state_change_on_edit
                            - process_exit_on_edit
                            - abrupt_exit
                            - abrupt_exit_api
