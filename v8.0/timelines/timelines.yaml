components:
  parameters:
    Module:
      description: >-
        Specifies the API name of the CRM module to retrieve timeline entries
        from. Use the value from the **api_name** field returned by [Get
        Modules](https://www.zoho.com/crm/developer/docs/api/v8/modules-api.html).
      name: module
      in: path
      required: true
      schema:
        type: string
        maxLength: 255
    RecordId:
      name: recordId
      description: >-
        Specifies the unique ID of the CRM record to retrieve timeline entries
        for.
      in: path
      required: true
      schema:
        type: string
        maxLength: 255
    IncludeInnerDetails:
      name: include_inner_details
      description: >
        Use this parameter if you want to retrieve additional details about
        updates made to a record in the `field_history` object of the response.


        **Possible Values**


        - field_history.data_type :  Gives the data type of the field that was
        updated.


        - `field_history.field_label` : Gives the label details of the fields
        that were updated.


        - field_history.pick_list_values : Represents the list of values
        available for a picklist field.


        - `field_history.enable_colour_code` : Indicates whether colour coding
        is enabled for the picklist values.


        - `done_by.profile` : Provides details of the user's profile who updated
        the record.


        - `done_by.type__s` : Indicates the type of user (for example, portal
        user or regular user) who modified the record.
      in: query
      required: false
      schema:
        type: string
        maxLength: 255
    SortOrder:
      name: sort_order
      description: >-
        Specifies the sort order for timeline entries. Possible values: **asc**,
        **desc**.
      in: query
      required: false
      schema:
        type: string
        enum:
          - asc
          - desc
    SortBy:
      name: sort_by
      description: >-
        Specifies the field to sort timeline entries by. The only supported
        value is **audited_time**.
      in: query
      required: false
      schema:
        type: string
        enum:
          - audited_time
    IncludeTimelineType:
      name: include_timeline_types
      description: >-
        To include extra types in the "timeline" object. You can get "signals"
        data through this to get signals-related timeline entries.
      in: query
      required: false
      schema:
        type: string
        maxLength: 255
    Include:
      name: include
      description: >-
        Use this parameter if you want to view the details of updates to the
        record through signals or any other means. The possible values are
        extension and type. For example, if the record was updated through a
        signal, then the response will have details of the extension as email
        insights, while the type of update will be signals.
      in: query
      required: false
      schema:
        type: string
        maxLength: 255
    PageToken:
      name: page_token
      description: >-
        Specify the **next_page_token** or the **previous_page_token** after you
        have paginated and retrieved 200 records. Note that you cannot give
        **per_page** parameter if you give **page_token** in the request.
      in: query
      required: false
      schema:
        type: string
        maxLength: 255
    Page:
      name: page
      description: >-
        Specifies the page number for retrieving timeline entries in paginated
        results.
      in: query
      required: false
      schema:
        type: integer
        format: int32
    PerPage:
      name: per_page
      description: >-
        Specifies the number of timeline entries to return per page. The value
        must be **3**.
      in: query
      required: false
      schema:
        type: integer
        format: int32
        enum:
          - 3
    Filter:
      name: filters
      description: >
        **`filters` Parameter**


        The `filters` parameter is used to filter responses from the Timeline
        API based on specific conditions.


        Each filter condition consists of the following components:

        - field`

        - `comparator`

        - `value`


        **Supported `field.api_name` Values**

        The following values are supported for `field.api_name`:

        - `record.module.api_name`

        - `source`

        - `audited_time`

        - `done_by.id`


        **`record.module.api_name`**

        Use this field to filter timeline details related to the following
        record types:

        - `Notes`

        - `Attachments`

        - `Tasks`

        - `Calls`

        - `Events`

        - `Emails`


        **Allowed Comparators**

        - `equal`

        - `in`


        **Allowed Values**

        - `Notes`

        - `Attachments`

        - `Tasks`

        - `Calls`

        - `Events`

        - `Emails`


        **Example: Filter Notes**

        ```json

        {
          "field": {
            "api_name": "record.module.api_name"
          },
          "comparator": "equal",
          "value": "Notes"
        }

        ```

        **Example: Filter Notes and Tasks**

        ```json

        {
          "field": {
            "api_name": "record.module.api_name"
          },
          "comparator": "in",
          "value": ["Notes", "Tasks"]
        }

        ```

        **`done_by.id`**


        Use this field to filter timeline details performed by a specific user.


        **Allowed Comparators**


        - `equal`

        - `in`


        **Allowed Values**


        - User IDs


        **Example**


        ```json

        {
          "field": {
            "api_name": "done_by.id"
          },
          "comparator": "in",
          "value": ["5843104000000424001"]
        }

        ```


        **`audited_time`**


        Use this field to filter timeline data based on the audit timestamp.


        **Allowed Comparator**


        - `between`


        **Allowed Values**


        - Time in ISO 8601 format


        **Example: Filter Timeline Details Between Two Dates**


        ```json

        {
          "field": {
            "api_name": "audited_time"
          },
          "comparator": "between",
          "value": [
            "2023-10-25T00:00:00+12:00",
            "2023-10-30T23:59:59+12:00"
          ]
        }

        ```


        **`source`**


        Use this field to filter timeline data based on its source.


        **Allowed Comparators**


        - `equal`

        - `in`


        **Allowed Values**


        - `crm_api`

        - `mass_delete_via_crm_api`

        - `bulkapi`

        - `approval_process`

        - `assignment_rules`

        - `blueprint`

        - `mass_update_via_blueprint`

        - `orchestration`

        - `convert`

        - `massconvert`

        - `custom_function`

        - `macro`

        - `crm_ui`

        - `mass_update`

        - `mass_update_via_scheduler`

        - `mass_delete_via_clean_up`

        - `bulk_action`

        - `change_owner`

        - `mass_change_owner_via_scheduler`

        - `review_process`

        - `scoringrule`

        - `wizard`

        - `workflow`


        **Example: Filter by a Single Source**


        ```json

        {
          "field": {
            "api_name": "source"
          },
          "comparator": "equal",
          "value": "crm_ui"
        }

        ```


        **Example: Filter by Multiple Sources**


        ```json

        {
          "field": {
            "api_name": "source"
          },
          "comparator": "in",
          "value": ["crm_api", "crm_ui"]
        }

        ```


        ---


        **Combining Multiple Conditions**


        Use `group_operator` and `group` to combine multiple filter conditions.


        **Example**


        ```json

        {
          "group_operator": "AND",
          "group": [
            {
              "field": {
                "api_name": "record.module.api_name"
              },
              "comparator": "in",
              "value": ["Notes"]
            },
            {
              "field": {
                "api_name": "source"
              },
              "comparator": "in",
              "value": ["crm_ui", "crm_api"]
            }
          ]
        }

        ```


        You can also refer to the sample request for the complete structure.


        > **Note:** The value of the `filters` parameter must be URL-encoded
        before sending the request.


        **URL Encoding Example**


        The following filter:


        ```json

        {
          "comparator": "between",
          "field": {
            "api_name": "audited_time"
          },
          "value": [
            "2023-06-07T00:00:00+05:30",
            "2023-06-07T12:59:59+05:30"
          ]
        }

        ```


        is encoded as:


        ```text

        filters=%7B%22comparator%22%3A%22between%22%2C%22field%22%3A%7B%22api_name%22%3A%22audited_time%22%7D%2C%22value%22%3A%5B%222023-06-07T00%3A00%3A00%2B05%3A30%22%2C%222023-06-07T12%3A59%3A59%2B05%3A30%22%5D%7D

        ```


        You can use the **Encode URL** and **Decode URL** options in the [URL
        Encoder/Decoder tool](https://www.zoho.com/toolkit/encode-decode.html)
        to encode or decode this value.
      in: query
      required: false
      schema:
        type: string
        maxLength: 255
