    InvalidDataError:
      x-zs-$id: InvalidDataError
      type: object
      description: >-
        Error response returned when a field or parameter value fails validation
        in a related list operation.
      additionalProperties: false
      properties:
        status:
          type: string
          enum:
            - error
          description: >-
            Response status indicating an error occurred. Possible values:
            **error**. 
        code:
          type: string
          enum:
            - INVALID_DATA
          description: >-
            Error code indicating invalid data was provided. Possible values:
            **INVALID_DATA**. 
        message:
          type: string
          description: Error message describing the invalid data.
          enum:
            - Invalid value provided for field
            - Invalid data type
            - Invalid data
            - invalid data
            - Invalid data type for field
            - Field value exceeds maximum allowed length
            - The status given is invalid.
            - Invalid related list id
            - Invalid field configuration
            - Invalid sortorder value given
            - Invalid field api-name given for sorting
            - Invalid field Id given for sorting
            - Invalid Layout Id
            - Api name is not valid
            - Field selected is not in related module
            - Field selected is not present in any layouts of related module
            - Cannot Update sequence of related List which is not visible
            - Field Sequence Given is greater the Number of fields Selected
            - Field sequence number must be a positive integer greater than zero
            - The provided field sequence is not a valid Integer
            - Field for sorting not present in the field list
            - the relation id given seems to be invalid
        details:
          description: >-
            Contextual details about the invalid data. The structure varies by
            error subtype: field-level errors include **api_name** and
            **json_path**; parameter errors include **param_name**; resource
            path errors include **resource_path_index**. 
          oneOf:
            - $ref: '#/components/schemas/InvalidDataFieldDetails'
            - $ref: '#/components/schemas/InvalidDataTypeDetails'
            - $ref: '#/components/schemas/InvalidDataLengthDetails'
            - $ref: '#/components/schemas/InvalidDataParameterDetails'
            - $ref: '#/components/schemas/InvalidDataResourcePathDetails'
            - $ref: '#/components/schemas/InvalidDataFieldWithSupportedValuesDetails'
            - $ref: '#/components/schemas/InvalidDataFieldIndexDetails'
      required:
        - status
        - code
        - message
        - details
    InvalidDataFieldDetails:
      x-zs-$id: InvalidDataFieldDetails
      type: object
      description: >-
        Details for an INVALID_DATA error identifying the specific field and its
        location in the request.
      additionalProperties: false
      properties:
        api_name:
          type: string
          description: API name of the field that caused the validation error.
          maxLength: 100
        json_path:
          type: string
          description: JSON path to the specific field that failed validation.
          maxLength: 500
      required:
        - api_name
        - json_path
    InvalidDataTypeDetails:
      x-zs-$id: InvalidDataTypeDetails
      type: object
      description: >-
        Details for an INVALID_DATA error caused by a data type mismatch,
        including the expected type.
      additionalProperties: false
      properties:
        api_name:
          type: string
          description: API name of the field with the data type mismatch.
          maxLength: 100
        json_path:
          type: string
          description: JSON path to the field with the data type mismatch.
          maxLength: 500
        expected_data_type:
          type: string
          description: >-
            Expected data type for the field. Possible values: **integer**,
            **text**, **Boolean**, **jsonarray**, **jsonobject**. 
          enum:
            - integer
            - text
            - boolean
            - jsonarray
            - jsonobject
      required:
        - api_name
        - json_path
        - expected_data_type
    InvalidDataLengthDetails:
      x-zs-$id: InvalidDataLengthDetails
      type: object
      description: >-
        Details for an INVALID_DATA error caused by a field value exceeding the
        maximum allowed length.
      additionalProperties: false
      properties:
        api_name:
          type: string
          description: API name of the field whose value exceeded the maximum length.
          maxLength: 100
        json_path:
          type: string
          description: JSON path to the field whose value exceeded the maximum length.
          maxLength: 500
        maximum_length:
          type: integer
          format: int32
          description: Maximum allowed length for the field.
      required:
        - api_name
        - json_path
        - maximum_length
    InvalidDataParameterDetails:
      x-zs-$id: InvalidDataParameterDetails
      type: object
      description: >-
        Details for an INVALID_DATA error on a query or body parameter,
        identifying the parameter name and supported values.
      additionalProperties: false
      properties:
        param_name:
          type: string
          description: >-
            Name of the parameter that failed validation. Possible values:
            **module**, **status**, **layout_id**, **type**,
            **extra_properties**, **include_inner_details**, **feature_name**. 
          enum:
            - module
            - status
            - layout_id
            - type
            - extra_properties
            - include_inner_details
            - feature_name
        supported_values:
          type: array
          description: List of supported values for the parameter.
          items:
            type: string
            description: Represents a single supported value for the parameter.
            maxLength: 255
          maxItems: 100
      required:
        - param_name
    InvalidDataResourcePathDetails:
      x-zs-$id: InvalidDataResourcePathDetails
      type: object
      description: >-
        Details for an INVALID_DATA error caused by an invalid resource path
        identifier in the URL.
      additionalProperties: false
      properties:
        resource_path_index:
          type: integer
          format: int32
          description: Index of the resource path segment that contains invalid data.
      required:
        - resource_path_index
    InvalidDataFieldWithSupportedValuesDetails:
      x-zs-$id: InvalidDataFieldWithSupportedValuesDetails
      type: object
      description: >-
        Details for an INVALID_DATA error on a constrained field, listing the
        supported values.
      additionalProperties: false
      properties:
        api_name:
          type: string
          description: API name of the field with invalid value.
          maxLength: 100
        json_path:
          type: string
          description: JSON path to the field with invalid value.
          maxLength: 500
        supported_values:
          description: >-
            Supported values for the field, returned either as an array of
            strings or as a Boolean validation indicator.
          oneOf:
            - x-zs-$id: SupportedValuesArray
              type: array
              description: Represents the supported values as an array of strings.
              items:
                type: string
                description: Represents a single supported value for the constrained field.
                maxLength: 255
              maxItems: 100
            - x-zs-$id: SupportedValuesString
              type: string
              description: >-
                Represents the supported values as a Boolean validation
                indicator.
              maxLength: 500
      required:
        - api_name
        - json_path
        - supported_values
    InvalidDataFieldIndexDetails:
      x-zs-$id: InvalidDataFieldIndexDetails
      type: object
      description: >-
        Details for an INVALID_DATA error at a specific array index within a
        field.
      additionalProperties: false
      properties:
        api_name:
          type: string
          description: API name of the field at the error index.
          maxLength: 100
        json_path:
          type: string
          description: JSON path to the field at the error index.
          maxLength: 500
        index:
          type: integer
          format: int32
          description: Array index at which the validation error occurred.
      required:
        - api_name
        - json_path
        - index
    InvalidModuleError:
      x-zs-$id: InvalidModuleError
      type: object
      description: >-
        Error response returned when the specified module is invalid or not
        recognized in the CRM organization.
      additionalProperties: false
      properties:
        status:
          type: string
          enum:
            - error
          description: >-
            Response status indicating an error occurred. Possible values:
            **error**. 
        code:
          type: string
          enum:
            - INVALID_MODULE
          description: >-
            Error code indicating the module is invalid. Possible values:
