openapi: 3.1.0
info:
  title: Related Lists
  description: >-
    Related lists are configurable sub-panels on a CRM record detail page that
    display associated records from other modules, such as Contacts, Deals, or
    Activities linked to an Account. This API enables developers to retrieve,
    update, and customize the configuration of related list panels for a given
    module and layout.
  version: '8'
servers:
  - url: https://zohoapis.{dc}/crm/{version}
    description: >-
      Production API server for Zoho CRM. Sample request URL:
      **https://zohoapis.{dc}/crm/{version}**.
    variables:
      dc:
        enum:
          - com
          - eu
          - in
          - cn
          - au
        default: com
        description: >-
          Top-level domain for the Zoho CRM API server. Possible values:
          **com**, **eu**, **in**, **cn**, **au**. Default: **com**.
      version:
        default: v8
        description: 'API version. Default: **v8**.'
paths:
  /settings/related_lists:
    get:
      summary: Related Lists
      description: >-
        To retrieve the configuration of related list panels for a specific
        module in your Zoho CRM organization, including display metadata,
        available record operations, and layout-specific settings.
      operationId: getRelatedLists
      parameters:
        - $ref: '#/components/parameters/Module'
        - $ref: '#/components/parameters/LayoutId'
        - $ref: '#/components/parameters/Status'
        - $ref: '#/components/parameters/ExtraProperties'
        - $ref: '#/components/parameters/IncludeInnerDetails'
      security:
        - OAuth2:
            - ZohoCRM.settings.related_lists.READ
        - OAuth2:
            - ZohoCRM.settings.related_lists.ALL
        - OAuth2:
            - ZohoCRM.settings.ALL
      responses:
        '200':
          description: >-
            Returns the related list configuration for the specified module,
            including display metadata, record operation permissions, and
            layout-specific overrides for each related list.
          content:
            application/json:
              schema:
                x-zs-$id: GetRelatedListsResponse
                type: object
                description: >-
                  Response containing the related list configurations for the
                  specified module.
                additionalProperties: false
                properties:
                  related_lists:
                    type: array
                    description: >-
                      Array of related list configurations for the specified
                      module and layout.
                    items:
                      $ref: '#/components/schemas/RelatedList'
                    minItems: 1
                    maxItems: 1000
                required:
                  - related_lists
              examples:
                SuccessResponse:
                  summary: Successful retrieval of related lists
                  value:
                    related_lists:
                      - id: '4150868000000091023'
                        sequence_number: '1'
                        display_label: Contacts
                        api_name: Contacts
                        module:
                          api_name: Contacts
                          id: '4150868000000002175'
                        name: Contacts
                        action: null
                        href: null
                        type: default
                        customize_sort: true
                        customize_fields: true
                        customize_display_label: true
                        status: visible
                        parent_related_lists:
                          - api_name: Deals
                            id: '4150868000000091050'
                  description: >-
                    Shows a successful response for a module with one related
                    list entry, including the module reference and a parent
                    related list.
                FullResponseAllFieldsPopulated:
                  summary: Related list with all optional fields populated
                  value:
                    related_lists:
                      - id: '4150868000000091023'
                        sequence_number: '1'
                        display_label: Contacts
                        api_name: Contacts
                        module:
                          api_name: Contacts
                          id: '4150868000000002175'
                        name: Contacts
                        action: add_existing
                        href: Contacts/{ENTITYID}/Contacts
                        type: default
                        connectedlookupApiName: Account_Name
                        customize_sort: true
                        customize_fields: true
                        customize_display_label: true
                        status: visible
                        visibility: 1
                        personality_name: contacts_personality
                        record_operations:
                          edit: true
                          create: true
                          bulk_edit: false
                          delete: true
                          disassociate: true
                          assign: false
                        connectedmodule: Accounts
                        linkingmodule: Contacts_X_Accounts
                        parent_related_lists:
                          - api_name: Deals
                            id: '4150868000000091050'
                        _layout_specific_properties:
                          - sequence_number: '2'
                            status: visible
                            layout:
                              name: Standard
                              id: '4150868000000091100'
                  description: >-
                    Shows a complete related list entry with all optional fields
                    populated, including **record_operations**,
                    **_layout_specific_properties**, **connectedmodule**, and
                    **linkingmodule**.
                AllNullableFieldsNull:
                  summary: Related list with all nullable fields set to null
                  value:
                    related_lists:
                      - id: '4150868000000091023'
                        sequence_number: '1'
                        display_label: Notes
                        api_name: Notes
                        module: null
                        name: Notes
                        action: null
                        href: null
                        type: default
                        customize_sort: false
                        customize_fields: false
                        customize_display_label: false
                        status: visible
                        connectedmodule: null
                        linkingmodule: null
                        parent_related_lists: null
                        _layout_specific_properties: null
                  description: >-
                    Shows a response where all nullable fields - including
                    **module**, **action**, **href**, **connectedmodule**,
                    **linkingmodule**, **parent_related_lists**, and
                    **_layout_specific_properties** - return null values.
                MultiselectLookupRelatedList:
                  summary: Related list of type multiselectlookup with full config
                  value:
                    related_lists:
                      - id: '4150868000000091080'
                        sequence_number: '5'
                        display_label: Products
                        api_name: Products
                        module:
                          api_name: Products
                          id: '4150868000000002200'
                          plural_label: Products
                        name: Products
                        action: null
                        href: null
                        type: multiselectlookup
                        connectedlookupApiName: Product_Name
                        customize_sort: true
                        customize_fields: true
                        customize_display_label: true
                        status: visible
                        connectedmodule: Products
                        linkingmodule: Deals_X_Products
                        parent_related_lists: null
                        multiselectlookup:
                          field:
                            api_name: Product_Name
                            field_label: Product Name
                            id: '4150868000000002300'
                          linking_details:
                            visibility: 1
                            module:
                              plural_label: Deals_X_Products
                              api_name: Deals_X_Products
                              id: '4150868000000002400'
                            lookup_field:
                              api_name: Deal_Name
                              id: '4150868000000002500'
                            connected_lookup_field:
                              api_name: Product_Name
                              id: '4150868000000002600'
                          connected_details:
                            field:
                              api_name: Deal_Name
                              field_label: Deal Name
                              id: '4150868000000002700'
                            module:
                              plural_label: Deals
                              api_name: Deals
                              id: '4150868000000002800'
                            related_list:
                              display_label: Deals
                              api_name: Deals
                              id: '4150868000000002900'
                          field_enabled: true
                  description: >-
                    Shows a multiselectlookup related list with the complete
                    **multiselectlookup** object, including **field**,
                    **linking_details**, **connected_details**, and
                    **field_enabled**.
                UserHiddenRelatedList:
                  summary: Related list with user_hidden status
                  value:
                    related_lists:
                      - id: '4150868000000091090'
                        sequence_number: '10'
                        display_label: Hidden List
                        api_name: Custom_RL
                        module:
                          api_name: Custom_Module
                          id: '4150868000000003000'
                        name: Custom RL
                        action: null
                        href: null
                        type: custom
                        customize_sort: false
                        customize_fields: true
                        customize_display_label: true
                        status: user_hidden
                        parent_related_lists:
                          - api_name: Accounts
                            id: '4150868000000091060'
                  description: >-
                    Shows a related list where the **status** field is
                    **user_hidden**, indicating it has been hidden by the user
                    in the layout.
                ScheduledForDeletionRelatedList:
                  summary: Related list scheduled for deletion
                  value:
                    related_lists:
                      - id: '4150868000000091095'
                        sequence_number: '15'
                        display_label: Old List
                        api_name: Deprecated_RL
                        module:
                          api_name: Old_Module
                          id: '4150868000000003100'
                        name: Deprecated RL
                        action: null
                        href: null
                        type: default
                        customize_sort: false
                        customize_fields: false
                        customize_display_label: false
                        status: scheduled_for_deletion
                        parent_related_lists:
                          - api_name: Leads
                            id: '4150868000000091070'
                  description: >-
                    Shows a related list with **status** set to
                    **scheduled_for_deletion**, representing a list that is
                    marked for removal from the module layout.
                MultipleLayoutSpecificProperties:
                  summary: Related list with multiple layout-specific property entries
                  value:
                    related_lists:
                      - id: '4150868000000091023'
                        sequence_number: '1'
                        display_label: Contacts
                        api_name: Contacts
                        module:
                          api_name: Contacts
                          id: '4150868000000002175'
                        name: Contacts
                        action: null
                        href: null
                        type: default
                        customize_sort: true
                        customize_fields: true
                        customize_display_label: true
                        status: visible
                        parent_related_lists:
                          - api_name: Deals
                            id: '4150868000000091050'
                        _layout_specific_properties:
                          - sequence_number: '1'
                            status: visible
                            layout:
                              name: Standard
                              id: '4150868000000091100'
                          - sequence_number: '3'
                            status: user_hidden
                            layout:
                              name: Custom Layout
                              id: '4150868000000091200'
                  description: >-
                    Shows a related list with two entries in
                    **_layout_specific_properties**, each with a different
                    **layout** identifier, **sequence_number**, and **status**
                    override.
        '204':
          description: >-
            No related lists matched the requested module, layout, or visibility
            filter.
        '400':
          description: >-
            The request contains invalid or missing parameters.

            **Resolution:** The **module** parameter must be a valid CRM module
            API name. The **status** parameter must be one of the supported
            values.
          content:
            application/json:
              schema:
                x-zs-$id: GetRelatedListsErrorResponse
                description: >-
                  Validation error response for the getRelatedLists operation.
                  The error code and details identify the specific failure.
                oneOf:
                  - $ref: '#/components/schemas/InvalidDataError'
                  - $ref: '#/components/schemas/InvalidModuleError'
                  - $ref: '#/components/schemas/MissingModuleParameterError'
                  - $ref: '#/components/schemas/NotSupportedError'
              examples:
                InvalidModule:
                  summary: Invalid module name
                  value:
                    status: error
                    code: INVALID_MODULE
                    message: the module name given seems to be invalid
                    details:
                      param_name: module
                NotSupported:
                  summary: Module not supported by this API
                  value:
                    status: error
                    code: NOT_SUPPORTED
                    message: the given module is not supported for this api
                    details:
                      param_name: module
                  description: >-
                    Shows the NOT_SUPPORTED error returned when the specified
                    module exists in the CRM but is not supported by the Related
                    Lists API.
                InvalidParameterValue:
                  summary: Invalid value for the status parameter
                  value:
                    status: error
                    code: INVALID_DATA
                    message: The status given is invalid.
                    details:
                      param_name: status
                      supported_values:
                        - visible
                        - user_hidden
                        - scheduled_for_deletion
                  description: >-
                    Shows the INVALID_DATA error returned when the **status**
                    parameter receives an unsupported value, including the list
                    of supported values.
                RequiredParamMissing:
                  summary: Required module parameter is missing
                  value:
                    code: REQUIRED_PARAM_MISSING
                    details:
                      param_name: module
                    message: One of the expected parameter is missing
                    status: error
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
      x-zs-llm-description: >-
        This API returns the metadata configuration of related list panels
        (sections displayed on a record detail page showing linked records from
        other modules). It does not return the actual related records
        themselves.
components:
  schemas:
    RelatedListModule:
      type: object
      x-zs-$id: RelatedListModule
      description: >-
        Represents the module associated with a related list, including its API
        name and unique identifier.
      properties:
        api_name:
          type: string
          description: API name of the module associated with the related list.
          pattern: ^[A-Za-z0-9_]+$
          minLength: 1
          maxLength: 100
        id:
          type: string
          description: Unique identifier of the module.
          format: int64
        plural_label:
          type: string
          description: Plural display label of the module.
          minLength: 1
          maxLength: 250
      required:
        - api_name
        - id
      additionalProperties: false
    RelatedListSortField:
      x-zs-$id: RelatedListSortField
      type: object
      description: Represents the field used to sort records in a related list.
      additionalProperties: false
      properties:
        id:
          type: string
          description: Unique identifier of the field used for sorting.
          format: int64
        api_name:
          type: string
          description: API name of the field used for sorting.
          pattern: ^[A-Za-z0-9_]+$
          minLength: 1
          maxLength: 100
      required:
        - id
        - api_name
    RelatedListMultiselectSortField:
      x-zs-$id: RelatedListMultiselectSortField
      type: object
      description: >-
        Field metadata used for sorting a multiselectlookup related list. The
        api_name follows the format ModuleName.FieldApiName (e.g.,
        "Leads.Company") where the left part is the connected module api_name
        and the right part is the field api_name.
      additionalProperties: false
      properties:
        id:
          type: string
          description: Unique identifier of the sort field.
          format: int64
        api_name:
          type: string
          description: >-
            API name of the field used for sorting. For multiselectlookup
            related lists, this is in the format ModuleName.FieldApiName (e.g.,
            "Leads.Company").
          pattern: ^[A-Za-z0-9_]+(\.[A-Za-z0-9_]+)?$
          minLength: 1
          maxLength: 200
      required:
        - id
        - api_name
    RelatedListField:
      x-zs-$id: RelatedListField
      type: object
      description: Represents a field configured as a column in a related list view.
      additionalProperties: false
      properties:
        sequence_number:
          type: integer
          format: int32
          description: Display order position of the field within the related list.
        id:
          type: string
          description: Unique identifier of the field.
          format: int64
        api_name:
          type: string
          description: API name of the field.
          pattern: ^!?[A-Za-z0-9_.]+$
          minLength: 1
          maxLength: 100
        field_label:
          type: string
          description: Display label of the field.
          minLength: 1
          maxLength: 100
        ui_type:
          type: integer
          format: int32
          description: UI type identifier that determines how the field is rendered.
        enable_colour_code:
          type: boolean
          description: >-
            Indicates whether color coding is enabled for this field. Possible
            values: **true**, **false**.
        separator:
          type: boolean
          description: >-
            Indicates whether a separator is displayed after this field.
            Possible values: **true**, **false**.
        decimal_place:
          type:
            - integer
            - 'null'
          format: int32
          description: Number of decimal places configured for numeric fields.
        lookup:
          type: object
          description: >-
            Lookup configuration for the field. Empty object if the field is not
            a lookup. Returned when include_inner_details contains
            fields.lookup.
          properties:
            display_label:
              type: string
              description: Display label of the lookup related list.
              maxLength: 50
            revalidate_filter_during_edit:
              type: boolean
              description: Indicates if the filter should be revalidated during edit.
            api_name:
              type: string
              description: API name of the lookup related list.
              maxLength: 100
            module:
              type: object
              description: Module details for the lookup field.
              properties:
                api_name:
                  type: string
                  description: API name of the lookup target module.
                  maxLength: 100
                id:
                  type: string
                  description: Unique identifier of the lookup target module.
                  format: int64
              required:
                - api_name
                - id
              additionalProperties: false
            id:
              type: string
              description: Unique identifier of the lookup field.
              format: int64
            query_details:
              type: object
              description: Query details for the lookup field.
              properties:
                system_query_id:
                  type:
                    - string
                    - 'null'
                  description: System query ID for the lookup field.
                  format: int64
              required:
                - system_query_id
              additionalProperties: false
          additionalProperties: false
        formula:
          type: object
          description: >-
            Formula configuration for the field. Empty object if the field is
            not a formula field. Returned when include_inner_details contains
            fields.formula.
          properties:
            return_type:
              type: string
              description: The return type of the formula (e.g., text, number).
              maxLength: 50
          additionalProperties: false
        rollup_summary:
          type: object
          description: >-
            Rollup summary configuration for the field. Empty object if the
            field is not a rollup summary. Returned when include_inner_details
            contains fields.rollup_summary.
          properties:
            return_type:
              type: string
              description: The return type of the rollup summary (e.g., integer, number).
              maxLength: 50
          additionalProperties: false
        pick_list_values:
          type: array
          description: >-
            List of picklist values for picklist-type fields in the related
            list.
          items:
            $ref: '#/components/schemas/PickListValue'
          maxItems: 500
        mask_details:
          type: object
          description: >-
            Masking configuration for the field. Returned when
            include_inner_details contains fields.mask_details.
          properties: {}
          additionalProperties: false
        refer_from_field:
          type: object
          description: >-
            Reference field configuration. Returned when include_inner_details
            contains fields.refer_from_field.
          properties: {}
          additionalProperties: false
      required:
        - sequence_number
        - id
        - api_name
    RelatedListParentReference:
      type: object
      description: >-
        Represents a reference to a parent related list that this related list
        depends on for contextual display.
      additionalProperties: false
      properties:
        api_name:
          type: string
          description: API name of the parent related list.
          pattern: ^[A-Za-z0-9_]+$
          minLength: 1
          maxLength: 100
        id:
          type: string
          description: Unique identifier of the parent related list.
          format: int64
      required:
        - api_name
        - id
    PickListValue:
      x-zs-$id: PickListValue
      type: object
      description: >-
        Represents a single picklist option, including its display value, stored
        value, and visual configuration.
      additionalProperties: false
      properties:
        display_value:
          type: string
          description: Display value shown to the user in the picklist.
          maxLength: 255
        sequence_number:
          type: integer
          format: int32
          description: Display sequence position of this picklist value.
        reference_value:
          type: string
          description: Internal reference value associated with this picklist option.
          maxLength: 255
        colour_code:
          type:
            - string
            - 'null'
          description: >-
            Color code assigned to this picklist value for visual
            representation.
          maxLength: 7
        actual_value:
          type: string
          description: Stored value for this picklist option.
          maxLength: 255
        id:
          type: string
          description: Unique identifier of the picklist value.
          format: int64
        type:
          type: string
          description: Type classification of the picklist value.
          enum:
            - used
            - unused
      required:
        - display_value
        - sequence_number
        - reference_value
        - colour_code
        - actual_value
        - id
        - type
    RelatedListRecordOperations:
      type: object
      description: Represents the set of record operations permitted for a related list.
      additionalProperties: false
      properties:
        edit:
          type: boolean
          description: >-
            Indicates whether the edit operation is allowed on records in the
            related list. Possible values: **true**, **false**. 
        create:
          type: boolean
          description: >-
            Indicates whether the create operation is allowed on records in the
            related list. Possible values: **true**, **false**. 
        bulk_edit:
          type: boolean
          description: >-
            Indicates whether the bulk edit operation is allowed on records in
            the related list. Possible values: **true**, **false**. 
        delete:
          type: boolean
          description: >-
            Indicates whether the delete operation is allowed on records in the
            related list. Possible values: **true**, **false**. 
        disassociate:
          type: boolean
          description: >-
            Indicates whether records can be disassociated from the related
            list. Possible values: **true**, **false**. 
        assign:
          type: boolean
          description: >-
            Indicates whether the assign operation is allowed on records in the
            related list. Possible values: **true**, **false**. 
      required:
        - edit
        - create
        - bulk_edit
        - delete
        - disassociate
        - assign
    RelatedListLayoutSpecificProperty:
      type: object
      description: >-
        Represents layout-specific configuration overrides for a related list,
        including per-layout sequence and visibility.
      additionalProperties: false
      properties:
        sequence_number:
          type: string
          format: int32
          description: >-
            Display sequence position of this related list in the specified
            layout.
        status:
          type: string
          description: >-
            Visibility status of the related list in the specified layout.
            Possible values: **visible**, **user_hidden**,
            **scheduled_for_deletion**. 
          enum:
            - visible
            - user_hidden
            - scheduled_for_deletion
        layout:
          type: object
          description: Layout information for which this property override applies.
          additionalProperties: false
          properties:
            name:
              type: string
              description: Display name of the layout.
              minLength: 1
              maxLength: 100
            id:
              type: string
              description: Unique identifier of the layout.
              format: int64
          required:
            - name
            - id
      required:
        - sequence_number
        - layout
        - status
    MultiselectLookupConfig:
      x-zs-$id: MultiselectLookupConfig
      type: object
      description: >-
        Represents the multiselectlookup configuration for a related list,
        including the lookup field, linking module, and connected module
        details.
      additionalProperties: false
      properties:
        field:
          type: object
          description: Lookup field configuration for the multiselectlookup relationship.
          additionalProperties: false
          properties:
            api_name:
              type: string
              description: API name of the lookup field.
              maxLength: 100
            field_label:
              type: string
              description: Display label of the lookup field.
              maxLength: 100
            id:
              type: string
              description: Unique identifier of the lookup field.
              format: int64
          required:
            - api_name
            - field_label
            - id
        linking_details:
          type: object
          description: >-
            Details of the linking module that connects the two entities in the
            multiselectlookup.
          additionalProperties: false
          properties:
            visibility:
              type: integer
              format: int32
              description: Visibility flag for the linking module relationship.
            module:
              type: object
              description: >-
                Linking module information for the multiselectlookup
                relationship.
              additionalProperties: false
              properties:
                plural_label:
                  type: string
                  description: Plural display label of the linking module.
                  maxLength: 100
                api_name:
                  type: string
                  description: API name of the linking module.
                  maxLength: 100
                id:
                  type: string
                  description: Unique identifier of the linking module.
                  format: int64
              required:
                - plural_label
                - api_name
                - id
            lookup_field:
              type: object
              description: >-
                Lookup field in the linking module that references the source
                module.
              additionalProperties: false
              properties:
                api_name:
                  type: string
                  description: >-
                    API name of the lookup field in the linking module that
                    references the source module.
                  maxLength: 100
                id:
                  type: string
                  description: Unique identifier of the lookup field in the linking module.
                  format: int64
              required:
                - api_name
                - id
            connected_lookup_field:
              type: object
              description: >-
                Lookup field in the linking module that references the connected
                module.
              additionalProperties: false
              properties:
                api_name:
                  type: string
                  description: >-
                    API name of the connected lookup field in the linking
                    module.
                  maxLength: 100
                id:
                  type: string
                  description: >-
                    Unique identifier of the connected lookup field in the
                    linking module.
                  format: int64
              required:
                - api_name
                - id
          required:
            - visibility
            - module
            - lookup_field
            - connected_lookup_field
        connected_details:
          type: object
          description: >-
            Details of the connected module and field in the multiselectlookup
            relationship.
          additionalProperties: false
          properties:
            field:
              type: object
              description: >-
                Field configuration in the connected module for the
                multiselectlookup relationship.
              additionalProperties: false
              properties:
                api_name:
                  type: string
                  description: API name of the field in the connected module.
                  maxLength: 100
                field_label:
                  type: string
                  description: Display label of the field in the connected module.
                  maxLength: 100
                id:
                  type: string
                  description: Unique identifier of the field in the connected module.
                  format: int64
              required:
                - api_name
                - field_label
                - id
            module:
              type: object
              description: >-
                Connected module information in the multiselectlookup
                relationship.
              additionalProperties: false
              properties:
                plural_label:
                  type: string
                  description: Plural display label of the connected module.
                  maxLength: 100
                api_name:
                  type: string
                  description: API name of the connected module.
                  maxLength: 100
