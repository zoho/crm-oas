        Leads:
          value: Leads
          summary: CRM Leads module
        Contacts:
          value: Contacts
          summary: CRM Contacts module
        Accounts:
          value: Accounts
          summary: CRM Accounts module
        Deals:
          value: Deals
          summary: CRM Deals/Opportunities module
    Status:
      name: status
      in: query
      description: >-
        Specify the visibility status to filter related lists. Possible values:
        **visible**, **scheduled_for_deletion**, **user_hidden**.
      required: false
      schema:
        type: string
        enum:
          - visible
          - scheduled_for_deletion
          - user_hidden
      examples:
        Visible:
          value: visible
          summary: Show only visible related lists
        Hidden:
          value: user_hidden
          summary: Show only user-hidden related lists
        ScheduledDeletion:
          value: scheduled_for_deletion
          summary: Show only related lists scheduled for deletion
    LayoutId:
      name: layout_id
      in: query
      description: >-
        Specify the unique identifier of the layout to scope the related lists
        response. Refer to the [Layouts
        API](https://www.zoho.com/crm/developer/docs/api/v8/layouts-meta.html)
        resource for valid values.
      required: false
      schema:
        type: string
        format: int64
      examples:
        ValidLayoutId:
          value: '4150868000000091023'
          summary: Example of a valid layout ID
      x-zs-llm-description: >-
        ID of the CRM layout (a page configuration that defines field
        arrangement and sections for record detail views). Each module can have
        multiple layouts; omit to use the default layout.
    ExtraProperties:
      name: extra_properties
      in: query
      description: >-
        Set to **true** to include additional metadata properties for each
        related list entry beyond the default set. Possible values: **true**,
        **false**.
      required: false
      schema:
        type: boolean
        default: false
      examples:
        Enabled:
          value: true
          summary: Include extra properties in the response
        Disabled:
          value: false
          summary: Return only default properties
    IncludeInnerDetails:
      name: include_inner_details
      in: query
      description: >-
        Specify a comma-separated list of detail keys to embed in each related
        list object. Controls which nested detail blocks are included in the
        response.
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 255
      examples:
        All:
          value: all
          summary: Include all inner details
      x-zs-llm-description: >-
        Comma-separated list of field-level detail keys to embed in each related
        list's fields array. Valid keys: fields.ui_type, fields.field_label,
        fields.lookup, fields.formula, fields.rollup_summary,
        fields.pick_list_values, fields.separator, fields.decimal_place,
        fields.mask_details, fields.refer_from_field. Use 'all' to include every
        detail key at once.
  responses:
    UnauthorizedResponse:
      description: >-
        The access token is missing, expired, or does not include the required
        scope.

        **Resolution:** A new access token must be generated with the required
        scope for this API.
      content:
        application/json:
          schema:
            x-zs-$id: UnauthorizedResponseSchema
            oneOf:
              - $ref: '#/components/schemas/AuthenticationFailureError'
              - $ref: '#/components/schemas/OAuthScopeMismatchError'
            description: >-
              Error response returned when authentication fails. Contains the
              error code, message, and status.
          examples:
            InvalidToken:
              summary: Invalid or expired OAuth token
              value:
                code: INVALID_TOKEN
                details: {}
                message: invalid oauth token
                status: error
              description: >-
                Shows the INVALID_TOKEN error returned when the provided OAuth
                token is missing, expired, or not valid.
            OAuthScopeMismatch:
              summary: OAuth token missing the required scope
              value:
                code: OAUTH_SCOPE_MISMATCH
                details: {}
                message: invalid oauth scope to access this URL
                status: error
              description: >-
                Shows the OAUTH_SCOPE_MISMATCH error returned when the access
                token does not include the required scope for this API.
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://accounts.zoho.com/oauth/v2/auth
          tokenUrl: https://accounts.zoho.com/oauth/v2/token
          refreshUrl: https://accounts.zoho.com/oauth/v2/token
          scopes:
            ZohoCRM.settings.ALL: Full access to all CRM settings including related lists
            ZohoCRM.settings.related_lists.ALL: Full access to related lists configuration (read and write)
            ZohoCRM.settings.related_lists.READ: Read-only access to related lists configuration
            ZohoCRM.settings.related_lists.UPDATE: Update access to related lists configuration
