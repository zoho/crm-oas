        details:
          type: object
          description: Additional details about the invalid module error.
          additionalProperties: false
          properties:
            param_name:
              type: string
              description: >-
                Name of the parameter that referenced the invalid module.
                Possible values: **module**. 
              enum:
                - module
          required:
            - param_name
      required:
        - status
        - code
        - message
        - details
    MissingModuleParameterError:
      type: object
      additionalProperties: false
      description: >-
        Error response returned when the required **module** query parameter is
        absent from the request.
      properties:
        code:
          type: string
          description: >-
            Error code indicating the required **module** parameter is missing.
            Possible values: **REQUIRED_PARAM_MISSING**. 
          enum:
            - REQUIRED_PARAM_MISSING
        details:
          type: object
          additionalProperties: false
          description: Validation details identifying the missing parameter.
          properties:
            param_name:
              type: string
              description: >-
                Name of the missing required parameter. Possible values:
                **module**. 
              enum:
                - module
                - type
          required:
            - param_name
        message:
          type: string
          description: >-
            Error message indicating a required parameter is missing. Possible
            values: **One of the expected parameter is missing**. 
          enum:
            - One of the expected parameter is missing
        status:
          type: string
          description: >-
            Response status indicating an error occurred. Possible values:
            **error**. 
          enum:
            - error
      required:
        - code
        - details
        - message
        - status
      title: Missing Module Parameter Error
      x-zs-$id: MissingModuleParameterError
    NotSupportedError:
      x-zs-$id: NotSupportedError
      type: object
      description: >-
        Error response returned when the specified module exists but is not
        supported by this API.
      additionalProperties: false
      properties:
        status:
          type: string
          enum:
            - error
          description: >-
            Response status indicating an error occurred. Possible values:
            **error**. 
        code:
          type: string
          enum:
            - NOT_SUPPORTED
          description: >-
            Error code indicating the module is not supported by this API.
            Possible values: **NOT_SUPPORTED**. 
        message:
          type: string
          description: Error message describing the unsupported module.
          enum:
            - the given module is not supported for this api
            - this module is not supported
        details:
          type: object
          description: Additional details about the unsupported module.
          additionalProperties: false
          properties:
            param_name:
              type: string
              description: Name of the parameter referencing the unsupported module.
              enum:
                - module
      required:
        - status
        - code
        - message
        - details
