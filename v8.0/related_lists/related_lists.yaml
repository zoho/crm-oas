          enum:
            - invalid oauth scope to access this URL
        status:
          type: string
          enum:
            - error
          description: >-
            Response status indicating an error occurred. Possible values:
            **error**. 
      required:
        - code
        - details
        - message
        - status
  parameters:
    Module:
