        details:
          type: object
          description: Additional details about the authentication error.
          additionalProperties: false
        message:
          type: string
          description: >-
            Error message describing the authentication failure. Possible
            values: **invalid OAuth token**. 
          enum:
            - invalid oauth token
        status:
          type: string
          enum:
            - error
          description: >-
            Response status indicating an error occurred. Possible values:
            **error**. 
      required:
        - code
        - details
        - message
        - status
    OAuthScopeMismatchError:
      x-zs-$id: OAuthScopeMismatchError
      type: object
      description: >-
        Error response returned when the access token does not include the
