                  description: >-
                    Shows an error returned when the specified dependency is
                    system-defined and cannot be deleted.
                  summary: Example of internal dependency cannot be deleted.
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  parameters:
    LayoutId:
      name: layoutId
      in: path
      required: true
      description: >-
        Specify the unique identifier of the layout. Use the [Get Layouts
        API](layouts.yaml#$./settings/layouts.get) to get the ID of the layout.
      schema:
        type: string
        pattern: ^[0-9]+$
        format: int64
    DependencyId:
      name: dependencyId
      in: path
      description: >-
        Specify the unique identifier of the map dependency to retrieve, update,
        or delete.
      required: true
      schema:
        type: string
        format: int64
    Module:
      name: module
      in: query
      required: true
      description: >-
        Specify the API name of the module. Use the [Get Modules
        API](modules.yaml#$.paths./settings/modules.get) to get the valid API
        names. 
      schema:
        type: string
        pattern: ^[A-Za-z][A-Za-z0-9_]*$
        maxLength: 50
    Filters:
      name: filters
      in: query
      required: false
      description: >
        Specify the filter criteria for field dependencies in JSON format.
        Supported filters allow narrowing results by specific field attributes
        using **comparator** and **field** attributes. Supported comparator
        values: **equal**, **in**.
      schema:
        type: string
        maxLength: 100
    Page:
      name: page
      in: query
      description: Specify the page number to retrieve in the paginated response.
      required: false
      schema:
        type: integer
        format: int32
    PerPage:
      name: per_page
      in: query
      required: false
      description: Specify the number of records to include on each page of the response.
      schema:
        type: integer
        format: int32
        maximum: 200
    XZcsrfToken:
      name: X-ZCSRF-TOKEN
      in: header
      required: false
      description: >-
        Specify the CSRF token for additional request validation in server-side
        integrations.
      schema:
        type: string
        maxLength: 255
  schemas:
    FieldReference:
      type: object
      description: >-
        Represents a reference to a field, identified by its unique ID and API
        name.
      additionalProperties: false
      properties:
        id:
          type: string
          description: 'Represents the unique identifier of the field. '
          format: int64
        api_name:
          type: string
          description: Represents the API name of the field.
          maxLength: 50
      required:
        - id
    PicklistOption:
      type: object
      description: >-
        Represents a picklist option with its unique identifier, actual value,
        and display label.
      additionalProperties: false
      properties:
        id:
          type: string
          description: 'Represents the unique identifier of the picklist option. '
          format: int64
        actual_value:
          type: string
          description: Represents the actual stored value of the picklist option.
          maxLength: 120
        display_value:
          type: string
          description: >-
            Represents the display label of the picklist option as shown in the
            CRM interface. 
          maxLength: 120
      required:
        - id
        - actual_value
        - display_value
    PicklistMappingCreate:
      type: object
      description: >-
        Represents a parent picklist option and its mapped child picklist values
        for dependency creation.
      additionalProperties: false
      properties:
        id:
          type: string
          description: >-
            Represents the unique identifier of the parent picklist option. Use
            the [Get Fields API](fields.yaml#$.paths./settings/fields.get) to
            get the ID of the picklist. 
          format: int64
        actual_value:
          type: string
          description: Represents the actual stored value of the parent picklist option.
          maxLength: 120
        display_value:
          type: string
          description: >-
            Represents the display label of the parent picklist option as shown
            in the CRM interface.
          maxLength: 120
        maps:
          type: array
          description: >-
            Lists the child picklist options associated with this parent
            picklist value.
          maxItems: 2000
          items:
            type: object
            description: >-
              Each object represents a child picklist option mapped to this
              parent value.
            additionalProperties: false
            properties:
              id:
                type: string
                description: >-
                  Represents the unique identifier of the child picklist option.
                  Use the [Get Fields
                  API](fields.yaml#$.paths./settings/fields.get) to get the
                  details of the picklist. 
                format: int64
              actual_value:
                type: string
                description: >-
                  Represents the actual stored value of the child picklist
                  option.
                maxLength: 120
              display_value:
                type: string
                description: >-
                  Represents the display label of the child picklist option as
                  shown in the CRM interface.
                maxLength: 120
            required:
              - id
      required:
        - id
        - maps
    PicklistMappingRead:
      type: object
      description: >-
        Represents a parent picklist option with its complete set of mapped
        child picklist values, as returned in GET responses.
      additionalProperties: false
      properties:
        id:
          type: string
          description: 'Represents the unique identifier of the parent picklist option. '
          format: int64
        actual_value:
          type: string
          description: 'Represents the actual stored value of the parent picklist option. '
          maxLength: 120
        display_value:
          type: string
          description: >-
            Represents the display label of the parent picklist option as shown
            in the CRM interface. 
          maxLength: 120
        maps:
          type: array
          description: >-
            Lists the child picklist options associated with this parent
            picklist value. 
          maxItems: 2000
          items:
            $ref: '#/components/schemas/PicklistOption'
      required:
        - id
        - actual_value
        - display_value
        - maps
    PicklistMappingUpdate:
      type: object
      description: >-
        Represents a parent picklist option and its mapped child picklist values
        for dependency updates. Supports removal of individual child mappings
        using the **_delete** property.
      additionalProperties: false
      properties:
        id:
          type: string
          description: Represents the unique identifier of the parent picklist option.
          format: int64
        actual_value:
          type: string
          description: Represents the actual stored value of the parent picklist option.
          maxLength: 120
        display_value:
          type: string
          description: >-
            Represents the display label of the parent picklist option as shown
            in the CRM interface.
          maxLength: 120
        maps:
          type: array
          description: >-
            Lists the child picklist options associated with this parent
            picklist value.
          maxItems: 2000
          items:
            type: object
            description: >-
              Represents a child picklist option in the dependency update.
              Supports deletion using the **_delete** property.
            additionalProperties: true
            properties:
              id:
                type: string
                description: Represents the unique identifier of the child picklist option.
                format: int64
              actual_value:
                type: string
                description: >-
                  Represents the actual stored value of the child picklist
                  option.
                maxLength: 120
              display_value:
                type: string
                description: >-
                  Represents the display label of the child picklist option as
                  shown in the CRM interface.
                maxLength: 120
              _delete:
                type: 'null'
                description: >-
                  Indicates that this child option mapping should be deleted.
                  Set to **null** to remove the mapping.
            required:
              - id
      required:
        - id
        - maps
    SuccessResponse:
      type: object
      description: >-
        Represents the success response returned after a create, update, or
        delete operation.
      additionalProperties: false
      properties:
        status:
          type: string
          description: >
            Represents the status of the operation. Possible values:
            **success**. 
          enum:
            - success
        code:
          type: string
          description: >
            Represents the success code for the operation. Possible values:
            **SUCCESS**. 
          enum:
            - SUCCESS
        message:
          type: string
          description: Describes the result of the operation.
          maxLength: 500
        details:
          type: object
          description: 'Contains the result details for the operation. '
          additionalProperties: false
          properties:
            id:
              type: string
              description: >-
                Represents the unique identifier of the dependency the operation
                created, updated, or deleted. 
              format: int64
          required:
            - id
      required:
        - status
        - code
        - message
        - details
  responses:
    ForbiddenError:
      description: >
        The user does not have the required permission to perform this
        operation.

        **Resolution:** The CRM administrator must grant the user's profile the
        required permissions listed in the **details.permissions** array.
      content:
        application/json:
          schema:
            type: object
            x-zs-$id: ForbiddenErrorResponse
            description: >-
              Represents the error response returned when the user does not have
              the required permissions to perform this operation.
            additionalProperties: false
            properties:
              status:
                type: string
                description: >
                  Represents the status of the response. Possible values:
                  **error**. 
                enum:
                  - error
              code:
                type: string
                description: >
                  Represents the error code for the response. Possible values:
                  **NO_PERMISSION**. 
                enum:
                  - NO_PERMISSION
              message:
                type: string
                description: 'Describes the reason for the permission error. '
                maxLength: 500
              details:
                type: object
                description: 'Contains additional details about the missing permissions. '
                additionalProperties: true
                properties:
                  permissions:
                    description: 'Lists the permissions required to perform this operation. '
                required:
                  - permissions
            required:
              - status
              - code
              - message
              - details
    NotFoundError:
      description: >
        The request URL does not match a valid endpoint pattern.

        **Resolution:** Verify the request URL and ensure all path parameter IDs
        are valid.
      content:
        application/json:
          schema:
            type: object
            x-zs-$id: NotFoundErrorResponse
            description: >-
              Represents the error response returned when the request URL does
              not match a valid endpoint pattern.
            additionalProperties: false
            properties:
              status:
                type: string
                description: >
                  Represents the status of the response. Possible values:
                  **error**.
                enum:
                  - error
              code:
                type: string
                description: 'Represents the error code for this response. '
                enum:
                  - INVALID_URL_PATTERN
              message:
                type: string
                description: >-
                  Describes the reason the requested resource could not be
                  found. 
                maxLength: 500
              details:
                type: object
                description: 'Contains additional details about the error. '
                additionalProperties: true
            required:
              - status
              - code
              - message
              - details
    InternalServerError:
      description: >
        An unexpected error occurred on the server.

        **Resolution:** Retry the request. If the error persists, contact Zoho
        CRM support.
      content:
        application/json:
          schema:
            type: object
            x-zs-$id: InternalServerErrorResponse
            description: >-
              Represents the error response returned when an unexpected
              server-side error occurs.
            additionalProperties: false
            properties:
              code:
                type: string
                description: >-
                  Represents the error code indicating the type of internal
                  server error. 
                maxLength: 500
              message:
                type: string
                description: 'Describes the internal server error that occurred. '
                maxLength: 500
              details:
                type: object
                description: 'Contains additional details about the internal server error. '
                additionalProperties: true
              status:
                type: string
                description: >
                  Represents the status of the response. Possible values:
                  **error**. 
                enum:
                  - error
            required:
              - code
              - message
              - details
              - status
          examples:
            ErrorExample:
              value:
                code: INTERNAL_ERROR
                message: Internal Server Error
                details: {}
                status: error
              description: >-
                Shows the standard error response returned when an unexpected
                server-side error occurs.
              summary: Example of an internal server error.
  headers: {}
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://accounts.zoho.com/oauth/v2/auth
          tokenUrl: https://accounts.zoho.com/oauth/v2/token
          refreshUrl: https://accounts.zoho.com/oauth/v2/token
          scopes:
            ZohoCRM.settings.map_dependency.all: >-
              Grants permission to perform all operations on map dependency
              settings, including read, create, update, and delete.
            ZohoCRM.settings.map_dependency.create: >-
              Grants permission to create map dependency configurations in a
              layout.
            ZohoCRM.settings.map_dependency.read: Grants permission to retrieve map dependency fields for a layout.
            ZohoCRM.settings.map_dependency.delete: >-
              Grants permission to delete map dependency configurations from a
              layout.
            ZohoCRM.settings.map_dependency.update: >-
              Grants permission to update map dependency configurations in a
              layout.
