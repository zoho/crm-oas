  /settings/layouts/{layoutId}/map_dependency/{dependencyId}:
    get:
      summary: Get a field dependency by ID
      description: >-
        To retrieve the complete details of a specific field dependency from a
        layout in your Zoho CRM organization, including all picklist value
        mappings.
      x-zs-llm-description: >-
        Returns a single picklist field dependency with full value mappings. The
        parent and child objects contain field IDs and api_names from the Fields
        API. The pick_list_values array shows which child picklist values are
        allowed for each parent value.
      operationId: getMapDependencyById
      security:
        - OAuth2:
            - ZohoCRM.settings.map_dependency.read
      parameters:
        - $ref: '#/components/parameters/Module'
        - $ref: '#/components/parameters/LayoutId'
        - $ref: '#/components/parameters/DependencyId'
      responses:
        '200':
          description: >-
            Returns the complete details of the specified field dependency,
            including all picklist value mappings.
          content:
            application/json:
              schema:
                x-zs-$id: GetMapDependencyByIdSuccessResponse
                type: object
                description: >-
                  Represents the response containing the complete details of the
                  specified field dependency, including all picklist value
                  mappings.
                additionalProperties: false
                properties:
                  map_dependency:
                    type: array
                    description: >-
                      Contains the field dependency details for the specified
                      dependency ID. 
                    maxItems: 1
                    items:
                      type: object
                      description: >-
                        Each object represents the field dependency object with
                        complete parent and child field references, picklist
                        value mappings, and dependency metadata.
                      additionalProperties: false
                      properties:
                        parent:
                          $ref: '#/components/schemas/FieldReference'
                          description: Parent field details
                        child:
                          $ref: '#/components/schemas/FieldReference'
                          description: Details of the child field
                        pick_list_values:
                          type: array
                          description: >-
                            Contains the complete mapping of parent picklist
                            options to their corresponding child picklist
                            options. 
                          maxItems: 2000
                          items:
                            $ref: '#/components/schemas/PicklistMappingRead'
                        internal:
                          type: boolean
                          description: >
                            Indicates whether the dependency was defined by the
                            system or created by the user. Possible values:
                            **true**, **false**. 
                          enum:
                            - true
                            - false
                        active:
                          type: boolean
                          description: >
                            Indicates whether the dependency is active in the
                            layout. Possible values: **true**, **false**. 
                          enum:
                            - true
                            - false
                        id:
                          type: string
                          description: >-
                            Represents the unique identifier of the field
                            dependency. 
                          format: int64
                        source:
                          type: integer
                          format: int32
                          description: >
                            Represents the source of the dependency. Possible
                            values: **1**. It indicates Zoho CRM as the source. 
                          enum:
                            - 1
                        category:
                          type: integer
                          format: int32
                          description: >
                            Represents the category of the dependency. Possible
                            values: **0**. **0** represents the default
                            category. 
                          enum:
                            - 0
                      required:
                        - parent
                        - child
                        - pick_list_values
                        - internal
                        - active
                        - id
                        - source
                        - category
                required:
                  - map_dependency
              examples:
                SuccessResponse:
                  value:
                    map_dependency:
                      - parent:
                          api_name: Lead_Source
                          id: '1043386000000002609'
                        internal: false
                        active: true
                        id: '1043386000020283001'
                        source: 1
                        category: 0
                        pick_list_values:
                          - display_value: '-None-'
                            maps:
                              - display_value: Contacted
                                actual_value: Contacted
                                id: '1043386000000016330'
                              - display_value: Contact in Future
                                actual_value: Contact in Future
                                id: '1043386000000016333'
                            actual_value: '-None-'
                            id: '1043386000000016273'
                        child:
                          api_name: Lead_Status
                          id: '1043386000000002611'
                  description: >-
                    Shows the complete details of a field dependency, including
                    the parent and child field references and the full picklist
                    value mapping.
                  summary: Example of single field dependency with picklist mappings.
        '204':
          description: >
            The specified field dependency was not found in the layout.

            **Resolution**: Use the [Get Layouts
            API](layouts.yaml#$.paths./settings/layouts.get) to provide a valid
            ID in the request.
        '400':
          description: >
            The request contains invalid parameters or data.

            **Resolution:** Verify the module API name and ensure all required
            parameters are included. Use the [Get Modules
            API](modules.yaml#$.paths./settings/modules.get) to get the details
            of a module.
          content:
            application/json:
              schema:
                type: object
                x-zs-$id: GetMapDependencyByIdErrorResponse
                description: >-
                  Represents the error response returned when the request
                  contains invalid parameters or data.
                additionalProperties: false
                properties:
                  status:
                    type: string
                    description: 'Represents the status of the response. '
                    enum:
                      - error
                  code:
                    type: string
                    description: >
                      Represents the error code for the request error. Possible
                      values: **REQUIRED_PARAM_MISSING**, **INVALID_MODULE**,
                      **NOT_SUPPORTED**. 
                    enum:
                      - REQUIRED_PARAM_MISSING
                      - INVALID_MODULE
                      - NOT_SUPPORTED
                  message:
                    type: string
                    description: 'Describes the error that occurred. '
                    maxLength: 500
                  details:
                    type: object
                    description: 'Contains additional details about the error. '
                    additionalProperties: true
                required:
                  - status
                  - code
                  - message
                  - details
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      summary: Update an existing field dependency
      description: >
        Updates the picklist value mappings for an existing field dependency.
        Use \"_delete\": null to remove specific mappings.
      x-zs-llm-description: >-
        Updates value mappings for an existing picklist field dependency. To
        remove a specific parent-to-child mapping, include the mapping entry
        with "_delete": null. Only the pick_list_values mappings can be changed;
        the parent and child fields cannot be reassigned. Dependencies where
        internal is true cannot be modified.
      operationId: updateMapDependency
      security:
        - OAuth2:
            - ZohoCRM.settings.map_dependency.update
      parameters:
        - $ref: '#/components/parameters/Module'
        - $ref: '#/components/parameters/LayoutId'
        - $ref: '#/components/parameters/DependencyId'
      requestBody:
        description: The request body contains the data required to perform the operation.
        content:
          application/json:
            schema:
              type: object
              description: >-
                Represents the request body for updating a field dependency
                between picklist fields in a layout.
              additionalProperties: false
              properties:
                map_dependency:
                  type: array
                  description: Specify the field dependency configuration to update.
                  maxItems: 1
                  items:
                    type: object
                    description: >-
                      Each object specifies the updated configuration for the
                      field dependency, including the parent field, child field,
                      and picklist value mappings.
                    additionalProperties: false
                    properties:
                      parent:
                        $ref: '#/components/schemas/FieldReference'
                        description: Parent field details
                      child:
                        $ref: '#/components/schemas/FieldReference'
                        description: Child field details
                      pick_list_values:
                        type: array
                        description: >-
                          Specify the updated picklist value mappings. Set
                          **_delete** to **null** on a child option entry to
                          remove that specific mapping.
                        maxItems: 2000
                        items:
                          $ref: '#/components/schemas/PicklistMappingUpdate'
                      internal:
                        type: boolean
                        description: >
                          Specify whether the dependency is system-defined or
                          user-created. Possible values: **true**, **false**.
                      active:
                        type: boolean
                        description: >
                          Specify whether the dependency should be active in the
                          layout. Possible values: **true**, **false**.
                      id:
                        type: string
                        description: >-
                          Specify the unique identifier of the dependency to
                          update.
                        format: int64
                      source:
                        type: integer
                        format: int32
                        description: >
                          Specify the source for the dependency. Possible
                          values: **1**. It represents Zoho CRM.
                        enum:
                          - 1
                      category:
                        type: integer
                        format: int32
                        description: >
                          Specify the category of the dependency. Possible
                          values: **0**.
                        enum:
                          - 0
                    required:
                      - parent
                      - child
                      - pick_list_values
              required:
                - map_dependency
            examples:
              UpdateDependency:
                value:
                  map_dependency:
                    - parent:
                        api_name: Lead_Source
                        id: '111111000000004107'
                      internal: false
                      active: true
                      id: '111111000000058515'
                      source: 1
                      category: 0
                      pick_list_values:
                        - display_value: '-None-'
                          maps:
                            - display_value: Contacted
                              actual_value: Contacted
                              id: '111111000000016330'
                            - display_value: Contact in Future
                              actual_value: Contact in Future
                              id: '111111000000016333'
                          actual_value: '-None-'
                          id: '111111000000016273'
                        - display_value: Cold Call
                          maps:
                            - display_value: Pre-Qualified
                              actual_value: Pre-Qualified
                              id: '111111000000016327'
                            - display_value: Not Qualified
                              actual_value: Not Qualified
                              id: '111111000000016351'
                              _delete: null
                          actual_value: Cold Call
                          id: '111111000000016279'
                      child:
                        api_name: Lead_Status
                        id: '111111000000004109'
                description: >
                  Shows a PUT request body that updates the picklist value
                  mappings for a **Lead_Source** to **Lead_Status** dependency,
                  including removing one mapping using **_delete: null**.
                summary: Example of updating a field dependency.
            x-zs-llm-examples:
              - UpdateDependency
        required: true
      responses:
        '200':
          description: >-
            Returns the result of the update operation, including the unique
            identifier of the updated field dependency.
          content:
            application/json:
              schema:
                type: object
                x-zs-$id: UpdateMapDependencySuccessResponse
                description: >-
                  Represents the success response returned after the field
                  dependency is successfully updated.
                additionalProperties: false
                properties:
                  map_dependency:
                    type: array
                    description: 'Contains the result of the update operation. '
                    maxItems: 1
                    items:
                      $ref: '#/components/schemas/SuccessResponse'
                required:
                  - map_dependency
              examples:
                SuccessResponse:
                  value:
                    map_dependency:
                      - code: SUCCESS
                        details:
                          id: '111111000000064003'
                        message: map dependency updated
                        status: success
                  description: >-
                    Shows the success response containing the unique identifier
                    of the updated field dependency.
                  summary: Example of field dependency updated successfully.
        '400':
          description: >
            The request contains invalid data or violates an update rule.

