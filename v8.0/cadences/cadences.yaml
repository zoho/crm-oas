  /settings/automation/cadences/actions/count:
    get:
      summary: Get Cadence module actions count
      description: >-
        To retrieve the total number of follow-up actions configured for the
        specified CRM module across all Cadences in your Zoho CRM organization.
        The count includes tasks, emails, calls, and WhatsApp messages, and is
        used to enforce the edition-level per-module action count limit.
      operationId: getCadenceModuleActionsCount
      parameters:
        - name: module
          in: query
          description: >-
            Specify the CRM module API name to retrieve the Cadence action count
            for.

            Refer to the [Get
            Modules](modules.yaml#$.paths./settings/modules.get) resource for
            valid values.
          required: true
          schema:
            type: string
            maxLength: 255
      responses:
        '200':
          description: Returns the total count of Cadence actions for the specified module.
          content:
            application/json:
              schema:
                type: object
                x-zs-$id: GetCadenceModuleActionsCountSuccessResp
                additionalProperties: false
                description: >-
                  Represents the successful response for the count of Cadence
                  module actions.
                properties:
                  count:
                    type: integer
                    format: int32
                    description: >-
                      Represents the total count of Cadence actions for the
                      specified module.
              examples:
                Success200:
                  summary: Successful Cadence module actions count response
                  value:
                    count: 15
                  description: >-
                    Shows a successful response returning the count of Cadence
                    actions for the specified module.
        '400':
          description: >-
            The request contains invalid data or the required **module**
            parameter is missing.

            **Resolution:** The **module** query parameter must be present and
            must specify a valid CRM module API name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllErrorResponse'
              examples:
                RequiredModuleParamMissing:
                  summary: Missing module parameter error
                  value:
                    code: REQUIRED_PARAM_MISSING
                    details:
                      param_name: module
                    message: One of the expected parameter is missing
                    status: error
                  description: >-
                    Shows an error response when the required module query
                    parameter is missing from the request.
                InvalidModuleName:
                  summary: Invalid module name error
                  value:
                    code: INVALID_MODULE
                    details:
                      param_name: module
                    message: the module name given seems to be invalid
                    status: error
                  description: >-
                    Shows an error response when the provided module name is
                    invalid or does not exist in Zoho CRM.
        '403':
          description: >-
            The user does not have permission to access this resource, or the
            API is not supported for the selected domain.

            **Resolution:** The CRM administrator must grant the required
            Cadence permission to the user's profile, and a new access token
            must be generated with the required scope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllErrorResponse'
              examples:
                NoPermissionResponse1:
                  summary: No permission to access Cadence module actions error
                  value:
                    code: NO_PERMISSION
                    details:
                      permissions:
                        - Crm_Implied_View_Cadences
                    message: No permission
                    status: error
                  description: >-
                    Shows an error response when the user lacks permission to
                    access Cadence module actions.
      security:
        - OAuth2:
            - ZohoCRM.settings.cadences.READ
components:
  schemas:
    GetByIdCadenceSuccessResp:
      type: object
      x-zs-$id: GetByIdCadenceSuccessResp
      additionalProperties: false
      description: >-
        Represents the response containing the details of a specific Cadence
        retrieved by its identifier.
      properties:
        cadences:
          type: array
          description: Represents the list of Cadences with their full details.
          items:
            type: object
            additionalProperties: false
            description: >-
              Represents the detailed configuration and metadata for a single
              Cadence.
            properties:
              summary:
                $ref: '#/components/schemas/FollowUpSummary'
              created_time:
                $ref: '#/components/schemas/CreatedTime'
              module:
                $ref: '#/components/schemas/ModuleInformation'
              description:
                $ref: '#/components/schemas/CadenceDescription'
              execution_details:
                type:
                  - object
                  - 'null'
                additionalProperties: false
                description: >-
                  Represents the execution frequency and unenrollment
                  configuration for the Cadence.
                properties:
                  unenroll_properties:
                    type:
                      - array
                      - 'null'
                    description: >-
                      Represents the list of conditions under which records are
                      automatically unenrolled from the Cadence.
                    items:
                      type: object
                      additionalProperties: false
                      description: Represents a single unenrollment condition.
                      properties:
                        details:
                          type:
                            - object
                            - 'null'
                          description: >-
                            Represents additional details for the unenrollment
                            condition.
                        id:
                          type: string
                          maxLength: 255
                          description: >-
                            Represents the unique identifier of the unenrollment
                            condition.
                        type:
                          type: string
                          maxLength: 255
                          description: Represents the type of unenrollment condition.
                    maxItems: 50
                  execute_every:
                    $ref: '#/components/schemas/ExecuteEvery'
              type:
                $ref: '#/components/schemas/CadenceEnrollmentType'
              created_by:
                $ref: '#/components/schemas/CreatorInfo'
              modified_time:
                type:
                  - string
                  - 'null'
                maxLength: 255
                description: >-
                  Represents the date and time when the Cadence was last
                  modified.
              modified_by:
                $ref: '#/components/schemas/ModifierInfo'
              name:
                $ref: '#/components/schemas/CadenceName'
              follow_ups:
                type: array
                description: >-
                  Represents the list of follow-up steps configured in the
                  Cadence.
                items:
                  type: object
                  additionalProperties: false
                  description: Represents a single follow-up step in the Cadence.
                  properties:
                    parent_follow_up:
                      type:
                        - object
                        - 'null'
                      description: >-
                        Represents the parent follow-up step that this step
                        branches from.
                      properties:
                        id:
                          type: string
                          maxLength: 255
                          description: >-
                            Represents the unique identifier of the parent
                            follow-up step.
                        type:
                          type: string
                          maxLength: 255
                          description: >-
                            Represents the branch type of the parent follow-up
                            connection.
                    execute_after:
                      type: object
                      additionalProperties: false
                      description: >-
                        Represents the wait period before this follow-up step
                        executes.
                      properties:
                        unit:
                          type: integer
                          format: int32
                          description: Represents the time unit for the wait period.
                        period:
                          type: string
                          maxLength: 255
                          description: Represents the numeric duration of the wait period.
                        id:
                          type: string
                          maxLength: 255
                          description: >-
                            Represents the unique identifier for the
                            execute-after configuration.
                    action:
                      type: object
                      description: Represents the action configured for the follow-up step.
                      additionalProperties: true
                    id:
                      type: string
                      maxLength: 255
                      description: Represents the unique identifier of the follow-up step.
                    triggers:
                      type:
                        - array
                        - 'null'
                      description: >-
                        Represents the list of trigger conditions for the
                        follow-up step.
                      items:
                        type: string
                        maxLength: 255
                        description: >-
                          Represents a single trigger condition for the
                          follow-up step.
                      maxItems: 25
                  title: Follow-Up Details
                  required:
                    - parent_follow_up
                    - action
                    - id
                maxItems: 200
              id:
                $ref: '#/components/schemas/CadenceID'
                x-zs-$id: CadenceId
              draft_cadence:
                type: object
                additionalProperties: false
                description: Represents the draft version of the Cadence, if one exists.
                properties:
                  id:
                    $ref: '#/components/schemas/CadenceID'
                  name:
                    $ref: '#/components/schemas/CadenceName'
              parent_cadence:
                type: object
                additionalProperties: false
                description: >-
                  Represents the original Cadence from which this Cadence was
                  cloned.
                properties:
                  id:
                    $ref: '#/components/schemas/CadenceID'
                  name:
                    $ref: '#/components/schemas/CadenceName'
              custom_view:
                $ref: '#/components/schemas/CustomViewInfo'
              status:
                type: string
                maxLength: 255
                description: >-
                  Cadence lifecycle status. draft = not yet published; active =
                  published and enrolling records; inactive = published but
                  currently deactivated.
            required:
              - id
              - name
              - status
              - module
              - type
          maxItems: 1
    FollowUpSummary:
      type: object
      additionalProperties: false
      description: >-
        Represents a summary of follow-up action counts in a Cadence, broken
        down by action type.
      properties:
        whatsapp_follow_up_count:
          type: integer
          format: int32
          description: >-
            Represents the number of WhatsApp message follow-up actions in the
            Cadence.
        task_follow_up_count:
          type: integer
          format: int32
          description: Represents the number of task follow-up actions in the Cadence.
        call_follow_up_count:
          type: integer
          format: int32
          description: >-
            Represents the number of scheduled call follow-up actions in the
            Cadence.
        email_follow_up_count:
          type: integer
          format: int32
          description: >-
            Represents the number of email notification follow-up actions in the
            Cadence.
      title: Follow-Up Summary
    CadenceName:
      type: string
      maxLength: 100
      description: Represents the name of a Cadence.
    CadenceID:
      type: string
      maxLength: 255
      description: Represents the unique identifier of a Cadence.
    CreatedTime:
      type: string
      format: date-time
      description: >-
        Represents the creation date and time of the Cadence, in ISO 8601
        format.
    CadenceDescription:
      type: string
      maxLength: 500
      description: Represents the description text of a Cadence.
    CadenceEnrollmentType:
      type: string
      maxLength: 255
      description: >-
        Represents the enrollment type of a Cadence, indicating how records are
        enrolled.
      enum:
        - custom_view
        - manual_enrollment
    ModuleInformation:
      type: object
      additionalProperties: false
      description: Represents the API name and identifier of a CRM module.
      properties:
        api_name:
          type: string
          maxLength: 255
          description: Represents the API name of the CRM module.
          x-zs-$ref:
            resource: modules
            origins:
              - operationId: getModules
                propertyId: ModulesApiName
        id:
          type: string
          maxLength: 255
          description: Represents the unique identifier of the CRM module.
          x-zs-$ref:
            resource: modules
            origins:
              - operationId: getModules
                propertyId: ModulesId
              - operationId: createModules
                propertyId: ModuleDetailsId
          format: int64
      title: Module Information
    ModifierInfo:
      type:
        - object
        - 'null'
      additionalProperties: false
      description: >-
        Represents the identifier and name of the user who last modified the
        record.
      properties:
        name:
          type: string
          maxLength: 255
          description: Represents the full name of the user who last modified the record.
        id:
          type: string
          maxLength: 255
          description: >-
            Represents the unique identifier of the user who last modified the
            record.
      title: Modifier Information
    CustomViewInfo:
      type:
        - object
        - 'null'
      additionalProperties: false
      description: Represents the identifier and name of a Custom View.
      properties:
        name:
          type: string
          maxLength: 255
          description: Represents the name of the Custom View.
        id:
          type: string
          maxLength: 255
          description: Represents the unique identifier of the Custom View.
      title: Custom View Information
    CreatorInfo:
      type: object
      additionalProperties: false
      description: Represents the identifier and name of the user who created the record.
      properties:
        name:
          type: string
          maxLength: 255
          description: Represents the full name of the user who created the record.
        id:
          type: string
          maxLength: 255
          description: Represents the unique identifier of the user who created the record.
      title: Creator Information
    ExecuteEvery:
      type:
        - object
        - 'null'
      additionalProperties: false
      description: >-
        Represents the recurring execution interval for a Cadence, specifying
        the frequency period and numeric value.
      properties:
        period:
          type: string
          description: |-
            Represents the frequency interval for recurring Cadence execution.
            Possible values:
            immediately - Execute immediately after each enrollment trigger.
            hours - Execute at the specified number of hours interval.
            days - Execute at the specified number of days interval.
            weeks - Execute at the specified number of weeks interval.
          enum:
            - immediately
            - hours
            - days
            - weeks
        unit:
          type: integer
          format: int32
          minimum: 1
          maximum: 99
          description: >-
            Represents the numeric value of the execution interval, expressed in
            the specified period unit.
      required:
        - period
    ErrorResponseWithCadenceAsHead:
      type: object
      x-zs-$id: ErrorResponseWithCadenceAsHead
      description: >-
        Represents an error response where the Cadence object serves as the
        top-level container for field-level errors.
      properties:
        cadences:
          type: array
          description: >-
            Represents the list of Cadences, each containing field-level error
            details for the corresponding request entry.
          items:
            $ref: '#/components/schemas/AllErrorResponse'
          maxItems: 300
      additionalProperties: false
    AllErrorResponse:
      type: object
      x-zs-$id: AllErrorResponse
      description: >-
        Represents the error response returned when the API request fails due to
        validation errors or unsupported operations.
      required:
        - code
        - message
        - status
        - details
      properties:
        code:
          type: string
          description: >-
            Represents a machine-readable error code; branch on this value, not
            on message.
          x-zs-llm-description: >-
            Machine-readable error code. Integrators should branch on code, not
            message. EXPECTED_FIELD_MISSING - one of several alternatives must
            be supplied. MANDATORY_NOT_FOUND - a required field is absent.
            INVALID_DATA - field value or type is invalid.
            DEPENDENT_FIELD_MISSING - a field required by another field's value
            is absent. DEPENDENT_MISMATCH - dependent field's value conflicts
            with parent field. EXPECTED_DEPENDENT_FIELD_MISSING - one of several
            fields dependent on a parent is required.
            AMBIGUITY_DURING_PROCESSING - request carries mutually exclusive
            fields. ALREADY_USED - duplicate value in the same request.
            DUPLICATE_DATA - duplicate against existing data. LIMIT_EXCEEDED -
            array/value above allowed limit. NOT_ALLOWED / NOT_SUPPORTED -
            operation forbidden in the current state or edition. NO_PERMISSION -
            user lacks the required permission. ALREADY_ACTIVATED /
            ALREADY_DEACTIVATED - idempotency errors on activate/deactivate.
            INVALID_MODULE - module name invalid. REQUIRED_PARAM_MISSING /
            DEPENDENT_PARAM_MISSING - missing query parameter.
          enum:
            - EXPECTED_FIELD_MISSING
            - INVALID_DATA
            - MANDATORY_NOT_FOUND
            - DEPENDENT_MISMATCH
            - NOT_ALLOWED
            - NO_PERMISSION
            - ALREADY_ACTIVATED
            - ALREADY_DEACTIVATED
            - LIMIT_EXCEEDED
            - NOT_SUPPORTED
            - DEPENDENT_FIELD_MISSING
            - AMBIGUITY_DURING_PROCESSING
            - EXPECTED_DEPENDENT_FIELD_MISSING
            - ALREADY_USED
            - DUPLICATE_DATA
            - INVALID_MODULE
