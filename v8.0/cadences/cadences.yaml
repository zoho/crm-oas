  /settings/automation/cadences/{id}/actions/activate:
    parameters:
      - name: id
        in: path
        required: true
        description: Specify the unique identifier of the Cadence to activate.
        schema:
          type: string
          examples:
            - '111112000000092007'
          maxLength: 255
    post:
      summary: Activate Cadence
      description: >-
        Activates a published cadence so it begins enrolling records. The
        cadence must currently be inactive; otherwise, the ALREADY_ACTIVATED
        error is returned. Edition limits are enforced, including the maximum
        number of active cadences per module and the total number of active
        cadences. For custom_view cadences, activation subscribes to the email
        engagement triggers required for signal-based follow-ups.
      operationId: postActivate
      requestBody:
        description: >-
          The request body for this operation is optional and can be sent as an
          empty object.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutactivateRequest'
            examples:
              SamplePutRequest:
                summary: Sample activate request body
                value: {}
            x-zs-llm-examples:
              - SamplePutRequest
      responses:
        '200':
          description: Returns a success response confirming the Cadence was activated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse200'
              examples:
                Success200:
                  summary: Successful Cadence activation response
                  value:
                    cadences:
                      - code: SUCCESS
                        details:
                          id: '111112000000092007'
                        message: Cadences activated successfully
                        status: success
                  description: >-
                    Shows a successful activation of a Cadence, returning the
                    result code and identifier of the activated Cadence.
        '400':
          description: >-
            The request contains invalid data, or the Cadence cannot be
            activated due to its current state, edition restrictions, or limit
            violations.

            **Resolution:** The Cadence ID must be valid, the Cadence must be in
            a valid state for activation, and activation limits must not be
            exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllErrorResponse'
              examples:
                InvalidDataResponse1:
                  summary: Invalid Cadence ID error
                  value:
                    code: INVALID_DATA
                    details:
                      resource_path_index: 3
                    message: the given id seems to be invalid
                    status: error
                  description: >-
                    Shows an error response when the provided Cadence ID is
                    invalid.
                AlreadyActivatedResponse1:
                  summary: Cadence already activated error
                  value:
                    code: ALREADY_ACTIVATED
                    details:
                      resource_path_index: 3
                    message: The cadences is already activated
                    status: error
                  description: >-
                    Shows an error response when the Cadence is already in an
                    activated state.
                NotAllowedResponse1:
                  summary: Task action not supported error
                  value:
                    code: NOT_ALLOWED
                    details: {}
                    message: Task Action Not Supported in this Edition
                    status: error
                  description: >-
                    Shows an error response when the task action is not
                    supported in the current edition.
                NotAllowedResponse2:
                  summary: Custom view not available error
                  value:
                    code: NOT_ALLOWED
                    details: {}
                    message: Associated Custom View is not available
                    status: error
                  description: >-
                    Shows an error response when the associated Custom View is
                    not available.
                LimitExceededResponse1:
                  summary: Action count limit exceeded error
                  value:
                    code: LIMIT_EXCEEDED
                    details:
                      limit: 70
                    message: ' action Configured more than allowed limit'
