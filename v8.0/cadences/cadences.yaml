                      dependee:
                        param_name: follow_ups_executed_from
                      param_name: follow_ups_executed_till
                    message: Dependent Param missing
                    status: error
                  description: >-
                    Shows an error response when the required filters parameter
                    itself is missing.
                FiltersMandatorynotFound:
                  summary: Mandatory field not found in filters error
                  value:
                    code: MANDATORY_NOT_FOUND
                    details:
                      api_name: api_name
                      json_path: $.field.api_name
                      param_name: filters
                    message: required field not found
                    status: error
                  description: >-
                    Shows an error response when a mandatory field in the
                    filters parameter is not found.
                FiltersComparatorMissing:
                  summary: Missing comparator in filters error
                  value:
                    code: DEPENDENT_FIELD_MISSING
                    details:
                      dependee:
                        api_name: field
                        json_path: $.field
                      api_name: comparator
                      json_path: $.comparator
                      param_name: filters
                    message: dependent field is missing
                    status: error
                  description: >-
                    Shows an error response when the required comparator field
