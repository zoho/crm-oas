    AutomationModuleRef:
      x-zs-$id: AutomationModuleRef
      type: object
      additionalProperties: false
      minProperties: 1
      description: >-
        PURPOSE: Module reference used across non-associate actions. At least
        one of api_name or id required (EXPECTED_FIELD_MISSING if neither). If
        both given, must match (AMBIGUITY_DURING_PROCESSING). GET
        /settings/modules to discover. Always use full 19-digit module ID.
      x-zs-llm-description: >-
        Module reference for action targeting. At least one of api_name or id
        required  EXPECTED_FIELD_MISSING if neither is present. If both provided
        and they refer to different modules  AMBIGUITY_DURING_PROCESSING. Obtain
        from getModules. Used in most non-associate action details to specify
        where the action operates.
      properties:
        api_name:
          type: string
          description: API name of the module (e.g., Leads, Contacts, Deals, Vendors).
          maxLength: 255
          example: Leads
        id:
          type: string
          description: >-
            Unique module ID (19-digit format). Always use the full ID as
            returned by GET /settings/modules - truncated or shortened IDs
            return INVALID_DATA ('the tabId given seems to be invalid').
            Optional in requests if api_name is provided; always present in
            responses.
          maxLength: 20
          example: '1189654000000000037'
      title: Automation Module Reference
    AutomationLayoutRef:
      x-zs-$id: AutomationLayoutRef
      type: object
      additionalProperties: false
      description: >-
        PURPOSE: Layout reference for create_record, add_meeting, schedule_call
        actions. MANDATORY: id (string). Determines field availability and
        validation rules. GET /settings/layouts?module={api_name} to discover.
      x-zs-llm-description: >-
        Layout reference for create_record, add_meeting, schedule_call. id is
        mandatory  determines which fields are available and required for the
        target module. Obtain from getLayouts?module={api_name}. Wrong layout
        returns INVALID_DATA.
      properties:
        id:
          type: string
          description: >-
            Unique layout ID. Required. Obtain from GET
            /settings/layouts?module={module_api_name}.
          maxLength: 20
          example: '111111000000000167'
        name:
          type:
            - string
            - 'null'
          description: >-
            Display name of the layout. Optional in requests; present in GET
            responses.
          maxLength: 50
          example: Standard
        display_label:
          type: string
          description: Human-readable label of the layout. Present in GET responses.
          maxLength: 50
          example: Standard
      required:
        - id
      title: Automation Layout Reference
    AutomationFieldAttributes:
      x-zs-$id: AutomationFieldAttributes
      type: object
      additionalProperties: false
      description: >-
        Identifies the target CRM field to which a mapping value is applied
        within an automation rule. The api_name and ID properties must both be
        supplied and must refer to the same field; a mismatch between the two
        causes an AMBIGUITY_DURING_PROCESSING error. Available fields for a
        given module can be discovered via GET
        /settings/fields?module={api_name}.
      x-zs-llm-description: >-
        Target field identifier. Both api_name and id are mandatory  providing
        only one still works but both should be given for reliability. If both
        provided and they refer to different fields:
        AMBIGUITY_DURING_PROCESSING. Obtain from
        getFields?module={module_api_name}. The field must be writable and
        compatible with mapping type.
      properties:
        api_name:
          type: string
          description: >-
            Represents the API name of the target field in the destination
            module — for example, Subject, Due_Date, or Owner — used to identify
            the field receiving the mapped value within automation actions such
            as workflow tasks, create_record, and convert.
          maxLength: 255
          example: Subject
        id:
          type: string
          description: >-
            Represents the numeric identifier of the target CRM field. Used in
            conjunction with the field's API name, both of which must resolve to
            the same field for a mapping to be valid.
          maxLength: 255
          example: '111111000000003529'
      required:
        - api_name
        - id
      title: Automation Field Attributes
    StaticStringValue:
      x-zs-$id: StaticStringValue
      type: string
      description: >-
        Represents a plain string value used as the static value for text,
        picklist, phone, email, URL, number, decimal, currency, and percentage
        fields. Numeric values are expressed as strings rather than numeric
        literals. Picklist values must exactly match one of the options defined
        for the field.
      x-zs-llm-description: >-
        String value for type=static mappings. Applies to: text, picklist,
        phone, email, URL, number, decimal, currency, percentage fields. Numbers
        must be sent as strings (e.g., '100' not 100). Picklist values must
        match available options  invalid values return INVALID_DATA.
      maxLength: 1000
      example: High
    StaticArrayValue:
      x-zs-$id: StaticArrayValue
      type: array
      description: >-
        Represents an array of string values used as the static value for
        multiselectpicklist fields, where each element corresponds to an
        available picklist option. Valid option labels are retrievable from the
        GET /settings/fields endpoint filtered by data_type=multiselectpicklist.
      x-zs-llm-description: >-
        Array value for type=static on multiselect_picklist fields. Each element
        must match an available picklist option. Discover valid options from
        getFields for the target module. Invalid options return INVALID_DATA.
      items:
        type: string
        description: >-
          A single picklist option string to include in the multi-select field
          value. Each entry corresponds to one selectable option as defined for
          the target field in Zoho CRM.
        maxLength: 255
        example: Option1
      minItems: 1
      maxItems: 50
    StaticObjectValue:
      x-zs-$id: StaticObjectValue
      type: object
      additionalProperties: true
      description: >-
        Represents an object value used as the static value for ownerlookup and
        layout fields, containing an ID that identifies the target user or
        layout and an optional name that the server resolves from the ID when
        not supplied. Typically used to assign record ownership by providing the
        user ID.
      x-zs-llm-description: >-
        Object value for type=static on ownerlookup and layout fields. id is
        mandatory (user ID or layout ID). name is optional server resolves from
        id. Use getUsers for owner IDs, getLayouts for layout IDs.
      properties:
        id:
          type: string
          description: >-
            The system identifier of the referenced entity, such as a user or
            layout record. This value drives entity resolution by the automation
            engine and must be provided when the target field references an
            entity.
          maxLength: 255
          example: '111113000000059916'
        name:
          type: string
          description: >-
            The display name of the referenced entity, such as a user full name
            or a layout label. When omitted from a request payload, the server
            resolves and populates this property from the supplied ID. The
            property is present in all GET responses.
          maxLength: 255
          example: John Doe
      required:
        - id
      title: Static Object Value
    StaticFieldMapping:
      x-zs-$id: StaticFieldMapping
      type: object
      additionalProperties: false
      description: >-
        Represents a static-type mapping that assigns a literal value directly
        to the target field at execution time. The value shape varies by field
        data type: a plain string for text, picklist, phone, email, URL, number,
        decimal, currency, and percentage fields (numeric values expressed as
        strings); an array of strings for multiselectpicklist fields; and an
        object containing ID and name for ownerlookup fields. Date, datetime,
        and ALARM fields do not support this type — use execution_time instead,
        as static on those fields produces a DEPENDENT_MISMATCH error. Fields
        marked unique in the module settings also require merge_field rather
        than static for create_record actions.
      x-zs-llm-description: >-
        type='static' mapping. Value is used as-is without runtime resolution.
        NOT for Date/DateTime/ALARM fields (use execution_time  static returns
        DEPENDENT_MISMATCH). NOT for unique fields or formula fields. Value
        structure depends on field data_type: string for most fields, array for
        multiselect_picklist, object for ownerlookup/layout.
      properties:
        display_value:
          type: string
          description: >-
            The server-computed representation of the mapped value, included in
            GET responses. Omitted from create and update requests.
          maxLength: 500
        field:
          $ref: '#/components/schemas/AutomationFieldAttributes'
          description: >-
            Target field to populate when the automation executes. api_name is
            required. If id is also provided, both must refer to the same field;
            otherwise the API returns AMBIGUITY_DURING_PROCESSING.
        type:
          type: string
          const: static
          description: >-
            Identifies the mapping strategy for this field assignment. The value
            must be `static`, which instructs the automation engine to assign a
            fixed, literal value to the target field at execution time rather
            than resolving it dynamically.
        value:
          description: >-
            The literal value assigned to the target field at automation
            execution time. The expected shape is determined by the target field
            data_type, discoverable via GET /settings/fields?module={module}.
            For most field types, supply a string (for example, "High", "Not
            Started", "1234"). For multi-select picklist fields (data_type:
            multiselectpicklist), supply an array of option strings. For fields
            that reference an entity such as an owner or layout (data_type:
            ownerlookup), supply an object with at minimum the entity ID.
          oneOf:
            - $ref: '#/components/schemas/StaticStringValue'
            - $ref: '#/components/schemas/StaticArrayValue'
            - $ref: '#/components/schemas/StaticObjectValue'
      required:
        - field
        - type
        - value
      title: Static Field Mapping
    MergeFieldStringValue:
      x-zs-$id: MergeFieldStringValue
      type: string
      description: >-
        Represents the string value carried by a merge_field mapping, containing
        one or more runtime-resolved token references. Supports direct field
        tokens (${!Module.Field}), lookup traversal tokens
        (${!Module.Lookup.Field}), and system tokens (${CURRENTTIME},
        ${CURRENTUSER}). Tokens may be combined with surrounding text for
        multi-line field targets. Fields that hold a single typed value such as
        email or URL accept exactly one token.
      x-zs-llm-description: >-
        String containing merge-field tokens for type=merge_field mappings.
        Resolved at runtime. Formats: ${!Module.Field} (direct access),
        ${!Module.Lookup.Field} (traverse lookup). Multiple tokens can be
        combined in one string. Unsupported tokens return
        UNSUPPORTED_MERGE_FIELD error.
      maxLength: 1000
      example: ${!Leads.First_Name}
    MergeFieldMapping:
      x-zs-$id: MergeFieldMapping
      type: object
      additionalProperties: false
      description: >-
        Represents a merge_field-type mapping whose value is resolved at
        execution time by substituting token references with live field data.
        Supports direct field tokens (${!Module.Field}), traversal tokens
        (${!Module.Lookup.Field}), and system tokens (${CURRENTTIME},
        ${CURRENTUSER}). Applies to text-based fields such as Subject,
        Description, and custom text fields. Targeting owner or lookup fields
        with this type produces a DEPENDENT_MISMATCH error; those fields require
        a static mapping using an object with a numeric identifier and an
        optional name. Multiple tokens may be chained with surrounding text for
        multi-line fields, while single-value fields such as email or URL accept
        exactly one token.
      x-zs-llm-description: >-
        type='merge_field' mapping. Value contains ${!Module.Field} tokens
        resolved at execution time. ONLY for text-based fields (Subject,
        Description, etc.)  using on date/number/picklist fields returns
        DEPENDENT_MISMATCH. Supports lookup traversal: ${!Module.Lookup.Field}.
        Multi-module not supported.
      properties:
        display_value:
          type: string
          description: >-
            The server-computed representation of the mapped value, included in
            GET responses. Omitted from create and update requests.
          maxLength: 500
        field:
          $ref: '#/components/schemas/AutomationFieldAttributes'
          description: >-
            Target field to populate when the automation executes. api_name is
            required. If id is also provided, both must refer to the same field;
            otherwise the API returns AMBIGUITY_DURING_PROCESSING.
        type:
          type: string
          const: merge_field
          description: >-
            Identifies the mapping strategy for this field assignment. The value
            must be `merge_field`, which instructs the automation engine to
            resolve the field value dynamically from a merge field token at
            execution time rather than from a static literal.
        value:
          $ref: '#/components/schemas/MergeFieldStringValue'
          description: >-
            A string containing one or more ${!...} merge-field tokens resolved
            at runtime.
        allow_agent_user:
          type: boolean
          description: >-
            Controls whether agent users are eligible for record assignment.
            Possible values:

            **true** — agent users are included in the assignment pool alongside
            standard users.

            **false** — agent users are excluded from assignment.

            Applies to mapping types role, group, profile, merge_field, and
            criteria. Does not apply to user or assignment_rule types.
          default: false
      required:
        - field
        - type
        - value
      title: Merge Field Mapping
    ExecutionTimeValue:
      x-zs-$id: ExecutionTimeValue
      type: object
      additionalProperties: false
      description: >-
        Represents the offset configuration used by an execution_time mapping to
        compute a final date, datetime, or ALARM value at runtime. Contains
        period (the time unit granularity), unit (the numeric magnitude
        expressed as a string integer), and trigger_field (a merge token or
        ${CURRENTTIME}). Date fields use period, unit, and trigger_field with an
        implied positive direction. Datetime fields additionally accept sign to
        control direction. ALARM fields additionally accept time and
        notify_type, and always require a minus sign. Workflow task actions
        restrict period to days or business_days.
      x-zs-llm-description: >-
        Offset computation object for date/datetime/ALARM fields. Required
        fields: period ('days'|'hours'|'minutes'), unit (string integer 
        quantity), trigger_field (merge-field token like ${!Leads.Created_Time}
        or ${CURRENTTIME}). Optional: sign ('positive' for after, 'negative' for
        before  default varies by context). Missing required fields return
        DEPENDENT_FIELD_MISSING.
      properties:
        period:
          type: string
          description: >-
            The calendar or time unit applied to the offset. Possible values:

            **days** — counts all calendar days including weekends and holidays;
            supported by every action type.

            **business_days** — excludes weekends and requires the
            organisation's business-day setting to be enabled; supported by all
            action types.

            **hours** — available only for create_record, add_meeting, and
            schedule_call.

            **minutes** — available only for create_record, add_meeting, and
            schedule_call.

            workflow_tasks accept only **days** or **business_days**.
          enum:
            - days
            - business_days
            - hours
            - minutes
        unit:
          type: string
          description: >-
            The number of period units to offset from the trigger date, supplied
            as a non-negative integer string (for example, "1", "30"). Passing
            "0" produces a same-day result, such as scheduling a Remind_At on
            the same day as the due date.
          pattern: ^[0-9]+$
          maxLength: 20
          example: '1'
        sign:
          type: string
          description: >-
            The direction of the offset relative to the trigger date. Possible
            values:

            **plus** — places the computed value after the trigger (for example,
            a due date two days after record creation).

            **minus** — places the computed value before the trigger (for
            example, a reminder one day before the due date).

            For datetime fields (data_type=datetime) a value is expected;
            omitting it returns a DEPENDENT_FIELD_MISSING error. For date-only
            fields (data_type=date) the value defaults to **plus** when absent.
            When targeting Remind_At (data_type=ALARM), **minus** is the only
            applicable direction.
          enum:
            - plus
            - minus
          default: plus
        trigger_field:
          type: string
          description: >-
            The reference date or datetime field from which the offset is
            measured. Accepts a merge-field token that resolves to a Date or
            DateTime field on the parent module (for example,
            "${!Leads.Modified_Time}", "${!Tasks.Due_Date}"), or the reserved
            constant "${CURRENTTIME}" to use the automation execution timestamp.
            When computing a Remind_At (ALARM) value, "${!Tasks.Due_Date}" is
            the typical anchor.
          maxLength: 255
          example: ${CURRENTTIME}
        time:
          type: string
          description: >-
            The time-of-day component of the computed value, expressed in
            24-hour HH:mm format (for example, "13:00", "01:30"). Applies when
            the target field carries data type datetime or ALARM (as reported by
            GET /settings/fields). Supplying this property for a date-only field
            (data_type=date) produces a validation error.
          maxLength: 20
          example: '13:00'
        notify_type:
          type: string
          description: >-
            The notification channel used to deliver the reminder. Applies
            exclusively when the target field carries data type ALARM (i.e.,
            Remind_At); date and datetime fields do not use this property.
            Possible values:

            **popup** — triggers an in-app notification.

            **email** — sends a message to the task owner.

            **emailandpopup** — delivers both simultaneously.
          enum:
            - popup
            - email
            - emailandpopup
      required:
        - period
        - unit
        - trigger_field
      title: Execution Time Value
    ExecutionTimeFieldMapping:
      x-zs-$id: ExecutionTimeFieldMapping
      type: object
      additionalProperties: false
      description: >-
        Represents an execution_time-type field mapping that computes a date,
        datetime, or ALARM value at runtime by applying a signed offset to a
        trigger field or the current time. The value carries an
        ExecutionTimeValue object specifying the period, unit, trigger_field,
        and optional time or notify_type properties. A plus sign places the
        result after the trigger; a minus sign places it before. ALARM fields
        always require minus. Workflow task actions support only days and
        business_days as period values.
      x-zs-llm-description: >-
        type='execution_time' mapping. REQUIRED for Date, DateTime, and ALARM
        field types (static/merge_field on these returns DEPENDENT_MISMATCH).
        Computes value as offset from trigger_field. Value object needs: period
        ('days'|'hours'|'minutes'), unit (integer as string), trigger_field
        (merge token or ${CURRENTTIME}), sign (for before/after offset).
      properties:
        display_value:
          type: string
          description: >-
            The server-computed representation of the mapped value, included in
            GET responses. Omitted from create and update requests.
          maxLength: 500
        field:
          $ref: '#/components/schemas/AutomationFieldAttributes'
          description: >-
            Target field to populate when the automation executes. api_name is
            required. If id is also provided, both must refer to the same field;
            otherwise the API returns AMBIGUITY_DURING_PROCESSING.
        type:
          type: string
          const: execution_time
          description: >-
            Identifies the mapping variant as an execution-time offset. The
            value is always "execution_time" for this schema and acts as the
            polymorphic discriminator across the AutomationFieldMappings union.
        value:
          $ref: '#/components/schemas/ExecutionTimeValue'
          description: >-
            Execution-time object specifying how to compute the date/datetime
            offset from a reference field.
      required:
        - field
        - type
        - value
      title: Execution Time Field Mapping
    CompositeFieldMapping:
      x-zs-$id: CompositeFieldMapping
      type: object
      additionalProperties: false
      description: >-
        Represents a composite-type field mapping used exclusively for the
        Participants field in the Events module via the add_meeting action. The
        value carries a structured object that encodes participant data and is
        not applicable to any other field or automation action type.
      x-zs-llm-description: >-
        type='composite' mapping. Used ONLY for the Participants field in Events
        module (add_meeting action). Value is a structured object representing
        multiple participant entries. Cannot be used on other field types 
        returns NOT_ALLOWED.
      properties:
        display_value:
          type: string
          description: >-
            The server-computed representation of the mapped value, included in
            GET responses. Omitted from create and update requests.
          maxLength: 500
        field:
          $ref: '#/components/schemas/AutomationFieldAttributes'
          description: >-
            Target field to populate when the automation executes. api_name is
            required. If id is also provided, both must refer to the same field;
            otherwise the API returns AMBIGUITY_DURING_PROCESSING.
        type:
          type: string
          const: composite
          description: >-
            Serves as the polymorphic discriminator that identifies this field
            mapping as a composite mapping; the value must be set to "composite"
            to select this schema variant.
        value:
          type: object
          description: >-
            Holds the structured composite object that encodes participant data
            for the Events module Participants field; the shape of this object
            varies according to the participant type configuration defined for
            the automation rule.
          additionalProperties: true
      required:
        - field
        - type
        - value
      title: Composite Field Mapping
    AutomationFieldMappings:
      x-zs-$id: AutomationFieldMappings
      description: >-
        Represents a single field-to-value mapping used within automation
        actions such as workflow tasks, create_record, add_meeting, and
        schedule_call. Each mapping identifies a target field via api_name or
        ID, declares a type discriminator that determines value interpretation,
        and supplies a value whose shape varies by type: static supplies a
        literal value, merge_field supplies a runtime-resolved token string,
        execution_time supplies a date or datetime offset object, and composite
        supplies structured participant data for the Events Participants field.
        The field_mappings array must include all fields the target module
        requires; omitting any produces a REQUIRED_DATA_NOT_FOUND error.
      x-zs-llm-description: >-
        A single field-to-value mapping entry used in create_record,
        add_meeting, schedule_call, convert, and workflow task actions. Each
        entry targets one field and assigns a typed value. The type field
        discriminates the value structure: static (literal), merge_field
        (runtime token), execution_time (date offset), composite (multi-value).
        field identifies the target, type selects the value schema, value
        provides the data.
      oneOf:
        - $ref: '#/components/schemas/StaticFieldMapping'
        - $ref: '#/components/schemas/MergeFieldMapping'
        - $ref: '#/components/schemas/ExecutionTimeFieldMapping'
        - $ref: '#/components/schemas/CompositeFieldMapping'
      discriminator:
        propertyName: type
        mapping:
          static: '#/components/schemas/StaticFieldMapping'
          merge_field: '#/components/schemas/MergeFieldMapping'
          execution_time: '#/components/schemas/ExecutionTimeFieldMapping'
          composite: '#/components/schemas/CompositeFieldMapping'
      title: Automation Field Mappings
    AutomationScheduleCallDetails:
      x-zs-$id: AutomationScheduleCallDetails
      type: object
      additionalProperties: false
      description: >-
        PURPOSE: Details object for schedule_call action. Creates a Call record
        when workflow fires. PREREQUISITES: GET /settings/layouts?module=Calls
        for layout + mandatory fields. GET /settings/fields?module=Calls for
        field ids. MANDATORY: module ({api_name: 'Calls', id}), layout ({id}),
        field_mappings (array 1-25, include Subject, Call_Type). OPTIONAL:
        apply_restriction (bool). KEY FIELDS: Subject, Call_Type
        ('Outbound'|'Inbound'|'Missed'), Call_Purpose, Call_Start_Time,
        Remind_At.
      x-zs-llm-description: >-
        Details for type='schedule_call'. Creates a Calls record. Requires
        module (Calls), layout, field_mappings (must include Subject). Key
        fields: Subject, Call_Purpose, Call_Type, Call_Start_Time, Remind_At.
        Same field_mapping structure as create_record. Optional:
        apply_restriction.
      properties:
        module:
          $ref: '#/components/schemas/AutomationModuleRef'
          description: >-
            Target module for the call. Must be the Calls module. Provide either
            api_name ("Calls") or the Calls module id.
        layout:
          $ref: '#/components/schemas/AutomationLayoutRef'
          description: >-
            Layout to use when creating the Call record. Determines which fields
            are available and their validation rules. Fetch valid layouts from
            GET /settings/layouts?module=Calls. The layout.id is required.
        field_mappings:
          type: array
          description: >-
            Field mappings for the new Call. Each entry: {"field": {"api_name":
            "Subject"}, "type": "static", "value": "Follow-up"}. Must include
            all mandatory fields from GET /settings/layouts?module=Calls.
            Call_Type is system-mandatory (values: "Outbound", "Inbound",
            "Missed") - omitting returns REQUIRED_DATA_NOT_FOUND. Common fields:
            Subject, Call_Type, Call_Purpose, Call_Start_Time, Remind_At.
            Mapping types: static - literal values for text, picklist fields;
            NOT for DateTime/ALARM (DEPENDENT_MISMATCH). merge_field - runtime
            tokens like ${!Leads.Phone} for text-based fields; NOT for
            lookup/owner (DEPENDENT_MISMATCH). execution_time - REQUIRED for
            Call_Start_Time and Remind_At; sign required for datetime; periods:
            days, business_days, hours, minutes.
          items:
            $ref: '#/components/schemas/AutomationFieldMappings'
            description: >-
              Represents a single field-to-value mapping entry for the new Call
              record, conforming to the AutomationFieldMappings schema. Each
              entry identifies a target Call field and specifies the value
              resolution strategy: static for literal values, merge_field for
              runtime token substitution, or execution_time for dynamically
              resolved DateTime and ALARM fields.
          minItems: 1
          maxItems: 25
        apply_restriction:
          type:
            - boolean
            - 'null'
          description: >-
            Whether to enforce assignment-threshold rules (record count limits
            per user) on the record owner when creating the Call record. When
            true, the system checks whether the owner has reached their record
            limit before creating the record. Only effective when the org has
            assignment thresholds configured.
          default: false
        id:
          type: string
          description: >-
            Server-generated unique identifier for this schedule call action.
            Present only in GET responses; not required in POST requests.
          maxLength: 20
          example: '111111000000002421'
      required:
        - module
        - layout
        - field_mappings
      title: Automation Schedule Call Details
  parameters:
    ParamQueryIds:
      name: ids
      in: query
      description: >-
        Specify the unique identifiers of the Cadences to retrieve. Enter a
        comma-separated list of Cadence IDs.
      required: false
      schema:
        type: string
        description: Comma-separated cadence ids
        maxLength: 2000
        example: 111112000000092007,111112000000092270,111112000000094004
    ParamQueryPage:
      name: page
      in: query
      description: Specify the page number for paginated results.
      required: false
      schema:
        type: integer
        format: int32
    ParamQueryPerPage:
      name: per_page
      in: query
      description: Specify the number of Cadence records to retrieve per page.
      required: false
      schema:
        type: integer
        format: int32
  securitySchemes:
    OAuth2:
      type: oauth2
      description: OAuth2 authentication for API access
      flows:
        authorizationCode:
          authorizationUrl: https://accounts.zoho.com/oauth/v2/auth
          tokenUrl: https://accounts.zoho.com/oauth/v2/token
          refreshUrl: https://accounts.zoho.com/oauth/v2/token
          scopes:
            ZohoCRM.settings.cadences.ALL: >-
              Grants full read and write access to Cadence configuration,
              including the ability to create, retrieve, update, and delete
              Cadences.
            ZohoCRM.settings.cadences.READ: >-
              Grants permission to retrieve the list of Cadences, retrieve
              Cadence details, retrieve analytics data, and retrieve record
              counts and action counts.
            ZohoCRM.settings.cadences.CREATE: >-
              Grants permission to create, clone, activate, deactivate, and
              publish Cadences.
            ZohoCRM.settings.cadences.UPDATE: Grants permission to update existing Cadences.
            ZohoCRM.settings.cadences.DELETE: Grants permission to delete Cadences.
