                                      overdue_calls_count:
                                        type: integer
                                        format: int32
                                        description: >-
                                          Represents the total number of calls
                                          that are overdue.
                                      missed_calls_count:
                                        type: integer
                                        format: int32
                                        description: >-
                                          Represents the total number of missed
                                          calls.
                                  - x-zs-$id: EmailAnalytics
                                    type: object
                                    additionalProperties: false
                                    description: >-
                                      The analytics metrics related to an email
                                      notification-type follow-up action.
                                    properties:
                                      email_count:
                                        type: integer
                                        format: int32
                                        description: >-
                                          Represents the total number of emails
                                          sent by the follow-up action.
                                      bounced_email_count:
                                        type: integer
                                        format: int32
                                        description: >-
                                          Represents the number of emails that
                                          bounced.
                                      clicked_email_count:
                                        type: integer
                                        format: int32
                                        description: >-
                                          Represents the number of emails where at
                                          least one link was clicked.
                                      replied_email_count:
                                        type: integer
                                        format: int32
                                        description: >-
                                          Represents the number of emails that
                                          received a reply.
                                      sent_email_count:
                                        type: integer
                                        format: int32
                                        description: >-
                                          Represents the number of emails that
