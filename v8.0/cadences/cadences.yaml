    CadencesCreateRequestBody:
      type: object
      additionalProperties: false
      description: >-
        Represents the request body schema for creating a new Cadence with
        follow-up steps and action configurations.
      properties:
        cadences:
          type: array
          description: Represents the list of Cadences to create.
          items:
            type: object
            additionalProperties: false
            description: >-
              Represents the configuration for the new Cadence, including its
              follow-up steps, execution details, and enrollment settings.
            properties:
              module:
                $ref: '#/components/schemas/ModuleInformation'
              id:
                type: string
                description: Represents the unique identifier of the Cadence.
                maxLength: 255
              name:
                type: string
                description: Represents the name of the Cadence.
                maxLength: 100
              description:
                type: string
                description: Represents the description of the Cadence.
                maxLength: 500
              type:
                type: string
                description: >-
                  Represents the enrollment type of the Cadence.

                  Possible values:

                  custom_view - Automatically enrolls records matching a Custom
                  View.

                  manual_enrollment - Allows manual enrollment of records into
                  the Cadence.
                enum:
                  - custom_view
                  - manual_enrollment
              custom_view:
                type: object
                additionalProperties: false
                description: >-
                  Represents the Custom View used for automatic record
                  enrollment in the Cadence.
                properties:
                  id:
                    type: string
                    description: Represents the unique identifier of the Custom View.
                    maxLength: 255
                    x-zs-$ref:
                      resource: custom_views
                      origins:
                        - operationId: getCustomViews
                          propertyId: CustomViewId
                        - operationId: createCustomView
                          propertyId: CustomViewResultId
                    format: int64
                required:
                  - id
              execution_details:
                type: object
                additionalProperties: false
                description: >-
                  Represents the execution frequency and unenrollment
                  configuration for the Cadence.
                properties:
                  execute_every:
                    $ref: '#/components/schemas/ExecuteEvery'
                  unenroll_properties:
                    type: array
                    description: >-
                      Represents the conditions under which records are
                      automatically unenrolled from the Cadence.
                    items:
                      $ref: '#/components/schemas/UnenrollPropertiesNested'
                    maxItems: 200
              follow_ups:
                type: array
                description: >-
                  Represents the list of follow-up steps configured for the
                  Cadence.
                items:
                  type: object
                  additionalProperties: false
                  description: >-
                    Represents a single follow-up step in the Cadence, including
                    its action and trigger configuration.
                  properties:
                    execute_after:
                      $ref: '#/components/schemas/ExecuteAfterNested'
                    parent_follow_up:
                      type: object
                      additionalProperties: false
                      description: >-
                        Represents the parent follow-up step that this step
                        branches from.
                      properties:
                        reference_id:
                          type: string
                          description: >-
                            Represents the reference identifier of the parent
                            follow-up step.
                          maxLength: 255
                    reference_id:
                      type: string
                      description: >-
                        Represents the unique reference identifier for the
                        follow-up step within the Cadence.
                      maxLength: 255
                    action:
                      $ref: '#/components/schemas/ActionNested'
                      description: Cadence followup action (Required)
                    triggers:
                      type: array
                      description: >-
                        Represents the list of trigger conditions that determine
                        when this follow-up step executes.
                      items:
                        type: string
                        description: >-
                          Represents a single trigger condition for the
                          follow-up step.
                        maxLength: 255
                      maxItems: 500
                  required:
                    - action
                maxItems: 100
            required:
              - module
              - name
              - type
          maxItems: 1
      required:
        - cadences
    ActionNested:
      description: >-
        Represents a follow-up action in a Cadence, including its type,
        identifier, and configuration details.
      oneOf:
        - $ref: '#/components/schemas/TaskTypeFollowupActionRequestObject'
