openapi: 3.1.0
info:
  title: Cadences
  description: >-
    Configuration APIs for Zoho CRM Cadences (automated follow-up sequences) -
    v8. Manage cadence lifecycle (create, update, delete, activate, deactivate,
    publish, clone), view analytics, and count associated records.

    A cadence is a module-scoped automation running follow-up actions (Task,
    Email, Call, WhatsApp) on enrolled records. Enrollment modes: custom_view
    (auto-enroll by criteria) or manual_enrollment (explicit via API). Cadences
    follow a draft → published lifecycle.

    Edition limits (per org): Standard 20/10/60/18 · Professional 40/20/120/40 ·
    Enterprise 60/30/150/70 · Ultimate 70/50/300/90 (cadences/module ·
    active/module · total active · follow-ups). Exceeding any limit returns
    LIMIT_EXCEEDED.

    v8 uses flat query params (module, name, active, fields) and flat
    cadences_ids[] for enroll/unenroll. v9 adds rid (UUID), status enum
    (active/inactive/draft), array-typed unenroll_properties, and re-enrollment
    support.
  x-zs-llm-description: >-
    Configuration APIs for Zoho CRM Cadences (automated follow-up sequences) -
    v8. Manage cadence lifecycle (create, update, delete, activate, deactivate,
    publish, clone), inspect per-cadence analytics, and count records currently
    associated with each cadence.


    A cadence is a module-scoped automation that drives a sequence of follow-up
    actions (Task, Email, Call, WhatsApp) against enrolled records. Two
    enrollment modes are supported: custom_view (records automatically enroll
    when they match a custom view's criteria) and manual_enrollment (callers
    enroll records explicitly via the separate enrol_in_cadences API). Cadences
    go through a draft -> published lifecycle: edits to a published cadence
    create a draft, which must be re-published to propagate changes.


    Edition-based limits (per org):

    - Standard:    20 cadences/module, 10 active/module, 60 total active, 18
    follow-ups/cadence

    - Professional: 40 cadences/module, 20 active/module, 120 total active, 40
    follow-ups/cadence

    - Enterprise / ZohoOne Enterprise: 60 cadences/module, 30 active/module, 150
    total active, 70 follow-ups/cadence

    - Ultimate / CRM Plus: 70 cadences/module, 50 active/module, 300 total
    active, 90 follow-ups/cadence

    Requests that exceed these limits return LIMIT_EXCEEDED with details.limit
    set to the applicable cap.


    Note: v8 uses flat query parameters (module / name / active / fields) on GET
    /cadences; v9 introduces a consolidated filters JSON parameter. v8 enroll /
    unenroll APIs use a flat cadences_ids[] array (see the Cadence Execution v8
    spec). v9 adds rid (UUID) fields, a status enum (active / inactive / draft)
    replacing the v8 active/published pair, an array-typed unenroll_properties
    with four rule types, and re-enrollment support.
  version: '8'
servers:
  - url: https://zohoapis.{dc}/crm/{version}
    description: >-
      The Zoho CRM API server. Replace {dc} with your data center domain and
      {version} with the target API version.
    variables:
      dc:
        description: Specify the data center domain for your Zoho CRM account.
        default: com
        enum:
          - eu
          - com
          - au
          - in
          - jp
          - cn
          - ca
      version:
        description: Specify the API version to use.
        default: v8
paths:
  /settings/automation/cadences:
    get:
      operationId: getCadences
      summary: List Cadences
      description: To retrieve the list of Cadences in your Zoho CRM organization.
      parameters:
        - name: module
          in: query
          required: false
          description: >-
            Specify the API name of the CRM module to filter Cadences.

            Refer to the [Get
            Modules](modules.yaml#$.paths./settings/modules.get) resource for
            valid values.
          schema:
            type: string
            maxLength: 255
        - name: name
          in: query
          description: >-
            Specify the name of the Cadence to filter the results. Supported
            comparators: `equal`, `not_equal`, `contains`, `not_contains`,
            `starts_with`, `ends_with`. The filter value must be URL-encoded
            before being sent in the query parameter. Non-encoded example:
            ```json { "field": { "api_name": "name" }, "comparator": "contains",
            "value": "qwerty" }
          schema:
            type: string
            maxLength: 100
        - name: active
          in: query
          description: >-
            Specify whether to filter Cadences by their active status.

            Possible values: **true** - Retrieve only active Cadences. **false**
            - Retrieve only inactive Cadences.
          schema:
            type: boolean
        - name: fields
          in: query
          description: >-
            Specify the field to include in the Cadence response.

            Possible values: **name** - Include only the name field in the
            response.
          schema:
            type: string
            enum:
              - name
        - $ref: '#/components/parameters/ParamQueryPage'
        - $ref: '#/components/parameters/ParamQueryPerPage'
      responses:
        '200':
          description: Returns the list of Cadences matching the specified filters.
          content:
            application/json:
              schema:
                type: object
                x-zs-$id: GetAllCadencesResponse
                description: >-
                  Represents the successful response for the Cadence list
                  request.
                properties:
                  cadences:
                    type: array
                    description: Represents the list of Cadences retrieved from Zoho CRM.
                    items:
                      type: object
                      description: >-
                        Each object represents a Cadence configured in Zoho CRM,
                        including its schedule, execution details, and status.
                      properties:
                        summary:
                          $ref: '#/components/schemas/FollowUpSummary'
                        description:
                          $ref: '#/components/schemas/CadenceDescription'
                        created_time:
                          $ref: '#/components/schemas/CreatedTime'
                        module:
                          $ref: '#/components/schemas/ModuleInformation'
                        active:
                          type: boolean
                          description: >-
                            Represents whether the Cadence is currently active.
                            Possible values: **true**, **false**.
                        execution_details:
                          type:
                            - object
                            - 'null'
                          description: >-
                            Represents the execution configuration for the
                            Cadence, including the schedule type, end date, and
                            unenrollment settings.
                          properties:
                            unenroll_properties:
                              type: object
                              description: >-
                                Represents the automatic unenrollment
                                configuration applied when records are removed
                                from the Cadence.
                              properties:
                                end_date:
                                  type: string
                                  description: >-
                                    Represents the date on which the automatic
                                    unenrollment of records from the Cadence
                                    takes effect.
                                  maxLength: 50
                                type:
                                  type:
                                    - string
                                    - 'null'
                                  description: >-
                                    Represents the type of automatic
                                    unenrollment applied to the Cadence.
                                  maxLength: 255
                              additionalProperties: false
                            end_date:
                              type: string
                              description: >-
                                Represents the date on which the Cadence
                                execution ends.
                              maxLength: 50
                            automatic_unenroll:
                              type: boolean
                              description: >-
                                Indicates whether records enrolled in the
                                Cadence are automatically unenrolled when the
                                scheduled execution period ends. Possible
                                values: **true**, **false**.
                            type:
                              type:
                                - string
                                - 'null'
                              description: >-
                                Represents the execution schedule type for the
                                Cadence.
                              maxLength: 255
                            execute_every:
                              $ref: '#/components/schemas/ExecuteEvery'
                          additionalProperties: false
                        published:
                          type: boolean
                          description: >-
                            Represents whether the Cadence has been published.
                            Possible values: **true**, **false**.
                        type:
                          type: string
                          enum:
                            - Custom view
                            - Manual enrollment
                          description: >-
                            Indicates the enrollment type of the Cadence.
                            Possible values: **Custom view**, **Manual
                            enrollment**.
                        created_by:
                          $ref: '#/components/schemas/CreatorInfo'
                        modified_time:
                          type:
                            - string
                            - 'null'
                          description: >-
                            Represents the date and time when the Cadence was
                            last modified, in ISO 8601 format.
                          format: date-time
                        name:
                          $ref: '#/components/schemas/CadenceName'
                        modified_by:
                          $ref: '#/components/schemas/ModifierInfo'
                        id:
                          $ref: '#/components/schemas/CadenceID'
                          x-zs-$id: CadenceId
                        custom_view:
                          $ref: '#/components/schemas/CustomViewInfo'
                        status:
                          type: string
                          enum:
                            - active
                            - inactive
                            - draft
                          description: >-
                            Cadence lifecycle status. **Possible values**
                            **draft** = not yet published; **active** =
                            published and enrolling records; **inactive** =
                            published but currently deactivated.
                      required:
                        - id
                        - name
                      additionalProperties: false
                    maxItems: 400
                  info:
                    type: object
                    description: >-
                      Represents the pagination details for the list of
                      Cadences.
                    properties:
                      per_page:
                        type: integer
                        format: int32
                        description: Represents the number of Cadences returned per page.
                      count:
                        type: integer
                        format: int32
                        description: >-
                          Represents the total number of Cadences retrieved in
                          the current response.
                      page:
                        type: integer
                        format: int32
                        description: >-
                          Represents the current page number of the paginated
                          response.
                      more_records:
                        type: boolean
                        description: >-
                          Represents whether additional Cadences are available
                          beyond the current page.
                    additionalProperties: false
                required:
                  - cadences
                  - info
                additionalProperties: false
              examples:
                SuccessfulList:
                  summary: Successful Cadence list response
                  value:
                    cadences:
                      - summary:
                          task_follow_up_count: 2
                          call_follow_up_count: 1
                          email_follow_up_count: 3
                        description: Cadence for leads
                        created_time: '2025-10-30T08:46:14+00:00'
                        module:
                          api_name: Leads
                          id: '111111000000002648'
                        active: true
                        execution_details:
                          unenroll_properties:
                            end_date: '2025-12-31'
                            type: date
                          end_date: '2025-12-31'
                          automatic_unenroll: false
                          type: automatic_unenroll
                          execute_every:
                            unit: 1
                            period: days
                        published: true
                        type: Custom view
                        created_by:
                          name: Nish test
                          id: '111111000000057812'
                        modified_time: '2025-01-01T16:43:11+05:30'
                        name: Onboard Leads
                        modified_by:
                          name: Nish test
                          id: '111111000000057812'
                        id: '2001'
                        custom_view:
                          name: All Contacts
                          id: '111111000000051423'
                        status: active
                    info:
                      per_page: 20
                      count: 1
                      page: 1
                      more_records: false
                  description: >-
                    Shows a successful response listing multiple Cadences with
                    their follow-up summaries.
        '204':
          description: >-
            No Cadences found matching the specified filters. The response body
            is empty.
        '400':
          description: >-
            The request contains invalid data or an unsupported module name.

            **Resolution:** The query parameters must be correct, and the
            **module** parameter must specify a valid CRM module API name.
          content:
            application/json:
              schema:
                type: object
                x-zs-$id: ErrorResponseInvalidModuleName
                description: Represents the error response for the Cadence list request.
                properties:
                  code:
                    type: string
                    description: >-
                      Represents the error code for the failed request.

                      Possible values:

                      **INVALID_DATA** - The request contains invalid data.

                      **PATTERN_NOT_MATCHED** - The request value does not match
                      the expected pattern.

                      **UNABLE_TO_PARSE** - The value could not be parsed.
                    enum:
                      - INVALID_DATA
                      - PATTERN_NOT_MATCHED
                      - UNABLE_TO_PARSE_DATA_TYPE
                      - INVALID_REQUEST
                  details:
                    type: object
                    description: Represents the error details for the failed request.
                    properties:
                      param_name:
                        type: string
                        description: Represents the parameter name that caused the error.
                        maxLength: 255
                    additionalProperties: false
                  message:
                    type: string
                    description: >-
                      Represents the error message describing the cause of the
                      failure.
                    maxLength: 500
                  status:
                    type: string
                    description: >-
                      Represents the status of the failed request.

                      Possible values: **error** - Indicates that the request
                      failed.
                    enum:
                      - error
                required:
                  - code
                  - details
                  - message
                  - status
                additionalProperties: false
              examples:
                ErrorResponse1:
                  summary: Invalid module name error
                  value:
                    code: INVALID_DATA
                    details:
                      param_name: module
                    message: the given module doesn't exist
                    status: error
                  description: >-
                    Shows an error response when the provided module name is
                    invalid or not supported.
                ErrorResponse3:
                  summary: Invalid data type error
                  value:
                    code: UNABLE_TO_PARSE_DATA_TYPE
                    details: {}
                    message: either the request body or parameters is in wrong format
                    status: error
                  description: >-
                    Shows an error response when a query parameter value cannot
                    be parsed to the expected data type.
        '403':
          description: >-
            The user does not have permission to access Cadences, or the API is
            not supported for the selected domain.

            **Resolution:** The CRM administrator must grant the required
            Cadence read permission to the user's profile, and a new access
            token must be generated with the required scope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllErrorResponse'
              examples:
                NoPermissionResponse1:
                  summary: No permission to retrieve Cadences error
                  value:
                    code: NO_PERMISSION
                    details:
                      permissions:
                        - Crm_Implied_View_Cadences
                    message: No permission
                    status: error
                  description: >-
                    Shows an error response when the user lacks permission to
                    retrieve Cadences.
      security:
        - OAuth2:
            - ZohoCRM.settings.cadences.READ
    post:
      summary: Create cadence
      description: >-
        Creates a new cadence (initially in draft status) with its follow-up
        tree and optional un-enrollment rules in a single call. custom_view
        cadences require a custom_view.id; manual_enrollment cadences must omit
        custom_view. Follow-ups reference each other via reference_id (a
        client-chosen string) so that parent/child links can be expressed in a
        single request before server ids are assigned. The cadence must be
        published and activated before it will enroll records.
      x-zs-llm-description: >-
        Set reference_id to any client-chosen string on each follow-up to
        establish parent/child links before server ids are assigned; use the
        same string in parent_follow_up.reference_id on child follow-ups. After
        creation, the cadence is in draft - call POST .../publish, then POST
        .../activate to begin enrolling records.
      operationId: postCadences
      requestBody:
        description: >-
          The request body must contain a Cadences array with the configuration
          details for the new Cadence, including follow-up steps and action
          assignments.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CadencesCreateRequestBody'
            examples:
              SamplePostRequest:
                summary: Sample create Cadence request body
                value:
                  cadences:
                    - name: cadence
                      description: description
                      module:
                        api_name: Leads
                        id: '111112000000002628'
                      type: custom_view
                      custom_view:
                        id: '111112000000051112'
                      execution_details:
                        execute_every:
                          period: hours
                          unit: 1
                        unenroll_properties:
                          - type: end_date
                            details: {}
                          - type: automatic_unenroll
                          - type: end_date
                            details:
                              unenroll_date: '2025-11-30'
                          - type: criteria
                            details:
                              criteria:
                                field:
                                  api_name: Annual_Revenue
                                comparator: equal
                                value: 123
                          - type: followup_criteria
                            details:
                              type: Tasks
                              details:
                                criteria:
                                  field:
                                    api_name: Subject
                                    id: '111112000000004066'
                                  comparator: equal
                                  value: teste
                                specific: false
                                state: null
                      follow_ups:
                        - parent_follow_up:
                            reference_id: '{{Followup_1}}'
                          reference_id: '{{Followup_2}}'
                          triggers:
                            - Completed
                          execute_after:
                            unit: 10
                            period: minutes
                          action:
                            type: schedule_call
                            id: '111112000000003660'
                            details:
                              layout:
                                id: '111112000000003660'
                                name: Standard
                              module:
                                id: '111112000000002654'
                                api_name: Calls
                              field_mappings:
                                - field:
                                    id: '111112000000004208'
                                    api_name: Call_Type
                                  type: static
                                  value: Outbound
                        - parent_follow_up:
                            reference_id: '{{Followup_2}}'
                          reference_id: '{{Followup_3}}'
                          triggers:
                            - Completed
                          execute_after:
                            unit: 1
                            period: days
                          action:
                            type: email_notifications
                            id: '111112000000003661'
        x-zs-llm-examples:
          - SamplePostRequest
      responses:
        '201':
          description: >-
            Returns the details of the newly created Cadence, including its
            unique identifier.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse200'
              examples:
                Success201:
                  summary: Successful Cadence creation response
                  value:
                    cadences:
                      - code: SUCCESS
                        details:
                          follow_ups:
                            - id: '111112000000092009'
                          id: '111112000000092007'
                        message: Cadences created successfully
                        status: success
                  description: >-
                    Shows a successful response after creating a new Cadence,
                    returning the unique identifier of the created Cadence.
        '400':
          description: >-
            The request contains invalid or missing data.

            **Resolution:** All required fields must be provided, field values
            must conform to the expected format, and the Cadence count limits
            must not be exceeded.
          content:
            application/json:
              schema:
                x-zs-$id: CadencesCreateErrorResponse
                oneOf:
                  - $ref: '#/components/schemas/ErrorResponseWithCadenceAsHead'
                  - $ref: '#/components/schemas/AllErrorResponse'
                description: >-
                  Represents the error response for the Cadence creation
                  operation.
              examples:
                LimitExceededResponse1:
                  summary: Cadences per module limit exceeded error
                  value:
                    code: LIMIT_EXCEEDED
                    details:
                      limit: 60
                    message: More than 60 Cadences cannot be created for module
                    status: error
                  description: >-
                    Shows an error response when the number of Cadences in the
                    module exceeds the allowed limit.
                LimitExceededResponse2:
                  summary: Total Cadences limit exceeded error
                  value:
                    code: LIMIT_EXCEEDED
                    details:
                      limit: 150
                    message: More than 150 Cadences cannot be created
                    status: error
                  description: >-
                    Shows an error response when the total number of Cadences in
                    the organization exceeds the allowed limit.
                MandatoryNotFoundResponse1:
                  summary: Missing required field error
                  value:
                    cadences:
                      - code: MANDATORY_NOT_FOUND
                        details:
                          api_name: name
                          json_path: $.cadences[0].name
                        message: required field not found
                        status: error
                  description: >-
                    Shows an error response when a required field is missing
                    from the request body.
                MandatoryNotFoundResponse2:
                  summary: Missing required field error
                  value:
                    cadences:
                      - code: MANDATORY_NOT_FOUND
                        details:
                          api_name: module
                          json_path: $.cadences[0].module
                        message: required field not found
                        status: error
                  description: >-
                    Shows an error response when a required field is missing
                    from the request body.
                MandatoryNotFoundResponse3:
                  summary: Missing required field error
                  value:
                    cadences:
                      - code: MANDATORY_NOT_FOUND
                        details:
                          api_name: type
                          json_path: $.cadences[0].type
                        message: required field not found
                        status: error
                  description: >-
                    Shows an error response when a required field is missing
                    from the request body.
                MandatoryNotFoundResponse4:
                  summary: Missing required field error
                  value:
                    cadences:
                      - code: MANDATORY_NOT_FOUND
                        details:
                          api_name: period
                          json_path: $.cadences[0].execution_details.execute_every.period
                        message: required field not found
                        status: error
                  description: >-
                    Shows an error response when a required field is missing
                    from the request body.
                InvalidDataResponse5:
                  summary: Invalid field data value error
                  value:
                    cadences:
                      - code: INVALID_DATA
                        details:
                          api_name: period
                          json_path: $.cadences[0].execution_details.execute_every.period
                          supported_values:
                            - immediately
                            - hours
                            - days
                            - weeks
                        message: invalid data
                        status: error
                  description: >-
                    Shows an error response when a field value does not conform
                    to the expected format or constraints.
                InvalidDataResponse6:
                  summary: Invalid field data value error
                  value:
                    cadences:
                      - code: INVALID_DATA
                        details:
                          api_name: unit
                          json_path: $.cadences[0].execution_details.execute_every.unit
                        message: unit value must be between 1 to 99
                        status: error
                  description: >-
                    Shows an error response when a field value does not conform
                    to the expected format or constraints.
                InvalidDataResponse7:
                  summary: Invalid field data value error
                  value:
                    cadences:
                      - code: INVALID_DATA
                        details:
                          api_name: type
                          json_path: >-
                            $.cadences[0].execution_details.unenroll_properties[0].type
                          supported_values:
                            - automatic_unenroll
                            - end_date
                            - criteria
                            - followup_criteria
                        message: invalid data
                        status: error
                  description: >-
                    Shows an error response when a field value does not conform
                    to the expected format or constraints.
                LimitExceededResponse3:
                  summary: Follow-up steps limit exceeded error
                  value:
                    cadences:
                      - code: LIMIT_EXCEEDED
                        details:
                          api_name: type
                          limit: 1
                          json_path: >-
                            $.cadences[0].execution_details.unenroll_properties[2].type
                        message: Given unenroll type limit is exceeded
                        status: error
                  description: >-
                    Shows an error response when the number of follow-up steps
                    in a Cadence exceeds the allowed limit.
                DependentFieldMissingResponse2:
                  summary: Missing required dependent field error
                  value:
                    cadences:
                      - code: DEPENDENT_FIELD_MISSING
                        details:
                          dependee:
                            api_name: type
                            json_path: >-
                              $.cadences[0].execution_details.unenroll_properties[0].type
                          api_name: details
                          json_path: >-
                            $.cadences[0].execution_details.unenroll_properties[0].details
                        message: Dependent Field missing
                        status: error
                  description: >-
                    Shows an error response when a required dependent field is
                    missing from the request body.
                DependentFieldMissingResponse3:
                  summary: Missing required dependent field error
                  value:
                    cadences:
                      - code: DEPENDENT_FIELD_MISSING
                        details:
                          dependee:
                            api_name: type
                            json_path: >-
                              $.cadences[0].execution_details.unenroll_properties[0].type
                          api_name: unenroll_date
                          json_path: >-
                            $.cadences[0].execution_details.unenroll_properties[0].details.unenroll_date
                        message: dependent field is missing
                        status: error
                  description: >-
                    Shows an error response when a required dependent field is
                    missing from the request body.
                InvalidDataResponse8:
                  summary: Invalid field data value error
                  value:
                    cadences:
                      - code: INVALID_DATA
                        details:
                          api_name: unenroll_date
                          json_path: >-
                            $.cadences[0].execution_details.unenroll_properties.unenroll_date
                        message: >-
                          the given format is invalid please provide the value
                          as MM/DD/YYYY
                        status: error
                  description: >-
                    Shows an error response when a field value does not conform
                    to the expected format or constraints.
                DependentFieldMissingResponse4:
                  summary: Missing required dependent field error
                  value:
                    cadences:
                      - code: DEPENDENT_FIELD_MISSING
                        details:
                          dependee:
                            api_name: id
                            json_path: >-
                              $.cadences[0].execution_details.unenroll_properties[2].id
                          api_name: criteria
                          json_path: >-
                            $.cadences[0].execution_details.unenroll_properties[2].details.criteria
                        message: dependent field is missing
                        status: error
                  description: >-
                    Shows an error response when a required dependent field is
                    missing from the request body.
                DependentFieldMissingResponse5:
                  summary: Missing required dependent field error
                  value:
                    cadences:
                      - code: DEPENDENT_FIELD_MISSING
                        details:
                          dependee:
                            api_name: type
                            json_path: >-
                              $.cadences[0].execution_details.unenroll_properties[3].type
                          api_name: details
                          json_path: >-
                            $.cadences[0].execution_details.unenroll_properties[3].details.details
                        message: dependent field is missing
                        status: error
                  description: >-
                    Shows an error response when a required dependent field is
                    missing from the request body.
                DependentMismatchResponse1:
                  summary: Dependent field value mismatch error
                  value:
                    cadences:
                      - code: DEPENDENT_MISMATCH
                        details:
                          dependee:
