    delete:
      summary: Delete a Cadence
      description: >-
        To delete a Cadence and its associated records from your Zoho CRM
        organization. Deleting a Cadence removes all related action records,
        including workflow tasks, email notifications, and WhatsApp
        notifications, as well as process states and flow transitions. Pending
        enrollment schedules are removed, but record-level enrollment history is
        retained.
      operationId: deleteSingleCadence
      responses:
        '200':
          description: Returns a success response confirming the Cadence deletion.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse200'
              examples:
                Success200:
                  summary: Successful Cadence deletion response
                  value:
                    cadences:
                      - code: SUCCESS
                        details:
                          id: '111112000000092007'
                        message: Cadences deleted successfully
                        status: success
                  description: >-
                    Shows a successful deletion of a Cadence, returning the
                    result code and the identifier of the deleted Cadence.
        '400':
          description: >-
            The request contains an invalid Cadence ID.

            **Resolution:** The Cadence ID in the URL path must be valid and
            must refer to an existing Cadence in the Zoho CRM organization.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllErrorResponse'
              examples:
                InvalidDataResponse1:
                  summary: Invalid Cadence ID error
                  value:
                    code: INVALID_DATA
                    details:
                      resource_path_index: 3
                    message: the given id seems to be invalid
                    status: error
                  description: >-
                    Shows an error response when the provided Cadence ID is
                    invalid, returning the INVALID_DATA code with the resource
                    path index.
        '403':
          description: >-
            The user does not have permission to delete Cadences.

            **Resolution:** The CRM administrator must grant the Cadence
            management permission to the user's profile, and a new access token
            must be generated with the required scope.
