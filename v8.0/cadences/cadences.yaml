  /settings/automation/cadences/{id}/actions/clone:
    parameters:
      - name: id
        in: path
        required: true
        description: Specify the unique identifier of the Cadence to clone.
        schema:
          type: string
          examples:
            - '111112000000092007'
          maxLength: 255
    post:
      summary: Clone a Cadence
      description: >-
        Creates a new cadence with the same follow-up tree as the source cadence
        (identified by path id) but with the name / description / custom_view
        supplied in the body. Every follow-up action is copied into a new action
        record - the clone has no shared rows with the source. The new cadence
        starts in draft status and must be published before it can enroll
        records.
      operationId: postCloneCadences
      requestBody:
        description: >-
          The request body must contain a Cadences array with the configuration
          details for the cloned Cadence.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CadencesCloneRequestBody'
            examples:
              SamplePostRequest:
                summary: Sample clone Cadence request body
                value:
                  cadences:
                    - name: cadence
                      description: description
                      module:
                        api_name: Leads
                        id: '111112000000002628'
                      type: custom_view
                      custom_view:
                        id: '111112000000051112'
                      execution_details:
                        execute_every:
                          period: hours
                          unit: 1
            x-zs-llm-examples:
              - SamplePostRequest
      responses:
        '201':
          description: >-
            Returns the details of the newly cloned Cadence, including its
            unique identifier.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse200'
              examples:
                Success201:
                  summary: Successful Cadence clone response
                  value:
                    cadences:
                      - code: SUCCESS
                        details:
                          id: '111112000000092007'
                        message: Cadences cloned successfully
                        status: success
                  description: >-
                    Shows a successful response after cloning a Cadence,
                    returning the identifier of the newly created Cadence.
        '400':
          description: >-
            The request contains invalid or missing data.

            **Resolution:** All required fields must be included in the request
            body, field values must conform to the expected format, and the
            Cadence count limits must not be exceeded.
          content:
            application/json:
              schema:
                x-zs-$id: CadencesCloneErrorResponse
                oneOf:
                  - $ref: '#/components/schemas/ErrorResponseWithCadenceAsHead'
                  - $ref: '#/components/schemas/AllErrorResponse'
                description: Represents the error response for the Cadence clone operation.
              examples:
                LimitExceededResponse1:
                  summary: Cadences per module limit exceeded error
                  value:
                    code: LIMIT_EXCEEDED
                    details:
                      api_name: id
                      limit: 60
                    message: More than 60 Cadences cannot be created for module
                    status: error
                  description: >-
                    Shows an error response when the total number of Cadences in
                    the module exceeds the allowed limit.
                LimitExceededResponse2:
                  summary: Total Cadences limit exceeded error
                  value:
                    code: LIMIT_EXCEEDED
                    details:
                      api_name: id
                      limit: 150
                    message: More than 150 Cadences cannot be created
                    status: error
                  description: >-
                    Shows an error response when the total number of Cadences in
                    the organization exceeds the allowed limit.
                MandatoryNotFoundResponse1:
                  summary: Missing required name field error
                  value:
                    cadences:
                      - code: MANDATORY_NOT_FOUND
                        details:
                          api_name: name
                          json_path: $.cadences[0].name
                        message: required field not found
                        status: error
                  description: >-
                    Shows an error response when the required name field is
                    missing from the request body.
