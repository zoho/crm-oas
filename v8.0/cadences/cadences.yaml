          description: >-
            The user does not have permission to view Cadence analytics.

            **Resolution:** The CRM administrator must grant the required
            Cadence read permission to the user's profile, and a new access
            token must be generated with the required scope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllErrorResponse'
              examples:
                NoPermissionResponse1:
                  summary: No permission to view Cadence analytics error
                  value:
                    code: NO_PERMISSION
                    details:
                      permissions:
                        - Crm_Implied_View_Cadences
                    message: No permission
                    status: error
