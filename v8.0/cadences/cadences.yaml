  /settings/automation/cadences/{id}/actions/publish:
    parameters:
      - name: id
        in: path
        required: true
        description: Specify the unique identifier of the Cadence to publish.
        schema:
          type: string
          examples:
            - '111112000000092007'
          maxLength: 255
    post:
      summary: Publish a Cadence
      description: >-
        Publishes a draft cadence by merging its follow-up tree, transitions,
        and triggers into the live cadence, and then clears the draft. If the
        cadence is being published for the first time, it is promoted from a
        draft to an inactive published cadence. Call the Activate Cadence API
        separately to begin enrolling records. Before publishing, ensure the
        cadence contains at least one follow-up and complies with the action
        count and active cadence limits. When the enrollment type is
        `custom_view`, the `process_existing_records` parameter determines
        whether records that already match the custom view are enrolled at the
        time of publication.
      x-zs-llm-description: >-
        The request body cadences array should be empty ([]) for manual-type
        cadences; for custom-view cadences, include a single element with
        process_existing_records: true to enroll records already in the view at
        publish time. After the first publish, the cadence is inactive - call
        the activate endpoint to begin enrolling records.
      operationId: postPublish
      requestBody:
        description: >-
          The request body must contain a Cadences array with the publishing
          configuration for each Cadence.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutpublishRequest'
            examples:
              SamplePutRequestManualType:
                summary: Sample minimal publish request
                value:
                  cadences: []
                description: >-
                  Shows a minimal request body for publishing a Cadence without
                  additional configuration.
              SamplePutRequestCustomView:
                summary: Sample publish request with process existing records
                value:
                  cadences:
                    - process_existing_records: true
            x-zs-llm-examples:
              - SamplePutRequestCustomView
              - SamplePutRequestManualType
      responses:
        '200':
          description: Returns a success response confirming the Cadence was published.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse200'
              examples:
                Success200:
                  summary: Successful Cadence publish response
                  value:
                    cadences:
                      - code: SUCCESS
                        details:
                          id: '111112000000092007'
                        message: Cadences published successfully
                        status: success
                  description: >-
                    Shows a successful publish of a Cadence, returning the
                    result code and identifier of the published Cadence.
        '400':
          description: >-
            Returned when the request contains invalid data, or when the

            Cadence cannot be published due to its current state, edition
            restrictions,

            limit violations, or unsupported configuration.\n**Resolution:** The
            Cadence

            ID must be valid, at least one follow-up action must be configured,
            and

            all publishing requirements must be met.
          content:
            application/json:
              schema:
                x-zs-$id: CadencesPublishErrorResponseSchema
                oneOf:
                  - $ref: '#/components/schemas/AllErrorResponse'
                  - $ref: '#/components/schemas/ErrorResponseWithCadenceAsHead'
                description: >-
                  Represents the error response for the Cadence publish
                  operation, containing either a standard error or a per-Cadence
                  error response.
              examples:
                InvalidDataResponse1:
                  summary: Invalid Cadence ID error
                  value:
                    code: INVALID_DATA
                    details:
                      resource_path_index: 3
                    message: the given id seems to be invalid
                    status: error
                  description: >-
                    Shows an error response when the provided Cadence ID is
                    invalid.
                NotAllowedResponse1:
                  summary: Cannot merge published Cadences error
                  value:
                    code: NOT_ALLOWED
                    details: {}
                    message: >-
                      Cannot merge published Cadences / Only Cadences in draft
                      can be merged with its parent
                    status: error
                  description: >-
                    Shows an error response when attempting to merge published
                    Cadences, which is not permitted.
                NotAllowedResponse2:
                  summary: No follow-up actions in Cadence error
                  value:
                    code: NOT_ALLOWED
                    details: {}
                    message: Cadence must contain at least one follow-up to publish
                    status: error
                  description: >-
                    Shows an error response when the Cadence does not contain
                    any follow-up actions.
                NotAllowedResponse3:
                  summary: Task action not supported error
                  value:
                    code: NOT_ALLOWED
                    details: {}
                    message: Task Action Not Supported in this Edition
                    status: error
                  description: >-
                    Shows an error response when the task action is not
                    supported in the current edition.
                NotSupportedResponse1:
                  summary: Custom view unsupported fields error
                  value:
                    code: NOT_SUPPORTED
                    details: {}
                    message: >-
                      The custom_view contains unsupported fields in the
                      criteria
                    status: error
                  description: >-
                    Shows an error response when the Custom View criteria
                    contain unsupported fields.
                LimitExceededResponse1:
                  summary: Action count limit exceeded error
                  value:
                    code: LIMIT_EXCEEDED
                    details:
                      limit: 70
                    message: ' action Configured more than allowed limit'
                    status: error
                  description: >-
                    Shows an error response when the configured action count
                    exceeds the allowed limit.
                LimitExceededResponse2:
                  summary: Cadences per module activation limit exceeded error
                  value:
                    code: LIMIT_EXCEEDED
                    details:
                      limit: 30
                    message: More than 30 Cadences cannot be activated for module
                    status: error
                  description: >-
                    Shows an error response when the number of activated
                    Cadences for a module exceeds the allowed limit.
                LimitExceededResponse3:
                  summary: Total Cadence activation limit exceeded error
                  value:
                    code: LIMIT_EXCEEDED
                    details:
                      limit: 150
                    message: More than 150 Cadences cannot be activated
                    status: error
                  description: >-
                    Shows an error response when the total number of activated
                    Cadences exceeds the organization limit.
                InvalidKeyInRequestBody:
                  summary: Invalid key in request body error
                  value:
                    cadences:
                      - code: NOT_ALLOWED
                        details:
                          api_name: process_existing_records
                          json_path: $.cadences[0].process_existing_records
                        message: >-
                          For manual Enrollment we wont add
                          process_existing_records key not allowed
                        status: error
                  description: >-
                    Shows an error response when the process_existing_records
                    key is provided for a Cadence with manual enrollment type.
        '403':
          description: >-
            The user does not have permission to publish Cadences.

            **Resolution:** The CRM administrator must grant the required
            Cadence management permission to the user's profile, and a new
            access token must be generated with the required scope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllErrorResponse'
              examples:
                NoPermissionResponse1:
                  summary: No permission to publish Cadence error
                  value:
                    code: NO_PERMISSION
                    details:
                      permissions:
                        - Crm_Implied_Manage_Cadences
                    message: No permission
                    status: error
                  description: >-
                    Shows an error response when the user lacks permission to
                    publish Cadences.
      security:
        - OAuth2:
            - ZohoCRM.settings.cadences.CREATE
  /settings/automation/cadences/actions/records_count:
    get:
      operationId: listCadencesRecordsCount
      summary: Get Cadence records count
      description: >-
        To retrieve the record counts for the specified Cadences from your Zoho
        CRM organization. For each Cadence ID supplied in the **ids** query
        parameter, the response returns the number of records currently
        associated with that Cadence. A maximum of 100 Cadence IDs can be
        supplied per request.
      parameters:
        - $ref: '#/components/parameters/ParamQueryIds'
      responses:
        '200':
          description: Returns the record counts for all specified Cadences.
          content:
            application/json:
              schema:
                type: object
                x-zs-$id: GetrecordscountResponse200
                additionalProperties: false
                description: >-
                  Represents the successful response containing a list of
                  Cadence record count entries.
                properties:
                  cadences_records_count:
                    type: array
                    description: >-
                      Represents the list of Cadence record count entries in the
                      success response.
                    items:
                      $ref: '#/components/schemas/CadencesRecordsCountSuccess'
                    maxItems: 100
                required:
                  - cadences_records_count
              examples:
                Success200:
                  summary: Successful Cadence record counts response
                  value:
                    cadences_records_count:
                      - count: 5
                        cadences:
                          name: cadence
                          id: '111112000000092007'
                      - count: 0
                        cadences:
                          name: darft cadence
                          id: '111112000000092270'
                      - count: 1
                        cadences:
                          name: publish cadence
                          id: '111112000000094004'
                  description: >-
                    Shows a successful response containing the record counts for
                    the specified Cadences.
        '207':
          description: >-
            Returns a mixed response containing both successful and failed
            Cadence record count results.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetrecordscountResponse207'
              examples:
                Success207:
                  summary: Partial Cadence record counts response
                  value:
                    cadences_records_count:
                      - count: 5
                        cadences:
                          name: cadence
                          id: '111112000000092007'
                      - code: INVALID_DATA
                        details:
                          id: '111112000000092000'
                        message: The id given seems to be invalid.
                        status: error
                  description: >-
                    Shows a partial success response where some Cadence record
                    counts return successfully while others encounter errors.
        '400':
          description: >-
            The request contains an invalid Cadence ID.

            **Resolution:** All Cadence IDs provided in the **ids** parameter
            must be valid and must refer to existing Cadences in the Zoho CRM
            organization.
          content:
            application/json:
              schema:
                type: object
                x-zs-$id: GetrecordscountResponse400Schema
                additionalProperties: false
                description: >-
                  Represents the error response when one or more Cadence record
                  count retrievals fail.
                properties:
                  cadences_records_count:
                    type: array
                    description: >-
                      Represents the list of Cadence record operation results,
                      including error details for failed entries.
                    items:
                      $ref: '#/components/schemas/AllErrorResponse'
                    maxItems: 25
                required:
                  - cadences_records_count
              examples:
                InvalidDataResponse1:
                  summary: Invalid Cadence ID error
                  value:
                    cadences_records_count:
                      - code: INVALID_DATA
                        details:
                          id: '111112000000092001'
                        message: The id given seems to be invalid.
                        status: error
                      - code: INVALID_DATA
                        details:
                          id: '111112000000092000'
                        message: The id given seems to be invalid.
                        status: error
                  description: >-
                    Shows an error response when one or more provided Cadence
                    IDs are invalid.
        '403':
          description: >-
            The user does not have permission to access this resource, or the
            API is not supported for the selected domain.

            **Resolution:** The CRM administrator must grant the required
            Cadence permission to the user's profile, and a new access token
            must be generated with the required scope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllErrorResponse'
              examples:
                NoPermissionResponse1:
                  summary: No permission to retrieve Cadence record counts error
                  value:
                    code: NO_PERMISSION
                    details:
                      permissions:
                        - Crm_Implied_View_Cadences
                    message: No permission
                    status: error
                  description: >-
                    Shows an error response when the user lacks permission to
                    retrieve Cadence record counts.
      security:
        - OAuth2:
            - ZohoCRM.settings.cadences.READ
  /settings/automation/cadences/{id}/actions/analytics:
    get:
      summary: Get Cadence analytics
      description: >-
        To retrieve per-follow-up execution statistics for the specified Cadence
        in your Zoho CRM organization. Each follow-up element returns an
        analytics payload whose structure depends on its action type: tasks
        (open, completed, and failed counts), schedule_call (created, scheduled,
        completed, missed, cancelled, overdue, and failed counts),
        email_notifications (sent, opened, clicked, replied, bounced,
        unsubscribed, and unsent counts), and whatsapp_message_notification
        (delivered and failed counts). Use the **filters** parameter to restrict
        results to a single action type, and the **follow_ups_executed_from**
        and **follow_ups_executed_till** parameters to restrict to a time range.
      x-zs-llm-description: >-
        Pass filters as a JSON object with field.api_name set to
        follow_ups.action.type and value set to the desired action type. Use
        follow_ups_executed_from and follow_ups_executed_till (ISO 8601 datetime
        strings) to scope the time window. The response follow_ups array
        contains one element per follow-up with an analytics object keyed to its
        action type.
      operationId: getCadenceAnalytics
      parameters:
        - name: id
          in: path
          required: true
          description: >-
            Specify the unique identifier of the Cadence for which you want to
            retrieve analytics.
          schema:
            type: string
            format: int64
        - name: filters
          description: >-
            Specifies the filter criteria to narrow the analytics results by
            follow-up action type and value.
          in: query
          schema:
            type: object
            description: >-
              Represents the filter criteria schema for retrieving Cadence
              analytics, including the field, comparator, and value to filter
              by.
            properties:
              field:
                type: object
                description: >-
                  Specify the filter condition, including the api_name and value
                  fields.
                properties:
                  api_name:
                    type: string
                    description: >-
                      Specify the field name to filter analytics by.

                      Possible values:

                      follow_ups.action.type - Filters analytics by the
                      follow-up action type.
                    enum:
                      - follow_ups.action.type
                additionalProperties: false
              comparator:
                type: string
                description: |-
                  Specify the comparison operator for the filter.
                  Possible values:
                  **between** - Filters records within a specified range.
                enum:
                  - between
              value:
                type: string
                description: >-
                  Specify the list of values to filter by.

                  Possible values:

                  tasks - Filters follow-ups with task actions.

                  email_notifications - Filters follow-ups with email
                  notification actions.

                  schedule_call - Filters follow-ups with scheduled call
                  actions.

                  whatsapp_message_notification - Filters follow-ups with
                  WhatsApp message actions.
                maxLength: 500
                enum:
                  - tasks
                  - email_notifications
                  - schedule_call
                  - whatsapp_message_notification
            additionalProperties: false
        - name: follow_ups_executed_from
          in: query
          description: >-
            Specifies the start date from which to retrieve follow-up execution
            analytics, in ISO 8601 format.
          required: false
          schema:
            type: string
            format: date-time
        - name: follow_ups_executed_till
          in: query
          description: >-
            Specifies the end date until which to retrieve follow-up execution
            analytics, in ISO 8601 format.
          required: false
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: >-
            Returns the analytics data for the specified Cadence, including
            follow-up metrics grouped by action type.
          content:
            application/json:
              schema:
                type: object
                x-zs-$id: GetAnalyticsResponse
                additionalProperties: false
                description: >-
                  Represents the analytics response for a Cadence, containing a
                  list of Cadences and their follow-up analytics data.
                properties:
                  cadences:
                    type: array
                    description: >-
                      Represents the list of Cadences with their follow-up
                      analytics data.
                    items:
                      type: object
                      additionalProperties: false
                      description: >-
                        Represents the analytics data for a single Cadence,
                        including follow-up details and metrics.
                      properties:
                        module:
                          $ref: '#/components/schemas/ModuleInformation'
                        name:
                          $ref: '#/components/schemas/CadenceName'
                        follow_ups:
                          type: array
                          description: >-
                            Represents the list of follow-up steps in the
                            Cadence, each containing action details and
                            execution analytics.
                          items:
                            type: object
                            additionalProperties: false
                            description: Indicates a single follow-up step in the Cadence.
                            properties:
                              analytics:
                                oneOf:
                                  - x-zs-$id: TasksAnalytics
                                    type: object
                                    additionalProperties: false
                                    description: >-
                                      Specifies the analytics data for a
                                      task-type follow-up action.
                                    properties:
                                      open_tasks_count:
                                        type: integer
                                        format: int32
                                        description: >-
                                          Represents the number of tasks that are
                                          currently open.
                                      failed_tasks_count:
                                        type: integer
                                        format: int32
                                        description: >-
                                          Represents the number of tasks that
                                          failed to execute.
                                      subject:
                                        type: string
                                        maxLength: 255
                                        description: >-
                                          Represents the subject of the task
                                          action.
                                      completed_tasks_count:
                                        type: integer
                                        format: int32
                                        description: The number of tasks that were completed.
                                      tasks_count:
                                        type: integer
                                        format: int32
                                        description: >-
                                          Represents the total number of tasks
                                          generated by the follow-up action.
                                  - x-zs-$id: CallsAnalytics
                                    type: object
                                    additionalProperties: false
                                    description: >-
                                      Represents the analytics data for a
                                      scheduled call-type follow-up action.
                                    properties:
                                      created_calls_count:
                                        type: integer
                                        format: int32
                                        description: >-
                                          Represents the number of calls that were
                                          created.
                                      cancelled_calls_count:
                                        type: integer
                                        format: int32
                                        description: >-
                                          Represents the number of calls that were
                                          cancelled.
                                      failed_calls_count:
                                        type: integer
                                        format: int32
                                        description: >-
                                          Represents the number of calls that
                                          failed to execute.
                                      completed_calls_count:
                                        type: integer
                                        format: int32
                                        description: >-
                                          Represents the number of calls that were
                                          completed.
                                      scheduled_calls_count:
                                        type: integer
                                        format: int32
                                        description: >-
                                          Represents the number of calls that are
                                          currently scheduled.
                                      subject:
                                        type: string
                                        maxLength: 255
                                        description: >-
                                          Indicates the subject of the scheduled
                                          call action.
                                      calls_count:
                                        type: integer
                                        format: int32
                                        description: >-
                                          Represents the total number of calls
