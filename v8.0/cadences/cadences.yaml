            **Resolution:** The CRM administrator must grant the required
            Cadence management permission to the user's profile, and a new
            access token must be generated with the required scope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllErrorResponse'
              examples:
                NoPermissionResponse1:
                  summary: No permission to create Cadence error
                  value:
                    code: NO_PERMISSION
                    details:
                      permissions:
                        - Crm_Implied_Manage_Cadences
                    message: No permission
                    status: error
                  description: >-
                    Shows an error response when the user lacks permission to
                    create Cadences.
      security:
        - OAuth2:
            - ZohoCRM.settings.cadences.CREATE
    put:
      summary: Update multiple Cadences (bulk form)
      description: >-
        Partial-update form that takes the cadence id inside the request body
        (cadences[0].id). Updates only the provided fields; module / type /
        custom_view cannot be changed after creation. Editing a
        currently-published cadence creates a draft on the first save. Follow-up
        add/update is expressed inline via the follow_ups array.
      x-zs-llm-description: >-
        To remove a follow-up, include its id and set _delete to null. Editing a
        published cadence creates a draft on first save; the response returns a
        draft_cadence id - use that id for subsequent edits and call publish
        when changes are complete.
      operationId: putUpdateCadences
      requestBody:
        description: >-
          The request body must contain a Cadences array with updated
          configurations for one or more Cadences.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CadencesUpdateRequestBody'
            examples:
              SamplePutRequest:
                summary: Sample bulk Cadence update request body
                value:
                  cadences:
                    - id: '111112000000069836'
                      name: cadence
                      description: description
                      execution_details:
                        unenroll_properties:
                          - type: automatic_unenroll
                          - type: end_date
                            details:
                              unenroll_date: '2026-11-30'
                          - type: criteria
                            details:
                              criteria:
                                field:
                                  api_name: Annual_Revenue
                                comparator: equal
                                value: 123
                          - type: followup_criteria
                            details:
                              type: Tasks
                              details:
                                criteria:
                                  field:
                                    api_name: Subject
                                    id: '111112000000004066'
                                  comparator: equal
                                  value: teste
                                specific: false
                                state: null
                      follow_ups:
                        - parent_follow_up:
                            id: '111112000000106722'
                          id: '111112000000106723'
                          triggers:
                            - Completed
                          execute_after:
                            unit: 10
                            period: minutes
                          action:
                            type: schedule_call
                            id: '111112000000003660'
                            details:
                              layout:
                                id: '111112000000003660'
                                name: Standard
                              module:
                                id: '111112000000002654'
                                api_name: Calls
                              field_mappings:
                                - field:
                                    id: '111112000000004208'
                                    api_name: Call_Type
                                  type: static
                                  value: Outbound
                        - parent_follow_up:
                            id: '111112000000106723'
                          reference_id: '{{Followup_3}}'
                          triggers:
                            - Completed
                          execute_after:
                            unit: 1
                            period: days
                          action:
                            type: email_notifications
                            id: '111112000000003661'
        x-zs-llm-examples:
          - SamplePutRequest
      responses:
        '200':
          description: >-
            Returns the updated details of the Cadences, confirming that the
            updates were applied successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse200'
              examples:
                Success200:
                  summary: Successful bulk Cadence update response
                  value:
                    cadences:
                      - code: SUCCESS
                        details:
                          id: '111112000000092007'
                        message: Cadences updated successfully
                        status: success
                  description: >-
                    Shows a successful response after updating multiple
                    Cadences.
                DraftCadenceSuccess:
                  summary: Successful bulk Cadence draft save response
                  value:
                    cadences:
                      - code: SUCCESS
                        details:
                          draft_cadence:
                            id: '111111000000070063'
                          id: '111111000000070062'
                        message: Cadences updated successfully
                        status: success
                  description: >-
                    Shows a successful response after saving one or more
                    Cadences in draft state.
