                  value:
                    code: DEPENDENT_FIELD_MISSING
                    details:
                      dependee:
                        api_name: field
                        json_path: $.field
                      api_name: value
                      json_path: $.value
                      param_name: filters
                    message: dependent field is missing
                    status: error
                  description: >-
