openapi: 3.1.0
info:
  title: Webhooks
  description: >+
    Represents the array containing the error details for the invalid webhook ID
    in a single record DELETE request.

  version: '8'
servers:
  - url: https://zohoapis.{dc}/crm/{version}
    description: API Server URL
    variables:
      dc:
        description: API Server URL TLD
        default: com
        enum:
          - com
          - eu
          - in
          - cn
          - au
          - ca
          - jp
      version:
        description: API Version
        default: v8
paths:
  /settings/automation/webhooks:
    get:
      summary: Get webhooks
      description: >-
        To retrieve the list of all webhook action configurations available in
        your Zoho CRM organization. The response contains summary-level data for
        each webhook, including the module, URL, HTTP method, feature type, and
        audit metadata. Use the [Get Webhooks API using
        ID](webhooks.yaml#$.paths./settings/automation/webhooks/{webhook_ID}.get)
        to retrieve the full configuration of a specific webhook.
      x-zs-llm-description: >-
        Fetches a paginated list of webhook definitions; narrow results using
        filters for module, feature_type, related_module, or name. page defaults
        to 1, per_page max is 200; sort_by accepts only Modified_Time with
        asc/desc sort_order. The response carries summary-level data only 
        headers, body, authentication, url_parameters, and date_time_format are
        omitted; call GET /settings/automation/webhooks/{webhookId} for the full
        config. Run this before PUT/DELETE to discover webhook IDs.
      operationId: getWebhooks
      parameters:
        - $ref: '#/components/parameters/ParamQueryModule'
        - $ref: '#/components/parameters/ParamQueryPage'
        - $ref: '#/components/parameters/ParamQueryPerPage'
        - $ref: '#/components/parameters/ParamQuerySortBy'
        - $ref: '#/components/parameters/ParamQuerySortOrder'
        - $ref: '#/components/parameters/ParamQueryFeatureType'
        - $ref: '#/components/parameters/ParamQueryRelatedModule'
        - $ref: '#/components/parameters/ParamQueryFilters'
      responses:
        '200':
          description: >-
            Returns a paginated list of webhook summary objects configured in
            your Zoho CRM organization. Each item contains the module, URL, HTTP
            method, feature type, and audit metadata. Full configuration fields
            such as headers, body, authentication, url_parameters, and
            date_time_format are omitted from this response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetWebhooksSuccessResponse'
              examples:
                Success200:
                  summary: Successful list of webhook summary objects
                  value:
                    webhooks:
                      - created_time: '2025-07-12T06:55:54-07:00'
                        lock_status:
                          locked: false
                        editable: true
                        module:
                          api_name: Leads
                          id: '5725767000000002175'
                        related_module: null
                        deletable: true
                        description: Protected Data
                        source: crm
                        created_by:
                          name: Patricia Boyle
                          id: '5725767000000411001'
                        url: >-
                          https://webhook.site/3588de27-e3bd-4237-894b-f140143f3d99
                        feature_type: workflow
                        http_method: POST
                        modified_time: '2025-07-12T06:55:54-07:00'
                        associated: false
                        name: Zoho's Data
                        modified_by:
                          name: Patricia Boyle
                          id: '5725767000000411001'
                        id: '5725767000007186002'
                      - created_time: '2025-07-06T08:00:01-07:00'
                        lock_status:
                          locked: false
                        editable: true
                        module:
                          api_name: Leads
                          id: '5725767000000002175'
                        related_module: null
                        deletable: true
                        description: null
                        source: crm
                        created_by:
                          name: Patricia Boyle
                          id: '5725767000000411001'
                        url: >-
                          https://webhook.site/3588de27-e3bd-4237-894b-f140143f3d99
                        feature_type: workflow
                        http_method: POST
                        modified_time: '2025-07-06T08:00:01-07:00'
                        associated: false
                        name: Zoho
                        modified_by:
                          name: Patricia Boyle
                          id: '5725767000000411001'
                        id: '5725767000007084238'
                      - created_time: '2025-07-06T04:16:24-07:00'
                        lock_status:
                          locked: false
                        editable: true
                        module:
                          api_name: Leads
                          id: '5725767000000002175'
                        related_module: null
                        deletable: true
                        description: Description about the webhook
                        source: crm
                        created_by:
                          name: Patricia Boyle
                          id: '5725767000000411001'
                        url: >-
                          https://webhook.site/3588de27-e3bd-4237-894b-f140143f3d99
                        feature_type: workflow
                        http_method: POST
                        modified_time: '2025-07-06T04:16:24-07:00'
                        associated: false
                        name: New Lead Webhook API
                        modified_by:
                          name: Patricia Boyle
                          id: '5725767000000411001'
                        id: '5725767000007093002'
                    info:
                      per_page: 200
                      count: 10
                      page: 1
                      more_records: false
                      max_limit: 200
                  description: >-
                    Shows a successful list response containing three webhook
                    summary objects, each with module, URL, HTTP method, feature
                    type, and audit metadata fields.
                Success200Paginated:
                  summary: >-
                    Successful paginated list showing page one of two pages
                    containing records.
                  value:
                    webhooks:
                      - created_time: '2025-07-12T06:55:54-07:00'
                        lock_status:
                          locked: false
                          message: null
                        editable: true
                        module:
                          api_name: Leads
                          id: '5725767000000002175'
                        related_module: null
                        deletable: true
                        description: null
                        source: user
                        created_by:
                          name: Patricia Boyle
                          id: '5725767000000411001'
                        url: https://example.com/webhook-handler
                        feature_type: workflow
                        http_method: POST
                        modified_time: '2025-07-12T06:55:54-07:00'
                        associated: false
                        name: Lead Notification Webhook
                        modified_by:
                          name: Patricia Boyle
                          id: '5725767000000411001'
                        id: '5725767000007186002'
                    info:
                      per_page: 1
                      count: 1
                      page: 1
                      more_records: true
                  description: >-
                    Shows a paginated response containing the first page of
                    webhook summary objects, with more_records set to true
                    indicating additional webhooks exist on subsequent pages.
        '400':
          description: >-
            One or more query parameters contain invalid values.


            **Resolution:** The module API name in the request must match a
            valid CRM module. The **sort_order**, **sort_by**, and
            **feature_type** values must match the supported enum values for
            this operation.
          content:
            application/json:
              schema:
                x-zs-$id: GetWebhooksInvalidParamErrorResponseSchema
                oneOf:
                  - $ref: '#/components/schemas/InvalidModuleErrorResponse'
                  - $ref: '#/components/schemas/InvalidDataErrorResponse'
                description: >-
                  Contains the error response for an invalid query parameter.
                  Each variant in the union indicates which parameter was
                  invalid and why.
              examples:
                InvalidModuleResponse1:
                  summary: Invalid module API name in module parameter
                  value:
                    code: INVALID_MODULE
                    details:
                      param_name: module
                    message: The value provided to the param is Invalid
                    status: error
                  description: >-
                    Shows the error response when the module query parameter
                    contains an API name that does not match any existing CRM
                    module.
                InvalidDataResponse1:
                  summary: Invalid query parameter value for sort_order
                  value:
                    code: INVALID_DATA
                    details:
                      param_name: sort_order
                    message: The value provided to the param is Invalid
                    status: error
                  description: >-
                    Shows the error response when an invalid value is provided
                    for the sort_order query parameter.
                InvalidDataResponse2:
                  summary: Invalid sort_by parameter value
                  value:
                    code: INVALID_DATA
                    details:
                      param_name: sort_by
                    message: The value provided to the param is Invalid
                    status: error
                  description: >-
                    Shows the error response when the sort_by parameter contains
                    a value that is not in the supported enum.
                InvalidDataResponse3:
                  summary: Invalid feature_type parameter value
                  value:
                    code: INVALID_DATA
                    details:
                      param_name: feature_type
                    message: The value provided to the param is Invalid
                    status: error
                  description: >-
                    Shows the error response when the feature_type parameter
                    contains a value that is not in the supported enum.
        '403':
          description: >
            Permission denied to list webhooks in the Zoho CRM organization.


            **Resolution:** The CRM administrator must grant the Manage Workflow
            permission to the user's profile.
          content:
            application/json:
              schema:
                x-zs-$id: GetWebhooksNoPermissionErrorResponseSchema
                $ref: '#/components/schemas/NoPermissionErrorResponse'
              examples:
                NoPermissionResponse1:
                  summary: Missing Manage Workflow permission for listing webhooks
                  value:
                    code: NO_PERMISSION
                    details:
                      permissions:
                        - Crm_Implied_Manage_Workflow
                    message: permission denied
                    status: error
                  description: >-
                    Shows the error response when the requesting user does not
                    have the Manage Workflow permission required to list
                    webhooks.
      security:
        - OAuth2:
            - ZohoCRM.settings.automation_actions.READ
    put:
      summary: Update webhooks
      description: >-
        To update the configuration of an existing webhook in your Zoho CRM
        organization.


        The module field cannot be changed after creation. The request body must
        contain a webhooks array with exactly one webhook object.


        To retrieve valid module API names, refer to the [Get
        Modules](modules.yaml#$.paths./settings/modules.get) resource.
      x-zs-llm-description: >-
        Replaces one webhook in a single call. Before submitting: (1) list
        webhook IDs via GET /settings/automation/webhooks; (2) confirm valid
        module api_names via GET /settings/modules. Full-replacement semantics
        apply  include every field you want to keep, since omitted fields revert
        to defaults or null. The webhook object must carry its id field. Module
        and kiosk names cannot be changed; read-only or marketplace/extension
        webhooks return NOT_ALLOWED.
      x-zs-llm-examples:
        - SamplePutRequest
      operationId: updateWebhooks
      requestBody:
        description: The request body must contain a webhooks array with one object.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWebhookRequest'
            examples:
              SamplePutRequest:
                summary: Bulk update request for a webhook with all required fields
                value:
                  webhooks:
                    - headers:
                        module_parameters:
                          - name: lead_email
                            value: ${!Leads.Email}
                          - name: lead_id
                            value: ${!Leads.Id}
                          - name: lead_owner
                            value: ${!Leads.Owner}
                        custom_parameters:
                          - name: source
                            value: website
                          - name: version
                            value: '1.0'
                      module:
                        api_name: Leads
                        id: '5725767000000002175'
                      description: Protected Data
                      body:
                        raw_data_content: |-
                          {
                            "lead_id": "${!Leads.Id}",
                            "email": "${!Leads.Email}",
                            "owner": "${!Leads.Owner}",
                            "source": "website",
                            "version": "1.0"
                          }
                        format: JSON
                        type: raw
                      url: >-
                        https://webhook.site/3588de27-e3bd-4237-894b-f140143f3d99
                      feature_type: workflow
                      http_method: POST
                      name: Zoho's Data
                      authentication:
                        type: general
                description: >-
                  Shows a webhook bulk update request with all required fields
                  including name, module, url, http_method, authentication, and
                  feature_type.
      responses:
        '200':
          description: >-
            Returns the success response for the webhook update operation,
            including the updated webhook ID in the **details** object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateWebhookSuccessResponse'
              examples:
                Success200:
                  summary: Successful webhook update response
                  value:
                    webhooks:
                      - code: SUCCESS
                        details:
                          id: '5725767000007098001'
                        message: webhook updated successfully
                        status: success
                  description: >-
                    Shows a successful response confirming the webhook update
                    completed, with the operation status code and the webhook ID
                    in the details object.
        '400':
          description: >-
            One or more request body fields are invalid. Returned for validation
            errors including invalid module ID, unsupported HTTP method,
            malformed URL, SSRF-protected URL, unsupported feature type,
            duplicate parameter names, module change attempt, and data type or
            length violations.


            **Resolution:** All required fields must be present in the request
            body, and each field value must match the expected type, format, and
            allowed values for this operation. The module field cannot be
            changed after webhook creation.
          content:
            application/json:
              schema:
                x-zs-$id: PutWebhooksBulkInvalidDataErrorResponseSchema
                oneOf:
                  - type: object
                    x-zs-$id: PutWebhooksBulkInvalidRequestBodyError
                    additionalProperties: false
                    description: >-
                      Wrapped error response where the webhooks property is an
                      array containing a single error object, returned for most
                      field-level validation errors in the bulk update request.
                    properties:
                      webhooks:
                        type: array
                        description: >-
                          Represents the array containing the error object for
                          the invalid webhook in the bulk update response.
                        items:
                          oneOf:
                            - $ref: '#/components/schemas/InvalidModuleIdError'
                            - $ref: >-
                                #/components/schemas/AmbiguityProcessingErrorResponse
                            - $ref: '#/components/schemas/InvalidNameErrorResponse'
                            - $ref: >-
                                #/components/schemas/NameLimitExceededErrorResponse
                            - $ref: >-
                                #/components/schemas/InvalidMethodTypeErrorResponse
                            - $ref: '#/components/schemas/InvalidUrlErrorResponse'
                            - $ref: >-
                                #/components/schemas/InvalidDateFormatErrorResponse
                            - $ref: >-
                                #/components/schemas/InvalidTimezoneErrorResponse
                            - $ref: >-
                                #/components/schemas/InvalidDateTimeFormatErrorResponse
                            - $ref: '#/components/schemas/InvalidWebhookIdError'
                            - $ref: >-
                                #/components/schemas/UnsupportedMergeFieldErrorResponse
                            - $ref: '#/components/schemas/DuplicateDataErrorResponse'
                            - $ref: >-
                                #/components/schemas/AuthorizationDependentMismatchError
                            - $ref: >-
                                #/components/schemas/ParameterNameValueMandatoryError
                            - $ref: '#/components/schemas/HttpMethodMandatoryError'
                            - $ref: '#/components/schemas/InvalidConnectionNameError'
                            - $ref: >-
                                #/components/schemas/HttpMethodDependentMismatchError
                            - $ref: >-
                                #/components/schemas/ReadOnlyWebhookNotAllowedError
                            - $ref: '#/components/schemas/InvalidDataTypeError'
                            - $ref: '#/components/schemas/InvalidDataMaxLengthError'
                            - $ref: '#/components/schemas/MandatoryFieldMissingError'
                            - $ref: '#/components/schemas/ModuleChangeNotAllowedError'
                            - $ref: >-
                                #/components/schemas/KioskNameChangeNotAllowedError
                          description: >-
                            Represents an individual webhook validation error,
                            indicating which field failed validation and the
                            associated error code and message.
                        maxItems: 25
                    required:
                      - webhooks
                  - $ref: '#/components/schemas/MarketplaceWebhookNotAllowedError'
                  - type: object
                    x-zs-$id: PutWebhooksBulkMandatoryFieldMissingWrappedError
                    additionalProperties: false
                    description: >-
                      Represents the error returned when a field value has an
                      incorrect data type. The **webhooks** property contains
                      the error object directly.
                    properties:
                      webhooks:
                        $ref: '#/components/schemas/MandatoryFieldMissingError'
                    required:
                      - webhooks
                  - type: object
                    x-zs-$id: PutWebhooksBulkInvalidDataTypeWrappedError
                    additionalProperties: false
                    description: >-
                      Represents the error returned when a field value exceeds
                      the maximum allowed character length. The **webhooks**
                      property contains the error object directly.
                    properties:
                      webhooks:
                        $ref: '#/components/schemas/InvalidDataTypeError'
                    required:
                      - webhooks
                  - type: object
                    x-zs-$id: PutWebhooksBulkInvalidDataMaxLengthWrappedError
                    additionalProperties: false
                    description: >-
                      Represents the error returned when a field value is not
                      among the supported values. The **webhooks** property
                      contains the error object directly.
                    properties:
                      webhooks:
                        $ref: '#/components/schemas/InvalidDataMaxLengthError'
                    required:
                      - webhooks
                  - type: object
                    x-zs-$id: PutWebhooksBulkInvalidDataSupportedValuesWrappedError
                    additionalProperties: false
                    description: >-
                      Represents the error returned when a field value is not
                      among the accepted values for that field. The **webhooks**
                      property contains the error object directly, not wrapped
                      in an array.
                    properties:
                      webhooks:
                        $ref: '#/components/schemas/InvalidDataSupportedValuesError'
                    required:
                      - webhooks
                description: >-
                  Contains the error response for an invalid webhook update
                  request. The schema is a union of specific error variants
                  covering field-level validation, data type, length, and
                  supported value violations.
              examples:
                InvalidDataResponse1:
                  summary: INVALID_DATA error for invalid module.ID value
                  value:
                    webhooks:
                      - code: INVALID_DATA
                        details:
                          api_name: id
                          json_path: $.webhooks[0].module.id
                        message: the module id given seems to be invalid
                        status: error
                  description: >-
                    Demonstrates the INVALID_DATA error when the module.ID value
                    does not correspond to a valid CRM module.
                AmbiguityDuringProcessingResponse1:
                  summary: Ambiguity error when module ID and api_name conflict
                  value:
                    webhooks:
                      - code: AMBIGUITY_DURING_PROCESSING
                        details:
                          ambiguity_due_to:
                            - api_name: id
                              json_path: $.webhooks[0].module.id
                            - api_name: api_name
                              json_path: $.webhooks[0].module.api_name
                        message: Ambiguity while processing the request
                        status: error
                  description: >-
                    Demonstrates the error when the module ID and api_name refer
                    to different modules.
                InvalidDataResponse2:
                  summary: INVALID_DATA error for special characters in webhook name
                  value:
                    webhooks:
                      - code: INVALID_DATA
                        details:
                          api_name: name
                        message: Special characters not allowed
                        status: error
                  description: >-
                    Demonstrates the INVALID_DATA error when the webhook name
                    contains special characters that are not permitted.
                InvalidDataResponse3:
                  summary: INVALID_DATA name length exceeded error for webhook name
                  value:
                    webhooks:
                      - code: INVALID_DATA
                        details:
                          maximum_length: 250
                          api_name: name
                          json_path: $.webhooks[0].name
                        message: The lenght of name has exceeded the limit
                        status: error
                  description: >-
                    Demonstrates the INVALID_DATA error when the webhook name
                    exceeds the maximum allowed character length.
                InvalidDataResponse4:
                  summary: INVALID_DATA error for unsupported http_method value
                  value:
                    webhooks:
                      - code: INVALID_DATA
                        details:
                          api_name: http_method
                          json_path: $.webhooks[0].http_method
                        message: The method type given is invalid
                        status: error
                  description: >-
                    Demonstrates the INVALID_DATA error when the http_method
                    value is not a supported HTTP method for webhook operations.
                InvalidDataResponse5:
                  summary: INVALID_DATA error for invalid webhook URL
                  value:
                    webhooks:
                      - code: INVALID_DATA
                        details:
                          api_name: url
                          json_path: $.webhooks[0].url
                        message: please enter a valid URL
                        status: error
                  description: >-
                    Demonstrates the INVALID_DATA error when the url field value
                    is not a valid URL.
                InvalidDataResponse6:
                  summary: INVALID_DATA error for invalid date_format value
                  value:
                    webhooks:
                      - code: INVALID_DATA
                        details:
                          api_name: date_format
                          json_path: $.webhooks[0].date_time_format.date_format
                        message: The Date given is invalid
                        status: error
                  description: >-
                    Demonstrates the INVALID_DATA error when the
                    date_time_format.date_format value is invalid.
                InvalidDataResponse7:
                  summary: INVALID_DATA error for invalid time_zone value
                  value:
                    webhooks:
                      - code: INVALID_DATA
                        details:
                          api_name: time_zone
                          json_path: $.webhooks[0].date_time_format.time_zone
                        message: The timezone given is invalid
                        status: error
                  description: >-
                    Demonstrates the INVALID_DATA error when the
                    date_time_format.time_zone value is not a supported timezone
                    identifier.
                InvalidDataResponse8:
                  summary: INVALID_DATA error for invalid datetime_format value
                  value:
                    webhooks:
                      - code: INVALID_DATA
                        details:
                          api_name: datetime_format
                          json_path: $.webhooks[0].date_time_format.datetime_format
                        message: The date time format given is invalid
                        status: error
                  description: >-
                    Demonstrates the INVALID_DATA error when the
                    date_time_format.datetime_format value is invalid.
                InvalidDataResponse9:
                  summary: >-
                    INVALID_DATA error for invalid webhook ID in the request
                    body
                  value:
                    webhooks:
                      - code: INVALID_DATA
                        details:
                          api_name: id
                          json_path: $.webhooks[0].id
                        message: The ID given is invalid
                        status: error
                  description: >-
                    Demonstrates the INVALID_DATA error when the webhook ID in
                    the request body does not match an existing webhook.
                InvalidDataResponse10:
                  summary: INVALID_DATA error for unsupported merge field in headers
                  value:
                    webhooks:
                      - code: INVALID_DATA
                        details:
                          api_name: value
                          json_path: $.webhooks[0].headers.module_parameters[0].value
                        message: Unsupported fields are present
                        status: error
                  description: >-
                    Demonstrates the INVALID_DATA error when the
                    headers.module_parameters value contains an unsupported
                    merge field.
                DuplicateDataResponse1:
                  summary: Duplicate parameter name error in module_parameters
                  value:
                    webhooks:
                      - code: DUPLICATE_DATA
                        details:
                          api_name: name
                          json_path: $.webhooks[0].headers.module_parameters[1].name
                        message: duplicate parameter name found
                        status: error
                  description: >-
                    Demonstrates the error when two or more parameter entries in
                    module_parameters or custom_parameters share the same name.
                DependentMismatchResponse1:
                  summary: >-
                    Dependent mismatch error for incompatible authentication
                    type
                  value:
                    webhooks:
                      - code: DEPENDENT_MISMATCH
                        details:
                          dependee:
                            api_name: connection_name
                            json_path: $.webhooks[0].authentication.connetion_name
                          api_name: type
                          json_path: $.webhooks[0].authentication.type
                        message: provide appropriate authentication type
                        status: error
                  description: >-
                    Demonstrates the error when request body fields are
                    incompatible with the chosen http_method.
                MandatoryNotFoundResponse1:
                  summary: MANDATORY_NOT_FOUND error for missing required field
                  value:
                    webhooks:
                      - code: MANDATORY_NOT_FOUND
                        details:
                          api_name: value
                          json_path: $.webhooks[0].headers.custom_parameters[0].value
                        message: >-
                          the given parameter is invalid, specify both name and
                          value
                        status: error
                  description: >-
                    Demonstrates the MANDATORY_NOT_FOUND error when a required
                    parameter or field is missing from the request body.
                MandatoryNotFoundResponse2:
                  summary: >-
                    MANDATORY_NOT_FOUND error for missing parameter name or
                    value
                  value:
                    webhooks:
                      - code: MANDATORY_NOT_FOUND
                        details:
                          api_name: name
                          json_path: $.webhooks[0].headers.module_parameters[0].name
                        message: >-
                          the given parameter is invalid, specify both name and
                          value
                        status: error
                  description: >-
                    Demonstrates the MANDATORY_NOT_FOUND error when a parameter
                    entry is missing its required name or value fields.
                MandatoryNotFoundResponse3:
                  summary: MANDATORY_NOT_FOUND error for missing http_method field
                  value:
                    webhooks:
                      - code: MANDATORY_NOT_FOUND
                        details:
                          api_name: http_method
                          json_path: $.webhooks[0].http_method
                        message: 'The method type is not given '
                        status: error
                  description: >-
                    Demonstrates the MANDATORY_NOT_FOUND error when the
                    http_method field is absent from the request body.
                InvalidDataResponse11:
                  summary: >-
                    INVALID_DATA error for invalid
                    authentication.connection_name
                  value:
                    webhooks:
                      - code: INVALID_DATA
                        details:
                          api_name: connection_name
                          json_path: $.webhooks[0].authentication.connetion_name
                        message: Please provide valid connection name
                        status: error
                  description: >-
                    Demonstrates the INVALID_DATA error when the
                    authentication.connection_name value is not valid.
                DependentMismatchResponse2:
                  summary: >-
                    Dependent mismatch error for incompatible HTTP method and
                    headers
                  value:
                    webhooks:
                      - code: DEPENDENT_MISMATCH
                        details:
                          dependee:
                            api_name: headers
                            json_path: $.webhooks[0].headers
                          api_name: http_method
                          json_path: $.webhooks[0].http_method
                        message: Invalid value provided for the given http method
                        status: error
                  description: >-
