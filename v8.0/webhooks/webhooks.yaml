            Possible values:

            **POST** - Sends a POST request.

            **GET** - Sends a GET request.

            **PUT** - Sends a PUT request.

            **DELETE** - Sends a DELETE request.
          enum:
            - POST
            - GET
            - PUT
            - DELETE
        authentication:
          $ref: '#/components/schemas/WebhookAuthenticationDetails'
          description: >-
            Authentication configuration. Required for all webhooks, including
            those without authentication credentials. Use type=general for
            webhooks that do not require authentication (no connection_name
            needed). Use type=connection when the webhook endpoint requires
            authenticated access via a pre-configured connection
            (connection_name is required).
        description:
          type:
            - string
            - 'null'
          description: Specify the optional description of the webhook purpose.
          maxLength: 500
          example: Fires when a new lead is created
        related_module:
          type:
            - object
            - 'null'
          $ref: '#/components/schemas/RelatedModuleReference'
          description: >-
            Related CRM module. Required when feature_type is kiosk. Null
            otherwise.
        feature_type:
          type: string
          description: |-
            Specify the automation feature type for this webhook.
            Possible values:
            **workflow** - Workflow Rule.
            **approval_process** - Approval Process.
            **blueprint_transition** - Blueprint transition.
            **blueprint_state** - Blueprint state.
            **assignment_rules** - Assignment Rules.
            **kiosk** - Kiosk feature.
            **commandcenter_service** - CommandCenter service.
          enum:
            - workflow
            - approval_process
            - blueprint_transition
            - blueprint_state
            - assignment_rules
            - kiosk
            - commandcenter_service
          maxLength: 255
          example: workflow
        headers:
          $ref: '#/components/schemas/WebhookHeaders'
          description: >-
            HTTP headers for the outgoing webhook request. Only allowed when
            http_method is POST, PUT, or DELETE. Restricted header name: HOST is
            not allowed. Parameter names must be unique across the collection
            (DUPLICATE_DATA).
        url_parameters:
          $ref: '#/components/schemas/WebhookUrlParameters'
          description: >-
            URL query parameters for the outgoing request. Only allowed when
            http_method is GET or DELETE.
        body:
          $ref: '#/components/schemas/WebhookRequestBody'
          description: >-
            Request body configuration. Only allowed when http_method is POST or
            PUT. type and format are required. When type=form_data: provide
            form_data_content (object with module_parameters and
            custom_parameters arrays); When type=raw: provide raw_data_content
            (string) and format (JSON, XML, Text, or HTML). When type=none:
            format may be null.
        date_time_format:
          $ref: '#/components/schemas/DateTimeFormatConfig'
          description: >-
            Optional. Only relevant when a date or datetime merge-field is used
            in any parameter (headers, url_parameters, or body). Use
            datetime_format + time_zone when a datetime field is referenced
            (e.g., ${!Leads.Created_Time}). Use date_format when a date field is
            referenced (e.g., ${!Leads.Date_1}). Ignored if no date/datetime
            merge-fields are present.
      required:
        - name
        - module
        - url
        - http_method
        - authentication
        - feature_type
    WebhookUpdateInput:
      x-zs-$id: WebhookUpdateInput
      type: object
      additionalProperties: false
      description: >-
        Represents the writable fields for updating an existing webhook.
        Full-replacement semantics apply all required fields must be present, as
        omitted fields reset to defaults or null. 


        The module field is immutable; providing a different module returns
        NOT_ALLOWED. System-managed read-only fields must be omitted.
      x-zs-llm-description: >-
        Defines the writable fields when updating a webhook. Start by calling
        GET /settings/automation/webhooks/{webhookId} to read the current state.
        All required fields (name, module, url, http_method, authentication,
        feature_type) must be included  partial updates are not supported.
        Module is immutable and returns NOT_ALLOWED if changed. System-managed
        read-only fields must be omitted.
      properties:
        id:
          type: string
          description: >-
            Represents the unique identifier of the webhook to update. The ID is
            required in the request body when using the bulk update endpoint.
          maxLength: 20
          example: '5725767000007186002'
        name:
          type: string
          description: >-
            Specify the display name of the webhook. The name must not contain
            the tilde (~) character. The name cannot be changed for kiosk
            feature actions.
          maxLength: 250
        module:
          $ref: '#/components/schemas/AutomationModuleDetailsResponse'
          description: >-
            The CRM module. Cannot be changed  - providing a different module
            returns NOT_ALLOWED.
        url:
          type: string
          description: >-
            Specify the destination URL that receives the webhook request when
            triggered. The URL must begin with http://, https://, www., or a
            merge-field token (${...}). URLs resolving to internal or private
            host addresses are rejected by SSRF protection.
          maxLength: 2000
        http_method:
          type: string
          description: |-
            Specify the HTTP method used when the webhook fires.
            Possible values:
            **POST** - Sends a POST request.
            **GET** - Sends a GET request.
            **PUT** - Sends a PUT request.
            **DELETE** - Sends a DELETE request.
          enum:
            - POST
            - GET
            - PUT
            - DELETE
        authentication:
          $ref: '#/components/schemas/WebhookAuthenticationDetails'
          description: Authentication configuration.
        description:
          type:
            - string
            - 'null'
          description: Specify the optional description of the webhook purpose.
          maxLength: 500
        related_module:
          type:
            - object
            - 'null'
          $ref: '#/components/schemas/RelatedModuleReference'
          description: Related CRM module. Required when feature_type is kiosk.
        feature_type:
          type: string
          description: |-
            Specify the automation feature type for this webhook.
            Possible values:
            **workflow** - Workflow Rule.
            **approval_process** - Approval Process.
            **blueprint_transition** - Blueprint transition.
            **blueprint_state** - Blueprint state.
            **assignment_rules** - Assignment Rules.
            **kiosk** - Kiosk feature.
            **commandcenter_service** - CommandCenter service.
          enum:
            - workflow
            - approval_process
            - blueprint_transition
            - blueprint_state
            - assignment_rules
            - kiosk
            - commandcenter_service
          maxLength: 255
        headers:
          $ref: '#/components/schemas/WebhookHeaders'
          description: >-
            HTTP headers. Only allowed when http_method is POST, PUT, or DELETE.
            Restricted header name: HOST is not allowed. Parameter names must be
            unique (DUPLICATE_DATA).
        url_parameters:
          $ref: '#/components/schemas/WebhookUrlParameters'
          description: >-
            URL query parameters. Only allowed when http_method is GET or
            DELETE.
        body:
          $ref: '#/components/schemas/WebhookRequestBody'
          description: >-
            Request body. Only allowed when http_method is POST or PUT. type and
            format are required. When type=form_data: provide form_data_content
            (object with module_parameters and custom_parameters arrays); format
            may be null. When type=raw: provide raw_data_content (string) and
            format (JSON, XML, Text, or HTML). When type=none: format may be
            null.
        date_time_format:
          $ref: '#/components/schemas/DateTimeFormatConfig'
          description: >-
            Optional. Only relevant when a date or datetime merge-field is used
            in any parameter (headers, url_parameters, or body). Use
            datetime_format + time_zone for datetime fields, date_format for
            date fields. Ignored if no date/datetime merge-fields are present.
      required:
        - name
        - module
        - url
        - http_method
        - authentication
        - feature_type
    InvalidWebhookIdPathError:
      x-zs-$id: InvalidWebhookIdPathError
      type: object
      additionalProperties: false
      description: >-
        Represents the error returned when the webhook ID in the URL path is
        invalid or does not match an existing webhook.
      x-zs-llm-description: The webhook ID in the URL path is invalid or does not exist.
      properties:
        code:
          type: string
          description: >-
            Represents the error code for this failure.

            Possible values:

            **INVALID_DATA** - The webhook ID provided in the path parameter is
            not valid.
          enum:
            - INVALID_DATA
        details:
          type: object
          additionalProperties: false
          description: >-
            Represents the error details identifying the resource with the
            invalid webhook ID.
          properties:
            resource_path_index:
              type: integer
              format: int32
              description: >-
                Represents the index of the invalid resource in the request URL
                path.
        message:
          type: string
          description: >-
            Represents the error message describing the failure.

            Possible values:

            **the id given seems to be invalid** - The webhook ID in the path
            does not match any existing webhook record.
          enum:
            - the id given seems to be invalid
        status:
          type: string
          description: |-
            Represents the error status.
            Possible values:
            **error** - Indicates the request did not complete successfully.
          enum:
            - error
      required:
        - code
        - details
        - message
        - status
    BulkDeleteReadOnlyNotAllowedError:
      x-zs-$id: BulkDeleteReadOnlyNotAllowedError
      type: object
      additionalProperties: false
      description: >-
        Represents the error entry in a bulk delete response when a webhook in
        the request is read-only and cannot be deleted.
      x-zs-llm-description: >-
        Bulk delete entry failed  the webhook is read-only and cannot be
        deleted.
      properties:
        code:
          type: string
          description: |-
            Represents the error code for this failure.
            Possible values:
            **NOT_ALLOWED** - The webhook is read-only and cannot be deleted.
          enum:
            - NOT_ALLOWED
        details:
          type: object
          additionalProperties: false
          description: >-
            Represents the error details containing the ID of the read-only
            webhook that cannot be deleted.
          properties:
            id:
              type: string
              description: >-
                Represents the ID of the read-only webhook that cannot be
                deleted.
              maxLength: 20
        message:
          type: string
          description: >-
            Represents the error message describing the failure.

            Possible values:

            **Insufficient privileges to delete Read only webhook** - The
            webhook is read-only and cannot be deleted by the requesting user.
          enum:
            - Insufficient privileges to delete Read only webhook
        status:
          type: string
          description: |-
            Represents the error status.
            Possible values:
            **error** - Indicates the request did not complete successfully.
          enum:
            - error
      required:
        - code
        - details
        - message
        - status
    BulkDeleteAssociatedNotAllowedError:
      x-zs-$id: BulkDeleteAssociatedNotAllowedError
      type: object
      additionalProperties: false
      description: >-
        Represents the error entry in a bulk delete response when a webhook in
        the request is associated with active automation rules and cannot be
        deleted.
      x-zs-llm-description: >-
        Bulk delete entry failed  the webhook is associated with rules and
        cannot be deleted.
      properties:
        code:
          type: string
          description: >-
            Represents the error code for this failure.

            Possible values:

            **NOT_ALLOWED** - The requested operation is not allowed because the
            webhook is associated with an active automation rule.
          enum:
            - NOT_ALLOWED
        details:
          type: object
          additionalProperties: false
          description: >-
            Represents the error details containing the ID of the webhook that
            cannot be deleted.
          properties:
            id:
              type: string
              description: Represents the ID of the webhook that cannot be deleted.
              maxLength: 20
        message:
          type: string
          description: >-
            Represents the error message describing the failure.

            Possible values:

            **This webhook is associated with at least one of Approval
            Process/Workflow Rules/Blueprint** - The webhook cannot be deleted
            because it is actively associated with one or more automation rules.
          enum:
            - >-
              This webhook is associated with at least one of Approval
              Process/Workflow Rules/Blueprint
        status:
          type: string
          description: |-
            Represents the error status.
            Possible values:
            **error** - Indicates the request did not complete successfully.
          enum:
            - error
      required:
        - code
        - details
        - message
        - status
    AutomationUsageResource:
      x-zs-$id: AutomationUsageResource
      type: object
      additionalProperties: false
      description: >
        Represents a reference to the specific automation action that generated
        usage. The identifier and name are resolved from the action's
        configuration record; for deleted actions, the name falls back to the
        corresponding automation audit log entry. When the include_inner_details
        parameter includes resource.layout_id and the action is associated with
        a wizard layout, a layout_id field is included in the representation.
      properties:
        id:
          type: string
          description: >-
            Represents the unique identifier of the automation action, such as
            an email notification ID or a webhook ID.
          maxLength: 20
          example: '5586800000123001'
        name:
          type: string
          description: >
            Represents the display name of the automation action. Falls back to
            the name recorded in the automation audit log when the action has
            been deleted.
          maxLength: 255
          example: Notify Deal Owner
        layout_id:
          type: string
          description: >-
            Represents the identifier of the wizard layout associated with the
            automation action. Present only when the include_inner_details query
            parameter is set to resource.layout_id and the action is linked to a
            wizard layout.
          maxLength: 20
          example: '738964000000100045'
      title: Automation Usage Resource
    AutomationUsageDataEntry:
      x-zs-$id: AutomationUsageDataEntry
      type: object
      additionalProperties: false
      description: >
        Represents a single daily usage data point capturing the execution count
        for an automation action. When the group_by parameter includes resource,
        the embedded resource object identifies the individual email
        notification or webhook. When group_by is date only, the resource object
        is omitted and the count reflects total executions across all actions
        for that day. The type field indicates the automation feature
        responsible for the executions, such as workflow_rules,
        approval_process, or Blueprint.
      properties:
        date:
          type: string
          description: >-
            Represents the date of this usage data point in YYYY-MM-DD format.
            All dates are evaluated in the organization's time zone.
          format: date
          maxLength: 10
          example: '2025-10-23'
        resource:
          $ref: '#/components/schemas/AutomationUsageResource'
          description: >-
            Reference to the specific automation action (email notification or
            webhook) that generated the usage count. Only present when group_by
            includes 'resource'.
        count:
          type: integer
          format: int32
          description: >-
            Represents the number of times the automation action was executed on
            this date. When the group_by parameter is set to 'date' only, this
            value reflects the total across all actions.
          minimum: 0
        type:
          type: string
          description: >
            Represents the automation feature type associated with the reported
            executions. Values correspond to the filter types supported by the
            type query parameter, such as workflow_rules, approval_process,
            Blueprint, email_notifications, webhooks, and kiosks.
          maxLength: 50
      title: Automation Usage Data Entry
    AutomationUsagePaginationInfo:
      x-zs-$id: AutomationUsagePaginationInfo
      type: object
      additionalProperties: false
      description: >-
        Represents pagination metadata returned with automation usage report
        responses. Includes a max_limit value that reflects the edition-specific
        daily execution cap for the relevant action type, derived from the
        organization's feature limits.
      properties:
        per_page:
          type: integer
          format: int32
          description: >-
            Represents the number of records returned in each page of the result
            set.
          minimum: 1
          maximum: 200
          example: 200
        count:
          type: integer
          format: int32
          description: >-
            Represents the number of records included in the current page of
            results.
          minimum: 0
          example: 4
        page:
          type: integer
          format: int32
          description: >-
            Represents the one-based index of the current page within the
            paginated result set.
          minimum: 1
          example: 1
        more_records:
          type: boolean
          description: >-
            Indicates whether additional pages of results are available beyond
            the current page.

            Possible values:

            true - More records exist beyond the current page.

            false - The current page contains the last records.
          example: false
        max_limit:
          type: integer
          format: int32
          description: >-
            Represents the edition-specific daily execution cap for the
            automation action type. For email notifications, this reflects the
            WORKFLOWALERT day limit; for webhooks, it reflects the WFWEBHOOK day
            limit. Lower-tier editions carry smaller caps.
          minimum: 0
          example: 2500
      title: Automation Usage Pagination Info
    AutomationUsageReportResponse:
      x-zs-$id: AutomationUsageReportResponse
      type: object
      additionalProperties: false
      description: >
        Represents a successful response from an automation usage report
        endpoint. Contains an array of daily usage data points alongside
        pagination metadata that includes the edition-specific daily execution
        cap. When no usage exists for the queried period, the endpoint returns
        an empty data array rather than null, and the response resolves with
        HTTP 200.
      properties:
        data_usage:
          type: array
          description: >-
            Contains the collection of usage data points for the queried period.
            Each entry represents the execution count for a specific automation
            action on a given date. Returns an empty array when no usage exists
            for the queried period.
          items:
            $ref: '#/components/schemas/AutomationUsageDataEntry'
          maxItems: 200
        info:
          $ref: '#/components/schemas/AutomationUsagePaginationInfo'
          description: >-
            Pagination metadata including the edition-specific daily execution
            cap.
      title: Automation Usage Report Response
    AutomationUsageRequiredParamMissingError:
      x-zs-$id: AutomationUsageRequiredParamMissingError
      type: object
      additionalProperties: false
      description: >
        Represents the error structure returned when the group_by query
        parameter is omitted from the request. All automation usage report
        endpoints require group_by to be present and to include date as a
        mandatory grouping dimension.
      properties:
        code:
          type: string
          description: >-
            Indicates the error classification for a missing required parameter.

            Possible values:

            REQUIRED_PARAM_MISSING - A mandatory query parameter was omitted
            from the request.
          enum:
            - REQUIRED_PARAM_MISSING
        details:
          type: object
          additionalProperties: false
          description: >
            Contains details about the missing request parameter that caused the
            error.
          properties:
            param_name:
              type: string
              description: >-
                Indicates the name of the required parameter that was absent
                from the request.

                Possible values:

                group_by - The group_by parameter was not included in the
                request.
              enum:
                - group_by
        message:
          type: string
          description: >
            Represents a descriptive message explaining the error that caused
            the request to fail.
          example: One of the expected param is missing
          maxLength: 255
        status:
          type: string
          description: >
            Represents the outcome classification of the response.

            Possible values:

            error - The request was not processed due to a missing required
            parameter.
          enum:
            - error
      required:
        - code
        - details
        - message
        - status
      title: Automation Usage Required Param Missing Error
    AutomationUsageInvalidDataError:
      x-zs-$id: AutomationUsageInvalidDataError
      type: object
      additionalProperties: false
      description: >-
        Represents the error envelope returned when an invalid value is supplied
        for a usage report query parameter. The details object identifies which
        parameter is invalid. Common causes include an unsupported type filter
        value, an invalid group_by combination, a malformed date, an invalid
        sort_order, or a non-numeric page or per_page value.
      properties:
        code:
          type: string
          description: >-
            Represents the error code identifying the invalid-data condition.

            Possible values:

            INVALID_DATA - The value supplied for the identified query parameter
            is not valid.
          enum:
            - INVALID_DATA
        details:
          type: object
          additionalProperties: false
          description: |
            Contains details about the query parameter that failed validation.
          properties:
            param_name:
              type: string
              description: >-
                Represents the name of the query parameter that carried the
                invalid value, such as type, group_by, date, sort_order, page,
                or per_page.
              maxLength: 50
        message:
          type: string
          description: >
            Represents a descriptive message explaining the error that caused
            the request to fail.
          example: provided param is invalid
          maxLength: 255
        status:
          type: string
          description: |
            Represents the outcome classification of the response.
            Possible values:
            error - The request was not processed due to invalid input.
          enum:
            - error
      required:
        - code
        - details
        - message
        - status
      title: Automation Usage Invalid Data Error
    AutomationUsageNoPermissionError:
      x-zs-$id: AutomationUsageNoPermissionError
      type: object
      additionalProperties: false
      description: >
        Represents the error structure returned when the authenticated user
        lacks the required Manage Automation Actions privilege, or when the
        requested feature — email notifications or webhooks — is not available
        in the organization's current edition.
      properties:
        code:
          type: string
          description: >-
            Represents the error code identifying the permission-denied
            condition.

            Possible values:

            NO_PERMISSION - The user lacks the required privilege or the feature
            is unavailable in the current edition.
          enum:
            - NO_PERMISSION
        details:
          type: object
          additionalProperties: false
          description: >-
            Contains details about the missing permission or unavailable feature
            that caused the error.
          properties:
            permissions:
              type: array
              description: >-
                Contains the list of required permissions that the caller lacks
                and that prevented the request from succeeding.
              items:
                type: string
                description: >-
                  Represents a permission identifier denoting a specific access
                  right required to perform the requested operation.
                maxLength: 255
              maxItems: 5
        message:
          type: string
          description: >
            Represents a descriptive message explaining the error that caused
            the request to fail.
          example: permission denied
          maxLength: 255
        status:
          type: string
          description: |
            Represents the outcome classification of the response.
            Possible values:
            error - The request was denied due to insufficient permission.
          enum:
            - error
      required:
        - code
        - details
        - message
        - status
      title: Automation Usage No Permission Error
  parameters:
    ParamQueryRelatedModule:
      name: related_module
      in: query
      description: >-
        Specify the API name of a child or dependent module linked to the parent
        module (for example, Notes or Attachments). When omitted, webhooks
        across all related modules are returned.
      required: false
      schema:
        type: string
        example: Notes
        maxLength: 100
    ParamQueryTo:
      name: to
      in: query
      description: >-
        Specify the end date (inclusive) for the query window in YYYY-MM-DD
        format, evaluated in the organization's time zone. Defaults to the
        current date at 23:59:59 when omitted. Must be on or after the **from**
        date. Future dates are rejected.
      required: false
      schema:
        type: string
        format: date
        maxLength: 10
        example: '2025-01-31'
    ParamQueryPerPage:
      name: per_page
      in: query
      description: >-
        Specify the number of records to return per page. Default and maximum is
        **200**.
      required: false
      schema:
        type: integer
        format: int32
        example: 200
        minimum: 1
        maximum: 200
    ParamQueryWebhookId:
      name: webhook_id
      in: query
      description: >-
        Specify the unique identifier of the webhook whose failure records to
        retrieve. Refer to the [Get
        Webhooks](webhooks.yaml#$.paths./settings/automation/webhooks.get)
        resource for valid values. When omitted, failure records for all
        webhooks are returned.
      required: false
      schema:
        type: string
        example: '5249735000000100001'
        maxLength: 20
    ParamQueryFilters:
      name: filters
      in: query
      description: >-
        Specify the JSON filter expression to narrow webhook results by name.
        The object must include field (with api_name), comparator, and value
        keys. The only supported comparator is contains, which performs a
        case-insensitive partial match on the webhook name.
      required: false
      schema:
        type: string
        example: '{"field":{"api_name":"name"},"comparator":"contains","value":"Lead"}'
        maxLength: 1000
    ParamQueryType:
      name: type
      in: query
      description: >-
        Specify the automation feature type to filter usage data. When omitted,
        usage across all supported feature types is returned.

        Possible values:

        **workflow_rules** - Workflow Rules.

        **approval_process** - Approval Process.

        **blueprint** - Blueprint.

        **orchestrations** - Orchestrations.

        **wizards** - Wizards.

        **modules** - Modules.

        **webhooks** - Webhooks.

        **kiosks** - Kiosks.
      required: false
      schema:
        type: string
        enum:
          - workflow_rules
          - approval_process
          - blueprint
          - orchestrations
          - wizards
          - modules
          - webhooks
          - kiosks
        maxLength: 50
    ParamQuerySortBy:
      name: sort_by
      in: query
      description: >-
        Specify the field used to sort the webhook list. Currently only
        Modified_Time is accepted.

        Possible values:

        **Modified_Time** - Sort by the last modified timestamp.
      required: false
      schema:
        type: string
        enum:
          - Modified_Time
    ParamQueryGroupBy:
      name: group_by
      in: query
      description: >-
        Specify the grouping criteria for usage data. Must include date.

        Possible values:

        **date** - Returns daily totals; the resource object is omitted from
        each row.

        **date,resource** - Returns per-action rows including resource.id and
        resource.name.

        **date,resource,type** - Returns per-action rows grouped by resource and
        type.
      required: true
      schema:
        type: string
        enum:
          - date
          - date,resource
          - date,resource,type
        maxLength: 100
    ParamQueryPage:
      name: page
      in: query
      description: >-
        Specify the page number for paginated results. Defaults to 1 when
        omitted. Use together with per_page to navigate large result sets.
      required: false
      schema:
        type: integer
        format: int32
        example: 1
        minimum: 1
    ParamQueryFrom:
      name: from
      in: query
      description: >-
        Specify the start date (inclusive) for the query window in YYYY-MM-DD
        format, evaluated in the organization's time zone. For webhook_failures,
        defaults to 30 days before **to**; earlier dates are clamped to that
        30-day window. For usage_reports, defaults to 30 days before **to**.
        Future dates return 400 INVALID_DATA.
      required: false
      schema:
        type: string
        format: date
        maxLength: 10
        example: '2025-01-01'
    ParamQueryFeatureType:
      name: feature_type
      in: query
      description: >-
        Specify the automation feature type to filter webhooks. When omitted,
        webhooks of all feature types are returned.

        Possible values:

        **workflow** - Workflow Rule.

        **approval_process** - Approval Process.

        **blueprint_transition** - Blueprint transition.

        **blueprint_state** - Blueprint state.

        **assignment_rules** - Assignment Rules.

        **kiosk** - Kiosk feature.

        **commandcenter_service** - CommandCenter service.
      required: false
      schema:
        type: string
        enum:
          - workflow
          - approval_process
          - blueprint_transition
          - blueprint_state
          - assignment_rules
          - kiosk
          - commandcenter_service
    ParamQueryModule:
      name: module
      in: query
      description: >-
        Specify the API name of the parent CRM module to filter webhooks. When
        omitted, webhooks across all modules are returned. Refer to the [Get
        Modules](modules.yaml#$.paths./settings/modules.get) resource for valid
        values.
      required: false
      schema:
        type: string
        example: Leads
        maxLength: 100
    ParamQuerySortOrder:
      name: sort_order
      in: query
      description: >-
        Specify the sort direction for list results. Defaults to desc when
        omitted.

        Possible values:

        **asc** - Ascending order.

        **desc** - Descending order.
      required: false
      schema:
        type: string
        enum:
          - asc
          - desc
    ParamQueryIds:
      name: ids
      in: query
      description: >-
        Specify the comma-separated list of webhook IDs to delete. Accepts
        comma-separated values. Refer to the [Get
        Webhooks](webhooks.yaml#$.paths./settings/automation/webhooks.get)
        resource for valid values.
      required: true
      schema:
        type: string
        example: 5249735000000100001,5249735000000100002
        maxLength: 250
    ParamQueryUsageIncludeInnerDetails:
      name: include_inner_details
      in: query
      description: >-
        Specify to request additional nested fields within usage report resource
        objects. Currently, only resource.layout_id is recognized; it adds
        layout_id inside the resource object when available, primarily for
        wizard usage rows. Other values are silently ignored.
      required: false
      schema:
        type: string
        enum:
          - resource.layout_id
        maxLength: 50
  securitySchemes:
    OAuth2:
      type: oauth2
      description: OAuth2 authentication for API access
      flows:
        authorizationCode:
          authorizationUrl: https://accounts.zoho.com/oauth/v2/auth
          tokenUrl: https://accounts.zoho.com/oauth/v2/token
          refreshUrl: https://accounts.zoho.com/oauth/v2/token
          scopes:
            ZohoCRM.settings.automation_actions.CREATE: >-
              Grants permission to create new webhook automation actions in Zoho
              CRM.
            ZohoCRM.settings.automation_actions.READ: >-
              Grants permission to read and retrieve webhook automation action
              configurations and related data from Zoho CRM.
            ZohoCRM.settings.automation_actions.UPDATE: >-
              Grants permission to update existing webhook automation actions in
              Zoho CRM.
            ZohoCRM.settings.automation_actions.DELETE: >-
              Grants permission to delete webhook automation actions from Zoho
              CRM.
            ZohoCRM.settings.automation_actions.ALL: >-
              Grants full access to webhook automation actions, including read,
              create, update, and delete operations.
            ZohoCRM.settings.ALL: >-
              Grants full access to all Zoho CRM settings, including read,
              create, update, and delete operations across all settings
              resources.
