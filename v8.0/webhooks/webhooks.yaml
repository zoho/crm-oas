            - ZohoCRM.settings.automation_actions.CREATE
    delete:
      summary: Delete one or more webhooks
      description: >-
        To delete one or more webhook actions configured in your Zoho CRM
        account.


        Up to 10 webhooks can be deleted in a single API call using the **ids**
        query parameter. Read-only webhooks created by Zoho extensions cannot be
        deleted. 


        Webhooks associated with active Workflow Rules, Approval Processes, or
        Blueprints cannot be deleted.
      x-zs-llm-description: >-
        Bulk-deletes webhooks by their IDs; supply ids as a comma-separated
        query parameter (up to 10). Read-only webhooks created by extensions and
        webhooks tied to active workflow rules, approval processes, or
        blueprints all return NOT_ALLOWED. Returns 200 when all succeed or 207
        (Multi-Status) for mixed results. Use GET /settings/automation/webhooks
        to find IDs first.
      operationId: deleteWebhooks
      parameters:
        - $ref: '#/components/parameters/ParamQueryIds'
      responses:
        '200':
          description: >-
            Returns the list of operation results confirming that all specified
            webhooks were deleted successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkDeleteWebhooksSuccessResponse'
              examples:
                Success200:
                  summary: Successful bulk deletion of webhooks
                  value:
                    webhooks:
                      - code: SUCCESS
                        details:
                          id: '5249735000000100001'
                        message: Webhook is deleted
                        status: success
                      - code: SUCCESS
                        details:
                          id: '5249735000000100002'
                        message: Webhook is deleted
                        status: success
                  description: >-
                    Shows a successful bulk delete response where all specified
                    webhooks were deleted, with each entry confirming deletion
                    of a single webhook.
        '207':
          description: >-
            Returns a multi-status response. Each item in the array
            independently indicates success or failure for the corresponding
            webhook in the request. The API deleted at least one webhook and
            rejected at least one deletion.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkDeletePartialSuccessResponse'
              examples:
                Success207:
                  summary: Partial success with mixed deletion results.
                  value:
                    webhooks:
                      - code: SUCCESS
                        details:
                          id: '111111000000066004'
                        message: webhook deleted successfully
                        status: success
                      - code: NOT_ALLOWED
                        details:
                          id: '111111000000057597'
                        message: >-
                          webhook is associated with at least one of Approval
                          Process/Workflow Rules/Blueprint
                        status: error
                  description: >-
                    Shows a multi-status response for a bulk DELETE request
                    where the API deleted at least one webhook and rejected at
                    least one, with per-webhook success and error entries.
        '400':
          description: >-
            The request failed because the ids parameter is missing, more than
            10 webhook IDs were provided, or one or more webhooks cannot be
            deleted because they are read-only or associated with active
            automation rules.


            **Resolution:** Ensure the ids parameter is present, contains no
            more than 10 comma-separated webhook IDs, and that none of the
            specified webhooks are read-only or associated with active Workflow
            Rules, Approval Processes, or Blueprints.
          content:
            application/json:
              schema:
                x-zs-$id: DeleteWebhooksInvalidDataErrorResponseSchema
                oneOf:
                  - $ref: '#/components/schemas/RequiredParamMissingIdsError'
                  - $ref: '#/components/schemas/BulkDeleteLimitExceededError'
                  - type: object
                    x-zs-$id: BulkDeleteWebhooksNotAllowedWrappedError
                    additionalProperties: false
                    description: >-
                      Represents the error variant returned when one or more
                      webhooks in the bulk DELETE request cannot be deleted,
                      containing the list of per-webhook error objects.
                    properties:
                      webhooks:
                        type: array
                        description: >-
                          Represents the list of error objects for webhooks that
                          could not be deleted, where each item indicates either
                          a read-only restriction or an active automation
                          association.
                        items:
                          oneOf:
                            - $ref: >-
                                #/components/schemas/BulkDeleteReadOnlyNotAllowedError
                            - $ref: >-
                                #/components/schemas/BulkDeleteAssociatedNotAllowedError
                          description: >-
                            Represents the error details for a single webhook
                            that could not be deleted, indicating either a
                            read-only restriction or an active association with
                            Workflow Rules, Approval Processes, or Blueprints.
                        maxItems: 10
                    required:
                      - webhooks
                description: >-
                  Contains the error response when one or more bulk webhook
                  deletions fail, represented as a union of specific error
                  variants for a missing parameter, an exceeded limit, or
                  disallowed operations.
              examples:
                RequiredParamMissingResponse1:
                  summary: REQUIRED_PARAM_MISSING error for absent ids parameter.
                  value:
                    code: REQUIRED_PARAM_MISSING
                    details:
                      param_name: ids
                    message: One of the expected parameter is missing
                    status: error
                  description: >-
                    Demonstrates the REQUIRED_PARAM_MISSING error response
                    returned when the ids query parameter is absent from the
                    bulk DELETE request.
                InvalidDataResponse1:
                  summary: INVALID_DATA error for an invalid webhook ID.
                  value:
                    code: INVALID_DATA
                    details:
                      param_name: ids
