    delete:
      summary: Delete a webhook by ID
      description: >-
        To delete a specific webhook configured in your Zoho CRM organization
        using its unique ID.


        Read-only webhooks created by Marketplace extensions cannot be deleted.
        Webhooks associated with active Workflow Rules, Approval Processes,
        Blueprints, or Command Center also cannot be deleted.
      x-zs-llm-description: >-
        Removes a single webhook by the webhookId path param. Read-only webhooks
        (extension-created) and webhooks referenced by active workflow rules,
        approval processes, blueprints, or command center all return
        NOT_ALLOWED. Passing an invalid webhook ID returns INVALID_DATA. The
        response reports success or error for the deletion.
      operationId: deleteWebhooksById
      parameters:
        - name: webhookId
          in: path
          description: >-
            Specify the unique ID of the webhook to delete. Refer to the [Get
            Webhooks](webhooks.yaml#$.paths./settings/automation/webhooks.get)
            resource for valid values.
          required: true
          schema:
            type: string
            maxLength: 20
      responses:
        '200':
          description: >-
            Returns the delete operation result for the specified webhook. The
            webhooks array contains one item indicating whether Zoho CRM deleted
            the webhook successfully or why it could not be deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteWebhookByIdSuccessResponse'
              examples:
                Success200:
                  summary: Successful deletion of a single webhook by ID.
                  value:
                    webhooks:
                      - code: SUCCESS
                        details:
                          id: '5725767000007098001'
                        message: Webhook is deleted
                        status: success
                  description: >-
                    Shows a success response confirming the deleted the webhook,
                    with a success code and the webhook ID in the details
                    object.
        '400':
          description: >-
            The webhook ID is invalid, the webhook is read-only, or the webhook
            is associated with active automation rules or created by a
            Marketplace extension.


            **Resolution:** The webhook ID in the request URL must match an
            existing webhook. The webhook must not be read-only or associated
            with active Workflow Rules, Approval Processes, or Blueprints.
          content:
            application/json:
              schema:
                x-zs-$id: DeleteWebhooksByIdInvalidDataErrorResponseSchema
                oneOf:
                  - $ref: '#/components/schemas/MarketplaceWebhookNotAllowedError'
                  - $ref: '#/components/schemas/WebhookAssociatedWithRulesError'
                  - $ref: '#/components/schemas/ReadOnlyWebhookDeleteNotAllowedError'
                  - type: object
                    x-zs-$id: DeleteWebhooksByIdInvalidDataWrappedErrorResponse
                    additionalProperties: false
                    description: >-
                      Represents the error response when the webhook ID provided
                      in the request does not match any existing webhook in the
                      organization.
                    properties:
                      webhooks:
                        type: array
                        description: >-
                          Represents the array containing the error details for
                          the invalid webhook ID in a single-record DELETE
                          request.
                        items:
                          $ref: '#/components/schemas/InvalidWebhookIdError'
                        maxItems: 1
                    required:
                      - webhooks
                  - $ref: '#/components/schemas/InvalidWebhookIdPathError'
                description: >-
                  Contains the error response when a single webhook DELETE
                  request fails, covering variants for an invalid webhook ID,
                  not-allowed conditions, and Marketplace restrictions.
              examples:
                NotAllowedResponse1:
                  summary: Webhook created by a Marketplace extension cannot be deleted
                  value:
                    code: NOT_ALLOWED
                    details:
                      resource_path_index: 3
                    message: Webhook  is associated with MarketPlace
                    status: error
                  description: >-
                    Shows the error response when attempting to delete a webhook
                    created by a Marketplace extension, which cannot be deleted
                    through the API.
                NotAllowedResponse2:
                  summary: >-
                    Webhook associated with active automation rules cannot be
                    deleted
                  value:
                    code: NOT_ALLOWED
                    details:
                      resource_path_index: 3
                    message: >-
                      This webhook is associated with at least one of Approval
                      Process/Workflow Rules/Blueprint
                    status: error
                  description: >-
                    Shows the error response when attempting to delete a webhook
                    that is associated with active Workflow Rules, Approval
                    Processes, or Blueprints.
                NotAllowedResponse3:
                  summary: Read-only webhook cannot be deleted
                  value:
                    code: NOT_ALLOWED
                    details:
                      id: '5249735000000100001'
                    message: Insufficient privileges to delete Read only webhook
                    status: error
                  description: >-
                    Shows the error response when attempting to delete a
                    read-only webhook that cannot be deleted by the requesting
                    user.
                InvalidDataResponse1:
                  summary: Invalid webhook ID in request body
                  value:
                    webhooks:
                      - code: INVALID_DATA
                        details:
                          api_name: id
                          json_path: $.webhooks[0].id
                        message: The ID given is invalid
                        status: error
                  description: >-
                    Shows the error response when the webhook ID in the request
                    body does not match any existing webhook in the
                    organization.
                InvalidWebhookIdPathResponse1:
                  summary: Invalid webhook ID in URL path
                  value:
                    code: INVALID_DATA
                    details:
                      resource_path_index: 3
                    message: the id given seems to be invalid
                    status: error
                  description: >-
                    Shows the error response when the webhook ID in the URL path
                    does not match any existing webhook in the organization.
        '403':
          description: >-
            Permission denied to delete the specified webhook in this Zoho CRM
            organization.


            **Resolution:** The CRM administrator must grant the Manage Workflow
            permission to the user's profile.
          content:
            application/json:
              schema:
                x-zs-$id: DeleteWebhooksByIdNoPermissionErrorResponseSchema
                $ref: '#/components/schemas/NoPermissionErrorResponse'
              examples:
                NoPermissionResponse1:
                  summary: Insufficient Manage Workflow permission to delete webhook
                  value:
                    code: NO_PERMISSION
                    details:
                      permissions:
                        - Crm_Implied_Manage_Workflow
                    message: permission denied
                    status: error
                  description: >-
                    Shows the error response when the requesting user does not
                    have the Manage Workflow permission on their CRM profile.
      security:
        - OAuth2:
            - ZohoCRM.settings.automation_actions.DELETE
  /settings/automation/webhook_failures:
    get:
      summary: |
        Get webhook execution failure records
      description: >
        To retrieve detailed information about webhook execution failures in
        your Zoho CRM organization.


        Optionally filter results by module, webhook ID, and date range. If the
        **from** and **to** parameters are not specified, the API returns
        webhook failures from the last 30 days by default. The maximum allowed
        span between **from** and **to** is 90 days.
      x-zs-llm-description: >-
        Returns the failure log for workflow webhook executions. Filter by
        module api_name (defaults to 'all') or a specific webhook_id (defaults
        to 'all'). from/to accept YYYY-MM-DD evaluated in the org time zone;
        from defaults to 30 days before to, to defaults to today. Returns 204
        when no failures match the filters. Each entry includes failure_time,
        failure_reason, the webhook reference, the triggering workflow rule, and
        the CRM record in entity_details.
      operationId: getWebhookFailures
      parameters:
        - $ref: '#/components/parameters/ParamQueryWebhookId'
        - $ref: '#/components/parameters/ParamQueryModule'
        - $ref: '#/components/parameters/ParamQueryFrom'
        - $ref: '#/components/parameters/ParamQueryTo'
        - $ref: '#/components/parameters/ParamQueryPage'
        - $ref: '#/components/parameters/ParamQueryPerPage'
      responses:
        '200':
          description: >
            Returns a paginated list of webhook execution failure records
            matching the specified filters. Each item contains the failure time,
            failure reason, the webhook reference, the triggering workflow rule,
            and the CRM record that triggered the failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookFailuresResponse'
              examples:
                Success200:
                  summary: |
                    Successful retrieval of webhook execution failure records
                  value:
                    webhook_failures:
                      - webhook:
                          name: Premium Lead Alert
                          id: '4876876000016390771'
                        entity_details:
                          module:
                            api_name: Leads
                            id: '4876876000000002175'
                          name: Freelancer.com
                          id: '4876876000016474049'
                        failure_time: '2025-10-21T17:08:07+05:30'
                        failure_reason: page_notfound
                        id: '4876876000016474075'
                        workflow_rule:
                          name: WF-C
                          id: '4876876000016390881'
                    info:
                      per_page: 200
                      count: 1
                      page: 1
                      more_records: false
                  description: >
                    Shows a successful response listing webhook execution
                    failures, each containing the failure time, failure reason,
                    the webhook reference, the triggering workflow rule, and the
                    CRM record details.
        '204':
          description: >
            No webhook failure records match the specified filter criteria.
            Returned when no failures exist for the given module, webhook ID, or
            date range combination.
        '400':
          description: >
            One or more query parameters are invalid.


            **Resolution:** The module API name must be valid. The
            **webhook_id** must be numeric. The **from** and **to** dates must
            be in YYYY-MM-DD format and must not be in the future.
          content:
            application/json:
              schema:
                x-zs-$id: GetWebhookFailuresInvalidDataErrorResponseSchema
                oneOf:
                  - $ref: '#/components/schemas/InvalidModuleErrorResponse'
                  - $ref: '#/components/schemas/InvalidActionIDErrorResponse'
                  - $ref: '#/components/schemas/InvalidDateRangeErrorResponse'
                description: >
                  Represents the error response returned when one or more query
                  parameters in the request are invalid. The response body
                  conforms to one of three error variants: an invalid module, an
                  invalid webhook action ID, or an invalid date range.
              examples:
                InvalidModuleResponse1:
                  summary: |
                    Error for unrecognized module API name in module parameter
                  value:
                    code: INVALID_MODULE
                    details:
                      param_name: module
                    message: The value provided to the param is Invalid
                    status: error
                  description: >
                    Demonstrates the error response when the **module** query
                    parameter does not match a valid CRM module API name.
                InvalidDataResponse1:
                  summary: |
                    Error for invalid action ID in webhook_id parameter
                  value:
                    code: INVALID_DATA
                    details:
                      param_name: webhook_id
                    message: the id given seems to be invalid
                    status: error
                  description: >
                    Demonstrates the error response when the **webhook_id**
                    parameter contains a non-numeric value that does not match a
                    valid webhook record.
                InvalidDataResponse2:
                  summary: |
                    Error for malformed date format in from or to parameter
                  value:
                    code: INVALID_DATA
                    details:
                      param_name: from
                      expected_data_type: datetime
                    message: The value provided to the param is Invalid
                    status: error
                  description: >
                    Demonstrates the error response when the **from** or **to**
                    date parameter does not conform to the YYYY-MM-DD format.
                InvalidDataResponse3:
                  summary: |
                    Error for future date in from or to parameter
                  value:
                    code: INVALID_DATA
                    details:
                      param_name: to
                      expected_data_type: datetime
                    message: The value provided to the param is Invalid
                    status: error
                  description: >
                    Demonstrates the error response when the **from** or **to**
                    date parameter is set to a future date.
        '403':
          description: >
            Permission denied to retrieve webhook failure logs in this
            organization.


            **Resolution:** The CRM administrator must grant the Manage Workflow
            permission to the user's profile.
          content:
            application/json:
              schema:
                x-zs-$id: GetWebhookFailuresNoPermissionErrorResponseSchema
                $ref: '#/components/schemas/NoPermissionErrorResponse'
              examples:
                NoPermissionResponse1:
                  summary: |
                    Error for missing Manage Workflow permission
                  value:
                    code: NO_PERMISSION
                    details:
                      permissions:
                        - Crm_Implied_manage_workflow
                    message: permission denied
                    status: error
                  description: >
                    Demonstrates the error response when the requesting user
                    does not have the Manage Workflow permission on their CRM
                    profile.
      security:
        - OAuth2:
            - ZohoCRM.settings.automation_actions.READ
  /settings/automation/webhooks/actions/associated_modules:
    get:
      summary: Get webhook-associated modules
      description: >-
        To retrieve the list of CRM modules that have at least one webhook
        currently associated in your Zoho CRM organization.


        Results are filtered based on the requesting user's module access
        permissions. Use these module API names as valid values for the module
        filter when querying webhook failures.
      x-zs-llm-description: >-
        Lists the modules where workflow webhooks are currently in use; results
        are filtered to modules the requester can access. Use the returned
        api_names as the module filter when querying /webhook_failures to avoid
        INVALID_MODULE errors. No query parameters needed. Missing privilege
        returns 403 NO_PERMISSION.
      operationId: getWebhookAssociatedModules
      responses:
        '200':
          description: >-
            Returns the list of CRM modules that have at least one webhook
            associated. Results are filtered based on the requesting user's
            module access permissions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssociatedModulesResponse'
              examples:
                Success200:
                  summary: Successful response listing modules with associated webhooks
                  value:
                    associated_modules:
                      - api_name: Leads
                        id: '4876876000000002175'
                      - api_name: Deals
                        id: '4876876000000002181'
                  description: >-
                    Shows a successful response listing the CRM modules that
                    have at least one webhook associated, filtered by the
                    requesting user's module access permissions.
        '403':
          description: >-
            Permission denied to retrieve webhook-associated modules in this
            Zoho CRM organization.


            **Resolution:** The CRM administrator must grant the Manage Workflow
            permission to the user's profile.
          content:
            application/json:
              schema:
                x-zs-$id: GetAssociatedModulesNoPermissionErrorResponseSchema
                $ref: '#/components/schemas/NoPermissionErrorResponse'
              examples:
                NoPermissionResponse1:
                  summary: NO_PERMISSION error for missing Manage Workflow permission
                  value:
                    code: NO_PERMISSION
                    details:
                      permissions:
                        - Crm_Implied__Manage_Workflow
                    message: permission denied
                    status: error
                  description: >-
                    Demonstrates the error response when the requesting user
                    does not have the Manage Workflow permission on their CRM
                    profile.
      security:
        - OAuth2:
            - ZohoCRM.settings.automation_actions.READ
  /settings/automation/webhooks/actions/usage_reports:
    get:
      summary: |
        Get webhook action usage reports
      description: >
        To retrieve usage statistics for webhook actions executed in your Zoho
        CRM organization. Specify the **group_by** parameter to control the
        granularity of results; optionally filter by automation feature type and
        date range.
      x-zs-llm-description: >-
        Returns daily send counts for workflow webhook actions, optionally
        broken down by resource and action type. group_by is required and must
        contain 'date'; accepted combinations are 'date' alone (totals across
        all webhooks) or 'date,resource' (per-action rows with resource id and
        name). type restricts results to a specific automation context. from/to
        accept yyyy-MM-dd in the org time zone and default to the last 30 days.
        page, per_page, sort_order, and include_inner_details (adds nested
        fields like resource.layout_id) are optional. Supplying a future date
        returns 400.
      operationId: getWebhookUsageReports
      parameters:
        - $ref: '#/components/parameters/ParamQueryGroupBy'
        - $ref: '#/components/parameters/ParamQueryType'
        - $ref: '#/components/parameters/ParamQueryFrom'
        - $ref: '#/components/parameters/ParamQueryTo'
        - $ref: '#/components/parameters/ParamQueryPage'
        - $ref: '#/components/parameters/ParamQueryPerPage'
        - $ref: '#/components/parameters/ParamQuerySortOrder'
        - $ref: '#/components/parameters/ParamQueryUsageIncludeInnerDetails'
      responses:
        '200':
          description: >
            Returns the webhook action usage report for the requested date
            range. Each item in the **data_usage** array represents usage
            grouped by the criteria specified in the **group_by** parameter.
            When **group_by** includes **resource**, each item represents one
            webhook action per day; when **group_by** is **date** only, each
            item represents the daily total across all webhook actions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutomationUsageReportResponse'
              examples:
                Success200:
                  summary: |
                    Successful webhook action usage report response
                  value:
                    data_usage:
                      - date: '2025-10-23'
                        resource:
                          name: Premium Lead Alert
                          id: '4876876000016390771'
                        count: 1
                        type: webhooks
                      - date: '2025-10-21'
                        resource:
                          name: Premium Lead Alert
                          id: '4876876000016390771'
                        count: 1
                        type: webhooks
                      - date: '2025-10-17'
                        resource:
                          name: Premium Lead Alert
                          id: '4876876000016390771'
                        count: 8
                        type: webhooks
                    info:
                      max_limit: 2500
                      per_page: 200
                      count: 3
                      page: 1
                      more_records: false
                  description: >
                    Shows a successful response containing the **data_usage**
                    array with webhook action usage entries grouped according to
                    the **group_by** parameter. When **group_by** includes
                    **resource**, each entry represents one webhook action per
                    day; when **group_by** is **date** only, each entry
                    represents the daily total across all webhook actions.
        '400':
          description: >
            One or more query parameters are invalid.


            **Resolution:** The **group_by** parameter must be present and must
            include **date**. The **type** value must match a supported
            automation feature type. Date parameters must be in YYYY-MM-DD
            format and must not be in the future.
          content:
            application/json:
              schema:
                x-zs-$id: GetUsageReportsErrorResponseSchema
                oneOf:
                  - $ref: >-
                      #/components/schemas/AutomationUsageRequiredParamMissingError
                  - $ref: '#/components/schemas/AutomationUsageInvalidDataError'
                description: >
                  Represents the error response returned when one or more query
                  parameters fail validation. Applies when **group_by** is
                  missing or does not include **date**, when **type** has an
                  unsupported value, when a date parameter is in the future, or
                  when pagination parameters are invalid.
              examples:
                RequiredParamMissingResponse1:
                  summary: |
                    REQUIRED_PARAM_MISSING error when group_by is absent
                  value:
                    code: REQUIRED_PARAM_MISSING
                    details:
                      param_name: group_by
                    message: One of the expected param is missing
                    status: error
                  description: >
                    Shows the error response returned when the required
                    **group_by** parameter is absent from the request. The
                    **group_by** parameter is mandatory and must include
                    **date**.
                InvalidDataResponse1:
                  summary: |
                    INVALID_DATA error for a future date parameter value.
                  value:
                    code: INVALID_DATA
                    details:
                      param_name: type
                    message: feature type is invalid
                    status: error
                  description: >
                    Shows the error response returned when the **from** or
                    **to** date parameter contains a future date value. The
                    **from** and **to** parameters must be dates in the past or
                    the current date in YYYY-MM-DD format.
                InvalidDataResponse2:
                  summary: |
                    INVALID_DATA error for an unsupported automation type value
                  value:
                    code: INVALID_DATA
                    details:
                      param_name: date
                    message: provided time is ahead
                    status: error
                  description: >
                    Shows the error response returned when the **type** query
                    parameter contains an unsupported automation feature type
                    value. The **type** value must match one of the supported
                    automation feature types.
        '403':
          description: >
            Permission denied to retrieve webhook action usage reports.


            **Resolution:** The CRM administrator must grant the Manage
            Automation Actions permission to the user's profile.
          content:
            application/json:
              schema:
                x-zs-$id: GetUsageReportsNoPermissionResponseWrapper
                $ref: '#/components/schemas/AutomationUsageNoPermissionError'
              examples:
                NoPermissionResponse1:
                  summary: |
                    NO_PERMISSION error for insufficient profile permissions
                  value:
                    code: NO_PERMISSION
                    details:
                      permissions:
                        - Crm_Implied_manage_workflow
                    message: permission denied
                    status: error
                  description: >
                    Shows the error response returned when the requesting user's
                    CRM profile lacks the Manage Automation Actions permission
                    required to retrieve webhook action usage reports.
      security:
        - OAuth2:
            - ZohoCRM.settings.automation_actions.READ
components:
  schemas:
    WebhookModuleParameters:
      type: object
      additionalProperties: false
      description: >-
        Represents a module merge-field parameter for webhook requests. Used in
        headers, URL query parameters, or form data fields. The value is
        resolved at runtime from the field of the triggering CRM record.
      x-zs-llm-description: >-
        A merge-field parameter resolved from a record's field value at runtime.
        Use ${!Module.Field_Name} syntax.
      properties:
        name:
          type: string
          description: >-
            Represents the parameter key sent in the webhook request. The name
            must be unique within the parameter collection.
          maxLength: 255
        value:
          type: string
          description: >-
            Represents the merge-field token resolved at runtime from the
            triggering CRM record. Use the API field names and not display names
            (for example, use ${!Leads.Last_Name}, not ${!Leads.Last Name}).
            Invalid API names return INVALID_DATA.
          maxLength: 255
      title: Webhook Module Parameters
    AssociatedModulesResponse:
      type: object
      x-zs-$id: AssociatedModulesResponse
      additionalProperties: false
      description: >-
        Represents the response listing CRM modules that have at least one
        webhook associated.
      x-zs-llm-description: >-
        List of CRM modules that have at least one webhook configured. Use to
        discover which modules have webhook integrations.
      properties:
        associated_modules:
          type: array
          description: >-
            Represents the list of module references that have at least one
            webhook associated.
          items:
            $ref: '#/components/schemas/AssociatedModuleReference'
          maxItems: 2
    InvalidConnectionNameError:
      type: object
      x-zs-$id: InvalidConnectionNameError
      additionalProperties: false
      description: >-
        Represents the error returned when the provided connection_name does not
        exist or is invalid.
      x-zs-llm-description: >-
        The connection_name does not exist or is invalid. Verify via Connections
        settings.
      properties:
        code:
          type: string
          description: >-
            Represents the error code for this failure.

            Possible values:

            **INVALID_DATA** - The connection name provided in the
            authentication configuration is not valid.
          enum:
            - INVALID_DATA
        details:
          type: object
          additionalProperties: false
          description: >-
            Represents the error details containing information about the field
            with the invalid connection name.
          properties:
            api_name:
              type: string
              description: Represents the API name of the field that triggered the error.
              maxLength: 255
            json_path:
              type: string
              description: Represents the JSON path to the field that triggered the error.
              maxLength: 1000
        message:
          type: string
          description: >-
            Represents the error message describing the failure.

            Possible values:

            **Please provide valid connection name** - The connection name in
            the authentication configuration does not match any existing Zoho
            Connections integration.

            **invalid data** - The connection name value is not in a valid
            format.
          enum:
            - Please provide valid connection name
            - invalid data
        status:
          type: string
          description: |-
            Represents the error status.
            Possible values:
            **error** - Indicates the request did not complete successfully.
          enum:
            - error
      required:
        - code
        - details
        - message
        - status
    WebhookStatusResponse:
      type: object
      additionalProperties: false
      description: >-
        Represents the operation result for a webhook create, update, or delete
        action. On success, code is success, status is success, and details
        contains the webhook ID.
      x-zs-llm-description: >-
        Action result for webhook create/update/delete. On success: code=SUCCESS
        with the webhook ID in details.
      properties:
        code:
          type: string
          description: Represents the success or error code of the webhook operation.
          maxLength: 255
          example: SUCCESS
        details:
          $ref: '#/components/schemas/WebhookDetailsResponse'
          description: Result details. On success, contains the webhook id.
        message:
          type: string
          description: Represents the description of the operation result.
          maxLength: 255
          example: webhook created successfully
        status:
          type: string
          description: Represents the operation status.
          maxLength: 255
      title: Webhook Status Response
      required:
        - code
        - details
        - message
        - status
    InvalidActionIDErrorResponse:
      type: object
      x-zs-$id: InvalidActionIDErrorResponse
      additionalProperties: false
      description: >-
        Represents the error returned when the action ID provided in the request
        is invalid or does not match an existing webhook.
      x-zs-llm-description: >-
        The action ID in the request is invalid. Verify webhook IDs via GET
        list.
      properties:
        code:
          type: string
          description: >-
            Represents the error code for this failure.

            Possible values:

            **INVALID_DATA** - The webhook action ID provided in the request is
            not valid.
          enum:
            - INVALID_DATA
        details:
          type: object
          additionalProperties: false
          description: >-
            Represents the error details containing the parameter name
            associated with the invalid action ID.
          properties:
            param_name:
              type: string
              description: >-
                Represents the name of the parameter that contains the invalid
                action ID.
              maxLength: 255
        message:
          type: string
          description: >-
            Represents the error message describing the failure.

            Possible values:

            **the id given seems to be invalid** - The action ID provided in the
            request does not match a valid webhook record.
          enum:
            - the id given seems to be invalid
        status:
          type: string
          description: |-
            Represents the error status.
            Possible values:
            **error** - Indicates the request did not complete successfully.
          enum:
            - error
      required:
        - code
        - details
        - message
        - status
      title: Invalid Action ID Error Response
    WebhookHeaders:
      type: object
      additionalProperties: false
      description: >-
        Represents the HTTP headers configuration for the outgoing webhook
        request. Supports module merge-field parameters and custom static
        parameters. The host header name is reserved and cannot be used.
      x-zs-llm-description: >-
        Headers configuration for webhook HTTP requests. HOST and restricted
        headers are not allowed. Contains module_parameters and
        custom_parameters arrays.
      properties:
        custom_parameters:
          type:
            - array
            - 'null'
          description: >-
            Represents the static key-value pairs sent as HTTP headers with
            every webhook execution.
          items:
            $ref: '#/components/schemas/WebhookCustomParameters'
          maxItems: 10
        module_parameters:
          type:
            - array
            - 'null'
          description: >-
            Represents the module merge-field parameters sent as HTTP headers.
            The key must be present but may be an empty array when only custom
            parameters are needed.
          items:
            $ref: '#/components/schemas/WebhookModuleParameters'
          maxItems: 25
      title: Webhook Headers
    InvalidDateTimeFormatErrorResponse:
      type: object
      x-zs-$id: InvalidDateTimeFormatErrorResponse
      additionalProperties: false
      description: >-
        Represents the error returned when the datetime_format value in
        date_time_format is invalid.
      x-zs-llm-description: >-
        The date-time format string is invalid. Use a valid pattern (e.g.,
        yyyy-MM-dd'T'HH:mm:ssZ).
      properties:
        code:
          type: string
          description: >-
            Represents the error code for this failure.

            Possible values:

            **INVALID_DATA** - The datetime format provided in the request is
            not valid.
          enum:
            - INVALID_DATA
        details:
          type: object
          additionalProperties: false
          description: >-
            Represents the error details identifying the field with the invalid
            datetime format.
          properties:
            api_name:
              type: string
              description: >-
                Represents the API name of the field with the invalid datetime
                format.
              maxLength: 255
            json_path:
              type: string
              description: >-
                Represents the JSON path to the field with the invalid datetime
                format.
              maxLength: 1000
        message:
          type: string
          description: >-
            Represents the error message describing the failure.

            Possible values:

            **The date time format given is invalid** - The datetime value does
            not match the expected format.

            **Please provide a valid date time format** - The datetime format
            string is not recognized.
          enum:
            - The date time format given is invalid
            - Please provide a valid date time format
        status:
          type: string
          description: |-
            Represents the error status.
            Possible values:
            **error** - Indicates the request did not complete successfully.
          enum:
            - error
      required:
        - code
        - details
