      description: >-
        Represents the request body configuration for the outgoing webhook
        request. For type **form_data**, provide form_data_content with
        module_parameters and custom_parameters; format may be null. 


        For type **raw**, supply raw_data_content and a format value of JSON,
        XML, Text, or HTML. For type **none**, the body carries no content and
        format may be null.
      x-zs-llm-description: >-
        Configures the webhook request body; type and format are required for
        all variants. For type=form_data: supply form_data_content with
        module_parameters and custom_parameters sub-arrays; format may be null.
        For type=raw: supply raw_data_content (a string) and a format value of
        JSON, XML, Text, or HTML  note the field is raw_data_content, not data,
        and format, not content_type. For type=none: the body carries no content
        and format may be null, but the field must still be present. Example
        form_data:
        {"type":"form_data","format":null,"form_data_content":{"module_parameters":[{"name":"Lead_Source","value":"${!Leads.Lead_Source}"}],"custom_parameters":[{"name":"key","value":"val"}]}}.
        Example (raw):
        {"type":"raw","format":"JSON","raw_data_content":"{\"lead\":\"${!Leads.Full_Name}\"}"}.
      properties:
        format:
          type:
            - string
            - 'null'
          description: |-
            Specify the body content format.
            Possible values:
            **JSON** - JSON format.
            **XML** - XML format.
            **Text** - Plain text format.
            **HTML** - HTML format.
            **null** - Valid for form_data and none body types.
          enum:
            - JSON
            - XML
            - Text
            - HTML
            - null
