    post:
      summary: Webhooks
      description: >-
        To create a webhook action that fires an HTTP request to an external URL
        in your Zoho CRM organization when an automation trigger fires. 


        The `http_method` value controls which optional request fields are
        accepted. 


        - POST and PUT accept `headers` and `body`

        - GET and DELETE methods accept `url_parameters`

        - DELETE also accepts `headers` 


        To retrieve valid module API names, refer to the [Get
        Modules](modules.yaml#$.paths./settings/modules.get) resource.
      x-zs-llm-description: >-
        Adds a new webhook action that fires when automation triggers. Before
        calling: GET /settings/modules to look up valid module api_names. Send a
        webhooks array with exactly one entry; required fields are name, module,
        url, http_method, authentication, and feature_type. http_method
        determines which keys are allowed: POST/PUT accept headers and body;
        GET/DELETE accept url_parameters; DELETE also accepts headers. Sending
        keys not allowed for the chosen method returns DEPENDENT_MISMATCH. The
        URL must begin with http://, https://, www., or ${...}; SSRF-protected
        hosts are rejected. The response contains the new webhook ID.
      x-zs-llm-examples:
        - SamplePostRequest
      operationId: createWebhooks
      requestBody:
        description: >-
          The request body must contain a webhooks array with one object. The
          webhook object requires name, module, url, http_method,
          authentication, and feature_type.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWebhooksRequestBody'
            examples:
              SamplePostRequest:
                summary: >-
                  Webhook creation request with module parameters, custom
                  headers, and body configuration.
                value:
                  webhooks:
                    - headers:
                        module_parameters:
                          - name: lead_email
                            value: ${!Leads.Email}
                          - name: lead_id
                            value: ${!Leads.Id}
                          - name: lead_owner
                            value: ${!Leads.Owner}
                        custom_parameters:
                          - name: source
                            value: website
                          - name: version
                            value: '1.0'
                      module:
                        api_name: Leads
                        id: '5725767000000002175'
                      description: Protected Data
                      body:
                        raw_data_content: |-
                          {
                            "lead_id": "${!Leads.Id}",
                            "email": "${!Leads.Email}",
                            "owner": "${!Leads.Owner}",
                            "source": "website",
                            "version": "1.0"
                          }
                        format: JSON
                        type: raw
                      url: >-
                        https://webhook.site/3588de27-e3bd-4237-894b-f140143f3d99
                      feature_type: workflow
                      http_method: POST
                      name: Zoho's Data
                      authentication:
                        type: general
                description: >-
                  Shows a create webhook request for the Leads module using POST
                  with module parameters, custom headers, and body
                  configuration.
