                InvalidDataResponse4:
                  summary: >-
                    Error response with code INVALID_DATA: the id given seems to
                    be invalid
                  value:
                    code: INVALID_DATA
                    details:
                      resource_path_index: 3
                    message: the id given seems to be invalid
                    status: error
                  description: >-
                    Returns the INVALID_DATA error when the path **id** in the
                    request URL does not refer to an existing automation task
                    definition.
                DependentMismatchResponse2:
                  summary: >-
                    Error response with code DEPENDENT_MISMATCH: the given value
                    is invalid (Field: value)
                  value:
                    tasks:
                      - code: DEPENDENT_MISMATCH
                        details:
                          api_name: value
                          json_path: $.tasks[0].field_mapping[1].value
                          dependee:
                            api_name: api_name
                            json_path: $.tasks[0].field_mapping[1].field.api_name
                          maximum_length: 150
                        message: the given value is invalid
                        status: error
                  description: >-
                    Returns the DEPENDENT_MISMATCH error when a field_mapping
