    delete:
      summary: Automation Task
      description: >-
        PURPOSE: Deletes a single automation task definition by its ID.
        MANDATORY: id path parameter (string - automation task definition ID,
        not a Task record ID). KEY CONSTRAINTS: Tasks associated with active
        workflow rules, approval processes, or blueprints cannot be deleted
        (returns NOT_ALLOWED). Returns success/error status.
      x-zs-llm-description: >-
        Removes a single automation task definition by the id path param (the
        definition ID, not a Task record ID). Tasks attached to active workflow
        rules, approval processes, or blueprints are rejected with NOT_ALLOWED.
        The response indicates success or error for the deletion.
      operationId: deleteTaskById
      parameters:
        - name: id
          in: path
          description: >
            Represents the unique ID of the task that you want to delete. Skip
            this parameter if you have specified the ID in the request URL. You
            can pass upto 10 comma-separated IDs in this parameter. Tasks
            associated with active workflow rules, approval processes, or
            blueprints cannot be deleted. Use the [Workflow Tasks
            API](workflow_tasks.yaml#$.paths./settings/automation/tasks.get) to
            retrieve the ID.
          required: true
          schema:
            type: string
            maxLength: 20
      responses:
        '200':
          description: Task deleted successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteTaskByIdSuccessResponse'
              examples:
                Success200:
                  summary: Task deleted successfully
                  value:
                    tasks:
                      - code: SUCCESS
                        details:
                          id: '111112000000035041'
                        message: task deleted successfully
                        status: success
                  description: >-
                    Returns the SUCCESS code and the deleted task ID, confirming
                    that the automation task definition was removed from the
                    organization.
        '400':
          description: >-
            Invalid task ID or task cannot be deleted due to active association
            with workflow/approval/Blueprint.
          content:
            application/json:
              schema:
                x-zs-$id: InvalidTaskIdErrorResponse
                oneOf:
                  - $ref: '#/components/schemas/TaskNotAllowedSchema'
                  - $ref: '#/components/schemas/TaskInvalidDataSchema'
                description: >-
                  Error response returned when a single automation task delete
                  fails validation, such as an invalid ID or the task being
                  associated with active automation.
              examples:
                NotAllowedResponse1:
                  summary: >-
                    Error response with code NOT_ALLOWED: Task is associated
                    with at least one of Approval Process/Workflow
                    Rules/Blueprint
                  value:
                    code: NOT_ALLOWED
                    details:
                      resource_path_index: 3
                    message: >-
                      Task is associated with at least one of Approval
                      Process/Workflow Rules/Blueprint
                    status: error
                  description: >-
                    Returns the NOT_ALLOWED error when the automation task
                    cannot be deleted because it is associated with an active
                    Approval Process, workflow rule, or Blueprint.
                InvalidDataResponse1:
                  summary: >-
                    Error response with code INVALID_DATA: the id given seems to
                    be invalid
                  value:
                    code: INVALID_DATA
                    details:
                      resource_path_index: 3
                    message: the id given seems to be invalid
                    status: error
                  description: >-
                    Returns the INVALID_DATA error when the path **id** does not
                    match an existing automation task definition.
        '401':
          description: Authentication or scope error while deleting the automation task.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostTasksAuthenticationErrorResponse'
              examples:
                OauthScopeMismatchResponse:
                  summary: 'OAUTH_SCOPE_MISMATCH: Unauthorized'
                  value:
                    code: OAUTH_SCOPE_MISMATCH
                    details: {}
                    message: Unauthorized
                    status: error
                  description: >-
                    Returns the OAUTH_SCOPE_MISMATCH error when the access token
                    does not include the OAuth scope required to delete
                    automation tasks.
                AuthenticationFailureResponse:
                  summary: 'AUTHENTICATION_FAILURE: Authentication failed'
                  value:
                    code: AUTHENTICATION_FAILURE
                    details: {}
                    message: Authentication failed
                    status: error
                  description: >-
                    Returns the AUTHENTICATION_FAILURE error when the request is
                    missing a valid access token or the supplied token has
                    expired.
        '403':
          description: Insufficient permission to delete automation tasks.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskNoPermissionSchema'
              examples:
                NoPermissionResponse1:
                  summary: 'Error response with code NO_PERMISSION: permission denied'
                  value:
                    code: NO_PERMISSION
                    details:
                      permissions:
                        - Crm_Implied_manage_workflow
                    message: permission denied
                    status: error
                  description: >-
                    Returns the NO_PERMISSION error when the user profile lacks
                    the Crm_Implied_manage_workflow permission required to
                    delete automation tasks.
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorResponse'
              examples:
                InternalServerErrorResponse:
                  summary: 'INTERNAL_ERROR: Internal Server Error'
                  value:
                    code: INTERNAL_ERROR
                    details: {}
                    message: Internal Server Error
                    status: error
                  description: >-
                    Returns the INTERNAL_ERROR response when an unexpected
                    server-side exception prevents the delete from completing.
      security:
        - OAuth2:
            - ZohoCRM.settings.automation_actions.DELETE
components:
  schemas:
    BulkDeleteTasksMixedResponse:
      x-zs-$id: BulkDeleteTasksMixedResponse
      type: object
      additionalProperties: false
      description: >-
        Bulk delete partial-success response. Contains mixed success and failure
        items for the requested task IDs.
      x-zs-llm-description: >-
        Partial-success response  some task IDs deleted, others failed. Iterate
        items and check each status/code to identify failures.
      properties:
        tasks:
          type: array
          description: Per-ID deletion results for the bulk request.
          items:
            oneOf:
              - $ref: '#/components/schemas/BulkDeleteTasksSuccessItem'
              - $ref: '#/components/schemas/BulkDeleteTasksFailureItem'
            description: >-
              Represents a single per-ID outcome entry returned in a bulk DELETE
              request, indicating either a successful delete or a per-ID failure
              reason.
          maxItems: 10
      required:
        - tasks
      title: Bulk Delete Tasks Mixed Response
    ModifierDetails:
      type: object
      additionalProperties: false
      description: >-
        Provides details about the individual who modified an entity, including
        their name and ID.
