openapi: 3.1.0
info:
  title: Automation Tasks
  description: >-
    Manage automation task definitions in Zoho CRM, including creating,
    retrieving, updating, and deleting task action configurations bound to a CRM
    module. These task definitions are referenced by automation runners -
    workflow rules, Approval Processes, Blueprints, scoring rules, and case
    escalation rules - to create Task records with the configured field_mappings
    when the automation fires.
  version: '8'
servers:
  - url: https://zohoapis.{dc}/crm/{version}
    description: >-
      Production API server URL parameterized by data center TLD and API
      version.
    variables:
      dc:
        description: >-
          Data center top-level domain that hosts the customer account; choose
          the value that matches the account region.
        default: com
        enum:
          - com
          - eu
          - in
          - cn
          - au
          - ca
          - jp
      version:
        description: CRM API version segment included in the request URL.
        default: v8
paths:
  /settings/automation/tasks:
    get:
      summary: List automation task definitions with optional filters
      description: >-
        PURPOSE: Retrieves a paginated list of automation task definitions.
        Supports filtering by module, feature_type, and name (via filter param).
        PAGINATION: page (default 1), per_page (default 200, max 200). Use
        info.more_records to determine if additional pages exist. A 204 response
        indicates no tasks match the supplied filters. Use this before
        PUT/DELETE to discover task IDs.
      x-zs-llm-description: >-
        Fetches a paginated list of automation task definitions; filter by
        module, feature_type, or name via the filter param. page defaults to 1,
        per_page defaults to 200 (max 200); check info.more_records to see if
        further pages exist. A 204 means no tasks matched the filters. Run this
        before PUT/DELETE to look up task IDs.
      operationId: getWorkflowTasks
      parameters:
        - $ref: '#/components/parameters/ParamQueryFilter'
        - $ref: '#/components/parameters/ParamQueryFeatureType'
        - $ref: '#/components/parameters/ParamQueryModule'
        - $ref: '#/components/parameters/ParamQueryPerPage'
        - $ref: '#/components/parameters/ParamQueryPage'
        - $ref: '#/components/parameters/ParamQuerySortBy'
        - $ref: '#/components/parameters/ParamQuerySortOrder'
      responses:
        '200':
          description: >-
            Successful retrieval of a page of automation tasks. The info object
            conveys pagination state (page, per_page, count, more_records).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetTasksSuccessResponse'
              examples:
                TasksListSuccess:
                  summary: >-
                    Successful response listing automation tasks with different
                    feature types and field mapping configurations
                  value:
                    tasks:
                      - created_time: '2025-08-15T10:30:00+00:00'
                        lock_status:
                          locked: false
                        editable: true
                        module:
                          singular_label: Lead
                          plural_label: Leads
                          api_name: Leads
                          moduleName: Leads
                          id: '3479217000000000125'
                        related_module: null
                        deletable: true
                        source: crm
                        created_by:
                          name: John Smith
                          id: '3479217000000539001'
                        notify: true
                        feature_type: workflow
                        field_mappings:
                          - display_value: Follow up on new lead
                            field:
                              api_name: Subject
                              id: '3479217000000000221'
                            type: static
                            value: Follow up on new lead
                          - display_value: Trigger Date plus 2 business day(s)
                            field:
                              api_name: Due_Date
                              id: '3479217000000000223'
                            type: execution_time
                            value:
                              period: business_days
                              unit: '2'
                              trigger_field: ${CURRENTTIME}
                              sign: plus
                          - display_value: Not Started
                            field:
                              api_name: Status
                              id: '3479217000000000229'
                            type: static
                            value: Not Started
                          - display_value: High
                            field:
                              api_name: Priority
                              id: '3479217000000000231'
                            type: static
                            value: High
                        modified_time: '2025-09-10T14:20:00+00:00'
                        associated: true
                        modified_by:
                          name: John Smith
                          id: '3479217000000539001'
                        name: Follow up on new lead
                        id: '3479217000002131001'
                      - created_time: '2025-09-05T08:00:00+00:00'
                        lock_status:
                          locked: true
                        editable: false
                        module:
                          singular_label: Deal
                          plural_label: Deals
                          api_name: Deals
                          moduleName: Deals
                          id: '3479217000000000137'
                        related_module: null
                        deletable: false
                        source: crm
                        created_by:
                          name: Jane Doe
                          id: '3479217000000539002'
                        notify: false
                        feature_type: approval_process
                        field_mappings:
                          - display_value: ${Deals.Deal_Name}
                            field:
                              api_name: Subject
                              id: '3479217000000000221'
                            type: merge_field
                            value: ${Deals.Deal_Name}
                          - display_value: Trigger Date plus 5 day(s)
                            field:
                              api_name: Due_Date
                              id: '3479217000000000223'
                            type: execution_time
                            value:
                              period: days
                              unit: '5'
                              trigger_field: ${CURRENTTIME}
                              sign: plus
                          - display_value: In Progress
                            field:
                              api_name: Status
                              id: '3479217000000000229'
                            type: static
                            value: In Progress
                          - display_value: Highest
                            field:
                              api_name: Priority
                              id: '3479217000000000231'
                            type: static
                            value: Highest
                        modified_time: '2025-09-05T08:00:00+00:00'
                        associated: true
                        modified_by:
                          name: Jane Doe
                          id: '3479217000000539002'
                        name: ${Deals.Deal_Name}
                        id: '3479217000002131002'
                      - created_time: '2025-10-01T12:00:00+00:00'
                        lock_status:
                          locked: false
                        editable: true
                        module:
                          singular_label: Contact
                          plural_label: Contacts
                          api_name: Contacts
                          moduleName: Contacts
                          id: '3479217000000000129'
                        related_module:
                          singular_label: Onboarding Flow
                          plural_label: Onboarding Flows
                          api_name: Onboarding_Flows
                          id: '3479217000002650297'
                          module_name: ProcessFlow1
                        deletable: true
                        source: crm
                        created_by:
                          name: John Smith
                          id: '3479217000000539001'
                        notify: true
                        feature_type: kiosks
                        field_mappings:
                          - display_value: Onboard new contact
                            field:
                              api_name: Subject
                              id: '3479217000000000221'
                            type: static
                            value: Onboard new contact
                          - display_value: Trigger Date plus 1 business day(s)
                            field:
                              api_name: Due_Date
                              id: '3479217000000000223'
                            type: execution_time
                            value:
                              period: business_days
                              unit: '1'
                              trigger_field: ${CURRENTTIME}
                              sign: plus
                          - display_value: Not Started
                            field:
                              api_name: Status
                              id: '3479217000000000229'
                            type: static
                            value: Not Started
                          - display_value: Normal
                            field:
                              api_name: Priority
                              id: '3479217000000000231'
                            type: static
                            value: Normal
                          - display_value: ${Contacts.Owner}
                            field:
                              api_name: Owner
                              id: '3479217000000000233'
                            type: merge_field
                            value: ${Contacts.Owner}
                        modified_time: '2025-10-15T09:45:00+00:00'
                        associated: false
                        modified_by:
                          name: John Smith
                          id: '3479217000000539001'
                        name: Onboard new contact
                        id: '3479217000002654408'
                      - created_time: '2025-07-20T16:30:00+00:00'
                        lock_status:
                          locked: false
                        editable: true
                        module:
                          singular_label: Task
                          plural_label: Tasks
                          api_name: Tasks
                          moduleName: Tasks
                          id: '3479217000000000143'
                        related_module: null
                        deletable: true
                        source: crm
                        created_by:
                          name: Jane Doe
                          id: '3479217000000539002'
                        notify: false
                        feature_type: blueprint
                        field_mappings:
                          - display_value: Review escalated task
                            field:
                              api_name: Subject
                              id: '3479217000000000221'
                            type: static
                            value: Review escalated task
                          - display_value: Trigger Date plus 3 day(s)
                            field:
                              api_name: Due_Date
                              id: '3479217000000000223'
                            type: execution_time
                            value:
                              period: days
                              unit: '3'
                              trigger_field: ${CURRENTTIME}
                              sign: plus
                          - display_value: Waiting on someone else
                            field:
                              api_name: Status
                              id: '3479217000000000229'
                            type: static
                            value: Waiting on someone else
                          - display_value: Low
                            field:
                              api_name: Priority
                              id: '3479217000000000231'
                            type: static
                            value: Low
                        modified_time: '2025-10-20T11:15:00+00:00'
                        associated: false
                        modified_by:
                          name: Jane Doe
                          id: '3479217000000539002'
                        name: Review escalated task
                        id: '3479217000002131012'
                    info:
                      per_page: 200
                      count: 4
                      page: 1
                      more_records: false
                  description: >-
                    Returns a paginated list of automation tasks spanning
                    multiple modules and feature types, demonstrating workflow
                    and approval-process tasks alongside varied field mapping
                    configurations.
        '204':
          description: >-
            No automation tasks match the supplied filters or no tasks exist in
            the organization.
        '400':
          description: >-
            Invalid query parameter (module or feature_type), or the feature is
            not allowed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetTasksListErrorResponse'
              examples:
                InvalidModuleResponse:
                  summary: Error response when module param value is invalid
                  value:
                    code: INVALID_MODULE
                    details:
                      param_name: module
                    message: The value provided to the param is Invalid
                    status: error
                  description: >-
                    Returns the INVALID_MODULE error when the **module** query
                    parameter does not match a valid CRM module API name.
                InvalidFeatureTypeResponse:
                  summary: Error response when feature_type param is invalid
                  value:
                    code: INVALID_DATA
                    details:
                      param_name: feature_type
                    message: the given feature name is invalid
                    status: error
                  description: >-
                    Returns the INVALID_DATA error when the **feature_type**
                    query parameter is set to a value that the API does not
                    recognize.
                InvalidSortByResponse:
                  summary: Error response when sort_by param is invalid
                  value:
                    code: INVALID_DATA
                    details:
                      param_name: sort_by
                    message: The value provided to the param is Invalid
                    status: error
                  description: >-
                    Returns the INVALID_DATA error when the **sort_by** query
                    parameter is set to a field other than **modified_time**.
                InvalidSortOrderResponse:
                  summary: Error response when sort_order param is invalid
                  value:
                    code: INVALID_DATA
                    details:
                      param_name: sort_order
                    message: The value provided to the param is Invalid
                    status: error
                  description: >-
                    Returns the INVALID_DATA error when the **sort_order** query
                    parameter is set to a value other than **asc** or **desc**.
        '401':
          description: Authentication failed or session expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostTasksAuthenticationErrorResponse'
              examples:
                OauthScopeMismatchResponse:
                  summary: 'OAUTH_SCOPE_MISMATCH: Unauthorized'
                  value:
                    code: OAUTH_SCOPE_MISMATCH
                    details: {}
                    message: Unauthorized
                    status: error
                  description: >-
                    Returns the OAUTH_SCOPE_MISMATCH error when the access token
                    does not include the OAuth scope required to list automation
                    tasks.
                AuthenticationFailureResponse:
                  summary: 'AUTHENTICATION_FAILURE: Authentication failed'
                  value:
                    code: AUTHENTICATION_FAILURE
                    details: {}
                    message: Authentication failed
                    status: error
                  description: >-
                    Returns the AUTHENTICATION_FAILURE error when the request is
                    missing a valid access token or the supplied token has
                    expired.
        '403':
          description: No permission to access workflow tasks
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskNoPermissionSchema'
              examples:
                NoPermissionResponse:
                  summary: Error response when edition lacks workflow task permissions
                  value:
                    code: NO_PERMISSION
                    details:
                      permissions:
                        - Crm_Implied_Manage_Workflow
                        - WorkFlow_Tasks
                    message: feature not available in this edition
                    status: error
                  description: >-
                    Returns the NO_PERMISSION error when the user profile lacks
                    the Crm_Implied_Manage_Workflow or WorkFlow_Tasks permission
                    required to access automation tasks.
      security:
        - OAuth2:
            - ZohoCRM.settings.automation_actions.READ
    put:
      summary: Update an automation task definition by ID (full replacement)
      description: >-
        PURPOSE: Updates an existing automation task definition identified by
        the path parameter ID. PREREQUISITES: (1) Call GET
        /settings/automation/tasks/{id} to obtain the current task structure.
        (2) Call GET /settings/layouts?module=Tasks to verify supported fields
        and identify mandatory fields where required: true in the field info.
        BEHAVIOR: This is a full replacement - all field_mappings must be
        provided, not just the changed ones. KEY CONSTRAINTS: Locked tasks
        (locked by workflow rules, approval processes, or blueprints) return 401
        AUTHORIZATION_ERROR. Read-only tasks return 400.
      x-zs-llm-description: >-
        Replaces the full configuration of an automation task identified by the
        path parameter ID. Before calling: (1) GET
        /settings/automation/tasks/{id} to read the current structure; (2) GET
        /settings/layouts?module=Tasks to confirm supported fields and find any
        where required: true. All field_mappings must be included  this is a
        full replacement, not a patch. Locked tasks (held by workflow rules,
        approval processes, or blueprints) return 401 AUTHORIZATION_ERROR;
        read-only tasks return 400.
      x-zs-llm-examples:
        - SamplePutRequest
      operationId: updateWorkflowTask
      requestBody:
        description: >-
          Task payload for create or update. tasks must contain exactly one task
          object. Required keys inside task are name, module, and
          field_mappings.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCreateOrUpdateRequest'
            examples:
              SamplePutRequest:
                summary: Sample request body
                value:
                  tasks:
                    - module:
                        api_name: Leads
                        id: '6660682000000002175'
                      notify: true
                      field_mappings:
                        - field:
                            api_name: Description
                            id: '6660682000000002291'
                          type: merge_field
                          value: >-
                            Automated task for
                            ${!Leads.First_Name}${!Leads.Last_Name}
                        - field:
                            api_name: Subject
                            id: '6660682000000002271'
                          type: static
                          value: 'Updated: Follow up with lead'
                        - field:
                            id: '6660682000000000223'
                            api_name: Due_Date
                          type: execution_time
                          value:
                            period: business_days
                            unit: '5'
                            trigger_field: ${CURRENTTIME}
                            sign: plus
                        - field:
                            api_name: Status
                            id: '6660682000000002279'
                          type: static
                          value: In Progress
                        - field:
                            api_name: Priority
                            id: '6660682000000002281'
                          type: static
                          value: High
                        - field:
                            api_name: URL_1
                            id: '6660682000001522480'
                          type: merge_field
                          value: ${!Leads.Website}
                        - field:
                            api_name: Number_1
                            id: '6660682000001522575'
                          type: merge_field
                          value: ${!Leads.No_of_Employees}
                        - display_value: '100000000000000000'
                          field:
                            api_name: Long_Integer_1
                            id: '6660682000001522533'
                          type: static
                          value: '100000000000000000'
                        - field:
                            api_name: Single_Line_1
                            id: '6660682000001522561'
                          type: static
                          value: sample task
                        - field:
                            api_name: Pick_List_1
                            id: '6660682000000922691'
                          type: static
                          value: Voter ID
                        - field:
                            api_name: Email_1
                            id: '6660682000001465098'
                          type: static
                          value: john@zohotest.cim
                        - field:
                            api_name: Percent_1
                            id: '6660682000001522617'
                          type: static
                          value: '50'
                        - field:
                            api_name: Currency_1
                            id: '6660682000001522589'
                          type: merge_field
                          value: ${!Leads.Annual_Revenue}
                        - field:
                            api_name: Phone_1
                            id: '6660682000001522603'
                          type: merge_field
                          value: ${!Leads.Phone}
                        - field:
                            api_name: Decimal_1
                            id: '6660682000001522547'
                          type: static
                          value: '12'
                      name: 'Updated: Follow up with lead'
                      feature_type: workflow
            x-zs-llm-examples:
              - SamplePutRequest
      responses:
        '200':
          description: Task updated successfully. Returns the updated task ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateTaskSuccessResponse'
              examples:
                UpdateTaskSuccessResponse:
                  summary: Task updated successfully
                  value:
                    tasks:
                      - code: SUCCESS
                        details:
                          id: '111111000000190030'
                        message: task updated successfully
                        status: success
        '400':
          description: >-
            Validation error in request payload. Two response shapes exist: (1)
            Request-structure errors (e.g., invalid task ID, read-only task,
            invalid module type/length, missing field api_name) return tasks as
            a single error object. (2) Per-task validation errors (e.g.,
            field_mapping errors, dependent mismatch, mandatory not found)
            return tasks as an array with one error object per task entry. Parse
            tasks as either object or array to handle both shapes.
          content:
            application/json:
              schema:
                x-zs-$id: PutTaskByIdErrorResponses
                oneOf:
                  - x-zs-$id: WrappedPutTaskByIdErrorResponse
                    type: object
                    additionalProperties: false
                    description: Wrapped error response with tasks
                    properties:
                      tasks:
                        type: array
                        description: Array of error objects
                        items:
                          oneOf:
                            - $ref: >-
                                #/components/schemas/AutomationFieldMappingDependentFieldMissingError
                            - $ref: '#/components/schemas/TaskDependentMismatchSchema'
                            - $ref: >-
                                #/components/schemas/AutomationFieldMappingExpectedFieldMissingError
                            - $ref: '#/components/schemas/TaskInvalidModuleSchema'
                            - $ref: '#/components/schemas/TaskInvalidDataSchema'
                            - $ref: '#/components/schemas/AuthorizationError'
                            - $ref: '#/components/schemas/TaskMandatoryNotFoundSchema'
                            - $ref: >-
                                #/components/schemas/AmbiguityDuringProcessingError
                        maxItems: 25
                    required:
                      - tasks
                  - $ref: '#/components/schemas/TaskInvalidDataSchema'
                  - $ref: '#/components/schemas/TaskNotAllowedSchema'
                  - x-zs-$id: WrappedPutTaskByIdSingleErrorResponse
                    type: object
                    additionalProperties: false
                    description: Wrapped error response with tasks
                    properties:
                      tasks:
                        oneOf:
                          - $ref: '#/components/schemas/TaskMandatoryNotFoundSchema'
                          - $ref: '#/components/schemas/TaskInvalidDataSchema'
                    required:
                      - tasks
              examples:
                DependentFieldMissingResponse1:
                  summary: >-
                    Error response with code DEPENDENT_FIELD_MISSING: Dependent
                    Field missing (Field: field_name)
                  value:
                    tasks:
                      - code: DEPENDENT_FIELD_MISSING
                        details:
                          dependee:
                            api_name: api_name
                            json_path: $.tasks[0].field_mapping[1].field.api_name
                          api_name: field_name
                          json_path: $.tasks[0].field_mapping[1].value.field_name
                        message: Dependent Field missing
                        status: error
                InvalidDataResponse1:
                  summary: >-
                    Error response with code INVALID_DATA: Unsupported
                    mergefield provided (Field: value)
                  value:
                    tasks:
                      - code: INVALID_DATA
                        details:
                          api_name: value
                          json_path: $.tasks[0].field_mappings[4].value
                        message: Unsupported mergefield provided
                        status: error
                InvalidModuleResponse1:
                  summary: >-
                    Error response with code INVALID_MODULE: the module name
                    given seems to be invalid (Field: id)
                  value:
                    tasks:
                      - code: INVALID_MODULE
                        details:
                          api_name: id
                          json_path: $.tasks[0].module.id
                        message: the module name given seems to be invalid
                        status: error
                InvalidDataResponse2:
                  summary: >-
                    Error response with code INVALID_DATA: please specify valid
                    due date (Field: sign)
                  value:
                    tasks:
                      - code: INVALID_DATA
                        details:
                          api_name: sign
                          json_path: $.tasks[0].field_mapping[2].value.sign
                        message: please specify valid due date
                        status: error
                InvalidDataResponse3:
                  summary: >-
                    Error response with code INVALID_DATA: the id given seems to
                    be invalid (Field: id)
                  value:
                    tasks:
                      - code: INVALID_DATA
                        details:
                          api_name: id
                          json_path: $.tasks[0].field_mapping[0].field.id
                        message: the id given seems to be invalid
                        status: error
                InvalidDataResponse4:
                  summary: >-
                    Error response with code INVALID_DATA: the id given seems to
                    be invalid
                  value:
                    code: INVALID_DATA
                    details:
                      resource_path_index: 3
                    message: the id given seems to be invalid
                    status: error
                DependentMismatchResponse2:
                  summary: >-
                    Error response with code DEPENDENT_MISMATCH: the given value
                    is invalid (Field: value)
                  value:
                    tasks:
                      - code: DEPENDENT_MISMATCH
                        details:
                          api_name: value
                          json_path: $.tasks[0].field_mapping[1].value
                          dependee:
                            api_name: api_name
                            json_path: $.tasks[0].field_mapping[1].field.api_name
                          maximum_length: 150
                        message: the given value is invalid
                        status: error
                MandatoryNotFoundResponse1:
                  summary: >-
                    Error response with code MANDATORY_NOT_FOUND: Required field
                    is missing (Field: module)
                  value:
                    tasks:
                      - code: MANDATORY_NOT_FOUND
                        message: Required field is missing
                        details:
                          api_name: module
                          json_path: $.tasks[*].module
                        status: error
                InvalidDataResponse5:
                  summary: >-
                    Error response with code INVALID_DATA: Invalid data type
                    (Field: module)
                  value:
                    tasks:
                      - code: INVALID_DATA
                        message: Invalid data type
                        details:
                          api_name: module
                          expected_data_type: jsonobject
                          json_path: $.tasks[*].module
                        status: error
                InvalidDataResponse6:
                  summary: >-
                    Error response with code INVALID_DATA: Invalid data (Field:
                    module)
                  value:
                    tasks:
                      - code: INVALID_DATA
                        message: Invalid data
                        details:
                          api_name: module
                          maximum_length: 2
                          json_path: $.tasks[*].module
                        status: error
                Error400Response1:
                  summary: Error response
                  value:
                    tasks:
                      code: MANDATORY_NOT_FOUND
                      message: Required field is missing
                      details:
                        api_name: api_name
                        json_path: $.tasks[*].module.api_name
                      status: error
                Error400Response2:
                  summary: Error response
                  value:
                    tasks:
                      code: INVALID_DATA
                      message: Invalid data type
                      details:
                        api_name: api_name
                        expected_data_type: text
                        json_path: $.tasks[*].module.api_name
                      status: error
                Error400Response3:
                  summary: Error response
                  value:
                    tasks:
                      code: INVALID_DATA
                      message: Invalid data
                      details:
                        api_name: api_name
                        maximum_length: 5
                        json_path: $.tasks[*].module.api_name
                      status: error
                Error400Response4:
                  summary: Error response
                  value:
                    tasks:
                      code: INVALID_DATA
                      message: Invalid data type
                      details:
                        api_name: id
                        expected_data_type: bigint
                        json_path: $.tasks[*].module.id
                      status: error
                Error400Response5:
                  summary: Error response
                  value:
                    tasks:
                      code: INVALID_DATA
                      message: Invalid data
                      details:
                        api_name: id
                        maximum_length: 19
                        json_path: $.tasks[*].module.id
                      status: error
                InvalidDataResponse7:
                  summary: >-
                    Error response with code INVALID_DATA: Invalid data type
                    (Field: notify)
                  value:
                    tasks:
                      - code: INVALID_DATA
                        message: Invalid data type
                        details:
                          api_name: notify
                          expected_data_type: boolean
                          json_path: $.tasks[*].notify
                        status: error
                MandatoryNotFoundResponse2:
