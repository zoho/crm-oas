        Read-only audit field showing who last modified this task. Contains name
        and id.
      properties:
        name:
          type: string
          description: Display name of the user who last modified this resource.
          maxLength: 255
        id:
          type: string
          description: Unique Zoho CRM user ID of the modifier.
          maxLength: 255
      title: Modifier Details
    PaginationInfo:
      type: object
      additionalProperties: false
      description: >-
        Details about pagination for resource listings, such as count, page
        number, and if more records are available.
      x-zs-llm-description: >-
        Pagination metadata for list responses. Use 'more_records' to decide
        whether to fetch the next page.
      properties:
        per_page:
          type: integer
          format: int32
          description: Maximum number of records/actions requested per page.
        count:
          type: integer
          format: int32
          description: Number of records/actions returned in the current response page.
        page:
          type: integer
          format: int32
          description: >-
            Current page number in the paginated result set (typically reflects
            the requested page value).
        more_records:
          type: boolean
          description: >-
            Indicates whether additional records/actions are available beyond
            the current page.
      title: Pagination Information
    DeleteTaskByIdSuccessResponse:
      x-zs-$id: DeleteTaskByIdSuccessResponse
      type: object
      additionalProperties: false
