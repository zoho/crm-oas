    put:
      summary: Automation Task
      description: >-
        PURPOSE: Updates an existing automation task definition identified by
        the path parameter ID. PREREQUISITES: (1) Call GET
        /settings/automation/tasks/{id} to obtain the current task structure.
        (2) Call GET /settings/layouts?module=Tasks to verify supported fields
        and identify mandatory fields where required: true in the field info.
        BEHAVIOR: This is a full replacement - all field_mappings must be
        provided, not just the changed ones. KEY CONSTRAINTS: Locked tasks
        (locked by workflow rules, approval processes, or blueprints) return 401
        AUTHORIZATION_ERROR. Read-only tasks return 400.
      x-zs-llm-description: >-
        Replaces the full configuration of an existing automation task
        identified by the path parameter ID. Before calling: (1) GET
        /settings/automation/tasks/{id} to read the current structure; (2) GET
        /settings/layouts?module=Tasks to confirm supported fields and find any
        where required: true. Every field_mapping must be sent  partial payloads
        are not supported. Locked tasks return 401 AUTHORIZATION_ERROR;
        read-only tasks return 400.
      x-zs-llm-examples:
        - SamplePutRequest
      operationId: updateWorkflowTaskById
      parameters:
        - name: id
          in: path
          description: >
            The unique ID of the automation task definition to update (not a
            Task record ID).  Use the [Workflow Tasks
            API](workflow_tasks.yaml#$.paths./settings/automation/tasks.get) to
            retrieve the ID.
          required: true
          schema:
            type: string
            maxLength: 20
      requestBody:
        description: >-
          Task payload for create or update. tasks must contain exactly one task
          object. Required keys inside task are name, module, and
          field_mappings.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCreateOrUpdateRequest'
            examples:
              SamplePutRequest:
                summary: Sample request body
                value:
                  tasks:
                    - module:
                        api_name: Leads
                        id: '6660682000000002175'
                      notify: true
                      field_mappings:
                        - field:
                            api_name: Description
                            id: '6660682000000002291'
                          type: merge_field
                          value: >-
                            Automated task for
                            ${!Leads.First_Name}${!Leads.Last_Name}
                        - field:
                            api_name: Subject
                            id: '6660682000000002271'
                          type: static
                          value: 'Updated: Follow up with lead'
                        - field:
                            id: '6660682000000000223'
                            api_name: Due_Date
                          type: execution_time
                          value:
                            period: business_days
                            unit: '5'
                            trigger_field: ${CURRENTTIME}
                            sign: plus
                        - field:
                            api_name: Status
                            id: '6660682000000002279'
                          type: static
                          value: In Progress
                        - field:
                            api_name: Priority
                            id: '6660682000000002281'
                          type: static
                          value: High
                        - field:
                            api_name: URL_1
                            id: '6660682000001522480'
                          type: merge_field
                          value: ${!Leads.Website}
                        - field:
                            api_name: Number_1
                            id: '6660682000001522575'
                          type: merge_field
                          value: ${!Leads.No_of_Employees}
                        - display_value: '100000000000000000'
                          field:
                            api_name: Long_Integer_1
                            id: '6660682000001522533'
                          type: static
                          value: '100000000000000000'
                        - field:
                            api_name: Single_Line_1
                            id: '6660682000001522561'
                          type: static
                          value: sample task
                        - field:
                            api_name: Pick_List_1
                            id: '6660682000000922691'
                          type: static
                          value: Voter ID
                        - field:
                            api_name: Email_1
                            id: '6660682000001465098'
                          type: static
                          value: john@zohotest.cim
                        - field:
                            api_name: Percent_1
                            id: '6660682000001522617'
                          type: static
                          value: '50'
                        - field:
                            api_name: Currency_1
                            id: '6660682000001522589'
                          type: merge_field
                          value: ${!Leads.Annual_Revenue}
                        - field:
                            api_name: Phone_1
                            id: '6660682000001522603'
                          type: merge_field
                          value: ${!Leads.Phone}
                        - field:
                            api_name: Decimal_1
                            id: '6660682000001522547'
                          type: static
                          value: '12'
                      name: 'Updated: Follow up with lead'
                      feature_type: workflow
                description: >-
                  Shows a full-replacement update payload for an automation
                  task, supplying the **module**, **notify** flag, and a new
                  **field_mappings** array with merge_field and static value
                  entries.
            x-zs-llm-examples:
              - SamplePutRequest
      responses:
        '200':
          description: Task updated successfully. Returns the updated task ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateTaskSuccessResponse'
              examples:
                UpdateTaskSuccessResponse:
                  summary: Task updated successfully
                  value:
                    tasks:
                      - code: SUCCESS
                        details:
                          id: '111111000000190030'
                        message: task updated successfully
                        status: success
                  description: >-
                    Returns the SUCCESS code and the updated task ID, confirming
                    that the automation task definition was replaced with the
                    new configuration.
        '400':
          description: >-
            Validation error in request payload. Two response shapes exist: (1)
            Request-structure errors (e.g., invalid task ID, read-only task,
            invalid module type/length, missing field api_name) return tasks as
            a single error object. (2) Per-task validation errors (e.g.,
            field_mapping errors, dependent mismatch, mandatory not found)
            return tasks as an array with one error object per task entry. Parse
            tasks as either object or array to handle both shapes.
          content:
            application/json:
              schema:
                x-zs-$id: PutTasksErrorResponses
                oneOf:
                  - x-zs-$id: WrappedPutTasksErrorResponse
                    type: object
                    additionalProperties: false
                    description: Wrapped error response with tasks
                    properties:
                      tasks:
                        type: array
                        description: Array of error objects
                        items:
                          oneOf:
                            - $ref: >-
                                #/components/schemas/AutomationFieldMappingDependentFieldMissingError
                            - $ref: '#/components/schemas/TaskDependentMismatchSchema'
                            - $ref: >-
                                #/components/schemas/AutomationFieldMappingExpectedFieldMissingError
                            - $ref: '#/components/schemas/TaskInvalidModuleSchema'
                            - $ref: '#/components/schemas/TaskInvalidDataSchema'
                            - $ref: '#/components/schemas/AuthorizationError'
                            - $ref: '#/components/schemas/TaskMandatoryNotFoundSchema'
                            - $ref: >-
                                #/components/schemas/AmbiguityDuringProcessingError
                          description: >-
                            Represents a single per-task validation error
                            returned within the **tasks** array when the update
                            fails on individual task entries.
                        maxItems: 25
                    required:
                      - tasks
                  - $ref: '#/components/schemas/TaskInvalidDataSchema'
                  - $ref: '#/components/schemas/TaskNotAllowedSchema'
                  - x-zs-$id: WrappedPutTasksSingleErrorResponse
                    type: object
                    additionalProperties: false
                    description: Wrapped error response with tasks
                    properties:
                      tasks:
                        oneOf:
                          - $ref: '#/components/schemas/TaskMandatoryNotFoundSchema'
                          - $ref: '#/components/schemas/TaskInvalidDataSchema'
                        description: >-
                          Represents the single error object returned when the
                          update fails due to a request-structure issue such as
                          an invalid module data type or a missing field
                          api_name.
                    required:
                      - tasks
                description: >-
                  Error response returned when an automation task update fails
                  validation, covering request-structure errors, per-task
                  field-mapping errors, dependent-field mismatches, and missing
                  mandatory fields.
              examples:
                DependentFieldMissingResponse1:
                  summary: >-
                    Error response with code DEPENDENT_FIELD_MISSING: Dependent
                    Field missing (Field: field_name)
                  value:
                    tasks:
                      - code: DEPENDENT_FIELD_MISSING
                        details:
                          dependee:
                            api_name: api_name
                            json_path: $.tasks[0].field_mapping[1].field.api_name
                          api_name: field_name
                          json_path: $.tasks[0].field_mapping[1].value.field_name
                        message: Dependent Field missing
                        status: error
                  description: >-
                    Returns the DEPENDENT_FIELD_MISSING error when a
                    field_mapping value omits the **field_name** key required by
                    its dependee api_name.
                InvalidDataResponse1:
                  summary: >-
                    Error response with code INVALID_DATA: Unsupported
                    mergefield provided (Field: value)
                  value:
                    tasks:
                      - code: INVALID_DATA
                        details:
                          api_name: value
                          json_path: $.tasks[0].field_mappings[4].value
                        message: Unsupported mergefield provided
                        status: error
                  description: >-
                    Returns the INVALID_DATA error when a field_mapping
                    **value** references an unsupported merge field token.
                InvalidModuleResponse1:
                  summary: >-
                    Error response with code INVALID_MODULE: the module name
                    given seems to be invalid (Field: id)
                  value:
                    tasks:
                      - code: INVALID_MODULE
                        details:
                          api_name: id
                          json_path: $.tasks[0].module.id
                        message: the module name given seems to be invalid
                        status: error
                  description: >-
                    Returns the INVALID_MODULE error when the **module.id** in a
                    task object does not match an existing CRM module.
                InvalidDataResponse2:
                  summary: >-
                    Error response with code INVALID_DATA: please specify valid
                    due date (Field: sign)
                  value:
                    tasks:
                      - code: INVALID_DATA
                        details:
                          api_name: sign
                          json_path: $.tasks[0].field_mapping[2].value.sign
                        message: please specify valid due date
                        status: error
                  description: >-
                    Returns the INVALID_DATA error when an execution_time
                    field_mapping value supplies an invalid **sign** for a
                    due-date offset.
                InvalidDataResponse3:
                  summary: >-
                    Error response with code INVALID_DATA: the id given seems to
                    be invalid (Field: id)
                  value:
                    tasks:
                      - code: INVALID_DATA
                        details:
                          api_name: id
                          json_path: $.tasks[0].field_mapping[0].field.id
                        message: the id given seems to be invalid
                        status: error
                  description: >-
                    Returns the INVALID_DATA error when a field_mapping field
