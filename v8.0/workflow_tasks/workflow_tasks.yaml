    post:
      summary: 'Create an Automation Task '
      description: >-
        PURPOSE: Creates an automation task definition used by workflow rules,
        approval processes, blueprints, kiosks, scoring rules, and case
        escalation rules. PREREQUISITES: (1) Call GET /settings/automation/tasks
        to check existing task definitions and avoid duplicates. (2) Call GET
        /settings/layouts?module=Tasks to discover supported fields and identify
        mandatory fields where required: true in the field info. STRUCTURE: The
        request body contains a tasks array with exactly 1 task object. Each
        task requires: name (string), module ({api_name, id}), and
        field_mappings (array). Omitting mandatory fields returns
        REQUIRED_DATA_NOT_FOUND. Returns the created task ID.
      x-zs-llm-description: >-
        Adds a new automation task definition that workflow rules, approval
        processes, blueprints, kiosks, scoring rules, or case escalation rules
        can reference. Before calling: (1) GET /settings/automation/tasks to
        check for existing definitions and avoid duplicates; (2) GET
        /settings/layouts?module=Tasks to find supported fields and those where
        required: true. Send a tasks array with exactly one entry covering name
        (string), module ({api_name, id}), and field_mappings (array). Leaving
        out a mandatory field returns REQUIRED_DATA_NOT_FOUND. The response
        contains the new task ID.
      x-zs-llm-examples:
        - SamplePostRequest
      operationId: createWorkflowTasks
      requestBody:
        description: >-
          Task payload for create or update. tasks must contain exactly one task
          object. Required keys inside task are name, module, and
          field_mappings.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCreateOrUpdateRequest'
            examples:
              SamplePostRequest:
                summary: Sample request body
                value:
                  tasks:
                    - module:
                        api_name: Leads
                        id: '6660682000000002175'
                      notify: true
                      field_mappings:
                        - field:
                            api_name: Description
                            id: '6660682000000002291'
                          type: merge_field
                          value: >-
                            Automated task for
                            ${!Leads.First_Name}${!Leads.Last_Name}
                        - field:
                            api_name: Subject
                            id: '6660682000000002271'
                          type: static
                          value: SampleTask
                        - field:
                            id: '6660682000000000223'
                            api_name: Due_Date
                          type: execution_time
                          value:
                            period: business_days
                            unit: '3'
                            trigger_field: ${CURRENTTIME}
                            sign: plus
                        - field:
                            api_name: Status
                            id: '6660682000000002279'
                          type: static
                          value: Not Started
                        - field:
                            api_name: Priority
                            id: '6660682000000002281'
                          type: static
                          value: High
                        - field:
                            api_name: URL_1
                            id: '6660682000001522480'
                          type: merge_field
                          value: ${!Leads.Website}
                        - field:
                            api_name: Number_1
                            id: '6660682000001522575'
                          type: merge_field
                          value: ${!Leads.No_of_Employees}
                        - display_value: '100000000000000000'
                          field:
                            api_name: Long_Integer_1
                            id: '6660682000001522533'
                          type: static
                          value: '100000000000000000'
                        - field:
                            api_name: Single_Line_1
                            id: '6660682000001522561'
                          type: static
                          value: sample task
                        - field:
                            api_name: Pick_List_1
                            id: '6660682000000922691'
                          type: static
                          value: Voter ID
                        - field:
                            api_name: Email_1
                            id: '6660682000001465098'
                          type: static
                          value: john@zohotest.cim
                        - field:
                            api_name: Percent_1
                            id: '6660682000001522617'
                          type: static
                          value: '50'
                        - field:
                            api_name: Currency_1
                            id: '6660682000001522589'
                          type: merge_field
                          value: ${!Leads.Annual_Revenue}
                        - field:
                            api_name: Phone_1
                            id: '6660682000001522603'
                          type: merge_field
                          value: ${!Leads.Phone}
                        - field:
                            api_name: Decimal_1
                            id: '6660682000001522547'
                          type: static
                          value: '12'
                      name: NewTask
                      feature_type: workflow
                description: >-
                  Shows a create payload for an automation task bound to the
                  **Leads** module with merge_field, static, and execution_time
                  field_mappings entries.
            x-zs-llm-examples:
              - SamplePostRequest
      responses:
        '201':
          description: Task definition created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateTaskSuccessResponse'
              examples:
                CreateTaskSuccess:
                  summary: Task created successfully
                  value:
                    tasks:
                      - code: SUCCESS
                        details:
                          id: '6660682000001550002'
                        message: task created successfully
                        status: success
                  description: >-
                    Returns the SUCCESS code and the newly created automation
                    task ID, confirming that the task definition was persisted.
        '400':
          description: >-
            Validation error in request payload. Two response shapes exist: (1)
            Request-structure errors (e.g., invalid module type/length, missing
            field api_name) return tasks as a single error object. (2) Per-task
            validation errors (e.g., field_mapping errors, dependent mismatch,
            mandatory not found) return tasks as an array with one error object
            per task entry. Parse tasks as either object or array to handle both
            shapes.
          content:
            application/json:
              schema:
                x-zs-$id: CreateTasksErrorResponses
                oneOf:
                  - x-zs-$id: WrappedCreateTasksErrorResponse
                    type: object
                    additionalProperties: false
                    description: Wrapped error response with tasks
                    properties:
                      tasks:
                        type: array
                        description: Array of error objects
                        items:
                          oneOf:
                            - $ref: '#/components/schemas/TaskNotAllowedSchema'
                            - $ref: >-
                                #/components/schemas/AutomationFieldMappingExpectedFieldMissingError
                            - $ref: >-
                                #/components/schemas/AmbiguityDuringProcessingError
                            - $ref: >-
                                #/components/schemas/AutomationFieldMappingDependentFieldMissingError
                            - $ref: '#/components/schemas/TaskDependentMismatchSchema'
                            - $ref: '#/components/schemas/TaskInvalidModuleSchema'
                            - $ref: '#/components/schemas/TaskInvalidDataSchema'
                            - $ref: '#/components/schemas/TaskDuplicateDataSchema'
                            - $ref: '#/components/schemas/TaskMandatoryNotFoundSchema'
                            - $ref: >-
                                #/components/schemas/AutomationFieldMappingRequiredDataNotFoundError
                          description: >-
                            Represents a single per-task validation error
                            returned within the **tasks** array when individual
                            task entries fail validation.
                        maxItems: 25
                    required:
                      - tasks
                  - x-zs-$id: WrappedSingleCreateTasksErrorResponse
                    type: object
                    additionalProperties: false
                    description: Wrapped error response with tasks
                    properties:
                      tasks:
                        oneOf:
                          - $ref: '#/components/schemas/TaskMandatoryNotFoundSchema'
                          - $ref: '#/components/schemas/TaskInvalidDataSchema'
                        description: >-
                          Represents the single error object returned when the
                          create fails due to a request-structure issue such as
                          a missing module api_name or an invalid module data
                          type.
                    required:
                      - tasks
                description: >-
                  Error response returned when an automation task create fails
                  validation, covering request-structure errors, per-task
                  field-mapping errors, dependent-field mismatches, and missing
                  mandatory fields.
              examples:
                InvalidDataResponse2:
                  summary: >-
                    Error response with code INVALID_DATA: please specify valid
                    due date (Field: sign)
                  value:
                    tasks:
                      - code: INVALID_DATA
                        details:
                          api_name: sign
                          json_path: $.tasks[0].field_mapping[2].value.sign
                        message: please specify valid due date
                        status: error
                  description: >-
                    Returns the INVALID_DATA error when an execution_time
                    field_mapping value supplies an invalid **sign** for a
                    due-date offset.
                InvalidDataResponse3:
                  summary: >-
                    Error response with code INVALID_DATA: the id given seems to
                    be invalid (Field: id)
                  value:
                    tasks:
                      - code: INVALID_DATA
                        details:
                          api_name: id
                          json_path: $.tasks[0].field_mapping[0].field.id
                        message: the id given seems to be invalid
                        status: error
                  description: >-
                    Returns the INVALID_DATA error when a field_mapping field
                    **id** does not refer to an existing field on the Tasks
                    module.
                DependentMismatchResponse3:
                  summary: >-
                    Error response with code DEPENDENT_MISMATCH: Dependent Field
                    is not matching
                  value:
                    tasks:
                      - code: DEPENDENT_MISMATCH
                        details:
                          dependee:
                            api_name: id
                            json_path: $.tasks[0].field_mappings[2].field.id
                          api_name: type
                          json_path: $.tasks[0].field_mappings[2].type
                        message: Dependent Field is not matching
                        status: error
                  description: >-
                    Returns the DEPENDENT_MISMATCH error when a field_mapping
                    **type** is incompatible with the dependee field referenced
                    by **id** in the same mapping entry.
                DependentMismatchResponse4:
                  summary: >-
                    Error response with code DEPENDENT_MISMATCH: Type and value
                    is mismatched
                  value:
                    tasks:
                      - code: DEPENDENT_MISMATCH
                        details:
                          dependee:
                            api_name: type
                            json_path: $.tasks[0].field_mappings[0].type
                          api_name: value
                          json_path: $.tasks[0].field_mappings[0].value
                        message: Type and value is mismatched
                        status: error
                  description: >-
                    Returns the DEPENDENT_MISMATCH error when a field_mapping
                    **value** does not match the value shape expected by the
                    field_mapping **type**.
                MandatoryNotFoundResponse2:
                  summary: >-
                    Error response with code MANDATORY_NOT_FOUND: Required field
                    is missing (Field: module)
                  value:
                    tasks:
                      - code: MANDATORY_NOT_FOUND
                        message: Required field is missing
                        details:
                          api_name: module
                          json_path: $.tasks[*].module
                        status: error
                  description: >-
                    Returns the MANDATORY_NOT_FOUND error when the required
                    **module** object is omitted from the task payload.
                InvalidDataResponse4:
                  summary: >-
                    Error response with code INVALID_DATA: Invalid data type
                    (Field: module)
                  value:
                    tasks:
                      - code: INVALID_DATA
                        message: Invalid data type
                        details:
                          api_name: module
                          expected_data_type: jsonobject
                          json_path: $.tasks[*].module
                        status: error
                  description: >-
                    Returns the INVALID_DATA error when the per-task **module**
                    field is supplied as a primitive rather than the expected
                    jsonobject.
                InvalidDataResponse5:
                  summary: >-
                    Error response with code INVALID_DATA: Invalid data (Field:
                    module)
                  value:
                    tasks:
                      - code: INVALID_DATA
                        message: The field given seems to be invalid
                        details:
                          api_name: module
