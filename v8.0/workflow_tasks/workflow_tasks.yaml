      title: Delete Task By Id Success Response
    TaskCreateOrUpdateRequest:
      type: object
      additionalProperties: false
      description: >-
        PURPOSE: Request body wrapper for creating or updating an automation
        task definition. MUST contain a tasks array with exactly 1 task object.
      x-zs-llm-description: >-
        Top-level request envelope for creating or updating an automation task
        definition; must include a tasks array containing exactly one task
        object.
      properties:
        tasks:
          type: array
          description: >-
            REQUIRED. Array containing exactly 1 automation task object.
            Multiple tasks per request are not supported.
          items:
            $ref: '#/components/schemas/TaskCreateOrUpdateInput'
          minItems: 1
          maxItems: 1
      required:
        - tasks
      title: Task Create Or Update Request
    TaskCreateOrUpdateInput:
      type: object
      additionalProperties: false
      description: >-
        PURPOSE: Writable task fields for create or update. PREREQUISITES: (1)
        Call GET /settings/layouts?module=Tasks - fields with required: true in
        the field info are mandatory in field_mappings. (2) Call GET
        /settings/modules to discover valid module api_names. Read-only fields
        (id, created_time, modified_time, created_by, modified_by, lock_status,
        associated, deletable) are excluded.
      x-zs-llm-description: >-
        Describes the editable fields for a task definition. Before submitting:
        (1) GET /settings/layouts?module=Tasks  fields where required: true must
        appear in field_mappings; (2) GET /settings/modules to confirm valid
        module api_names. System-managed fields (id, created_time,
        modified_time, created_by, modified_by, lock_status, associated,
        deletable) must not be included.
      properties:
        name:
          type: string
          description: >-
            Display name for this task definition. Must be identical to the
            value provided in the Subject field_mapping entry. If they do not
            match, the API returns INVALID_DATA. For merge_field type Subject
            mappings, set name to the same token string (e.g.,
            "${!Leads.Last_Name}").
          maxLength: 255
        module:
          $ref: '#/components/schemas/TaskCreateOrUpdateModuleRef'
        notify:
          type: boolean
          description: >-
            Whether notification should be sent to the task owner when this
            automation task executes.
          default: false
        feature_type:
          type: string
          description: >-
            The automation feature this task definition belongs to. Defaults to
            "workflow" if omitted. A task can only be associated with the
            feature it was created for - a task with feature_type="workflow" can
            only be attached to workflow rules, not to blueprints or kiosks.
            Supported values are defined in the enum.
          maxLength: 255
          default: workflow
          enum:
            - workflow
            - approval_process
            - blueprint
            - blueprint_transition
            - blueprint_state
            - review_process
            - orchestration
            - assignment_rules
            - kiosks
            - pathfinder
            - connected_workflows
            - commandcenter_service
            - cadences
            - scoring_rule
            - case_escalation_rule
        field_mappings:
          type: array
          description: >-
            REQUIRED. Field mappings for task fields. Mandatory mappings:
            Subject (static or merge_field), Due_Date (execution_time), Status
            (static: Not Started, Deferred, In Progress, Completed, Waiting on
            someone else), Priority (static: Highest, High, Normal, Low,
            Lowest). Optional: Description, Owner, Remind_At (execution_time).
            Each entry requires field ({api_name, id}), type, and value. Types:
            static (literal values), merge_field (${!Module.Field} tokens),
            execution_time (for Date/DateTime/ALARM - requires period, unit,
            trigger_field, sign). Workflow tasks support period: days,
            business_days only. Max 20 entries.
          items:
            $ref: '#/components/schemas/AutomationFieldMappings'
          minItems: 1
          maxItems: 20
