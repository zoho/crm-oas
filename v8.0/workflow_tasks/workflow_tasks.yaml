      security:
        - OAuth2:
            - ZohoCRM.settings.automation_actions.CREATE
    delete:
      summary: Delete automation task definitions by IDs (bulk)
      description: >-
        PURPOSE: Deletes one or more automation task definitions by their IDs.
        MANDATORY: ids query parameter (comma-separated task IDs, max 10). KEY
        CONSTRAINTS: Tasks associated with active workflow rules, approval
        processes, or blueprints cannot be deleted (returns NOT_ALLOWED error).
        Returns per-task success/error status. Use GET
        /settings/automation/tasks to discover task IDs before deleting.
      x-zs-llm-description: >-
        Bulk-removes automation task definitions; pass ids as a comma-separated
        query parameter (up to 10). Tasks linked to active workflow rules,
        approval processes, or blueprints are blocked with NOT_ALLOWED. The
        response reports success or error per task. Use GET
        /settings/automation/tasks to look up task IDs first.
      operationId: deleteTasks
      parameters:
        - $ref: '#/components/parameters/ParamQueryIds'
      responses:
        '200':
          description: Bulk delete completed successfully for all requested task IDs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkDeleteTasksSuccessResponse'
              examples:
                BulkDeleteSuccessResponse:
                  summary: All tasks deleted successfully
                  value:
                    tasks:
                      - code: SUCCESS
                        details:
                          id: '111111000000098788'
                        message: task deleted successfully
                        status: success
                  description: >-
                    Returns one SUCCESS entry per requested task ID, indicating
                    that every automation task in the **ids** list was deleted
                    from the organization.
        '207':
          description: >-
            Bulk delete completed with mixed results. Some task IDs were deleted
            successfully while others failed with INVALID_DATA or NOT_ALLOWED.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkDeleteTasksMixedResponse'
              examples:
                BulkDeleteMixedResponse:
                  summary: Mixed success and failure results
                  value:
                    tasks:
                      - code: SUCCESS
                        details:
                          id: '111111000000200035'
                        message: task deleted successfully
                        status: success
                      - code: NOT_ALLOWED
                        details:
                          id: '111111000000190030'
                        message: >-
                          the specified task is associated with at least one of
                          Approval Process/Workflow Rules/Blueprint
                        status: error
                      - code: SUCCESS
                        details:
                          id: '111111000000165002'
                        message: task deleted successfully
                        status: success
                  description: >-
                    Returns a mixed-status response with one entry per requested
                    ID, where some tasks were deleted successfully and others
                    failed with NOT_ALLOWED or INVALID_DATA.
        '400':
          description: >-
            Request validation failed or all provided task IDs failed deletion.
            Flat error for request-level issues (missing ids, limit exceeded,
            single-ID errors). Array response when multiple IDs all fail
            individually.
          content:
            application/json:
              schema:
                x-zs-$id: DeleteTasksErrorResponses
                oneOf:
                  - $ref: '#/components/schemas/RequiredParamMissingError'
                  - $ref: '#/components/schemas/TaskInvalidDataSchema'
                  - $ref: '#/components/schemas/TaskNotAllowedSchema'
                  - $ref: '#/components/schemas/BulkDeleteTasksAllFailedResponse'
                description: >-
                  Error response returned when a bulk delete of automation tasks
                  fails validation, covering missing or oversized ids parameter
                  and per-task delete failures.
              examples:
                RequiredParamMissingResponse:
                  summary: 'REQUIRED_PARAM_MISSING: ids query parameter not provided'
                  value:
                    code: REQUIRED_PARAM_MISSING
                    details:
                      param_name: ids
                    message: One of the expected parameter is missing
                    status: error
                  description: >-
                    Returns the REQUIRED_PARAM_MISSING error when the **ids**
                    query parameter is omitted from the bulk DELETE request.
                IdsLimitExceededResponse:
                  summary: 'INVALID_DATA: More than 10 IDs provided in the ids parameter'
                  value:
                    code: INVALID_DATA
                    details:
                      maximum_length: 10
                      param_name: ids
                    message: Ids maximum length exceeded
                    status: error
                  description: >-
                    Returns the INVALID_DATA error when the **ids** query
                    parameter contains more than 10 task IDs in a single
                    request.
                TaskAssociatedNotAllowedResponse:
                  summary: >-
                    NOT_ALLOWED: Task is linked to a workflow rule, Approval
                    Process, or Blueprint
                  value:
                    code: NOT_ALLOWED
                    details:
                      resource_path_index: 3
                    message: >-
                      the specified task is associated with at least one of
                      Approval Process/Workflow Rules/Blueprint
                    status: error
                  description: >-
                    Returns the NOT_ALLOWED error when one of the targeted tasks
                    is linked to an active Approval Process, workflow rule, or
                    Blueprint and cannot be deleted.
                ReadOnlyActionNotAllowedResponse:
                  summary: >-
                    NOT_ALLOWED: Cannot delete a read-only or system-managed
                    task
                  value:
                    code: NOT_ALLOWED
                    details:
                      resource_path_index: 3
                    message: Insufficient privileges to delete action
                    status: error
                  description: >-
                    Returns the NOT_ALLOWED error when one of the targeted tasks
                    is read-only or system-managed and cannot be deleted.
                InvalidIdResponse:
