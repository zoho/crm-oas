          additionalProperties: false
          description: Error details identifying the duplicated field.
          properties:
            api_name:
              type: string
              description: API name of the duplicated field.
              maxLength: 255
            json_path:
              type: string
              description: >-
                JSON path pointing to the duplicate entry in the request
                payload.
              maxLength: 1000
        message:
          type: string
          description: Error message describing the duplicate data condition.
          maxLength: 255
        status:
          type: string
          description: Error status.
          enum:
            - error
      required:
        - code
        - details
        - message
        - status
      title: Task Duplicate Data Schema
    TaskNotAllowedSchema:
      x-zs-$id: TaskNotAllowedSchema
      type: object
      additionalProperties: false
      description: >-
        Returned when the requested operation is not allowed  - such as deleting
        a task associated with an Approval Process, Workflow Rule, or Blueprint,
        or modifying a read-only system-managed task.
      x-zs-llm-description: >-
        Operation not allowed  the task is associated with an Approval Process,
        Workflow Rule, or Blueprint. Remove the association before
        delete/modify.
      properties:
        code:
          type: string
          description: Error code indicating operation not allowed.
          enum:
            - NOT_ALLOWED
        details:
          type: object
          additionalProperties: false
          description: Error details identifying the resource.
          properties:
            resource_path_index:
              type: integer
              format: int32
              description: >-
                Index of the resource in the request array that caused the
                error.
        message:
          type: string
          description: Error message describing why the operation is not allowed.
          example: >-
            Task is associated with at least one of Approval Process/Workflow
            Rules/Blueprint
          maxLength: 255
        status:
          type: string
          description: Error status.
          enum:
            - error
      required:
        - code
        - details
        - message
        - status
      title: Task Not Allowed Schema
    TaskMandatoryNotFoundSchema:
      x-zs-$id: TaskMandatoryNotFoundSchema
      type: object
      additionalProperties: false
      description: >-
        Returned when a required field or parameter is missing from the request
        payload.
      x-zs-llm-description: >-
        A required field or parameter is missing from the request. Check details
        for the missing field name.
      properties:
        code:
          type: string
          description: Error code indicating a mandatory field is missing.
          enum:
            - MANDATORY_NOT_FOUND
        details:
          type: object
          additionalProperties: false
          description: Error details identifying the missing field.
          properties:
            api_name:
              type: string
              description: API name of the missing required field.
              maxLength: 255
            json_path:
              type: string
              description: JSON path pointing to where the missing field is expected.
              maxLength: 1000
        message:
          type: string
          description: Error message describing which mandatory field is missing.
          example: Required field is missing
          maxLength: 255
        status:
          type: string
          description: Error status.
          enum:
            - error
      required:
        - code
        - details
        - message
        - status
      title: Task Mandatory Not Found Schema
    TaskInvalidModuleSchema:
      x-zs-$id: TaskInvalidModuleSchema
      type: object
      additionalProperties: false
      description: >-
        Returned when the specified module API name, ID, or query parameter
        value does not match any valid CRM module.
      x-zs-llm-description: >-
        The module api_name or ID does not match any valid CRM module. Verify
        via GET /settings/modules.
      properties:
        code:
          type: string
          description: Error code indicating an invalid module.
          enum:
            - INVALID_MODULE
        details:
          type: object
          additionalProperties: false
          description: Error details identifying the invalid module reference.
          properties:
            api_name:
              type: string
              description: API name of the field that caused the error.
              maxLength: 255
            json_path:
              type: string
              description: JSON path pointing to the invalid module reference.
              maxLength: 1000
            param_name:
              type: string
              description: Name of the query parameter with the invalid module value.
              maxLength: 255
        message:
          type: string
          description: Error message describing the invalid module.
          example: the module name given seems to be invalid
          maxLength: 255
        status:
          type: string
          description: Error status.
          enum:
            - error
      required:
        - code
        - details
        - message
        - status
      title: Task Invalid Module Schema
    TaskNoPermissionSchema:
      x-zs-$id: TaskNoPermissionSchema
      type: object
      additionalProperties: false
      description: >-
        Returned when the caller does not have the required permissions to
        perform this operation or access this feature.
      x-zs-llm-description: >-
        Caller lacks the required permission. Check that the user's profile
        allows automation management.
      properties:
        code:
          type: string
          description: Error code indicating insufficient permissions.
          enum:
            - NO_PERMISSION
        details:
          type: object
          additionalProperties: false
          description: Permission details required for this operation.
          properties:
            permissions:
              type: array
              description: Contains a list of required permissions for this operation.
              items:
                type: string
                description: Required permission name.
                maxLength: 255
              maxItems: 25
        message:
          type: string
          description: Error message describing the permission issue.
          example: permission denied
          maxLength: 255
        status:
          type: string
          description: Error status.
          enum:
            - error
      required:
        - code
        - details
        - message
        - status
      title: Task No Permission Schema
    TaskDependentMismatchSchema:
      x-zs-$id: TaskDependentMismatchSchema
      type: object
      additionalProperties: false
      description: >-
        Returned when a field_mapping value conflicts with a dependent field
        constraint  - such as a mismatched dependee field or an invalid
        dependent value.
      x-zs-llm-description: >-
        A field_mapping value conflicts with a dependent field constraint 
        mismatched dependee/dependent values. Verify field dependencies via
        module field metadata.
      properties:
        code:
          type: string
          description: Error code indicating a dependent field mismatch.
          enum:
            - DEPENDENT_MISMATCH
        details:
          type: object
          additionalProperties: false
          description: Error details identifying the dependent field conflict.
          properties:
            dependee:
              type: object
              additionalProperties: false
              description: The field that the mismatched field depends on.
              properties:
                api_name:
                  type: string
                  description: API name of the dependee field (e.g., type, field.id).
                  maxLength: 255
                json_path:
                  type: string
                  description: JSON path to the dependee field in the request payload.
                  maxLength: 1000
            api_name:
              type: string
              description: API name of the field that caused the mismatch.
              maxLength: 255
            json_path:
              type: string
              description: JSON path pointing to the mismatched value.
              maxLength: 1000
            maximum_length:
              type: integer
              format: int32
              description: Maximum allowed length for the dependent value.
        message:
          type: string
          description: Error message describing the dependent field mismatch.
          example: the value does not match with the dependent field
          maxLength: 255
        status:
          type: string
          description: Error status.
          enum:
            - error
      required:
        - code
        - details
        - message
        - status
      title: Task Dependent Mismatch Schema
    AutomationFieldAttributes:
      x-zs-$id: AutomationFieldAttributes
      type: object
      additionalProperties: false
      description: >-
        Identifies the target CRM field to which a mapping value is applied
        within an automation rule. The api_name and ID properties must both be
        supplied and must refer to the same field; a mismatch between the two
        causes an AMBIGUITY_DURING_PROCESSING error. Available fields for a
        given module can be discovered via GET
        /settings/fields?module={api_name}.
      x-zs-llm-description: >-
        Target field identifier. Both api_name and id are mandatory  providing
        only one still works but both should be given for reliability. If both
        provided and they refer to different fields:
        AMBIGUITY_DURING_PROCESSING. Obtain from
        getFields?module={module_api_name}. The field must be writable and
        compatible with mapping type.
      properties:
        api_name:
          type: string
          description: >-
            Represents the API name of the target field in the destination
            module — for example, Subject, Due_Date, or Owner — used to identify
            the field receiving the mapped value within automation actions such
            as workflow tasks, create_record, and convert.
          maxLength: 255
          example: Subject
        id:
          type: string
          description: >-
            Represents the numeric identifier of the target CRM field. Used in
            conjunction with the field's API name, both of which must resolve to
            the same field for a mapping to be valid.
          maxLength: 255
          example: '111111000000003529'
      required:
        - api_name
        - id
      title: Automation Field Attributes
    StaticStringValue:
      x-zs-$id: StaticStringValue
      type: string
      description: >-
        Represents a plain string value used as the static value for text,
        picklist, phone, email, URL, number, decimal, currency, and percentage
        fields. Numeric values are expressed as strings rather than numeric
        literals. Picklist values must exactly match one of the options defined
        for the field.
      x-zs-llm-description: >-
        String value for type=static mappings. Applies to: text, picklist,
        phone, email, URL, number, decimal, currency, percentage fields. Numbers
        must be sent as strings (e.g., '100' not 100). Picklist values must
        match available options  invalid values return INVALID_DATA.
      maxLength: 1000
      example: High
    StaticArrayValue:
      x-zs-$id: StaticArrayValue
      type: array
      description: >-
        Represents an array of string values used as the static value for
        multiselectpicklist fields, where each element corresponds to an
        available picklist option. Valid option labels are retrievable from the
        GET /settings/fields endpoint filtered by data_type=multiselectpicklist.
      x-zs-llm-description: >-
        Array value for type=static on multiselect_picklist fields. Each element
        must match an available picklist option. Discover valid options from
        getFields for the target module. Invalid options return INVALID_DATA.
      items:
        type: string
        description: >-
          A single picklist option string to include in the multi-select field
          value. Each entry corresponds to one selectable option as defined for
          the target field in Zoho CRM.
        maxLength: 255
        example: Option1
      minItems: 1
      maxItems: 50
    StaticObjectValue:
      x-zs-$id: StaticObjectValue
      type: object
      additionalProperties: true
      description: >-
        Represents an object value used as the static value for ownerlookup and
        layout fields, containing an ID that identifies the target user or
        layout and an optional name that the server resolves from the ID when
        not supplied. Typically used to assign record ownership by providing the
        user ID.
      x-zs-llm-description: >-
        Object value for type=static on ownerlookup and layout fields. id is
        mandatory (user ID or layout ID). name is optional server resolves from
        id. Use getUsers for owner IDs, getLayouts for layout IDs.
      properties:
        id:
          type: string
          description: >-
            The system identifier of the referenced entity, such as a user or
            layout record. This value drives entity resolution by the automation
            engine and must be provided when the target field references an
            entity.
          maxLength: 255
          example: '111113000000059916'
        name:
          type: string
          description: >-
            The display name of the referenced entity, such as a user full name
            or a layout label. When omitted from a request payload, the server
            resolves and populates this property from the supplied ID. The
            property is present in all GET responses.
          maxLength: 255
          example: John Doe
      required:
        - id
      title: Static Object Value
    StaticFieldMapping:
      x-zs-$id: StaticFieldMapping
      type: object
      additionalProperties: false
      description: >-
        Represents a static-type mapping that assigns a literal value directly
        to the target field at execution time. The value shape varies by field
        data type: a plain string for text, picklist, phone, email, URL, number,
        decimal, currency, and percentage fields (numeric values expressed as
        strings); an array of strings for multiselectpicklist fields; and an
        object containing ID and name for ownerlookup fields. Date, datetime,
        and ALARM fields do not support this type — use execution_time instead,
        as static on those fields produces a DEPENDENT_MISMATCH error. Fields
        marked unique in the module settings also require merge_field rather
        than static for create_record actions.
      x-zs-llm-description: >-
        type='static' mapping. Value is used as-is without runtime resolution.
        NOT for Date/DateTime/ALARM fields (use execution_time  static returns
        DEPENDENT_MISMATCH). NOT for unique fields or formula fields. Value
        structure depends on field data_type: string for most fields, array for
        multiselect_picklist, object for ownerlookup/layout.
      properties:
        display_value:
          type: string
          description: >-
            The server-computed representation of the mapped value, included in
            GET responses. Omitted from create and update requests.
          maxLength: 500
        field:
          $ref: '#/components/schemas/AutomationFieldAttributes'
          description: >-
            Target field to populate when the automation executes. api_name is
            required. If id is also provided, both must refer to the same field;
            otherwise the API returns AMBIGUITY_DURING_PROCESSING.
        type:
          type: string
          const: static
          description: >-
            Identifies the mapping strategy for this field assignment. The value
            must be `static`, which instructs the automation engine to assign a
            fixed, literal value to the target field at execution time rather
            than resolving it dynamically.
        value:
          description: >-
            The literal value assigned to the target field at automation
            execution time. The expected shape is determined by the target field
            data_type, discoverable via GET /settings/fields?module={module}.
            For most field types, supply a string (for example, "High", "Not
            Started", "1234"). For multi-select picklist fields (data_type:
            multiselectpicklist), supply an array of option strings. For fields
            that reference an entity such as an owner or layout (data_type:
            ownerlookup), supply an object with at minimum the entity ID.
          oneOf:
            - $ref: '#/components/schemas/StaticStringValue'
            - $ref: '#/components/schemas/StaticArrayValue'
            - $ref: '#/components/schemas/StaticObjectValue'
      required:
        - field
        - type
        - value
      title: Static Field Mapping
    MergeFieldStringValue:
      x-zs-$id: MergeFieldStringValue
      type: string
      description: >-
        Represents the string value carried by a merge_field mapping, containing
        one or more runtime-resolved token references. Supports direct field
        tokens (${!Module.Field}), lookup traversal tokens
        (${!Module.Lookup.Field}), and system tokens (${CURRENTTIME},
        ${CURRENTUSER}). Tokens may be combined with surrounding text for
        multi-line field targets. Fields that hold a single typed value such as
        email or URL accept exactly one token.
      x-zs-llm-description: >-
        String containing merge-field tokens for type=merge_field mappings.
        Resolved at runtime. Formats: ${!Module.Field} (direct access),
        ${!Module.Lookup.Field} (traverse lookup). Multiple tokens can be
        combined in one string. Unsupported tokens return
        UNSUPPORTED_MERGE_FIELD error.
      maxLength: 1000
      example: ${!Leads.First_Name}
    MergeFieldMapping:
      x-zs-$id: MergeFieldMapping
      type: object
      additionalProperties: false
      description: >-
        Represents a merge_field-type mapping whose value is resolved at
        execution time by substituting token references with live field data.
        Supports direct field tokens (${!Module.Field}), traversal tokens
        (${!Module.Lookup.Field}), and system tokens (${CURRENTTIME},
        ${CURRENTUSER}). Applies to text-based fields such as Subject,
        Description, and custom text fields. Targeting owner or lookup fields
        with this type produces a DEPENDENT_MISMATCH error; those fields require
        a static mapping using an object with a numeric identifier and an
        optional name. Multiple tokens may be chained with surrounding text for
        multi-line fields, while single-value fields such as email or URL accept
        exactly one token.
      x-zs-llm-description: >-
        type='merge_field' mapping. Value contains ${!Module.Field} tokens
        resolved at execution time. ONLY for text-based fields (Subject,
        Description, etc.)  using on date/number/picklist fields returns
        DEPENDENT_MISMATCH. Supports lookup traversal: ${!Module.Lookup.Field}.
        Multi-module not supported.
      properties:
        display_value:
          type: string
          description: >-
            The server-computed representation of the mapped value, included in
            GET responses. Omitted from create and update requests.
          maxLength: 500
        field:
          $ref: '#/components/schemas/AutomationFieldAttributes'
          description: >-
            Target field to populate when the automation executes. api_name is
            required. If id is also provided, both must refer to the same field;
            otherwise the API returns AMBIGUITY_DURING_PROCESSING.
        type:
          type: string
          const: merge_field
          description: >-
            Identifies the mapping strategy for this field assignment. The value
            must be `merge_field`, which instructs the automation engine to
            resolve the field value dynamically from a merge field token at
            execution time rather than from a static literal.
        value:
          $ref: '#/components/schemas/MergeFieldStringValue'
          description: >-
            A string containing one or more ${!...} merge-field tokens resolved
            at runtime.
        allow_agent_user:
          type: boolean
          description: >-
            Controls whether agent users are eligible for record assignment.
            Possible values:

            **true** — agent users are included in the assignment pool alongside
            standard users.

            **false** — agent users are excluded from assignment.

            Applies to mapping types role, group, profile, merge_field, and
            criteria. Does not apply to user or assignment_rule types.
          default: false
      required:
        - field
        - type
        - value
      title: Merge Field Mapping
    ExecutionTimeValue:
      x-zs-$id: ExecutionTimeValue
      type: object
      additionalProperties: false
      description: >-
        Represents the offset configuration used by an execution_time mapping to
        compute a final date, datetime, or ALARM value at runtime. Contains
        period (the time unit granularity), unit (the numeric magnitude
        expressed as a string integer), and trigger_field (a merge token or
        ${CURRENTTIME}). Date fields use period, unit, and trigger_field with an
        implied positive direction. Datetime fields additionally accept sign to
        control direction. ALARM fields additionally accept time and
        notify_type, and always require a minus sign. Workflow task actions
        restrict period to days or business_days.
      x-zs-llm-description: >-
        Offset computation object for date/datetime/ALARM fields. Required
        fields: period ('days'|'hours'|'minutes'), unit (string integer 
        quantity), trigger_field (merge-field token like ${!Leads.Created_Time}
        or ${CURRENTTIME}). Optional: sign ('positive' for after, 'negative' for
        before  default varies by context). Missing required fields return
        DEPENDENT_FIELD_MISSING.
      properties:
        period:
          type: string
          description: >-
            The calendar or time unit applied to the offset. Possible values:

            **days** — counts all calendar days including weekends and holidays;
            supported by every action type.

            **business_days** — excludes weekends and requires the
            organisation's business-day setting to be enabled; supported by all
            action types.

            **hours** — available only for create_record, add_meeting, and
            schedule_call.

            **minutes** — available only for create_record, add_meeting, and
            schedule_call.

            workflow_tasks accept only **days** or **business_days**.
          enum:
            - days
            - business_days
            - hours
            - minutes
        unit:
          type: string
          description: >-
            The number of period units to offset from the trigger date, supplied
            as a non-negative integer string (for example, "1", "30"). Passing
            "0" produces a same-day result, such as scheduling a Remind_At on
            the same day as the due date.
          pattern: ^[0-9]+$
          maxLength: 20
          example: '1'
        sign:
          type: string
          description: >-
            The direction of the offset relative to the trigger date. Possible
            values:

            **plus** — places the computed value after the trigger (for example,
            a due date two days after record creation).

            **minus** — places the computed value before the trigger (for
            example, a reminder one day before the due date).

            For datetime fields (data_type=datetime) a value is expected;
            omitting it returns a DEPENDENT_FIELD_MISSING error. For date-only
            fields (data_type=date) the value defaults to **plus** when absent.
            When targeting Remind_At (data_type=ALARM), **minus** is the only
            applicable direction.
          enum:
            - plus
            - minus
          default: plus
        trigger_field:
          type: string
          description: >-
            The reference date or datetime field from which the offset is
            measured. Accepts a merge-field token that resolves to a Date or
            DateTime field on the parent module (for example,
            "${!Leads.Modified_Time}", "${!Tasks.Due_Date}"), or the reserved
            constant "${CURRENTTIME}" to use the automation execution timestamp.
            When computing a Remind_At (ALARM) value, "${!Tasks.Due_Date}" is
            the typical anchor.
          maxLength: 255
          example: ${CURRENTTIME}
        time:
          type: string
          description: >-
            The time-of-day component of the computed value, expressed in
            24-hour HH:mm format (for example, "13:00", "01:30"). Applies when
            the target field carries data type datetime or ALARM (as reported by
            GET /settings/fields). Supplying this property for a date-only field
            (data_type=date) produces a validation error.
          maxLength: 20
          example: '13:00'
        notify_type:
          type: string
          description: >-
            The notification channel used to deliver the reminder. Applies
            exclusively when the target field carries data type ALARM (i.e.,
            Remind_At); date and datetime fields do not use this property.
            Possible values:

            **popup** — triggers an in-app notification.

            **email** — sends a message to the task owner.

            **emailandpopup** — delivers both simultaneously.
          enum:
            - popup
            - email
            - emailandpopup
      required:
        - period
        - unit
        - trigger_field
      title: Execution Time Value
    ExecutionTimeFieldMapping:
      x-zs-$id: ExecutionTimeFieldMapping
      type: object
      additionalProperties: false
      description: >-
        Represents an execution_time-type field mapping that computes a date,
        datetime, or ALARM value at runtime by applying a signed offset to a
        trigger field or the current time. The value carries an
        ExecutionTimeValue object specifying the period, unit, trigger_field,
        and optional time or notify_type properties. A plus sign places the
        result after the trigger; a minus sign places it before. ALARM fields
        always require minus. Workflow task actions support only days and
        business_days as period values.
      x-zs-llm-description: >-
        type='execution_time' mapping. REQUIRED for Date, DateTime, and ALARM
        field types (static/merge_field on these returns DEPENDENT_MISMATCH).
        Computes value as offset from trigger_field. Value object needs: period
        ('days'|'hours'|'minutes'), unit (integer as string), trigger_field
        (merge token or ${CURRENTTIME}), sign (for before/after offset).
      properties:
        display_value:
          type: string
          description: >-
            The server-computed representation of the mapped value, included in
            GET responses. Omitted from create and update requests.
          maxLength: 500
        field:
          $ref: '#/components/schemas/AutomationFieldAttributes'
          description: >-
            Target field to populate when the automation executes. api_name is
            required. If id is also provided, both must refer to the same field;
            otherwise the API returns AMBIGUITY_DURING_PROCESSING.
        type:
          type: string
          const: execution_time
          description: >-
            Identifies the mapping variant as an execution-time offset. The
            value is always "execution_time" for this schema and acts as the
            polymorphic discriminator across the AutomationFieldMappings union.
        value:
          $ref: '#/components/schemas/ExecutionTimeValue'
          description: >-
            Execution-time object specifying how to compute the date/datetime
            offset from a reference field.
      required:
        - field
        - type
        - value
      title: Execution Time Field Mapping
    CompositeFieldMapping:
      x-zs-$id: CompositeFieldMapping
      type: object
      additionalProperties: false
      description: >-
        Represents a composite-type field mapping used exclusively for the
        Participants field in the Events module via the add_meeting action. The
        value carries a structured object that encodes participant data and is
        not applicable to any other field or automation action type.
      x-zs-llm-description: >-
        type='composite' mapping. Used ONLY for the Participants field in Events
        module (add_meeting action). Value is a structured object representing
        multiple participant entries. Cannot be used on other field types 
        returns NOT_ALLOWED.
      properties:
        display_value:
          type: string
          description: >-
            The server-computed representation of the mapped value, included in
            GET responses. Omitted from create and update requests.
          maxLength: 500
        field:
          $ref: '#/components/schemas/AutomationFieldAttributes'
          description: >-
            Target field to populate when the automation executes. api_name is
            required. If id is also provided, both must refer to the same field;
            otherwise the API returns AMBIGUITY_DURING_PROCESSING.
        type:
          type: string
          const: composite
          description: >-
            Serves as the polymorphic discriminator that identifies this field
            mapping as a composite mapping; the value must be set to "composite"
            to select this schema variant.
        value:
          type: object
          description: >-
            Holds the structured composite object that encodes participant data
            for the Events module Participants field; the shape of this object
            varies according to the participant type configuration defined for
            the automation rule.
          additionalProperties: true
      required:
        - field
        - type
        - value
      title: Composite Field Mapping
    AutomationFieldMappings:
      x-zs-$id: AutomationFieldMappings
      description: >-
        Represents a single field-to-value mapping used within automation
        actions such as workflow tasks, create_record, add_meeting, and
        schedule_call. Each mapping identifies a target field via api_name or
        ID, declares a type discriminator that determines value interpretation,
        and supplies a value whose shape varies by type: static supplies a
        literal value, merge_field supplies a runtime-resolved token string,
        execution_time supplies a date or datetime offset object, and composite
        supplies structured participant data for the Events Participants field.
        The field_mappings array must include all fields the target module
        requires; omitting any produces a REQUIRED_DATA_NOT_FOUND error.
      x-zs-llm-description: >-
        A single field-to-value mapping entry used in create_record,
        add_meeting, schedule_call, convert, and workflow task actions. Each
        entry targets one field and assigns a typed value. The type field
        discriminates the value structure: static (literal), merge_field
        (runtime token), execution_time (date offset), composite (multi-value).
        field identifies the target, type selects the value schema, value
        provides the data.
      oneOf:
        - $ref: '#/components/schemas/StaticFieldMapping'
        - $ref: '#/components/schemas/MergeFieldMapping'
        - $ref: '#/components/schemas/ExecutionTimeFieldMapping'
        - $ref: '#/components/schemas/CompositeFieldMapping'
      discriminator:
        propertyName: type
        mapping:
          static: '#/components/schemas/StaticFieldMapping'
          merge_field: '#/components/schemas/MergeFieldMapping'
          execution_time: '#/components/schemas/ExecutionTimeFieldMapping'
          composite: '#/components/schemas/CompositeFieldMapping'
      title: Automation Field Mappings
    AutomationFieldMappingDependentFieldMissingError:
      type: object
      x-zs-$id: AutomationFieldMappingDependentFieldMissingError
      additionalProperties: false
      description: >-
        Returned when a required sub-property is absent from an execution_time
        value object. This error occurs when type is set to execution_time but
        one or more of its dependent properties — such as period or unit — are
        not included in the submitted value payload.
      x-zs-llm-description: >-
        Error code: DEPENDENT_FIELD_MISSING. A required sub-field is missing in
        an execution_time value. Common: period, unit, or trigger_field absent
        when type=execution_time. Fix: provide all required execution_time value
        fields.
      properties:
        code:
          type: string
          description: >-
            Identifies the error code for the condition in which a field mapping
            is rejected because a required dependent field is absent from the
            automation action payload.
          enum:
            - DEPENDENT_FIELD_MISSING
        details:
          type: object
          additionalProperties: false
          description: >-
            Contains structured diagnostic information that identifies the
            absent dependent field and the field whose value or presence governs
            the dependency relationship.
          properties:
            dependee:
              type: object
              additionalProperties: false
              description: >-
                Represents the field whose presence or selected value
                establishes a requirement for the missing or mismatched
                dependent field, providing context for resolving the dependency
                violation.
              properties:
                api_name:
                  type: string
                  description: >-
                    Indicates the API name of the field that drives the
                    dependency requirement, such as a type selector or a nested
                    field identifier, enabling callers to locate the governing
                    field within the automation mapping.
                  maxLength: 255
                json_path:
                  type: string
                  description: >-
                    Indicates the path within the automation action request body
                    that resolves to the dependee field, allowing callers to
                    locate its exact position in the payload structure.
                  maxLength: 1000
            api_name:
              type: string
              description: >-
                Indicates the API name of the dependent field that was expected
                but not found in the automation action payload, such as a unit
                or period qualifier associated with another field's value.
              maxLength: 255
            json_path:
              type: string
              description: >-
                Indicates the path within the automation action request body
                pointing to the location where the absent dependent field was
                expected to appear.
              maxLength: 1000
        message:
          type: string
          description: >-
            Provides a descriptive explanation of the dependent-field-missing
            error, describing which field was absent and the context in which it
            was required.
          example: Dependent Field missing
          maxLength: 255
        status:
          type: string
          description: >-
            Indicates the top-level outcome classification of the error response
            when a dependent field is absent from the automation field mapping
            payload.
          enum:
            - error
      required:
        - code
        - details
        - message
        - status
      title: Field Mapping Dependent Field Missing Error
    AutomationFieldMappingExpectedFieldMissingError:
      type: object
      x-zs-$id: AutomationFieldMappingExpectedFieldMissingError
      additionalProperties: false
      description: >-
        Represents a validation error returned by the API when a field_mapping
        entry omits the field object entirely or provides a field object that
        contains neither api_name nor ID, leaving the target field unresolvable.
      x-zs-llm-description: >-
        Error code: EXPECTED_FIELD_MISSING. The field object in a mapping entry
        exists but contains neither api_name nor id. Fix: provide at least one
        field identifier. Different from MANDATORY_NOT_FOUND where the field
        object itself is absent.
      properties:
        code:
          type: string
          description: >-
            Identifies the error code for the condition in which one or more
            expected field identifiers are absent from the request payload.
          enum:
            - EXPECTED_FIELD_MISSING
        details:
          type: object
          additionalProperties: false
          description: >-
            Contains the structured breakdown of expected field identifiers that
            were absent from the request payload, enabling precise
            identification of which fields were anticipated but not received.
          properties:
            expected_fields:
              type: array
              description: >-
                A collection of field identifier objects, each representing an
                anticipated field — referenced by its api_name, ID, or both —
                that was not present in the submitted request.
              items:
                type: object
                additionalProperties: false
                description: >-
                  Represents a single anticipated field identifier, pairing the
                  identifier name with its precise JSON path location within the
                  request payload where the value was expected to appear.
                properties:
                  api_name:
                    type: string
                    description: >-
                      Specifies the name of the field identifier that was
                      expected, such as api_name or ID, indicating which
                      identifier type was looked up during field resolution.
                    maxLength: 255
                  json_path:
                    type: string
                    description: >-
                      Provides the JSON path that pinpoints the exact location
                      within the request payload where the missing identifier
                      was expected to reside.
                    maxLength: 1000
              maxItems: 25
        message:
          type: string
          description: >-
            Provides a descriptive explanation of the expected-field-missing
            error, summarising why the operation could not be completed due to
            absent field identifiers.
          example: Specify atleast one field
          maxLength: 255
        status:
          type: string
          description: >-
            Indicates the top-level outcome classification of the error response
            when expected field identifiers are absent from the request payload.
          enum:
            - error
      required:
        - code
        - details
        - message
        - status
      title: Field Mapping Expected Field Missing Error
    AutomationFieldMappingRequiredDataNotFoundError:
      type: object
      x-zs-$id: AutomationFieldMappingRequiredDataNotFoundError
      additionalProperties: false
      description: >-
        Represents a validation error returned by the API when a field that the
        target module requires (such as Subject for Tasks) is absent from the
        field_mappings array. The details.value property identifies the missing
        field, and details.sub_json_path indicates the nested property path used
        to locate it.
      x-zs-llm-description: >-
        Error code: REQUIRED_DATA_NOT_FOUND. A mandatory field of the target
        module is not included in field_mappings. Common: Subject missing for
        Tasks, Event_Title missing for Events, Last_Name missing for Contacts.
        Fix: include all mandatory module fields in the field_mappings array.
      properties:
        code:
          type: string
          description: >-
            Identifies the error code for the condition in which required data
            is absent from the field_mappings payload.
          enum:
            - REQUIRED_DATA_NOT_FOUND
        details:
          type: object
          additionalProperties: false
          description: >-
            Supplies contextual information that pinpoints the specific field
            entry absent from the field_mappings collection, enabling precise
            identification of the missing data.
          properties:
            sub_json_path:
              type: string
              description: >-
                Indicates the nested property path, such as field.api_name, that
                further narrows the location of the missing field within the
                field_mappings structure.
              maxLength: 255
            api_name:
              type: string
              description: >-
                Denotes the property name context, such as api_name, associated
                with the field entry where required data was not found in
                field_mappings.
              maxLength: 255
            json_path:
              type: string
              description: >-
                Specifies the JSON path pointing to the position within the
                field_mappings array where the expected entry was not found.
              maxLength: 1000
            value:
              type: string
              description: >-
                Holds the api_name of the field that was expected but not found
                in field_mappings, such as Subject for Tasks, enabling callers
                to identify exactly which field requires attention.
              maxLength: 255
        message:
          type: string
          description: >-
            Provides a descriptive explanation of the error returned when
            required data is not found within the field_mappings payload.
          example: The required data missing
          maxLength: 255
        status:
          type: string
          description: >-
            Indicates the top-level outcome classification of the error response
            when required data is absent from the field_mappings payload.
          enum:
            - error
      required:
        - code
        - details
        - message
        - status
      title: Field Mapping Required Data Not Found Error
  parameters:
    ParamQueryPage:
      name: page
      in: query
      description: >-
        To get the list of tasks from the respective pages. The default value is
        1. Possible values: Positive integer values only.
      required: false
      schema:
        type: integer
        format: int32
        minimum: 1
        default: 1
        example: 1
    ParamQueryPerPage:
      name: per_page
      in: query
      description: >-
        Specify how many tasks to return per page. The default and the maximum
        possible value is 200.
      required: false
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 200
        default: 200
        example: 200
    ParamQuerySortBy:
      name: sort_by
      in: query
      description: Sort field. Currently only modified_time supported.
      required: false
      schema:
        type: string
        enum:
          - modified_time
    ParamQuerySortOrder:
      name: sort_order
      in: query
      description: 'Sort order for the results based on sort_by. Possible values: desc, asc.'
      required: false
      schema:
        type: string
        enum:
          - desc
          - asc
    ParamQueryIncludeInnerDetails:
      name: include_inner_details
      in: query
      description: >-
        Include additional nested labels/display metadata in task responses.
        Pass exactly one value per request (not comma-separated). Use
        "display_value" to include field_mapping display labels. Use
        "module.module_name" or "module.singular_label" to include module
        display names. Omit this parameter if you only need the raw task
        configuration.
      required: false
      schema:
        type: string
        enum:
          - related_module.module_name
          - related_module.plural_label
          - related_module.singular_label
          - display_value
          - module.module_name
          - module.plural_label
          - module.singular_label
        example: display_value
    ParamQueryFeatureType:
      name: feature_type
      in: query
      description: >-
        Filter tasks by automation feature type. The filter accepts more values
        than POST does - values like `blueprint_transition`, `review_process`,
        and `orchestration` are system-created task types that can be retrieved
        but not created via POST. For POST, only `workflow`, `approval_process`,
        `Blueprint`, `kiosks`, `scoring_rule`, and `case_escalation_rule` are
        valid.
      required: false
      schema:
        type: string
        enum:
          - workflow
          - approval_process
          - blueprint
          - kiosks
          - scoring_rule
          - case_escalation_rule
          - blueprint_transition
          - blueprint_state
          - review_process
          - orchestration
          - assignment_rules
          - pathfinder
          - connected_workflows
          - commandcenter_service
          - cadences
    ParamQueryModule:
      name: module
      in: query
      description: >-
        Filter tasks by CRM module API name (for example: Leads, Contacts,
        Deals).
      required: false
      schema:
        type: string
        maxLength: 100
        example: Leads
    ParamQueryFilter:
      name: filter
      in: query
      description: >-
        Filter object to search tasks by name. Supported shape: field.api_name
        must be 'name', comparator must be 'contains', and value is the search
        string. Example:
        {"field":{"api_name":"name"},"comparator":"contains","value":"follow
        up"}
      required: false
      schema:
        type: string
        maxLength: 1000
        example: >-
          {"field":{"api_name":"name"},"comparator":"contains","value":"follow
          up"}
    ParamQueryIds:
      name: ids
      in: query
      description: >-
        Comma-separated automation task definition IDs to delete in bulk.
        Maximum 10 IDs per request. Each ID must be a numeric string (e.g.,
        "111111000000200035,111111000000190030"). Tasks associated with active
        automation cannot be deleted  - returns NOT_ALLOWED per task.
      required: true
      schema:
        type: string
        maxLength: 255
        pattern: ^[0-9]{1,20}(,[0-9]{1,20}){0,9}$
        example: 111111000000200035,111111000000190030,111111000000165002
  securitySchemes:
    OAuth2:
      type: oauth2
      description: OAuth2 authentication for API access
      flows:
        authorizationCode:
          authorizationUrl: https://accounts.zoho.com/oauth/v2/auth
          tokenUrl: https://accounts.zoho.com/oauth/v2/token
          refreshUrl: https://accounts.zoho.com/oauth/v2/token
          scopes:
            ZohoCRM.settings.automation_actions.READ: Read access for Automation Actions settings in Zoho CRM
            ZohoCRM.settings.automation_actions.CREATE: Create access for Automation Actions settings in Zoho CRM
            ZohoCRM.settings.automation_actions.UPDATE: Update access for Automation Actions settings in Zoho CRM
            ZohoCRM.settings.automation_actions.DELETE: Delete access for Automation Actions settings in Zoho CRM
