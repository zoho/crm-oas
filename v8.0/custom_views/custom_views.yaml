            dependee field that governs valid comparator values, and the array
            of supported comparator values.
          additionalProperties: false
          required:
            - dependee
            - api_name
            - json_path
            - supported_values
          properties:
            dependee:
              type: object
              description: >-
                The dependee field whose value determines which comparator
                values are valid for the criterion field that raised the
                DEPENDENT_MISMATCH error. Contains the API name and JSON path of
                the dependee field.
              additionalProperties: false
              required:
                - api_name
                - json_path
              properties:
                api_name:
                  type: string
                  description: >-
                    API name of the dependee field that determines the valid
                    comparator values for the criterion field in error.
                  maxLength: 256
                json_path:
                  type: string
                  description: >-
                    JSON path locating the dependee field within the request
                    body.
                  maxLength: 512
            api_name:
              type: string
              description: >-
                Represents the API name of the criterion field whose comparator
                value does not match any of the supported values determined by
                the dependee field.
              maxLength: 256
            json_path:
              type: string
              description: >-
                Represents the JSON path locating the criterion field whose
                comparator value does not match any of the supported values
                determined by the dependee field.
              maxLength: 512
            supported_values:
              type: array
              items:
                type: string
                description: >-
                  Represents one supported comparator value valid for the
                  criterion field, as determined by the dependee field.
                maxLength: 256
              minItems: 1
              maxItems: 100
              description: >-
                Contains the comparator values that are valid for the criterion
                field, as determined by the dependee field.
        message:
          type: string
          description: >-
            Represents the error message describing the comparator mismatch
            condition for the criterion field.
          maxLength: 512
        status:
          type: string
          enum:
            - error
          description: 'Represents the status of the error response. Possible values: error.'
    FieldValueMismatch:
      type: object
      x-zs-$id: FieldValueMismatch
      description: >-
        Represents the error response returned when the data type of the value
        supplied for a criterion field does not match the expected data type
        determined by the dependee field. Returned with error code
        DEPENDENT_MISMATCH. Contains details identifying the mismatched
        criterion field, its dependee field, and the expected data type.
      additionalProperties: false
      required:
        - code
        - details
        - message
        - status
      properties:
        code:
          type: string
          description: >-
            Represents the error code identifying the type of error condition
            encountered. Possible values: DEPENDENT_MISMATCH.
          enum:
            - DEPENDENT_MISMATCH
        details:
          type: object
          description: >-
            Contains detailed information about the data type mismatch,
            including the criterion field that raised the error, the dependee
            field whose value determines the expected data type, and the
            expected data type itself.
          additionalProperties: false
          required:
            - dependee
            - api_name
            - json_path
            - expected_data_type
          properties:
            dependee:
              type: object
              description: >-
                Represents the dependee field whose value determines the
                expected data type for the criterion field that raised the
                mismatch error. Contains the API name and JSON path of the
                dependee field.
              additionalProperties: false
              required:
                - api_name
                - json_path
              properties:
                api_name:
                  type: string
                  description: >-
                    API name of the dependee field that determines the expected
                    data type for the criterion field in error.
                  maxLength: 256
                json_path:
                  type: string
                  description: >-
                    JSON path locating the dependee field within the request
                    body.
                  maxLength: 512
            api_name:
              type: string
              description: >-
                API name of the criterion field whose value does not match the
                expected data type.
              maxLength: 256
            json_path:
              type: string
              description: >-
                JSON path locating the criterion field whose value contains the
                data type mismatch.
              maxLength: 512
            expected_data_type:
              type: string
              description: >-
                Data type expected for the criterion field value, as determined
                by the dependee field.
              maxLength: 256
        message:
          type: string
          description: >-
            Descriptive message providing details about the field value mismatch
            error.
          maxLength: 512
        status:
          type: string
          enum:
            - error
          description: 'Status of the response. Possible values: error.'
    ComparatorValueMismatch:
      type: object
      x-zs-$id: ComparatorValueMismatch
      description: >-
        Error schema returned when the comparator value itself does not satisfy
        the dependency validation rules imposed by the dependee field. Carries
        error code DEPENDENT_MISMATCH and includes details identifying the
        criterion field with the invalid comparator value, its dependee field
        (api_name, json_path), and the criterion field own api_name and
        json_path.
      additionalProperties: false
      required:
        - code
        - details
        - message
        - status
      properties:
        code:
          type: string
          description: >-
            Error code identifying the comparator dependency mismatch condition.
            Possible values: DEPENDENT_MISMATCH.
          enum:
            - DEPENDENT_MISMATCH
        details:
          type: object
          description: >-
            Object containing diagnostic detail about the dependency mismatch,
            including the criterion field with the invalid comparator value
            (api_name, json_path) and the dependee field that imposed the
            violated validation rule (dependee.api_name, dependee.json_path).
          additionalProperties: false
          required:
            - dependee
            - api_name
            - json_path
          properties:
            dependee:
              type: object
              description: >-
                Identifies the dependee field whose value determines the
                validation rules applied to the comparator of the criterion
                field in error. Contains the API name and JSON path of the
                dependee field.
              additionalProperties: false
              required:
                - api_name
                - json_path
              properties:
                api_name:
                  type: string
                  description: >-
                    API name of the dependee field whose value imposed the
                    violated validation rule on the criterion field comparator.
                  maxLength: 256
                json_path:
                  type: string
                  description: >-
                    JSON path locating the dependee field within the request
                    body.
                  maxLength: 512
            api_name:
              type: string
              description: >-
                API name of the criterion field whose comparator value does not
                satisfy the dependency rule imposed by the dependee field.
              maxLength: 256
            json_path:
              type: string
              description: >-
                JSON path locating the criterion field with the invalid
                comparator value within the request body.
              maxLength: 512
        message:
          type: string
          description: >-
            Descriptive message providing details about the comparator value
            mismatch error.
          maxLength: 512
        status:
          type: string
          enum:
            - error
          description: >-
            Status of the response indicating the outcome of the request.
            Possible values: error.
    InvalidComparator:
      type: object
      x-zs-$id: InvalidComparator
      description: >-
        Error schema returned when the comparator specified in a criterion field
        is not one of the allowed comparator values for the given field type.
        Returned with error code INVALID_DATA. The details object identifies the
        offending field by API name and JSON path, and enumerates the supported
        comparator values.
      additionalProperties: false
      required:
        - code
        - details
        - message
        - status
      properties:
        code:
          type: string
          description: >-
            Error code identifying the category of error. Possible values:
            INVALID_DATA.
          enum:
            - INVALID_DATA
        details:
          type: object
          description: >-
            Contains structured information about the invalid comparator error.
            Identifies the offending criterion field by API name and JSON path,
            and provides the list of supported comparator values valid for the
            given field type.
          additionalProperties: false
          required:
            - api_name
            - json_path
            - supported_values
          properties:
            api_name:
              type: string
              description: >-
                API name of the criterion field for which an invalid comparator
                was specified.
              maxLength: 256
            json_path:
              type: string
              description: >-
                JSON path locating the criterion field with the invalid
                comparator within the request body.
              maxLength: 512
            supported_values:
              type: array
              items:
                type: string
                description: >-
                  Represents one valid comparator value accepted for the
                  criterion field type.
                maxLength: 256
              minItems: 1
              maxItems: 100
              description: >-
                Contains the comparator values that are valid for the criterion
                field type.
        message:
          type: string
          description: >-
            Descriptive error message conveying the nature of the invalid
            comparator condition to the caller.
          maxLength: 512
        status:
          type: string
          enum:
            - error
          description: >-
            Status of the response indicating the outcome of the request.
            Possible values: error.
    LookupLimitExceeded:
      type: object
      x-zs-$id: LookupLimitExceeded
      description: >-
        Represents the error response returned when the count of lookup fields
        used in criterion expressions exceeds the allowed limit. The error code
        is LOOKUP_LIMIT_EXCEEDED. The details object contains a used_in array
        (minItems: 1, maxItems: 10) in which each entry identifies an affected
        location by name and provides the relevant lookup fields and the
        applicable lookup limit.
      additionalProperties: false
      required:
        - code
        - details
        - message
        - status
      properties:
        code:
          type: string
          description: >-
            Identifies the error code that signals the lookup field limit has
            been exceeded. Possible values: LOOKUP_LIMIT_EXCEEDED.
          enum:
            - LOOKUP_LIMIT_EXCEEDED
        details:
          type: object
          description: >-
            Provides structured information about the locations where the lookup
            field count exceeded the allowed limit. The required used_in array
            contains objects that each specify a location name (such as
            "criteria" or "cross_filters"), the lookup fields in use, and the
            applicable lookup limit.
          additionalProperties: false
          required:
            - used_in
          properties:
            used_in:
              type: array
              description: >-
                Lists the locations (for example, "criteria" or "cross_filters")
                where lookup field usage exceeded the allowed limit. Each entry
                in the array contains a location name, the lookup fields
                involved, and the applicable lookup limit. The array contains
                between 1 and 10 items.
              minItems: 1
              maxItems: 10
              items:
                type: object
                additionalProperties: false
                description: >-
                  Represents one location — such as criteria or cross_filters —
                  where lookup field usage has exceeded the allowed limit. Each
                  entry identifies the location by name, lists the offending
                  lookup fields, and specifies the maximum number of lookup
                  fields permitted in that location.
                required:
                  - name
                  - lookup_fields
                  - lookup_limit
                properties:
                  name:
                    type: string
                    description: >-
                      Identifies the location — such as criteria or
                      cross_filters — where the lookup field count exceeded the
                      allowed limit.
                    maxLength: 256
                  lookup_fields:
                    type: array
                    description: >-
                      Lists the lookup fields present in the specified location
                      that contributed to exceeding the allowed lookup field
                      limit. Contains between 1 and 100 entries, each
                      identifying a single lookup field by its API name.
                    minItems: 1
                    maxItems: 100
                    items:
                      type: object
                      additionalProperties: false
                      description: >-
                        Represents one lookup field used in the specified
                        criterion location that was counted against the lookup
                        field limit. Each entry exposes the API name of the
                        offending field.
                      required:
                        - api_name
                      properties:
                        api_name:
                          type: string
                          description: >-
                            Specifies the API name of a lookup field that was
                            counted against the lookup field limit for the
                            specified location.
                          maxLength: 256
                  lookup_limit:
                    type: integer
                    description: >-
                      Specifies the maximum number of lookup fields permitted in
                      the associated location, such as criteria or
                      cross_filters.
                    format: int32
        message:
          type: string
          description: >-
            Contains a descriptive error message explaining why the lookup field
            limit was exceeded.
          maxLength: 512
        status:
          type: string
          enum:
            - error
          description: 'Indicates the outcome of the request. Possible values: error.'
