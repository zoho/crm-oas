openapi: 3.1.0
info:
  title: Custom Views
  description: >-
    Custom Views are saved filter and sort configurations that allow users to
    display a specific subset of records in a Zoho CRM module. This API enables
    developers to retrieve, create, update, and delete Custom Views, as well as
    manage their sort order and field configuration.
  version: '8'
  license:
    name: Zoho Corporation
    url: https://www.zoho.com
servers:
  - url: https://zohoapis.{dc}/crm/{version}
    description: >-
      Production API server for Zoho CRM. Requests must include the appropriate
      datacenter domain and API version.
    variables:
      dc:
        enum:
          - com
          - eu
          - in
          - cn
          - au
        default: com
        description: >-
          The top-level domain of the Zoho CRM API server, determined by the
          datacenter where the organization is hosted.

          Possible values:

          **com** - United States datacenter.

          **eu** - European Union datacenter.

          **in** - India datacenter.

          **cn** - China datacenter.

          **au** - Australia datacenter.
      version:
        default: v8
        description: The version of the Zoho CRM API.
paths:
  /settings/custom_views:
    put:
      tags:
        - Custom Views
      operationId: updateCustomViewsBulk
      summary: Custom Views
      description: >-
        To update the configuration of one or more Custom Views in bulk for a
        specified module in your Zoho CRM organization.
      parameters:
        - $ref: '#/components/parameters/Module'
      requestBody:
        required: true
        content:
          application/json:
            examples:
              PutRequestBody:
                summary: Bulk update Custom Views request body
                value:
                  custom_views:
                    - id: '2411194000004076067'
                      name: test1
                description: >-
                  Shows a bulk update request body with multiple Custom View
                  configurations.
            schema:
              description: >-
                Represents the request body envelope for bulk updating one or
                more Custom Views.
              type: object
              additionalProperties: false
              properties:
                custom_views:
                  maxItems: 200
                  description: >-
                    Specify the list of Custom Views to update in bulk. Each
                    object must include the Custom View ID and the fields to
                    update.
                  type: array
                  items:
                    $ref: '#/components/schemas/CustomViewPutBulkItem'
        description: >-
          The request body must contain a custom_views array with one or more
          objects, each specifying the ID and updated configuration for a Custom
          View.
      responses:
        '200':
          description: >-
            Returns a success response indicating that all specified Custom
            Views were updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomViewUpdateSuccessResponse'
              examples:
                PutRequestBody:
                  summary: Bulk update success response
                  value:
                    custom_views:
                      - code: SUCCESS
                        details:
                          id: '2411194000004076067'
                        message: custom view updated
                        status: success
                  description: >-
                    Shows a success response for the bulk update Custom Views
                    operation.
        '207':
          description: >-
            Returns a multi-status response when the bulk update partially
            succeeded. Each item indicates whether the update succeeded or
            failed for that Custom View.
          content:
            application/json:
              examples:
                PutRequestBody:
                  summary: Bulk update partial success response
                  value:
                    custom_views:
                      - code: SUCCESS
                        details:
                          id: '2411194000004076067'
                        message: custom view updated
                        status: success
                      - code: DUPLICATE_DATA
                        details:
                          api_name: name
                          json_path: $.custom_views[0].name
                        message: duplicate data
                        status: error
                  description: >-
                    Shows a partial success and failure response for the bulk
                    update operation.
              schema:
                x-zs-$id: CustomViewUpdateMultiStatusFailureDetails
                type: object
                description: >-
                  Represents the multi-status response for the bulk update
                  operation, containing a mix of success and failure items.
                additionalProperties: false
                properties:
                  custom_views:
                    type: array
                    description: >-
                      Represents the list of bulk update results, including both
                      successful and failed items.
                    minItems: 2
                    maxItems: 200
                    items:
                      description: >-
                        Represents a bulk update result item, which can be
                        either a success or a failure response.
                      oneOf:
                        - $ref: '#/components/schemas/CustomViewUpdateSuccess'
                        - $ref: '#/components/schemas/CustomViewWrapFailure'
                        - $ref: '#/components/schemas/CustomViewUpdateFailureItem'
                    allOf:
                      - description: >-
                          Represents a successful bulk update item for a Custom
                          View.
                        contains:
                          $ref: '#/components/schemas/CustomViewUpdateSuccess'
                        minContains: 1
                      - description: >-
                          Represents a bulk update failure item for a Custom
                          View.
                        contains:
                          $ref: '#/components/schemas/CustomViewUpdateFailureItem'
                        minContains: 1
        '400':
          description: >-
            The request contains invalid data or a required field is missing.
            Resolution: Verify that all required fields are present and contain
            valid values, and that each object in the array includes a valid
            Custom View ID.
          content:
            application/json:
              schema:
                x-zs-$id: CustomViewBulkUpdateFailureResponse
                oneOf:
                  - description: 'Flat error: required query parameter missing'
                    $ref: '#/components/schemas/RequiredParameterMissingResponse'
                  - description: 'Flat error: URL/module validation failures'
                    $ref: '#/components/schemas/UrlErrorResponseForCustomView'
                  - description: >-
                      Wrapped error: per-item update failures inside
                      custom_views array
                    $ref: '#/components/schemas/CustomViewUpdateFailureDetails'
                description: >-
                  Represents the error response for an invalid bulk update
                  request.
              examples:
                FailureResponse:
                  summary: Bulk update validation error
                  value:
                    code: REQUIRED_PARAM_MISSING
                    details:
                      param_name: name
                    message: invalid data
                    status: error
                  description: >-
                    Shows an error response when the bulk update request
                    contains invalid data.
        '401':
          description: >-
            Authentication failed or the OAuth access token does not include the
            required scope. Resolution: A new access token must be generated
            with the ZohoCRM.settings.custom_views.UPDATE scope.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/AuthenticationError'
                  - $ref: '#/components/schemas/UnauthorizedResponse'
                  - $ref: '#/components/schemas/CvProfilePermissionError'
                x-zs-$id: UpdateCustomViewsBulkUnauthorizedResponse
                description: >-
                  Represents the error response for an unauthorized bulk update
                  request.
              examples:
                AuthenticationFailure:
                  value:
                    code: AUTHENTICATION_FAILURE
                    details: {}
                    message: Authentication failed
                    status: error
                  description: >-
                    Shows an authentication failure response for the bulk update
                    operation.
                  summary: Authentication failure
                OAuthScopeMismatch:
                  value:
                    code: OAUTH_SCOPE_MISMATCH
                    details: {}
                    message: invalid oauth scope to access this URL
                    status: error
                  description: >-
                    Shows an OAuth scope mismatch error for the bulk update
                    operation.
                  summary: OAuth scope mismatch
        '403':
          description: >-
            Permission denied to update Custom Views for this module.
            Resolution: The CRM administrator must grant the required permission
            to the user's profile.
          content:
            application/json:
              schema:
                x-zs-$id: CustomViewBulkUpdateForbiddenResponse
                oneOf:
                  - $ref: '#/components/schemas/ModuleForbiddenErrorResponse'
                  - $ref: '#/components/schemas/ForbiddenErrorResponse'
                description: >-
                  Represents the error response for a forbidden bulk update
                  request.
              examples:
                FailureResponse:
                  summary: Permission denied
                  value:
                    custom_views:
                      - code: NO_PERMISSION
                        details:
                          api_name: id
                          json_path: $.custom_views[0].id
                        message: >-
                          Permission denied. Locked custom views cannot be
                          customized.
                        status: error
                  description: >-
                    Shows a permission denied response for the bulk update
                    operation.
      security:
        - OAuth2:
            - ZohoCRM.settings.custom_views.UPDATE
    post:
      tags:
        - Custom Views
      summary: CustomView creation
      description: >-
        To create one or more Custom Views for a specified module in your Zoho
        CRM organization.
      operationId: createCustomView
      parameters:
        - $ref: '#/components/parameters/Module'
      requestBody:
        required: true
        content:
          application/json:
            examples:
              PostRequestBody:
                summary: Create Custom View request body
                value:
                  custom_views:
                    - name: crossfilter1
                      access_type: shared
                      shared_to:
                        - name: Jess Moana
                          id: '2411194000000478001'
                          type: users
                          subordinates: null
                      wrap_text: true
                      sort_by:
                        api_name: Created_Time
                        id: '2411194000000000129'
                      sort_order: desc
                      locked: false
                      fields:
                        - api_name: First_Name
                          id: '2411194000000000557'
                          _pin: false
                        - api_name: Last_Name
                          id: '2411194000000000559'
                          _pin: false
                        - api_name: Company
                          id: '2411194000000000555'
                          _pin: false
                        - api_name: Email
                          id: '2411194000000000563'
                          _pin: false
                      criteria:
                        field:
                          id: '2411194000000000605'
                          api_name: City
                        comparator: contains
                        value: e
                        type: value
                      cross_filters:
                        - include_objects: true
                          relation:
                            id: '2411194000000282522'
                            api_name: Notes__r
                          criteria:
                            group:
                              - field:
                                  id: '2411194000000000285'
                                  api_name: Created_By
                                comparator: equal
                                value:
                                  id: '2411194000000478001'
                                  name: Jess Moana
                                type: value
                              - comparator: equal
                                field:
                                  api_name: Parent_Id
                                  id: '2411194000000000283'
                                value: ${NOTEMPTY}
                            group_operator: and
                description: >-
                  Shows a create Custom View request body with a name, filter
                  criteria, sort configuration, and field list.
            schema:
              description: >-
                Represents the request body envelope for creating one or more
                Custom Views.
              type: object
              additionalProperties: false
              properties:
                custom_views:
                  description: Specify the list of Custom Views to create.
                  type: array
                  maxItems: 200
                  items:
                    $ref: '#/components/schemas/CustomViewPostItem'
              required:
                - custom_views
        description: >-
          The request body must contain a custom_views array with one or more
          objects, each specifying the configuration for a new Custom View.
      responses:
        '201':
          description: Returns the details of the Custom Views created successfully.
          content:
            application/json:
              examples:
                PostSuccessResponse:
                  summary: Custom view created successfully
                  value:
                    custom_views:
                      - code: SUCCESS
                        details:
                          id: '2411194000004076067'
                        message: custom view created
                        status: success
                  description: >-
                    Shows a success response for the create Custom View
                    operation, including the ID of the created view.
              schema:
                x-zs-$id: CustomViewBulkCreateSuccessResponse
                description: >-
                  Represents the bulk create success response schema for Custom
                  View creation.
                type: object
                additionalProperties: false
                properties:
                  custom_views:
                    type: array
                    description: Represents the list of Custom Views created successfully.
                    maxItems: 200
                    items:
                      $ref: '#/components/schemas/CustomViewPostSuccessResponse'
                required:
                  - custom_views
        '207':
          description: >-
            Returns a multi-status response when the bulk creation partially
            succeeded. Each item indicates whether the creation succeeded or
            failed for that Custom View.
          content:
            application/json:
              examples:
                PostMultiStatusResponse:
                  summary: Bulk create multi-status response
                  value:
                    custom_views:
                      - code: DUPLICATE_DATA
                        details:
                          api_name: name
                          json_path: $.custom_views[0].name
                        message: duplicate data
                        status: error
                      - code: SUCCESS
                        details:
                          id: '2411194000004308079'
                        message: custom view created
                        status: success
                  description: >-
                    Shows a bulk create multi-status response with both
                    successful and failed items.
              schema:
                x-zs-$id: CustomViewCreateMultiStatusFailureDetails
                description: >-
                  Represents the multi-status response for bulk Custom View
                  creation, containing a mix of success and failure items.
                type: object
                additionalProperties: false
                properties:
                  custom_views:
                    type: array
                    description: >-
                      Represents the list of Custom View creation results,
                      including both successful and failed items.
                    minItems: 2
                    maxItems: 200
                    items:
                      description: >-
                        Represents a creation result item, which can be either a
                        success or a failure response.
                      oneOf:
                        - $ref: '#/components/schemas/CustomViewPostSuccessResponse'
                        - $ref: '#/components/schemas/CustomViewCreateFailureItem'
                    allOf:
                      - description: >-
                          Represents a successful creation item for a Custom
                          View.
                        contains:
                          $ref: '#/components/schemas/CustomViewPostSuccessResponse'
                        minContains: 1
                      - description: Represents a creation failure item for a Custom View.
                        contains:
                          $ref: '#/components/schemas/CustomViewCreateFailureItem'
                        minContains: 1
                required:
                  - custom_views
        '400':
          description: >-
            The request contains invalid data or a required parameter is
            missing. Resolution: Verify that all required fields are present and
            contain valid values.
          content:
            application/json:
              examples:
                PostErrorResponse:
                  summary: Create Custom View validation error
                  value:
                    code: REQUIRED_PARAM_MISSING
                    details:
                      param_name: name
                    message: invalid data
                    status: error
                  description: >-
                    Shows an error response when the create Custom View request
                    contains invalid data.
              schema:
                x-zs-$id: CustomViewCreateFailureResponseWrapper
                oneOf:
                  - description: 'Flat error: required query parameter missing'
                    $ref: '#/components/schemas/RequiredParameterMissingResponse'
                  - description: 'Flat error: URL/module validation failures'
                    $ref: '#/components/schemas/UrlErrorResponseForCustomView'
                  - description: >-
                      Wrapped error: per-item creation failures inside
                      custom_views array
                    $ref: '#/components/schemas/CustomViewCreateFailureResponse'
                description: >-
                  Represents the error response for an invalid create Custom
                  View request.
        '401':
          description: >-
            Authentication failed or the OAuth access token does not include the
            required scope. Resolution: A new access token must be generated
            with the ZohoCRM.settings.custom_views.CREATE scope.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/AuthenticationError'
                  - $ref: '#/components/schemas/UnauthorizedResponse'
                  - $ref: '#/components/schemas/CvProfilePermissionError'
                x-zs-$id: CreateCustomViewUnauthorizedResponse
                description: >-
                  Represents the error response for an unauthorized create
                  Custom View request.
              examples:
                AuthenticationFailure:
                  value:
                    code: AUTHENTICATION_FAILURE
                    details: {}
                    message: Authentication failed
                    status: error
                  description: >-
                    Shows an authentication failure response for the create
                    Custom View operation.
                  summary: Authentication failure
                OAuthScopeMismatch:
                  value:
                    code: OAUTH_SCOPE_MISMATCH
                    details: {}
                    message: invalid oauth scope to access this URL
                    status: error
                  description: >-
                    Shows an OAuth scope mismatch error for the create Custom
                    View operation.
                  summary: OAuth scope mismatch
        '403':
          description: >-
            Permission denied to create Custom Views for this module.
            Resolution: The CRM administrator must grant the required permission
            to the user's profile.
          content:
            application/json:
              schema:
                x-zs-$id: CustomViewCreateForbiddenResponse
                oneOf:
                  - $ref: '#/components/schemas/ModuleForbiddenErrorResponse'
                  - $ref: '#/components/schemas/ForbiddenErrorResponse'
                description: >-
                  Represents the error response for a forbidden create Custom
                  View request.
              examples:
                NoPermissionError:
                  value:
                    code: NO_PERMISSION
                    details:
                      permissions: []
                    message: permission denied
                    status: error
                  description: >-
                    Shows a permission denied response for the create Custom
                    View operation.
                  summary: Permission denied
      security:
        - OAuth2:
            - ZohoCRM.settings.custom_views.CREATE
    get:
      tags:
        - Custom Views
      summary: Get All Custom Views
      description: >-
        To retrieve the list of all Custom Views configured for a specified
        module in your Zoho CRM organization.
      operationId: getCustomViews
      parameters:
        - $ref: '#/components/parameters/Module'
        - $ref: '#/components/parameters/Filters'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Ids'
        - $ref: '#/components/parameters/Scope'
        - $ref: '#/components/parameters/Favourite'
      responses:
        '200':
          description: >-
            Returns the list of Custom Views for the specified module, along
            with pagination metadata.
          content:
            application/json:
              examples:
                SuccessResponse:
                  summary: Get all Custom Views success response
                  value:
                    custom_views:
                      - display_value: Character limit tooltip
                        created_time: '2025-11-17T09:55:04-02:00'
                        access_type: only_to_me
                        system_name: null
                        created_by:
                          name: Jess Moana
                          id: '2411194000000478001'
                        default: false
                        modified_time: '2025-11-26T02:50:12-02:00'
                        name: Character limit tooltip
                        system_defined: false
                        modified_by:
                          name: Jess Moana
                          id: '2411194000000478001'
                        id: '2411194000003855598'
                        category: created_by_me
                        last_accessed_time: '2025-11-26T09:00:24-02:00'
                        locked: false
                    info:
                      per_page: 200
                      default: '2411194000004030016'
                      count: 10
                      translation:
                        public_views: Public Views
                        other_users_views: Other User's Views
                        shared_with_me: Shared With Me
                        created_by_me: Created By Me
                      page: 1
                      more_records: false
                  description: >-
                    Shows a list of Custom Views retrieved for a module with
                    pagination metadata.
              schema:
                $ref: '#/components/schemas/GetAllCustomViewsResponse'
        '400':
          description: >-
            The request URL or module is invalid. Resolution: A valid module API
            name must be provided in the **module** query parameter.
          content:
            application/json:
              examples:
                FailureResponse:
                  summary: Invalid request error
                  value:
                    code: INVALID_MODULE
                    details: {}
                    message: the module name given seems to be invalid
                    status: error
                  description: >-
                    Shows an error response when the request URL or module is
                    invalid.
              schema:
                x-zs-$id: GetAllCustomViewsFailureResponse
                oneOf:
                  - description: 'Flat error: URL/module validation failures'
                    $ref: '#/components/schemas/UrlErrorResponseForCustomView'
                  - description: 'Flat error: required query parameter missing'
                    $ref: '#/components/schemas/RequiredParameterMissingResponse'
                  - description: 'Filter criteria error: invalid filter param data type'
                    $ref: '#/components/schemas/FilterInvalidParamDataType'
                  - description: 'Filter criteria error: unsupported API name'
                    $ref: '#/components/schemas/FilterNotSupportedApiName'
                  - description: 'Filter criteria error: field comparator value missing'
                    $ref: '#/components/schemas/FilterFieldComparatorValueMissing'
                  - description: 'Filter criteria error: field comparator mismatch'
                    $ref: '#/components/schemas/FilterFieldComparatorMismatch'
                  - description: 'Filter criteria error: field value mismatch'
                    $ref: '#/components/schemas/FilterFieldValueMismatch'
                  - description: 'Filter criteria error: comparator value mismatch'
                    $ref: '#/components/schemas/FilterComparatorValueMismatch'
                  - description: 'Filter criteria error: invalid comparator'
                    $ref: '#/components/schemas/FilterInvalidComparator'
                  - description: 'Filter criteria error: empty filter object'
                    $ref: '#/components/schemas/FilterEmptyFilterObject'
                  - description: 'Filter criteria error: mandatory field not found'
                    $ref: '#/components/schemas/FilterMandatoryNotFound'
                description: >-
                  Represents the error response for an invalid get Custom Views
                  request.
        '401':
          description: >-
            Authentication failed or the OAuth access token does not include the
            required scope. Resolution: A new access token must be generated
            with the ZohoCRM.settings.custom_views.READ scope.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/AuthenticationError'
                  - $ref: '#/components/schemas/UnauthorizedResponse'
                x-zs-$id: GetCustomViewsUnauthorizedResponse
                description: >-
                  Represents the error response for an unauthorized get Custom
                  Views request.
              examples:
                AuthenticationFailure:
                  value:
                    code: AUTHENTICATION_FAILURE
                    details: {}
                    message: Authentication failed
                    status: error
                  description: >-
                    Shows an authentication failure response for the get all
                    Custom Views operation.
                  summary: Authentication failure
                OAuthScopeMismatch:
                  value:
                    code: OAUTH_SCOPE_MISMATCH
                    details: {}
                    message: invalid oauth scope to access this URL
                    status: error
                  description: >-
                    Shows an OAuth scope mismatch error for the get all Custom
                    Views operation.
                  summary: OAuth scope mismatch
        '403':
          description: >-
            Permission denied to retrieve Custom Views for this module.
            Resolution: The CRM administrator must grant the required permission
            to the user's profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModuleForbiddenErrorResponse'
              examples:
                NoPermissionError:
                  value:
                    code: NO_PERMISSION
                    details:
                      permissions: []
                    message: permission denied
                    status: error
                  description: >-
                    Shows a permission denied response for the get all Custom
                    Views operation.
                  summary: Permission denied
      security:
        - OAuth2:
            - ZohoCRM.settings.custom_views.READ
    delete:
      tags:
        - Custom Views
      summary: Delete Custom Views
      description: >-
        To delete one or more Custom Views from a specified module in your Zoho
        CRM organization.
      operationId: deleteCustomView
      parameters:
        - $ref: '#/components/parameters/Ids'
        - $ref: '#/components/parameters/Module'
      responses:
        '200':
          description: >-
            Returns a success response indicating that all specified Custom
            Views were deleted.
          content:
            application/json:
              examples:
                SuccessResponse:
                  summary: Delete Custom View success response
                  value:
                    custom_views:
                      - code: SUCCESS
                        details:
                          id: '2411194000004030016'
                        message: deleted successfully
                        status: success
                  description: >-
                    Shows a success response for the delete Custom View
                    operation.
              schema:
                x-zs-$id: CustomViewDeleteSuccessResponse
                description: >-
                  Represents the response schema for a successful Custom View
                  deletion.
                type: object
                additionalProperties: false
                properties:
                  custom_views:
                    type: array
                    description: Represents the list of Custom Views deleted successfully.
                    maxItems: 200
                    items:
                      $ref: '#/components/schemas/CustomViewDeleteSuccess'
                required:
                  - custom_views
        '207':
          description: >-
            Returns a multi-status response when the deletion partially
            succeeded. Each item indicates whether the deletion succeeded or
            failed for that Custom View.
          content:
            application/json:
              examples:
                PartialSuccessResponse:
                  summary: Partial delete success and failure
                  value:
                    custom_views:
                      - code: SUCCESS
                        details:
                          id: '2411194000004030016'
                        message: deleted successfully
                        status: success
                      - code: INVALID_DATA
                        details:
                          id: '12'
                        message: >-
                          The provided CustomView is either invalid or already
                          Deleted
                        status: error
                  description: >-
                    Shows a partial success and failure response for the delete
                    Custom View operation.
              schema:
                type: object
                x-zs-$id: CustomViewDeleteMultiStatusFailureDetails
                description: >-
                  Represents the multi-status response for the delete operation,
                  containing a mix of success and failure items.
                additionalProperties: false
                properties:
                  custom_views:
                    type: array
                    description: >-
                      Represents the list of Custom View deletion results,
                      including both successful and failed items.
                    minItems: 2
                    maxItems: 200
                    items:
                      description: >-
                        Represents a deletion result item, which can be either a
                        success or a failure response.
                      oneOf:
                        - $ref: '#/components/schemas/CustomViewDeleteSuccess'
                        - $ref: '#/components/schemas/CustomViewDeleteFailure'
                    allOf:
                      - description: >-
                          Represents a successful deletion item for a Custom
                          View.
                        contains:
                          $ref: '#/components/schemas/CustomViewDeleteSuccess'
                        minContains: 1
                      - description: Represents a deletion failure item for a Custom View.
                        contains:
                          $ref: '#/components/schemas/CustomViewDeleteFailure'
                        minContains: 1
                required:
                  - custom_views
        '400':
          description: >-
            The Custom View ID in the request is invalid or the view has already
            been deleted. Resolution: Verify that the Custom View IDs in the
            request are valid and the views have not already been deleted.
          content:
            application/json:
              examples:
                FailureResponse:
                  summary: Invalid Custom View ID error
                  value:
                    custom_views:
                      - code: INVALID_DATA
                        details:
                          id: '12'
                        message: >-
                          The provided CustomView is either invalid or already
                          Deleted
                        status: error
                  description: >-
                    Shows an error response when one or more Custom View IDs
                    provided for deletion are invalid.
              schema:
                x-zs-$id: DeleteCustomViewFailureResponse
                oneOf:
                  - description: 'Flat error: URL/module validation failures'
                    $ref: '#/components/schemas/UrlErrorResponseForCustomView'
                  - description: 'Flat error: required query parameter missing'
                    $ref: '#/components/schemas/RequiredParameterMissingResponse'
                  - description: >-
                      Wrapped error: per-item delete failures inside
                      custom_views array
                    $ref: '#/components/schemas/CustomViewDeleteItem'
                description: >-
                  Represents the error response for an invalid delete Custom
                  View request.
        '401':
