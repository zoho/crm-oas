      x-zs-$id: SimpleFilterCriterionResponse
      description: >-
        Represents the response for a simple field-based filter criterion,
        dispatching to the appropriate comparator-specific response schema.
      oneOf:
        - $ref: '#/components/schemas/EqualityFilterCriterionResponse'
        - $ref: '#/components/schemas/TextFilterCriterionResponse'
        - $ref: '#/components/schemas/OrderingFilterCriterionResponse'
        - $ref: '#/components/schemas/BetweenFilterCriterionResponse'
        - $ref: '#/components/schemas/SetFilterCriterionResponse'
        - $ref: '#/components/schemas/MultiSelectLookupFilterCriterionResponse'
    GroupedFilterCriterionResponse:
      type: object
      x-zs-$id: GroupedFilterCriterionResponse
      description: >-
        Represents the grouped filter criterion returned in the response,
        containing multiple filter conditions evaluated with a logical operator.
        Supports recursive nesting for complex filtering logic.
      properties:
        group:
          type: array
          description: >-
            Contains an array of filter conditions grouped together and
            evaluated with the specified logical operator.
          minItems: 2
          maxItems: 25
          items:
            oneOf:
              - $ref: '#/components/schemas/SimpleFilterCriterionResponse'
              - $ref: '#/components/schemas/GroupedFilterCriterionResponse'
        group_operator:
          type: string
          enum:
            - AND
            - OR
            - and
            - or
          description: >-
            Represents the logical operator applied between the filter
            conditions in the group.

            Possible values:

            AND - All conditions in the group must be satisfied.

            OR - At least one condition in the group must be satisfied.

            and - Equivalent to AND; all conditions in the group must be
            satisfied.

            or - Equivalent to OR; at least one condition in the group must be
            satisfied.
        $disrupted:
          type: boolean
          description: >-
            Indicates whether the grouped filter criterion is in a disrupted
            state, typically due to an invalid or unresolvable condition within
            the group.
      required:
        - group
        - group_operator
      additionalProperties: false
    FilterCriterionResponse:
      x-zs-$id: FilterCriterionResponse
      description: >-
        Represents the top-level filter criterion returned in the response,
        supporting both simple field-based filters and complex grouped filters
        with logical operators.
      oneOf:
        - $ref: '#/components/schemas/SimpleFilterCriterionResponse'
        - $ref: '#/components/schemas/GroupedFilterCriterionResponse'
    ChildRelationshipReference:
      x-zs-$id: ChildRelationshipReference
      additionalProperties: false
      description: >-
        Represents the reference to a child relationship module. The api_name
        property is required to identify the child relationship.
      type: object
      required:
        - api_name
      properties:
        api_name:
          description: >-
            Represents the API name of the child relationship module used to
            identify the relationship.
          maxLength: 255
          type: string
          x-zs-$ref:
            resource: child_relationships
            origins:
              - operationId: getChildRelationshipsForModule
                propertyId: ChildRelationshipApiName
        id:
          description: Represents the unique ID of the child relationship module record.
          maxLength: 25
          type: string
          format: int64
          x-zs-$ref:
            resource: child_relationships
            origins:
              - operationId: getChildRelationshipsForModule
                propertyId: ChildRelationshipId
        $disrupted:
          description: >-
            Indicates whether the related module relationship referenced by this
            criterion is in a disrupted state, typically due to an unresolvable
            or deleted relationship definition.
          type: boolean
    CrossFiltersResponse:
      type: array
      x-zs-$id: CrossFiltersResponse
      description: >-
        Represents the list of cross-filter objects returned in the response,
        applied to the Custom View.
      minItems: 0
      maxItems: 3
      items:
        additionalProperties: false
        description: >-
          Represents a single cross-filter object returned in the response,
          containing the relationship reference, filter criteria, and inclusion
          flag.
        type: object
        required:
          - criteria
          - relation
          - include_objects
        properties:
          include_objects:
            description: >-
              Indicates whether records with matching related records were
              included in the filtered results.
            type: boolean
          relation:
            allOf:
              - $ref: '#/components/schemas/ChildRelationshipReference'
              - required:
                  - api_name
                  - id
                  - $disrupted
          criteria:
            $ref: '#/components/schemas/FilterCriterionResponse'
    FilterInvalidParamDataType:
      x-zs-$id: FilterInvalidParamDataType
      type: object
      description: >-
        Represents an error response returned when a filter parameter is
        supplied with an incorrect data type. Contains the error code, a
        descriptive message, and details identifying the offending parameter
        along with its expected data type.
      additionalProperties: false
      required:
        - code
        - details
        - message
        - status
      properties:
        code:
          type: string
          description: >-
            Represents the error classification code for this response.

            Possible values:

            **INVALID_DATA** - The filter parameter was supplied with an
            incorrect data type.
          enum:
            - INVALID_DATA
        details:
          type: object
          description: >-
            Contains structured details about the data type mismatch, including
            the name of the offending filter parameter and the data type it is
            expected to carry.
          additionalProperties: false
          required:
            - expected_data_type
            - param_name
          properties:
            expected_data_type:
              type: string
              description: >-
                Represents the data type that the filter parameter is required
                to carry for the request to be valid.
              maxLength: 256
            param_name:
              type: string
              description: >-
                Represents the name of the query or body parameter — such as
                `filters` — that carries the filter criteria and was supplied
                with an invalid data type.
              maxLength: 256
        message:
          type: string
          description: >-
            Represents a descriptive message explaining the data type error
            encountered for the filter parameter.
