                                  - word
                            required:
                              - param_name
                          - type: object
                            description: Invalid value error details
                            x-zs-$id: PostInvalidQueryEmptyDetails
                            additionalProperties: false
                    required:
                      - status
                      - code
                      - message
                      - details
                  - type: object
                    description: Invalid query error response with various detail formats
                    x-zs-$id: PostInvalidDataVariantsErrorResponse
                    additionalProperties: false
                    properties:
                      status:
                        type: string
                        description: Error status indicator
                        enum:
                          - error
                      code:
                        type: string
                        description: Error code indicating invalid query
                        enum:
                          - INVALID_DATA
                      message:
                        type: string
                        description: >-
                          Human-readable error message describing the query
                          issue
                        enum:
                          - Cannot use the restricted field.
                          - Invalid query formed
                          - invalid value for search
                          - the field is not available for search
                          - Please check the value of the field
                          - special characters are not allowed
                          - invalid operator found
                          - no_masking_permission
                          - invalid data
