          description: Retrieves records where No_of_Employees is less than 500
        IntegerLessEqual:
          summary: Integer field with less_equal operator
          value: (No_of_Employees:less_equal:1000)
          description: Retrieves records where No_of_Employees is 1000 or less
        IntegerBetween:
          summary: Integer field with between operator
