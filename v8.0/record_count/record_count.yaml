                                  Search team
                                maxLength: 1000
                            required:
                              - reason
                              - api_name
                          - type: object
                            description: Invalid value error details
                            x-zs-$id: PostInvalidQueryInvalidValueDetails
                            additionalProperties: false
                            properties:
                              reason:
                                type: string
                                description: Detailed reason for the error
                                maxLength: 500
                              value:
                                type: string
