                            searchword
                          - provide atleast 2 letters for search
                      details:
                        oneOf:
                          - type: object
                            description: Data type mismatch error details
                            x-zs-$id: PostInvalidDataDataTypeMismatchDetails
                            additionalProperties: false
                            properties:
                              expected_data_type:
                                type: string
                                description: The expected data type for the field
                                maxLength: 100
                              reason:
                                type: string
                                description: Detailed reason for the error
                                maxLength: 500
                            required:
                              - expected_data_type
                              - reason
                              - api_name
                          - type: object
                            description: Invalid operator error details
                            x-zs-$id: PostInvalidDataInvalidOperatorDetails
                            additionalProperties: false
                            properties:
                              operator:
                                type: string
                                description: The invalid operator used in the query
                                maxLength: 50
                              reason:
                                type: string
                                description: Detailed reason for the error
                                maxLength: 500
                            required:
                              - operator
                              - reason
                              - api_name
                          - type: object
                            description: General query error details
                            x-zs-$id: PostInvalidDataGeneralDetails
                            additionalProperties: false
                            properties:
                              reason:
                                type: string
                                description: Detailed reason for the error
                                maxLength: 500
                              details:
                                type: string
                                description: >-
                                  Additional details about the error, only Zoho
                                  Search team
                                maxLength: 1000
                            required:
                              - reason
                              - api_name
                          - type: object
                            description: Invalid value error details
                            x-zs-$id: PostInvalidDataInvalidValueDetails
                            additionalProperties: false
                            properties:
                              reason:
                                type: string
                                description: Detailed reason for the error
                                maxLength: 500
                              value:
                                type: string
                                description: The invalid value provided in the query
                                maxLength: 500
                            required:
                              - reason
                              - api_name
                              - value
                          - type: object
                            description: Invalid value error details
                            x-zs-$id: PostInvalidParamValueDetails
                            additionalProperties: false
                            properties:
                              param_name:
                                type: string
                                description: Name of the parameter causing the error
                                maxLength: 500
                            required:
                              - param_name
                          - type: object
                            description: Invalid value error details
                            x-zs-$id: PostInvalidDataEmptyDetails
                            additionalProperties: false
                    required:
                      - status
                      - code
                      - message
                      - details
                  - type: object
                    description: Invalid query error response for IN operator violations
                    x-zs-$id: PostInvalidQueryInOperatorErrorResponse
                    additionalProperties: false
                    properties:
                      status:
                        type: string
                        description: Error status indicator
                        enum:
                          - error
                      code:
                        type: string
                        description: Error code indicating invalid query
                        enum:
                          - INVALID_QUERY
                      message:
                        type: string
                        description: >-
                          Human-readable error message describing the query
                          issue
                        enum:
                          - Only 100 values are allowed in "IN" criteria
                          - Invalid query formed
                      details:
                        type: object
                        description: Additional error details including field information
                        additionalProperties: false
                        properties:
                          param_name:
                            type: string
                            description: Name of the parameter causing the error
                            maxLength: 100
                        required:
                          - api_name
                    required:
                      - status
                      - code
                      - message
                      - details
                  - type: object
                    description: >-
                      Limit reached error response when maximum record iteration
                      exceeded
                    x-zs-$id: PostLimitReachedErrorResponse
                    additionalProperties: false
                    properties:
                      status:
                        type: string
                        description: Error status indicator
                        enum:
                          - error
                      code:
                        type: string
                        description: Error code indicating limit reached
                        enum:
                          - LIMIT_REACHED
                      message:
                        type: string
                        description: Human-readable error message
                        enum:
                          - maximum response iteration limit reached
                      details:
                        type: object
                        description: Additional error details including the limit value
                        additionalProperties: false
                        properties:
                          limit:
                            type: string
                            description: Maximum number of records allowed
                            enum:
                              - '2000'
                        required:
                          - limit
                    required:
                      - status
                      - code
                      - message
                      - details
                  - type: object
                    description: Criteria limit exceeded error response
                    x-zs-$id: PostCriteriaLimitExceededErrorResponse
                    additionalProperties: false
                    properties:
                      status:
                        type: string
