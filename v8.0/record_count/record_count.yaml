          summary: Autonumber field with equals operator
          value: (Lead_Number:equals:LEAD-10001)
          description: Retrieves records where Lead_Number is exactly 'LEAD-10001'
        AutonumberIn:
          summary: Autonumber field with IN operator
          value: (Lead_Number:in:LEAD-10001,LEAD-10002,LEAD-10003)
          description: >-
            Retrieves records where Lead_Number matches any of the specified
            values
        MultipleConditionsAnd:
          summary: Multiple conditions with AND logic
          value: ((Company:equals:Zoho) and (Annual_Revenue:greater_than:1000000))
          description: >-
            Retrieves records where Company contains 'Zoho' AND Annual_Revenue
            is greater than 1,000,000
        MultipleConditionsOr:
          summary: Multiple conditions with OR logic
          value: ((Lead_Status:equals:Qualified) or (Lead_Status:equals:Contacted))
          description: >-
            Retrieves records where Lead_Status is either 'Qualified' OR
            'Contacted'
        ComplexNestedConditions:
          summary: Complex nested conditions with AND/OR
          value: >-
            (((Company:equals:Zoho) and (Annual_Revenue:greater_than:1000000))
            or ((Lead_Status:equals:Hot) and
            (No_of_Employees:greater_than:100)))
          description: Complex query combining multiple criteria with nested AND/OR logic
        ThreeConditionsAnd:
          summary: Three conditions with AND
          value: >-
            (((Lead_Status:equals:Qualified) and
            (Annual_Revenue:greater_than:500000)) and
            (No_of_Employees:greater_than:50))
          description: Retrieves records matching all three conditions
        MixedFieldTypes:
          summary: Mixed field types with AND/OR
          value: >-
            (((Closing_Date:between:2024-01-01,2024-12-31) and
            (Deal_Amount:greater_than:50000)) or (Priority:equals:High))
          description: Combines date, currency, and picklist fields in one query
        DateRangeCurrentYear:
          summary: Date range for current year
          value: (Created_Time:between:2024-01-01,2024-12-31)
          description: Retrieves all records created in 2024
        NumericRange:
          summary: Numeric range with multiple conditions
          value: >-
            ((Annual_Revenue:between:100000,1000000) and
            (No_of_Employees:between:10,500))
          description: Retrieves records within specified revenue and employee count ranges
        NegativeConditions:
          summary: Multiple NOT EQUAL conditions
          value: ((Lead_Status:not_equal:Junk) and (Lead_Status:not_equal:Lost))
          description: Retrieves records excluding 'Junk' and 'Lost' status
        MaximumCriteria:
          summary: Maximum 10 criteria example
          value: >-
            (((Lead_Status:equals:Qualified) and
            (Annual_Revenue:greater_than:100000)) and
            ((No_of_Employees:greater_than:10) and (Industry:equals:Technology))
            and ((Rating:equals:Hot) and (Email_Opt_Out:equals:false)) and
            ((Created_Time:greater_than:2024-01-01) and
            (Lead_Source:equals:Web)) and ((Country:equals:USA) and
            (State:equals:California)))
          description: Example with 10 criteria (maximum allowed)
        MultipleAnd:
          summary: Multiple conditions with AND
          value: ((Company:equals:ABC) and (First_Name:starts_with:M))
          description: Combines multiple criteria with AND logic
        MultipleOr:
          summary: Multiple conditions with OR
          value: ((Last_Name:equals:Smith) or (Last_Name:equals:Johnson))
          description: Retrieves records matching either condition
        InOperator:
          summary: IN operator for multiple values
          value: (Full_Name:in:Patricia,Boyle,Kate)
          description: Matches any value in the comma-separated list (max 100 values)
        EscapedComma:
          summary: Escaped comma in value
          value: ((Last_Name:equals:Burns%5C%2CB) and (First_Name:starts_with:M))
          description: >-
            Searching for a value containing comma: 'Burns,B' (escaped and
            encoded)
        EscapedBackslash:
          summary: Escaped backslash at end
          value: (Last_Name:equals:K%5C%5C)
          description: >-
            Searching for a value ending with backslash: 'K\' (escaped and
            encoded)
        Between:
          summary: Between operator for date range
          value: (Created_Time:between:2024-01-01,2024-12-31)
          description: Retrieves records within the specified date range
        GreaterThan:
          summary: Greater than operator
          value: (Annual_Revenue:greater_than:1000000)
          description: Retrieves records where Annual_Revenue is greater than 1000000
        NotEqual:
          summary: Not equal operator
          value: (Lead_Status:not_equal:Converted)
          description: Retrieves records where Lead_Status is not 'Converted'
        Complex:
          summary: Complex nested criteria
          value: >-
            (((Company:equals:Zoho) and (First_Name:starts_with:J)) or
            (Last_Name:equals:Smith))
          description: Complex query with nested AND/OR logic (max 10 criteria)
    Filters:
      name: filters
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/FilterCriterionRequest'
      description: Filter for fetching specific custom views based on criteria
    IncludeFilters:
      name: include_filters
      in: query
      description: To include inner details of criteria and cross filters
      required: false
      schema:
        maxLength: 50
        type: string
    CrossFilters:
      name: cross_filters
      in: query
      required: false
      schema:
        type: string
        maxLength: 3000
      description: Cross filter criteria for related module records
    Converted:
      name: converted
      in: query
      description: >-
        Specify the conversion status to filter the count to lead records. This
        parameter is supported only for the **Leads** module. Possible values:

        **true** - Count only converted leads.

        **false** - Count only unconverted leads.

        **both** - Count leads regardless of conversion status.
      required: false
      schema:
        type: string
        enum:
          - 'true'
          - 'false'
          - both
        description: >-
          Set to true to count only converted leads; false to count only
          unconverted leads.
      examples:
        ConvertedLeads:
          value: 'true'
        NonConvertedLeads:
          value: 'false'
        BothConvertedAndNonConvertedLeads:
          value: both
    Approved:
      name: approved
      in: query
      description: >-
        Specify the approval status to filter the count to lead records. This
        parameter is supported only for the **Leads** module. Possible values:

        **true** - Count only approved leads.

        **false** - Count only unapproved leads.

        **both** - Count leads regardless of approval status.
      required: false
      schema:
        type: string
        enum:
          - 'true'
          - 'false'
          - both
        description: >-
          Set to true to count only converted leads; false to count only
          unconverted leads.
      examples:
        ConvertedLeads:
          value: 'true'
        NonConvertedLeads:
          value: 'false'
        BothConvertedAndNonConvertedLeads:
          value: both
    Page:
      name: page
      in: query
      description: Specify the page number to retrieve when paginating through results.
      required: false
      schema:
        type: integer
        format: int32
        default: 1
        minimum: 1
        description: The page number for pagination.
      example: 1
    PerPage:
      name: per_page
      in: query
      description: Specify the number of records to include per page.
      required: false
      schema:
        type: integer
        format: int32
        default: 200
        minimum: 1
        maximum: 200
        description: Number of records per page for pagination.
      example: 200
    Type:
      name: type
      in: query
      description: >-
        Specify the type of user records to count. This parameter is supported
        only for the **Users** module. Possible values:

        **AllUsers** - All users.

        **ActiveUsers** - Active users.

        **DeactiveUsers** - Deactivated users.

        **ConfirmedUsers** - Confirmed users.

        **ConfirmedReportingUsers** - Confirmed users with reporting access.

        **NotConfirmedUsers** - Unconfirmed users.

        **DeletedUsers** - Deleted users.

        **ActiveConfirmedUsers** - Active and confirmed users.

        **AdminUsers** - Users with administrator privileges.

        **ActiveConfirmedAdmins** - Active, confirmed users with administrator
        privileges.

        **CurrentUser** - The currently authenticated user.
      required: false
      schema:
        type: string
        description: Specifies the user type to filter records by.
        enum:
          - AllUsers
          - ActiveUsers
          - DeactiveUsers
          - ConfirmedUsers
          - ConfirmedReportingUsers
          - NotConfirmedUsers
          - DeletedUsers
          - ActiveConfirmedUsers
          - AdminUsers
          - ActiveConfirmedAdmins
          - CurrentUser
      examples:
        AllUsers:
          summary: Get count of all users
          value: AllUsers
          description: Retrieves count of all users in the organization
        ActiveUsers:
          summary: Get count of active users
          value: ActiveUsers
          description: Retrieves count of users who are currently active
        DeactiveUsers:
          summary: Get count of deactivated users
          value: DeactiveUsers
          description: Retrieves count of users who have been deactivated
        ConfirmedUsers:
          summary: Get count of confirmed users
          value: ConfirmedUsers
          description: Retrieves count of users who have confirmed their accounts
        ConfirmedReportingUsers:
          summary: Get count of confirmed reporting users
          value: ConfirmedReportingUsers
          description: Retrieves count of confirmed users with reporting access
        NotConfirmedUsers:
          summary: Get count of unconfirmed users
          value: NotConfirmedUsers
          description: Retrieves count of users who have not yet confirmed their accounts
        DeletedUsers:
          summary: Get count of deleted users
          value: DeletedUsers
          description: Retrieves count of users who have been deleted
        ActiveConfirmedUsers:
          summary: Get count of active and confirmed users
          value: ActiveConfirmedUsers
          description: Retrieves count of users who are both active and confirmed
        AdminUsers:
          summary: Get count of admin users
          value: AdminUsers
          description: Retrieves count of users with administrator privileges
        ActiveConfirmedAdmins:
          summary: Get count of active confirmed admin users
          value: ActiveConfirmedAdmins
          description: >-
            Retrieves count of users who are active, confirmed, and have admin
            privileges
        CurrentUser:
          summary: Get current user information
          value: CurrentUser
          description: >-
            Retrieves count for the currently authenticated user (typically
            returns 1)
  schemas:
    ErrorResponse:
      x-zs-$id: ErrorResponse
      type: object
      description: >-
        Represents a standard error response returned by the Zoho CRM API when a
        request fails.
      additionalProperties: false
      properties:
        code:
          type: string
          description: >-
            Represents the unique error code that identifies the type of
            failure.
          maxLength: 64
        message:
          type: string
          description: Represents the error message describing the reason for the failure.
          maxLength: 512
        details:
          type: object
          description: >-
            Represents additional details about the error, which may include the
            field API name or parameter name associated with the failure.
          additionalProperties: false
        status:
          type: string
          description: |-
            Indicates the response status. Possible values:
            **error** - The request resulted in an error.
          enum:
            - error
    FilterFieldBase:
      type: object
      x-zs-$id: FilterFieldBase
      description: >-
        Represents the base field reference used in filter operations,
        containing minimal required properties. The field's data_type is not
        part of this object; resolve it from the corresponding FieldSchema. For
        formula fields, use formula.return_type as the effective data_type; for
        rollup_summary fields, use rollup_summary.return_type.
      properties:
        id:
          type: string
          format: int64
          description: Represents the unique ID of the field used for filter operations.
        api_name:
          type: string
          description: >-
            Represents the API name of the field used for filter application.
            Supports relationship notation, for example, Deals__r.Stage.
      additionalProperties: true
    SimpleFilterCriterionValueString:
      type: string
      x-zs-$id: SimpleFilterCriterionValueString
      description: >-
        Represents a string filter criterion value applicable to fields with a
        data_type of text, textarea, email, phone, website, autonumber,
        picklist, multiselectpicklist, date, or datetime, as well as any
        data_type not explicitly covered by SimpleFilterCriterionValueNumber,
        SimpleFilterCriterionValueBoolean,
        SimpleFilterCriterionValueObjectRequest,
        SimpleFilterCriterionValueObjectResponse, or the multiselect lookup
        value schemas.
      maxLength: 255
    SimpleFilterCriterionValueNumber:
      type: number
      x-zs-$id: SimpleFilterCriterionValueNumber
      description: >-
        Represents a numeric filter criterion value applicable to fields with a
        data_type of integer, currency, or double.
    SimpleFilterCriterionValueObjectBase:
      type: object
      description: >-
        Represents the base minified record structure of a lookup module,
        containing the record's unique identifier and display name.
      properties:
        id:
          type: string
          format: int64
          description: Represents the unique ID of the lookup module record.
        name:
          type: string
          maxLength: 255
          description: Represents the display name of the lookup module record.
      additionalProperties: true
    SimpleFilterCriterionValueObjectRequest:
      x-zs-$id: SimpleFilterCriterionValueObjectRequest
      allOf:
        - $ref: '#/components/schemas/SimpleFilterCriterionValueObjectBase'
        - type: object
          additionalProperties: true
          description: >-
            Represents the constraint that the ID property is required for the
            lookup object filter criterion value in request bodies.
          required:
            - id
          properties:
            id: {}
      unevaluatedProperties: false
      description: >-
        Represents a lookup object filter criterion value for request bodies,
        applicable when the field's data_type is lookup, ownerlookup, or
        userlookup. The ID property is required.
    SimpleFilterCriterionValueObjectPredefined:
      x-zs-$id: SimpleFilterCriterionValueObjectPredefined
      description: >-
        Represents a predefined placeholder object filter criterion value for
        lookup fields, applicable with equal or not_equal comparators when the
        field's data_type is ownerlookup or userlookup. Two forms are supported:
        (1) the currently logged-in user, represented by passing only the name
        property with the predefined value ${CURRENTUSER} and no ID property;
        and (2) the logged-in user's role, represented by passing the ID
        property with the predefined value ${CURRENTUSERROLE} and an optional
        display label in the name property. For specific real users or roles
        that are not predefined, use SimpleFilterCriterionValueObjectRequest,
        which requires the ID property.
      oneOf:
        - type: object
          x-zs-$id: SimpleFilterCriterionValueObjectPredefinedCurrentUser
          description: >-
            Represents the predefined object form for the currently logged-in
            user, in which only the name property carries the predefined value
            ${CURRENTUSER} and no ID property is included.
          required:
            - name
          properties:
            name:
              type: string
              enum:
                - ${CURRENTUSER}
              description: >-
                Represents the predefined placeholder for the currently
                logged-in user.

                Possible values:

                ${CURRENTUSER} - Represents the currently logged-in user.
          additionalProperties: false
        - type: object
          x-zs-$id: SimpleFilterCriterionValueObjectPredefinedCurrentUserRole
          description: >-
            Represents the predefined object form for the currently logged-in
            user's role, in which the ID property carries the predefined value
            ${CURRENTUSERROLE} and the name property is an optional display
            label.
          required:
            - id
          properties:
            id:
              type: string
              enum:
                - ${CURRENTUSERROLE}
              description: >-
                Represents the predefined placeholder for the logged-in user's
                role record ID.

                Possible values:

                ${CURRENTUSERROLE} - Represents the role of the currently
                logged-in user.
            name:
              type: string
              maxLength: 255
              description: >-
                Represents an optional display label for the predefined role,
                such as Logged in User Role.
          additionalProperties: true
    SimpleFilterCriterionValueBoolean:
      type: boolean
      x-zs-$id: SimpleFilterCriterionValueBoolean
      description: >-
        Represents a Boolean filter criterion value. Applicable only when the
        field has a Boolean data type (checkbox field).
    SimpleFilterCriterionValueGeneralPredefined:
      type: string
      x-zs-$id: SimpleFilterCriterionValueGeneralPredefined
      description: >-
        Represents a predefined placeholder value applicable to any field
        data_type with the equal comparator.

        Possible values:

        ${EMPTY} - Matches records where the field has no value.

        ${NOTEMPTY} - Matches records where the field has any non-empty value.
      enum:
        - ${EMPTY}
        - ${NOTEMPTY}
      x-enumDescriptions:
        ${EMPTY}: Matches records where the field has no value (null or empty string).
        ${NOTEMPTY}: Matches records where the field has any non-empty value.
    SimpleFilterCriterionValueDateTimePredefined:
      type: string
      x-zs-$id: SimpleFilterCriterionValueDateTimePredefined
      description: >-
        Represents a predefined placeholder value applicable only when the
        field's data_type is date or datetime, with the equal comparator.
      enum:
        - ${TODAY}
        - ${TOMORROW}
        - ${TOMORROWPLUS}
        - ${YESTERDAY}
        - ${YESTERDAYMINUS}
        - ${LASTMONTH}
        - ${THISMONTH}
        - ${NEXTMONTH}
        - ${LASTWEEK}
        - ${THISWEEK}
        - ${NEXTWEEK}
        - ${THISYEAR}
        - ${THISFY}
        - ${THISFQ}
        - ${LASTYEAR}
        - ${PREVFY}
        - ${PREVFQ}
        - ${NEXTYEAR}
        - ${NEXTFY}
        - ${NEXTFQ}
        - ${EMPTY}
        - ${NOTEMPTY}
      x-enumDescriptions:
        ${TODAY}: >-
          Matches records where the date field falls on the current calendar
          day.
        ${TOMORROW}: Matches records where the date field falls on the next calendar day.
        ${TOMORROWPLUS}: >-
          Matches records where the date field is on tomorrow or any later date
          (tomorrow onwards).
        ${YESTERDAY}: >-
          Matches records where the date field falls on the previous calendar
          day.
        ${YESTERDAYMINUS}: >-
          Matches records where the date field is on yesterday or any earlier
          date (up to and including yesterday).
        ${LASTMONTH}: >-
          Matches records where the date field falls within the entire previous
          calendar month.
        ${THISMONTH}: >-
          Matches records where the date field falls within the current calendar
          month.
        ${NEXTMONTH}: >-
          Matches records where the date field falls within the next calendar
          month.
        ${LASTWEEK}: >-
          Matches records where the date field falls within the previous
          calendar week (Monday–Sunday).
        ${THISWEEK}: >-
          Matches records where the date field falls within the current calendar
          week.
        ${NEXTWEEK}: >-
          Matches records where the date field falls within the next calendar
          week.
        ${THISYEAR}: >-
          Matches records where the date field falls within the current calendar
          year.
        ${THISFY}: >-
          Matches records where the date field falls within the current fiscal
          year.
        ${THISFQ}: >-
          Matches records where the date field falls within the current fiscal
          quarter.
        ${LASTYEAR}: >-
          Matches records where the date field falls within the previous
          calendar year.
        ${PREVFY}: >-
          Matches records where the date field falls within the previous fiscal
          year.
        ${PREVFQ}: >-
          Matches records where the date field falls within the previous fiscal
          quarter.
        ${NEXTYEAR}: >-
          Matches records where the date field falls within the next calendar
          year.
        ${NEXTFY}: >-
          Matches records where the date field falls within the next fiscal
          year.
        ${NEXTFQ}: >-
          Matches records where the date field falls within the next fiscal
          quarter.
        ${EMPTY}: Matches records where the date field has no value set.
        ${NOTEMPTY}: Matches records where the date field has a value set.
    SimpleFilterCriterionValueNDaysPredefined:
      maxLength: 255
      type: string
      x-zs-$id: SimpleFilterCriterionValueNDaysPredefined
      description: >-
        Represents a predefined N-period range placeholder value applicable only
        when the field's data_type is date or datetime, with the equal
        comparator. Follows the pattern ${NEXT_N_<PERIOD>:<n>} or
        ${LAST_N_<PERIOD>:<n>}, where PERIOD is DAYS, WEEKS, MONTHS, or YEARS
        and n is a positive integer. The current period is always excluded from
        the range.
      pattern: ^\$\{(LAST_N_|NEXT_N_)(DAYS|WEEKS|MONTHS|YEARS):([0-9]+)\}$
    SimpleFilterCriterionValueAgeDuePredefined:
      maxLength: 255
      type: string
      x-zs-$id: SimpleFilterCriterionValueAgeDuePredefined
      description: >-
        Represents a predefined age or due-in-days placeholder value applicable
        only when the field's data_type is date or datetime. Follows the pattern
        ${AGEINDAYS}+<n> for records where the date field was exactly n days in
        the past, or ${DUEINDAYS}+<n> for records where the date field is
        exactly n days in the future. Supported comparators are equal,
        not_equal, less_than, greater_than, less_equal, and greater_equal.
      pattern: ^\$\{(AGEINDAYS|DUEINDAYS)\}\+[0-9]+$
    EqualFilterCriterionRequest:
      type: object
      x-zs-$id: EqualFilterCriterionRequest
      description: >-
        Represents a filter criterion for the equal comparator. The value type
        is determined by the field's data_type: use
        SimpleFilterCriterionValueString for text, textarea, email, phone,
        website, autonumber, picklist, multiselectpicklist, date, or datetime
        fields; SimpleFilterCriterionValueNumber for integer, currency, or
        double fields; SimpleFilterCriterionValueBoolean for Boolean fields;
        SimpleFilterCriterionValueObjectRequest for lookup, ownerlookup, or
        userlookup fields; and SimpleFilterCriterionValueObjectPredefined for
        predefined user or role object placeholders. Accepts scalar or array
        values. Resolve the data_type from the field's FieldSchema.
      properties:
        field:
          allOf:
            - $ref: '#/components/schemas/FilterFieldBase'
            - type: object
              additionalProperties: true
              description: >-
                Represents the field reference constraint that requires the
                api_name property to be present for the equal filter criterion.
              required:
                - api_name
          unevaluatedProperties: false
          description: >-
            Represents the target field definition to which the equal filter
            criterion is applied, conforming to the base field structure.
        comparator:
          type: string
          enum:
            - equal
          description: >-
            Represents the equal comparison operator applied to the criterion.

            Possible values:

            equal - Matches records where the field value equals the specified
            filter value.
        value:
          anyOf:
            - type: array
              x-zs-$id: EqualFilterCriterionRequestValueArray
              description: Contains an array of filter values for the equal comparator.
              minItems: 1
              maxItems: 500
              items:
                x-zs-$id: EqualFilterCriterionRequestValueArrayItems
                oneOf:
                  - $ref: '#/components/schemas/SimpleFilterCriterionValueString'
                  - $ref: '#/components/schemas/SimpleFilterCriterionValueNumber'
                  - x-zs-$id: EqualFilterCriterionRequestValueArrayItemsObject
                    anyOf:
                      - $ref: >-
                          #/components/schemas/SimpleFilterCriterionValueObjectRequest
                      - $ref: >-
                          #/components/schemas/SimpleFilterCriterionValueObjectPredefined
            - $ref: '#/components/schemas/SimpleFilterCriterionValueString'
            - $ref: '#/components/schemas/SimpleFilterCriterionValueNumber'
            - $ref: '#/components/schemas/SimpleFilterCriterionValueBoolean'
            - $ref: '#/components/schemas/SimpleFilterCriterionValueObjectRequest'
            - $ref: '#/components/schemas/SimpleFilterCriterionValueObjectPredefined'
            - $ref: '#/components/schemas/SimpleFilterCriterionValueGeneralPredefined'
            - $ref: >-
                #/components/schemas/SimpleFilterCriterionValueDateTimePredefined
            - $ref: '#/components/schemas/SimpleFilterCriterionValueNDaysPredefined'
            - $ref: '#/components/schemas/SimpleFilterCriterionValueAgeDuePredefined'
          description: >-
            Represents the filter value used in the equal comparator. Accepts a
            scalar or an array of values, depending on the field's data_type.
        type:
          type: string
          enum:
            - merge_field
            - pre_defined
            - value
            - field
          default: value
          description: >-
            Indicates the value resolution mode of the criterion, distinguishing
            whether the filter value is a literal value, a merge field
            reference, a predefined system variable, or another field reference.

            Possible values:

            value - The value is a direct literal.

            merge_field - The value is a merge field reference.

            pre_defined - The value is a predefined system variable placeholder.

            field - The value references another field.
      required:
        - field
        - comparator
        - value
      additionalProperties: false
    NotEqualFilterCriterionRequest:
      type: object
      x-zs-$id: NotEqualFilterCriterionRequest
      description: >-
        Represents a filter criterion for the not_equal comparator. The value
        type is determined by the field's data_type: use
        SimpleFilterCriterionValueString for text, textarea, email, phone,
        website, autonumber, picklist, multiselectpicklist, date, or datetime
        fields; SimpleFilterCriterionValueNumber for integer, currency, or
        double fields; SimpleFilterCriterionValueBoolean for Boolean fields;
        SimpleFilterCriterionValueObjectRequest for lookup, ownerlookup, or
        userlookup fields; and SimpleFilterCriterionValueObjectPredefined for
        predefined user or role object placeholders.
      properties:
        field:
          allOf:
            - $ref: '#/components/schemas/FilterFieldBase'
            - type: object
              additionalProperties: true
              description: >-
                Represents the field reference constraint that requires the
                api_name property to be present for the not-equal filter
                criterion.
              required:
                - api_name
          unevaluatedProperties: false
          description: >-
            Represents the target field definition to which the not-equal filter
            criterion is applied, conforming to the base field structure.
        comparator:
          type: string
          enum:
            - not_equal
          description: >-
            Represents the not-equal comparison operator applied to the
            criterion.

            Possible values:

            not_equal - Matches records where the field value does not equal the
            specified filter value.
        value:
          anyOf:
            - type: array
              maxItems: 500
              x-zs-$id: NotEqualFilterCriterionRequestValueArray
              description: Contains an array of filter values for the not_equal comparator.
              minItems: 1
              items:
                x-zs-$id: NotEqualFilterCriterionRequestValueArrayItems
                oneOf:
                  - $ref: '#/components/schemas/SimpleFilterCriterionValueString'
                  - $ref: '#/components/schemas/SimpleFilterCriterionValueNumber'
                  - x-zs-$id: NotEqualFilterCriterionRequestValueArrayItemsObject
                    anyOf:
                      - $ref: >-
                          #/components/schemas/SimpleFilterCriterionValueObjectRequest
                      - $ref: >-
                          #/components/schemas/SimpleFilterCriterionValueObjectPredefined
            - $ref: '#/components/schemas/SimpleFilterCriterionValueString'
            - $ref: '#/components/schemas/SimpleFilterCriterionValueNumber'
            - $ref: '#/components/schemas/SimpleFilterCriterionValueBoolean'
            - $ref: '#/components/schemas/SimpleFilterCriterionValueObjectRequest'
            - $ref: '#/components/schemas/SimpleFilterCriterionValueObjectPredefined'
            - $ref: '#/components/schemas/SimpleFilterCriterionValueAgeDuePredefined'
          description: >-
            Represents the filter value used in the not_equal comparator.
            Accepts a scalar or an array of values, depending on the field's
            data_type.
        type:
          type: string
          enum:
            - merge_field
            - pre_defined
            - value
            - field
          default: value
          description: >-
            Indicates the value resolution mode of the criterion, distinguishing
            whether the filter value is a literal value, a merge field
            reference, a predefined system variable, or another field reference.

            Possible values:

            value - The value is a direct literal.

            merge_field - The value is a merge field reference.

            pre_defined - The value is a predefined system variable placeholder.

            field - The value references another field.
      required:
        - field
        - comparator
        - value
      additionalProperties: false
    EqualityFilterCriterionRequest:
      x-zs-$id: EqualityFilterCriterionRequest
      description: >-
        Represents an equality filter criterion that dispatches to either the
        EqualFilterCriterionRequest or NotEqualFilterCriterionRequest schema
        based on the comparator value.
      oneOf:
        - $ref: '#/components/schemas/EqualFilterCriterionRequest'
        - $ref: '#/components/schemas/NotEqualFilterCriterionRequest'
    TextFilterCriterionRequest:
      type: object
      x-zs-$id: TextFilterCriterionRequest
      description: >-
        Represents a filter criterion for the like, not_like, starts_with,
        ends_with, contains, and not_contains comparators. The value must be a
        string scalar or array; use SimpleFilterCriterionValueString for
        text-based field types. Object and Boolean values are not supported.
        Resolve the data_type from the field's FieldSchema.
      properties:
        field:
          allOf:
            - $ref: '#/components/schemas/FilterFieldBase'
            - type: object
              additionalProperties: true
              description: >-
                Represents the field reference constraint that requires the
                api_name property to be present for the text filter criterion.
              required:
                - api_name
          unevaluatedProperties: false
          description: >-
            Represents the target field definition to which the text filter
            criterion is applied, conforming to the base field structure.
        comparator:
          type: string
          enum:
            - like
            - not_like
            - starts_with
            - ends_with
            - contains
            - not_contains
          description: >-
            Represents the text comparison operator applied to the criterion.

            Possible values:

            like - Matches records where the field value contains the specified
            pattern.

            not_like - Matches records where the field value does not contain
            the specified pattern.

            starts_with - Matches records where the field value begins with the
            specified string.

            ends_with - Matches records where the field value ends with the
            specified string.

            contains - Matches records where the field value contains the
            specified string.

            not_contains - Matches records where the field value does not
            contain the specified string.
        value:
          description: >-
            Represents the string filter value used in the text comparator.
            Accepts a scalar string or an array of string values.
          oneOf:
            - type: array
              x-zs-$id: TextFilterCriterionRequestValueArray
              description: >-
                Contains an array of primitive string values for the text filter
                comparator.
              minItems: 1
              maxItems: 500
              items:
                x-zs-$id: TextFilterCriterionRequestValueArrayItems
                oneOf:
                  - $ref: '#/components/schemas/SimpleFilterCriterionValueString'
            - $ref: '#/components/schemas/SimpleFilterCriterionValueString'
        type:
          type: string
          enum:
            - merge_field
            - pre_defined
            - value
            - field
          default: value
          description: >-
            Indicates the value resolution mode of the criterion, distinguishing
            whether the filter value is a literal value, a merge field
            reference, a predefined system variable, or another field reference.

            Possible values:

            value - The value is a direct literal.

            merge_field - The value is a merge field reference.

            pre_defined - The value is a predefined system variable placeholder.

            field - The value references another field.
      required:
        - field
        - comparator
        - value
      additionalProperties: false
    OrderingFilterCriterionRequest:
      type: object
      x-zs-$id: OrderingFilterCriterionRequest
      description: >-
        Represents a filter criterion for the less_than, less_equal,
        greater_than, and greater_equal comparators. The value must be a scalar;
        arrays and objects are not supported. The value type is determined by
        the field's data_type: use SimpleFilterCriterionValueString for date or
        datetime fields, and SimpleFilterCriterionValueNumber for integer,
        currency, or double fields.
      properties:
        field:
          allOf:
            - $ref: '#/components/schemas/FilterFieldBase'
            - type: object
              additionalProperties: true
              description: >-
                Represents the field reference constraint that requires the
                api_name property to be present for the ordering filter
                criterion.
              required:
                - api_name
          unevaluatedProperties: false
          description: >-
            Represents the target field definition to which the ordering filter
            criterion is applied, conforming to the base field structure.
        comparator:
          type: string
          enum:
            - less_than
            - less_equal
            - greater_than
            - greater_equal
          description: >-
            Represents the ordering comparison operator applied to the
            criterion.

            Possible values:

            less_than - Matches records where the field value is less than the
            specified filter value.

            less_equal - Matches records where the field value is less than or
            equal to the specified filter value.

            greater_than - Matches records where the field value is greater than
            the specified filter value.

            greater_equal - Matches records where the field value is greater
            than or equal to the specified filter value.
        value:
          anyOf:
            - $ref: '#/components/schemas/SimpleFilterCriterionValueString'
            - $ref: '#/components/schemas/SimpleFilterCriterionValueNumber'
            - $ref: '#/components/schemas/SimpleFilterCriterionValueAgeDuePredefined'
          description: >-
            Represents the scalar filter value used in the ordering comparator.
            Arrays and objects are not supported for ordering comparators.
        type:
          type: string
          enum:
            - merge_field
            - pre_defined
            - value
            - field
          default: value
          description: >-
            Indicates the value resolution mode of the criterion, distinguishing
            whether the filter value is a literal value, a merge field
            reference, a predefined system variable, or another field reference.

            Possible values:

            value - The value is a direct literal.

            merge_field - The value is a merge field reference.

            pre_defined - The value is a predefined system variable placeholder.

            field - The value references another field.
      required:
        - field
        - comparator
        - value
      additionalProperties: false
    BetweenFilterCriterionRequest:
      type: object
      x-zs-$id: BetweenFilterCriterionRequest
      description: >-
        Represents a filter criterion for the between and not_between
        comparators. The value must be an array of exactly two elements —
        [lower_bound, upper_bound]. The value type is determined by the field's
        data_type: use SimpleFilterCriterionValueString for date or datetime
        fields, and SimpleFilterCriterionValueNumber for integer, currency, or
        double fields. Resolve the data_type from the field's FieldSchema. For
        formula fields, use formula.return_type as the effective data_type; for
        rollup_summary fields, use rollup_summary.return_type.
      properties:
        field:
          allOf:
            - $ref: '#/components/schemas/FilterFieldBase'
            - type: object
              additionalProperties: true
              description: >-
                Represents the field reference constraint that requires the
                api_name property to be present for the range filter criterion.
              required:
                - api_name
          unevaluatedProperties: false
          description: >-
            Represents the target field definition to which the range filter
            criterion is applied, conforming to the base field structure.
        comparator:
          type: string
          enum:
            - between
            - not_between
          description: >-
            Represents the range comparison operator applied to the criterion,
            indicating whether the field value falls within or outside the
            specified bounds.

            Possible values:

            between - Matches records where the field value falls within the
            specified range.

            not_between - Matches records where the field value falls outside
            the specified range.
        value:
          type: array
          x-zs-$id: BetweenFilterCriterionRequestValueArray
          description: >-
            Contains the two boundary values — [lower_bound, upper_bound] —
            against which the field is evaluated for the between or not_between
            comparator.
          minItems: 2
          maxItems: 2
          items:
            x-zs-$id: BetweenFilterCriterionRequestValueArrayItems
            oneOf:
              - $ref: '#/components/schemas/SimpleFilterCriterionValueString'
              - $ref: '#/components/schemas/SimpleFilterCriterionValueNumber'
        type:
          type: string
          enum:
            - merge_field
            - pre_defined
            - value
            - field
          default: value
          description: >-
            Indicates the value resolution mode of the criterion, distinguishing
            whether the filter value is a literal value, a merge field
            reference, a predefined system variable, or another field reference.

            Possible values:

            value - The value is a direct literal.

            merge_field - The value is a merge field reference.

            pre_defined - The value is a predefined system variable placeholder.

            field - The value references another field.
      required:
        - field
        - comparator
        - value
      additionalProperties: false
    SetFilterCriterionRequest:
      type: object
      x-zs-$id: SetFilterCriterionRequest
      description: >-
        Represents a filter criterion for the in and not_in comparators. The
        value must be an array of primitive values. The value type is determined
        by the field's data_type: use SimpleFilterCriterionValueString for
        text-based types, and SimpleFilterCriterionValueNumber for integer,
        currency, or double fields.
      properties:
        field:
          allOf:
            - $ref: '#/components/schemas/FilterFieldBase'
            - type: object
              additionalProperties: true
              description: >-
                Represents the field reference constraint that requires the
                api_name property to be present for the set filter criterion.
              required:
                - api_name
          unevaluatedProperties: false
          description: >-
            Represents the target field definition to which the set filter
            criterion is applied, conforming to the base field structure.
        comparator:
          type: string
          enum:
            - in
            - not_in
          description: >-
            Represents the set membership comparison operator applied to the
            criterion.

            Possible values:

            in - Matches records where the field value is in the specified set
            of values.

            not_in - Matches records where the field value is not in the
            specified set of values.
        value:
          type: array
          x-zs-$id: SetFilterCriterionRequestValueArray
          description: >-
            Contains an array of primitive filter values used in the set
            comparison.
          minItems: 1
          maxItems: 500
          items:
            x-zs-$id: SetFilterCriterionRequestValueArrayItems
            oneOf:
              - $ref: '#/components/schemas/SimpleFilterCriterionValueString'
              - $ref: '#/components/schemas/SimpleFilterCriterionValueNumber'
        type:
          type: string
          enum:
            - merge_field
            - pre_defined
            - value
            - field
          default: value
          description: >-
            Indicates the value resolution mode of the criterion, distinguishing
            whether the filter value is a literal value, a merge field
            reference, a predefined system variable, or another field reference.

            Possible values:

            value - The value is a direct literal.

            merge_field - The value is a merge field reference.

            pre_defined - The value is a predefined system variable placeholder.

            field - The value references another field.
      required:
        - field
        - comparator
        - value
      additionalProperties: false
    MultiSelectLookupFilterCriterionRequest:
      type: object
      x-zs-$id: MultiSelectLookupFilterCriterionRequest
      description: >-
        Represents a filter criterion for the include_all, include_any,
        exclude_all, and exclude_any comparators. Applicable only when the
        field's data_type is multiuserlookup or multiselectlookup. The value
        must be an array of SimpleFilterCriterionValueObjectRequest lookup
        objects.
      properties:
        field:
          allOf:
            - $ref: '#/components/schemas/FilterFieldBase'
            - type: object
              additionalProperties: true
              description: >-
                Represents the field reference constraint that requires the
                api_name property to be present for the multi-select lookup
                filter criterion.
              required:
                - api_name
          unevaluatedProperties: false
          description: >-
            Represents the target field definition to which the multi-select
            lookup filter criterion is applied. The field must have a data_type
            of multiuserlookup or multiselectlookup.
        comparator:
          type: string
          enum:
            - include_all
            - include_any
            - exclude_all
            - exclude_any
          description: >-
            Represents the multi-select lookup comparison operator applied to
            the criterion. Applicable only when the field's data_type is
            multiuserlookup or multiselectlookup.

            Possible values:

            include_all - Matches records that include all specified lookup
            values.

            include_any - Matches records that include at least one of the
            specified lookup values.

            exclude_all - Matches records that exclude all specified lookup
            values.

            exclude_any - Matches records that exclude at least one of the
            specified lookup values.
        value:
          maxItems: 5
          type: array
          x-zs-$id: MultiSelectLookupFilterCriterionRequestValueArray
          description: >-
            Contains an array of lookup object references used in the
            multi-select comparison.
          minItems: 1
          items:
            x-zs-$id: MultiSelectLookupFilterCriterionRequestValueArrayItems
            $ref: '#/components/schemas/SimpleFilterCriterionValueObjectRequest'
        type:
          type: string
          enum:
            - merge_field
            - pre_defined
            - value
            - field
          default: value
          description: >-
            Indicates the value resolution mode of the criterion, distinguishing
            whether the filter value is a literal value, a merge field
            reference, a predefined system variable, or another field reference.

            Possible values:

            value - The value is a direct literal.

            merge_field - The value is a merge field reference.

            pre_defined - The value is a predefined system variable placeholder.

            field - The value references another field.
      required:
        - field
        - comparator
        - value
      additionalProperties: false
    SimpleFilterCriterionRequest:
      x-zs-$id: SimpleFilterCriterionRequest
      description: >-
        Represents a simple field-based filter criterion that dispatches to the
        appropriate comparator-specific schema. The equal and not_equal
        comparators support scalar or array values; text comparators support
        scalar or array strings; ordering comparators require a scalar; between
        and not_between comparators require a two-element array; in and not_in
        comparators require an array of primitives; and include_all,
        include_any, exclude_all, and exclude_any comparators require an array
        of lookup objects and apply only when the field's data_type is
        multiuserlookup or multiselectlookup.
      oneOf:
        - $ref: '#/components/schemas/EqualityFilterCriterionRequest'
        - $ref: '#/components/schemas/TextFilterCriterionRequest'
        - $ref: '#/components/schemas/OrderingFilterCriterionRequest'
        - $ref: '#/components/schemas/BetweenFilterCriterionRequest'
        - $ref: '#/components/schemas/SetFilterCriterionRequest'
        - $ref: '#/components/schemas/MultiSelectLookupFilterCriterionRequest'
    GroupedFilterCriterionRequest:
      type: object
      x-zs-$id: GroupedFilterCriterionRequest
      description: >-
        Represents a grouped filter criterion containing multiple filter
        conditions evaluated with a logical operator. Supports recursive nesting
        for complex filtering logic.
      properties:
        group:
          type: array
          description: >-
            Contains an array of filter conditions grouped together and
            evaluated with the specified logical operator.
          minItems: 2
          maxItems: 25
          items:
            oneOf:
              - $ref: '#/components/schemas/SimpleFilterCriterionRequest'
              - $ref: '#/components/schemas/GroupedFilterCriterionRequest'
        group_operator:
          type: string
          enum:
            - AND
            - OR
            - and
            - or
          description: >-
            Represents the logical operator applied between the filter
            conditions in the group.

            Possible values:

            AND - All conditions in the group must be satisfied.

            OR - At least one condition in the group must be satisfied.

            and - Equivalent to AND; all conditions in the group must be
            satisfied.

            or - Equivalent to OR; at least one condition in the group must be
            satisfied.
      required:
        - group
        - group_operator
      additionalProperties: false
    FilterCriterionRequest:
      x-zs-$id: FilterCriterionRequest
      description: >-
        Represents the top-level filter criterion for data selection, supporting
        both simple field-based filters and complex grouped filters with logical
        operators.
      oneOf:
        - $ref: '#/components/schemas/SimpleFilterCriterionRequest'
        - $ref: '#/components/schemas/GroupedFilterCriterionRequest'
