                      Error response when the requested operation or module is
                      not supported.
                    type: object
                    additionalProperties: false
                    properties:
                      status:
                        type: string
                        enum:
                          - error
                        description: Indicates the response is an error.
                      code:
                        type: string
                        enum:
                          - API_NOT_SUPPORTED
                        description: >-
                          Error code representing unsupported operation or
                          module.
                      message:
                        type: string
                        description: >-
                          Detailed message describing why the request is not
                          supported.
                        maxLength: 512
                        enum:
                          - api not supported in this version
                      details:
                        type: object
                        description: >-
                          Additional details including the unsupported module
                          name.
                        additionalProperties: false
                        properties:
                          supported_version:
                            type: string
                            description: The API version that supports this operation.
                            maxLength: 100
                            enum:
