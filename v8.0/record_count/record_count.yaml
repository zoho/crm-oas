components:
  parameters:
    ModuleApiName:
      name: moduleApiName
      in: path
      required: true
      description: >-
        Specify the API name of the module for which you want to retrieve the
        record count. Refer to the [Get
        Modules](modules.yaml#$.paths./settings/modules.get) resource for valid
        values.
      schema:
        type: string
        description: >-
          The API name of the module for which to retrieve the record count
          (e.g., `Leads`, `Accounts`).
        maxLength: 5000
      examples:
        Leads:
          value: Leads
        Accounts:
          value: Accounts
    Email:
      name: email
      in: query
      description: >-
        Specify an email address to filter the count to records that contain
        this value in any email field of the specified module. Encode special
        characters before submitting (for example, use `p%2Bboyle@abc.com` for
        `p+boyle@abc.com`).
      required: false
      schema:
        type: string
        maxLength: 3000
        description: >-
          The email address to filter records by. Note that special characters
          must be URL-encoded (e.g., `p%2Bboyle@abc.com` for `p+boyle@abc.com`).
      example: p%2Bboyle@abc.com
    Phone:
      name: phone
      in: query
      description: >-
        Specify a phone number to filter the count to records that contain this
        value in any phone field of the specified module.
      required: false
      schema:
        type: string
        maxLength: 3000
        description: The phone number to filter records by.
      example: '9876543210'
    Word:
      name: word
      in: query
      required: false
      description: >-
        Specify a search term to filter the count to records that contain this
        word in any searchable field within the specified module.
      schema:
        type: string
        maxLength: 3000
        description: The word to filter records by.
      example: fin
    Cvid:
      name: cvid
      in: query
      description: >-
        Specify the ID of the Custom View from which to retrieve the record
        count. Refer to the [Get Custom
        Views](custom_views.yaml#$.paths./settings/custom_views.get) resource
        for valid values.
      required: false
      schema:
        type: string
        maxLength: 3000
        description: The Custom View ID to filter records by.
      example: 5690xxxx980
    Criteria:
      name: criteria
      in: query
      description: >-
        Performs search by following the shown criteria:
        `(({api_name}:{operator}:{value}) and/or
        ({api_name}:{operator}:{value}))`


        Performs a search based on the following format:

        `(({field_API_name}:{operator}:{value}) and/or
        ({field_API_name}:{operator}:{value}))`


        Replace `{field_API_name}`, `{operator}`, and `{value}` with the
        appropriate field API name, condition, and value.


        **Key Points:**

        - You can search for a maximum of **10 criteria** (with same or
        different columns)

        - The only operator that is supported for **encrypted fields** is
        `equals`

        - When using the `equals` operator in the Search API, it behaves like
        `contains`, retrieving records that include the specified value


        **Single Condition:**

        If the condition is `(Company:equals:ABC)`, the response will include
        records with "ABC" as well as "ABC Inc" in the Company field.


        **Multiple Conditions:**

        `equals` still behaves like `contains`. For example,
        `((Company:equals:ABC) and (First_Name:starts_with:M))`, it retrieves
        records where the "First Name" starts with "M" and the "Company"
        contains "ABC" (e.g., "ABC" or "ABC Inc.").


        **Note:** The above behaviour does not apply to the **picklist field
        type**.


        **IN Operator:**

        The `in` operator checks if a field's value matches any value in a given
        list.

        For example, `(Full_Name:in:Patricia,Boyle,Kate)`, it retrieves records
        where the Full Name is Patricia, Boyle, or Kate.


        **Special Character Handling:**

        When a single-line field value contains characters such as `{`, `}`,
        `[`, `]`, `^`, `:`, `-`, `/`, `!`, `?`, `*`, `_`, `@`, space, the Search
        API returns records with similar-looking values, even if the characters
        are not an exact match.


        For example, if Record A has the field value `sales-team@zoho.com` and
        Record B has `sales_team@zoho.com`, a search using
        `equals:sales-team@zoho.com` may return both records.


        **Escaping Special Characters:**

        When using parentheses `()`, commas `,`, or a backslash `\` as the last
        character in a search value, follow these steps:

        1. Escape special characters using a backslash `\`

        2. Encode the value before making the API request. Select the value of
        the criteria, right-click the value, and choose the EncodeURIComponent
        option.


        **Example 1: Escaping Parentheses and Commas**

        - Search term: `((Last_Name:equals:Burns,B) and
        (First_Name:starts_with:M))`

        - Escape the comma `\,`: `((Last_Name:equals:Burns\,B) and
        (First_Name:starts_with:M))`

        - Encode the value: `((Last_Name:equals:Burns%5C%2CB) and
        (First_Name:starts_with:M))`


        **Example 2: Escaping a Backslash at the End**

        - Search term: `(Last_Name:equals:K\)`

        - Escape the backslash `\\`: `(Last_Name:equals:K\\)`

        - Encode the value: `(Last_Name:equals:K%5C%5C)`


        **Supported Data Types:**

        `picklist`, `owner_lookup`, `user_lookup`, `lookup`, `phone`, `email`,
        `date`, `datetime`, `text`, `textarea`, `integer`, `currency`,
        `decimal`, `multiselectpicklist`, `bigint`, `percent`, `formula`,
        `website`, `boolean`, `double`


        **Supported Operators:**

        `equals`, `starts_with`, `in`, `not_equal`, `greater_equal`,
        `greater_than`, `less_equal`, `less_than`, `between`


        **Operator Compatibility by Data Type:**


        | Data Type | equals | starts_with | in | not_equal | greater_equal |
        greater_than | less_equal | less_than | between |

        |---|:---:|:---:|:---:|:---:|:---:|:---:|:---:|:---:|:---:|

        | **text** | ✓ | ✓ | ✓ | ✓ | ✗ | ✗ | ✗ | ✗ | ✗ |

        | **textarea** | ✓ | ✓ | ✓ | ✓ | ✗ | ✗ | ✗ | ✗ | ✗ |

        | **email** | ✓ | ✓ | ✓ | ✓ | ✗ | ✗ | ✗ | ✗ | ✗ |

        | **phone** | ✓ | ✓ | ✓ | ✓ | ✗ | ✗ | ✗ | ✗ | ✗ |

        | **website** | ✓ | ✓ | ✓ | ✓ | ✗ | ✗ | ✗ | ✗ | ✗ |

        | **picklist** | ✓ | ✗ | ✓ | ✓ | ✗ | ✗ | ✗ | ✗ | ✗ |

        | **multiselectpicklist** | ✓ | ✗ | ✓ | ✓ | ✗ | ✗ | ✗ | ✗ | ✗ |

        | **lookup** | ✓ | ✓ | ✓ | ✓ | ✗ | ✗ | ✗ | ✗ | ✗ |

        | **owner_lookup** | ✓ | ✓ | ✓ | ✓ | ✗ | ✗ | ✗ | ✗ | ✗ |

        | **user_lookup** | ✓ | ✓ | ✓ | ✓ | ✗ | ✗ | ✗ | ✗ | ✗ |

        | **boolean** | ✓ | ✗ | ✗ | ✓ | ✗ | ✗ | ✗ | ✗ | ✗ |

        | **integer** | ✓ | ✗ | ✓ | ✓ | ✓ | ✓ | ✓ | ✓ | ✓ |

        | **bigint** | ✓ | ✗ | ✓ | ✓ | ✓ | ✓ | ✓ | ✓ | ✓ |

        | **currency** | ✓ | ✗ | ✓ | ✓ | ✓ | ✓ | ✓ | ✓ | ✓ |

        | **decimal** | ✓ | ✗ | ✓ | ✓ | ✓ | ✓ | ✓ | ✓ | ✓ |

        | **double** | ✓ | ✗ | ✓ | ✓ | ✓ | ✓ | ✓ | ✓ | ✓ |

        | **percent** | ✓ | ✗ | ✓ | ✓ | ✓ | ✓ | ✓ | ✓ | ✓ |

        | **date** | ✓ | ✗ | ✓ | ✓ | ✓ | ✓ | ✓ | ✓ | ✓ |

        | **datetime** | ✓ | ✗ | ✓ | ✓ | ✓ | ✓ | ✓ | ✓ | ✓ |

        | **formula** | ✓ | ✓ | ✓ | ✓ | ✓ | ✓ | ✓ | ✓ | ✓ |


        **Legend:** ✓ = Supported, ✗ = Not Supported


        **Note:** Refer to the Zoho CRM API documentation for the most
        up-to-date operator compatibility information.
      required: false
      schema:
        type: string
        maxLength: 3000
        description: Search criteria string with field API name, operator, and value
      examples:
        SimpleEquals:
          summary: Simple equals search (text field)
          value: (Last_Name:equals:Smith)
          description: >-
            Retrieves records where Last_Name contains 'Smith' (e.g., 'Smith',
            'Smithson')
        TextStartsWith:
          summary: Text field with starts_with operator
          value: (Company:starts_with:Zoho)
          description: Retrieves records where Company starts with 'Zoho'
        TextNotEqual:
          summary: Text field with not_equal operator
          value: (Department:not_equal:Sales)
          description: Retrieves records where Department is not 'Sales'
        TextInOperator:
          summary: Text field with IN operator
          value: (Last_Name:in:Smith,Johnson,Williams)
          description: >-
            Retrieves records where Last_Name is Smith, Johnson, or Williams
            (max 100 values)
        EmailEquals:
          summary: Email field with equals operator
          value: (Email:equals:john@example.com)
          description: Retrieves records where Email contains 'john@example.com'
        EmailStartsWith:
          summary: Email field with starts_with operator
          value: (Email:starts_with:admin)
          description: Retrieves records where Email starts with 'admin'
        PhoneEquals:
          summary: Phone field with equals operator
          value: (Phone:equals:9876543210)
          description: Retrieves records where Phone contains '9876543210'
        PhoneIn:
          summary: Phone field with IN operator
          value: (Mobile:in:9876543210,9876543211,9876543212)
          description: Retrieves records where Mobile matches any of the provided numbers
        WebsiteEquals:
          summary: Website field with equals operator
          value: (Website:equals:zoho.com)
          description: Retrieves records where Website contains 'zoho.com'
        WebsiteStartsWith:
