                              - api_name
                          - type: object
                            description: Data type mismatch error details
                            x-zs-$id: PostInvalidQueryDataTypeMismatchDetailsWithValue
                            additionalProperties: false
                            properties:
                              expected_data_type:
                                type: string
                                description: The expected data type for the field
                                maxLength: 100
                              reason:
                                type: string
                                description: Detailed reason for the error
                                maxLength: 500
                              value:
                                type: string
                                description: The invalid value provided in the query
                                maxLength: 500
                            required:
                              - expected_data_type
                              - reason
                              - api_name
                              - value
                          - type: object
                            description: Invalid operator error details
                            x-zs-$id: PostInvalidQueryInvalidOperatorDetails
                            additionalProperties: false
                            properties:
                              operator:
                                type: string
