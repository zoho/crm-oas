                      message:
                        type: string
                        description: >-
                          Detailed message describing the ambiguity in the
                          request.
                        maxLength: 512
                        enum:
                          - >-
                            Please use either Cvid or Search Params. Combination
                            of both the params is not allowed
                      details:
                        type: object
                        description: Additional details about the ambiguity.
                        additionalProperties: false
                        properties:
                          ambiguity_due_to:
                            type: array
                            description: List of parameters causing ambiguity.
                            maxItems: 2
                            items:
                              type: object
                              additionalProperties: false
                              description: Parameter causing ambiguity.
                              properties:
                                param_name:
                                  type: string
                                  description: Name of the parameter causing ambiguity.
                                  maxLength: 100
                              required:
                                - param_name
                  - x-zs-$id: NotSupportedVersionError
