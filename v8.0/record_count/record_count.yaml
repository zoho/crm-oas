openapi: 3.1.0
info:
  title: Module Record Count
  description: >-
    The Module Record Count API returns the total number of records in a
    specified Zoho CRM module. This API enables developers to count records in
    any supported module, with optional filtering by custom view or search
    criteria.
  version: '8.0'
  summary: Module Record Count API
servers:
  - url: https://zohoapis.{dc}/crm/{version}
    description: API Server URL
    variables:
      dc:
        enum:
          - com
          - eu
          - in
          - cn
          - au
        default: com
        description: >-
          The domain corresponding to your Zoho CRM data center (e.g.,
          www.zohoapis.com, www.zohoapis.eu).
      version:
        enum:
          - v8
        default: v8
        description: API version
paths:
  /{moduleApiName}/actions/count:
    get:
      tags:
        - Records
      summary: Module Record Count
      description: >-
        To retrieve the total number of records in a specified Zoho CRM module,
        optionally filtered by a Custom View or search criteria. The count can
        be filtered using `cvid` (Custom View ID) or search parameters
        (`criteria`, `email`, `phone`, or `word`). These two filter groups are
        mutually exclusive - they cannot be combined in the same request. The
        `converted` and `approved` parameters apply only to the Leads module.
        The `type` parameter applies only to the Users module. Note: The record
        count may take 1-10 minutes to reflect the latest changes in Zoho CRM.


        The count can be filtered using `cvid` (Custom View ID) or one of the
        search parameters (`criteria`, `phone`, `email`, `word`).


        **Important Constraint (Zoho Documentation):**


        You can only include **either** `cvid` **or** one of the search
        parameters (`criteria`, `phone`, `email`, `word`) in a single request.
        Combining `cvid` with any search parameter will result in an
        `AMBIGUITY_DURING_PROCESSING` error (HTTP 400).
      security:
        - OAuth2:
            - ZohoCRM.modules.READ
        - OAuth2:
            - ZohoCRM.modules.Leads.READ
        - OAuth2:
            - ZohoCRM.modules.Contacts.READ
        - OAuth2:
            - ZohoCRM.modules.Accounts.READ
        - OAuth2:
            - ZohoCRM.modules.Deals.READ
        - OAuth2:
            - ZohoCRM.modules.Tasks.READ
        - OAuth2:
            - ZohoCRM.modules.Events.READ
        - OAuth2:
            - ZohoCRM.modules.Calls.READ
        - OAuth2:
            - ZohoCRM.modules.Products.READ
        - OAuth2:
            - ZohoCRM.modules.Vendors.READ
        - OAuth2:
            - ZohoCRM.modules.Campaigns.READ
        - OAuth2:
            - ZohoCRM.modules.Cases.READ
        - OAuth2:
            - ZohoCRM.modules.Solutions.READ
        - OAuth2:
            - ZohoCRM.modules.pricebooks.READ
        - OAuth2:
            - ZohoCRM.modules.Quotes.READ
        - OAuth2:
            - ZohoCRM.modules.salesorders.READ
        - OAuth2:
            - ZohoCRM.modules.purchaseorders.READ
      operationId: getRecordCount
      parameters:
        - $ref: '#/components/parameters/ModuleApiName'
        - $ref: '#/components/parameters/Email'
        - $ref: '#/components/parameters/Phone'
        - $ref: '#/components/parameters/Word'
        - $ref: '#/components/parameters/Cvid'
        - $ref: '#/components/parameters/Criteria'
        - $ref: '#/components/parameters/Filters'
        - $ref: '#/components/parameters/IncludeFilters'
        - $ref: '#/components/parameters/CrossFilters'
        - $ref: '#/components/parameters/Converted'
        - $ref: '#/components/parameters/Approved'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Type'
      responses:
        '200':
          description: Successful response containing the total record count.
          content:
            application/json:
              schema:
                x-zs-$id: GetRecordCountResponse
                type: object
                description: >-
                  Represents the response body containing the total number of
                  records matching the specified filter criteria.
                additionalProperties: false
                properties:
                  count:
                    type: integer
                    format: int32
                    description: >-
                      Represents the total number of records matching the
                      specified filter criteria. Always returned in the
                      response.
                required:
                  - count
              examples:
                Success:
                  summary: Successful record count response
                  value:
                    count: 42
          x-zs-llm-description: >-
            This tool is used to get the number of records for the given CRM
            module by using either cvid or criteria
        '400':
          description: >-
            Bad Request - invalid module name, unsupported module, or ambiguous
            use of parameters.
          content:
            application/json:
              schema:
                x-zs-$id: GetCount400ErrorResponses
                description: >-
                  Represents the union of possible error response bodies
                  returned for a 400 Bad Request.
                oneOf:
                  - type: object
                    description: Invalid request error response
                    x-zs-$id: PostInvalidRequestErrorResponse
                    additionalProperties: false
                    properties:
                      status:
                        type: string
                        description: Error status indicator
                        enum:
                          - error
                      code:
                        type: string
                        description: Error code indicating invalid request
                        enum:
                          - INVALID_REQUEST
                      message:
                        type: string
                        description: Human-readable error message
                        maxLength: 1000
                        const: >-
                          unable to process your request. please verify whether
                          you have entered proper method name, parameter and
                          parameter values.
                      details:
                        type: object
                        description: Additional error details
                        additionalProperties: false
                    required:
                      - status
                      - code
                      - message
                  - type: object
                    description: Invalid request error response
                    x-zs-$id: PostFieldTypeUnavailableErrorResponse
                    additionalProperties: false
                    properties:
                      status:
                        type: string
                        description: Error status indicator
                        enum:
                          - error
                      code:
                        type: string
                        description: Error code indicating invalid request
                        enum:
                          - FIELD_TYPE_UNAVAILABLE
                      message:
                        type: string
                        description: Human-readable error message
                        maxLength: 1000
                        enum:
                          - this data type is not found in this module
                      details:
                        type: object
                        description: Additional error details
                        additionalProperties: false
                    required:
                      - status
                      - code
                      - message
                  - type: object
                    description: Operation not supported error response
                    x-zs-$id: PostNotSupportedErrorResponse
                    additionalProperties: false
                    properties:
                      status:
                        type: string
                        description: Error status indicator
                        const: error
                      code:
                        type: string
                        description: Error code indicating unsupported operation
                        const: NOT_SUPPORTED
                      message:
                        type: string
                        description: Human-readable error message
                        maxLength: 1000
                        enum:
                          - The module does not support this operation
                          - module not suppoted for search
                          - the given module is not supported for count
                      details:
                        type: object
                        description: Additional error details including module information
                        additionalProperties: false
                        properties:
                          module:
                            type: string
                            description: The module that does not support this operation
                            maxLength: 100
                    required:
                      - status
                      - code
                      - message
                      - details
                  - type: object
                    description: Missing required parameter error response
                    x-zs-$id: PostExpectedParamMissingErrorResponse
                    additionalProperties: false
                    properties:
                      status:
                        type: string
                        description: Error status indicator
                        enum:
                          - error
                      code:
                        type: string
                        description: Error code indicating missing parameters
                        enum:
                          - EXPECTED_PARAM_MISSING
                      message:
                        type: string
                        description: Human-readable error message
                        maxLength: 1000
                      details:
