          description: Retrieves records where Notes starts with 'Important'
        TextareaNotEqual:
          summary: Textarea field with not_equal operator
          value: (Comments:not_equal:Closed)
          description: Retrieves records where Comments does not contain 'Closed'
        IntegerEquals:
          summary: Integer field with equals operator
          value: (No_of_Employees:equals:100)
          description: Retrieves records where No_of_Employees is exactly 100
        IntegerGreaterThan:
          summary: Integer field with greater_than operator
