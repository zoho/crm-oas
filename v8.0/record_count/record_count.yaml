                    required:
                      - status
                      - code
                      - message
              examples:
                InvalidRequest:
                  summary: Invalid request error
                  value:
                    status: error
                    code: INVALID_REQUEST
                    message: >-
                      unable to process your request. please verify whether you
                      have entered proper method name, parameter and parameter
                      values.
                    details: {}
                  description: >-
                    Illustrates the error returned when the request is invalid
                    due to malformed or unsupported input.
                FieldTypeUnavailable:
                  summary: Field type not found in module
                  value:
                    status: error
                    code: FIELD_TYPE_UNAVAILABLE
                    message: this data type is not found in this module
                    details: {}
                  description: >-
                    Illustrates the error returned when the specified field type
                    is not found in the module.
                NotSupported:
                  summary: Module not supported for count
                  value:
                    status: error
                    code: NOT_SUPPORTED
                    message: the given module is not supported for count
                    details:
                      module: Module_Name
                  description: >-
                    Illustrates the error returned when the specified module
                    does not support the record count operation.
                ModuleNotSupportedForSearch:
                  summary: Module not supported for search
                  value:
                    status: error
                    code: NOT_SUPPORTED
                    message: module not suppoted for search
                    details:
                      module: Activities
                  description: >-
                    Illustrates the error returned when the specified module
                    does not support search-based record count operations.
                ExpectedParamMissing:
                  summary: Missing required search parameter
                  value:
                    status: error
                    code: EXPECTED_PARAM_MISSING
                    message: one of the expected parameter is missing
                    details:
                      param_names:
                        - criteria
                        - email
                        - phone
                        - word
                InvalidModule:
                  summary: Invalid module name provided
                  value:
                    status: error
                    code: INVALID_MODULE
                    message: the module name given seems to be invalid
                    details:
                      resource_path_index: 1
                  description: >-
                    Illustrates the error returned when the specified module
                    name does not correspond to a valid Zoho CRM module.
                InvalidQueryRestrictedField:
                  summary: Restricted field in search criteria
                  value:
                    status: error
                    code: INVALID_QUERY
                    message: Cannot use the restricted field.
                    details:
                      reason: Cannot use the restricted field.
                      api_name: Custom_Field_1
                  description: >-
                    Illustrates the error returned when the request includes a
                    restricted field in the search criteria.
                InvalidQueryInvalidValue:
                  summary: Invalid value in search criteria
                  value:
                    status: error
                    code: INVALID_QUERY
                    message: invalid value for search
                    details:
                      reason: Please check the value of the field
                      api_name: Phone
                      value: ABC123
                  description: >-
                    Illustrates the error returned when an invalid value is
                    provided in the search criteria query.
                InvalidQueryInvalidOperator:
                  summary: Invalid operator for field type
                  value:
                    status: error
                    code: INVALID_QUERY
                    message: invalid operator found
                    details:
                      operator: greater_than
                      reason: The operator is not valid for the field type
                      api_name: Email
                  description: >-
                    Illustrates the error returned when the operator specified
                    in the criteria is not valid for the field type.
                InvalidQueryDataTypeMismatch:
                  summary: Data type mismatch in search criteria
                  value:
                    status: error
                    code: INVALID_QUERY
                    message: invalid value for search
                    details:
                      expected_data_type: Integer
                      reason: invalid value for search
                      api_name: Age
                  description: >-
                    Illustrates the error returned when a data type mismatch is
                    detected in the search criteria query.
                InvalidQueryFieldNotAvailable:
                  summary: Field not available for search
                  value:
                    status: error
                    code: INVALID_QUERY
                    message: the field is not available for search
                    details:
                      reason: the field is not available for search
                      api_name: Encrypted_Field
                  description: >-
                    Illustrates the error returned when the specified field is
                    not available for search in the module.
                InvalidQuerySpecialCharacters:
                  summary: Special characters in search criteria
                  value:
                    status: error
                    code: INVALID_QUERY
                    message: special characters are not allowed
                    details:
                      reason: special characters are not allowed
                      api_name: Search_Field
                  description: >-
                    Illustrates the error returned when unsupported special
                    characters are used in the search criteria.
                InvalidQueryNoMaskingPermission:
                  summary: No masking permission for searched field
                  value:
                    status: error
                    code: INVALID_QUERY
                    message: no_masking_permission
                    details:
                      reason: no_masking_permission
                      api_name: Masked_Field
                  description: >-
                    Illustrates the error returned when the requesting user does
                    not have permission to search masked fields.
                InvalidQueryMultipleWildcards:
                  summary: Multiple wildcards in criteria not allowed
                  value:
                    status: error
                    code: INVALID_QUERY
                    message: More than one wildcard(*) not allowed in a searchword
                    details:
                      reason: More than one wildcard(*) not allowed in a searchword
                      api_name: Search_Field
                  description: >-
                    Illustrates the error returned when multiple wildcard
