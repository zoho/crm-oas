components:
  parameters:
    Include:
      name: include
      in: query
      required: false
      description: >
        Specify this key to fetch deal record configuration when
        **when_appointment_completed:create_deal**.

        Possible values: **deal_record_configuration**.
      schema:
        type: string
        enum:
          - deal_record_configuration
  securitySchemes:
    OAuth2:
      type: oauth2
      description: OAuth 2.0 authorization using Zoho Accounts for secure API access.
      flows:
        authorizationCode:
          authorizationUrl: https://accounts.zoho.com/oauth/v2/auth
          tokenUrl: https://accounts.zoho.com/oauth/v2/token
          refreshUrl: https://accounts.zoho.com/oauth/v2/token
          scopes:
            ZohoCRM.settings.modules.ALL: >-
              Grants full access to read and update appointment preference
              settings in the Zoho CRM organization.
            ZohoCRM.settings.modules.UPDATE: >-
              Grants permission to update appointment preference settings in the
              Zoho CRM organization.
            ZohoCRM.settings.modules.READ: >-
              Grants permission to retrieve appointment preference settings from
              the Zoho CRM organization.
