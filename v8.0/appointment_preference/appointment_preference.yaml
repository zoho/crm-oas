              examples:
                MandatoryFieldMissing:
                  summary: >-
                    Example of an error when a required field is absent from the
                    request.
                  value:
                    appointment_preferences:
                      status: error
                      code: MANDATORY_NOT_FOUND
                      message: Mandatory fields are missing
                      details:
                        api_name: allow_booking_outside_service_availability
                        json_path: >-
                          appointment_preferences.allow_booking_outside_service_availability
                  description: >-
                    Shows the error response when
                    **allow_booking_outside_service_availability**, a required
                    field, is missing from the request.
                InvalidData:
                  summary: >-
                    Example of an error when a field receives a value of the
                    wrong data type.
                  value:
                    appointment_preferences:
                      status: error
                      code: INVALID_DATA
                      details:
                        expected_data_type: boolean
                        api_name: show_job_sheet
                        json_path: $.appointment_preferences.show_job_sheet
                      message: invalid data
                  description: >-
                    Shows the error response when **show_job_sheet** is provided
                    with a non-Boolean value.
                DependentMismatch:
                  summary: >-
                    Example of an error due to dependent mismatch - a
                    conflicting booking preference setting.
                  value:
                    appointment_preferences:
                      status: error
                      code: DEPENDENT_MISMATCH
                      details:
                        dependee:
                          api_name: allow_booking_outside_service_availability
                          json_path: >-
                            $.appointment_preferences.allow_booking_outside_service_availability
                        api_name: allow_booking_outside_businesshours
                        json_path: >-
                          $.appointment_preferences.allow_booking_outside_businesshours
                      message: >-
                        allow_booking_outside_service_availability must be
                        enabled to set allow_booking_outside_businesshours to
                        true
                  description: >-
                    Shows the error response when
                    **allow_booking_outside_businesshours** is set to **true**
                    while **allow_booking_outside_service_availability** is
                    **false**.
                DependentFieldMissing:
                  summary: >-
                    Example of dependent field missing error when
                    sharing_enabled is set but sharing_details is absent.
                  value:
                    appointment_preferences:
                      status: error
                      code: DEPENDENT_FIELD_MISSING
                      details:
                        dependee:
                          api_name: sharing_enabled
                          json_path: $.appointment_preferences.sharing_enabled
                        api_name: sharing_details
                        json_path: $.appointment_preferences.sharing_details
                      message: Dependent Field missing
                  description: >-
                    Shows the error response when **sharing_details** is
                    included in the request body without setting
                    **sharing_enabled** to **true**.
                MandatoryNotFoundSharingEnabled:
                  summary: >-
                    Example of an error when sharing_details is present but
                    sharing_enabled is missing.
                  value:
                    appointment_preferences:
                      status: error
                      code: MANDATORY_NOT_FOUND
                      details:
                        api_name: sharing_enabled
                        json_path: $.appointment_preferences.sharing_enabled
                      message: required field not found
                  description: >-
                    Shows the error response when **sharing_details** is
                    included in the request body without the required
                    **sharing_enabled** field.
