openapi: 3.1.0
info:
  title: Blueprint Process Configuration
  description: >-
    The Blueprint Process Configuration API provides meta details of Blueprint
    configuration, such as the number of configured Blueprints, supported
    features, and supported feature limits in your Zoho CRM organization..
  version: '8'
servers:
  - url: https://zohoapis.{dc}/crm/{version}
    description: API Server URL
    variables:
      dc:
        description: API Server URL TLD
        default: com
        enum:
          - eu
          - com
          - au
          - in
          - jp
          - cn
          - ca
      version:
        description: API Version
        default: v8
security:
  - OAuth2:
      - ZohoCRM.settings.blueprint.READ
paths:
  /settings/blueprints/process_configurations:
    get:
      summary: Blueprints Process Configurations
      description: >-
        To retrieve the metadata of the Blueprint process configuration in your
        Zoho CRM organization, such as the number of configured Blueprints, the
        supported features and their limits, and the supported owner models.
      x-zs-llm-description: >-
        Get meta details of blueprint configuration including count, supported
        features, and feature limits
      operationId: getBlueprintProcessConfigurationMeta
      parameters:
        - $ref: '#/components/parameters/ParamHeaderXCrmOrg1'
      responses:
        '200':
          description: >-
            Returns the Blueprint process configuration details for the Zoho CRM
            organization, including the number of configured Blueprints,
            supported features, feature limits, and supported owner models.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlueprintProcessConfigurationsResponse'
              examples:
                Success200:
                  summary: Successful Blueprint process configuration retrieval
                  value:
                    blueprints:
                      common_transitions_per_blueprint: 25
                      total_blueprint_configured: 12
                      supported_features:
                        - Widgets
                        - Kiosk
                        - parallel_transition
                        - automatic_transition
                        - CreateRecord
                      maximum_allowed_blueprints: 100
                      active_blueprint_configured: 0
                      last_seen_module:
                        api_name: All
                        id: null
                      supported_owner_models:
                        - user
                        - role
                        - user_group
                        - portal
                        - team_user
                        - team_profile
                  description: >-
                    Shows a successful response with the Blueprint process
                    configuration details for the Zoho CRM organization,
                    including the number of configured Blueprints, supported
                    features, feature limits, and supported owner models.
          headers:
            X-API-CREDITS-REMAINING:
              schema:
                type: string
                format: int64
                description: >
                  Present when >=50% of base daily credits (excluding add-on
                  credits) are consumed. Value is total remaining credits
                  including add-on credits for the rolling 24-hour window.
                pattern: ^[0-9]+$
                minLength: 1
                maxLength: 19
              required: false
        '400':
          description: >-
            The API is not supported for the selected domain.

            **Resolution:** The API must be called from a supported data center.
            Refer to the **supported_domains** array in the response for the
            list of available domains.
          content:
            application/json:
              schema:
                x-zs-$id: Getsettingsblueprintsprocessconfigurations
                oneOf:
                  - $ref: '#/components/schemas/APINotSupportedError'
                description: >
                  Represents the error response returned when the API is not
                  supported for the selected domain. Contains the error code,
                  message, status, and the list of supported domains.
              examples:
                ApiNotSupportedResponse1:
                  summary: API not supported error for the selected domain
                  value:
                    code: API_NOT_SUPPORTED
                    details:
                      supported_domains:
                        - eu
                        - com
                        - in
                        - au
                        - ca
                        - cn
                        - jp
                    message: api not supported
                    status: error
                  description: >-
                    Shows the error response when the API is not supported for
                    the selected domain. The response includes the list of
                    supported domains in the details object.
          headers:
            X-API-CREDITS-REMAINING:
              schema:
                type: string
                format: int64
                description: >
                  Present when >=50% of base daily credits (excluding add-on
                  credits) are consumed. Value is total remaining credits
                  including add-on credits for the rolling 24-hour window.
                pattern: ^[0-9]+$
                minLength: 1
                maxLength: 19
              required: false
        '403':
          description: >-
            No permission to access the Blueprint process configuration.
            Resolution: The CRM administrator must grant the required permission
            to the user's CRM profile.
          content:
            application/json:
              schema:
                x-zs-$id: Getsettingsblueprintsprocessconfigurations403
                oneOf:
                  - $ref: '#/components/schemas/PermissionDeniedError'
                description: >-
                  Represents the error response returned when the user does not
                  have permission to access the Blueprint process configuration.
                  Contains the error code, message, status, and permission
                  details.
              examples:
                NoPermissionResponse1:
                  summary: NO_PERMISSION error for a restricted profile
                  value:
                    code: NO_PERMISSION
                    details:
                      permissions:
                        - Crm_Implied_Manage_Workflow
                    message: No permission
                    status: error
                  description: >-
                    Shows the error response when the user's CRM profile lacks
                    the required permission to access the Blueprint process
                    configuration. The response includes the list of required
                    permissions in the details object.
          headers:
            X-API-CREDITS-REMAINING:
              schema:
                type: string
                format: int64
                description: >
                  Present when >=50% of base daily credits (excluding add-on
                  credits) are consumed. Value is total remaining credits
                  including add-on credits for the rolling 24-hour window.
                pattern: ^[0-9]+$
                minLength: 1
                maxLength: 19
              required: false
      security:
        - OAuth2:
            - ZohoCRM.settings.blueprint.READ
components:
  parameters:
    ParamHeaderXCrmOrg1:
      name: X-CRM-ORG
      in: header
      description: >-
        Specify the organization ID in the request header to identify the target
        Zoho CRM organization.
      required: false
      style: simple
      explode: false
      schema:
        type: integer
        format: int32
        enum:
          - 1234567
  schemas:
    APINotSupportedError:
      type: object
      additionalProperties: false
      description: >-
        Represents the error response returned when the API is not supported for
        the selected domain. Includes the error code, message, status, and a
        list of domains where the API is supported.
      properties:
        code:
          type: string
          description: >-
            Represents the error code identifying the failure reason.

            Possible values:

            **API_NOT_SUPPORTED** - The API is not supported for the selected
            domain.
          enum:
            - API_NOT_SUPPORTED
        details:
          type: object
          additionalProperties: false
          description: >-
            Contains the details of the error, including the domains where the
            API is supported.
          properties:
            supported_domains:
              type: array
              description: Lists the domains where this API is supported.
              items:
                type: string
                description: Represents a domain where the API is supported.
                maxLength: 255
              maxItems: 25
          required:
            - supported_domains
        message:
          type: string
          description: >-
            Represents the error message describing the failure.

            Possible values:

            **api not supported** - The API is not supported for the current
            domain.
          enum:
            - api not supported
        status:
          type: string
          description: |-
            Represents the status of the API response.
            Possible values:
            **error** - The request failed.
          enum:
            - error
      required:
        - code
        - details
        - message
        - status
      title: API Not Supported Error
      x-zs-$id: ErrorResponseCore1243473672
    BlueprintProcessConfigurationsResponse:
      type: object
      additionalProperties: false
      description: >-
        Represents the response body for the Blueprint process configurations
        request. Contains the configuration overview for the Zoho CRM
        organization.
      properties:
        blueprints:
          $ref: '#/components/schemas/BlueprintProcessConfigurationOverview'
      required:
        - blueprints
      title: Blueprint Process Configurations Response
      x-zs-$id: GetsettingsblueprintsprocessconfigurationsResponse200
    BlueprintProcessConfigurationOverview:
      type: object
      additionalProperties: false
      description: >-
        Represents the Blueprint process configuration overview for the Zoho CRM
        organization, including usage counts, feature limits, supported features
        and owner models, and the last seen module reference.
      properties:
        common_transitions_per_blueprint:
          type: integer
          format: int32
          description: >-
            Represents the maximum number of common transitions that can be
            configured for each Blueprint.
        total_blueprint_configured:
          type: integer
          format: int32
          description: >-
            Represents the total number of Blueprints configured in the Zoho CRM
            organization.
        supported_features:
          type: array
          description: Contains the list of features supported in Blueprint configuration.
          items:
            type: string
            description: Represents a feature supported in Blueprint configuration.
            maxLength: 255
          maxItems: 5
        maximum_allowed_blueprints:
          type: integer
          format: int32
          description: >-
            Represents the maximum number of Blueprints that can be configured
            in the Zoho CRM organization.
        active_blueprint_configured:
          type: integer
          format: int32
          description: >-
            Represents the number of Blueprints with an active status in the
            Zoho CRM organization.
        last_seen_module:
          $ref: '#/components/schemas/BlueprintLastSeenModuleReference'
        supported_owner_models:
          type: array
          description: >-
            Contains the types of owners that can be configured as Blueprint and
            transition owners.
          items:
            type: string
            description: >-
              Represents a type of owner that can be configured as a Blueprint
              or transition owner.
            maxLength: 255
          maxItems: 6
      required:
        - active_blueprint_configured
        - common_transitions_per_blueprint
        - last_seen_module
        - maximum_allowed_blueprints
        - supported_features
        - supported_owner_models
        - total_blueprint_configured
      title: Blueprint Process Configuration Overview
    BlueprintLastSeenModuleReference:
      type: object
      additionalProperties: false
      description: >-
        Represents the module most recently accessed in the Blueprint settings
        of the Zoho CRM UI, including the module API name and ID.
      properties:
        api_name:
          type: string
          description: >-
            Represents the API name of the module most recently accessed in the
            Blueprint settings of the Zoho CRM UI.
          maxLength: 255
        id:
          type:
            - string
            - 'null'
          description: >-
            Represents the ID of the module most recently accessed in the
            Blueprint settings of the Zoho CRM UI. Returns **null** when the
            module is All.
          maxLength: 255
      required:
        - api_name
        - id
      title: Blueprint Last Seen Module Reference
    PermissionDeniedError:
      type: object
      additionalProperties: false
      description: >-
        Represents the error response returned when the caller lacks permission
        to access the Blueprint process configurations resource. Includes the
        error code, message, status, and the required permissions.
      properties:
        code:
          type: string
          description: |-
            Represents the error code identifying the failure reason.
            Possible values:
            **NO_PERMISSION** - The user does not have the required permission.
          enum:
            - NO_PERMISSION
        details:
          type: object
          additionalProperties: false
          description: >-
            Contains the details of the error, including the permissions
            required for the operation.
          properties:
            permissions:
              type: array
              description: Lists the permissions required to perform the operation.
              items:
                type: string
                description: Represents a permission required to perform the operation.
                maxLength: 255
              maxItems: 25
          required:
            - permissions
        message:
          type: string
          description: >-
            Represents the error message describing the failure.

            Possible values:

            **No permission** - The user's Zoho CRM profile lacks the required
            permission.
          enum:
            - No permission
        status:
          type: string
          description: |-
            Represents the status of the API response.
            Possible values:
            **error** - The request failed.
          enum:
            - error
      required:
        - code
        - details
        - message
        - status
      title: Permission Denied Error
      x-zs-$id: ErrorResponseCore1305364261
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://accounts.zoho.com/oauth/v2/auth
          tokenUrl: https://accounts.zoho.com/oauth/v2/token
          scopes:
            ZohoCRM.settings.blueprint.READ: Access to Blueprint settings
