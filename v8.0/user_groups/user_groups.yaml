components:
  parameters:
    Group:
      name: group
      in: path
      required: true
      description: >-
        Specify the unique ID of the user group to operate on. From API v9
        onwards, UUID format is also accepted. Example: `1234567890`.
      schema:
        type: string
        enum:
          - '1234567890'
    Include:
      name: include
      in: query
      required: false
      description: |-
        Specify additional related data to include in the response.
        Possible values:
        **sources** - Include the list of sources for each group.
        **sources_count** - Include the count of sources for each group.
      schema:
        type: string
        enum:
          - sources_count
          - sources
    Filters:
      name: filters
      in: query
      required: false
      description: >-
        Filter criteria to narrow the results. Specify conditions as a
        structured filter expression. Maximum 250 characters.
      schema:
        type: string
        maxLength: 250
    Ids:
      name: ids
      in: query
      required: false
      description: >-
        Specify a comma-separated list of unique user group IDs to filter the
        results by.
      schema:
        type: string
        maxLength: 250
    Name:
      name: name
      in: query
      required: false
      description: Specify the name of the user group to filter the results by.
      schema:
        type: string
        maxLength: 250
    Page:
      name: page
      in: query
      required: false
      description: >-
        Specify the page number to retrieve paginated results. Default is 1.
        Minimum value is 1.
      schema:
        type: integer
        format: int32
        default: 1
        minimum: 1
    PerPage:
      name: per_page
      in: query
      required: false
      description: >-
        Specify the number of records to return per page. Default is 200.
        Maximum value is 200.
      schema:
        type: integer
        format: int32
        default: 200
        maximum: 200
        minimum: 1
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://accounts.zoho.com/oauth/v2/auth
          tokenUrl: https://accounts.zoho.com/oauth/v2/token
          refreshUrl: https://accounts.zoho.com/oauth/v2/token
