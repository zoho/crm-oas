openapi: 3.1.0
info:
  title: User Groups
  description: >-
    User groups in Zoho CRM let you organize users into collections for
    centralized access control and resource sharing. You can create, update, and
    delete groups, retrieve their associated sources and counts, and view which
    CRM resources are bound to each group.
  version: '8'
servers:
  - url: https://zohoapis.{dc}/crm/{version}
    description: >-
      Zoho CRM public API base URL. Replace {dc} with your data center code and
      {version} with the API version.
    variables:
      dc:
        enum:
          - com
          - eu
          - in
          - cn
          - au
        default: com
        description: |-
          Specify the data center domain suffix for your Zoho CRM account.
          Possible values:
          **com** - United States (default)
          **eu** - Europe
          **in** - India
          **cn** - China
          **au** - Australia
      version:
        default: v8
        description: Specify the API version to use. Default is v8.
paths:
  /settings/user_groups:
    get:
      security:
        - OAuth2:
            - ZohoCRM.settings.user_groups.READ
      summary: Get user groups
      description: >-
        To retrieve a paginated list of user groups configured in your Zoho CRM
        organization, with optional filtering by name or criteria, and optional
        inclusion of member source counts.
      operationId: getUserGroups
      parameters:
        - $ref: '#/components/parameters/Filters'
        - $ref: '#/components/parameters/Include'
        - $ref: '#/components/parameters/Ids'
        - $ref: '#/components/parameters/Name'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: >-
            Returns a paginated list of user groups configured in your Zoho CRM
            organization.
          content:
            application/json:
              schema:
                x-zs-$id: UserGroupsResponse
                description: >-
                  Represents the successful response for retrieving the list of
                  user groups in the Zoho CRM organization, containing a
                  paginated array of user group objects and pagination metadata.
                type: object
                additionalProperties: false
                properties:
                  user_groups:
                    description: >-
                      Represents the list of user group objects returned for the
                      current page. 
                    type: array
                    maxItems: 200
                    items:
                      description: >-
                        Represents a single user group configured in the Zoho
                        CRM organization, including its name, description,
                        member sources, and creation and modification metadata.
                      type: object
                      additionalProperties: false
                      properties:
                        created_by:
                          description: >-
                            Represents the CRM user who created this user
                            group. 
                          type: object
                          additionalProperties: false
                          properties:
                            name:
                              description: >-
                                Represents the display name of the CRM user who
                                created the user group. 
                              type: string
                              maxLength: 512
                            id:
                              description: >-
                                Represents the unique ID of the CRM user who
                                created the user group. 
                              type: string
                              maxLength: 19
                          required:
                            - name
                            - id
                        modified_by:
                          description: >-
                            Represents the CRM user who last modified this user
                            group, or null if the group has not been modified
                            since creation. 
                          oneOf:
                            - description: >-
                                Represents the CRM user who last modified the
                                user group, containing the user ID and display
                                name.
                              type: object
                              x-zs-$id: ModifiedBy
                              additionalProperties: false
                              properties:
                                name:
                                  description: >-
                                    Represents the display name of the CRM user
                                    who last modified the user group. 
                                  type: string
                                  maxLength: 512
                                id:
                                  description: >-
                                    Represents the unique ID of the CRM user who
                                    last modified the user group. 
                                  type: string
                                  maxLength: 19
                              required:
                                - name
                                - id
                            - x-zs-$id: NoModifierInfo
                              description: >-
                                Indicates that the user group has not been
                                modified since its creation.
                              type: 'null'
                        modified_time:
                          description: >-
                            Represents the date and time at which the user group
                            was last modified, in ISO 8601 format, or null if
                            the group has not been modified since creation. 
                          oneOf:
                            - x-zs-$id: ModificationTimestamp
                              description: >-
                                Represents the date and time of the most recent
                                modification to the user group, in ISO 8601
                                format.
                              type: string
                              format: date-time
                            - x-zs-$id: NoModificationTimestamp
                              description: >-
                                Indicates that the user group has not been
                                modified since its creation.
                              type: 'null'
                        created_time:
                          description: >-
                            Represents the date and time of user group creation,
                            in ISO 8601 format. 
                          type: string
                          format: date-time
                        description:
                          description: >-
                            Represents the description of the user group, or
                            null if no description was provided. 
                          oneOf:
                            - x-zs-$id: GroupDescriptionText
                              description: >-
                                Represents the text description of the user
                                group.
                              type: string
                              maxLength: 250
                            - x-zs-$id: NoDescriptionProvided
                              description: >-
                                Indicates that no description was provided for
                                this user group.
                              type: 'null'
                        id:
                          x-zs-$id: UserGroupId
                          description: 'Represents the unique ID of the user group. '
                          type: string
                          maxLength: 19
                        name:
                          description: 'Represents the name of the user group. '
                          type: string
                          maxLength: 250
                          x-zs-$id: UserGroupName
                        sources_count:
                          description: >-
                            Represents the count of member sources for the user
                            group, categorized by source type. Returned when the
                            **include** parameter is set to **sources_count**.
                          type: object
                          additionalProperties: false
                          properties:
                            territories:
                              description: >-
                                Represents the number of CRM territories
                                configured as member sources of this group.
                              type: integer
                              format: int32
                            roles:
                              description: >-
                                Represents the number of CRM roles configured as
                                member sources of this group.
                              type: integer
                              format: int32
                            groups:
                              description: >-
                                Represents the number of other user groups
                                configured as member sources of this group.
                              type: integer
                              format: int32
                            users:
                              description: >-
                                Represents the count of CRM users configured as
                                member sources of this group, categorized by
                                user status.
                              type: integer
                              format: int32
                      required:
                        - created_by
                        - modified_by
                        - modified_time
                        - created_time
                        - description
                        - id
                        - name
                  info:
                    type: object
                    description: >-
                      Represents the pagination metadata for the current page of
                      results. 
                    additionalProperties: false
                    properties:
                      per_page:
                        type: integer
                        format: int32
                        description: >-
                          Represents the number of user group records returned
                          per page. 
                      count:
                        type: integer
                        format: int32
                        description: >-
                          Represents the number of user group records returned
                          in the current page. 
                      page:
                        type: integer
                        format: int32
                        description: >-
                          Represents the current page number in the paginated
                          response. 
                      more_records:
                        type: boolean
                        description: >-
                          Indicates whether additional pages of user group
                          records are available beyond the current page. 

                          Possible values:

                          **true** - More records are available on subsequent
                          pages.

                          **false** - No more records remain after the current
                          page.
                    required:
                      - per_page
                      - count
                      - page
                      - more_records
                required:
                  - user_groups
                  - info
              examples:
                Success:
                  summary: Successful response with user groups
                  value:
                    user_groups:
                      - created_time: '2022-11-21T12:33:12+05:30'
                        sources_count:
                          territories: 1
                          roles: 2
                          users: 2
                          groups: 1
                        modified_time: '2022-11-21T13:21:46+05:30'
                        name: group 1
                        modified_by:
                          name: Patricia Boyle
                          id: '3652397000000186017'
                        description: groups API
                        id: '3652397000009949005'
                        created_by:
                          name: Patricia Boyle
                          id: '3652397000000186017'
                      - created_time: '2023-12-01T10:00:00Z'
                        sources_count:
                          roles: 2
                        modified_time: null
                        name: group test
                        modified_by: null
                        description: null
                        id: '3652397000009952001'
                        created_by:
                          name: Patricia Boyle
                          id: '3652397000000186017'
                    info:
                      per_page: 200
                      count: 2
                      page: 1
                      more_records: false
                  description: >-
                    Shows a paginated response containing two user groups with
                    their ID, name, description, creation and modification
                    metadata, and pagination info.
        '204':
          description: No user groups have been created for this Zoho CRM organization.
        '400':
          description: >-
            The filters parameter contains invalid data. **Resolution:** Provide
            a valid filter expression in the **filters** parameter.
          content:
            application/json:
              schema:
                x-zs-$id: GroupsInvalidDataError
                description: >-
                  Represents the error response returned when a request
                  parameter contains invalid data.
                type: object
                additionalProperties: false
                properties:
                  code:
                    description: >-
                      Represents the error code for the request validation
                      failure. 

                      Possible values:

                      **INVALID_DATA** - One or more request parameters contain
                      invalid data.
                    type: string
                    enum:
                      - INVALID_DATA
                  details:
                    description: >-
                      Represents additional details about the validation error,
                      including the name of the parameter that caused the
                      failure. 
                    type: object
                    additionalProperties: false
                    properties:
                      param_name:
                        description: >-
                          Represents the name of the request parameter that
                          contains invalid data. 
                        type: string
                        maxLength: 100
                    required:
                      - param_name
                  message:
                    description: >-
                      Represents the error message describing the validation
                      failure. 
                    type: string
                    maxLength: 500
                  status:
                    description: |-
                      Represents the status of the request outcome. 
                      Possible values:
                      **error** - The request failed due to a validation error.
                    type: string
                    enum:
                      - error
                required:
                  - code
                  - details
                  - message
                  - status
              examples:
                NoPermission:
                  summary: Invalid filters parameter
                  value:
                    code: INVALID_DATA
                    details:
                      param_name: filters
                    message: The given filters is not a valid json
                    status: error
                  description: >-
                    Shows the error response when the filters parameter value is
                    not a valid JSON string.
        '403':
          description: >-
            The authenticated user does not have permission to access user
            groups. **Resolution:** Grant the **Crm_Implied_Manage_Groups**
            permission in the CRM profile settings.
          content:
            application/json:
              schema:
                x-zs-$id: GroupsPermissionError
                description: >-
                  Represents the error response returned when the authenticated
                  user lacks the required CRM permission to access user groups.
                type: object
                additionalProperties: false
                properties:
                  code:
                    description: >-
                      Represents the error code for the authorization failure. 

                      Possible values:

                      **NO_PERMISSION** - The authenticated user does not have
                      permission to access user groups.
                    type: string
                    enum:
                      - NO_PERMISSION
                  details:
                    description: >-
                      Represents additional details about the authorization
                      failure, including the missing permissions. 
                    type: object
                    additionalProperties: false
                    properties:
                      permissions:
                        description: >-
                          Represents the name of the CRM permission that the
                          authenticated user lacks to access user groups. 
                        type: string
                        maxLength: 100
                    required:
                      - permissions
                  message:
                    description: >-
                      Represents the error message describing the authorization
                      failure. 
                    type: string
                    maxLength: 500
                  status:
                    description: >-
                      Represents the status of the request outcome. 

                      Possible values:

                      **error** - The request failed due to an authorization
                      error.
                    type: string
                    enum:
                      - error
                required:
                  - code
                  - details
                  - message
                  - status
              examples:
                NoPermission:
                  summary: User does not have permission to access groups
                  value:
                    code: NO_PERMISSION
                    details:
                      permissions: Crm_Implied_Manage_Groups
                    message: You do not have permission to access user groups
                    status: error
                  description: >-
                    Shows the error response when the authenticated user does
                    not have the required CRM permission to access user groups.
    post:
      security:
        - OAuth2:
            - ZohoCRM.settings.user_groups.CREATE
      summary: Create a user group
      description: >-
        To create a new user group in your Zoho CRM organization with a
        specified name, optional description, and member sources (users, roles,
        or territories).
      operationId: createGroup
      requestBody:
        content:
          application/json:
            schema:
              description: Request body schema for creating a user group.
              type: object
              additionalProperties: false
              properties:
                user_groups:
                  description: >-
                    Specify an array containing up to 10 user group objects to
                    create.
                  type: array
                  maxItems: 10
                  items:
                    description: >-
                      Specify the details of the user group to create, including
                      its name, optional description, and member sources.
                    type: object
                    additionalProperties: false
                    properties:
                      description:
                        description: >-
                          Specify an optional text description for the user
                          group.
                        oneOf:
                          - x-zs-$id: UserGroupDescriptionText
                            description: Specify the text description for the user group.
                            type: string
                            maxLength: 250
                          - x-zs-$id: NoDescriptionProvidedForCreateUserGroup
                            description: Use null to indicate no description.
                            type: 'null'
                      name:
                        description: Specify the name of the user group.
                        type: string
                        maxLength: 250
                      sources:
                        description: >-
                          Specify the array of member sources for the user
                          group.
                        type: array
                        maxItems: 200
                        items:
                          description: >-
                            Specify one member source entry for the user group,
                            including the source type, the source identifier,
                            and optional flags for subordinates or
                            sub-territories.
                          type: object
                          additionalProperties: false
                          properties:
                            type:
                              description: >-
                                Specify the type of the member source being
                                added to the user group.

                                Possible values:

                                **territories** - Add a CRM territory as a
                                member source.

                                **roles** - Add a CRM role as a member source.

                                **users** - Add individual CRM users as a member
                                source.
                              type: string
                              enum:
                                - territories
                                - roles
                                - users
                            source:
                              description: >-
                                Specify the identifier of the source to add to
                                the user group.
                              type: object
                              additionalProperties: false
                              properties:
                                id:
                                  description: >-
                                    Specify the unique ID of the user, role, or
                                    territory to add as a member source.
                                  type: string
                                  maxLength: 19
                              required:
                                - id
                            subordinates:
                              description: >-
                                Specify whether to include users in subordinate
                                roles when the source type is **roles**.

                                Possible values:

                                **true** - Include users in subordinate roles.

                                **false** - Do not include users in subordinate
                                roles.
                              oneOf:
                                - x-zs-$id: BooleanFlagToIncludeSubordinates
                                  description: >-
                                    Specify true to include users in subordinate
                                    roles, or false to exclude them.
                                  type: boolean
                                - x-zs-$id: NoSubordinatesFlagProvided
                                  description: Use null to omit the subordinates flag.
                                  type: 'null'
                            sub_territories:
                              description: >-
                                Specify whether to include members from
                                sub-territories when the source type is
                                **territories**.

                                Possible values:

                                **true** - Include members from sub-territories.

                                **false** - Do not include members from
                                sub-territories.
                              oneOf:
                                - x-zs-$id: BooleanFlagToIncludeTerritories
                                  description: >-
                                    Specify true to include members from
                                    sub-territories, or false to exclude them.
                                  type: boolean
                                - x-zs-$id: ToNoSubTerritoriesFlagProvided
                                  description: Use null to omit the sub-territories flag.
                                  type: 'null'
                          required:
                            - type
                            - source
                    required:
                      - name
                      - sources
              required:
                - user_groups
            examples:
              CreateGroupExample:
                summary: Create a user group with role and territory sources
                value:
                  user_groups:
                    - name: Sales Team
                      description: Sales department user group
                      sources:
                        - type: users
                          source:
                            id: '3652397000000186017'
                        - type: roles
                          source:
                            id: '3652397000000026008'
                          subordinates: true
                description: >-
                  Shows a request body for creating a user group named "Sample
                  Group" with a role source (including subordinates) and a
                  territory source (including sub-territories).
        required: true
        description: >-
          Provide the user group details including the name, optional
          description, and member sources (users, roles, or territories).
      responses:
        '201':
          description: >-
            User group created successfully. Returns the new group ID and a
            success status.
          content:
            application/json:
              schema:
                x-zs-$id: ResponseForUserGroupCreation
                description: Response schema for a successful user group creation.
                type: object
                additionalProperties: false
                properties:
                  user_groups:
                    description: >-
                      Represents the array containing the result of the user
                      group creation operation. 
                    type: array
                    maxItems: 10
                    items:
                      description: >-
                        Represents the creation result for the user group,
                        including the status, result code, message, and the ID
                        of the newly created group.
                      type: object
                      additionalProperties: false
                      properties:
                        code:
                          description: >-
                            Represents the result code for the user group
                            creation operation. 

                            Possible values:

                            **SUCCESS** - The user group creation succeeded.
                          type: string
                          enum:
                            - SUCCESS
                        message:
                          description: >-
                            Represents the result message for the user group
                            creation operation. 
                          type: string
                          maxLength: 500
                        status:
                          description: >-
                            Represents the status of the user group creation
                            operation. 

                            Possible values:

                            **success** - The user group creation succeeded.
                          type: string
                          enum:
                            - success
                        details:
                          description: >-
                            Represents additional details about the created user
                            group. 
                          type: object
                          additionalProperties: false
                          properties:
                            id:
                              x-zs-$id: UserGroupResultId
                              description: >-
                                Represents the unique ID of the newly created
                                user group. 
                              type: string
                              maxLength: 19
                          required:
                            - id
                      required:
                        - code
                        - message
                        - status
                        - details
                required:
                  - user_groups
              examples:
                SuccessWithId:
                  summary: User group created successfully
                  value:
                    user_groups:
                      - code: SUCCESS
                        message: User group created successfully
                        status: success
                        details:
                          id: '3652397000009949005'
                  description: >-
                    Shows the success response for a user group creation,
                    returning the new group ID and a SUCCESS code.
        '400':
          description: >-
            The user group could not be created. **Resolution:** Check that the
            **name** field is provided and unique, all required fields are
            present, and source IDs are valid.
          content:
            application/json:
              schema:
                x-zs-$id: UserGroupCreationFailures
                description: Response schema for a failed user group creation.
                type: object
                additionalProperties: false
                properties:
                  user_groups:
                    description: >-
                      Represents the array containing the error details for the
                      failed user group creation operation. 
                    type: array
                    maxItems: 10
                    items:
                      description: >-
                        Represents the error details for a user group creation
                        failure, including the error code, message, status, and
                        field-level details.
                      type: object
                      additionalProperties: false
                      properties:
                        status:
                          description: >-
                            Represents the status of the user group creation
                            operation. 

                            Possible values:

                            **error** - The user group creation failed.
                          type: string
                          enum:
                            - error
                        code:
                          description: >-
                            Represents the error code for the user group
                            creation failure. 

                            Possible values:

                            **DUPLICATE_DATA** - A user group with the same name
                            already exists.

                            **INVALID_DATA** - One or more field values are
                            invalid.

                            **MANDATORY_NOT_FOUND** - A required field is
                            missing from the request.
                          type: string
                          enum:
                            - DUPLICATE_DATA
                            - INVALID_DATA
                            - MANDATORY_NOT_FOUND
                        message:
                          description: >-
                            Represents the error message describing the user
                            group creation failure. 
                          type: string
                          maxLength: 500
                        details:
                          description: >-
                            Represents additional details about the creation
                            error, including the API name and JSON path of the
                            problematic field. 
                          type: object
                          additionalProperties: false
                          properties:
                            api_name:
                              description: >-
                                Represents the API name of the field that caused
                                the creation error. 
                              type: string
                              maxLength: 100
                            json_path:
                              description: >-
                                Represents the JSON path to the field that
                                caused the creation error. 
                              type: string
                              maxLength: 200
                          required:
                            - api_name
                            - json_path
                      required:
                        - status
                        - code
                        - message
                        - details
                required:
                  - user_groups
              examples:
                CreateGroupError:
                  summary: Invalid request body for group creation
                  value:
                    user_groups:
                      - status: error
                        code: DUPLICATE_DATA
                        message: A user group with the same name already exists.
                        details:
                          api_name: name
                          json_path: $.user_groups[0].name
                  description: >-
                    Shows the error response when the request body is invalid,
                    such as a missing required field or a duplicate group name.
  /settings/user_groups/{group}:
    get:
      security:
        - OAuth2:
            - ZohoCRM.settings.user_groups.READ
      operationId: getGroup
      summary: Get a user group
      description: >-
        To retrieve the details of a specific user group in your Zoho CRM
        organization by its unique ID, with optional inclusion of member source
        counts.
      parameters:
        - $ref: '#/components/parameters/Group'
        - $ref: '#/components/parameters/Include'
        - $ref: '#/components/parameters/Filters'
        - $ref: '#/components/parameters/Ids'
        - $ref: '#/components/parameters/Name'
      responses:
        '200':
          description: >-
            Returns the details of the specified user group, including name,
            description, creation and modification metadata, and optional source
            counts.
          content:
            application/json:
              schema:
                x-zs-$id: UserGroupSuccessResponse
                description: >-
                  Response schema containing the details of the specified user
                  group.
                type: object
                additionalProperties: false
                properties:
                  user_groups:
                    description: >-
                      Represents an array containing the details of the
                      specified user group. 
                    type: array
                    maxItems: 200
                    items:
                      description: >-
                        Represents the details of a user group, including its
                        name, description, creation and modification metadata,
                        and optional member source counts.
                      type: object
                      additionalProperties: false
                      properties:
                        created_by:
                          description: 'Represents the user who created this user group. '
                          type: object
                          additionalProperties: false
                          properties:
                            name:
                              description: >-
                                Represents the name of the user who created this
                                group. 
                              type: string
                              maxLength: 512
                            id:
                              description: >-
                                Represents the unique ID of the user who created
                                this group. 
                              type: string
                              maxLength: 19
                          required:
                            - name
                            - id
                        modified_by:
                          description: >-
                            Represents the user who last modified this user
                            group. 
                          oneOf:
                            - x-zs-$id: ModifierUserInformation
                              description: >-
                                Represents the user who last modified this
                                group, with their ID and name.
                              type: object
                              additionalProperties: false
                              properties:
                                name:
                                  description: >-
                                    Represents the name of the user who last
                                    modified this group. 
                                  type: string
                                  maxLength: 512
                                id:
                                  description: >-
                                    Represents the unique ID of the user who
                                    last modified this group. 
                                  type: string
                                  maxLength: 19
                              required:
                                - name
                                - id
                            - x-zs-$id: NoModifierInformationAvailable
                              description: >-
                                Indicates that this group has not been modified
                                since creation.
                              type: 'null'
                        modified_time:
                          description: >-
                            Represents the date and time when the user group was
                            last modified. 
                          oneOf:
                            - x-zs-$id: LastModificationTimestamp
                              description: >-
                                Represents the timestamp of the last
                                modification in ISO 8601 format.
                              type: string
                              format: date-time
                            - x-zs-$id: NoModificationTimeAvailable
                              description: >-
                                Indicates that the group has not been modified
                                since creation.
                              type: 'null'
                        created_time:
                          description: >-
                            Represents the date and time of user group creation,
                            in ISO 8601 format. 
                          type: string
                          format: date-time
                        description:
                          description: >-
                            Represents the text description of the user group.
                            Present in the response when a description was
