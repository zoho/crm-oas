                required:
                  - user_groups
              examples:
                SuccessWithId:
                  summary: User group updated successfully
                  value:
                    user_groups:
                      - code: SUCCESS
                        message: User group updated successfully
                        status: success
                        details:
                          id: '3652397000009949005'
                  description: >-
                    Shows the success response for a user group update,
                    returning the group ID and a SUCCESS code.
