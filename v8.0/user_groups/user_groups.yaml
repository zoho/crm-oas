                      not reference an existing user group.
                    type: object
                    additionalProperties: false
                    properties:
                      code:
                        description: >-
                          Represents the error code for the request failure. 

                          Possible values:

                          **INVALID_DATA** - The group ID in the URL is invalid
                          or does not reference an existing user group.
                        type: string
                        enum:
                          - INVALID_DATA
                      details:
                        description: >-
                          Represents additional details about the request
