    delete:
      security:
        - OAuth2:
            - ZohoCRM.settings.user_groups.DELETE
      summary: Delete a user group
      description: >-
        To delete an existing user group from your Zoho CRM organization. The
        deletion may be immediate or scheduled for background processing,
        depending on group size and active references.
      operationId: deleteGroup
      parameters:
        - $ref: '#/components/parameters/Group'
      responses:
        '200':
          description: >-
            User group deletion completed. Returns a success code with the group
            ID if deleted immediately, or a scheduled status with a job ID if
            queued for processing.
          content:
            application/json:
              schema:
                x-zs-$id: UserGroupDeletionFailure
                description: >-
                  Response schema for a successful user group deletion or
                  scheduled deletion.
                type: object
                additionalProperties: false
                properties:
                  user_groups:
                    description: >-
                      Represents the array containing the result of the user
                      group deletion operation. 
                    type: array
                    maxItems: 1
                    items:
                      description: >-
                        Represents the deletion result for the user group,
                        indicating whether it completes immediately or queues
                        for background processing.
                      type: object
                      additionalProperties: false
                      properties:
                        code:
                          description: >-
                            Represents the result code for the user group
                            deletion operation. 

                            Possible values:

                            **SUCCESS** - The user group deletion completes
                            immediately.

                            **SCHEDULED** - The user group deletion queues for
                            background processing; the response includes a **job
                            ID**.
                          type: string
                          enum:
                            - SUCCESS
                            - SCHEDULED
                        message:
                          description: >-
                            Represents the result message for the user group
                            deletion operation. 
                          type: string
                          maxLength: 500
                        status:
                          description: >-
                            Represents the status of the user group deletion
                            operation. 

                            Possible values:

                            **success** - The user group deletion completes
                            immediately.

                            **scheduled** - The user group deletion queues for
                            background processing.
                          type: string
                          enum:
                            - success
                            - scheduled
                        details:
                          oneOf:
                            - x-zs-$id: DetailsContainingTheDeletedGroupId
                              description: >-
                                Present when deletion completes immediately.
                                Contains the deleted group ID.
                              type: object
                              additionalProperties: false
                              properties:
                                id:
                                  description: >-
                                    Represents the unique ID of the user group
                                    for which deletion completes immediately.
                                    Present in immediate-deletion responses.
                                  type: string
                                  maxLength: 19
                              required:
                                - id
                            - x-zs-$id: DetailsContainingTheScheduledJobID
                              description: >-
                                Present when the deletion was queued for
                                background processing. Contains the scheduled
                                job ID.
                              type: object
                              additionalProperties: false
                              properties:
                                job_id:
                                  description: >-
                                    Represents the ID of the scheduled deletion
                                    job. Present when the deletion is queued for
                                    background processing.
                                  type: string
                                  maxLength: 19
                              required:
                                - job_id
                          description: >-
                            Represents additional details about the deletion
                            result, containing either the deleted group ID or a
                            scheduled job ID. 
                      required:
                        - code
                        - message
                        - status
                        - details
                required:
                  - user_groups
              examples:
                SuccessWithId:
                  summary: User group deleted immediately
                  value:
                    user_groups:
                      - code: SUCCESS
                        message: User group deleted successfully
                        status: success
                        details:
                          id: '3652397000009949005'
                  description: >-
                    Shows the response for an immediate user group deletion,
                    returning the deleted group ID and a SUCCESS code.
