    put:
      security:
        - OAuth2:
            - ZohoCRM.settings.user_groups.UPDATE
      summary: Update a user group
      description: >-
        To update the name, description, and member sources of an existing user
        group in your Zoho CRM organization.
      operationId: updateGroup
      parameters:
        - $ref: '#/components/parameters/Group'
      requestBody:
        content:
          application/json:
            schema:
              description: Request body schema for updating a user group.
              type: object
              additionalProperties: false
              properties:
                user_groups:
                  description: Specify an array containing one user group object to update.
                  type: array
                  maxItems: 1
                  items:
                    description: >-
                      Specify the updated details for the user group, including
                      the name, optional description, and member sources.
                    type: object
                    additionalProperties: false
                    properties:
                      description:
                        description: >-
                          Specify an updated text description for the user
                          group, or null to remove the description.
                        oneOf:
                          - x-zs-$id: UserGroupDescription
                            description: >-
                              Specify the updated text description for the user
                              group.
                            type: string
                            maxLength: 250
                          - x-zs-$id: NoUserGroupDescriptionProvided
                            description: Use null to remove the existing description.
                            type: 'null'
                      name:
                        description: >-
                          The name to be updated for the user group. Accepts
                          alphanumeric characters. Note that the name must be
                          unique for each group.
                        type: string
                        maxLength: 250
                      sources:
                        description: >-
                          Specify the updated array of member sources for the
                          user group. Replaces all existing sources.
                        type: array
                        maxItems: 200
                        items:
                          description: >-
                            Specify one member source entry to add to the user
                            group, including the source type, identifier, and
                            optional flags.
                          type: object
                          additionalProperties: false
                          properties:
                            type:
                              description: >-
                                Specify the type of the member source being
                                updated for the user group.

                                Possible values:

                                **territories** - Add a CRM territory as a
                                member source.

                                **roles** - Add a CRM role as a member source.

                                **users** - Add individual CRM users as a member
                                source.
                              type: string
                              enum:
                                - territories
                                - roles
                                - users
                            source:
                              description: >-
                                Specify the identifier of the source to add to
                                the user group.
                              type: object
                              additionalProperties: false
                              properties:
                                id:
                                  description: >-
                                    Specify the unique ID of the user, role, or
                                    territory to add as a member source.
                                  type: string
                                  maxLength: 19
                              required:
                                - id
                            subordinates:
                              description: >-
                                Specify whether to include users in subordinate
                                roles when the source type is **roles** or
                                **territories**.

                                Possible values:

                                **true** - Include users in subordinate roles.

                                **false** - Do not include users in subordinate
                                roles.
                              oneOf:
                                - x-zs-$id: FlagToIncludeSubordinatesForGET
                                  description: >-
                                    Specify **true** to include users in
                                    subordinate roles, or false to exclude them.
                                  type: boolean
                                - x-zs-$id: NoSubordinatesFlagProvidedForGET
                                  description: Use null to omit the subordinates flag.
                                  type: 'null'
                            sub_territories:
                              description: >-
                                Specify whether to include members from
                                sub-territories when the source type is
                                **territories**.

                                Possible values:

                                **true** - Include members from sub-territories.

                                **false** - Do not include members from
                                sub-territories.
                              oneOf:
                                - x-zs-$id: FlagToIncludeTerritoriesForGET
                                  description: >-
                                    Specify true to include members from
                                    sub-territories, or false to exclude them.
                                  type: boolean
                                - x-zs-$id: NoSubTerritoriesFlagProvided
                                  description: Use null to omit the sub-territories flag.
                                  type: 'null'
                          required:
                            - type
                            - source
                    required:
                      - name
                      - sources
              required:
                - user_groups
            examples:
              UpdateGroupExample:
                summary: Update a user group name, description, and sources
                value:
                  user_groups:
                    - name: Updated Sales Team
                      description: Updated sales department user group
                      sources:
                        - type: users
                          source:
                            id: '3652397000000186017'
                        - type: roles
                          source:
                            id: '3652397000000026008'
                          subordinates: true
                description: >-
                  Shows a request body for updating a user group with a new
                  name, description, and a single territory source with
                  sub-territories.
        required: true
        description: >-
          Provide the updated user group details including the name, optional
          description, and member sources.
      responses:
        '200':
          description: >-
            User group updated successfully. Returns the group ID and a success
            status.
          content:
            application/json:
              schema:
                x-zs-$id: UserGroupUpdateResponse
