  /settings/user_groups/{group}/actions/associations:
    get:
      security:
        - OAuth2:
            - ZohoCRM.settings.user_groups.READ
      summary: Get associations for a user group
      description: >-
        To retrieve the list of CRM resources, such as sharing rules, workflows,
        assignment rules, and approval processes, that are associated with a
        specific user group in your Zoho CRM organization.
      operationId: getUserGroupAssociations
      parameters:
        - $ref: '#/components/parameters/Group'
      responses:
        '200':
          description: >-
            Returns the list of CRM resources, such as sharing rules, workflows,
            and assignment rules, that are associated with the specified user
            group.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                description: >-
                  Response schema containing the list of CRM resources
                  associated with the specified user group.
                properties:
                  associations:
                    type: array
                    maxItems: 200
                    description: >-
                      Represents the array of CRM resources associated with the
                      specified user group. 
                    items:
                      type: object
                      additionalProperties: false
                      description: >-
                        Represents one CRM resource association for the user
                        group, including the resource identifier, association
                        type, and module details.
                      properties:
                        resource:
                          type: object
                          additionalProperties: false
                          description: >-
                            Represents the CRM resource that is associated with
                            the user group. 
                          properties:
                            name:
                              type: string
                              description: 'Represents the name of the associated resource. '
                              maxLength: 255
                            id:
                              type: string
                              description: >-
                                Represents the unique ID of the associated
                                resource (such as a sharing rule or workflow). 
                              maxLength: 255
                          required:
                            - id
                            - name
                        details:
                          type:
                            - object
                            - 'null'
                          additionalProperties: false
                          description: >-
                            Represents the CRM module details for this
                            association. 
                          properties:
                            module:
                              type: object
                              additionalProperties: false
                              description: >-
                                Represents the CRM module in which the
                                associated resource is defined. 
                              properties:
                                api_name:
                                  type: string
                                  description: >-
                                    Represents the API name of the module
                                    containing the associated resource. 
                                  maxLength: 255
                                id:
