openapi: 3.1.0
info:
  title: Currencies
  description: >-
    These APIs in CRM are used to manage currency settings, including adding new
    currencies, updating existing ones, retrieving currency details, and
    removing currencies when they are no longer needed.
  version: '8'
servers:
  - url: https://zohoapis.{dc}/crm/{version}
    description: API Server
    variables:
      dc:
        description: API Server URL TLD
        default: com
        enum:
          - eu
          - com
          - au
          - in
          - jp
          - cn
          - ca
      version:
        description: API Version
        default: v8
paths:
  /org/currencies:
    get:
      summary: List currencies
      description: Retrieves all added currencies in the organization.
      operationId: getCurrencies
      responses:
        '200':
          description: Successfully retrieved currency data.
          content:
            application/json:
              schema:
                x-zs-$id: GetCurrenciesResponse
                type: object
                description: Response object containing a list of currencies.
                properties:
                  currencies:
                    type: array
                    description: >-
                      JSON array indicating the list of currencies configured
                      for the organization.
                    maxItems: 180
                    items:
                      type: object
                      description: >-
                        Represents a currency object that includes metadata and
                        formatting configuration such as symbol, decimal
                        precision, and display rules.
                      additionalProperties: false
                      properties:
                        prefix_symbol:
                          type: boolean
                          description: >-
                            Represents the position of the currency symbol.

                            **Possible Values:**

                            **true** - Display the currency symbol before the
                            currency value. This is the default value.

                            **false** - Display the currency symbol after the
                            currency value.
                        format:
                          type: object
                          description: >-
                            Currency formatting rules including numeral style,
                            decimals and separators.
                          additionalProperties: false
                          required:
                            - numeral_system
                            - decimal_places
                            - decimal_separator
                            - thousand_separator
                          properties:
                            numeral_system:
                              type: string
                              enum:
                                - Indian
                                - International
                              default: International
                              description: >-
                                Number formatting style: Indian (1,00,000) vs
                                International (100,000).
                            decimal_places:
                              type: string
                              enum:
                                - '0'
                                - '2'
                                - '3'
                                - '4'
                                - '5'
                                - '6'
                              description: >-
                                Represents the number of decimal places allowed
                                for the currency. It can be **0, 2, and 3.**
                            decimal_separator:
                              type: string
                              enum:
                                - Comma
                                - Period
                              description: >-
                                The decimal separator separates the integer part
                                of the currency from its fractional part. It can
                                be a **Period or Comma,** depending on the
                                currency.
                            thousand_separator:
                              type: string
                              enum:
                                - Comma
                                - Period
                                - Space
                              description: >-
                                The thousand separator separates groups of
                                thousands in a currency. It can be a **Period,
                                Comma, or Space**, depending on the currency.
                        exchange_rate:
                          type: string
                          pattern: ^[0-9]{1,9}(\.[0-9]{1,9})?$
                          maxLength: 18
                          description: >-
                            Exchange rate relative to the base currency
                            (supports up to 9 digits and 9 decimal places).
                        is_active:
                          type: boolean
                          description: >-
                            Represents the status of the currency.

                            **Possible Values:**

                            **true** - The currency is active. This is the
                            default value.

                            **false** - The currency is inactive.
                        exchange_rate_auto_update:
                          type: boolean
                          description: >-
                            Indicates whether the currency has the automated
                            exchange rate option enabled or not.
                        iso_code:
                          type: string
                          maxLength: 3
                          description: >-
                            Represents the ISO code of the currency. You can get
                            the currency code from the CRM UI at **Setup >
                            General > Company Settings > Currencies.**
                        symbol:
                          type: string
                          maxLength: 50
                          description: Symbol used to represent the currency.
                        name:
                          type: string
                          maxLength: 255
                          description: 'Name of the currency. Example: Indian Rupee.'
                        is_base:
                          type: boolean
                          description: >-
                            Indicates whether this currency is the
                            organization's base currency.
                        id:
                          type: string
                          format: int64
                          maxLength: 255
                          description: Unique identifier of the currency.
                          x-zs-$id: CurrencyId
                        created_by:
                          type: object
                          description: Indicates the user who created the currency record.
                          additionalProperties: false
                          required:
                            - name
                            - id
                          properties:
                            name:
                              type: string
                              maxLength: 255
                              description: Name of the user who created the record.
                            id:
                              type: string
                              format: int64
                              maxLength: 255
                              description: The unique identifier of the record creator.
                        modified_by:
                          type: object
                          description: >-
                            Indicates the user who last updated the currency
                            record.
                          additionalProperties: false
                          required:
                            - name
                            - id
                          properties:
                            name:
                              type: string
                              maxLength: 255
                              description: Name of the user who modified the record.
                            id:
                              type: string
                              format: int64
                              maxLength: 255
                              description: >-
                                The unique identifier of the user who modified
                                the record. 
                        modified_time:
                          type: string
                          format: date-time
                          description: Timestamp when the currency was last modified.
                        created_time:
                          type: string
                          format: date-time
                          description: Timestamp when the currency was first created.
                        exchange_rate_updated_time:
                          type: string
                          format: date-time
                          description: Timestamp when the exchange rate was last modified.
                      required:
                        - prefix_symbol
                        - format
                        - exchange_rate
                        - is_active
                        - iso_code
                        - symbol
                        - name
                        - is_base
                        - id
                        - created_by
                        - modified_by
                        - modified_time
                        - created_time
                required:
                  - currencies
                additionalProperties: false
              examples:
                Sample:
                  summary: Sample list response
                  value:
                    currencies:
                      - prefix_symbol: true
                        format:
                          numeral_system: International
                          decimal_places: '2'
                          decimal_separator: Period
                          thousand_separator: Comma
                        exchange_rate: '1.000000000'
                        is_active: true
                        exchange_rate_auto_update: true
                        iso_code: USD
                        symbol: $
                        name: US Dollar - USD
                        is_base: true
                        id: '111113000000038990'
                        created_by:
                          name: Admin
                          id: '11111300000001'
                        modified_by:
                          name: Admin
                          id: '11111300000001'
                        modified_time: '2025-01-01T00:00:00Z'
                        created_time: '2025-01-01T00:00:00Z'
                        exchange_rate_updated_time: '2019-05-31T15:10:33+05:30'
                  description: Provides a sample 200 response for the sample scenario.
        '204':
          description: No content - occurs if no currencies are available.
        '403':
          description: >-
            Forbidden. Multi-currency feature is not enabled for the
            organization.
          content:
            application/json:
              schema:
                x-zs-$id: GetCurrenciesErrorResponse
                type: object
                description: Error response when multi-currency is not enabled.
                additionalProperties: false
                required:
                  - code
                  - details
                  - message
                  - status
                properties:
                  code:
                    type: string
                    description: Error code indicating the type of error.
                    enum:
                      - CURRENCIES_NOT_ENABLED
                    maxLength: 100
                  details:
                    type: object
                    description: Additional details about the error.
                    additionalProperties: false
                  message:
                    type: string
                    description: >-
                      Human-readable message indicating that the multi-currency
                      feature is not enabled for the organization.
                    maxLength: 255
                  status:
                    type: string
                    description: Response status indicator.
                    enum:
                      - error
                    maxLength: 20
              examples:
                CurrenciesNotEnabled:
                  summary: Multi-currency is not enabled
                  value:
                    code: CURRENCIES_NOT_ENABLED
                    details: {}
                    message: Multi currency is not enabled
                    status: error
      security:
        - OAuth2:
            - ZohoCRM.settings.currencies.READ
    post:
      summary: Create currencies
      description: Creates one or more new currencies for the organization.
      operationId: createCurrencies
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Request object containing a list of currencies to create.
              properties:
                currencies:
                  type: array
                  maxItems: 180
                  description: >-
                    List of currencies to add to the organization. Supports up
                    to 180 currencies per request.
                  items:
                    type: object
                    description: Currency definition object.
                    additionalProperties: false
                    properties:
                      format:
                        type: object
                        description: >-
                          Represents the format of the base currency with
                          details like decimal_separator, thousand_separator,
                          and decimal_places.
                        additionalProperties: false
                        properties:
                          numeral_system:
                            type: string
                            enum:
                              - Indian
                              - International
                            default: International
                            description: Numbering system used for grouping digits.
                          decimal_places:
                            type: string
                            enum:
                              - '0'
                              - '2'
                              - '3'
                              - '4'
                              - '5'
                              - '6'
                            description: >-

                              Represents the number of decimal places allowed
                              for the currency. It can be **0, 2, and 3.**
                          decimal_separator:
                            type: string
                            enum:
                              - Comma
                              - Period
                            description: >-
                              The decimal separator separates the integer part
                              of the currency from its fractional part. It can
                              be a **Period** or **Comma**, depending on the
                              currency.
                          thousand_separator:
                            type: string
                            enum:
                              - Comma
                              - Period
                              - Space
                            description: >-
                              The thousand separator separates groups of
                              thousands in a currency. It can be a **Period**,
                              **Comma**, or **Space**, depending on the
                              currency.
                      exchange_rate:
                        type: string
                        pattern: ^[0-9]{1,9}(\.[0-9]{1,9})?$
                        maxLength: 18
                        description: >-
                          Represents the rate at which the currency has to be
                          exchanged with home currency. Accepts positive decimal
                          numbers up to **nine** digits and nine decimal places.
                          Example: 123456789.123456789.
                      is_active:
                        type: boolean
                        description: >-
                          Indicates whether the currency is active.

                          **Possible Values:**

                          **true** - The currency is active. This is the default
                          value.

                          **false** - The currency is inactive.
                      exchange_rate_auto_update:
                        type: boolean
                        description: >-
                          Indicates whether the currency has the automated
                          exchange rate option enabled or not.
                      iso_code:
                        type: string
                        maxLength: 3
                        description: >-
                          Represents the ISO code of the currency. You can get
                          the currency code from the CRM UI at **Setup > General
                          > Company Settings > Currencies.**
                      symbol:
                        type: string
                        maxLength: 50
                        description: Indicates the currency symbol used for display.
                      name:
                        type: string
                        maxLength: 255
                        description: >-
                          Represents the name of the currency. You can get the
                          available currencies from the CRM UI at **Setup >
                          General > Company Settings > Currencies.**
                    required:
                      - exchange_rate
                      - iso_code
              required:
                - currencies
              additionalProperties: false
            examples:
              SampleCreate:
                summary: Create one currency
                value:
                  currencies:
                    - format:
                        decimal_separator: Period
                        thousand_separator: Comma
                        decimal_places: '2'
                        numeral_system: International
                      is_active: true
                      iso_code: SAR
                      symbol: SR
                      name: Saudi Riyal - SAR
                      exchange_rate: '1.000000000'
                      exchange_rate_auto_update: true
                description: >-
                  Provides a sample request payload for the sample create
                  scenario.
        description: Specifies the request payload structure for this operation.
      responses:
        '200':
          description: Currencies successfully created.
          content:
            application/json:
              schema:
                x-zs-$id: CreateCurrenciesResponse
                type: object
                description: Successful creation response wrapper.
                additionalProperties: false
                properties:
                  currencies:
                    type: array
                    description: >-
                      List of results for each currency creation attempt.
                      Returns one entry per submitted currency.
                    maxItems: 180
                    items:
                      description: successfully created currency responses
                      type: object
                      additionalProperties: false
                      properties:
                        code:
                          type: string
                          enum:
                            - SUCCESS
                          description: The code representing success
                        message:
                          type: string
                          maxLength: 255
                          description: Success message for the operation result.
                        details:
                          type: object
                          description: Contains currency identifier.
                          additionalProperties: false
                          properties:
                            id:
                              type: string
                              format: int64
                              maxLength: 50
                              description: The unique identifier for currency.
                          required:
                            - id
                        status:
                          type: string
                          enum:
                            - success
                          description: Indicates the status of the operation.
                      required:
                        - code
                        - message
                        - details
                        - status
                required:
                  - currencies
              examples:
                CreateSuccess:
                  summary: Successful create response
                  value:
                    currencies:
                      - code: SUCCESS
                        details:
                          id: '111111000000129264'
                        message: The currency created successfully.
                        status: success
                  description: >-
                    Provides a sample 200 response for the create success
                    scenario.
        '207':
          description: >-
            Multi-status. Returned when bulk currency creation has a mix of
            successes and failures. Each entry in the response array carries its
            own code and status.
          content:
            application/json:
              schema:
                x-zs-$id: CreateCurrenciesMultiStatusResponse
                type: object
                description: >-
                  Bulk create response containing mixed success and error
                  results.
                additionalProperties: false
                required:
                  - currencies
                properties:
                  currencies:
                    type: array
                    maxItems: 180
                    description: >-
                      List of per-item results; each entry reflects one
                      submitted currency.
                    items:
                      oneOf:
                        - x-zs-$id: CreateCurrenciesItemSuccessResponse
                          type: object
                          description: Successful currency creation result.
                          additionalProperties: false
                          required:
                            - code
                            - message
                            - details
                            - status
                          properties:
                            code:
                              type: string
                              enum:
                                - SUCCESS
                              description: SUCCESS code for this item.
                            message:
                              type: string
                              maxLength: 255
                              description: Result message for this item.
                            details:
                              type: object
                              description: Contains the created currency identifier.
                              additionalProperties: false
                              properties:
                                id:
                                  type: string
                                  format: int64
                                  maxLength: 50
                                  description: >-
                                    Unique identifier of the newly created
                                    currency.
                              required:
                                - id
                            status:
                              type: string
                              enum:
                                - success
                              description: Outcome of this item.
                        - x-zs-$id: CreateCurrenciesItemErrorResponse
                          type: object
                          description: Failed currency creation result.
                          additionalProperties: false
                          required:
                            - code
                            - message
                            - details
                            - status
                          properties:
                            code:
                              type: string
                              maxLength: 100
                              description: Error code for this item.
                            message:
                              type: string
                              maxLength: 255
                              description: Result message for this item.
                            details:
                              type: object
                              description: Additional details for this error item.
                              additionalProperties: false
                              properties:
                                api_name:
                                  type: string
                                  description: Field or API parameter related to the error.
                                  maxLength: 255
                                json_path:
                                  type: string
                                  description: JSON path pointing to the error field.
                                  maxLength: 255
                                expected_data_type:
                                  type: string
                                  description: Expected data type for the invalid field.
                                  maxLength: 50
                                limit:
                                  type: number
                                  description: Maximum allowed count relevant to the error.
                            status:
                              type: string
                              enum:
                                - error
                              description: Outcome of this item.
                    allOf:
                      - description: >-
                          Constraint requiring at least one success item in the
                          result array.
                        contains:
                          description: Constraint requiring at least one success result.
                          properties:
                            status:
                              type: string
                              description: Status field of the currency result item.
                              enum:
                                - success
                        minContains: 1
                      - description: >-
                          Constraint requiring at least one error item in the
                          result array.
                        contains:
                          description: Constraint requiring at least one error result.
                          properties:
                            status:
                              type: string
                              description: Status field of the currency result item.
                              enum:
                                - error
                        minContains: 1
              examples:
                MultiStatusExample:
                  summary: Mixed create results
                  value:
                    currencies:
                      - code: SUCCESS
                        details:
                          id: '111111000000129264'
                        message: The currency created successfully.
                        status: success
                      - code: INVALID_DATA
                        details:
                          api_name: iso_code
                          json_path: $.currencies[1].iso_code
                        message: Currency isocode given seems to be invalid
                        status: error
                  description: >-
                    Provides a sample 207 response for the multi-status
                    scenario.
        '400':
          description: Bad request. The input data is invalid or missing required values.
          content:
            application/json:
              schema:
                x-zs-$id: CreateCurrenciesErrorResponses
                description: Possible error responses for currency creation operation.
                oneOf:
                  - x-zs-$id: CreateCurrenciesErrorResponse
                    type: object
                    description: Single permission-level error response.
                    additionalProperties: false
                    required:
                      - code
                      - message
                      - status
                      - details
                    properties:
                      code:
                        type: string
                        description: >-
                          Indicates the error code which implies the type of
                          error.
                        enum:
                          - NO_PERMISSION
                        maxLength: 100
                      message:
                        type: string
                        description: Error message describing the failure.
                        maxLength: 255
                      details:
                        type: object
                        description: Additional information related to permission error.
                        additionalProperties: false
                        properties:
                          permissions:
                            type: array
                            maxItems: 100
                            items:
                              type: string
                              description: Indicates required permission details
                              maxLength: 255
                            description: List of required permissions that were missing.
                      status:
                        type: string
                        description: |-
                          Represents the status of the response.
                          **Possible values:**
                          **error**
                        enum:
                          - error
                        maxLength: 20
                  - x-zs-$id: WrappedCreateCurrenciesErrorResponse
                    type: object
                    description: >-
                      Represents the currency validation errors for bulk
                      operations
                    additionalProperties: false
                    required:
                      - currencies
                    properties:
                      currencies:
                        type: array
                        description: >-
                          An array of currency errors returned when bulk
                          operations fail, including details of each failure.
                        maxItems: 100
                        items:
                          type: object
                          description: >-
                            The response returns validation error details for a
                            single currency record when the request fails
                            validation.
                          additionalProperties: false
                          required:
                            - code
                            - message
                            - status
                            - details
                          properties:
                            code:
                              type: string
                              description: >-
                                An error code representing the category or type
                                of error returned.
                              maxLength: 100
                            message:
                              type: string
                              description: Error message describing the failure.
                              maxLength: 255
                            details:
                              type: object
                              description: >-
                                Additional information related to validation
                                error.
                              additionalProperties: true
                              properties:
                                api_name:
                                  type: string
                                  maxLength: 255
                                  description: >-
                                    Indicates the name of the parameter causing
                                    validation error.
                                json_path:
                                  type: string
                                  maxLength: 255
                                  description: >-
                                    A JSON pointer specifying the exact path to
                                    the property that failed validation.
                                expected_data_type:
                                  type: string
                                  maxLength: 50
                                  description: >-
                                    Required datatype for the field when
                                    applicable.
                                limit:
                                  type: number
                                  description: >-
                                    Specifies the maximum allowed count of
                                    active currencies.
                            status:
                              type: string
                              enum:
                                - error
                              description: Indicate the status of the response.
                              maxLength: 20
              examples:
                NoPermission:
                  summary: User lacks required permissions
                  value:
                    code: NO_PERMISSION
                    details:
                      permissions:
                        - Crm_Implied_Manage_Currencies
                    message: permission denied
                    status: error
                  description: >-
                    Provides a sample 400 error response for the no permission
                    scenario.
                ActiveCurrencyLimitExceeded:
                  summary: Maximum allowed active currencies reached
                  value:
                    currencies:
                      - code: ACTIVE_STATE_LIMIT_EXCEEDED
                        details:
                          limit: 5
                        message: >-
                          Allowed active currency limit reached. Please
                          deactivate any one of the existing active currencies
                          to create this currency.
                        status: error
                  description: >-
                    Provides a sample 400 error response for the active currency
                    limit exceeded scenario.
                FeatureNotEnabled:
                  summary: Multi-currency not enabled
                  value:
                    currencies:
                      - code: FEATURE_NOT_ENABLED
                        details: {}
                        message: >-
                          The multi-currency feature is not yet enabled. Please
                          enable it before doing this action.
                        status: error
                  description: >-
                    Provides a sample 400 error response for the feature not
                    enabled scenario.
                InvalidISO:
                  summary: Invalid ISO code
                  value:
                    currencies:
                      - code: INVALID_DATA
                        details:
                          api_name: iso_code
                          json_path: $.currencies[0].iso_code
                        message: Currency isocode given seems to be invalid
                        status: error
                  description: >-
                    Provides a sample 400 error response for the invalid iso
                    scenario.
                DuplicateISO:
                  summary: ISO code already exists
                  value:
                    currencies:
                      - code: DUPLICATE_DATA
                        details:
                          api_name: iso_code
                          json_path: $.currencies[0].iso_code
                        message: Duplicate value given for Isocode parameter
                        status: error
                  description: >-
                    Provides a sample 400 error response for the duplicate iso
                    scenario.
                InvalidISODataType:
                  summary: ISO datatype incorrect
                  value:
                    currencies:
                      - code: INVALID_DATA
                        details:
                          expected_data_type: string
                          api_name: iso_code
                          json_path: $.currencies[0].iso_code
                        message: Currency isocode given seems to be invalid
                        status: error
                  description: >-
                    Provides a sample 400 error response for the invalid isodata
                    type scenario.
                InvalidSymbol:
                  summary: Invalid currency symbol
                  value:
                    currencies:
                      - code: INVALID_DATA
                        details:
                          api_name: symbol
                          json_path: $.currencies[0].symbol
                        message: Currency symbol given seems to be invalid
                        status: error
                  description: >-
                    Provides a sample 400 error response for the invalid symbol
                    scenario.
                SymbolAlreadyUsed:
                  summary: Symbol already assigned
                  value:
                    currencies:
                      - code: INVALID_DATA
                        details:
                          api_name: symbol
                          json_path: $.currencies[0].symbol
                        message: Currency symbol is already used
                        status: error
                  description: >-
                    Provides a sample 400 error response for the symbol already
                    used scenario.
                InvalidName:
                  summary: Invalid currency name
                  value:
                    currencies:
                      - code: INVALID_DATA
                        details:
                          api_name: name
                          json_path: $.currencies[0].name
                        message: Currency name given seems to be invalid
                        status: error
                  description: >-
                    Provides a sample 400 error response for the invalid name
                    scenario.
                InvalidThousandSeparator:
                  summary: Wrong thousand separator
                  value:
                    currencies:
                      - code: INVALID_DATA
                        details:
                          api_name: thousand_separator
                          json_path: $.currencies[0].format.thousand_separator
                        message: Thousand separator given seems to be invalid
                        status: error
                  description: >-
                    Provides a sample 400 error response for the invalid
                    thousand separator scenario.
                InvalidDecimalSeparator:
                  summary: Wrong decimal separator
                  value:
                    currencies:
                      - code: INVALID_DATA
                        details:
                          api_name: decimal_separator
                          json_path: $.currencies[0].format.decimal_separator
                        message: Decimal separator given seems to be invalid
                        status: error
                  description: >-
                    Provides a sample 400 error response for the invalid decimal
                    separator scenario.
                InvalidDecimalPlaces:
                  summary: Wrong decimal places
                  value:
                    currencies:
                      - code: INVALID_DATA
                        details:
                          api_name: decimal_places
                          json_path: $.currencies[0].format.decimal_places
                        message: Decimal places given seems to be invalid
                        status: error
                  description: >-
                    Provides a sample 400 error response for the invalid decimal
                    places scenario.
                InvalidNumeralSystem:
                  summary: Invalid numeral system
                  value:
                    currencies:
                      - code: INVALID_DATA
                        details:
                          api_name: numeral_system
                          json_path: $.currencies[0].format.numeral_system
                        message: Numeral system given seems to be invalid
                        status: error
                  description: >-
                    Provides a sample 400 error response for the invalid numeral
                    system scenario.
                NotAllowedSameSeparators:
                  summary: Thousand and decimal separator conflict
                  value:
                    currencies:
                      - code: NOT_ALLOWED
                        details:
                          api_name: decimal_places
