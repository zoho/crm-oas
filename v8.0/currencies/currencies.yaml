    put:
      summary: Update currencies
      description: Updates one or more currencies other than the base currency.
      operationId: updateCurrencies
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Request body to update currency values in the organization.
              properties:
                currencies:
                  type: array
                  description: List of currencies to be updated.
                  maxItems: 100
                  items:
                    type: object
                    description: Currency update request object.
                    additionalProperties: false
                    properties:
                      id:
                        description: >-
                          Unique ID of the currency to update. Obtainable from
                          GET /org/currencies.
                        x-zs-$ref:
                          resource: currencies
                          origins:
                            - operationId: getCurrencies
                              propertyId: CurrencyId
                            - operationId: getCurrencyById
                              propertyId: CurrencyByIdId
                        type: string
                        format: int64
                        maxLength: 255
                      format:
                        type: object
                        description: Currency formatting properties.
                        additionalProperties: false
                        properties:
                          numeral_system:
                            type: string
                            enum:
                              - Indian
                              - International
                            default: International
                            description: >-
                              Specifies whether the currency uses the Indian
                              numbering format (1,00,000) or International
                              format (100,000).
                          decimal_places:
                            type: string
                            enum:
                              - '0'
                              - '2'
                              - '3'
                              - '4'
                              - '5'
                              - '6'
                            description: >-
                              Represents the number of decimal places allowed
                              for the currency. It can be **0, 2, and 3.**
                          decimal_separator:
                            type: string
                            enum:
                              - Comma
                              - Period
                            description: >-
                              The decimal separator separates the integer part
                              of the currency from its fractional part. It can
                              be a **Period or Comma,** depending on the
                              currency.
                          thousand_separator:
                            type: string
                            maxLength: 255
                            enum:
                              - Comma
                              - Period
                              - Space
                            description: >-
                              The thousand separator separates groups of
                              thousands in a currency. It can be a **Period**,
                              **Comma**, or **Space**, depending on the
                              currency.
                      exchange_rate:
                        type: string
                        pattern: ^[0-9]{1,9}(\.[0-9]{1,9})?$
                        maxLength: 18
                        description: >-
                          Represents the rate at which the currency has to be
                          exchanged with home currency. Accepts positive decimal
                          numbers up to **nine** digits and nine decimal places.
                          Example: 123456789.123456789.
                      is_active:
                        type: boolean
                        description: >-
                          Indicates whether the currency is active in the
                          organization.
                      exchange_rate_auto_update:
                        type: boolean
                        description: >-
                          Indicates whether the currency has the automated
                          exchange rate option enabled or not.
                      iso_code:
                        type: string
                        maxLength: 3
                        description: >-
                          ISO code of the currency. NOTE: During update, ISO
                          code cannot be modified.
                      symbol:
                        type: string
                        maxLength: 50
                        description: Symbol used to display the currency
                      name:
                        type: string
                        maxLength: 255
                        description: >-
                          Name of the currency. NOTE: During update, currency
                          name cannot be modified.
                    required:
                      - id
              required:
                - currencies
              additionalProperties: false
            examples:
              UpdateSample:
                summary: Update one currency
                value:
                  currencies:
                    - id: '3652397000007472080'
                      symbol: $
                      is_active: false
                      exchange_rate: '85.000000000'
                      exchange_rate_auto_update: true
                description: >-
                  Provides a sample request payload for the update sample
                  scenario.
        description: Specifies the request payload structure for this operation.
      responses:
        '200':
          description: Successfully updated the currency properties.
          content:
            application/json:
              schema:
                x-zs-$id: UpdateCurrenciesResponse
                type: object
                description: Response returned for a successful update operation.
