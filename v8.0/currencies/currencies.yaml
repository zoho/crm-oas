    put:
      summary: Currency
      description: Update a specific currency by its unique ID.
      operationId: updateCurrencyById
      parameters:
        - $ref: '#/components/parameters/Currency'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Payload for updating a specific currency by ID.
              properties:
                currencies:
                  type: array
                  description: >-
                    List of currencies to update (single-element array
                    expected).
                  maxItems: 100
                  items:
                    type: object
                    description: Currency object containing update fields.
                    additionalProperties: false
                    properties:
                      format:
                        type: object
                        description: Configuration for currency formatting rules.
                        additionalProperties: false
                        properties:
                          numeral_system:
                            type: string
                            enum:
                              - Indian
                              - International
                            default: International
                            description: >-
                              Defines the numbering system used for digit
                              grouping.
                          decimal_places:
                            type: string
                            enum:
                              - '0'
                              - '2'
                              - '3'
                              - '4'
                              - '5'
                              - '6'
                            description: >-

                              Represents the number of decimal places allowed
                              for the currency. It can be **0, 2, and 3.**
                          decimal_separator:
                            type: string
                            enum:
                              - Comma
                              - Period
                            description: >-
                              The decimal separator separates the integer part
                              of the currency from its fractional part. It can
                              be a **Period or Comma,** depending on the
                              currency.
                          thousand_separator:
                            type: string
                            enum:
                              - Comma
                              - Period
                              - Space
                            description: >-
                              The thousand separator separates groups of
                              thousands in a currency. It can be a **Period**,
                              **Comma**, or **Space**, depending on the
                              currency.
                      exchange_rate:
                        type: string
                        pattern: ^[0-9]{1,9}(\.[0-9]{1,9})?$
                        maxLength: 18
                        description: >-
                          Represents the rate at which the currency has to be
                          exchanged with home currency. Accepts positive decimal
                          numbers up to **nine** digits and nine decimal places.
                          Example: 123456789.123456789.
                      is_active:
                        type: boolean
                        description: >-
                          Indicates whether the currency is active and available
                          for use.
                      exchange_rate_auto_update:
                        type: boolean
                        description: >-
                          Indicates whether the currency has the automated
                          exchange rate option enabled or not.
              required:
                - currencies
              additionalProperties: false
            examples:
              PutByIdSample:
                summary: Update currency example
                value:
                  currencies:
                    - exchange_rate: '85.000000000'
                      exchange_rate_auto_update: true
                      is_active: false
                description: >-
                  Provides a sample request payload for the put by ID sample
                  scenario.
        description: Specifies the request payload structure for this operation.
      responses:
        '200':
          description: Successfully updated the specified currency record(s).
          content:
            application/json:
              schema:
                x-zs-$id: UpdateCurrencyResponse
                type: object
                description: Response object containing updated currency data.
                additionalProperties: false
                required:
                  - currencies
                properties:
                  currencies:
                    type: array
                    description: List of updated currency responses.
                    maxItems: 100
                    items:
                      type: object
                      description: >-
