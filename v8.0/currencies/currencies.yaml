  /org/currencies/actions/enable:
    post:
      summary: Enable multi-currency
      description: Enable multi-currency for the organization and set the base currency.
      operationId: enableCurrency
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Payload for creating and enabling base currency.
              properties:
                base_currency:
                  type: object
                  description: >-
                    Represents the base currency information required for
                    initializing multi-currency settings in the CRM.
                  properties:
                    prefix_symbol:
                      type: boolean
                      description: >-
                        Represents the position of the currency symbol.

                        **Possible Values:**

                        **true** - Display the currency symbol before the
                        currency value. This is the default value.

                        **false** - Display the currency symbol after the
                        currency value.
                    iso_code:
                      type: string
                      maxLength: 3
                      description: >-
                        Represents the ISO code of the currency. You can get the
                        currency code from the CRM UI at **Setup > General >
                        Company Settings > Currencies.**
                    symbol:
                      type: string
                      maxLength: 50
                      description: Represents the symbol of the currency.
                    exchange_rate:
                      type: string
                      pattern: ^[0-9]{1,9}(\.[0-9]{1,9})?$
                      maxLength: 50
                      description: >-
                        Represents the rate at which the currency has to be
                        exchanged with home currency. Accepts positive decimal
                        numbers up to **nine** digits and nine decimal places.
                        Example: 123456789.123456789.
                    format:
                      type: object
                      description: >-
                        Represents the format of the base currency with details
                        like decimal_separator, thousand_separator, and
                        decimal_places.
                      properties:
                        numeral_system:
                          type: string
                          enum:
                            - Indian
                            - International
                          default: International
                          description: >-
                            Indicates whether the currency should use the Indian
                            or International numbering format.
                        decimal_places:
                          type: string
                          enum:
                            - '0'
                            - '2'
                            - '3'
                            - '4'
                            - '5'
                            - '6'
                          description: >-
                            Represents the number of decimal places allowed for
                            the currency. It can be **0, 2, and 3.**
                        decimal_separator:
                          type: string
                          enum:
                            - Comma
                            - Period
                          description: >-
                            The decimal separator separates the integer part of
                            the currency from its fractional part. It can be a
                            Period or Comma, depending on the currency.
                        thousand_separator:
                          type: string
                          enum:
                            - Comma
                            - Period
                            - Space
                          description: >-
                            The thousand separator separates groups of thousands
                            in a currency. It can be a Period, Comma, or Space,
                            depending on the currency.
                      additionalProperties: false
                    name:
                      type: string
                      maxLength: 255
                      description: >-
                        Full name of the currency (for example, US Dollar -
                        USD).
                  required:
                    - iso_code
                    - exchange_rate
                  additionalProperties: false
              required:
                - base_currency
              additionalProperties: false
            examples:
              EnableSample:
                summary: Enable multi-currency sample
                value:
                  base_currency:
                    format:
                      decimal_separator: Period
                      thousand_separator: Comma
                      decimal_places: '2'
                      numeral_system: International
                    name: Algerian Dinar - DZD
                    iso_code: DZD
                    symbol: DA
                    exchange_rate: '1.000000000'
                description: >-
                  Provides a sample request payload for the enable sample
                  scenario.
        description: Specifies the request payload structure for this operation.
      responses:
