            - ZohoCRM.settings.currencies.CREATE
    put:
      summary: Update base currency
      description: Update existing base currency details.
      operationId: updateBaseCurrency
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Payload for modifying existing base currency.
              properties:
                base_currency:
                  type: object
                  description: JSON object containing the updated base currency values.
                  properties:
                    iso_code:
                      type: string
                      maxLength: 3
                      description: >-
                        Represents the ISO code of the currency. You can get the
                        currency code from the CRM UI at **Setup > General >
                        Company Settings > Currencies.**
                    symbol:
                      type: string
                      maxLength: 50
                      description: Represents the symbol of the currency.
                    exchange_rate:
                      type: string
                      pattern: ^[0-9]{1,9}(\.[0-9]{1,9})?$
                      maxLength: 50
                      description: >-
                        Represents the rate at which the currency has to be
                        exchanged with home currency. Accepts positive decimal
                        numbers up to nine digits and nine decimal places.
                        Example: 123456789.123456789.
                    format:
                      type: object
                      description: >-
                        Represents the format of the base currency with details
                        like decimal_separator, thousand_separator, and
                        decimal_places.
                      properties:
                        numeral_system:
                          type: string
                          enum:
                            - Indian
                            - International
                          default: International
                          description: Numbering system used for grouping digits.
                        decimal_places:
                          type: string
                          enum:
                            - '0'
                            - '2'
                            - '3'
                            - '4'
                            - '5'
                            - '6'
                          description: >-
                            Represents the number of decimal places allowed for
                            the currency. It can be **0, 2, and 3**.
                        decimal_separator:
                          type: string
                          enum:
                            - Comma
                            - Period
                          description: >-
                            The decimal separator separates the integer part of
                            the currency from its fractional part. It can be a
                            **Period or Comma,** depending on the currency.
                        thousand_separator:
                          type: string
                          maxLength: 255
                          enum:
                            - Comma
                            - Period
                            - Space
                          description: >-
                            The thousand separator separates groups of thousands
                            in a currency. It can be a **Period**, **Comma**, or
                            **Space**, depending on the currency.
                      additionalProperties: false
                    name:
                      type: string
                      maxLength: 255
                      description: >-
                        Represents the name of the currency. You can get the
                        available currencies from the CRM UI at **Setup >
                        General > Company Settings > Currencies.**
                    id:
                      description: The unique identifier of the currency.
                      x-zs-$ref:
                        resource: currencies
                        origins:
                          - operationId: getCurrencies
                            propertyId: CurrencyId
                          - operationId: getCurrencyById
                            propertyId: CurrencyByIdId
                      type: string
                      format: int64
                      maxLength: 255
                  required:
                    - id
                  additionalProperties: false
              required:
                - base_currency
              additionalProperties: false
            examples:
              UpdateBaseSample:
                summary: Update base currency sample
                value:
                  base_currency:
                    id: '111113000000038990'
                    iso_code: USD
                    symbol: $
                    exchange_rate: '1.000000000'
                    format:
                      numeral_system: International
                      decimal_places: '2'
                      decimal_separator: Period
                      thousand_separator: Comma
                    name: US Dollar - USD
                description: >-
                  Provides a sample request payload for the update base sample
                  scenario.
        description: Specifies the request payload structure for this operation.
      responses:
        '200':
          description: Currency updated successfully.
          content:
            application/json:
              schema:
                x-zs-$id: UpdateBaseCurrencyResponse
                type: object
                description: Successful update response
                properties:
                  base_currency:
                    type: object
                    description: Result of base currency update
                    properties:
                      code:
                        type: string
                        maxLength: 50
                        description: Indicating the code of the result.
                      message:
                        type: string
                        maxLength: 255
                        description: Message describing the operation result.
                      status:
                        type: string
                        maxLength: 50
                        description: Represents the status of the operation.
                      details:
                        type: object
                        properties:
                          id:
                            type: string
                            format: int64
                            maxLength: 255
                            description: >-
                              The unique identifier of the base currency
                              created.
                        additionalProperties: false
                        description: Additional details of the response.
                    required:
                      - code
                      - message
                      - status
                      - details
                    additionalProperties: false
                required:
                  - base_currency
                additionalProperties: false
              examples:
                UpdateBaseSuccess:
                  summary: Update base success
                  value:
                    base_currency:
                      code: SUCCESS
                      message: The currency updated successfully.
                      status: success
                      details:
                        id: '111111000000129290'
                  description: >-
                    Provides a sample 200 response for the update base success
                    scenario.
        '400':
          description: Invalid request or validation errors.
          content:
            application/json:
              schema:
                x-zs-$id: UpdateBaseCurrencyErrorResponses
                description: Possible error responses for update base currency operation.
                oneOf:
                  - x-zs-$id: UpdateBaseCurrencyNoPermissionError
                    type: object
                    description: Permission error response for updateBaseCurrency.
                    additionalProperties: false
                    required:
                      - code
                      - message
                      - status
                      - details
                    properties:
                      code:
                        type: string
                        enum:
                          - NO_PERMISSION
                        description: Error code indicating no permission.
                        maxLength: 100
                      message:
                        type: string
                        description: Descriptive error message.
                        maxLength: 255
                      status:
                        type: string
                        enum:
                          - error
                        description: Indicates error status.
                        maxLength: 20
                      details:
                        type: object
                        description: Permission error details.
                        additionalProperties: false
                        properties:
                          permissions:
                            type: array
                            description: List of missing permissions.
                            items:
                              description: Needed permission details
                              type: string
                              maxLength: 100
                            maxItems: 100
                  - x-zs-$id: UpdateBaseCurrencyBaseCurrencyValidationError
                    type: object
                    description: >-
                      Base-currency validation error response for
                      updateBaseCurrency.
                    additionalProperties: false
                    required:
                      - base_currency
                    properties:
                      base_currency:
                        type: object
                        description: >-
                          base_currency-level error object for currency-specific
                          validation errors.
                        additionalProperties: false
                        required:
                          - code
                          - message
                          - status
                          - details
                        properties:
                          code:
                            type: string
                            enum:
                              - ALREADY_ENABLED
                              - AMBIGUITY_DURING_PROCESSING
                              - INVALID_DATA
                              - MANDATORY_NOT_FOUND
                              - NOT_ALLOWED
                            description: Error code for base_currency validation.
                            maxLength: 100
                          message:
                            type: string
                            description: >-
                              Error message for the base currency validation
                              result.
                            maxLength: 255
                          status:
                            type: string
                            enum:
                              - error
                            description: Status for the base_currency error.
                            maxLength: 20
                          details:
                            type: object
                            description: >-
                              Specifies the additional details for base_currency
                              error (field name, JSON path, or ambiguity
                              details).
                            additionalProperties: false
                            properties:
                              api_name:
                                type: string
                                description: Field or API parameter related to the error.
                                maxLength: 255
                              json_path:
                                type: string
                                description: >-
                                  A JSON pointer specifying the exact path to
                                  the property that failed validation.
                                maxLength: 255
                              ambiguity_due_to:
                                type: array
                                description: >-
                                  List of conflicting identifiers when both id
                                  and rid are provided but refer to different
                                  currencies.
                                maxItems: 100
                                items:
                                  type: object
                                  description: >-
                                    A conflicting identifier pair showing which
                                    fields caused the ambiguity.
                                  additionalProperties: false
                                  properties:
                                    api_name:
                                      type: string
                                      description: The conflicting field name.
                                      maxLength: 255
                                    json_path:
                                      type: string
                                      description: JSON path to the conflicting field.
                                      maxLength: 255
