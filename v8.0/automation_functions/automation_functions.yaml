components:
  schemas:
    MandatoryFieldMissingErrorResponse:
      type: object
      additionalProperties: false
      description: >-
        Represents the error response returned when one or more required fields
        are missing from the request.
      x-zs-llm-description: >-
        A required field is missing from the request body. Check details for the
        missing field name.
      properties:
        code:
          type: string
          description: >-
            Represents the error code identifying the type of error. Possible
            values: **MANDATORY_NOT_FOUND** - Indicates that one or more
            required fields are missing from the request.
          enum:
            - MANDATORY_NOT_FOUND
        details:
          type: object
          additionalProperties: false
          description: >-
            Represents the error details containing validation information about
            the missing field, including its API name and JSON path.
          properties:
            api_name:
              type: string
              description: The API name of the field that caused the error.
              maxLength: 255
            json_path:
              type: string
              description: The JSON path to the field that caused the error.
              maxLength: 1000
          required:
            - api_name
            - json_path
        message:
          type: string
          description: >
            The error message describing which required field is missing.
            Possible values: 

            * **Required field is missing** - A required field is absent from
            the request. 

            * **Please specify name** - The name field is required but was not
            provided. 

            * **please specify tabId and module api name** - The tab ID and
            module API name are required but were not provided. 

            * **please specify language** - The language field is required but
            was not provided. 

            * **please specify function** - The function field is required but
            was not provided.
          enum:
            - Required field is missing
            - Please specify name
            - please specify tabId and module api name
            - please specify language
            - please specify function
        status:
          type: string
          description: >-
            The status of the API response, indicating the request resulted in
            an error. Possible values: **error** - The request failed due to a
            missing required field.
          enum:
            - error
      required:
        - code
        - details
        - message
        - status
      title: Mandatory Field Missing Error Response
      x-zs-$id: MandatoryFieldMissingErrorResponse
    AutomationFunctionBulkRemovalResponse:
      type: object
      additionalProperties: false
      description: >-
        The response returned after removing one or more automation functions in
        bulk, containing per-item results for each function in the request.
      x-zs-llm-description: Per-item results after bulk removal. Check each item's status/code.
      properties:
        functions:
          type: array
          description: >-
            The list of individual removal results, one entry per automation
            function included in the bulk request.
          items:
            description: >-
              The removal result for a single automation function, indicating
              whether the function was successfully removed.
            oneOf:
              - $ref: '#/components/schemas/AutomationFunctionActionResult'
              - $ref: '#/components/schemas/AutomationFunctionDeleteInvalidDataError'
            x-zs-$id: AutomationFunctionBulkRemovalItem
          minItems: 2
          maxItems: 200
          allOf:
            - description: Ensures at least one success result is present in the response.
              contains:
                $ref: '#/components/schemas/AutomationFunctionActionResult'
              minContains: 1
            - description: >-
                Ensures at least one invalid data error result is present in the
                response.
              contains:
                $ref: '#/components/schemas/AutomationFunctionDeleteInvalidDataError'
              minContains: 1
      required:
        - functions
      title: Automation Function Bulk Removal Response
      x-zs-$id: AutomationFunctionBulkRemovalResponse
