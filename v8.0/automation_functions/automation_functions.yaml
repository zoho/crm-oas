openapi: 3.1.0
info:
  title: Automation Functions
  description: >-
    Automation Functions are custom server-side scripts configured in Zoho CRM
    to execute extended business logics. This API enables developers to create,
    retrieve, update, and delete automation functions, as well as retrieve
    associated modules and function failure records.
  version: '8'
servers:
  - url: https://zohoapis.{dc}/crm/{version}
    description: API Server for /crm
    variables:
      dc:
        description: API Server URL TLD
        default: com
        enum:
          - com
          - eu
          - in
          - cn
          - au
          - ca
          - jp
      version:
        description: API Version
        default: v8
paths:
  /settings/automation/functions/{functionId}:
    get:
      summary: Get Automation Function
      description: >-
        To retrieve the details of a specific automation function in your Zoho
        CRM organization.
      x-zs-llm-description: >-
        Retrieves a single automation function by ID. Returns the full
        configuration including arguments, module context, and script reference.
      operationId: getAutomationFunctions
      parameters:
        - $ref: '#/components/parameters/ParamPathFunctionid'
      responses:
        '200':
          description: Returns the details of the requested automation function.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutomationFunctionQueryResponse'
              examples:
                Success200:
                  summary: Successful Retrieval of an Automation Function
                  value:
                    functions:
                      - created_time: '2026-03-04T18:42:24+05:30'
                        lock_status:
                          locked: false
                        editable: true
                        module:
                          singular_label: Lead
                          plural_label: Leads
                          api_name: Leads
                          moduleName: Leads
                          id: '678446000000000125'
                        related_module: null
                        deletable: true
                        description: null
                        language: deluge
                        source: crm
                        created_by:
                          name: Patricia Adams
                          id: '678446000000280009'
                        feature_type: workflow
                        modified_time: '2026-03-04T18:42:24+05:30'
                        associated: false
                        function:
                          api_name: apidocfn
                          id: '120851000000875001'
                        name: APIDocFn
                        modified_by:
                          name: Patricia Adams
                          id: '678446000000280009'
                        arguments:
                          - name: mergeArg
                            type: merge_field
                            value: ${!Leads.id}
                          - name: argument
                            type: static
                            value: testingarg
                        id: '678446000051450070'
                  description: >-
                    Shows a successful response containing the automation
                    function details, including its creation time, lock status,
                    editability flag, and associated module information.
          headers:
            X-API-CREDITS-REMAINING:
              schema:
                type: string
                format: int64
                description: >
                  Present when >=50% of base daily credits (excluding add-on
                  credits) are consumed. Value is total remaining credits
                  including add-on credits for the rolling 24-hour window.
              required: false
        '204':
          description: >-
            Indicates that the automation function was retrieved successfully
            and the response contains no body.
          headers:
            X-API-CREDITS-REMAINING:
              schema:
                type: string
                format: int64
                description: >
                  Present when >=50% of base daily credits (excluding add-on
                  credits) are consumed. Value is total remaining credits
                  including add-on credits for the rolling 24-hour window.
              required: false
      security:
        - OAuth2:
            - ZohoCRM.settings.automation_actions.READ
    put:
      summary: Update Automation Function
      description: >-
        To update an automation function configuration in your Zoho CRM
        organization.
      x-zs-llm-description: >-
        Updates one or more automation function definitions. Provide the full
        configuration for each function in the request body.
      operationId: putAutomationFunctions
      parameters:
        - $ref: '#/components/parameters/ParamPathFunctionid'
      requestBody:
        description: The request body must contain a **functions** array with one object.
        content:
          application/json:
            x-zs-llm-examples:
              - SamplePutRequest
            schema:
              $ref: '#/components/schemas/AutomationFunctionModificationRequestV2'
            examples:
              SamplePutRequest:
                summary: Update an Automation Function With Argument Values
                value:
                  functions:
                    - arguments:
                        - name: arg1
                          type: merge_field
                          value: ${!Leads.Last_Name}
                        - name: arg2
                          type: static
                          value: cityupdated
                      id: '678446000051490013'
                      module:
                        id: '678446000000000125'
                        api_name: Leads
                      feature_type: workflow
                description: >-
                  Shows a PUT request to update an existing custom function,
                  providing two arguments. One references a merge field from the
                  Leads module. The other one has a static value along with the
                  function ID and associated module details.
      responses:
        '200':
          description: >-
            Returns a confirmation that the custom function was updated
            successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutomationFunctionModificationResponse'
              examples:
                Success200:
                  summary: Successful Update of a Custom Function
                  value:
                    functions:
                      - code: SUCCESS
                        details:
                          id: '678446000051490013'
                        message: custom function updated successfully
                        status: success
                  description: >-
                    Shows the success response returned after a custom function
                    is updated, including the function ID in the details object
                    and a SUCCESS status code.
          headers:
            X-API-CREDITS-REMAINING:
              schema:
                type: string
                format: int64
                description: >
                  Present when >=50% of base daily credits (excluding add-on
                  credits) are consumed. Value is total remaining credits
                  including add-on credits for the rolling 24-hour window.
              required: false
        '400':
          description: >-
            The request cannot be processed due to invalid syntax.
            **Resolution:** The request body must be reviewed to ensure it
            contains valid syntax and all required fields are correctly
            formatted.
          content:
            application/json:
              schema:
                description: >-
                  Represents the error response body returned when the request
                  to update an automation function is invalid.
                oneOf:
                  - $ref: '#/components/schemas/UpdateInvalidFunctionIdErrorResponse'
                  - type: object
                    additionalProperties: false
                    description: Wrapped error response with functions
                    properties:
                      functions:
                        type: array
                        description: Array of error objects
                        items:
                          oneOf:
                            - $ref: >-
                                #/components/schemas/ModuleAmbiguityErrorResponse
                            - $ref: >-
                                #/components/schemas/InvalidModuleNameErrorResponse
                            - $ref: >-
                                #/components/schemas/InvalidModuleIdErrorResponse
                            - $ref: >-
                                #/components/schemas/ArgumentMissingTypeErrorResponse
                            - $ref: >-
                                #/components/schemas/ArgumentTypeValueMismatchErrorResponse
                            - $ref: >-
                                #/components/schemas/InvalidDataTypeErrorResponse
                            - $ref: '#/components/schemas/InvalidDataErrorResponse'
                            - $ref: >-
                                #/components/schemas/MandatoryFieldMissingErrorResponse
                            - $ref: >-
                                #/components/schemas/ScriptNotAllowedErrorResponse
                            - $ref: >-
                                #/components/schemas/InvalidFeatureNameErrorResponse
                        maxItems: 25
                    required:
                      - functions
                    x-zs-$id: PutAutomationFunctionsError400Wrapper
                x-zs-$id: PutAutomationFunctionsError400
              examples:
                InvalidDataResponse1:
                  summary: INVALID_DATA Error for an Invalid Function ID
                  value:
                    code: INVALID_DATA
                    details:
                      resource_path_index: 3
                    message: the id given seems to be invalid
                    status: error
                  description: >-
                    Shows a 400 error response returned when the function ID
                    provided in the request is invalid, indicated by the
                    INVALID_DATA code and a resource_path_index detail.
                AmbiguityDuringProcessingResponse1:
                  summary: Error Due to Ambiguous Module Identifier
                  value:
                    functions:
                      - code: AMBIGUITY_DURING_PROCESSING
                        details:
                          ambiguity_due_to:
                            - api_name: id
                              json_path: $.functions[0].module.id
                            - api_name: api_name
                              json_path: $.functions[0].module.api_name
                        message: The given moduleid seems to be invalid
                        status: error
                  description: >-
                    Shows a 400 error response returned when the module
                    identifier in the request is ambiguous, with the
                    AMBIGUITY_DURING_PROCESSING code indicating that both the id
                    and api_name fields on the module object could not be
                    resolved unambiguously.
                InvalidDataResponse2:
                  summary: INVALID_DATA Error for an Invalid Module API Name
                  value:
                    functions:
                      - code: INVALID_DATA
                        details:
                          api_name: api_name
                          json_path: $.functions[0].module.api_name
                        message: the tabName given seems to be invalid
                        status: error
                  description: >-
                    Shows a 400 error response where the module's **api_name**
                    field at **$.functions[0].module.api_name** contains an
                    invalid tab name, returning an **INVALID_DATA** code with an
                    error status.
                InvalidDataResponse3:
                  summary: INVALID_DATA Error for Invalid Module ID
                  value:
                    functions:
                      - code: INVALID_DATA
                        details:
                          api_name: id
                          json_path: $.functions[0].module.id
                        message: the tabId given seems to be invalid
                        status: error
                  description: >-
                    Shows a 400 error response where the module's **id** field
                    at **$.functions[0].module.id** contains an invalid tab ID,
                    returning an **INVALID_DATA** code with an error status.
                MandatoryNotFoundResponse1:
                  summary: MANDATORY_NOT_FOUND Error for Missing Argument Type
                  value:
                    functions:
                      - code: MANDATORY_NOT_FOUND
                        details:
                          api_name: type
                          json_path: $.functions[0].arguments[1].type
                        message: >-
                          the given parameter is invalid, specify both name and
                          value
                        status: error
                  description: >-
                    Shows a 400 error response where the **type** field at
                    **$.functions[0].arguments[1].type** is missing or invalid,
                    returning a **MANDATORY_NOT_FOUND** code with the message
                    that both name and value must be specified.
                DependentMismatchResponse1:
                  summary: >-
                    DEPENDENT_MISMATCH Error for Mismatched Type and Value
                    Fields
                  value:
                    functions:
                      - code: DEPENDENT_MISMATCH
                        details:
                          dependee:
                            api_name: type
                            json_path: $.functions[0].arguments[0].type
                          api_name: value
                          json_path: $.functions[0].arguments[0].value
                        message: Type and value is mismatched
                        status: error
                  description: >-
                    Shows a 400 error response when the **value** field's data
                    does not match the type specified in the **type** field of
                    the function argument, identified at
                    **$.functions[0].arguments[0].value**.
                InvalidDataResponse4:
                  summary: INVALID_DATA Error for Invalid Data Type in Arguments Field
                  value:
                    functions:
                      - code: INVALID_DATA
                        message: Invalid data type
                        details:
                          api_name: arguments
                          expected_data_type: jsonarray
                          json_path: $.functions[*].arguments
                        status: error
                  description: >-
                    Shows a 400 error response when the **arguments** field
                    contains an invalid data type, where the expected type is a
                    JSON array, as identified at **$.functions[*].arguments**.
                InvalidDataResponse5:
                  summary: Error for Arguments Field Exceeding Maximum Length
                  value:
                    functions:
                      - code: INVALID_DATA
                        message: Invalid data
                        details:
                          api_name: arguments
                          maximum_length: 2
                          json_path: $.functions[*].arguments
                        status: error
                  description: >-
                    Shows a 400 error response when the **arguments** field
                    contains invalid data, with the error code **INVALID_DATA**
                    and a maximum length constraint violation at the path
                    **$.functions[*].arguments**.
                MandatoryNotFoundResponse2:
                  summary: MANDATORY_NOT_FOUND Error for Missing Argument Name Field
                  value:
                    functions:
                      - code: MANDATORY_NOT_FOUND
                        message: Required field is missing
                        details:
                          api_name: name
                          json_path: $.functions[*].arguments[*].name
                        status: error
                  description: >-
                    Shows a 400 error response when the required **name** field
                    is missing within the **arguments** array, returning the
                    error code **MANDATORY_NOT_FOUND** at the path
                    **$.functions[*].arguments[*].name**.
                InvalidDataResponse6:
                  summary: >-
                    INVALID_DATA Error for Incorrect Data Type on Argument Name
                    Field
                  value:
                    functions:
                      - code: INVALID_DATA
                        message: Invalid data type
                        details:
                          api_name: name
                          expected_data_type: text
                          json_path: $.functions[*].arguments[*].name
                        status: error
                  description: >-
                    Shows a 400 error response when the **name** field within
                    the **arguments** array contains an invalid data type,
                    returning the error code **INVALID_DATA** with an expected
                    data type of **text** at the path
                    **$.functions[*].arguments[*].name**.
                InvalidDataResponse7:
                  summary: >-
                    INVALID_DATA Error for Argument Name Exceeding Maximum
                    Length
                  value:
                    functions:
                      - code: INVALID_DATA
                        message: Invalid data
                        details:
                          api_name: name
                          maximum_length: 4
                          json_path: $.functions[*].arguments[*].name
                        status: error
                  description: >-
                    Shows the error response returned when the argument name
                    field at $.functions[*].arguments[*].name exceeds the
                    allowed maximum length, resulting in an INVALID_DATA status.
                MandatoryNotFoundResponse3:
                  summary: Error for Missing Required Argument Type Field
                  value:
                    functions:
                      - code: MANDATORY_NOT_FOUND
                        message: Required field is missing
                        details:
                          api_name: type
                          json_path: $.functions[*].arguments[*].type
                        status: error
                  description: >-
                    Shows the error response returned when the required argument
                    type field at $.functions[*].arguments[*].type is absent
                    from the request, resulting in a MANDATORY_NOT_FOUND status.
                InvalidDataResponse8:
                  summary: Error for Incorrect Data Type on Argument Type Field
                  value:
                    functions:
                      - code: INVALID_DATA
                        message: Invalid data type
                        details:
                          api_name: type
                          expected_data_type: text
                          json_path: $.functions[*].arguments[*].type
                        status: error
                  description: >-
                    Shows a 400 error response where the **type** field in the
                    function arguments contains an invalid data type, with the
                    expected data type indicated as **text**.
                InvalidDataResponse9:
                  summary: Error for Type Field Exceeding Maximum Length
                  value:
                    functions:
                      - code: INVALID_DATA
                        message: Invalid data
                        details:
                          api_name: type
                          maximum_length: 6
                          json_path: $.functions[*].arguments[*].type
                        status: error
                  description: >-
                    Shows a 400 error response where the **type** field in the
                    function arguments exceeds the maximum allowed length of six
                    characters, returning an INVALID_DATA code.
                MandatoryNotFoundResponse4:
                  summary: Error for Missing Value Field in Function Arguments
                  value:
                    functions:
                      - code: MANDATORY_NOT_FOUND
                        message: Required field is missing
                        details:
                          api_name: value
                          json_path: $.functions[*].arguments[*].value
                        status: error
                  description: >-
                    Shows a 400 error response where the required **value**
                    field in the function arguments is missing, returning a
                    MANDATORY_NOT_FOUND code.
                InvalidDataResponse10:
                  summary: Error for Invalid Data Type in Argument Value Field
                  value:
                    functions:
                      - code: INVALID_DATA
                        message: Invalid data type
                        details:
                          api_name: value
                          expected_data_type: text
                          json_path: $.functions[*].arguments[*].value
                        status: error
                  description: >-
                    Shows the error response returned when the **value** field
                    at **$.functions[*].arguments[*].value** contains a value
                    with an invalid data type; the expected data type is
                    **text**.
                InvalidDataResponse11:
                  summary: Error for Argument Value Field Exceeding Maximum Length
                  value:
                    functions:
                      - code: INVALID_DATA
                        message: Invalid data
                        details:
                          api_name: value
                          maximum_length: 11
                          json_path: $.functions[*].arguments[*].value
                        status: error
                  description: >-
                    Shows the error response returned when the **value** field
                    at **$.functions[*].arguments[*].value** exceeds the maximum
                    allowed length of 11 characters.
                MandatoryNotFoundResponse5:
                  summary: >-
                    MANDATORY_NOT_FOUND Error for Required Id Field Missing in
                    Functions Array
                  value:
                    functions:
                      - code: MANDATORY_NOT_FOUND
                        message: Required field is missing
                        details:
                          api_name: id
                          json_path: $.functions[*].id
                        status: error
                  description: >-
                    Shows a 400 error response when a required field is missing
                    from the request, with the **MANDATORY_NOT_FOUND** code
                    identifying **id** as the absent field at
                    **$.functions[*].id**.
                InvalidDataResponse12:
                  summary: Error for Incorrect Data Type on the id Field
                  value:
                    functions:
                      - code: INVALID_DATA
                        message: Invalid data type
                        details:
                          api_name: id
                          expected_data_type: bigint
                          json_path: $.functions[*].id
                        status: error
                  description: >-
                    Shows a 400 error response when the **id** field at
                    **$.functions[*].id** contains a value with an incorrect
                    data type; the expected type is **bigint**.
                InvalidDataResponse13:
                  summary: Error for id Field Exceeding Maximum Length
                  value:
                    functions:
                      - code: INVALID_DATA
                        message: Invalid data
                        details:
                          api_name: id
                          maximum_length: 18
                          json_path: $.functions[*].id
                        status: error
                  description: >-
                    Shows a 400 error response when the **id** field at
                    **$.functions[*].id** exceeds the maximum allowed length of
                    18 characters, returning an **INVALID_DATA** code.
                InvalidDataResponse14:
                  summary: Error—Invalid Data Type for module Field
                  value:
                    functions:
                      - code: INVALID_DATA
                        message: Invalid data type
                        details:
                          api_name: module
                          expected_data_type: jsonobject
                          json_path: $.functions[*].module
                        status: error
                  description: >-
                    Shows a 400 error response where the **module** field at
                    **$.functions[*].module** contains a value of an incorrect
                    data type; the expected data type is **jsonobject**.
                InvalidDataResponse15:
                  summary: Error—module Field Exceeds Maximum Length
                  value:
                    functions:
                      - code: INVALID_DATA
                        message: Invalid data
                        details:
                          api_name: module
                          maximum_length: 1
                          json_path: $.functions[*].module
                        status: error
                  description: >-
                    Shows a 400 error response where the **module** field at
                    **$.functions[*].module** exceeds the allowed maximum
                    length, resulting in an INVALID_DATA error.
                InvalidDataResponse16:
                  summary: Error—Invalid Data Type for module.id Field
                  value:
                    functions:
                      - code: INVALID_DATA
                        message: Invalid data type
                        details:
                          api_name: id
                          expected_data_type: bigint
                          json_path: $.functions[*].module.id
                        status: error
                  description: >-
                    Shows a 400 error response where the module **id** field at
                    **$.functions[*].module.id** contains an invalid data type;
                    the expected data type is **bigint**.
                InvalidDataResponse17:
                  summary: Error for Module ID Field Exceeding Maximum Length
                  value:
                    functions:
                      - code: INVALID_DATA
                        message: Invalid data
                        details:
                          api_name: id
                          maximum_length: 18
                          json_path: $.functions[*].module.id
                        status: error
                  description: >-
                    Shows a 400 error response where the module **id** field at
                    **$.functions[*].module.id** exceeds the maximum allowed
                    length of 18 characters.
                InvalidDataResponse18:
                  summary: Error for Module api_name Field With Wrong Data Type
                  value:
                    functions:
                      - code: INVALID_DATA
                        message: Invalid data type
                        details:
                          api_name: api_name
                          expected_data_type: text
                          json_path: $.functions[*].module.api_name
                        status: error
                  description: >-
                    Shows a 400 error response where the module **api_name**
                    field at **$.functions[*].module.api_name** contains an
                    invalid data type; the expected data type is **text**.
                InvalidDataResponse19:
                  summary: >-
                    INVALID_DATA Error for Module api_name Exceeding Maximum
                    Length
                  value:
                    functions:
                      - code: INVALID_DATA
                        message: Invalid data
                        details:
                          api_name: api_name
                          maximum_length: 5
                          json_path: $.functions[*].module.api_name
                        status: error
                  description: >-
                    Shows the error response returned when the **api_name**
                    field in **module** exceeds the allowed length, resulting in
                    an INVALID_DATA error at the path
                    **$.functions[*].module.api_name**.
                InvalidDataResponse20:
                  summary: Error for feature_type With Unexpected Data Type
                  value:
                    functions:
                      - code: INVALID_DATA
                        message: Invalid data type
                        details:
                          api_name: feature_type
                          expected_data_type: text
                          json_path: $.functions[*].feature_type
                        status: error
                  description: >-
                    Shows the error response returned when the **feature_type**
                    field contains an invalid data type; the response indicates
                    that a **text** value is expected, and the error is reported
                    at **$.functions[*].feature_type**.
                InvalidDataResponse21:
                  summary: Error for feature_type Exceeding Maximum Length
                  value:
                    functions:
                      - code: INVALID_DATA
                        message: Invalid data
                        details:
                          api_name: feature_type
                          maximum_length: 8
                          json_path: $.functions[*].feature_type
                        status: error
                  description: >-
                    Shows a 400 error response where the **feature_type** field
                    value exceeds the allowed maximum length, returning an
                    **INVALID_DATA** code with the offending field path.
                NotAllowedResponse1:
                  summary: NOT_ALLOWED Error for the Script Field
                  value:
                    functions:
                      - code: NOT_ALLOWED
                        details:
                          api_name: script
                          json_path: $.functions[0].script
                        message: permission denied
                        status: error
                  description: >-
                    Shows a 400 error response where the **script** field is not
                    permitted, returning a **NOT_ALLOWED** code with a
                    permission denied message and the field's JSON path.
          headers:
            X-API-CREDITS-REMAINING:
              schema:
                type: string
                format: int64
                description: >
                  Present when >=50% of base daily credits (excluding add-on
                  credits) are consumed. Value is total remaining credits
                  including add-on credits for the rolling 24-hour window.
              required: false
      security:
        - OAuth2:
            - ZohoCRM.settings.automation_actions.UPDATE
    delete:
      summary: Delete Automation Function
      description: To delete an automation function from your Zoho CRM organization.
      x-zs-llm-description: >-
        Deletes a single automation function by ID path parameter. Associated
        functions cannot be deleted.
      operationId: deleteAutomationFunction
      parameters:
        - $ref: '#/components/parameters/ParamPathFunctionid'
      responses:
        '200':
          description: >-
            Returns a confirmation that the automation function was successfully
            deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutomationFunctionDeletionResponse'
              examples:
                Success200:
                  summary: Successful Deletion of an Automation Function
                  value:
                    functions:
                      - code: SUCCESS
                        details:
                          id: '678446000051450070'
                        message: Function is deleted
                        status: success
                  description: >-
                    Shows a successful response confirming that the specified
                    automation function was deleted, including the deleted
                    function's ID in the details object.
          headers:
            X-API-CREDITS-REMAINING:
              schema:
                type: string
                format: int64
                description: >
                  Present when >=50% of base daily credits (excluding add-on
                  credits) are consumed. Value is total remaining credits
                  including add-on credits for the rolling 24-hour window.
              required: false
        '400':
          description: >-
            The request cannot be processed due to invalid syntax.
            **Resolution:** The request must be corrected to use valid syntax
            before resubmitting.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateInvalidFunctionIdErrorResponse'
              examples:
                InvalidDataResponse1:
                  summary: Invalid Function ID in Delete Request
                  value:
                    code: INVALID_DATA
                    details:
                      resource_path_index: 3
                    message: the id given seems to be invalid
                    status: error
                  description: >-
                    Shows the error response returned when the function ID
                    supplied in the request path is invalid, resulting in an
                    INVALID_DATA code and an error status.
          headers:
            X-API-CREDITS-REMAINING:
              schema:
                type: string
                format: int64
                description: >
                  Present when >=50% of base daily credits (excluding add-on
                  credits) are consumed. Value is total remaining credits
                  including add-on credits for the rolling 24-hour window.
              required: false
      security:
        - OAuth2:
            - ZohoCRM.settings.automation_actions.DELETE
  /settings/automation/functions:
    get:
      summary: Get Automation Functions
      description: >-
        To retrieve all automation functions configured in your Zoho CRM
        organization.
      x-zs-llm-description: >-
        Fetches a paginated list of all automation function definitions. Filter
        by module and feature_type. Check info.more_records for additional
        pages.
      operationId: getAllAutomationFunctions
      parameters:
        - name: module
          in: query
          description: >-
            Specify the module API name to filter the automation functions
            returned in the response.
          required: false
          schema:
            type: string
            maxLength: 200
          example: Leads
        - name: feature_type
          in: query
          description: >
            Specify the automation feature type to filter the returned
            functions. Possible values: 

            * **workflow**  

            * **approval_process**  

            * **blueprint** 

            * **blueprint_transition**  

            * **blueprint_state**  

            * **review_process** 

            * **orchestration**  

            * **assignment_rules** 

            * **kiosk** 

            * **pathfinder** 

            * **connected_workflows** 

            * **commandcenter_service**

            * **cadences** 
          required: false
          schema:
            type: string
            enum:
              - workflow
              - approval_process
              - blueprint
              - blueprint_transition
              - blueprint_state
              - review_process
              - orchestration
              - assignment_rules
