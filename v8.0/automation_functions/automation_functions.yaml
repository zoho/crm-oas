    delete:
      summary: Delete Functions
      description: >-
        To delete one or more automation functions from your Zoho CRM
        organization.
      x-zs-llm-description: >-
        Bulk-deletes automation functions by IDs (comma-separated ids query
        param). Max 10 IDs per request.
      operationId: deleteAutomationFunctions
      parameters:
        - $ref: '#/components/parameters/ParamQueryIds'
      responses:
        '200':
          description: >-
            Returns the deletion status for each automation function in the
            request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutomationFunctionDeletionResponse'
              examples:
                Success200:
                  summary: Successful Deletion of Multiple Automation Functions
                  value:
                    functions:
                      - code: SUCCESS
                        details:
                          id: '678446000051490025'
                        message: Function is deleted
                        status: success
                      - code: SUCCESS
                        details:
                          id: '678446000051490026'
                        message: Function is deleted
                        status: success
                  description: >-
                    Shows a successful bulk delete response where all requested
                    automation functions were removed, with each entry returning
                    a **SUCCESS** code and the corresponding function ID in the
                    details object.
          headers:
            X-API-CREDITS-REMAINING:
              schema:
                type: string
                format: int64
                description: >
                  Present when >=50% of base daily credits (excluding add-on
                  credits) are consumed. Value is total remaining credits
                  including add-on credits for the rolling 24-hour window.
              required: false
        '207':
          description: >-
            Returns a multi-status response. Each item in the **functions**
            array independently indicates success or failure for the
            corresponding automation function in the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutomationFunctionBulkRemovalResponse'
              examples:
                MultiStatus207:
                  summary: >-
                    Partial Delete where One Function Deleted, One Invalid ID
                    Returns an Error
                  value:
                    functions:
                      - code: SUCCESS
                        details:
                          id: '678446000051490025'
                        message: Function is deleted
                        status: success
                      - code: INVALID_DATA
                        details:
                          id: '678446030057490025'
                        message: the id given seems to be invalid
                        status: error
                  description: >-
                    Shows a mixed-result delete response where one automation
                    function is successfully deleted with a **SUCCESS** code and
                    another fails with an **INVALID_DATA** code because the
                    provided ID is not found.
          headers:
            X-API-CREDITS-REMAINING:
              schema:
                type: string
                format: int64
                description: >
                  Present when >=50% of base daily credits (excluding add-on
                  credits) are consumed. Value is total remaining credits
                  including add-on credits for the rolling 24-hour window.
              required: false
        '400':
          description: >-
            The request cannot be processed due to invalid syntax.
            **Resolution:** The request body must be corrected to use valid
            syntax before resubmitting.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MissingIdParameterErrorResponse'
              examples:
                RequiredParamMissingResponse1:
                  summary: Missing Required Parameter IDs Error
                  value:
                    code: REQUIRED_PARAM_MISSING
                    details:
                      param_name: ids
                    message: One of the expected parameter is missing
                    status: error
                  description: >-
                    Shows the 400 error response returned when the required
                    **ids** parameter is missing from the delete automation
                    functions request.
          headers:
            X-API-CREDITS-REMAINING:
              schema:
                type: string
                format: int64
                description: >
                  Present when >=50% of base daily credits (excluding add-on
                  credits) are consumed. Value is total remaining credits
                  including add-on credits for the rolling 24-hour window.
              required: false
