openapi: 3.1.0
info:
  title: Functions
  description: >
    [Functions](https://www.zoho.com/crm/developer/docs/functions/overview/introduction.html)
    are custom serverless scripts configured in Zoho CRM to automate business
    logic and extend platform capabilities. This API enables developers to
    create, retrieve, update, delete, and publish functions, as well as retrieve
    available runtimes and categories.
  version: '8'
servers:
  - url: https://zohoapis.{dc}/crm/{version}
    description: >-
      Production API server for Zoho CRM. Sample request URL:
      `https://zohoapis.{dc}/crm/{version}`.
    variables:
      dc:
        description: >-
          The top-level domain that determines the regional data center for API
          requests. Possible values: **com**, **eu**, **in**, **cn**, **au**,
          **ca**, **jp**. Default: **com**.
        default: com
        enum:
          - com
          - eu
          - in
          - cn
          - au
          - ca
          - jp
      version:
        description: 'The API version used in the request URL. Default: **v8**.'
        default: v8
paths:
  /settings/functions:
    get:
      summary: Functions
      description: >
        To retrieve a paginated list of all
        [functions](https://www.zoho.com/crm/developer/docs/functions/overview/introduction.html)
        in your Zoho CRM account. The response contains metadata about each
        function, including its name, API name, runtime, category, state,
        arguments, tags, and timestamps. To get the implementation code of a
        function, you must use the [Download Function Code
        API](functions.yaml#$.paths./settings/functions/{fxIdentifier}/code.get).
      operationId: getFunctions
      parameters:
        - $ref: '#/components/parameters/ParamQueryPage'
        - $ref: '#/components/parameters/ParamQueryPerPage'
        - $ref: '#/components/parameters/ParamQueryPageToken'
      responses:
        '200':
          description: Returns the list of functions configured in the Zoho CRM account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetfunctionsResponse200'
              examples:
                Success200:
                  summary: Successful Retrieval of Functions List
                  value:
                    functions:
                      - return_type: string
                        description: Hi, These are my function to execute Crm rest apis
                        language: Deluge
                        source: crm
                        rest_api_mode:
                          - Oauth
                          - ZAPI
                        modified_time: '2025-12-10T15:37:48+05:30'
                        has_draft: false
                        state: active
                        id: '4361080000002307599'
                        created_time: '2025-12-10T15:37:48+05:30'
                        runtime: Deluge 1.0
                        name: Send Notification
