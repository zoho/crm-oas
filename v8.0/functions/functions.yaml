                    info:
                      per_page: 200
                      next_page_token: null
                      count: 3
                      sort_by: id
                      page: 1
                      previous_page_token: null
                      page_token_expiry: null
                      sort_order: desc
                      more_records: false
                  description: >-
                    Shows a successful response containing a list of function
                    objects, each with metadata such as return type, language,
                    source, REST API mode, and modification timestamp.
          headers:
            X-API-CREDITS-REMAINING:
              schema:
                type: string
                format: int64
                description: >
                  Present when >=50% of base daily credits (excluding add-on
                  credits) are consumed. Value is total remaining credits
                  including add-on credits for the rolling 24-hour window.
              required: false
        '204':
          description: >-
            Indicates that the request was successful and no functions were
            found matching the specified criteria.
          headers:
            X-API-CREDITS-REMAINING:
              schema:
                type: string
                format: int64
                description: >
                  Present when >=50% of base daily credits (excluding add-on
                  credits) are consumed. Value is total remaining credits
                  including add-on credits for the rolling 24-hour window.
              required: false
        '400':
          description: Bad Request - The request cannot be processed due to invalid syntax.
          content:
            application/json:
              schema:
                description: >-
                  Represents the error response body returned when the request
                  contains invalid or malformed parameters.
                oneOf:
                  - $ref: '#/components/schemas/ErrorResponseNoClientPortalSupport'
                  - $ref: '#/components/schemas/ErrorResponseFeatureNotSupported'
                  - $ref: '#/components/schemas/ParamPatternNotMatchedError'
                  - $ref: '#/components/schemas/DiscretePaginationLimitExceededError'
                x-zs-$id: GetfunctionsError400
              examples:
                ApiNotSupportedResponse1:
                  summary: API_NOT_SUPPORTED Error for a Client Portal User
                  value:
                    code: API_NOT_SUPPORTED
                    details:
                      unsupported_login_user_type: Client Portal User
                    message: api not supported for client portal user
                    status: error
                  description: >-
                    Shows the error response returned when the API is not
                    supported for a Client Portal User, including the
                    API_NOT_SUPPORTED code, the unsupported login user type in
                    the details object, and an error status.
                FeatureNotSupportedResponse1:
                  summary: >-
                    FEATURE_NOT_SUPPORTED Error When License Does Not Include
                    the Feature
                  value:
                    code: FEATURE_NOT_SUPPORTED
                    details: {}
                    message: Your License does not support this feature
                    status: error
                  description: >-
                    Shows the error response returned when the current license
                    does not include support for the functions feature.
                PatternNotMatchedResponse1:
                  summary: PATTERN_NOT_MATCHED Error for Invalid Page Parameter Value
                  value:
                    code: PATTERN_NOT_MATCHED
                    details:
                      param_name: page
                    message: Please check whether the input values are correct
                    status: error
                  description: >-
                    Shows the error response returned when the value supplied
                    for the **page** parameter does not match the expected
                    pattern.
                DiscretePaginationLimitExceededResponse1:
                  summary: >-
                    DISCRETE_PAGINATION_LIMIT_EXCEEDED Error When page_token Is
                    Not Used
                  value:
                    code: DISCRETE_PAGINATION_LIMIT_EXCEEDED
                    details:
                      limit: 2000
                    message: >-
                      You can only get the first 2000 records without using
                      page_token param
                    status: error
                  description: >-
                    Shows the error response returned when the request attempts
                    to retrieve records beyond the 2000-record pagination limit
                    without supplying the **page_token** parameter.
          headers:
            X-API-CREDITS-REMAINING:
              schema:
                type: string
                format: int64
                description: >
                  Present when >=50% of base daily credits (excluding add-on
                  credits) are consumed. Value is total remaining credits
                  including add-on credits for the rolling 24-hour window.
              required: false
        '403':
          description: >-
            Permission denied to retrieve functions. **Resolution:** The CRM
            administrator must grant the required permission to the user's
            profile.
          content:
            application/json:
              schema:
                description: >-
                  Represents the error response returned when the request is
                  forbidden due to insufficient permissions.
                oneOf:
                  - $ref: '#/components/schemas/NoDevPermissionError'
                  - $ref: '#/components/schemas/UserEmailNotConfirmedError'
                x-zs-$id: GetfunctionsError403
              examples:
                NoPermissionResponse1:
                  summary: >-
                    NO_PERMISSION Error — Permission Denied for Functions
                    Retrieval
                  value:
                    code: NO_PERMISSION
                    details:
                      permissions:
                        - Crm_Implied_Advanced_Dev_Access
                    message: permission denied
                    status: error
                  description: >-
                    Shows a 403 error response when the requesting user lacks
                    the Crm_Implied_Advanced_Dev_Access permission required to
                    retrieve functions.
                UserEmailNotConfirmedError:
                  summary: NO_PERMISSION Error — User Email Not Confirmed
                  value:
                    code: NO_PERMISSION
                    details: {}
                    message: User email not confirmed
                    status: error
                  description: >-
                    Shows the 403 response returned when the requesting user's
                    email address has not been confirmed, preventing access to
                    the functions list.
          headers:
            X-API-CREDITS-REMAINING:
              schema:
                type: string
                format: int64
                description: >
                  Present when >=50% of base daily credits (excluding add-on
                  credits) are consumed. Value is total remaining credits
                  including add-on credits for the rolling 24-hour window.
              required: false
      security:
        - OAuth2:
            - ZohoCRM.settings.functions.READ
    post:
      summary: Function
      description: >
        Use this API to create a function in your Zoho CRM account. Create
        Deluge, Java, Node.js, or Python functions with metadata and code.
        Deluge code can be JSON-embedded (`_code`) or uploaded as a .ds file;
        others require a ZIP package.


        **Note:**

        - Up to **20,000** functions per organization.

        - Deluge: provide code via `_code` or the `code` form-data .ds file; if
        both are given, `code` takes precedence.

        - If neither is given, the function is created as **active** with a
        default implementation, e.g. for **Cleanup Duplicates** (Standalone):

         string standalone.cleanup_duplicates()
         {
          return "";
         }

        - Deluge declaration: lowercase function name (underscores for spaces) +
        lowercase category, e.g. **string
        standalone.restore_deal_by_name(...)**; return type must match the
        category default.

        - Java, Node.js, Python: upload a ZIP via `code`. On compilation errors,
        the function is saved as a draft and **207 Partial Success** is
        returned.
      operationId: createFunctions
      requestBody:
        description: >-
          The request body must contain a **multipart/form-data** payload with
          the function metadata and an optional code file attachment.
        content:
          multipart/form-data:
            schema:
              additionalProperties: false
              description: >-
                Represents the multipart form-data payload for creating a
                function, containing a **code** file upload and a **metadata**
                object with the function's configuration details.
              type: object
              properties:
                code:
                  type: string
                  format: binary
                  description: >-
                    Upload the function implementation. This parameter is
                    optional for Deluge functions; if omitted, the function is
                    created without an implementation. For Java, Node.js, and
                    Python functions, upload the function package as a ZIP file.
                metadata:
                  $ref: '#/components/schemas/PostfunctionsRequest'
                  description: >-
                    JSON string containing the metadata of the function being
                    created. Includes function name, description, category, API
                    name, runtime, and optional inline script (_code) for
                    Deluge. Deluge code can also be uploaded as a .ds file via
                    the `code` multipart form field. For non-Deluge runtimes,
                    attach the code package as a ZIP via the `code` multipart
                    form field.
            examples:
              SamplePostRequest:
                summary: Create a Function With Metadata and Code File
                value:
                  metadata:
                    functions:
                      - name: Name of the Function
                        description: description
                        category: Button
                        api_name: test_function
                        runtime: Deluge 1.0
                        _code: function script details as an string
                    publish:
                      changelog: message
                  code: >-
                    (binary content of the file to be uploaded, not represented
                    in JSON format)
                description: >-
                  Shows a multipart form-data request to create a function,
                  including a metadata object with fields such as **name**,
                  **description**, **category**, **api_name**, and **runtime**,
                  alongside the function's code content.
      responses:
        '201':
          description: Returns a confirmation that the function was created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostfunctionsResponse201'
              examples:
                Success201:
                  summary: Function Created Successfully
                  value:
                    functions:
                      - code: SUCCESS
                        details:
                          id: '4361080000002307599'
                        message: function created successfully
                        status: success
                  description: >-
                    Shows a successful function creation response with a
                    **SUCCESS** status code and the ID of the newly created
                    function.
          headers:
            X-API-CREDITS-REMAINING:
              schema:
                type: string
                format: int64
                description: >
                  Present when >=50% of base daily credits (excluding add-on
                  credits) are consumed. Value is total remaining credits
                  including add-on credits for the rolling 24-hour window.
              required: false
        '207':
          description: >-
            Returns a partial success response. The function record was created,
            but publishing failed due to a compilation error in the uploaded
            code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostfunctionsResponse207'
                x-zs-$id: PostfunctionsResponse207
              examples:
                Success207:
                  summary: Partial Success With Compilation Error on Publish
                  value:
                    functions:
                      - code: PARTIAL_SUCCESS
                        details:
                          id: '111111000000187000'
                          errors:
                            code: COMPILATION_ERROR
                            details:
                              errors:
                                - file: /java_17_test/RecordValidator.java
                                  line: 60
                                  message: 'error: no source files'
                                - file: /java_17_test/RecordValidator.java
                                  line: 60
                                  message: enum constant expected here
                                - file: /java_17_test/RecordValidator.java
                                  line: 61
                                  message: <identifier> expected
                                - file: /java_17_test/RecordValidator.java
                                  line: 62
                                  message: ''','', ''}'', or '';'' expected'
                                - file: /java_17_test/RecordValidator.java
                                  line: 66
                                  message: <identifier> expected
                                - file: /java_17_test/RecordValidator.java
                                  line: 81
                                  message: >-
                                    invalid method declaration; return type
                                    required
                                - file: /java_17_test/RecordValidator.java
                                  line: 113
                                  message: reached end of file while parsing
                                - file: /java_17_test/DataManager.java
                                  line: 18
                                  message: '''('' expected'
                                - file: /java_17_test/DataManager.java
                                  line: 90
                                  message: field declaration must be static
                                - file: /java_17_test/DataManager.java
                                  line: 110
                                  message: illegal escape character
                                - file: /java_17_test/java_17_test.java
                                  line: 47
                                  message: ''';'' expected'
                                - file: /java_17_test/java_17_test.java
                                  line: 53
                                  message: unclosed string literal
                                - file: /java_17_test/java_17_test.java
                                  line: 59
                                  message: illegal start of expression
                                - file: /java_17_test/java_17_test.java
