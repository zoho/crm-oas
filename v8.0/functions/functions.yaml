                **code** binary file and the **metadata** object with the
                function's name, description, and script details.
              type: object
              properties:
                code:
                  type: string
                  format: binary
                  description: >-
                    Specify the binary file content of the function code package
                    to upload.
                metadata:
                  $ref: '#/components/schemas/PutfunctionsRequest'
                  description: >-
                    JSON string containing the metadata of the function being
                    updated. Can include function name, description, and inline
                    code (_code) for Deluge. Deluge code can also be uploaded as
                    a .ds file via the `code` multipart form field. For
                    non-Deluge runtimes, attach the updated code package as a
                    ZIP via the `code` multipart form field.
            examples:
              SamplePutRequest:
                summary: Update Function Metadata and Publish With a Changelog
                value:
                  metadata:
                    functions:
                      - name: Name of the Function
                        description: description
                        _code: function script details as an string
                    publish:
                      changelog: message
                  code: >-
                    (binary content of the file to be uploaded, not represented
                    in JSON format)
                description: >-
                  Shows a multipart form data request to update an existing
                  function, including the function metadata object with name,
                  description, and script code, along with the binary file
                  content of the function's code package.
