                                  message: ''';'' expected'
                                - file: /java_17_test/java_17_test.java
                                  line: 72
                                  message: ''';'' expected'
                                - file: /java_17_test/java_17_test.java
                                  line: 75
                                  message: not a statement
                                - file: /java_17_test/java_17_test.java
                                  line: 75
                                  message: ''';'' expected'
                                - file: /java_17_test/java_17_test.java
                                  line: 126
                                  message: '''['' expected'
                                - file: /java_17_test/java_17_test.java
                                  line: 126
                                  message: '-> expected'
                                - file: /java_17_test/java_17_test.java
                                  line: 300
                                  message: unclosed text block
                                - file: /java_17_test/java_17_test.java
                                  line: 323
                                  message: reached end of file while parsing
                            message: function publish failed due to compilation errors
                            status: error
                        message: function created but publish failed
                        status: success
                  description: >-
                    Shows a partial success response where the function was
                    created and assigned an ID, but publishing failed with a
                    **COMPILATION_ERROR** indicating a code error in the
                    uploaded Java source file.
          headers:
            X-API-CREDITS-REMAINING:
              schema:
                type: string
                format: int64
                description: >
                  Present when >=50% of base daily credits (excluding add-on
                  credits) are consumed. Value is total remaining credits
                  including add-on credits for the rolling 24-hour window.
              required: false
        '400':
          description: >-
            The request cannot be processed due to invalid syntax.
            **Resolution:** The request body must be corrected to use valid
            syntax before resubmitting.
          content:
            application/json:
              schema:
                description: >-
                  Contains the error details returned when the function creation
                  request fails due to a 400 Bad Request condition, including
                  the error code, message, and field-level dependency
                  information.
                oneOf:
                  - $ref: '#/components/schemas/ErrorResponseNoClientPortalSupport'
                  - $ref: '#/components/schemas/AttachedFileNotSupportedError'
                  - type: object
                    additionalProperties: false
                    description: Wrapped error response with functions
                    properties:
                      functions:
                        type: array
                        description: Array of error objects
                        items:
                          oneOf:
                            - $ref: '#/components/schemas/MandatoryNotFoundError'
                            - $ref: '#/components/schemas/DuplicateDataError'
                            - $ref: >-
                                #/components/schemas/InlineScriptCompilationError
                            - $ref: '#/components/schemas/FeatureNotEnabledError'
                            - $ref: '#/components/schemas/InlineCodeNotAllowedError'
                            - $ref: '#/components/schemas/InvalidDataMinLenError'
                            - $ref: '#/components/schemas/InvalidDataExpDataTypeError'
                            - $ref: '#/components/schemas/InvalidDataMaxLenError'
                            - $ref: >-
                                #/components/schemas/InvalidDataSupportedValuesError
                            - $ref: >-
                                #/components/schemas/InvalidDataRegexPatternError
                            - $ref: >-
                                #/components/schemas/InvalidDataWithMinAndMaxError
                            - $ref: '#/components/schemas/DependentMisMatchError'
                        maxItems: 25
                    required:
                      - functions
                    x-zs-$id: PostfunctionsError400WrapperFunctions
                  - $ref: '#/components/schemas/CodeFileCompilationError'
                  - $ref: '#/components/schemas/ErrorResponseFeatureNotSupported'
                  - $ref: '#/components/schemas/FxCreateLimitError'
                  - $ref: '#/components/schemas/InvalidDataMetaDataError'
                  - $ref: '#/components/schemas/FileNameLengthError'
                  - $ref: '#/components/schemas/FileNameRegexError'
                  - $ref: '#/components/schemas/CodePackageExistError'
                  - $ref: '#/components/schemas/CodePackageInvalidError'
                  - $ref: '#/components/schemas/CodePackageFileNotFoundError'
                  - $ref: '#/components/schemas/CodePackageFileInvalidError'
                  - $ref: '#/components/schemas/FileNotAllowedError'
                  - $ref: '#/components/schemas/UnableToProcessError'
                  - $ref: '#/components/schemas/InitFxAdminOnlyAllowedError'
                  - $ref: '#/components/schemas/InvalidDataPublishError'
                  - $ref: '#/components/schemas/RequireParamMissingError'
                  - type: object
                    additionalProperties: false
                    description: Wrapped error response with functions
                    properties:
                      functions:
                        oneOf:
                          - $ref: '#/components/schemas/InvalidDataExpDataTypeError'
                          - $ref: '#/components/schemas/InvalidDataMaxLenError'
                    required:
                      - functions
                    x-zs-$id: PostfunctionsError400WrapperFunctionsV2
                x-zs-$id: PostfunctionsError400
              examples:
                ApiNotSupportedResponse1:
                  summary: API_NOT_SUPPORTED Error for a Client Portal User
                  value:
                    code: API_NOT_SUPPORTED
                    details:
                      unsupported_login_user_type: Client Portal User
                    message: api not supported for client portal user
                    status: error
                  description: >-
                    Shows the error response returned when the API is invoked by
                    a Client Portal User, which is an unsupported login user
                    type for this operation.
                InvalidDataResponse1:
                  summary: INVALID_DATA Error for an Unsupported File Format
                  value:
                    code: INVALID_DATA
                    details:
                      supported_formats:
                        - ds
                        - zip
                    message: attached file is not permitted
                    status: error
                  description: >-
                    Shows the error response returned when the attached file
                    format is not permitted, including the list of supported
                    formats (**ds** and **zip**) in the details object.
                DuplicateDataResponse1:
                  summary: DUPLICATE_DATA Error for Duplicate Function Name
                  value:
                    functions:
                      - code: DUPLICATE_DATA
                        details:
                          api_name: name
                          json_path: $.functions[0].name
                        message: Api name duplicate
                        status: error
                  description: >-
                    Shows the 400 error response returned when the function name
                    submitted in the request already exists, resulting in a
                    DUPLICATE_DATA error on the **name** field at
                    **$.functions[0].name**.
                MandatoryNotFoundResponse1:
                  summary: MANDATORY_NOT_FOUND Error for Missing Runtime Field
                  value:
                    functions:
                      - code: MANDATORY_NOT_FOUND
                        details:
                          api_name: runtime
                          json_path: $.functions[0].runtime
                        message: required field not found
                        status: error
                  description: >-
                    Shows the 400 error response returned when the required
                    **runtime** field is missing from the request, resulting in
                    a MANDATORY_NOT_FOUND error at **$.functions[0].runtime**.
                MandatoryNotFoundResponse2:
                  summary: MANDATORY_NOT_FOUND Error for Missing Functions Array
                  value:
                    functions:
                      - code: MANDATORY_NOT_FOUND
                        details:
                          api_name: functions
                          json_path: $.functions
                        message: required field not found
                        status: error
                  description: >-
                    Shows a 400 error response when the required **functions**
                    field is missing from the request body, with the error code
                    **MANDATORY_NOT_FOUND** and the JSON path **$.functions**
                    identified in the details.
                CompilationErrorResponse1:
                  summary: >-
                    COMPILATION_ERROR Response for a Function With Compilation
                    Errors
                  value:
                    code: COMPILATION_ERROR
                    details:
                      param_name: code
                      errors:
                        - line: 2
                          index: 0
                          message: >-
                            Missing return statement: Provide STRING expression
                            to return
                    message: function have compilation errors
                    status: error
                  description: >-
                    Shows a 400 error response with the code
                    **COMPILATION_ERROR** when the submitted function code
                    contains a compilation error, such as a missing return
                    statement on line two.
                FeatureNotSupportedResponse1:
                  summary: >-
                    FEATURE_NOT_SUPPORTED Response When the License Does Not
                    Support Functions
                  value:
                    code: FEATURE_NOT_SUPPORTED
                    details: {}
                    message: Your License does not support this feature
                    status: error
                  description: >-
                    Shows a 400 error response with the code
                    **FEATURE_NOT_SUPPORTED** when the current license does not
                    include support for the functions feature.
                LimitExceededResponse1:
                  summary: LIMIT_EXCEEDED Error When Function Creation Limit Is Reached
                  value:
                    code: LIMIT_EXCEEDED
                    details:
                      limit: 20000
                    message: function creation limit reached
                    status: error
                  description: >-
                    Shows a 400 error response returned when the function
                    creation limit of 20,000 has been reached, including the
                    LIMIT_EXCEEDED code and the enforced limit in the details
                    object.
                InvalidDataResponse2:
                  summary: >-
                    INVALID_DATA Error for Metadata Parameter With Unexpected
                    Data Type
                  value:
                    code: INVALID_DATA
                    details:
                      expected_data_type: jsonobject
                      param_name: metadata
                    message: invalid data
                    status: error
                  description: >-
                    Shows a 400 error response returned when the **metadata**
                    parameter receives a value that is not a JSON object,
                    including the INVALID_DATA code and the expected data type
                    in the details object.
                CompilationErrorResponse2:
                  summary: >-
                    COMPILATION_ERROR Error for a Function With a Code
                    Compilation Failure
                  value:
                    functions:
                      - code: COMPILATION_ERROR
                        details:
                          api_name: _code
                          json_path: $.functions[0]._code
                          errors:
                            - line: 2
                              index: 0
                              message: >-
                                Missing return statement: Provide STRING
                                expression to return
                        message: function have compilation errors
                        status: error
                  description: >-
                    Shows a 400 error response where the function's code field
                    fails compilation due to a missing return statement, with
                    line and index details provided in the errors array.
                FeatureNotEnabledResponse1:
                  summary: FEATURE_NOT_ENABLED Error for the Runtime Field
                  value:
                    functions:
                      - code: FEATURE_NOT_ENABLED
                        details:
                          api_name: runtime
                          json_path: $.functions[0].runtime
                        message: feature is not enabled yet
                        status: error
                  description: >-
                    Shows a 400 error response where the **runtime** field is
                    rejected because the associated feature is not yet enabled
                    in the organization.
                NotAllowedResponse1:
                  summary: NOT_ALLOWED Error for the _code Field
                  value:
                    functions:
                      - code: NOT_ALLOWED
                        details:
                          api_name: _code
                          json_path: $.functions[0]._code
                        message: _code not allowed
