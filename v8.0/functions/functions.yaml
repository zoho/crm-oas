  /settings/functions/{fxIdentifier}/actions/publish:
    post:
      summary: Publish a function
      description: >
        This API is applicable only to **Java**, **Node.js**, and **Python**
        functions. The function must have an unpublished **draft** version
        before it can be published. **Deluge** functions are **automatically
        published** when they are created or updated and cannot be published
        using this API.


        Publish an existing draft of a **Java**, **Node.js**, or **Python**
        function in your Zoho CRM account. You can optionally specify a
        changelog message for revision tracking. To identify functions with
        unpublished drafts, use the [Functions
        API](functions.yaml#$.paths./settings/functions.get) and check whether
        the **has_draft** field is **true** ("has_draft": true).
