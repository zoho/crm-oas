    put:
      summary: Update a function by identifier
      description: >
        Use this API to update an existing function in your Zoho CRM account.


        You can update the function name, description, code, and publish
        configuration. For **Deluge** functions, you can also update arguments
        by modifying the script's function declaration. The API name, runtime,
        and category cannot be updated.


        Get the function ID or API name using the [Functions
        API](functions.yaml#$.paths./settings/functions.get).


        **Note**

        - Deluge: provide code via `_code` or the `code` form-data .ds file; if
        both are given, `code` takes precedence.

        - The Deluge declaration must use the existing lowercase name
        (underscores for spaces) + lowercase category, or the API returns
        **COMPILATION_ERROR** (with line number, position, and message).

        - Java, Node.js, Python: upload a ZIP via `code`. If the update succeeds
        but publishing fails on compilation errors, the API returns **207
        (Partial Success)** and the function stays unpublished.
      operationId: updateFunction
      parameters:
        - $ref: '#/components/parameters/PathParamFxIdentifier'
      requestBody:
        description: >-
          The request body must contain at least one of the **metadata** or
          **code** form-data parameters. Use **metadata** to specify the
          function details to update and **code** to upload the function
          implementation.
        content:
