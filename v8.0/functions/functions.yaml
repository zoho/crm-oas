  /settings/functions/{fxIdentifier}:
    get:
      summary: Function
      description: >
        Use this API to retrieve the details of a specific
        [function](https://www.zoho.com/crm/developer/docs/functions/overview/introduction.html)
        in your Zoho CRM account by specifying its unique ID or API name. The
        response contains information such as the function's runtime, category,
        state, arguments, tags, REST API mode, and creation and modification
        details. To get the implementation code of the function, you must use
        the [Download Function Code
        API](functions.yaml#$.paths./settings/functions/{fxIdentifier}/code.get).


        You can obtain the function ID or API name using the [Functions
        API](functions.yaml#$.paths./settings/functions.get).



        **Note:** If the specified function ID or API name does not exist, the
        API returns an **HTTP 204 (No Content)** response with an empty response
        body.
      operationId: getFunction
      parameters:
        - $ref: '#/components/parameters/PathParamFxIdentifier'
      responses:
        '200':
          description: Returns the details of the requested function configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetfunctionResponse200'
              examples:
                Success200:
                  summary: Successful Retrieval of a Function Configuration
                  value:
                    functions:
                      - return_type: string
                        description: Hi, These are my function to execute Crm rest apis
                        language: Deluge
                        source: crm
                        rest_api_mode:
                          - Oauth
                          - ZAPI
                        modified_time: '2025-12-10T15:37:48+05:30'
                        has_draft: false
                        state: active
                        id: '4361080000002307599'
                        created_time: '2025-12-10T15:37:48+05:30'
                        runtime: Deluge 1.0
                        name: Send Notification
                        created_by:
                          name: Patricia Boyle
                          id: '4361080000000618001'
                        api_name: send_notification
                        modified_by:
                          name: Patricia Boyle
                          id: '4361080000000618001'
                        arguments:
                          - name: crmAPIRequest
                            type: string
                          - name: arg1
                            type: string
                          - name: Orgid1
                            type: int
                        Tag:
                          - name: test
                            id: '423383000015069001'
                            color_code: '#879BFC'
                          - name: case
                            id: '423383000015069002'
                            color_code: '#F17574'
                        category: Button
                  description: >-
                    Shows the details of a single Zoho CRM function, including
                    its return type, language, source, supported REST API modes,
                    and last modified timestamp.
          headers:
            X-API-CREDITS-REMAINING:
              schema:
                type: string
                format: int64
                description: >
                  Present when >=50% of base daily credits (excluding add-on
                  credits) are consumed. Value is total remaining credits
                  including add-on credits for the rolling 24-hour window.
              required: false
        '204':
          description: >-
            Indicates that the request was successful but no function data was
            found for the specified identifier.
          headers:
            X-API-CREDITS-REMAINING:
              schema:
                type: string
                format: int64
                description: >
                  Present when >=50% of base daily credits (excluding add-on
                  credits) are consumed. Value is total remaining credits
                  including add-on credits for the rolling 24-hour window.
              required: false
        '400':
          description: >-
            The request could not be processed due to invalid syntax or a
            malformed function identifier. **Resolution:** The request must be
            corrected to use a valid function identifier in the correct format
            before resubmitting.
          content:
            application/json:
              schema:
                description: >-
                  Represents the error response body returned for a 400 Bad
                  Request, containing the error code, status, message, and
                  details.
                oneOf:
                  - $ref: '#/components/schemas/ErrorResponseNoClientPortalSupport'
                  - $ref: '#/components/schemas/ErrorResponseFeatureNotSupported'
                x-zs-$id: GetfunctionError400
              examples:
