            - DISCRETE_PAGINATION_LIMIT_EXCEEDED
        details:
          type: object
          additionalProperties: false
          description: >-
            Represents the error details for this response, including the
            maximum number of records accessible using offset-based pagination
            without a **page_token**.
          properties:
            limit:
              type: integer
              format: int32
              description: >-
                Represents the maximum number of records that can be retrieved
                using offset-based pagination (page and per_page parameters)
                without a **page_token**.
          required:
            - limit
        message:
          type: string
          description: >-
            Represents the error message describing the pagination limitation.
            Possible values: **You can only get the first 2000 records without
            using page_token param** - Indicates that offset-based pagination is
            restricted to the first 2,000 records.
          enum:
            - >-
              You can only get the first 2000 records without using page_token
              param
        status:
          type: string
          description: >-
            Represents the status of the response. Possible values: **error** -
            Indicates that the request resulted in an error.
          enum:
            - error
      required:
        - code
        - details
        - message
        - status
      title: Error Response Core
      x-zs-$id: DiscretePaginationLimitExceededError
  parameters:
    ParamQueryPage:
      name: page
      in: query
      description: >
        Specify the page number to retrieve records. The **page** parameter,
        together with the **per_page** parameter, supports retrieving the first
        2,000 records. To retrieve records beyond the first 2,000, use the
        **page_token** parameter. 

        Do not use this parameter with the page_token parameter.


        **Possible Values:** Positive integers


        **Default Value:** 1
      required: false
      schema:
        type: integer
        format: int32
        minimum: 1
    ParamQueryVersion:
      name: version
      in: query
      description: >-
        Specify which version of the function code to retrieve. Possible values:
        **draft** - Retrieves the draft version of the function code. When
        omitted, the published version is returned.
      required: false
      schema:
        type: string
        enum:
          - draft
    PathParamFxIdentifier:
      name: fxIdentifier
      in: path
      description: >-
        Specify the unique ID or API name of the function. You can obtain the
        function ID or API name using the [Functions
        API](functions.yaml#$.paths./settings/functions.get).
      required: true
      schema:
        type: string
        example: '4361080000002307599'
        maxLength: 255
        oneOf:
          - x-zs-$id: FunctionIdentifierById
            description: Numeric identifier of the function.
            allOf:
              - type: string
                format: int64
                minLength: 5
                maxLength: 19
                pattern: ^[0-9]+$
                description: Numeric identifier of the function.
                x-zs-$ref:
                  resource: functions
                  origins:
                    - operationId: getFunctions
                      propertyId: FunctionsId
          - x-zs-$id: FunctionIdentifierByApiName
            description: API name of the function.
            allOf:
              - type: string
                pattern: ^[A-Za-z][A-Za-z0-9_-]*$
                maxLength: 100
                description: API name of the function.
                x-zs-$ref:
                  resource: functions
                  origins:
                    - operationId: getFunctions
                      propertyId: FunctionsApiName
    ParamQueryPerPage:
      name: per_page
      in: query
      description: >
        Specify the maximum number of functions to retrieve per page. This value
        also determines the number of functions returned when the corresponding
        **page_token** is used. You cannot use this parameter with the
        **page_token** parameter.


        **Possible Values:** 1 to 200.


        **Default Value:** 200.
      required: false
      schema:
        type: integer
        format: int32
        minimum: 1
    ParamQueryPageToken:
      name: page_token
      in: query
      description: >-
        The token to retrieve functions beyond the first 2000 records. Use the
        **next_page_token** or **previous_page_token** value from the previous
        response to retrieve the next or previous set of functions,
        respectively. The API returns the same number of functions as the
        **per_page** value used in the request that generated the token. If
        **page_token** is specified along with **page** or **per_page**, the
        **page_token** value takes precedence.
      required: false
      schema:
        type: string
        maxLength: 1000
  securitySchemes:
    OAuth2:
      type: oauth2
      description: Authenticates API requests using the OAuth 2.0 authorization framework.
      flows:
        authorizationCode:
          authorizationUrl: https://accounts.zoho.com/oauth/v2/auth
          tokenUrl: https://accounts.zoho.com/oauth/v2/token
          refreshUrl: https://accounts.zoho.com/oauth/v2/token
          scopes:
            ZohoCRM.settings.functions.ALL: >-
              Grants create, read, update, and delete access to Zoho CRM
              function settings.
            ZohoCRM.settings.functions.READ: Grants read access to Zoho CRM function settings.
            ZohoCRM.settings.functions.CREATE: Grants create access to Zoho CRM function settings.
            ZohoCRM.settings.functions.UPDATE: Grants update access to Zoho CRM function settings.
            ZohoCRM.settings.functions.DELETE: Grants delete access to Zoho CRM function settings.
