      security:
        - OAuth2:
            - ZohoCRM.settings.functions.READ
  /settings/functions/__schemas/categories:
    get:
      summary: Function Categories
      description: >
        To retrieve all the
        [Function](functions.yaml#$.paths./settings/functions.get) categories
        supported by the current Zoho CRM account and indicate whether each
        category is available for use.


        Different Zoho CRM editions and enabled features support different
        Function categories. Instead of assuming that a category is available,
        you can use this API to:


        - Discover all the Function categories supported for the current CRM
        account.

        - Check whether a Function category can be used before creating or
        updating a Function.


        For example, if a customer's Zoho CRM edition does not support the
        **Signals** Function category, the response shows that the category is
        unavailable.
      operationId: getCategories
      responses:
        '200':
          description: >-
            Returns the list of function categories configured in the Zoho CRM
            organization.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetcategoriesResponse200'
              examples:
                Success200:
                  summary: Successful Retrieval of Function Categories
                  value:
                    categories:
                      - category: Button
                        allowed: true
                      - category: Automation
                        allowed: true
                      - category: Schedule
                        allowed: true
                      - category: Related List
                        allowed: true
                      - category: Standalone
                        allowed: true
                      - category: Signals
                        allowed: true
                  description: >-
                    Shows a successful response containing a list of function
                    categories, including **Button**, **Automation**,
                    **Schedule**, **Related List**, and **Standalone**, each
                    with an **allowed** indicator.
          headers:
            X-API-CREDITS-REMAINING:
              schema:
                type: string
                format: int64
                description: >
                  Present when >=50% of base daily credits (excluding add-on
                  credits) are consumed. Value is total remaining credits
                  including add-on credits for the rolling 24-hour window.
              required: false
        '400':
          description: >-
            Bad request received by the server. **Resolution:** The request
            structure must be corrected before resubmitting.
          content:
            application/json:
              schema:
                description: >-
                  Represents the error response returned when the request
                  contains invalid or malformed parameters.
                oneOf:
                  - $ref: '#/components/schemas/ErrorResponseNoClientPortalSupport'
                  - $ref: '#/components/schemas/ErrorResponseFeatureNotSupported'
                x-zs-$id: GetcategoriesError400
              examples:
                ApiNotSupportedResponse1:
                  summary: API_NOT_SUPPORTED Error for Client Portal User
                  value:
                    code: API_NOT_SUPPORTED
                    details:
                      unsupported_login_user_type: Client Portal User
                    message: api not supported for client portal user
                    status: error
                  description: >-
                    Shows the error response returned when a Client Portal User
                    attempts to call this API, which is not supported for that
                    user type.
                FeatureNotSupportedResponse1:
                  summary: FEATURE_NOT_SUPPORTED Error for Unlicensed Feature Access
                  value:
                    code: FEATURE_NOT_SUPPORTED
                    details: {}
                    message: Your License does not support this feature
                    status: error
                  description: >-
                    Shows the error response returned when the CRM
                    organization's license does not include support for the
                    requested feature.
          headers:
            X-API-CREDITS-REMAINING:
              schema:
                type: string
                format: int64
                description: >
                  Present when >=50% of base daily credits (excluding add-on
                  credits) are consumed. Value is total remaining credits
                  including add-on credits for the rolling 24-hour window.
              required: false
        '403':
          description: >-
            Permission denied to retrieve function schema categories.
            **Resolution:** The CRM administrator must grant the required
            permission to the user's profile.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/NoDevPermissionError'
                  - $ref: '#/components/schemas/UserEmailNotConfirmedError'
                x-zs-$id: GetcategoriesError403
              examples:
                NoPermissionResponse1:
                  summary: NO_PERMISSION Error — Permission Denied
                  value:
                    code: NO_PERMISSION
                    details:
                      permissions:
                        - Crm_Implied_Advanced_Dev_Access
                    message: permission denied
                    status: error
                  description: >-
                    Shows the 403 error response when the requesting user lacks
                    the Crm_Implied_Advanced_Dev_Access permission required to
                    retrieve function schema categories.
                UserEmailNotConfirmedError:
                  summary: NO_PERMISSION Error — User Email Not Confirmed
                  value:
                    code: NO_PERMISSION
                    details: {}
                    message: User email not confirmed
                    status: error
                  description: >-
                    Demonstrates the 403 response returned when the requesting
                    user's email address has not been confirmed, resulting in a
                    NO_PERMISSION error with an empty details object.
          headers:
            X-API-CREDITS-REMAINING:
              schema:
                type: string
                format: int64
                description: >
                  Present when >=50% of base daily credits (excluding add-on
                  credits) are consumed. Value is total remaining credits
                  including add-on credits for the rolling 24-hour window.
              required: false
      security:
        - OAuth2:
            - ZohoCRM.settings.functions.READ
components:
  schemas:
    PostfunctionsResponse207:
      type: object
      additionalProperties: false
      description: >-
        Represents a partial success response for function creation, where the
        function was created as a draft but the publish step failed due to
        compilation errors in the uploaded code.
      properties:
        functions:
          type: array
          description: Contains the partial success details for the created function.
          items:
            $ref: '#/components/schemas/FunctionsNested207'
          maxItems: 1
      required:
        - functions
      x-zs-$id: PostfunctionsResponse207
    FxCreateLimitError:
      type: object
      additionalProperties: false
      description: >-
        Represents the error response returned when the function creation limit
        has been reached in the Zoho CRM organization.
      properties:
        code:
          type: string
          description: >-
            Represents the error code identifying the type of limit error.
            Possible values: **LIMIT_EXCEEDED** - Indicates that the function
            creation limit has been exceeded.
          enum:
            - LIMIT_EXCEEDED
        details:
          type: object
          additionalProperties: false
          description: >-
            Represents the details of the error, including the limit value that
            was exceeded.
          properties:
            limit:
              type: integer
              format: int32
              description: >-
                Represents the maximum number of functions allowed in the Zoho
                CRM organization.
          required:
            - limit
        message:
          type: string
          description: >-
            Represents the error message describing the limit violation.
            Possible values: **function creation limit reached** - Indicates
            that the maximum number of functions allowed in the organization has
            been reached.
          enum:
            - function creation limit reached
        status:
          type: string
          description: >-
            Represents the status of the error response. Possible values:
            **error** - Indicates the request resulted in an error.
          enum:
            - error
      required:
        - code
        - details
        - message
        - status
      title: Error Response Core
      x-zs-$id: FxCreateLimitError
    AttachedFileNotSupportedError:
      type: object
      additionalProperties: false
      description: >-
        Represents the error response returned when an attached file type is not
        supported by Zoho CRM.
      properties:
        code:
          type: string
          description: >-
            Represents the error code identifying the type of validation
            failure. Possible values: **INVALID_DATA** - Indicates the attached
            file type is not valid.
          enum:
            - INVALID_DATA
        details:
          type: object
          additionalProperties: false
          description: >-
            Represents the additional details about the validation failure,
            including information on supported file formats.
          properties:
            supported_formats:
              type: array
              description: >-
                Represents the list of file formats supported for attachment in
                Zoho CRM.
              items:
                type: string
                description: >-
                  Represents a file format extension that is permitted for
                  attachment.
                maxLength: 255
              maxItems: 25
          required:
            - supported_formats
        message:
          type: string
          description: >-
            Represents the error message for the attached-file-not-supported
            condition. Possible values: **attached file is not permitted** - The
            attached file type is not allowed.
          enum:
            - attached file is not permitted
        status:
          type: string
          description: >-
            Represents the status of the error response. Possible values:
            **error** - Indicates that the request resulted in an error.
          enum:
            - error
      required:
        - code
        - details
        - message
        - status
      title: Error Response Core
      x-zs-$id: AttachedFileNotSupportedError
    FunctionsNested:
      type: object
      additionalProperties: false
      description: >-
        Schema for creating or updating a function. Contains the function
        metadata such as name, API name, description, runtime, category, and
        optional inline script code.
      x-zs-$id: FunctionsNested
      properties:
        _code:
          type:
            - string
            - 'null'
          description: >-
            Inline function script content as a string. Applicable only for
            Deluge runtime — Deluge functions are auto-published when this field
            is set. For non-Deluge runtimes (Java, NodeJS, Python), upload a ZIP
            code package via the `code` multipart form field instead.
          maxLength: 2097152
          minLength: 1
        api_name:
          type:
            - string
            - 'null'
          description: The unique programmatic identifier for the function.
          maxLength: 100
          minLength: 3
          pattern: ^[A-Za-z][A-Za-z0-9_-]*$
        name:
          type:
            - string
            - 'null'
          description: The display name of the function.
          maxLength: 100
          minLength: 3
          pattern: ^[A-Za-z][A-Za-z0-9 _-]*$
        description:
          type:
            - string
            - 'null'
          description: The description of the function's purpose and behavior.
          maxLength: 3000
        runtime:
          type:
            - string
            - 'null'
          description: >-
            The execution runtime environment for the function. Possible values:
            **Deluge 1.0** - Deluge scripting language, version 1.0. **Java 8**
            - Java language runtime, version 8. **Java 17** - Java language
            runtime, version 17. **NodeJS 8** - Node.js runtime, version 8.
            **NodeJS 22** - Node.js runtime, version 22. **Python 3.12** -
            Python language runtime, version 3.12.
          enum:
            - Deluge 1.0
            - Java 8
            - Java 17
            - NodeJS 8
            - NodeJS 22
            - Python 3.12
        category:
          type:
            - string
            - 'null'
          description: >-
            The trigger category that determines how and when the function
            executes. Possible values: **Button** - Triggered when a user clicks
            a button on a record. **Automation** - Triggered by an automated
            Workflow or rule. **Schedule** - Triggered at a scheduled time.
            **Related List** - Triggered from a related list on a record.
            **Standalone** - Executed independently without a specific trigger
            context. **Signals** - Triggered by a signal event. **Validation
            Rule** - Triggered as part of a Validation Rule evaluation.
            **Dynamic** - Triggered dynamically based on runtime conditions.
          enum:
            - Button
            - Automation
            - Schedule
            - Related List
            - Standalone
            - Signals
            - Validation Rule
            - Dynamic
    GetfunctionResponse200:
      type: object
      additionalProperties: false
      description: >-
        The successful response returned when retrieving one or more functions
        from the Zoho CRM organization.
      properties:
        functions:
          type: array
          description: The list of function metadata objects returned by the operation.
          items:
            $ref: '#/components/schemas/GETFunctionsNested'
          maxItems: 200
      required:
        - functions
      x-zs-$id: GetfunctionResponse200
    PostfunctionsResponse201:
      type: object
      additionalProperties: false
      description: >-
        The response returned after a function is successfully created in the
        Zoho CRM organization. For Deluge functions, the function is
        auto-published upon creation. For non-Deluge functions that include a
        publish object, the function is created and published; omitting the
        publish object keeps the function as a draft.
      properties:
        functions:
          type: array
          description: >-
            The list of function creation result objects returned by the
            operation.
          items:
            $ref: '#/components/schemas/FunctionsNested1'
          maxItems: 1
      required:
        - functions
      x-zs-$id: PostfunctionsResponse201
    PublishNested:
      type: object
      additionalProperties: false
      description: >-
        Specify the publish configuration for the function. For **Deluge**
        functions, specifying this object records the changelog for the
        published revision. Deluge functions are published automatically
        regardless of whether this object is specified or not. For **Java,
        Node.js**, and **Python** functions, specifying this object attempts to
        publish the function after it is created. If this object is omitted, the
        function is created in the unpublished state. In that case, use the
        [Publish Function
        API](functions.yaml#$.paths./settings/functions/{fxIdentifier}/actions/publish.post)
        to publish the function later.
      x-zs-$id: PublishNested
      properties:
        changelog:
          type:
            - string
            - 'null'
          description: >-
            Changelog message for revision tracking. For Deluge functions,
            recorded as part of the auto-publish. For non-Deluge functions,
            recorded when the publish step succeeds.
          maxLength: 250
    DetailsNested:
      type: object
      additionalProperties: false
      description: >-
        Details object returned in success responses, containing the unique
        identifier of the affected resource.
      x-zs-$id: DetailsNested
      properties:
        id:
          type: string
          description: >-
            Represents the unique identifier of the function that was created,
            updated, or deleted.
          format: int64
    DetailsNested207:
      type: object
      additionalProperties: false
      description: >-
        Represents the details returned in a 207 partial success response,
        including the function ID and any compilation errors that caused the
        publish step to fail.
      properties:
        id:
          type: string
          description: >-
            Represents the unique identifier of the function that was created or
            updated.
          format: int64
        errors:
          $ref: '#/components/schemas/CodeFileNonDelugeCompilationErrors'
      required:
        - id
      x-zs-$id: DetailsNested207
    FunctionsNested207:
      type: object
      additionalProperties: false
      description: >-
        Represents a partial-success result item within a 207 multi-status
        response, indicating that the function draft was saved but the publish
        step failed due to compilation errors.
      properties:
        code:
          type: string
          description: >-
            Represents the operation result code for the partial-success
            response, indicating whether the draft save and publish steps
            succeeded or failed.
          maxLength: 255
        details:
          $ref: '#/components/schemas/DetailsNested207'
        message:
          type: string
          description: >-
            Represents the message describing the outcome of the operation,
            indicating that the draft was saved but the publish step failed.
          maxLength: 255
        status:
          type: string
          description: >-
            Represents the overall status of the operation, reflecting the
            outcome of the draft save step regardless of whether the subsequent
            publish step succeeded.
          maxLength: 255
      x-zs-$id: FunctionsNested207
    FxAssociationError:
