                  summary: Invalid query error for invalid operator
                  value:
                    code: INVALID_QUERY
                    details:
                      reason: invalid operator found
                      column_name: First_Name
                      operator: '>'
                    message: Invalid query formed
                    status: error
                  description: >-
                    Shows an INVALID_QUERY error response with the column_name
                    and operator details for an invalid operator.
                InvalidQueryIsNotNullOperator:
                  summary: Invalid query error with is not null operator
                  value:
                    code: INVALID_QUERY
                    details:
                      reason: invalid operator found
                      column_name: textj8
                      operator: is not null
                    message: Invalid query formed
                    status: error
                  description: >-
                    Shows an INVALID_QUERY error response for an is not null
                    operator on a field that does not support it.
                InvalidQueryIsNullOperator:
                  summary: Invalid query error with is null operator
                  value:
                    code: INVALID_QUERY
                    details:
                      reason: invalid operator found
                      column_name: textj8
                      operator: is null
                    message: Invalid query formed
                    status: error
                  description: >-
                    Shows an INVALID_QUERY error response for an is null
                    operator on a field that does not support it.
