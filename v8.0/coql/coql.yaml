                  summary: Invalid query error for invalid alias
                  value:
                    code: INVALID_QUERY
                    details:
                      column_name: First_Name
                      alias: Last_Name
                    message: >-
                      column name or property name given in select columns
                      without alias name cannot be an alias name for other
                      select columns
                    status: error
                  description: >-
                    Shows an INVALID_QUERY error response with the column_name
