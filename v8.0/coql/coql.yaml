            ZohoCRM.modules.Tasks.READ: Read access to Tasks module
            ZohoCRM.modules.Events.READ: Read access to Events module
            ZohoCRM.modules.Calls.READ: Read access to Calls module
            ZohoCRM.modules.Products.READ: Read access to Products module
            ZohoCRM.modules.Vendors.READ: Read access to Vendors module
            ZohoCRM.modules.Campaigns.READ: Read access to Campaigns module
            ZohoCRM.modules.Cases.READ: Read access to Cases module
            ZohoCRM.modules.Solutions.READ: Read access to Solutions module
            ZohoCRM.modules.Quotes.READ: Read access to Quotes module
            ZohoCRM.modules.Invoices.READ: Read access to Invoices module
            ZohoCRM.modules.Forecasts.READ: Read access to Forecasts module
            ZohoCRM.modules.Activities.READ: Read access to Activities module
            ZohoCRM.modules.Notes.READ: Read access to Notes module
            ZohoCRM.modules.Attachments.READ: Read access to Attachments module
            ZohoCRM.modules.custom.READ: Read access to Custom modules
            ZohoCRM.modules.Pricebooks.READ: Read access to Pricebooks module
            ZohoCRM.modules.Salesorders.READ: Read access to Salesorders module
            ZohoCRM.modules.Purchaseorders.READ: Read access to Purchaseorders module
            ZohoCRM.modules.Custom.READ: Read access to Custom modules
            ZohoCRM.settings.fields.READ: Read access to Fields
  schemas:
    CoqlFieldSchema:
      type: object
      description: >-
        Represents a CRM field configuration in the Zoho CRM organization,
        including its metadata, display properties, and operational settings.
      properties:
        associated_module:
          oneOf:
            - type: object
              x-zs-$id: AssociatedModule
              description: >-
                Represents the associated module details for the field, such as
                a subform module.
              properties:
                module:
                  $ref: '#/components/schemas/ModuleName'
                id:
                  $ref: '#/components/schemas/Id'
              required:
                - module
                - id
              additionalProperties: false
            - $ref: '#/components/schemas/TypeNull'
          description: >-
            Represents the module associated with this field, such as a subform
            module.
        webhook:
          type: boolean
          description: >-
            Indicates whether webhook notifications are enabled for changes to
            this field.

            Possible values:

            **true** - Webhook notifications are enabled for this field.

            **false** - Webhook notifications are not enabled for this field.
          example: false
        operation_type:
          type: object
          additionalProperties: false
          description: >-
            Represents the set of operation types permitted for this field
            across different contexts.
          properties:
            web_update:
              type: boolean
              description: >-
                Indicates whether the field can be updated via the web
                interface.

                Possible values:

                **true** - The field can be updated via the web interface.

                **false** - The field cannot be updated via the web interface.
              example: false
            api_create:
              type: boolean
              description: >-
                Indicates whether the field can be set during record creation
                via the API.

                Possible values:

                **true** - The field can be set when creating records via the
                API.

                **false** - The field cannot be set during API record creation.
              example: false
            web_create:
              type: boolean
              description: >-
                Indicates whether the field can be set during record creation
                via the web interface.

                Possible values:

                **true** - The field can be set when creating records via the
                web interface.

                **false** - The field cannot be set during web record creation.
              example: false
            api_update:
              type: boolean
              description: |-
                Indicates whether the field can be updated via the API.
                Possible values:
                **true** - The field can be updated via the API.
                **false** - The field cannot be updated via the API.
              example: false
          required:
            - web_update
            - api_create
            - web_create
            - api_update
        colour_code_enabled_by_system:
          type: boolean
          description: >-
            Indicates whether a color code is enabled by the system for this
            field.

            Possible values:

            **true** - A color code is enabled by the system.

            **false** - No color code is enabled by the system.
          example: false
        field_label:
          type: string
          description: >-
            Represents the display label of the field as shown in the Zoho CRM
            interface.
          example: Last Name
          maxLength: 50
        tooltip:
          oneOf:
            - type: object
              x-zs-$id: ToolTip
              description: >-
                Represents the tooltip configuration for the field, including
                icon name and display text.
              properties:
                name:
                  type: string
                  description: Represents the icon name used for the tooltip.
                  example: info_icon
                  maxLength: 25
                value:
                  type: string
                  description: >-
                    Represents the tooltip text displayed to users when they
                    hover over the field.
                  example: Last Name
                  maxLength: 255
              required:
                - name
                - value
              additionalProperties: false
            - $ref: '#/components/schemas/TypeNull'
          description: >-
            Represents the tooltip configuration for the field, if a tooltip is
            configured to provide additional guidance to users.
        display_format_properties:
          oneOf:
            - type: object
              x-zs-$id: DisplayFormatProperties
              description: >-
                Represents the additional display format properties for the
                field.
              properties:
                split:
                  type: number
                  description: >-
                    Represents the split configuration value for a phone-type
                    field.
                  example: 3
                  format: int32
                radio_display_type:
                  type: string
                  description: Represents the display type for a radio button field.
                  example: all
                  maxLength: 25
              required: []
              additionalProperties: false
            - $ref: '#/components/schemas/TypeNull'
          description: >-
            Represents the additional display format properties for the field,
            applicable when the field has specific rendering requirements.
        type:
          type: string
          description: Represents the field type classification.
          example: user
          maxLength: 25
        field_read_only:
          type: boolean
          description: |-
            Indicates whether the field is configured as read-only.
            Possible values:
            **true** - The field is read-only and cannot be modified.
            **false** - The field can be modified.
          example: false
        customizable_properties:
          oneOf:
            - type: array
              x-zs-$id: CustomizableProperties
              description: >-
                Represents the list of property names that can be customized for
                this field.
              items:
                type: string
                description: Represents a customizable property name for the field.
                example: mandatory
                maxLength: 50
              maxItems: 100
            - $ref: '#/components/schemas/TypeNull'
          description: >-
            Represents the list of properties for this field that can be
            customized by the organization.
        display_label:
          type: string
          description: Represents the display label shown to users for this field.
          example: Last Name
          maxLength: 50
        read_only:
          type: boolean
          description: |-
            Indicates whether the field is read-only in the current context.
            Possible values:
            **true** - The field is read-only.
            **false** - The field is editable.
          example: false
        association_details:
          oneOf:
            - type: object
              x-zs-$id: AssociationDetails
              description: >-
                Represents the association details for a lookup-type field,
                including the related and lookup field configurations.
              properties:
                related_field:
                  type: object
                  description: Represents the related field linked to this association.
                  properties:
                    api_name:
                      $ref: '#/components/schemas/ApiName'
                    id:
                      $ref: '#/components/schemas/Id'
                  required:
                    - api_name
                    - id
                  additionalProperties: false
                lookup_field:
                  type: object
                  description: >-
                    Represents the configuration of the lookup field in this
                    association.
                  properties:
                    api_name:
                      $ref: '#/components/schemas/ApiName'
                    id:
                      $ref: '#/components/schemas/Id'
                  required:
                    - api_name
                    - id
                  additionalProperties: false
              required:
                - related_field
                - lookup_field
              additionalProperties: false
            - $ref: '#/components/schemas/TypeNull'
          description: >-
            Represents the association configuration for lookup-type fields,
            including the related field and lookup field details.
        multi_module_lookup:
          oneOf:
            - type: object
              x-zs-$id: MultiModuleLookup
              description: >-
                Represents the multi-module lookup configuration, including
                display label, API name, and associated modules.
              properties:
                display_label:
                  type: string
                  description: >-
                    Represents the display label of the multi-module lookup
                    field.
                  example: Appointments
                  maxLength: 50
                api_name:
                  $ref: '#/components/schemas/ApiName'
                modules:
                  type: array
                  description: >-
                    Represents the list of modules that this multi-module lookup
                    field can reference.
                  items:
                    type: object
                    description: >-
                      Represents a module entry available for selection in the
                      multi-module lookup.
                    properties:
                      api_name:
                        $ref: '#/components/schemas/ApiName'
                      module_name:
                        type: string
                        description: >-
                          Represents the API name of the module available in the
                          multi-module lookup.
                        example: Leads
                        maxLength: 50
                      id:
                        $ref: '#/components/schemas/Id'
                    required:
                      - api_name
                      - module_name
                      - id
                    additionalProperties: false
                  maxItems: 100
              required: []
              additionalProperties: false
            - $ref: '#/components/schemas/TypeNull'
          description: >-
            Represents the multi-module lookup configuration for the field,
            applicable when the field can reference records from multiple
            modules.
        id:
          $ref: '#/components/schemas/Id'
        created_time:
          oneOf:
            - type: string
              description: >-
                Represents the creation timestamp of the field, in ISO 8601
                date-time format.
              example: '2023-10-03T12:00:00+05:30'
              x-zs-$id: CreatedTime
              format: date-time
            - $ref: '#/components/schemas/TypeNull'
          description: Represents the creation timestamp of the field, in ISO 8601 format.
        filterable:
          type: boolean
          description: |-
            Indicates whether the field can be used as a filter criterion.
            Possible values:
            **true** - The field supports filtering.
            **false** - The field does not support filtering.
          example: true
        visible:
          type: boolean
          description: >-
            Indicates whether the field is visible to users in the Zoho CRM
            interface.

            Possible values:

            **true** - The field is visible.

            **false** - The field is hidden.
          example: true
        view_type:
          type: object
          description: >-
            Represents the view type configuration for the field, indicating
            which form views support this field.
          properties:
            view:
              type: boolean
              description: |-
                Indicates whether the field is visible in the detail view.
                Possible values:
                **true** - The field is visible in the detail view.
                **false** - The field is not visible in the detail view.
              example: true
            edit:
              type: boolean
              description: |-
                Indicates whether the field is available in the edit form.
                Possible values:
                **true** - The field is available in the edit form.
                **false** - The field is not available in the edit form.
              example: true
            quick_create:
              type: boolean
              description: >-
                Indicates whether the field is available in the quick-create
                form.

                Possible values:

                **true** - The field is available in the quick-create form.

                **false** - The field is not available in the quick-create form.
              example: true
            create:
              type: boolean
              description: |-
                Indicates whether the field is available in the create form.
                Possible values:
                **true** - The field is available in the create form.
                **false** - The field is not available in the create form.
              example: true
          required:
            - view
            - edit
            - quick_create
            - create
          additionalProperties: false
        separator:
          type: boolean
          description: >-
            Indicates whether the field acts as a visual separator in the
            layout.

            Possible values:

            **true** - The field is a separator.

            **false** - The field is a regular field.
          example: false
        searchable:
          type: boolean
          description: |-
            Indicates whether the field can be used in search queries.
            Possible values:
            **true** - The field is searchable.
            **false** - The field is not searchable.
          example: true
        history_tracking_enabled:
          type: boolean
          description: |-
            Indicates whether history tracking is enabled for this field.
            Possible values:
            **true** - History tracking is enabled.
            **false** - History tracking is not enabled.
          example: false
        external:
          oneOf:
            - type: object
              x-zs-$id: External
              description: >-
                Represents the external field configuration, including
                visibility and type.
              properties:
                show:
                  type: boolean
                  description: |-
                    Indicates whether the external field is visible.
                    Possible values:
                    **true** - The external field is visible.
                    **false** - The external field is hidden.
                  example: true
                type:
                  type: string
                  description: >-
                    Represents the type of external field association, such as
                    **org** for organization-level fields.
                  example: org
                  maxLength: 50
              required:
                - show
                - type
              additionalProperties: false
            - $ref: '#/components/schemas/TypeNull'
          description: >-
            Represents the external field configuration, applicable when the
            field is associated with an external system.
        api_name:
          $ref: '#/components/schemas/ApiName'
        parent_field:
          oneOf:
            - type: object
              x-zs-$id: ParentField
              description: >-
                Represents the parent field configuration, including API name,
                display name, and ID.
              properties:
                api_name:
                  $ref: '#/components/schemas/ApiName'
                name:
                  type: string
                  description: Represents the display name of the parent field.
                  example: Address 1 - Coordinates
                  maxLength: 50
                id:
                  $ref: '#/components/schemas/Id'
              required:
                - api_name
                - name
                - id
              additionalProperties: false
            - $ref: '#/components/schemas/TypeNull'
          description: >-
            Represents the parent field configuration, applicable when this
            field is a sub-field within a parent field such as an address.
        unique:
          type: object
          description: Represents the uniqueness constraint configuration for the field.
          properties:
            case_sensitive:
              type: boolean
              description: >-
                Indicates whether the uniqueness check for this field is
                case-sensitive.

                Possible values:

                **true** - The uniqueness check is case-sensitive.

                **false** - The uniqueness check is case-insensitive.
              example: false
          required: []
          additionalProperties: false
        enable_colour_code:
          type: boolean
          description: |-
            Indicates whether color coding is enabled for this field.
            Possible values:
            **true** - Color coding is enabled for the field.
            **false** - Color coding is not enabled for the field.
          example: false
        child_fields:
          oneOf:
            - type: array
              x-zs-$id: ChildFields
              description: >-
                Represents the list of child field entries within an address
                field configuration.
              items:
                type: object
                description: >-
                  Represents a child field entry within an address field
                  configuration.
                properties:
                  sequence_number:
                    type: number
                    description: >-
                      Represents the display sequence of the child field within
                      the address field.
                    example: 1
                    format: int32
                  field:
                    type: object
                    description: Represents the configuration details of the child field.
                    properties:
                      api_name:
                        $ref: '#/components/schemas/ApiName'
                      name:
                        type: string
                        description: Represents the name of the child field.
                        example: Address 1 - City
                        maxLength: 100
                      id:
                        $ref: '#/components/schemas/Id'
                    required:
                      - api_name
                      - name
                      - id
                    additionalProperties: false
                required:
                  - sequence_number
                  - field
                additionalProperties: false
              maxItems: 100
            - $ref: '#/components/schemas/TypeNull'
          description: >-
            Represents the list of child fields associated with this field,
            applicable for address-type fields.
        pick_list_values:
          oneOf:
            - type: array
              x-zs-$id: PickListValues
              description: >-
                Represents the list of picklist options configured for the
                field.
              items:
                type: object
                description: Represents a picklist option for the field.
                properties:
                  display_value:
                    type: string
                    description: >-
                      Represents the display label shown to users for this
                      picklist option.
                    example: Option 1
                    maxLength: 120
                  sequence_number:
                    type: number
                    description: >-
                      Represents the display order of the picklist option in the
                      list.
                    example: 1
                    format: int32
                  reference_value:
                    type: string
                    description: >-
                      Represents the reference value used internally for this
                      picklist option.
                    example: option_1
                    maxLength: 120
                  colour_code:
                    type: string
                    description: >-
                      Represents the color code associated with this picklist
                      option.
                    example: '#FF5733'
                    maxLength: 20
                  actual_value:
                    type: string
                    description: Represents the actual stored value of the picklist option.
                    example: Option 1
                    maxLength: 120
                  id:
                    $ref: '#/components/schemas/Id'
                  type:
                    type: string
                    description: >-
                      Represents the type classification of this picklist
                      option.
                    example: standard
                    maxLength: 50
                required:
                  - display_value
                  - sequence_number
                  - reference_value
                  - actual_value
                  - id
                  - type
                additionalProperties: false
              maxItems: 100
            - $ref: '#/components/schemas/TypeNull'
          description: >-
            Represents the list of available picklist option values for the
            field, if the field is of a picklist type.
        system_mandatory:
          type: boolean
          description: >-
            Indicates whether the field is marked as mandatory by the system.

            Possible values:

            **true** - The field is system-mandatory and cannot be set as
            optional.

            **false** - The field is not system-mandatory.
          example: false
        private:
          oneOf:
            - type: object
              x-zs-$id: PrivateField
              description: Represents the privacy settings for the field.
              properties:
                restricted:
                  type: boolean
                  description: |-
                    Indicates whether access to the private field is restricted.
                    Possible values:
                    **true** - Access to the field is restricted.
                    **false** - Access to the field is not restricted.
                  example: false
                type:
                  type: string
                  description: Represents the privacy level of the field, such as **High**.
                  example: High
                  maxLength: 25
                export:
                  type: boolean
                  description: >-
                    Indicates whether the private field can be included in data
                    exports.

                    Possible values:

                    **true** - The field can be exported.

                    **false** - The field is restricted from exports.
                  example: false
              required:
                - restricted
                - type
                - export
              additionalProperties: false
            - $ref: '#/components/schemas/TypeNull'
          description: >-
            Represents the privacy configuration for the field, if the field is
            marked as private.
        virtual_field:
          type: boolean
          description: >-
            Indicates whether the field is a virtual field that is computed and
            not stored directly.

            Possible values:

            **true** - The field is virtual.

            **false** - The field is a stored field.
          example: false
        json_type:
          type: string
          description: Represents the JSON data type used to represent the field value.
          example: string
          maxLength: 25
        crypt:
          oneOf:
            - type: object
              x-zs-$id: CryptDetails
              description: >-
                Represents the encryption settings for the field, including mode
                and status.
              properties:
                mode:
                  type: string
                  description: Represents the encryption mode applied to this field.
                  example: encryption
                  maxLength: 25
                encrypt_case:
                  oneOf:
                    - type: string
                      x-zs-$id: EncryptCase
                      description: >-
                        Represents the encryption case configuration applied to
                        this field.
                      example: lowercase
                      maxLength: 25
                    - $ref: '#/components/schemas/TypeNull'
                  description: >-
                    Represents the encryption case configuration applied to this
                    field.
                status:
                  type: number
                  description: Represents the current encryption status of the field.
                  example: 1
                  format: int32
              required:
                - mode
                - status
              additionalProperties: false
            - $ref: '#/components/schemas/TypeNull'
          description: >-
            Represents the encryption configuration for the field, if data
            encryption is enabled.
        range:
          oneOf:
            - type: object
              x-zs-$id: RangeDetails
              description: >-
                Represents the allowed numeric range configuration for the
                field.
              properties:
                from:
                  type: number
                  description: Represents the minimum allowed value for the field.
                  example: 1
                  format: double
                to:
                  type: number
                  description: Represents the maximum allowed value for the field.
                  example: 100
                  format: double
              required:
                - from
                - to
              additionalProperties: false
            - $ref: '#/components/schemas/TypeNull'
          description: >-
            Represents the allowed value range for the field, applicable when
            the field enforces a numeric range.
        created_source:
          type: string
          description: >-
            Represents the source through which this field was added to the
            organization.
          example: api
          maxLength: 60
        display_type:
          type: number
          description: Represents the display type identifier for the field.
          example: 1
          format: int32
        ui_type:
          type: number
          description: >-
            Represents the UI type identifier that determines how the field is
            rendered in the user interface.
          example: 1
          format: int32
        modified_time:
          oneOf:
            - type: string
              x-zs-$id: ModifiedTime
              description: >-
                Represents the date and time when the field was last modified,
                in ISO 8601 date-time format.
              example: '2023-10-05T15:30:00+05:30'
              format: date-time
            - $ref: '#/components/schemas/TypeNull'
          description: >-
            Represents the date and time when the field was last modified, in
            ISO 8601 format.
        public:
          type: boolean
          description: |-
            Indicates whether the field is publicly accessible.
            Possible values:
            **true** - The field is publicly accessible.
            **false** - The field is not publicly accessible.
          example: true
        email_parser:
          type: object
          description: >-
            Represents the email parser configuration for the field, indicating
            which operations are supported through the email parser.
          properties:
            fields_update_supported:
              type: boolean
              description: >-
                Indicates whether the field can be updated through the email
                parser.

                Possible values:

                **true** - Field updates are supported by the email parser.

                **false** - Field updates are not supported by the email parser.
              example: true
            record_operations_supported:
              type: boolean
              description: >-
                Indicates whether record operations are supported for this field
                through the email parser.

                Possible values:

                **true** - Record operations are supported by the email parser.

                **false** - Record operations are not supported by the email
                parser.
              example: true
          required:
            - fields_update_supported
            - record_operations_supported
          additionalProperties: false
        currency:
          oneOf:
            - type: object
              x-zs-$id: CurrencyDetails
              description: >-
                Represents the currency settings for the field, including
                precision and rounding options.
              properties:
                rounding_option:
                  type: string
                  description: >-
                    Represents the rounding option applied to the currency
                    value.
                  example: Round Off
                  maxLength: 25
                precision:
                  type: number
                  description: >-
                    Represents the number of decimal places used for the
                    currency value.
                  format: int32
                  example: 2
              required: []
              additionalProperties: false
            - $ref: '#/components/schemas/TypeNull'
          description: >-
            Represents the currency configuration for the field, applicable when
            the field stores monetary values.
        custom_field:
          type: boolean
          description: >-
            Indicates whether the field is a custom field created by the
            organization.

            Possible values:

            **true** - The field is a custom field.

            **false** - The field is a default system field.
          example: true
        lookup:
          oneOf:
            - type: object
              x-zs-$id: LookupDetails
              description: >-
                Represents the lookup field configuration, including the
                referenced module and filter settings.
              properties:
                display_label:
                  type: string
                  description: Represents the display label of the related lookup field.
                  example: Related List Label 1
                  maxLength: 50
                revalidate_filter_during_edit:
                  type: boolean
                  description: >-
                    Indicates whether the lookup filter criteria are revalidated
                    when the record is edited.

                    Possible values:

                    **true** - The filter is revalidated during edits.

                    **false** - The filter is not revalidated during edits.
                  example: true
                api_name:
                  $ref: '#/components/schemas/ApiName'
                module:
                  type: object
                  description: >-
                    Represents the module from which the lookup field retrieves
                    its records.
                  properties:
                    api_name:
                      $ref: '#/components/schemas/ApiName'
                    crypt:
                      type: boolean
                      description: |-
                        Indicates whether the data in the module is encrypted.
                        Possible values:
                        **true** - The module data is encrypted.
                        **false** - The module data is not encrypted.
                      example: false
                    id:
                      $ref: '#/components/schemas/Id'
                  required:
                    - api_name
                    - crypt
                    - id
                  additionalProperties: false
                id:
                  $ref: '#/components/schemas/Id'
                query_details:
                  type: object
                  description: >-
                    Represents the system query configuration applied to the
                    lookup field.
                  properties:
                    system_query_id:
                      oneOf:
                        - type: string
                          x-zs-$id: SystemQueryId
                          description: >-
                            Represents the system-generated query ID for the
                            lookup field.
                          example: '4832675000000850800'
                          format: int64
                          maxLength: 30
                        - $ref: '#/components/schemas/TypeNull'
                      description: >-
                        Represents the system-generated query ID for this lookup
                        field.
                    query_id:
                      type: string
                      description: >-
                        Represents the query ID associated with this lookup
                        field.
                      example: '4832675000000850800'
                      format: int64
                      maxLength: 30
                  required:
                    - system_query_id
                  additionalProperties: false
              required: []
              additionalProperties: false
            - $ref: '#/components/schemas/TypeNull'
          description: >-
            Represents the lookup configuration for the field, applicable when
            the field references records from another module.
        hipaa_compliance:
          oneOf:
            - type: object
              x-zs-$id: HipaaCompliance
              description: Represents the HIPAA compliance settings for the field.
              properties:
                restricted_in_export:
                  type: boolean
                  description: >-
                    Indicates whether the field value is restricted from being
                    exported due to HIPAA compliance.

