openapi: 3.1.0
info:
  title: Coql
  description: >-
    COQL (CRM Object Query Language) is a SQL-like query language that enables
    retrieving records from Zoho CRM modules using SELECT queries.


    This API allows executing COQL queries with support for WHERE conditions,
    JOIN operations, GROUP BY, ORDER BY, aggregate functions, and nested
    subqueries. 

    Like SQL that uses table names, Query API uses module and field API names in
    the query.

    While Search API allows module-specific search, Query API allows you to
    retrieve records from cross-modules that are linked via lookup fields,
    thereby establishing joins.
  version: '8'
servers:
  - url: https://zohoapis.{dc}/crm/{version}
    description: Represents the Local Zoho Server URL
    variables:
      dc:
        enum:
          - com
          - eu
          - in
          - cn
          - au
        default: com
        description: >-
          The top-level domain for the Zoho CRM API server, which varies by data
          center region.
      version:
        default: v8
        description: Represents the API Version
paths:
  /coql:
    post:
      operationId: executeCOQLQuery
      summary: Retrieve records using a COQL query
      description: >-
        To retrieve records from one or more Zoho CRM modules using a COQL
        SELECT query, with support for cross-module joins, aggregate functions,
        and flexible filtering.
