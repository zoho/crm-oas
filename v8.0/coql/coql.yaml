        '204':
          description: >-
            Indicates that the COQL query executed successfully but returned no
            matching records.
        '400':
          description: >-
            The COQL query is invalid, contains syntax errors, or references
            unsupported data. Resolution: Ensure the query uses valid module and
            field API names, supported operators, and correct COQL syntax.
          content:
            application/json:
              schema:
                x-zs-$id: COQLErrorResponse
                oneOf:
                  - type: object
                    x-zs-$id: COQLSyntaxErrorResponse
                    title: SyntaxError
                    description: >-
                      Represents a syntax error response returned when the COQL
                      query contains invalid syntax.
                    additionalProperties: false
                    properties:
                      code:
                        type: string
                        description: >-
                          Represents the error code for a syntax error in the
                          COQL query. Always returned in the response.

                          Possible values:

                          **SYNTAX_ERROR** - A syntax error was detected in the
                          COQL query.
                        enum:
                          - SYNTAX_ERROR
                      details:
                        oneOf:
                          - type: object
                            additionalProperties: false
                            x-zs-$id: COQLSyntaxErrorDetailsEmpty
                            description: >-
                              Represents an empty details object returned when
                              no additional context is available for the syntax
                              error.
                          - type: object
                            additionalProperties: false
                            x-zs-$id: COQLSyntaxErrorDetailsClause
                            description: >-
                              Represents the syntax error details when the error
                              occurred in a specific COQL clause.
                            properties:
                              clause:
                                type: string
                                description: >-
                                  Represents the COQL clause where the syntax
                                  error occurred.
                                maxLength: 1000
                            required:
                              - clause
                          - type: object
                            additionalProperties: false
                            x-zs-$id: COQLSyntaxErrorDetailsLocation
                            description: >-
                              Represents the syntax error details with the exact
                              location (line and column) and nearby context.
                            properties:
                              line:
                                type: integer
                                format: int32
                                description: >-
                                  Represents the line number in the query where
                                  the syntax error occurred.
                              column:
                                type: integer
                                format: int32
                                description: >-
                                  Represents the column number in the query
                                  where the syntax error occurred.
                              near:
                                type: string
                                description: >-
                                  Represents the text fragment near the syntax
                                  error location.
                                maxLength: 1000
                            required:
                              - line
                              - column
                              - near
                          - type: object
                            additionalProperties: false
                            x-zs-$id: COQLSyntaxErrorDetailsOperator
                            description: >-
                              Represents the syntax error details for an
                              unsupported operator in the COQL query.
                            properties:
                              operator:
                                type: string
                                description: >-
                                  Represents the unsupported operator used in
                                  the COQL query.
                                maxLength: 100
                            required:
                              - operator
                          - type: object
                            additionalProperties: false
                            x-zs-$id: COQLSyntaxErrorDetailsNear
                            description: >-
                              Represents the syntax error details when only the
                              surrounding text context is available.
                            properties:
                              near:
                                type: string
                                description: >-
                                  Represents the text fragment near the syntax
                                  error in the query.
                                maxLength: 1000
                            required:
                              - near
                        description: >-
                          Represents the details of the syntax error, including
                          the location or context of the error.
                      message:
                        type: string
                        description: >-
                          Represents the error message describing the syntax
                          error. Always returned in the response.
                        maxLength: 2000
                      status:
                        type: string
                        description: >-
                          Represents the status of the response. Always returned
                          in the response.

                          Possible values:

                          **error** - The request failed due to an error.
                        enum:
                          - error
                    required:
                      - code
                      - details
                      - message
                      - status
                  - type: object
                    x-zs-$id: COQLLimitExceededResponse
                    title: LimitExceeded
                    description: >-
                      Represents a limit exceeded error response returned when
                      the COQL query exceeds a permitted limit.
                    additionalProperties: false
                    properties:
                      code:
                        type: string
                        description: >-
                          Represents the error code for a limit exceeded error.
                          Always returned in the response.

                          Possible values:

                          **LIMIT_EXCEEDED** - The query exceeds the permitted
                          limit.
                        enum:
                          - LIMIT_EXCEEDED
                      details:
                        type: object
                        description: >-
                          Represents additional details about the limit exceeded
                          error.
                        additionalProperties: true
                      message:
                        type: string
                        description: >-
                          Represents the error message describing the limit
                          exceeded error. Always returned in the response.
                        maxLength: 2000
                      status:
                        type: string
                        description: >-
                          Represents the status of the response. Always returned
                          in the response.

                          Possible values:

                          **error** - The request failed due to an error.
                        enum:
                          - error
                    required:
                      - code
                      - details
                      - message
                      - status
                  - type: object
                    x-zs-$id: COQLInvalidQueryResponse
                    title: InvalidQuery
                    description: >-
                      Represents an invalid query error response returned when
                      the COQL query is structurally invalid.
                    additionalProperties: false
                    properties:
                      code:
                        type: string
                        description: >-
                          Represents the error code for an invalid query error.
                          Always returned in the response.

                          Possible values:

                          **INVALID_QUERY** - The COQL query is structurally
                          invalid.
                        enum:
                          - INVALID_QUERY
                      details:
                        oneOf:
                          - type: object
                            x-zs-$id: COQLInvalidColumnDetails
                            description: >-
                              Represents the invalid query error details for an
                              invalid column reference.
                            additionalProperties: false
                            properties:
                              column_name:
                                type: string
                                description: >-
                                  Represents the API name of the field with an
                                  invalid column reference.
                                maxLength: 150
                            required:
                              - column_name
                          - type: object
                            x-zs-$id: COQLInvalidColumnLimitDetails
                            description: >-
                              Represents the invalid query error details when a
                              column exceeds its allowed limit.
                            additionalProperties: false
                            properties:
                              limit:
                                type: string
                                maxLength: 150
                                description: >-
                                  Represents the maximum allowed limit for the
                                  column in the COQL query, if applicable.
                            required:
                              - limit
                          - type: object
                            x-zs-$id: COQLInvalidOffsetDetails
                            description: Invalid offset details
                            additionalProperties: false
                            properties:
                              offset:
                                type: string
                                maxLength: 150
                                description: The invalid offset value used in the query
                            required:
                              - offset
                          - type: object
                            x-zs-$id: COQLInvalidColumnClauseDetails
                            description: >-
                              Represents the invalid query error details for an
                              invalid column in a specific clause.
                            additionalProperties: false
                            properties:
                              column_name:
                                type: string
                                description: >-
                                  Represents the API name of the field with
                                  invalid data in the query.
                                maxLength: 150
                              clause:
                                type: string
                                maxLength: 150
                                description: >-
                                  Represents the COQL clause associated with the
                                  invalid column.
                            required:
                              - column_name
                              - clause
                          - type: object
                            x-zs-$id: COQLInvalidModuleDetails
                            description: >-
                              Represents the invalid query error details for an
                              invalid module reference.
                            additionalProperties: false
                            properties:
                              module:
                                type: string
                                description: >-
                                  Represents the API name of the module
                                  referenced in an invalid module context.
                                maxLength: 150
                            required:
                              - module
                          - type: object
                            x-zs-$id: COQLInvalidCVIDDetails
                            description: >-
                              Represents the invalid query error details for an
                              invalid Custom View ID.
                            additionalProperties: false
                            properties:
                              cvid:
                                type: string
                                description: >-
                                  Represents the invalid Custom View ID
                                  referenced in the COQL query.
                                maxLength: 150
                            required:
                              - cvid
                          - type: object
                            x-zs-$id: COQLInvalidOperatorDetails
                            description: >-
                              Represents the invalid query error details for an
                              unsupported operator used with a field.
                            additionalProperties: false
                            properties:
                              reason:
                                type: string
                                description: >-
                                  Represents a description of the reason the
                                  operator is invalid for the column.
                                maxLength: 1000
                              column_name:
                                type: string
                                description: >-
                                  Represents the API name of the column involved
                                  in the invalid operator error.
                                maxLength: 500
                              operator:
                                type: string
                                description: >-
                                  Represents the operator that is invalid for
                                  the specified column in the COQL query.

                                  Possible values:

                                  **>** - Greater than.

                                  **<** - Less than.

                                  **>=** - Greater than or equal to.

                                  **<=** - Less than or equal to.

                                  **=** - Equal to.

                                  **!=** - Not equal to.

                                  **is null** - Checks if the value is null.

                                  **is not null** - Checks if the value is not
                                  null.
                                enum:
                                  - '>'
                                  - <
                                  - '>='
                                  - <=
                                  - '='
                                  - '!='
                                  - is null
                                  - is not null
                            required:
                              - reason
                              - column_name
                              - operator
                          - type: object
                            x-zs-$id: COQLInvalidAliasDetails
                            description: >-
                              Represents the invalid query error details for an
                              invalid column alias.
                            additionalProperties: false
                            properties:
                              column_name:
                                type: string
                                description: >-
                                  Represents the API name of the column with an
                                  invalid alias.
                                maxLength: 150
                              alias:
                                type: string
                                description: >-
                                  Represents the invalid alias name used in the
                                  COQL query.
                                maxLength: 1000
                            required:
                              - alias
                              - column_name
                          - type: object
                            x-zs-$id: COQLInvalidQueryEmptyDetails
                            description: >-
                              Represents an empty details object returned when
                              no additional context is available for the invalid
                              query error.
                            additionalProperties: false
                          - type: object
                            x-zs-$id: COQLInvalidQueryCriteriaDetails
                            description: >-
                              Represents the invalid query error details for
                              unsupported criteria.
                            additionalProperties: false
                            properties:
                              cv_criteria:
                                type: boolean
                                description: >-
                                  Indicates whether the invalid query involves
                                  Custom View criteria.

                                  Possible values:

                                  **true** - Custom View criteria are involved
                                  in the error.

                                  **false** - Custom View criteria are not
                                  involved.
                              column_name:
                                type: string
                                description: >-
                                  Represents the API name of the field with
                                  invalid criteria in the query.
                                maxLength: 150
                              value:
                                type: string
                                description: >-
                                  Represents the value used in the unsupported
                                  criteria that caused the error.
                                maxLength: 500
                              operator:
                                type: string
                                description: >-
                                  Represents the operator used in the
                                  unsupported criteria.

                                  Possible values:

                                  **=** - Equal to.

                                  **!=** - Not equal to.

                                  **>** - Greater than.

                                  **<** - Less than.

                                  **>=** - Greater than or equal to.

                                  **<=** - Less than or equal to.

                                  **like** - Matches a pattern.

                                  **not like** - Does not match a pattern.

                                  **in** - Matches any value in a list.

                                  **not in** - Does not match any value in a
                                  list.

                                  **between** - Matches values within a range.

                                  **is null** - Checks if the value is null.

                                  **is not null** - Checks if the value is not
                                  null.
                                enum:
                                  - '='
                                  - '!='
                                  - '>'
                                  - <
                                  - '>='
                                  - <=
                                  - like
                                  - not like
                                  - in
                                  - not in
                                  - between
                                  - is null
                                  - is not null
                            required:
                              - cv_criteria
                              - column_name
                              - value
                              - operator
                          - type: object
                            x-zs-$id: COQLInvalidQuerySubQueryDetails
                            description: >-
                              Represents the invalid query error details when a
                              subquery returns incompatible values for the
                              operator used.
                            additionalProperties: false
                            properties:
                              sub_query_sequence:
                                type: integer
                                format: int32
                                description: >-
                                  Represents the sequence number of the subquery
                                  that returned incompatible values.
                              operator:
                                type: string
                                description: >-
                                  Represents the operator that is incompatible
                                  with subqueries that return multiple values.

                                  Possible values:

                                  **=** - Equal to.

                                  **!=** - Not equal to.

                                  **>** - Greater than.

                                  **<** - Less than.

                                  **>=** - Greater than or equal to.

