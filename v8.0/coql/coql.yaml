                SyntaxErrorInvalidClause:
                  summary: Syntax error response for invalid clause
                  value:
                    code: SYNTAX_ERROR
                    details:
                      clause: where
                    message: missing clause
                    status: error
                  description: Shows a SYNTAX_ERROR error response with the clause detail.
                SyntaxErrorLocation:
                  summary: Syntax error response with location details
                  value:
                    code: SYNTAX_ERROR
                    details:
                      line: 1
                      column: 15
                      near: FROM
                    message: unexpected token
                    status: error
                  description: >-
                    Shows a SYNTAX_ERROR error response with the line, column,
                    and near text location details.
                SyntaxErrorOperator:
                  summary: Syntax error response for unsupported operator
                  value:
                    code: SYNTAX_ERROR
                    details:
                      operator: not
                    message: operator not supported
                    status: error
                  description: >-
                    Shows a SYNTAX_ERROR error response with the operator detail
                    for an unsupported operator.
                SyntaxErrorQueryNotSupported:
                  summary: Syntax error response for unsupported query
                  value:
                    code: SYNTAX_ERROR
                    details: {}
                    message: given coql query not supported
                    status: error
                  description: >-
                    Shows a SYNTAX_ERROR error response for a COQL query that is
                    not supported.
                SyntaxErrorNear:
                  summary: Syntax error response with near text context
                  value:
                    code: SYNTAX_ERROR
                    details:
                      near: where
                    message: error occured while parsing the query
                    status: error
                  description: >-
                    Shows a SYNTAX_ERROR error response with only the near text
                    context.
