      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              description: Represents the request body for the COQL query execution.
              properties:
                select_query:
                  type: string
                  description: >-
                    Specify the COQL SELECT query to retrieve records. The query
                    must reference module and field API names.
                  maxLength: 2147483647
                include_meta:
                  type: array
                  description: >-
                    Specify the list of metadata types to include in the
                    response.

                    Possible values:

                    **fields** - Includes field metadata for the SELECT columns
                    in the response.
                  maxItems: 1
                  minItems: 1
                  items:
                    type: string
                    description: >-
                      Specifies a metadata type to include in the response.

                      Possible values:

                      **fields** - Includes field metadata for the SELECT
                      columns in the response.
                    enum:
                      - fields
              required:
                - select_query
            examples:
              GetLeads:
                summary: COQL query to retrieve Leads records
                value:
                  select_query: >-
                    select Last_Name, First_Name from Leads where Last_Name =
                    'Smith'
                description: >-
                  Shows a COQL query request to retrieve the Last_Name and
                  First_Name fields from the Leads module with a WHERE
                  condition.
              GetLeadsWithFieldMetadata:
                summary: COQL query to retrieve Leads records with field metadata
                value:
                  select_query: select Last_Name from Leads where Last_Name = 'TestLead'
                  include_meta:
                    - fields
                description: >-
                  Shows a COQL query request with the include_meta parameter set
                  to fields to retrieve field metadata for each SELECT column.
        required: true
        description: >-
          The request body must contain a **select_query** field with a valid
          COQL SELECT statement.
      responses:
        '200':
          description: >-
            Returns the matching records for the COQL query, along with
            pagination details.
          content:
            application/json:
              schema:
                type: object
                x-zs-$id: COQLSuccessResponse
                description: >-
                  Represents the response body for a successful COQL query,
                  containing the matching records and pagination metadata.
                additionalProperties: false
                properties:
                  data:
                    type: array
                    description: >-
                      Represents the list of records returned by the COQL query.
                      Always returned in the response.
                    minItems: 1
                    maxItems: 200
                    items:
                      type: object
                      description: >-
                        Represents a single record returned by the COQL query,
                        with field API names as keys and their corresponding
                        values as values.
                      additionalProperties: true
                  info:
                    type: object
                    description: >-
                      Represents the pagination metadata for the query result.
                      Always returned in the response.
                    additionalProperties: false
                    properties:
                      count:
                        type: integer
                        format: int32
                        description: >-
                          Represents the number of records returned in the
                          current response. Always returned in the response.
                      more_records:
                        type: boolean
                        description: >-
                          Indicates whether additional records matching the
                          query are available beyond the current page. Always
                          returned in the response.

                          Possible values:

                          **true** - More records are available. Use LIMIT and
                          OFFSET to paginate.

                          **false** - All matching records are included in this
                          response.
                    required:
                      - count
                      - more_records
                  fields:
                    type: object
                    description: >-
                      Represents the field metadata for each column specified in
                      the SELECT clause. Keys are field API names and values are
                      field configuration objects. Returned only when **fields**
                      is specified in the **include_meta** request body
                      parameter.
                    additionalProperties:
                      $ref: '#/components/schemas/CoqlFieldSchema'
                required:
                  - data
                  - info
              examples:
                SuccessResponse:
                  summary: >-
                    Successful response with matching records and pagination
                    metadata
                  value:
                    data:
                      - Last_Name: Smith
                        First_Name: John
                    info:
                      count: 1
                      more_records: false
                  description: >-
                    Shows a successful response with the data array containing
                    matching records and the info object with pagination
                    details.
                SuccessResponseWithFieldsMeta:
                  summary: >-
                    Successful response with records and field metadata for
                    SELECT columns
                  value:
                    data:
                      - Last_Name: TestLead
                        id: '4413054000000682520'
                    fields:
                      Last_Name:
                        webhook: true
                        operation_type:
                          web_update: true
                          api_create: true
                          web_create: true
                          api_update: true
                        colour_code_enabled_by_system: false
                        field_label: Last Name
                        tooltip: null
