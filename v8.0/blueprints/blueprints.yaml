            (`ZohoCRM.settings.blueprint.ALL` or
            `ZohoCRM.settings.blueprint.UPDATE`) to update blueprints.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoPermissionError'
              examples:
                NoPermissionResponse:
                  summary: >-
                    Error — permission denied for Blueprint update
                    (NO_PERMISSION)
