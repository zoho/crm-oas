    put:
      summary: Update a single Blueprint by ID
      description: >-
        Updates a specific Blueprint configuration in your Zoho CRM organization
        by specifying its unique Blueprint ID in the request URL. This operation
        applies only to blueprints that have never been activated. If the
        Blueprint has been activated, the operation returns a NOT_ALLOWED error.
      x-zs-llm-description: >-
        Update a specific blueprint by its blueprintId. CRITICAL RESTRICTION:
        Returns NOT_ALLOWED for any blueprint that has ever been activated, even
        after deactivation. Only usable on blueprints that have never been
        published. For published blueprints, use the dependent clone pattern
        instead.
      operationId: putBlueprintId
      parameters:
        - name: blueprintId
          in: path
          description: >-
            Specify the unique ID of the Blueprint to update. Any Blueprint ID
            included in the request body is ignored. Use the [Get Blueprint by
            ID](blueprints.yaml#$.paths./settings/blueprints.get) to retrieve
            the Blueprint ID.
          required: true
          style: simple
          explode: false
          schema:
            type: string
            format: int64
            pattern: ^[0-9]+
            minLength: 1
            maxLength: 19
        - $ref: '#/components/parameters/ParamHeaderXZohoService'
      requestBody:
        description: >-
          The request body must contain a **blueprints** array with one
          Blueprint object.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SingleBlueprintPutRequestBody'
            examples:
              SamplePutRequest:
                summary: >-
                  Sample request body for updating a single Blueprint via PUT
                  /settings/blueprints/{blueprintId}
                value:
                  blueprints:
                    - id: '123456789012345678'
                      owners:
                        - resources:
                            - id: '1231231231'
                          type: users
                      criteria:
                        comparator: greater_than
                        field:
                          api_name: Annual_Revenue
                          id: '111111000000004782'
                        type: value
                        value: '100'
                      chart_data:
                        nodes:
                          - position_x: 330
                            position_y: 340
                            state:
                              api_name: State_1
                          - position_x: 880
                            position_y: 320
                            state:
                              api_name: State_2
                        connections:
                          - from:
                              end_point:
                                position_x: 0.5
                                position_y: 1
                                direction_x: 0
                                direction_y: 1
                              state:
                                api_name: State_1
                            api_name: Transition_1
                            to:
                              end_point:
                                position_x: 0
                                position_y: 0.5
                                direction_x: 0
                                direction_y: 0
                              state:
                                api_name: State_2
                            transition:
                              api_name: Transition_1
                              name: Transition 1
                      continuous: false
                      name: Lead Bp 1
                      description: Test description
                      connections:
                        - id: '32123123123123'
                          _delete: null
                          to_state:
                            name: Contacted
                            api_name: State_2
                          api_name: Transition_1
                          transitions:
                            api_name: Transition_1
                            name: Transition 1
                            precedence: 1
                          from_state:
                            name: '-None-'
                            api_name: State_1
            x-zs-llm-examples:
              - SamplePutRequest
      responses:
        '200':
          description: >-
            Confirms that Zoho CRM updated the Blueprint successfully and
            returns the ID of the updated Blueprint.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PutSingleBlueprintResponse'
              examples:
                Success200:
                  summary: Blueprint updated successfully
                  value:
                    blueprints:
                      - code: SUCCESS
                        details:
                          id: '111111000000091059'
                        message: Blueprint updated successfully
                        status: success
          headers:
            X-API-CREDITS-REMAINING:
              schema:
                type: string
                format: int64
                description: >
                  Present when >=50% of base daily credits (excluding add-on
                  credits) are consumed. Value is total remaining credits
                  including add-on credits for the rolling 24-hour window.
                pattern: ^[0-9]+$
                minLength: 1
                maxLength: 19
              required: false
        '400':
          description: >-
            The request could not be processed due to one or more Blueprint
            validation errors.

            **Resolution:** Transitions must belong to the same module and
            layout as the Blueprint, each state must be connected to at least
            one other state through a valid transition, and all required fields
            must be provided in the request body.
