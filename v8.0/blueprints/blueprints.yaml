                            - $ref: '#/components/schemas/DisconnectedStateError'
                            - $ref: '#/components/schemas/InvalidCriteriaUpdateError'
                            - $ref: '#/components/schemas/DuplicateBlueprintNameError'
                            - $ref: '#/components/schemas/OrphanConnectionError'
                            - $ref: '#/components/schemas/OrphanStateConnectionError'
                            - $ref: '#/components/schemas/InvalidDataTypeError'
                            - $ref: >-
                                #/components/schemas/FieldMaxLengthInvalidDataError
                            - $ref: '#/components/schemas/InvalidDataRegexError'
                            - $ref: '#/components/schemas/MandatoryFieldNotFoundError'
                            - $ref: >-
                                #/components/schemas/InvalidDataWithSupportedValuesError
                            - $ref: '#/components/schemas/NotAllowedLayoutUpdateError'
                            - $ref: '#/components/schemas/NotAllowedFieldUpdateError'
                            - $ref: '#/components/schemas/NotAllowedModuleUpdateError'
                            - $ref: >-
                                #/components/schemas/NotAllowedPipelineUpdateError
                            - $ref: >-
                                #/components/schemas/PipelineEmptyInvalidDataError
                            - $ref: '#/components/schemas/InvalidStateConnectionError'
                            - $ref: '#/components/schemas/SpecialCharacterNameError'
                            - $ref: >-
                                #/components/schemas/TransitionAlreadyAssociatedError
                            - $ref: >-
                                #/components/schemas/TransitionDifferentModuleError
                            - $ref: >-
                                #/components/schemas/WidgetDuringFieldContinuousBlueprintError
                            - $ref: >-
                                #/components/schemas/DependentMismatchPipelineStateError
                            - $ref: >-
                                #/components/schemas/ConvertActionTerminalStateError
                            - $ref: >-
                                #/components/schemas/DeletedConnectionNotUpdatedError
                        maxItems: 100
