openapi: 3.1.0
info:
  title: Blueprints
  description: >
    [Blueprint](https://help.zoho.com/portal/en/kb/crm/process-management/blueprint/articles/blueprint-an-overview)
    is a Zoho CRM feature that automates business processes by modeling them as
    a directed graph of states and transitions, ensuring records advance through
    each state only after required fields are completed and approvals are
    obtained. This API enables developers to perform lifecycle operations on
    blueprint configurations, including creating, retrieving, updating,
    activating, deactivating, cloning, and reordering blueprints, as well as
    managing their constituent states and transitions.
  version: '8'
servers:
  - url: https://zohoapis.{dc}/crm/{version}
    description: API Server URL
    variables:
      dc:
        description: API Server URL TLD
        default: com
        enum:
          - eu
          - com
          - au
          - in
          - jp
          - cn
          - ca
      version:
        description: API Version
        default: v8
paths:
  /settings/blueprints:
    get:
      summary: Get blueprints
      description: >-
        To retrieve the list of blueprints configured in your Zoho CRM
        organization.
      x-zs-llm-description: Retrieve a list of all blueprint configurations
      operationId: getBlueprint
      parameters:
        - $ref: '#/components/parameters/ParamHeaderXZohoService'
        - $ref: '#/components/parameters/ParamQueryPage'
        - $ref: '#/components/parameters/ParamQueryPerPage'
        - $ref: '#/components/parameters/ParamQueryModule'
        - $ref: '#/components/parameters/ParamQueryStatus'
        - $ref: '#/components/parameters/ParamQueryLayoutId'
        - $ref: '#/components/parameters/ParamQuerySortBy'
        - $ref: '#/components/parameters/ParamQuerySortOrder'
      responses:
        '200':
          description: >-
            Returns the list of blueprints retrieved from your Zoho CRM
            organization.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetBlueprintListResponse'
              examples:
                Success200:
                  summary: Successful retrieval of Blueprint list
                  value:
                    blueprints:
                      - layout:
                          api_name: Standard__s
                          name: Standard
                          id: '111111000000003620'
                        status: Draft
                        field:
                          api_name: Lead_Status
                          field_label: Lead Status
                          id: '111111000000004796'
                        continuous: false
                        module:
                          api_name: Leads
                          id: '111111000000002624'
                          precedence: 1
                        name: Lead Bp 1
                        modified_by:
                          name: Kandasamy
                          id: '111111000000057846'
                        id: '111111000000091059'
                        created_by:
                          name: Kandasamy
                          id: '111111000000057846'
                        pipeline:
                          name: Stage
                          id: '111111000000128001'
                      - layout:
                          api_name: Standard__s
                          name: Standard
                          id: '111111000000003620'
                        status: Draft
                        field:
                          api_name: Lead_Status
                          field_label: Lead Status
                          id: '111111000000004796'
                        continuous: false
                        module:
                          api_name: Leads
                          id: '111111000000002624'
                          precedence: 1
                        name: Lead Bp 4
                        modified_by:
                          name: Kandasamy
                          id: '111111000000057846'
                        id: '111111000000092001'
                        created_by:
                          name: Kandasamy
                          id: '111111000000057846'
                        pipeline:
                          name: Stage
                          id: '111111000000128001'
                    info:
                      per_page: 200
                      count: 3
                      page: 1
                      more_records: false
          headers:
            X-API-CREDITS-REMAINING:
              schema:
                type: string
                format: int64
                description: >
                  Present when >=50% of base daily credits (excluding add-on
                  credits) are consumed. Value is total remaining credits
                  including add-on credits for the rolling 24-hour window.
                pattern: ^[0-9]+$
                minLength: 1
                maxLength: 19
              required: false
        '400':
          description: >-
            The request contains an invalid parameter value.

            **Resolution:** The query parameter values provided in the request
            must be valid. Verify that the **module**, **status**, **sort_by**,
            **sort_order**, and **layout_id** parameter values match the
            accepted values for this endpoint.
          content:
            application/json:
              schema:
                x-zs-$id: GetsettingsblueprintResponse400
                oneOf:
                  - $ref: '#/components/schemas/InvalidModuleParameterError'
                  - $ref: '#/components/schemas/InvalidStatusParameterError'
                  - $ref: '#/components/schemas/InvalidSortByParameterError'
                  - $ref: '#/components/schemas/InvalidSortOrderParameterError'
                  - $ref: '#/components/schemas/ErrorResponseFilterInvalid'
                  - $ref: '#/components/schemas/RequiredHeaderMissingError'
                  - $ref: '#/components/schemas/InvalidModuleIdError'
              examples:
                InvalidModuleResponse1:
                  summary: INVALID_MODULE error for invalid module name
                  value:
                    code: INVALID_MODULE
                    details:
                      param_name: module
                    message: the module given seems to be invalid
                    status: error
                InvalidDataResponse1:
                  summary: INVALID_DATA error for invalid status parameter
                  value:
                    code: INVALID_DATA
                    details:
                      param_name: status
                    message: the status given seems to be invalid
                    status: error
                InvalidDataResponse2:
                  summary: INVALID_DATA error for invalid filter parameter
                  value:
                    code: INVALID_DATA
                    details:
                      param_name: filter
                    message: the filter given seems to be invalid
                    status: error
                InvalidSortByResponse:
                  summary: INVALID_DATA error for invalid sort_by value
                  value:
                    code: INVALID_DATA
                    details:
                      param_name: sort_by
                    message: the sort by value given seems to be invalid
                    status: error
                InvalidSortOrderResponse:
                  summary: INVALID_DATA error for invalid sort_order value
                  value:
                    code: INVALID_DATA
                    details:
                      param_name: sort_order
                    message: the sort order given seems to be invalid
                    status: error
                RequiredHeaderMissingResponse1:
                  summary: >-
                    REQUIRED_HEADER_MISSING error for missing X-ZOHO-SERVICE
                    header
                  value:
                    code: REQUIRED_HEADER_MISSING
                    details:
                      header_name: X-CRM-ORG
                    message: One of the expected headers is missing
                    status: error
                InvalidDataModuleIdResponse:
                  summary: INVALID_DATA error for invalid module ID value
                  value:
                    code: INVALID_DATA
                    details:
                      resource_path_index: 2
                    message: the id given seems to be invalid
                    status: error
                InvalidDataPageResponse:
                  summary: INVALID_DATA error for invalid page parameter value
                  value:
                    code: INVALID_DATA
                    details:
                      param_name: page
                    message: the value given is invalid
                    status: error
          headers:
            X-API-CREDITS-REMAINING:
              schema:
                type: string
                format: int64
                description: >
                  Present when >=50% of base daily credits (excluding add-on
                  credits) are consumed. Value is total remaining credits
                  including add-on credits for the rolling 24-hour window.
                pattern: ^[0-9]+$
                minLength: 1
                maxLength: 19
              required: false
        '403':
          description: >-
            Permission denied to retrieve blueprints.

            **Resolution:** The CRM administrator must grant the required
            permission to the user's profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoPermissionError'
              examples:
                NoPermissionResponse:
                  summary: NO_PERMISSION error for Blueprint read access
                  value:
                    code: NO_PERMISSION
                    details:
                      permissions:
                        - Crm_Implied_Manage_Workflow
                    message: permission denied
                    status: error
          headers:
            X-API-CREDITS-REMAINING:
              schema:
                type: string
                format: int64
                description: >
                  Present when >=50% of base daily credits (excluding add-on
                  credits) are consumed. Value is total remaining credits
                  including add-on credits for the rolling 24-hour window.
                pattern: ^[0-9]+$
                minLength: 1
                maxLength: 19
              required: false
      security:
        - OAuth2:
            - ZohoCRM.settings.blueprint.READ
    put:
      summary: Update Blueprints
      description: >-
        To update bulk Blueprint configurations. Each Blueprint in the
        `blueprints` array is replaced with the submitted definition. Use the
        [Get Blueprint by ID
        API](blueprints.yaml#$.paths./settings/blueprints.get) to retrieve the
        Blueprint ID. If the ID is not included in the URL, then it is mandatory
        to specify the ID in the request body. **Restriction:** Blueprints that
        have ever been published (activated) cannot be updated directly — even
        after deactivation. To modify a published Blueprint, clone it as a
        dependent draft (the source must be active and include `chart_data`),
        edit the draft, then activate it with `move_records` and `map_states`.
      x-zs-llm-description: >-
        Update multiple blueprint configurations in bulk. CRITICAL RESTRICTION:
        PUT is NOT allowed on blueprints that have ever been published
        (activated), even after deactivation - returns NOT_ALLOWED. This
        endpoint is only usable on blueprints that have never been activated. To
        modify a published blueprint, use the dependent clone pattern: clone as
        'dependent' (source must be active with chart_data), edit the draft
        clone, then activate it with move_records and map_states.
      operationId: putBlueprint
      parameters:
        - $ref: '#/components/parameters/ParamHeaderXZohoService'
      requestBody:
        description: >-
          Request body containing the list of blueprints to update. Each object
          in the `blueprints` array represents a complete Blueprint definition
          including its states, connections, transitions, owners, criteria, and
          pipeline configuration.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutBlueprintsBulkRequestBody'
            examples:
              SamplePutRequest:
                summary: Update Blueprint — sample request
                value:
                  blueprints:
                    - id: '123456789012345678'
                      owners:
                        - resources:
                            - id: '1231231231'
                          type: users
                      criteria:
                        comparator: greater_than
                        field:
                          api_name: Annual_Revenue
                          id: '111111000000004782'
                        type: value
                        value: '100'
                      chart_data:
                        nodes:
                          - position_x: 330
                            position_y: 340
                            state:
                              api_name: State_1
                          - position_x: 880
                            position_y: 320
                            state:
                              api_name: State_2
                        connections:
                          - from:
                              end_point:
                                position_x: 0.5
                                position_y: 1
                                direction_x: 0
                                direction_y: 1
                              state:
                                api_name: State_1
                            api_name: Transition_1
                            to:
                              end_point:
                                position_x: 0
                                position_y: 0.5
                                direction_x: 0
                                direction_y: 0
                              state:
                                api_name: State_2
                            transition:
                              api_name: Transition_1
                              name: Transition 1
                      continuous: false
                      name: Lead Bp 1
                      description: Test description
                      connections:
                        - id: '32123123123123'
                          _delete: null
                          to_state:
                            name: Contacted
                            api_name: State_2
                          api_name: Transition_1
                          transitions:
                            api_name: Transition_1
                            name: Transition 1
                            precedence: 1
                          from_state:
                            name: '-None-'
                            api_name: State_1
            x-zs-llm-examples:
              - SamplePutRequest
      responses:
        '200':
          description: >-
            All blueprints in the request were updated successfully. The
            response body contains the updated Blueprint records.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PutBlueprintListResponse'
              examples:
                Success200:
                  summary: All blueprints updated — 200 OK
                  value:
                    blueprints:
                      - code: SUCCESS
                        details:
                          id: '111111000000091059'
                        message: Blueprint updated successfully
                        status: success
                      - blueprints:
                          - code: SUCCESS
                            details:
                              id: '111111000000091020'
                            message: Blueprint updated successfully
                            status: success
          headers:
            X-API-CREDITS-REMAINING:
              schema:
                type: string
                format: int64
                description: >
                  Present when >=50% of base daily credits (excluding add-on
                  credits) are consumed. Value is total remaining credits
                  including add-on credits for the rolling 24-hour window.
                pattern: ^[0-9]+$
                minLength: 1
                maxLength: 19
              required: false
        '207':
          description: >-
            Some blueprints were updated successfully while others failed
            validation. The response body lists both successful updates and the
            corresponding validation errors for the failed blueprints.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PutBlueprintPartialResponse'
              examples:
                Success207:
                  summary: >-
                    Partial update — some blueprints updated, some failed — 207
                    Multi-Status
                  value:
                    blueprints:
                      - code: SUCCESS
                        details:
                          id: '111111000000091059'
                        message: Blueprint updated successfully
                        status: success
                      - code: DEPENDENT_MISMATCH
                        details:
                          api_name: connections
                          json_path: $.blueprints[0].chart_data.connections[0].transition
                          dependee:
                            api_name: Transition_1
                            json_path: >-
                              $.blueprints[0].chart_data.connections[0].transition
                        message: >-
                          The module or layout of this transition is different
                          from the blueprint
                        status: error
          headers:
            X-API-CREDITS-REMAINING:
              schema:
                type: string
                format: int64
                description: >
                  Present when >=50% of base daily credits (excluding add-on
                  credits) are consumed. Value is total remaining credits
                  including add-on credits for the rolling 24-hour window.
                pattern: ^[0-9]+$
                minLength: 1
                maxLength: 19
              required: false
        '400':
          description: >-
            The request body is invalid or contains Blueprint-level validation
            errors. No blueprints were updated. Check the response body for
            specific error codes and field paths.
          content:
            application/json:
              schema:
                x-zs-$id: PutsettingsblueprintResponse400
                oneOf:
                  - $ref: '#/components/schemas/RequiredHeaderMissingError'
                  - type: object
                    x-zs-$id: PutsettingsblueprintResponse400Blueprints
                    additionalProperties: false
                    description: >-
                      Wrapped error response containing a list of
                      Blueprint-level validation failures. Returned when one or
                      more blueprints in the request body failed validation due
                      to structural or data errors.
                    properties:
                      blueprints:
                        type: array
                        description: >-
                          Array of Blueprint-specific error objects, one per
                          Blueprint that failed validation. Each item identifies
                          the Blueprint and the error that prevented the update.
                          Maximum 100 items.
                        items:
                          oneOf:
                            - $ref: >-
                                #/components/schemas/DependentMismatchConnectionError
                            - $ref: '#/components/schemas/CrossModuleNodeMappingError'
                            - $ref: '#/components/schemas/DisconnectedStateError'
                            - $ref: '#/components/schemas/InvalidCriteriaUpdateError'
                            - $ref: '#/components/schemas/DuplicateBlueprintNameError'
                            - $ref: '#/components/schemas/OrphanConnectionError'
                            - $ref: '#/components/schemas/OrphanStateConnectionError'
                            - $ref: '#/components/schemas/InvalidBlueprintIdPutError'
                            - $ref: '#/components/schemas/DuplicateNameFieldError'
                            - $ref: '#/components/schemas/InvalidDataTypeError'
                            - $ref: >-
                                #/components/schemas/FieldMaxLengthInvalidDataError
                            - $ref: '#/components/schemas/InvalidDataRegexError'
                            - $ref: '#/components/schemas/MandatoryFieldNotFoundError'
                            - $ref: >-
                                #/components/schemas/InvalidDataWithSupportedValuesError
                            - $ref: >-
                                #/components/schemas/NotAllowedBulkBlueprintUpdateErrorItem
                            - $ref: >-
                                #/components/schemas/NotAllowedBulkBlueprintModuleUpdateErrorItem
                            - $ref: '#/components/schemas/NotAllowedLayoutUpdateError'
                            - $ref: '#/components/schemas/NotAllowedFieldUpdateError'
                            - $ref: '#/components/schemas/NotAllowedModuleUpdateError'
                            - $ref: >-
                                #/components/schemas/NotAllowedPipelineUpdateError
                            - $ref: >-
                                #/components/schemas/PipelineEmptyInvalidDataError
                            - $ref: '#/components/schemas/InvalidStateConnectionError'
                            - $ref: '#/components/schemas/SpecialCharacterNameError'
                            - $ref: >-
                                #/components/schemas/TransitionAlreadyAssociatedError
                            - $ref: >-
                                #/components/schemas/TransitionDifferentModuleError
                            - $ref: >-
                                #/components/schemas/NotAllowedSlaTerminalStateError
                            - $ref: >-
                                #/components/schemas/WidgetDuringFieldContinuousBlueprintError
                            - $ref: >-
                                #/components/schemas/DependentMismatchPipelineStateError
                            - $ref: >-
                                #/components/schemas/ConvertActionTerminalStateError
                            - $ref: >-
                                #/components/schemas/DeletedConnectionNotUpdatedError
                        maxItems: 100
                    required:
                      - blueprints
              examples:
                RequiredHeaderMissingResponse1:
                  summary: >-
                    Error — required header X-ZOHO-SERVICE is missing
                    (REQUIRED_HEADER_MISSING)
                  value:
                    code: REQUIRED_HEADER_MISSING
                    details:
                      header_name: X-CRM-ORG
                    message: One of the expected headers is missing
                    status: error
                NotAllowedResponse1:
                  summary: Error — published Blueprint cannot be updated (NOT_ALLOWED)
                  value:
                    blueprints:
                      - code: NOT_ALLOWED
                        details:
                          api_name: id
                          json_path: $.blueprints[0].id
                        message: Published blueprint cannot be updated
                        status: error
                NotAllowedResponse2:
                  summary: Error — module cannot be updated (NOT_ALLOWED)
                  value:
                    blueprints:
                      - code: NOT_ALLOWED
                        details:
                          api_name: id
                          json_path: $.blueprint[0].module.id
                        message: module cannot be updated
                        status: error
                DependentMismatchResponse1:
                  summary: >-
                    Error — transition module or layout mismatch
                    (DEPENDENT_MISMATCH)
                  value:
                    blueprints:
                      - code: DEPENDENT_MISMATCH
                        details:
                          dependee:
                            api_name: id
                            json_path: $.blueprints[0].id
                          api_name: id
                          json_path: >-
                            $.blueprints[0].chart_data.connections[0].transition.id
                        message: >-
                          The module or layout of this transition is different
                          from the blueprint
                        status: error
                DependentMismatchResponse2:
                  summary: Error — state module or layout mismatch (DEPENDENT_MISMATCH)
                  value:
                    blueprints:
                      - code: DEPENDENT_MISMATCH
                        details:
                          api_name: id
                          json_path: $.blueprints[0].chart_data.nodes[0].state.id
                        message: >-
                          The module or layout of this state is different from
                          the specified blueprint
                        status: error
                CannotProceedResponse1:
                  summary: Error — disconnected state node (CANNOT_PROCEED)
                  value:
                    blueprints:
                      - code: CANNOT_PROCEED
                        details:
                          api_name: nodes
                          json_path: $.blueprints[0].chart_data.nodes
                        message: given state is not connected to any other state
                        status: error
                InvalidDataResponse1:
                  summary: Error — invalid criteria data (INVALID_DATA)
                  value:
                    blueprints:
                      - code: INVALID_DATA
                        details:
                          expected_data_type: jsonobject
                          api_name: criteria
                          json_path: $.blueprints[0].criteria
                        message: invalid data
                        status: error
                InvalidDataResponse2:
                  summary: Error — Blueprint name already exists (INVALID_DATA)
                  value:
                    blueprints:
                      - code: DUPLICATE_DATA
                        details:
                          api_name: name
                          json_path: $.blueprints[0].name
                        message: There is already a blueprint with this name
                        status: error
                CannotProcessResponse1:
                  summary: >-
                    Error — deleted state with active transitions
                    (CANNOT_PROCESS)
                  value:
                    blueprints:
                      - code: CANNOT_PROCESS
                        details:
                          api_name: id
                          json_path: $.blueprints[0].states.id
                        message: >-
                          the state is deleted but transitions connecting the
                          state are not deleted
                        status: error
                CannotProcessResponse2:
                  summary: >-
                    Error — deleted transition leaving orphan state
                    (CANNOT_PROCESS)
                  value:
                    blueprints:
                      - code: CANNOT_PROCESS
                        details:
                          api_name: id
                          json_path: $.blueprints[0].connections[0].id
                        message: >-
                          the transition is deleted but the state only connected
                          by it is not deleted
                        status: error
                InvalidDataFromStateIdResponse:
                  summary: Error — invalid or mismatched from_state ID (INVALID_DATA)
                  value:
                    blueprints:
                      - code: INVALID_DATA
                        details:
                          api_name: id
                          json_path: $.blueprints[0].connections[0].from_state.id
                        message: >-
                          the given state is either invalid or does not belong
                          to this blueprint
                        status: error
                InvalidDataToStateIdResponse:
                  summary: >-
                    Error — to_state ID is invalid or does not belong to this
                    Blueprint (INVALID_DATA)
                  value:
                    blueprints:
                      - code: INVALID_DATA
                        details:
                          api_name: id
                          json_path: $.blueprints[0].connections[0].to_state.id
                        message: >-
                          the given state is either invalid or does not belong
                          to this blueprint
                        status: error
                InvalidDataResponse3:
                  summary: Error — invalid Blueprint ID (INVALID_DATA)
                  value:
                    blueprints:
                      - code: INVALID_DATA
                        details:
                          api_name: id
                          json_path: $.blueprints[0].id
                        message: the id given seems to be invalid
                        status: error
                DuplicateDataResponse1:
                  summary: Error — duplicate Blueprint name (DUPLICATE_DATA)
                  value:
                    blueprints:
                      - code: DUPLICATE_DATA
                        details:
                          api_name: name
                          json_path: >-
                            $.blueprints[0].chart_data.connections[0].transition.name
                        message: The data is already given in the name
                        status: error
                InvalidDataResponse4:
                  summary: Error — invalid data type for ID (INVALID_DATA)
                  value:
                    blueprints:
                      - code: INVALID_DATA
                        message: Invalid data type
                        details:
                          api_name: id
                          expected_data_type: bigint
                          json_path: $.blueprints[*].id
                        status: error
                InvalidDataResponse5:
                  summary: Error — invalid ID value (INVALID_DATA)
                  value:
                    blueprints:
                      - code: INVALID_DATA
                        message: Invalid data
                        details:
                          api_name: id
                          maximum_length: 25
                          json_path: $.blueprints[*].id
                        status: error
                InvalidDataResponse6:
                  summary: Error — invalid ID value (INVALID_DATA)
                  value:
                    blueprints:
                      - code: INVALID_DATA
                        message: Invalid data
                        details:
                          api_name: id
                          regex: '[0-9]+'
                          json_path: $.blueprints[*].id
                        status: error
                InvalidDataResponse7:
                  summary: Error — invalid data type for owners (INVALID_DATA)
                  value:
                    blueprints:
                      - code: INVALID_DATA
                        message: Invalid data type
                        details:
                          api_name: owners
                          expected_data_type: jsonarray
                          json_path: $.blueprints[*].owners
                        status: error
                InvalidDataResponse8:
                  summary: Error — invalid owners value (INVALID_DATA)
                  value:
                    blueprints:
                      - code: INVALID_DATA
                        message: Invalid data
                        details:
                          api_name: owners
                          maximum_length: 2
                          json_path: $.blueprints[*].owners
                        status: error
                MandatoryNotFoundResponse1:
                  summary: >-
                    Error — missing required field: resources
                    (MANDATORY_NOT_FOUND)
                  value:
                    blueprints:
                      - code: MANDATORY_NOT_FOUND
                        message: Required field is missing
                        details:
                          api_name: resources
                          json_path: $.blueprints[*].owners[*].resources
                        status: error
                InvalidDataResponse9:
                  summary: Error — invalid data type for resources (INVALID_DATA)
                  value:
                    blueprints:
                      - code: INVALID_DATA
                        message: Invalid data type
                        details:
                          api_name: resources
                          expected_data_type: jsonarray
                          json_path: $.blueprints[*].owners[*].resources
                        status: error
                InvalidDataResponse10:
                  summary: Error — invalid resources data (INVALID_DATA)
                  value:
                    blueprints:
                      - code: INVALID_DATA
                        message: Invalid data
                        details:
                          api_name: resources
                          maximum_length: 1
                          json_path: $.blueprints[*].owners[*].resources
                        status: error
                MandatoryNotFoundResponse2:
                  summary: 'Error — missing required field: `id` (MANDATORY_NOT_FOUND)'
                  value:
                    blueprints:
                      - code: MANDATORY_NOT_FOUND
                        message: Required field is missing
                        details:
                          api_name: id
                          json_path: $.blueprints[*].owners[*].resources[*].id
                        status: error
                InvalidDataResponse11:
                  summary: Error — invalid data type for ID (INVALID_DATA)
                  value:
                    blueprints:
                      - code: INVALID_DATA
                        message: Invalid data type
                        details:
                          api_name: id
                          expected_data_type: bigint
                          json_path: $.blueprints[*].owners[*].resources[*].id
                        status: error
                InvalidDataResponse12:
                  summary: Error — invalid ID value (INVALID_DATA)
                  value:
                    blueprints:
                      - code: INVALID_DATA
                        message: Invalid data
                        details:
                          api_name: id
                          maximum_length: 25
                          json_path: $.blueprints[*].owners[*].resources[*].id
                        status: error
                InvalidDataResponse13:
                  summary: Error — invalid ID value (INVALID_DATA)
                  value:
                    blueprints:
                      - code: INVALID_DATA
                        message: Invalid data
                        details:
                          api_name: id
                          regex: '[0-9]+'
