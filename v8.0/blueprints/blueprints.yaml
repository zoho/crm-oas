  parameters:
    ParamQueryPerPage:
      name: per_page
      in: query
      description: Represents the number of items to be returned per page.
      required: false
      style: form
      explode: true
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 200
      example: 200
    ParamHeaderXZohoService1:
      name: X-ZOHO-SERVICE
      in: header
