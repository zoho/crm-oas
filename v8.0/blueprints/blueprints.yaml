            application/json:
              schema:
                x-zs-$id: PutsettingsblueprintResponseWrapper
                oneOf:
                  - $ref: '#/components/schemas/RequiredHeaderMissingError'
                  - type: object
                    x-zs-$id: PutsettingsblueprintResponse400Blueprints1
