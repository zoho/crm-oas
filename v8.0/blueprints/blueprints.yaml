      required: false
      style: simple
      explode: false
      schema:
        type: string
        enum:
          - automation
    ParamQueryLayoutId:
      name: layout_id
      in: query
      description: >-
        Represents the ID of the layout to filter the results. Use the [Get
        Layouts Metadata API](layouts.yaml#$.paths./settings/layouts.get) to
        retrieve the Layout ID.
      required: false
      style: form
      explode: true
      schema:
        type: integer
        format: int32
      example: 1234567890
    ParamQueryInclude:
      name: include
      in: query
      description: Represents the additional fields to include in the response on demand.
      required: false
      style: form
      explode: true
      schema:
        type: string
        enum:
          - state
          - transition
    ParamQuerySortBy:
      name: sort_by
      in: query
      description: >-
        Represents the API name of the field based on which the list should be
        sorted.
      required: false
      style: form
      explode: true
      schema:
        type: string
        maxLength: 3000
      example: modified_time
    ParamQueryPage:
      name: page
      in: query
      description: Represents the page number to be accessed.
      required: false
      style: form
      explode: true
      schema:
        type: integer
        format: int32
        minimum: 1
      example: 1
    ParamQueryStatus:
      name: status
      in: query
      description: Represents the status of the Blueprint to filter the results.
      required: false
      style: form
      explode: true
      schema:
        type: string
        maxLength: 3000
      example: active
