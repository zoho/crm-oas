                maxLength: 19
              required: false
      security:
        - OAuth2:
            - ZohoCRM.settings.blueprint.UPDATE
    post:
      summary: Create a Blueprint
      description: >-
        To create a Blueprint with states and transitions for a module in your
        Zoho CRM organization. After creating the Blueprint, you must update
        each transition to set its modified time, which the user interface
        requires. Although **chart_data** is optional in the schema, provide it
        before you activate the Blueprint for the first time, including the
        canvas size, one node for each state, and one connection for each
        transition. Each state must include a module object, and each transition
        must include a layout object, both required at runtime.
      x-zs-llm-description: Create a new blueprint configuration with states and transitions.
      operationId: postBlueprint
      parameters:
        - $ref: '#/components/parameters/ParamHeaderXZohoService1'
      requestBody:
        description: >-
          The request body must contain the Blueprint definition to create,
          including its states, transitions, and connections.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBlueprintRequestBody'
            examples:
              SamplePostRequest:
                summary: Create a Blueprint
                value:
                  blueprints:
                    - owners:
                        - resources:
                            - id: '1231231231'
                          type: users
                      criteria:
                        comparator: greater_than
                        field:
                          api_name: Annual_Revenue
                          id: '111111000000004782'
                        type: value
                        value: '100'
                      chart_data:
                        nodes:
