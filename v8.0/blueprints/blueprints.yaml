    delete:
      summary: Delete one or more Blueprints
      description: >-
        To delete one or more Blueprints from your Zoho CRM organization. When
        multiple Blueprint IDs are passed, if some deletions succeed and others
        fail, the API responds with **207 Multi-Status**. Check the status key
        in each response item to see the result of each deletion.
      x-zs-llm-description: Delete multiple blueprints by IDs in the request body
      operationId: deleteBlueprint
      parameters:
        - $ref: '#/components/parameters/ParamHeaderXZohoService1'
        - $ref: '#/components/parameters/ParamQueryIds'
      responses:
        '200':
          description: >-
            Returns the list of successfully deleted Blueprints with their IDs
            and confirmation messages.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteBlueprintSuccessResponse'
              examples:
                Success200:
                  summary: Successful deletion of all requested Blueprints
                  value:
                    blueprints:
                      - code: SUCCESS
                        details:
                          id: '111111000000085009'
                        message: blueprint deleted successfully
                        status: success
                      - code: SUCCESS
                        details:
                          id: '111111000000084023'
                        message: blueprint deleted successfully
                        status: success
          headers:
            X-API-CREDITS-REMAINING:
              schema:
                type: string
                format: int64
                description: >
                  Present when >=50% of base daily credits (excluding add-on
                  credits) are consumed. Value is total remaining credits
                  including add-on credits for the rolling 24-hour window.
                pattern: ^[0-9]+$
                minLength: 1
                maxLength: 19
              required: false
        '207':
          description: >-
            Returns a multi-status response containing both successful Blueprint
            deletions and errors for invalid Blueprint IDs when multiple
            Blueprints are requested for deletion.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteBlueprintPartialResponse'
              examples:
                Success207:
                  summary: Partial success with mixed deletion results
                  value:
                    blueprints:
                      - code: SUCCESS
                        details:
                          id: '111111000000085009'
                        message: blueprint deleted successfully
                        status: success
                      - code: INVALID_DATA
                        details:
                          api_name: id
                          json_path: $.ids[0]
                        message: the id given seems to be invalid
                        status: error
          headers:
            X-API-CREDITS-REMAINING:
              schema:
                type: string
                format: int64
                description: >
                  Present when >=50% of base daily credits (excluding add-on
                  credits) are consumed. Value is total remaining credits
                  including add-on credits for the rolling 24-hour window.
                pattern: ^[0-9]+$
                minLength: 1
                maxLength: 19
              required: false
        '400':
          description: >-
            Bad Request — The request cannot be processed due to invalid syntax
            or missing required parameters.

            **Resolution:** Specify a valid Blueprint ID, include all required
            headers and query parameters, and use the DELETE HTTP method for
            this endpoint.
          content:
            application/json:
              schema:
                x-zs-$id: DeletesettingsblueprintResponse400
                oneOf:
                  - $ref: '#/components/schemas/RequiredHeaderMissingError'
                  - $ref: >-
                      #/components/schemas/DeleteBlueprintRequiredParamMissingError
                  - $ref: >-
                      #/components/schemas/DeleteBlueprintBulkInvalidIdsErrorResponse
                  - $ref: '#/components/schemas/DeleteBlueprintInvalidDataError'
              examples:
                RequiredHeaderMissingResponse1:
                  summary: >-
                    Error response with code REQUIRED_HEADER_MISSING: a required
                    header is omitted
                  value:
                    code: REQUIRED_HEADER_MISSING
                    details:
                      header_name: X-CRM-ORG
                    message: One of the expected headers is missing
                    status: error
                RequiredParamMissingResponse1:
                  summary: >-
                    Error response with code REQUIRED_PARAM_MISSING: a required
                    parameter is missing
                  value:
                    code: REQUIRED_PARAM_MISSING
                    details:
                      param_name: ids
                    message: One of the expected parameter is missing
                    status: error
                InvalidDataResponse1:
                  summary: INVALID_DATA error for an invalid single Blueprint ID
                  value:
                    code: INVALID_DATA
                    details:
                      api_name: id
                      json_path: $.blueprints[0].states.id
                    message: the id given seems to be invalid
