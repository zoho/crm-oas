  /settings/blueprints/{blueprintId}:
    get:
      summary: Get details of a Blueprint by ID
      description: >-
        To get the details of a single Blueprint by its unique identifier in
        your Zoho CRM organization, send a GET request with the target Blueprint
        ID. The response includes the full Blueprint record with chart data,
        states, transitions, connections, layout, tracked field, associated
        module, and ownership information.
      x-zs-llm-description: Get details of a specific blueprint by its blueprintId
      operationId: getBlueprintId
      parameters:
        - name: blueprintId
          in: path
          description: >-
            Specify the unique numeric ID of the Blueprint to retrieve. Use the
            [Get Blueprint by
            ID](blueprints.yaml#$.paths./settings/blueprints.get) to retrieve
            the Blueprint ID.
          required: true
          style: simple
          explode: false
          schema:
            type: string
            format: int64
            pattern: ^[0-9]+
            minLength: 1
