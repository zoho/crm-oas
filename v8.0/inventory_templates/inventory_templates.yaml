components:
  schemas:
    ModuleRef:
      type: object
      description: >-
        Represents a module reference containing the module **API name** and
        **ID**, used to identify the CRM module associated with an inventory
        template.
      additionalProperties: false
      properties:
        api_name:
          type: string
          description: >-
            Represents the API name of the CRM module associated with the
            inventory template. 
          maxLength: 50
        id:
          type: string
          description: >-
            Represents the unique ID of the CRM module associated with the
            inventory template. 
          maxLength: 50
      required:
        - api_name
        - id
    FolderRef:
      type: object
      description: >-
        Represents a folder reference containing the folder ID and name, used to
        identify the folder associated with an inventory template.
      additionalProperties: false
      properties:
        name:
          type: string
          description: 'Represents the name of the folder. '
          maxLength: 255
        id:
          type: string
          description: 'Represents the unique ID of the folder. '
          maxLength: 50
      required:
        - name
        - id
    UserRef:
      type: object
      description: >-
        Represents a user reference containing the user ID and display name,
        used to identify the user associated with an inventory template
        operation.
      additionalProperties: false
      properties:
        name:
          type: string
          description: 'Represents the display name of the CRM user. '
          maxLength: 255
        id:
          type: string
          description: 'Represents the unique ID of the CRM user. '
          maxLength: 50
      required:
        - name
        - id
    InventoryTemplateListResponse:
      type: object
      description: >-
        Successful response containing inventory_templates array and pagination
        info.
      x-zs-$id: InventoryTemplateListResponse
      additionalProperties: false
      properties:
        inventory_templates:
          type: array
          description: >-
            Represents the list of inventory templates returned for the current
            page. 
          items:
            $ref: '#/components/schemas/InventoryTemplateListItem'
          maxItems: 2000
        info:
          description: Pagination information
          $ref: '#/components/schemas/InfoBlock'
      required:
        - inventory_templates
        - info
    InventoryTemplateDetailResponse:
      type: object
      description: Successful response for single inventory template retrieval
      x-zs-$id: InventoryTemplateDetailResponse
      additionalProperties: true
      properties:
        inventory_templates:
          type: array
          maxItems: 1
          description: >-
            Represents an array containing the details of a single inventory
            template. 
          items:
            $ref: '#/components/schemas/InventoryTemplateDetail'
      required:
        - inventory_templates
    InventoryTemplateDetail:
      type: object
      x-zs-$id: InventoryTemplateDetail
      description: >-
        Complete inventory template object with all detailed information
        including content
      additionalProperties: false
      properties:
        id:
          type: string
          maxLength: 50
          description: Unique template identifier
          x-zs-$id: InventoryTemplateByIdId
        name:
          type: string
          maxLength: 75
          description: 'Represents the name of the inventory template. '
        created_time:
          type: string
          format: date-time
          description: 'Represents the creation timestamp of the inventory template. '
        modified_time:
          type: string
          format: date-time
          description: >-
            Represents the date and time at which the inventory template was
            last modified. 
        last_usage_time:
          description: >-
            Represents the date and time at which the inventory template was
            last used, or null if the template has never been used. 
          oneOf:
            - x-zs-$id: SingleInventoryTemplateLastUsageTimeString
              type: string
              format: date-time
              description: >-
                Represents the date and time at which the template was last
                used.
            - x-zs-$id: SingleInventoryTemplateLastUsageTimeNull
              type: 'null'
              description: Indicates that the template has never been used.
        category:
          type: string
          description: >-
            Represents the category of the inventory template. 

            Possible values:

            **normal** - A regular, published inventory template.

            **draft** - A template that is saved as a draft and not yet
            published.
          enum:
            - normal
            - draft
        folder:
          description: Folder containing this template
          $ref: '#/components/schemas/FolderRef'
        module:
          description: Module this template belongs to
          $ref: '#/components/schemas/ModuleRef'
        created_by:
          description: User who created the template
          $ref: '#/components/schemas/UserRef'
        modified_by:
          description: User who last modified the template
          $ref: '#/components/schemas/UserRef'
        editor_mode:
          type: string
          description: >-
            Represents the editor mode used to create the inventory template. 

            Possible values:

            **plain_text** - The template was built from scratch using plain
            text.

            **rich_text** - The template is a pre-designed custom template.

            **gallery** - The template was chosen from the template gallery and
            customized.
          enum:
            - plain_text
            - rich_text
            - gallery
        favorite:
          type: boolean
          description: |-
            Indicates whether the inventory template is marked as a favorite. 
            Possible values:
            **true** - The template is marked as a favorite.
            **false** - The template is not marked as a favorite.
        content:
          type: string
          maxLength: 300000
          description: 'Represents the full HTML content of the inventory template. '
      required:
        - id
        - name
        - created_time
        - modified_time
        - last_usage_time
        - category
        - folder
        - module
        - created_by
        - modified_by
        - editor_mode
        - favorite
        - content
    InfoBlock:
      type: object
      description: >-
        Represents the pagination metadata for list responses, including page
        number, items per page, total count, and whether more records are
        available.
      additionalProperties: false
      properties:
        per_page:
          type: integer
          format: int32
          description: >-
            Represents the number of inventory template records returned per
            page. 
        page:
          type: integer
          format: int32
          description: 'Represents the current page number in the paginated response. '
        count:
          type: integer
          format: int32
          description: >-
            Represents the number of inventory template records returned in the
            current page. 
        more_records:
          type: boolean
          description: >-
            Indicates whether additional pages of inventory template records are
            available beyond the current page. 

            Possible values:

            **true** - More records are available on subsequent pages.

            **false** - The current page is the last page.
      required:
        - per_page
        - page
        - count
        - more_records
    InventoryTemplateListItem:
      type: object
      description: >-
        Represents a summary object for an inventory template as returned in
        paginated list responses.
      additionalProperties: false
      properties:
        created_time:
          type: string
          format: date-time
          description: 'Represents the creation timestamp of the inventory template. '
        modified_time:
          type: string
          format: date-time
          description: >-
            Represents the date and time at which the inventory template was
            last modified. 
        last_usage_time:
          description: >-
            Represents the date and time at which the inventory template was
            last used, or null if the template has never been used. 
          oneOf:
            - x-zs-$id: LastUsageTimeString
              type: string
              format: date-time
              description: >-
                Represents the date and time at which the template was last
                used.
            - x-zs-$id: LastUsageTimeNull
              type: 'null'
              description: Indicates that the template has never been used.
        category:
          type: string
          description: >-
            Represents the category of the inventory template. 

            Possible values:

            **normal** - A regular, published inventory template.

            **draft** - A template that is saved as a draft and not yet
            published.
          enum:
            - normal
            - draft
        folder:
          description: Folder containing this template
          $ref: '#/components/schemas/FolderRef'
        module:
          description: Module this template belongs to
          $ref: '#/components/schemas/ModuleRef'
        created_by:
          description: User who created the template
          $ref: '#/components/schemas/UserRef'
        modified_by:
          description: User who last modified the template
          $ref: '#/components/schemas/UserRef'
        name:
          type: string
          description: 'Represents the name of the inventory template. '
          pattern: ^[A-Za-z0-9]{5}$
          maxLength: 75
        id:
          type: string
          description: 'Represents the unique ID of the inventory template. '
          maxLength: 50
          x-zs-$id: InventoryTemplatesId
        editor_mode:
          type: string
          description: >-
            Represents the editor mode used to create the inventory template. 

            Possible values:

            **plain_text** - The template was built from scratch using plain
            text.

            **rich_text** - The template is a pre-designed custom template.

            **gallery** - The template was chosen from the template gallery and
            customized.
          enum:
            - plain_text
            - rich_text
            - gallery
        favorite:
          type: boolean
          description: |-
            Indicates whether the inventory template is marked as a favorite. 
            Possible values:
            **true** - The template is marked as a favorite.
            **false** - The template is not marked as a favorite.
      required:
        - created_time
        - modified_time
        - last_usage_time
        - category
        - folder
        - module
        - created_by
        - modified_by
        - name
        - id
        - editor_mode
        - favorite
    ErrorItemInvalidRequest:
      x-zs-$id: ErrorItemInvalidRequest
      description: >-
        Represents an error item for request-level errors such as **invalid
        request shape** or **JSON parse failures** in inventory templates
        operations.
      additionalProperties: false
      type: object
      properties:
        status:
          type: string
          description: |-
            Represents the status of the result. 
            Possible values:
            **error** - The operation failed due to an error.
          enum:
            - error
        code:
          type: string
          description: >-
            Represents the error code for request-level errors. 

            Possible values:

            **INVALID_REQUEST** - The request payload is invalid or malformed.

            **JSON_PARSE_ERROR** - The request body could not be parsed as valid
            JSON.

            **INVALID_MODULE** - The module name specified in the request is
            invalid.
          enum:
            - INVALID_REQUEST
            - JSON_PARSE_ERROR
            - INVALID_MODULE
        message:
          type: string
          description: 'Represents the error message describing the issue. '
          maxLength: 1000
        details:
          type: object
          description: 'Represents the additional details about the request error. '
          additionalProperties: false
      required:
        - status
        - code
        - message
        - details
    GetInventoryTemplates400Error:
      x-zs-$id: GetInventoryTemplates400Error
      description: Error response schema for inventory templates operations.
      items:
        type: object
        additionalProperties: false
        x-zs-$id: InventoryTemplatesErrorResponseItems
        description: >-
          Represents an individual error item from the inventory templates
          operation, including the error code, message, status, and details.
        oneOf:
          - $ref: '#/components/schemas/ErrorItemMandatoryNotFound'
          - $ref: '#/components/schemas/ErrorItemInvalidData'
          - $ref: '#/components/schemas/ErrorItemPatternNotMatched'
          - $ref: '#/components/schemas/ErrorItemInvalidRequest'
    ErrorItemMandatoryNotFound:
      description: >-
        Represents an error item for missing mandatory field errors in inventory
        templates operations.
      x-zs-$id: ErrorItemMandatoryNotFound
      allOf:
        - $ref: '#/components/schemas/ErrorItemBase'
        - description: >-
            Specialized properties for MANDATORY_NOT_FOUND error code,
            indicating a required field is missing.
          type: object
          additionalProperties: false
          properties:
            code:
              description: >-
                Represents the error code for missing mandatory field errors. 

                Possible values:

                **MANDATORY_NOT_FOUND** - A required field is missing from the
                request.
              type: string
              enum:
                - MANDATORY_NOT_FOUND
            details:
              oneOf:
                - x-zs-$id: ErrorItemMandatoryNotFoundDetails1
                  type: object
                  description: >-
                    Represents additional error details with flexible structure
                    for mandatory not found errors.
                  additionalProperties: true
                - type: object
                  description: >-
                    Represents error details that include the API name of the
                    parent field for the missing mandatory field.
                  x-zs-$id: ErrorItemMandatoryNotFoundDetails2
                  additionalProperties: false
                  properties:
                    parent_api_name:
                      description: >-
                        Represents the API name of the parent field containing
                        the missing mandatory field.
                      type: string
                      maxLength: 128
                  required:
                    - parent_api_name
              description: >-
                Represents the additional details about the missing mandatory
                field error.
    ErrorItemInvalidData:
      description: >-
        Represents an error item for invalid data or invalid module errors in
        inventory templates operations.
      x-zs-$id: ErrorItemInvalidData
      allOf:
        - $ref: '#/components/schemas/ErrorItemBase'
        - description: >-
            Specialized properties for INVALID_DATA and INVALID_MODULE error
            codes.
          type: object
          additionalProperties: false
          properties:
            code:
              description: >-
                Represents the error code for invalid data or module errors. 

                Possible values:

                **INVALID_DATA** - The data provided in the request is invalid.

                **INVALID_MODULE** - The module name specified in the request is
                invalid.
              type: string
              enum:
                - INVALID_DATA
                - INVALID_MODULE
            details:
              description: >-
                Represents the additional details about the invalid data or
                module error.
              type: object
              additionalProperties: true
    ErrorItemBase:
      description: >-
        Base structure for all error items returned in inventory templates error
        responses, containing the code, message, status, and details fields.
      type: object
      additionalProperties: false
      properties:
        code:
          description: 'Represents the error code for the failed operation. '
          type: string
          maxLength: 128
        message:
          description: 'Represents the error message describing the issue. '
          type: string
          maxLength: 1024
        status:
          description: |-
            Represents the severity level of the result. 
            Possible values:
            **error** - The operation failed due to an error.
            **warning** - The operation completed with warnings.
            **info** - The operation returned an informational status.
          type: string
          enum:
            - error
            - warning
            - info
        details:
          description: >-
            Represents the additional details about the error, such as the
            parameter name or field that caused it. 
          type: object
          additionalProperties: true
      required:
        - code
        - message
        - status
        - details
    ErrorItemPatternNotMatched:
      x-zs-$id: ErrorItemPatternNotMatched
      description: >-
        Represents an error item for pattern validation failures in inventory
        templates operations.
      allOf:
        - $ref: '#/components/schemas/ErrorItemBase'
        - description: >-
            Specialized properties for PATTERN_NOT_MATCHED error code,
            indicating a field value failed pattern validation.
          type: object
          additionalProperties: false
          properties:
            code:
              description: >-
                Represents the error code for pattern validation failures. 

                Possible values:

                **PATTERN_NOT_MATCHED** - A field value does not match the
                required pattern or format.
              type: string
              enum:
                - PATTERN_NOT_MATCHED
            details:
              oneOf:
                - x-zs-$id: ErrorItemPatternNotMatchedDetailsWithApiName
                  type: object
                  description: >-
                    Represents error details that include the API name of the
                    field that failed pattern validation.
                  additionalProperties: false
                  properties:
                    api_name:
                      description: >-
                        Represents the API name of the field that failed pattern
                        validation. 
                      type: string
                      maxLength: 128
                  required:
                    - api_name
                - x-zs-$id: ErrorItemPatternNotMatchedDetailsAdditional
                  type: object
                  description: >-
                    Represents additional error details with flexible structure
                    for pattern not matched errors.
                  additionalProperties: true
              description: >-
                Represents the additional details about the pattern validation
                error.
  parameters:
    PerPage:
      name: per_page
      in: query
      required: false
      schema:
        type: integer
        format: int32
        default: 200
        maximum: 200
      description: Specify the number of inventory templates to return per page.
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        format: int32
        default: 1
        minimum: 1
      description: Specify the page number to retrieve in the paginated results.
    Module:
      description: >-
        Specifies the API name of the CRM module used to filter the returned
        inventory templates.
      name: module
      in: query
      required: false
      schema:
        type: string
        maxLength: 128
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://accounts.zoho.com/oauth/v2/auth
          tokenUrl: https://accounts.zoho.com/oauth/v2/token
          refreshUrl: https://accounts.zoho.com/oauth/v2/token
          scopes:
            ZohoCRM.templates.inventory.CREATE: >-
              Grants permission to create inventory templates in the Zoho CRM
              organization.
            ZohoCRM.templates.inventory.READ: >-
              Grants permission to read and retrieve inventory templates from
              the Zoho CRM organization.
            ZohoCRM.templates.inventory.UPDATE: >-
              Grants permission to update inventory templates and preferences in
              the Zoho CRM organization.
            ZohoCRM.templates.inventory.DELETE: >-
              Grants permission to delete inventory templates in the Zoho CRM
              organization.
