openapi: 3.1.0
info:
  title: Inventory Templates
  description: >-
    Inventory templates are pre-designed HTML layouts used to generate inventory
    documents such as Quotes, Invoices, Purchase Orders, and Sales Orders for
    CRM records. This API enables developers to retrieve the list of inventory
    templates configured in the Zoho CRM organization, with support for
    filtering, sorting, and pagination.
  version: '8.0'
servers:
  - url: https://zohoapis.{dc}/crm/{version}
    description: >-
      Production API server for the Zoho CRM Inventory Templates API. Sample
      request URL: `https://zohoapis.{dc}/crm/{version}`
    variables:
      dc:
        enum:
          - com
          - eu
          - in
          - cn
          - au
        default: com
        description: >-
          The top-level domain for the Zoho CRM API server, used to route
          requests to the appropriate regional data center.

          Possible values:

          **com** - United States.

          **eu** - Europe.

          **in** - India.

          **cn** - China.

          **au** - Australia.

          Default: **com**.
      version:
        default: v8
        description: 'The API version to use for requests. Default: **v8**.'
paths:
  /settings/inventory_templates:
    get:
      operationId: getInventoryTemplates
      summary: Inventory templates
      description: >-
        To retrieve a paginated list of inventory templates configured in your
        Zoho CRM organization, with optional filtering by module, category, and
        field criteria, and sorting by name or usage and modification
        timestamps.
      parameters:
        - $ref: '#/components/parameters/Module'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Page'
      security:
        - OAuth2:
            - ZohoCRM.templates.inventory.READ
      responses:
        '200':
          description: >-
            Returns the paginated list of inventory templates matching the
            specified criteria, along with pagination metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryTemplateListResponse'
        '204':
          description: >-
            No inventory templates match the specified filter criteria. The
            response body is empty.
        '400':
          description: >-
            The request contains invalid parameters or an invalid module name.

            **Resolution:** The module API name and all query parameter values
            must be valid before retrying the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetInventoryTemplates400Error'
              examples:
                InvalidData:
                  value:
                    code: INVALID_DATA
                    message: The module name provided is invalid.
                    status: error
                    details:
                      param_name: module
                  description: >-
                    Shows the error response when the module name provided in
                    the request is invalid, with the param_name field
                    identifying the invalid parameter.
                  summary: Invalid module name in request
                PatternNotMatched:
                  value:
                    code: PATTERN_NOT_MATCHED
                    details:
                      param_name: sort_order
                    message: Please check whether the input values are correct
                    status: error
                  description: >-
                    Shows the error response when the sort_order parameter value
                    does not match the required pattern, with the param_name
                    field identifying the offending parameter.
                  summary: Invalid sort_order parameter value
  /settings/inventory_templates/{templateId}:
    get:
      summary: Inventory Template
      description: >-
        Retrieves a single inventory template by its ID with complete details
        including content and all metadata.
      operationId: getInventoryTemplateById
      parameters:
        - name: templateId
          in: path
          description: Inventory template ID.
          required: true
          schema:
            type: string
            maxLength: 64
      security:
        - OAuth2:
            - ZohoCRM.templates.inventory.READ
      responses:
        '200':
          description: OK - single inventory template with all details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryTemplateDetailResponse'
              examples:
                Success:
                  value:
