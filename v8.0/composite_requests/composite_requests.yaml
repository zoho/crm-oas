                                  required:
                                    - rollbacked_by_sub_request_index
                                - x-zs-$id: SubRequestVersionMismatchErrorDetails
                                  type: object
                                  description: >-
                                    Contains the error details for version
                                    mismatches.
                                  additionalProperties: false
                                  properties:
                                    sub_request_version:
                                      type: integer
                                      format: int32
                                      description: >-
                                        Represents the version of the
                                        sub-request.
                                    composite_request_version:
                                      type: integer
                                      format: int32
                                      description: >-
                                        Provides the version of the composite
                                        request.
                                  required:
                                    - sub_request_version
                                    - composite_request_version
                                - x-zs-$id: SubRequestDependencyErrorDetails
                                  type: object
                                  description: >-
                                    Provides the error details for dependency
                                    issues.
                                  additionalProperties: false
                                  properties:
                                    dependent_data:
                                      type: array
                                      description: >-
                                        Contains the information about dependent
                                        sub-requests.
                                      maxItems: 10
                                      items:
                                        type: object
                                        description: >+
                                          Provides the dependency information
                                          about dependent sub-requests.


                                        additionalProperties: false
                                        properties:
                                          sub_request_id:
                                            type: string
                                            description: >-
                                              Provides the ID of the dependent
                                              sub-request.
                                            maxLength: 100
                                          referred_sub_request_ids:
                                            type: array
                                            description: >-
                                              Provides the IDs of sub-requests the
                                              error depends on.
                                            maxItems: 5
                                            items:
                                              type: string
                                              description: >-
                                                Each item represents the referenced
                                                sub-request ID.
                                              maxLength: 100
                                        required:
                                          - sub_request_id
                                          - referred_sub_request_ids
                                  required:
                                    - dependent_data
                              description: >-
                                Contains the detailed response information for
                                the sub-request, including the HTTP response
                                from the wrapped API call. 
                          required:
                            - code
                            - message
                            - status
                            - details
                    required:
                      - __composite_requests
              examples:
                CompositeRequestError:
                  summary: Error response for composite request with invalid data.
                  value:
                    __composite_requests:
                      - code: INVALID_DATA
                        details:
                          expected_data_type: text
                          regex: /crm(/.*)?/v[0-9]+([.][0-9]+)?/.*
                          api_name: uri
                          json_path: $.__composite_requests[0].uri
                        message: invalid data
                        status: error
                  description: >-
                    Shows the error response when the composite request itself
                    is invalid. Common errors include exceeding the maximum of 5
                    sub-requests, invalid reference expressions, circular
                    dependencies between sub-requests, or restricted headers and
                    parameters.
components:
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://accounts.zoho.com/oauth/v2/auth
          tokenUrl: https://accounts.zoho.com/oauth/v2/token
          refreshUrl: https://accounts.zoho.com/oauth/v2/token
          scopes:
            ZohoCRM.composite_requests.CUSTOM: Grants permission to execute composite requests in Zoho CRM.
            ZohoCRM.{sub_request_scope}: >-
              Grants permission to execute the wrapped API endpoints included in
              each sub-request. The required scopes depend on the APIs invoked
              within the composite request.


              > **Note**

              > You must include both scopes to access the Composite API.
