              examples:
                InternalError:
                  summary: Unexpected server error
                  value:
                    code: INTERNAL_ERROR
                    message: Unexpected and unhandled exception in Server
                    status: error
                    details: {}
                  description: Shows unexpected server error.
      security:
        - OAuth2:
