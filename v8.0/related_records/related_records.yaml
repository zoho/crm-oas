components:
  parameters:
    ParentRecordModule:
      name: parentRecordModule
      in: path
      required: true
      description: >-
        Specify the API name of the module the parent record belongs to. Refer
        to the [Get
        Modules](https://www.zoho.com/crm/developer/docs/api/v8/modules-api.html)
        resource for valid values.
      schema:
        type: string
        pattern: ^[A-Za-z_][A-Za-z0-9_]*$
        maxLength: 100
      examples:
        Contacts:
          value: Contacts
          summary: Contacts module
        Deals:
          value: Deals
          summary: Deals module
        CustomModule:
          value: Services__s
          summary: Custom Services module
    ParentRecord:
      name: parentRecord
      in: path
      required: true
      description: Specify the unique numeric identifier of the parent record.
      schema:
        type: string
        pattern: ^[0-9]+$
        maxLength: 20
      examples:
        ContactId:
          value: '3652397000000624001'
          summary: Contact record ID
        DealId:
          value: '3652397000000789001'
          summary: Deal record ID
    RelatedList:
      name: relatedList
      in: path
      required: true
      description: >-
        Specify the API name of the related list containing the records to
        retrieve or modify. Refer to the [Get Related
        Lists](https://www.zoho.com/crm/developer/docs/api/v8/related-list-meta.html)
        resource for valid values.
      schema:
        type: string
        pattern: ^[A-Za-z_][A-Za-z0-9_]*$
        maxLength: 100
      examples:
        Products:
          value: Products
          summary: Products related list
        Notes:
          value: Notes
          summary: Notes related list
        Attachments:
          value: Attachments
          summary: Attachments related list
    Record:
      name: record
      in: path
      required: true
      description: Specify the unique numeric identifier of the specific related record.
      schema:
        type: string
        pattern: ^[0-9]+$
        maxLength: 20
      examples:
        ProductId:
          value: '3652397000001234001'
          summary: Product record ID
        NoteId:
          value: '3652397000001567001'
          summary: Note record ID
    Ids:
      name: ids
      in: query
      required: true
      description: >-
        Specify the unique identifiers of the records to delink from the parent
        record as a comma-separated list.
      schema:
        type: string
        pattern: ^[0-9]+(,[0-9]+)*$
        maxLength: 2000
      examples:
        SingleId:
          value: '3652397000001234001'
          summary: Single record ID
        MultipleIds:
          value: 3652397000001234001,3652397000001234002,3652397000001234003
          summary: Multiple record IDs
    Fields:
      name: fields
      in: query
      required: true
      description: >-
        Specify the API names of the fields to include in the response as a
        comma-separated list.
      schema:
        type: string
        pattern: ^[A-Za-z_][A-Za-z0-9_]*(,[A-Za-z_][A-Za-z0-9_]*)*$
        maxLength: 1000
      examples:
        BasicFields:
          value: First_Name,Last_Name,Email
          summary: Basic contact fields
        ExtendedFields:
          value: Account_Name,Phone,Lead_Source,Custom_Field__c
          summary: Extended fields including custom field
    Page:
      name: page
      in: query
      required: false
      description: Specify the page number for paginating results.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 10000
        default: 1
      examples:
        FirstPage:
          value: 1
          summary: First page
        SecondPage:
          value: 2
          summary: Second page
    PerPage:
      name: perPage
      in: query
      required: false
      description: >-
        Specify the number of records to return per page.


        The page and per_page parameter is used to fetch records according to
        their position in the CRM. Let us assume that the user has to fetch 400
        records. The maximum number of records that one can get for an API call
        is 200. So, for records above the 200th position, they cannot be
        fetched. By using the page (1 and 2) and per_page (200) parameter, the
        user can fetch all 400 records using 2 API calls.

        If the requested related list is not present or hidden in a layout, the
        system will return an INVALID_DATA response.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 200
        default: 200
      examples:
        DefaultPageSize:
          value: 200
          summary: Default page size
        SmallPageSize:
          value: 50
          summary: Smaller page size for limited data
    IfModifiedSince:
      name: If-Modified-Since
      in: header
      required: false
      description: >-
        Specify the date and time in RFC 2822 format. The response includes only
        records modified after this timestamp.
      schema:
        type: string
        format: date-time
      examples:
        RecentChanges:
          value: '2024-01-20T10:00:00Z'
          summary: Get records modified since January 20, 2024
    PageToken:
      name: page_token
      in: query
      required: false
      description: >-
        Specify the token to retrieve the next set of records beyond the first
        2,000 results. Use the **next_page_token** value from the previous
        response.
      schema:
        type: string
        maxLength: 500
    IdsOptional:
      name: ids
      in: query
      required: false
      description: >-
        Specify the unique identifiers of the records to retrieve as a
        comma-separated list.
      schema:
        type: string
        pattern: ^[0-9]+(,[0-9]+)*$
        maxLength: 2000
    SortOrder:
      name: sort_order
      in: query
      required: false
      description: >-
        Specify the sort direction for the related records. Possible values:
        **asc**, **desc**.
      schema:
        type: string
        enum:
          - asc
          - desc
        default: desc
    SortBy:
      name: sort_by
      in: query
      required: false
      description: >-
        Specify the field to sort the related records by. Possible values:
        **ID**, **Created_Time**, **Modified_Time**.
      schema:
        type: string
        enum:
          - id
          - Created_Time
          - Modified_Time
        default: id
    Converted:
      name: converted
      in: query
      required: false
      description: >-
        Specify whether to filter records by conversion status. Possible values:
        **true**, **false**, **both**.
      schema:
        type: string
        enum:
          - 'true'
          - 'false'
          - both
        default: 'false'
    Approved:
      name: approved
      in: query
      required: false
      description: >-
        Filter records by approval status. When set to true, returns only
        approved records; when false, returns only unapproved records.
      schema:
        type: string
        enum:
          - 'true'
          - 'false'
          - both
        default: 'true'
    ApprovalState:
      name: approval_state
      in: query
      required: false
      description: Filter records by their current approval state.
      schema:
        type: string
        enum:
          - webform_unapproved
          - approved
          - approval_process_pending
          - approval_process_rejected
          - webform_invalid
          - webform_invalid_approval
          - webform_double_optin
          - review_process_pending
          - review_process_rejected
          - merge_pending
          - zia_vision_pending
          - zia_vision_rejected
          - zia_vision_validation
          - email_parser_waiting
          - email_parser_rejected
          - approval_process_recalled
    Filters:
      name: filters
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/FilterCriterionRequest'
      description: Filter for fetching specific related records based on criteria
  schemas:
    InvalidModuleError:
      x-zs-$id: InvalidModuleError
      type: object
      description: >-
        Represents an error response returned when the module name in the
        request is not a valid Zoho CRM module API name.
      properties:
        code:
          type: string
          description: Error code indicating the type of error.
          enum:
            - INVALID_MODULE
        message:
          type: string
          description: Detailed error message.
          maxLength: 500
        status:
          type: string
          description: Status of the error.
          enum:
            - error
        details:
          type: object
          description: Additional error details.
          properties:
            resource_path_index:
              type: integer
              format: int32
              description: Index of the path parameter that caused the error (0-based).
          additionalProperties: true
      required:
        - code
        - message
        - status
      additionalProperties: false
    InvalidDataError:
      x-zs-$id: InvalidDataError
      type: object
      description: >-
        Represents an error response returned when the request contains invalid
        data, such as an invalid record ID, invalid related list name, or
        invalid input format.
      properties:
        code:
          type: string
          description: Error code.
          enum:
            - INVALID_DATA
        message:
          type: string
          description: Error message.
          maxLength: 500
        status:
          type: string
          description: Status of the error.
          enum:
            - error
        details:
          type: object
          description: Additional error details. Can be empty depending on the error.
          properties:
            id:
              type: string
              description: Record/related record ID involved in the error (if applicable).
              pattern: ^[0-9]+$
              maxLength: 20
            api_name:
              type: string
              description: >-
                API name of the field/module/related list involved (if
                applicable).
              maxLength: 100
            resource_path_index:
              type: integer
              format: int32
              description: >-
                Index/position in the request resource path or payload where the
                error occurred (if applicable).
          additionalProperties: true
      required:
        - code
        - message
        - status
        - details
      additionalProperties: false
    NoPermissionError:
      x-zs-$id: NoPermissionError
      type: object
      description: >-
        Represents an error response returned when the authenticated user does
        not have the required module-level permission for the requested
        operation.
      properties:
        code:
          type: string
          description: Error code.
          enum:
            - NO_PERMISSION
        message:
          type: string
          description: Error message.
          maxLength: 500
        status:
          type: string
          description: Status of the error.
          enum:
            - error
        details:
          type: object
          description: Additional error details.
          properties:
            permissions:
              type: array
              description: Missing/required permissions for the requested operation.
              maxItems: 100
              items:
                type: string
                description: Permission identifier string.
                maxLength: 200
          additionalProperties: true
      required:
        - code
        - message
        - status
      additionalProperties: false
    InternalError:
      x-zs-$id: InternalError
      type: object
      description: >-
        Represents an error response returned when an unexpected internal server
        error occurs.
      properties:
        code:
          type: string
          description: Error code.
          enum:
            - INTERNAL_ERROR
        message:
          type: string
          description: Error message.
          maxLength: 500
        status:
          type: string
          description: Status of the error.
          enum:
            - error
        details:
          type: object
          description: Additional error details.
          additionalProperties: true
      required:
        - code
        - message
        - status
      additionalProperties: false
    InvalidTokenError:
      x-zs-$id: InvalidTokenError
      type: object
      description: >-
        Represents an error response returned when the access token in the
        request is invalid or expired.
      properties:
        code:
          type: string
          description: Error code.
          enum:
            - INVALID_TOKEN
        message:
          type: string
          description: Error message.
          maxLength: 500
        status:
          type: string
          description: Status of the error.
          enum:
            - error
        details:
          type: object
          description: Additional error details.
          additionalProperties: true
      required:
        - code
        - message
        - status
      additionalProperties: false
    RecordNotFoundError:
      x-zs-$id: RecordNotFoundError
      type: object
