  /{parentRecordModule}/deleted/{parentRecord}/{relatedList}:
    get:
      summary: List deleted related records
      description: >-
        To retrieve the list of records that were previously associated with a
        parent record but have since been deleted from the related list in your
        Zoho CRM organization.
      operationId: getDeletedRelatedRecord
      parameters:
        - $ref: '#/components/parameters/ParentRecordModule'
        - $ref: '#/components/parameters/ParentRecord'
        - $ref: '#/components/parameters/RelatedList'
        - $ref: '#/components/parameters/Fields'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: >-
            Returns the list of deleted related records for the specified parent
            record, along with pagination metadata.
          content:
            application/json:
              schema:
                x-zs-$id: SuccessResponseForDeletedRelatedRecords
                type: object
                description: >-
                  Represents the response for deleted related records, including
                  the record references and pagination metadata.
                additionalProperties: false
                required:
                  - data
                  - info
                properties:
                  data:
                    type: array
                    description: Array of deleted related record references.
                    maxItems: 200
                    items:
                      type: object
                      description: >-
                        Represents a deleted related record reference, including
                        its identifier and associated metadata.
                      additionalProperties: true
                      required:
                        - id
                      properties:
                        id:
                          type: string
                          description: Unique identifier of the deleted record.
                          pattern: ^[0-9]+$
                          maxLength: 20
                          x-zs-$id: RelatedRecordsId
                        $member_info:
                          type: object
                          description: Metadata about the related record.
                          additionalProperties: false
                          properties:
                            id:
                              type: string
                              description: ID of the member info.
                              pattern: ^[0-9]+$
                              maxLength: 20
                            Created_Time:
                              type: string
                              description: >-
                                Represents the creation date and time of the
                                record.
                              format: date-time
                            Modified_Time:
                              type: string
                              description: Timestamp when the record was last modified.
                              format: date-time
                        Moved_To__s:
                          type: string
                          description: >-
                            Stage value to which the record was moved (stage
                            history / picklist movement).
                          maxLength: 255
                  info:
                    type: object
                    description: Pagination metadata for deleted records.
                    additionalProperties: false
                    required:
                      - page
                      - per_page
                      - count
                      - more_records
                    properties:
                      page:
                        type: integer
                        format: int32
                        description: Current page number.
                        minimum: 1
                      per_page:
                        type: integer
                        format: int32
                        description: Number of records per page.
                        minimum: 1
                        maximum: 200
                      count:
                        type: integer
                        format: int32
                        description: Number of records in current response.
                        minimum: 0
                      more_records:
                        type: boolean
                        description: Indicates if more pages are available.
                      next_page_token:
                        type:
                          - string
                          - 'null'
                        description: Token to retrieve the next page of results.
                        maxLength: 500
                      page_token_expiry:
                        type:
                          - string
                          - 'null'
                        format: date-time
                        description: Expiration timestamp for the page token.
                      previous_page_token:
                        type:
                          - string
                          - 'null'
                        description: Token to retrieve the previous page of results.
                        maxLength: 500
              examples:
                DeletedProducts:
                  summary: List of deleted product records
                  value:
                    data:
                      - id: '2423488000000552158'
                        Owner:
                          name: Patricia
                          id: '2423488000000483001'
                          email: patricia@zoho.com
                        $member_info:
                          Created_Time: '2023-10-31T18:10:23+05:30'
                          Modified_Time: '2023-10-31T18:10:23+05:30'
                          id: '2423488000000558116'
                    info:
                      page: 1
                      per_page: 200
                      count: 1
                      more_records: false
                      next_page_token: null
                      page_token_expiry: null
                      previous_page_token: null
                  description: Shows list of deleted product records.
        '204':
          description: >-
            No deleted related records were found for the specified parent
            record.
        '400':
          description: >-
            The request contains invalid input, an unsupported module, or an
            invalid request method.

            **Resolution:** Review the error code and message in the response to
            identify the specific issue.
          content:
            application/json:
              schema:
                x-zs-$id: GetDeletedRelatedRecord400ErrorResponse
                oneOf:
                  - $ref: '#/components/schemas/InvalidModuleError'
                  - $ref: '#/components/schemas/NotSupportedError'
                  - $ref: '#/components/schemas/InvalidDataError'
                  - $ref: '#/components/schemas/InvalidRequestMethodError'
                  - $ref: '#/components/schemas/AuthorizationFailedError'
                  - $ref: '#/components/schemas/RequiredParamMissingError'
                description: >-
                  Contains one of the possible client error responses for
                  invalid module name, unsupported module, invalid data, invalid
                  request method, or authorization failure. May also indicate a
                  missing required parameter.
              examples:
                InvalidModule:
                  summary: Invalid module name provided
                  value:
                    code: INVALID_MODULE
                    message: The given module is not supported
                    status: error
                    details:
                      resource_path_index: 0
                  description: >-
                    Shows an error response when the module name in the request
                    URL is not a valid Zoho CRM module.
                NotSupported:
                  summary: Module not supported in API
                  value:
                    code: NOT_SUPPORTED
                    message: The given module is not supported in API
                    status: error
                    details:
                      resource_path_index: 0
                  description: Shows module not supported in API.
                InvalidDataError:
                  summary: Invalid data or related ID
                  value:
                    code: INVALID_DATA
                    message: The related id given seems to be invalid
                    status: error
                    details:
                      resource_path_index: 2
                  description: >-
                    Shows an invalid data error response when a related record
                    ID in the request is invalid.
                InvalidDataRelationNameError:
                  summary: Invalid data or related name
                  value:
                    code: INVALID_DATA
                    message: The related name given seems to be invalid
                    status: error
                    details:
                      resource_path_index: 2
                  description: >-
                    Shows an invalid data error response when the related list
                    name in the request is invalid.
                InvalidRequestMethod:
                  summary: Invalid HTTP request method
                  value:
                    code: INVALID_REQUEST_METHOD
                    message: The http request method type is not a valid one
                    status: error
                    details: {}
                  description: >-
                    Shows an error response when the HTTP method used does not
                    match the supported method for this endpoint.
                AuthorizationFailed:
                  summary: Insufficient privilege to read related records data
                  value:
                    code: AUTHORIZATION_FAILED
                    message: >-
                      User does not have sufficient privilege to read related
                      records data
                    status: error
                    details: {}
                  description: >-
                    Shows an authorization failure response when the access
                    token lacks the required read privilege.
                RequiredParamMissing:
                  summary: A required parameter is missing
                  value:
                    code: REQUIRED_PARAM_MISSING
                    message: One of the expected parameter is missing
                    status: error
                    details:
                      param_name: fields
                  description: Shows a required parameter is missing.
        '401':
          description: >-
            Authentication failed due to an invalid or expired token.

            **Resolution:** A valid access token must be provided in the
            Authorization header.
          content:
            application/json:
              schema:
                x-zs-$id: GetDeletedRelatedRecords401ErrorResponse
                oneOf:
                  - $ref: '#/components/schemas/InvalidTokenError'
                  - $ref: '#/components/schemas/OAuthScopeMismatchError'
                description: >-
                  Contains one of the possible unauthorized access error
                  responses for invalid token or OAuth scope mismatch.
              examples:
                InvalidToken:
                  summary: Invalid authentication token
                  value:
                    code: INVALID_TOKEN
                    details: {}
                    message: Invalid OAuth token
                    status: error
                  description: Shows invalid authentication token.
                OAuthScopeMismatch:
                  summary: Missing DELETE scope
                  value:
                    code: OAUTH_SCOPE_MISMATCH
                    message: >-
                      The access token you have used to make this API call does
                      not have the required scope.
                    status: error
                    details: {}
                  description: Shows missing DELETE scope.
        '403':
          description: >-
            The access token does not have permission to read related records in
            this module.

            **Resolution:** The CRM administrator must grant the required read
            permission to the user's profile.
          content:
            application/json:
              schema:
                x-zs-$id: NoPermissionError
                $ref: '#/components/schemas/NoPermissionError'
              examples:
                NoPermission:
                  summary: No permission to read related records
                  value:
                    code: NO_PERMISSION
                    message: Permission denied to read related records
                    status: error
                    details:
                      permissions:
                        - Crm_Implied_View_Leads
                  description: Shows no permission to read related records.
        '404':
          description: >-
            The specified parent record does not exist.

            **Resolution:** The **parentRecord** path parameter value must refer
            to an existing record.
          content:
            application/json:
              schema:
                x-zs-$id: RecordNotFoundErrorForDeletedRecords
                oneOf:
                  - $ref: '#/components/schemas/RecordNotFoundError'
                  - $ref: '#/components/schemas/InvalidUrlPatternError'
                description: >-
                  Contains one of the possible not-found error responses for
                  record not found or invalid URL pattern.
              examples:
                RecordNotFound:
                  summary: Parent record not found
                  value:
                    code: INVALID_DATA
                    details: {}
                    message: The record does not exist
                    status: error
                  description: >-
                    Shows a not-found error response when the specified parent
                    record does not exist.
                InvalidURLPattern:
                  summary: Invalid URL pattern
                  value:
                    code: INVALID_URL_PATTERN
                    message: Please check if the URL trying to access is a correct one
                    status: error
                    details: {}
                  description: Shows invalid URL pattern.
        '500':
          description: >-
            An internal server error occurred.

            **Resolution:** Retry the request after a brief delay. If the issue
