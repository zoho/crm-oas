openapi: 3.1.0
info:
  title: Zoho CRM Related Records API
  description: >-
    Related records are records from other modules that are associated with a
    parent CRM record through its configured related lists. This API enables
    developers to retrieve, update, delink, and inspect deleted related records
    for any parent record across all standard Zoho CRM modules.
  version: '8'
servers:
  - url: https://zohoapis.{dc}/crm/{version}
    description: >-
      Production API server for Zoho CRM. Sample request URL:
      `https://zohoapis.{dc}/crm/{version}`
    variables:
      dc:
        description: >-
          The top-level domain suffix for the Zoho CRM API endpoint. Possible
          values: **com**, **eu**, **in**, **cn**, **au**. Default: **com**.
        default: com
        enum:
          - com
          - eu
          - in
          - cn
          - au
      version:
        description: 'The API version for the request. Default: **v8**.'
        default: v8
paths:
  /{parentRecordModule}/{parentRecord}/{relatedList}:
    get:
      summary: Related Records
      description: >-
        To retrieve the list of records associated with a parent record from a
        specified related list in your Zoho CRM organization.
      operationId: getRelatedRecords
      parameters:
        - $ref: '#/components/parameters/ParentRecordModule'
        - $ref: '#/components/parameters/ParentRecord'
        - $ref: '#/components/parameters/RelatedList'
        - $ref: '#/components/parameters/Fields'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/IfModifiedSince'
        - $ref: '#/components/parameters/PageToken'
        - $ref: '#/components/parameters/IdsOptional'
        - $ref: '#/components/parameters/SortOrder'
        - $ref: '#/components/parameters/SortBy'
        - $ref: '#/components/parameters/Converted'
        - $ref: '#/components/parameters/Approved'
        - $ref: '#/components/parameters/ApprovalState'
        - $ref: '#/components/parameters/Filters'
      responses:
        '200':
          description: >-
            Returns the list of related records for the specified parent record,
            along with pagination metadata.
          content:
            application/json:
              schema:
                x-zs-$id: SuccessResponse
                type: object
                description: >-
                  Represents the response for a list of related records,
                  including the record fields and pagination metadata.
                additionalProperties: false
                required:
                  - data
                  - info
                properties:
                  data:
                    type: array
                    description: Array of related record objects with requested fields.
                    maxItems: 200
                    items:
                      type: object
                      description: Individual related record with dynamic CRM fields.
                      additionalProperties: true
                      properties:
                        id:
                          type: string
                          description: Unique identifier of the related record.
                          pattern: ^[0-9]+$
                          maxLength: 20
                          x-zs-$id: RelatedRecordsId2
                        Created_Time:
                          type: string
                          description: >-
                            Represents the creation date and time of the related
                            record.
                          format: date-time
                        Modified_Time:
                          type: string
                          description: Timestamp when the record was last modified.
                          format: date-time
                        Moved_To__s:
                          type: string
                          description: >-
                            Stage value to which the record was moved (stage
                            history / picklist movement).
                          maxLength: 255
                  info:
                    type: object
                    description: Pagination and response metadata.
                    additionalProperties: false
                    required:
                      - page
                      - per_page
                      - count
                      - more_records
                    properties:
                      page:
                        type: integer
                        format: int32
                        description: Current page number.
                        minimum: 1
                      per_page:
                        type: integer
                        format: int32
                        description: Number of records per page.
                        minimum: 1
                        maximum: 200
                      count:
                        type: integer
                        format: int32
                        description: Number of records in current response.
                        minimum: 0
                      more_records:
                        type: boolean
                        description: Indicates if more pages are available.
                      next_page_token:
                        type:
                          - string
                          - 'null'
                        description: Token to retrieve the next page of results.
                        maxLength: 500
                      page_token_expiry:
                        type:
                          - string
                          - 'null'
                        format: date-time
                        description: Expiration timestamp for the page token.
                      previous_page_token:
                        type:
                          - string
                          - 'null'
                        description: Token to retrieve the previous page of results.
                        maxLength: 500
              examples:
                ContactProductsSuccess:
                  summary: Contact with related Products
                  value:
                    data:
                      - id: '3652397000001234001'
                        Product_Name: Premium Widget
                        Unit_Price: 99.99
                        Created_Time: '2024-01-15T10:30:00Z'
                        Modified_Time: '2024-01-20T14:45:00Z'
                    info:
                      page: 1
                      per_page: 200
                      count: 1
                      more_records: false
                      next_page_token: null
                      page_token_expiry: null
                      previous_page_token: null
                  description: Shows contact with related Products.
                DealContactsPaginated:
                  summary: Deal with multiple related Contacts (paginated)
                  value:
                    data:
                      - id: '3652397000000624001'
                        First_Name: John
                        Last_Name: Doe
                        Email: john.doe@example.com
                        Created_Time: '2024-01-10T09:00:00Z'
                        Modified_Time: '2024-01-15T11:20:00Z'
                    info:
                      page: 1
                      per_page: 200
                      count: 1
                      more_records: true
                      next_page_token: abc123
                      page_token_expiry: '2024-01-25T10:00:00Z'
                      previous_page_token: null
                  description: Shows deal with multiple related Contacts (paginated).
        '204':
          description: >-
            No related records were found for the specified parent record in the
            given related list.
        '400':
          description: >-
            The request contains invalid input, an unsupported module, or an
            invalid request method.

            **Resolution:** Review the error code and message in the response to
            identify the specific issue.
          content:
            application/json:
              schema:
                x-zs-$id: GetRelatedRecords400ErrorResponse
                oneOf:
                  - $ref: '#/components/schemas/InvalidModuleError'
                  - $ref: '#/components/schemas/NotSupportedError'
                  - $ref: '#/components/schemas/InvalidDataError'
                  - $ref: '#/components/schemas/InvalidRequestMethodError'
                  - $ref: '#/components/schemas/AuthorizationFailedError'
                  - $ref: '#/components/schemas/RequiredParamMissingError'
                description: >-
                  Contains one of the possible client error responses for
                  invalid module name, unsupported module, invalid data, invalid
                  request method, or authorization failure. May also indicate a
                  missing required parameter.
              examples:
                InvalidModule:
                  summary: Invalid module name provided
                  value:
                    code: INVALID_MODULE
                    message: The given module is not supported
                    status: error
                    details:
                      resource_path_index: 0
                  description: >-
                    Shows an error response when the module name in the request
                    URL is not a valid Zoho CRM module.
                NotSupported:
                  summary: Module not supported in API
                  value:
                    code: NOT_SUPPORTED
                    message: The given module is not supported in API
                    status: error
                    details:
                      resource_path_index: 0
                  description: Shows module not supported in API.
                InvalidDataError:
                  summary: Invalid data or related ID
                  value:
                    code: INVALID_DATA
                    message: The related id given seems to be invalid
                    status: error
                    details:
                      resource_path_index: 1
                  description: >-
                    Shows an invalid data error response when a related record
                    ID in the request is invalid.
                InvalidDataRelationNameError:
                  summary: Invalid data or related name
                  value:
                    code: INVALID_DATA
                    message: The related name given seems to be invalid
                    status: error
                    details:
                      resource_path_index: 2
                  description: >-
                    Shows an invalid data error response when the related list
                    name in the request is invalid.
                InvalidRequestMethod:
                  summary: Invalid HTTP request method
                  value:
                    code: INVALID_REQUEST_METHOD
                    message: The http request method type is not a valid one
                    status: error
                    details: {}
                  description: >-
                    Shows an error response when the HTTP method used does not
                    match the supported method for this endpoint.
                AuthorizationFailed:
                  summary: Insufficient privilege to read related records data
                  value:
                    code: AUTHORIZATION_FAILED
                    message: >-
                      User does not have sufficient privilege to read related
                      records data
                    status: error
                    details: {}
                  description: >-
                    Shows an authorization failure response when the access
                    token lacks the required read privilege.
                RequiredParamMissing:
                  summary: A required parameter is missing
                  value:
                    code: REQUIRED_PARAM_MISSING
                    message: One of the expected parameter is missing
                    status: error
                    details:
                      param_name: fields
                  description: Shows a required parameter is missing.
        '401':
          description: >-
            Authentication failed due to an invalid or expired token.

            **Resolution:** A valid access token must be provided in the
            Authorization header.
          content:
            application/json:
              schema:
                x-zs-$id: GetRelatedRecords401ErrorResponse
                oneOf:
                  - $ref: '#/components/schemas/InvalidTokenError'
                  - $ref: '#/components/schemas/OAuthScopeMismatchError'
                description: >-
                  Contains one of the possible unauthorized access error
                  responses for invalid token or OAuth scope mismatch.
              examples:
                InvalidToken:
                  summary: Invalid authentication token
                  value:
                    code: INVALID_TOKEN
                    details: {}
                    message: Invalid OAuth token
                    status: error
                  description: Shows invalid authentication token.
                OAuthScopeMismatch:
                  summary: Missing READ scope
                  value:
                    code: OAUTH_SCOPE_MISMATCH
                    message: >-
                      The access token you have used to make this API call does
                      not have the required scope.
                    status: error
                    details: {}
                  description: Shows missing READ scope.
        '403':
          description: >-
            The access token does not have permission to read related records in
            this module.

            **Resolution:** The CRM administrator must grant the required read
            permission to the user's profile.
          content:
            application/json:
              schema:
                x-zs-$id: NoPermissionError
                $ref: '#/components/schemas/NoPermissionError'
              examples:
                NoPermission:
                  summary: No permission to read related records
                  value:
                    code: NO_PERMISSION
                    details:
                      permissions:
                        - Crm_Implied_View_Leads
                    message: Permission denied to read related records
                    status: error
                  description: Shows no permission to read related records.
        '404':
          description: >-
            The specified parent record or related list does not exist.

            **Resolution:** The **parentRecord** and **relatedList** path
            parameter values must refer to existing resources.
          content:
            application/json:
              schema:
                x-zs-$id: RecordNotFoundAndInvalidUrlPatternErrorForGetRelatedRecords
                oneOf:
                  - $ref: '#/components/schemas/RecordNotFoundError'
                  - $ref: '#/components/schemas/InvalidUrlPatternError'
                description: >-
                  Contains one of the possible not-found error responses for
                  record not found or invalid URL pattern.
              examples:
                RecordNotFound:
                  summary: Parent record not found
                  value:
                    code: INVALID_DATA
                    details: {}
                    message: The record does not exist
                    status: error
                  description: >-
                    Shows a not-found error response when the specified parent
                    record does not exist.
                InvalidURLPattern:
                  summary: Invalid URL pattern
                  value:
                    code: INVALID_URL_PATTERN
                    message: Please check if the URL trying to access is a correct one
                    status: error
                    details: {}
                  description: Shows invalid URL pattern.
        '500':
          description: >-
            An internal server error occurred.

            **Resolution:** Retry the request after a brief delay. If the issue
            persists, contact Zoho CRM support.
          content:
            application/json:
              schema:
                x-zs-$id: InternalError
                $ref: '#/components/schemas/InternalError'
              examples:
                InternalError:
                  summary: Unexpected server error
                  value:
                    code: INTERNAL_ERROR
                    details: {}
                    message: Unexpected and unhandled exception in Server
                    status: error
                  description: Shows unexpected server error.
      security:
        - OAuth2:
            - ZohoCRM.modules.READ
    put:
      summary: Update related records
      description: >-
        To update multiple records associated with a parent record in a
        specified related list in your Zoho CRM organization.
      operationId: updateRelatedRecords
      parameters:
        - $ref: '#/components/parameters/ParentRecordModule'
        - $ref: '#/components/parameters/ParentRecord'
        - $ref: '#/components/parameters/RelatedList'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: >-
                Represents the request payload for updating multiple related
                records in a related list.
              additionalProperties: false
              required:
                - data
              properties:
                data:
                  type: array
                  description: Array of records to update with their IDs and field values.
                  minItems: 1
                  maxItems: 100
                  items:
                    type: object
                    description: Individual record update with ID and fields to modify.
                    additionalProperties: true
                    required:
                      - id
                    properties:
                      id:
                        description: Unique identifier of the record to update.
                        type: string
                        format: int64
                        x-zs-$ref:
                          resource: record
                          origins:
                            - operationId: getRecords
                              propertyId: RecordsId
            examples:
              UpdateMultipleProducts:
                summary: Update prices for multiple products
                value:
                  data:
                    - id: '3652397000001234001'
                      Unit_Price: 109.99
                      Discount: 10
                    - id: '3652397000001234002'
                      Unit_Price: 79.99
                      Discount: 5
                description: Shows update prices for multiple products.
        description: >-
          The request body must contain a **data** array with one or more
          objects. You can include a maximum of 100 objects per request.
      responses:
        '200':
          description: >-
            Returns the bulk operation response indicating the status of each
            update request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkOperationResponse'
              examples:
                SuccessfulUpdate:
                  summary: All records updated successfully
                  value:
                    data:
                      - code: SUCCESS
                        details:
                          id: '3652397000001234001'
                        message: record updated
                        status: success
                  description: Shows all records updated successfully.
        '207':
          description: >-
            Returns a mixed-status bulk operation response when some records
            update successfully and others fail. Each item in the **data** array
            indicates whether the record update succeeded or provides the reason
            for failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkOperationResponse'
              examples:
                PartialSuccessUpdate:
                  summary: Some records updated, some records failed
                  value:
                    data:
                      - code: SUCCESS
                        details:
                          id: '4732219000018885044'
                        message: record updated
                        status: success
                      - code: INVALID_DATA
                        details:
                          id: '99999999'
                        message: invalid data
                        status: error
                  description: Shows some records updated, some records failed.
        '400':
          description: >-
            The request contains invalid input, an unsupported module, mandatory
            field missing, or an invalid request method.

            **Resolution:** Review the error code and message in the response to
            identify the specific issue.
          content:
            application/json:
              schema:
                x-zs-$id: UpdateSpecificRelatedRecord400ErrorResponse
                oneOf:
                  - $ref: '#/components/schemas/InvalidModuleError'
                  - $ref: '#/components/schemas/NotSupportedError'
                  - $ref: '#/components/schemas/InvalidDataError'
                  - $ref: '#/components/schemas/InvalidRequestMethodError'
                  - $ref: '#/components/schemas/AuthorizationFailedError'
                  - $ref: '#/components/schemas/MandatoryNotFoundError'
                  - $ref: '#/components/schemas/RelationNotFoundBulkError'
                  - $ref: '#/components/schemas/MandatoryNotFoundBulkError'
                description: >-
                  Contains one of the possible client error responses for
                  invalid module name, unsupported module, invalid data, invalid
                  request method, authorization failure, mandatory field not
                  found, relation not found, or mandatory field missing in bulk
                  data.
              examples:
                InvalidModule:
                  summary: Invalid module name provided
                  value:
                    code: INVALID_MODULE
                    message: The given module is not supported
                    status: error
                    details:
                      resource_path_index: 0
                  description: >-
                    Shows an error response when the module name in the request
                    URL is not a valid Zoho CRM module.
                NotSupported:
                  summary: Module not supported in API
                  value:
                    code: INVALID_MODULE
                    message: The given module is not supported in API
                    status: error
                    details:
                      resource_path_index: 0
                  description: Shows module not supported in API.
                InvalidDataError:
                  summary: Invalid data or related ID
                  value:
                    code: INVALID_DATA
                    message: The related id given seems to be invalid
                    status: error
                    details:
                      resource_path_index: 1
                  description: >-
                    Shows an invalid data error response when a related record
                    ID in the request is invalid.
                InvalidDataRelationNameError:
                  summary: Invalid data or related name
                  value:
                    code: INVALID_DATA
                    message: The related name given seems to be invalid
                    status: error
                    details:
                      resource_path_index: 2
                  description: >-
                    Shows an invalid data error response when the related list
                    name in the request is invalid.
                InvalidRequestMethod:
                  summary: Invalid HTTP request method
                  value:
                    code: INVALID_REQUEST_METHOD
                    message: The http request method type is not a valid one
                    status: error
                    details: {}
                  description: >-
                    Shows an error response when the HTTP method used does not
                    match the supported method for this endpoint.
                AuthorizationFailed:
                  summary: Insufficient privilege to update related records data
                  value:
                    code: AUTHORIZATION_FAILED
                    message: >-
                      User does not have sufficient privilege to update related
                      records data
                    status: error
                    details: {}
                  description: >-
                    Shows an authorization failure response when the access
                    token lacks the required update privilege.
                MandatoryNotFound:
                  summary: Required field not found
                  value:
                    code: MANDATORY_NOT_FOUND
                    message: Required field not found
                    status: error
                    details:
                      api_name: list_price
                      json_path: $.data[0].list_price
                  description: Shows required field not found.
                RelationNotFoundBulk:
                  summary: Relation not found error
                  value:
                    data:
                      - code: INVALID_DATA
                        details:
                          api_name: id
                          json_path: $.data[0].id
                        message: the id given seems to be invalid
                        status: error
                  description: Shows relation not found error.
                MandatoryNotFoundBulk:
                  summary: Required field not found in bulk operation
                  value:
                    data:
                      - code: MANDATORY_NOT_FOUND
                        details:
                          api_name: list_price
                          json_path: $.data[0].list_price
                        message: required field not found
                        status: error
                  description: Shows required field not found in bulk operation.
        '401':
          description: >-
            Authentication failed due to an invalid or expired token.

            **Resolution:** A valid access token must be provided in the
            Authorization header.
          content:
            application/json:
              schema:
                x-zs-$id: UpdateRelatedRecords401ErrorResponse
                oneOf:
                  - $ref: '#/components/schemas/InvalidTokenError'
                  - $ref: '#/components/schemas/OAuthScopeMismatchError'
                description: >-
                  Contains one of the possible unauthorized access error
                  responses for invalid token or OAuth scope mismatch.
              examples:
                InvalidToken:
                  summary: Invalid authentication token
                  value:
                    code: INVALID_TOKEN
                    details: {}
                    message: Invalid OAuth token
                    status: error
                  description: Shows invalid authentication token.
                OAuthScopeMismatch:
                  summary: Missing READ scope
                  value:
                    code: OAUTH_SCOPE_MISMATCH
                    message: >-
                      The access token you have used to make this API call does
                      not have the required scope.
                    status: error
                    details: {}
                  description: Shows missing READ scope.
        '403':
          description: >-
            The access token does not have permission to update related records
            in this module.

            **Resolution:** The CRM administrator must grant the required update
            permission to the user's profile.
          content:
            application/json:
              schema:
                x-zs-$id: NoPermissionError
                $ref: '#/components/schemas/NoPermissionError'
              examples:
                NoPermission:
                  summary: No permission to read related records
                  value:
                    code: NO_PERMISSION
                    details:
                      permissions:
                        - Crm_Implied_View_Leads
                    message: Permission denied to read related records
                    status: error
                  description: Shows no permission to read related records.
        '404':
          description: >-
            The request URL does not match a valid API endpoint pattern.

            **Resolution:** The URL must follow the pattern
            `{api-domain}/crm/{version}/{parentRecordModule}/{parentRecord}/{relatedList}`.
          content:
            application/json:
              schema:
                x-zs-$id: RecordNotFoundAndInvalidUrlPatternErrorForUpdateRelatedRecords
                oneOf:
                  - $ref: '#/components/schemas/RecordNotFoundError'
                  - $ref: '#/components/schemas/InvalidUrlPatternError'
                description: >-
                  Contains one of the possible not-found error responses for
                  record not found or invalid URL pattern.
              examples:
                RecordNotFound:
                  summary: Related record not found
                  value:
                    code: INVALID_DATA
                    details: {}
                    message: The record does not exist
                    status: error
                  description: >-
                    Shows a not-found error response when the specified related
                    record does not exist.
                InvalidURLPattern:
                  summary: Invalid URL pattern
                  value:
                    code: INVALID_URL_PATTERN
                    message: Please check if the URL trying to access is a correct one
                    status: error
                    details: {}
                  description: Shows invalid URL pattern.
        '500':
          description: >-
            An internal server error occurred.

            **Resolution:** Retry the request after a brief delay. If the issue
            persists, contact Zoho CRM support.
          content:
            application/json:
              schema:
                x-zs-$id: InternalError
                $ref: '#/components/schemas/InternalError'
              examples:
                InternalError:
                  summary: Unexpected server error
                  value:
                    code: INTERNAL_ERROR
                    message: Unexpected and unhandled exception in Server
                    status: error
                    details: {}
                  description: Shows unexpected server error.
      security:
        - OAuth2:
            - ZohoCRM.modules.UPDATE
    delete:
      summary: Delink related records
      description: >-
        To delink multiple records from a parent record's related list in your
        Zoho CRM organization. This operation removes only the relationship
        links - the related records themselves remain intact in their respective
        modules.
      operationId: delinkRelatedRecords
      parameters:
        - $ref: '#/components/parameters/ParentRecordModule'
        - $ref: '#/components/parameters/ParentRecord'
        - $ref: '#/components/parameters/RelatedList'
        - $ref: '#/components/parameters/Ids'
      responses:
        '200':
          description: >-
            Returns the bulk operation response indicating the status of each
            delink request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkOperationResponse'
              examples:
                SuccessfulDelink:
                  summary: Records delinked successfully
                  value:
                    data:
                      - code: SUCCESS
                        details:
                          id: '3652397000001234001'
                        message: record deleted
                        status: success
                  description: >-
                    Shows a successful response when all specified record IDs
                    are delinked from the parent record.
        '207':
          description: >-
            Returns a bulk operation response when some records are delinked and
            others fail. Each item in the **data** array indicates whether the
            delink succeeded or the reason for failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkOperationResponse'
              examples:
                PartialSuccessDelink:
                  summary: Some relations removed, some relation IDs invalid/not found
                  value:
                    data:
                      - code: SUCCESS
                        details:
                          id: '4732219000018885044'
                        message: relation removed
                        status: success
                      - code: INVALID_DATA
                        details:
                          id: '99999999'
                        message: relation not found
                        status: error
                  description: >-
                    Shows a mixed-status response when some record IDs are
                    delinked and others are invalid or not found.
        '400':
          description: >-
            The request contains invalid input, an unsupported module, an
            invalid request method, or exceeds the record limit.

            **Resolution:** Review the error code and message in the response to
            identify the specific issue.
          content:
            application/json:
              schema:
                x-zs-$id: DelinkRelatedRecords400ErrorResponse
                oneOf:
                  - $ref: '#/components/schemas/InvalidModuleError'
                  - $ref: '#/components/schemas/NotSupportedError'
                  - $ref: '#/components/schemas/InvalidDataError'
                  - $ref: '#/components/schemas/InvalidRequestMethodError'
                  - $ref: '#/components/schemas/AuthorizationFailedError'
                  - $ref: '#/components/schemas/MandatoryNotFoundError'
                  - $ref: '#/components/schemas/UnableToParseDataTypeError'
                  - $ref: '#/components/schemas/RelationNotFoundBulkError'
                  - $ref: '#/components/schemas/LimitExceededError'
                description: >-
                  Contains one of the possible client error responses for
                  invalid module name, unsupported module, invalid data, invalid
                  request method, authorization failure, mandatory field not
                  found, unable to parse data type, relation not found, or
                  record limit exceeded.
              examples:
                InvalidModule:
                  summary: Invalid module name provided
                  value:
                    code: INVALID_MODULE
                    message: The module name given seems to be invalid
                    status: error
                    details:
                      resource_path_index: 0
                  description: >-
                    Shows an error response when the module name in the request
                    URL is not a valid Zoho CRM module.
                NotSupported:
                  summary: Module not supported in API
                  value:
                    code: NOT_SUPPORTED
                    message: The given module is not supported in API
                    status: error
                    details:
                      resource_path_index: 0
                  description: Shows module not supported in API.
                InvalidDataError:
                  summary: Invalid data or related ID
                  value:
                    code: INVALID_DATA
                    message: The related id given seems to be invalid
                    status: error
                    details:
                      resource_path_index: 1
                  description: >-
                    Shows an invalid data error response when a related record
                    ID in the request is invalid.
                InvalidDataRelationNameError:
                  summary: Invalid data or related name
                  value:
                    code: INVALID_DATA
                    message: The related name given seems to be invalid
                    status: error
                    details:
                      resource_path_index: 2
                  description: >-
                    Shows an invalid data error response when the related list
                    name in the request is invalid.
                InvalidRequestMethod:
                  summary: Invalid HTTP request method
                  value:
