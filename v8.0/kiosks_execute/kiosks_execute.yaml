        timestamps, owner information, executable state details, and the
        execution record ID.
      properties:
        Kiosk_End_Time:
          type: string
          description: >-
            The timestamp indicating when the most recently executed state of
            the Kiosk ended, in ISO 8601 format. The response is sorted in
            descending order of this field, with the most recent executions
            listed first.
          maxLength: 255
        Owner:
          $ref: '#/components/schemas/PreviewOwnerSummary'
        executable_info:
          $ref: '#/components/schemas/ExecutionExecutableInfo'
        id:
          type: string
          description: The unique identifier of the available transition.
          maxLength: 255
        Kiosk_Start_Time:
          type: string
          description: >-
            Represents the date and time at which the kiosk execution record
            session began.
          maxLength: 255
      required:
        - Kiosk_End_Time
        - Kiosk_Start_Time
        - Owner
        - executable_info
        - id
      title: Kiosk Execution Record
    KioskTestRunEntry:
      type: object
      additionalProperties: false
      description: >-
        Represents a test run payload entry that provides the data context
        needed for executing a kiosk test run.
      properties:
        data:
          $ref: '#/components/schemas/ExecuteDataContainer'
          description: Contains information about the current record module if any
      title: Kiosk Test Run Entry
    PreviewRecordData:
      type: object
      additionalProperties: false
      description: >-
        Represents the data returned for a previewed CRM record, including key
        field values and owner details.
      properties:
        First_Name:
          type:
            - string
            - 'null'
          description: >-
            Represents the first name of the contact or lead in the previewed
            CRM record.
          maxLength: 255
        Company:
          type: string
          description: Represents the company name of the previewed CRM record.
          maxLength: 255
        Owner:
          $ref: '#/components/schemas/PreviewOwnerSummary'
        id:
          type: string
          description: Contains the unique identifier of the previewed CRM record.
          maxLength: 255
      required:
        - Company
        - First_Name
        - Owner
        - id
      title: Preview Record Data
      x-zs-$id: PreviewRecordData
    ExecutionActionStatusItem:
      type: object
      additionalProperties: false
      description: >-
        Represents the result of an execution action, including the status code,
        message, and details of the next executable state.
      properties:
        code:
          type: string
          description: Represents the status code returned for the execution action result.
          maxLength: 255
        details:
          $ref: '#/components/schemas/TestRunExecutionDetails'
        message:
          type: string
          description: Contains the message describing the outcome of the execution action.
          maxLength: 255
        status:
          type: string
          description: Indicates the overall status of the execution action result.
          maxLength: 255
      title: Execution Action Status Item
    KioskExecuteActionPayload:
      type: object
      additionalProperties: false
      description: >-
        Represents the request payload for executing a kiosk, containing one or
        more execute action entries.
      properties:
        kiosk_execute:
          type: array
          description: >-
            The request body must be a JSON object containing the kiosk_execute
            array. The array contains the  data required to execute the Kiosk.
          items:
            $ref: '#/components/schemas/ExecuteActionEntry'
          maxItems: 1
      required:
        - kiosk_execute
      title: Kiosk Execute Action Payload
    ExecutionOwnerDetail:
      type: object
      additionalProperties: false
      description: >-
        Represents detailed owner information for a kiosk execution, including
        name, ID, and email address.
      properties:
        name:
          type: string
          description: >-
            Represents the full name of the owner associated with the kiosk
            execution.
          maxLength: 255
        id:
          type: string
          description: >-
            Contains the unique identifier of the owner associated with the
            kiosk execution.
          maxLength: 255
        email:
          type: string
          description: >-
            Represents the email address of the owner associated with the kiosk
            execution.
          maxLength: 255
      required:
        - email
        - id
        - name
      title: Execution Owner Detail
    ExecuteDataContainer:
      type: object
      additionalProperties: false
      description: >-
        Represents the execution data container, holding the current record
        reference and the execution instance ID.
      properties:
        Current_Record:
          $ref: '#/components/schemas/ExecuteCurrentRecordRef'
          description: >-
            The Current_Record field provides the record context for the Kiosk
            execution.
        id:
          type:
            - string
            - 'null'
          description: Represents the unique identifier of the kiosk execution instance.
          maxLength: 18
      title: Execute Data Container
  parameters:
    KioskIdPathParams:
      name: kioskId
      in: path
      required: true
      description: >-
        Specify the unique identifier of the kiosk for which you want to perform
        the operation.
      schema:
        type: string
        maxLength: 19
    ExecutionIdPathParams:
      name: executionId
      in: path
      required: true
      description: Specify the unique ID of the execution.
      schema:
        type: string
        maxLength: 19
    ParamQueryCurrentRecordId:
      name: current_record_id
      in: query
      description: >
        Specifies the ID of the record to use as the Current Record context
        while previewing the Kiosk. The record must belong to the module
        configured as the Current Record in the Kiosk.

        If this parameter is not provided, merge fields that reference the
        Current Record are not evaluated during the Kiosk preview and will
        return empty values.
      required: false
      schema:
        type: string
        format: int64
    ParamQueryInvokedFrom:
      name: invoked_from
      in: query
      description: |
        Specify the context from which the kiosk preview is being invoked.
        Possible values:
        detail_view - The kiosk is invoked from the CRM record detail view.
        home_page - The Kiosk is invoked from the home page.
        cscript - The Kiosk is invoked from a Client Script.
        canvas - The Kiosk is invoked from a Canvas view.
      required: false
      schema:
        type: string
        enum:
          - detail_view
          - home_page
          - cscript
          - canvas
    ParamQueryIncludeInnerDetails:
      name: include_inner_details
      in: query
      description: >-
        Specify additional inner details to include in the response. Accepts a
        comma-separated list of dot-notation paths indicating which nested
        properties should return extended information.
      required: false
      schema:
        type: string
        maxLength: 500
    ParamQueryPage:
      name: page
      in: query
      description: Page number for pagination.
      required: false
      schema:
        type: integer
        format: int32
    ParamQueryPerPage:
      name: per_page
      in: query
      description: Number of results per page.
      required: false
      schema:
        type: integer
        format: int32
    ParamQueryNavigatedFromBack:
      name: navigated_from_back
      in: query
      description: Indicates whether the execution was navigated from a back action.
      required: false
      schema:
        type: boolean
  securitySchemes:
    OAuth2:
      type: oauth2
      description: OAuth2 authentication for API access
      flows:
        authorizationCode:
          authorizationUrl: https://accounts.zoho.com/oauth/v2/auth
          tokenUrl: https://accounts.zoho.com/oauth/v2/token
          refreshUrl: https://accounts.zoho.com/oauth/v2/token
          scopes:
            ZohoCRM.settings.kiosks.ALL: >-
              Grants full access to kiosk settings in Zoho CRM, including
              create, read, update, and delete operations.
            ZohoCRM.settings.kiosks.CREATE: >-
              Grants permission to initiate kiosk executions and test runs in
              Zoho CRM.
            ZohoCRM.settings.kiosks.READ: >-
              Grants permission to retrieve kiosk execution details, preview
              states, and execution records in Zoho CRM.
            ZohoCRM.settings.kiosks.UPDATE: >-
              Grants permission to advance kiosk execution states by executing
              transitions in Zoho CRM.
            ZohoCRM.settings.kiosks.DELETE: >-
              Grants permission to delete kiosk settings and related resources
              in Zoho CRM.
