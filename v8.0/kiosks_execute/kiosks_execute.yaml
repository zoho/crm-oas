                            id: '2296900000011252003'
                          transitions:
                            - id: '2296900000011252001'
                        id: '2296900000011330195'
                        Kiosk_Start_Time: '2025-12-09T10:54:51+05:30'
                      - Kiosk_End_Time: '2025-12-09T10:54:26+05:30'
                        Owner:
                          name: Dylan Vasquez
                          id: '2296900000000471001'
                        executable_info:
