  /settings/kiosks/{kioskId}/executions/{executionId}/actions/execute:
    put:
      summary: Update a Kiosk Execution
      description: >
        To execute a transition in an ongoing Kiosk execution by submitting the
        required transition and runtime data, and proceed to the next step of
        the Kiosk in your Zoho CRM.

        The Kiosk must be in the published status and have an active execution
        to update its execution state. To obtain the execution_ID, execute the
        Kiosk using the [Execute a Kiosk
        API](kiosks_execute.yaml#$.paths./settings/kiosks/{kioskId}/actions/execute.post).
        If an execution is already in progress, invoke the [Get Executions of a
        Kiosk
        API](kiosks_execute.yaml#$.paths./settings/kiosks/{kioskId}/executions.post)
        to retrieve the execution_ID.
      operationId: executeKioskState
      parameters:
        - $ref: '#/components/parameters/KioskIdPathParams'
        - $ref: '#/components/parameters/ExecutionIdPathParams'
      requestBody:
        description: >-
          The request body must contain a kiosk_executions array with one
          object. Each object must include a transition (with a required
          transition ID) and may include a data object with the current record
          context and execution ID.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KioskExecutionActionPayload'
            examples:
              SamplePutRequest:
                summary: Execute the Done transition for a kiosk execution
                value:
                  kiosk_executions:
                    - transition:
                        id: '2296900000011330157'
                        name: Done
                      data:
                        id: '229690000001133230'
                description: >-
                  Shows a kiosk execution request with the Done transition ID
                  and associated execution data ID specified.
            x-zs-llm-examples:
              - SamplePutRequest
      responses:
        '200':
          description: >-
            Returns a kiosk_executions array confirming that the transition was
            executed successfully. Each item includes the execution status code,
            a message, and a details object containing the next executable state
            and any dependent states that were executed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KioskExecutionActionSuccessResponse'
              examples:
                Success200:
                  summary: Successful execution of a Kiosk transition
                  value:
                    kiosk_executions:
                      - code: SUCCESS
                        details:
                          next_executable_state:
                            name: Select Product
                            id: '2296900000011290813'
                          executed_dependent_states: null
                          id: '2296900000011330251'
                        message: Kiosk transition executed successfully
                        status: success
                  description: >-
                    Shows a successful kiosk transition execution response. The
                    response confirms the transition was executed and identifies
                    the next executable state as Select Product.
          headers:
            X-API-CREDITS-REMAINING:
              schema:
                type: string
                format: int64
                description: >
                  Present when >=50% of base daily credits (excluding add-on
                  credits) are consumed. Value is total remaining credits
                  including add-on credits for the rolling 24-hour window.
              required: false
        '400':
          description: >-
            Invalid Kiosk transition given for execution.

            **Resolution:** A valid transition ID belonging to the current
            executable state must be specified in the request body.


            No such Kiosk exists.

            **Resolution:** A valid kiosk ID must be specified in the request
            URL.


            Invalid Kiosk execution ID.

            **Resolution:** A valid execution ID must be specified in the
            request URL.
          content:
            application/json:
              schema:
                description: >-
                  Represents the error response body returned when the kiosk
                  execution request contains invalid input, such as an invalid
                  kiosk ID, transition ID, or execution ID.
                oneOf:
                  - type: object
                    additionalProperties: false
                    description: >-
                      Represents a 400 error response that contains one or more
                      kiosk execution errors in the kiosk_executions array.
                    properties:
                      kiosk_executions:
                        type: array
                        description: >-
                          Represents the list of error objects returned when the
                          kiosk execution request fails.
                        items:
                          oneOf:
                            - $ref: >-
                                #/components/schemas/ExecutionInvalidTransitionError
                            - $ref: '#/components/schemas/ExecutionNotAllowedError'
                          description: >-
                            Represents an individual error object describing why
                            the kiosk execution request fails. Each item
                            corresponds to one of the following conditions: an
                            invalid transition ID, a non-existent kiosk, or an
                            invalid execution ID.
                        maxItems: 25
                    required:
                      - kiosk_executions
                    x-zs-$id: PutexecuteError400Wrapper
                  - $ref: '#/components/schemas/KioskTestRunInvalidKioskError'
                  - $ref: '#/components/schemas/ExecutionInvalidIdError'
                x-zs-$id: PutexecuteError400
              examples:
                InvalidDataResponse1:
                  summary: Invalid transition ID supplied for the kiosk execution
                  value:
                    kiosk_executions:
                      - code: INVALID_DATA
                        details:
                          api_name: id
                          json_path: $.kiosk_executions[0].transition.id
                        message: Invalid Kiosk transition given for execution
                        status: error
                  description: >-
                    Shows the error returned when the transition ID in the
                    request body is invalid or does not correspond to a valid
                    transition for the ongoing kiosk execution. The response
                    provides the JSON path to the invalid field in the
                    transition object.
                InvalidDataResponse2:
                  summary: Kiosk not found for the given kiosk ID
                  value:
                    code: INVALID_DATA
                    details:
                      resource_path_index: 2
                    message: No such Kiosk exists
                    status: error
                  description: >-
                    Shows the error returned when the kiosk ID in the request
                    URL does not match any existing kiosk. The response
                    identifies the invalid path segment using
                    resource_path_index 2.
                InvalidDataResponse3:
                  summary: Invalid execution ID supplied for the kiosk execution
                  value:
                    code: INVALID_DATA
                    details:
                      resource_path_index: 4
                    message: Invalid Kiosk execution id
                    status: error
                  description: >-
                    Shows the error returned when the execution ID in the
                    request URL does not correspond to a valid or active kiosk
                    execution. The response identifies the invalid path segment
                    using resource_path_index 4.
          headers:
            X-API-CREDITS-REMAINING:
              schema:
                type: string
                format: int64
                description: >
                  Present when >=50% of base daily credits (excluding add-on
                  credits) are consumed. Value is total remaining credits
                  including add-on credits for the rolling 24-hour window.
              required: false
      security:
        - OAuth2:
            - ZohoCRM.settings.kiosks.UPDATE
  /settings/kiosks/{kioskId}/actions/execute:
    post:
      summary: Execute a Kiosk
      description: >
        The execute Kiosk API is used to trigger the execution of a published
        Kiosk in Zoho CRM.

        This API returns only the first executable state of the Kiosk. To
        continue the execution through the remaining states, call the [Update a
        Kiosk Execution
        API](kiosks_execute.yaml#$.paths./settings/kiosks/{kiosk_id}/executions/{execution_id}/actions/execute.put)
        until the execution is complete.
      operationId: executeKiosk
      parameters:
        - $ref: '#/components/parameters/KioskIdPathParams'
      requestBody:
        description: >-
          The request body must contain a kiosk_execute array with one object.
          The object accepts an optional data field that provides the record
          context for the Kiosk execution, including the current record ID.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KioskExecuteActionPayload'
            examples:
              SamplePostRequest:
                summary: Execute Kiosk request with current record ID
                value:
                  kiosk_execute:
                    - data:
                        Current_Record:
                          id: '2296900000010790475'
                description: >-
                  Shows a sample request body for executing a Kiosk, providing
                  the current record ID as the data context for the Kiosk
                  execution.
            x-zs-llm-examples:
              - SamplePostRequest
      responses:
        '200':
          description: >-
            Returns the execution result for the published Kiosk, including the
            next executable state, the executed_dependent_states value, and the
            unique identifier of the execution record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KioskExecuteActionSuccessResponse'
              examples:
                Success200:
                  summary: Successful Kiosk execution with next executable state
                  value:
                    kiosk_execute:
                      - code: SUCCESS
                        details:
                          next_executable_state:
                            name: Screen 1
                            id: '2296900000011330159'
                          executed_dependent_states: null
                          id: '2296900000011330268'
                        message: Kiosk transition executed successfully
                        status: success
                  description: >-
                    Shows a successful Kiosk execution response returning the
                    first executable state. The response includes the next
                    executable state name and ID, a null
                    executed_dependent_states value, the execution record ID,
                    and a success status code.
          headers:
            X-API-CREDITS-REMAINING:
              schema:
                type: string
                format: int64
                description: >
                  Present when >=50% of base daily credits (excluding add-on
                  credits) are consumed. Value is total remaining credits
                  including add-on credits for the rolling 24-hour window.
              required: false
        '400':
          description: >-
            The specified Kiosk ID or request body is invalid.

            **Resolution:** A valid Kiosk ID must be specified in the request
            URL, and the request body must contain a value of the correct data
            type.
          content:
            application/json:
              schema:
                description: >-
                  Represents one of the possible error response shapes returned
                  for a 400 Bad Request on Kiosk execution. Either the specified
                  Kiosk ID does not match any existing Kiosk, or the request
                  body contains a value with an invalid data type.
                oneOf:
                  - $ref: '#/components/schemas/KioskTestRunInvalidKioskError'
                  - $ref: '#/components/schemas/ExecuteInvalidDataTypeError'
                x-zs-$id: PostexecuteError400
              examples:
                InvalidDataResponse1:
                  summary: 'INVALID_DATA error: no such Kiosk exists'
                  value:
                    code: INVALID_DATA
                    details:
                      resource_path_index: 2
                    message: No such Kiosk exists
                    status: error
                  description: >-
                    Shows a 400 error response returned when the Kiosk ID in the
                    request URL does not match any existing Kiosk. The response
                    includes an INVALID_DATA code and a message indicating that
                    no such Kiosk exists.
                InvalidDataResponse2:
                  summary: 'INVALID_DATA error: invalid data type in request body'
                  value:
                    code: INVALID_DATA
                    details:
                      expected_data_type: jsonobject
                    message: body
                    status: error
                  description: >-
                    Shows a 400 error response returned when the request body
                    contains a value with an invalid data type. The response
                    includes an INVALID_DATA code and a message indicating the
                    body value is of an unexpected type.
          headers:
            X-API-CREDITS-REMAINING:
              schema:
                type: string
                format: int64
                description: >
                  Present when >=50% of base daily credits (excluding add-on
                  credits) are consumed. Value is total remaining credits
                  including add-on credits for the rolling 24-hour window.
              required: false
      security:
        - OAuth2:
            - ZohoCRM.settings.kiosks.CREATE
components:
  schemas:
    PreviewSelectedField:
      type: object
      additionalProperties: false
      description: >-
        Represents metadata for a field included in the preview selection,
        including the field label, API name, UI type, and data type.
      properties:
        ui_type:
          type: integer
          format: int32
          description: >-
            Represents the UI type identifier that determines how the selected
            field is rendered in the preview.
        api_name:
          type: string
          description: >-
            Represents the API name of the selected field included in the
            preview screen.
          maxLength: 255
        field_label:
          type: string
          description: >-
            Represents the display label of the selected field as shown in the
            preview screen.
          maxLength: 255
        data_type:
          type: string
          description: >-
            Represents the data type of the selected field, such as text or
            ownerlookup.
          maxLength: 255
        id:
          type: string
          description: >-
            Contains the unique identifier of the selected field definition in
            the preview screen.
          maxLength: 255
      required:
        - api_name
        - data_type
        - field_label
        - id
        - ui_type
      title: Preview Selected Field
    ExecutionTransitionReference:
      type: object
      additionalProperties: false
      description: >-
        Represents transition input providing the transition name and required
        ID for kiosk execution progression.
      properties:
        name:
          type:
            - string
            - 'null'
          description: >-
            Represents the display name of the transition that triggers the
            current execution step.
          maxLength: 50
        id:
          type: string
          description: >-
            Represents the unique identifier of the transition that triggers the
            current execution step.
          maxLength: 19
      required:
        - id
      title: Execution Transition Reference
    ExecuteInvalidDataTypeError:
      type: object
      additionalProperties: false
      description: >-
        Returned when the execute action payload contains fields with invalid
        data types.
      properties:
        code:
          type: string
          description: >-
            Represents the error code returned when the payload contains fields
            with invalid data types.


            Possible values:

            INVALID_DATA - One or more fields in the request body carry a value
            of an unexpected data type.
          enum:
            - INVALID_DATA
        details:
          type: object
          additionalProperties: false
          description: >-
            Contains validation details identifying the data type discrepancy
            that caused the error.
          properties:
            expected_data_type:
              type: string
              description: >
                Indicates the data type that the field was expected to carry, as
                defined by the kiosk execution schema.
              maxLength: 255
          required:
            - expected_data_type
        message:
          type: string
          description: >-
            Represents the error message describing the source of the invalid
            data type violation.


            Possible values:

            body - The invalid data type was detected in the request body.
          enum:
            - body
        status:
          type: string
          description: >-
            Represents the response status returned when an invalid data type
            error occurs.


            Possible values:

            error - The request failed due to one or more fields containing
            values of an unexpected data type.
          enum:
            - error
      required:
        - code
        - details
        - message
        - status
      title: Execute Invalid Data Type Error
      x-zs-$id: ExecuteInvalidDataTypeError
    ExecutionActionEntry:
      type: object
      additionalProperties: false
      description: >-
        Represents an action entry for progressing a kiosk execution, providing
        the data context and transition information.
      properties:
        data:
          $ref: '#/components/schemas/ExecuteDataContainer'
          description: Contains information about the current execution
        transition:
          $ref: '#/components/schemas/ExecutionTransitionReference'
          description: Contains the transition information for next execution (Required)
      required:
        - transition
      title: Execution Action Entry
    KioskExecuteActionSuccessResponse:
      type: object
      additionalProperties: false
      description: >-
        Indicates a successful execute action and provides details about the
        next executable kiosk state.
      properties:
        kiosk_execute:
          type: array
          description: >-
            Contains the result of the execute action, including the status,
            message, and details of the next executable state.
          items:
            $ref: '#/components/schemas/ExecuteActionStatusItem'
          maxItems: 1
      title: Kiosk Execute Action Success Response
      x-zs-$id: KioskExecuteActionSuccessResponse
    ExecuteActionStatusItem:
      type: object
      additionalProperties: false
      description: >-
        Represents the result of an execute action, including the status code,
        message, and details of the next executable state.
      properties:
        code:
          type: string
          description: Represents the status code returned for the execute action result.
          maxLength: 255
        details:
          $ref: '#/components/schemas/TestRunExecutionDetails'
        message:
          type: string
          description: Represents the message describing the outcome of the execute action.
          maxLength: 255
        status:
          type: string
          description: >-
            Represents the response status indicating whether the execute action
            succeeded or encountered an error.
          maxLength: 255
      title: Execute Action Status Item
    PreviewTransitionSummary:
      type: object
      additionalProperties: false
      description: >-
        Describes a transition in the kiosk preview, including the connection
        flag, display name, ID, and property name of the transition button.
      properties:
        prop_name:
          type: string
          description: >
            Specifies the type of button displayed on the Kiosk screen. Each
            button corresponds to a transition path that the user can select
            from the current screen.

            **Possible values:**


            **primary** - Displays the button as the primary action on the
            screen, typically used for actions such as Next, Submit, or Save.


            **default** - Displays the button with the standard appearance,
            suitable for secondary actions.


            **outlineprimary** - Displays the button with a primary-colored
            outline, emphasizing the action without making it the primary
            button.


            **failure** - Displays the button with a solid error-themed style,
            typically used for destructive or critical actions such as Delete or
            Reject.


            **outlineredlight** - Displays the button with a red outline,
            typically used for secondary destructive actions such as Cancel,
            Discard, or Remove.
          enum:
            - primary
            - default
            - outlineprimary
            - failure
            - outlineredlight
          maxLength: 255
        is_connected_end:
          type: boolean
          description: >
            Indicates whether this transition leads to a connected end state in
            the kiosk flow.


            Possible values:

            true - The transition leads to a connected end state.

            false - The transition leads to an intermediate state in the kiosk
            flow.
        name:
          type: string
          description: Represents the display name of the transition in the kiosk preview.
          maxLength: 255
        id:
          type: string
          description: >-
            Contains the unique identifier of the transition in the kiosk
            preview.
          maxLength: 255
      required:
        - id
        - is_connected_end
        - name
        - prop_name
      title: Preview Transition Summary
    ExecutionTransitionSummary:
      type: object
      additionalProperties: false
      description: >-
        Represents a minimal transition reference used in kiosk execution
        records, containing the transition ID.
      properties:
        id:
          type: string
          description: >-
            Represents the unique identifier of the kiosk transition referenced
            in the execution record.
          maxLength: 255
      required:
        - id
      title: Execution Transition Summary
    KioskExecutionView:
      type: object
      additionalProperties: false
      description: >-
        Represents the screen and data for a specific execution state, including
        elements, layout dimensions, screen title, kiosk details, and executable
        information.
      properties:
        executable_info:
          $ref: '#/components/schemas/PreviewExecutableInfo'
        data:
          $ref: '#/components/schemas/ExecutionDataBlock'
        elements:
          type: array
          description: >-
            An array of UI elements and data sources configured in the Kiosk.
            Each element has a type field that determines its structure.
          items:
            $ref: '#/components/schemas/ExecutionElement'
          maxItems: 1
        width:
          type:
            - string
            - 'null'
          description: Indicates the display width of the kiosk execution state screen.
          enum:
            - 670px
            - 1000px
            - null
          maxLength: 255
        id:
          type: string
          description: Contains the unique identifier of the kiosk execution view record.
          maxLength: 255
        kiosk:
          $ref: '#/components/schemas/PreviewKioskSummary'
        title:
          type: string
          description: Represents the display title of the kiosk execution state screen.
          maxLength: 255
        button_align:
          type:
            - string
            - 'null'
          description: >-
            The alignment of action buttons. Possible values: right_to_left -
            Buttons are aligned from right to left. left_to_right - Buttons are
            aligned from left to right. center - Buttons are aligned to the
            center.
          enum:
            - right_to_left
            - left_to_right
            - center
            - null
          maxLength: 255
      required:
        - button_align
        - data
        - elements
        - executable_info
        - id
        - kiosk
        - title
        - width
      title: Kiosk Execution View
    PreviewFieldDefinition:
      type: object
      additionalProperties: false
      description: >-
        Describes a form or data field in the kiosk preview screen, including
        its label, API name, data type, UI type, and display constraints.
      properties:
        allow_multiple_upload:
          type: 'null'
          description: >-
            Indicates whether the field supports multiple file uploads, when
            applicable.
        field_label:
          type: string
          description: >-
            Represents the display label of the field as shown to the user in
            the kiosk screen.
          maxLength: 255
        length:
          type: integer
          format: int32
          description: Indicates the maximum character length configured for the field.
        tooltip:
          type: 'null'
          description: Contains the tooltip text displayed for the field, when applicable.
        _merge_field:
          type: string
          description: >-
            Represents the merge field template reference used to populate the
            field value from a linked kiosk process flow.
          maxLength: 255
        number_separator:
          type: boolean
          description: >-
            Indicates whether the field uses a number separator for display.


            Possible values:

            true - A number separator is applied when displaying the field
            value.

            false - No number separator is applied.
        required:
          type: boolean
          description: |-
            Indicates whether the field is required in the kiosk screen.

            Possible values:
            true - The field must be filled in before the user can proceed.
            false - The field is optional.
        ui_type:
          type: integer
          format: int32
          description: >-
            Represents the UI type identifier that determines how the field is
            rendered in the kiosk screen.
        read_only:
          type: boolean
          description: |-
            Indicates whether the field is read-only in the kiosk screen.

            Possible values:
            true - The field is read-only and cannot be edited by the user.
            false - The field is editable by the user.
        api_name:
          type: string
          description: Represents the API name of the field as defined in the CRM module.
          maxLength: 255
        data_type:
          type: string
          description: >-
            Represents the data type of the field, such as text, integer, or
            ownerlookup.
          maxLength: 255
        currency:
          type: 'null'
          description: >-
            Indicates the currency configuration for the field, when applicable
            to currency-type fields.
        id:
          type: string
          description: >-
            Contains the unique identifier of the field definition in the kiosk
            screen.
          maxLength: 255
        _pick_list_type:
          type:
            - string
            - 'null'
          description: >-
            Indicates the picklist type configuration for the field, when
            applicable.
          enum:
            - global_set
            - local
            - null
        decimal_place:
          type: 'null'
          description: >-
            Indicates the number of decimal places configured for the field,
            when applicable to numeric fields.
        pick_list_values:
          type: 'null'
          description: >-
            Contains the available picklist values for the field, when
            applicable to picklist field types.
      required:
        - _merge_field
        - _pick_list_type
        - allow_multiple_upload
        - api_name
        - currency
        - data_type
        - decimal_place
        - field_label
        - id
        - length
        - number_separator
        - pick_list_values
        - read_only
        - required
        - tooltip
        - ui_type
      title: Preview Field Definition
    PreviewGetRecordConfig:
      type: object
      additionalProperties: false
      description: >-
        Represents the configuration for a get record element in the preview
        screen, including selection details, module information, and the list of
        selected fields.
      properties:
        selection_details:
          $ref: '#/components/schemas/PreviewSelectionDetails'
        open_record:
          type: boolean
          description: >-
            Indicates whether the record detail view opens when a user selects a
            record in the preview.


            Possible values:

            true - The record detail view opens on selection.

            false - The record detail view does not open on selection.
        api_name:
          type: string
          description: >-
            Represents the API name of the get record element as defined in the
            kiosk configuration.
          maxLength: 255
        module:
          $ref: '#/components/schemas/PreviewModuleInfo'
        name:
          type: string
          description: >-
            Represents the display name of the get record element in the kiosk
            configuration.
          maxLength: 255
        id:
          type: string
          description: >-
            Contains the unique identifier of the get record element in the
            kiosk configuration.
          maxLength: 255
        selected_fields:
          type: array
          description: >-
            Contains the list of CRM fields configured for display in the get
            record element of the preview screen.
          items:
            $ref: '#/components/schemas/PreviewSelectedField'
          maxItems: 3
      required:
        - api_name
        - id
        - module
        - name
        - open_record
        - selected_fields
        - selection_details
      title: Preview Get Record Config
    PreviewDataSet:
      type: object
      additionalProperties: false
      description: >-
        Contains the records retrieved by the data elements configured in the
        Kiosk. This object uses dynamic keys, where each key is the API name of
        a data element (for example, a Get Records element). Each key maps to an
        object containing the retrieved record's display name (name) and unique
        identifier (id).
      properties:
        GetRecords_1:
          type: array
          description: >-
            Contains the list of record summaries returned by the GetRecords_1
            element in the preview screen.
          items:
            $ref: '#/components/schemas/PreviewRecordSummary'
          maxItems: 1
      required:
        - GetRecords_1
      title: Preview Data Set
    TestRunStatusItem:
      type: object
      additionalProperties: false
      description: >-
        Represents the outcome of a test run entry, including the status code,
        message, and detailed execution data.
      properties:
        code:
          type: string
          description: Represents the status code returned for the test run entry.
          maxLength: 255
        details:
          $ref: '#/components/schemas/TestRunExecutionDetails'
        message:
          type: string
          description: Contains the message describing the outcome of the test run entry.
          maxLength: 255
        status:
          type: string
          description: Indicates the overall status of the test run entry result.
          maxLength: 255
      title: Test Run Status Item
    ExecuteCurrentRecordRef:
      type: object
      additionalProperties: false
      description: >-
        Represents a reference to the current module record used during kiosk
        execution, including the record ID.
      properties:
        id:
          type:
            - string
            - 'null'
          description: >
            Represents the unique identifier of the current module record
            referenced during execution.
          maxLength: 19
      title: Execute Current Record Reference
    PreviewExecutableInfo:
      type: object
      additionalProperties: false
      description: >-
        Provides the current state and available transitions for the executable
        context of a kiosk preview.
      properties:
        state:
          $ref: '#/components/schemas/PreviewStateSummary'
        transitions:
          type: array
          description: >-
            Specifies the list of transitions available from the current state.
            Each transition contains the display name, unique ID,
            prop_name,is_connected_end.
          items:
            $ref: '#/components/schemas/PreviewTransitionSummary'
          maxItems: 1
      required:
        - state
        - transitions
      title: Preview Executable Info
    KioskPreviewDetails:
      type: object
      additionalProperties: false
      description: >-
        Represents the preview screen for a kiosk state, including executable
        information, prior states, elements, data, layout width, screen title,
        and button alignment.
      properties:
        executable_info:
          $ref: '#/components/schemas/PreviewExecutableInfo'
        data:
          $ref: '#/components/schemas/PreviewDataSet'
        elements:
          type: array
          description: Contains the list of elements rendered on the kiosk preview screen.
          items:
            oneOf:
              - $ref: '#/components/schemas/PreviewElementDataBlock'
              - $ref: '#/components/schemas/PreviewFieldElement'
            description: >-
              Represents one element rendered on the kiosk preview screen, such
              as a record retrieval block or a form field.
          maxItems: 2
        width:
          type: string
