  /settings/kiosks/{kioskId}/executions:
    get:
      summary: List kiosk executions
      description: >
        To retrieve all active executions for a specific kiosk in your Zoho CRM
        organization. For each execution, the response includes the user who ran
        the kiosk, the execution start and end times, the current or most
        recently visited state, and the transition available to execute next.
        Multiple concurrent executions, such as those initiated by different
        users, are also returned.


        The kiosk must be in published status and have at least one active
        execution for the request to return results. An execution is considered
        complete only when the user navigates through all screens and closes the
        kiosk on the final screen; completed executions are excluded from the
        response. Executions closed before reaching the final screen remain
        active and continue to appear in the response.
      x-zs-llm-description: Lists all executed states and identifies the next actionable state.
      operationId: getKioskExecutions
      parameters:
        - $ref: '#/components/parameters/KioskIdPathParams'
        - $ref: '#/components/parameters/ParamQueryPage'
        - $ref: '#/components/parameters/ParamQueryPerPage'
        - $ref: '#/components/parameters/ParamQueryIncludeInnerDetails'
      responses:
        '200':
          description: >-
            Returns a list of active kiosk execution records for the specified
            kiosk, along with pagination details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KioskExecutionsListResponse'
              examples:
                Success200:
                  summary: Successful response with a list of active kiosk executions
                  value:
                    kiosk_executions:
                      - Kiosk_End_Time: '2025-12-09T10:54:52+05:30'
                        Owner:
                          name: Dylan Vasquez
                          id: '2296900000000471001'
