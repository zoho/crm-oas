openapi: 3.1.0
info:
  title: Kiosks Execute
  description: >-
    Kiosks are interactive, screen-based flows in Zoho CRM that guide users
    through structured processes such as record lookups, data entry, and
    decision-driven workflows. This API enables developers to execute, test run,
    and preview kiosks, as well as retrieve execution records and advance an
    active kiosk execution from one state to the next.
  version: '8'
servers:
  - url: https://zohoapis.{dc}/crm/{version}
    description: API Server URL
    variables:
      dc:
        description: API Server URL TLD
        default: com
        enum:
          - com
          - eu
          - in
          - cn
          - au
          - ca
          - jp
      version:
        description: API Version
        default: v8
paths:
  /settings/kiosks/{kioskId}/actions/test_run:
    post:
      summary: Initiate a Test Run for a Kiosk
      description: >
        To initiate a test run for a kiosk before publishing it in your Zoho CRM
        organization.

        This operation executes all configured kiosk states and actions on live
        CRM data in real time. Actions such as creating, updating, or deleting
        records and sending email notifications are performed immediately and
        cannot be automatically reversed.

        The response returns the first state of the kiosk. To advance through
        the remaining states, use the [Update Kiosk Execution
        API](kiosk_execute.yaml#$.paths./settings/kiosks/{kioskId}/executions/{executionId}/actions/execute.put)
        with the execution details returned in the response.

        Retrieve the kiosk ID using the [Get Kiosks
        API](kiosks.yaml#$.paths./settings/kiosks.get) before calling this
        endpoint.

        Administrator profile, or a profile with the Module Customization or
        Manage Automation  permission should be enabled.
      operationId: testRunKiosk
      parameters:
        - $ref: '#/components/parameters/KioskIdPathParams'
      requestBody:
        description: The request body must contain a kiosk_test_run array with one object.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KioskTestRunPayload'
            examples:
              SamplePostRequest:
                summary: Initiates a kiosk test run with a current record ID
                value:
                  kiosk_test_run:
                    - data:
                        Current_Record:
                          id: '2296900000010790475'
                description: >-
                  This example submits a kiosk test run request containing a
                  single entry in the kiosk_test_run array, identifying the
                  current CRM record by its unique ID. The request initiates the
                  test run flow and returns the first executable kiosk state.
            x-zs-llm-examples:
              - SamplePostRequest
      responses:
        '200':
          description: >-
            Returns a kiosk_test_run array containing the result of the test run
            initiation, including the status code, a descriptive message, the
            execution record ID, the next executable state, and any dependent
            states executed during the run.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KioskTestRunSuccessResponse'
              examples:
                Success200:
                  summary: >-
                    Successful test run response with next executable state and
                    dependent states
                  value:
                    kiosk_test_run:
                      - code: SUCCESS
                        details:
                          next_executable_state:
                            name: Screen 1
                            id: '2296900000011322140'
                          executed_dependent_states: null
                          id: '2296900000011324489'
                        message: Kiosk test run started successfully
                        status: success
                  description: >
                    This example represents a successful kiosk test run response
                    in which the API confirms the run has started and identifies
                    the next executable state along with any dependent states
                    traversed during initiation.
          headers:
            X-API-CREDITS-REMAINING:
              schema:
                type: string
                format: int64
                description: >
                  Present when >=50% of base daily credits (excluding add-on
                  credits) are consumed. Value is total remaining credits
                  including add-on credits for the rolling 24-hour window.
              required: false
        '400':
          description: >
            **No such Kiosk exists.**


            **Resolution:** Specify a valid kiosk ID in the request path.
            Retrieve valid kiosk IDs using the [Get Kiosks
            API](kiosks.yaml#$.paths./settings/kiosks.get) .


            **invalid data.**


            **Resolution:** Verify that the kiosk_test_run field in the request
            body is a valid array within the maximum length permitted.
          content:
            application/json:
              schema:
                description: >-
                  Represents one of two error shapes returned when the request
                  is invalid: an invalid kiosk identifier error, which includes
                  a resource path index in the details, or an invalid data error
                  for the kiosk_test_run field, which includes the field name,
                  maximum length, and JSON path in the details.
                oneOf:
                  - $ref: '#/components/schemas/KioskTestRunInvalidKioskError'
                  - $ref: '#/components/schemas/KioskTestRunInvalidDataTypeError'
                x-zs-$id: PosttestrunError400
              examples:
                InvalidDataResponse1:
                  summary: INVALID_DATA error when the specified kiosk does not exist
                  value:
                    code: INVALID_DATA
                    details:
                      resource_path_index: 2
                    message: No such Kiosk exists
                    status: error
                  description: >-
                    This example illustrates a 400 error response returned when
                    the specified kiosk ID in the request path does not
                    correspond to an existing kiosk. The details object
                    identifies the offending path parameter via its resource
                    path index.
                InvalidDataResponse2:
                  summary: >-
                    INVALID_DATA error when kiosk_test_run field fails a maximum
                    length validation
                  value:
                    code: INVALID_DATA
                    details:
                      maximum_length: 1
                      api_name: kiosk_test_run
                      json_path: $.kiosk_test_run
                    message: invalid data
                    status: error
                  description: >-
                    This example illustrates a 400 error response returned when
                    the kiosk_test_run field in the request body contains a
                    value that violates a maximum length constraint. The details
                    object provides the api_name of the offending field and a
                    json_path indicating its location within the payload.
          headers:
            X-API-CREDITS-REMAINING:
              schema:
                type: string
                format: int64
                description: >
                  Present when >=50% of base daily credits (excluding add-on
                  credits) are consumed. Value is total remaining credits
                  including add-on credits for the rolling 24-hour window.
              required: false
      security:
        - OAuth2:
            - ZohoCRM.settings.kiosks.CREATE
