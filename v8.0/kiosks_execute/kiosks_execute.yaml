  /settings/kiosks/{kioskId}/executions/{executionId}:
    get:
      summary: Retrieve a kiosk execution record
      description: >-
        To retrieve the details of a specific kiosk execution in your Zoho CRM
        organization. The response includes all elements and metadata for the
        state currently being executed, along with the owner of the execution,
        the execution start and end times, the current or most recently executed
        state, and the transition that can be executed next. The kiosk must be
        in published status and have at least one active execution. Available in
        Standard, Professional, Enterprise, and Ultimate editions.
      operationId: getKioskExecution
      parameters:
        - $ref: '#/components/parameters/KioskIdPathParams'
        - $ref: '#/components/parameters/ExecutionIdPathParams'
        - $ref: '#/components/parameters/ParamQueryIncludeInnerDetails'
        - $ref: '#/components/parameters/ParamQueryNavigatedFromBack'
      responses:
