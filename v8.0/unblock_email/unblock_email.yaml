                              segment in the request path that triggered the
                              error.
                            format: int32
                    required:
                      - status
                      - code
                      - message
                      - details
                  - type: object
                    x-zs-$id: UnblockEmailByModuleDataError3
                    description: >-
                      Represents an error response returned when the request
                      fails due to invalid data, a missing mandatory field, or
                      an invalid module name.
                    additionalProperties: false
                    properties:
                      status:
                        type: string
                        description: >-
                          Represents the response status indicating an error
                          occurred.
                        enum:
                          - error
                      code:
                        type: string
                        description: |
                          Represents the error code returned by the server.

                          Possible values:

                          **INVALID_DATA** - The request contains invalid data.

                          **INVALID_MODULE** - The specified module name is not
                          valid.

                          **MANDATORY_NOT_FOUND** - A required field is missing
                          from the request body.
                        enum:
                          - INVALID_DATA
                          - INVALID_MODULE
                          - MANDATORY_NOT_FOUND
                      message:
                        type: string
                        description: >-
                          Represents the error message describing the validation
                          or data issue encountered by the server.
                        maxLength: 500
                      details:
                        oneOf:
                          - type: object
                            x-zs-$id: UnblockEmailByModuleDataErrorWithType4
                            description: >-
                              Contains the expected data type, API name, and
                              JSON path of the field that caused the validation
                              error.
                            additionalProperties: false
                            properties:
                              expected_data_type:
                                type: string
                                description: >-
                                  Represents the data type expected by the
