components:
  parameters:
    Module:
      name: module
      in: path
      description: >-
        Represents the module API name. Use the [Get Modules
        API](modules.yaml#$.paths./settings/modules.get) to get valid values. 
      required: true
      schema:
        type: string
        enum:
          - Leads
    Id:
      name: id
      in: path
      description: >-
        Represents the unique ID of the record. Use the [Get Records
        API](record.yaml#$.paths./{module}.get) to get valid values.
      required: true
      schema:
        type: string
        maxLength: 50
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://accounts.zoho.com/oauth/v2/auth
          tokenUrl: https://accounts.zoho.com/oauth/v2/token
          refreshUrl: https://accounts.zoho.com/oauth/v2/token
          scopes:
            ZohoCRM.modules.leads.UPDATE: Update access to Leads module
            ZohoCRM.modules.accounts.UPDATE: Update access to Accounts module
            ZohoCRM.modules.contacts.UPDATE: Update access to Contacts module
            ZohoCRM.modules.deals.UPDATE: Update access to Deals module
            ZohoCRM.modules.quotes.UPDATE: Update access to Quotes module
            ZohoCRM.modules.salesorders.UPDATE: Update access to Sales Orders module
            ZohoCRM.modules.purchaseorders.UPDATE: Update access to Purchase Orders module
            ZohoCRM.modules.custom.UPDATE: Update access to Custom modules
            ZohoCRM.modules.cases.UPDATE: Update access to Cases module
