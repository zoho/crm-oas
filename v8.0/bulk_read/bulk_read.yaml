openapi: 3.1.0
info:
  title: Bulk Read
  description: >-
    The Zoho CRM Bulk Read API allows you to export large volumes of CRM records
    asynchronously. Create a bulk read job to specify the module and filter
    criteria, then download the exported data as a CSV or ICS file once the job
    is complete.
  version: '8'
servers:
  - url: https://zohoapis.{dc}/crm/bulk/{version}
    description: >-
      The base URL for the Zoho CRM Bulk Read API. The server URL varies by data
      center and API version.
    variables:
      dc:
        enum:
          - com
          - eu
          - in
          - cn
          - au
          - jp
          - ca
        default: com
        description: |-
          Specify the domain extension for your Zoho CRM data center.
          Possible values:
          **com** - United States data center (default).
          **eu** - European Union data center.
          **in** - India data center.
          **cn** - China data center.
          **au** - Australia data center.
          **jp** - Japan data center.
          **ca** - Canada data center.
      version:
        description: Specify the API version to use. Defaults to v8.
        default: v8
paths:
  /read:
    post:
      operationId: createBulkReadJob
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                callback:
                  type: object
                  properties:
                    url:
                      type: string
                      format: uri
                      description: >-
                        Specify a valid URL that accepts HTTP POST requests to
                        receive the bulk read job completion notification.
                    method:
                      type: string
                      enum:
                        - post
                      description: >-
                        Specify the HTTP method for the callback request.

                        Possible values:

                        **post** - Sends the callback notification as an HTTP
                        POST request.
                  required:
                    - url
                    - method
                  description: >-
                    Specify the callback configuration to receive a POST
                    notification when the bulk read job completes or fails.
                  additionalProperties: false
                query:
                  type: object
                  properties:
                    module:
                      type: object
                      properties:
                        api_name:
                          type: string
                          description: >-
                            Specify the API name of the CRM module to export
                            records from.
                          maxLength: 255
                      required:
                        - api_name
                      description: >-
                        Specify the CRM module from which to export records.
                        Refer to the [Get
                        Modules](modules.json#$.paths./settings/modules.get)
                        resource for valid values.
                      additionalProperties: false
                    cvid:
                      type:
                        - string
                        - 'null'
                      description: >-
                        Represents the unique ID of the Custom View to filter
                        records for the bulk read job. Refer to the [Get Custom
                        Views](custom_views.json#$.paths./settings/custom_views.get)
                        resource for valid values.
                      maxLength: 100
                    fields:
                      type: array
                      items:
                        type: string
                        description: >-
                          Specify the API name of a field to include in the
                          exported records.
                        maxLength: 500
                      description: >-
                        Specify the list of field API names to include in the
                        exported records. Refer to the [Get
                        Fields](fields.json#$.paths./settings/fields.get)
                        resource for valid values. **Note:** If exporting Events
                        as an **ICS file**, do not include this key.
                      maxItems: 1000
                    page:
                      type:
                        - integer
                        - 'null'
                      format: int32
                      description: >-
                        Specify the page number of records to export in the bulk
                        read job. The default value is **1** and means that the
                        first **200,000** records matching your query will get
                        exported. If you want to fetch the records from the
                        range **200,001 to 400,000**, then mention the value as
                        **'2'.**
                    criteria:
                      type: object
                      properties:
                        group_operator:
                          type: string
                          enum:
                            - or
                            - and
                          description: >-
                            Specify the logical operator to combine the filter
                            conditions in the **group** array.

                            Possible values:

                            **and** - All conditions must be satisfied.

                            **or** - At least one condition must be satisfied.
                        group:
                          type: array
                          items:
                            type: object
                            properties:
                              field:
                                type: object
                                properties:
                                  api_name:
                                    type: string
                                    description: >-
                                      Specify the API name of the field to use
                                      in the filter condition.
                                    maxLength: 255
                                required:
                                  - api_name
                                description: >-
                                  Specify the field to apply the filter
                                  condition on. Refer to the [Get
                                  Fields](fields.json#$.paths./settings/fields.get)
                                  resource for valid values.
                                additionalProperties: false
                              value:
                                type: string
                                description: >-
                                  Specify the value to compare the field against
                                  in this filter condition.
                                maxLength: 500
                              type:
                                type: string
                                enum:
                                  - value
                                description: >-
                                  Specify the type of the filter condition.

                                  Possible values:

                                  **value** - Compares the field against a
                                  static value.
                              comparator:
                                type: string
                                enum:
                                  - equal
                                  - contains
                                  - ends_with
                                  - not_contains
                                  - not_equal
                                  - starts_with
                                description: >-
                                  Specify the comparison operator to apply
                                  between the field and value in this filter
                                  condition.

                                  Possible values:

                                  **equal** - Records where the field value
                                  exactly matches the specified value.

                                  **not_equal** - Records where the field value
                                  does not match the specified value.

                                  **contains** - Records where the field value
                                  contains the specified value.

                                  **not_contains** - Records where the field
                                  value does not contain the specified value.

                                  **starts_with** - Records where the field
                                  value starts with the specified value.

                                  **ends_with** - Records where the field value
                                  ends with the specified value.
                            required:
                              - field
                              - value
                              - comparator
                            description: >-
                              Specify a filter condition object that defines a
                              single criterion for filtering records in the bulk
                              read export.
                            additionalProperties: false
                          description: >-
                            Specify the list of filter conditions to apply to
                            the bulk read export. Each condition must include a
                            **field**, **value**, and **comparator**.
                          maxItems: 1000
                      required:
                        - group_operator
                        - group
                      description: >-
                        Specify the filter criteria to narrow down the records
                        exported in the bulk read job.
                      additionalProperties: false
                  required:
                    - module
                  description: >-
                    Specify the query parameters for the bulk read job,
                    including the target module, optional field selection,
                    optional Custom View, and optional filter criteria.
                  additionalProperties: false
                file_type:
                  type: string
                  enum:
                    - csv
                    - ics
                  description: >-
                    Specify the file format for the exported records.

                    Possible values:

                    **csv** - Exports records in CSV format.

                    **ics** - Exports records in ICS format, applicable only
                    when exporting from the **Events** module.
              required:
                - query
              description: >-
                Represents the request payload used to configure and create a
                bulk read job in Zoho CRM.
              additionalProperties: false
            examples:
              Example1:
                summary: Create bulk read job
                value:
                  query:
                    module:
                      api_name: string
                description: >-
                  A sample request to create a bulk read job for the Contacts
                  module with filter criteria.
        required: true
        description: >-
          The JSON request body used to configure and create a bulk read job in
          Zoho CRM.
      responses:
        '201':
          description: >-
            The bulk read job was successfully created. The response includes
            the job ID and initial state.
          content:
            application/json:
              schema:
                type: object
                x-zs-$id: CreatebulkreadjobResponse201
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        status:
                          type: string
                          enum:
                            - success
                          description: >-
                            Represents the status of the job creation request. 

                            Possible values:

                            **success** - Zoho CRM created the bulk read job
                            successfully.
                        code:
                          type: string
                          enum:
                            - ADDED_SUCCESSFULLY
                          description: >-
                            Represents the status code for the job creation
                            result.

                            Possible values:

                            **ADDED_SUCCESSFULLY** - Zoho CRM created the bulk
                            read job successfully. 
                        message:
                          type: string
                          enum:
                            - Added successfully.
                          description: >-
                            Represents the result message for the job creation. 

                            Possible values:

                            **Added successfully.** - Zoho CRM created the bulk
                            read job successfully.
                        details:
                          type: object
                          properties:
                            id:
                              type: string
                              description: >-
                                Represents the unique ID of the created bulk
                                read job. 
                              maxLength: 100
                              x-zs-$id: BulkReadJobId
                            operation:
                              type: string
                              description: >-
                                Represents the type of bulk operation
                                performed. 

                                Possible values:

                                **read** - Indicates a bulk read (export)
                                operation.
                              maxLength: 500
                              enum:
                                - read
                            state:
                              type: string
                              enum:
                                - COMPLETED
                                - ADDED
                                - IN PROGRESS
                                - FAILURE
                              description: >-
                                Represents the current state of the bulk read
                                job. 

                                Possible values:

                                **ADDED** - The job has been accepted and is
                                queued for processing.

                                **IN PROGRESS** - The job is currently being
                                processed.

                                **COMPLETED** - The job has finished processing
                                successfully.

                                **FAILURE** - The job encountered an error
                                during processing.
                            created_by:
                              type: object
                              properties:
                                id:
                                  type: string
                                  description: >-
                                    Represents the unique ID of the user who
                                    created the bulk read job. 
                                  maxLength: 100
                                name:
                                  type: string
                                  description: >-
                                    Represents the name of the user who created
                                    the bulk read job.
                                  maxLength: 256
                              required:
                                - id
                              description: >-
                                Represents the user who created the bulk read
                                job. Refer to the [Get
                                Users](users.json#$.paths./users.get) endpoint
                                for details. 
                              additionalProperties: false
                            created_time:
                              type: string
                              format: date-time
                              description: >-
                                Represents the date and time when Zoho CRM
                                created the bulk read job. 
                          required:
                            - id
                            - operation
                            - state
                            - created_by
                            - created_time
                          description: >-
                            Represents the details of the newly created bulk
                            read job. 
                          additionalProperties: false
                      required:
                        - status
                        - code
                        - message
                        - details
                      description: Represents a single job creation result object.
                      additionalProperties: false
                    description: 'Represents the list of job creation result objects. '
                    maxItems: 1000
                  info:
                    type: object
                    description: >-
                      Represents additional metadata about the bulk read job
                      creation response. 
                    additionalProperties: false
                required:
                  - data
                  - info
                description: >-
                  Represents the response returned when a bulk read job is
                  successfully created.
                additionalProperties: false
              examples:
                Example1:
                  summary: Bulk read job created
                  value:
                    data:
                      - status: success
                        code: ADDED_SUCCESSFULLY
                        message: Added successfully.
                        details:
                          id: string
                          operation: read
                          state: COMPLETED
                          created_by:
                            id: string
                          created_time: '2023-01-01T00:00:00Z'
                    info: {}
                  description: >-
                    A sample response confirming that the bulk read job was
                    successfully created, including the assigned job ID and
                    initial state.
        '400':
          description: >-
            The request to create the bulk read job failed due to client-side
            validation errors.
          content:
            application/json:
              schema:
                x-zs-$id: CreatebulkreadjobResponse400
                description: >-
                  Represents the error response returned when the bulk read job
                  creation request fails due to client-side validation errors.
                oneOf:
                  - type: object
                    x-zs-$id: CreatebulkreadjobResponse1
                    properties:
                      code:
                        type: string
                        enum:
                          - REQUEST_BODY_NOT_SUPPORTED
                        description: >-
                          Represents the error code indicating that the request
                          body format is not supported. 

                          Possible values:

                          **REQUEST_BODY_NOT_SUPPORTED** - The request body
                          structure does not conform to the expected format.
                      details:
                        type: object
                        description: 'Represents additional details about the error. '
                        additionalProperties: false
                      message:
                        type: string
                        description: 'Represents the error message describing the issue. '
                        maxLength: 1000
                      status:
                        type: string
                        enum:
                          - error
                        description: |-
                          Represents the status of the API request. 
                          Possible values:
                          **error** - Indicates that the request failed.
                    required:
                      - code
                      - details
                      - message
                      - status
                    description: >-
                      Error response returned when the request body format is
                      not supported.
                    additionalProperties: false
                  - type: object
                    x-zs-$id: CreatebulkreadjobResponse2
                    properties:
                      code:
                        type: string
                        enum:
                          - FIELD_COMPARATOR_IN_CRITERIA_NOT_SUPPORTED
                          - COMPARATOR_AND_VALUE_IN_CRITERIA_NOT_COMPATIBLE
                        description: >-
                          Represents the error code indicating a criteria
                          comparator incompatibility issue. 

                          Possible values:

                          **FIELD_COMPARATOR_IN_CRITERIA_NOT_SUPPORTED** - The
                          comparator used for the specified field is not
                          supported in the filter criteria.

                          **COMPARATOR_AND_VALUE_IN_CRITERIA_NOT_COMPATIBLE** -
                          The comparator and value combination used in the
                          filter criteria is not compatible.
                      details:
                        oneOf:
                          - type: object
                            x-zs-$id: CreatebulkreadjobResponseDetails1
                            properties:
                              api_name:
                                type: string
                                description: >-
                                  Represents the API name of the field
                                  associated with the criteria error. 
                                maxLength: 255
                              comparator:
                                type: string
                                description: >-
                                  Represents the comparator used in the criteria
                                  filter where the incompatibility was
                                  detected. 
                                maxLength: 500
                              type:
                                type: string
                                description: >-
                                  Represents the data type of the field
                                  associated with the criteria error. 
                                maxLength: 500
                              value:
                                oneOf:
                                  - type: object
                                    x-zs-$id: >-
                                      CreatebulkreadjobResponseDetails1ObjectValue
                                    description: >-
                                      Represents a criteria field value of type
                                      object.
                                    additionalProperties: false
                                  - type: string
                                    x-zs-$id: >-
                                      CreatebulkreadjobResponseDetails1StringValue
                                    description: >-
                                      Represents a criteria field value of type
                                      string.
                                    maxLength: 500
                                  - type: array
                                    x-zs-$id: >-
                                      CreatebulkreadjobResponseDetails1ArrayValue
                                    description: >-
                                      Represents a criteria field value of type
                                      array.
                                    items:
                                      description: >-
                                        Represents an individual value in the
                                        criteria array.
                                    maxItems: 1000
                                  - type: boolean
                                    x-zs-$id: >-
                                      CreatebulkreadjobResponseDetails2BooleanValue
                                    description: >-
                                      Represents a criteria field value of type
                                      Boolean.
                                  - type: number
                                    x-zs-$id: >-
                                      CreatebulkreadjobResponseDetails1NumberValue
                                    description: >-
                                      Represents a criteria field value of type
                                      number.
                                description: >-
                                  Represents the value used in the criteria
                                  filter. 
                            required:
                              - api_name
                              - comparator
                              - type
                              - value
                            description: >-
                              Error details including the field API name,
                              comparator, type, and value involved in the
                              incompatibility.
                            additionalProperties: false
                          - type: object
                            x-zs-$id: CreatebulkreadjobResponseDetails2
                            properties:
                              comparator:
                                type: string
                                description: >-
                                  Represents the comparator used in the criteria
                                  filter where the incompatibility was
                                  detected. 
                                maxLength: 500
                              type:
                                type: string
                                description: >-
                                  Represents the data type of the field
                                  associated with the criteria error. 
                                maxLength: 500
                              value:
                                oneOf:
                                  - type: object
                                    x-zs-$id: >-
                                      CreatebulkreadjobResponseDetails2ObjectValue
                                    description: >-
                                      Represents a criteria field value of type
                                      object.
                                    additionalProperties: false
                                    properties:
                                      name:
                                        type: string
                                        description: >-
                                          Represents the name of the lookup value
                                          used in the criteria filter.
                                        maxLength: 25
                                  - type: string
                                    x-zs-$id: >-
                                      CreatebulkreadjobResponseDetails2StringValue
                                    description: >-
                                      Represents a criteria field value of type
                                      string.
                                    maxLength: 500
                                  - type: array
                                    x-zs-$id: >-
                                      CreatebulkreadjobResponseDetails2ArrayValue
                                    description: >-
                                      Represents a criteria field value of type
                                      array.
                                    items:
                                      description: >-
                                        Represents an individual value in the
                                        criteria array.
                                    maxItems: 1000
                                  - type: boolean
                                    x-zs-$id: >-
                                      CreatebulkreadjobResponseDetails1BooleanValue
                                    description: >-
                                      Represents a criteria field value of type
                                      Boolean.
                                  - type: number
                                    x-zs-$id: >-
                                      CreatebulkreadjobResponseDetails2NumberValue
                                    description: >-
                                      Represents a criteria field value of type
                                      number.
                                description: >-
                                  Represents the value used in the criteria
                                  filter. 
                            required:
                              - comparator
                              - type
                              - value
                            description: >-
                              Error details including the comparator, type, and
                              value involved in the incompatibility.
                            additionalProperties: false
                          - type: object
                            x-zs-$id: CreatebulkreadjobResponseDetails3
                            properties:
                              api_name:
                                type: string
                                description: >-
                                  Represents the API name of the field
                                  associated with the criteria error. 
                                maxLength: 255
                              comparator:
                                type: string
                                description: >-
                                  Represents the comparator used in the criteria
                                  filter where the incompatibility was detected.
                                maxLength: 500
                              type:
                                type: string
                                description: >-
                                  Represents the data type of the field
                                  associated with the criteria error.
                                maxLength: 500
                              value:
                                type: object
                                description: >-
                                  Represents the value used in the criteria
                                  filter.
                                additionalProperties: false
                              field:
                                type: object
                                properties:
                                  api_name:
                                    type: string
                                    description: Represents the API name of the field.
                                    maxLength: 255
                                description: >-
                                  Represents the field associated with the
                                  criteria error. 
                                additionalProperties: false
                            required:
                              - api_name
                              - field
                            description: >-
                              Error details including the field API name,
                              comparator, type, and value with a field
                              reference.
                            additionalProperties: false
                          - type: object
                            x-zs-$id: CreatebulkreadjobResponseDetails4
                            properties:
                              api_name:
                                type: string
                                description: >-
                                  Represents the API name of the field for which
                                  the comparator is not supported. 
                                maxLength: 255
                              supported:
                                type: array
                                items:
                                  type: string
                                  description: >-
                                    Represents a supported option for the
                                    specified field.
                                  maxLength: 500
                                description: >-
                                  Represents the list of supported options for
                                  the specified field. 
                                maxItems: 1000
                            required:
                              - api_name
                              - supported
                            description: >-
                              Error details including the field API name and
                              list of supported options.
                            additionalProperties: false
                        description: >-
                          Represents additional details about the criteria
                          incompatibility error. 
                      message:
                        type: string
                        description: >-
                          Represents the error message describing the criteria
                          incompatibility issue. 
                        maxLength: 1000
                      status:
                        type: string
                        enum:
                          - error
                        description: |-
                          Represents the status of the API request. 
                          Possible values:
                          **error** - Indicates that the request failed.
                    required:
                      - code
                      - details
                      - message
                      - status
                    description: >-
                      Error response returned when a comparator used in the
                      filter criteria is not supported or is incompatible with
                      the field value.
                    additionalProperties: false
                  - type: object
                    x-zs-$id: CreatebulkreadjobResponse3
                    properties:
                      code:
                        type: string
                        enum:
                          - AMBIGUOUS_CRITERIA
                          - AMBIGUOUS_GROUP_IN_CRITERIA
                        description: >-
                          Represents the error code indicating ambiguity in the
                          filter criteria.

                          Possible values:

                          **AMBIGUOUS_CRITERIA** - The filter criteria is
                          ambiguous and cannot be processed.

                          **AMBIGUOUS_GROUP_IN_CRITERIA** - A criteria group is
                          ambiguous and cannot be processed.
                      details:
                        oneOf:
                          - type: object
                            x-zs-$id: CreatebulkreadjobResponseDetailsAPIName
                            properties:
                              api_name:
                                type: string
                                description: >-
                                  Represents the API name of the field
                                  associated with the ambiguous criteria.
                                maxLength: 500
                            description: >-
                              Error details including the API name of the
                              ambiguous field.
                            additionalProperties: false
                          - type: object
                            x-zs-$id: CreatebulkreadjobResponseDetails5
                            properties:
                              comparator:
                                type: string
                                description: >-
                                  Represents the comparator used in the
                                  ambiguous criteria filter.
                                maxLength: 500
                              type:
                                type: string
                                description: >-
                                  Indicates the data type of the field
                                  associated with the ambiguous criteria.
                                maxLength: 500
                              value:
                                type: object
                                description: >-
                                  Specifies the value used in the ambiguous
                                  criteria filter.
                                additionalProperties: false
                              field:
                                type: object
                                properties:
                                  api_name:
                                    type: string
                                    description: Represents the API name of the field.
                                    maxLength: 255
                                description: >-
                                  Indicates the field associated with the
                                  ambiguous criteria.
                                additionalProperties: false
                            description: >-
                              Error details including the comparator, type,
                              value, and field associated with the ambiguous
                              criteria.
                            additionalProperties: false
                          - type: object
                            x-zs-$id: CreatebulkreadjobResponseDetailsComp1
                            properties:
                              api_name:
                                type: string
                                description: >-
                                  Represents the API name of the field with
                                  ambiguous criteria. 
                                maxLength: 255
                              type:
                                type: string
                                description: >-
                                  The data type of the field with ambiguous
                                  criteria. 
                                maxLength: 500
                              comparator:
                                type: string
                                description: >-
                                  Represents the comparator used in the
                                  ambiguous criteria filter. 
                                maxLength: 25
                            required:
                              - api_name
                              - type
                              - comparator
                            description: >-
                              Error details including the field API name, type,
                              and comparator.
                            additionalProperties: false
                          - type: object
                            x-zs-$id: CreatebulkreadjobResponseDetailsComp
                            properties:
                              api_name:
                                type: string
                                description: >-
                                  Represents the API name of the field
                                  associated with the ambiguous criteria. 
                                maxLength: 255
                              type:
                                type: string
                                description: >-
                                  Specifies the data type of the field with
                                  ambiguous criteria. 
                                maxLength: 500
                              value:
                                oneOf:
                                  - type: object
                                    x-zs-$id: >-
                                      CreatebulkreadjobResponseDetailsCompObjectValue
                                    description: >-
                                      Represents a criteria field value of type
                                      object.
                                    additionalProperties: false
                                  - type: string
                                    x-zs-$id: >-
                                      CreatebulkreadjobResponseDetailsCompStringValue
                                    description: >-
                                      Represents a criteria field value of type
                                      string.
                                    maxLength: 500
                                description: >-
                                  Represents the value associated with the
                                  ambiguous criteria.
                            required:
                              - api_name
                              - type
                            description: >-
                              Error details including the field API name, type,
                              and value.
                            additionalProperties: false
                          - type: object
                            x-zs-$id: CreatebulkreadjobResponseDetails6
                            properties:
                              group:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    api_name:
                                      type: string
                                      description: >-
                                        Represents the API name of the field in
                                        the criterion. 
                                      maxLength: 255
                                    comparator:
                                      type: string
                                      description: >-
                                        Represents the comparator used in the
                                        criterion.
                                      maxLength: 500
                                    type:
                                      type: string
                                      description: >-
                                        Represents the data type of the field in
                                        the criterion. 
                                      maxLength: 500
                                    value:
                                      oneOf:
                                        - type: object
                                          x-zs-$id: >-
                                            CreatebulkreadjobResponseDetails6ObjectValue
                                          description: >-
                                            Represents a criteria field value of
                                            type object.
                                          additionalProperties: false
                                        - type: string
                                          x-zs-$id: >-
