      summary: Create a bulk read job
      description: >-
        To create a bulk read job in Zoho CRM. A bulk read job exports records
        from a specified CRM module to a CSV or ICS file. The job runs
        asynchronously; use the Get Bulk Read Job Details API to monitor the job
        status, and use the Download Bulk Read Result API to retrieve the
        exported file once the job is complete.
      security:
        - OAuth2:
            - ZohoCRM.bulk.READ
            - ZohoCRM.modules.ALL
  /read/{jobId}:
    get:
      operationId: getBulkReadJobDetails
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: The bulk read job details were successfully retrieved.
          content:
            application/json:
              schema:
                type: object
                x-zs-$id: GetbulkreadjobdetailsResponse200
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: >-
                            Represents the unique identifier of the bulk read
                            job. 
                          maxLength: 100
                          x-zs-$id: BulkReadId
                        operation:
                          type: string
                          description: >-
                            Specifies the type of action the API completed.
                            Sample - "operation" : "read”.
                          maxLength: 500
                        state:
                          type: string
                          enum:
                            - COMPLETED
                            - ADDED
                            - QUEUED
                            - IN PROGRESS
                          description: >-
                            Represents the current processing state of the bulk
                            read job. 

                            Possible values:

                            **ADDED** - The job has been created and is awaiting
                            processing.

                            **QUEUED** - The job is queued and scheduled for
                            processing.

                            **IN PROGRESS** - The job is currently being
                            processed.

                            **COMPLETED** - The job has finished processing and
                            the result is available for download.
                        query:
                          type: object
                          properties:
                            module:
                              type: object
                              properties:
                                api_name:
                                  type: string
                                  description: 'Represents the API name of the CRM module. '
                                  maxLength: 255
                                id:
                                  type: string
                                  description: >-
                                    Represents the unique identifier of the CRM
                                    module. 
                                  maxLength: 100
                              required:
                                - api_name
                                - id
                              description: >-
                                Represents the CRM module from which records are
                                exported. 
                              additionalProperties: false
                            cvid:
                              type: string
                              description: >-
                                Represents the unique identifier of the Custom
                                View used to pre-filter the records for the bulk
                                read job.
                              maxLength: 100
                            fields:
                              type: array
                              items:
                                type: string
                                description: >-
                                  Represents the API name of a field included in
                                  the exported data.
                                maxLength: 500
                              description: >-
                                Represents the list of field API names included
                                in the exported data.
                              maxItems: 1000
                            page:
                              type: integer
                              format: int32
                              description: 'Specifies the page number of records to export. '
                            criteria:
                              type: object
                              properties:
                                group_operator:
                                  type: string
                                  enum:
                                    - or
                                    - and
                                  description: >-
                                    Specifies the logical operator used to
                                    combine conditions within the criteria
                                    group. 

                                    Possible values:

                                    **and** - All filter conditions must be
                                    satisfied.

                                    **or** - At least one filter condition must
                                    be satisfied.
                                group:
                                  type: array
                                  items:
                                    type: object
                                    properties:
                                      field:
                                        type: object
                                        properties:
                                          api_name:
                                            type: string
                                            description: >-
                                              Indicates the API name of the filter
                                              field. 
                                            maxLength: 255
                                          id:
                                            type:
                                              - string
                                              - 'null'
                                            description: >-
                                              Represents the unique identifier of the
                                              filter field. 
                                            maxLength: 100
                                        required:
                                          - api_name
                                          - id
                                        description: >-
                                          Represents the field used in the filter
                                          condition. 
                                        additionalProperties: false
                                      id:
                                        type:
                                          - string
                                          - 'null'
                                        description: >-
                                          Represents the position identifier of
                                          the filter condition within the criteria
                                          group. 
                                        maxLength: 100
                                      value:
                                        type: string
                                        description: >-
                                          Represents the value used in the filter
                                          condition. 
                                        maxLength: 500
                                      type:
                                        type: string
                                        enum:
                                          - value
                                        description: >-
                                          Specifies the data type of the filter
                                          field. 
                                      comparator:
                                        type: string
                                        enum:
                                          - equal
                                          - contains
                                          - ends_with
                                          - not_contains
                                          - not_equal
                                          - starts_with
                                        description: >-
                                          Indicates the comparison operator used
                                          in the filter condition. 
                                    required:
                                      - field
                                      - value
                                      - type
                                      - comparator
                                    description: >-
                                      Represents a single filter condition in
                                      the criteria group.
                                    additionalProperties: false
                                  description: >-
                                    Indicates the list of filter conditions
                                    applied to the bulk read query. 
                                  maxItems: 1000
                              required:
                                - group_operator
                                - group
                              description: >-
                                Represents the filter criteria used to narrow
                                the records exported in the bulk read job.
                              additionalProperties: false
                          required:
                            - module
                            - page
                          description: >-
                            Represents the query configuration used to create
                            the bulk read job, including the module, filter
                            criteria, and field selections. 
                          additionalProperties: false
                        created_by:
                          type: object
                          properties:
                            name:
                              type: string
                              description: >-
                                Represents the display name of the user who
                                created the job. 
                              maxLength: 255
                            id:
                              type: string
                              description: >-
                                Represents the unique identifier of the user who
                                created the job. 
                              maxLength: 100
                          required:
                            - name
                            - id
                          description: 'Represents the user who created the bulk read job. '
                          additionalProperties: false
                        created_time:
                          type: string
                          format: date-time
                          description: >-
                            Represents the date and time when Zoho CRM created
                            the bulk read job, in ISO 8601 format. 
                        result:
                          type: object
                          properties:
                            page:
                              type: integer
                              format: int32
                              description: >-
                                Represents the page number of the exported
                                result. 
                            count:
                              type: integer
                              format: int32
                              description: >-
                                Specifies the total number of records exported
                                in the bulk read job. 
                            download_url:
                              type: string
                              description: >-
                                Specifies the URL to download the exported
                                file. 
                              maxLength: 2048
                            per_page:
                              type: integer
                              format: int32
                              description: >-
                                Represents the number of records per page in the
                                exported result. 
                            more_records:
                              type: boolean
                              description: >-
                                Indicates whether additional records are
                                available beyond the current page. 
                            next_page_token:
                              type: string
                              description: >-
                                Represents a token used to retrieve the next
                                page of exported records in subsequent requests.
                              maxLength: 500
                          required:
                            - page
                            - count
                            - download_url
                            - per_page
                            - more_records
                          description: >-
                            specifies the export result details of the bulk read
                            job, including the download URL and pagination
                            information. Present when the job has completed or
                            partially completed.
                          additionalProperties: false
                        file_type:
                          type: string
                          enum:
                            - csv
                          description: |-
                            Indicates the format of the exported file. 
                            Possible values:
                            **csv** - The records are exported in CSV format.
                      required:
                        - id
                        - operation
                        - state
                        - query
                        - created_by
                        - created_time
                        - file_type
                      description: Represents the details of a bulk read job.
                      additionalProperties: false
                    description: >-
                      Represents the list of bulk read job details returned in
                      the response. 
                    maxItems: 1000
                required:
                  - data
                description: >-
                  Represents the response returned when the bulk read job
                  details are successfully retrieved.
                additionalProperties: false
              examples:
                Example1:
                  summary: Bulk read job details
                  value:
                    data:
                      - id: string
                        operation: string
                        state: COMPLETED
                        query:
                          module:
                            api_name: string
                            id: string
                          page: 0
                        created_by:
                          name: string
                          id: string
                        created_time: '2023-01-01T00:00:00Z'
                        file_type: csv
                  description: >-
                    A sample response showing the details of a completed bulk
                    read job, including the download URL and result summary.
        '404':
          description: The specified bulk read job was not found.
          content:
            application/json:
              schema:
                type: object
                x-zs-$id: GetbulkreadjobdetailsResponse404
                properties:
                  code:
                    type: string
                    enum:
                      - RESOURCE_NOT_FOUND
                    description: >-
                      Represents the error code indicating that the requested
                      bulk read job was not found. 

                      Possible values:

                      **RESOURCE_NOT_FOUND** - The bulk read job with the
                      specified ID does not exist.
                  details:
                    type: object
                    properties:
                      resource:
                        type: string
                        description: 'Represents the type of resource that was not found. '
                        maxLength: 500
                    required:
                      - resource
                    description: >-
                      Specifies additional details about the resource not found
                      error. 
                    additionalProperties: false
                  message:
                    type: string
                    description: >-
                      Represents the error message describing the resource not
                      found issue. 
                    maxLength: 1000
                  status:
                    type: string
                    enum:
                      - error
                    description: |-
                      Specifies the status of the API request. 
                      Possible values:
                      **error** - Indicates that the request failed.
                required:
                  - code
                  - details
                  - message
                  - status
                description: >-
                  Indicates the error response returned when the specified bulk
                  read job does not exist.
                additionalProperties: false
              examples:
                Example1:
                  summary: Job not found error
                  value:
                    code: RESOURCE_NOT_FOUND
                    details:
                      resource: string
                    message: string
                    status: error
                  description: >-
                    A sample error response indicating that the specified bulk
                    read job was not found.
      summary: Get bulk read job details
      description: >-
        To retrieve the details of a bulk read job in Zoho CRM. Use this API to
        check the current state of a bulk read job and obtain the download URL
        once the job is complete. Specify the unique job ID that Zoho CRM
        returned when you created the job.
      security:
        - OAuth2:
            - ZohoCRM.bulk.READ
            - ZohoCRM.modules.ALL
  /read/{jobId}/result:
    get:
      operationId: downloadBulkReadResult
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: >-
            The bulk read result file was successfully downloaded as a ZIP
            archive.
          content:
            application/zip:
              schema:
                type: string
                format: binary
                x-zs-$id: DownloadresultResponse200
                description: >-
                  Represents the ZIP archive containing the exported bulk read
                  records.
        '404':
          description: The specified bulk read job or its result was not found.
          content:
            application/json:
              schema:
                type: object
                x-zs-$id: DownloadresultResponse404
                properties:
                  code:
                    type: string
                    enum:
                      - RESOURCE_NOT_FOUND
                    description: >-
                      Represents the error code indicating that the bulk read
                      job result was not found. 

                      Possible values:

                      **RESOURCE_NOT_FOUND** - The bulk read job with the
                      specified ID does not exist or the result is not yet
                      available.
                  details:
                    type: object
                    properties:
                      resource:
                        type: string
                        description: 'Represents the type of resource that was not found. '
                        maxLength: 500
                    required:
                      - resource
                    description: >-
                      Represents additional details about the resource not found
                      error. 
                    additionalProperties: false
                  message:
                    type: string
                    description: >-
                      Represents the error message describing the resource not
                      found issue. 
                    maxLength: 1000
                  status:
                    type: string
                    enum:
                      - error
                    description: |-
                      Represents the status of the API request. 
                      Possible values:
                      **error** - Indicates that the request failed.
                required:
                  - code
                  - details
                  - message
                  - status
                description: >-
                  Represents the error response returned when the specified bulk
                  read job result does not exist.
                additionalProperties: false
              examples:
                Example1:
                  summary: Job result not found error
                  value:
                    code: RESOURCE_NOT_FOUND
                    details:
                      resource: string
                    message: string
                    status: error
                  description: >-
                    A sample error response indicating that the specified bulk
                    read job result was not found.
      summary: Download bulk read result
      description: >-
        To download the exported records from a completed bulk read job in Zoho
        CRM. This API returns a ZIP archive containing the CSV or ICS file with
        the exported records. The bulk read job must have a COMPLETED state
        before you can download the result.
      security:
        - OAuth2:
            - ZohoCRM.bulk.READ
            - ZohoCRM.modules.ALL
components:
  parameters:
    JobId:
      name: jobId
      in: path
      required: true
      description: Specify the unique identifier of the bulk read job.
      schema:
        type: string
        maxLength: 100
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://accounts.zoho.com/oauth/v2/auth
          tokenUrl: https://accounts.zoho.com/oauth/v2/token
          refreshUrl: https://accounts.zoho.com/oauth/v2/token
          scopes:
            ZohoCRM.bulk.READ: Grants read-only access to bulk read operations in Zoho CRM.
            ZohoCRM.modules.ALL: >-
              Grants full access to all CRM module data, including read, write,
              and delete operations.
